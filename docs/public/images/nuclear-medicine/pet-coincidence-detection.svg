<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>PET 符合探测原理</title>
<desc>正电子发射体发出的正电子与电子湮灭，产生一对方向相反的 511 keV 光子，被探测器环两侧的探测器在纳秒时间窗内同时接收，构成一次符合事件。</desc>
<rect x="0" y="0" width="600" height="380" fill="#faf9f5"/>
<text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">PET 符合探测原理</text>

<!-- left detector -->
<rect x="25" y="70" width="80" height="240" rx="14" fill="#1f6f8b" opacity="0.9"/>
<text x="65" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">探测器</text>
<text x="65" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">A（环）</text>

<!-- right detector -->
<rect x="495" y="70" width="80" height="240" rx="14" fill="#1f6f8b" opacity="0.9"/>
<text x="535" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">探测器</text>
<text x="535" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">B（环）</text>

<!-- patient / source -->
<circle cx="300" cy="190" r="40" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="300" cy="190" r="7" fill="#c0392b"/>
<text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">人体 / 病灶</text>

<!-- positron path (short red arrow) -->
<path d="M 307 190 q 10 -12 12 -26" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrR)"/>
<text x="342" y="156" font-family="sans-serif" font-size="14" fill="#c0392b">正电子 β+</text>

<!-- annihilation point -->
<circle cx="320" cy="162" r="4" fill="#c0392b"/>
<text x="352" y="136" font-family="sans-serif" font-size="14" fill="#c0392b">湮灭点</text>

<!-- photon pair to detectors -->
<path d="M 320 162 L 116 188" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrB)"/>
<path d="M 320 162 L 484 188" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrB)"/>
<text x="230" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">511 keV 光子</text>
<text x="390" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">511 keV 光子</text>

<!-- coincidence line -->
<path d="M 320 162 L 116 188 L 484 188 L 320 162" fill="none" stroke="#c0392b" stroke-width="0" />
<path d="M 116 188 L 484 188" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
<text x="300" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">方向相反、能量各 511 keV，两光子相差约 180°</text>
<text x="300" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">在纳秒时间窗内被 A、B 同时接收 → 判定为一次符合事件</text>
<text x="300" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">响应线（LOR）：湮灭点必落在 A、B 之间的连线上，再由反投影重建图像</text>

<defs>
<marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/></marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
</defs>
</svg>
