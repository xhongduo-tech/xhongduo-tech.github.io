<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VIN 十七位结构示意图</title>
  <desc id="desc">车辆识别代号 VIN 由十七位字符组成，分为 WMI（第 1–3 位，世界制造商识别代码）、VDS（第 4–9 位，车辆说明部分）、VIS（第 10–17 位，车辆指示部分）三部分。示例 VIN 为 1HGCM82633A004352。</desc>
  <rect x="0" y="0" width="760" height="300" fill="#faf9f5"/>

  <text x="380" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">VIN 十七位结构：三段区划</text>

  <g font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="30"  y="34" width="38" height="46" fill="#1f6f8b"/><text x="49"  y="64">1</text>
    <rect x="71"  y="34" width="38" height="46" fill="#1f6f8b"/><text x="90"  y="64">H</text>
    <rect x="112" y="34" width="38" height="46" fill="#1f6f8b"/><text x="131" y="64">G</text>
    <rect x="153" y="34" width="38" height="46" fill="#c0392b"/><text x="172" y="64">C</text>
    <rect x="194" y="34" width="38" height="46" fill="#c0392b"/><text x="213" y="64">M</text>
    <rect x="235" y="34" width="38" height="46" fill="#c0392b"/><text x="254" y="64">8</text>
    <rect x="276" y="34" width="38" height="46" fill="#c0392b"/><text x="295" y="64">2</text>
    <rect x="317" y="34" width="38" height="46" fill="#c0392b"/><text x="336" y="64">6</text>
    <rect x="358" y="34" width="38" height="46" fill="#c0392b"/><text x="377" y="64">3</text>
    <rect x="399" y="34" width="38" height="46" fill="#6a6a6a"/><text x="418" y="64">3</text>
    <rect x="440" y="34" width="38" height="46" fill="#6a6a6a"/><text x="459" y="64">A</text>
    <rect x="481" y="34" width="38" height="46" fill="#6a6a6a"/><text x="500" y="64">0</text>
    <rect x="522" y="34" width="38" height="46" fill="#6a6a6a"/><text x="541" y="64">0</text>
    <rect x="563" y="34" width="38" height="46" fill="#6a6a6a"/><text x="582" y="64">4</text>
    <rect x="604" y="34" width="38" height="46" fill="#6a6a6a"/><text x="623" y="64">3</text>
    <rect x="645" y="34" width="38" height="46" fill="#6a6a6a"/><text x="664" y="64">5</text>
    <rect x="686" y="34" width="38" height="46" fill="#6a6a6a"/><text x="705" y="64">2</text>
  </g>

  <g font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">
    <text x="49"  y="95">1</text>
    <text x="90"  y="95">2</text>
    <text x="131" y="95">3</text>
    <text x="172" y="95">4</text>
    <text x="213" y="95">5</text>
    <text x="254" y="95">6</text>
    <text x="295" y="95">7</text>
    <text x="336" y="95">8</text>
    <text x="377" y="95">9</text>
    <text x="418" y="95">10</text>
    <text x="459" y="95">11</text>
    <text x="500" y="95">12</text>
    <text x="541" y="95">13</text>
    <text x="582" y="95">14</text>
    <text x="623" y="95">15</text>
    <text x="664" y="95">16</text>
    <text x="705" y="95">17</text>
  </g>

  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="30" y1="120" x2="150" y2="120"/>
    <line x1="30" y1="116" x2="30" y2="124"/>
    <line x1="150" y1="116" x2="150" y2="124"/>
    <line x1="153" y1="120" x2="396" y2="120"/>
    <line x1="153" y1="116" x2="153" y2="124"/>
    <line x1="396" y1="116" x2="396" y2="124"/>
    <line x1="399" y1="120" x2="724" y2="120"/>
    <line x1="399" y1="116" x2="399" y2="124"/>
    <line x1="724" y1="116" x2="724" y2="124"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <text x="90"  y="145" font-size="15" font-weight="bold" fill="#1f6f8b">WMI · 世界制造商识别代码</text>
    <text x="274" y="145" font-size="15" font-weight="bold" fill="#c0392b">VDS · 车辆说明部分</text>
    <text x="561" y="145" font-size="15" font-weight="bold" fill="#6a6a6a">VIS · 车辆指示部分</text>
    <text x="90"  y="170" font-size="13" fill="#333">生产国家 · 制造商</text>
    <text x="274" y="170" font-size="13" fill="#333">车型 · 车身 · 发动机特征</text>
    <text x="561" y="170" font-size="13" fill="#333">年份 · 装配厂 · 生产序列号</text>
  </g>

  <text x="380" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">第 9 位「3」为校验位；第 10 位「3」表示 2003 年型</text>
  <text x="380" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">VIN 不使用字母 I、O、Q，避免与数字 1、0 混淆</text>
</svg>
