<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>幼儿园一日生活流程图</title>
<desc>从入园到离园的一日环节时间轴：入园—晨间活动—集体教学—户外活动—午餐—午睡—区域活动—离园，动静交替。</desc>
<rect width="760" height="320" fill="#faf9f5"/>
<text x="30" y="40" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">幼儿园一日生活：动静交替的节律</text>
<line x1="40" y1="70" x2="720" y2="70" stroke="#c0392b" stroke-width="3"/>
<g font-family="sans-serif" font-size="14" fill="#333">
  <!-- 入园 -->
  <rect x="40" y="90" width="70" height="60" rx="8" fill="#1f6f8b"/>
  <text x="48" y="112" fill="#fff">入园</text>
  <text x="48" y="132" fill="#fff">接待</text>
  <!-- 晨间活动 -->
  <rect x="125" y="90" width="90" height="60" rx="8" fill="#1f6f8b"/>
  <text x="133" y="112" fill="#fff">晨间</text>
  <text x="133" y="132" fill="#fff">锻炼/区域</text>
  <!-- 集体教学 -->
  <rect x="230" y="90" width="90" height="60" rx="8" fill="#c0392b"/>
  <text x="238" y="112" fill="#fff">集体教学</text>
  <text x="238" y="132" fill="#fff">(短时)</text>
  <!-- 户外活动 -->
  <rect x="335" y="90" width="90" height="60" rx="8" fill="#1f6f8b"/>
  <text x="343" y="112" fill="#fff">户外</text>
  <text x="343" y="132" fill="#fff">体育游戏</text>
  <!-- 午餐 -->
  <rect x="440" y="90" width="70" height="60" rx="8" fill="#c0392b"/>
  <text x="448" y="112" fill="#fff">午餐</text>
  <text x="448" y="132" fill="#fff">+盥洗</text>
  <!-- 午睡 -->
  <rect x="525" y="90" width="70" height="60" rx="8" fill="#1f6f8b"/>
  <text x="533" y="112" fill="#fff">午睡</text>
  <!-- 区域活动 -->
  <rect x="610" y="90" width="90" height="60" rx="8" fill="#c0392b"/>
  <text x="618" y="112" fill="#fff">区域/</text>
  <text x="618" y="132" fill="#fff">游戏活动</text>
  <!-- 离园 -->
  <rect x="715" y="90" width="0" height="60" rx="8" fill="#1f6f8b"/>
  <text x="652" y="200" fill="#333" font-size="13">→ 离园（整理、谈话、接待）</text>
</g>
<g font-family="sans-serif" font-size="13" fill="#333">
  <rect x="40" y="210" width="24" height="16" rx="3" fill="#1f6f8b"/>
  <text x="72" y="223">动（活动 / 运动 / 游戏）</text>
  <rect x="230" y="210" width="24" height="16" rx="3" fill="#c0392b"/>
  <text x="262" y="223">静（集中注意 / 生活照护 / 休息）</text>
</g>
<g font-family="sans-serif" font-size="13" fill="#333">
  <text x="40" y="258">组织要点：</text>
  <text x="40" y="280">· 稳定作息 + 适度弹性，尊重个体差异</text>
  <text x="40" y="300">· 减少消极等待，过渡环节游戏化</text>
  <text x="400" y="280">· 生活环节即课程（保教结合）</text>
  <text x="400" y="300">· 一日生活皆教育，处处有发展</text>
</g>
</svg>
