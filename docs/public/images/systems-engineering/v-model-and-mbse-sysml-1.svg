<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>V 模型示意图</title>
  <desc>V 模型左翼自顶向下完成利益相关者需求、系统需求、体系结构、组件设计直至单元实现，右翼自底向上完成单元测试、组件集成测试、系统验证与确认验收，左右两翼同高度互为镜像。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="120" y="30" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">需求与设计（分解）</text>
  <text x="520" y="30" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">集成与验证</text>
  <polyline points="80,60 320,340 560,60" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <g font-size="14" fill="#333" text-anchor="middle">
    <g>
      <rect x="5" y="42" width="150" height="36" rx="6" fill="#e7f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
      <text x="80" y="65">利益相关者需求</text>
    </g>
    <g>
      <rect x="65" y="112" width="150" height="36" rx="6" fill="#e7f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
      <text x="140" y="135">系统需求分析</text>
    </g>
    <g>
      <rect x="125" y="182" width="150" height="36" rx="6" fill="#e7f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
      <text x="200" y="205">体系结构设计</text>
    </g>
    <g>
      <rect x="185" y="252" width="150" height="36" rx="6" fill="#e7f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
      <text x="260" y="275">组件/分系统设计</text>
    </g>
    <g>
      <rect x="245" y="322" width="150" height="36" rx="6" fill="#f0ead8" stroke="#333" stroke-width="1.5"/>
      <text x="320" y="345">单元实现</text>
    </g>
    <g>
      <rect x="305" y="252" width="150" height="36" rx="6" fill="#f6e8e6" stroke="#c0392b" stroke-width="1.5"/>
      <text x="380" y="275">单元测试</text>
    </g>
    <g>
      <rect x="365" y="182" width="150" height="36" rx="6" fill="#f6e8e6" stroke="#c0392b" stroke-width="1.5"/>
      <text x="440" y="205">组件集成测试</text>
    </g>
    <g>
      <rect x="425" y="112" width="150" height="36" rx="6" fill="#f6e8e6" stroke="#c0392b" stroke-width="1.5"/>
      <text x="500" y="135">系统验证</text>
    </g>
    <g>
      <rect x="485" y="42" width="150" height="36" rx="6" fill="#f6e8e6" stroke="#c0392b" stroke-width="1.5"/>
      <text x="560" y="65">确认与验收</text>
    </g>
  </g>
</svg>
