<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" width="100%" height="auto">
  <title>哺乳动物演化的地质时间轴</title>
  <desc>从约 3.2 亿年前合弓纲出现到现今的哺乳动物演化关键事件时间轴，展示盘龙类、兽孔类、犬齿兽类、最早哺乳类、真兽类与后兽类分化及 K-Pg 界线。</desc>
  <rect width="800" height="340" fill="#faf9f5"/>
  <text x="400" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">哺乳动物演化关键事件时间轴</text>

  <!-- 时间轴线 -->
  <line x1="10" y1="120" x2="790" y2="120" stroke="#333" stroke-width="2"/>
  <text x="6" y="112" font-family="sans-serif" font-size="13" fill="#333" text-anchor="start">3.2亿年前</text>
  <text x="794" y="112" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">现今</text>

  <!-- 事件标记与标签 -->
  <circle cx="25" cy="120" r="4" fill="#c0392b"/>
  <text x="25" y="78" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">盘龙类出现</text>
  <text x="25" y="93" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约3.10亿年前</text>

  <circle cx="125" cy="120" r="4" fill="#c0392b"/>
  <text x="125" y="138" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">兽孔类兴起</text>
  <text x="125" y="153" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约2.70亿年前</text>

  <circle cx="175" cy="120" r="4" fill="#c0392b"/>
  <text x="175" y="78" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">犬齿兽类</text>
  <text x="175" y="93" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约2.50亿年前</text>

  <circle cx="287.5" cy="120" r="4" fill="#c0392b"/>
  <text x="287.5" y="138" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">最早哺乳类·摩根兽</text>
  <text x="287.5" y="153" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约2.05亿年前</text>

  <circle cx="400" cy="120" r="4" fill="#c0392b"/>
  <text x="400" y="78" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">真兽类分化</text>
  <text x="400" y="93" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约1.60亿年前</text>

  <circle cx="487.5" cy="120" r="4" fill="#c0392b"/>
  <text x="487.5" y="138" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">后兽类分化</text>
  <text x="487.5" y="153" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约1.25亿年前</text>

  <line x1="635" y1="112" x2="635" y2="128" stroke="#c0392b" stroke-width="2"/>
  <text x="635" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">K-Pg 界线</text>
  <text x="635" y="93" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">6600万年前</text>

  <circle cx="662.5" cy="120" r="4" fill="#c0392b"/>
  <text x="662.5" y="138" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">哺乳类大辐射</text>
  <text x="662.5" y="153" font-family="sans-serif" font-size="12" fill="#1f6f8b" text-anchor="middle">约5500万年前</text>

  <!-- 地质年代色带 -->
  <rect x="0" y="200" width="52.5" height="36" fill="#e8dcc8"/>
  <text x="26" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">石炭纪(晚)</text>

  <rect x="52.5" y="200" width="117.5" height="36" fill="#d9c6a8"/>
  <text x="111" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">二叠纪</text>

  <rect x="170" y="200" width="127.5" height="36" fill="#cfe0d0"/>
  <text x="234" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">三叠纪</text>

  <rect x="297.5" y="200" width="140" height="36" fill="#bfd6c0"/>
  <text x="367" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">侏罗纪</text>

  <rect x="437.5" y="200" width="197.5" height="36" fill="#c3d5e2"/>
  <text x="536" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">白垩纪</text>

  <rect x="635" y="200" width="107.5" height="36" fill="#d9cbe0"/>
  <text x="689" y="223" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">古近纪</text>

  <rect x="742.5" y="200" width="51" height="36" fill="#f0d3c8"/>
  <text x="768" y="223" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">新近纪</text>

  <rect x="793.5" y="200" width="6.5" height="36" fill="#e5e0d8"/>
  <text x="797" y="240" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">第<br/>四<br/>纪</text>

  <text x="400" y="270" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">红色标记为哺乳类谱系关键事件，下方色带为地质年代（古生代晚期—新生代）</text>

  <text x="400" y="300" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">合弓纲于石炭纪晚期与蜥形纲分道；白垩纪末（K-Pg）非鸟恐龙灭绝后哺乳类开始大辐射</text>
</svg>
