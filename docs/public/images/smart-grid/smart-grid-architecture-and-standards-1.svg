<svg viewBox="0 0 860 620" width="860" height="620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>智能电网四层架构与双向数据流</title>
<desc>纵向四层：电力层、传感量测层、通信层、应用层；横向箭头表示向上的量测流与向下的控制流，两侧标注发输配用四个环节。</desc>
<rect x="0" y="0" width="860" height="620" fill="#faf9f5" />
<text x="430" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">智能电网四层架构与双向数据流</text>

<!-- 电力层 -->
<rect x="60" y="480" width="460" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<text x="80" y="510" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">电力层 Power Layer（躯体）</text>
<text x="80" y="545" font-family="sans-serif" font-size="15" fill="#333">发电、输电、配电、用电：变压器、开关、线路、负荷</text>
<text x="80" y="572" font-family="sans-serif" font-size="15" fill="#333">物理能量单向或双向流动的载体</text>

<!-- 传感量测层 -->
<rect x="60" y="360" width="460" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<text x="80" y="390" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">传感量测层 Sensing（感官）</text>
<text x="80" y="425" font-family="sans-serif" font-size="15" fill="#333">智能电表、PMU、状态监测、架空线路传感器</text>

<!-- 通信层 -->
<rect x="60" y="240" width="460" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<text x="80" y="270" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">通信层 Communication（神经）</text>
<text x="80" y="305" font-family="sans-serif" font-size="15" fill="#333">光纤、无线、电力线载波组成的通信网络</text>

<!-- 应用层 -->
<rect x="60" y="120" width="460" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<text x="80" y="150" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">应用层 Application / IT（大脑）</text>
<text x="80" y="185" font-family="sans-serif" font-size="15" fill="#333">SCADA、EMS、DMS、MDMS、停电管理等系统</text>

<!-- 向上的量测流 -->
<polygon points="620,470 596,500 596,478 596,120 596,140 620,110" fill="none" stroke="#c0392b" stroke-width="4" />
<polygon points="626,455 596,505 590,500 620,455" fill="#c0392b" />
<text x="700" y="300" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0392b">量测流（向上）</text>
<text x="700" y="330" font-family="sans-serif" font-size="14" fill="#333">感知数据送往应用层分析</text>

<!-- 向下的控制流 -->
<polygon points="540,120 564,90 564,112 564,478 564,460 540,490" fill="none" stroke="#1f6f8b" stroke-width="4" />
<polygon points="534,135 564,85 570,90 540,135" fill="#1f6f8b" />
<text x="700" y="380" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">控制流（向下）</text>
<text x="700" y="410" font-family="sans-serif" font-size="14" fill="#333">决策指令送回可控设备执行</text>

<!-- 左侧环节标注 -->
<text x="30" y="150" font-family="sans-serif" font-size="15" fill="#666" text-anchor="middle">发</text>
<text x="30" y="240" font-family="sans-serif" font-size="15" fill="#666" text-anchor="middle">输</text>
<text x="30" y="360" font-family="sans-serif" font-size="15" fill="#666" text-anchor="middle">配</text>
<text x="30" y="490" font-family="sans-serif" font-size="15" fill="#666" text-anchor="middle">用</text>
</svg>
