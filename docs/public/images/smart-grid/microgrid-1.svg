<svg viewBox="0 0 860 600" width="860" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>微电网结构：并网与孤岛两种运行模式</title>
<desc>大电网通过公共连接点 PCC 与微电网相连；微电网内含光伏、风电、储能、中央控制器与各类负荷，并网时 PQ 控制，孤岛时储能撑起电压频率。</desc>
<rect x="0" y="0" width="860" height="600" fill="#faf9f5" />
<text x="430" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">微电网结构：并网与孤岛两种运行模式</text>

<!-- 大电网 -->
<rect x="30" y="240" width="170" height="130" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<text x="115" y="272" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b" text-anchor="middle">大电网</text>
<text x="115" y="305" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">电压频率由</text>
<text x="115" y="325" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">大电网罩着</text>

<!-- PCC -->
<rect x="225" y="280" width="70" height="50" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" />
<text x="260" y="305" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">PCC</text>
<text x="260" y="323" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">并网开关</text>

<!-- 微电网边界 -->
<rect x="330" y="70" width="500" height="480" rx="12" fill="#fbf6ec" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,5" />
<text x="350" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">微电网（单一可控实体）</text>

<!-- 光伏 -->
<rect x="360" y="130" width="130" height="90" rx="6" fill="#fff" stroke="#333" />
<text x="425" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">光伏</text>
<text x="425" y="182" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">PQ 控制</text>
<text x="425" y="202" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">出力随光而变</text>

<!-- 风电 -->
<rect x="360" y="245" width="130" height="90" rx="6" fill="#fff" stroke="#333" />
<text x="425" y="273" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">风电</text>
<text x="425" y="297" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">PQ 控制</text>

<!-- 储能 -->
<rect x="360" y="360" width="130" height="90" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" />
<text x="425" y="388" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">储能 BESS</text>
<text x="425" y="412" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">孤岛时 V/f 控制</text>
<text x="425" y="432" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">撑起电压频率</text>

<!-- MGCC -->
<rect x="560" y="130" width="150" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="2" />
<text x="635" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">中央控制器 MGCC</text>
<text x="635" y="182" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">并网/孤岛决策</text>
<text x="635" y="202" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">黑启动、功率分配</text>

<!-- 负荷 -->
<rect x="560" y="245" width="150" height="90" rx="6" fill="#fff" stroke="#333" />
<text x="635" y="273" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">负荷</text>
<text x="635" y="297" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">重要负荷优先保障</text>
<text x="635" y="317" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">可调/可切负荷</text>

<!-- 母线 -->
<line x1="510" y1="290" x2="540" y2="290" stroke="#333" stroke-width="3" />
<line x1="510" y1="175" x2="540" y2="175" stroke="#333" stroke-width="2" />
<line x1="510" y1="405" x2="540" y2="405" stroke="#333" stroke-width="2" />
<line x1="510" y1="175" x2="510" y2="405" stroke="#333" stroke-width="3" />
<text x="500" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">母线</text>

<!-- PCC 连线 -->
<line x1="200" y1="305" x2="225" y2="305" stroke="#333" stroke-width="3" />
<line x1="295" y1="305" x2="330" y2="305" stroke="#333" stroke-width="3" />

<!-- 模式标注 -->
<text x="260" y="380" font-family="sans-serif" font-size="13" fill="#666">并网运行：PCC 闭合，储能 PQ 控制</text>
<text x="260" y="400" font-family="sans-serif" font-size="13" fill="#666">孤岛运行：PCC 断开，储能 V/f 控制</text>

<!-- 底部 -->
<text x="430" y="580" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">虚线为微电网边界；PCC 处的并网开关决定「并网 / 孤岛」两种身份</text>
</svg>
