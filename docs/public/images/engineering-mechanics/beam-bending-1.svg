<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-labelledby="title desc">
  <title>简支梁受均布载荷的剪力与弯矩图</title>
  <desc>上图：受均布载荷 w 的简支梁；中图：剪力图（线性从 Vmax 降到 -Vmax）；下图：弯矩图（抛物线，跨中最大）。</desc>
  <rect x="0" y="0" width="640" height="600" fill="#faf9f5"/>
  <!-- ============ top: beam ============ -->
  <text x="20" y="36" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">① 受均布载荷 w 的简支梁</text>
  <line x1="80" y1="120" x2="560" y2="120" stroke="#333" stroke-width="5"/>
  <line x1="80" y1="120" x2="80" y2="140" stroke="#333" stroke-width="3"/>
  <line x1="80" y1="120" x2="80" y2="140" stroke="#333" stroke-width="3"/>
  <polygon points="80,120 74,140 86,140" fill="#333"/>
  <polygon points="560,120 552,132 560,144 568,132" fill="none" stroke="#333" stroke-width="3"/>
  <text x="70" y="160" font-family="sans-serif" font-size="14" fill="#333">A</text>
  <text x="566" y="160" font-family="sans-serif" font-size="14" fill="#333">B</text>
  <!-- distributed load arrows -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="120" y1="120" x2="120" y2="92"/>
    <line x1="200" y1="120" x2="200" y2="92"/>
    <line x1="280" y1="120" x2="280" y2="92"/>
    <line x1="360" y1="120" x2="360" y2="92"/>
    <line x1="440" y1="120" x2="440" y2="92"/>
    <line x1="520" y1="120" x2="520" y2="92"/>
  </g>
  <line x1="110" y1="92" x2="530" y2="92" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="78" font-family="sans-serif" font-size="15" fill="#c0392b">w</text>
  <line x1="300" y1="120" x2="300" y2="180" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="308" y="176" font-family="sans-serif" font-size="14" fill="#1f6f8b">L/2</text>
  <!-- ============ middle: V diagram ============ -->
  <text x="20" y="220" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">② 剪力图 V(x)</text>
  <line x1="80" y1="270" x2="560" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="230" x2="80" y2="310" stroke="#333" stroke-width="2"/>
  <polygon points="80,234 74,244 80,254 86,244" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="52" y="244" font-family="sans-serif" font-size="14" fill="#1f6f8b">+Vmax</text>
  <line x1="80" y1="270" x2="320" y2="270" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="320" y1="270" x2="560" y2="270" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="560,270 560,286 536,270" fill="#1f6f8b"/>
  <polygon points="80,270 104,270 80,254" fill="#1f6f8b"/>
  <text x="512" y="300" font-family="sans-serif" font-size="14" fill="#1f6f8b">-Vmax</text>
  <!-- ============ bottom: M diagram ============ -->
  <text x="20" y="350" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">③ 弯矩图 M(x)</text>
  <line x1="80" y1="470" x2="560" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="390" x2="80" y2="510" stroke="#333" stroke-width="2"/>
  <path d="M 80 470 Q 320 385 560 470" fill="none" stroke="#c0392b" stroke-width="4"/>
  <line x1="320" y1="470" x2="320" y2="410" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="330" y="404" font-family="sans-serif" font-size="15" fill="#c0392b">Mmax = wL²/8</text>
  <text x="12" y="492" font-family="sans-serif" font-size="14" fill="#666">x</text>
  <text x="640" y="494" font-family="sans-serif" font-size="14" fill="#666">x</text>
  <text x="240" y="540" font-family="sans-serif" font-size="14" fill="#666">V = 0 处，M 取极大</text>
</svg>
