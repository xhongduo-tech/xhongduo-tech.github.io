<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="title desc">
  <title>平面应力状态的 Mohr 圆</title>
  <desc>Mohr 圆：圆心在平均正应力 σavg，半径为 R，与 σ 轴交于主应力 σ1、σ2；圆上一点代表一个方向的截面。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="60" y1="220" x2="600" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="320" y1="40" x2="320" y2="400" stroke="#333" stroke-width="2"/>
  <text x="588" y="244" font-family="sans-serif" font-size="16" fill="#333">σ</text>
  <text x="334" y="58" font-family="sans-serif" font-size="16" fill="#333">τ</text>
  <!-- circle -->
  <circle cx="320" cy="220" r="140" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- horizontal diameter -->
  <line x1="320" y1="220" x2="460" y2="220" stroke="#999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="180" y1="220" x2="320" y2="220" stroke="#999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- radius to a point -->
  <line x1="320" y1="220" x2="420" y2="300" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="320" y1="220" x2="420" y2="300" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="420" cy="300" r="5" fill="#c0392b"/>
  <!-- principal points -->
  <circle cx="460" cy="220" r="5" fill="#1f6f8b"/>
  <circle cx="180" cy="220" r="5" fill="#1f6f8b"/>
  <!-- angle arc -->
  <path d="M 366 220 A 46 46 0 0 1 353 255" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="246" font-family="sans-serif" font-size="14" fill="#333">2θ</text>
  <!-- labels -->
  <text x="456" y="208" font-family="sans-serif" font-size="15" fill="#1f6f8b">σ1</text>
  <text x="158" y="208" font-family="sans-serif" font-size="15" fill="#1f6f8b">σ2</text>
  <text x="286" y="208" font-family="sans-serif" font-size="15" fill="#666">σavg</text>
  <text x="428" y="322" font-family="sans-serif" font-size="15" fill="#c0392b">(σx, τxy)</text>
  <text x="210" y="140" font-family="sans-serif" font-size="15" fill="#666">R</text>
  <text x="470" y="350" font-family="sans-serif" font-size="14" fill="#666">圆上一点 = 一个方向的截面</text>
  <text x="470" y="372" font-family="sans-serif" font-size="14" fill="#666">主应力 = 圆与 σ 轴的交点</text>
  <text x="470" y="394" font-family="sans-serif" font-size="14" fill="#666">最大剪应力 = 半径 R</text>
</svg>
