<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="title desc">
  <title>低碳钢拉伸应力-应变曲线</title>
  <desc>应力-应变曲线示意图，标注弹性阶段、屈服点、应变硬化、抗拉强度与颈缩断裂四阶段。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="70" y1="400" x2="610" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="400" x2="70" y2="40" stroke="#333" stroke-width="2"/>
  <text x="600" y="424" font-family="sans-serif" font-size="16" fill="#333">应变 ε</text>
  <text x="30" y="60" font-family="sans-serif" font-size="16" fill="#333">应力 σ</text>
  <text x="80" y="424" font-family="sans-serif" font-size="14" fill="#666">O</text>
  <!-- elastic region -->
  <line x1="70" y1="400" x2="180" y2="260" stroke="#1f6f8b" stroke-width="4"/>
  <!-- yield plateau -->
  <line x1="180" y1="260" x2="180" y2="250" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="180" y1="250" x2="270" y2="252" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="270" y1="252" x2="272" y2="244" stroke="#1f6f8b" stroke-width="4"/>
  <!-- strain hardening -->
  <path d="M 272 244 C 380 150, 430 110, 452 88" stroke="#1f6f8b" stroke-width="4" fill="none"/>
  <!-- necking and fracture -->
  <path d="M 452 88 C 462 82, 476 96, 488 108" stroke="#c0392b" stroke-width="4" fill="none"/>
  <!-- dashed guide at ultimate -->
  <line x1="452" y1="88" x2="452" y2="400" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="70" y1="88" x2="452" y2="88" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="70" y1="250" x2="272" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="70" y1="400" x2="70" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="4 5"/>
  <!-- labels -->
  <text x="110" y="245" font-family="sans-serif" font-size="15" fill="#1f6f8b">① 弹性阶段</text>
  <text x="196" y="238" font-family="sans-serif" font-size="15" fill="#1f6f8b">② 屈服</text>
  <text x="300" y="120" font-family="sans-serif" font-size="15" fill="#1f6f8b">③ 应变硬化</text>
  <text x="472" y="102" font-family="sans-serif" font-size="15" fill="#c0392b">④ 颈缩断裂</text>
  <text x="464" y="80" font-family="sans-serif" font-size="15" fill="#c0392b">σu</text>
  <text x="104" y="78" font-family="sans-serif" font-size="15" fill="#666">σY</text>
  <text x="460" y="414" font-family="sans-serif" font-size="14" fill="#666">εu</text>
</svg>
