<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="sans-serif">
  <title>量子隧穿：势垒与波函数衰减</title>
  <desc>入射波在矩形势垒内指数衰减，穿出后仍保持向右传播，形成透射波。</desc>
  <rect width="600" height="380" fill="#faf9f5"/>

  <!-- axes -->
  <line x1="60" y1="300" x2="560" y2="300" stroke="#333" stroke-width="2"/>
  <text x="555" y="320" font-size="14" fill="#333">x</text>

  <!-- barrier region -->
  <rect x="230" y="90" width="180" height="210" fill="#e8e2d5" stroke="#333" stroke-width="2"/>
  <text x="270" y="120" font-size="15" fill="#333">势垒 V₀</text>

  <!-- baseline / potential zero -->
  <line x1="60" y1="300" x2="560" y2="300" stroke="#333" stroke-width="2"/>
  <text x="75" y="310" font-size="14" fill="#333">0</text>
  <text x="220" y="318" font-size="14" fill="#333">0</text>
  <text x="415" y="318" font-size="14" fill="#333">a</text>

  <!-- incident wave -->
  <path d="M60,300 Q90,285 120,300 Q150,315 180,300 Q210,285 228,300" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="70" y="205" font-size="14" fill="#1f6f8b">入射波（能量 E &lt; V₀）</text>

  <!-- decaying wave inside barrier -->
  <path d="M230,300 Q255,268 280,252 Q305,238 330,230 Q360,220 385,224 Q405,228 410,240 Q411,244 412,248" stroke="#c0392b" stroke-width="3" fill="none"/>

  <!-- transmitted wave -->
  <path d="M412,300 Q430,285 460,300 Q490,315 520,300 Q550,285 558,298" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="420" y="260" font-size="14" fill="#c0392b">透射波（振幅 e^(-κa) 倍）</text>

  <text x="60" y="70" font-size="14" fill="#333">波函数在势垒内指数衰减，仍有非零透射</text>
  <text x="60" y="365" font-size="13" fill="#666">经典粒子在此被反射；量子粒子以概率 T ≈ e^(-2κa) 穿过</text>
</svg>
