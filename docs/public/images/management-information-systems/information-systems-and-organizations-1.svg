<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <title>组织—技术—管理三维度框架</title>
  <desc>管理信息系统的三维度框架：组织、技术、管理三股力量交汇于中央的信息系统。</desc>
  <rect x="0" y="0" width="460" height="360" fill="#faf9f5"/>
  <polygon points="230,60 60,300 400,300" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="230" cy="200" r="52" fill="#1f6f8b" opacity="0.16"/>
  <circle cx="230" cy="200" r="52" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="230" y="194" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">信息系统</text>
  <text x="230" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">IS</text>
  <text x="230" y="46" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#c0392b">组织</text>
  <text x="230" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">层级 · 职权 · 流程 · 文化</text>
  <text x="54" y="330" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#c0392b">技术</text>
  <text x="54" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">硬件 · 软件 · 数据 · 网络</text>
  <text x="406" y="330" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#c0392b">管理</text>
  <text x="406" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">决策 · 协调 · 控制 · 规划</text>
  <line x1="230" y1="150" x2="230" y2="112" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="202" y1="238" x2="128" y2="292" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="258" y1="238" x2="332" y2="292" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
