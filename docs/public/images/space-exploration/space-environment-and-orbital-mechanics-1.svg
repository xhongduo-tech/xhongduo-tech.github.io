<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="sans-serif">
<title>霍曼转移轨道示意图</title>
<desc>从低地球轨道沿双切椭圆转移到地球同步轨道：近地点与远地点各一次点火。</desc>
<rect x="0" y="0" width="600" height="400" fill="#faf9f5"/>
<circle cx="200" cy="200" r="30" fill="#1f6f8b"/>
<text x="200" y="205" text-anchor="middle" font-size="13" fill="#fff">地球</text>
<circle cx="200" cy="200" r="60" fill="none" stroke="#333" stroke-dasharray="6 5" stroke-width="1.5"/>
<text x="258" y="142" font-size="13" fill="#333">近地轨道 LEO（r=6600 km）</text>
<circle cx="200" cy="200" r="160" fill="none" stroke="#333" stroke-dasharray="6 5" stroke-width="1.5"/>
<text x="366" y="46" font-size="13" fill="#333">地球同步轨道 GEO（r=42200 km）</text>
<path d="M 140 200 A 110 98 0 0 1 360 200" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="215" y="118" font-size="13" fill="#c0392b">转移椭圆（半长轴 a≈24400 km）</text>
<circle cx="140" cy="200" r="5" fill="#c0392b"/>
<text x="30" y="235" font-size="13" fill="#333">① 近地点点火 Δv₁：由圆轨道加速进入椭圆</text>
<circle cx="360" cy="200" r="5" fill="#c0392b"/>
<text x="378" y="235" font-size="13" fill="#333">② 远地点点火 Δv₂：由椭圆加速进入同步圆</text>
</svg>
