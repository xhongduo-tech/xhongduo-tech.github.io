<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
<title>月球原位资源利用（ISRU）工艺流程</title>
<desc>从极区水冰与月壤两条原料线，经过开采、净化和化学转化，产出氧气、氢与金属。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<text x="20" y="40" font-size="15" fill="#333"><tspan font-weight="bold">原料线一 · 极区水冰</tspan> → 电解制氧与推进剂</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="95" y="90" text-anchor="middle" font-size="13" fill="#333">月球南极</text>
<text x="95" y="110" text-anchor="middle" font-size="13" fill="#333">极区水冰矿</text>
<line x1="170" y1="95" x2="195" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="195" y="60" width="150" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="270" y="90" text-anchor="middle" font-size="13" fill="#333">钻采与</text>
<text x="270" y="110" text-anchor="middle" font-size="13" fill="#333">输运</text>
<line x1="345" y1="95" x2="370" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="370" y="60" width="150" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="445" y="90" text-anchor="middle" font-size="13" fill="#333">融化 · 净化</text>
<text x="445" y="110" text-anchor="middle" font-size="13" fill="#333">（除盐去尘）</text>
<line x1="520" y1="95" x2="545" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="545" y="60" width="80" height="70" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="585" y="90" text-anchor="middle" font-size="13" fill="#333">电解</text>
<text x="585" y="110" text-anchor="middle" font-size="13" fill="#333">H₂O</text>
<line x1="585" y1="60" x2="585" y2="30" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arw)"/>
<text x="620" y="34" font-size="13" fill="#c0392b">O₂ 呼吸/氧化剂</text>
<line x1="585" y1="130" x2="585" y2="180" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arw)"/>
<text x="620" y="178" font-size="13" fill="#c0392b">H₂ 推进剂</text>
<text x="20" y="245" font-size="15" fill="#333"><tspan font-weight="bold">原料线二 · 月壤</tspan> → 还原制氧与金属</text>
<rect x="20" y="270" width="150" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="95" y="300" text-anchor="middle" font-size="13" fill="#333">月壤</text>
<text x="95" y="320" text-anchor="middle" font-size="13" fill="#333">（玄武岩颗粒）</text>
<line x1="170" y1="305" x2="195" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="195" y="270" width="170" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="280" y="300" text-anchor="middle" font-size="13" fill="#333">高温还原</text>
<text x="280" y="320" text-anchor="middle" font-size="13" fill="#333">（氢还原 / 熔融电解）</text>
<line x1="365" y1="305" x2="390" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="390" y="270" width="220" height="70" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="500" y="300" text-anchor="middle" font-size="13" fill="#c0392b">产出 O₂ + 金属（铁、硅等）</text>
<text x="500" y="320" text-anchor="middle" font-size="13" fill="#333">矿渣可用于月面建材</text>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
</marker>
</defs>
</svg>
