<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" width="640" height="430" font-family="sans-serif">
  <title>concolic 路径探索：符号化取反</title>
  <desc>一条已走路径的分支条件序列，通过对第 3 个分支取反生成相邻新路径，并给出新路径条件交由 SMT 求解。</desc>
  <rect x="0" y="0" width="640" height="430" fill="#faf9f5"/>
  <text x="30" y="40" font-size="16" fill="#333" font-weight="bold">第 r 次执行：已走路径</text>
  <rect x="60" y="70" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="80" y="90" font-size="13" fill="#333">c₁: x&gt;0</text>
  <text x="80" y="108" font-size="12" fill="#666">真</text>
  <rect x="160" y="70" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="180" y="90" font-size="13" fill="#333">c₂: y&gt;0</text>
  <text x="180" y="108" font-size="12" fill="#666">真</text>
  <rect x="260" y="70" width="70" height="52" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2"/>
  <text x="280" y="90" font-size="13" fill="#333">c₃: z&lt;10</text>
  <text x="280" y="108" font-size="12" fill="#c0392b">真（取反点）</text>
  <rect x="360" y="70" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="380" y="90" font-size="13" fill="#333">c₄: …</text>
  <text x="380" y="108" font-size="12" fill="#666">真</text>
  <rect x="460" y="70" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="480" y="90" font-size="13" fill="#333">c₅: …</text>
  <text x="480" y="108" font-size="12" fill="#666">真</text>
  <line x1="130" y1="96" x2="160" y2="96" stroke="#333" stroke-width="1.2"/>
  <line x1="230" y1="96" x2="260" y2="96" stroke="#333" stroke-width="1.2"/>
  <line x1="330" y1="96" x2="360" y2="96" stroke="#333" stroke-width="1.2"/>
  <line x1="430" y1="96" x2="460" y2="96" stroke="#333" stroke-width="1.2"/>
  <text x="30" y="180" font-size="16" fill="#333" font-weight="bold">取反第 3 个分支 → 相邻新路径</text>
  <rect x="60" y="210" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="80" y="230" font-size="13" fill="#333">c₁: x&gt;0</text>
  <text x="80" y="248" font-size="12" fill="#666">保持真</text>
  <rect x="160" y="210" width="70" height="52" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="180" y="230" font-size="13" fill="#333">c₂: y&gt;0</text>
  <text x="180" y="248" font-size="12" fill="#666">保持真</text>
  <rect x="260" y="210" width="70" height="52" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
  <text x="280" y="230" font-size="13" fill="#333">¬c₃: z≥10</text>
  <text x="280" y="248" font-size="12" fill="#c0392b">掉头</text>
  <rect x="360" y="210" width="70" height="52" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="380" y="230" font-size="13" fill="#666">c₄': …</text>
  <text x="380" y="248" font-size="11" fill="#666">后续重跑</text>
  <line x1="130" y1="236" x2="160" y2="236" stroke="#333" stroke-width="1.2"/>
  <line x1="230" y1="236" x2="260" y2="236" stroke="#333" stroke-width="1.2"/>
  <line x1="330" y1="236" x2="360" y2="236" stroke="#333" stroke-width="1.2"/>
  <text x="30" y="310" font-size="16" fill="#333" font-weight="bold">新路径条件</text>
  <rect x="30" y="330" width="420" height="70" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="48" y="356" font-size="14" fill="#333">PC' = (x&gt;0) ∧ (y&gt;0) ∧ ¬(z&lt;10)</text>
  <text x="48" y="380" font-size="13" fill="#666">SMT 求解：可满足 → 得到新输入（x,y,z），重跑覆盖新路径</text>
  <rect x="480" y="330" width="130" height="70" rx="6" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="500" y="356" font-size="13" fill="#333">SMT 求解器</text>
  <text x="500" y="378" font-size="12" fill="#666">可满足?</text>
  <text x="500" y="392" font-size="12" fill="#666">→ 新输入</text>
</svg>
