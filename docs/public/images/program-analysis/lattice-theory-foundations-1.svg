<svg viewBox="0 0 520 460" xmlns="http://www.w3.org/2000/svg" width="520" height="460" font-family="sans-serif">
  <title>布尔格的哈斯图</title>
  <desc>展示四个元素 {a,b} 的幂集格：偏序由下往上，并 join 是集合并，交 meet 是集合交，顶元素为全集，底元素为空集。</desc>
  <rect x="0" y="0" width="520" height="460" fill="#faf9f5"/>
  <text x="30" y="40" font-size="16" fill="#333" font-weight="bold">格 L = P({a, b}) 的哈斯图</text>
  <circle cx="260" cy="90" r="30" fill="#eef4f7" stroke="#1f6f8b" stroke-width="2"/>
  <text x="238" y="95" font-size="14" fill="#333">{a,b} = ⊤</text>
  <circle cx="170" cy="200" r="30" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="256" y="205" font-size="14" fill="#333">{a}</text>
  <circle cx="350" cy="200" r="30" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="343" y="205" font-size="14" fill="#333">{b}</text>
  <circle cx="260" cy="310" r="30" fill="#fdf2f2" stroke="#333" stroke-width="1.5"/>
  <text x="251" y="315" font-size="14" fill="#333">∅ = ⊥</text>
  <line x1="260" y1="120" x2="195" y2="172" stroke="#333" stroke-width="1.4"/>
  <line x1="260" y1="120" x2="325" y2="172" stroke="#333" stroke-width="1.4"/>
  <line x1="170" y1="230" x2="240" y2="282" stroke="#333" stroke-width="1.4"/>
  <line x1="350" y1="230" x2="280" y2="282" stroke="#333" stroke-width="1.4"/>
  <text x="120" y="255" font-size="13" fill="#666">a</text>
  <text x="380" y="255" font-size="13" fill="#666">b</text>
  <text x="380" y="120" font-size="13" fill="#1f6f8b">⊔ = 集合并（并）</text>
  <text x="380" y="142" font-size="13" fill="#c0392b">⊓ = 集合交（交）</text>
  <text x="30" y="380" font-size="13" fill="#333">举</text>
  <text x="45" y="380" font-size="13" fill="#333">例：{a} ⊔ {b} = {a,b}（取上界）</text>
  <text x="30" y="404" font-size="13" fill="#333">　　　{a} ⊓ {b} = ∅（取下界）</text>
  <text x="30" y="428" font-size="13" fill="#666">偏序：下小上大，边表示直接覆盖关系</text>
</svg>
