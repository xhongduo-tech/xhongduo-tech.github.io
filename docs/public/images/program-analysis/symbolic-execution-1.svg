<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" width="640" height="460" font-family="sans-serif">
  <title>符号执行树与路径条件</title>
  <desc>展示一个带两次 if 分支的小函数展开成符号执行树，每条路径携带路径条件 PC，最终用 SMT 求解器判定可达性并生成输入。</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <text x="30" y="38" font-size="16" fill="#333" font-weight="bold">符号执行树</text>
  <text x="30" y="62" font-size="13" fill="#666">void f(int x, int y){</text>
  <text x="30" y="82" font-size="13" fill="#666">　if (x &gt; 0) { … } else { … }</text>
  <text x="30" y="102" font-size="13" fill="#666">　if (x + y &lt; 10) { … }</text>
  <text x="30" y="122" font-size="13" fill="#666">}</text>
  <circle cx="320" cy="150" r="24" fill="#eef4f7" stroke="#1f6f8b" stroke-width="2"/>
  <text x="308" y="155" font-size="13" fill="#333">开始</text>
  <text x="322" y="172" font-size="11" fill="#666">PC: true</text>
  <line x1="310" y1="174" x2="230" y2="210" stroke="#333" stroke-width="1.3"/>
  <line x1="330" y1="174" x2="410" y2="210" stroke="#333" stroke-width="1.3"/>
  <circle cx="200" cy="240" r="24" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="188" y="245" font-size="13" fill="#333">x&gt;0</text>
  <text x="145" y="270" font-size="11" fill="#1f6f8b">PC: x&gt;0</text>
  <circle cx="440" cy="240" r="24" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="428" y="245" font-size="13" fill="#333">x≤0</text>
  <text x="430" y="270" font-size="11" fill="#1f6f8b">PC: x≤0</text>
  <line x1="200" y1="264" x2="150" y2="310" stroke="#333" stroke-width="1.3"/>
  <line x1="200" y1="264" x2="250" y2="310" stroke="#333" stroke-width="1.3"/>
  <line x1="440" y1="264" x2="400" y2="310" stroke="#333" stroke-width="1.3"/>
  <line x1="440" y1="264" x2="480" y2="310" stroke="#333" stroke-width="1.3"/>
  <circle cx="120" cy="344" r="24" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="108" y="349" font-size="13" fill="#333">s+y&lt;10</text>
  <circle cx="280" cy="344" r="24" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="268" y="349" font-size="13" fill="#333">s+y≥10</text>
  <circle cx="370" cy="344" r="24" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="358" y="349" font-size="13" fill="#333">s+y&lt;10</text>
  <circle cx="510" cy="344" r="24" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="498" y="349" font-size="13" fill="#333">s+y≥10</text>
  <text x="40" y="400" font-size="13" fill="#333">每片叶子的 PC 交给 SMT 求解器：</text>
  <text x="40" y="424" font-size="13" fill="#333">可满足 → 路径可达，反解出具体输入（测试用例）；不可满足 → 剪枝。</text>
  <rect x="430" y="392" width="180" height="44" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="444" y="414" font-size="13" fill="#333">SMT 求解器</text>
  <text x="444" y="430" font-size="12" fill="#666">可满足？→ 生成输入</text>
</svg>
