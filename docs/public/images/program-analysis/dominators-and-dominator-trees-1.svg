  <line x1="85" y1="200" x2="65" y2="264" stroke="#333" stroke-width="1.4"/>
  <polygon points="62,270 71,263 67,274" fill="#333"/>
  <line x1="115" y1="200" x2="140" y2="264" stroke="#333" stroke-width="1.4"/>
  <polygon points="143,270 134,263 138,274" fill="#333"/>
  <line x1="82" y1="306" x2="95" y2="344" stroke="#333" stroke-width="1.4"/>
  <polygon points="98,350 89,346 95,355" fill="#333"/>
  <line x1="128" y1="306" x2="108" y2="344" stroke="#333" stroke-width="1.4"/>
  <polygon points="104,350 114,346 108,355" fill="#333"/>
  <text x="130" y="90" font-size="12" fill="#666">entry</text>
  <text x="30" y="120" font-size="12" fill="#c0392b">回边（循环）</text>
  <circle cx="430" cy="80" r="26" fill="#eef4f7" stroke="#1f6f8b" stroke-width="2"/>
  <text x="418" y="85" font-size="14" fill="#333">E</text>
  <circle cx="430" cy="180" r="26" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="185" font-size="14" fill="#333">B1</text>
  <circle cx="380" cy="290" r="26" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="363" y="295" font-size="14" fill="#333">B2</text>
  <circle cx="480" cy="290" r="26" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
