<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="sans-serif" font-size="14">
  <title>基态与激发态势能面与垂直跃迁</title>
  <desc>两条抛物线分别代表基态 S0 与激发态 S1 的势能面，箭头表示 Franck-Condon 垂直跃迁。</desc>
  <rect width="480" height="320" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="50" y1="300" x2="460" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="300" x2="50" y2="20" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="318" fill="#333">R（核间距）</text>
  <text x="20" y="30" fill="#333">E（能量）</text>
  <polygon points="460,300 452,296 452,304" fill="#333"/>
  <polygon points="50,20 46,28 54,28" fill="#333"/>
  <!-- ground state parabola S0 -->
  <path d="M 130 320 Q 185 285 240 250 Q 295 285 350 320" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="255" y="272" fill="#1f6f8b">S&#8320;（基态）</text>
  <!-- excited state parabola S1 -->
  <path d="M 175 255 Q 235 175 295 125 Q 355 175 415 255" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="312" y="148" fill="#c0392b">S&#8321;（激发态）</text>
  <!-- vertical transition arrow -->
  <line x1="240" y1="250" x2="240" y2="172" stroke="#333" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#333"/>
    </marker>
  </defs>
  <text x="248" y="215" fill="#333">hν（吸收）</text>
  <text x="128" y="60" fill="#333" font-size="15">Franck-Condon 垂直跃迁</text>
  <text x="116" y="312" fill="#333" font-size="12">核坐标在跃迁瞬间不移动</text>
</svg>
