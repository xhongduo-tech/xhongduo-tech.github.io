<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="sans-serif" font-size="14">
  <title>Jablonski 能级图</title>
  <desc>单重态 S0、S1、S2 与三重态 T1 的能级，以及吸收、内转换、振动弛豫、荧光、系间窜越、磷光等能量去路。</desc>
  <rect width="480" height="320" fill="#faf9f5"/>
  <text x="24" y="30" fill="#333" font-size="15">E（能量）</text>
  <polygon points="50,36 44,44 56,44" fill="#333"/>
  <line x1="50" y1="40" x2="50" y2="300" stroke="#333" stroke-width="1.5"/>

  <!-- S2 electronic -->
  <line x1="80" y1="90" x2="260" y2="90" stroke="#1f6f8b" stroke-width="3"/>
  <text x="72" y="94" fill="#1f6f8b">S&#8322;</text>
  <!-- S1 electronic + vib levels -->
  <line x1="80" y1="160" x2="260" y2="160" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="80" y1="145" x2="260" y2="145" stroke="#1f6f8b" stroke-width="1"/>
  <line x1="80" y1="130" x2="260" y2="130" stroke="#1f6f8b" stroke-width="1"/>
  <text x="72" y="164" fill="#1f6f8b">S&#8321;</text>
  <!-- S0 -->
  <line x1="80" y1="270" x2="440" y2="270" stroke="#333" stroke-width="3"/>
  <text x="72" y="274" fill="#333">S&#8320;</text>

  <!-- T1 -->
  <line x1="290" y1="210" x2="440" y2="210" stroke="#c0392b" stroke-width="3"/>
  <line x1="290" y1="197" x2="440" y2="197" stroke="#c0392b" stroke-width="1"/>
  <text x="452" y="214" fill="#c0392b">T&#8321;</text>

  <!-- absorption arrows -->
  <line x1="120" y1="270" x2="120" y2="132" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="128" y="200" fill="#333" font-size="12">吸收 hν</text>
  <line x1="185" y1="270" x2="185" y2="92" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="193" y="175" fill="#333" font-size="12">吸收（高能）</text>

  <!-- vibrational relaxation squiggle -->
  <path d="M 205 130 l 8 5 l -8 5 l 8 5" fill="none" stroke="#666" stroke-width="1.5"/>
  <text x="226" y="138" fill="#666" font-size="12">振动弛豫</text>

  <!-- internal conversion S2 -> S1 -->
  <path d="M 235 92 l 8 -4 l 8 4 l 8 -4 l 8 4 l 8 -4 l 8 4" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="80" fill="#666" font-size="12">内转换</text>

  <!-- intersystem crossing S1 -> T1 -->
  <path d="M 262 186 l 7 -4 l 7 4 l 7 -4 l 7 4" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="268" y="232" fill="#c0392b" font-size="12">系间窜越</text>

  <!-- fluorescence -->
  <line x1="120" y1="160" x2="120" y2="270" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrf)"/>
  <text x="128" y="252" fill="#1f6f8b" font-size="12">荧光</text>

  <!-- phosphorescence -->
  <line x1="360" y1="210" x2="360" y2="270" stroke="#c0392b" stroke-width="2" marker-end="url(#arrf)"/>
  <text x="368" y="248" fill="#c0392b" font-size="12">磷光</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#333"/>
    </marker>
    <marker id="arrf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#555"/>
    </marker>
  </defs>
</svg>
