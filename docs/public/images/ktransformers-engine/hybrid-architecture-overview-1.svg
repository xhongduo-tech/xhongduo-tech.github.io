<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>ktransformers CPU-GPU 异构推理总体架构</title>
<desc>一次 token 前向传播中，GPU 计算 Attention 与共享专家，CPU 计算被路由选中的稀疏专家，二者通过异步队列流水线协作。</desc>
<rect x="0" y="0" width="760" height="420" fill="#faf9f5"/>
<text x="20" y="30" font-size="15" font-weight="bold" fill="#333">一次 token 前向：GPU 算稠密，CPU 算稀疏（专家 FFN）</text>

<!-- GPU box -->
<rect x="20" y="60" width="340" height="330" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="40" y="88" font-size="14" font-weight="bold" fill="#1f6f8b">GPU（RTX 4090，24GB 显存）</text>

<rect x="40" y="105" width="300" height="46" rx="6" fill="#eef4f6" stroke="#1f6f8b"/>
<text x="52" y="124" font-size="13" font-weight="bold" fill="#333">MLA Attention（稠密，必算）</text>
<text x="52" y="142" font-size="12" fill="#555">每 token 执行 · 高算术强度 · 高带宽</text>

<rect x="40" y="160" width="300" height="46" rx="6" fill="#eef4f6" stroke="#1f6f8b"/>
<text x="52" y="179" font-size="13" font-weight="bold" fill="#333">共享专家（稠密，必算）</text>
<text x="52" y="197" font-size="12" fill="#555">每 token 执行 · 稳定基础能力</text>

<rect x="40" y="215" width="300" height="46" rx="6" fill="#eef4f6" stroke="#1f6f8b"/>
<text x="52" y="234" font-size="13" font-weight="bold" fill="#333">热专家（top-k 高频路由专家）</text>
<text x="52" y="252" font-size="12" fill="#555">幂律分布头部 · 覆盖大多数激活</text>

<rect x="40" y="270" width="300" height="46" rx="6" fill="#eef4f6" stroke="#1f6f8b"/>
<text x="52" y="289" font-size="13" font-weight="bold" fill="#333">KV Cache + 路由网络</text>
<text x="52" y="307" font-size="12" fill="#555">缓存于显存 · 供 MLA 读取</text>

<text x="40" y="342" font-size="12" fill="#777">显存带宽 ≈ 1 TB/s（最贵带宽资源）</text>
<text x="40" y="362" font-size="12" fill="#777">只放高频 / 必算 / 高算术强度部分</text>
<text x="40" y="382" font-size="12" fill="#c0392b">GPU 侧内核：Marlin INT4/INT8 量化 GEMM</text>

<!-- arrow -->
<line x1="366" y1="220" x2="392" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="372" y="205" font-size="12" fill="#333">异步队列</text>

<!-- CPU box -->
<rect x="400" y="60" width="340" height="330" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="420" y="88" font-size="14" font-weight="bold" fill="#c0392b">CPU + DDR5 DRAM（几百 GB）</text>

<rect x="420" y="105" width="300" height="46" rx="6" fill="#faf0ee" stroke="#c0392b"/>
<text x="432" y="124" font-size="13" font-weight="bold" fill="#333">冷专家（低频路由专家）</text>
<text x="432" y="142" font-size="12" fill="#555">INT4/INT8 量化权重常驻 DRAM</text>

<rect x="420" y="160" width="300" height="46" rx="6" fill="#faf0ee" stroke="#c0392b"/>
<text x="432" y="179" font-size="13" font-weight="bold" fill="#333">CPU 侧就地计算（不走 PCIe）</text>
<text x="432" y="197" font-size="12" fill="#555">AMX-BF16 / AVX512 / llamafile 内核</text>

<rect x="420" y="215" width="300" height="46" rx="6" fill="#faf0ee" stroke="#c0392b"/>
<text x="432" y="234" font-size="13" font-weight="bold" fill="#333">被路由命中的冷专家 → 就地 GEMM</text>
<text x="432" y="252" font-size="12" fill="#555">低频调用 · CPU 带宽足以应付</text>

<rect x="420" y="270" width="300" height="46" rx="6" fill="#faf0ee" stroke="#c0392b"/>
<text x="432" y="289" font-size="13" font-weight="bold" fill="#333">多线程任务调度</text>
<text x="432" y="307" font-size="12" fill="#555">与 GPU 计算流水线重叠执行</text>

<text x="420" y="342" font-size="12" fill="#777">DDR5 带宽 ≈ 100–400 GB/s</text>
<text x="420" y="362" font-size="12" fill="#777">放低频 / 稀疏 / 低算术强度部分</text>
<text x="420" y="382" font-size="12" fill="#c0392b">权重体积 ~377GB（4.5-bit），全在 DRAM</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<polygon points="0,0 8,3 0,6" fill="#333"/>
</marker>
</defs>
</svg>
