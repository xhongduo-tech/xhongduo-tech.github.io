<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-labelledby="title desc">
  <title id="title">手机竖屏构图：三分法则示意图</title>
  <desc id="desc">竖屏画面被两条竖线与两条横线分成九宫格，主体放在右上方的交点处，说明三分法则把主体放在网格交点或线上。</desc>
  <rect x="0" y="0" width="360" height="560" fill="#faf9f5"/>
  <rect x="30" y="40" width="300" height="480" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <line x1="130" y1="40" x2="130" y2="520" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="230" y1="40" x2="230" y2="520" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="30" y1="200" x2="330" y2="200" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="30" y1="360" x2="330" y2="360" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="230" cy="200" r="26" fill="none" stroke="#c0392b" stroke-width="4"/>
  <circle cx="230" cy="200" r="7" fill="#c0392b"/>
  <text x="246" y="186" font-family="sans-serif" font-size="15" fill="#c0392b">主体放交点</text>
  <text x="58" y="30" font-family="sans-serif" font-size="16" fill="#333333" font-weight="bold">三分法则（九宫格）</text>
  <text x="52" y="552" font-family="sans-serif" font-size="14" fill="#666666">主体放在竖线与横线的交点上，画面更自然</text>
</svg>
