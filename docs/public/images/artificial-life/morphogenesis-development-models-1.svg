<svg viewBox="0 0 340 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">L-系统生长的分形树</title>
  <desc id="desc">一个 L-系统字符串重写规则迭代三次后涌现出的分形树：每次迭代把枝干替换为分叉结构，形状自相似。</desc>
  <rect x="0" y="0" width="340" height="320" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <text x="20" y="32" font-size="18" fill="#333" font-weight="bold">L-系统生长的分形树</text>
    <text x="20" y="58" font-size="14" fill="#333">重写规则：A → F[+A][-A]A</text>
    <text x="20" y="80" font-size="14" fill="#333">F=伸长，+ = 右转 30°，- = 左转 30°，[ ]=分支</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <!-- level 1 trunk -->
    <line x1="150" y1="300" x2="150" y2="230" stroke="#333" stroke-width="8"/>
    <!-- level 2 -->
    <line x1="150" y1="230" x2="128.9" y2="184.7" stroke="#333" stroke-width="6"/>
    <line x1="150" y1="230" x2="171.1" y2="184.7" stroke="#333" stroke-width="6"/>
    <!-- level 3 -->
    <line x1="128.9" y1="184.7" x2="101.2" y2="168.7" stroke="#333" stroke-width="4"/>
    <line x1="128.9" y1="184.7" x2="134.5" y2="153.2" stroke="#333" stroke-width="4"/>
    <line x1="171.1" y1="184.7" x2="165.5" y2="153.2" stroke="#333" stroke-width="4"/>
    <line x1="171.1" y1="184.7" x2="198.8" y2="168.7" stroke="#333" stroke-width="4"/>
    <!-- level 4 -->
    <line x1="134.5" y1="153.2" x2="124.5" y2="135.9" stroke="#333" stroke-width="2.5"/>
    <line x1="134.5" y1="153.2" x2="149.8" y2="140.3" stroke="#333" stroke-width="2.5"/>
    <line x1="165.5" y1="153.2" x2="150.2" y2="140.3" stroke="#333" stroke-width="2.5"/>
    <line x1="165.5" y1="153.2" x2="175.5" y2="135.9" stroke="#333" stroke-width="2.5"/>
  </g>
  <g fill="#1f6f8b">
    <circle cx="101.2" cy="168.7" r="5"/>
    <circle cx="198.8" cy="168.7" r="5"/>
    <circle cx="124.5" cy="135.9" r="5"/>
    <circle cx="149.8" cy="140.3" r="5"/>
    <circle cx="150.2" cy="140.3" r="5"/>
    <circle cx="175.5" cy="135.9" r="5"/>
  </g>
  <g font-family="sans-serif">
    <text x="20" y="310" font-size="14" fill="#333">迭代 3 次：形状自相似地长出，没有任何「全局图纸」</text>
  </g>
</svg>
