<svg viewBox="0 0 460 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">生命游戏中的滑翔机</title>
  <desc id="desc">康威生命游戏中的滑翔机图案，第 0 代位于左上角，每过 4 代整体向右下方移动一个格。</desc>
  <rect x="0" y="0" width="460" height="320" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <text x="20" y="36" font-size="20" fill="#333" font-weight="bold">生命游戏中的滑翔机（Glider）</text>
    <text x="20" y="64" font-size="14" fill="#333">规则：活细胞邻数恰为 2 或 3 则存活；死细胞邻数恰为 3 则新生（B3/S23）</text>
    <text x="58" y="88" font-size="15" fill="#333">第 0 代</text>
    <text x="278" y="88" font-size="15" fill="#333">第 4 代</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <!-- grid A -->
    <g>
      <line x1="20" y1="110" x2="200" y2="110"/><line x1="20" y1="146" x2="200" y2="146"/>
      <line x1="20" y1="182" x2="200" y2="182"/><line x1="20" y1="218" x2="200" y2="218"/>
      <line x1="20" y1="254" x2="200" y2="254"/>
      <line x1="20" y1="110" x2="20" y2="254"/><line x1="56" y1="110" x2="56" y2="254"/>
      <line x1="92" y1="110" x2="92" y2="254"/><line x1="128" y1="110" x2="128" y2="254"/>
      <line x1="164" y1="110" x2="164" y2="254"/><line x1="200" y1="110" x2="200" y2="254"/>
    </g>
    <!-- grid B -->
    <g>
      <line x1="240" y1="110" x2="420" y2="110"/><line x1="240" y1="146" x2="420" y2="146"/>
      <line x1="240" y1="182" x2="420" y2="182"/><line x1="240" y1="218" x2="420" y2="218"/>
      <line x1="240" y1="254" x2="420" y2="254"/>
      <line x1="240" y1="110" x2="240" y2="254"/><line x1="276" y1="110" x2="276" y2="254"/>
      <line x1="312" y1="110" x2="312" y2="254"/><line x1="348" y1="110" x2="348" y2="254"/>
      <line x1="384" y1="110" x2="384" y2="254"/><line x1="420" y1="110" x2="420" y2="254"/>
    </g>
  </g>
  <g fill="#c0392b">
    <!-- glider A: cells (0,1),(1,2),(2,0),(2,1),(2,2) -->
    <rect x="56" y="110" width="36" height="36"/>
    <rect x="92" y="146" width="36" height="36"/>
    <rect x="20" y="182" width="36" height="36"/>
    <rect x="56" y="182" width="36" height="36"/>
    <rect x="92" y="182" width="36" height="36"/>
    <!-- glider B: cells (1,2),(2,3),(3,1),(3,2),(3,3) -->
    <rect x="312" y="146" width="36" height="36"/>
    <rect x="348" y="182" width="36" height="36"/>
    <rect x="276" y="218" width="36" height="36"/>
    <rect x="312" y="218" width="36" height="36"/>
    <rect x="348" y="218" width="36" height="36"/>
  </g>
  <g font-family="sans-serif">
    <text x="122" y="146" font-size="13" fill="#fff" text-anchor="middle">0</text>
    <text x="122" y="182" font-size="13" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="200" font-size="13" fill="#fff" text-anchor="middle">2</text>
    <text x="86" y="200" font-size="13" fill="#fff" text-anchor="middle">2</text>
    <text x="122" y="200" font-size="13" fill="#fff" text-anchor="middle">1</text>
    <text x="342" y="182" font-size="13" fill="#fff" text-anchor="middle">0</text>
    <text x="378" y="218" font-size="13" fill="#fff" text-anchor="middle">1</text>
    <text x="304" y="236" font-size="13" fill="#fff" text-anchor="middle">2</text>
    <text x="342" y="236" font-size="13" fill="#fff" text-anchor="middle">2</text>
    <text x="378" y="236" font-size="13" fill="#fff" text-anchor="middle">1</text>
    <path d="M 210 172 C 222 172, 226 172, 236 172" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="220" y="290" font-size="14" fill="#333" text-anchor="middle">每 4 代整体向右下移动 1 格</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
