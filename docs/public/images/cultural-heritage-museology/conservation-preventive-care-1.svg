<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>保护干预的分层</title>
  <desc>从底部宽大的预防性保护，到中部缓和性保护，再到顶部窄小的修复，干预强度依次递增、可逆性依次递减。</desc>
  <rect width="760" height="400" fill="#faf9f5"/>
  <text x="380" y="44" text-anchor="middle" font-size="17" fill="#333">保护干预的阶梯：从上到下，预防的权重越来越大</text>
  <polygon points="38,72 60,64 60,332 38,332" fill="#c0392b"/>
  <polygon points="38,72 60,64 60,332 38,332" fill="none" stroke="#c0392b"/>
  <text transform="rotate(-90 49 200)" x="49" y="206" text-anchor="middle" font-size="14" fill="#c0392b">干预强度 递增</text>

  <rect x="230" y="78" width="340" height="70" rx="10" fill="#f3d3cd" stroke="#c0392b"/>
  <text x="400" y="106" text-anchor="middle" font-size="18" fill="#333">修复 Restoration</text>
  <text x="400" y="130" text-anchor="middle" font-size="13" fill="#555">恢复外观：补色、接拼；干预最高，可逆性最低</text>

  <rect x="150" y="160" width="500" height="78" rx="10" fill="#ece3d5" stroke="#8a6d3b"/>
  <text x="400" y="193" text-anchor="middle" font-size="18" fill="#333">缓和性保护 Remedial Conservation</text>
  <text x="400" y="216" text-anchor="middle" font-size="13" fill="#555">直接作用于物：除尘、加固、稳定状况——尽量不动外形</text>

  <rect x="80" y="250" width="640" height="80" rx="10" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="400" y="284" text-anchor="middle" font-size="18" fill="#333">预防性保护 Preventive Conservation</text>
  <text x="400" y="308" text-anchor="middle" font-size="13" fill="#555">环境管理：温湿度、光照、虫害与包装——全程不触碰文物，最便宜也最优先</text>
</svg>
