<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>展览动线示意</title>
  <desc>单向蛇形流线：入口进入序厅，经过主题展厅，抵达焦点展柜（叙事高潮），再到互动体验区，从出口离场。</desc>
  <rect width="800" height="520" fill="#faf9f5"/>
  <rect x="50" y="60" width="700" height="400" rx="8" fill="none" stroke="#666" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-size="16" fill="#333">展览空间与参观动线（单向蛇形）</text>

  <rect x="90" y="90" width="150" height="300" rx="6" fill="#eef1f0" stroke="#666"/>
  <text x="165" y="118" text-anchor="middle" font-size="15" fill="#333">序厅 · 设问</text>
  <text x="165" y="142" text-anchor="middle" font-size="13" fill="#555">抛出核心问题</text>
  <text x="165" y="164" text-anchor="middle" font-size="13" fill="#555">「为什么要看？」</text>

  <rect x="260" y="90" width="160" height="300" rx="6" fill="#eef1f0" stroke="#666"/>
  <text x="340" y="118" text-anchor="middle" font-size="15" fill="#333">主题展厅 · 展开</text>
  <text x="340" y="142" text-anchor="middle" font-size="13" fill="#555">历史与工艺</text>
  <text x="340" y="164" text-anchor="middle" font-size="13" fill="#555">展品成组呈现</text>

  <rect x="440" y="90" width="150" height="300" rx="6" fill="#f3d3cd" stroke="#c0392b" stroke-width="2.5"/>
  <text x="515" y="118" text-anchor="middle" font-size="15" fill="#333">焦点展柜 · 高潮</text>
  <text x="515" y="142" text-anchor="middle" font-size="13" fill="#555">全展最重要的一件物</text>
  <text x="515" y="164" text-anchor="middle" font-size="13" fill="#555">独立展柜 + 深读区</text>

  <rect x="610" y="90" width="130" height="300" rx="6" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="675" y="118" text-anchor="middle" font-size="15" fill="#333">互动体验</text>
  <text x="675" y="142" text-anchor="middle" font-size="13" fill="#555">动手 + 休息</text>
  <text x="675" y="164" text-anchor="middle" font-size="13" fill="#555">松口气</text>

  <polygon points="30,236 50,228 50,244" fill="#c0392b"/>
  <text x="70" y="240" text-anchor="middle" font-size="14" fill="#333">入口</text>
  <polygon points="754,236 770,228 770,244" fill="#c0392b"/>
  <text x="748" y="240" text-anchor="middle" font-size="14" fill="#333">出口</text>

  <line x1="50" y1="240" x2="90" y2="240" stroke="#c0392b" stroke-width="3"/>
  <line x1="240" y1="240" x2="260" y2="240" stroke="#c0392b" stroke-width="3"/>
  <line x1="420" y1="240" x2="440" y2="240" stroke="#c0392b" stroke-width="3"/>
  <line x1="590" y1="240" x2="610" y2="240" stroke="#c0392b" stroke-width="3"/>
  <line x1="740" y1="240" x2="754" y2="240" stroke="#c0392b" stroke-width="3"/>

  <text x="400" y="500" text-anchor="middle" font-size="14" fill="#333">红色 = 叙事高潮（焦点展柜）；展线节奏：设问 → 展开 → 高潮 → 收束</text>
</svg>
