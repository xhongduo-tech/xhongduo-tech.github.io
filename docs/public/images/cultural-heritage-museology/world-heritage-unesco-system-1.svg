<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>世界遗产评估的四支柱与申报评审流程</title>
  <desc>突出普遍价值由十项标准、完整性、真实性与保护管理四支柱支撑；申报经预备名录、申报文件、咨询机构评估、委员会决议到列入名录，评估不通过则退回或缓议。</desc>
  <rect width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="17" fill="#333">世界遗产评估与申报流程</text>

  <text x="400" y="66" text-anchor="middle" font-size="15" fill="#333">突出普遍价值（OUV）的评估维度</text>
  <rect x="40" y="80" width="172" height="84" rx="8" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="126" y="108" text-anchor="middle" font-size="15" fill="#333">十项标准</text>
  <text x="126" y="130" text-anchor="middle" font-size="13" fill="#555">6 文化 + 4 自然</text>
  <text x="126" y="150" text-anchor="middle" font-size="13" fill="#555">超出国界的重要性</text>

  <rect x="224" y="80" width="172" height="84" rx="8" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="310" y="108" text-anchor="middle" font-size="15" fill="#333">完整性</text>
  <text x="310" y="130" text-anchor="middle" font-size="13" fill="#555">Integrity</text>
  <text x="310" y="150" text-anchor="middle" font-size="13" fill="#555">要素齐全、边界合理</text>

  <rect x="408" y="80" width="172" height="84" rx="8" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="494" y="108" text-anchor="middle" font-size="15" fill="#333">真实性</text>
  <text x="494" y="130" text-anchor="middle" font-size="13" fill="#555">Authenticity</text>
  <text x="494" y="150" text-anchor="middle" font-size="13" fill="#555">材质·工艺·传统可信</text>

  <rect x="592" y="80" width="172" height="84" rx="8" fill="#cfe3e8" stroke="#1f6f8b"/>
  <text x="678" y="108" text-anchor="middle" font-size="15" fill="#333">保护与管理</text>
  <text x="678" y="130" text-anchor="middle" font-size="13" fill="#555">法律保障 + 管理制度</text>
  <text x="678" y="150" text-anchor="middle" font-size="13" fill="#555">可持续框架</text>

  <line x1="400" y1="164" x2="400" y2="206" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="196" text-anchor="middle" font-size="13" fill="#666">缺一不可</text>

  <text x="400" y="224" text-anchor="middle" font-size="15" fill="#333">从申报到列入：评审流程</text>

  <rect x="40" y="240" width="118" height="90" rx="8" fill="#eef1f0" stroke="#666"/>
  <text x="99" y="270" text-anchor="middle" font-size="14" fill="#333">预备名录</text>
  <text x="99" y="290" text-anchor="middle" font-size="13" fill="#555">申报国自报</text>
  <text x="99" y="310" text-anchor="middle" font-size="13" fill="#555">清单</text>

  <rect x="186" y="240" width="118" height="90" rx="8" fill="#eef1f0" stroke="#666"/>
  <text x="245" y="270" text-anchor="middle" font-size="14" fill="#333">申报文件</text>
  <text x="245" y="290" text-anchor="middle" font-size="13" fill="#555">OUV 论证 +</text>
  <text x="245" y="310" text-anchor="middle" font-size="13" fill="#555">边界与管理</text>

  <rect x="332" y="240" width="118" height="90" rx="8" fill="#eef1f0" stroke="#666"/>
  <text x="391" y="270" text-anchor="middle" font-size="14" fill="#333">咨询机构评估</text>
  <text x="391" y="290" text-anchor="middle" font-size="13" fill="#555">ICOMOS /</text>
  <text x="391" y="310" text-anchor="middle" font-size="13" fill="#555">IUCN 实地考察</text>

  <rect x="478" y="240" width="118" height="90" rx="8" fill="#eef1f0" stroke="#666"/>
  <text x="537" y="270" text-anchor="middle" font-size="14" fill="#333">委员会决议</text>
  <text x="537" y="290" text-anchor="middle" font-size="13" fill="#555">21 国代表</text>
  <text x="537" y="310" text-anchor="middle" font-size="13" fill="#555">表决</text>

  <rect x="624" y="240" width="118" height="90" rx="8" fill="#f3d3cd" stroke="#c0392b" stroke-width="2.5"/>
  <text x="683" y="270" text-anchor="middle" font-size="14" fill="#333">列入名录</text>
  <text x="683" y="290" text-anchor="middle" font-size="13" fill="#555">进入监测</text>
  <text x="683" y="310" text-anchor="middle" font-size="13" fill="#555">可入濒危名录</text>

  <line x1="158" y1="285" x2="184" y2="285" stroke="#333" stroke-width="2.5"/>
  <polygon points="184,279 198,285 184,291" fill="#333"/>
  <line x1="304" y1="285" x2="330" y2="285" stroke="#333" stroke-width="2.5"/>
  <polygon points="330,279 344,285 330,291" fill="#333"/>
  <line x1="450" y1="285" x2="476" y2="285" stroke="#333" stroke-width="2.5"/>
  <polygon points="476,279 490,285 476,291" fill="#333"/>
  <line x1="596" y1="285" x2="622" y2="285" stroke="#333" stroke-width="2.5"/>
  <polygon points="622,279 636,285 622,291" fill="#333"/>

  <path d="M391 336 L391 372 L99 372 L99 336" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="99,330 93,344 105,344" fill="#c0392b"/>
  <text x="245" y="392" text-anchor="middle" font-size="13" fill="#c0392b">评估不通过 → 退回（refer）或缓议（defer）</text>

  <text x="400" y="428" text-anchor="middle" font-size="13" fill="#333">列入后监测：状况恶化 → 《濒危世界遗产名录》；极端情况可除名</text>
</svg>
