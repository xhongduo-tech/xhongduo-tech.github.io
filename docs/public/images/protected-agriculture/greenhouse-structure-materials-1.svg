<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="sans-serif">
  <title>连栋温室横剖面示意图</title>
  <desc>两个采光屋面的连栋温室剖面，标注脊、屋面、天沟、立柱、基础与地面。</desc>
  <rect width="820" height="470" fill="#faf9f5"/>
  <!-- 地面 -->
  <line x1="30" y1="400" x2="790" y2="400" stroke="#333" stroke-width="3"/>
  <line x1="30" y1="406" x2="790" y2="406" stroke="#333" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="30" y="430" font-size="15" fill="#333">地面（ground）</text>
  <!-- 基础 -->
  <rect x="138" y="400" width="24" height="22" fill="#1f6f8b"/>
  <rect x="388" y="400" width="24" height="22" fill="#1f6f8b"/>
  <rect x="638" y="400" width="24" height="22" fill="#1f6f8b"/>
  <text x="120" y="455" font-size="15" fill="#1f6f8b">基础（foundation）</text>
  <!-- 立柱 -->
  <line x1="150" y1="400" x2="150" y2="255" stroke="#333" stroke-width="6"/>
  <line x1="400" y1="400" x2="400" y2="255" stroke="#333" stroke-width="6"/>
  <line x1="650" y1="400" x2="650" y2="255" stroke="#333" stroke-width="6"/>
  <text x="640" y="330" font-size="15" fill="#333">立柱（column）</text>
  <line x1="634" y1="335" x2="600" y2="342" stroke="#333" stroke-width="1"/>
  <!-- 檐口梁 / 天沟 -->
  <line x1="150" y1="255" x2="400" y2="255" stroke="#333" stroke-width="5"/>
  <line x1="400" y1="255" x2="650" y2="255" stroke="#333" stroke-width="5"/>
  <text x="396" y="248" font-size="15" fill="#c0392b">天沟（gutter）</text>
  <!-- 屋面（玻璃/覆盖） -->
  <polygon points="150,255 275,120 400,255" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="400,255 525,120 650,255" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="260" y="165" font-size="15" fill="#1f6f8b" transform="rotate(-20 260 165)">屋面（roof）</text>
  <!-- 脊 与 顶通风窗 -->
  <circle cx="275" cy="120" r="5" fill="#c0392b"/>
  <circle cx="525" cy="120" r="5" fill="#c0392b"/>
  <polygon points="275,120 285,92 320,108" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <text x="300" y="90" font-size="15" fill="#c0392b">顶通风窗</text>
  <text x="252" y="108" font-size="14" fill="#333">脊（ridge）</text>
  <!-- 跨度标注 -->
  <line x1="150" y1="285" x2="400" y2="285" stroke="#333" stroke-width="1"/>
  <line x1="150" y1="280" x2="150" y2="290" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="280" x2="400" y2="290" stroke="#333" stroke-width="1"/>
  <text x="240" y="280" font-size="15" fill="#333">跨度 span</text>
  <!-- 高度标注 -->
  <line x1="700" y1="255" x2="700" y2="120" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="706" y="195" font-size="15" fill="#333">脊高</text>
  <text x="706" y="280" font-size="14" fill="#333">檐高</text>
  <line x1="700" y1="255" x2="700" y2="400" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
