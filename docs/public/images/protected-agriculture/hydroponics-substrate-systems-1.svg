<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="sans-serif">
  <title>营养液膜技术（NFT）系统示意图</title>
  <desc>储液槽、水泵、斜置栽培槽与回流管组成的 NFT 循环系统。</desc>
  <rect width="820" height="460" fill="#faf9f5"/>
  <!-- 储液槽 -->
  <rect x="60" y="330" width="220" height="80" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="80" y1="350" x2="260" y2="350" stroke="#1f6f8b" stroke-width="1"/>
  <text x="80" y="400" font-size="15" fill="#1f6f8b">储液槽（reservoir）</text>
  <text x="80" y="380" font-size="13" fill="#333">营养液在此蓄存</text>
  <!-- 水泵 -->
  <circle cx="170" cy="310" r="18" fill="#c0392b"/>
  <text x="170" y="315" font-size="14" fill="#fff" text-anchor="middle">泵</text>
  <line x1="170" y1="328" x2="170" y2="350" stroke="#333" stroke-width="3"/>
  <text x="196" y="304" font-size="14" fill="#c0392b">水泵</text>
  <!-- 供液管 -->
  <line x1="170" y1="292" x2="170" y2="230" stroke="#333" stroke-width="5"/>
  <line x1="170" y1="230" x2="320" y2="230" stroke="#333" stroke-width="5"/>
  <polygon points="320,230 308,224 308,236" fill="#333"/>
  <text x="200" y="222" font-size="14" fill="#333">供液管</text>
  <!-- NFT 栽培槽（斜置） -->
  <polygon points="320,230 740,150 740,175 320,255" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="320" y1="242" x2="740" y2="162" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="430" y="140" font-size="15" fill="#1f6f8b">NFT 栽培槽（斜置，营养液膜流动）</text>
  <!-- 植株 -->
  <g fill="#4a7c3f">
    <circle cx="390" cy="228" r="12"/>
    <circle cx="480" cy="218" r="12"/>
    <circle cx="570" cy="208" r="12"/>
    <circle cx="660" cy="198" r="12"/>
  </g>
  <line x1="390" y1="240" x2="390" y2="228" stroke="#4a7c3f" stroke-width="2"/>
  <line x1="480" y1="230" x2="480" y2="218" stroke="#4a7c3f" stroke-width="2"/>
  <line x1="570" y1="220" x2="570" y2="208" stroke="#4a7c3f" stroke-width="2"/>
  <line x1="660" y1="210" x2="660" y2="198" stroke="#4a7c3f" stroke-width="2"/>
  <text x="398" y="252" font-size="13" fill="#333">植株</text>
  <text x="700" y="236" font-size="13" fill="#333">营养液膜</text>
  <!-- 回流管 -->
  <line x1="740" y1="162" x2="740" y2="80" stroke="#333" stroke-width="4"/>
  <line x1="740" y1="80" x2="180" y2="80" stroke="#333" stroke-width="4"/>
  <line x1="180" y1="80" x2="180" y2="330" stroke="#333" stroke-width="4"/>
  <polygon points="180,330 174,318 186,318" fill="#333"/>
  <text x="600" y="72" font-size="14" fill="#333">回流管</text>
  <!-- 循环箭头 -->
  <text x="250" y="260" font-size="14" fill="#c0392b">营养液循环</text>
  <path d="M 300 268 A 130 120 0 0 1 500 268" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
