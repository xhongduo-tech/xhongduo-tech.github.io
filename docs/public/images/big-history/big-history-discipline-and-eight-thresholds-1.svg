<svg viewBox="0 0 920 350" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>大历史八道复杂度阈值时间线</title>
  <desc>从 138 亿年前的大爆炸到约 250 年前的现代革命，宇宙在八道阈值处逐级涌现出更复杂的新结构。</desc>
  <rect width="920" height="350" fill="#faf9f5"/>
  <line x1="60" y1="150" x2="860" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="150" x2="60" y2="128" stroke="#333" stroke-width="2"/>
  <line x1="860" y1="150" x2="860" y2="128" stroke="#333" stroke-width="2"/>
  <text x="60" y="112" font-size="13" fill="#1f6f8b" text-anchor="middle">138 亿年前</text>
  <text x="860" y="112" font-size="13" fill="#1f6f8b" text-anchor="middle">今天</text>
  <polygon points="60,120 48,132 72,132" fill="#1f6f8b"/>
  <polygon points="860,120 848,132 872,132" fill="#1f6f8b"/>
  <g stroke="#1f6f8b" stroke-width="2" fill="#fff">
    <circle cx="60" cy="150" r="20"/>
    <circle cx="174" cy="150" r="20"/>
    <circle cx="289" cy="150" r="20"/>
    <circle cx="403" cy="150" r="20"/>
    <circle cx="517" cy="150" r="20"/>
    <circle cx="632" cy="150" r="20"/>
    <circle cx="746" cy="150" r="20"/>
    <circle cx="860" cy="150" r="20"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="60" y="155">1</text>
    <text x="174" y="155">2</text>
    <text x="289" y="155">3</text>
    <text x="403" y="155">4</text>
    <text x="517" y="155">5</text>
    <text x="632" y="155">6</text>
    <text x="746" y="155">7</text>
    <text x="860" y="155">8</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="60" y="188">大爆炸</text>
    <text x="60" y="206" fill="#c0392b">138 亿年前</text>
    <text x="174" y="188">恒星与星系</text>
    <text x="174" y="206" fill="#c0392b">约 136 亿年前</text>
    <text x="289" y="188">化学元素</text>
    <text x="289" y="206" fill="#c0392b">约 130 亿年前</text>
    <text x="403" y="188">太阳系与地球</text>
    <text x="403" y="206" fill="#c0392b">46 亿年前</text>
    <text x="517" y="188">生命</text>
    <text x="517" y="206" fill="#c0392b">约 38 亿年前</text>
    <text x="632" y="188">集体学习</text>
    <text x="632" y="206" fill="#c0392b">约 20 万年前</text>
    <text x="746" y="188">农业</text>
    <text x="746" y="206" fill="#c0392b">约 1.2 万年前</text>
    <text x="860" y="188">现代革命</text>
    <text x="860" y="206" fill="#c0392b">约 250 年前</text>
  </g>
  <text x="460" y="268" font-size="14" fill="#333" text-anchor="middle">复杂性逐级上升：更大 · 更有序 · 能量流更强 · 信息量更多</text>
  <text x="460" y="292" font-size="13" fill="#1f6f8b" text-anchor="middle">八道阈值之间是漫长的「渐变带」，阈值是突变与渐变的交界点</text>
  <g font-size="13" fill="#c0392b" text-anchor="middle">
    <text x="117" y="172">约 2 亿年</text>
    <text x="232" y="172">数亿年</text>
    <text x="346" y="172">约 90 亿年</text>
    <text x="460" y="172">约 8 亿年</text>
    <text x="574" y="172">约 37 亿年</text>
    <text x="689" y="172">约 19 万年</text>
    <text x="803" y="172">约 1 万年</text>
  </g>
</svg>
