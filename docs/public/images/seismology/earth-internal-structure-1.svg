<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
<title>地球内部圈层结构与 P 波掠射路径</title>
<desc>按深度比例画出地壳、地幔、液态外核与固态内核，以及掠射核幔边界的 P 波路径。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<g>
  <circle cx="310" cy="200" r="160" fill="#cfe0e6" stroke="#333" stroke-width="1.5"/>
  <circle cx="310" cy="200" r="87" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <circle cx="310" cy="200" r="31" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
</g>
<path d="M197,87 C220,135 255,165 310,200 C365,235 400,265 423,313" fill="none" stroke="#faf9f5" stroke-width="3" stroke-dasharray="2 3"/>
<g fill="#333" font-size="14">
  <text x="300" y="92">内核（固态）</text>
  <text x="245" y="150">外核（液态）</text>
  <text x="330" y="40">地壳 0–35 km</text>
  <text x="470" y="185">地幔 35–2900 km</text>
  <text x="120" y="255">莫霍面</text>
  <text x="120" y="275">核幔边界</text>
  <text x="110" y="295">内外核边界</text>
</g>
<g stroke="#333" stroke-width="1">
  <line x1="330" y1="44" x2="330" y2="160"/>
  <line x1="120" y1="260" x2="255" y2="196"/>
  <line x1="120" y1="280" x2="290" y2="113"/>
  <line x1="110" y1="300" x2="297" y2="172"/>
</g>
<g fill="#c0392b" font-size="13">
  <text x="120" y="60">虚线：穿过外核的 P 波路径（PKP）</text>
  <text x="120" y="80">P 波影区界限：震中距 103°–143°</text>
</g>
<g fill="#666" font-size="13">
  <text x="30" y="360">外核 μ=0，S 波不能穿过 → S 波影区；内核为固态，P 波穿过时提速</text>
  <text x="30" y="382">410 km 与 660 km 不连续面是橄榄石相变带，是地幔对流的“发动机界面”</text>
</g>
</svg>
