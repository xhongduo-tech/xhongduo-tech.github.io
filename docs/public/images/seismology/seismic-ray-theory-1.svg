<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="sans-serif">
<title>两层介质中的走时曲线</title>
<desc>直达波、反射波、首波（Pn）在平直两层模型中的走时-距离曲线：横轴震中距，纵轴走时；v2&gt;v1 故首波斜率更缓、在远距先到。</desc>
<rect x="0" y="0" width="620" height="400" fill="#faf9f5"/>
<g stroke="#c0392b" stroke-width="1.5" fill="none">
  <line x1="60" y1="330" x2="560" y2="330"/>
  <line x1="60" y1="330" x2="60" y2="40"/>
</g>
<g fill="#333" font-size="14">
  <text x="585" y="336">震中距 x (km)</text>
  <text x="18" y="40">走时 t (s)</text>
  <text x="52" y="352">0</text>
  <text x="295" y="352">60</text>
  <text x="548" y="352">120</text>
  <text x="42" y="335">0</text>
  <text x="42" y="195">10</text>
  <text x="42" y="55">20</text>
</g>
<g stroke-width="2.5" fill="none">
  <path d="M60 330 L560 40" stroke="#1f6f8b" stroke-dasharray="6 4"/>
  <path d="M60 233 Q310 183 560 24" stroke="#c0392b" stroke-dasharray="2 3"/>
  <path d="M310 157 L560 49" stroke="#333"/>
</g>
<g fill="#333" font-size="14">
  <text x="420" y="170" fill="#1f6f8b">直达波 t = x/v₁</text>
  <text x="240" y="30" fill="#c0392b">反射波（双曲线）</text>
  <text x="430" y="90">首波 Pn：t = x/v₂ + 2h cos i_c / v₁</text>
</g>
<circle cx="501" cy="74" r="4" fill="#c0392b"/>
<g fill="#666" font-size="13">
  <text x="300" y="100">首波与直达波相交：X ≈ 106 km，此后首波先到</text>
  <text x="300" y="120">首波自临界距 X_cr ≈ 2h tan i_c ≈ 45 km 才开始出现</text>
</g>
<g fill="#666" font-size="13">
  <text x="60" y="380">v₂ &gt; v₁：首波斜率 1/v₂ 比直达波斜率 1/v₁ 更缓；斜率即视速度的倒数</text>
</g>
</svg>
