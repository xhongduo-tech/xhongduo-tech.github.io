<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="sans-serif">
<title>断层面解（沙滩球）示意</title>
<desc>下半球投影的震源机制球：两条节面把圆面分成四个象限，深色为压缩象限（P波初动向上），浅色为膨胀象限（P波初动向下）。</desc>
<rect x="0" y="0" width="620" height="400" fill="#faf9f5"/>
<g stroke="#333" stroke-width="1.5" fill="none">
  <path d="M180,200 L272,108 A130,130 0 0 1 88,108 Z" fill="#1f6f8b"/>
  <path d="M180,200 L88,292 A130,130 0 0 1 272,292 Z" fill="#1f6f8b"/>
  <circle cx="180" cy="200" r="130" fill="none"/>
  <line x1="272" y1="108" x2="88" y2="292"/>
  <line x1="88" y1="108" x2="272" y2="292"/>
</g>
<g fill="#333" font-size="15">
  <text x="150" y="150">压缩</text>
  <text x="200" y="245">压缩</text>
  <text x="80" y="250" fill="#faf9f5">膨胀</text>
  <text x="235" y="110" fill="#faf9f5">膨胀</text>
</g>
<g fill="#c0392b" font-size="14">
  <text x="300" y="120">深色象限：P 波初动向上</text>
  <text x="300" y="145">浅色象限：P 波初动向下</text>
  <text x="300" y="185">节面：两种可能的断层面</text>
  <text x="300" y="210">走向、倾角、滑动角由节面方位确定</text>
  <text x="300" y="245">节面 A 与节面 B 在数学上无法区分</text>
  <text x="300" y="270">，须靠余震分布或破裂直接性判据。</text>
</g>
<g fill="#666" font-size="13">
  <text x="300" y="320">纯走滑断层的机制球：节面竖直、互相垂直，</text>
  <text x="300" y="345">压缩与膨胀象限各占两个对角。</text>
</g>
</svg>
