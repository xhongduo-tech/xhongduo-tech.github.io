<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="sans-serif">
  <title>双原子分子的电子–振动–转动能级示意</title>
  <desc>莫尔斯势能曲线随核间距变化，阱内叠加振动能级（v=0,1,2,3）与各振动能级上的转动能级细分裂，顶部标出离解极限。</desc>
  <rect width="720" height="480" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">双原子分子势能曲线与振动、转动能级</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="420" x2="680" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="420" stroke="#333" stroke-width="1.5"/>
  <text x="660" y="442" text-anchor="end" font-size="14" fill="#333">核间距 r →</text>
  <text x="40" y="70" text-anchor="middle" font-size="14" fill="#333">势能 V(r) →</text>

  <!-- 离解极限虚线 -->
  <line x1="70" y1="125" x2="680" y2="125" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="656" y="116" text-anchor="end" font-size="13" fill="#c0392b">离解极限 D_e</text>

  <!-- 莫尔斯势能曲线 -->
  <path d="M 70 55 C 150 72 240 160 300 172 C 360 172 450 142 560 129 C 610 127 640 126 680 126"
        fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linecap="round"/>

  <!-- 平衡键长标记 -->
  <line x1="300" y1="172" x2="300" y2="420" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="452" text-anchor="middle" font-size="14" fill="#333">r_e（平衡键长）</text>

  <!-- 振动能级 v=0..4 -->
  <line x1="242" y1="163" x2="352" y2="163" stroke="#333" stroke-width="2"/>
  <line x1="214" y1="152" x2="384" y2="152" stroke="#333" stroke-width="2"/>
  <line x1="193" y1="143" x2="410" y2="143" stroke="#333" stroke-width="2"/>
  <line x1="178" y1="136" x2="432" y2="136" stroke="#333" stroke-width="2"/>
  <line x1="168" y1="131" x2="448" y2="131" stroke="#333" stroke-width="2"/>
  <text x="462" y="167" font-size="13" fill="#333">v = 0</text>
  <text x="462" y="156" font-size="13" fill="#333">v = 1</text>
  <text x="462" y="147" font-size="13" fill="#333">v = 2</text>
  <text x="462" y="140" font-size="13" fill="#333">v = 3</text>

  <!-- 转动能级：v=1 上的细分裂 -->
  <line x1="228" y1="148" x2="228" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="149" x2="240" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="252" y1="150" x2="252" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="264" y1="151" x2="264" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="276" y1="151.5" x2="276" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="330" y1="148" x2="330" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="342" y1="149" x2="342" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="354" y1="150" x2="354" y2="152" stroke="#c0392b" stroke-width="2"/>
  <line x1="366" y1="151" x2="366" y2="152" stroke="#c0392b" stroke-width="2"/>
  <text x="278" y="140" font-size="13" fill="#c0392b">转动精细能级</text>

  <!-- 能量标尺 -->
  <line x1="600" y1="172" x2="600" y2="125" stroke="#888" stroke-width="1"/>
  <text x="612" y="150" font-size="13" fill="#333">键解离能</text>

  <!-- 波函数小示意 -->
  <path d="M 160 196 v -6 h 6 v 12 h 6 v -12 h 6 v 12 h 6 v -12 h 6 v 6"
        fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="216" font-size="13" fill="#333">v=0 波函数</text>
</svg>
