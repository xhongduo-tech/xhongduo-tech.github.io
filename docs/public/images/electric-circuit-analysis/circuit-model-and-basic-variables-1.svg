<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif">
  <title>含电压源与电阻的串联电路及其参考方向</title>
  <desc>电压源 vs 与电阻 R 串联，标出电流 i 与电阻端电压 v_R 的参考方向</desc>
  <rect width="480" height="300" fill="#faf9f5"/>

  <!-- 导线 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="100" y1="80" x2="380" y2="80"/>
    <line x1="100" y1="220" x2="380" y2="220"/>
    <line x1="100" y1="115" x2="100" y2="80"/>
    <line x1="100" y1="185" x2="100" y2="220"/>
    <line x1="380" y1="80" x2="380" y2="125"/>
    <line x1="380" y1="175" x2="380" y2="220"/>
  </g>

  <!-- 电压源 -->
  <circle cx="100" cy="150" r="35" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="82" y="126" font-size="16" fill="#333" text-anchor="middle">+</text>
  <text x="82" y="176" font-size="16" fill="#333" text-anchor="middle">−</text>
  <text x="150" y="158" font-size="15" fill="#1f6f8b">v_s</text>

  <!-- 电阻 -->
  <rect x="360" y="125" width="40" height="50" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="380" y="112" font-size="15" fill="#c0392b" text-anchor="middle">R</text>

  <!-- 电流参考方向 -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="170" y1="80" x2="245" y2="80"/>
    <path d="M 245 80 L 235 74 M 245 80 L 235 86" fill="none"/>
  </g>
  <text x="207" y="62" font-size="15" fill="#c0392b" text-anchor="middle">i</text>

  <!-- 电压参考方向 -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="425" y1="128" x2="425" y2="170"/>
    <path d="M 425 170 L 419 160 M 425 170 L 431 160" fill="none"/>
  </g>
  <text x="446" y="155" font-size="15" fill="#c0392b">v_R</text>

  <!-- 接地符号 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="100" y1="220" x2="100" y2="240"/>
    <line x1="84" y1="240" x2="116" y2="240"/>
    <line x1="90" y1="246" x2="110" y2="246"/>
    <line x1="96" y1="252" x2="104" y2="252"/>
  </g>
  <text x="126" y="246" font-size="13" fill="#333">参考节点（地）</text>
</svg>
