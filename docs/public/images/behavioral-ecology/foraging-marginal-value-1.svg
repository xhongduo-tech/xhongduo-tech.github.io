<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
<title>边际值定理：最优停留时间</title>
<desc>累积收益曲线为凹函数，从旅行起点出发的切线给出平均收益最大的最优停留时间 t*。</desc>
<rect width="640" height="420" fill="#fff"/>

<!-- axes -->
<line x1="110" y1="380" x2="635" y2="380" stroke="#333" stroke-width="1.5"/>
<line x1="110" y1="380" x2="110" y2="100" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="380" x2="110" y2="380" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>

<!-- curve g(t) -->
<path d="M110,380 L135,347 L160,319 L185,295 L210,275 L217.5,268 L235,258 L260,243.5 L285,231 L310,221 L360,205 L410,193 L510,179 L610,172"
      fill="none" stroke="#1f6f8b" stroke-width="3"/>

<!-- short-stay dashed line (slope lower) -->
<line x1="60" y1="380" x2="200" y2="294" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>
<!-- long-stay dashed line (slope lower) -->
<line x1="60" y1="380" x2="380" y2="176" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>
<!-- optimal tangent line (steepest) -->
<line x1="60" y1="380" x2="430" y2="120" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="217.5" cy="268" r="5" fill="#c0392b"/>
<line x1="217.5" y1="380" x2="217.5" y2="268" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>

<!-- axis labels -->
<text x="320" y="408" fill="#333" font-size="14" text-anchor="middle">在斑块内停留的时间 t（x 轴）</text>
<text x="140" y="398" fill="#333" font-size="13" text-anchor="middle">到达斑块 t = 0</text>
<text x="78" y="394" fill="#333" font-size="13" text-anchor="middle">旅行时间 t_s</text>
<text x="60" y="110" fill="#333" font-size="14" text-anchor="middle">累计能量收益 g(t)</text>
<text x="98" y="70" fill="#333" font-size="13" text-anchor="middle">g(t)</text>

<!-- curve label -->
<text x="300" y="228" fill="#1f6f8b" font-size="14" text-anchor="middle">边际收益曲线 g(t)（收益递减）</text>
<!-- dashed line labels -->
<text x="150" y="290" fill="#999" font-size="13" text-anchor="start">过早离开：平均收益低</text>
<text x="330" y="198" fill="#999" font-size="13" text-anchor="start">过晚离开：平均收益低</text>
<!-- tangent label -->
<text x="368" y="152" fill="#c0392b" font-size="14" text-anchor="start">平均收益切线：斜率最大</text>
<!-- t* label -->
<text x="212" y="258" fill="#c0392b" font-size="14" text-anchor="end">t*</text>
<text x="226" y="250" fill="#c0392b" font-size="13" text-anchor="start">最优停留时间</text>
</svg>
