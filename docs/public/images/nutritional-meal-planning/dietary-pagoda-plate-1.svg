<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 470" width="680" height="940" font-family="sans-serif">
  <title>中国居民平衡膳食宝塔（2022）</title>
  <desc>五层宝塔从下到上依次为：谷薯类与水、蔬菜水果、动物性食物、奶类与大豆坚果、烹调油与盐；底部注明身体活动6000步。</desc>
  <rect x="0" y="0" width="340" height="470" fill="#faf9f5"/>
  <text x="170" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">中国居民平衡膳食宝塔（2022）</text>

  <!-- 第5层（顶层）：烹调油与盐 -->
  <polygon points="150,55 190,55 200,95 140,95" fill="#f5d9d3" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="75" text-anchor="middle" font-size="13" fill="#333">烹调油 25~30g</text>
  <text x="170" y="92" text-anchor="middle" font-size="13" fill="#333">盐 &lt;5g</text>

  <!-- 第4层：奶类与大豆坚果 -->
  <polygon points="125,105 215,105 228,155 112,155" fill="#e8e0f0" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="170" y="126" text-anchor="middle" font-size="13" fill="#333">奶类及奶制品 300mL</text>
  <text x="170" y="143" text-anchor="middle" font-size="13" fill="#333">大豆 25~35g 坚果 约10g</text>

  <!-- 第3层：动物性食物 -->
  <polygon points="98,165 242,165 258,220 82,220" fill="#f5e6d3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="170" y="188" text-anchor="middle" font-size="13" fill="#333">动物性食物 120~200g</text>
  <text x="170" y="205" text-anchor="middle" font-size="13" fill="#333">畜禽肉 40~75g 鱼虾 40~75g 蛋 1个</text>

  <!-- 第2层：蔬菜水果 -->
  <polygon points="62,230 278,230 296,290 46,290" fill="#e8f0e6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="170" y="254" text-anchor="middle" font-size="13" fill="#333">蔬菜 300~500g</text>
  <text x="170" y="271" text-anchor="middle" font-size="13" fill="#333">水果 200~350g</text>
  <text x="170" y="288" text-anchor="middle" font-size="13" fill="#333">深色蔬菜应过半</text>

  <!-- 第1层（底层）：谷薯类与水 -->
  <polygon points="24,300 316,300 332,368 8,368" fill="#dfeef2" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="170" y="324" text-anchor="middle" font-size="13" fill="#333">谷薯类 200~300g</text>
  <text x="170" y="341" text-anchor="middle" font-size="13" fill="#333">全谷物与杂豆 50~150g 薯类 50~100g</text>
  <text x="170" y="358" text-anchor="middle" font-size="13" fill="#333">水 1500~1700mL</text>

  <!-- 底座：身体活动 -->
  <rect x="8" y="378" width="324" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">每周至少进行 5 天中等强度身体活动</text>
  <text x="170" y="420" text-anchor="middle" font-size="13" fill="#333">累计 150 分钟以上，主动身体活动 6000 步/日</text>

  <!-- 侧注：从下到上递减 -->
  <text x="170" y="452" text-anchor="middle" font-size="12" fill="#666">越往上，需要量越少，越要限量</text>
</svg>
