<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>主成分分析的几何意义</title>
  <desc>二维数据点云沿椭圆分布，第一主成分 PC1 指向方差最大的方向，第二主成分 PC2 与 PC1 正交，两者过数据中心。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <g stroke="#999" fill="none">
    <line x1="80" y1="330" x2="600" y2="330"/>
    <line x1="80" y1="330" x2="80" y2="40"/>
  </g>
  <g fill="#888" font-size="14">
    <text x="590" y="352" text-anchor="end">变量 2</text>
    <text x="52" y="50" text-anchor="middle">变量 1</text>
  </g>
  <g fill="#333" opacity="0.75">
    <circle cx="180" cy="310" r="3.4"/><circle cx="210" cy="298" r="3.4"/><circle cx="200" cy="275" r="3.4"/>
    <circle cx="240" cy="305" r="3.4"/><circle cx="255" cy="288" r="3.4"/><circle cx="230" cy="262" r="3.4"/>
    <circle cx="268" cy="268" r="3.4"/><circle cx="285" cy="252" r="3.4"/><circle cx="300" cy="272" r="3.4"/>
    <circle cx="315" cy="245" r="3.4"/><circle cx="300" cy="225" r="3.4"/><circle cx="332" cy="230" r="3.4"/>
    <circle cx="348" cy="205" r="3.4"/><circle cx="362" cy="225" r="3.4"/><circle cx="378" cy="200" r="3.4"/>
    <circle cx="392" cy="175" r="3.4"/><circle cx="375" cy="158" r="3.4"/><circle cx="405" cy="155" r="3.4"/>
    <circle cx="425" cy="175" r="3.4"/><circle cx="440" cy="148" r="3.4"/><circle cx="415" cy="130" r="3.4"/>
    <circle cx="455" cy="120" r="3.4"/><circle cx="470" cy="145" r="3.4"/><circle cx="488" cy="118" r="3.4"/>
    <circle cx="505" cy="95" r="3.4"/><circle cx="478" cy="88" r="3.4"/><circle cx="520" cy="105" r="3.4"/>
    <circle cx="540" cy="82" r="3.4"/><circle cx="555" cy="100" r="3.4"/><circle cx="570" cy="78" r="3.4"/>
  </g>
  <g stroke="#c0392b" stroke-width="3">
    <line x1="110" y1="332" x2="560" y2="76"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="3">
    <line x1="472" y1="250" x2="205" y2="145"/>
  </g>
  <g fill="#c0392b" font-size="15">
    <text x="548" y="72">PC1</text>
  </g>
  <g fill="#1f6f8b" font-size="15">
    <text x="368" y="165">PC2</text>
  </g>
  <g fill="#333" font-size="14">
    <text x="200" y="36" text-anchor="middle">PC1 指向方差最大的方向，PC2 与之正交；投影到 PC1 即得得分</text>
  </g>
</svg>
