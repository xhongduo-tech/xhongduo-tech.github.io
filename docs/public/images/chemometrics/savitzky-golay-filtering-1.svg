<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <title>Savitzky-Golay 平滑前后对比</title>
  <desc>上方为带随机噪声的近红外吸收峰原始光谱，下方为经 Savitzky-Golay 平滑后的光谱：峰形保持，噪声被磨平。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <g stroke="#333" fill="none">
    <line x1="60" y1="300" x2="610" y2="300" stroke="#999"/>
    <line x1="60" y1="50" x2="60" y2="300" stroke="#999"/>
  </g>
  <g fill="#333" font-size="14">
    <text x="300" y="340" text-anchor="middle">波长 / nm</text>
    <text x="24" y="180" text-anchor="middle" transform="rotate(-90 24 180)">吸光度</text>
    <text x="200" y="70" text-anchor="middle" fill="#888">原始光谱（含噪声）</text>
    <text x="430" y="315" text-anchor="middle" fill="#c0392b">SG 平滑后：峰形保持，噪声磨平</text>
  </g>
  <g stroke="#888" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M 80 268 L 92 264 L 104 259 L 116 262 L 128 251 L 140 247 L 152 242 L 164 236 L 176 231 L 188 218 L 200 205 L 212 195 L 224 178 L 236 158 L 248 136 L 260 114 L 272 96 L 284 80 L 296 68 L 308 62 L 320 60 L 332 64 L 344 72 L 356 84 L 368 100 L 380 120 L 392 142 L 404 164 L 416 182 L 428 196 L 440 206 L 452 212 L 464 216 L 476 220 L 488 225 L 500 231 L 512 238 L 524 246 L 536 254 L 548 262 L 560 270 L 572 278 L 584 286 L 596 293"/>
  </g>
  <g stroke="#c0392b" stroke-width="2.4" fill="none">
    <path d="M 80 271 L 92 267 L 104 263 L 116 258 L 128 253 L 140 247 L 152 241 L 164 234 L 176 226 L 188 216 L 200 205 L 212 192 L 224 177 L 236 160 L 248 141 L 260 122 L 272 104 L 284 88 L 296 74 L 308 65 L 320 61 L 332 65 L 344 74 L 356 88 L 368 104 L 380 122 L 392 141 L 404 160 L 416 177 L 428 192 L 440 205 L 452 216 L 464 226 L 476 234 L 488 241 L 500 247 L 512 253 L 524 258 L 536 263 L 548 267 L 560 271 L 572 275 L 584 279 L 596 283"/>
  </g>
</svg>
