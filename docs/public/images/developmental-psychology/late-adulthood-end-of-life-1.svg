<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>埃里克森毕生发展八阶段示意图</title>
  <desc>八个阶段按年龄排列，每格标注危机与对应的正向品质</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333">埃里克森的心理社会八阶段</text>
  <g font-size="13">
    <rect x="20"  y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="57" y="90" text-anchor="middle" fill="#1f6f8b">信任对不信任</text>
    <text x="57" y="110" text-anchor="middle" fill="#333">希望</text>
    <text x="57" y="146" text-anchor="middle" fill="#555">0–1 岁</text>
    <rect x="97"  y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="134" y="90" text-anchor="middle" fill="#1f6f8b">自主对羞怯</text>
    <text x="134" y="110" text-anchor="middle" fill="#333">意志</text>
    <text x="134" y="146" text-anchor="middle" fill="#555">1–3 岁</text>
    <rect x="174" y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="211" y="90" text-anchor="middle" fill="#1f6f8b">主动对内疚</text>
    <text x="211" y="110" text-anchor="middle" fill="#333">目的</text>
    <text x="211" y="146" text-anchor="middle" fill="#555">3–6 岁</text>
    <rect x="251" y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="288" y="90" text-anchor="middle" fill="#1f6f8b">勤奋对自卑</text>
    <text x="288" y="110" text-anchor="middle" fill="#333">胜任</text>
    <text x="288" y="146" text-anchor="middle" fill="#555">6–11 岁</text>
    <rect x="328" y="70" width="75" height="90" fill="#c0392b" opacity="0.16" stroke="#c0392b" stroke-width="1.5"/>
    <text x="365" y="90" text-anchor="middle" fill="#c0392b">同一性对混乱</text>
    <text x="365" y="110" text-anchor="middle" fill="#333">忠诚</text>
    <text x="365" y="146" text-anchor="middle" fill="#555">12–18 岁</text>
    <rect x="405" y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="442" y="90" text-anchor="middle" fill="#1f6f8b">亲密对孤立</text>
    <text x="442" y="110" text-anchor="middle" fill="#333">爱</text>
    <text x="442" y="146" text-anchor="middle" fill="#555">18–40 岁</text>
    <rect x="482" y="70" width="75" height="90" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="519" y="90" text-anchor="middle" fill="#1f6f8b">繁衍对停滞</text>
    <text x="519" y="110" text-anchor="middle" fill="#333">关怀</text>
    <text x="519" y="146" text-anchor="middle" fill="#555">40–65 岁</text>
    <rect x="559" y="70" width="61" height="90" fill="#c0392b" opacity="0.16" stroke="#c0392b" stroke-width="1.5"/>
    <text x="589" y="90" text-anchor="middle" fill="#c0392b">自我整合对绝望</text>
    <text x="589" y="110" text-anchor="middle" fill="#333">智慧</text>
    <text x="589" y="146" text-anchor="middle" fill="#555">65+</text>
  </g>
  <text x="320" y="210" text-anchor="middle" font-size="14" fill="#333">每一站都有「危机」：不是灾难，而是转折——</text>
  <text x="320" y="236" text-anchor="middle" font-size="14" fill="#333">解决得当，获得一种正向品质（希望、意志、目的、胜任……）</text>
  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#555">前站的品质是后站的原料：信任→自主→主动→勤奋→同一性→亲密→繁衍→智慧</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#555">八阶段贯穿毕生：老年期不是尾声，而是最后一场「危机」的舞台</text>
</svg>
