<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>布朗芬布伦纳生态系统理论示意图</title>
  <desc>由内向外五层嵌套圆：个体、微系统、中间系统、外系统、宏系统，外圈标注时间系统</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <circle cx="320" cy="210" r="52" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <text x="320" y="204" text-anchor="middle" font-size="16" fill="#333">个体</text>
  <text x="320" y="226" text-anchor="middle" font-size="13" fill="#555">年龄·气质·基因</text>
  <circle cx="320" cy="210" r="108" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="320" y="84" text-anchor="middle" font-size="14" fill="#1f6f8b">微系统</text>
  <text x="230" y="200" text-anchor="middle" font-size="13" fill="#333">家庭</text>
  <text x="410" y="200" text-anchor="middle" font-size="13" fill="#333">同伴</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#333">教室·学校</text>
  <circle cx="320" cy="210" r="168" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" font-size="14" fill="#333">中间系统（微系统间的关系）</text>
  <circle cx="320" cy="210" r="228" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="84" y="214" text-anchor="middle" font-size="13" fill="#333">外系统</text>
  <text x="70" y="240" text-anchor="middle" font-size="12" fill="#555">父母工作单位</text>
  <text x="556" y="240" text-anchor="middle" font-size="12" fill="#555">社区服务</text>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#555">大众传媒</text>
  <circle cx="320" cy="210" r="288" fill="#faf9f5" stroke="#c0392b" stroke-width="2.5"/>
  <text x="320" y="38" text-anchor="middle" font-size="14" fill="#c0392b">宏系统：文化·价值观·社会结构</text>
  <text x="320" y="400" text-anchor="middle" font-size="14" fill="#555">时间系统（chronosystem）：人生事件 · 历史时代</text>
</svg>
