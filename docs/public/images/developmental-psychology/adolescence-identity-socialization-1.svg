<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Marcia 同一性地位的四象限图</title>
  <desc>以探索（危机）为横轴、投入（承诺）为纵轴，四象限分别对应同一性扩散、早闭、延期偿付、同一性达成</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333">Marcia 同一性地位：探索 × 投入</text>
  <line x1="120" y1="330" x2="540" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="330" x2="120" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="330" x2="330" y2="90" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="120" y1="210" x2="540" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="330" y="356" text-anchor="middle" font-size="14" fill="#333">探索（危机）→</text>
  <text x="330" y="68" text-anchor="middle" font-size="14" fill="#333">投入（承诺）→</text>
  <text x="225" y="150" text-anchor="middle" font-size="15" fill="#1f6f8b">同一性早闭</text>
  <text x="225" y="172" text-anchor="middle" font-size="13" fill="#555">Foreclosure</text>
  <text x="225" y="194" text-anchor="middle" font-size="12" fill="#777">低探索 · 高承诺</text>
  <text x="435" y="150" text-anchor="middle" font-size="15" fill="#c0392b">同一性达成</text>
  <text x="435" y="172" text-anchor="middle" font-size="13" fill="#555">Achievement</text>
  <text x="435" y="194" text-anchor="middle" font-size="12" fill="#777">高探索 · 高承诺</text>
  <text x="225" y="282" text-anchor="middle" font-size="15" fill="#555">同一性扩散</text>
  <text x="225" y="304" text-anchor="middle" font-size="13" fill="#555">Diffusion</text>
  <text x="225" y="326" text-anchor="middle" font-size="12" fill="#777">低探索 · 低承诺</text>
  <text x="435" y="282" text-anchor="middle" font-size="15" fill="#1f6f8b">延期偿付</text>
  <text x="435" y="304" text-anchor="middle" font-size="13" fill="#555">Moratorium</text>
  <text x="435" y="326" text-anchor="middle" font-size="12" fill="#777">高探索 · 低承诺</text>
  <text x="435" y="70" text-anchor="middle" font-size="12" fill="#777">（探索中的「危机」状态）</text>
</svg>
