<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="sans-serif">
  <title>FedAvg 一轮通信的架构示意</title>
  <desc>中央服务器下发当前模型 w_t 给部分客户端；每个客户端在本地数据上训练 E 轮得到 w_{t+1}^k 后上传；服务器按样本数加权平均得到新模型 w_{t+1}。</desc>
  <rect width="800" height="440" fill="#faf9f5"/>
  <!-- 服务器 -->
  <circle cx="400" cy="86" r="46" fill="#1f6f8b" stroke="#333" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" fill="#fff" font-size="15">中央服务器</text>
  <text x="400" y="102" text-anchor="middle" fill="#fff" font-size="13">w_{t+1}</text>
  <!-- 四个客户端 -->
  <g>
    <rect x="60" y="320" width="140" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="130" y="346" text-anchor="middle" font-size="14" fill="#333">客户端 1</text>
    <text x="130" y="368" text-anchor="middle" font-size="12" fill="#1f6f8b">本地数据 D_1</text>
    <text x="130" y="386" text-anchor="middle" font-size="12" fill="#1f6f8b">本地 SGD E 轮</text>
  </g>
  <g>
    <rect x="248" y="320" width="140" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="318" y="346" text-anchor="middle" font-size="14" fill="#333">客户端 2</text>
    <text x="318" y="368" text-anchor="middle" font-size="12" fill="#1f6f8b">本地数据 D_2</text>
    <text x="318" y="386" text-anchor="middle" font-size="12" fill="#1f6f8b">本地 SGD E 轮</text>
  </g>
  <g>
    <rect x="436" y="320" width="140" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="506" y="346" text-anchor="middle" font-size="14" fill="#333">客户端 3</text>
    <text x="506" y="368" text-anchor="middle" font-size="12" fill="#1f6f8b">本地数据 D_3</text>
    <text x="506" y="386" text-anchor="middle" font-size="12" fill="#1f6f8b">本地 SGD E 轮</text>
  </g>
  <g>
    <rect x="624" y="320" width="140" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="694" y="346" text-anchor="middle" font-size="14" fill="#333">客户端 4</text>
    <text x="694" y="368" text-anchor="middle" font-size="12" fill="#1f6f8b">本地数据 D_4</text>
    <text x="694" y="386" text-anchor="middle" font-size="12" fill="#1f6f8b">本地 SGD E 轮</text>
  </g>
  <!-- 下发 w_t：红虚线 -->
  <path d="M400 132 L130 320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <path d="M400 132 L318 320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <path d="M400 132 L506 320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <path d="M400 132 L694 320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <!-- 上传 w_{t+1}^k：青实线 -->
  <path d="M146 320 L384 142" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M334 320 L392 142" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M522 320 L408 142" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M710 320 L416 142" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <!-- 标注 -->
  <text x="250" y="196" text-anchor="middle" font-size="15" fill="#c0392b">下发当前模型 w_t</text>
  <text x="560" y="220" text-anchor="middle" font-size="15" fill="#1f6f8b">上传本地模型 w_{t+1}^k</text>
  <text x="560" y="250" text-anchor="middle" font-size="13" fill="#333">（数据不出本地）</text>
  <text x="400" y="436" text-anchor="middle" font-size="14" fill="#333">w_{t+1} = Σ_k (n_k / n) · w_{t+1}^k —— 样本数加权平均</text>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
