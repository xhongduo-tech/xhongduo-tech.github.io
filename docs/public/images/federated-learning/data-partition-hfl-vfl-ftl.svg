<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif">
  <title>横向联邦、纵向联邦与联邦迁移的数据切分示意</title>
  <desc>左：横向联邦，两家特征列相同、样本行不同；中：纵向联邦，样本行相同、特征列互补；右：联邦迁移，样本与特征重叠都小，靠重叠子集迁移知识。</desc>
  <rect width="900" height="470" fill="#faf9f5"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" fill="#333">三种联邦学习的数据切分（行 = 样本，列 = 特征）</text>

  <!-- 横向联邦 -->
  <text x="165" y="66" text-anchor="middle" font-size="16" fill="#1f6f8b">横向联邦 HFL</text>
  <text x="165" y="84" text-anchor="middle" font-size="13" fill="#333">特征列相同，样本行不同</text>
  <g font-size="12" text-anchor="middle" fill="#333">
    <rect x="30" y="100" width="270" height="150" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="30" y="100" width="90" height="150" fill="#e8f1f4" stroke="#333" stroke-width="1.5"/>
    <text x="75" y="120">特征A</text>
    <rect x="120" y="100" width="90" height="150" fill="#e8f1f4" stroke="#333" stroke-width="1.5"/>
    <text x="165" y="120">特征B</text>
    <rect x="210" y="100" width="90" height="150" fill="#e8f1f4" stroke="#333" stroke-width="1.5"/>
    <text x="255" y="120">标签</text>
    <text x="165" y="145" fill="#c0392b">银行甲的客户</text>
    <line x1="40" y1="160" x2="290" y2="160" stroke="#c0392b" stroke-width="1"/>
    <text x="165" y="180" fill="#1f6f8b">银行乙的客户</text>
    <line x1="40" y1="195" x2="290" y2="195" stroke="#1f6f8b" stroke-width="1"/>
    <text x="165" y="215" fill="#1f6f8b">银行丙的客户</text>
    <line x1="40" y1="230" x2="290" y2="230" stroke="#1f6f8b" stroke-width="1"/>
  </g>

  <!-- 纵向联邦 -->
  <text x="450" y="66" text-anchor="middle" font-size="16" fill="#c0392b">纵向联邦 VFL</text>
  <text x="450" y="84" text-anchor="middle" font-size="13" fill="#333">样本行相同，特征列互补</text>
  <g font-size="12" text-anchor="middle" fill="#333">
    <rect x="315" y="100" width="270" height="150" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="315" y="100" width="135" height="150" fill="#e8f1f4" stroke="#333" stroke-width="1.5"/>
    <text x="382" y="120">银行特征</text>
    <rect x="450" y="100" width="135" height="150" fill="#f4e8e8" stroke="#333" stroke-width="1.5"/>
    <text x="517" y="120">电商特征</text>
    <text x="420" y="150" fill="#c0392b">用户1</text>
    <line x1="325" y1="165" x2="575" y2="165" stroke="#c0392b" stroke-width="1"/>
    <text x="420" y="185" fill="#c0392b">用户2</text>
    <line x1="325" y1="200" x2="575" y2="200" stroke="#c0392b" stroke-width="1"/>
    <text x="420" y="220" fill="#c0392b">用户3</text>
    <line x1="325" y1="235" x2="575" y2="235" stroke="#c0392b" stroke-width="1"/>
  </g>

  <!-- 联邦迁移 -->
  <text x="735" y="66" text-anchor="middle" font-size="16" fill="#333">联邦迁移 FTL</text>
  <text x="735" y="84" text-anchor="middle" font-size="13" fill="#333">样本与特征都不同，少量重叠</text>
  <g font-size="12" text-anchor="middle" fill="#333">
    <rect x="620" y="100" width="120" height="150" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="680" y="120">A 方（源域）</text>
    <line x1="630" y1="145" x2="730" y2="145" stroke="#c0392b" stroke-width="1"/>
    <line x1="630" y1="175" x2="730" y2="175" stroke="#c0392b" stroke-width="1"/>
    <rect x="750" y="100" width="120" height="150" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="810" y="120">B 方（目标域）</text>
    <line x1="760" y1="145" x2="860" y2="145" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="760" y1="175" x2="860" y2="175" stroke="#1f6f8b" stroke-width="1"/>
    <rect x="670" y="150" width="130" height="50" rx="6" fill="#faf0f0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="735" y="175">重叠子集</text>
    <text x="735" y="192" font-size="11">（知识迁移桥梁）</text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="14" fill="#333">判定口诀：同列（特征）看样本 → 横向；同行（样本）看特征 → 纵向；都不重合 → 迁移</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#1f6f8b">HFL：X 相同、I 不同</text>
  <text x="450" y="382" text-anchor="middle" font-size="13" fill="#c0392b">VFL：I 相同、X 不同</text>
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#333">FTL：I 与 X 都不同</text>
</svg>
