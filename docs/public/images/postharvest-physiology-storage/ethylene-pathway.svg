<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>乙烯生物合成途径（Yang 循环）与作用位点</title>
  <desc>蛋氨酸经 SAM 合成酶生成 SAM，再经 ACC 合成酶生成 ACC，最后经 ACC 氧化酶生成乙烯；1-MCP 作用于乙烯受体，AVG/AOA 抑制 ACC 合成酶。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">乙烯生物合成途径（Yang 循环）</text>

  <!-- 主链 -->
  <rect x="40" y="90" width="130" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="15" fill="#333">蛋氨酸 Met</text>

  <rect x="250" y="90" width="130" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="315" y="118" text-anchor="middle" font-size="15" fill="#333">SAM</text>

  <rect x="460" y="90" width="140" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="118" text-anchor="middle" font-size="15" fill="#333">ACC</text>

  <!-- 乙烯 -->
  <rect x="255" y="220" width="130" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="248" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">乙烯 C₂H₄</text>

  <!-- 箭头：主链 -->
  <line x1="170" y1="114" x2="248" y2="114" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="209" y="78" text-anchor="middle" font-size="13" fill="#1f6f8b">SAM 合成酶</text>

  <line x1="380" y1="114" x2="458" y2="114" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="419" y="78" text-anchor="middle" font-size="13" fill="#1f6f8b">ACC 合成酶 ACS</text>

  <line x1="530" y1="140" x2="340" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="452" y="178" text-anchor="middle" font-size="13" fill="#1f6f8b">ACC 氧化酶 ACO</text>

  <!-- Yang 循环回环 -->
  <path d="M 105 138 L 105 300 L 300 300 L 315 248" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="60" y="285" font-size="12" fill="#999">MTA → MTR → Met（蛋氨酸循环再生）</text>

  <!-- 受体与 1-MCP -->
  <rect x="120" y="330" width="400" height="66" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">乙烯受体（细胞膜）</text>
  <text x="320" y="378" text-anchor="middle" font-size="13" fill="#333">1-MCP 抢先占据受体 → 乙烯信号无法传导</text>

  <line x1="320" y1="270" x2="320" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 抑制剂 -->
  <rect x="250" y="20" width="140" height="28" rx="14" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="320" y="39" text-anchor="middle" font-size="13" fill="#1f6f8b">AVG / AOA：抑制 ACS</text>

  <line x1="320" y1="48" x2="320" y2="88" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrb)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
