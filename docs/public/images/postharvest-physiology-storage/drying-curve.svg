<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>热风干燥曲线：含水率随时间的变化</title>
  <desc>干燥过程分为预热段、恒速干燥段与降速干燥段，含水率最终趋于平衡含水率。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">热风干燥曲线（干基含水率 vs 时间）</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="370" x2="610" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrx)"/>
  <line x1="70" y1="370" x2="70" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arry)"/>
  <text x="612" y="390" font-size="14" fill="#333">时间 t</text>
  <text x="34" y="50" font-size="14" fill="#333" transform="rotate(-90 34 50)">含水率 W</text>

  <!-- 平衡含水率虚线 -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="470" y="292" font-size="13" fill="#999">平衡含水率 W_e</text>

  <!-- 干燥曲线：预热+恒速+降速 -->
  <path d="M 70 60 L 130 60 L 240 120 L 420 260 L 540 300 L 595 302" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrc)"/>

  <!-- 区段标注 -->
  <line x1="130" y1="55" x2="130" y2="375" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="115" x2="240" y2="375" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="255" x2="420" y2="375" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="100" y="400" text-anchor="middle" font-size="13" fill="#333">预热段</text>
  <text x="185" y="400" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">恒速段</text>
  <text x="330" y="400" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">降速段</text>
  <text x="505" y="400" text-anchor="middle" font-size="13" fill="#333">平衡段</text>

  <!-- 恒速段注记 -->
  <line x1="130" y1="60" x2="240" y2="120" stroke="none"/>
  <text x="180" y="90" text-anchor="middle" font-size="13" fill="#1f6f8b">表面水分蒸发为主，速率恒定</text>
  <text x="330" y="235" text-anchor="middle" font-size="13" fill="#1f6f8b">内部水分扩散为主，速率下降</text>

  <defs>
    <marker id="arrx" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
