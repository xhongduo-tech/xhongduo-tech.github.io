<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="sans-serif">
  <title>奖赏环路（多巴胺通路）示意图</title>
  <desc>腹侧被盖区（VTA）向伏隔核（NAc）与前额叶皮层（PFC）投射多巴胺，构成奖赏环路的三个核心站点。</desc>
  <rect width="800" height="600" fill="#faf9f5"/>
  <text x="400" y="44" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">奖赏环路：VTA → NAc → PFC</text>
  <text x="400" y="72" text-anchor="middle" font-size="14" fill="#666">成瘾性物质通过抬高多巴胺信号劫持这条环路</text>

  <!-- PFC -->
  <rect x="280" y="100" width="240" height="86" rx="14" fill="#1f6f8b" opacity="0.14"/>
  <rect x="280" y="100" width="240" height="86" rx="14" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="400" y="136" text-anchor="middle" font-size="18" fill="#1f6f8b" font-weight="bold">前额叶皮层 PFC</text>
  <text x="400" y="160" text-anchor="middle" font-size="14" fill="#333">决策 · 预期 · 冲动控制</text>
  <text x="400" y="178" text-anchor="middle" font-size="13" fill="#666">抑制控制受损 → 强迫性使用</text>

  <!-- NAc -->
  <rect x="220" y="270" width="240" height="86" rx="14" fill="#c0392b" opacity="0.12"/>
  <rect x="220" y="270" width="240" height="86" rx="14" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="340" y="306" text-anchor="middle" font-size="18" fill="#c0392b" font-weight="bold">伏隔核 NAc</text>
  <text x="340" y="330" text-anchor="middle" font-size="14" fill="#333">奖赏整合中枢</text>
  <text x="340" y="348" text-anchor="middle" font-size="13" fill="#666">多巴胺信号被药物放大</text>

  <!-- VTA -->
  <rect x="280" y="440" width="240" height="86" rx="14" fill="#1f6f8b" opacity="0.14"/>
  <rect x="280" y="440" width="240" height="86" rx="14" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="400" y="476" text-anchor="middle" font-size="18" fill="#1f6f8b" font-weight="bold">腹侧被盖区 VTA</text>
  <text x="400" y="500" text-anchor="middle" font-size="14" fill="#333">多巴胺神经元胞体聚集地</text>
  <text x="400" y="518" text-anchor="middle" font-size="13" fill="#666">奖赏环路的起点</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- VTA -> NAc (dopamine, up) -->
  <path d="M400 438 L400 360" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="452" y="404" font-size="14" fill="#c0392b">多巴胺 ↑</text>

  <!-- NAc -> PFC (up) -->
  <path d="M400 268 L400 192" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="452" y="236" font-size="14" fill="#c0392b">信号上传</text>

  <!-- PFC -> VTA (feedback, dashed) -->
  <path d="M285 145 C150 180 150 360 285 445" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowDown)"/>
  <text x="120" y="300" font-size="14" fill="#1f6f8b" transform="rotate(-90 120 300)">谷氨酸反馈回路（抑制失控）</text>

  <!-- Legend -->
  <rect x="560" y="240" width="210" height="120" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="570" y="266" font-size="15" fill="#333" font-weight="bold">图例</text>
  <circle cx="582" cy="292" r="6" fill="#c0392b"/>
  <text x="598" y="296" font-size="14" fill="#333">兴奋/奖赏投射</text>
  <line x1="576" y1="324" x2="588" y2="324" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="598" y="328" font-size="14" fill="#333">反馈/调控投射</text>
  <text x="570" y="352" font-size="13" fill="#666">药物抬升多巴胺 →</text>
  <text x="570" y="370" font-size="13" fill="#666">奖赏预测误差信号失真</text>
</svg>
