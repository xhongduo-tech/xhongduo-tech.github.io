<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif">
  <title>实数轴到圆周的万有覆盖</title>
  <desc>正弦曲线表示实数轴 R 作为圆周的万有覆盖：多个不同的实数点投影到同一个圆周点，覆盖映射为 p(t)=e^(2πit)。</desc>
  <rect width="640" height="320" fill="#faf9f5"/>
  <text x="40" y="36" font-size="15" fill="#333">R（实数轴，万有覆盖）</text>
  <text x="40" y="56" font-size="13" fill="#1f6f8b">p(t) = e^{2π i t}</text>
  <polyline points="40,96 60,113 80,117 100,106 120,86 140,75 160,79 180,96 200,113 220,117 240,106 260,86 280,75 300,79 320,96 340,113 360,117 380,106 400,86 420,75 440,79 460,96 480,113 500,117 520,106 540,86 560,75 580,79 600,96"
    fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="320" cy="240" r="55" fill="none" stroke="#333" stroke-width="2"/>
  <text x="360" y="272" font-size="14" fill="#333">S¹（底空间）</text>
  <line x1="80" y1="117" x2="320" y2="185" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="220" y1="117" x2="320" y2="185" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="360" y1="117" x2="320" y2="185" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <circle cx="80" cy="117" r="4.5" fill="#c0392b"/>
  <circle cx="220" cy="117" r="4.5" fill="#c0392b"/>
  <circle cx="360" cy="117" r="4.5" fill="#c0392b"/>
  <text x="76" y="108" font-size="13" fill="#c0392b">t</text>
  <text x="214" y="108" font-size="13" fill="#c0392b">t+1</text>
  <text x="354" y="108" font-size="13" fill="#c0392b">t+2</text>
  <circle cx="320" cy="185" r="5" fill="#c0392b"/>
  <text x="48" y="196" font-size="13" fill="#c0392b">p(t) = p(t+1) = p(t+2)</text>
  <text x="48" y="300" font-size="13" fill="#333">每个底点上方都有无穷多个实数点——这是「无穷层覆盖」的侧视图。</text>
</svg>
