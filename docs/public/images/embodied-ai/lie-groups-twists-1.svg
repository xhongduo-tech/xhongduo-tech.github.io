<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">旋量的指数映射：绕螺旋轴转动 θ 同时沿轴平移 hθ</title>
  <desc id="desc">运动旋量 ξ̂ 的指数映射 exp(ξ̂ θ) 产生一条螺旋运动：刚体一边绕螺旋轴（图中灰色竖直虚线）转动角度 θ，一边沿该轴平移 hθ，其中 h 是螺旋的螺距。图中青色曲线是螺旋运动的轨迹投影，右侧标出了螺距 h。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker>
  </defs>

  <text x="400" y="40" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">exp(ξ̂ θ)：绕螺旋轴转 θ，同时沿轴平移 hθ</text>

  <!-- 螺旋轴 -->
  <line x1="400" y1="70" x2="400" y2="480" stroke="#888" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="416" y="88" font-size="15" fill="#333">螺旋轴（ξ̂ 的转轴方向）</text>

  <!-- 螺旋轨迹（两个螺距，青色） -->
  <polyline fill="none" stroke="#1f6f8b" stroke-width="2.6" stroke-linejoin="round" points="400.0,460.0 407.5,457.8 414.9,455.5 422.2,453.2 429.4,451.0 436.4,448.8 443.1,446.5 449.6,444.2 455.8,442.0 461.7,439.8 467.2,437.5 472.2,435.2 476.9,433.0 481.0,430.8 484.6,428.5 487.8,426.2 490.4,424.0 492.4,421.8 493.8,419.5 494.7,417.2 495.0,415.0 494.7,412.8 493.8,410.5 492.4,408.2 490.4,406.0 487.8,403.8 484.6,401.5 481.0,399.2 476.9,397.0 472.2,394.8 467.2,392.5 461.7,390.2 455.8,388.0 449.6,385.8 443.1,383.5 436.4,381.2 429.4,379.0 422.2,376.8 414.9,374.5 407.5,372.2 400.0,370.0 392.5,367.8 385.1,365.5 377.8,363.2 370.6,361.0 363.6,358.8 356.9,356.5 350.4,354.2 344.2,352.0 338.3,349.8 332.8,347.5 327.8,345.2 323.1,343.0 319.0,340.8 315.4,338.5 312.2,336.2 309.6,334.0 307.6,331.8 306.2,329.5 305.3,327.2 305.0,325.0 305.3,322.8 306.2,320.5 307.6,318.2 309.6,316.0 312.2,313.8 315.4,311.5 319.0,309.2 323.1,307.0 327.8,304.8 332.8,302.5 338.3,300.2 344.2,298.0 350.4,295.8 356.9,293.5 363.6,291.2 370.6,289.0 377.8,286.8 385.1,284.5 392.5,282.2 400.0,280.0 407.5,277.8 414.9,275.5 422.2,273.2 429.4,271.0 436.4,268.8 443.1,266.5 449.6,264.2 455.8,262.0 461.7,259.8 467.2,257.5 472.2,255.2 476.9,253.0 481.0,250.7 484.6,248.5 487.8,246.2 490.4,244.0 492.4,241.8 493.8,239.5 494.7,237.2 495.0,235.0 494.7,232.8 493.8,230.5 492.4,228.2 490.4,226.0 487.8,223.8 484.6,221.5 481.0,219.3 476.9,217.0 472.2,214.8 467.2,212.5 461.7,210.2 455.8,208.0 449.6,205.7 443.1,203.5 436.4,201.2 429.4,199.0 422.2,196.8 414.9,194.5 407.5,192.2 400.0,190.0 392.5,187.8 385.1,185.5 377.8,183.2 370.6,181.0 363.6,178.8 356.9,176.5 350.4,174.2 344.2,172.0 338.3,169.8 332.8,167.5 327.8,165.2 323.1,163.0 319.0,160.8 315.4,158.5 312.2,156.2 309.6,154.0 307.6,151.8 306.2,149.5 305.3,147.2 305.0,145.0 305.3,142.8 306.2,140.5 307.6,138.2 309.6,136.0 312.2,133.8 315.4,131.5 319.0,129.2 323.1,127.0 327.8,124.8 332.8,122.5 338.3,120.2 344.2,118.0 350.4,115.8 356.9,113.5 363.6,111.2 370.6,109.0 377.8,106.8 385.1,104.5 392.5,102.2 400.0,100.0"/>

  <!-- 方向箭头（在轨迹中段） -->
  <g stroke="#1f6f8b" stroke-width="3" fill="none">
    <line x1="312.2" y1="313.8" x2="322" y2="313" stroke-width="3.4"/>
    <line x1="322" y1="313" x2="318" y2="306"/>
  </g>

  <!-- 螺距标注（右侧） -->
  <line x1="620" y1="145" x2="620" y2="325" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="608" y1="145" x2="632" y2="145" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="608" y1="325" x2="632" y2="325" stroke="#c0392b" stroke-width="1.8"/>
  <path d="M 615 230 L 620 235 L 625 230" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="640" y="240" font-size="16" fill="#c0392b">螺距 h</text>

  <!-- 转角 θ 标注（底部横截面） -->
  <circle cx="400" cy="435" r="72" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 400 363 A 72 72 0 0 1 466 403" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <text x="430" y="378" font-size="15" fill="#c0392b">θ</text>

  <text x="400" y="502" font-size="15" fill="#555" text-anchor="middle">螺距 h = ω·v / ‖ω‖：转一整圈（2π）时沿轴前进的距离 h·2π。ω=0 时退化为纯平移；v=0 时退化为纯旋转。</text>
</svg>
