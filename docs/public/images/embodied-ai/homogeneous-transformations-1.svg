<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">齐次变换矩阵的几何：坐标系 {B} 相对 {A} 平移又旋转</title>
  <desc id="desc">参考坐标系 {A} 与体坐标系 {B}。{B} 的原点相对 {A} 平移了向量 ^A_p_B，姿态相差旋转矩阵 ^A_B R。空间中的点 P 在 {B} 中读出的坐标是 ^B_P，在 {A} 中读出的坐标是 ^A_P，满足向量关系 ^A_P = ^A_B R ^B_P + ^A_p_B；写成 4×4 齐次矩阵即一次矩阵乘法。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker>
  </defs>

  <text x="400" y="40" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">同一个点 P：换一个坐标系读出，数字就不同</text>

  <!-- ============ 参考系 {A} ============ -->
  <g>
    <line x1="170" y1="400" x2="330" y2="400" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)"/>
    <line x1="170" y1="400" x2="170" y2="250" stroke="#1f6f8b" stroke-width="2.4" marker-end="url(#at)"/>
    <line x1="170" y1="400" x2="205" y2="365" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
    <text x="336" y="405" font-size="15" fill="#c0392b">X_A</text>
    <text x="173" y="242" font-size="15" fill="#1f6f8b">Y_A</text>
    <text x="212" y="368" font-size="15" fill="#888">Z_A</text>
    <text x="128" y="428" font-size="15" fill="#333">参考系 {A}</text>
  </g>

  <!-- ============ 体坐标系 {B} ============ -->
  <g>
    <line x1="460" y1="270" x2="538" y2="225" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)"/>
    <line x1="460" y1="270" x2="415" y2="192" stroke="#1f6f8b" stroke-width="2.4" marker-end="url(#at)"/>
    <circle cx="460" cy="270" r="8" fill="none" stroke="#888" stroke-width="1.4"/>
    <circle cx="460" cy="270" r="2.2" fill="#888"/>
    <text x="545" y="220" font-size="15" fill="#c0392b">X_B</text>
    <text x="408" y="186" font-size="15" fill="#1f6f8b">Y_B</text>
    <text x="473" y="262" font-size="15" fill="#888">Z_B ⊙</text>
    <text x="462" y="300" font-size="15" fill="#333">体坐标系 {B}</text>
  </g>

  <!-- ============ 点 P 与三个矢量 ============ -->
  <g>
    <rect x="606" y="346" width="8" height="8" fill="#333"/>
    <text x="620" y="342" font-size="15" fill="#333">点 P</text>

    <!-- 平移矢量 ^A_p_B -->
    <line x1="170" y1="400" x2="460" y2="270" stroke="#888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ag)"/>
    <text x="268" y="352" font-size="15" fill="#888">^A_p_B（平移）</text>

    <!-- ^B_P -->
    <line x1="460" y1="270" x2="610" y2="350" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#at)"/>
    <text x="505" y="325" font-size="15" fill="#1f6f8b">^B_P（在 B 中读出）</text>

    <!-- ^A_P -->
    <line x1="170" y1="400" x2="610" y2="350" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar)"/>
    <text x="352" y="404" font-size="15" fill="#c0392b">^A_P（在 A 中读出）</text>
  </g>

  <!-- 底部公式框 -->
  <rect x="90" y="440" width="620" height="44" rx="8" fill="#faf9f5" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="468" font-size="17" fill="#333" text-anchor="middle">向量形式：^A_P = ^A_B R · ^B_P + ^A_p_B　·　齐次形式：[^A_P, 1]ᵀ = ^A_B T · [^B_P, 1]ᵀ</text>
</svg>
