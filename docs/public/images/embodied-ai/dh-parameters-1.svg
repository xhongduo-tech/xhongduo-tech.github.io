<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">平面两连杆机械臂：关节角 θ 与杆长 a 是 D-H 表里最常见的两个参数</title>
  <desc id="desc">一个平面两连杆机械臂，基座固定，关节 1 与关节 2 都是转动关节，转轴 z 垂直于纸面（用 ⊙ 表示）。杆 1 长度 a_1，杆 2 长度 a_2，关节角 θ_1 与 θ_2。对平面臂，D-H 表中 α=0、d=0，只有 a 与 θ 非零。末端位姿由正运动学 T_0^2 = T_0^1 T_1^2 给出。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker>
  </defs>

  <text x="400" y="40" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">平面两连杆机械臂：关节角 θ 与杆长 a</text>

  <!-- 地面与基座 -->
  <line x1="140" y1="470" x2="660" y2="470" stroke="#999" stroke-width="2"/>
  <polygon points="250,470 310,470 300,430 260,430" fill="#e8e4dc" stroke="#999" stroke-width="1.4"/>
  <text x="280" y="420" font-size="14" fill="#333">基座</text>

  <!-- 杆 1 -->
  <line x1="280" y1="430" x2="470" y2="310" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <text x="350" y="408" font-size="16" fill="#333">杆 1（a_1）</text>

  <!-- 杆 2 -->
  <line x1="470" y1="310" x2="610" y2="210" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <text x="552" y="296" font-size="16" fill="#333">杆 2（a_2）</text>

  <!-- 关节 1 -->
  <circle cx="280" cy="430" r="12" fill="#faf9f5" stroke="#333" stroke-width="2.4"/>
  <circle cx="280" cy="430" r="3.5" fill="#333"/>
  <text x="292" y="452" font-size="15" fill="#333">关节 1 ⊙ z_1</text>

  <!-- 关节 2 -->
  <circle cx="470" cy="310" r="12" fill="#faf9f5" stroke="#333" stroke-width="2.4"/>
  <circle cx="470" cy="310" r="3.5" fill="#333"/>
  <text x="482" y="332" font-size="15" fill="#333">关节 2 ⊙ z_2</text>

  <!-- 末端 -->
  <rect x="604" y="200" width="14" height="14" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="614" y="196" font-size="15" fill="#333">末端</text>

  <!-- 坐标轴 x_0, x_1, x_2 -->
  <line x1="280" y1="430" x2="360" y2="430" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="345" y="446" font-size="14" fill="#c0392b">x_0</text>
  <line x1="470" y1="310" x2="536" y2="258" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="522" y="252" font-size="14" fill="#c0392b">x_1</text>
  <line x1="610" y1="210" x2="656" y2="180" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#at)"/>
  <text x="640" y="178" font-size="14" fill="#1f6f8b">x_2</text>

  <!-- θ_1 弧 -->
  <path d="M 305 430 A 25 25 0 0 0 296 447" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="300" y="462" font-size="15" fill="#1f6f8b">θ_1</text>

  <!-- θ_2 弧 -->
  <path d="M 472 288 A 22 22 0 0 1 489 302" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="496" y="292" font-size="15" fill="#1f6f8b">θ_2</text>

  <!-- 底部公式与 D-H 表 -->
  <rect x="70" y="478" width="660" height="34" rx="8" fill="#faf9f5" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="500" font-size="16" fill="#333" text-anchor="middle">D-H 表：α=0，d=0，a=a_1,a_2，θ=θ_1,θ_2　·　正运动学：T_0^2 = T_0^1 T_1^2</text>
</svg>
