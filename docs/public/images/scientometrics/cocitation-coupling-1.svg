<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif">
  <title>文献耦合与共引的对比示意</title>
  <desc>左图：两篇论文共享参考文献（向后看），耦合强度等于共同参考文献数；右图：两篇论文被后续文献共同引用（向前看），共引强度等于共同施引文献数。</desc>
  <rect width="780" height="430" fill="#faf9f5"/>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a8378"/>
    </marker>
  </defs>
  <style>
    .paper{fill:#1f6f8b;stroke:#14505f;stroke-width:2}
    .ref{fill:#f6f3ec;stroke:#8a8378;stroke-width:1.5}
    .shared{stroke:#c0392b;stroke-width:3}
    .edge{stroke:#8a8378;stroke-width:1.5;marker-end:url(#arrowC)}
    .lbl{fill:#333;font-size:15px}
    .note{fill:#555;font-size:14px}
    .head{fill:#333;font-size:18px;font-weight:bold}
  </style>

  <!-- 左图：文献耦合 -->
  <text x="180" y="36" text-anchor="middle" class="head">文献耦合（向后看）</text>
  <circle cx="90" cy="95" r="26" class="paper"/>
  <text x="90" y="100" text-anchor="middle" class="lbl">A</text>
  <circle cx="270" cy="95" r="26" class="paper"/>
  <text x="270" y="100" text-anchor="middle" class="lbl">B</text>
  <circle cx="60" cy="330" r="22" class="ref"/>
  <text x="60" y="335" text-anchor="middle" class="lbl">R1</text>
  <circle cx="150" cy="360" r="22" class="ref shared"/>
  <text x="150" y="365" text-anchor="middle" class="lbl">R2</text>
  <circle cx="250" cy="330" r="22" class="ref shared"/>
  <text x="250" y="335" text-anchor="middle" class="lbl">R3</text>
  <line x1="95" y1="119" x2="66" y2="306" class="edge"/>
  <line x1="108" y1="116" x2="146" y2="338" class="edge"/>
  <line x1="110" y1="118" x2="238" y2="320" class="edge"/>
  <line x1="262" y1="119" x2="158" y2="340" class="edge"/>
  <line x1="266" y1="118" x2="248" y2="308" class="edge"/>
  <text x="180" y="230" text-anchor="middle" class="note">A 与 B 的共同参考文献数 = 耦合强度</text>
  <text x="180" y="250" text-anchor="middle" class="note">（发文时即固定，不随后来引用变化）</text>

  <!-- 右图：共引 -->
  <text x="590" y="36" text-anchor="middle" class="head">共引（向前看）</text>
  <circle cx="470" cy="95" r="24" class="paper"/>
  <text x="470" y="100" text-anchor="middle" class="lbl">C1</text>
  <circle cx="570" cy="80" r="24" class="paper"/>
  <text x="570" y="85" text-anchor="middle" class="lbl">C2</text>
  <circle cx="680" cy="95" r="24" class="paper"/>
  <text x="680" y="100" text-anchor="middle" class="lbl">C3</text>
  <circle cx="510" cy="330" r="30" class="ref shared"/>
  <text x="510" y="335" text-anchor="middle" class="lbl">X</text>
  <circle cx="660" cy="330" r="30" class="ref shared"/>
  <text x="660" y="335" text-anchor="middle" class="lbl">Y</text>
  <line x1="468" y1="119" x2="506" y2="300" class="edge"/>
  <line x1="478" y1="118" x2="648" y2="310" class="edge"/>
  <line x1="570" y1="104" x2="516" y2="302" class="edge"/>
  <line x1="572" y1="104" x2="654" y2="308" class="edge"/>
  <line x1="678" y1="119" x2="518" y2="308" class="edge"/>
  <line x1="684" y1="118" x2="654" y2="310" class="edge"/>
  <text x="590" y="250" text-anchor="middle" class="note">共同引用 X、Y 的后续论文数 = 共引强度</text>
  <text x="590" y="270" text-anchor="middle" class="note">（随时间增长，被引越多越稳定）</text>
</svg>
