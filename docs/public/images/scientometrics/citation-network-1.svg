<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif">
  <title>引文网络示意图</title>
  <desc>展示论文为节点、引文为有向边的引文网络：箭头由施引文献指向被引文献，时间从新到旧，被引次数多的老文献成为高入度枢纽。</desc>
  <rect width="720" height="440" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a8378"/>
    </marker>
  </defs>
  <style>
    .node-new{fill:#1f6f8b;stroke:#14505f;stroke-width:2}
    .node-mid{fill:#f6f3ec;stroke:#8a8378;stroke-width:1.5}
    .node-old{fill:#c0392b;stroke:#7e2217;stroke-width:2.5}
    .edge{stroke:#8a8378;stroke-width:1.4;marker-end:url(#arrow)}
    .lbl{fill:#333;font-size:15px}
    .note{fill:#555;font-size:14px}
    .head{fill:#333;font-size:19px;font-weight:bold}
  </style>
  <text x="360" y="34" text-anchor="middle" class="head">引文网络：节点是论文，箭头是引文</text>

  <!-- 新近论文（上层，2024-2026） -->
  <circle cx="140" cy="110" r="26" class="node-new"/>
  <text x="140" y="115" text-anchor="middle" class="lbl">P1</text>
  <circle cx="300" cy="92" r="26" class="node-new"/>
  <text x="300" y="97" text-anchor="middle" class="lbl">P2</text>
  <circle cx="470" cy="118" r="26" class="node-new"/>
  <text x="470" y="123" text-anchor="middle" class="lbl">P3</text>
  <circle cx="600" cy="96" r="26" class="node-new"/>
  <text x="600" y="101" text-anchor="middle" class="lbl">P4</text>

  <!-- 中间论文（2022-2023） -->
  <circle cx="210" cy="240" r="26" class="node-mid"/>
  <text x="210" y="245" text-anchor="middle" class="lbl">P5</text>
  <circle cx="420" cy="252" r="26" class="node-mid"/>
  <text x="420" y="257" text-anchor="middle" class="lbl">P6</text>

  <!-- 老旧高被引论文（2018-2020） -->
  <circle cx="270" cy="376" r="36" class="node-old"/>
  <text x="270" y="381" text-anchor="middle" class="lbl">A</text>
  <circle cx="510" cy="368" r="30" class="node-old"/>
  <text x="510" y="373" text-anchor="middle" class="lbl">B</text>

  <!-- 引文边：由新指向旧 -->
  <line x1="140" y1="136" x2="210" y2="214" class="edge"/>
  <line x1="152" y1="124" x2="270" y2="344" class="edge"/>
  <line x1="300" y1="118" x2="226" y2="222" class="edge"/>
  <line x1="300" y1="118" x2="274" y2="344" class="edge"/>
  <line x1="310" y1="110" x2="410" y2="238" class="edge"/>
  <line x1="470" y1="144" x2="428" y2="232" class="edge"/>
  <line x1="482" y1="134" x2="296" y2="360" class="edge"/>
  <line x1="600" y1="122" x2="440" y2="234" class="edge"/>
  <line x1="612" y1="112" x2="522" y2="352" class="edge"/>
  <line x1="226" y1="264" x2="270" y2="340" class="edge"/>
  <line x1="434" y1="276" x2="510" y2="338" class="edge"/>
  <line x1="436" y1="274" x2="286" y2="358" class="edge"/>

  <!-- 标注 -->
  <text x="330" y="140" class="note">箭头方向 = 引文方向</text>
  <line x1="330" y1="150" x2="330" y2="170" class="edge"/>
  <text x="342" y="164" class="note">施引文献（新）→ 被引文献（旧）</text>
  <text x="58" y="210" class="note">入度 = 被引次数</text>
  <text x="300" y="430" text-anchor="middle" class="note">节点 A 被最多论文引用（高入度），时间上总是由新指向旧，因此网络无环</text>
</svg>
