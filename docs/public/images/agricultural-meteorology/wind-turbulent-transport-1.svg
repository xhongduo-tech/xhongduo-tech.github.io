<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>农田上方的对数风廓线</title>
<desc>示意图展示风速随高度增加：冠层内风速骤减近乎静止，冠层以上按对数律随高度增大。</desc>
<rect x="0" y="0" width="420" height="320" fill="#faf9f5"/>
<!-- 坐标轴 -->
<line x1="40" y1="270" x2="400" y2="270" stroke="#333" stroke-width="2"/>
<line x1="40" y1="270" x2="40" y2="30" stroke="#333" stroke-width="2"/>
<text x="18" y="160" font-size="14" fill="#333" transform="rotate(-90 18 160)">高度 z (m)</text>
<text x="200" y="300" font-size="14" fill="#333" text-anchor="middle">风速 u (m·s⁻¹)</text>
<!-- 冠层区 -->
<rect x="40" y="218" width="340" height="52" fill="#1f6f8b" opacity="0.18"/>
<g stroke="#1f6f8b" stroke-width="2" opacity="0.8">
  <line x1="70" y1="270" x2="70" y2="230"/><line x1="90" y1="270" x2="85" y2="225"/>
  <line x1="150" y1="270" x2="152" y2="228"/><line x1="210" y1="270" x2="215" y2="232"/>
  <line x1="280" y1="270" x2="275" y2="226"/><line x1="340" y1="270" x2="345" y2="230"/>
</g>
<text x="210" y="252" font-size="14" fill="#333" text-anchor="middle">冠层（叶片挡风，内部近乎静止）</text>
<!-- 冠层顶虚线 -->
<line x1="40" y1="218" x2="400" y2="218" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="250" y="208" font-size="13" fill="#c0392b">冠层顶 z = h</text>
<!-- 对数风廓线 -->
<path d="M 60 218 C 90 216 130 200 160 176 C 195 147 250 118 330 96 L 360 90" fill="none" stroke="#333" stroke-width="3"/>
<g stroke="#333" stroke-width="2" fill="#333">
  <line x1="360" y1="90" x2="352" y2="82"/><line x1="360" y1="90" x2="352" y2="98"/>
  <line x1="300" y1="103" x2="295" y2="93"/><line x1="300" y1="103" x2="292" y2="110"/>
  <line x1="240" y1="124" x2="236" y2="113"/><line x1="240" y1="124" x2="232" y2="131"/>
</g>
<text x="230" y="80" font-size="14" fill="#333">对数风廓线：</text>
<text x="230" y="100" font-size="14" fill="#333">u(z) = (u*/κ)·ln((z−d)/z₀)</text>
<!-- z0+d 标注 -->
<line x1="60" y1="218" x2="60" y2="270" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="60" cy="218" r="4" fill="#c0392b"/>
<text x="52" y="292" font-size="13" fill="#333">z₀+d</text>
</svg>
