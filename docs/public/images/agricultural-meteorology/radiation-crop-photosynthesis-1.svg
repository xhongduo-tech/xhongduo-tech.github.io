<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <title>冠层辐射截获与比尔-朗伯衰减</title>
  <desc>左侧示意冠层自上而下截获辐射，右侧曲线表示穿过累计叶面积后透射光强按指数衰减：I = I0·exp(-K·L)</desc>
  <rect width="700" height="400" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333">

    <text x="350" y="30" font-size="18" text-anchor="middle" font-weight="bold">冠层辐射截获：比尔-朗伯衰减</text>

    <!-- 左侧：太阳与冠层示意 -->
    <circle cx="70" cy="70" r="22" fill="#c0392b" stroke="#333" stroke-width="2"/>
    <g stroke="#c0392b" stroke-width="2.5" stroke-linecap="round">
      <line x1="70" y1="38" x2="70" y2="24"/>
      <line x1="38" y1="70" x2="24" y2="70"/>
      <line x1="102" y1="70" x2="116" y2="70"/>
      <line x1="47" y1="47" x2="38" y2="38"/>
      <line x1="93" y1="47" x2="102" y2="38"/>
    </g>
    <g stroke="#1f6f8b" stroke-width="2">
      <line x1="70" y1="100" x2="180" y2="150"/>
      <line x1="120" y1="100" x2="210" y2="150"/>
      <line x1="170" y1="100" x2="240" y2="150"/>
    </g>
    <rect x="120" y="150" width="160" height="26" fill="#1f6f8b" opacity="0.85"/>
    <rect x="130" y="176" width="150" height="26" fill="#1f6f8b" opacity="0.65"/>
    <rect x="140" y="202" width="140" height="26" fill="#1f6f8b" opacity="0.45"/>
    <g stroke="#c0392b" stroke-width="2">
      <line x1="150" y1="140" x2="150" y2="330"/>
      <line x1="280" y1="140" x2="280" y2="330"/>
    </g>
    <line x1="150" y1="330" x2="280" y2="330" stroke="#333" stroke-width="1.5"/>
    <text x="215" y="352" font-size="13" text-anchor="middle">冠层横剖面（由上至下）</text>
    <text x="215" y="370" font-size="13" text-anchor="middle">光箭头越往下越细：被叶片逐层拦截</text>
    <text x="92" y="100" font-size="13" text-anchor="end">I₀</text>

    <!-- 右侧：衰减曲线 -->
    <g stroke="#333" stroke-width="1.5">
      <line x1="420" y1="60" x2="420" y2="330"/>
      <line x1="420" y1="330" x2="660" y2="330"/>
    </g>
    <text x="410" y="46" font-size="13" text-anchor="end">I / I₀</text>
    <text x="520" y="358" font-size="13" text-anchor="middle">叶面积指数 LAI</text>
    <g font-size="12" fill="#666">
      <text x="420" y="45" text-anchor="end">1.0</text>
      <text x="420" y="124" text-anchor="end">0.6</text>
      <text x="420" y="204" text-anchor="end">0.2</text>
      <text x="420" y="335" text-anchor="end">0</text>
      <text x="420" y="345" text-anchor="middle">0</text>
      <text x="530" y="345" text-anchor="middle">2</text>
      <text x="640" y="345" text-anchor="middle">6</text>
    </g>
    <g stroke="#666" stroke-width="0.7" stroke-dasharray="3,4">
      <line x1="420" y1="124" x2="660" y2="124"/>
      <line x1="420" y1="204" x2="660" y2="204"/>
      <line x1="530" y1="60" x2="530" y2="330"/>
      <line x1="640" y1="60" x2="640" y2="330"/>
    </g>
    <polyline points="420,60 454,166 488,231 522,270 556,294 590,308 640,317" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="528" y="288" font-size="14" fill="#c0392b">I = I₀·e⁻ᵏ·ᴸ</text>
    <line x1="530" y1="230" x2="530" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="545" y="252" font-size="13" text-anchor="start">LAI = 2 时只剩约 37%</text>
    <text x="545" y="270" font-size="13" text-anchor="start">（K = 0.5 的情形）</text>

  </g>
</svg>
