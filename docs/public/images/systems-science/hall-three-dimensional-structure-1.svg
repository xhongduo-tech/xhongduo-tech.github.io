<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="sans-serif">
  <title>霍尔三维结构</title>
  <desc>系统工程的三维形态：时间维（阶段）、逻辑维（步骤）与知识维（专业）构成立体网格。</desc>
  <rect width="640" height="520" fill="#faf9f5"/>
  <!-- 知识维（左上方） -->
  <line x1="150" y1="420" x2="30" y2="200" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="24,186 45,198 30,212" fill="#1f6f8b"/>
  <text x="18" y="168" font-size="16" fill="#1f6f8b" font-weight="bold">知识维（专业）</text>
  <text x="52" y="352" font-size="13" fill="#333">工程</text>
  <text x="66" y="318" font-size="13" fill="#333">数学</text>
  <text x="80" y="284" font-size="13" fill="#333">管理</text>
  <text x="72" y="250" font-size="13" fill="#333">经济</text>
  <text x="58" y="216" font-size="13" fill="#333">法律</text>
  <!-- 逻辑维（竖直） -->
  <line x1="150" y1="420" x2="150" y2="70" stroke="#c0392b" stroke-width="2"/>
  <polygon points="150,54 139,78 161,78" fill="#c0392b"/>
  <text x="158" y="52" font-size="16" fill="#c0392b" font-weight="bold">逻辑维（步骤）</text>
  <circle cx="150" cy="390" r="4" fill="#c0392b"/>
  <text x="168" y="394" font-size="13" fill="#333">问题定义</text>
  <circle cx="150" cy="350" r="4" fill="#c0392b"/>
  <text x="168" y="354" font-size="13" fill="#333">目标选择</text>
  <circle cx="150" cy="310" r="4" fill="#c0392b"/>
  <text x="168" y="314" font-size="13" fill="#333">系统综合</text>
  <circle cx="150" cy="270" r="4" fill="#c0392b"/>
  <text x="168" y="274" font-size="13" fill="#333">系统分析</text>
  <circle cx="150" cy="230" r="4" fill="#c0392b"/>
  <text x="168" y="234" font-size="13" fill="#333">系统优化</text>
  <circle cx="150" cy="190" r="4" fill="#c0392b"/>
  <text x="168" y="194" font-size="13" fill="#333">系统评价</text>
  <circle cx="150" cy="150" r="4" fill="#c0392b"/>
  <text x="168" y="154" font-size="13" fill="#333">决策实施</text>
  <!-- 时间维（水平） -->
  <line x1="150" y1="420" x2="600" y2="420" stroke="#333" stroke-width="2"/>
  <polygon points="616,420 586,409 586,431" fill="#333"/>
  <text x="428" y="450" font-size="16" fill="#333" font-weight="bold">时间维（阶段）</text>
  <circle cx="215" cy="420" r="4" fill="#333"/>
  <text x="200" y="406" font-size="13" fill="#333">规划</text>
  <circle cx="280" cy="420" r="4" fill="#333"/>
  <text x="262" y="406" font-size="13" fill="#333">拟订</text>
  <circle cx="345" cy="420" r="4" fill="#333"/>
  <text x="328" y="406" font-size="13" fill="#333">研制</text>
  <circle cx="410" cy="420" r="4" fill="#333"/>
  <text x="393" y="406" font-size="13" fill="#333">生产</text>
  <circle cx="475" cy="420" r="4" fill="#333"/>
  <text x="458" y="406" font-size="13" fill="#333">安装</text>
  <circle cx="540" cy="420" r="4" fill="#333"/>
  <text x="523" y="406" font-size="13" fill="#333">运行</text>
  <circle cx="590" cy="420" r="4" fill="#333"/>
  <text x="583" y="476" font-size="13" fill="#333">更新</text>
  <!-- 交汇点高亮 -->
  <circle cx="150" cy="420" r="6" fill="#c0392b"/>
  <text x="240" y="500" font-size="13" fill="#1f6f8b">任一「阶段 × 步骤」都是一个工作单元，叠加专业知识形成立体活动网格</text>
</svg>
