<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>结合能曲线</title>
  <desc>每个核子的平均结合能 B/A 随质量数 A 的变化曲线：轻核迅速上升，在铁附近达到峰值约 8.8 MeV，随后缓慢下降</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <line x1="60" y1="360" x2="600" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="360" x2="60" y2="40" stroke="#333" stroke-width="2"/>
  <text x="610" y="365" fill="#333" font-size="14">A</text>
  <text x="22" y="60" fill="#333" font-size="14">B/A</text>
  <text x="22" y="76" fill="#333" font-size="14">(MeV)</text>
  <text x="46" y="375" fill="#333" font-size="13">0</text>
  <text x="166" y="375" fill="#333" font-size="13">50</text>
  <text x="278" y="375" fill="#333" font-size="13">100</text>
  <text x="390" y="375" fill="#333" font-size="13">150</text>
  <text x="502" y="375" fill="#333" font-size="13">200</text>
  <text x="585" y="375" fill="#333" font-size="13">240</text>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#e0dcd4" stroke-width="1"/>
  <line x1="60" y1="240" x2="600" y2="240" stroke="#e0dcd4" stroke-width="1"/>
  <line x1="60" y1="180" x2="600" y2="180" stroke="#e0dcd4" stroke-width="1"/>
  <line x1="60" y1="120" x2="600" y2="120" stroke="#e0dcd4" stroke-width="1"/>
  <text x="40" y="304" fill="#999" font-size="13">2</text>
  <text x="40" y="244" fill="#999" font-size="13">4</text>
  <text x="40" y="184" fill="#999" font-size="13">6</text>
  <text x="40" y="124" fill="#999" font-size="13">8</text>
  <path d="M 64 330 C 66 250 68 180 70 150 C 74 134 82 126 92 121 C 110 112 150 101 186 97 C 230 99 280 103 330 108 C 400 114 480 122 530 128 C 560 131 585 134 596 136"
        fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="186" y1="97" x2="186" y2="360" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="196" y="88" fill="#c0392b" font-size="15">铁峰 ≈ 8.8 MeV（⁵⁶Fe / ⁶²Ni）</text>
  <text x="88" y="146" fill="#1f6f8b" font-size="14">⁴He</text>
  <text x="566" y="150" fill="#1f6f8b" font-size="14">²³⁸U</text>
  <text x="88" y="250" fill="#333" font-size="14">轻核区：聚变可以释放能量</text>
  <text x="330" y="250" fill="#333" font-size="14">重核区：裂变可以释放能量</text>
  <text x="88" y="280" fill="#333" font-size="13">B/A 陡升，来自表面能主导</text>
  <text x="330" y="280" fill="#333" font-size="13">B/A 缓降，来自库仑斥力增长</text>
</svg>
