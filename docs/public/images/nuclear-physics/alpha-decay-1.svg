<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>α 衰变的量子隧穿势垒</title>
  <desc>α 粒子被束缚在核内半径 R 的核力势阱中，其能量 E 低于库仑势垒峰值，通过量子隧穿逃逸出核</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <line x1="320" y1="30" x2="320" y2="360" stroke="#333" stroke-width="2"/>
  <text x="330" y="42" fill="#333" font-size="14">V(r)</text>
  <line x1="80" y1="340" x2="580" y2="340" stroke="#333" stroke-width="2"/>
  <text x="566" y="358" fill="#333" font-size="14">r</text>
  <text x="88" y="354" fill="#333" font-size="13">0</text>
  <!-- nuclear well from r=0 to R (draw below axis) -->
  <path d="M 90 340 L 180 340 L 180 80 L 200 80 L 200 340" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- Coulomb barrier -->
  <path d="M 200 340 C 215 200 250 110 320 70 C 420 40 520 46 570 52 L 570 340" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="70" y="100" fill="#1f6f8b" font-size="14">核力势阱 −V₀</text>
  <text x="150" y="74" fill="#1f6f8b" font-size="14">R</text>
  <line x1="180" y1="70" x2="180" y2="340" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="52" fill="#1f6f8b" font-size="14">库仑势垒（V ∝ 1/r）</text>
  <text x="292" y="250" fill="#c0392b" font-size="15">势垒高度 B ≈ 25–30 MeV</text>
  <!-- alpha energy level -->
  <line x1="90" y1="180" x2="410" y2="180" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="420" y="186" fill="#c0392b" font-size="15">α 粒子能量 E ≈ 4–9 MeV</text>
  <text x="120" y="212" fill="#333" font-size="14">隧穿区域（阴影）：</text>
  <path d="M 200 340 L 410 180 L 200 180 Z" fill="#1f6f8b" opacity="0.15"/>
  <text x="120" y="240" fill="#333" font-size="14">E &lt; B，经典禁止，</text>
  <text x="120" y="262" fill="#333" font-size="14">靠量子隧穿逃出</text>
  <text x="120" y="310" fill="#333" font-size="14">α 粒子：⁴He 核（2p + 2n）</text>
  <text x="120" y="386" fill="#333" font-size="13">隧穿概率 P ≈ exp(−2G)，G 为伽莫夫因子</text>
</svg>
