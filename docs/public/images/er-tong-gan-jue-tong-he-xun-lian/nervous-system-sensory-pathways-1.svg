<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="sans-serif" font-size="14">
  <title>感觉统合的三条上行加工通路</title>
  <desc>展示触觉、前庭觉、本体觉三条感觉通路从感受器经脊髓、脑干、丘脑/小脑到大脑皮层的层级接力，以及脑干网状结构对注意的调控。</desc>
  <rect x="0" y="0" width="680" height="430" fill="#faf9f5"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">感觉统合的三条上行加工通路</text>

  <!-- 层级背景带 -->
  <rect x="30" y="52" width="620" height="52" fill="#fff" stroke="#ccc"/>
  <text x="40" y="78" font-size="13" fill="#1f6f8b" font-weight="bold">感受器</text>
  <rect x="30" y="118" width="620" height="52" fill="#fff" stroke="#ccc"/>
  <text x="40" y="144" font-size="13" fill="#1f6f8b" font-weight="bold">传导束（脊髓/脑干）</text>
  <rect x="30" y="184" width="620" height="52" fill="#fff" stroke="#ccc"/>
  <text x="40" y="210" font-size="13" fill="#1f6f8b" font-weight="bold">中继核（丘脑 / 小脑）</text>
  <rect x="30" y="250" width="620" height="52" fill="#fff" stroke="#ccc"/>
  <text x="40" y="276" font-size="13" fill="#1f6f8b" font-weight="bold">大脑皮层（统合终点）</text>

  <!-- 通路 1：触觉 -->
  <rect x="70" y="60" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="145" y="80" text-anchor="middle" fill="#333">皮肤触觉感受器</text>
  <line x1="145" y1="94" x2="145" y2="118" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="70" y="126" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="145" y="146" text-anchor="middle" fill="#333">后索-内侧丘系 / 脊髓丘脑束</text>
  <line x1="145" y1="160" x2="145" y2="184" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="70" y="192" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="145" y="212" text-anchor="middle" fill="#333">丘脑腹后核</text>
  <line x1="145" y1="226" x2="145" y2="250" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="70" y="258" width="150" height="34" rx="6" fill="#fbe9e7" stroke="#c0392b"/>
  <text x="145" y="278" text-anchor="middle" fill="#333">中央后回（体感皮层）</text>

  <!-- 通路 2：前庭觉 -->
  <rect x="270" y="60" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="345" y="80" text-anchor="middle" fill="#333">内耳前庭毛细胞</text>
  <line x1="345" y1="94" x2="345" y2="118" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="270" y="126" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="345" y="146" text-anchor="middle" fill="#333">前庭神经 → 前庭神经核（脑干）</text>
  <line x1="345" y1="160" x2="345" y2="184" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="270" y="192" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="345" y="212" text-anchor="middle" fill="#333">丘脑腹后核 / 小脑</text>
  <line x1="345" y1="226" x2="345" y2="250" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="270" y="258" width="150" height="34" rx="6" fill="#fbe9e7" stroke="#c0392b"/>
  <text x="345" y="278" text-anchor="middle" fill="#333">前庭皮层 / 眼动与姿势核团</text>

  <!-- 通路 3：本体觉 -->
  <rect x="470" y="60" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="545" y="80" text-anchor="middle" fill="#333">肌梭 / 腱器官</text>
  <line x1="545" y1="94" x2="545" y2="118" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="470" y="126" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="545" y="146" text-anchor="middle" fill="#333">脊髓后角 → 脊髓小脑束 / 内侧丘系</text>
  <line x1="545" y1="160" x2="545" y2="184" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="470" y="192" width="150" height="34" rx="6" fill="#eaf3f5" stroke="#1f6f8b"/>
  <text x="545" y="212" text-anchor="middle" fill="#333">小脑 / 丘脑</text>
  <line x1="545" y1="226" x2="545" y2="250" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="470" y="258" width="150" height="34" rx="6" fill="#fbe9e7" stroke="#c0392b"/>
  <text x="545" y="278" text-anchor="middle" fill="#333">运动皮层 / 小脑皮层</text>

  <!-- 脑干网状结构调节 -->
  <rect x="180" y="322" width="320" height="44" rx="8" fill="#fdf3d7" stroke="#b7791f"/>
  <text x="340" y="342" text-anchor="middle" fill="#333" font-weight="bold">脑干网状结构（上行激动系统）</text>
  <text x="340" y="358" text-anchor="middle" fill="#555" font-size="13">调节皮层唤醒与注意分配——“感觉的闸门”</text>
  <line x1="340" y1="322" x2="340" y2="292" stroke="#b7791f" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="340" y="408" text-anchor="middle" font-size="13" fill="#777">触觉 / 前庭觉 / 本体觉先经脑干与丘脑整合，再被皮层“统合”为知觉与行动</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f6f8b"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b7791f"/>
    </marker>
  </defs>
</svg>
