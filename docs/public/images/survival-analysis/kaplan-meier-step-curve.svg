<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>Kaplan–Meier 生存曲线示例</title>
  <desc>基于 5 个观察对象的 Kaplan-Meier 阶梯生存曲线：t=7 与 t=12 两次事件使生存概率分别降至 0.8 与 0.6，随后三个删失个体以加号标记，曲线保持水平。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <!-- 标题 -->
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">Kaplan–Meier 生存曲线（右删失数据，n=5）</text>
  <!-- 绘图区边框 -->
  <line x1="60" y1="340" x2="600" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="340" stroke="#333" stroke-width="1.5"/>
  <!-- 横向网格线与刻度 -->
  <g stroke="#ccc" stroke-width="0.8">
    <line x1="60" y1="100" x2="600" y2="100"/>
    <line x1="60" y1="160" x2="600" y2="160"/>
    <line x1="60" y1="220" x2="600" y2="220"/>
    <line x1="60" y1="280" x2="600" y2="280"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="end">
    <text x="52" y="44">1.0</text>
    <text x="52" y="104">0.8</text>
    <text x="52" y="164">0.6</text>
    <text x="52" y="224">0.4</text>
    <text x="52" y="284">0.2</text>
    <text x="52" y="344">0.0</text>
  </g>
  <!-- 纵向刻度：时间 0 到 30 月 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="60" y="360">0</text>
    <text x="150" y="360">5</text>
    <text x="240" y="360">10</text>
    <text x="330" y="360">15</text>
    <text x="420" y="360">20</text>
    <text x="510" y="360">25</text>
    <text x="600" y="360">30</text>
  </g>
  <!-- 轴标签 -->
  <text x="330" y="392" text-anchor="middle" font-size="14" fill="#333">时间 t（月）</text>
  <text x="26" y="190" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 26 190)">生存概率 Ŝ(t)</text>
  <!-- KM 阶梯曲线 -->
  <g stroke="#c0392b" stroke-width="3" fill="none" stroke-linejoin="round">
    <!-- 1.0 水平段：t=0 → t=7 -->
    <line x1="60" y1="40" x2="186" y2="40"/>
    <!-- 下降 1.0 → 0.8 于 t=7 -->
    <line x1="186" y1="40" x2="186" y2="100"/>
    <!-- 0.8 水平段：t=7 → t=12 -->
    <line x1="186" y1="100" x2="276" y2="100"/>
    <!-- 下降 0.8 → 0.6 于 t=12 -->
    <line x1="276" y1="100" x2="276" y2="160"/>
    <!-- 0.6 水平段：t=12 → t=30 -->
    <line x1="276" y1="160" x2="600" y2="160"/>
  </g>
  <!-- 事件点 -->
  <circle cx="186" cy="40" r="5" fill="#c0392b"/>
  <circle cx="276" cy="100" r="5" fill="#c0392b"/>
  <!-- 删失标记（加号）于 0.6 水平段 -->
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="366" y1="152" x2="366" y2="168"/>
    <line x1="358" y1="160" x2="374" y2="160"/>
    <line x1="420" y1="152" x2="420" y2="168"/>
    <line x1="412" y1="160" x2="428" y2="160"/>
    <line x1="492" y1="152" x2="492" y2="168"/>
    <line x1="484" y1="160" x2="500" y2="160"/>
  </g>
  <!-- 图例 -->
  <line x1="80" y1="395" x2="110" y2="395" stroke="#c0392b" stroke-width="3"/>
  <text x="116" y="399" font-size="13" fill="#333">事件时刻（生存概率阶梯下降）</text>
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="340" y1="389" x2="340" y2="401"/>
    <line x1="334" y1="395" x2="346" y2="395"/>
  </g>
  <text x="352" y="399" font-size="13" fill="#333">删失时刻（曲线不下降）</text>
</svg>
