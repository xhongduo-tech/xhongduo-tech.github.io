<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%">
  <title>数字孪生平台分层架构</title>
  <desc>感知接入层、数据层、模型层、应用服务层四层结构，以及贯穿各层的数据上行与控制下行双向回路</desc>
  <defs>
    <marker id="pArrE" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker>
  </defs>
  <rect width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">数字孪生平台分层架构</text>

  <!-- 应用服务层 -->
  <rect x="60" y="70" width="520" height="70" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">应用服务层 Application</text>
  <text x="320" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">诊断 · 预测 · 调度 · 可视化（SSe）</text>

  <!-- 模型层 -->
  <rect x="60" y="150" width="520" height="70" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">模型层 Model</text>
  <text x="320" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">模型仓库 · 仿真引擎 · ML 推理（VE + DD）</text>

  <!-- 数据层 -->
  <rect x="60" y="230" width="520" height="70" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">数据层 Data</text>
  <text x="320" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">时序库 · 消息总线 · 数据湖（DD）</text>

  <!-- 感知接入层 -->
  <rect x="60" y="310" width="520" height="70" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">感知接入层 Edge</text>
  <text x="320" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">传感器 · 网关 · 边缘计算（CN + PE 数据出口）</text>

  <!-- 层间连接 -->
  <line x1="160" y1="140" x2="160" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="220" x2="160" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="300" x2="160" y2="310" stroke="#333" stroke-width="2"/>

  <!-- 双向主线标注 -->
  <path d="M320 120 v20 M320 210 v20 M320 290 v20" stroke="#333" stroke-width="0"/>
  <text x="500" y="415" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">主线：数据上行（采集→模型）+ 控制下行（决策→执行）</text>
  <path d="M120 95 H560" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pArrE)" fill="none"/>
  <text x="120" y="82" font-family="sans-serif" font-size="12" fill="#1f6f8b">数据上行</text>
  <text x="500" y="250" font-family="sans-serif" font-size="12" fill="#c0392b">控制下行</text>
</svg>
