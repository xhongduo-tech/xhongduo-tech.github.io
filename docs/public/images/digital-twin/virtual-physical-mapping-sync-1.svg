<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%">
  <title>虚实映射与同步闭环</title>
  <desc>物理实体与虚拟实体之间的双向映射：采集驱动镜像，决策驱动控制，两者构成同步闭环</desc>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker>
  </defs>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">虚实映射与同步闭环</text>

  <!-- 物理实体 PE -->
  <rect x="50" y="150" width="230" height="110" rx="10" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">物理实体</text>
  <text x="165" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">设备 · 车间 · 系统</text>
  <text x="165" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">状态 s_p(t)</text>

  <!-- 虚拟实体 VE -->
  <rect x="360" y="150" width="230" height="110" rx="10" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
  <text x="475" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">虚拟实体</text>
  <text x="475" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">数字模型 · 仿真</text>
  <text x="475" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">状态 ŝ_v(t)</text>

  <!-- 正向映射：物理 -> 虚拟 -->
  <path d="M280 180 H360" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrE)" fill="none"/>
  <text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">采集驱动镜像</text>
  <text x="320" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">s_p(t−τ)</text>

  <!-- 反向映射：虚拟 -> 物理 -->
  <path d="M360 230 H280" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrE)" fill="none"/>
  <text x="320" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">决策驱动控制</text>

  <!-- 同步协调器 -->
  <rect x="230" y="320" width="180" height="55" rx="8" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="320" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">同步协调器</text>
  <text x="320" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">校准 · 漂移检测</text>
  <path d="M260 265 V320" stroke="#333" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrE)" fill="none"/>
  <path d="M420 265 V320" stroke="#333" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrE)" fill="none"/>
</svg>
