<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%">
  <title>数字孪生五维模型</title>
  <desc>物理实体、虚拟实体、孪生数据、服务系统与连接五个维度及其相互耦合关系</desc>
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrowE" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">数字孪生五维模型</text>

  <!-- 连接 CN：虚实之间的水平通道 -->
  <path d="M260 135 H380" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>
  <text x="320" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">连接 CN（双向）</text>

  <!-- 物理实体 PE -->
  <rect x="40" y="160" width="220" height="90" rx="8" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">物理实体</text>
  <text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">PE · Physical Entity</text>

  <!-- 虚拟实体 VE -->
  <rect x="380" y="160" width="220" height="90" rx="8" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
  <text x="490" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">虚拟实体</text>
  <text x="490" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">VE · Virtual Entity</text>

  <!-- 连接：PE/VE 下行到 DD -->
  <path d="M150 250 V300" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>
  <path d="M490 250 V300" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>

  <!-- 孪生数据 DD -->
  <rect x="250" y="300" width="140" height="60" rx="8" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="320" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">孪生数据</text>
  <text x="320" y="347" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">DD · Digital Data</text>

  <!-- 连接：DD 到服务 -->
  <path d="M320 360 V380" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>

  <!-- 服务系统 SSe -->
  <rect x="220" y="160" width="200" height="55" rx="8" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="320" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">服务系统</text>
  <text x="320" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">SSe · Services</text>

  <!-- 连接：服务到 PE/VE -->
  <path d="M220 180 H40" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>
  <path d="M420 180 H600" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowS)" marker-end="url(#arrowE)" fill="none"/>
</svg>
