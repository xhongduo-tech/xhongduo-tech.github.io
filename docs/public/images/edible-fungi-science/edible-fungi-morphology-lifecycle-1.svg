<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" role="img" aria-labelledby="title desc">
<title id="title">担子菌的生活史循环</title>
<desc id="desc">从担孢子萌发为单核初生菌丝，经质配形成双核次生菌丝，再组织化扭结成子实体，最终在担子内核配并减数分裂产生新担孢子的循环图。</desc>
<rect width="640" height="480" fill="#faf9f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
</marker>
</defs>
<g font-family="sans-serif">
<text x="320" y="480" text-anchor="middle" font-size="13" fill="#333">担子菌生活史：孢子 → 菌丝 → 子实体 → 孢子</text>
</g>
<g stroke="#1f6f8b" stroke-width="2" fill="none">
<path d="M320,92 C320,150 535,150 535,208" marker-end="url(#arrow)"/>
<path d="M448,270 C400,300 400,375 375,393" marker-end="url(#arrow)"/>
<path d="M265,393 C240,360 120,340 108,292" marker-end="url(#arrow)"/>
<path d="M190,228 C215,180 205,125 232,84" marker-end="url(#arrow)"/>
</g>
<g font-family="sans-serif" font-size="13" fill="#333">
<text x="500" y="150" text-anchor="middle">孢子萌发</text>
<text x="330" y="345" text-anchor="middle">质配（锁状联合）</text>
<text x="150" y="345" text-anchor="middle">组织化 · 扭结</text>
<text x="185" y="150" text-anchor="middle">核配 + 减数分裂</text>
</g>
<g>
<rect x="230" y="20" width="180" height="72" rx="12" fill="#eef2f4" stroke="#1f6f8b" stroke-width="2"/>
<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">担孢子</text>
<text x="320" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">n · 单倍体</text>
<rect x="450" y="210" width="170" height="80" rx="12" fill="#eef2f4" stroke="#1f6f8b" stroke-width="2"/>
<text x="535" y="240" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">初生菌丝</text>
<text x="535" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">n · 单核菌丝</text>
<rect x="180" y="395" width="280" height="70" rx="12" fill="#eef2f4" stroke="#1f6f8b" stroke-width="2"/>
<text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">次生菌丝</text>
<text x="320" y="449" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">n + n · 双核菌丝</text>
<rect x="20" y="210" width="170" height="80" rx="12" fill="#fdf0ee" stroke="#c0392b" stroke-width="2"/>
<text x="105" y="240" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">子实体</text>
<text x="105" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">n + n · 三生菌丝</text>
</g>
</svg>
