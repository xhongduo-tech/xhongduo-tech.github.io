<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="sans-serif">
  <title>三角网与基线：由一条基线推算全网边长</title>
  <desc>一个由三角形 ABC、BCD、CDE、DEF、DFG 组成的三角网。基线 AB 为实测长度（红色），其余各边由角度观测与正弦定理逐三角形推算，箭头表示边长推算方向，C 点标出观测角。</desc>
  <rect width="680" height="440" fill="#faf9f5"/>

  <!-- 网边 -->
  <g stroke="#999999" stroke-width="1.5">
    <line x1="120" y1="360" x2="230" y2="250"/>
    <line x1="300" y1="375" x2="230" y2="250"/>
    <line x1="300" y1="375" x2="420" y2="255"/>
    <line x1="230" y1="250" x2="420" y2="255"/>
    <line x1="230" y1="250" x2="330" y2="120"/>
    <line x1="420" y1="255" x2="330" y2="120"/>
    <line x1="420" y1="255" x2="530" y2="130"/>
    <line x1="330" y1="120" x2="530" y2="130"/>
    <line x1="420" y1="255" x2="520" y2="320"/>
    <line x1="530" y1="130" x2="520" y2="320"/>
  </g>

  <!-- 基线 AB -->
  <line x1="120" y1="360" x2="300" y2="375" stroke="#c0392b" stroke-width="3"/>
  <polygon points="300,375 288,368 292,382" fill="#c0392b"/>
  <polygon points="120,360 134,362 126,374" fill="#c0392b"/>
  <text x="176" y="400" font-size="15" fill="#c0392b">基线 AB（实测长度）</text>

  <!-- 推算方向箭头：沿 CD 与 DE -->
  <polygon points="360,257 344,246 348,264" fill="#333333"/>
  <polygon points="356,176 378,172 362,190" fill="#333333"/>
  <text x="360" y="168" font-size="14" fill="#333333">推算方向</text>

  <!-- C 点观测角 -->
  <path d="M 240 267 A 20 20 0 0 0 216 264" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="196" y="240" font-size="14" fill="#1f6f8b">∠C（观测角）</text>

  <!-- 网顶点 -->
  <g fill="#333333">
    <circle cx="120" cy="360" r="4.5"/><circle cx="300" cy="375" r="4.5"/>
    <circle cx="230" cy="250" r="4.5"/><circle cx="420" cy="255" r="4.5"/>
    <circle cx="330" cy="120" r="4.5"/><circle cx="530" cy="130" r="4.5"/>
    <circle cx="520" cy="320" r="4.5"/>
  </g>

  <!-- 点名 -->
  <text x="104" y="376" font-size="15" fill="#333333">A</text>
  <text x="308" y="390" font-size="15" fill="#333333">B</text>
  <text x="214" y="240" font-size="15" fill="#333333">C</text>
  <text x="428" y="252" font-size="15" fill="#333333">D</text>
  <text x="318" y="110" font-size="15" fill="#333333">E</text>
  <text x="538" y="126" font-size="15" fill="#333333">F</text>
  <text x="530" y="338" font-size="15" fill="#333333">G</text>

  <text x="40" y="430" font-size="13" fill="#888888">注：仅基线 AB 用尺实测，其余边长由角度观测 + 正弦定理逐三角形推算，再沿网传递坐标</text>
</svg>
