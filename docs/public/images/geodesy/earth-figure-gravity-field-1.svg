<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="sans-serif">
  <title>地球形状的三个层次：自然表面、大地水准面与参考椭球</title>
  <desc>剖面图：红色起伏线为自然表面（地形），青色平滑椭球为大地水准面 W=W0，深色椭球为参考椭球面 U=U0；P 点处画铅垂线与椭球法线，二者夹角为垂线偏差（夸大示意）；右侧标注大地水准面差距 N。</desc>
  <rect width="680" height="440" fill="#faf9f5"/>

  <!-- 参考椭球面 -->
  <ellipse cx="340" cy="280" rx="250" ry="140" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- 大地水准面（等位面，带轻微波浪起伏） -->
  <path d="M 340 132 C 470 132 585 195 598 281 C 610 367 470 428 340 428 C 210 428 70 367 82 281 C 94 195 210 132 340 132 Z"
        fill="none" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 自然表面（地形，锯齿起伏） -->
  <path d="M 84 178 L 112 160 L 132 172 L 152 144 L 182 156 L 212 128 L 242 150 L 272 120 L 298 96
           L 330 124 L 358 100 L 388 130 L 418 112 L 446 138 L 476 122 L 504 148 L 528 134 L 556 156 L 584 148 L 600 152"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 地面点 P -->
  <circle cx="300" cy="92" r="4" fill="#333333"/>
  <text x="308" y="88" font-size="15" fill="#333333">P</text>

  <!-- 铅垂线（重力方向），夸大偏斜 -->
  <line x1="300" y1="92" x2="297" y2="352" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="297,352 292,342 302,342" fill="#c0392b"/>

  <!-- 椭球法线 -->
  <line x1="300" y1="92" x2="322" y2="352" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="322,352 317,342 327,342" fill="#1f6f8b"/>

  <!-- 垂线偏差夹角（夸大） -->
  <path d="M 300 92 A 15 15 0 0 1 312 101" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="316" y="106" font-size="13" fill="#333333">ε（垂线偏差，夸大）</text>

  <!-- N 标注：大地水准面差距 -->
  <line x1="552" y1="204" x2="560" y2="204" stroke="#333333" stroke-width="1.5"/>
  <line x1="552" y1="214" x2="560" y2="214" stroke="#333333" stroke-width="1.5"/>
  <line x1="556" y1="204" x2="556" y2="214" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="214" font-size="15" fill="#333333">N（大地水准面差距）</text>

  <!-- 图例文字 -->
  <text x="390" y="84" font-size="15" fill="#c0392b">自然表面（地形）</text>
  <text x="470" y="252" font-size="15" fill="#1f6f8b">大地水准面 W=W₀</text>
  <text x="140" y="330" font-size="15" fill="#333333">参考椭球面 U=U₀</text>
  <text x="120" y="226" font-size="13" fill="#c0392b">铅垂线（重力方向）</text>
  <text x="330" y="322" font-size="13" fill="#1f6f8b">椭球法线</text>
  <text x="120" y="400" font-size="13" fill="#888888">注：垂线偏差与 N 均为夸大示意，实际约几角秒 / 数十米量级</text>
</svg>
