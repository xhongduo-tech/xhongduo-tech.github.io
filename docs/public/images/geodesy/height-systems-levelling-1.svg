<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="sans-serif">
  <title>高程系统关系：椭球高、正高、正常高</title>
  <desc>剖面图：地形点 P 沿铅垂线到参考椭球面的距离为椭球高 h，到大地水准面的距离为正高 H^O，到似大地水准面的距离为正常高 H^N；大地水准面与似大地水准面高出椭球面的量分别为 N 与 ζ。</desc>
  <rect width="680" height="440" fill="#faf9f5"/>

  <!-- 参考椭球面 -->
  <path d="M 40 405 Q 340 385 640 405" fill="none" stroke="#333333" stroke-width="2.5"/>
  <text x="280" y="426" font-size="15" fill="#333333">参考椭球面（椭球高基准）</text>

  <!-- 大地水准面（正高基准） -->
  <path d="M 40 366 C 110 352 180 378 260 364 C 340 350 420 378 500 362 C 560 350 610 368 640 362"
        fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="40" y="334" font-size="14" fill="#1f6f8b">大地水准面（正高基准）</text>

  <!-- 似大地水准面（正常高基准） -->
  <path d="M 40 352 C 110 340 180 362 260 350 C 340 338 420 362 500 348 C 560 338 610 352 640 348"
        fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="516" y="334" font-size="14" fill="#333333">似大地水准面（正常高基准）</text>

  <!-- 自然表面（地形） -->
  <path d="M 40 230 L 90 210 L 140 222 L 190 190 L 240 210 L 290 180 L 340 200 L 380 176 L 420 152
           L 460 184 L 510 172 L 560 205 L 610 190 L 640 214"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="90" y="150" font-size="14" fill="#c0392b">自然表面（地形）</text>

  <!-- 地面点 P -->
  <circle cx="420" cy="152" r="4" fill="#333333"/>
  <text x="428" y="148" font-size="15" fill="#333333">P</text>

  <!-- 过 P 的铅垂线与椭球高 h -->
  <line x1="420" y1="152" x2="420" y2="405" stroke="#999999" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="420,405 415,395 425,395" fill="#999999"/>
  <text x="428" y="300" font-size="14" fill="#333333">h（椭球高，GNSS 直接测）</text>

  <!-- 正常高 H^N -->
  <line x1="420" y1="152" x2="386" y2="152" stroke="#555555" stroke-width="1.5"/>
  <line x1="386" y1="152" x2="386" y2="350" stroke="#555555" stroke-width="1.5"/>
  <line x1="386" y1="350" x2="420" y2="350" stroke="#555555" stroke-width="1.5"/>
  <text x="290" y="258" font-size="14" fill="#333333">Hᴺ（正常高）</text>

  <!-- 正高 H^O -->
  <line x1="420" y1="152" x2="454" y2="152" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="454" y1="152" x2="454" y2="364" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="454" y1="364" x2="420" y2="364" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="496" y="250" font-size="14" fill="#1f6f8b">Hᴼ（正高）</text>

  <!-- ζ 标注：似大地水准面与椭球面之差 -->
  <line x1="556" y1="345" x2="564" y2="345" stroke="#333333" stroke-width="1.5"/>
  <line x1="564" y1="345" x2="564" y2="390" stroke="#333333" stroke-width="1.5"/>
  <line x1="556" y1="390" x2="564" y2="390" stroke="#333333" stroke-width="1.5"/>

  <!-- N 标注：大地水准面与椭球面之差 -->
  <line x1="606" y1="364" x2="614" y2="364" stroke="#333333" stroke-width="1.5"/>
  <line x1="614" y1="364" x2="614" y2="387" stroke="#333333" stroke-width="1.5"/>
  <line x1="606" y1="387" x2="614" y2="387" stroke="#333333" stroke-width="1.5"/>

  <!-- 图例 -->
  <text x="40" y="438" font-size="13" fill="#888888">注：h：椭球高　Hᴺ：正常高　Hᴼ：正高　N：大地水准面差距　ζ：高程异常（图中均夸大示意）</text>
</svg>
