<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>表面电子态：投影带隙、表面态与镜像态</title>
  <desc>左图显示投影体带与带隙内的表面态色散；右图显示真空侧的镜像势阱与分立的镜像态能级。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>

  <g>
    <text x="170" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">(a) 表面能带结构</text>
    <line x1="60" y1="340" x2="310" y2="340" stroke="#333" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="340" stroke="#333" stroke-width="1.5"/>
    <text x="310" y="360" text-anchor="end" font-size="13" fill="#333">k∥</text>
    <text x="38" y="78" font-size="13" fill="#333">E</text>
    <rect x="80" y="120" width="200" height="62" fill="#1f6f8b" opacity="0.25"/>
    <rect x="80" y="222" width="200" height="50" fill="#1f6f8b" opacity="0.25"/>
    <text x="288" y="140" text-anchor="end" font-size="13" fill="#1f6f8b">导带</text>
    <text x="288" y="258" text-anchor="end" font-size="13" fill="#1f6f8b">价带</text>
    <line x1="80" y1="190" x2="282" y2="190" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="288" y="184" text-anchor="end" font-size="13" fill="#1f6f8b">带隙</text>
    <path d="M 90 200 C 140 208, 200 168, 268 174" stroke="#c0392b" stroke-width="2.5" fill="none"/>
    <text x="112" y="226" font-size="14" fill="#c0392b">表面态</text>
    <text x="80" y="360" font-size="12" fill="#666">k∥ = 0</text>
    <text x="205" y="360" font-size="12" fill="#666">布里渊区边界</text>
  </g>

  <g>
    <text x="490" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">(b) 镜像势阱中的镜像态</text>
    <line x1="370" y1="90" x2="610" y2="90" stroke="#333" stroke-width="1.5"/>
    <text x="612" y="94" font-size="13" fill="#333">真空能级</text>
    <path d="M 370 340 L 380 300 C 420 210, 470 150, 520 118 C 555 100, 590 93, 610 91" stroke="#1f6f8b" stroke-width="2.5" fill="none"/>
    <line x1="375" y1="228" x2="585" y2="228" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="375" y1="195" x2="585" y2="195" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="375" y1="150" x2="585" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="590" y="232" font-size="13" fill="#c0392b">n=1</text>
    <text x="590" y="199" font-size="13" fill="#c0392b">n=2</text>
    <text x="590" y="154" font-size="13" fill="#c0392b">n=3</text>
    <line x1="370" y1="70" x2="370" y2="360" stroke="#333" stroke-width="2"/>
    <text x="370" y="385" text-anchor="middle" font-size="13" fill="#333">表面 z=0</text>
    <text x="505" y="385" text-anchor="middle" font-size="13" fill="#333">真空 →</text>
  </g>
</svg>
