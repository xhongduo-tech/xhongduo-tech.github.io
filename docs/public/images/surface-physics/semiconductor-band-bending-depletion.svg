<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>半导体表面能带弯曲与空间电荷层</title>
  <desc>n 型半导体表面能带向上弯曲形成耗尽层，费米能级在表面被表面态钉扎。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">n 型半导体表面能带弯曲（耗尽）</text>

  <line x1="120" y1="60" x2="120" y2="340" stroke="#333" stroke-width="2"/>
  <text x="120" y="370" text-anchor="middle" font-size="13" fill="#333">表面 z=0</text>

  <line x1="120" y1="340" x2="600" y2="340" stroke="#333" stroke-width="1.2"/>
  <text x="560" y="360" text-anchor="middle" font-size="13" fill="#333">深度 z（体内 →）</text>

  <text x="80" y="70" font-size="13" fill="#333">E</text>

  <path d="M 120 118 Q 250 138 400 170 L 590 170" stroke="#1f6f8b" stroke-width="2.5" fill="none"/>
  <path d="M 120 218 Q 250 238 400 270 L 590 270" stroke="#1f6f8b" stroke-width="2.5" fill="none"/>
  <text x="600" y="174" font-size="13" fill="#1f6f8b">导带底 E_c</text>
  <text x="600" y="274" font-size="13" fill="#1f6f8b">价带顶 E_v</text>

  <line x1="100" y1="200" x2="590" y2="200" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="600" y="204" font-size="13" fill="#c0392b">费米能级 E_F</text>

  <line x1="135" y1="118" x2="135" y2="170" stroke="#c0392b" stroke-width="1.4"/>
  <polygon points="130,122 135,112 140,122" fill="#c0392b"/>
  <polygon points="130,166 135,176 140,166" fill="#c0392b"/>
  <text x="158" y="152" font-size="13" fill="#c0392b">eV_bb（能带弯曲量）</text>

  <rect x="120" y="286" width="280" height="34" fill="#1f6f8b" opacity="0.12"/>
  <line x1="120" y1="310" x2="400" y2="310" stroke="#1f6f8b" stroke-width="1.4"/>
  <polygon points="124,314 120,303 120,317" fill="#1f6f8b"/>
  <polygon points="396,314 400,303 400,317" fill="#1f6f8b"/>
  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#1f6f8b">空间电荷层（耗尽）宽度 W</text>

  <circle cx="122" cy="200" r="3.5" fill="#c0392b"/>
  <text x="60" y="188" font-size="12" fill="#666">表面态</text>
  <text x="420" y="178" font-size="12" fill="#666">体内（平带区）</text>
</svg>
