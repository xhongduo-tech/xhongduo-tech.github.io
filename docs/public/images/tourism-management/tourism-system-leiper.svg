<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="sans-serif">
  <title>利珀（Leiper）旅游系统模型</title>
  <desc>旅游系统由客源地区域、旅游通道、目的地区域三个地理要素与旅游产业构成，旅游者沿通道往返于客源地与目的地之间。</desc>
  <rect width="820" height="430" fill="#faf9f5"/>
  <!-- 客源地区域 -->
  <rect x="24" y="150" width="180" height="110" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="114" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">客源地区域</text>
  <text x="114" y="205" text-anchor="middle" font-size="13" fill="#333">生成旅游需求</text>
  <text x="114" y="225" text-anchor="middle" font-size="13" fill="#666">（tourist generating</text>
  <text x="114" y="243" text-anchor="middle" font-size="13" fill="#666">region）</text>
  <!-- 目的地区域 -->
  <rect x="616" y="150" width="180" height="110" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="706" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">目的地区域</text>
  <text x="706" y="205" text-anchor="middle" font-size="13" fill="#333">吸引并接待游客</text>
  <text x="706" y="225" text-anchor="middle" font-size="13" fill="#666">（tourist destination</text>
  <text x="706" y="243" text-anchor="middle" font-size="13" fill="#666">region）</text>
  <!-- 旅游通道 -->
  <ellipse cx="410" cy="205" rx="180" ry="72" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="410" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">旅游通道</text>
  <text x="410" y="220" text-anchor="middle" font-size="13" fill="#666">（transit route）</text>
  <!-- 箭头：出发与返回 -->
  <line x1="206" y1="180" x2="614" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="168" text-anchor="middle" font-size="13" fill="#333">前往 出发游客</text>
  <line x1="614" y1="235" x2="206" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="258" text-anchor="middle" font-size="13" fill="#666">返回 回程游客</text>
  <!-- 旅游产业 -->
  <rect x="70" y="330" width="680" height="78" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="410" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">旅游产业：贯穿三个地理要素的供给系统</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="150" y="378">交通</text>
    <text x="250" y="378">住宿</text>
    <text x="350" y="378">餐饮</text>
    <text x="450" y="378">吸引物</text>
    <text x="550" y="378">会展</text>
    <text x="650" y="378">游憩</text>
    <text x="150" y="398">旅游中介</text>
    <text x="350" y="398">旅行商</text>
    <text x="550" y="398">目的地机构</text>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
