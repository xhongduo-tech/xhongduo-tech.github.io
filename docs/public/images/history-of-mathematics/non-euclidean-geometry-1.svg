<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
<title>三种几何的三角形内角和对比</title>
<desc>三个并排的三角形，分别代表欧氏几何（平直，内角和等于 180 度）、双曲几何（内凹，内角和小于 180 度）与椭圆球面几何（外凸，内角和大于 180 度），用于对比三种常曲率几何。</desc>
<rect x="0" y="0" width="480" height="300" fill="#faf9f5" />

<!-- 面板一：欧氏几何 -->
<text x="80" y="36" font-family="sans-serif" font-size="16" fill="#333">欧氏几何</text>
<polygon points="80,66 32,218 128,218" fill="none" stroke="#333" stroke-width="3" />
<text x="80" y="258" font-family="sans-serif" font-size="14" fill="#333">κ = 0，内角和 = 180°</text>

<!-- 面板二：双曲几何 -->
<text x="240" y="36" font-family="sans-serif" font-size="16" fill="#333">双曲几何</text>
<path d="M 200,66 Q 190,140 152,218 Q 200,214 248,218 Q 210,140 200,66 Z" fill="none" stroke="#1f6f8b" stroke-width="3" />
<text x="240" y="258" font-family="sans-serif" font-size="14" fill="#1f6f8b">κ &lt; 0，内角和 &lt; 180°</text>

<!-- 面板三：椭圆（球面）几何 -->
<text x="400" y="36" font-family="sans-serif" font-size="16" fill="#333">椭圆（球面）几何</text>
<circle cx="400" cy="140" r="86" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4" />
<path d="M 400,52 Q 352,112 330,188 Q 400,208 470,188 Q 448,112 400,52 Z" fill="none" stroke="#c0392b" stroke-width="3" />
<text x="400" y="258" font-family="sans-serif" font-size="14" fill="#c0392b">κ &gt; 0，内角和 &gt; 180°</text>
</svg>
