<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
<title>刘徽割圆术：内接正多边形随边数加倍逼近圆周</title>
<desc>一个圆内同时画出内接正六边形（红色）与内接正十二边形（青色），展示边数加倍时多边形周长逐渐贴近圆周，对应割圆术求圆周率的方法。</desc>
<rect x="0" y="0" width="480" height="300" fill="#faf9f5" />
<circle cx="170" cy="150" r="105" fill="none" stroke="#333" stroke-width="2.5" />
<polygon points="170,45 260.93,97.5 260.93,202.5 170,255 79.07,202.5 79.07,97.5" fill="none" stroke="#c0392b" stroke-width="3" />
<polygon points="275,150 260.93,97.5 222.5,59.07 170,45 117.5,59.07 79.07,97.5 65,150 79.07,202.5 117.5,240.93 170,255 222.5,240.93 260.93,202.5" fill="none" stroke="#1f6f8b" stroke-width="2.2" />
<circle cx="170" cy="150" r="4" fill="#333" />
<text x="170" y="140" font-family="sans-serif" font-size="13" fill="#333">O</text>
<text x="300" y="130" font-family="sans-serif" font-size="15" fill="#333">圆（周长 2πr）</text>
<line x1="296" y1="136" x2="276" y2="146" stroke="#333" stroke-width="1.5" />
<text x="300" y="160" font-family="sans-serif" font-size="15" fill="#c0392b">内接正六边形</text>
<line x1="296" y1="166" x2="272" y2="172" stroke="#c0392b" stroke-width="1.5" />
<text x="300" y="190" font-family="sans-serif" font-size="15" fill="#1f6f8b">内接正十二边形</text>
<line x1="296" y1="196" x2="268" y2="198" stroke="#1f6f8b" stroke-width="1.5" />
<text x="300" y="225" font-family="sans-serif" font-size="14" fill="#333">边数加倍 → 周长逼近圆周</text>
<text x="300" y="252" font-family="sans-serif" font-size="14" fill="#333">π ≈ n·aₙ/2 → 3.1416</text>
<text x="300" y="279" font-family="sans-serif" font-size="13" fill="#333">刘徽 3072 边形；祖冲之 24576 边形</text>
</svg>
