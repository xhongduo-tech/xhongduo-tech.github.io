<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="560" height="350" font-family="sans-serif">
  <title>黎曼 ζ 函数的临界带、临界线与零点位置</title>
  <desc>复平面示意图：临界带 0 到 1 之间的浅色区域，临界线 Re(s)=1/2 上的非平凡零点，实轴上 s=1 的极点与负偶数处的平凡零点。</desc>
  <rect x="0" y="0" width="560" height="350" fill="#faf9f5"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">黎曼 ζ 函数：临界带、临界线与零点位置</text>

  <!-- 临界带 0 &lt;= Re(s) &lt;= 1 -->
  <rect x="380" y="50" width="53.3" height="260" fill="#1f6f8b" opacity="0.12"/>

  <!-- 实轴 -->
  <line x1="60" y1="180" x2="540" y2="180" stroke="#333" stroke-width="1.5"/>
  <polygon points="540,180 532,176 532,184" fill="#333"/>
  <text x="544" y="184" font-size="14" fill="#333">Re</text>

  <!-- 虚轴（Re = 0） -->
  <line x1="380" y1="50" x2="380" y2="310" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="388" y="66" font-size="13" fill="#666">Re = 0</text>

  <!-- 临界线 Re(s) = 1/2 -->
  <line x1="406.7" y1="50" x2="406.7" y2="310" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="414" y="64" font-size="13" fill="#1f6f8b">临界线 Re(s) = 1/2</text>

  <!-- 极点 s = 1 -->
  <line x1="425.3" y1="172" x2="441.3" y2="188" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="441.3" y1="172" x2="425.3" y2="188" stroke="#c0392b" stroke-width="2.5"/>
  <text x="433.3" y="205" text-anchor="middle" font-size="13" fill="#c0392b">极点 s = 1</text>

  <!-- 平凡零点 s = -2, -4 -->
  <circle cx="273.3" cy="180" r="4.5" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <circle cx="166.7" cy="180" r="4.5" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="220" y="248" text-anchor="middle" font-size="13" fill="#c0392b">平凡零点（s = −2, −4, …）</text>

  <!-- 非平凡零点（示意，在临界线上） -->
  <circle cx="406.7" cy="90" r="4.5" fill="#1f6f8b"/>
  <circle cx="406.7" cy="120" r="4.5" fill="#1f6f8b"/>
  <circle cx="406.7" cy="150" r="4.5" fill="#1f6f8b"/>
  <circle cx="406.7" cy="210" r="4.5" fill="#1f6f8b"/>
  <circle cx="406.7" cy="240" r="4.5" fill="#1f6f8b"/>
  <text x="160" y="285" font-size="13" fill="#1f6f8b">非平凡零点 ρ（示意，实部 1/2）</text>

  <!-- 实轴刻度 -->
  <text x="60" y="198" font-size="13" fill="#333">−6</text>
  <text x="166.7" y="198" font-size="13" fill="#333">−4</text>
  <text x="273.3" y="198" font-size="13" fill="#333">−2</text>
  <text x="380" y="198" font-size="13" fill="#333">0</text>
  <text x="433.3" y="198" font-size="13" fill="#333">1</text>
  <text x="486.7" y="198" font-size="13" fill="#333">2</text>

  <!-- 图例 -->
  <line x1="120" y1="322" x2="150" y2="322" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="158" y="326" font-size="13" fill="#333">临界线</text>
  <line x1="240" y1="322" x2="270" y2="322" stroke="#c0392b" stroke-width="2.5"/>
  <text x="278" y="326" font-size="13" fill="#333">零点 / 极点</text>
  <rect x="380" y="312" width="26" height="20" fill="#1f6f8b" opacity="0.25"/>
  <text x="414" y="326" font-size="13" fill="#333">临界带 0 ≤ Re(s) ≤ 1</text>
</svg>
