<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>E×B 漂移：离子与电子同向同速漂移</title>
  <desc>磁场 B 指向纸外（圆点），电场 E 竖直向上。离子（青色）逆时针回旋，电子（红色）顺时针回旋，两者的导向中心都水平向右漂移，漂移速度与电荷质量无关。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333">E×B 漂移：两种电荷同向同速</text>
  <!-- B out of page symbol -->
  <circle cx="60" cy="330" r="7" fill="none" stroke="#333" stroke-width="2"/>
  <text x="60" y="335" text-anchor="middle" font-size="14" fill="#333">⊙</text>
  <text x="60" y="358" text-anchor="middle" font-size="13" fill="#333">B 出纸面</text>
  <!-- E arrow up -->
  <line x1="330" y1="60" x2="330" y2="120" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="348" y="92" font-size="14" fill="#333">E（向上）</text>
  <!-- ion path (cyan, counterclockwise) -->
  <path d="M 210 200 A 55 55 0 1 1 205 201 L 270 170 A 55 55 0 1 1 265 175 L 330 150 A 55 55 0 1 1 325 155 L 390 140 A 55 55 0 1 1 385 145 L 445 138 A 55 55 0 1 1 440 143" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="10 4"/>
  <!-- electron path (red, clockwise) -->
  <path d="M 210 250 A 45 45 0 1 0 205 249 L 270 220 A 45 45 0 1 0 265 219 L 330 195 A 45 45 0 1 0 325 194 L 390 178 A 45 45 0 1 0 385 177 L 445 170 A 45 45 0 1 0 440 169" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="10 4"/>
  <!-- drift arrows -->
  <line x1="300" y1="200" x2="560" y2="200" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="250" x2="560" y2="250" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="575" y="196" font-size="13" fill="#1f6f8b">离子</text>
  <text x="575" y="246" font-size="13" fill="#c0392b">电子</text>
  <text x="430" y="300" font-size="14" fill="#333">漂移 v_E = E×B/B²（同向同速）</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
