<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>Debye 屏蔽：屏蔽后电势与库仑电势的对比</title>
  <desc>横轴为距试探电荷的距离（以 Debye 长度为单位），纵轴为电势（以试探电荷处裸电势为单位）。青色曲线为未屏蔽的库仑势 1/r，红色曲线为屏蔽后的电势 exp(-r)/r，在德拜长度附近迅速跌向零。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333">Debye 屏蔽：屏蔽后电势的指数衰减</text>
  <!-- axes -->
  <line x1="70" y1="320" x2="600" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="320" x2="70" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="610" y="336" font-size="14" fill="#333">r / λ_D</text>
  <text x="30" y="180" font-size="14" fill="#333" transform="rotate(-90 30 180)">φ / φ₀</text>
  <!-- ticks -->
  <line x1="70" y1="320" x2="70" y2="314" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="340" text-anchor="middle" font-size="13" fill="#333">0</text>
  <line x1="176" y1="320" x2="176" y2="314" stroke="#333" stroke-width="1.5"/>
  <text x="176" y="340" text-anchor="middle" font-size="13" fill="#333">1</text>
  <line x1="282" y1="320" x2="282" y2="314" stroke="#333" stroke-width="1.5"/>
  <text x="282" y="340" text-anchor="middle" font-size="13" fill="#333">2</text>
  <line x1="388" y1="320" x2="388" y2="314" stroke="#333" stroke-width="1.5"/>
  <text x="388" y="340" text-anchor="middle" font-size="13" fill="#333">3</text>
  <line x1="494" y1="320" x2="494" y2="314" stroke="#333" stroke-width="1.5"/>
  <text x="494" y="340" text-anchor="middle" font-size="13" fill="#333">4</text>
  <!-- Coulomb 1/r curve -->
  <path d="M 70 60 L 86 99 C 98 126 108 145 120 162 C 134 181 150 199 168 215 C 190 235 214 252 242 268 C 274 285 306 298 344 307 C 386 316 430 319 600 319" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- shielded exp(-r)/r curve -->
  <path d="M 70 60 L 86 113 C 98 145 110 166 124 185 C 142 207 162 224 186 239 C 214 254 248 265 286 274 C 330 283 380 290 600 298" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- vertical dashed at r=lambda_D -->
  <line x1="176" y1="60" x2="176" y2="320" stroke="#333" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="180" y="56" font-size="13" fill="#333">λ_D 处</text>
  <!-- labels -->
  <text x="330" y="290" font-size="14" fill="#1f6f8b">库仑势 q/4πε₀r</text>
  <text x="360" y="252" font-size="14" fill="#c0392b">屏蔽后 (q/4πε₀r)e⁻ʳᐟλᴰ</text>
  <text x="420" y="316" font-size="14" fill="#333">r ≫ λ_D：电势趋于零</text>
</svg>
