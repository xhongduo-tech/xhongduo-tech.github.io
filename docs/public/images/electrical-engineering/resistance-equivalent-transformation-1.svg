<svg viewBox="0 0 460 270" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>串联与并联的等效电阻</title>
  <desc>左侧两个电阻 R1、R2 首尾串联，等效电阻为二者之和；右侧两个电阻两端并联，等效电阻为 R1 与 R2 之积除以二者之和。</desc>
  <rect x="0" y="0" width="460" height="270" fill="#faf9f5"/>
  <line x1="230" y1="20" x2="230" y2="250" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="30" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">串联</text>
  <circle cx="85" cy="45" r="4" fill="#333"/>
  <text x="96" y="49" font-family="sans-serif" font-size="15" fill="#333">a</text>
  <line x1="85" y1="45" x2="85" y2="65" stroke="#333" stroke-width="2.5"/>
  <rect x="77" y="65" width="16" height="45" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <text x="104" y="92" font-family="sans-serif" font-size="15" fill="#333">R<tspan dy="3" font-size="11">1</tspan></text>
  <line x1="85" y1="110" x2="85" y2="140" stroke="#333" stroke-width="2.5"/>
  <rect x="77" y="140" width="16" height="45" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <text x="104" y="167" font-family="sans-serif" font-size="15" fill="#333">R<tspan dy="3" font-size="11">2</tspan></text>
  <line x1="85" y1="185" x2="85" y2="220" stroke="#333" stroke-width="2.5"/>
  <circle cx="85" cy="220" r="4" fill="#333"/>
  <text x="96" y="224" font-family="sans-serif" font-size="15" fill="#333">b</text>
  <text x="40" y="252" font-family="sans-serif" font-size="15" fill="#1f6f8b">R<tspan dy="3" font-size="11">eq</tspan> = R<tspan dy="3" font-size="11">1</tspan> + R<tspan dy="3" font-size="11">2</tspan></text>
  <text x="260" y="30" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">并联</text>
  <circle cx="320" cy="45" r="4" fill="#333"/>
  <text x="331" y="49" font-family="sans-serif" font-size="15" fill="#333">c</text>
  <line x1="245" y1="45" x2="395" y2="45" stroke="#333" stroke-width="2.5"/>
  <line x1="245" y1="220" x2="395" y2="220" stroke="#333" stroke-width="2.5"/>
  <line x1="245" y1="45" x2="245" y2="105" stroke="#333" stroke-width="2.5"/>
  <rect x="237" y="105" width="16" height="45" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <text x="264" y="132" font-family="sans-serif" font-size="15" fill="#333">R<tspan dy="3" font-size="11">1</tspan></text>
  <line x1="245" y1="150" x2="245" y2="220" stroke="#333" stroke-width="2.5"/>
  <line x1="395" y1="45" x2="395" y2="105" stroke="#333" stroke-width="2.5"/>
  <rect x="387" y="105" width="16" height="45" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <text x="414" y="132" font-family="sans-serif" font-size="15" fill="#333">R<tspan dy="3" font-size="11">2</tspan></text>
  <line x1="395" y1="150" x2="395" y2="220" stroke="#333" stroke-width="2.5"/>
  <circle cx="320" cy="220" r="4" fill="#333"/>
  <text x="331" y="224" font-family="sans-serif" font-size="15" fill="#333">d</text>
  <text x="245" y="252" font-family="sans-serif" font-size="15" fill="#1f6f8b">R<tspan dy="3" font-size="11">eq</tspan> = R<tspan dy="3" font-size="11">1</tspan>R<tspan dy="3" font-size="11">2</tspan>/(R<tspan dy="3" font-size="11">1</tspan>+R<tspan dy="3" font-size="11">2</tspan>)</text>
</svg>
