<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>节点上的基尔霍夫电流定律与推广的闭合面</title>
  <desc>中心节点处四条支路电流 i1、i2 流入，i3、i4 流出；虚线闭合面包围节点，穿过闭合面的电流代数和为零。</desc>
  <rect x="0" y="0" width="440" height="280" fill="#faf9f5"/>
  <ellipse cx="215" cy="130" rx="100" ry="80" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="60" font-family="sans-serif" font-size="13" fill="#1f6f8b">闭合面 S</text>
  <circle cx="215" cy="130" r="5" fill="#333"/>
  <defs>
    <marker id="arrowk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <line x1="215" y1="45" x2="215" y2="108" stroke="#333" stroke-width="2.5" marker-end="url(#arrowk)"/>
  <text x="228" y="80" font-family="sans-serif" font-size="16" fill="#333">i<tspan dy="3" font-size="12">1</tspan></text>
  <line x1="100" y1="130" x2="193" y2="130" stroke="#333" stroke-width="2.5" marker-end="url(#arrowk)"/>
  <text x="120" y="120" font-family="sans-serif" font-size="16" fill="#333">i<tspan dy="3" font-size="12">2</tspan></text>
  <line x1="215" y1="152" x2="215" y2="228" stroke="#333" stroke-width="2.5" marker-end="url(#arrowk)"/>
  <text x="228" y="195" font-family="sans-serif" font-size="16" fill="#333">i<tspan dy="3" font-size="12">3</tspan></text>
  <line x1="237" y1="130" x2="330" y2="130" stroke="#333" stroke-width="2.5" marker-end="url(#arrowk)"/>
  <text x="262" y="120" font-family="sans-serif" font-size="16" fill="#333">i<tspan dy="3" font-size="12">4</tspan></text>
  <text x="86" y="258" font-family="sans-serif" font-size="15" fill="#333">Σ i<tspan dy="3" font-size="11">进</tspan> = Σ i<tspan dy="3" font-size="11">出</tspan></text>
</svg>
