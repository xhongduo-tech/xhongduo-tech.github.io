<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="sans-serif">
  <title>局部卷积与非局部注意力的感受野对比</title>
  <desc>左图：卷积的感受野只覆盖查询点周围 3x3 邻域；右图：非局部注意力让查询点与全部时空位置直接建立连接。</desc>
  <rect x="0" y="0" width="900" height="430" fill="#faf9f5"/>

  <text x="225" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">局部卷积：感受野 = 3×3 邻域</text>
  <text x="675" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">非局部注意力：感受野 = 全部时空位置</text>

  <!-- 左面板：7 列 5 行点阵 -->
  <g transform="translate(120,150)">
    <g>
      <circle cx="0"   cy="0"   r="4" fill="#999"/><circle cx="28"  cy="0"   r="4" fill="#999"/><circle cx="56"  cy="0"   r="4" fill="#999"/><circle cx="84"  cy="0"   r="4" fill="#999"/><circle cx="112" cy="0"   r="4" fill="#999"/><circle cx="140" cy="0"   r="4" fill="#999"/><circle cx="168" cy="0"   r="4" fill="#999"/>
      <circle cx="0"   cy="28"  r="4" fill="#999"/><circle cx="28"  cy="28"  r="4" fill="#999"/><circle cx="56"  cy="28"  r="4" fill="#999"/><circle cx="84"  cy="28"  r="4" fill="#999"/><circle cx="112" cy="28"  r="4" fill="#999"/><circle cx="140" cy="28"  r="4" fill="#999"/><circle cx="168" cy="28"  r="4" fill="#999"/>
      <circle cx="0"   cy="56"  r="4" fill="#999"/><circle cx="28"  cy="56"  r="4" fill="#999"/><circle cx="56"  cy="56"  r="4" fill="#999"/><circle cx="84"  cy="56"  r="4" fill="#999"/><circle cx="112" cy="56"  r="4" fill="#999"/><circle cx="140" cy="56"  r="4" fill="#999"/><circle cx="168" cy="56"  r="4" fill="#999"/>
      <circle cx="0"   cy="84"  r="4" fill="#999"/><circle cx="28"  cy="84"  r="4" fill="#999"/><circle cx="56"  cy="84"  r="4" fill="#999"/><circle cx="84"  cy="84"  r="4" fill="#999"/><circle cx="112" cy="84"  r="4" fill="#999"/><circle cx="140" cy="84"  r="4" fill="#999"/><circle cx="168" cy="84"  r="4" fill="#999"/>
    </g>
    <!-- 3x3 邻域连接 -->
    <g stroke="#c0392b" stroke-width="1.4">
      <line x1="84" y1="28" x2="56" y2="0"/><line x1="84" y1="28" x2="84" y2="0"/><line x1="84" y1="28" x2="112" y2="0"/>
      <line x1="84" y1="28" x2="56" y2="28"/><line x1="84" y1="28" x2="112" y2="28"/>
      <line x1="84" y1="28" x2="56" y2="56"/><line x1="84" y1="28" x2="84" y2="56"/><line x1="84" y1="28" x2="112" y2="56"/>
    </g>
    <circle cx="84" cy="28" r="7" fill="#c0392b"/>
  </g>
  <text x="225" y="280" text-anchor="middle" font-size="14" fill="#c0392b">查询点只与 8 个邻居交换信息</text>
  <text x="225" y="320" text-anchor="middle" font-size="13" fill="#555">信息要传远，得层层堆叠卷积</text>

  <!-- 右面板：全连接点阵 -->
  <g transform="translate(560,120)">
    <g stroke="#1f6f8b" stroke-width="0.8" opacity="0.7">
      <line x1="105" y1="35" x2="0"   y2="0"/><line x1="105" y1="35" x2="35"  y2="0"/><line x1="105" y1="35" x2="70"  y2="0"/><line x1="105" y1="35" x2="105" y2="0"/><line x1="105" y1="35" x2="140" y2="0"/><line x1="105" y1="35" x2="175" y2="0"/><line x1="105" y1="35" x2="210" y2="0"/>
      <line x1="105" y1="35" x2="0"   y2="35"/><line x1="105" y1="35" x2="35"  y2="35"/><line x1="105" y1="35" x2="70"  y2="35"/><line x1="105" y1="35" x2="140" y2="35"/><line x1="105" y1="35" x2="175" y2="35"/><line x1="105" y1="35" x2="210" y2="35"/>
      <line x1="105" y1="35" x2="0"   y2="70"/><line x1="105" y1="35" x2="35"  y2="70"/><line x1="105" y1="35" x2="70"  y2="70"/><line x1="105" y1="35" x2="140" y2="70"/><line x1="105" y1="35" x2="175" y2="70"/><line x1="105" y1="35" x2="210" y2="70"/>
      <line x1="105" y1="35" x2="0"   y2="105"/><line x1="105" y1="35" x2="35"  y2="105"/><line x1="105" y1="35" x2="70"  y2="105"/><line x1="105" y1="35" x2="105" y2="105"/><line x1="105" y1="35" x2="140" y2="105"/><line x1="105" y1="35" x2="175" y2="105"/><line x1="105" y1="35" x2="210" y2="105"/>
      <line x1="105" y1="35" x2="0"   y2="140"/><line x1="105" y1="35" x2="35"  y2="140"/><line x1="105" y1="35" x2="70"  y2="140"/><line x1="105" y1="35" x2="105" y2="140"/><line x1="105" y1="35" x2="140" y2="140"/><line x1="105" y1="35" x2="175" y2="140"/><line x1="105" y1="35" x2="210" y2="140"/>
    </g>
    <g>
      <circle cx="0"   cy="0"   r="4" fill="#1f6f8b"/><circle cx="35"  cy="0"   r="4" fill="#1f6f8b"/><circle cx="70"  cy="0"   r="4" fill="#1f6f8b"/><circle cx="105" cy="0"   r="4" fill="#1f6f8b"/><circle cx="140" cy="0"   r="4" fill="#1f6f8b"/><circle cx="175" cy="0"   r="4" fill="#1f6f8b"/><circle cx="210" cy="0"   r="4" fill="#1f6f8b"/>
      <circle cx="0"   cy="35"  r="4" fill="#1f6f8b"/><circle cx="35"  cy="35"  r="4" fill="#1f6f8b"/><circle cx="70"  cy="35"  r="4" fill="#1f6f8b"/><circle cx="140" cy="35"  r="4" fill="#1f6f8b"/><circle cx="175" cy="35"  r="4" fill="#1f6f8b"/><circle cx="210" cy="35"  r="4" fill="#1f6f8b"/>
      <circle cx="0"   cy="70"  r="4" fill="#1f6f8b"/><circle cx="35"  cy="70"  r="4" fill="#1f6f8b"/><circle cx="70"  cy="70"  r="4" fill="#1f6f8b"/><circle cx="105" cy="70"  r="4" fill="#1f6f8b"/><circle cx="140" cy="70"  r="4" fill="#1f6f8b"/><circle cx="175" cy="70"  r="4" fill="#1f6f8b"/><circle cx="210" cy="70"  r="4" fill="#1f6f8b"/>
      <circle cx="0"   cy="105" r="4" fill="#1f6f8b"/><circle cx="35"  cy="105" r="4" fill="#1f6f8b"/><circle cx="70"  cy="105" r="4" fill="#1f6f8b"/><circle cx="105" cy="105" r="4" fill="#1f6f8b"/><circle cx="140" cy="105" r="4" fill="#1f6f8b"/><circle cx="175" cy="105" r="4" fill="#1f6f8b"/><circle cx="210" cy="105" r="4" fill="#1f6f8b"/>
      <circle cx="0"   cy="140" r="4" fill="#1f6f8b"/><circle cx="35"  cy="140" r="4" fill="#1f6f8b"/><circle cx="70"  cy="140" r="4" fill="#1f6f8b"/><circle cx="105" cy="140" r="4" fill="#1f6f8b"/><circle cx="140" cy="140" r="4" fill="#1f6f8b"/><circle cx="175" cy="140" r="4" fill="#1f6f8b"/><circle cx="210" cy="140" r="4" fill="#1f6f8b"/>
    </g>
    <circle cx="105" cy="35" r="8" fill="#c0392b"/>
  </g>
  <text x="675" y="300" text-anchor="middle" font-size="14" fill="#c0392b">查询点与全部位置直接相连</text>
  <text x="675" y="340" text-anchor="middle" font-size="13" fill="#555">权重由内容相似度决定，一次到位</text>

  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#555">感受野：卷积靠深度积累，注意力靠宽度直达</text>
</svg>
