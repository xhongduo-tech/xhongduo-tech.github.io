<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif">
  <title>双流网络结构示意</title>
  <desc>输入视频分两路：空间流用单帧 RGB 识别外观，时间流用光流堆叠识别运动，两路分数在融合层合并，输出动作类别。</desc>
  <rect x="0" y="0" width="900" height="460" fill="#faf9f5"/>

  <!-- 输入 -->
  <rect x="40" y="180" width="120" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="100" y="208" text-anchor="middle" font-size="14" fill="#333">输入视频</text>
  <text x="100" y="226" text-anchor="middle" font-size="13" fill="#555">(T 帧)</text>

  <!-- 分叉箭头 -->
  <path d="M 160 210 H 195" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 200 210 C 200 150, 205 130, 230 130" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 200 210 C 200 270, 205 290, 235 290" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 空间流 -->
  <rect x="240" y="95" width="150" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="315" y="124" text-anchor="middle" font-size="14" fill="#333">单帧 RGB</text>
  <rect x="440" y="95" width="130" height="50" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="505" y="124" text-anchor="middle" font-size="14" fill="#1f6f8b">2D CNN</text>
  <rect x="620" y="95" width="130" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="685" y="124" text-anchor="middle" font-size="14" fill="#333">空间分数 s_s</text>
  <line x1="390" y1="120" x2="430" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="120" x2="610" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="80" text-anchor="middle" font-size="14" fill="#c0392b">空间流：长什么样</text>

  <!-- 时间流 -->
  <rect x="240" y="315" width="150" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="315" y="344" text-anchor="middle" font-size="14" fill="#333">光流堆叠（10 帧）</text>
  <rect x="440" y="315" width="130" height="50" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="505" y="344" text-anchor="middle" font-size="14" fill="#1f6f8b">2D CNN</text>
  <rect x="620" y="315" width="130" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="685" y="344" text-anchor="middle" font-size="14" fill="#333">时间分数 s_t</text>
  <line x1="390" y1="340" x2="430" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="340" x2="610" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="300" text-anchor="middle" font-size="14" fill="#c0392b">时间流：怎么动</text>

  <!-- 融合 -->
  <rect x="800" y="185" width="80" height="90" rx="6" fill="#fdf0ef" stroke="#c0392b" stroke-width="2"/>
  <text x="840" y="215" text-anchor="middle" font-size="14" fill="#c0392b">融合</text>
  <text x="840" y="235" text-anchor="middle" font-size="13" fill="#333">平均</text>
  <text x="840" y="253" text-anchor="middle" font-size="13" fill="#333">加权 / SVM</text>
  <path d="M 750 120 L 792 185" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 750 340 L 792 275" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="160" text-anchor="middle" font-size="13" fill="#555">融合</text>

  <!-- 输出 -->
  <rect x="40" y="385" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="140" y="415" text-anchor="middle" font-size="14" fill="#333">动作类别（softmax）</text>
  <path d="M 840 275 L 840 350 L 250 350" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
