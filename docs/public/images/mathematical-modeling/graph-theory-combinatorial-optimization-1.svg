<svg viewBox="0 0 800 360" width="800" height="360" xmlns="http://www.w3.org/2000/svg">
<title>柯尼斯堡七桥问题的图论建模</title>
<desc>普雷格尔河上四块陆地缩成 A、B、C、D 四个顶点，七座桥缩成七条边，各顶点标注度数，说明全为奇数故无欧拉回路。</desc>
<rect x="0" y="0" width="800" height="360" fill="#faf9f5"/>
<text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">柯尼斯堡七桥问题：陆地缩成点，桥缩成边</text>
<!-- 河流示意 -->
<path d="M 60 200 Q 400 260 740 200" fill="none" stroke="#1f6f8b" stroke-width="10" opacity="0.35"/>
<!-- 四个顶点 -->
<circle cx="170" cy="140" r="26" fill="#c0392b"/>
<text x="170" y="133" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">A</text>
<text x="170" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">deg=3</text>

<circle cx="420" cy="80" r="26" fill="#c0392b"/>
<text x="420" y="73" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">B</text>
<text x="420" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">deg=3</text>

<circle cx="640" cy="140" r="26" fill="#c0392b"/>
<text x="640" y="133" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">C</text>
<text x="640" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">deg=3</text>

<circle cx="430" cy="270" r="26" fill="#c0392b"/>
<text x="430" y="263" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">D</text>
<text x="430" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">deg=5</text>
<!-- 边：桥 -->
<line x1="185" y1="122" x2="403" y2="88" stroke="#333" stroke-width="3"/>
<line x1="196" y1="130" x2="407" y2="95" stroke="#333" stroke-width="3"/>
<line x1="180" y1="162" x2="405" y2="258" stroke="#333" stroke-width="3"/>
<line x1="403" y1="95" x2="625" y2="132" stroke="#333" stroke-width="3"/>
<line x1="407" y1="103" x2="627" y2="147" stroke="#333" stroke-width="3"/>
<line x1="625" y1="155" x2="440" y2="255" stroke="#333" stroke-width="3"/>
<line x1="190" y1="148" x2="415" y2="100" stroke="#333" stroke-width="3"/>
<!-- 结论 -->
<text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">四个顶点度数全为奇数 → 不存在欧拉回路（一笔画无解）</text>
</svg>
