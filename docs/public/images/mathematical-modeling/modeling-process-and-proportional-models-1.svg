<svg viewBox="0 0 800 360" width="800" height="360" xmlns="http://www.w3.org/2000/svg">
<title>数学建模五步流程示意图</title>
<desc>五个圆角矩形依次排列成环形：提出问题、选择方法、建立模型、求解模型、回答问题，箭头表示流程方向与迭代回路。</desc>
<rect x="0" y="0" width="800" height="360" fill="#faf9f5"/>
<!-- 顶部提示 -->
<text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">数学建模五步流程（Giordano）</text>
<!-- 第一步 -->
<rect x="60" y="80" width="130" height="90" rx="14" fill="#1f6f8b"/>
<text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">提出问题</text>
<text x="125" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Ask the question</text>
<!-- 第二步 -->
<rect x="235" y="80" width="130" height="90" rx="14" fill="#1f6f8b"/>
<text x="300" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">选择方法</text>
<text x="300" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Select approach</text>
<!-- 第三步 -->
<rect x="410" y="80" width="130" height="90" rx="14" fill="#1f6f8b"/>
<text x="475" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">建立模型</text>
<text x="475" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Formulate</text>
<!-- 第四步 -->
<rect x="585" y="80" width="130" height="90" rx="14" fill="#1f6f8b"/>
<text x="650" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">求解模型</text>
<text x="650" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Solve</text>
<!-- 第五步 -->
<rect x="320" y="220" width="160" height="90" rx="14" fill="#c0392b"/>
<text x="400" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">回答问题</text>
<text x="400" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Answer &amp; verify</text>
<!-- 箭头 1->2 -->
<line x1="190" y1="125" x2="230" y2="125" stroke="#333" stroke-width="2.5"/>
<polygon points="235,125 224,119 224,131" fill="#333"/>
<!-- 箭头 2->3 -->
<line x1="365" y1="125" x2="405" y2="125" stroke="#333" stroke-width="2.5"/>
<polygon points="410,125 399,119 399,131" fill="#333"/>
<!-- 箭头 3->4 -->
<line x1="540" y1="125" x2="580" y2="125" stroke="#333" stroke-width="2.5"/>
<polygon points="585,125 574,119 574,131" fill="#333"/>
<!-- 箭头 4->5 向下 -->
<line x1="650" y1="175" x2="650" y2="212" stroke="#333" stroke-width="2.5"/>
<polygon points="650,217 644,206 656,206" fill="#333"/>
<!-- 箭头 5->1 向上 -->
<line x1="400" y1="215" x2="400" y2="178" stroke="#333" stroke-width="2.5"/>
<polygon points="400,173 394,184 406,184" fill="#333"/>
<!-- 迭代回路标注 -->
<text x="452" y="205" font-family="sans-serif" font-size="13" fill="#c0392b">验证后迭代</text>
<text x="286" y="200" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">没问清 / 假设太粗 → 回炉</text>
</svg>
