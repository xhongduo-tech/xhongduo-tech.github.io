<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
<title>二维线性规划的可行域与最优解</title>
<desc>三条约束直线 2x+y=20、x+y=12、x=8 与坐标轴围成的凸多边形可行域，顶点标注 A、B、C、D，目标函数等值线在顶点 D(8,4) 取得最大。</desc>
<rect x="0" y="0" width="800" height="400" fill="#faf9f5"/>
<text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">可行域（凸多边形）与目标等值线</text>
<!-- 坐标轴 -->
<line x1="100" y1="340" x2="720" y2="340" stroke="#333" stroke-width="2"/>
<line x1="100" y1="340" x2="100" y2="60" stroke="#333" stroke-width="2"/>
<text x="720" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">x（桌子）</text>
<text x="80" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">y（椅子）</text>
<!-- 可行域多边形 A(0,0) B(8,0) D(8,4) C(0,12) -->
<polygon points="100,340 100+8*40,340 100+8*40,340-4*40 100,340-12*40" fill="#1f6f8b" opacity="0.30"/>
<!-- 边界线 -->
<line x1="100" y1="340" x2="100" y2="100" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="112" y="110" font-family="sans-serif" font-size="13" fill="#c0392b">x=8</text>
<line x1="100" y1="100" x2="580" y2="340" stroke="#333" stroke-width="2.5"/>
<text x="600" y="100" font-family="sans-serif" font-size="13" fill="#333">x+y=12</text>
<line x1="100" y1="340" x2="220" y2="300" stroke="#333" stroke-width="2.5"/>
<text x="240" y="300" font-family="sans-serif" font-size="13" fill="#333">2x+y=20</text>
<!-- 顶点 -->
<circle cx="100" cy="340" r="7" fill="#c0392b"/><text x="88" y="356" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">(0,0)</text>
<circle cx="420" cy="340" r="7" fill="#c0392b"/><text x="438" y="356" font-family="sans-serif" font-size="14" fill="#333">B (8,0)</text>
<circle cx="100" cy="100" r="7" fill="#c0392b"/><text x="88" y="90" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">C (0,12)</text>
<circle cx="420" cy="180" r="9" fill="#c0392b" stroke="#faf9f5" stroke-width="2"/><text x="436" y="174" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold">最优 D (8,4)</text>
<!-- 等值线 -->
<line x1="120" y1="360" x2="180" y2="240" stroke="#888" stroke-width="1.5"/>
<line x1="140" y1="360" x2="220" y2="180" stroke="#888" stroke-width="1.5"/>
<line x1="160" y1="360" x2="260" y2="120" stroke="#888" stroke-width="1.5"/>
<text x="300" y="130" font-family="sans-serif" font-size="13" fill="#888">z=15x+10y 等值线逐渐增大</text>
</svg>
