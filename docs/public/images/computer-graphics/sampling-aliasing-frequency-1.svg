<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="sans-serif">
  <title>采样在频域中的效果：从频谱复制到混叠</title>
  <desc>三幅频谱图对比：原信号频谱带宽有限；采样率充足时频谱副本分离可重建；采样率不足时副本重叠发生混叠。</desc>
  <rect width="800" height="340" fill="#faf9f5"/>

  <!-- 图 1：原信号频谱 -->
  <g>
    <text x="130" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">① 原信号频谱</text>
    <line x1="50" y1="270" x2="270" y2="270" stroke="#333" stroke-width="1.5"/>
    <line x1="50" y1="270" x2="50" y2="80" stroke="#333" stroke-width="1.5"/>
    <polygon points="160,90 90,270 230,270" fill="#1f6f8b" fill-opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
    <text x="160" y="60" text-anchor="middle" font-size="13" fill="#333">带宽 B</text>
    <text x="40" y="160" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 40 160)">幅度</text>
    <text x="160" y="290" text-anchor="middle" font-size="13" fill="#333">频率 f</text>
    <text x="160" y="315" text-anchor="middle" font-size="13" fill="#333">最高频率 ν_max = B</text>
  </g>

  <!-- 图 2：采样率充足 -->
  <g>
    <text x="420" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">② 采样率充足</text>
    <line x1="300" y1="270" x2="540" y2="270" stroke="#333" stroke-width="1.5"/>
    <line x1="300" y1="270" x2="300" y2="80" stroke="#333" stroke-width="1.5"/>
    <polygon points="335,95 290,270 380,270" fill="#1f6f8b" fill-opacity="0.3" stroke="#1f6f8b" stroke-width="1.5"/>
    <polygon points="420,95 375,270 465,270" fill="#1f6f8b" fill-opacity="0.3" stroke="#1f6f8b" stroke-width="1.5"/>
    <polygon points="505,95 460,270 550,270" fill="#1f6f8b" fill-opacity="0.3" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="420" y="290" text-anchor="middle" font-size="13" fill="#333">1/T 间隔复制，互不重叠</text>
    <text x="420" y="315" text-anchor="middle" font-size="13" fill="#333">1/T &gt; 2ν_max：可完美重建</text>
  </g>

  <!-- 图 3：采样率不足 -->
  <g>
    <text x="690" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">③ 采样率不足</text>
    <line x1="570" y1="270" x2="800" y2="270" stroke="#333" stroke-width="1.5"/>
    <line x1="570" y1="270" x2="570" y2="80" stroke="#333" stroke-width="1.5"/>
    <polygon points="605,95 555,270 655,270" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="1.5"/>
    <polygon points="690,95 640,270 740,270" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="1.5"/>
    <polygon points="775,95 725,270 800,270" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="1.5"/>
    <polygon points="655,270 660,220 640,220" fill="#c0392b" fill-opacity="0.55"/>
    <polygon points="740,270 745,220 725,220" fill="#c0392b" fill-opacity="0.55"/>
    <text x="690" y="290" text-anchor="middle" font-size="13" fill="#c0392b">副本重叠 → 混叠</text>
    <text x="690" y="315" text-anchor="middle" font-size="13" fill="#333">1/T &lt; 2ν_max：高频混入低频</text>
  </g>
</svg>
