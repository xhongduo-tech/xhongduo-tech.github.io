<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">计算机图形学、计算机视觉与图像处理的分工</title>
  <desc id="desc">示意图：计算机图形学以三维场景描述（网格、材质、光源）为输入，合成输出图像；计算机视觉以图像为输入，理解输出场景描述（类别、三维结构、语义）；图像处理以图像为输入、图像为输出，对图像做滤波、增强与压缩等加工。三者通过图像相连：图形学是图像的产生，视觉是图像的反解，图像处理是图像之间的变换，因此图形学与视觉互为逆问题。</desc>

  <!-- 纸底 -->
  <rect width="720" height="460" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="360" y="42" font-size="20" fill="#333" text-anchor="middle">图像、图形与视觉：谁在合成、谁在理解、谁在加工</text>

  <!-- 计算机图形学（左） -->
  <rect x="20" y="110" width="210" height="130" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="125" y="142" font-size="16" fill="#1f6f8b" text-anchor="middle" font-weight="bold">计算机图形学</text>
  <text x="125" y="168" font-size="14" fill="#333" text-anchor="middle">合成（forward）</text>
  <text x="125" y="192" font-size="14" fill="#333" text-anchor="middle">场景描述 → 图像</text>
  <text x="125" y="214" font-size="13" fill="#777" text-anchor="middle">建模 · 动画 · 渲染 · 交互</text>
  <text x="125" y="234" font-size="13" fill="#777" text-anchor="middle">游戏 / 影视 / 科学可视化</text>

  <!-- 计算机视觉（右） -->
  <rect x="490" y="110" width="210" height="130" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="595" y="142" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">计算机视觉</text>
  <text x="595" y="168" font-size="14" fill="#333" text-anchor="middle">理解（inverse）</text>
  <text x="595" y="192" font-size="14" fill="#333" text-anchor="middle">图像 → 场景描述</text>
  <text x="595" y="214" font-size="13" fill="#777" text-anchor="middle">识别 · 检测 · 三维重建</text>
  <text x="595" y="234" font-size="13" fill="#777" text-anchor="middle">类别 / 三维结构 / 语义</text>

  <!-- 图像（中间节点） -->
  <rect x="290" y="135" width="140" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="360" y="162" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">图像</text>
  <text x="360" y="184" font-size="13" fill="#777" text-anchor="middle">二维像素阵列</text>

  <!-- 箭头：图形学 → 图像 -->
  <line x1="235" y1="172" x2="282" y2="172" stroke="#333" stroke-width="2"/>
  <polygon points="285,172 275,166 275,178" fill="#333"/>
  <text x="258" y="160" font-size="13" fill="#333" text-anchor="middle">输出</text>

  <!-- 箭头：图像 → 视觉 -->
  <line x1="438" y1="172" x2="482" y2="172" stroke="#333" stroke-width="2"/>
  <polygon points="485,172 475,166 475,178" fill="#333"/>
  <text x="460" y="160" font-size="13" fill="#333" text-anchor="middle">输入</text>

  <!-- 图像处理（底部） -->
  <rect x="260" y="300" width="200" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="360" y="332" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">图像处理</text>
  <text x="360" y="358" font-size="14" fill="#333" text-anchor="middle">加工：图像 → 图像</text>
  <text x="360" y="382" font-size="13" fill="#777" text-anchor="middle">滤波 · 增强 · 压缩</text>
  <text x="360" y="404" font-size="13" fill="#777" text-anchor="middle">图形学与视觉的共用工具</text>

  <!-- 箭头：图像 ↔ 图像处理（下与上） -->
  <line x1="345" y1="200" x2="345" y2="290" stroke="#333" stroke-width="2"/>
  <polygon points="345,300 339,288 351,288" fill="#333"/>
  <line x1="375" y1="290" x2="375" y2="200" stroke="#333" stroke-width="2"/>
  <polygon points="375,190 369,202 381,202" fill="#333"/>
  <text x="360" y="250" font-size="13" fill="#333" text-anchor="middle">图像 ↔ 图像</text>

  <!-- 底部说明 -->
  <text x="360" y="440" font-size="13" fill="#777" text-anchor="middle">图形学与视觉互为逆问题；图像处理停留在两者之间的像素层</text>
</svg>
