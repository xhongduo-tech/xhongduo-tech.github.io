<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>气相色谱系统结构示意</title>
  <desc>气相色谱仪由载气钢瓶、进样器、柱温箱内的色谱柱、检测器与数据系统构成。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- 载气钢瓶 -->
    <rect x="52" y="240" width="56" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="80" y1="240" x2="80" y2="210" stroke="#333" stroke-width="3"/>
    <rect x="72" y="204" width="16" height="10" fill="#333"/>
    <text x="80" y="355" text-anchor="middle" font-size="14">载气钢瓶</text>
    <text x="80" y="372" text-anchor="middle" font-size="13" fill="#666">（N₂ / He）</text>

    <!-- 压力与流速控制 -->
    <rect x="140" y="120" width="30" height="20" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="155" y="112" text-anchor="middle" font-size="13">流量与压力控制</text>
    <line x1="80" y1="210" x2="80" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="200" x2="155" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="155" y1="200" x2="155" y2="140" stroke="#333" stroke-width="2"/>

    <!-- 进样器与注射器 -->
    <rect x="225" y="80" width="80" height="44" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="265" y="100" text-anchor="middle" font-size="13">进样器</text>
    <text x="265" y="116" text-anchor="middle" font-size="13" fill="#666">（分流/不分流）</text>
    <line x1="155" y1="120" x2="225" y2="120" stroke="#333" stroke-width="2"/>
    <!-- 注射器 -->
    <rect x="257" y="52" width="16" height="26" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="265" y1="78" x2="265" y2="80" stroke="#c0392b" stroke-width="2"/>

    <!-- 柱温箱 -->
    <rect x="310" y="120" width="220" height="130" rx="10" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="420" y="112" text-anchor="middle" font-size="14" fill="#666">柱温箱（程序升温）</text>
    <!-- 色谱柱：蛇形 -->
    <path d="M 265 124 L 265 150 L 330 150 L 330 185 L 362 185 L 362 150 L 394 150 L 394 185 L 426 185 L 426 150 L 458 150 L 458 185 L 490 185 L 490 150 L 512 150" fill="none" stroke="#1f6f8b" stroke-width="3"/>
    <text x="420" y="205" text-anchor="middle" font-size="13" fill="#1f6f8b">毛细管色谱柱</text>

    <!-- 检测器 -->
    <rect x="512" y="120" width="74" height="46" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="549" y="141" text-anchor="middle" font-size="13">检测器</text>
    <text x="549" y="157" text-anchor="middle" font-size="13" fill="#666">（FID/TCD…）</text>

    <!-- 数据系统 -->
    <rect x="530" y="40" width="70" height="52" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="565" y="62" text-anchor="middle" font-size="13" fill="#c0392b">色谱数据</text>
    <text x="565" y="78" text-anchor="middle" font-size="13" fill="#c0392b">工作站</text>
    <line x1="549" y1="120" x2="565" y2="92" stroke="#333" stroke-width="2"/>

    <!-- 流向箭头 -->
    <polygon points="160,195 168,195 164,188" fill="#333"/>
    <polygon points="222,116 230,116 226,109" fill="#333"/>
  </g>
</svg>
