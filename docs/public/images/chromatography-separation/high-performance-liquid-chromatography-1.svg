<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>高效液相色谱系统结构示意</title>
  <desc>高效液相色谱仪由溶剂瓶、混合器、高压泵、进样阀、色谱柱、检测器与废液收集构成。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- 溶剂瓶 -->
    <rect x="16" y="48" width="58" height="50" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="45" y="74" text-anchor="middle" font-size="13">溶剂 A</text>
    <text x="45" y="90" text-anchor="middle" font-size="13" fill="#666">（水）</text>
    <rect x="16" y="118" width="58" height="50" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="45" y="144" text-anchor="middle" font-size="13">溶剂 B</text>
    <text x="45" y="160" text-anchor="middle" font-size="13" fill="#666">（乙腈）</text>

    <!-- 管路：两溶剂汇入混合器 -->
    <path d="M 40 98 C 40 190 74 200 96 222" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M 40 168 L 96 235" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="2 3"/>
    <rect x="96" y="222" width="46" height="28" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="119" y="240" text-anchor="middle" font-size="13">混合器</text>

    <!-- 高压泵 -->
    <rect x="168" y="214" width="64" height="44" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="200" y="235" text-anchor="middle" font-size="13" fill="#c0392b">高压泵</text>
    <text x="200" y="250" text-anchor="middle" font-size="12" fill="#666">（最高数百 bar）</text>
    <line x1="142" y1="236" x2="168" y2="236" stroke="#333" stroke-width="2"/>
    <polygon points="160,232 168,232 164,225" fill="#333"/>

    <!-- 进样阀 -->
    <rect x="260" y="214" width="66" height="44" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="293" y="235" text-anchor="middle" font-size="13">六通进样阀</text>
    <text x="293" y="250" text-anchor="middle" font-size="12" fill="#666">（定量环）</text>
    <line x1="232" y1="236" x2="260" y2="236" stroke="#333" stroke-width="2"/>
    <polygon points="252,232 260,232 256,225" fill="#333"/>
    <!-- 注射器 -->
    <rect x="287" y="186" width="12" height="26" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="293" y1="212" x2="293" y2="214" stroke="#c0392b" stroke-width="2"/>

    <!-- 柱温箱 -->
    <rect x="352" y="150" width="106" height="180" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="405" y="143" text-anchor="middle" font-size="13" fill="#666">柱温箱</text>
    <rect x="378" y="175" width="34" height="120" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="425" y="205" font-size="13" fill="#1f6f8b">色谱柱</text>
    <text x="425" y="221" font-size="13" fill="#666">（C18）</text>
    <!-- 从进样阀到柱顶 -->
    <path d="M 326 236 L 395 236 L 395 175" fill="none" stroke="#333" stroke-width="2"/>
    <polygon points="391,184 395,175 399,184" fill="#333"/>
    <!-- 柱底到检测器 -->
    <path d="M 395 295 L 395 318 L 472 318 L 472 256" fill="none" stroke="#333" stroke-width="2"/>
    <polygon points="466,266 472,256 478,266" fill="#333"/>

    <!-- 检测器 -->
    <rect x="452" y="214" width="76" height="44" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="490" y="235" text-anchor="middle" font-size="13">检测器</text>
    <text x="490" y="250" text-anchor="middle" font-size="12" fill="#666">（UV/DAD/RI…）</text>

    <!-- 工作站 -->
    <rect x="520" y="40" width="74" height="52" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="557" y="62" text-anchor="middle" font-size="13" fill="#c0392b">色谱数据</text>
    <text x="557" y="78" text-anchor="middle" font-size="13" fill="#c0392b">工作站</text>
    <path d="M 528 236 L 557 236 L 557 92" fill="none" stroke="#333" stroke-width="2"/>
    <polygon points="553,101 557,92 561,101" fill="#333"/>

    <!-- 废液 -->
    <path d="M 490 258 L 490 320" fill="none" stroke="#666" stroke-width="2"/>
    <rect x="470" y="320" width="42" height="42" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="491" y="352" text-anchor="middle" font-size="13" fill="#666">废液</text>
  </g>
</svg>
