<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <title>毛细管电泳系统结构示意</title>
  <desc>毛细管电泳由进样端与检测端两个缓冲液池、一根细毛细管、高压电源与检测器构成；插图对比电渗流塞状剖面与压力流抛物线剖面。</desc>
  <rect width="640" height="460" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- 缓冲液池 -->
    <rect x="30" y="90" width="56" height="72" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="58" y="180" text-anchor="middle" font-size="13">进样端</text>
    <text x="58" y="197" text-anchor="middle" font-size="13" fill="#666">（缓冲液）</text>
    <rect x="508" y="90" width="56" height="72" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="536" y="180" text-anchor="middle" font-size="13">检测端</text>
    <text x="536" y="197" text-anchor="middle" font-size="13" fill="#666">（缓冲液）</text>

    <!-- 毛细管 -->
    <rect x="86" y="112" width="422" height="16" rx="8" fill="#eef3f6" stroke="#333" stroke-width="2"/>
    <text x="300" y="147" text-anchor="middle" font-size="13" fill="#666">毛细管（内径 25–100 μm，内充缓冲液）</text>

    <!-- 管内离子与流向 -->
    <text x="148" y="128" text-anchor="middle" font-size="15" fill="#c0392b">+</text>
    <text x="226" y="128" text-anchor="middle" font-size="15" fill="#666">•</text>
    <text x="316" y="128" text-anchor="middle" font-size="15" fill="#1f6f8b">−</text>
    <!-- 流向箭头（EOF 统一向右） -->
    <line x1="150" y1="102" x2="206" y2="102" stroke="#c0392b" stroke-width="2"/>
    <polygon points="206,98 214,102 206,106" fill="#c0392b"/>
    <line x1="228" y1="102" x2="284" y2="102" stroke="#666" stroke-width="2"/>
    <polygon points="284,98 292,102 284,106" fill="#666"/>
    <line x1="318" y1="102" x2="360" y2="102" stroke="#1f6f8b" stroke-width="2"/>
    <polygon points="360,98 368,102 360,106" fill="#1f6f8b"/>

    <!-- 检测窗口 -->
    <rect x="440" y="100" width="26" height="40" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="453" y="86" text-anchor="middle" font-size="13" fill="#c0392b">检测窗口（UV）</text>

    <!-- 高压电源与电极 -->
    <rect x="248" y="296" width="150" height="58" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="323" y="320" text-anchor="middle" font-size="14">高压电源</text>
    <text x="323" y="338" text-anchor="middle" font-size="13" fill="#666">（10–30 kV）</text>
    <path d="M 58 162 L 58 240 L 285 240 L 285 296" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 536 162 L 536 240 L 361 240 L 361 296" fill="none" stroke="#333" stroke-width="2"/>
    <text x="40" y="255" font-size="14" fill="#c0392b">+（阳极）</text>
    <text x="556" y="255" font-size="14" fill="#1f6f8b">−（阴极）</text>

    <!-- 电泳图输出 -->
    <rect x="556" y="24" width="66" height="50" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="589" y="46" text-anchor="middle" font-size="13" fill="#c0392b">电泳图</text>
    <text x="589" y="62" text-anchor="middle" font-size="13" fill="#c0392b">数据</text>
    <path d="M 453 100 L 589 74" fill="none" stroke="#333" stroke-width="2"/>

    <!-- 流速剖面插图 -->
    <rect x="418" y="330" width="208" height="120" rx="8" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="522" y="350" text-anchor="middle" font-size="14">流速剖面</text>
    <!-- 塞状流 -->
    <text x="462" y="372" text-anchor="middle" font-size="13" fill="#1f6f8b">电渗流（塞状）</text>
    <rect x="446" y="378" width="12" height="48" fill="#eef3f6" stroke="#666" stroke-width="1"/>
    <line x1="452" y1="384" x2="476" y2="384" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="452" y1="392" x2="476" y2="392" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="452" y1="400" x2="476" y2="400" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="452" y1="408" x2="476" y2="408" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="452" y1="416" x2="476" y2="416" stroke="#1f6f8b" stroke-width="2"/>
    <!-- 抛物线流 -->
    <text x="578" y="372" text-anchor="middle" font-size="13" fill="#666">压力流（抛物状）</text>
    <rect x="562" y="378" width="12" height="48" fill="#f6f0ea" stroke="#666" stroke-width="1"/>
    <line x1="568" y1="384" x2="580" y2="384" stroke="#666" stroke-width="2"/>
    <line x1="568" y1="392" x2="596" y2="392" stroke="#666" stroke-width="2"/>
    <line x1="568" y1="400" x2="600" y2="400" stroke="#666" stroke-width="2"/>
    <line x1="568" y1="408" x2="596" y2="408" stroke="#666" stroke-width="2"/>
    <line x1="568" y1="416" x2="580" y2="416" stroke="#666" stroke-width="2"/>
  </g>
</svg>
