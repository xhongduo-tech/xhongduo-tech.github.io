<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>色谱流出曲线（色谱图）与保留参数</title>
  <desc>一张典型色谱图：横轴为时间，纵轴为检测器信号，标注死时间 tM、两个组分的保留时间 tR 与峰底宽度 W。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333">
    <!-- 坐标轴 -->
    <line x1="70" y1="330" x2="600" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="330" x2="70" y2="40" stroke="#333" stroke-width="2"/>
    <text x="600" y="360" text-anchor="end" font-size="15">时间 / min</text>
    <text x="44" y="185" text-anchor="middle" font-size="15" transform="rotate(-90 44 185)">信号</text>

    <!-- 基线 -->
    <line x1="70" y1="330" x2="580" y2="330" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- 进样点 -->
    <circle cx="70" cy="330" r="3" fill="#c0392b"/>
    <text x="58" y="350" text-anchor="middle" font-size="14" fill="#c0392b">进样</text>

    <!-- 峰 A -->
    <path d="M 185 330 Q 250 55 315 330" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <!-- 峰 B -->
    <path d="M 370 330 Q 440 40 510 330" fill="none" stroke="#c0392b" stroke-width="2.5"/>

    <!-- 死时间 tM 虚线 -->
    <line x1="140" y1="330" x2="140" y2="30" stroke="#999" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="140" y="24" text-anchor="middle" font-size="15" font-style="italic">t_M</text>

    <!-- 峰 A 保留时间 -->
    <line x1="70" y1="55" x2="250" y2="55" stroke="#333" stroke-width="1.5"/>
    <line x1="250" y1="330" x2="250" y2="55" stroke="#333" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="160" y="48" text-anchor="middle" font-size="15" font-style="italic">t_R,A</text>

    <!-- 峰 B 保留时间 -->
    <line x1="70" y1="75" x2="440" y2="75" stroke="#333" stroke-width="1.5"/>
    <line x1="440" y1="330" x2="440" y2="40" stroke="#333" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="255" y="68" text-anchor="middle" font-size="15" font-style="italic">t_R,B</text>

    <!-- 峰 A 峰底宽 W_A -->
    <line x1="200" y1="380" x2="300" y2="380" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="200" y1="374" x2="200" y2="386" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="300" y1="374" x2="300" y2="386" stroke="#1f6f8b" stroke-width="2"/>
    <text x="250" y="402" text-anchor="middle" font-size="15" font-style="italic" fill="#1f6f8b">W_A</text>

    <!-- 峰 B 峰底宽 W_B -->
    <line x1="395" y1="380" x2="485" y2="380" stroke="#c0392b" stroke-width="2"/>
    <line x1="395" y1="374" x2="395" y2="386" stroke="#c0392b" stroke-width="2"/>
    <line x1="485" y1="374" x2="485" y2="386" stroke="#c0392b" stroke-width="2"/>
    <text x="440" y="402" text-anchor="middle" font-size="15" font-style="italic" fill="#c0392b">W_B</text>

    <!-- 图例 -->
    <text x="70" y="410" font-size="14" fill="#666">峰距由 α、k′ 决定，峰宽由柱效 N 决定，两者合成分离度 R_s</text>
  </g>
</svg>
