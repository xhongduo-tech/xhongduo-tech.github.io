<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
<title>x86-64 指令的字节编码格式</title>
<desc>展示 x86-64 指令由前缀、操作码、ModRM、SIB、位移与立即数构成，并以 addq $4, %rax 的机器码 48 83 c0 04 为例拆解 ModRM 与 REX 前缀。</desc>
<rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
<text x="20" y="30" font-size="16" fill="#333">通用编码格式（一条指令最长 15 字节）</text>
<g font-size="14" fill="#333">
<rect x="20" y="45" width="70" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="28" y="72">前缀</text>
<rect x="100" y="45" width="90" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="108" y="72">操作码</text>
<rect x="200" y="45" width="100" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="208" y="72">ModRM</text>
<rect x="310" y="45" width="80" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="318" y="72">SIB</text>
<rect x="400" y="45" width="80" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="408" y="72">位移</text>
<rect x="490" y="45" width="110" height="44" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/><text x="498" y="72">立即数</text>
</g>
<text x="20" y="80" font-size="13" fill="#666" text-anchor="middle"></text>
<text x="55" y="115" font-size="12" fill="#666" text-anchor="middle">可选</text>
<text x="250" y="115" font-size="12" fill="#666" text-anchor="middle">可选</text>
<text x="350" y="115" font-size="12" fill="#666" text-anchor="middle">可选</text>
<text x="440" y="115" font-size="12" fill="#666" text-anchor="middle">可选</text>
<text x="545" y="115" font-size="12" fill="#666" text-anchor="middle">可选</text>

<text x="20" y="150" font-size="16" fill="#333">实例：addq $4, %rax → 机器码 48 83 c0 04</text>
<g font-size="15" fill="#fff">
<rect x="20" y="165" width="70" height="46" fill="#1f6f8b"/><text x="38" y="194">48</text>
<rect x="100" y="165" width="70" height="46" fill="#1f6f8b"/><text x="118" y="194">83</text>
<rect x="180" y="165" width="70" height="46" fill="#1f6f8b"/><text x="198" y="194">c0</text>
<rect x="260" y="165" width="70" height="46" fill="#1f6f8b"/><text x="278" y="194">04</text>
</g>
<g font-size="13" fill="#333">
<text x="24" y="228" text-anchor="middle" x="55">REX.W：</text>
<text x="30" y="245">64 位操作数</text>
<text x="135" y="228">add 的</text>
<text x="130" y="245">imm8 形式</text>
<text x="215" y="228">ModRM</text>
<text x="215" y="245">（见下）</text>
<text x="295" y="228">立即数 4</text>
</g>

<text x="20" y="290" font-size="16" fill="#333">ModRM 字节 c0 = 11 000 000</text>
<g font-size="14" fill="#333">
<rect x="20" y="305" width="120" height="40" fill="#eaf3f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="30" y="330">mod = 11</text>
<rect x="150" y="305" width="120" height="40" fill="#eaf3f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="160" y="330">reg = 000</text>
<rect x="280" y="305" width="120" height="40" fill="#eaf3f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="290" y="330">r/m = 000</text>
</g>
<g font-size="13" fill="#666">
<text x="25" y="365">mod=11：两个操作数均为寄存器</text>
<text x="25" y="385">reg=000：源寄存器 %rax（或操作码扩展）</text>
<text x="25" y="405">r/m=000：目的寄存器 %rax</text>
</g>

<text x="20" y="440" font-size="14" fill="#c0392b">REX 前缀 0100 W R X B：48 = 0100 1 000，W=1 表示 64 位操作数；</text>
<text x="20" y="462" font-size="14" fill="#c0392b">R/X/B 分别扩展 reg / index / base 到 %r8-%r15。</text>
</svg>
