<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" font-family="sans-serif">
<title>函数调用栈帧的布局</title>
<desc>展示 call 指令压入返回地址后，函数栈帧内保存的 %rbp、局部变量区与参数构造区的相对位置，以及 %rsp 与 %rbp 的指向。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="500" height="560" fill="#faf9f5"/>
<text x="30" y="30" font-size="16" fill="#333">栈向低地址方向生长（pushq 使 %rsp 减 8）</text>
<line x1="360" y1="40" x2="360" y2="505" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
<line x1="45" y1="90" x2="45" y2="110" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="80" font-size="14" fill="#1f6f8b">高地址</text>
<line x1="45" y1="500" x2="45" y2="470" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="525" font-size="14" fill="#1f6f8b">低地址</text>
<rect x="70" y="60" width="300" height="450" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<rect x="70" y="60" width="300" height="90" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="90" y="95" font-size="15" fill="#333">调用者的栈帧</text>
<text x="90" y="120" font-size="13" fill="#666">（第 7 个及以后的参数也在这里）</text>
<rect x="70" y="150" width="300" height="50" fill="#f2e9e1" stroke="#333" stroke-width="1"/>
<text x="90" y="180" font-size="15" fill="#333">返回地址（callq 压入）</text>
<rect x="70" y="200" width="300" height="50" fill="#f2e9e1" stroke="#333" stroke-width="1"/>
<text x="90" y="230" font-size="15" fill="#333">保存的 %rbp（旧帧指针）</text>
<rect x="70" y="250" width="300" height="70" fill="#eaf3f5" stroke="#333" stroke-width="1"/>
<text x="90" y="285" font-size="15" fill="#333">局部变量区</text>
<text x="90" y="308" font-size="13" fill="#666">（编译器以负偏移访问：-8(%rbp)）</text>
<rect x="70" y="320" width="300" height="70" fill="#fbf3df" stroke="#333" stroke-width="1"/>
<text x="90" y="352" font-size="15" fill="#333">参数构造区</text>
<text x="90" y="375" font-size="13" fill="#666">（调用前写入子过程的实参）</text>
<rect x="70" y="390" width="300" height="120" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="90" y="430" font-size="14" fill="#666">未使用空间</text>
<text x="90" y="452" font-size="13" fill="#666">（更早的栈帧在更低的地址）</text>
<line x1="380" y1="250" x2="452" y2="228" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="398" y="212" font-size="16" fill="#c0392b">%rbp</text>
<text x="398" y="230" font-size="13" fill="#c0392b">帧指针</text>
<line x1="380" y1="390" x2="452" y2="422" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="398" y="405" font-size="16" fill="#c0392b">%rsp</text>
<text x="398" y="423" font-size="13" fill="#c0392b">栈指针</text>
</svg>
