<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif">
  <title>慢病毒载体三质粒分离包装系统</title>
  <desc>三个质粒共转染生产细胞，组装出只含转移载体 RNA 的重组慢病毒，转导靶细胞后整合为前病毒。</desc>
  <rect width="800" height="480" fill="#faf9f5"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">慢病毒载体：三质粒分离包装系统</text>

  <!-- 三个质粒 -->
  <rect x="20" y="48" width="240" height="74" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">质粒1 · 转移载体</text>
  <text x="140" y="88" text-anchor="middle" font-size="13" fill="#1f6f8b">5′LTR · ψ · 目的基因 · SIN-3′LTR</text>
  <text x="140" y="108" text-anchor="middle" font-size="13" fill="#666">唯一带 ψ，能入颗粒并整合</text>

  <rect x="20" y="132" width="240" height="74" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">质粒2 · 包装质粒</text>
  <text x="140" y="172" text-anchor="middle" font-size="13" fill="#1f6f8b">CMV · gag-pol · rev</text>
  <text x="140" y="192" text-anchor="middle" font-size="13" fill="#666">提供蛋白与酶，无 ψ</text>

  <rect x="20" y="216" width="240" height="74" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">质粒3 · 包膜质粒</text>
  <text x="140" y="256" text-anchor="middle" font-size="13" fill="#1f6f8b">CMV · VSV-G</text>
  <text x="140" y="276" text-anchor="middle" font-size="13" fill="#666">假型化：广谱嗜性、可浓缩</text>

  <!-- 生产细胞 -->
  <ellipse cx="405" cy="172" rx="105" ry="88" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="405" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">生产细胞 HEK293T</text>
  <text x="405" y="172" text-anchor="middle" font-size="13" fill="#333">共转染 → 转录 → 组装</text>
  <text x="405" y="194" text-anchor="middle" font-size="13" fill="#666">重组慢病毒出芽</text>

  <!-- 箭头：质粒 -> 生产细胞 -->
  <line x1="260" y1="90" x2="310" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="260" y1="170" x2="305" y2="172" stroke="#333" stroke-width="2"/>
  <line x1="260" y1="250" x2="310" y2="212" stroke="#333" stroke-width="2"/>

  <!-- 病毒颗粒 -->
  <circle cx="620" cy="172" r="30" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="595,160 588,150 605,155" fill="#c0392b"/>
  <polygon points="645,160 652,150 635,155" fill="#c0392b"/>
  <polygon points="590,185 580,195 600,193" fill="#c0392b"/>
  <polygon points="650,185 660,195 640,193" fill="#c0392b"/>
  <text x="620" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">重组慢病毒颗粒</text>
  <text x="620" y="242" text-anchor="middle" font-size="13" fill="#666">基因组 = 转移载体 RNA（ψ+）</text>

  <!-- 箭头：生产细胞 -> 病毒 -->
  <line x1="510" y1="172" x2="588" y2="172" stroke="#333" stroke-width="2"/>

  <!-- 箭头：病毒 -> 靶细胞 -->
  <line x1="620" y1="252" x2="620" y2="278" stroke="#333" stroke-width="2"/>

  <!-- 靶细胞 -->
  <ellipse cx="620" cy="360" rx="115" ry="78" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="620" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">靶细胞</text>
  <text x="620" y="358" text-anchor="middle" font-size="13" fill="#333">如造血干细胞 / T 细胞</text>
  <line x1="530" y1="380" x2="710" y2="380" stroke="#333" stroke-width="3"/>
  <line x1="585" y1="380" x2="668" y2="380" stroke="#c0392b" stroke-width="6"/>
  <text x="620" y="402" text-anchor="middle" font-size="13" fill="#c0392b">前病毒：目的基因已整合</text>
  <text x="620" y="420" text-anchor="middle" font-size="13" fill="#666">随分裂永久遗传给后代细胞</text>

  <!-- 底部说明 -->
  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#666">安全设计：包装与包膜质粒的序列不进靶细胞，重组病毒无法自我复制，靶细胞只留下转移载体。</text>
</svg>
