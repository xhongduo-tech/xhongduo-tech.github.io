<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">相对风向量三角形</title>
<desc id="desc">迎风航行时，船首向上的坐标中：真风从前方约45度吹来，相对风因船速叠加而更强、更靠前（约20度）；二者与船速满足向量关系 A = T - V。</desc>
<rect width="640" height="360" fill="#faf9f5"/>
<line x1="320" y1="60" x2="320" y2="225" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="320" y="48" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">船首向</text>
<polygon points="292,215 348,215 342,228 298,228" fill="#333" stroke="none"/>
<line x1="320" y1="215" x2="320" y2="150" stroke="#333" stroke-width="3"/>
<line x1="180" y1="100" x2="303" y2="197" stroke="#1f6f8b" stroke-width="4" fill="none"/>
<polygon points="303,197 286,196 294,210" fill="#1f6f8b" stroke="none"/>
<text x="140" y="92" font-family="sans-serif" font-size="15" fill="#1f6f8b">真风 T</text>
<text x="140" y="112" font-family="sans-serif" font-size="13" fill="#666">θ≈45°</text>
<line x1="250" y1="40" x2="315" y2="197" stroke="#c0392b" stroke-width="4" fill="none"/>
<polygon points="315,197 298,193 305,208" fill="#c0392b" stroke="none"/>
<text x="198" y="32" font-family="sans-serif" font-size="15" fill="#c0392b">相对风 A</text>
<text x="198" y="52" font-family="sans-serif" font-size="13" fill="#666">β≈20°</text>
<line x1="420" y1="300" x2="540" y2="300" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<polygon points="540,300 530,294 530,306" fill="#1f6f8b" stroke="none"/>
<text x="480" y="286" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">T（空气动）</text>
<line x1="420" y1="300" x2="420" y2="220" stroke="#333" stroke-width="3" fill="none"/>
<polygon points="420,220 413,230 427,230" fill="#333" stroke="none"/>
<text x="452" y="248" font-family="sans-serif" font-size="13" fill="#333">V（船速）</text>
<line x1="540" y1="300" x2="540" y2="220" stroke="#999" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
<polygon points="540,220 533,230 547,230" fill="#999" stroke="none"/>
<text x="560" y="256" font-family="sans-serif" font-size="13" fill="#666">−V</text>
<line x1="420" y1="300" x2="540" y2="220" stroke="#c0392b" stroke-width="3" fill="none"/>
<polygon points="540,220 528,222 532,236" fill="#c0392b" stroke="none"/>
<text x="560" y="212" font-family="sans-serif" font-size="13" fill="#c0392b">A = T − V</text>
<text x="320" y="344" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">迎风时：相对风更强、更靠前（矢量式：A = T − V）</text>
</svg>
