<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">帆面受力分解示意图</title>
<desc id="desc">左侧为帆的翼型剖面与绕流：背风面流速快压强低、迎风面流速慢压强高；右侧为升力、阻力与合力，以及合力沿船首向的推进分力与垂直船体的侧向分力。</desc>
<rect width="640" height="360" fill="#faf9f5"/>
<g font-family="sans-serif">
<text x="140" y="32" font-size="16" fill="#333" text-anchor="middle">帆的翼型剖面与压差</text>
<text x="470" y="32" font-size="16" fill="#333" text-anchor="middle">升力与阻力的合力分解</text>
</g>
<g stroke="#1f6f8b" stroke-width="2" fill="none">
<line x1="30" y1="150" x2="88" y2="150"/><polygon points="88,150 78,145 78,155" fill="#1f6f8b" stroke="none"/>
<line x1="30" y1="175" x2="88" y2="175"/><polygon points="88,175 78,170 78,180" fill="#1f6f8b" stroke="none"/>
<line x1="30" y1="200" x2="88" y2="200"/><polygon points="88,200 78,195 78,205" fill="#1f6f8b" stroke="none"/>
<line x1="30" y1="225" x2="88" y2="225"/><polygon points="88,225 78,220 78,230" fill="#1f6f8b" stroke="none"/>
</g>
<path d="M 70 200 C 140 118 240 118 300 165" stroke="#333" stroke-width="14" fill="none" stroke-linecap="round"/>
<g font-family="sans-serif" font-size="14">
<text x="120" y="96" fill="#c0392b" text-anchor="middle">背风面：流速快、压强低</text>
<text x="130" y="258" fill="#1f6f8b" text-anchor="middle">迎风面：流速慢、压强高</text>
<text x="80" y="240" fill="#333" text-anchor="end">相对风</text>
</g>
<g font-family="sans-serif">
<line x1="330" y1="210" x2="470" y2="210" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="330" y1="210" x2="545" y2="82" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="545" y="76" font-size="14" fill="#666">船首向</text>
<line x1="330" y1="210" x2="330" y2="70" stroke="#c0392b" stroke-width="3" fill="none"/>
<polygon points="330,70 322,82 338,82" fill="#c0392b" stroke="none"/>
<text x="306" y="60" font-size="14" fill="#c0392b">升力 L</text>
<line x1="330" y1="210" x2="470" y2="210" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<polygon points="470,210 458,202 458,218" fill="#1f6f8b" stroke="none"/>
<text x="478" y="226" font-size="14" fill="#1f6f8b">阻力 D</text>
<line x1="330" y1="210" x2="470" y2="70" stroke="#333" stroke-width="3" fill="none"/>
<polygon points="470,70 456,72 460,86" fill="#333" stroke="none"/>
<text x="478" y="66" font-size="14" fill="#333">合力 R</text>
<line x1="330" y1="210" x2="490" y2="98" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="8,5" fill="none"/>
<polygon points="490,98 476,100 481,113" fill="#1f6f8b" stroke="none"/>
<text x="500" y="120" font-size="13" fill="#1f6f8b">推进分力</text>
<line x1="330" y1="210" x2="310" y2="182" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8,5" fill="none"/>
<polygon points="310,182 320,177 320,190" fill="#c0392b" stroke="none"/>
<text x="258" y="176" font-size="13" fill="#c0392b">侧向分力</text>
<line x1="470" y1="70" x2="490" y2="98" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="470" y1="70" x2="310" y2="182" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
</g>
</svg>
