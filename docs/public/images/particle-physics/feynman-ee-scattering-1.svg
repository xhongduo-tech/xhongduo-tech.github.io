<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="sans-serif">
  <title>电子-电子散射的费曼图</title>
  <desc>两个电子通过交换一个虚光子相互散射。电子用实线表示，光子用波浪线表示，交点即相互作用顶点。时间轴向上。</desc>
  <rect width="420" height="320" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="80" y1="300" x2="170" y2="160"/>
    <line x1="340" y1="300" x2="250" y2="160"/>
    <line x1="170" y1="160" x2="80" y2="20"/>
    <line x1="250" y1="160" x2="340" y2="20"/>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M170 160 q 22 -12 0 -24 q -22 -12 0 -24 q 22 -12 0 -24 q -22 -12 0 -24 q 22 -12 0 -24" />
  </g>
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="40" y1="300" x2="40" y2="20"/>
    <line x1="30" y1="300" x2="50" y2="300"/>
    <line x1="30" y1="20" x2="50" y2="20"/>
    <path d="M 40 290 l -5 8 h 10 z"/>
  </g>
  <g fill="#333" font-size="15">
    <text x="52" y="286">时间</text>
    <text x="78" y="318" text-anchor="middle">$e^-$</text>
    <text x="342" y="318" text-anchor="middle">$e^-$</text>
    <text x="78" y="12" text-anchor="middle">$e^-$</text>
    <text x="342" y="12" text-anchor="middle">$e^-$</text>
    <text x="195" y="60" text-anchor="middle" fill="#c0392b">$\gamma$</text>
    <text x="210" y="175" font-size="13">顶点</text>
  </g>
  <g fill="#333" font-size="13">
    <text x="210" y="310" text-anchor="middle">电子-电子散射：两个费米子交换一个虚光子</text>
  </g>
</svg>
