<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>桥式起重机结构组成示意图</title>
<desc>侧视图：厂房立柱上方铺设轨道，主梁两端经端梁架在轨道上，小车在主梁上行走，钢丝绳下挂吊钩与吊物，主梁下方设司机室。</desc>
<rect x="0" y="0" width="800" height="400" fill="#faf9f5"/>

<!-- 厂房 -->
<rect x="110" y="150" width="12" height="200" fill="#c8c4ba"/>
<rect x="678" y="150" width="12" height="200" fill="#c8c4ba"/>
<line x1="40" y1="350" x2="760" y2="350" stroke="#333" stroke-width="2"/>

<!-- 轨道 -->
<rect x="104" y="148" width="26" height="6" fill="#333"/>
<rect x="670" y="148" width="26" height="6" fill="#333"/>

<!-- 端梁（大车运行机构） -->
<rect x="98" y="118" width="38" height="30" rx="3" fill="#1f6f8b"/>
<rect x="664" y="118" width="38" height="30" rx="3" fill="#1f6f8b"/>

<!-- 主梁 -->
<rect x="136" y="100" width="528" height="20" rx="3" fill="#c0392b"/>

<!-- 小车 -->
<rect x="358" y="76" width="44" height="24" rx="3" fill="#1f6f8b"/>

<!-- 钢丝绳 -->
<line x1="370" y1="100" x2="366" y2="236" stroke="#333" stroke-width="2"/>
<line x1="390" y1="100" x2="394" y2="236" stroke="#333" stroke-width="2"/>

<!-- 吊钩 -->
<path d="M366 236 h28 l-4 18 h-20 z" fill="none" stroke="#333" stroke-width="2.5"/>

<!-- 吊物 -->
<rect x="340" y="258" width="80" height="34" rx="2" fill="#e8e4d8" stroke="#333" stroke-width="1.5"/>

<!-- 司机室 -->
<rect x="560" y="150" width="46" height="48" rx="3" fill="#e8e4d8" stroke="#333" stroke-width="1.5"/>
<rect x="568" y="158" width="30" height="16" rx="2" fill="#aad4e5"/>

<!-- 标注：屋架 -->
<text x="392" y="36" font-size="15" fill="#333" text-anchor="middle">厂房屋架 / 车间</text>

<!-- 标注：大车运行 -->
<text x="117" y="112" font-size="14" fill="#333" text-anchor="middle">端梁（大车运行）</text>
<line x1="117" y1="116" x2="117" y2="128" stroke="#333" stroke-width="1"/>

<!-- 标注：主梁 -->
<text x="300" y="60" font-size="15" fill="#333" text-anchor="middle">主梁（桥架）</text>
<line x1="300" y1="64" x2="360" y2="96" stroke="#333" stroke-width="1"/>

<!-- 标注：小车 -->
<text x="430" y="88" font-size="15" fill="#333">小车（起升+小车运行）</text>
<line x1="428" y1="92" x2="404" y2="88" stroke="#333" stroke-width="1"/>

<!-- 标注：钢丝绳 + 吊钩 -->
<text x="448" y="238" font-size="15" fill="#333">钢丝绳与吊钩（起升机构）</text>
<line x1="446" y1="234" x2="400" y2="238" stroke="#333" stroke-width="1"/>

<!-- 标注：吊物 -->
<text x="380" y="318" font-size="15" fill="#333" text-anchor="middle">吊物</text>
<line x1="380" y1="310" x2="380" y2="294" stroke="#333" stroke-width="1"/>

<!-- 标注：司机室 -->
<text x="600" y="192" font-size="15" fill="#333" text-anchor="start">司机室</text>
<line x1="600" y1="196" x2="608" y2="176" stroke="#333" stroke-width="1"/>

<!-- 标注：轨道 -->
<text x="150" y="176" font-size="14" fill="#333">大车轨道</text>
<line x1="152" y1="172" x2="128" y2="152" stroke="#333" stroke-width="1"/>

<!-- 标注：厂房立柱 -->
<text x="196" y="296" font-size="14" fill="#333">厂房立柱</text>
<line x1="198" y1="292" x2="122" y2="330" stroke="#333" stroke-width="1"/>
</svg>
