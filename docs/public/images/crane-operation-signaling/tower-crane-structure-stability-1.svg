<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>塔式起重机结构组成示意图</title>
<desc>侧视图：塔身立于基础之上，回转支承以上为塔顶、起重臂与平衡臂，平衡臂端设平衡重，起重臂下方钢丝绳悬挂吊物。</desc>
<rect x="0" y="0" width="800" height="420" fill="#faf9f5"/>

<!-- 地面 -->
<line x1="30" y1="380" x2="770" y2="380" stroke="#333" stroke-width="2"/>

<!-- 基础 -->
<rect x="320" y="360" width="80" height="20" rx="2" fill="#c8c4ba"/>

<!-- 塔身（标准节） -->
<rect x="338" y="150" width="44" height="210" fill="#1f6f8b"/>
<line x1="338" y1="200" x2="382" y2="200" stroke="#faf9f5" stroke-width="1.5"/>
<line x1="338" y1="250" x2="382" y2="250" stroke="#faf9f5" stroke-width="1.5"/>
<line x1="338" y1="300" x2="382" y2="300" stroke="#faf9f5" stroke-width="1.5"/>
<line x1="338" y1="340" x2="382" y2="340" stroke="#faf9f5" stroke-width="1.5"/>

<!-- 回转支承 -->
<rect x="330" y="134" width="60" height="16" rx="2" fill="#c0392b"/>

<!-- 塔顶 -->
<line x1="360" y1="134" x2="360" y2="60" stroke="#1f6f8b" stroke-width="6"/>
<line x1="360" y1="60" x2="300" y2="134" stroke="#1f6f8b" stroke-width="3"/>
<line x1="360" y1="60" x2="420" y2="134" stroke="#1f6f8b" stroke-width="3"/>

<!-- 起重臂（右侧） -->
<rect x="360" y="120" width="330" height="14" rx="2" fill="#c0392b"/>
<line x1="360" y1="120" x2="690" y2="120" stroke="#1f6f8b" stroke-width="2"/>
<line x1="360" y1="134" x2="690" y2="134" stroke="#1f6f8b" stroke-width="2"/>

<!-- 起重臂拉索 -->
<line x1="420" y1="80" x2="660" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- 平衡臂（左侧） -->
<rect x="220" y="120" width="140" height="14" rx="2" fill="#1f6f8b"/>
<line x1="300" y1="80" x2="230" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- 平衡重 -->
<rect x="222" y="134" width="34" height="30" rx="2" fill="#c8c4ba" stroke="#333" stroke-width="1.5"/>

<!-- 司机室 -->
<rect x="356" y="150" width="34" height="34" rx="3" fill="#e8e4d8" stroke="#333" stroke-width="1.5"/>

<!-- 起重小车与吊物 -->
<rect x="540" y="108" width="34" height="12" rx="2" fill="#1f6f8b"/>
<line x1="548" y1="120" x2="544" y2="230" stroke="#333" stroke-width="2"/>
<line x1="566" y1="120" x2="570" y2="230" stroke="#333" stroke-width="2"/>
<path d="M544 230 h26 l-4 16 h-18 z" fill="none" stroke="#333" stroke-width="2.5"/>
<rect x="520" y="250" width="74" height="32" rx="2" fill="#e8e4d8" stroke="#333" stroke-width="1.5"/>

<!-- 标注 -->
<text x="360" y="42" font-size="15" fill="#333" text-anchor="middle">塔顶</text>
<text x="560" y="70" font-size="15" fill="#333" text-anchor="middle">起重臂（变幅小车沿臂运行）</text>
<text x="210" y="70" font-size="15" fill="#333" text-anchor="middle">平衡臂</text>
<text x="240" y="182" font-size="14" fill="#333" text-anchor="middle">平衡重</text>
<text x="300" y="286" font-size="15" fill="#333">塔身（标准节）</text>
<line x1="302" y1="282" x2="380" y2="300" stroke="#333" stroke-width="1"/>
<text x="400" y="170" font-size="14" fill="#333">司机室</text>
<line x1="398" y1="166" x2="392" y2="156" stroke="#333" stroke-width="1"/>
<text x="600" y="306" font-size="15" fill="#333">吊物</text>
<line x1="598" y1="300" x2="560" y2="284" stroke="#333" stroke-width="1"/>
<text x="360" y="404" font-size="14" fill="#333" text-anchor="middle">基础（固定式）</text>
<text x="720" y="404" font-size="14" fill="#333" text-anchor="end">回转支承在塔身与塔顶之间</text>
</svg>
