<svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>流动式起重机起重特性曲线示意图</title>
<desc>坐标图：横轴为幅度 R（米），纵轴为起重量 Q（吨）；实线为支腿全伸作业额定起重量曲线，曲线下方为安全作业区；虚线为吊重行走或支腿未伸时的允许起重量，明显更低。</desc>
<rect x="0" y="0" width="660" height="440" fill="#faf9f5"/>

<!-- 坐标轴 -->
<line x1="90" y1="40" x2="90" y2="380" stroke="#333" stroke-width="2"/>
<line x1="90" y1="380" x2="620" y2="380" stroke="#333" stroke-width="2"/>
<text x="48" y="220" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 48 220)">起重量 Q (t)</text>
<text x="355" y="412" font-size="15" fill="#333" text-anchor="middle">幅度 R (m)</text>

<!-- 刻度 -->
<text x="80" y="385" font-size="13" fill="#333" text-anchor="end">0</text>
<text x="80" y="47" font-size="13" fill="#333" text-anchor="end">20</text>
<text x="80" y="215" font-size="13" fill="#333" text-anchor="end">10</text>
<text x="92" y="395" font-size="13" fill="#333">2</text>
<text x="250" y="395" font-size="13" fill="#333">6</text>
<text x="405" y="395" font-size="13" fill="#333">10</text>
<text x="560" y="395" font-size="13" fill="#333">14</text>

<!-- 网格线 -->
<line x1="90" y1="127" x2="620" y2="127" stroke="#e0dcd0" stroke-width="1"/>
<line x1="90" y1="215" x2="620" y2="215" stroke="#e0dcd0" stroke-width="1"/>
<line x1="90" y1="302" x2="620" y2="302" stroke="#e0dcd0" stroke-width="1"/>
<line x1="250" y1="40" x2="250" y2="380" stroke="#e0dcd0" stroke-width="1"/>
<line x1="405" y1="40" x2="405" y2="380" stroke="#e0dcd0" stroke-width="1"/>

<!-- 安全作业区（曲线1下方） -->
<polygon points="90,40 90,380 620,380 620,329 544,304 469,269 393,227 317,176 241,125 166,74 90,40" fill="#eef3ee" stroke="none"/>

<!-- 曲线1：支腿全伸 -->
<polyline points="90,40 166,74 241,125 317,176 393,227 469,269 544,304 620,329" fill="none" stroke="#c0392b" stroke-width="3"/>

<!-- 曲线2：支腿未伸/吊重行走 -->
<polyline points="147,261 243,295 317,329 431,346 544,360" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 5"/>

<!-- 标注 -->
<text x="330" y="140" font-size="16" fill="#c0392b">支腿全伸作业曲线</text>
<text x="330" y="318" font-size="14" fill="#1f6f8b">支腿未伸 / 吊重行走曲线</text>
<text x="520" y="220" font-size="16" fill="#333">安全作业区</text>
<text x="520" y="245" font-size="13" fill="#666">（曲线下方）</text>
<text x="240" y="70" font-size="16" fill="#c0392b">超载区</text>
</svg>
