<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" font-family="sans-serif">
  <title>trace–det 平面上的二维线性系统分类</title>
  <desc>以迹 τ 为横轴、行列式 Δ 为纵轴，抛物线与坐标轴把平面划分为鞍点、稳定/不稳定结点、稳定/不稳定螺旋与中心五个区域。</desc>
  <rect width="600" height="580" fill="#faf9f5"/>

  <!-- 抛物线 Δ = τ²/4 -->
  <polyline fill="none" stroke="#333" stroke-width="2.5"
    points="0,-75 30,-3.75 60,60 90,116 120,165 150,206 180,240 210,266 240,285 270,296 300,300 330,296 360,285 390,266 420,240 450,206 480,165 510,116 540,60 570,-3.75 600,-75"/>

  <!-- 坐标轴 -->
  <line x1="30" y1="300" x2="575" y2="300" stroke="#555" stroke-width="1.5"/>
  <line x1="300" y1="560" x2="300" y2="20" stroke="#555" stroke-width="1.5"/>
  <polygon points="575,300 563,294 563,306" fill="#555"/>
  <polygon points="300,20 294,32 306,32" fill="#555"/>

  <text x="565" y="320" font-size="17" fill="#333">τ (trace)</text>
  <text x="312" y="40" font-size="17" fill="#333">Δ (det)</text>
  <text x="312" y="315" font-size="16" fill="#333">0</text>

  <!-- 分界线标注 -->
  <text x="80" y="100" font-size="14" fill="#666">Δ = τ²/4</text>

  <!-- 区域标注 -->
  <text x="255" y="70" font-size="16" fill="#333" text-anchor="middle">中心 center</text>
  <text x="180" y="100" font-size="15" fill="#1f6f8b" text-anchor="middle">稳定螺旋 stable spiral</text>
  <text x="420" y="100" font-size="15" fill="#c0392b" text-anchor="middle">不稳定螺旋 unstable spiral</text>
  <text x="108" y="200" font-size="15" fill="#1f6f8b" text-anchor="middle">稳定结点 stable node</text>
  <text x="492" y="200" font-size="15" fill="#c0392b" text-anchor="middle">不稳定结点 unstable node</text>
  <text x="300" y="500" font-size="15" fill="#c0392b" text-anchor="middle">鞍点 saddle</text>

  <text x="40" y="330" font-size="14" fill="#1f6f8b">τ &lt; 0：稳定侧</text>
  <text x="400" y="580" font-size="14" fill="#c0392b">τ &gt; 0：不稳定侧</text>
</svg>
