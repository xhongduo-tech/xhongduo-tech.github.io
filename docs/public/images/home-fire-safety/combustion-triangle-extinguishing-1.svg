<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <title>燃烧三要素：火三角</title>
  <desc>燃烧需要可燃物、助燃物（氧气）与引火源三个要素同时具备；移走任意一个要素，燃烧即停止，这就是灭火的基本原理。</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <line x1="320" y1="110" x2="140" y2="340" stroke="#333" stroke-width="3"/>
  <line x1="140" y1="340" x2="500" y2="340" stroke="#333" stroke-width="3"/>
  <line x1="500" y1="340" x2="320" y2="110" stroke="#333" stroke-width="3"/>
  <text x="320" y="245" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#c0392b" font-weight="bold">燃烧</text>
  <text x="320" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">三个要素缺一不可</text>
  <circle cx="320" cy="110" r="55" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="320" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">引火源</text>
  <text x="320" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">火种 · 高温</text>
  <circle cx="140" cy="340" r="55" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="140" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">可燃物</text>
  <text x="140" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">木材 · 燃气 · 油</text>
  <circle cx="500" cy="340" r="55" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="500" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">助燃物</text>
  <text x="500" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">氧气（空气）</text>
  <text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b">灭火 ＝ 移走任意一个要素：冷却 · 隔离 · 窒息 · 化学抑制</text>
</svg>
