<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <title>剂量—反应曲线</title>
  <desc>阈值型 S 形曲线与线性无阈值（LNT）曲线的对比，标注 LD50、NOAEL 与阈剂量</desc>
  <rect width="400" height="300" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="60" y1="260" x2="60" y2="40"/>
    <line x1="60" y1="260" x2="380" y2="260"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="13">
    <text x="200" y="294" text-anchor="middle">剂量（对数刻度）</text>
    <text x="24" y="150" text-anchor="middle" transform="rotate(-90 24 150)">反应率（%）</text>
    <text x="72" y="274">0</text>
    <text x="352" y="274">高</text>
  </g>
  <path d="M 65 250 C 150 250, 205 232, 245 190 C 285 148, 310 96, 360 62" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 65 236 L 370 62" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#999" stroke-width="1" stroke-dasharray="3 3">
    <line x1="270" y1="150" x2="60" y2="150"/>
    <line x1="270" y1="260" x2="270" y2="150"/>
    <line x1="235" y1="260" x2="235" y2="62"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="13">
    <circle cx="270" cy="150" r="4" fill="#c0392b" stroke="none"/>
    <text x="280" y="144" fill="#c0392b">LD₅₀：半数效应剂量</text>
    <text x="205" y="252" fill="#1f6f8b">NOAEL 阈剂量</text>
  </g>
  <g font-family="sans-serif" font-size="13">
    <rect x="230" y="70" width="150" height="18" fill="#fff" stroke="#c0392b"/>
    <text x="236" y="84" fill="#c0392b">阈值型（S 形曲线）</text>
    <rect x="230" y="92" width="150" height="18" fill="#fff" stroke="#1f6f8b"/>
    <text x="236" y="106" fill="#1f6f8b">无阈值型（LNT 直线）</text>
  </g>
</svg>
