<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="sans-serif">
  <title>六大茶类加工工艺流程图</title>
  <desc>同一片鲜叶，经杀青系（先灭酶）或萎凋系（先氧化）两条路线，分流为绿茶、黄茶、黑茶与白茶、乌龙、红茶六大茶类的工艺示意图，底部为发酵程度刻度。</desc>

  <rect x="0" y="0" width="940" height="620" fill="#faf9f5"/>

  <!-- 鲜叶 -->
  <rect x="380" y="24" width="180" height="44" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="470" y="52" text-anchor="middle" font-size="20" fill="#333333">茶鲜叶</text>

  <!-- 分支连线 -->
  <line x1="470" y1="68" x2="200" y2="106" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="470" y1="68" x2="740" y2="106" stroke="#c0392b" stroke-width="2"/>

  <!-- 杀青系 -->
  <rect x="60" y="108" width="280" height="40" rx="6" fill="#eaf1f4" stroke="#1f6f8b" stroke-width="2"/>
  <text x="200" y="134" text-anchor="middle" font-size="16" fill="#1f6f8b">杀青系 · 先灭酶（锁氧化）</text>

  <!-- 萎凋系 -->
  <rect x="600" y="108" width="280" height="40" rx="6" fill="#f7eaea" stroke="#c0392b" stroke-width="2"/>
  <text x="740" y="134" text-anchor="middle" font-size="16" fill="#c0392b">萎凋系 · 先氧化（用酶）</text>

  <!-- 树形连线 -->
  <line x1="200" y1="148" x2="100" y2="198" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="200" y1="148" x2="250" y2="198" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="200" y1="148" x2="400" y2="198" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="740" y1="148" x2="550" y2="198" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="740" y1="148" x2="700" y2="198" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="740" y1="148" x2="850" y2="198" stroke="#c0392b" stroke-width="1.5"/>

  <!-- 杀青系三茶 -->
  <rect x="30" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">绿茶</text>
  <text x="100" y="246" text-anchor="middle" font-size="14" fill="#333333">不发酵 · 0%</text>
  <text x="100" y="270" text-anchor="middle" font-size="14" fill="#333333">杀青</text>
  <text x="100" y="288" text-anchor="middle" font-size="14" fill="#333333">揉捻</text>
  <text x="100" y="306" text-anchor="middle" font-size="14" fill="#333333">干燥</text>

  <rect x="180" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="250" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">黄茶</text>
  <text x="250" y="246" text-anchor="middle" font-size="14" fill="#333333">轻发酵 · 10–20%</text>
  <text x="250" y="270" text-anchor="middle" font-size="14" fill="#333333">杀青</text>
  <text x="250" y="288" text-anchor="middle" font-size="14" fill="#333333">闷黄</text>
  <text x="250" y="306" text-anchor="middle" font-size="14" fill="#333333">干燥</text>

  <rect x="330" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="400" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">黑茶</text>
  <text x="400" y="246" text-anchor="middle" font-size="14" fill="#333333">后发酵（渥堆）</text>
  <text x="400" y="270" text-anchor="middle" font-size="14" fill="#333333">杀青 → 揉捻</text>
  <text x="400" y="288" text-anchor="middle" font-size="14" fill="#c0392b">渥堆</text>
  <text x="400" y="306" text-anchor="middle" font-size="14" fill="#333333">干燥</text>

  <!-- 萎凋系三茶 -->
  <rect x="480" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="550" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">白茶</text>
  <text x="550" y="246" text-anchor="middle" font-size="14" fill="#333333">微发酵 · 5–10%</text>
  <text x="550" y="270" text-anchor="middle" font-size="14" fill="#333333">萎凋（长时）</text>
  <text x="550" y="288" text-anchor="middle" font-size="14" fill="#333333">干燥</text>

  <rect x="630" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">乌龙茶</text>
  <text x="700" y="246" text-anchor="middle" font-size="14" fill="#333333">半发酵 · 15–70%</text>
  <text x="700" y="270" text-anchor="middle" font-size="14" fill="#333333">萎凋 → 做青</text>
  <text x="700" y="288" text-anchor="middle" font-size="14" fill="#c0392b">摇青 · 绿叶红镶边</text>
  <text x="700" y="306" text-anchor="middle" font-size="14" fill="#333333">杀青 → 烘焙</text>

  <rect x="780" y="200" width="140" height="132" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="850" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">红茶</text>
  <text x="850" y="246" text-anchor="middle" font-size="14" fill="#333333">全发酵 · 90%+</text>
  <text x="850" y="270" text-anchor="middle" font-size="14" fill="#333333">萎凋 → 揉捻</text>
  <text x="850" y="288" text-anchor="middle" font-size="14" fill="#c0392b">发酵（酶促氧化）</text>
  <text x="850" y="306" text-anchor="middle" font-size="14" fill="#333333">干燥</text>

  <!-- 发酵度刻度 -->
  <text x="470" y="380" text-anchor="middle" font-size="15" fill="#333333">发酵程度（氧化时钟）</text>
  <defs>
    <linearGradient id="oxbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8f5f"/>
      <stop offset="0.35" stop-color="#8fae4a"/>
      <stop offset="0.55" stop-color="#d9a441"/>
      <stop offset="0.8" stop-color="#c06b2b"/>
      <stop offset="1" stop-color="#a3402b"/>
    </linearGradient>
  </defs>
  <rect x="60" y="394" width="820" height="20" rx="4" fill="url(#oxbar)"/>
  <text x="60" y="438" text-anchor="middle" font-size="13" fill="#333333">绿茶 0%</text>
  <text x="240" y="438" text-anchor="middle" font-size="13" fill="#333333">白茶 5–10%</text>
  <text x="350" y="438" text-anchor="middle" font-size="13" fill="#333333">黄茶</text>
  <text x="500" y="438" text-anchor="middle" font-size="13" fill="#333333">乌龙 15–70%</text>
  <text x="690" y="438" text-anchor="middle" font-size="13" fill="#333333">红茶 90%+</text>
  <text x="850" y="438" text-anchor="middle" font-size="13" fill="#333333">黑茶 · 后发酵</text>

  <text x="470" y="490" text-anchor="middle" font-size="14" fill="#666666">黑茶经渥堆的微生物后发酵，是「氧化时钟」之外的再发酵路线</text>
</svg>
