<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>随意皮瓣与轴型皮瓣的血供对比</title>
  <desc>左侧随意皮瓣依靠皮内皮下毛细血管网随机供血，长宽比受限；右侧轴型皮瓣有贯穿全长的轴心血管供血，长宽比不受限。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <text x="165" y="34" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">随意皮瓣</text>
  <rect x="40" y="58" width="250" height="204" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <path d="M40 262 L40 108 Q40 58 100 58 L230 58 Q290 58 290 108 L290 262 Z" fill="#f2e3d5" stroke="#c0392b" stroke-width="2"/>
  <path d="M78 118 c 20 -15 50 -10 60 5 c 10 15 -20 25 -30 10 M88 138 c 15 -10 40 -5 45 10 M98 158 c 20 -12 45 -8 55 8 M84 178 c 18 -8 38 -5 48 10" fill="none" stroke="#1f6f8b" stroke-width="1.4"/>
  <line x1="40" y1="160" x2="18" y2="160" stroke="#333" stroke-width="2.5"/>
  <text x="16" y="150" text-anchor="middle" font-size="14" fill="#333">蒂</text>
  <line x1="40" y1="290" x2="290" y2="290" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="165" y="308" text-anchor="middle" font-size="14" fill="#333">长 : 宽 ≈ 1.5 : 1 ～ 2 : 1</text>
  <text x="165" y="332" text-anchor="middle" font-size="14" fill="#1f6f8b">供血：皮内 / 皮下毛细血管网</text>

  <text x="500" y="34" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">轴型皮瓣</text>
  <rect x="350" y="58" width="250" height="204" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <path d="M350 262 L350 108 Q350 58 410 58 L540 58 Q600 58 600 108 L600 262 Z" fill="#f2e3d5" stroke="#c0392b" stroke-width="2"/>
  <path d="M350 160 L600 160" stroke="#c0392b" stroke-width="4.5"/>
  <path d="M350 160 c 30 -12 60 -8 80 0 M430 160 c 30 -12 60 -8 90 0" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="350" y1="160" x2="328" y2="160" stroke="#333" stroke-width="2.5"/>
  <text x="326" y="150" text-anchor="middle" font-size="14" fill="#333">蒂</text>
  <text x="475" y="192" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">轴心血管贯穿全长</text>
  <line x1="350" y1="290" x2="600" y2="290" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="475" y="308" text-anchor="middle" font-size="14" fill="#333">长宽比不受限，可达 8 : 1</text>
  <text x="475" y="332" text-anchor="middle" font-size="14" fill="#1f6f8b">供血：知名轴心血管</text>

  <text x="320" y="366" text-anchor="middle" font-size="14" fill="#666">血供方式决定皮瓣的存活范围与设计自由度</text>
</svg>
