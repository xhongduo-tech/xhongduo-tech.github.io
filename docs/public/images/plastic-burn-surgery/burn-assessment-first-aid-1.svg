<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="sans-serif">
  <title>中国九分法成人烧伤面积估算</title>
  <desc>头面颈共9%，双上肢各9%合计18%，躯干前后与会阴共27%，双下肢含臀部各23%合计46%。</desc>
  <rect width="600" height="600" fill="#faf9f5"/>
  <text x="300" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">中国九分法（成人）</text>

  <ellipse cx="300" cy="98" rx="45" ry="50" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <rect x="285" y="146" width="30" height="26" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="80" text-anchor="middle" font-size="14" fill="#333">头面</text>
  <text x="300" y="98" text-anchor="middle" font-size="15" fill="#c0392b">6%</text>
  <text x="300" y="165" text-anchor="middle" font-size="13" fill="#333">颈 3%</text>

  <path d="M215 178 L215 378 L385 378 L385 178 Z" fill="#eef1f5" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="255" text-anchor="middle" font-size="14" fill="#c0392b">躯干前 13%</text>
  <text x="300" y="285" text-anchor="middle" font-size="13" fill="#333">躯干后 13%</text>
  <text x="300" y="312" text-anchor="middle" font-size="13" fill="#333">会阴 1%</text>

  <rect x="128" y="184" width="50" height="186" rx="10" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <text x="153" y="252" text-anchor="middle" font-size="13" fill="#333">上肢</text>
  <text x="153" y="274" text-anchor="middle" font-size="15" fill="#c0392b">9%</text>
  <text x="153" y="296" text-anchor="middle" font-size="12" fill="#333">上臂前臂手</text>

  <rect x="422" y="184" width="50" height="186" rx="10" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <text x="447" y="252" text-anchor="middle" font-size="13" fill="#333">上肢</text>
  <text x="447" y="274" text-anchor="middle" font-size="15" fill="#c0392b">9%</text>
  <text x="447" y="296" text-anchor="middle" font-size="12" fill="#333">上臂前臂手</text>

  <rect x="220" y="384" width="74" height="140" rx="12" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <text x="257" y="440" text-anchor="middle" font-size="13" fill="#333">下肢+臀</text>
  <text x="257" y="462" text-anchor="middle" font-size="15" fill="#c0392b">23%</text>

  <rect x="306" y="384" width="74" height="140" rx="12" fill="#f2e3d5" stroke="#333" stroke-width="1.5"/>
  <text x="343" y="440" text-anchor="middle" font-size="13" fill="#333">下肢+臀</text>
  <text x="343" y="462" text-anchor="middle" font-size="15" fill="#c0392b">23%</text>

  <text x="300" y="558" text-anchor="middle" font-size="14" fill="#333">双上肢 18% + 躯干 27% + 双下肢 46% = 100%</text>
</svg>
