<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif">
  <title>Decision Transformer 的轨迹 token 化与因果 Transformer</title>
  <desc>一条轨迹按时间步被切成「返回目标—状态—动作」三 token 序列，逐 token 加和嵌入后送入因果自注意力 Transformer，输出下一个动作的预测。</desc>
  <rect width="800" height="480" fill="#faf9f5"/>
  <!-- trajectory token row -->
  <text x="400" y="36" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">轨迹 τ = (R̂₁, s₁, a₁, R̂₂, s₂, a₂, …, R̂ₜ, sₜ, aₜ)</text>
  <g font-size="15" text-anchor="middle" fill="#fff">
    <rect x="60"  y="52" width="90" height="34" rx="6" fill="#c0392b"/><text x="105" y="74">R̂₁</text>
    <rect x="150" y="52" width="90" height="34" rx="6" fill="#1f6f8b"/><text x="195" y="74">s₁</text>
    <rect x="240" y="52" width="90" height="34" rx="6" fill="#333"/><text x="285" y="74">a₁</text>
    <rect x="360" y="52" width="90" height="34" rx="6" fill="#c0392b"/><text x="405" y="74">R̂₂</text>
    <rect x="450" y="52" width="90" height="34" rx="6" fill="#1f6f8b"/><text x="495" y="74">s₂</text>
    <rect x="540" y="52" width="90" height="34" rx="6" fill="#333"/><text x="585" y="74">a₂</text>
    <rect x="680" y="52" width="100" height="34" rx="6" fill="#c0392b"/><text x="730" y="74">R̂ₜ</text>
  </g>
  <text x="730" y="112" font-size="13" fill="#333" text-anchor="middle">…（最近 K 步）</text>
  <!-- arrows to embedding -->
  <g stroke="#888" stroke-width="2" marker-end="url(#arr)">
    <line x1="105" y1="92" x2="105" y2="140"/>
    <line x1="195" y1="92" x2="195" y2="140"/>
    <line x1="285" y1="92" x2="285" y2="140"/>
    <line x1="730" y1="92" x2="730" y2="140"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>
  <!-- embedding -->
  <rect x="40" y="142" width="720" height="46" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="170" font-size="15" fill="#333" text-anchor="middle">Token 嵌入（位置嵌入 + 返回/状态/动作各自的嵌入，逐时间步加和）</text>
  <!-- transformer block -->
  <rect x="40" y="220" width="720" height="96" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="400" y="252" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">因果自注意力 Transformer × N 层</text>
  <text x="400" y="278" font-size="14" fill="#666" text-anchor="middle">只允许「看过去」：第 t 步的输出只能依赖 t 及以前的 token</text>
  <text x="400" y="300" font-size="14" fill="#666" text-anchor="middle">（位置嵌入给序列提供顺序信息）</text>
  <line x1="105" y1="188" x2="105" y2="220" stroke="#888" stroke-width="2"/>
  <line x1="730" y1="188" x2="730" y2="220" stroke="#888" stroke-width="2"/>
  <line x1="400" y1="316" x2="400" y2="356" stroke="#888" stroke-width="2"/>
  <!-- output -->
  <rect x="280" y="358" width="240" height="44" rx="8" fill="#c0392b"/>
  <text x="400" y="386" font-size="15" fill="#fff" text-anchor="middle">输出：预测动作 âₜ</text>
  <text x="400" y="440" font-size="14" fill="#333" text-anchor="middle">训练：最小化 âₜ 与真实 aₜ 的交叉熵 / 均方误差</text>
  <text x="400" y="464" font-size="14" fill="#666" text-anchor="middle">测试：把期望的返回目标写进 R̂ₜ，让网络按目标续写动作</text>
</svg>
