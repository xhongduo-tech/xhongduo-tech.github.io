<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>奖赏环路与各类成瘾物质的作用位点</title>
<desc>腹侧被盖区经中脑边缘多巴胺通路投射至伏隔核与前额叶皮层；兴奋剂、阿片类、酒精等分别在不同环节增强多巴胺信号。</desc>
<defs>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#faf9f5"/>
<!-- 脑区 -->
<rect x="300" y="330" width="180" height="90" rx="12" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="318" y="360" font-size="16" fill="#333">腹侧被盖区（VTA）</text>
<text x="318" y="384" font-size="13" fill="#555">多巴胺神经元胞体</text>

<rect x="420" y="50" width="190" height="70" rx="12" fill="#fbf1f0" stroke="#c0392b" stroke-width="2"/>
<text x="438" y="78" font-size="16" fill="#333">伏隔核（NAc）</text>
<text x="438" y="102" font-size="13" fill="#555">奖赏与欣快</text>

<rect x="90" y="50" width="190" height="70" rx="12" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
<text x="108" y="78" font-size="16" fill="#333">前额叶皮层（PFC）</text>
<text x="108" y="102" font-size="13" fill="#555">冲动控制与决策</text>

<!-- 多巴胺通路 -->
<path d="M 360 330 C 360 200 440 170 470 122" stroke="#c0392b" stroke-width="5" fill="none" marker-end="url(#arrB)"/>
<text x="380" y="210" font-size="14" fill="#c0392b" transform="rotate(35 380 210)">多巴胺 ↑ 欣快感</text>
<path d="M 340 330 C 330 220 260 160 200 122" stroke="#1f6f8b" stroke-width="4" fill="none"/>
<text x="180" y="220" font-size="14" fill="#1f6f8b">多巴胺 ↑ 渴求、冲动</text>

<!-- 成瘾物质作用位点 -->
<rect x="70" y="200" width="610" height="110" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.5"/>
<text x="90" y="226" font-size="15" fill="#333">各类物质的最终共同通路：强化伏隔核多巴胺信号</text>
<text x="90" y="252" font-size="14" fill="#555">兴奋剂（可卡因、苯丙胺）→ 阻断多巴胺转运体（DAT），突触间隙多巴胺升高</text>
<text x="90" y="276" font-size="14" fill="#555">阿片类 → 作用于 μ 阿片受体，间接解除对多巴胺神经元的抑制（脱抑制）</text>
<text x="90" y="300" font-size="14" fill="#555">酒精 / 苯二氮卓类 → 增强 GABAA 受体抑制性信号，同时经 VTA 间接激活多巴胺释放</text>

<text x="90" y="430" font-size="14" fill="#555">成瘾 = 奖赏环路被反复劫持：从「喜欢」（liking）走向「渴望」（wanting）与失控的强迫性用药。</text>
<text x="90" y="455" font-size="14" fill="#555">治疗：激动剂替代（美沙酮/丁丙诺啡）、受体拮抗（纳洛酮、纳曲酮）、行为矫正。</text>
</svg>
