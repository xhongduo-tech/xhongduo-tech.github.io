<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>心境障碍的相性图谱</title>
<desc>以时间为横轴、心境强度为纵轴，对比正常情绪波动、重性抑郁障碍、双相障碍中的躁狂相与轻躁狂相。</desc>
<rect x="0" y="0" width="760" height="480" fill="#faf9f5"/>
<!-- 基线 -->
<line x1="60" y1="250" x2="700" y2="250" stroke="#999" stroke-width="2"/>
<text x="620" y="238" font-size="14" fill="#555">正常情绪基线（情绪正常）</text>
<text x="620" y="272" font-size="14" fill="#555">（euthymia）</text>
<!-- 抑郁区 -->
<rect x="60" y="300" width="620" height="130" rx="10" fill="#eef4f6" opacity="0.55"/>
<text x="80" y="325" font-size="15" fill="#1f6f8b">抑郁相（depressive episode）：兴趣丧失、快感缺失、精力减退、睡眠与食欲改变</text>
<text x="80" y="350" font-size="15" fill="#1f6f8b">持续时间 ≥ 2 周；重性抑郁障碍（MDD）要求 9 项中 ≥ 5 项</text>
<!-- 躁狂区 -->
<rect x="60" y="40" width="620" height="150" rx="10" fill="#fbf1f0" opacity="0.55"/>
<text x="80" y="65" font-size="15" fill="#c0392b">躁狂相（manic episode）：情感高涨或易激惹 + 精力活动亢进 ≥ 1 周</text>
<text x="80" y="90" font-size="15" fill="#c0392b">轻躁狂（hypomania）≥ 4 天；双相障碍 = 躁狂/轻躁狂 + 抑郁相交替</text>
<!-- 正常波动曲线 -->
<path d="M 60 240 C 100 250 120 255 150 245 C 180 232 200 255 230 258 C 260 262 280 245 310 248"
      stroke="#888" stroke-width="2" fill="none"/>
<!-- MDD 曲线 -->
<path d="M 60 245 C 90 300 130 330 170 335 C 220 342 260 320 310 330 C 360 340 420 322 470 332 C 500 338 530 320 560 320 C 600 320 640 300 660 250"
      stroke="#1f6f8b" stroke-width="3" fill="none"/>
<text x="300" y="370" font-size="15" fill="#1f6f8b">重性抑郁障碍：持续低位、少有反弹（复发性多见）</text>
<!-- Bipolar 曲线 -->
<path d="M 60 250 C 90 210 120 150 150 130 C 190 105 230 140 250 190 C 270 240 260 300 290 340 C 320 380 370 350 400 320 C 420 295 440 140 470 110 C 500 80 550 120 560 170 C 570 215 590 230 660 245"
      stroke="#c0392b" stroke-width="3" fill="none"/>
<text x="300" y="410" font-size="15" fill="#c0392b">双相障碍：抑郁与（轻）躁狂交替，情绪往返于两端</text>
<!-- 标注 -->
<circle cx="470" cy="110" r="5" fill="#c0392b"/>
<text x="485" y="105" font-size="14" fill="#333">躁狂峰值：夸大、冲动、睡眠需求减少</text>
<circle cx="290" cy="340" r="5" fill="#c0392b"/>
<text x="300" y="355" font-size="14" fill="#333">抑郁谷底：无价值感、自杀观念</text>
</svg>
