<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>精神分裂症的多巴胺通路模型</title>
<desc>四条主要多巴胺通路及其在抗精神病药治疗中的意义：中脑边缘、中脑皮层、黑质纹状体、结节漏斗通路。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="520" fill="#faf9f5"/>
<!-- 前脑靶区 -->
<rect x="40" y="40" width="300" height="70" rx="10" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
<text x="60" y="68" font-size="16" fill="#333">前额叶皮层（PFC）</text>
<text x="60" y="92" font-size="13" fill="#555">认知、工作记忆、动机</text>

<rect x="420" y="40" width="300" height="70" rx="10" fill="#fbf1f0" stroke="#c0392b" stroke-width="2"/>
<text x="440" y="68" font-size="16" fill="#333">伏隔核 / 边缘系统（NAc）</text>
<text x="440" y="92" font-size="13" fill="#555">奖赏、情绪、幻觉与妄想的脑区</text>

<rect x="40" y="200" width="300" height="70" rx="10" fill="#f3efe8" stroke="#8a6d3b" stroke-width="2"/>
<text x="60" y="228" font-size="16" fill="#333">背侧纹状体（尾状核 / 壳核）</text>
<text x="60" y="252" font-size="13" fill="#555">运动控制</text>

<rect x="420" y="200" width="300" height="70" rx="10" fill="#f3efe8" stroke="#8a6d3b" stroke-width="2"/>
<text x="440" y="228" font-size="16" fill="#333">垂体 / 下丘脑</text>
<text x="440" y="252" font-size="13" fill="#555">泌乳素调节</text>

<!-- 中脑 -->
<rect x="190" y="400" width="380" height="90" rx="12" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="220" y="430" font-size="17" fill="#333">中脑：多巴胺能神经元胞体</text>
<rect x="210" y="445" width="170" height="32" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="222" y="466" font-size="14" fill="#333">腹侧被盖区 VTA（A10）</text>
<rect x="395" y="445" width="160" height="32" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="407" y="466" font-size="14" fill="#333">黑质 SN（A9）</text>

<!-- 通路：中脑边缘（VTA→NAc）红 -->
<path d="M 320 400 L 520 118" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
<rect x="500" y="150" width="235" height="64" rx="8" fill="#fbf1f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="512" y="174" font-size="13" fill="#c0392b">中脑边缘通路（mesolimbic）</text>
<text x="512" y="198" font-size="13" fill="#555">多巴胺 ↑ → 阳性症状（幻觉、妄想）</text>

<!-- 通路：中脑皮层（VTA→PFC）蓝 -->
<path d="M 260 400 L 200 118" stroke="#1f6f8b" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="120" width="240" height="64" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="72" y="144" font-size="13" fill="#1f6f8b">中脑皮层通路（mesocortical）</text>
<text x="72" y="168" font-size="13" fill="#555">多巴胺 ↓ → 阴性症状（情感平淡、意志减退）</text>

<!-- 通路：黑质纹状体（SN→纹状体）灰 -->
<path d="M 430 400 L 250 278" stroke="#8a6d3b" stroke-width="3" fill="none"/>
<rect x="40" y="290" width="300" height="64" rx="8" fill="#f3efe8" stroke="#8a6d3b" stroke-width="1.5"/>
<text x="52" y="314" font-size="13" fill="#8a6d3b">黑质纹状体通路（nigrostriatal）</text>
<text x="52" y="338" font-size="13" fill="#555">被阻断 → 锥体外系反应（EPS）</text>

<!-- 通路：结节漏斗（→垂体）绿 -->
<path d="M 420 400 L 520 278" stroke="#4a7c59" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
<rect x="470" y="290" width="250" height="64" rx="8" fill="#eef5ef" stroke="#4a7c59" stroke-width="1.5"/>
<text x="482" y="314" font-size="13" fill="#4a7c59">结节漏斗通路（tuberoinfundibular）</text>
<text x="482" y="338" font-size="13" fill="#555">被阻断 → 高泌乳素血症、泌乳</text>
</svg>
