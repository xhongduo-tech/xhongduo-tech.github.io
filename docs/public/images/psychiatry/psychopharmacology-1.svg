<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>抗精神病药的受体占有率-剂量曲线与治疗窗</title>
<desc>受体占有率随剂量的 S 形曲线：典型抗精神病药在 60%–80% 的 D2 占有率达到疗效，超过 80% 锥体外系反应风险显著上升，治疗窗由此界定。</desc>
<rect x="0" y="0" width="760" height="480" fill="#faf9f5"/>
<!-- 坐标轴 -->
<line x1="90" y1="410" x2="700" y2="410" stroke="#333" stroke-width="2"/>
<line x1="90" y1="40" x2="90" y2="410" stroke="#333" stroke-width="2"/>
<text x="560" y="440" font-size="15" fill="#333">剂量（对数刻度）</text>
<text x="40" y="60" font-size="15" fill="#333" transform="rotate(-90 40 60)">受体占有率（%）</text>
<!-- 刻度 -->
<line x1="90" y1="410" x2="78" y2="410" stroke="#333" stroke-width="1.5"/>
<text x="55" y="415" font-size="13" fill="#555">0</text>
<line x1="90" y1="150" x2="78" y2="150" stroke="#333" stroke-width="1.5"/>
<text x="55" y="154" font-size="13" fill="#555">80%</text>
<line x1="90" y1="235" x2="78" y2="235" stroke="#333" stroke-width="1.5"/>
<text x="55" y="240" font-size="13" fill="#555">60%</text>
<line x1="90" y1="320" x2="78" y2="320" stroke="#333" stroke-width="1.5"/>
<text x="55" y="325" font-size="13" fill="#555">50%</text>
<!-- 治疗窗 -->
<rect x="300" y="150" width="170" height="85" fill="#eef5ef" stroke="#4a7c59" stroke-width="2" stroke-dasharray="6 4"/>
<text x="312" y="180" font-size="14" fill="#4a7c59">治疗窗：60%–80% 占有率</text>
<text x="312" y="205" font-size="13" fill="#555">抗精神病疗效 + 可耐受</text>
<!-- 疗效曲线 -->
<path d="M 90 408 C 150 406 200 400 250 385 C 300 362 340 330 380 300 C 460 260 540 245 620 240 C 660 238 690 238 700 238"
      stroke="#1f6f8b" stroke-width="3" fill="none"/>
<text x="620" y="222" font-size="14" fill="#1f6f8b">抗精神病疗效曲线</text>
<!-- EPS 曲线 -->
<path d="M 90 408 C 250 406 330 402 380 392 C 430 378 480 340 520 300 C 580 240 640 215 700 205"
      stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<text x="560" y="195" font-size="14" fill="#c0392b">锥体外系反应（EPS）</text>
<!-- 50% 点 -->
<circle cx="330" cy="320" r="5" fill="#333"/>
<text x="340" y="310" font-size="14" fill="#333">EC₅₀ ≈ 剂量即达 50% 占有率</text>
<text x="96" y="120" font-size="14" fill="#555">KD 越小亲和力越高：剂量越小越易达到高占有率</text>
</svg>
