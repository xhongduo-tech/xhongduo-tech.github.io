<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">二元熵函数 H(p) 曲线</title>
  <desc id="desc">横轴 p 从 0 到 1，纵轴 H(p) 从 0 到 1 比特。红色曲线为二元熵函数 H(p) = -p·log₂p - (1-p)·log₂(1-p)：在 p=0 与 p=1 处为 0，关于 p=1/2 对称，在 p=1/2 处达到最大值 1 比特（青色虚线标出）。曲线上两个青色圆点显示对称性 H(0.2) = H(0.8) ≈ 0.72 比特。</desc>

  <!-- 纸底 -->
  <rect width="640" height="440" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="390" x2="570" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="90" x2="70" y2="390" stroke="#333" stroke-width="2"/>
  <!-- 轴端箭头 -->
  <polygon points="570,390 576,384 576,396" fill="#333"/>
  <polygon points="70,90 64,84 76,84" fill="#333"/>

  <!-- 最大值辅助线（青色虚线） -->
  <line x1="320" y1="90" x2="320" y2="390" stroke="#1f6f8b" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="70" y1="90" x2="320" y2="90" stroke="#1f6f8b" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 对称性示例：p=0.2 与 p=0.8 的垂线 -->
  <line x1="170" y1="173.4" x2="170" y2="390" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="470" y1="173.4" x2="470" y2="390" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 二元熵曲线（红色） -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
    points="75,365.8 95,304.1 120,249.3 145,207 170,173.4 195,146.6 220,125.6 245,109.8 270,98.7 295,92.2 320,90 345,92.2 370,98.7 395,109.8 420,125.6 445,146.6 470,173.4 495,207 520,249.3 545,304.1 565,365.8"/>

  <!-- 关键点 -->
  <circle cx="320" cy="90" r="4.5" fill="#c0392b"/>
  <circle cx="170" cy="173.4" r="3.5" fill="#1f6f8b"/>
  <circle cx="470" cy="173.4" r="3.5" fill="#1f6f8b"/>

  <!-- 刻度 -->
  <g font-size="14" fill="#333">
    <text x="60" y="408">0</text>
    <text x="306" y="408">1/2</text>
    <text x="558" y="408">1</text>
    <text x="48" y="95">1</text>
  </g>

  <!-- 轴名 -->
  <text x="574" y="414" font-size="15" fill="#333">p</text>
  <text x="22" y="66" font-size="15" fill="#333">H(p)</text>
  <text x="56" y="66" font-size="14" fill="#777">（bit）</text>

  <!-- 曲线公式 -->
  <text x="88" y="56" font-size="15" fill="#333">H(p) = −p·log₂p − (1−p)·log₂(1−p)</text>

  <!-- 最大值标注 -->
  <text x="332" y="80" font-size="14" fill="#c0392b">p = ½ 时 H = 1 bit（最大）</text>

  <!-- 对称轴标注 -->
  <text x="332" y="150" font-size="14" fill="#1f6f8b">对称轴 p = ½</text>

  <!-- 对称性示例标注 -->
  <text x="188" y="428" font-size="14" fill="#333">H(0.2) = H(0.8) ≈ 0.72 bit</text>
</svg>
