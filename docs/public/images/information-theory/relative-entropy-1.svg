<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">相对熵 D(p‖q) 在 q=(1/4,3/4) 固定时的曲线</title>
  <desc id="desc">横轴 p 从 0 到 1，纵轴 D(p‖q) 从 0 到 2 比特。红色曲线为 D(p‖(1/4,3/4)) = p·log₂(4p) + (1-p)·log₂(4(1-p)/3)：在 p=1/4（青色虚线标出）处取最小值 0，曲线左右不对称——p→0 时 D≈0.42 比特，p=1 时 D=2 比特。</desc>

  <!-- 纸底 -->
  <rect width="640" height="440" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="390" x2="570" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="390" stroke="#333" stroke-width="2"/>
  <!-- 轴端箭头 -->
  <polygon points="570,390 576,384 576,396" fill="#333"/>
  <polygon points="70,100 64,94 76,94" fill="#333"/>

  <!-- 最小值辅助线（青色虚线）：p=1/4 -->
  <line x1="195" y1="96" x2="195" y2="390" stroke="#1f6f8b" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 相对熵曲线（红色），y = 390 - (D/2.0)*290 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
    points="70,329.8 95,359.9 120,374.8 145,383.8 170,388.5 195,390 220,388.7 245,384.8 270,378.7 320,329.9 370,332.7 420,296.7 470,250.6 520,191.1 570,100"/>

  <!-- 关键点 -->
  <circle cx="195" cy="390" r="4.5" fill="#c0392b"/>
  <circle cx="70" cy="329.8" r="3.5" fill="#1f6f8b"/>
  <circle cx="570" cy="100" r="3.5" fill="#1f6f8b"/>

  <!-- 刻度 -->
  <g font-size="14" fill="#333">
    <text x="60" y="408">0</text>
    <text x="182" y="408">¼</text>
    <text x="307" y="408">½</text>
    <text x="558" y="408">1</text>
    <text x="48" y="395">0</text>
    <text x="48" y="250">1</text>
    <text x="48" y="105">2</text>
  </g>

  <!-- 轴名 -->
  <text x="574" y="414" font-size="15" fill="#333">p</text>
  <text x="22" y="66" font-size="15" fill="#333">D(p‖q)</text>
  <text x="56" y="66" font-size="14" fill="#777">（bit）</text>

  <!-- 曲线公式 -->
  <text x="88" y="56" font-size="15" fill="#333">D(p‖q)，q = (¼, ¾)</text>

  <!-- 最小值标注 -->
  <text x="205" y="380" font-size="14" fill="#c0392b">p = ¼ 时 D = 0（最小值）</text>

  <!-- 不对称性标注 -->
  <text x="88" y="316" font-size="14" fill="#1f6f8b">p → 0 时 D ≈ 0.42 bit</text>
  <text x="420" y="96" font-size="14" fill="#1f6f8b">p = 1 时 D = 2 bit</text>
</svg>
