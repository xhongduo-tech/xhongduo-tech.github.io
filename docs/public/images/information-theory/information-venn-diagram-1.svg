<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>熵、条件熵与互信息的韦恩图</title>
  <desc>两个圆分别表示随机变量 X 与 Y 的熵 H(X)、H(Y)；重叠区域是互信息 I(X;Y)；左边新月形是条件熵 H(X|Y)，右边新月形是 H(Y|X)；虚线框围住的整个区域是联合熵 H(X,Y)。</desc>
  <rect width="640" height="470" fill="#faf9f5"/>
  <text x="320" y="30" font-size="16" fill="#333" text-anchor="middle">信息量关系的韦恩图（两个随机变量）</text>

  <rect x="55" y="52" width="530" height="340" rx="12" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="8 5"/>

  <circle cx="225" cy="222" r="155" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="415" cy="222" r="155" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="2.5"/>

  <text x="148" y="118" font-size="22" fill="#333" text-anchor="middle">H(X)</text>
  <text x="492" y="118" font-size="22" fill="#333" text-anchor="middle">H(Y)</text>
  <text x="130" y="252" font-size="18" fill="#333" text-anchor="middle">H(X|Y)</text>
  <text x="510" y="252" font-size="18" fill="#333" text-anchor="middle">H(Y|X)</text>
  <text x="320" y="222" font-size="20" fill="#7a1d1d" text-anchor="middle" font-weight="bold">I(X;Y)</text>
  <text x="320" y="415" font-size="18" fill="#333" text-anchor="middle">整体：H(X,Y)</text>
</svg>
