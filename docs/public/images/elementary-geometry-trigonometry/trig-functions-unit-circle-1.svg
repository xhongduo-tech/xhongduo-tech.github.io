<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <title>单位圆上的三角函数定义</title>
  <desc>单位圆中角 theta 的终边与圆交于 P，标出 cos theta 为横坐标、sin theta 为纵坐标，以及正弦线与正切线。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <line x1="40" y1="220" x2="600" y2="220" stroke="#999" stroke-width="1.5"/>
  <line x1="320" y1="420" x2="320" y2="20" stroke="#999" stroke-width="1.5"/>
  <circle cx="320" cy="220" r="150" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="320" y1="220" x2="320" y2="70" stroke="#333" stroke-width="1"/>
  <circle cx="320" cy="220" r="4" fill="#333"/>
  <text x="330" y="214" font-family="sans-serif" font-size="15" fill="#333">O</text>
  <path d="M 320 220 A 90 90 0 0 0 405 105" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="372" y="155" font-family="sans-serif" font-size="15" fill="#1f6f8b">θ</text>
  <line x1="320" y1="220" x2="440" y2="100" stroke="#c0392b" stroke-width="3"/>
  <circle cx="440" cy="100" r="4" fill="#c0392b"/>
  <text x="452" y="96" font-family="sans-serif" font-size="14" fill="#c0392b">P (cosθ, sinθ)</text>
  <line x1="320" y1="220" x2="440" y2="220" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="440" y1="220" x2="440" y2="100" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="370" y="214" font-family="sans-serif" font-size="14" fill="#1f6f8b">cosθ（横坐标）</text>
  <text x="446" y="165" font-family="sans-serif" font-size="14" fill="#333">sinθ（纵坐标）</text>
  <line x1="320" y1="100" x2="320" y2="70" stroke="#1f6f8b" stroke-width="2"/>
  <text x="252" y="94" font-family="sans-serif" font-size="14" fill="#1f6f8b">正弦线</text>
  <line x1="320" y1="220" x2="470" y2="220" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="480" y="214" font-family="sans-serif" font-size="14" fill="#c0392b">正切：tanθ = sinθ/cosθ</text>
</svg>
