<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420">
  <title>圆的基本要素：圆心、半径、直径、弦、弧与切线</title>
  <desc>一个以 O 为圆心的圆，标注半径 OA、直径 BC、弦 DE、弧与过 A 点的切线。</desc>
  <rect x="0" y="0" width="620" height="420" fill="#faf9f5"/>
  <circle cx="310" cy="210" r="140" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="160" y1="210" x2="460" y2="210" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="310" y1="210" x2="310" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="178" y1="286" x2="442" y2="286" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="230" y1="70" x2="390" y2="70" stroke="#333" stroke-width="2"/>
  <path d="M 310 70 A 140 140 0 0 0 178 286" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="310" cy="210" r="5" fill="#333"/>
  <circle cx="310" cy="70" r="4" fill="#c0392b"/>
  <circle cx="160" cy="210" r="4" fill="#1f6f8b"/>
  <circle cx="460" cy="210" r="4" fill="#1f6f8b"/>
  <circle cx="178" cy="286" r="4" fill="#c0392b"/>
  <circle cx="442" cy="286" r="4" fill="#c0392b"/>
  <text x="322" y="200" font-family="sans-serif" font-size="15" fill="#333">O（圆心）</text>
  <text x="318" y="60" font-family="sans-serif" font-size="14" fill="#c0392b">A（半径 r）</text>
  <text x="120" y="205" font-family="sans-serif" font-size="14" fill="#1f6f8b">B（直径 d）</text>
  <text x="452" y="205" font-family="sans-serif" font-size="14" fill="#1f6f8b">C</text>
  <text x="150" y="308" font-family="sans-serif" font-size="14" fill="#c0392b">D（弦）</text>
  <text x="452" y="308" font-family="sans-serif" font-size="14" fill="#c0392b">E</text>
  <text x="246" y="130" font-family="sans-serif" font-size="14" fill="#1f6f8b">弧</text>
  <text x="430" y="58" font-family="sans-serif" font-size="14" fill="#333">切线（过 A 与半径垂直）</text>
</svg>
