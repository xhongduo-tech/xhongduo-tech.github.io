<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>频率的稳定性：掷硬币正面频率随试验次数趋近于 1/2</title>
  <desc>横轴为试验次数 n，纵轴为正面频率 f_n(A)。随试验次数增加，频率围绕 1/2 上下波动，摆动幅度逐渐收窄并稳定在 1/2 附近。</desc>
  <rect width="640" height="400" fill="#fff"/>
  <!-- 目标线：理论概率 1/2 -->
  <line x1="70" y1="185" x2="600" y2="185" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 坐标轴 -->
  <line x1="70" y1="330" x2="600" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="330" stroke="#333" stroke-width="1.5"/>
  <!-- x 轴刻度 -->
  <g font-size="13" fill="#333">
    <line x1="70" y1="330" x2="70" y2="336"/>
    <text x="70" y="352" text-anchor="middle">0</text>
    <line x1="176" y1="330" x2="176" y2="336"/>
    <text x="176" y="352" text-anchor="middle">100</text>
    <line x1="282" y1="330" x2="282" y2="336"/>
    <text x="282" y="352" text-anchor="middle">200</text>
    <line x1="388" y1="330" x2="388" y2="336"/>
    <text x="388" y="352" text-anchor="middle">300</text>
    <line x1="494" y1="330" x2="494" y2="336"/>
    <text x="494" y="352" text-anchor="middle">400</text>
    <line x1="600" y1="330" x2="600" y2="336"/>
    <text x="600" y="352" text-anchor="middle">500</text>
  </g>
  <!-- y 轴刻度 -->
  <g font-size="13" fill="#333">
    <line x1="64" y1="330" x2="70" y2="330"/>
    <text x="60" y="334" text-anchor="end">0</text>
    <line x1="64" y1="185" x2="70" y2="185"/>
    <text x="60" y="189" text-anchor="end">0.5</text>
    <line x1="64" y1="40" x2="70" y2="40"/>
    <text x="60" y="44" text-anchor="end">1</text>
  </g>
  <!-- 轴标签 -->
  <text x="320" y="380" text-anchor="middle" font-size="14" fill="#333">试验次数 n</text>
  <text x="22" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 22 200)">频率 f_n(A)</text>
  <!-- 频率曲线：前期大幅摆动，后期趋于 1/2 -->
  <polyline points="71,40 72,185 73,137 75,156 78,149 86,156 97,168 123,173 165,179 229,181 335,183 473,184 600,184" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="590" y="170" text-anchor="end" font-size="13" fill="#c0392b">频率波动趋缓</text>
  <text x="590" y="205" text-anchor="end" font-size="13" fill="#1f6f8b">理论概率 1/2</text>
</svg>
