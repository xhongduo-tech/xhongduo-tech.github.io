<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="sans-serif">
  <title>会面问题的几何概型：相遇区域为一条斜带</title>
  <desc>正方形表示两人到达时刻 (x, y)，边长为 60 分钟；带阴影的斜带为相遇区域 |x−y|≤15，两块空白三角形为不相遇区域。相遇概率等于阴影面积除以正方形面积，即 7/16。</desc>
  <rect width="480" height="460" fill="#fff"/>
  <!-- 正方形样本空间 -->
  <rect x="60" y="40" width="320" height="320" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <!-- 对角线 y=x -->
  <line x1="60" y1="360" x2="380" y2="40" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- 相遇斜带：|x-y|<=15 -->
  <polygon points="60,360 60,280 300,40 380,40 380,120 140,360" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="1.5"/>
  <!-- x 轴刻度 -->
  <g font-size="13" fill="#333">
    <line x1="60" y1="360" x2="60" y2="366"/>
    <text x="60" y="382" text-anchor="middle">0</text>
    <line x1="140" y1="360" x2="140" y2="366"/>
    <text x="140" y="382" text-anchor="middle">15</text>
    <line x1="220" y1="360" x2="220" y2="366"/>
    <text x="220" y="382" text-anchor="middle">30</text>
    <line x1="300" y1="360" x2="300" y2="366"/>
    <text x="300" y="382" text-anchor="middle">45</text>
    <line x1="380" y1="360" x2="380" y2="366"/>
    <text x="380" y="382" text-anchor="middle">60</text>
  </g>
  <!-- y 轴刻度 -->
  <g font-size="13" fill="#333">
    <line x1="54" y1="360" x2="60" y2="360"/>
    <text x="50" y="364" text-anchor="end">0</text>
    <line x1="54" y1="280" x2="60" y2="280"/>
    <text x="50" y="284" text-anchor="end">15</text>
    <line x1="54" y1="200" x2="60" y2="200"/>
    <text x="50" y="204" text-anchor="end">30</text>
    <line x1="54" y1="120" x2="60" y2="120"/>
    <text x="50" y="124" text-anchor="end">45</text>
    <line x1="54" y1="40" x2="60" y2="40"/>
    <text x="50" y="44" text-anchor="end">60</text>
  </g>
  <!-- 轴标签 -->
  <text x="220" y="410" text-anchor="middle" font-size="14" fill="#333">甲到达时刻 x（分钟）</text>
  <text x="20" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 20 200)">乙到达时刻 y（分钟）</text>
  <!-- 区域标注 -->
  <text x="170" y="150" text-anchor="middle" font-size="14" fill="#1f6f8b">相遇区域</text>
  <text x="170" y="168" text-anchor="middle" font-size="13" fill="#1f6f8b">|x − y| ≤ 15</text>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#333">不相遇</text>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#333">不相遇</text>
  <text x="220" y="442" text-anchor="middle" font-size="14" fill="#c0392b">P = 阴影面积 / 正方形面积 = 7/16</text>
</svg>
