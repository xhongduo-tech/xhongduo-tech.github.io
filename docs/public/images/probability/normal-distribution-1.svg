<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>标准正态分布曲线与 ±σ 区间</title>
  <desc>以 μ 为中心的正态分布钟形曲线，阴影标出 μ±σ、μ±2σ、μ±3σ 区间，分别覆盖 68.3%、95.4%、99.7% 的概率。</desc>
  <rect x="0" y="0" width="800" height="400" fill="#faf9f5"/>
  <!-- 3σ 区域（淡青色） -->
  <rect x="160" y="60" width="480" height="260" fill="#1f6f8b" opacity="0.06"/>
  <!-- 2σ 区域（中青色） -->
  <rect x="240" y="60" width="320" height="260" fill="#1f6f8b" opacity="0.10"/>
  <!-- 1σ 区域（深青色） -->
  <rect x="320" y="60" width="160" height="260" fill="#1f6f8b" opacity="0.16"/>
  <!-- 轴线 -->
  <line x1="60" y1="320" x2="740" y2="320" stroke="#333" stroke-width="1.5"/>
  <!-- 垂直参考线 -->
  <line x1="400" y1="60" x2="400" y2="320" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="80" x2="320" y2="320" stroke="#333" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="480" y1="80" x2="480" y2="320" stroke="#333" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="240" y1="60" x2="240" y2="320" stroke="#333" stroke-width="0.6" stroke-dasharray="2 3"/>
  <line x1="560" y1="60" x2="560" y2="320" stroke="#333" stroke-width="0.6" stroke-dasharray="2 3"/>
  <!-- 正态曲线 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5" points="80,320 120,319.5 160,317.3 200,309.5 240,287.5 280,242.1 320,174.4 360,108.2 400,80 440,108.2 480,174.4 520,242.1 560,287.5 600,309.5 640,317.3 680,319.5 720,320"/>
  <!-- 坐标标注 -->
  <text x="400" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">μ</text>
  <text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ−σ</text>
  <text x="480" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ+σ</text>
  <text x="240" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ−2σ</text>
  <text x="560" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ+2σ</text>
  <text x="160" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ−3σ</text>
  <text x="640" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">μ+3σ</text>
  <!-- 区间百分比 -->
  <text x="400" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">68.3%</text>
  <text x="260" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">95.4%</text>
  <text x="540" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">95.4%</text>
  <text x="90" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">99.7%</text>
  <text x="710" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">99.7%</text>
  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">标准正态分布 N(0,1) 密度曲线</text>
</svg>
