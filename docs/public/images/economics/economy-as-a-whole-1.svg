<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">短期菲利普斯曲线：通货膨胀与失业的权衡</title>
  <desc id="desc">横轴为失业率（%）、纵轴为通货膨胀率（%）的坐标系。向右下方倾斜的曲线是短期菲利普斯曲线：A 点对应低失业、高通胀，B 点对应高失业、低通胀，两点之间的取舍关系被明确标出。穿过自然失业率 5% 的虚线是长期菲利普斯曲线，说明长期中失业率与通胀无关。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 坐标轴 -->
  <line x1="110" y1="400" x2="628" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="110" y1="400" x2="110" y2="52" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 轴刻度短线 -->
  <g stroke="#777" stroke-width="1">
    <line x1="314" y1="400" x2="314" y2="407"/>
    <line x1="365" y1="400" x2="365" y2="407"/>
    <line x1="416" y1="400" x2="416" y2="407"/>
    <line x1="110" y1="320" x2="103" y2="320"/>
    <line x1="110" y1="240" x2="103" y2="240"/>
    <line x1="110" y1="160" x2="103" y2="160"/>
  </g>

  <!-- 轴数字 -->
  <g font-size="14" fill="#333">
    <text x="314" y="420" text-anchor="middle">4</text>
    <text x="365" y="420" text-anchor="middle">5</text>
    <text x="416" y="420" text-anchor="middle">6</text>
    <text x="96" y="324" text-anchor="end">2</text>
    <text x="96" y="244" text-anchor="end">4</text>
    <text x="96" y="164" text-anchor="end">6</text>
  </g>

  <!-- 轴标题 -->
  <text x="45" y="230" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 45 230)">通货膨胀率（%）</text>
  <text x="370" y="446" text-anchor="middle" font-size="15" fill="#333">失业率（%）</text>

  <!-- 长期菲利普斯曲线（自然失业率处的垂直线） -->
  <line x1="365" y1="60" x2="365" y2="400" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 短期菲利普斯曲线 -->
  <path d="M 180 150 Q 350 260 560 375" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 关键点 -->
  <g fill="#1f6f8b">
    <circle cx="267" cy="205" r="4.5"/>
    <circle cx="458" cy="318" r="4.5"/>
  </g>

  <!-- 关键点标注 -->
  <g font-size="14" fill="#333">
    <text x="150" y="196" text-anchor="end">A：低失业、高通胀</text>
    <text x="490" y="385" text-anchor="start">B：高失业、低通胀</text>
  </g>

  <!-- 引导线 -->
  <line x1="267" y1="205" x2="158" y2="200" stroke="#777" stroke-width="1"/>
  <line x1="458" y1="318" x2="490" y2="378" stroke="#777" stroke-width="1"/>

  <!-- 曲线与虚线标注 -->
  <text x="405" y="296" font-size="14" fill="#c0392b">短期菲利普斯曲线</text>
  <text x="372" y="92" font-size="13" fill="#777">长期（自然失业率 5%）</text>
  <text x="372" y="110" font-size="13" fill="#777">失业与通胀无取舍</text>

  <!-- 图注 -->
  <text x="340" y="462" text-anchor="middle" font-size="13" fill="#777">沿短期曲线移动：压低通胀必须承受更高的失业；长期而言取舍消失</text>
</svg>
