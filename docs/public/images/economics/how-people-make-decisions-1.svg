<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">生产可能性边界（PPF）：权衡取舍与机会成本示意</title>
  <desc id="desc">在横轴为计算机、纵轴为小麦的坐标系中，一条凹向原点（向外凸）的生产可能性边界。A 点把全部资源用于种小麦（0 台计算机、3000 万吨小麦），C 点全部用于制造计算机（2000 万台、0 万吨），B 点为中间权衡点（1000 万台、2200 万吨），由 B 向两轴延伸的虚线标出该点坐标。曲线以内为可行生产组合；曲线向外凸意味着机会成本递增。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 可行生产组合区域（曲线与两轴围成） -->
  <path d="M 90 420 L 90 120 Q 345 130 600 420 Z" fill="#ece7d9"/>

  <!-- 生产可能性边界（PPF 曲线，凹向原点） -->
  <path d="M 90 120 Q 345 130 600 420" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- 坐标轴 -->
  <line x1="90" y1="420" x2="618" y2="420" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="90" y1="420" x2="90" y2="64" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- B 点向两轴的投影虚线（读出坐标） -->
  <line x1="345" y1="200" x2="345" y2="420" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="345" y1="200" x2="90" y2="200" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 轴刻度短线 -->
  <g stroke="#777" stroke-width="1">
    <line x1="345" y1="420" x2="345" y2="427"/>
    <line x1="600" y1="420" x2="600" y2="427"/>
    <line x1="90" y1="200" x2="83" y2="200"/>
    <line x1="90" y1="120" x2="83" y2="120"/>
  </g>

  <!-- 关键点 -->
  <g fill="#c0392b">
    <circle cx="90" cy="120" r="4.5"/>
    <circle cx="345" cy="200" r="4.5"/>
    <circle cx="600" cy="420" r="4.5"/>
  </g>

  <!-- 轴数字 -->
  <g font-size="14" fill="#333">
    <text x="80" y="436" text-anchor="end">0</text>
    <text x="345" y="442" text-anchor="middle">1000</text>
    <text x="600" y="442" text-anchor="middle">2000</text>
    <text x="78" y="204" text-anchor="end">2200</text>
    <text x="78" y="124" text-anchor="end">3000</text>
  </g>

  <!-- 轴标题 -->
  <text x="48" y="260" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 48 260)">小麦（万吨）</text>
  <text x="350" y="462" text-anchor="middle" font-size="15" fill="#333">计算机（万台）</text>

  <!-- 区域与性质标注 -->
  <text x="220" y="388" font-size="14" fill="#1f6f8b">可行生产组合</text>
  <text x="600" y="120" text-anchor="end" font-size="14" fill="#777">曲线向外凸 ⇒ 机会成本递增</text>

  <!-- 关键点标注 -->
  <g font-size="14" fill="#333">
    <text x="102" y="110">A 全部种小麦</text>
    <text x="355" y="235">B：1000 台、2200 万吨</text>
    <text x="465" y="385">C：2000 台、0 万吨</text>
  </g>
</svg>
