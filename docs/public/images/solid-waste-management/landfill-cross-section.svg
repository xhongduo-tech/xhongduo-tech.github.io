<svg viewBox="0 0 880 600" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>卫生填埋场典型横断面</title>
  <desc>从下到上依次为天然地基、压实黏土衬层、HDPE土工膜、排水层与渗滤液收集管、垃圾层与每日覆盖层，垃圾层中设填埋气井，顶部为最终覆盖层，两侧设监测井。</desc>
  <rect width="880" height="600" fill="#faf9f5"/>
  <text x="440" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">卫生填埋场横断面示意</text>

  <!-- 天然地基 -->
  <path d="M 60 520 L 820 520 L 820 580 L 60 580 Z" fill="#d8c9a3" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="556" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">天然地基（自然土层）</text>

  <!-- 压实黏土衬层 -->
  <rect x="60" y="495" width="760" height="25" fill="#b08968" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="513" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">压实黏土衬层（K &lt; 1e-7 cm/s）</text>

  <!-- HDPE 土工膜 -->
  <rect x="60" y="485" width="760" height="10" fill="#2c3e50" stroke="#333" stroke-width="1"/>
  <text x="820" y="478" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">HDPE 土工膜</text>

  <!-- 排水层 + 渗滤液收集管 -->
  <rect x="60" y="455" width="760" height="30" fill="#f4e4bc" stroke="#333" stroke-width="1.5"/>
  <circle cx="200" cy="470" r="9" fill="#c0392b"/>
  <circle cx="430" cy="470" r="9" fill="#c0392b"/>
  <circle cx="660" cy="470" r="9" fill="#c0392b"/>
  <text x="440" y="447" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">砂石排水层（含渗滤液收集管）</text>

  <!-- 垃圾层与每日覆盖层 -->
  <rect x="60" y="180" width="760" height="275" fill="#8d6e63" stroke="#333" stroke-width="1.5"/>
  <rect x="60" y="345" width="760" height="12" fill="#f0d9a8"/>
  <rect x="60" y="265" width="760" height="12" fill="#f0d9a8"/>
  <text x="100" y="320" font-family="sans-serif" font-size="14" fill="#fff">垃圾层（多层填埋，逐层压实）</text>
  <text x="100" y="230" font-family="sans-serif" font-size="13" fill="#fff">垃圾层</text>
  <text x="700" y="400" font-family="sans-serif" font-size="13" fill="#f0d9a8">每日覆盖土</text>
  <line x1="640" y1="401" x2="620" y2="350" stroke="#f0d9a8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 填埋气井 -->
  <rect x="415" y="70" width="22" height="385" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <text x="426" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff" transform="rotate(-90 426 180)">填埋气抽气井</text>

  <!-- 最终覆盖层 -->
  <rect x="60" y="150" width="760" height="30" fill="#a3c585" stroke="#333" stroke-width="1.5"/>
  <rect x="60" y="130" width="760" height="20" fill="#7d9e5f" stroke="#333" stroke-width="1"/>
  <text x="440" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">排水层 + 土工膜</text>
  <text x="440" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">最终覆盖：表层植被土（导气、防渗、植草）</text>

  <!-- 地表 -->
  <line x1="60" y1="130" x2="820" y2="130" stroke="#333" stroke-width="2"/>

  <!-- 渗滤液泵站（左） -->
  <rect x="10" y="460" width="44" height="40" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="32" y="484" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">泵站</text>
  <path d="M 200 470 L 60 470 L 54 470" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="130" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">渗滤液引出处理</text>

  <!-- 监测井（右） -->
  <rect x="826" y="300" width="34" height="200" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="832" y="480" width="22" height="20" fill="#d8c9a3"/>
  <text x="843" y="520" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">监测井</text>
  <text x="843" y="536" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">（地下水）</text>

  <!-- 地下水位线 -->
  <line x1="60" y1="530" x2="820" y2="530" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="700" y="548" font-family="sans-serif" font-size="13" fill="#1f6f8b">地下水位线</text>

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
