<svg viewBox="0 0 840 430" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>拖曳容器系统与固定容器系统作业模式对比</title>
  <desc>上图为拖曳容器系统：卡车把大型垃圾容器整体运走再返回空容器；下图为固定容器系统：压缩车逐点清空固定容器后运往处置场。</desc>
  <rect width="840" height="430" fill="#faf9f5"/>
  <text x="420" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">收集系统两种基本模式</text>

  <!-- ===== 上半：HCS ===== -->
  <line x1="30" y1="62" x2="810" y2="62" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="86" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">拖曳容器系统（HCS）：容器随车走</text>

  <!-- 产生源建筑 -->
  <rect x="60" y="130" width="90" height="70" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="145" x2="150" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="175" x2="150" y2="175" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">垃圾产生源</text>

  <!-- 大型容器 -->
  <rect x="250" y="140" width="70" height="52" fill="#1f6f8b" opacity="0.9"/>
  <text x="285" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">容器</text>
  <text x="285" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（装满）</text>

  <!-- 卡车（简化车身） -->
  <rect x="420" y="150" width="95" height="40" fill="#c0392b"/>
  <circle cx="448" cy="204" r="14" fill="#333"/>
  <circle cx="492" cy="204" r="14" fill="#333"/>
  <text x="468" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">收运车</text>

  <!-- 处置场 -->
  <rect x="640" y="130" width="120" height="70" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="700" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">处置场</text>

  <!-- 箭头：满载运走 -->
  <path d="M 360 168 C 385 168 395 170 418 170" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrH)"/>
  <path d="M 516 170 C 570 170 600 168 638 168" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrH)"/>
  <text x="448" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">满载容器运走</text>

  <!-- 箭头：空车/空容器返回 -->
  <path d="M 638 152 C 560 118 480 118 300 142" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrH)"/>
  <text x="470" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">空容器/空车返回</text>

  <!-- ===== 下半：SCS ===== -->
  <line x1="30" y1="250" x2="810" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="274" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">固定容器系统（SCS）：车逐点清空固定容器</text>

  <!-- 三个固定小容器 -->
  <g>
    <rect x="70" y="300" width="44" height="44" fill="#1f6f8b" opacity="0.9"/>
    <text x="92" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">桶</text>
    <rect x="210" y="300" width="44" height="44" fill="#1f6f8b" opacity="0.9"/>
    <text x="232" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">桶</text>
    <rect x="350" y="300" width="44" height="44" fill="#1f6f8b" opacity="0.9"/>
    <text x="372" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">桶</text>
  </g>
  <text x="92" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">收集点1</text>
  <text x="232" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">收集点2</text>
  <text x="372" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">收集点3</text>

  <!-- 压缩车 -->
  <rect x="470" y="305" width="120" height="42" fill="#c0392b"/>
  <circle cx="500" cy="361" r="13" fill="#333"/>
  <circle cx="562" cy="361" r="13" fill="#333"/>
  <text x="530" y="385" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">压缩收运车</text>

  <!-- 箭头：逐点清空 -->
  <path d="M 114 300 C 114 280 210 280 232 298" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrH)"/>
  <path d="M 254 300 C 254 288 350 288 372 298" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrH)"/>
  <text x="170" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">逐点清空</text>

  <text x="620" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">→ 开往处置场</text>
  <path d="M 592 326 L 700 326" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrH)"/>
  <rect x="700" y="300" width="80" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="740" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">处置场</text>

  <defs>
    <marker id="arrH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
