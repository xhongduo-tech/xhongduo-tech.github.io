<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="sans-serif">
  <title>两杆串联桁架的直接刚度法示例</title>
  <desc>节点1固支，杆①连接节点1与节点2，杆②连接节点2与节点3，节点3受向右拉力F</desc>
  <rect width="640" height="240" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">两杆串联桁架的直接刚度法</text>

  <!-- 固支支座：节点1 -->
  <g fill="#333" stroke="#333">
    <polygon points="64,172 96,172 96,196 80,184 64,196"/>
    <line x1="64" y1="196" x2="96" y2="196" stroke-width="3"/>
    <line x1="56" y1="206" x2="104" y2="206" stroke-width="1"/>
    <line x1="60" y1="216" x2="100" y2="216" stroke-width="1"/>
    <line x1="64" y1="226" x2="96" y2="226" stroke-width="1"/>
  </g>

  <!-- 杆① 节点1-2 -->
  <line x1="80" y1="160" x2="320" y2="160" stroke="#1f6f8b" stroke-width="10" stroke-linecap="round"/>
  <!-- 杆② 节点2-3 -->
  <line x1="320" y1="160" x2="560" y2="160" stroke="#c0392b" stroke-width="10" stroke-linecap="round"/>

  <!-- 节点圆 -->
  <circle cx="80" cy="160" r="6" fill="#333"/>
  <circle cx="320" cy="160" r="6" fill="#333"/>
  <circle cx="560" cy="160" r="6" fill="#333"/>

  <!-- 拉力F箭头 -->
  <g stroke="#c0392b" stroke-width="3" fill="#c0392b">
    <line x1="570" y1="160" x2="612" y2="160"/>
    <polygon points="612,160 600,152 600,168"/>
  </g>

  <!-- 标签 -->
  <text x="200" y="138" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">单元①　EA，L</text>
  <text x="440" y="138" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">单元②　2EA，L</text>
  <text x="80" y="186" text-anchor="middle" font-size="14" fill="#333">节点 1（固支，u₁=0）</text>
  <text x="320" y="186" text-anchor="middle" font-size="14" fill="#333">节点 2（共享）</text>
  <text x="560" y="186" text-anchor="middle" font-size="14" fill="#333">节点 3</text>
  <text x="596" y="148" text-anchor="start" font-size="14" fill="#c0392b" font-weight="bold">F</text>

  <text x="320" y="228" text-anchor="middle" font-size="13" fill="#666">两杆刚度不同（EA 与 2EA），在共享节点 2 处刚度叠加，组装出全局 K</text>
</svg>
