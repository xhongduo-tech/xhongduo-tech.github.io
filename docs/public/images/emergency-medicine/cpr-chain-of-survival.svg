<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title>心搏骤停生存链五环</title>
<desc>从识别呼救到骤停后综合照护的五个环节，缺一不可</desc>
<rect x="0" y="0" width="900" height="300" fill="#faf9f5"/>
<g font-family="sans-serif">
  <!-- 五环（圆环） -->
  <circle cx="90" cy="150" r="52" fill="none" stroke="#1f6f8b" stroke-width="10"/>
  <circle cx="270" cy="150" r="52" fill="none" stroke="#1f6f8b" stroke-width="10"/>
  <circle cx="450" cy="150" r="52" fill="none" stroke="#c0392b" stroke-width="10"/>
  <circle cx="630" cy="150" r="52" fill="none" stroke="#1f6f8b" stroke-width="10"/>
  <circle cx="810" cy="150" r="52" fill="none" stroke="#c0392b" stroke-width="10"/>
  <!-- 环内序号 -->
  <text x="90" y="159" text-anchor="middle" font-size="34" fill="#333" font-weight="bold">1</text>
  <text x="270" y="159" text-anchor="middle" font-size="34" fill="#333" font-weight="bold">2</text>
  <text x="450" y="159" text-anchor="middle" font-size="34" fill="#333" font-weight="bold">3</text>
  <text x="630" y="159" text-anchor="middle" font-size="34" fill="#333" font-weight="bold">4</text>
  <text x="810" y="159" text-anchor="middle" font-size="34" fill="#333" font-weight="bold">5</text>
  <!-- 环间连接 -->
  <line x1="142" y1="150" x2="218" y2="150" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="322" y1="150" x2="398" y2="150" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="502" y1="150" x2="578" y2="150" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="682" y1="150" x2="758" y2="150" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- 环节文字 -->
  <text x="90" y="235" text-anchor="middle" font-size="15" fill="#333">识别与呼救</text>
  <text x="270" y="235" text-anchor="middle" font-size="15" fill="#333">高质量 CPR</text>
  <text x="450" y="235" text-anchor="middle" font-size="15" fill="#333">快速除颤</text>
  <text x="630" y="235" text-anchor="middle" font-size="15" fill="#333">高级急救</text>
  <text x="810" y="235" text-anchor="middle" font-size="15" fill="#333">骤停后照护</text>
  <!-- 副注 -->
  <text x="90" y="258" text-anchor="middle" font-size="13" fill="#666">立即识别</text>
  <text x="270" y="258" text-anchor="middle" font-size="13" fill="#666">胸外按压 100–120 次/分</text>
  <text x="450" y="258" text-anchor="middle" font-size="13" fill="#666">AED 越早越好</text>
  <text x="630" y="258" text-anchor="middle" font-size="13" fill="#666">插管与药物</text>
  <text x="810" y="258" text-anchor="middle" font-size="13" fill="#666">目标温度管理</text>
  <text x="450" y="290" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">任一环节断裂，链条即失效</text>
</g>
</svg>
