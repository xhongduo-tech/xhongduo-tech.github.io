<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title>创伤初次评估 ABCDE 流程</title>
<desc>气道到暴露的五个环节，每发现一个立即处理后再进入下一环节</desc>
<rect x="0" y="0" width="900" height="360" fill="#faf9f5"/>
<g font-family="sans-serif">
  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">创伤初次评估：ABCDE 五步</text>
  <!-- 五个环节框 -->
  <rect x="35" y="90" width="150" height="130" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <rect x="205" y="90" width="150" height="130" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <rect x="375" y="90" width="150" height="130" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <rect x="545" y="90" width="150" height="130" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <rect x="715" y="90" width="150" height="130" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <!-- 环节内容 -->
  <text x="110" y="125" text-anchor="middle" font-size="20" fill="#c0392b" font-weight="bold">A 气道</text>
  <text x="110" y="152" text-anchor="middle" font-size="14" fill="#333">+ 颈椎保护</text>
  <text x="110" y="176" text-anchor="middle" font-size="13" fill="#666">保持气道通畅</text>
  <text x="110" y="198" text-anchor="middle" font-size="13" fill="#666">颈椎制动</text>
  <text x="280" y="125" text-anchor="middle" font-size="20" fill="#c0392b" font-weight="bold">B 呼吸</text>
  <text x="280" y="152" text-anchor="middle" font-size="14" fill="#333">+ 通气</text>
  <text x="280" y="176" text-anchor="middle" font-size="13" fill="#666">张力性气胸?</text>
  <text x="280" y="198" text-anchor="middle" font-size="13" fill="#666">血氧与呼吸音</text>
  <text x="450" y="125" text-anchor="middle" font-size="20" fill="#c0392b" font-weight="bold">C 循环</text>
  <text x="450" y="152" text-anchor="middle" font-size="14" fill="#333">+ 止血</text>
  <text x="450" y="176" text-anchor="middle" font-size="13" fill="#666">外出血控制</text>
  <text x="450" y="198" text-anchor="middle" font-size="13" fill="#666">两路静脉通路</text>
  <text x="620" y="125" text-anchor="middle" font-size="20" fill="#c0392b" font-weight="bold">D 神经</text>
  <text x="620" y="152" text-anchor="middle" font-size="14" fill="#333">功能</text>
  <text x="620" y="176" text-anchor="middle" font-size="13" fill="#666">GCS 与瞳孔</text>
  <text x="620" y="198" text-anchor="middle" font-size="13" fill="#666">四肢运动</text>
  <text x="790" y="125" text-anchor="middle" font-size="20" fill="#1f6f8b" font-weight="bold">E 暴露</text>
  <text x="790" y="152" text-anchor="middle" font-size="14" fill="#333">+ 保温</text>
  <text x="790" y="176" text-anchor="middle" font-size="13" fill="#666">全面查体</text>
  <text x="790" y="198" text-anchor="middle" font-size="13" fill="#666">防止低体温</text>
  <!-- 箭头 -->
  <line x1="185" y1="155" x2="205" y2="155" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="355" y1="155" x2="375" y2="155" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="525" y1="155" x2="545" y2="155" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="695" y1="155" x2="715" y2="155" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <!-- 回路提示 -->
  <text x="450" y="258" text-anchor="middle" font-size="15" fill="#333">发现危及生命的异常，立即处理，处理后再进入下一环节</text>
  <path d="M 200 275 Q 110 275 110 300 Q 110 330 200 330 L 700 330 Q 790 330 790 300 Q 790 275 700 275" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="450" y="350" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">稳定后再进入二次评估（Secondary Survey）</text>
</g>
</svg>
