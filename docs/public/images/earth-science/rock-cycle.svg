<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="sans-serif">
  <title>岩石循环示意图</title>
  <desc>岩浆岩、沉积岩、变质岩三大类岩石与岩浆之间，经冷却结晶、风化剥蚀搬运沉积、埋藏变质、重熔等内外力地质作用相互转化。</desc>
  <rect x="0" y="0" width="760" height="560" fill="#faf9f5"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">岩石循环（Rock Cycle）</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 岩浆岩（上） -->
  <rect x="300" y="70" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="400" y="103" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">岩浆岩</text>
  <text x="400" y="126" text-anchor="middle" font-size="13" fill="#666">Igneous rock</text>

  <!-- 沉积岩（左下） -->
  <rect x="60" y="420" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="160" y="453" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">沉积岩</text>
  <text x="160" y="476" text-anchor="middle" font-size="13" fill="#666">Sedimentary rock</text>

  <!-- 变质岩（右下） -->
  <rect x="500" y="420" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="453" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">变质岩</text>
  <text x="600" y="476" text-anchor="middle" font-size="13" fill="#666">Metamorphic rock</text>

  <!-- 岩浆（中心） -->
  <ellipse cx="400" cy="270" rx="110" ry="52" fill="#f6e3d0" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">岩浆</text>
  <text x="400" y="290" text-anchor="middle" font-size="13" fill="#c0392b">Magma</text>

  <!-- ① 岩浆 → 岩浆岩：冷却结晶 -->
  <line x1="400" y1="322" x2="400" y2="148" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="245" font-size="14" fill="#1f6f8b">冷却结晶</text>

  <!-- ② 岩浆岩 → 沉积岩：风化·剥蚀·搬运·沉积 -->
  <line x1="355" y1="148" x2="212" y2="415" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="300" font-size="13" fill="#1f6f8b">风化·剥蚀·搬运·沉积</text>

  <!-- ③ 沉积岩 → 变质岩：埋藏·变质 -->
  <line x1="268" y1="455" x2="492" y2="455" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="440" text-anchor="middle" font-size="13" fill="#1f6f8b">埋藏增温增压·变质作用</text>

  <!-- ④ 变质岩 → 岩浆：重熔 -->
  <path d="M 530 415 Q 540 360 480 328" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="352" font-size="14" fill="#1f6f8b">重熔</text>

  <!-- ⑤ 岩浆岩 → 变质岩：高温高压变质 -->
  <path d="M 468 145 Q 575 230 585 412" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="588" y="250" font-size="13" fill="#1f6f8b">高温高压·变质</text>
</svg>
