<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="sans-serif">
  <title>地球内部圈层结构示意图</title>
  <desc>地球内部自外而内分为地壳、地幔、外核与内核，各层以莫霍面、古登堡面与莱曼面相隔。图中地壳厚度为清晰显示已放大。</desc>

  <!-- 地壳 -->
  <circle cx="290" cy="260" r="240" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <!-- 地幔 -->
  <circle cx="290" cy="260" r="226" fill="#d9b08c" stroke="#333" stroke-width="1.5"/>
  <!-- 外核 -->
  <circle cx="290" cy="260" r="138" fill="#e67e22" stroke="#333" stroke-width="1.5"/>
  <!-- 内核 -->
  <circle cx="290" cy="260" r="70" fill="#c0392b" stroke="#333" stroke-width="1.5"/>

  <!-- 边界指示点与引线 -->
  <circle cx="516" cy="260" r="3" fill="#333"/>
  <path d="M 516 260 H 548 V 166" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="428" cy="260" r="3" fill="#333"/>
  <path d="M 428 260 H 548 V 296" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="360" cy="260" r="3" fill="#333"/>
  <path d="M 360 260 H 548 V 356" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 层内文字 -->
  <text x="290" y="12" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">地壳（0–35 km）</text>
  <text x="290" y="72" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">地幔</text>
  <text x="290" y="88" text-anchor="middle" font-size="13" fill="#333">35–2900 km</text>
  <text x="290" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">外核（液态）</text>
  <text x="290" y="166" text-anchor="middle" font-size="13" fill="#fff">2900–5155 km</text>
  <text x="290" y="254" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">内核</text>
  <text x="290" y="272" text-anchor="middle" font-size="13" fill="#fff">固态</text>

  <!-- 右侧界面名 -->
  <text x="560" y="166" font-size="13" fill="#333">莫霍面 ≈35 km</text>
  <text x="560" y="296" font-size="13" fill="#333">古登堡面 ≈2900 km</text>
  <text x="560" y="356" font-size="13" fill="#333">莱曼面 ≈5155 km</text>

  <!-- 注 -->
  <text x="20" y="500" font-size="13" fill="#666">注：地壳厚度按真实比例不足半径的 0.5%，图中为便于观察已放大。</text>
</svg>
