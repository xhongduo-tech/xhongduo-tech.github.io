<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="sans-serif">
  <title>地震波影区示意图</title>
  <desc>地震波从震源向地球内部传播：S 波被液态外核阻挡形成 S 波影区（约 103 度以外），P 波被外核强烈折射形成 103 度到 142 度之间的 P 波影区，穿过固态内核的 P 波在 142 度以外重新出现。</desc>

  <!-- 地球外圈 -->
  <circle cx="320" cy="260" r="200" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>

  <!-- 外核（液态） -->
  <circle cx="320" cy="260" r="105" fill="#e67e22" opacity="0.75" stroke="#333" stroke-width="1"/>
  <!-- 内核（固态） -->
  <circle cx="320" cy="260" r="52" fill="#c0392b" opacity="0.85" stroke="#333" stroke-width="1"/>

  <!-- 圈层标签 -->
  <text x="320" y="230" text-anchor="middle" font-size="13" fill="#333">外核（液态）</text>
  <text x="320" y="245" text-anchor="middle" font-size="13" fill="#333">S 波无法通过</text>
  <text x="320" y="262" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">内核</text>
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="#fff">（固态）</text>

  <!-- 角度参考线：103° 与 142°（自震源算起，以地心为顶点） -->
  <line x1="320" y1="260" x2="125" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="260" x2="515" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="260" x2="197" y2="418" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="260" x2="443" y2="418" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- P 波影区条带（右侧与左侧，103°–142°） -->
  <path d="M 515 305 A 200 200 0 0 1 443 418" fill="none" stroke="#f1c40f" stroke-width="26" opacity="0.55"/>
  <path d="M 125 305 A 200 200 0 0 0 197 418" fill="none" stroke="#f1c40f" stroke-width="26" opacity="0.55"/>

  <!-- S 波影区条带（103° 以外，右侧与左侧，加宽） -->
  <path d="M 515 305 A 200 200 0 0 1 320 460" fill="none" stroke="#e67e22" stroke-width="20" opacity="0.45"/>
  <path d="M 125 305 A 200 200 0 0 0 320 460" fill="none" stroke="#e67e22" stroke-width="20" opacity="0.45"/>

  <!-- 震源（震中） -->
  <polygon points="320,52 313,68 327,68" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <text x="320" y="42" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">震源</text>

  <!-- S 波射线：被外核阻挡 -->
  <line x1="320" y1="68" x2="320" y2="155" stroke="#c0392b" stroke-width="2.5"/>
  <text x="334" y="120" font-size="13" fill="#c0392b">S 波</text>
  <line x1="314" y1="160" x2="326" y2="148" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="314" y1="148" x2="326" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <text x="336" y="168" font-size="13" fill="#c0392b">止步于外核</text>

  <!-- P 波射线：穿过内核，在 142° 外重新出现 -->
  <path d="M 320 68 C 332 150 306 370 320 460" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="292" y="250" font-size="13" fill="#1f6f8b">P 波穿过内核</text>

  <!-- 角度标注 -->
  <text x="162" y="292" font-size="13" fill="#333">103°</text>
  <text x="478" y="292" font-size="13" fill="#333">103°</text>
  <text x="206" y="430" font-size="13" fill="#333">142°</text>
  <text x="436" y="430" font-size="13" fill="#333">142°</text>

  <!-- 图例 -->
  <rect x="560" y="120" width="180" height="190" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="650" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">影区图例</text>
  <rect x="572" y="154" width="24" height="10" fill="#f1c40f" opacity="0.75"/>
  <text x="604" y="164" font-size="13" fill="#333">P 波影区</text>
  <rect x="572" y="176" width="24" height="10" fill="#e67e22" opacity="0.7"/>
  <text x="604" y="186" font-size="13" fill="#333">S 波影区</text>
  <text x="572" y="210" font-size="13" fill="#333">震源到台站的</text>
  <text x="572" y="226" font-size="13" fill="#333">角距离以地心为顶点，</text>
  <text x="572" y="242" font-size="13" fill="#333">从 0°（震源方向）起算。</text>
  <text x="572" y="266" font-size="13" fill="#333">两条虚线分别标记</text>
  <text x="572" y="282" font-size="13" fill="#333">103° 与 142° 的边界。</text>

  <!-- 底部说明 -->
  <text x="320" y="505" text-anchor="middle" font-size="13" fill="#666">注：P 波影区 103°–142° 由液态外核对 P 波的强烈折射造成；S 波影区从 103° 起再未出现，直接证明外核为液态。</text>
</svg>
