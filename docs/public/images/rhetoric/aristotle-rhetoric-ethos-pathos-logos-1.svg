<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tri-title tri-desc">
<title id="tri-title">亚里士多德三诉诸：ethos / pathos / logos</title>
<desc id="tri-desc">说服的三种途径构成一个三角形：上端为人格诉诸（ethos），左下为逻辑诉诸（logos），右下为情感诉诸（pathos），中心汇聚为「说服」。三种诉诸分别对应明智德性善意、论证证据、共情情绪。</desc>
<rect width="480" height="380" fill="#faf9f5"/>
<!-- 三角形三条边 -->
<line x1="240" y1="86" x2="92" y2="306" stroke="#1f6f8b" stroke-width="3"/>
<line x1="240" y1="86" x2="388" y2="306" stroke="#1f6f8b" stroke-width="3"/>
<line x1="92" y1="306" x2="388" y2="306" stroke="#1f6f8b" stroke-width="3"/>
<!-- ethos 顶点（上） -->
<circle cx="240" cy="86" r="30" fill="#1f6f8b"/>
<text x="240" y="82" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">ethos</text>
<text x="240" y="102" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">人格</text>
<text x="315" y="90" text-anchor="start" fill="#333333" font-family="sans-serif" font-size="14">明智 · 德性 · 善意</text>
<!-- logos 顶点（左下） -->
<circle cx="92" cy="306" r="30" fill="#c0392b"/>
<text x="92" y="302" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">logos</text>
<text x="92" y="322" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">逻辑</text>
<text x="92" y="356" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="14">论证 · 证据</text>
<!-- pathos 顶点（右下） -->
<circle cx="388" cy="306" r="30" fill="#c0392b"/>
<text x="388" y="302" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">pathos</text>
<text x="388" y="322" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">情感</text>
<text x="388" y="356" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="14">共情 · 情绪</text>
<!-- 中心 -->
<text x="240" y="210" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="20" font-weight="bold">说服</text>
<text x="240" y="234" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="13">三途并用，方为上乘</text>
</svg>
