<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>三分法与黄金分割构图示意</title>
  <desc>在一个 3:2 的取景框中，横竖各两条三分线把画面分成九宫格，四个交点标记为视觉兴趣点，背景叠加斐波那契黄金螺旋。</desc>
  <rect x="0" y="0" width="600" height="400" fill="#faf9f5"/>
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <path d="M 216.7 50 L 216.7 350" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 383.3 50 L 383.3 350" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 50 150 L 550 150" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 50 250 L 550 250" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 550 50 q -83 0 -83 83 q 0 52 32 84 q -32 -32 -84 -32 q -52 0 -84 -32 q 32 -32 84 -32 q 83 0 135 52" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.75"/>
  <circle cx="216.7" cy="150" r="7" fill="#c0392b" stroke="#faf9f5" stroke-width="2"/>
  <circle cx="216.7" cy="250" r="7" fill="#c0392b" stroke="#faf9f5" stroke-width="2"/>
  <circle cx="383.3" cy="150" r="7" fill="#c0392b" stroke="#faf9f5" stroke-width="2"/>
  <circle cx="383.3" cy="250" r="7" fill="#c0392b" stroke="#faf9f5" stroke-width="2"/>
  <text x="50" y="385" font-family="sans-serif" font-size="14" fill="#333333">三分线交叉的四个点</text>
  <text x="300" y="385" font-family="sans-serif" font-size="14" fill="#c0392b">● 视觉兴趣点</text>
  <text x="440" y="385" font-family="sans-serif" font-size="14" fill="#1f6f8b">--- 黄金螺旋</text>
</svg>
