<svg viewBox="0 0 660 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>透辉石—钙长石二元共晶相图与杠杆规则</title>
  <desc>以温度为纵轴、组成为横轴的二元共晶相图：左侧纯透辉石熔点 1391 摄氏度，右侧纯钙长石熔点 1553 摄氏度，两条液相线在共晶点约 1274 摄氏度、约 45 百分数钙长石处交汇；图中示范 1450 摄氏度下杠杆规则求固相比例。</desc>
  <rect width="660" height="500" fill="#faf9f5"/>
  <text x="330" y="30" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">透辉石（Di）— 钙长石（An）二元共晶相图</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="430" x2="580" y2="430" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="430" x2="80" y2="80" stroke="#333" stroke-width="2"/>
  <polygon points="580,430 568,425 568,435" fill="#333"/>
  <polygon points="80,80 75,92 85,92" fill="#333"/>
  <text x="330" y="462" font-size="15" fill="#333" text-anchor="middle">组成（wt% An，向右钙长石含量增加）</text>
  <text x="62" y="90" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 62 90)">温度（°C）</text>

  <!-- 刻度 -->
  <text x="80" y="450" font-size="13" fill="#333" text-anchor="middle">纯 Di</text>
  <text x="300" y="450" font-size="13" fill="#333" text-anchor="middle">45%</text>
  <text x="580" y="450" font-size="13" fill="#333" text-anchor="middle">纯 An</text>
  <line x1="80" y1="430" x2="80" y2="437" stroke="#333"/>
  <line x1="300" y1="430" x2="300" y2="437" stroke="#333"/>
  <line x1="580" y1="430" x2="580" y2="437" stroke="#333"/>
  <text x="64" y="130" font-size="13" fill="#333" text-anchor="end">1553</text>
  <text x="64" y="268" font-size="13" fill="#333" text-anchor="end">1391</text>
  <text x="64" y="367" font-size="13" fill="#333" text-anchor="end">1274</text>
  <line x1="76" y1="130" x2="80" y2="130" stroke="#333"/>
  <line x1="76" y1="268" x2="80" y2="268" stroke="#333"/>
  <line x1="76" y1="367" x2="80" y2="367" stroke="#333"/>

  <!-- 液相线 -->
  <line x1="80" y1="268" x2="300" y2="367" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="300" y1="367" x2="580" y2="130" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 固相线（共晶温度） -->
  <line x1="80" y1="367" x2="580" y2="367" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 熔点与共晶点 -->
  <circle cx="80" cy="268" r="4" fill="#333"/>
  <circle cx="580" cy="130" r="4" fill="#333"/>
  <circle cx="300" cy="367" r="5" fill="#c0392b"/>
  <text x="300" y="386" font-size="13" fill="#c0392b" text-anchor="middle">共晶点 ~1274 °C，~45% An</text>
  <text x="92" y="255" font-size="13" fill="#333" text-anchor="start">Di 熔点 1391 °C</text>
  <text x="468" y="122" font-size="13" fill="#333" text-anchor="start">An 熔点 1553 °C</text>

  <!-- 相区标注 -->
  <text x="330" y="200" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">液相（熔体）L</text>
  <text x="150" y="330" font-size="14" fill="#333" text-anchor="middle">L + Di</text>
  <text x="480" y="220" font-size="14" fill="#333" text-anchor="middle">L + An</text>
  <text x="330" y="420" font-size="14" fill="#333" text-anchor="middle">Di + An（固态混合物）</text>

  <!-- 杠杆规则：T=1450°C，X0=90% An -->
  <line x1="80" y1="218" x2="580" y2="218" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="464" y1="218" x2="580" y2="218" stroke="#b8860b" stroke-width="2.5"/>
  <circle cx="512" cy="218" r="5" fill="#333"/>
  <text x="512" y="208" font-size="13" fill="#333" text-anchor="middle">X₀ = 90% An</text>
  <circle cx="464" cy="218" r="4" fill="#b8860b"/>
  <text x="380" y="250" font-size="13" fill="#b8860b" text-anchor="middle">杠杆规则：固相分数 = (C_L − X₀)/(C_L − C_S) ≈ 0.5</text>
  <text x="452" y="202" font-size="13" fill="#b8860b" text-anchor="middle">液相 ~80% An</text>
  <text x="532" y="238" font-size="13" fill="#b8860b" text-anchor="middle">固相：纯 An</text>
  <text x="120" y="210" font-size="13" fill="#999">T = 1450 °C</text>
</svg>
