<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="title desc">
  <title id="title">地球层圈结构与岩浆窗口示意：地壳、地幔、地核与 MORB / OIB 岩浆作用</title>
  <desc id="desc">地球剖面图：最外圈是地壳，中间是地幔（标注亏损地幔 DMM 与富集端元 EM1、EM2、HIMU），中心是铁镍地核；顶部洋中脊处岩浆上涌形成 MORB，右侧地幔柱从核幔边界上涌形成洋岛 OIB。</desc>
  <rect width="600" height="440" fill="#faf9f5"/>

  <!-- 地幔 -->
  <circle cx="280" cy="215" r="190" fill="#f0e6d0" stroke="#333" stroke-width="1.5"/>
  <!-- 地核 -->
  <circle cx="280" cy="215" r="75" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <!-- 内核 -->
  <circle cx="280" cy="215" r="32" fill="#a93226" stroke="#333" stroke-width="1"/>

  <!-- 地壳 -->
  <circle cx="280" cy="215" r="205" fill="none" stroke="#8b6914" stroke-width="7"/>

  <!-- 洋中脊：顶部扩散带 -->
  <polygon points="280,14 264,40 296,40" fill="#1f6f8b"/>
  <polygon points="264,40 250,30 264,48" fill="#1f6f8b"/>
  <polygon points="296,40 310,30 296,48" fill="#1f6f8b"/>
  <line x1="280" y1="40" x2="280" y2="70" stroke="#c0392b" stroke-width="3"/>
  <polygon points="280,52 274,66 286,66" fill="#c0392b"/>
  <!-- 板块分离箭头 -->
  <path d="M 264 40 L 210 55 M 296 40 L 350 55" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="200" y="72" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">板块离散</text>
  <text x="352" y="72" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">板块离散</text>
  <text x="280" y="30" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">洋中脊</text>
  <text x="280" y="88" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">减压熔融→MORB</text>

  <!-- 地幔柱：核幔边界上涌至地表 -->
  <path d="M 372 385 Q 380 300 398 215 Q 415 120 450 30 L 490 55 Q 440 140 425 215 Q 415 300 408 385 Z" fill="#1f6f8b" opacity="0.45"/>
  <text x="462" y="150" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold" transform="rotate(-28 462 150)">地幔柱</text>
  <text x="476" y="120" font-family="sans-serif" font-size="13" fill="#1f6f8b" transform="rotate(-28 476 120)">(OIB)</text>
  <!-- 洋岛 -->
  <circle cx="470" cy="40" r="12" fill="#c0392b"/>
  <text x="470" y="26" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">洋岛</text>
  <line x1="382" y1="385" x2="350" y2="405" stroke="#333" stroke-width="1.2"/>
  <text x="300" y="415" font-family="sans-serif" font-size="13" fill="#333">核幔边界 CMB</text>

  <!-- 地幔端元 -->
  <ellipse cx="215" cy="175" rx="34" ry="16" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="215" y="179" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">DMM</text>
  <ellipse cx="150" cy="330" rx="32" ry="15" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <text x="150" y="334" font-family="sans-serif" font-size="14" fill="#8b6914" text-anchor="middle" font-weight="bold">EM1</text>
  <ellipse cx="385" cy="310" rx="32" ry="15" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <text x="385" y="314" font-family="sans-serif" font-size="14" fill="#8b6914" text-anchor="middle" font-weight="bold">EM2</text>
  <ellipse cx="370" cy="205" rx="32" ry="15" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="209" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">HIMU</text>

  <!-- 层圈标注 -->
  <line x1="488" y1="215" x2="520" y2="215" stroke="#333" stroke-width="1.2"/>
  <text x="528" y="212" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">地壳</text>
  <text x="528" y="230" font-family="sans-serif" font-size="12" fill="#555">(硅酸盐壳)</text>
  <line x1="90" y1="215" x2="52" y2="215" stroke="#333" stroke-width="1.2"/>
  <text x="44" y="212" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="end">地幔</text>
  <text x="44" y="230" font-family="sans-serif" font-size="12" fill="#555" text-anchor="end">(镁铁硅酸盐)</text>
  <line x1="238" y1="240" x2="196" y2="268" stroke="#333" stroke-width="1.2"/>
  <text x="196" y="284" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">地核</text>
  <text x="196" y="302" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">(铁镍)</text>

  <!-- 图注 -->
  <text x="16" y="22" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">图：地幔不均一性与两类岩浆窗口</text>
  <line x1="16" y1="34" x2="300" y2="34" stroke="#d0c8b5" stroke-width="1"/>
  <text x="16" y="52" font-family="sans-serif" font-size="13" fill="#333">DMM = 亏损地幔（MORB 源区）；EM1 / EM2 = 富集地幔端元；</text>
  <text x="16" y="68" font-family="sans-serif" font-size="13" fill="#333">HIMU = 高 U/Pb 端元。OIB 的同位素数据落在这些端元围成的区域内。</text>
</svg>
