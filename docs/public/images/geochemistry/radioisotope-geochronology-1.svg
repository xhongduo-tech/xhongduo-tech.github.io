<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Rb–Sr 等时线示意</title>
  <desc>以 87Sr/86Sr 为纵轴、87Rb/86Sr 为横轴的等时线图：三个同源样品点共线，斜率等于 e 的 lambda t 次方减一，用于求年龄；直线外推与纵轴的交点给出初始 87Sr/86Sr 比值。</desc>
  <rect width="640" height="480" fill="#faf9f5"/>
  <text x="320" y="30" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">Rb–Sr 等时线示意</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="400" x2="560" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="400" x2="90" y2="60" stroke="#333" stroke-width="2"/>
  <polygon points="560,400 548,395 548,405" fill="#333"/>
  <polygon points="90,60 85,72 95,72" fill="#333"/>
  <text x="500" y="430" font-size="15" fill="#333" text-anchor="middle">87Rb / 86Sr</text>
  <text x="66" y="66" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 66 66)">87Sr / 86Sr</text>

  <!-- 刻度 -->
  <text x="90" y="420" font-size="13" fill="#333" text-anchor="middle">0</text>
  <text x="325" y="420" font-size="13" fill="#333" text-anchor="middle">0.5</text>
  <text x="560" y="420" font-size="13" fill="#333" text-anchor="middle">1.0</text>
  <line x1="90" y1="400" x2="90" y2="406" stroke="#333"/>
  <line x1="325" y1="400" x2="325" y2="406" stroke="#333"/>
  <line x1="560" y1="400" x2="560" y2="406" stroke="#333"/>
  <text x="74" y="400" font-size="13" fill="#333" text-anchor="end">0.70</text>
  <text x="74" y="332" font-size="13" fill="#333" text-anchor="end">0.72</text>
  <text x="74" y="264" font-size="13" fill="#333" text-anchor="end">0.74</text>
  <line x1="86" y1="332" x2="90" y2="332" stroke="#333"/>
  <line x1="86" y1="264" x2="90" y2="264" stroke="#333"/>

  <!-- 较年轻的等时线（虚线，斜率小） -->
  <line x1="90" y1="386" x2="560" y2="352" stroke="#b8860b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="400" y="368" font-size="13" fill="#b8860b">较年轻：斜率小</text>

  <!-- 主等时线 -->
  <line x1="90" y1="364" x2="550" y2="296" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="360" y="322" font-size="13" fill="#1f6f8b">斜率 = e<sup>λt</sup> − 1</text>

  <!-- 样品点 -->
  <circle cx="137" cy="359" r="5" fill="#c0392b"/>
  <circle cx="325" cy="332" r="5" fill="#c0392b"/>
  <circle cx="513" cy="304" r="5" fill="#c0392b"/>
  <text x="137" y="380" font-size="13" fill="#333" text-anchor="middle">矿物 A</text>
  <text x="325" y="352" font-size="13" fill="#333" text-anchor="middle">矿物 B</text>
  <text x="513" y="290" font-size="13" fill="#333" text-anchor="middle">矿物 C</text>

  <!-- 截距标注 -->
  <circle cx="90" cy="364" r="4" fill="#333"/>
  <text x="120" y="355" font-size="13" fill="#333">截距 = 初始比值（87Sr/86Sr）₀</text>
  <text x="120" y="374" font-size="13" fill="#666">≈ 0.7105</text>
</svg>
