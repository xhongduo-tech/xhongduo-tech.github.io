<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>范克雷费伦图：干酪根类型与成熟演化</title>
  <desc>以 O/C 为横轴、H/C 为纵轴的干酪根分类图，标注 I、II、III、IV 四型干酪根的位置与随成熟度向原点演化的趋势箭头。</desc>
  <rect width="640" height="480" fill="#faf9f5"/>
  <text x="320" y="30" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">范克雷费伦图（van Krevelen diagram）</text>
  <text x="320" y="52" font-size="13" fill="#666" text-anchor="middle">干酪根分类与成熟度演化</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="420" x2="560" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="420" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <polygon points="560,420 548,415 548,425" fill="#333"/>
  <polygon points="80,60 75,72 85,72" fill="#333"/>
  <text x="540" y="445" font-size="14" fill="#333" text-anchor="middle">原子比 O/C</text>
  <text x="60" y="66" font-size="14" fill="#333" text-anchor="middle">H/C</text>

  <!-- 刻度 -->
  <text x="80" y="438" font-size="13" fill="#333" text-anchor="middle">0</text>
  <text x="224" y="438" font-size="13" fill="#333" text-anchor="middle">0.15</text>
  <text x="368" y="438" font-size="13" fill="#333" text-anchor="middle">0.30</text>
  <text x="512" y="438" font-size="13" fill="#333" text-anchor="middle">0.45</text>
  <line x1="80" y1="420" x2="80" y2="426" stroke="#333"/>
  <line x1="224" y1="420" x2="224" y2="426" stroke="#333"/>
  <line x1="368" y1="420" x2="368" y2="426" stroke="#333"/>
  <line x1="512" y1="420" x2="512" y2="426" stroke="#333"/>
  <text x="58" y="420" font-size="13" fill="#333" text-anchor="end">0</text>
  <text x="58" y="300" font-size="13" fill="#333" text-anchor="end">0.6</text>
  <text x="58" y="180" font-size="13" fill="#333" text-anchor="end">1.2</text>
  <text x="58" y="60" font-size="13" fill="#333" text-anchor="end">1.8</text>
  <line x1="76" y1="300" x2="80" y2="300" stroke="#333"/>
  <line x1="76" y1="180" x2="80" y2="180" stroke="#333"/>
  <line x1="76" y1="60" x2="80" y2="60" stroke="#333"/>

  <!-- 成熟演化趋势箭头（指向原点） -->
  <path d="M 128 120 C 110 200, 100 320, 88 400" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="88,404 78,398 82,410" fill="#c0392b"/>
  <path d="M 195 160 C 170 240, 140 340, 92 405" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="92,409 82,403 87,415" fill="#1f6f8b"/>
  <path d="M 320 260 C 250 320, 160 380, 95 410" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="94,414 85,408 89,420" fill="#b8860b"/>

  <!-- 类型区域 -->
  <ellipse cx="132" cy="118" rx="26" ry="16" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="132" y="98" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">Ⅰ型</text>
  <text x="132" y="158" font-size="13" fill="#666" text-anchor="middle">湖相藻类</text>

  <ellipse cx="200" cy="158" rx="24" ry="15" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="200" y="138" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">Ⅱ型</text>
  <text x="200" y="198" font-size="13" fill="#666" text-anchor="middle">海相浮游生物</text>

  <ellipse cx="320" cy="262" rx="30" ry="17" fill="none" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="242" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="bold">Ⅲ型</text>
  <text x="320" y="302" font-size="13" fill="#666" text-anchor="middle">陆源木质素</text>

  <ellipse cx="258" cy="342" rx="28" ry="16" fill="none" stroke="#555" stroke-width="2"/>
  <text x="258" y="322" font-size="15" fill="#555" text-anchor="middle" font-weight="bold">Ⅳ型</text>
  <text x="258" y="382" font-size="13" fill="#666" text-anchor="middle">惰性有机质</text>

  <!-- 原点提示 -->
  <text x="118" y="452" font-size="13" fill="#999" text-anchor="middle">演化终点：石墨（富碳贫氢贫氧）</text>
</svg>
