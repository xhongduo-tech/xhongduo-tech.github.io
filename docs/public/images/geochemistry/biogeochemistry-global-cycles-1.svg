<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>全球碳循环储库与通量示意</title>
  <desc>大气、陆地生物圈与土壤、海洋、化石燃料、沉积岩五大碳储库之间的主要通量：光合呼吸、海气交换、河流输送、风化溶解、生物泵埋藏、火山释放与化石燃料燃烧。</desc>
  <rect width="700" height="500" fill="#faf9f5"/>
  <text x="350" y="26" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">全球碳循环：储库与通量示意</text>

  <!-- 大气 -->
  <rect x="150" y="40" width="400" height="65" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="350" y="68" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">大气 CO₂</text>
  <text x="350" y="92" font-size="13" fill="#666" text-anchor="middle">约 850 Gt C　|　驻留时间约 4 年</text>

  <!-- 陆地 -->
  <rect x="50" y="170" width="250" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="175" y="200" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">陆地生物圈与土壤</text>
  <text x="175" y="224" font-size="13" fill="#666" text-anchor="middle">约 2,000 + 1,500 Gt C</text>

  <!-- 海洋 -->
  <rect x="400" y="170" width="260" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="530" y="200" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">海洋（DIC + 生物泵）</text>
  <text x="530" y="224" font-size="13" fill="#666" text-anchor="middle">约 38,000 Gt C</text>

  <!-- 化石燃料 -->
  <rect x="50" y="360" width="250" height="90" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="392" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">化石燃料</text>
  <text x="175" y="416" font-size="13" fill="#666" text-anchor="middle">约 4,000–10,000 Gt C</text>

  <!-- 沉积岩 -->
  <rect x="400" y="350" width="260" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="530" y="382" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">碳酸盐岩 + 埋藏有机质</text>
  <text x="530" y="406" font-size="13" fill="#666" text-anchor="middle">约 6 × 10⁷ Gt C（最大储库）</text>
  <text x="530" y="430" font-size="13" fill="#666" text-anchor="middle">驻留时间以亿年计</text>

  <!-- 光合/呼吸 -->
  <line x1="175" y1="105" x2="175" y2="170" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="175,172 170,160 180,160" fill="#1f6f8b"/>
  <polygon points="175,103 170,115 180,115" fill="#1f6f8b"/>
  <text x="210" y="140" font-size="13" fill="#1f6f8b">光合 / 呼吸</text>

  <!-- 海气交换 -->
  <line x1="520" y1="105" x2="520" y2="170" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="520,172 515,160 525,160" fill="#1f6f8b"/>
  <polygon points="520,103 515,115 525,115" fill="#1f6f8b"/>
  <text x="545" y="140" font-size="13" fill="#1f6f8b">海气交换</text>

  <!-- 河流输送 -->
  <line x1="300" y1="215" x2="400" y2="215" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="402,215 390,210 390,220" fill="#1f6f8b"/>
  <text x="330" y="205" font-size="13" fill="#1f6f8b">河流输送</text>

  <!-- 生物泵/埋藏 -->
  <line x1="470" y1="280" x2="470" y2="350" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="470,352 465,340 475,340" fill="#1f6f8b"/>
  <text x="490" y="322" font-size="13" fill="#1f6f8b">生物泵 · 埋藏</text>

  <!-- 风化 -->
  <line x1="580" y1="350" x2="580" y2="280" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="580,278 575,290 585,290" fill="#1f6f8b"/>
  <text x="600" y="322" font-size="13" fill="#1f6f8b">风化溶解</text>

  <!-- 火山 -->
  <path d="M 420 350 C 360 280, 300 180, 300 105" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="300,103 293,114 307,114" fill="#1f6f8b"/>
  <text x="245" y="230" font-size="13" fill="#1f6f8b">火山释放</text>

  <!-- 化石燃料燃烧 -->
  <line x1="150" y1="360" x2="150" y2="105" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="150,103 145,115 155,115" fill="#c0392b"/>
  <text x="92" y="235" font-size="13" fill="#c0392b" font-weight="bold">化石燃料燃烧</text>

  <!-- 图例 -->
  <line x1="40" y1="492" x2="70" y2="492" stroke="#1f6f8b" stroke-width="2"/>
  <text x="78" y="496" font-size="13" fill="#333">自然通量</text>
  <line x1="170" y1="492" x2="200" y2="492" stroke="#c0392b" stroke-width="2.5"/>
  <text x="208" y="496" font-size="13" fill="#333">人为通量</text>
</svg>
