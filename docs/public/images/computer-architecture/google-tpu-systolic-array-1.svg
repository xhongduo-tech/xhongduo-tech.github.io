<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<title>脉动阵列（Systolic Array）工作原理</title>
<desc>权值 W 预先驻留在各处理单元（PE）内，激活数据从左侧流入、沿行向右逐拍传递，每个 PE 每拍完成一次乘加，部分和沿列向下累加并输出结果矩阵。</desc>
<rect x="0" y="0" width="720" height="430" fill="#faf9f5"/>
<text x="360" y="34" font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">脉动阵列（Systolic Array）</text>
<text x="360" y="62" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">权值 W 预先驻留在各 PE 内（Weight Stationary）</text>

<!-- 处理单元 4 列 x 3 行 -->
<g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
  <g id="pe-row-0">
    <rect x="190" y="95"  width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="225" y="118">MAC</text>
    <text x="225" y="138" font-size="12" fill="#1f6f8b">W</text>
    <rect x="280" y="95"  width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="315" y="118">MAC</text>
    <text x="315" y="138" font-size="12" fill="#1f6f8b">W</text>
    <rect x="370" y="95"  width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="405" y="118">MAC</text>
    <text x="405" y="138" font-size="12" fill="#1f6f8b">W</text>
    <rect x="460" y="95"  width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="495" y="118">MAC</text>
    <text x="495" y="138" font-size="12" fill="#1f6f8b">W</text>
  </g>
  <g id="pe-row-1">
    <rect x="190" y="175" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="225" y="198">MAC</text>
    <text x="225" y="218" font-size="12" fill="#1f6f8b">W</text>
    <rect x="280" y="175" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="315" y="198">MAC</text>
    <text x="315" y="218" font-size="12" fill="#1f6f8b">W</text>
    <rect x="370" y="175" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="405" y="198">MAC</text>
    <text x="405" y="218" font-size="12" fill="#1f6f8b">W</text>
    <rect x="460" y="175" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="495" y="198">MAC</text>
    <text x="495" y="218" font-size="12" fill="#1f6f8b">W</text>
  </g>
  <g id="pe-row-2">
    <rect x="190" y="255" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="225" y="278">MAC</text>
    <text x="225" y="298" font-size="12" fill="#1f6f8b">W</text>
    <rect x="280" y="255" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="315" y="278">MAC</text>
    <text x="315" y="298" font-size="12" fill="#1f6f8b">W</text>
    <rect x="370" y="255" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="405" y="278">MAC</text>
    <text x="405" y="298" font-size="12" fill="#1f6f8b">W</text>
    <rect x="460" y="255" width="70" height="54" rx="6" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
    <text x="495" y="278">MAC</text>
    <text x="495" y="298" font-size="12" fill="#1f6f8b">W</text>
  </g>
</g>

<!-- 激活输入：左侧箭头 -->
<g stroke="#c0392b" stroke-width="3" fill="#c0392b" font-family="sans-serif" font-size="14">
  <line x1="150" y1="122" x2="186" y2="122"/><polygon points="192,122 180,116 180,128"/>
  <line x1="150" y1="202" x2="186" y2="202"/><polygon points="192,202 180,196 180,208"/>
  <line x1="150" y1="282" x2="186" y2="282"/><polygon points="192,282 180,276 180,288"/>
</g>
<text x="100" y="122" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">激活</text>
<text x="100" y="202" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">a[i]</text>
<text x="100" y="282" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">流入</text>

<!-- 行内向右传递箭头 -->
<g stroke="#c0392b" stroke-width="2" fill="#c0392b">
  <line x1="264" y1="122" x2="276" y2="122"/><polygon points="280,122 272,118 272,126"/>
  <line x1="354" y1="122" x2="366" y2="122"/><polygon points="370,122 362,118 362,126"/>
  <line x1="444" y1="122" x2="456" y2="122"/><polygon points="460,122 452,118 452,126"/>
  <line x1="264" y1="202" x2="276" y2="202"/><polygon points="280,202 272,198 272,206"/>
  <line x1="354" y1="202" x2="366" y2="202"/><polygon points="370,202 362,198 362,206"/>
  <line x1="444" y1="202" x2="456" y2="202"/><polygon points="460,202 452,198 452,206"/>
  <line x1="264" y1="282" x2="276" y2="282"/><polygon points="280,282 272,278 272,286"/>
  <line x1="354" y1="282" x2="366" y2="282"/><polygon points="370,282 362,278 362,286"/>
  <line x1="444" y1="282" x2="456" y2="282"/><polygon points="460,282 452,278 452,286"/>
</g>

<!-- 部分和向下累加箭头 -->
<g stroke="#1f6f8b" stroke-width="3" fill="#1f6f8b">
  <line x1="225" y1="315" x2="225" y2="351"/><polygon points="225,357 219,345 231,345"/>
  <line x1="315" y1="315" x2="315" y2="351"/><polygon points="315,357 309,345 321,345"/>
  <line x1="405" y1="315" x2="405" y2="351"/><polygon points="405,357 399,345 411,345"/>
  <line x1="495" y1="315" x2="495" y2="351"/><polygon points="495,357 489,345 501,345"/>
</g>
<text x="225" y="372" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">部分和</text>
<text x="315" y="372" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">沿列</text>
<text x="405" y="372" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">累加</text>
<text x="495" y="372" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">↓</text>

<text x="360" y="404" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">每个 PE 每拍完成一次乘加；数据像心跳一样逐拍流动，最终输出结果 = A × B</text>
</svg>
