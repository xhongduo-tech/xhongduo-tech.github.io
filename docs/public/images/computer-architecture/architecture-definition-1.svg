<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">计算机体系结构的三层次分工：指令集、组成与实现</title>
  <desc id="desc">自上而下三个圆角矩形。第一层「体系结构 · 指令集 ISA」用红色边框：程序员与编译器可见的契约，含指令格式、寄存器堆、寻址方式、数据类型、异常与虚存模型，实例为 RISC-V、x86、ARM。第二层「组成 · 微架构 Organization」用青色边框：满足契约的内部设计，含流水线深度、缓存容量、指令级并行与动态调度，同一 ISA 可有多种组成。第三层「实现 · 硬件 Implementation」用墨色边框：物理落地，含门电路、晶体管、版图与工艺节点，同一组成也可有多种实现。层间以向下箭头连接，分别标注「决定如何满足契约」与「决定如何物理落地」。图底部说明：软件兼容性由最上层的契约保证，程序只依赖 ISA，不依赖组成与实现。</desc>

  <rect x="0" y="0" width="720" height="500" fill="#faf9f5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 第一层：体系结构 / 指令集 ISA -->
  <rect x="80" y="46" width="560" height="116" rx="12" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <text x="108" y="74" font-size="18" font-weight="bold" fill="#c0392b">体系结构 · 指令集 ISA</text>
  <text x="108" y="100" font-size="14" fill="#333">程序员与编译器可见的「契约」：指令格式、寄存器堆、</text>
  <text x="108" y="122" font-size="14" fill="#333">寻址方式、数据类型、异常与虚存模型。稳定不变。</text>
  <text x="108" y="146" font-size="13" fill="#777">实例：RISC-V · x86 · ARM</text>

  <!-- 第二层：组成 / 微架构 -->
  <rect x="80" y="220" width="560" height="116" rx="12" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="108" y="248" font-size="18" font-weight="bold" fill="#1f6f8b">组成 · 微架构 Organization</text>
  <text x="108" y="274" font-size="14" fill="#333">满足契约的内部设计：流水线深度、缓存容量与层次、</text>
  <text x="108" y="296" font-size="14" fill="#333">指令级并行与动态调度机制。同一 ISA 可有多种组成。</text>
  <text x="108" y="320" font-size="13" fill="#777">实例：Intel Core 微架构 · Cortex-A78 · RISC-V Rocket</text>

  <!-- 第三层：实现 / 硬件 -->
  <rect x="80" y="394" width="560" height="86" rx="12" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="108" y="422" font-size="18" font-weight="bold" fill="#333">实现 · 硬件 Implementation</text>
  <text x="108" y="448" font-size="14" fill="#333">物理落地：门电路、晶体管、版图与工艺节点（如 3 nm）。</text>
  <text x="108" y="468" font-size="13" fill="#777">同一组成也可有多种实现，性能与功耗随工艺而变。</text>

  <!-- 层间箭头 -->
  <line x1="360" y1="162" x2="360" y2="220" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="336" x2="360" y2="394" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 箭头旁标注 -->
  <text x="376" y="196" font-size="13" fill="#777">决定如何满足契约</text>
  <text x="376" y="370" font-size="13" fill="#777">决定如何物理落地</text>

  <!-- 底部说明 -->
  <text x="360" y="492" font-size="13" fill="#777" text-anchor="middle">软件兼容性由最上层的「契约」保证 —— 程序只依赖 ISA，不依赖组成与实现</text>
</svg>
