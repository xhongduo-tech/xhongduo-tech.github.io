<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="sans-serif">
  <title>迎风—顺风航线示意图</title>
  <desc>一条帆船赛航线的俯视图：下端起航线、上风1标、偏置标与下风门标，风向自下而上，船队迎风抢风上行、顺风返回。</desc>
  <rect x="0" y="0" width="420" height="560" fill="#faf9f5"/>
  <!-- 风向箭头：自下而上 -->
  <g stroke="#1f6f8b" stroke-width="3" fill="#1f6f8b">
    <line x1="40" y1="520" x2="40" y2="40"/>
    <polygon points="40,28 30,52 50,52"/>
  </g>
  <text x="16" y="290" fill="#1f6f8b" font-size="15" transform="rotate(-90 16 290)">风向（自下而上）</text>

  <!-- 上风 1 标 -->
  <circle cx="200" cy="80" r="12" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <text x="222" y="86" fill="#333" font-size="15">上风 1 标</text>

  <!-- 偏置标 -->
  <circle cx="300" cy="120" r="10" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <text x="318" y="126" fill="#333" font-size="15">偏置标</text>

  <!-- 下风门标（两个） -->
  <circle cx="150" cy="470" r="10" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <circle cx="250" cy="470" r="10" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="505" fill="#333" font-size="15">下风门标（从两标之间穿过）</text>

  <!-- 起航线 -->
  <line x1="80" y1="520" x2="340" y2="520" stroke="#333" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="88" y="543" fill="#333" font-size="15">起航线（起点船—起点标）</text>

  <!-- 终点线（靠近门标上方） -->
  <line x1="120" y1="440" x2="300" y2="440" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="306" y="446" fill="#333" font-size="14">终点线</text>

  <!-- 迎风航段（Z 字形） -->
  <path d="M 200 500 L 130 400 L 170 330 L 120 240 L 165 170 L 200 80"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="205" y="410" fill="#c0392b" font-size="14">迎风抢风（Z 字形换舷）</text>

  <!-- 顺风航段 -->
  <path d="M 300 120 L 250 300 L 200 470"
        fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6,4" stroke-linejoin="round"/>
  <text x="302" y="290" fill="#1f6f8b" font-size="14">顺风返回</text>
</svg>
