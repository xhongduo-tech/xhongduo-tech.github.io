<svg viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Transformer 编码器—解码器结构图</title>
  <desc>Transformer 左侧编码器由多头自注意力和前馈网络堆叠，右侧解码器加入掩码自注意力和交叉注意力，输出经线性层与 Softmax 得到概率</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#faf9f5"/>

  <!-- 列标题 -->
  <text x="195" y="30" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">编码器 Encoder</text>
  <text x="605" y="30" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">解码器 Decoder</text>

  <!-- 输入标签与箭头 -->
  <text x="195" y="70" text-anchor="middle" font-size="14" fill="#333">编码器输入（源文）</text>
  <text x="195" y="86" text-anchor="middle" font-size="13" fill="#888">嵌入 + 位置编码</text>
  <line x1="195" y1="94" x2="195" y2="126" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="605" y="70" text-anchor="middle" font-size="14" fill="#333">解码器输入（译文）</text>
  <text x="605" y="86" text-anchor="middle" font-size="13" fill="#888">嵌入 + 位置编码</text>
  <line x1="605" y1="94" x2="605" y2="126" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 编码器盒子 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="70"  y="130" width="250" height="46" rx="8" fill="#eef4f6"/>
    <rect x="70"  y="196" width="250" height="40" rx="8" fill="#fff"/>
    <rect x="70"  y="256" width="250" height="46" rx="8" fill="#eef4f6"/>
    <rect x="70"  y="322" width="250" height="40" rx="8" fill="#fff"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="195" y="158">多头自注意力</text>
    <text x="195" y="220">加 与 层归一化</text>
    <text x="195" y="284">前馈网络</text>
    <text x="195" y="346">加 与 层归一化</text>
  </g>
  <text x="195" y="398" text-anchor="middle" font-size="13" fill="#888">编码器层（重复 N 次）</text>

  <!-- 编码器内部箭头 -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="195" y1="176" x2="195" y2="196" marker-end="url(#arrow)"/>
    <line x1="195" y1="236" x2="195" y2="256" marker-end="url(#arrow)"/>
    <line x1="195" y1="302" x2="195" y2="322" marker-end="url(#arrow)"/>
  </g>

  <!-- 解码器盒子 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="470" y="130" width="270" height="46" rx="8" fill="#fdf3f2"/>
    <rect x="470" y="196" width="270" height="40" rx="8" fill="#fff"/>
    <rect x="470" y="256" width="270" height="46" rx="8" fill="#eef4f6"/>
    <rect x="470" y="322" width="270" height="40" rx="8" fill="#fff"/>
    <rect x="470" y="382" width="270" height="46" rx="8" fill="#eef4f6"/>
    <rect x="470" y="448" width="270" height="40" rx="8" fill="#fff"/>
    <rect x="470" y="508" width="270" height="44" rx="8" fill="#f5e8e6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="605" y="158">掩码多头自注意力</text>
    <text x="605" y="220">加 与 层归一化</text>
    <text x="605" y="284">交叉多头注意力</text>
    <text x="605" y="346">加 与 层归一化</text>
    <text x="605" y="410">前馈网络</text>
    <text x="605" y="472">加 与 层归一化</text>
    <text x="605" y="534">线性 + Softmax</text>
  </g>
  <text x="605" y="584" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">输出概率（下一个词）</text>

  <!-- 解码器内部箭头 -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="605" y1="176" x2="605" y2="196" marker-end="url(#arrow)"/>
    <line x1="605" y1="236" x2="605" y2="256" marker-end="url(#arrow)"/>
    <line x1="605" y1="302" x2="605" y2="322" marker-end="url(#arrow)"/>
    <line x1="605" y1="362" x2="605" y2="382" marker-end="url(#arrow)"/>
    <line x1="605" y1="428" x2="605" y2="448" marker-end="url(#arrow)"/>
    <line x1="605" y1="488" x2="605" y2="508" marker-end="url(#arrow)"/>
  </g>

  <!-- 编码器输出 → 交叉注意力 K、V -->
  <g stroke="#c0392b" stroke-width="1.6">
    <line x1="320" y1="342" x2="320" y2="279" />
    <line x1="320" y1="279" x2="470" y2="279" marker-end="url(#arrow)"/>
  </g>
  <text x="395" y="264" text-anchor="middle" font-size="14" fill="#c0392b">K、V</text>
  <text x="395" y="250" text-anchor="middle" font-size="13" fill="#888">来自编码器输出</text>
</svg>
