<svg viewBox="0 0 420 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>词对齐矩阵示例</title>
  <desc>英语句子 the house is small 与德语 das Haus ist klein 之间的对齐矩阵，黑色圆点表示对齐位置</desc>
  <rect width="420" height="270" fill="#fff"/>
  <text x="210" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">词对齐矩阵：the house is small ↔ das Haus ist klein</text>

  <!-- 列标签（英语 e） -->
  <text x="82"  y="52" text-anchor="middle" font-size="14" fill="#1f6f8b">NULL</text>
  <text x="140" y="52" text-anchor="middle" font-size="14" fill="#333">the</text>
  <text x="198" y="52" text-anchor="middle" font-size="14" fill="#333">house</text>
  <text x="256" y="52" text-anchor="middle" font-size="14" fill="#333">is</text>
  <text x="314" y="52" text-anchor="middle" font-size="14" fill="#333">small</text>

  <!-- 行标签（德语 f） -->
  <text x="66" y="96"  text-anchor="end" font-size="14" fill="#333">das</text>
  <text x="66" y="140" text-anchor="end" font-size="14" fill="#333">Haus</text>
  <text x="66" y="184" text-anchor="end" font-size="14" fill="#333">ist</text>
  <text x="66" y="228" text-anchor="end" font-size="14" fill="#333">klein</text>

  <!-- 网格：5 列 × 4 行，起点 (78,60) -->
  <g stroke="#ccc" stroke-width="1">
    <line x1="78" y1="60" x2="348" y2="60"/>
    <line x1="78" y1="104" x2="348" y2="104"/>
    <line x1="78" y1="148" x2="348" y2="148"/>
    <line x1="78" y1="192" x2="348" y2="192"/>
    <line x1="78" y1="236" x2="348" y2="236"/>
    <line x1="78" y1="60" x2="78" y2="236"/>
    <line x1="136" y1="60" x2="136" y2="236"/>
    <line x1="194" y1="60" x2="194" y2="236"/>
    <line x1="252" y1="60" x2="252" y2="236"/>
    <line x1="310" y1="60" x2="310" y2="236"/>
    <line x1="348" y1="60" x2="348" y2="236"/>
  </g>

  <!-- 对齐单元：黑点 -->
  <g fill="#333">
    <circle cx="140" cy="82"  r="7"/>
    <circle cx="198" cy="126" r="7"/>
    <circle cx="256" cy="170" r="7"/>
    <circle cx="314" cy="214" r="7"/>
  </g>

  <!-- 对齐箭头说明 -->
  <g stroke="#c0392b" stroke-width="1.4">
    <line x1="372" y1="82" x2="390" y2="82"/>
    <line x1="372" y1="126" x2="390" y2="126"/>
    <line x1="372" y1="170" x2="390" y2="170"/>
    <line x1="372" y1="214" x2="390" y2="214"/>
  </g>
  <text x="382" y="60" text-anchor="middle" font-size="13" fill="#c0392b">对齐</text>
  <text x="382" y="246" text-anchor="middle" font-size="13" fill="#333">每行</text>
  <text x="382" y="262" text-anchor="middle" font-size="13" fill="#333">恰一列</text>

  <text x="210" y="256" text-anchor="middle" font-size="13" fill="#888">一译一，行列都对齐</text>
</svg>
