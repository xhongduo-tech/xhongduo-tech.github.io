<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
<title>四大渔具原理示意</title>
<desc>拖网扫过海底、围网收底纲圈住鱼群、刺网以网目卡住鱼鳃、延绳钓在母线上挂饵钩垂钓，四种渔具的原理与作业水层对比。</desc>
<rect x="0" y="0" width="880" height="430" fill="#faf9f5"/>
<text x="440" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">四大渔具原理示意</text>
<!-- 水面线与海底 -->
<line x1="0" y1="85" x2="880" y2="85" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="865" y="78" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f6f8b">海面</text>
<rect x="0" y="320" width="880" height="10" fill="#d9c9a3"/>
<text x="865" y="345" text-anchor="end" font-family="sans-serif" font-size="13" fill="#8a7445">海底</text>

<!-- 第1栏：底层拖网 -->
<g transform="translate(20,0)">
  <text x="95" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">底层拖网</text>
  <polygon points="30,80 90,78 100,84 80,86 30,86" fill="#1f6f8b"/>
  <rect x="88" y="80" width="14" height="5" fill="#333"/>
  <line x1="45" y1="84" x2="40" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="94" y1="84" x2="150" y2="210" stroke="#333" stroke-width="1.5"/>
  <polygon points="20,200 40,220 60,240 90,240 150,240 160,220 150,200" fill="#cfe6ee" stroke="#1f6f8b" stroke-width="1.5"/>
  <rect x="120" y="240" width="34" height="18" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <ellipse cx="55" cy="305" rx="14" ry="6" fill="#d97757"/>
  <ellipse cx="110" cy="310" rx="12" ry="5" fill="#d97757"/>
  <text x="95" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">网板撑口，网囊收鱼，</text>
  <text x="95" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">扫过海底</text>
</g>

<!-- 第2栏：围网 -->
<g transform="translate(230,0)">
  <text x="95" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">围网</text>
  <polygon points="70,80 120,78 130,84 110,86 70,86" fill="#1f6f8b"/>
  <path d="M 30,86 Q 95,100 160,86 L 160,200 Q 160,240 95,240 Q 30,240 30,200 Z" fill="#cfe6ee" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 95,240 Q 60,280 40,315" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="135" y="330" font-family="sans-serif" font-size="13" fill="#c0392b">收底纲</text>
  <g fill="#d97757">
    <ellipse cx="75" cy="150" rx="10" ry="5" transform="rotate(-10 75 150)"/>
    <ellipse cx="105" cy="170" rx="10" ry="5" transform="rotate(10 105 170)"/>
    <ellipse cx="90" cy="195" rx="10" ry="5"/>
  </g>
  <text x="95" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">包围鱼群，收紧底纲，</text>
  <text x="95" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">一网打尽集群</text>
</g>

<!-- 第3栏：刺网 -->
<g transform="translate(440,0)">
  <text x="95" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">刺网</text>
  <line x1="30" y1="86" x2="160" y2="86" stroke="#333" stroke-width="2"/>
  <line x1="30" y1="316" x2="160" y2="316" stroke="#333" stroke-width="2"/>
  <g stroke="#1f6f8b" stroke-width="1">
    <line x1="30" y1="86" x2="30" y2="316"/>
    <line x1="95" y1="86" x2="95" y2="316"/>
    <line x1="160" y1="86" x2="160" y2="316"/>
    <line x1="30" y1="86" x2="160" y2="316"/>
    <line x1="30" y1="180" x2="160" y2="180"/>
    <line x1="30" y1="220" x2="160" y2="220"/>
    <line x1="30" y1="316" x2="160" y2="86"/>
    <line x1="95" y1="86" x2="160" y2="180"/>
    <line x1="30" y1="180" x2="95" y2="316"/>
    <line x1="160" y1="180" x2="30" y2="220"/>
    <line x1="160" y1="220" x2="30" y2="316"/>
  </g>
  <g>
    <ellipse cx="95" cy="200" rx="16" ry="8" fill="#c0392b"/>
    <polygon points="111,200 124,204 111,208" fill="#c0392b"/>
    <circle cx="95" cy="196" r="3" fill="#333"/>
  </g>
  <text x="60" y="345" font-family="sans-serif" font-size="13" fill="#333">网目卡鳃</text>
  <text x="95" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">竖立网帘，鱼撞网后</text>
  <text x="95" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">被鳃盖挂住</text>
</g>

<!-- 第4栏：延绳钓 -->
<g transform="translate(650,0)">
  <text x="95" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">延绳钓</text>
  <line x1="20" y1="86" x2="180" y2="86" stroke="#333" stroke-width="2"/>
  <g>
    <circle cx="30" cy="80" r="6" fill="#1f6f8b"/>
    <circle cx="80" cy="80" r="6" fill="#1f6f8b"/>
    <circle cx="130" cy="80" r="6" fill="#1f6f8b"/>
    <circle cx="175" cy="80" r="6" fill="#1f6f8b"/>
  </g>
  <line x1="55" y1="86" x2="55" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="105" y1="86" x2="105" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="155" y1="86" x2="155" y2="210" stroke="#333" stroke-width="1.5"/>
  <path d="M 55,200 q 6,8 0,14 q -6,-6 0,-14" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 105,180 q 6,8 0,14 q -6,-6 0,-14" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 155,210 q 6,8 0,14 q -6,-6 0,-14" fill="none" stroke="#c0392b" stroke-width="2"/>
  <ellipse cx="55" cy="230" rx="12" ry="6" fill="#d97757"/>
  <ellipse cx="155" cy="245" rx="12" ry="6" fill="#d97757"/>
  <text x="95" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">母线挂浮子，支线带饵钩，</text>
  <text x="95" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">守株待兔</text>
</g>

<line x1="220" y1="70" x2="220" y2="355" stroke="#d8d0c0" stroke-width="1"/>
<line x1="440" y1="70" x2="440" y2="355" stroke="#d8d0c0" stroke-width="1"/>
<line x1="660" y1="70" x2="660" y2="355" stroke="#d8d0c0" stroke-width="1"/>
</svg>
