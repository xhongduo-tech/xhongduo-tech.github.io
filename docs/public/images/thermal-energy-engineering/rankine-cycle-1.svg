<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="sans-serif">
  <title>朗肯循环温熵图（T-s 图）</title>
  <desc>水蒸气朗肯循环在温熵图上的四个基本过程：等熵膨胀、定压凝结、等熵压缩、定压加热，循环面积即净功。</desc>
  <rect width="640" height="460" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="70" y1="400" x2="600" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="400" x2="70" y2="50" stroke="#333" stroke-width="2"/>
  <text x="585" y="424" font-size="15" fill="#333">s（熵）</text>
  <text x="38" y="60" font-size="15" fill="#333">T（温度）</text>
  <!-- 饱和线：左为饱和水线，右为干饱和蒸汽线，汇于临界点 -->
  <path d="M110,382 C160,300 260,200 430,120" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M110,382 C240,330 360,220 430,120" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="300" font-size="13" fill="#1f6f8b">饱和水线 x=0</text>
  <text x="480" y="210" font-size="13" fill="#1f6f8b">干饱和线 x=1</text>
  <text x="430" y="105" font-size="13" fill="#333">临界点</text>
  <!-- 朗肯循环 -->
  <!-- 1-2 等熵膨胀（汽轮机） -->
  <line x1="470" y1="300" x2="470" y2="140" stroke="#c0392b" stroke-width="3"/>
  <!-- 2-3 定压凝结 -->
  <line x1="470" y1="140" x2="240" y2="140" stroke="#c0392b" stroke-width="3"/>
  <!-- 3-4 等熵压缩（水泵） -->
  <line x1="240" y1="140" x2="240" y2="165" stroke="#c0392b" stroke-width="3"/>
  <!-- 4-1 定压加热（锅炉） -->
  <path d="M240,165 C300,170 340,180 360,205 C380,230 430,280 470,300" fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- 状态点标注 -->
  <circle cx="470" cy="300" r="4" fill="#c0392b"/>
  <text x="482" y="296" font-size="15" fill="#333" font-weight="bold">1</text>
  <circle cx="470" cy="140" r="4" fill="#c0392b"/>
  <text x="482" y="140" font-size="15" fill="#333" font-weight="bold">2</text>
  <circle cx="240" cy="140" r="4" fill="#c0392b"/>
  <text x="228" y="136" font-size="15" fill="#333" font-weight="bold">3</text>
  <circle cx="240" cy="165" r="4" fill="#c0392b"/>
  <text x="228" y="183" font-size="15" fill="#333" font-weight="bold">4</text>
  <!-- 过程说明 -->
  <text x="500" y="215" font-size="13" fill="#c0392b">1-2 等熵膨胀</text>
  <text x="330" y="160" font-size="13" fill="#c0392b">2-3 定压凝结</text>
  <text x="190" y="170" font-size="13" fill="#c0392b">3-4 压缩</text>
  <text x="250" y="360" font-size="13" fill="#c0392b">4-1 定压加热</text>
  <text x="320" y="300" font-size="14" fill="#333">循环包围面积 = 净功 w_net</text>
</svg>
