<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">最优停止的停止区域与延续区域</title>
<desc id="desc">在时间-状态平面上，上半部分为停止区域（立即行权），下半部分为延续区域（继续等待），分界线即最优停止边界，价值函数在边界上满足连续贴合的平滑条件。</desc>
<rect width="800" height="440" fill="#faf9f5"/>
<text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">最优停止：何时行权——延续区域与停止区域</text>
<!-- time axis -->
<line x1="90" y1="360" x2="720" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="722" y="382" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">时间 t</text>
<text x="70" y="130" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">状态 x</text>
<!-- stopping region (top) shaded red -->
<path d="M90,80 L680,80 C640,140 560,180 480,190 C400,200 320,205 240,208 C170,210 120,208 90,205 Z" fill="#c0392b" opacity="0.18"/>
<!-- continuation region (bottom) shaded teal -->
<path d="M90,205 L240,208 C320,205 400,200 480,190 C560,180 640,140 680,80 L680,360 L90,360 Z" fill="#1f6f8b" opacity="0.12"/>
<!-- boundary line -->
<path d="M90,205 C170,210 240,208 320,205 400,200 480,190 560,180 640,140 660,110 680,80" fill="none" stroke="#333" stroke-width="2.5"/>
<text x="640" y="120" font-family="sans-serif" font-size="14" fill="#333">最优停止边界（平滑贴合）</text>
<!-- sample path with stopping dot -->
<polyline points="140,330 200,280 260,300 320,240 380,260 440,215 500,225 560,185 600,178 620,150 650,120"
fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6,4"/>
<circle cx="650" cy="120" r="7" fill="#c0392b"/>
<text x="650" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">最优停止时刻 τ*</text>
<text x="410" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">停止区域：立即行权 g(x)</text>
<text x="420" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">延续区域：继续等待，价值由 Snell 包络 / HJB 方程决定</text>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
</defs>
</svg>
