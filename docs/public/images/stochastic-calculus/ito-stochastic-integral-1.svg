<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Itô 和取左端点：对同一布朗轨道，取点位置决定和式极限</title>
<desc id="desc">一段布朗运动锯齿轨道上，画出取左端点的红色矩形（Itô 和）与取右端点的青色采样点，说明左端点规则保证因果性并让随机积分成为鞅。</desc>
<rect width="800" height="440" fill="#faf9f5"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
</defs>
<text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">Itô 和取左端点，黎曼和取任意点——同一轨道，两种极限</text>
<line x1="70" y1="360" x2="740" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="742" y="382" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">t</text>
<text x="58" y="366" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">B(t)</text>
<polyline points="100,300 150,270 200,290 250,235 300,265 350,220 400,250 450,215 500,245 550,225 600,260 650,240 700,255" fill="none" stroke="#333" stroke-width="2.2"/>
<g stroke="#999" stroke-width="1" stroke-dasharray="3,3">
<line x1="100" y1="300" x2="100" y2="360"/>
<line x1="200" y1="290" x2="200" y2="360"/>
<line x1="300" y1="265" x2="300" y2="360"/>
<line x1="400" y1="250" x2="400" y2="360"/>
<line x1="500" y1="245" x2="500" y2="360"/>
<line x1="600" y1="260" x2="600" y2="360"/>
<line x1="700" y1="255" x2="700" y2="360"/>
</g>
<rect x="100" y="300" width="100" height="60" fill="#c0392b" opacity="0.16"/>
<rect x="200" y="290" width="100" height="70" fill="#c0392b" opacity="0.16"/>
<rect x="300" y="265" width="100" height="95" fill="#c0392b" opacity="0.16"/>
<rect x="400" y="250" width="100" height="110" fill="#c0392b" opacity="0.16"/>
<rect x="500" y="245" width="100" height="115" fill="#c0392b" opacity="0.16"/>
<rect x="600" y="260" width="100" height="100" fill="#c0392b" opacity="0.16"/>
<g fill="#c0392b">
<circle cx="100" cy="300" r="5"/>
<circle cx="200" cy="290" r="5"/>
<circle cx="300" cy="265" r="5"/>
<circle cx="400" cy="250" r="5"/>
<circle cx="500" cy="245" r="5"/>
<circle cx="600" cy="260" r="5"/>
<circle cx="700" cy="255" r="5"/>
</g>
<g fill="#1f6f8b">
<circle cx="150" cy="270" r="4"/>
<circle cx="250" cy="235" r="4"/>
<circle cx="350" cy="220" r="4"/>
<circle cx="450" cy="215" r="4"/>
<circle cx="550" cy="225" r="4"/>
<circle cx="650" cy="240" r="4"/>
</g>
<text x="400" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">红色矩形：取左端点 f(t_i)ΔB_i（Itô 和）</text>
<text x="400" y="432" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">青色圆点：若改取右端点 f(t_{i+1})，和式极限将不同</text>
</svg>
