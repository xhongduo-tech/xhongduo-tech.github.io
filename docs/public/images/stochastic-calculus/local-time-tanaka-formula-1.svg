<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">局部时的直观：布朗轨道在某一高度附近盘桓的时间累积成局部时</title>
<desc id="desc">一段布朗运动轨道在零水平线附近反复穿越，右侧画出停留时间的直方图（occupation profile），说明局部时是该高度的占据密度。</desc>
<rect width="800" height="440" fill="#faf9f5"/>
<text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">局部时：轨道在某一高度「盘桓」的总时间，作为高度的密度</text>
<!-- zero level -->
<line x1="60" y1="230" x2="500" y2="230" stroke="#c0392b" stroke-width="2"/>
<text x="506" y="234" font-family="sans-serif" font-size="14" fill="#c0392b">a = 0（零水平）</text>
<!-- Brownian path oscillating around zero -->
<polyline points="70,230 95,180 120,260 150,150 180,300 210,200 240,110 270,340 300,190 330,250 360,160 390,300 420,210 450,250 480,230"
fill="none" stroke="#333" stroke-width="2.2"/>
<!-- level lines a = +80, -80 -->
<g stroke="#999" stroke-width="1" stroke-dasharray="3,3">
<line x1="60" y1="150" x2="500" y2="150"/>
<line x1="60" y1="310" x2="500" y2="310"/>
</g>
<text x="56" y="154" text-anchor="end" font-family="sans-serif" font-size="13" fill="#666">a</text>
<text x="56" y="314" text-anchor="end" font-family="sans-serif" font-size="13" fill="#666">-a</text>
<!-- occupation histogram on right -->
<text x="660" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">占据时间直方图</text>
<g stroke="#1f6f8b" stroke-width="6">
<line x1="610" y1="330" x2="610" y2="180"/>
<line x1="620" y1="310" x2="620" y2="150"/>
<line x1="630" y1="290" x2="630" y2="150"/>
<line x1="640" y1="270" x2="640" y2="200"/>
<line x1="650" y1="250" x2="650" y2="150"/>
<line x1="660" y1="230" x2="660" y2="180"/>
<line x1="670" y1="230" x2="670" y2="140"/>
<line x1="680" y1="230" x2="680" y2="170"/>
<line x1="690" y1="230" x2="690" y2="150"/>
<line x1="700" y1="230" x2="700" y2="190"/>
</g>
<line x1="600" y1="330" x2="720" y2="330" stroke="#333" stroke-width="1.5"/>
<text x="600" y="352" font-family="sans-serif" font-size="14" fill="#333">低</text>
<text x="712" y="352" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">高（占据时间长）</text>
<text x="660" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">停留越久的高度，局部时越高</text>
<text x="280" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">轨道反复穿越零水平——在 a=0 处的局部时尤为丰厚</text>
</svg>
