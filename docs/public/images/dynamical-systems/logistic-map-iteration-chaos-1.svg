<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="sans-serif" font-size="14">
  <title>logistic 映射的分岔图</title>
  <desc>横轴为参数 r，纵轴为长期迭代后的 x 值。r 小于 3 时收敛到单一稳定值；r 增大后依次出现周期 2、周期 4 的倍周期分岔；r 约为 3.57 之后进入混沌区，同时残留周期窗口。</desc>
  <rect width="460" height="330" fill="#faf9f5"/>
  <line x1="40" y1="300" x2="445" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="305" stroke="#333" stroke-width="1.5"/>
  <text x="432" y="318" fill="#333">r</text>
  <text x="16" y="28" fill="#333">x</text>
  <text x="34" y="314" fill="#888">1.0</text>
  <text x="218" y="314" fill="#888">2.5</text>
  <text x="352" y="314" fill="#888">3.0</text>
  <text x="422" y="314" fill="#888">4.0</text>
  <text x="52" y="60" fill="#888">1.0</text>
  <!-- 周期1（稳定值） -->
  <path d="M72,75 Q200,75 300,75 L300,75" fill="none" stroke="#1f6f8b" stroke-width="2.6"/>
  <!-- 周期2 -->
  <path d="M300,75 L300,60" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M300,60 Q340,52 348,60 L348,60" fill="none" stroke="#1f6f8b" stroke-width="2.4"/>
  <path d="M300,90 Q340,98 348,90 L348,90" fill="none" stroke="#1f6f8b" stroke-width="2.4"/>
  <!-- 倍周期瀑布 -->
  <path d="M348,60 L360,52 M348,90 L360,98" stroke="#c0392b" stroke-width="1.6"/>
  <path d="M360,52 Q374,48 378,52 M360,98 Q374,102 378,98" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 混沌点云 -->
  <g fill="#c0392b" opacity="0.85">
    <circle cx="392" cy="42" r="1.1"/><circle cx="393" cy="78" r="1.1"/><circle cx="394" cy="63" r="1.1"/><circle cx="395" cy="97" r="1.1"/><circle cx="396" cy="55" r="1.1"/><circle cx="397" cy="84" r="1.1"/><circle cx="398" cy="71" r="1.1"/><circle cx="399" cy="110" r="1.1"/><circle cx="400" cy="48" r="1.1"/><circle cx="401" cy="90" r="1.1"/><circle cx="402" cy="33" r="1.1"/><circle cx="403" cy="66" r="1.1"/><circle cx="404" cy="58" r="1.1"/><circle cx="405" cy="102" r="1.1"/><circle cx="406" cy="45" r="1.1"/><circle cx="407" cy="118" r="1.1"/><circle cx="408" cy="74" r="1.1"/><circle cx="409" cy="53" r="1.1"/><circle cx="410" cy="88" r="1.1"/><circle cx="411" cy="38" r="1.1"/><circle cx="412" cy="95" r="1.1"/><circle cx="413" cy="69" r="1.1"/><circle cx="414" cy="128" r="1.1"/><circle cx="415" cy="80" r="1.1"/><circle cx="416" cy="60" r="1.1"/><circle cx="417" cy="49" r="1.1"/><circle cx="418" cy="104" r="1.1"/><circle cx="419" cy="42" r="1.1"/><circle cx="420" cy="86" r="1.1"/><circle cx="421" cy="72" r="1.1"/><circle cx="422" cy="56" r="1.1"/><circle cx="423" cy="134" r="1.1"/><circle cx="424" cy="92" r="1.1"/><circle cx="425" cy="36" r="1.1"/><circle cx="426" cy="64" r="1.1"/><circle cx="427" cy="108" r="1.1"/><circle cx="428" cy="75" r="1.1"/><circle cx="429" cy="50" r="1.1"/><circle cx="430" cy="96" r="1.1"/><circle cx="431" cy="45" r="1.1"/><circle cx="432" cy="83" r="1.1"/><circle cx="433" cy="140" r="1.1"/><circle cx="434" cy="61" r="1.1"/><circle cx="435" cy="90" r="1.1"/><circle cx="436" cy="55" r="1.1"/><circle cx="437" cy="70" r="1.1"/><circle cx="438" cy="99" r="1.1"/><circle cx="439" cy="39" r="1.1"/><circle cx="440" cy="112" r="1.1"/><circle cx="441" cy="58" r="1.1"/><circle cx="442" cy="86" r="1.1"/>
  </g>
  <circle cx="300" cy="75" r="3.5" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <circle cx="348" cy="60" r="3" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <circle cx="348" cy="90" r="3" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <text x="222" y="52" fill="#1f6f8b">周期 1</text>
  <text x="282" y="30" fill="#c0392b">周期 2</text>
  <text x="352" y="26" fill="#1f6f8b">倍周期瀑布</text>
  <text x="386" y="158" fill="#c0392b">混沌区</text>
  <text x="200" y="150" fill="#888">倍周期分岔点</text>
  <path d="M200,144 L260,80" stroke="#888" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="60" y="166" fill="#333">不动点稳定值</text>
</svg>
