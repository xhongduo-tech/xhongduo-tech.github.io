<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif">
  <title>图灵机的结构</title>
  <desc>图灵机由一条被读写头扫描的无限纸带和一个带状态寄存器的控制单元组成；转移函数根据当前状态与读到的符号决定写入、移动与下一状态。</desc>
  <rect x="0" y="0" width="640" height="320" fill="#faf9f5"/>

  <!-- tape cells -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="60" y="30" width="64" height="48" fill="#fff"/>
    <rect x="124" y="30" width="64" height="48" fill="#fff"/>
    <rect x="188" y="30" width="64" height="48" fill="#fff"/>
    <rect x="252" y="30" width="64" height="48" fill="#fff"/>
    <rect x="316" y="30" width="64" height="48" fill="#f3e8e2" stroke="#c0392b" stroke-width="2"/>
    <rect x="380" y="30" width="64" height="48" fill="#fff"/>
    <rect x="444" y="30" width="64" height="48" fill="#fff"/>
  </g>
  <text x="92" y="60" font-size="24" text-anchor="middle" fill="#333">1</text>
  <text x="156" y="60" font-size="24" text-anchor="middle" fill="#333">0</text>
  <text x="220" y="60" font-size="24" text-anchor="middle" fill="#333">1</text>
  <text x="284" y="60" font-size="24" text-anchor="middle" fill="#333">1</text>
  <text x="348" y="60" font-size="24" text-anchor="middle" fill="#c0392b">0</text>
  <text x="412" y="60" font-size="24" text-anchor="middle" fill="#333">□</text>
  <text x="476" y="60" font-size="24" text-anchor="middle" fill="#333">□</text>
  <text x="80" y="18" font-size="14" fill="#666">…</text>
  <text x="512" y="18" font-size="14" fill="#666">…</text>
  <text x="335" y="95" font-size="13" text-anchor="middle" fill="#c0392b">读写头正在读「0」</text>

  <!-- head arrow -->
  <polygon points="348,130 336,148 360,148" fill="#1f6f8b"/>
  <line x1="348" y1="130" x2="348" y2="148" stroke="#1f6f8b" stroke-width="2"/>

  <!-- control unit -->
  <rect x="196" y="150" width="304" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="348" y="176" font-size="16" text-anchor="middle" fill="#333"><tspan font-weight="bold">控制单元</tspan>（状态寄存器）</text>
  <rect x="240" y="196" width="80" height="40" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="280" y="221" font-size="16" text-anchor="middle" fill="#1f6f8b">q_i</text>
  <text x="344" y="210" font-size="14" fill="#333">读符号 → 写符号</text>
  <text x="344" y="228" font-size="14" fill="#333">左移 / 右移 / 停</text>
  <text x="466" y="221" font-size="14" text-anchor="middle" fill="#666">下一状态</text>

  <!-- transition label -->
  <line x1="348" y1="148" x2="280" y2="196" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="140" font-size="14" fill="#c0392b">0 → 1, R</text>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <text x="40" y="290">规则示意：δ(q_i, 0) = (q_j, 1, R)</text>
    <text x="40" y="310">即：状态 q_i 读到 0，写入 1、右移一格、进入状态 q_j</text>
  </g>
</svg>
