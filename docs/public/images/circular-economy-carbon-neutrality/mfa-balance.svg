<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <title>物质流分析（MFA）质量平衡示意图</title>
  <desc>一个系统边界框，左侧流入箭头，右侧流出箭头分为产品、排放与废弃物，框内为存量，底部标注质量守恒方程。</desc>
  <rect x="0" y="0" width="800" height="450" fill="#faf9f5"/>
  <rect x="250" y="90" width="320" height="270" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <text x="410" y="120" text-anchor="middle" font-size="20" fill="#1f6f8b" font-weight="bold">系统边界</text>
  <text x="410" y="150" text-anchor="middle" font-size="16" fill="#333">存量 S</text>
  <rect x="340" y="175" width="140" height="70" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="410" y="205" text-anchor="middle" font-size="15" fill="#333">在库物质</text>
  <text x="410" y="228" text-anchor="middle" font-size="15" fill="#333">（建筑、车辆、设备）</text>
  <path d="M 60 200 L 240 200" stroke="#1f6f8b" stroke-width="6" marker-end="url(#arrowB)"/>
  <text x="150" y="180" text-anchor="middle" font-size="17" fill="#1f6f8b" font-weight="bold">流入 ṁ_in</text>
  <text x="150" y="240" text-anchor="middle" font-size="14" fill="#333">原生料开采 · 进口</text>
  <path d="M 570 140 L 740 140" stroke="#333" stroke-width="5" marker-end="url(#arrowK)"/>
  <text x="655" y="125" text-anchor="middle" font-size="15" fill="#333">产品出口</text>
  <path d="M 570 230 L 740 230" stroke="#c0392b" stroke-width="5" marker-end="url(#arrowR)"/>
  <text x="655" y="215" text-anchor="middle" font-size="15" fill="#c0392b">排放与废弃</text>
  <text x="655" y="250" text-anchor="middle" font-size="14" fill="#333">流出 ṁ_out</text>
  <path d="M 410 335 L 410 390 L 150 390" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <text x="150" y="415" text-anchor="middle" font-size="15" fill="#1f6f8b">回环：回收利用（次级料回到流入端）</text>
  <text x="410" y="440" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">dS / dt = ṁ_in − ṁ_out</text>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
