<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
  <title id="title">自动驾驶传感器套件整车布局俯视示意图</title>
  <desc id="desc">一辆汽车俯视图，标注前视相机、环视/侧视相机、主 LiDAR、毫米波雷达、角雷达、超声波雷达与 IMU 的安装位置，底部配图例。</desc>

  <rect x="0" y="0" width="760" height="500" fill="#faf9f5" rx="12"/>

  <text x="380" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">自动驾驶传感器套件 · 整车布局（俯视示意）</text>

  <!-- 车头 / 车尾 标注 -->
  <text x="260" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">车头</text>
  <text x="562" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">车尾</text>

  <!-- 车身（俯视剪影） -->
  <rect x="260" y="170" width="60" height="120" rx="22" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <rect x="320" y="182" width="58" height="96" rx="8" fill="#cfe0e6"/>
  <rect x="378" y="176" width="92" height="108" rx="18" fill="#ece5d8"/>
  <rect x="470" y="182" width="48" height="96" rx="8" fill="#cfe0e6"/>
  <rect x="518" y="170" width="44" height="120" rx="16" fill="#ffffff" stroke="#333" stroke-width="2.5"/>

  <!-- 车轮 -->
  <rect x="247" y="185" width="14" height="26" rx="4" fill="#555"/>
  <rect x="247" y="249" width="14" height="26" rx="4" fill="#555"/>
  <rect x="559" y="185" width="14" height="26" rx="4" fill="#555"/>
  <rect x="559" y="249" width="14" height="26" rx="4" fill="#555"/>

  <!-- 超声波雷达（灰色小圆点，前/后保险杠） -->
  <circle cx="278" cy="170" r="4" fill="#888"/>
  <circle cx="298" cy="170" r="4" fill="#888"/>
  <circle cx="528" cy="170" r="4" fill="#888"/>
  <circle cx="548" cy="170" r="4" fill="#888"/>

  <!-- ① 前视相机（青色） -->
  <circle cx="349" cy="230" r="9" fill="#1f6f8b"/>
  <text x="349" y="233" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">1</text>

  <!-- ② 环视/侧视相机（青色） -->
  <circle cx="300" cy="176" r="9" fill="#1f6f8b"/>
  <text x="300" y="179" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">2</text>

  <!-- ③ 主 LiDAR（红色，车顶） -->
  <circle cx="424" cy="230" r="11" fill="#c0392b"/>
  <text x="424" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold">3</text>

  <!-- ④ 毫米波雷达（红色，前/后保险杠） -->
  <circle cx="260" cy="230" r="8" fill="#c0392b"/>
  <text x="260" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">4</text>
  <circle cx="562" cy="230" r="8" fill="#c0392b"/>
  <text x="562" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">4</text>

  <!-- ⑤ 角雷达（红色，四角） -->
  <circle cx="268" cy="172" r="7" fill="#c0392b"/>
  <text x="268" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">5</text>

  <!-- ⑥ 超声波雷达（灰色，保险杠） -->
  <circle cx="300" cy="170" r="7" fill="#888"/>
  <text x="300" y="173" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">6</text>

  <!-- ⑦ IMU（墨色，车体内部） -->
  <rect x="446" y="252" width="14" height="14" rx="3" fill="#333"/>
  <text x="453" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">7</text>

  <!-- 图例标题 -->
  <line x1="40" y1="322" x2="720" y2="322" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="348" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">图例</text>

  <!-- 第一行 -->
  <rect x="40" y="362" width="14" height="14" rx="3" fill="#1f6f8b"/>
  <text x="62" y="375" font-family="sans-serif" font-size="14" fill="#333">1 前视相机（挡风玻璃顶部）</text>

  <rect x="300" y="362" width="14" height="14" rx="3" fill="#1f6f8b"/>
  <text x="322" y="375" font-family="sans-serif" font-size="14" fill="#333">2 环视 / 侧视相机</text>

  <rect x="520" y="362" width="14" height="14" rx="3" fill="#c0392b"/>
  <text x="542" y="375" font-family="sans-serif" font-size="14" fill="#333">3 主 LiDAR（360°）</text>

  <!-- 第二行 -->
  <rect x="40" y="402" width="14" height="14" rx="3" fill="#c0392b"/>
  <text x="62" y="415" font-family="sans-serif" font-size="14" fill="#333">4 毫米波雷达（前 / 后保险杠）</text>

  <rect x="300" y="402" width="14" height="14" rx="3" fill="#c0392b"/>
  <text x="322" y="415" font-family="sans-serif" font-size="14" fill="#333">5 角雷达（四角，盲区监测）</text>

  <rect x="520" y="402" width="14" height="14" rx="3" fill="#888"/>
  <text x="542" y="415" font-family="sans-serif" font-size="14" fill="#333">6 超声波雷达（泊车）</text>

  <!-- 第三行 -->
  <rect x="40" y="442" width="14" height="14" rx="3" fill="#333"/>
  <text x="62" y="455" font-family="sans-serif" font-size="14" fill="#333">7 IMU（车体内部，姿态与加速度）</text>

  <text x="380" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">示意仅为安装位置约定，不同车型/方案差异很大；本专题以「多传感器冗余 + 互补」为主线</text>
</svg>
