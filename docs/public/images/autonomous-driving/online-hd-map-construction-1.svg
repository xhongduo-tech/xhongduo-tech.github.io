<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>MapTR 的两层嵌套匹配</title>
  <desc>上层展示点序等价：同一条折线有 2N 种合法顺序表达；下层展示实例层匈牙利匹配，求全局最小代价双射。</desc>
  <rect x="0" y="0" width="760" height="460" fill="#faf9f5"/>
  <text x="20" y="28" font-size="15" fill="#333" font-weight="bold">MapTR 的两层匹配</text>

  <!-- Panel A: point-order equivalence -->
  <rect x="20" y="44" width="720" height="176" rx="6" fill="#fff" stroke="#c9c4ba" stroke-width="1"/>
  <text x="36" y="70" font-size="14" fill="#1f6f8b" font-weight="bold">① 点层：点序等价</text>
  <text x="36" y="92" font-size="13" fill="#333">同一条折线，起点任选、方向可正反 → 共 2N 种合法顺序</text>

  <!-- polyline with 4 points -->
  <polyline points="120,190 200,140 280,190 360,140" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <circle cx="120" cy="190" r="4" fill="#c0392b"/><text x="112" y="210" font-size="12" fill="#333">p₀</text>
  <circle cx="200" cy="140" r="4" fill="#c0392b"/><text x="196" y="132" font-size="12" fill="#333">p₁</text>
  <circle cx="280" cy="190" r="4" fill="#c0392b"/><text x="272" y="210" font-size="12" fill="#333">p₂</text>
  <circle cx="360" cy="140" r="4" fill="#c0392b"/><text x="356" y="132" font-size="12" fill="#333">p₃</text>
  <!-- forward arrow -->
  <polygon points="300,166 312,160 304,176" fill="#c0392b"/>
  <!-- backward arrow -->
  <polygon points="172,168 160,162 168,178" fill="#c0392b"/>
  <text x="200" y="118" font-size="12" fill="#c0392b">正向画：p₀→p₁→p₂→p₃</text>
  <text x="200" y="232" font-size="12" fill="#c0392b">反向画：p₃→p₂→p₁→p₀　（同一条线）</text>

  <!-- Panel B: instance-level Hungarian matching -->
  <rect x="20" y="234" width="720" height="206" rx="6" fill="#fff" stroke="#c9c4ba" stroke-width="1"/>
  <text x="36" y="262" font-size="14" fill="#1f6f8b" font-weight="bold">② 实例层：匈牙利匹配</text>
  <text x="36" y="284" font-size="13" fill="#333">每条预测线恰好归到一条真值线，求全局最小代价双射</text>

  <!-- left nodes P1 P2 P3 -->
  <circle cx="140" cy="340" r="18" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.5"/><text x="133" y="345" font-size="13" fill="#1f6f8b">P₁</text>
  <circle cx="140" cy="390" r="18" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.5"/><text x="133" y="395" font-size="13" fill="#1f6f8b">P₂</text>
  <circle cx="140" cy="440" r="18" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.5"/><text x="133" y="445" font-size="13" fill="#1f6f8b">P₃</text>
  <text x="96" y="330" font-size="12" fill="#333">预测实例</text>

  <!-- right nodes G1 G2 G3 -->
  <circle cx="620" cy="340" r="18" fill="#f5e9e6" stroke="#c0392b" stroke-width="1.5"/><text x="613" y="345" font-size="13" fill="#c0392b">G₁</text>
  <circle cx="620" cy="390" r="18" fill="#f5e9e6" stroke="#c0392b" stroke-width="1.5"/><text x="613" y="395" font-size="13" fill="#c0392b">G₂</text>
  <circle cx="620" cy="440" r="18" fill="#f5e9e6" stroke="#c0392b" stroke-width="1.5"/><text x="613" y="445" font-size="13" fill="#c0392b">G₃</text>
  <text x="648" y="330" font-size="12" fill="#333">真值实例</text>

  <!-- all candidate edges light gray -->
  <line x1="158" y1="340" x2="602" y2="340" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="340" x2="602" y2="390" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="340" x2="602" y2="440" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="390" x2="602" y2="340" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="390" x2="602" y2="390" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="390" x2="602" y2="440" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="440" x2="602" y2="340" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="440" x2="602" y2="390" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="158" y1="440" x2="602" y2="440" stroke="#c9c4ba" stroke-width="1"/>

  <!-- optimal matching in red -->
  <line x1="158" y1="340" x2="602" y2="390" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="158" y1="390" x2="602" y2="440" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="158" y1="440" x2="602" y2="340" stroke="#c0392b" stroke-width="2.5"/>
  <text x="330" y="412" font-size="12" fill="#c0392b">最小代价双射：P₁↔G₂、P₂↔G₃、P₃↔G₁</text>
</svg>
