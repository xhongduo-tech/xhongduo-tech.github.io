<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>高精地图的四层要素</title>
  <desc>高精地图按要素分为道路层、车道层、定位层与动态层，同一段道路在不同层上叠加不同的信息。</desc>
  <rect x="0" y="0" width="760" height="470" fill="#faf9f5"/>
  <text x="20" y="28" font-size="15" fill="#333" font-weight="bold">高精地图的分层要素（同一段路，四层叠加）</text>

  <!-- Layer 1: dynamic layer -->
  <rect x="24" y="46" width="712" height="92" rx="6" fill="#f5f2ea" stroke="#c9c4ba" stroke-width="1"/>
  <text x="40" y="70" font-size="14" fill="#c0392b" font-weight="bold">动态层（时变信息）</text>
  <line x1="120" y1="104" x2="560" y2="104" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <polygon points="560,100 574,104 560,108" fill="#c0392b"/>
  <rect x="610" y="88" width="96" height="32" rx="4" fill="#c0392b"/>
  <text x="622" y="109" font-size="13" fill="#fff">前方施工</text>
  <text x="120" y="128" font-size="12" fill="#666">临时事件：施工、事故、封路——由车队/众包实时推送</text>

  <!-- Layer 2: localization layer -->
  <rect x="24" y="142" width="712" height="88" rx="6" fill="#eef3f4" stroke="#c9c4ba" stroke-width="1"/>
  <text x="40" y="166" font-size="14" fill="#1f6f8b" font-weight="bold">定位层（语义特征点）</text>
  <circle cx="150" cy="196" r="6" fill="#1f6f8b"/>
  <text x="162" y="200" font-size="12" fill="#333">路沿</text>
  <circle cx="300" cy="196" r="6" fill="#1f6f8b"/>
  <text x="312" y="200" font-size="12" fill="#333">灯杆</text>
  <circle cx="440" cy="196" r="6" fill="#1f6f8b"/>
  <text x="452" y="200" font-size="12" fill="#333">标志牌</text>
  <circle cx="560" cy="196" r="6" fill="#1f6f8b"/>
  <text x="572" y="200" font-size="12" fill="#333">车道纹理</text>
  <text x="40" y="222" font-size="12" fill="#666">供定位模块比对：车看到的点云/图像特征与地图特征匹配 → 定出厘米级位姿</text>

  <!-- Layer 3: lane layer -->
  <rect x="24" y="234" width="712" height="96" rx="6" fill="#f7efe7" stroke="#c9c4ba" stroke-width="1"/>
  <text x="40" y="258" font-size="14" fill="#c0392b" font-weight="bold">车道层（车道级拓扑与几何）</text>
  <line x1="120" y1="290" x2="640" y2="290" stroke="#8a8275" stroke-width="3"/>
  <line x1="120" y1="316" x2="640" y2="316" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="120" y1="286" x2="640" y2="286" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="120" y1="320" x2="640" y2="320" stroke="#c0392b" stroke-width="1.5"/>
  <text x="120" y="278" font-size="12" fill="#333">左边界　中心线（虚线）　右边界　车道宽度</text>
  <text x="120" y="326" font-size="11" fill="#666">每根线带属性：曲率 κ(s)、坡度、限速、车道连通关系</text>

  <!-- Layer 4: road layer -->
  <rect x="24" y="334" width="712" height="92" rx="6" fill="#f3f0ea" stroke="#c9c4ba" stroke-width="1"/>
  <text x="40" y="358" font-size="14" fill="#8a7a4d" font-weight="bold">道路层（道路几何与连接拓扑）</text>
  <!-- simple road network: two roads intersecting -->
  <line x1="120" y1="396" x2="380" y2="396" stroke="#8a8275" stroke-width="4"/>
  <line x1="380" y1="396" x2="640" y2="396" stroke="#8a8275" stroke-width="4"/>
  <line x1="400" y1="372" x2="400" y2="420" stroke="#8a8275" stroke-width="4"/>
  <circle cx="400" cy="396" r="10" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="392" font-size="12" fill="#333">路口</text>
  <text x="120" y="418" font-size="12" fill="#666">道路分段、交叉口、车道连通：回答「从 A 到 B 怎么走」</text>
</svg>
