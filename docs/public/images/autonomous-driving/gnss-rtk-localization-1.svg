<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>RTK 双差原理</title>
  <desc>基准站与流动站同时观测两颗卫星，先做站间单差再在卫星间做双差，消除共同的钟差与大部分大气误差。</desc>
  <rect x="0" y="0" width="760" height="460" fill="#faf9f5"/>
  <text x="20" y="28" font-size="15" fill="#333" font-weight="bold">RTK 双差：把共同误差消掉，留下干净的几何量</text>

  <!-- satellites -->
  <circle cx="180" cy="60" r="14" fill="#e8eef0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="172" y="65" font-size="13" fill="#1f6f8b">S₁</text>
  <circle cx="560" cy="44" r="14" fill="#e8eef0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="552" y="49" font-size="13" fill="#1f6f8b">S₂</text>

  <!-- receivers -->
  <rect x="160" y="318" width="70" height="44" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="172" y="345" font-size="13" fill="#c0392b">基准站 B</text>
  <rect x="520" y="318" width="70" height="44" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="532" y="345" font-size="13" fill="#1f6f8b">流动站 R</text>

  <!-- baseline -->
  <line x1="230" y1="340" x2="520" y2="340" stroke="#333" stroke-width="2"/>
  <text x="330" y="356" font-size="12" fill="#333">基线（数米 ~ 数十公里）</text>

  <!-- ranges: S1 to B and R -->
  <line x1="178" y1="74" x2="175" y2="316" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="182" y1="74" x2="534" y2="316" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="552" y1="58" x2="175" y2="316" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="556" y1="58" x2="534" y2="316" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- labels of ranges -->
  <text x="120" y="180" font-size="12" fill="#666">ρ₁ᴮ</text>
  <text x="330" y="180" font-size="12" fill="#666">ρ₁ᴿ</text>
  <text x="300" y="230" font-size="12" fill="#666">ρ₂ᴮ</text>
  <text x="430" y="140" font-size="12" fill="#666">ρ₂ᴿ</text>

  <!-- error annotations -->
  <line x1="330" y1="100" x2="330" y2="200" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="90" y="228" font-size="13" fill="#c0392b">① 站间单差：消卫星钟差</text>
  <text x="90" y="248" font-size="13" fill="#1f6f8b">② 双差（再差 S₂）：消接收机钟差</text>
  <text x="90" y="268" font-size="13" fill="#1f6f8b">　　并消去大部分电离层/对流层误差</text>

  <!-- result box -->
  <rect x="60" y="392" width="640" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="76" y="414" font-size="13" fill="#333">剩余：干净的几何距离差 + 整数模糊度差</text>
  <text x="76" y="434" font-size="13" fill="#c0392b">解出基线向量 → 流动站相对基准站获得厘米级位置</text>
</svg>
