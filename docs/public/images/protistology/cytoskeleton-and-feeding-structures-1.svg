<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500">
<title>原生生物摄食与细胞结构示意（以纤毛虫为例）</title>
<desc>以纤毛虫为代表绘制的原生生物细胞示意图：纤毛覆盖体表，口沟—胞口—胞咽构成摄食通道，食物泡沿胞咽末端形成，胞肛排出残渣；伸缩泡负责渗透调节，大核与小核并存，表膜下有刺丝泡等挤出体。</desc>
<rect width="680" height="500" fill="#faf9f5"/>
<ellipse cx="340" cy="250" rx="230" ry="150" fill="#fdfcf7" stroke="#333" stroke-width="2"/>
<g stroke="#1f6f8b" stroke-width="2">
<line x1="340" y1="100" x2="340" y2="85"/>
<line x1="503" y1="356" x2="518" y2="371"/>
<line x1="177" y1="356" x2="162" y2="371"/>
<line x1="177" y1="144" x2="162" y2="129"/>
<line x1="503" y1="144" x2="518" y2="129"/>
<line x1="110" y1="250" x2="95" y2="250"/>
<line x1="570" y1="250" x2="585" y2="250"/>
<line x1="340" y1="400" x2="340" y2="415"/>
</g>
<text x="340" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">纤毛（9+2，异步波协调）</text>
<polygon points="118,205 160,218 172,240 158,262 118,275" fill="#fdfcf7" stroke="#333" stroke-width="2"/>
<line x1="172" y1="240" x2="322" y2="264" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round"/>
<text x="146" y="196" font-family="sans-serif" font-size="14" fill="#333">口沟 / 胞口</text>
<text x="232" y="250" font-family="sans-serif" font-size="14" fill="#333">胞咽</text>
<circle cx="350" cy="280" r="16" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="385" cy="296" r="13" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="415" cy="276" r="11" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<text x="398" y="330" font-family="sans-serif" font-size="14" fill="#333">食物泡</text>
<g stroke="#c0392b" stroke-width="2">
<circle cx="230" cy="330" r="20" fill="#f7e8e6" stroke="#c0392b"/>
<line x1="230" y1="310" x2="230" y2="292"/>
<line x1="250" y1="330" x2="268" y2="330"/>
<line x1="210" y1="330" x2="192" y2="330"/>
<line x1="246" y1="314" x2="260" y2="300"/>
<line x1="214" y1="346" x2="202" y2="358"/>
<circle cx="455" cy="165" r="15" fill="#f7e8e6" stroke="#c0392b"/>
<line x1="455" y1="150" x2="455" y2="138"/>
<line x1="470" y1="165" x2="482" y2="165"/>
<line x1="440" y1="165" x2="428" y2="165"/>
</g>
<text x="230" y="375" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">伸缩泡 + 收集管</text>
<text x="508" y="150" font-family="sans-serif" font-size="14" fill="#333">伸缩泡</text>
<ellipse cx="265" cy="225" rx="70" ry="40" fill="#f7e8e6" stroke="#c0392b" stroke-width="2"/>
<circle cx="340" cy="200" r="12" fill="#f7e8e6" stroke="#c0392b" stroke-width="2"/>
<text x="205" y="135" font-family="sans-serif" font-size="15" fill="#c0392b">大核（多倍体转录工厂）</text>
<text x="368" y="205" font-family="sans-serif" font-size="14" fill="#c0392b">小核</text>
<g stroke="#c0392b" stroke-width="3">
<line x1="300" y1="140" x2="300" y2="155"/>
<line x1="420" y1="140" x2="420" y2="155"/>
<line x1="300" y1="360" x2="300" y2="345"/>
</g>
<text x="430" y="132" font-family="sans-serif" font-size="14" fill="#c0392b">刺丝泡（挤出体）</text>
<line x1="515" y1="338" x2="525" y2="348" stroke="#333" stroke-width="3"/>
<text x="540" y="352" font-family="sans-serif" font-size="14" fill="#333">胞肛</text>
<text x="85" y="320" font-family="sans-serif" font-size="14" fill="#333">表膜（质膜 + 表膜下微管/蛋白条带）</text>
</svg>
