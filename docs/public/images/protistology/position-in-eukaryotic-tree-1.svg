<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560">
<title>真核生物主要超类群示意系统树</title>
<desc>以示意性系统树展示原生生物在真核生物树中的位置：真核生物最后的共同祖先分出 Opisthokonta、Amoebozoa、Excavata、SAR、Archaeplastida 等主要支系。动物、真菌与陆生植物只是其中的两小支，树上的其余绝大部分成员都被传统上称为原生生物。</desc>
<rect width="720" height="560" fill="#faf9f5"/>
<line x1="60" y1="280" x2="190" y2="280" stroke="#333" stroke-width="2"/>
<line x1="190" y1="90" x2="190" y2="470" stroke="#333" stroke-width="2"/>
<circle cx="60" cy="280" r="6" fill="#c0392b"/>
<text x="52" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">真核生物</text>
<text x="52" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">共同祖先</text>
<text x="52" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">LECA</text>
<line x1="190" y1="90" x2="300" y2="90" stroke="#1f6f8b" stroke-width="3"/>
<line x1="190" y1="185" x2="300" y2="185" stroke="#1f6f8b" stroke-width="3"/>
<line x1="190" y1="280" x2="300" y2="280" stroke="#1f6f8b" stroke-width="3"/>
<line x1="190" y1="375" x2="300" y2="375" stroke="#1f6f8b" stroke-width="3"/>
<line x1="190" y1="470" x2="300" y2="470" stroke="#1f6f8b" stroke-width="3"/>
<text x="308" y="76" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">Opisthokonta（后鞭毛生物）</text>
<text x="308" y="94" font-family="sans-serif" font-size="14" fill="#555">动物 · 真菌 · 领鞭毛虫</text>
<text x="308" y="110" font-family="sans-serif" font-size="13" fill="#888">动物与真菌是少数非原生生物支系</text>
<text x="308" y="171" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">Amoebozoa（变形虫）</text>
<text x="308" y="189" font-family="sans-serif" font-size="14" fill="#555">变形虫 · 黏菌 · 有壳变形虫</text>
<text x="308" y="266" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">Excavata（挖掘生物）</text>
<text x="308" y="284" font-family="sans-serif" font-size="14" fill="#555">眼虫 · 锥虫 · 贾第虫</text>
<text x="308" y="361" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">SAR（Stramenopiles + Alveolata + Rhizaria）</text>
<text x="308" y="379" font-family="sans-serif" font-size="14" fill="#555">硅藻 · 甲藻 · 纤毛虫</text>
<text x="308" y="395" font-family="sans-serif" font-size="14" fill="#555">孢子虫 · 有孔虫</text>
<text x="308" y="456" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">Archaeplastida（原始色素体）</text>
<text x="308" y="474" font-family="sans-serif" font-size="14" fill="#555">红藻 · 绿藻 · 陆生植物</text>
<text x="308" y="490" font-family="sans-serif" font-size="13" fill="#888">陆生植物是另一非原生生物支系</text>
<line x1="20" y1="520" x2="700" y2="520" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="360" y="540" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">除动物、真菌、陆生植物之外，真核生物树上的绝大多数支系都被传统上称为「原生生物」——它们构成一个并系群</text>
</svg>
