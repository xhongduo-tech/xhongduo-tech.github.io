<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
<title>水生食物网中的微生物环示意图</title>
<desc>浮游植物通过经典摄食链流向浮游动物与鱼类，同时向水中渗出溶解有机碳（DOC），异养细菌吸收 DOC，原生动物（鞭毛虫、纤毛虫）摄食细菌，原生动物又被浮游动物捕食；细菌与原生动物的矿化作用把氮磷营养盐回补给浮游植物，构成闭环。</desc>
<rect width="760" height="480" fill="#faf9f5"/>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#333"/></marker>
<marker id="ahd" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
</defs>
<rect x="60" y="40" width="170" height="56" rx="8" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<text x="145" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">浮游植物（硅藻 · 甲藻）</text>
<rect x="370" y="40" width="160" height="60" rx="8" fill="#f7e8e6" stroke="#c0392b" stroke-width="2"/>
<text x="450" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">浮游动物（桡足类等）</text>
<rect x="590" y="40" width="130" height="52" rx="8" fill="#efe9dc" stroke="#333" stroke-width="2"/>
<text x="655" y="71" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">鱼类</text>
<rect x="60" y="190" width="170" height="50" rx="8" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<text x="145" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">溶解有机碳（DOC）</text>
<rect x="60" y="330" width="170" height="56" rx="8" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>
<text x="145" y="363" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">异养细菌</text>
<rect x="370" y="330" width="180" height="64" rx="8" fill="#f7e8e6" stroke="#c0392b" stroke-width="2"/>
<text x="460" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">原生动物</text>
<text x="460" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">（鞭毛虫 · 纤毛虫）</text>
<line x1="230" y1="68" x2="366" y2="72" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">摄食（经典直食链）</text>
<line x1="530" y1="70" x2="586" y2="66" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="560" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">捕食</text>
<line x1="145" y1="96" x2="145" y2="186" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
<text x="158" y="142" font-family="sans-serif" font-size="13" fill="#c0392b">渗出 / 病毒裂解</text>
<line x1="145" y1="240" x2="145" y2="326" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="158" y="285" font-family="sans-serif" font-size="13" fill="#333">吸收（溶解有机碳）</text>
<line x1="230" y1="358" x2="366" y2="360" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="300" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">噬菌（摄食细菌）</text>
<path d="M450,330 C520,280 520,180 450,104" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="476" y="220" font-family="sans-serif" font-size="13" fill="#333">捕食</text>
<path d="M380,394 C40,420 40,120 60,96" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
<text transform="translate(38,260) rotate(-90)" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">营养盐矿化再生（N、P）</text>
</svg>
