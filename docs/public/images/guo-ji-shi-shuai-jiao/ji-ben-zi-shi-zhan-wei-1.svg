<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>基本站姿与重心示意</title>
<desc>侧视图：摔跤手屈膝错步站立，重心垂线落在两脚之间的支撑面内。</desc>
<rect width="400" height="300" fill="#faf9f5"/>
<line x1="60" y1="255" x2="340" y2="255" stroke="#333" stroke-width="2"/>
<text x="205" y="285" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">垫面</text>
<line x1="150" y1="255" x2="146" y2="248" stroke="#333" stroke-width="3"/>
<line x1="260" y1="255" x2="264" y2="248" stroke="#333" stroke-width="3"/>
<circle cx="200" cy="52" r="16" fill="none" stroke="#333" stroke-width="2"/>
<text x="200" y="30" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">头（目视对手）</text>
<line x1="200" y1="68" x2="196" y2="150" stroke="#333" stroke-width="4"/>
<line x1="196" y1="92" x2="150" y2="122" stroke="#333" stroke-width="4"/>
<line x1="196" y1="92" x2="250" y2="118" stroke="#333" stroke-width="4"/>
<text x="118" y="140" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">前臂</text>
<line x1="196" y1="150" x2="150" y2="255" stroke="#333" stroke-width="5"/>
<line x1="196" y1="150" x2="260" y2="255" stroke="#333" stroke-width="5"/>
<text x="118" y="238" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">前腿</text>
<text x="286" y="238" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">后腿</text>
<circle cx="205" cy="133" r="5" fill="#c0392b"/>
<text x="228" y="128" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="start">重心</text>
<line x1="205" y1="138" x2="205" y2="255" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.5"/>
<line x1="150" y1="263" x2="260" y2="263" stroke="#1f6f8b" stroke-width="2"/>
<text x="205" y="280" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">支撑面</text>
<text x="205" y="300" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">屈膝 · 两脚错开 · 重心垂线落在支撑面内</text>
</svg>
