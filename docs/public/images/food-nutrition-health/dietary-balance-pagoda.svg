<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>中国居民平衡膳食宝塔（2022）</title>
  <desc>五层金字塔：底层为谷薯类，向上依次为蔬菜水果、动物性食物、奶类大豆坚果、烹调油与盐，塔底另有饮水与身体活动提示。</desc>
  <rect width="640" height="540" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">中国居民平衡膳食宝塔（2022）</text>

  <g>
    <rect x="220" y="60" width="200" height="60" rx="6" fill="#e8dcc3" stroke="#8a7a52" stroke-width="1"/>
    <text x="320" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">烹调油 25-30 g</text>
    <text x="320" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">食盐 &lt;5 g</text>
  </g>

  <g>
    <rect x="180" y="130" width="280" height="70" rx="6" fill="#dccba5" stroke="#8a7a52" stroke-width="1"/>
    <text x="320" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">奶及奶制品 300-500 g</text>
    <text x="320" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">大豆及坚果 25-35 g</text>
  </g>

  <g>
    <rect x="140" y="210" width="360" height="75" rx="6" fill="#cfb987" stroke="#8a7a52" stroke-width="1"/>
    <text x="320" y="241" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">肉禽鱼蛋类 120-200 g</text>
    <text x="320" y="263" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4a4a">每周至少 2 次水产品 · 每日 1 个鸡蛋</text>
  </g>

  <g>
    <rect x="100" y="295" width="440" height="85" rx="6" fill="#c2a76a" stroke="#8a7a52" stroke-width="1"/>
    <text x="320" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">蔬菜类 300-500 g</text>
    <text x="320" y="349" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">水果类 200-350 g</text>
    <text x="320" y="369" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4a4a">深色蔬菜应占一半以上</text>
  </g>

  <g>
    <rect x="60" y="390" width="520" height="90" rx="6" fill="#b2944f" stroke="#8a7a52" stroke-width="1"/>
    <text x="320" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">谷薯类 250-400 g</text>
    <text x="320" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4a4a">全谷物和杂豆 50-150 g · 薯类 50-100 g</text>
    <text x="320" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4a4a">谷薯类是膳食能量的主要来源</text>
  </g>

  <text x="320" y="508" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">塔底提示：饮水 1500-1700 mL / 日 · 身体活动 6000 步 / 日 · 吃动平衡，健康体重</text>
  <text x="320" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">数据来源：中国居民膳食指南（2022）</text>
</svg>
