<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>CANN 软件栈分层结构</title>
<desc>CANN 软件栈从上到下依次为应用层、框架适配层、图编译层、运行时与算子层、驱动与硬件层，上层通过接口调用下层。</desc>
<rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
<text x="20" y="30" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">CANN 软件栈分层</text>

<!-- App layer -->
<rect x="40" y="48" width="560" height="52" rx="8" fill="#333" opacity="0.08" stroke="#333" stroke-width="1.5"/>
<text x="320" y="70" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold" text-anchor="middle">应用层：训练脚本 / 推理服务 / 模型代码</text>
<text x="320" y="90" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">PyTorch / MindSpore / TensorFlow 模型代码</text>

<!-- Framework adapter -->
<rect x="40" y="110" width="560" height="52" rx="8" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="320" y="132" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold" text-anchor="middle">框架适配层：Ascend PyTorch Adapter / MindSpore</text>
<text x="320" y="152" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">把框架算子翻译成 CANN 可执行的计算图</text>

<!-- Graph compiler -->
<rect x="40" y="172" width="560" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="320" y="194" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold" text-anchor="middle">图编译器层：GE + 算子融合 / 图优化</text>
<text x="320" y="214" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">构图、算子下沉、融合、内存规划、调度</text>

<!-- Runtime + kernels -->
<rect x="40" y="234" width="560" height="52" rx="8" fill="#1f6f8b" opacity="0.10" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="320" y="256" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold" text-anchor="middle">运行时与算子层：AscendCL / 算子库 / HCCL</text>
<text x="320" y="276" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">设备管理、算子执行、集合通信、内存管理</text>

<!-- Driver -->
<rect x="40" y="296" width="560" height="52" rx="8" fill="#333" opacity="0.10" stroke="#333" stroke-width="1.5"/>
<text x="320" y="318" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold" text-anchor="middle">驱动层：Ascend 驱动 / 固件</text>
<text x="320" y="338" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">设备识别、资源上报、底层操作</text>

<!-- Hardware -->
<rect x="40" y="358" width="560" height="56" rx="8" fill="#faf9f5" stroke="#333" stroke-width="2"/>
<text x="320" y="384" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold" text-anchor="middle">硬件层：昇腾 910B / 910C / 950</text>
<text x="320" y="404" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">AI Core / HCCS / HBM</text>

<!-- arrows -->
<line x1="320" y1="100" x2="320" y2="110" stroke="#333" stroke-width="1.5"/>
<line x1="320" y1="162" x2="320" y2="172" stroke="#1f6f8b" stroke-width="1.5"/>
<line x1="320" y1="224" x2="320" y2="234" stroke="#c0392b" stroke-width="1.5"/>
<line x1="320" y1="286" x2="320" y2="296" stroke="#1f6f8b" stroke-width="1.5"/>
<line x1="320" y1="348" x2="320" y2="358" stroke="#333" stroke-width="1.5"/>
<text x="610" y="48" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">↑ 越上层越贴近用户</text>
<text x="610" y="66" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">↓ 越下层越贴近硬件</text>
</svg>
