<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>昇腾存储层次金字塔</title>
<desc>昇腾芯片存储从底到顶依次为 HBM、L2 Cache、L1 Buffer、L0/L0C/Unified Buffer，越往上容量越小、越靠近计算单元。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>

<!-- HBM -->
<rect x="60" y="290" width="520" height="80" rx="8" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="2"/>
<text x="320" y="322" font-family="sans-serif" font-size="17" fill="#1f6f8b" font-weight="bold" text-anchor="middle">HBM 高带宽内存（片外主存）</text>
<text x="320" y="348" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">数十 GB ｜ 全芯片共享 ｜ 存放权重与中间张量</text>

<!-- L2 -->
<rect x="110" y="210" width="420" height="70" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
<text x="320" y="240" font-family="sans-serif" font-size="17" fill="#1f6f8b" font-weight="bold" text-anchor="middle">L2 Cache</text>
<text x="320" y="264" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">数十 MB ｜ 全芯片共享 ｜ 跨核数据交换枢纽</text>

<!-- L1 -->
<rect x="170" y="140" width="300" height="60" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="166" font-family="sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="middle">L1 Buffer（预取缓冲）</text>
<text x="320" y="188" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">数百 KB~MB 级 ｜ 向 AI Core 供数</text>

<!-- L0 / L0C / UB -->
<rect x="230" y="70" width="180" height="58" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="94" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold" text-anchor="middle">L0 / L0C / UB</text>
<text x="320" y="115" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">KB 级 ｜ AI Core 内 ｜ 最热数据</text>

<!-- Compute -->
<rect x="280" y="14" width="80" height="40" rx="6" fill="#333" opacity="0.10" stroke="#333" stroke-width="2"/>
<text x="320" y="39" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold" text-anchor="middle">Cube/Vector</text>

<!-- arrows -->
<line x1="320" y1="54" x2="320" y2="70" stroke="#333" stroke-width="2"/>
<line x1="320" y1="128" x2="320" y2="140" stroke="#c0392b" stroke-width="2"/>
<line x1="320" y1="200" x2="320" y2="210" stroke="#c0392b" stroke-width="2"/>
<line x1="320" y1="280" x2="320" y2="290" stroke="#1f6f8b" stroke-width="2"/>

<text x="610" y="46" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">↑ 越往上：更快、更贵、更小</text>
<text x="610" y="64" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">↓ 越往下：更大、更慢、更省</text>
</svg>
