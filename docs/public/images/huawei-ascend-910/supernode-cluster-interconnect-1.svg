<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>昇腾超节点集群互联拓扑</title>
<desc>昇腾集群的互联分三层：服务器内 8 卡通过 HCCS 全互联，服务器之间通过 RoCE 网络相连，超节点再把多个机柜连成更大算力体。</desc>
<rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
<text x="20" y="30" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">昇腾集群互联拓扑（三层）</text>

<!-- Layer 1: Server A - 8 cards via HCCS -->
<text x="90" y="60" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold" text-anchor="middle">服务器 A（8 卡，HCCS 全互联）</text>
<rect x="30" y="70" width="120" height="56" rx="6" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="1.5"/>
<rect x="160" y="70" width="120" height="56" rx="6" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="1.5"/>
<rect x="290" y="70" width="120" height="56" rx="6" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="1.5"/>
<rect x="420" y="70" width="120" height="56" rx="6" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="90" y="99" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">910B/C 卡</text>
<text x="220" y="99" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">910B/C 卡</text>
<text x="350" y="99" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">910B/C 卡</text>
<text x="480" y="99" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">…共 8 卡</text>
<text x="320" y="150" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">HCCS：任意两卡直连（全互联）</text>

<!-- Layer 2: RoCE network -->
<text x="320" y="190" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">RoCE 网络（无损以太网 + RDMA）</text>
<line x1="160" y1="210" x2="300" y2="210" stroke="#c0392b" stroke-width="2"/>
<line x1="340" y1="210" x2="480" y2="210" stroke="#c0392b" stroke-width="2"/>
<rect x="140" y="196" width="40" height="28" rx="4" fill="#c0392b" opacity="0.14" stroke="#c0392b" stroke-width="1.5"/>
<rect x="460" y="196" width="40" height="28" rx="4" fill="#c0392b" opacity="0.14" stroke="#c0392b" stroke-width="1.5"/>
<text x="160" y="215" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">TOR</text>
<text x="480" y="215" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">TOR</text>

<!-- Layer 3: Supernode -->
<text x="320" y="250" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">超节点（多个机柜 / 服务器组成超大算力体）</text>
<rect x="40" y="262" width="140" height="54" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<rect x="250" y="262" width="140" height="54" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<rect x="460" y="262" width="140" height="54" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<text x="110" y="286" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">服务器 1</text>
<text x="320" y="286" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">服务器 2</text>
<text x="530" y="286" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">服务器 N</text>
<text x="110" y="306" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">8 卡</text>
<text x="320" y="306" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">8 卡</text>
<text x="530" y="306" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">8 卡</text>
<line x1="180" y1="289" x2="250" y2="289" stroke="#333" stroke-width="1.5"/>
<line x1="390" y1="289" x2="460" y2="289" stroke="#333" stroke-width="1.5"/>
<text x="320" y="340" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">卡内 HCCS → 卡间 RoCE → 机柜间超节点高速互联</text>

<!-- Bottom note -->
<rect x="40" y="360" width="560" height="76" rx="8" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="60" y="386" font-family="sans-serif" font-size="13" fill="#333">带宽逐层下降：HCCS（数百 GB/s）&gt; RoCE（百 Gb/s）&gt; 跨柜互联</text>
<text x="60" y="410" font-family="sans-serif" font-size="13" fill="#333">通信频度逐层下降：张量并行（每步）&gt; 数据并行（每步）&gt; 流水并行（每层）</text>
<text x="60" y="430" font-family="sans-serif" font-size="13" fill="#1f6f8b">原则：把高频通信放近处，把低频通信放远处</text>
</svg>
