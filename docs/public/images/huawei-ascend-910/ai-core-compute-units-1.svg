<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>AI Core 三单元结构</title>
<desc>昇腾 AI Core 内部由 Cube、Vector、Scalar 三个计算单元与 L0 缓冲、统一缓冲、L1 缓冲组成的局部存储构成。</desc>
<rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
<text x="20" y="34" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">AI Core（AI 计算核心）</text>

<!-- Cube unit -->
<rect x="30" y="56" width="180" height="110" rx="8" fill="#1f6f8b" opacity="0.14" stroke="#1f6f8b" stroke-width="2"/>
<text x="120" y="88" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold" text-anchor="middle">Cube 矩阵单元</text>
<text x="120" y="112" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">矩阵乘 GEMM</text>
<text x="120" y="134" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">16×16×16 乘加/周期</text>
<text x="120" y="156" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">专司「计算受限」算子</text>

<!-- Vector unit -->
<rect x="230" y="56" width="180" height="110" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="88" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold" text-anchor="middle">Vector 向量单元</text>
<text x="320" y="112" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">逐元素 / 规约运算</text>
<text x="320" y="134" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">激活、归一化、softmax</text>
<text x="320" y="156" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">专司「内存受限」算子</text>

<!-- Scalar unit -->
<rect x="430" y="56" width="180" height="110" rx="8" fill="#333" opacity="0.10" stroke="#333" stroke-width="2"/>
<text x="520" y="88" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">Scalar 标量单元</text>
<text x="520" y="112" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">标量运算 / 分支</text>
<text x="520" y="134" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">地址计算 / 流程控制</text>
<text x="520" y="156" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">驱动整个流水</text>

<!-- Local buffers -->
<rect x="30" y="210" width="380" height="80" rx="8" fill="#333" opacity="0.06" stroke="#333" stroke-width="1.5"/>
<text x="40" y="240" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">局部存储</text>
<text x="40" y="266" font-family="sans-serif" font-size="13" fill="#333">L0 Buffer（A/B 输入）｜L0C（累加）｜Unified Buffer（向量工作区）</text>

<!-- L1 buffer -->
<rect x="430" y="210" width="180" height="80" rx="8" fill="#1f6f8b" opacity="0.10" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="520" y="240" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold" text-anchor="middle">L1 Buffer</text>
<text x="520" y="266" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">数据预取缓冲</text>

<!-- arrows between compute units and storage -->
<line x1="120" y1="166" x2="120" y2="210" stroke="#1f6f8b" stroke-width="2"/>
<line x1="320" y1="166" x2="320" y2="210" stroke="#c0392b" stroke-width="2"/>
<line x1="520" y1="166" x2="520" y2="210" stroke="#333" stroke-width="2"/>

<!-- L2 / HBM -->
<rect x="120" y="330" width="400" height="90" rx="8" fill="#faf9f5" stroke="#333" stroke-width="2"/>
<text x="320" y="360" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">L2 Cache（全芯片共享）</text>
<text x="320" y="386" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">↓ 高带宽内存 HBM（片外主存，数十 GB）</text>

<line x1="220" y1="290" x2="300" y2="330" stroke="#333" stroke-width="2"/>
<line x1="420" y1="290" x2="340" y2="330" stroke="#333" stroke-width="2"/>
<text x="330" y="318" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">← 数据搬运（tiling 分块）→</text>
</svg>
