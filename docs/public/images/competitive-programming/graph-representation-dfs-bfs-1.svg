<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" font-family="sans-serif">
  <title>图的三视图：原图、邻接矩阵与邻接表</title>
  <desc>左侧为一张四节点无向图，中间为对应的 4×4 邻接矩阵，右侧为对应的邻接表，三种表示互相等价。</desc>
  <rect width="820" height="230" fill="#faf9f5"/>
  <text x="20" y="34" font-size="16" fill="#333" font-weight="bold">同一张图的三视图</text>

  <!-- 左：原图 -->
  <text x="50" y="60" font-size="14" fill="#1f6f8b">原图</text>
  <g stroke="#333" stroke-width="2">
    <line x1="80" y1="120" x2="170" y2="90"/>
    <line x1="170" y1="90" x2="170" y2="170"/>
    <line x1="170" y1="170" x2="80" y2="200"/>
    <line x1="80" y1="200" x2="80" y2="120"/>
    <line x1="80" y1="120" x2="170" y2="170" stroke="#c0392b"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <circle cx="80" cy="120" r="16"/><text x="74" y="125" font-size="14" fill="#333">1</text>
    <circle cx="170" cy="90" r="16"/><text x="164" y="95" font-size="14" fill="#333">2</text>
    <circle cx="170" cy="170" r="16"/><text x="164" y="175" font-size="14" fill="#333">3</text>
    <circle cx="80" cy="200" r="16"/><text x="74" y="205" font-size="14" fill="#333">4</text>
  </g>

  <!-- 中：邻接矩阵 -->
  <text x="270" y="60" font-size="14" fill="#1f6f8b">邻接矩阵</text>
  <g fill="#333">
    <text x="276" y="80" font-size="13">1</text><text x="310" y="80" font-size="13">2</text>
    <text x="344" y="80" font-size="13">3</text><text x="378" y="80" font-size="13">4</text>
    <text x="252" y="105" font-size="13">1</text><text x="252" y="139" font-size="13">2</text>
    <text x="252" y="173" font-size="13">3</text><text x="252" y="207" font-size="13">4</text>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <rect x="264" y="92" width="136" height="136" fill="none"/>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="298" y1="92" x2="298" y2="228"/>
    <line x1="332" y1="92" x2="332" y2="228"/>
    <line x1="366" y1="92" x2="366" y2="228"/>
    <line x1="264" y1="126" x2="400" y2="126"/>
    <line x1="264" y1="160" x2="400" y2="160"/>
    <line x1="264" y1="194" x2="400" y2="194"/>
  </g>
  <g fill="#c0392b" font-size="13">
    <text x="272" y="114">0</text><text x="306" y="114">1</text><text x="340" y="114">1</text><text x="374" y="114">1</text>
    <text x="272" y="148">1</text><text x="306" y="148">0</text><text x="340" y="148">1</text><text x="374" y="148">0</text>
    <text x="272" y="182">1</text><text x="306" y="182">1</text><text x="340" y="182">0</text><text x="374" y="182">1</text>
    <text x="272" y="216">1</text><text x="306" y="216">0</text><text x="340" y="216">1</text><text x="374" y="216">0</text>
  </g>

  <!-- 右：邻接表 -->
  <text x="470" y="60" font-size="14" fill="#1f6f8b">邻接表</text>
  <g fill="#333" font-size="14">
    <text x="480" y="105">1 → 2, 3, 4</text>
    <text x="480" y="139">2 → 1, 3</text>
    <text x="480" y="173">3 → 2, 4, 1</text>
    <text x="480" y="207">4 → 3, 1</text>
  </g>
  <g fill="none" stroke="#c0392b" stroke-width="1.5">
    <rect x="472" y="92" width="130" height="22" rx="4"/>
    <rect x="472" y="126" width="130" height="22" rx="4"/>
    <rect x="472" y="160" width="130" height="22" rx="4"/>
    <rect x="472" y="194" width="130" height="22" rx="4"/>
  </g>
</svg>
