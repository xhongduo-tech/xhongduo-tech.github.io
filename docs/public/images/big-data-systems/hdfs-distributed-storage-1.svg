<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <title>HDFS 架构示意</title>
  <desc>客户端通过 NameNode 访问元数据，直接与 DataNode 读写数据块；NameNode 通过心跳指挥 DataNode 复制副本。</desc>
  <rect x="0" y="0" width="800" height="520" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="60" y="50" width="170" height="52" rx="6"/>
    <rect x="560" y="50" width="180" height="52" rx="6"/>
    <rect x="60" y="400" width="200" height="80" rx="6"/>
    <rect x="300" y="400" width="200" height="80" rx="6"/>
    <rect x="540" y="400" width="200" height="80" rx="6"/>
  </g>
  <text x="145" y="80" font-size="16" fill="#333" text-anchor="middle">客户端 Client</text>
  <text x="650" y="72" font-size="15" fill="#c0392b" text-anchor="middle">NameNode</text>
  <text x="650" y="92" font-size="13" fill="#333" text-anchor="middle">元数据：命名空间 + 块映射</text>
  <text x="160" y="440" font-size="15" fill="#1f6f8b" text-anchor="middle">DataNode 1</text>
  <text x="400" y="440" font-size="15" fill="#1f6f8b" text-anchor="middle">DataNode 2</text>
  <text x="640" y="440" font-size="15" fill="#1f6f8b" text-anchor="middle">DataNode 3</text>
  <g fill="#333" font-size="13">
    <text x="110" y="468">块 A B C</text>
    <text x="350" y="468">块 A B C</text>
    <text x="590" y="468">块 A B C</text>
  </g>
  <text x="400" y="510" font-size="14" fill="#333" text-anchor="middle">每个数据块默认保存 3 个副本，分布在多台 DataNode 上</text>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="145" y1="102" x2="650" y2="102" stroke-dasharray="6 4"/>
    <polygon points="640,98 650,102 640,106" fill="#c0392b"/>
  </g>
  <text x="397" y="93" font-size="13" fill="#c0392b">① 元数据操作（问"块在哪"）</text>
  <g stroke="#1f6f8b" stroke-width="2" fill="none">
    <line x1="145" y1="126" x2="145" y2="400"/>
    <polygon points="141,390 145,400 149,390" fill="#1f6f8b"/>
  </g>
  <text x="155" y="260" font-size="13" fill="#1f6f8b">② 直接读写数据流（块）</text>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="650" y1="102" x2="650" y2="400"/>
    <line x1="650" y1="110" x2="145" y2="110" stroke="none"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.5" fill="none">
    <line x1="650" y1="102" x2="100" y2="400"/>
    <line x1="650" y1="102" x2="340" y2="400"/>
    <line x1="650" y1="102" x2="580" y2="400"/>
  </g>
  <text x="700" y="240" font-size="13" fill="#c0392b">③ 心跳、副本复制命令</text>
  <g stroke="#333" stroke-width="1" stroke-dasharray="4 4" opacity="0.5">
    <line x1="230" y1="400" x2="300" y2="400"/>
    <line x1="500" y1="400" x2="540" y2="400"/>
  </g>
</svg>
