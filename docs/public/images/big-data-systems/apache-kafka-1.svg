<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="sans-serif">
  <title>Kafka 主题、分区与日志</title>
  <desc>一个主题切成三个分区，生产者追加写入，分区内消息带连续偏移量，消费者组内各消费者分担不同分区。</desc>
  <rect x="0" y="0" width="820" height="500" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="40" y="40" width="180" height="60" rx="6"/>
    <rect x="300" y="180" width="150" height="170" rx="6"/>
    <rect x="470" y="180" width="150" height="170" rx="6"/>
    <rect x="640" y="180" width="150" height="170" rx="6"/>
    <rect x="320" y="410" width="180" height="55" rx="6"/>
  </g>
  <text x="130" y="78" font-size="16" fill="#1f6f8b" text-anchor="middle">生产者 Producer</text>
  <text x="370" y="295" font-size="15" fill="#333" text-anchor="middle">分区 0</text>
  <text x="540" y="295" font-size="15" fill="#333" text-anchor="middle">分区 1</text>
  <text x="710" y="295" font-size="15" fill="#333" text-anchor="middle">分区 2</text>
  <text x="410" y="440" font-size="15" fill="#c0392b" text-anchor="middle">消费者组（各成员分担分区）</text>
  <g fill="#333" font-size="13">
    <text x="320" y="210">offset 0 1 2 3 …</text>
    <text x="490" y="210">offset 0 1 2 …</text>
    <text x="660" y="210">offset 0 1 2 3 …</text>
    <text x="320" y="345">写</text>
    <text x="490" y="345">写</text>
    <text x="660" y="345">写</text>
  </g>
  <g stroke="#1f6f8b" stroke-width="2" fill="none">
    <line x1="220" y1="70" x2="340" y2="180"/>
    <line x1="220" y1="70" x2="510" y2="180"/>
    <line x1="220" y1="70" x2="680" y2="180"/>
    <polygon points="336,172 340,180 332,178" fill="#1f6f8b"/>
    <polygon points="506,172 510,180 502,178" fill="#1f6f8b"/>
    <polygon points="676,172 680,180 672,178" fill="#1f6f8b"/>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="370" y1="350" x2="390" y2="410"/>
    <line x1="540" y1="350" x2="440" y2="410"/>
    <line x1="710" y1="350" x2="490" y2="410"/>
  </g>
  <text x="610" y="120" font-size="14" fill="#333">追加写：消息只进不出，offset 单调递增</text>
  <text x="330" y="60" font-size="15" fill="#333" text-anchor="middle">主题 topic = 分区 0 + 1 + 2（跨 broker 分布）</text>
  <g stroke="#c0392b" stroke-width="1.5" fill="none">
    <line x1="480" y1="60" x2="700" y2="60"/>
  </g>
  <text x="620" y="490" font-size="14" fill="#333" text-anchor="middle">消费可回溯：重复读靠 offset，不删除旧消息</text>
</svg>
