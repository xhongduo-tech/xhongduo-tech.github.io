<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="sans-serif">
  <title>Lambda 架构三层示意</title>
  <desc>数据同时进入批处理层与速度层，两层的计算结果在服务层合并，服务层对外提供查询。</desc>
  <rect x="0" y="0" width="820" height="560" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="330" y="30" width="160" height="54" rx="6"/>
    <rect x="50" y="170" width="200" height="70" rx="6"/>
    <rect x="300" y="170" width="220" height="70" rx="6"/>
    <rect x="570" y="170" width="200" height="70" rx="6"/>
    <rect x="310" y="330" width="200" height="60" rx="6"/>
  </g>
  <text x="410" y="62" font-size="17" fill="#333" text-anchor="middle">数据源（全部原始数据）</text>
  <text x="150" y="210" font-size="16" fill="#1f6f8b" text-anchor="middle">批处理层 Batch</text>
  <text x="410" y="200" font-size="16" fill="#333" text-anchor="middle">速度层 Speed</text>
  <text x="410" y="222" font-size="13" fill="#333" text-anchor="middle">增量 / 近似结果（低延迟）</text>
  <text x="670" y="210" font-size="16" fill="#c0392b" text-anchor="middle">服务层 Serving</text>
  <text x="670" y="232" font-size="13" fill="#333" text-anchor="middle">合并查询：批 + 速</text>
  <text x="410" y="365" font-size="16" fill="#333" text-anchor="middle">对外查询 API</text>
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="410" y1="84" x2="150" y2="170"/>
    <line x1="410" y1="84" x2="410" y2="170"/>
    <polygon points="406,160 410,170 414,160" fill="#333"/>
    <line x1="150" y1="240" x2="570" y2="330"/>
    <line x1="410" y1="240" x2="410" y2="330"/>
    <line x1="570" y1="240" x2="670" y2="330"/>
    <line x1="670" y1="330" x2="410" y2="330"/>
  </g>
  <text x="220" y="130" font-size="13" fill="#333">全量、精确、可重算（慢）</text>
  <text x="470" y="130" font-size="13" fill="#333">新到数据，近似快算（快）</text>
  <text x="610" y="295" font-size="13" fill="#c0392b">合并：批结果 + 增量修正</text>
  <text x="470" y="352" font-size="13" fill="#333">低延迟返回完整答案</text>
  <text x="400" y="500" font-size="15" fill="#333" text-anchor="middle">数据源一份，同时喂给两条路；两条路的结果合起来才是最终答案</text>
  <text x="400" y="530" font-size="14" fill="#333" text-anchor="middle">Kappa 的简化：只保留速度层一条路，用日志重放替代批处理</text>
</svg>
