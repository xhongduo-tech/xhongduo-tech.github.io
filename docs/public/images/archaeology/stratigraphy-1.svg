<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <title>考古地层剖面示意图</title>
  <desc>从表土层到生土的考古地层剖面，标注晚期文化层叠压早期文化层，灰坑与墙基打破早期地层，左侧箭头表示越深越早。</desc>
  <rect x="0" y="0" width="640" height="470" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="320" y="26" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">考古地层剖面：叠压、打破与共存</text>

  <!-- 左侧早晚箭头 -->
  <line x1="28" y1="60" x2="28" y2="385" stroke="#333" stroke-width="2"/>
  <polygon points="28,392 22,378 34,378" fill="#333"/>
  <text x="28" y="48" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">晚</text>
  <text x="28" y="408" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">早</text>

  <!-- 地层带 -->
  <rect x="45" y="40" width="425" height="50" fill="#cbb69a" stroke="#6f5436" stroke-width="1"/>
  <rect x="45" y="90" width="425" height="70" fill="#a8895f" stroke="#6f5436" stroke-width="1"/>
  <rect x="45" y="160" width="425" height="140" fill="#8a6a44" stroke="#6f5436" stroke-width="1"/>
  <rect x="45" y="300" width="425" height="100" fill="#6f5436" stroke="#5a4529" stroke-width="1"/>

  <!-- 灰坑（打破第3层） -->
  <polygon points="116,92 132,92 148,362 192,362 208,92 224,92 194,364 146,364 114,92" fill="#9c4a3a" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="230" font-size="14" fill="#faf9f5" text-anchor="middle">灰坑</text>

  <!-- 墙基（基槽打破早期地层） -->
  <rect x="348" y="90" width="76" height="136" fill="none" stroke="#5a4529" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="358" y="98" width="56" height="120" fill="#d8cfc0" stroke="#333" stroke-width="1.5"/>
  <line x1="358" y1="118" x2="414" y2="98" stroke="#333" stroke-width="1"/>
  <line x1="358" y1="138" x2="414" y2="118" stroke="#333" stroke-width="1"/>
  <line x1="358" y1="158" x2="414" y2="138" stroke="#333" stroke-width="1"/>
  <line x1="358" y1="178" x2="414" y2="158" stroke="#333" stroke-width="1"/>
  <line x1="358" y1="198" x2="414" y2="178" stroke="#333" stroke-width="1"/>
  <text x="386" y="170" font-size="14" fill="#333" text-anchor="middle">墙基</text>

  <!-- 右侧层位标签 -->
  <text x="480" y="66" font-size="14" fill="#333">表土层（耕土/扰土）</text>
  <text x="480" y="126" font-size="14" fill="#333">晚期文化层（第 2 层）</text>
  <text x="480" y="232" font-size="14" fill="#333">早期文化层（第 3 层）</text>
  <text x="480" y="352" font-size="14" fill="#333">生土（未扰动）</text>

  <!-- 图例 -->
  <rect x="45" y="412" width="425" height="46" fill="#fff" stroke="#cbb69a" stroke-width="1"/>
  <text x="60" y="430" font-size="13" fill="#333">叠压：晚层压早层（下层早）</text>
  <text x="60" y="446" font-size="13" fill="#333">打破：被打破者早于打破者（灰坑、墙基）</text>
  <text x="60" y="462" font-size="13" fill="#333">共存：同单位内共出的遗物大致同时</text>
</svg>
