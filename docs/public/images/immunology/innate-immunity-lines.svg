<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif">
  <title>固有免疫防线示意图</title>
  <desc>固有免疫的四道环节：屏障、模式识别、细胞清除、炎症与桥接适应性免疫。</desc>
  <rect x="0" y="0" width="800" height="560" fill="#faf9f5"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">固有免疫的四道防线</text>

  <!-- Layer 1: 屏障 -->
  <rect x="70" y="70" width="660" height="96" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="98" font-size="16" font-weight="bold" fill="#1f6f8b">① 屏障层：把敌人挡在外面</text>
  <text x="100" y="124" font-size="14" fill="#333">物理屏障：皮肤、黏膜纤毛</text>
  <text x="100" y="146" font-size="14" fill="#333">化学屏障：溶菌酶、抗菌肽、胃酸低 pH</text>
  <text x="520" y="124" font-size="14" fill="#333">微生物屏障：正常菌群占位</text>

  <!-- Arrow -->
  <path d="M400 168 L400 196" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="414" y="186" font-size="13" fill="#c0392b">病原体突破</text>

  <!-- Layer 2: 识别 -->
  <rect x="70" y="198" width="660" height="110" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="226" font-size="16" font-weight="bold" fill="#1f6f8b">② 识别层：认敌人共同的脸</text>
  <text x="100" y="254" font-size="14" fill="#333">PAMP：LPS、双链 RNA、肽聚糖、CpG DNA</text>
  <text x="100" y="276" font-size="14" fill="#333">DAMP：HMGB1、ATP（坏死细胞的危险信号）</text>
  <text x="100" y="298" font-size="14" fill="#333">PRR 家族：TLR2/4/5（膜上）、TLR3/7/9（内体）</text>
  <text x="500" y="276" font-size="14" fill="#333">识别者：巨噬细胞</text>
  <text x="500" y="298" font-size="14" fill="#333">识别者：树突状细胞 DC</text>

  <path d="M400 310 L400 338" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: 清除 -->
  <rect x="70" y="340" width="660" height="104" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="368" font-size="16" font-weight="bold" fill="#1f6f8b">③ 清除层：动手</text>
  <text x="100" y="396" font-size="14" fill="#333">吞噬：中性粒细胞（趋化、呼吸爆发）</text>
  <text x="100" y="418" font-size="14" fill="#333">NK 细胞：缺失自我逻辑，杀伤丢失 MHC I 的细胞</text>
  <text x="500" y="396" font-size="14" fill="#333">补体：酶联级联攻膜</text>
  <text x="500" y="418" font-size="14" fill="#333">细胞因子：招募与激活</text>

  <path d="M400 446 L400 474" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: 炎症 + 桥接 -->
  <rect x="70" y="476" width="660" height="66" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="504" font-size="16" font-weight="bold" fill="#1f6f8b">④ 放大与桥接：炎症（红、肿、热、痛）＋ DC 呈递抗原 → 激活适应性免疫</text>
  <text x="100" y="528" font-size="14" fill="#333">传令兵 DC 携抗原到淋巴结，提供共刺激信号，唤醒 T 细胞</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
