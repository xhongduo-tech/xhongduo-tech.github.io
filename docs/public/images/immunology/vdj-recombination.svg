<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="sans-serif">
  <title>V(D)J 重组示意图</title>
  <desc>免疫球蛋白重链基因座位从胚系状态经过 D-J 与 V-DJ 两次重组，剪掉中间 DNA，最终转录为 VDJ 连接的成熟信使 RNA。</desc>
  <rect x="0" y="0" width="800" height="540" fill="#faf9f5"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Ig 重链基因座位的 V(D)J 重组</text>

  <!-- Germline -->
  <text x="60" y="80" font-size="15" font-weight="bold" fill="#1f6f8b">胚系 DNA</text>
  <rect x="60" y="96" width="50" height="34" rx="4" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="85" y="118" text-anchor="middle" font-size="13" fill="#333">V1</text>
  <rect x="130" y="96" width="50" height="34" rx="4" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="155" y="118" text-anchor="middle" font-size="13" fill="#333">Vn</text>
  <line x1="180" y1="113" x2="230" y2="113" stroke="#999" stroke-width="1.5"/>
  <text x="205" y="92" text-anchor="middle" font-size="13" fill="#999">(51 个 V)</text>
  <rect x="230" y="96" width="50" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="118" text-anchor="middle" font-size="13" fill="#333">D1</text>
  <rect x="300" y="96" width="50" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="325" y="118" text-anchor="middle" font-size="13" fill="#333">Dn</text>
  <line x1="350" y1="113" x2="400" y2="113" stroke="#999" stroke-width="1.5"/>
  <text x="375" y="92" text-anchor="middle" font-size="13" fill="#999">(23 个 D)</text>
  <rect x="400" y="96" width="50" height="34" rx="4" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="1.5"/>
  <text x="425" y="118" text-anchor="middle" font-size="13" fill="#333">J1</text>
  <rect x="470" y="96" width="50" height="34" rx="4" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="1.5"/>
  <text x="495" y="118" text-anchor="middle" font-size="13" fill="#333">Jn</text>
  <line x1="520" y1="113" x2="560" y2="113" stroke="#999" stroke-width="1.5"/>
  <rect x="560" y="96" width="70" height="34" rx="4" fill="#efeaf6" stroke="#6c4f9e" stroke-width="1.5"/>
  <text x="595" y="118" text-anchor="middle" font-size="13" fill="#333">恒定区</text>

  <!-- Arrow step 1 -->
  <path d="M400 145 L400 175" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="165" font-size="14" fill="#c0392b">第 1 步：D–J 重排</text>

  <!-- After D-J -->
  <text x="60" y="210" font-size="15" font-weight="bold" fill="#1f6f8b">D–J 重排后</text>
  <rect x="60" y="226" width="50" height="34" rx="4" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="85" y="248" text-anchor="middle" font-size="13" fill="#333">V1</text>
  <rect x="130" y="226" width="50" height="34" rx="4" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="155" y="248" text-anchor="middle" font-size="13" fill="#333">Vn</text>
  <line x1="180" y1="243" x2="230" y2="243" stroke="#999" stroke-width="1.5"/>
  <rect x="230" y="226" width="50" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="248" text-anchor="middle" font-size="13" fill="#333">D</text>
  <rect x="300" y="226" width="50" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="325" y="248" text-anchor="middle" font-size="13" fill="#333">J</text>
  <line x1="350" y1="243" x2="390" y2="243" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#999">删去中间 DNA</text>
  <rect x="410" y="226" width="70" height="34" rx="4" fill="#efeaf6" stroke="#6c4f9e" stroke-width="1.5"/>
  <text x="445" y="248" text-anchor="middle" font-size="13" fill="#333">恒定区</text>

  <!-- Arrow step 2 -->
  <path d="M400 275 L400 305" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="295" font-size="14" fill="#c0392b">第 2 步：V–DJ 重排</text>

  <!-- After V-DJ -->
  <text x="60" y="340" font-size="15" font-weight="bold" fill="#1f6f8b">V–DJ 重排后（含接头 N/P 核苷酸）</text>
  <rect x="60" y="356" width="70" height="34" rx="4" fill="#cfe3ec" stroke="#1f6f8b" stroke-width="2"/>
  <text x="95" y="378" text-anchor="middle" font-size="14" fill="#333">V</text>
  <rect x="150" y="356" width="70" height="34" rx="4" fill="#f7d9cc" stroke="#c0392b" stroke-width="2"/>
  <text x="185" y="378" text-anchor="middle" font-size="14" fill="#333">N/P</text>
  <rect x="240" y="356" width="70" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="2"/>
  <text x="275" y="378" text-anchor="middle" font-size="14" fill="#333">D</text>
  <rect x="330" y="356" width="70" height="34" rx="4" fill="#f7d9cc" stroke="#c0392b" stroke-width="2"/>
  <text x="365" y="378" text-anchor="middle" font-size="14" fill="#333">N/P</text>
  <rect x="420" y="356" width="70" height="34" rx="4" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="2"/>
  <text x="455" y="378" text-anchor="middle" font-size="14" fill="#333">J</text>
  <rect x="510" y="356" width="70" height="34" rx="4" fill="#efeaf6" stroke="#6c4f9e" stroke-width="2"/>
  <text x="545" y="378" text-anchor="middle" font-size="14" fill="#333">恒定区</text>

  <path d="M620 373 L680 373" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="700" y="378" font-size="14" fill="#999">转录 →</text>

  <!-- mRNA -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1f6f8b">成熟 mRNA</text>
  <rect x="60" y="456" width="70" height="34" rx="4" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="95" y="478" text-anchor="middle" font-size="14" fill="#333">V</text>
  <rect x="150" y="456" width="70" height="34" rx="4" fill="#f7d9cc" stroke="#c0392b" stroke-width="2"/>
  <text x="185" y="478" text-anchor="middle" font-size="14" fill="#333">N/P</text>
  <rect x="240" y="456" width="70" height="34" rx="4" fill="#fdf0e4" stroke="#c0392b" stroke-width="2"/>
  <text x="275" y="478" text-anchor="middle" font-size="14" fill="#333">D</text>
  <rect x="330" y="456" width="70" height="34" rx="4" fill="#f7d9cc" stroke="#c0392b" stroke-width="2"/>
  <text x="365" y="478" text-anchor="middle" font-size="14" fill="#333">N/P</text>
  <rect x="420" y="456" width="70" height="34" rx="4" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="2"/>
  <text x="455" y="478" text-anchor="middle" font-size="14" fill="#333">J</text>
  <text x="520" y="478" font-size="14" fill="#333">→</text>
  <text x="545" y="478" font-size="14" fill="#333">翻译为一条</text>
  <text x="545" y="500" font-size="14" fill="#333">独特重链蛋白</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
