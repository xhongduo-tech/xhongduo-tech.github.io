<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="sans-serif">
  <title>补体激活的三条途径</title>
  <desc>经典、凝集素与旁路三条途径汇合到 C3 转化酶，切割 C3 产生 C3a 与 C3b，再经 C5 转化酶组装膜攻击复合物 MAC 在病原体膜上打孔。</desc>
  <rect x="0" y="0" width="800" height="580" fill="#faf9f5"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">补体激活的三条途径</text>

  <!-- Three pathways on left -->
  <rect x="40" y="70" width="220" height="96" rx="8" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="94" font-size="15" font-weight="bold" fill="#1f6f8b">经典途径</text>
  <text x="60" y="118" font-size="13" fill="#333">IgM/IgG 结合抗原 →</text>
  <text x="60" y="138" font-size="13" fill="#333">C1qrs 激活 → C4 + C2</text>
  <text x="60" y="158" font-size="13" fill="#333">→ C4b2a</text>

  <rect x="40" y="186" width="220" height="96" rx="8" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="210" font-size="15" font-weight="bold" fill="#1f6f8b">凝集素途径</text>
  <text x="60" y="234" font-size="13" fill="#333">MBL/ficolin 结合甘露糖 →</text>
  <text x="60" y="254" font-size="13" fill="#333">MASP-1/2 → C4 + C2</text>
  <text x="60" y="274" font-size="13" fill="#333">→ C4b2a</text>

  <rect x="40" y="302" width="220" height="96" rx="8" fill="#eaf2f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="326" font-size="15" font-weight="bold" fill="#1f6f8b">旁路途径</text>
  <text x="60" y="350" font-size="13" fill="#333">C3 自发水解（tick-over）</text>
  <text x="60" y="370" font-size="13" fill="#333">+ 因子 B、因子 D</text>
  <text x="60" y="390" font-size="13" fill="#333">→ C3bBb（正反馈）</text>

  <!-- Arrows to C3 convertase -->
  <path d="M260 118 L330 118 L330 160" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M260 234 L300 234 L300 165" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M260 350 L300 350 L300 170" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- C3 convertase -->
  <rect x="320" y="128" width="180" height="70" rx="8" fill="#fdf0e4" stroke="#c0392b" stroke-width="2.5"/>
  <text x="410" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">C3 转化酶</text>
  <text x="410" y="180" text-anchor="middle" font-size="13" fill="#333">C4b2a / C3bBb</text>

  <!-- Arrow to C3 -->
  <path d="M410 198 L410 240" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- C3 -->
  <rect x="330" y="242" width="160" height="44" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="410" y="269" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">C3</text>

  <!-- Split outputs -->
  <path d="M410 286 L410 330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M410 330 L300 330 L300 350" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M410 330 L520 330 L520 350" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- C3a output -->
  <rect x="180" y="352" width="240" height="54" rx="8" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="2"/>
  <text x="300" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d5b">C3a（过敏毒素）</text>
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#333">招募炎症细胞、趋化</text>

  <!-- C3b output -->
  <rect x="440" y="352" width="180" height="54" rx="8" fill="#eaf7ef" stroke="#2e7d5b" stroke-width="2"/>
  <text x="530" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d5b">C3b</text>
  <text x="530" y="398" text-anchor="middle" font-size="13" fill="#333">调理＋正反馈放大</text>

  <!-- C5 convertase path -->
  <rect x="530" y="200" width="180" height="60" rx="8" fill="#fdf0e4" stroke="#c0392b" stroke-width="2"/>
  <text x="620" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">C5 转化酶</text>
  <text x="620" y="248" text-anchor="middle" font-size="13" fill="#333">C4b2a3b / C3bBb3b</text>
  <path d="M530 230 L520 230 L520 300 L620 300 L620 320" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 260 L620 300" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- MAC -->
  <rect x="480" y="322" width="280" height="84" rx="8" fill="#fff" stroke="#6c4f9e" stroke-width="2.5"/>
  <text x="620" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#6c4f9e">MAC 膜攻击复合物</text>
  <text x="620" y="372" text-anchor="middle" font-size="13" fill="#333">C5b + C6 + C7 + C8 + C9</text>
  <text x="620" y="394" text-anchor="middle" font-size="13" fill="#333">在病原体膜上打孔 → 裂解</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
