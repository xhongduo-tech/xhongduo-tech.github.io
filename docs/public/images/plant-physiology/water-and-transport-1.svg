<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>水势梯度驱动的连续水流</title>
<desc>土壤—根—木质部—叶片—大气的连续水流与水势梯度示意图，水势由土壤(高)到大气(最低)逐级降低。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<g font-family="sans-serif" font-size="15" fill="#333">

<rect x="20" y="300" width="180" height="80" fill="#c9b99a" stroke="#8a6d3b" stroke-width="2"/>
<text x="110" y="350" text-anchor="middle" fill="#333">土壤水（Ψ≈0 MPa）</text>
<text x="110" y="372" text-anchor="middle" fill="#8a6d3b" font-size="13">水势最高</text>

<rect x="240" y="300" width="150" height="80" fill="#bcd4b4" stroke="#3f7a3f" stroke-width="2"/>
<text x="315" y="335" text-anchor="middle" fill="#333">根系吸收</text>
<text x="315" y="360" text-anchor="middle" fill="#3f7a3f" font-size="13">质外体+共质体途径</text>
<text x="315" y="382" text-anchor="middle" fill="#3f7a3f" font-size="13">凯氏带把关</text>

<rect x="440" y="120" width="160" height="80" fill="#cfe0ee" stroke="#1f6f8b" stroke-width="2"/>
<text x="520" y="155" text-anchor="middle" fill="#333">木质部</text>
<text x="520" y="178" text-anchor="middle" fill="#1f6f8b" font-size="13">负压水柱（−0.5~−2 MPa）</text>
<text x="520" y="200" text-anchor="middle" fill="#1f6f8b" font-size="13">内聚力—张力拉动</text>

<rect x="240" y="120" width="150" height="80" fill="#a8d8a8" stroke="#2e7d32" stroke-width="2"/>
<text x="315" y="155" text-anchor="middle" fill="#333">叶片</text>
<text x="315" y="178" text-anchor="middle" fill="#2e7d32" font-size="13">气孔蒸腾</text>
<text x="315" y="200" text-anchor="middle" fill="#2e7d32" font-size="13">水→水蒸气</text>

<rect x="440" y="20" width="160" height="60" fill="#f5d9a0" stroke="#c0392b" stroke-width="2"/>
<text x="520" y="48" text-anchor="middle" fill="#c0392b">大气（水势极低）</text>
<text x="520" y="68" text-anchor="middle" fill="#c0392b" font-size="13">水势最低</text>

<path d="M 200 340 L 240 340" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 315 300 L 315 200" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 315 200 L 440 200" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 520 120 L 520 80" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>

<text x="80" y="265" fill="#666" font-size="13">水势梯度：</text>
<text x="80" y="285" fill="#c0392b" font-size="13">土壤 → 根 → 木质部 → 叶 → 大气（逐级降低）</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
</marker>
</defs>
</g>
</svg>
