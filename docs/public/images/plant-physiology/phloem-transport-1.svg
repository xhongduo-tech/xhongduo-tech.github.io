<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>韧皮部压流假说示意图</title>
<desc>源叶装载蔗糖、渗透吸水升压、压力差推动汁液流向库端并卸载蔗糖。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<g font-family="sans-serif" font-size="15" fill="#333">

<rect x="30" y="40" width="200" height="120" fill="#a8d8a8" stroke="#2e7d32" stroke-width="2"/>
<text x="130" y="80" text-anchor="middle" fill="#2e7d32">源（成熟叶）</text>
<text x="130" y="105" text-anchor="middle" font-size="14">主动装载蔗糖 ↑</text>
<text x="130" y="130" text-anchor="middle" font-size="14">水渗入筛管，压力↑</text>

<rect x="410" y="40" width="200" height="120" fill="#c9b99a" stroke="#8a6d3b" stroke-width="2"/>
<text x="510" y="80" text-anchor="middle" fill="#8a6d3b">库（根尖/果实）</text>
<text x="510" y="105" text-anchor="middle" font-size="14">卸载蔗糖 ↓</text>
<text x="510" y="130" text-anchor="middle" font-size="14">水渗出，压力↓</text>

<!-- 筛管 -->
<rect x="200" y="105" width="240" height="36" fill="#cfe0ee" stroke="#1f6f8b" stroke-width="2"/>
<line x1="280" y1="105" x2="280" y2="141" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4,3"/>
<line x1="360" y1="105" x2="360" y2="141" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4,3"/>
<text x="320" y="130" text-anchor="middle" fill="#1f6f8b">汁液流动（压力梯度驱动）→</text>

<!-- 水循环 -->
<path d="M 250 200 L 250 170 L 250 141" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="190" fill="#c0392b" font-size="13">水渗入</text>
<path d="M 390 141 L 390 170 L 390 200" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="190" fill="#c0392b" font-size="13">水渗出</text>
<rect x="240" y="200" width="160" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="320" y="225" text-anchor="middle">木质部（水循环）</text>
<text x="320" y="248" text-anchor="middle" font-size="13">水：木质部→筛管→木质部</text>

<text x="320" y="310" text-anchor="middle" fill="#666" font-size="13">源端高渗吸水升压，库端卸载泄压 → 压力差推动整体流动</text>
<text x="320" y="340" text-anchor="middle" fill="#c0392b" font-size="14"><tspan font-weight="bold">驱动力 = 源库渗透压差派生的压力差</tspan></text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
</marker>
</defs>
</g>
</svg>
