<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>Z 型电子传递示意图</title>
<desc>类囊体膜上 PSII 与 PSI 串联的 Z 型电子传递：水裂解、PQ/b6f 泵质子、ATP 合酶与 NADPH 还原。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" font-size="15" fill="#333">

<!-- 膜 -->
<rect x="30" y="200" width="580" height="30" fill="#cfe0ee" stroke="#1f6f8b" stroke-width="2"/>
<text x="600" y="222" text-anchor="end" fill="#1f6f8b" font-size="13">类囊体膜</text>
<text x="60" y="180" fill="#1f6f8b" font-size="13">腔（H⁺ 高）</text>
<text x="60" y="260" fill="#1f6f8b" font-size="13">基质（H⁺ 低）</text>

<!-- 能量台阶 -->
<path d="M 100 330 L 100 150" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="110" y="140" fill="#c0392b" font-size="13">光能 ↑</text>

<!-- PSII -->
<rect x="140" y="200" width="120" height="30" fill="#a8d8a8" stroke="#2e7d32" stroke-width="2"/>
<text x="200" y="222" text-anchor="middle" fill="#2e7d32" font-size="14">PSII (P680)</text>
<text x="200" y="290" text-anchor="middle" fill="#2e7d32">2H₂O → O₂ + 4H⁺ + 4e⁻</text>
<line x1="200" y1="230" x2="200" y2="285" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,3"/>

<!-- PSI -->
<rect x="430" y="200" width="120" height="30" fill="#a8d8a8" stroke="#2e7d32" stroke-width="2"/>
<text x="490" y="222" text-anchor="middle" fill="#2e7d32" font-size="14">PSI (P700)</text>
<text x="490" y="150" text-anchor="middle" fill="#2e7d32">NADP⁺ + 2e⁻ + H⁺ → NADPH</text>
<line x1="490" y1="230" x2="490" y2="155" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,3"/>

<!-- 电子路径：Z 形 -->
<path d="M 200 200 L 200 330 L 490 330 L 490 200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="345" y="365" text-anchor="middle" fill="#333">电子下行：PQ → b6f → PC（泵 H⁺ 入腔）</text>

<!-- b6f -->
<rect x="300" y="200" width="90" height="30" fill="#f5d9a0" stroke="#c0392b" stroke-width="2"/>
<text x="345" y="222" text-anchor="middle" fill="#c0392b" font-size="14">b6f</text>

<!-- ATP 合酶 -->
<rect x="560" y="215" width="50" height="120" fill="#f5d9a0" stroke="#c0392b" stroke-width="2"/>
<text x="585" y="265" text-anchor="middle" fill="#c0392b" font-size="14">ATP</text>
<text x="585" y="285" text-anchor="middle" fill="#c0392b" font-size="14">合酶</text>
<path d="M 545 240 L 560 240" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="505" y="245" fill="#c0392b" font-size="13">H⁺ 回流</text>

<text x="30" y="410" fill="#666" font-size="13">光能 → 电子高能位 → 下行做功 → NADPH + ATP</text>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
</marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
</marker>
</defs>
</g>
</svg>
