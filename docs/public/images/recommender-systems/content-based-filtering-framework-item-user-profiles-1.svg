<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>基于内容推荐的基本流程</title>
  <desc>物品属性构成物品画像，用户历史行为加权聚合为用户画像，两者做余弦相似度匹配，取 Top-N 输出推荐列表。</desc>
  <rect x="0" y="0" width="720" height="280" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <rect x="30" y="30" width="180" height="66" rx="6" fill="#fff"/>
    <rect x="270" y="30" width="180" height="66" rx="6" fill="#fff"/>
    <rect x="30" y="150" width="180" height="66" rx="6" fill="#fff"/>
    <rect x="270" y="150" width="180" height="66" rx="6" fill="#fff"/>
    <rect x="510" y="72" width="180" height="66" rx="6" fill="#fff"/>
    <rect x="510" y="176" width="180" height="66" rx="6" fill="#fff"/>
  </g>
  <g fill="#333" font-size="14">
    <text x="120" y="54" text-anchor="middle">物品属性</text>
    <text x="120" y="76" text-anchor="middle" fill="#666">标题 · 简介 · 类目</text>
    <text x="120" y="184" text-anchor="middle">用户历史行为</text>
    <text x="120" y="206" text-anchor="middle" fill="#666">看过 / 点过的物品</text>
    <text x="360" y="54" text-anchor="middle" fill="#1f6f8b">物品画像 i</text>
    <text x="360" y="76" text-anchor="middle" fill="#666">特征向量</text>
    <text x="360" y="184" text-anchor="middle" fill="#1f6f8b">用户画像 u</text>
    <text x="360" y="206" text-anchor="middle" fill="#666">加权聚合</text>
    <text x="600" y="98" text-anchor="middle" fill="#c0392b">相似度匹配</text>
    <text x="600" y="120" text-anchor="middle" fill="#666">cos(u, i)</text>
    <text x="600" y="202" text-anchor="middle" fill="#333">Top-N 推荐列表</text>
    <text x="600" y="224" text-anchor="middle" fill="#666">1. 电影A　2. 电影B</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M210 63 C 236 63, 244 63, 268 63" marker-end="url(#ar1)"/>
    <path d="M210 183 C 236 183, 244 183, 268 183" marker-end="url(#ar1)"/>
    <path d="M450 70 C 474 76, 486 84, 508 92" marker-end="url(#ar1)"/>
    <path d="M450 172 C 474 166, 486 160, 508 152" marker-end="url(#ar1)"/>
    <path d="M600 138 L 600 174" marker-end="url(#ar1)"/>
  </g>
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
