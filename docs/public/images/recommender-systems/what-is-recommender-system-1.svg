<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">长尾分布曲线：头部热门内容与长尾冷门内容</title>
  <desc id="desc">一张热度随排名下降的曲线图。横轴为按热度降序排列的物品，纵轴为热度（访问量或销量）。曲线在左侧急剧下降：最左边极少数物品热度极高，构成陡峭的「头部」；曲线随后趋平并延伸得很长，代表大量单件热度极低的冷门物品，构成「长尾」。一条虚线示意头部与长尾的分界。图注说明：推荐系统把这条沉睡的长尾叫醒，让冷门内容也能找到自己的受众。</desc>

  <!-- 纸底 -->
  <rect width="760" height="460" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="380" y="34" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">长尾分布：头部与长尾</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="60" x2="60" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="400" x2="740" y2="400" stroke="#333" stroke-width="1.5"/>
  <polygon points="740,400 730,396 730,404" fill="#333"/>
  <polygon points="60,60 64,70 56,70" fill="#333"/>

  <!-- 头部区域（红，低透明度）：x 60 → 230 -->
  <path d="M 60 400 L 60 80 L 94 105.2 L 128 129.6 L 162 153.3 L 196 176.1 L 230 198.1 L 230 400 Z" fill="#c0392b" fill-opacity="0.18"/>

  <!-- 长尾区域（青，低透明度）：x 230 → 740 -->
  <path d="M 230 400 L 230 198.1 L 264 219.1 L 332 258.7 L 400 294.4 L 468 326.1 L 536 353.4 L 604 375.6 L 672 392.0 L 740 400 Z" fill="#1f6f8b" fill-opacity="0.18"/>

  <!-- 长尾分布曲线 -->
  <path d="M 60 80 L 94 105.2 L 128 129.6 L 162 153.3 L 196 176.1 L 230 198.1 L 264 219.1 L 332 258.7 L 400 294.4 L 468 326.1 L 536 353.4 L 604 375.6 L 672 392.0 L 740 400" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 头部/长尾分界线（虚线） -->
  <line x1="230" y1="400" x2="230" y2="180" stroke="#666" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="238" y="388" font-size="13" fill="#666">分界</text>

  <!-- 标签 -->
  <text x="145" y="52" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">头部（热门内容）</text>
  <text x="560" y="52" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">长尾（冷门内容）</text>
  <text x="145" y="168" text-anchor="middle" font-size="14" fill="#c0392b">少数物品，热度极高</text>
  <text x="560" y="170" text-anchor="middle" font-size="14" fill="#1f6f8b">大量物品，单件热度低，总和可观</text>

  <!-- 轴标签 -->
  <text x="26" y="240" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 26 240)">热度（访问量 / 销量）</text>
  <text x="400" y="440" text-anchor="middle" font-size="15" fill="#333">物品（按热度降序排名）</text>

  <!-- 底部说明 -->
  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#666">推荐系统把这根「沉睡的长尾」叫醒：让冷门内容也能找到自己的受众</text>
</svg>
