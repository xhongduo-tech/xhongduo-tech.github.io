<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
  <title>ItemCF 物品相似度计算示意</title>
  <desc>三个用户都同时购买了《机器学习实战》与《Python 数据分析》，两本书的共同购买用户数为 3，相似度很高。</desc>
  <rect width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">ItemCF：被同一批用户购买的物品，彼此相似</text>

  <g>
    <circle cx="200" cy="160" r="26" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.5"/>
    <circle cx="200" cy="300" r="26" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.5"/>
  </g>
  <g fill="#333" font-size="14" text-anchor="middle">
    <text x="200" y="164">i1</text>
    <text x="200" y="304">i2</text>
  </g>
  <g fill="#1f6f8b" font-size="14" text-anchor="middle">
    <text x="200" y="120">《机器学习实战》</text>
    <text x="200" y="260">《Python 数据分析》</text>
  </g>

  <g fill="#1f6f8b">
    <circle cx="620" cy="110" r="22"/>
    <circle cx="620" cy="230" r="22"/>
    <circle cx="620" cy="350" r="22"/>
  </g>
  <g fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="620" y="115">u1</text>
    <text x="620" y="235">u2</text>
    <text x="620" y="355">u3</text>
  </g>

  <g stroke="#c0392b" stroke-width="2">
    <line x1="200" y1="160" x2="620" y2="110"/>
    <line x1="200" y1="160" x2="620" y2="230"/>
    <line x1="200" y1="160" x2="620" y2="350"/>
    <line x1="200" y1="300" x2="620" y2="110"/>
    <line x1="200" y1="300" x2="620" y2="230"/>
    <line x1="200" y1="300" x2="620" y2="350"/>
  </g>

  <text x="400" y="420" text-anchor="middle" font-size="15" fill="#333">u1、u2、u3 都同时买过 i1 与 i2，共同购买用户数为 3</text>
  <text x="400" y="446" text-anchor="middle" font-size="15" fill="#c0392b">w(i1, i2) = 3 / √(3×3) = 1.0</text>
</svg>
