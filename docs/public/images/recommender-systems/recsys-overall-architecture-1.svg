<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 700" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">推荐系统四层漏斗：召回、粗排、精排与重排</title>
  <desc id="desc">一个从上到下逐级收窄的四层漏斗示意图。顶部最宽，代表全量候选物品（约 10 亿）；第一层召回把它压缩到约 1000 个；第二层粗排压到约 500 个；第三层精排压到约 100 个；第四层重排输出最终展示的约 20 个。每层标注了职责：召回层守「不丢」，粗排与精排层守「排准」，重排层守「可接受」（多样性、业务规则）。底部说明：每一层用不同量级的模型匹配不同量级的候选，逐级把候选集压小。</desc>

  <!-- 纸底 -->
  <rect width="620" height="700" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="310" y="38" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">推荐系统四层漏斗</text>

  <!-- 漏斗层 1：召回（最宽，红） -->
  <polygon points="60,90 560,90 520,200 100,200" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="1.6"/>
  <text x="310" y="130" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">召回层 Recall</text>
  <text x="310" y="152" text-anchor="middle" font-size="14" fill="#333">多路并集 · 轻量模型 · 守「不丢」</text>

  <!-- 漏斗层 2：粗排（青） -->
  <polygon points="100,200 520,200 460,310 160,310" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="310" y="240" text-anchor="middle" font-size="17" fill="#1f6f8b" font-weight="bold">粗排层 Coarse</text>
  <text x="310" y="262" text-anchor="middle" font-size="14" fill="#333">双塔 / 蒸馏模型 · 再筛一轮</text>

  <!-- 漏斗层 3：精排（红） -->
  <polygon points="160,310 460,310 420,420 200,420" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="1.6"/>
  <text x="310" y="350" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">精排层 Fine</text>
  <text x="310" y="372" text-anchor="middle" font-size="14" fill="#333">深度 CTR 模型 · 守「排准」</text>

  <!-- 漏斗层 4：重排（青） -->
  <polygon points="200,420 420,420 250,530 250,530 370,530 370,530" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="310" y="460" text-anchor="middle" font-size="17" fill="#1f6f8b" font-weight="bold">重排层 Rerank</text>
  <text x="310" y="482" text-anchor="middle" font-size="14" fill="#333">多样性 · 业务规则 · 守「可接受」</text>

  <!-- 各层候选量标注（右侧） -->
  <text x="584" y="145" text-anchor="end" font-size="14" fill="#333">10⁹ → 10³</text>
  <text x="584" y="255" text-anchor="end" font-size="14" fill="#333">10³ → 5×10²</text>
  <text x="584" y="365" text-anchor="end" font-size="14" fill="#333">5×10² → 10²</text>
  <text x="584" y="475" text-anchor="end" font-size="14" fill="#333">10² → 2×10</text>

  <!-- 顶部全量输入标注 -->
  <text x="310" y="72" text-anchor="middle" font-size="14" fill="#666">全量候选：约 10⁹（上亿物品）</text>

  <!-- 底部输出标注 -->
  <text x="310" y="560" text-anchor="middle" font-size="14" fill="#666">最终展示：约 20 个</text>

  <!-- 图注 -->
  <line x1="60" y1="600" x2="560" y2="600" stroke="#e0dcd3" stroke-width="1"/>
  <text x="310" y="628" text-anchor="middle" font-size="13" fill="#666">每一层用不同量级的模型，匹配不同量级的候选</text>
  <text x="310" y="650" text-anchor="middle" font-size="13" fill="#666">整体漏损是连乘：R = R_recall × R_coarse × R_rank，前层不丢是关键</text>
</svg>
