<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Skip-gram 网络结构</title>
  <desc>中心词的 one-hot 向量经查表 W 得到 K 维嵌入向量，再经 W' 投影为各候选词的得分，经 softmax 输出上下文词的概率。</desc>
  <rect x="0" y="0" width="720" height="260" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <rect x="30" y="80" width="170" height="100" rx="6" fill="#fff"/>
    <rect x="280" y="80" width="160" height="100" rx="6" fill="#fff"/>
    <rect x="520" y="20" width="180" height="220" rx="6" fill="#fff"/>
  </g>
  <g fill="#333" font-size="14">
    <text x="115" y="112" text-anchor="middle">中心词 w_t</text>
    <text x="115" y="138" text-anchor="middle" fill="#666">one-hot，V 维</text>
    <text x="115" y="162" text-anchor="middle" fill="#666">(V 为词典大小)</text>
    <text x="360" y="112" text-anchor="middle" fill="#1f6f8b">嵌入向量 v_w</text>
    <text x="360" y="138" text-anchor="middle" fill="#666">稠密，K 维</text>
    <text x="360" y="162" text-anchor="middle" fill="#666">(K 通常 100~300)</text>
    <text x="610" y="52" text-anchor="middle" fill="#c0392b">softmax 概率</text>
    <text x="610" y="92" text-anchor="middle" fill="#333">P(w_{t-2} | w_t)</text>
    <text x="610" y="126" text-anchor="middle" fill="#333">P(w_{t-1} | w_t)</text>
    <text x="610" y="166" text-anchor="middle" fill="#666">… 上下文窗口内 …</text>
    <text x="610" y="202" text-anchor="middle" fill="#333">P(w_{t+2} | w_t)</text>
    <text x="610" y="230" text-anchor="middle" fill="#666">对全部 V 个词打分</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M200 122 C 234 122, 246 122, 278 122" marker-end="url(#ar2)"/>
    <path d="M440 122 C 474 122, 486 122, 518 122" marker-end="url(#ar2)"/>
  </g>
  <g fill="#666" font-size="13">
    <text x="240" y="110" text-anchor="middle">查表 W</text>
    <text x="240" y="140" text-anchor="middle">(V × K)</text>
    <text x="480" y="110" text-anchor="middle">W'</text>
    <text x="480" y="140" text-anchor="middle">(K × V)</text>
  </g>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
