<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
<title>蛇引理通勤图与连接同态 δ</title>
<desc>上下两行精确的短正合列 0 → A → B → C → 0 与 0 → A' → B' → C' → 0，纵向箭头 α、β、γ，红色虚线曲线表示连接同态 δ：ker γ → coker α。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#333"/>
</marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
<text x="320" y="40" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">蛇引理：核列与余核列被连接同态 δ 精确焊接</text>

<!-- 上行 -->
<text x="55" y="115" text-anchor="middle" font-size="15" fill="#333">0</text>
<text x="110" y="115" text-anchor="middle" font-size="15" fill="#333">A</text>
<line x1="70" y1="105" x2="95" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="125" y1="105" x2="245" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="185" y="97" text-anchor="middle" font-size="13" fill="#333">f</text>
<line x1="275" y1="105" x2="395" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="335" y="97" text-anchor="middle" font-size="13" fill="#333">g</text>
<text x="410" y="115" text-anchor="middle" font-size="15" fill="#333">C</text>
<text x="525" y="115" text-anchor="middle" font-size="15" fill="#333">0</text>
<line x1="425" y1="105" x2="510" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

<!-- 下行 -->
<text x="55" y="315" text-anchor="middle" font-size="15" fill="#333">0</text>
<text x="110" y="315" text-anchor="middle" font-size="15" fill="#333">A′</text>
<line x1="70" y1="305" x2="95" y2="305" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="125" y1="305" x2="245" y2="305" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="185" y="327" text-anchor="middle" font-size="13" fill="#333">f′</text>
<line x1="275" y1="305" x2="395" y2="305" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="335" y="327" text-anchor="middle" font-size="13" fill="#333">g′</text>
<text x="410" y="315" text-anchor="middle" font-size="15" fill="#333">C′</text>
<text x="525" y="315" text-anchor="middle" font-size="15" fill="#333">0</text>
<line x1="425" y1="305" x2="510" y2="305" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

<!-- 纵向箭头 -->
<line x1="110" y1="130" x2="110" y2="285" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="120" y="212" font-size="13" fill="#333">α</text>
<line x1="260" y1="130" x2="260" y2="285" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="270" y="212" font-size="13" fill="#333">β</text>
<line x1="410" y1="130" x2="410" y2="285" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="420" y="212" font-size="13" fill="#333">γ</text>

<!-- 蛇 δ -->
<path d="M 420 130 C 470 250, 180 260, 118 272" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arR)"/>
<text x="280" y="252" font-size="15" fill="#c0392b" font-weight="bold">δ</text>

<!-- 标注 -->
<text x="452" y="92" font-size="13" fill="#1f6f8b">ker γ</text>
<text x="78" y="342" font-size="13" fill="#1f6f8b">coker α</text>

<text x="320" y="392" text-anchor="middle" font-size="13" fill="#666">上下两行精确：im f = ker g，im f′ = ker g′（行两端有 0 保证满射 / 单射）</text>
<text x="320" y="418" text-anchor="middle" font-size="13" fill="#666">红色 δ 不来自任何现成箭头：抬-落-回拉-商 四步绕出</text>
</svg>
