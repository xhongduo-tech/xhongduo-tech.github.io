<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
<title>谱序列各页微分越来越斜</title>
<desc>第一象限谱序列的格子图：红色横向箭头是 d1，青色斜向箭头是 d2，黑色长斜箭头是 d3，微分随 r 增大越来越斜，逐页浓缩后收敛到极限页 E∞。</desc>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
</defs>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">第 r 页的格子与微分：dʳ 随 r 越来越斜</text>

<!-- 格子点 p,q = 0..3 -->
<g fill="#333">
<circle cx="160" cy="320" r="6"/><circle cx="215" cy="320" r="6"/><circle cx="270" cy="320" r="6"/><circle cx="325" cy="320" r="6"/>
<circle cx="160" cy="265" r="6"/><circle cx="215" cy="265" r="6"/><circle cx="270" cy="265" r="6"/><circle cx="325" cy="265" r="6"/>
<circle cx="160" cy="210" r="6"/><circle cx="215" cy="210" r="6"/><circle cx="270" cy="210" r="6"/><circle cx="325" cy="210" r="6"/>
<circle cx="160" cy="155" r="6"/><circle cx="215" cy="155" r="6"/><circle cx="270" cy="155" r="6"/><circle cx="325" cy="155" r="6"/>
</g>

<!-- 轴 -->
<text x="360" y="338" font-size="14" fill="#666">p →</text>
<text x="142" y="138" font-size="14" fill="#666">q ↑</text>

<!-- d1 横向（红） -->
<line x1="218" y1="317" x2="267" y2="317" stroke="#c0392b" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="236" y="352" text-anchor="middle" font-size="14" fill="#c0392b">d¹ 横向：p 减 1，q 不变</text>

<!-- d2 斜一步（青） -->
<line x1="270" y1="262" x2="164" y2="212" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#mc)"/>
<text x="196" y="226" font-size="14" fill="#1f6f8b">d²</text>

<!-- d3 更长斜（黑） -->
<line x1="322" y1="262" x2="164" y2="157" stroke="#333" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mk)"/>
<text x="244" y="188" font-size="14" fill="#333">d³</text>

<!-- 右侧说明 -->
<text x="400" y="90" font-size="14" fill="#333" font-weight="bold">进化律</text>
<text x="400" y="116" font-size="14" fill="#333">Eʳ⁺¹ = H(Eʳ, dʳ)</text>
<text x="400" y="150" font-size="14" fill="#333">dʳ：(p,q) → (p−r, q+r−1)</text>
<text x="400" y="184" font-size="14" fill="#333">总维数 p+q 守恒</text>
<text x="400" y="230" font-size="14" fill="#333" font-weight="bold">收敛</text>
<text x="400" y="256" font-size="14" fill="#333">r → ∞ 得极限页 E∞</text>
<text x="400" y="282" font-size="14" fill="#333">E∞_{p,q} ≅ F_pH_{p+q}/F_{p−1}H_{p+q}</text>

<text x="320" y="388" text-anchor="middle" font-size="13" fill="#666">红色横向 d¹ → 青色斜向 d² → 黑色更长斜 d³：每一页都更「斜」，信息逐页浓缩</text>
</svg>
