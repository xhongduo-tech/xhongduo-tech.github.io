<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>氢能价值链</title>
<desc>氢能系统集成示意图：一次能源经制氢、储运环节，通向工业用氢、燃料电池发电、加氢站与热电联供等终端用能。</desc>
<rect width="720" height="300" fill="#fff"/>
<!-- stage 1: 一次能源 -->
<rect x="30" y="100" width="130" height="80" rx="10" fill="#fdf2e9" stroke="#c0392b" stroke-width="2"/>
<text x="95" y="130" text-anchor="middle" fill="#333" font-size="14">一次能源</text>
<text x="95" y="150" text-anchor="middle" fill="#666" font-size="13">风光水核</text>
<text x="95" y="168" text-anchor="middle" fill="#666" font-size="13">电网 / 弃电</text>
<!-- stage 2: 制氢 -->
<rect x="210" y="100" width="130" height="80" rx="10" fill="#eef6fa" stroke="#1f6f8b" stroke-width="2"/>
<text x="275" y="130" text-anchor="middle" fill="#333" font-size="14">制氢</text>
<text x="275" y="150" text-anchor="middle" fill="#666" font-size="13">电解水</text>
<text x="275" y="168" text-anchor="middle" fill="#666" font-size="13">蒸汽重整</text>
<!-- stage 3: 储运 -->
<rect x="390" y="100" width="130" height="80" rx="10" fill="#eef6fa" stroke="#1f6f8b" stroke-width="2"/>
<text x="455" y="130" text-anchor="middle" fill="#333" font-size="14">储运</text>
<text x="455" y="150" text-anchor="middle" fill="#666" font-size="13">高压 / 液氢</text>
<text x="455" y="168" text-anchor="middle" fill="#666" font-size="13">氨 / 管道 / 拖车</text>
<!-- stage 4: 用能 -->
<rect x="570" y="100" width="120" height="80" rx="10" fill="#eafaf0" stroke="#2e7d32" stroke-width="2"/>
<text x="630" y="130" text-anchor="middle" fill="#333" font-size="14">终端用能</text>
<text x="630" y="150" text-anchor="middle" fill="#666" font-size="13">发电 / 工业</text>
<text x="630" y="168" text-anchor="middle" fill="#666" font-size="13">交通 / 供热</text>
<!-- arrows between stages -->
<g stroke="#333" stroke-width="2" fill="none">
  <line x1="160" y1="140" x2="208" y2="140"/>
  <line x1="340" y1="140" x2="388" y2="140"/>
  <line x1="520" y1="140" x2="568" y2="140"/>
</g>
<polygon points="208,136 220,140 208,144" fill="#333"/>
<polygon points="388,136 400,140 388,144" fill="#333"/>
<polygon points="568,136 580,140 568,144" fill="#333"/>
<!-- feedback loop label -->
<text x="400" y="85" text-anchor="middle" fill="#c0392b" font-size="13">能量逐级损耗，链上总效率 = 各环节效率相乘</text>
<!-- terminal uses labels below -->
<text x="95" y="222" text-anchor="middle" fill="#333" font-size="13">电解槽 (65–75%)</text>
<text x="275" y="222" text-anchor="middle" fill="#333" font-size="13">储运 (85–95%)</text>
<text x="455" y="222" text-anchor="middle" fill="#333" font-size="13">燃料电池 (45–60%)</text>
<text x="630" y="222" text-anchor="middle" fill="#333" font-size="13">工业还原 / FCEV / CHP</text>
</svg>
