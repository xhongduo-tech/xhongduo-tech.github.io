<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif">
  <title>正 Cotton 效应：ORD 与 CD 曲线</title>
  <desc>横轴为波长，纵轴为旋光度与圆二色信号。青色 S 形曲线为 ORD：长波侧出现波峰、短波侧出现波谷，在吸收峰波长 λ0 处变号；红色虚线钟形曲线为 CD：以 λ0 为中心呈单一正吸收带。</desc>
  <rect width="640" height="340" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="50" x2="80" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="170" x2="600" y2="170" stroke="#333" stroke-width="2"/>
  <text x="30" y="180" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 30 180)">旋光度 / Δε</text>
  <text x="520" y="198" text-anchor="middle" font-size="13" fill="#333">波长 λ（增加 →）</text>

  <!-- 吸收峰位置 -->
  <line x1="430" y1="60" x2="430" y2="300" stroke="#666" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="430" y="46" text-anchor="middle" font-size="13" fill="#666">λ₀（吸收峰）</text>

  <!-- ORD：正 Cotton 效应 -->
  <path d="M 300 170 C 330 250, 370 265, 395 265 C 415 265, 427 215, 430 170 C 433 125, 445 75, 468 75 C 495 75, 520 110, 560 170" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="486" y="66" text-anchor="middle" font-size="13" fill="#1f6f8b">波峰（长波侧）</text>
  <text x="380" y="286" text-anchor="middle" font-size="13" fill="#1f6f8b">波谷（短波侧）</text>

  <!-- CD：钟形带 -->
  <path d="M 300 170 C 330 170, 355 120, 375 104 C 395 90, 410 85, 430 85 C 450 85, 465 90, 485 104 C 505 120, 530 170, 560 170" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- 图例 -->
  <line x1="120" y1="316" x2="150" y2="316" stroke="#1f6f8b" stroke-width="3"/>
  <text x="158" y="320" font-size="13" fill="#333">ORD（正 Cotton 效应）</text>
  <line x1="330" y1="316" x2="360" y2="316" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="368" y="320" font-size="13" fill="#333">CD（Δε，以 λ₀ 为中心）</text>
</svg>
