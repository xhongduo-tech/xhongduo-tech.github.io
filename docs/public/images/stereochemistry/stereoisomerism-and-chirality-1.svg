<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif">
  <title>一对互为镜像的手性中心（对映体）</title>
  <desc>左右两个四面体碳原子互为正像与镜像：连接相同的四个不同基团，楔形实线键表示伸向纸外，虚线键表示伸向纸内；镜像不能重合，恰如左手与右手。</desc>
  <rect width="640" height="320" fill="#faf9f5"/>
  <line x1="320" y1="40" x2="320" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#c0392b">镜面（mirror）</text>

  <!-- 左侧分子：C 在 (160,170) -->
  <line x1="160" y1="170" x2="160" y2="60" stroke="#333" stroke-width="3"/>
  <line x1="160" y1="170" x2="55" y2="250" stroke="#333" stroke-width="3"/>
  <line x1="160" y1="170" x2="50" y2="105" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="160,170 254,238 266,252" fill="#333"/>
  <circle cx="160" cy="170" r="11" fill="#333"/>
  <circle cx="160" cy="60" r="6" fill="#9aa0a6"/>
  <circle cx="55" cy="250" r="9" fill="#c0392b"/>
  <circle cx="50" cy="105" r="8" fill="#1f6f8b"/>
  <circle cx="260" cy="245" r="9" fill="#2e8b57"/>
  <text x="160" y="42" text-anchor="middle" font-size="14" fill="#333">H</text>
  <text x="160" y="180" text-anchor="middle" font-size="14" fill="#fff">C</text>
  <text x="36" y="102" text-anchor="end" font-size="14" fill="#1f6f8b">F</text>
  <text x="38" y="268" text-anchor="end" font-size="14" fill="#c0392b">Br</text>
  <text x="280" y="262" text-anchor="start" font-size="14" fill="#2e8b57">Cl</text>

  <!-- 右侧分子：镜像，C 在 (480,170) -->
  <line x1="480" y1="170" x2="480" y2="60" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="170" x2="585" y2="250" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="170" x2="590" y2="105" stroke="#333" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="480,170 375,238 385,252" fill="#333"/>
  <circle cx="480" cy="170" r="11" fill="#333"/>
  <circle cx="480" cy="60" r="6" fill="#9aa0a6"/>
  <circle cx="585" cy="250" r="9" fill="#c0392b"/>
  <circle cx="590" cy="105" r="8" fill="#1f6f8b"/>
  <circle cx="380" cy="245" r="9" fill="#2e8b57"/>
  <text x="480" y="42" text-anchor="middle" font-size="14" fill="#333">H</text>
  <text x="480" y="180" text-anchor="middle" font-size="14" fill="#fff">C</text>
  <text x="604" y="102" text-anchor="start" font-size="14" fill="#1f6f8b">F</text>
  <text x="602" y="268" text-anchor="start" font-size="14" fill="#c0392b">Br</text>
  <text x="364" y="262" text-anchor="end" font-size="14" fill="#2e8b57">Cl</text>

  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#333">互为镜像、不能重合：一对「左手与右手」式的立体异构体——对映体（enantiomers）</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#666">楔形粗键：伸向纸外（朝观察者）；虚线键：伸向纸内</text>
</svg>
