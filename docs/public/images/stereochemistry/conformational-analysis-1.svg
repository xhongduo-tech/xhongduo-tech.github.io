<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <title>椅式环己烷：直立键与平伏键、1,3-双直立键斥力</title>
  <desc>环己烷椅式构象的示意六元环：碳原子 C1 到 C6；红色为直立键（轴向），上下交替；蓝色为平伏键（赤道），近似平行于环边；C1 与 C3 的两个直立键之间的红色虚线双箭头表示 1,3-双直立键斥力。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>

  <!-- 环骨架（示意平面投影） -->
  <polygon points="150,200 260,200 315,270 260,340 150,340 95,270" fill="none" stroke="#333" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 碳原子标记 -->
  <text x="150" y="190" text-anchor="middle" font-size="13" fill="#666">C1</text>
  <text x="260" y="190" text-anchor="middle" font-size="13" fill="#666">C2</text>
  <text x="322" y="272" text-anchor="start" font-size="13" fill="#666">C3</text>
  <text x="260" y="352" text-anchor="middle" font-size="13" fill="#666">C4</text>
  <text x="150" y="352" text-anchor="middle" font-size="13" fill="#666">C5</text>
  <text x="80" y="272" text-anchor="end" font-size="13" fill="#666">C6</text>

  <!-- 直立键（轴向）：C1 上、C3 上 -->
  <line x1="150" y1="200" x2="150" y2="115" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="315" y1="270" x2="315" y2="200" stroke="#c0392b" stroke-width="3.5"/>
  <text x="150" y="100" text-anchor="middle" font-size="13" fill="#c0392b">直立键（axial↑）</text>

  <!-- 1,3-双直立键斥力 -->
  <line x1="150" y1="115" x2="315" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="232" y="188" text-anchor="middle" font-size="12" fill="#c0392b">1,3-双直立键斥力</text>

  <!-- 平伏键（赤道） -->
  <line x1="150" y1="200" x2="215" y2="232" stroke="#1f6f8b" stroke-width="3.5"/>
  <text x="118" y="252" text-anchor="end" font-size="13" fill="#1f6f8b">平伏键（equatorial）</text>

  <text x="320" y="380" text-anchor="middle" font-size="13" fill="#333">椅式环己烷（示意）：直立键上下交替，平伏键近似平行于环边</text>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#666">大取代基偏爱平伏位，以回避 1,3-双直立键斥力</text>
</svg>
