<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="sans-serif">
  <title>地球能量收支示意图</title>
  <desc>太阳短波辐射 340 W/m2 进入地球大气，其中反照率反射 100、大气吸收 80、地表吸收 160；地表向上发射长波 398，大气向下回辐射 340，大气向太空射出长波 240，与反射 100 合计 340，收支平衡。温室效应使地表平均温度 288 K，高于行星辐射平衡温度 255 K。</desc>
  <rect width="700" height="480" fill="#faf9f5"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" fill="#333">地球能量收支（全球平均，单位 W/m²）</text>

  <circle cx="80" cy="92" r="40" fill="#f4c943" stroke="#333" stroke-width="2"/>
  <text x="80" y="148" text-anchor="middle" font-size="15" fill="#333">太阳</text>
  <text x="80" y="166" text-anchor="middle" font-size="13" fill="#333">S ≈ 1361</text>

  <line x1="210" y1="200" x2="520" y2="200" stroke="#1f6f8b" stroke-width="4"/>
  <text x="365" y="188" text-anchor="middle" font-size="15" fill="#1f6f8b">大气层顶（TOA）</text>
  <line x1="210" y1="370" x2="520" y2="370" stroke="#333" stroke-width="4"/>
  <text x="365" y="388" text-anchor="middle" font-size="15" fill="#333">地表</text>
  <text x="585" y="282" font-size="15" fill="#666">大气层</text>
  <text x="585" y="302" font-size="13" fill="#666">含温室气体</text>
  <text x="585" y="318" font-size="13" fill="#666">H₂O、CO₂、CH₄</text>

  <defs>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <line x1="118" y1="100" x2="300" y2="360" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="245" y1="325" x2="245" y2="214" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="455" y1="218" x2="455" y2="252" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="385" y1="360" x2="385" y2="214" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <line x1="490" y1="268" x2="490" y2="214" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <line x1="350" y1="300" x2="350" y2="360" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <line x1="470" y1="358" x2="470" y2="330" stroke="#666" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ahg)"/>

  <text x="168" y="248" font-size="15" fill="#1f6f8b">太阳辐射（短波）340</text>
  <text x="255" y="272" font-size="15" fill="#1f6f8b">反照率反射 100</text>
  <text x="395" y="292" font-size="15" fill="#c0392b">地表长波 398</text>
  <text x="462" y="262" font-size="15" fill="#1f6f8b">大气吸收 80</text>
  <text x="500" y="244" font-size="15" fill="#c0392b">射出长波 240</text>
  <text x="360" y="332" font-size="15" fill="#c0392b">大气回辐射 340</text>
  <text x="250" y="398" font-size="15" fill="#1f6f8b">地表吸收 160</text>
  <text x="455" y="398" font-size="15" fill="#666">感热+潜热 102</text>

  <rect x="540" y="60" width="150" height="112" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="552" y="82" font-size="14" fill="#333">收支检验</text>
  <text x="552" y="102" font-size="13" fill="#333">340 = 100+80+160</text>
  <text x="552" y="120" font-size="13" fill="#333">地表：160+340</text>
  <text x="552" y="136" font-size="13" fill="#333">　　= 398+102</text>
  <text x="552" y="152" font-size="13" fill="#333">出射 = 100+240</text>

  <text x="350" y="450" text-anchor="middle" font-size="15" fill="#c0392b">温室效应：地表平均 288 K，比辐射平衡温度 255 K 高 33 K</text>
</svg>
