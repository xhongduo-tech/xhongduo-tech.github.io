<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="sans-serif">
  <title>三圈环流与行星风带示意图</title>
  <desc>从北极到赤道依次为极地环流、费雷尔环流与哈得莱环流。哈得莱环流在赤道上升、30 度下沉；费雷尔环流在 30 度下沉、60 度上升；极地环流在 60 度上升、北极下沉。对应地面风带为极地东风、盛行西风与信风，30 度附近为副热带急流，60 度附近为极锋急流。</desc>
  <rect width="700" height="440" fill="#faf9f5"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" fill="#333">三圈环流与行星风带（北半球剖面）</text>

  <rect x="60" y="60" width="560" height="280" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="620" y2="340" stroke="#333" stroke-width="3"/>

  <line x1="246.7" y1="60" x2="246.7" y2="340" stroke="#666" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="433.3" y1="60" x2="433.3" y2="340" stroke="#666" stroke-width="1.5" stroke-dasharray="6,4"/>

  <defs>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <line x1="600" y1="330" x2="600" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <line x1="240" y1="330" x2="240" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <line x1="430" y1="120" x2="430" y2="325" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ahc)"/>
  <line x1="95" y1="120" x2="95" y2="325" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ahc)"/>

  <path d="M590,120 Q515,95 448,120" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>
  <path d="M448,325 Q520,345 583,325" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>
  <path d="M255,120 Q335,95 418,120" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>
  <path d="M418,325 Q335,345 262,325" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>
  <path d="M225,130 Q160,105 108,130" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>
  <path d="M108,325 Q165,345 213,325" fill="none" stroke="#666" stroke-width="3" marker-end="url(#ahg)"/>

  <text x="522" y="52" text-anchor="middle" font-size="15" fill="#333">哈得莱环流</text>
  <text x="336" y="52" text-anchor="middle" font-size="15" fill="#333">费雷尔环流</text>
  <text x="150" y="52" text-anchor="middle" font-size="15" fill="#333">极地环流</text>

  <text x="433.3" y="90" text-anchor="middle" font-size="13" fill="#c0392b">副热带急流</text>
  <text x="246.7" y="90" text-anchor="middle" font-size="13" fill="#c0392b">极锋急流</text>

  <text x="600" y="358" text-anchor="middle" font-size="13" fill="#333">赤道：上升·多雨</text>
  <text x="433" y="358" text-anchor="middle" font-size="13" fill="#333">30°：下沉·干燥</text>
  <text x="245" y="358" text-anchor="middle" font-size="13" fill="#333">60°：上升·多雨</text>
  <text x="95" y="358" text-anchor="middle" font-size="13" fill="#333">极地：下沉·干冷</text>

  <text x="525" y="380" text-anchor="middle" font-size="14" fill="#1f6f8b">信风</text>
  <text x="340" y="380" text-anchor="middle" font-size="14" fill="#1f6f8b">盛行西风</text>
  <text x="150" y="380" text-anchor="middle" font-size="14" fill="#1f6f8b">极地东风</text>

  <text x="60" y="374" text-anchor="middle" font-size="13" fill="#333">北极</text>
  <text x="246.7" y="374" text-anchor="middle" font-size="13" fill="#333">60°N</text>
  <text x="433.3" y="374" text-anchor="middle" font-size="13" fill="#333">30°N</text>
  <text x="620" y="374" text-anchor="middle" font-size="13" fill="#333">赤道</text>

  <text x="28" y="200" transform="rotate(-90 30 200)" text-anchor="middle" font-size="13" fill="#666">对流层顶 ≈ 12–15 km</text>

  <text x="350" y="412" text-anchor="middle" font-size="14" fill="#333">上升气流（红）与下沉气流（青）构成垂直支，水平支由低层与高层大气闭合</text>
  <text x="350" y="430" text-anchor="middle" font-size="13" fill="#666">哈得莱环流把赤道盈余能量向高纬输送；费雷尔环流由中纬涡旋强迫驱动</text>
</svg>
