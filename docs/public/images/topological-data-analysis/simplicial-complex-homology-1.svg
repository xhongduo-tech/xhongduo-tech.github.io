<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <title>空心三角形与实心三角形：同调如何区分洞</title>
  <desc>左边是一个空心的三角形边界，其三边构成一个无法填充的一维圈，故 H_1 维数为 1；右边是填入二维面的实心三角形，同一个圈成为边界，故 H_1 为 0。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="160" y="40" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">空心三角形（H₁ ≅ ℤ）</text>
  <text x="480" y="40" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">实心三角形（H₁ = 0）</text>
  <!-- 左：空心三角形 -->
  <polygon points="160,70 60,220 260,220" fill="none" stroke="#1f6f8b" stroke-width="4"/>
  <text x="160" y="150" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">1-圈：填不进面</text>
  <circle cx="160" cy="70" r="5" fill="#c0392b"/>
  <circle cx="60" cy="220" r="5" fill="#c0392b"/>
  <circle cx="260" cy="220" r="5" fill="#c0392b"/>
  <!-- 右：实心三角形 -->
  <polygon points="480,70 380,220 580,220" fill="#c8dce3" stroke="#1f6f8b" stroke-width="4"/>
  <text x="480" y="150" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">同一圈：是边界的边界</text>
  <text x="480" y="172" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">2-单形填入后</text>
  <circle cx="480" cy="70" r="5" fill="#c0392b"/>
  <circle cx="380" cy="220" r="5" fill="#c0392b"/>
  <circle cx="580" cy="220" r="5" fill="#c0392b"/>
</svg>
