<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
  <title>环面的高度函数与 Reeb 图</title>
  <desc>左图是环面的截面示意图（圆环），四个临界点分别标为极小、极大与两个鞍点，虚线水平线显示不同高度处水平集的连通分量数为 1、2、1；右图是对应的 Reeb 图，呈叶形：底部与顶部各一条茎，中间两条平行边构成一个环。</desc>
  <rect width="700" height="330" fill="#faf9f5"/>
  <text x="250" y="26" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">环面（示意）与高度函数 f</text>
  <text x="520" y="26" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">Reeb 图 R_f</text>
  <!-- 左：环形截面 -->
  <ellipse cx="250" cy="165" rx="130" ry="95" fill="#c8dce3" stroke="#1f6f8b" stroke-width="3"/>
  <ellipse cx="250" cy="165" rx="55" ry="28" fill="#faf9f5" stroke="#1f6f8b" stroke-width="3"/>
  <!-- 水平集虚线 -->
  <line x1="125" y1="110" x2="375" y2="110" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="390" y="114" font-family="sans-serif" font-size="13" fill="#c0392b">1 个分量</text>
  <line x1="125" y1="165" x2="193" y2="165" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="307" y1="165" x2="375" y2="165" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="390" y="169" font-family="sans-serif" font-size="13" fill="#c0392b">2 个分量</text>
  <line x1="125" y1="222" x2="375" y2="222" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="390" y="226" font-family="sans-serif" font-size="13" fill="#c0392b">1 个分量</text>
  <!-- 临界点 -->
  <circle cx="250" cy="260" r="5" fill="#c0392b"/>
  <text x="250" y="282" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">极小</text>
  <circle cx="250" cy="70" r="5" fill="#c0392b"/>
  <text x="250" y="58" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">极大</text>
  <circle cx="195" cy="165" r="5" fill="#1f6f8b"/>
  <circle cx="305" cy="165" r="5" fill="#1f6f8b"/>
  <text x="195" y="192" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">鞍点</text>
  <text x="305" y="192" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">鞍点</text>
  <!-- 高度方向箭头 -->
  <line x1="70" y1="70" x2="70" y2="260" stroke="#333" stroke-width="2"/>
  <polygon points="70,70 65,82 75,82" fill="#333"/>
  <text x="55" y="170" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle" transform="rotate(-90,55,170)">f 增大</text>
  <!-- 右：Reeb 图 -->
  <line x1="520" y1="262" x2="520" y2="205" stroke="#333" stroke-width="3"/>
  <path d="M 520 205 Q 455 158 520 110" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 520 205 Q 585 158 520 110" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="520" y1="110" x2="520" y2="62" stroke="#333" stroke-width="3"/>
  <circle cx="520" cy="262" r="7" fill="#c0392b"/>
  <circle cx="520" cy="62" r="7" fill="#c0392b"/>
  <circle cx="520" cy="205" r="7" fill="#1f6f8b"/>
  <circle cx="520" cy="110" r="7" fill="#1f6f8b"/>
  <text x="520" y="292" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">极小</text>
  <text x="520" y="48" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">极大</text>
  <text x="468" y="150" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="end">鞍点</text>
  <text x="572" y="150" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="start">鞍点</text>
  <text x="520" y="320" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">中间一环 = 环面的一维洞</text>
</svg>
