<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <title>Mapper 算法示意图：点云经滤镜与覆盖生成骨架图</title>
  <desc>上方是形似数字 8 的点云，滤镜为水平投影；中间是覆盖滤镜值域的五个重叠区间（竖直带）；对每个区间的预像聚类后生成下方 Mapper 图，图为两个环相切的结构，保留了原形状的 H1。</desc>
  <rect width="700" height="380" fill="#faf9f5"/>
  <text x="350" y="22" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">数据点云（两个圆环相切）</text>
  <!-- 五个重叠滤镜区间（竖直带） -->
  <rect x="215" y="30" width="75" height="160" fill="#1f6f8b" opacity="0.15"/>
  <rect x="265" y="30" width="75" height="160" fill="#c0392b" opacity="0.12"/>
  <rect x="315" y="30" width="75" height="160" fill="#1f6f8b" opacity="0.15"/>
  <rect x="365" y="30" width="75" height="160" fill="#c0392b" opacity="0.12"/>
  <rect x="415" y="30" width="75" height="160" fill="#1f6f8b" opacity="0.15"/>
  <!-- 左环点 -->
  <circle cx="345" cy="110" r="3" fill="#333"/><circle cx="326" cy="156" r="3" fill="#333"/>
  <circle cx="280" cy="175" r="3" fill="#333"/><circle cx="234" cy="156" r="3" fill="#333"/>
  <circle cx="215" cy="110" r="3" fill="#333"/><circle cx="234" cy="64" r="3" fill="#333"/>
  <circle cx="280" cy="45" r="3" fill="#333"/><circle cx="326" cy="64" r="3" fill="#333"/>
  <circle cx="340" cy="85" r="3" fill="#333"/><circle cx="305" cy="50" r="3" fill="#333"/>
  <circle cx="255" cy="50" r="3" fill="#333"/><circle cx="220" cy="85" r="3" fill="#333"/>
  <circle cx="220" cy="135" r="3" fill="#333"/><circle cx="255" cy="170" r="3" fill="#333"/>
  <circle cx="305" cy="170" r="3" fill="#333"/><circle cx="340" cy="135" r="3" fill="#333"/>
  <!-- 右环点 -->
  <circle cx="485" cy="110" r="3" fill="#333"/><circle cx="466" cy="156" r="3" fill="#333"/>
  <circle cx="420" cy="175" r="3" fill="#333"/><circle cx="374" cy="156" r="3" fill="#333"/>
  <circle cx="355" cy="110" r="3" fill="#333"/><circle cx="374" cy="64" r="3" fill="#333"/>
  <circle cx="420" cy="45" r="3" fill="#333"/><circle cx="466" cy="64" r="3" fill="#333"/>
  <circle cx="480" cy="85" r="3" fill="#333"/><circle cx="445" cy="50" r="3" fill="#333"/>
  <circle cx="395" cy="50" r="3" fill="#333"/><circle cx="360" cy="85" r="3" fill="#333"/>
  <circle cx="360" cy="135" r="3" fill="#333"/><circle cx="395" cy="170" r="3" fill="#333"/>
  <circle cx="445" cy="170" r="3" fill="#333"/><circle cx="480" cy="135" r="3" fill="#333"/>
  <!-- 相切桥接点 -->
  <circle cx="348" cy="110" r="3" fill="#333"/><circle cx="352" cy="110" r="3" fill="#333"/>
  <!-- 投影轴与滤镜箭头 -->
  <line x1="200" y1="235" x2="500" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="185" x2="350" y2="228" stroke="#666" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="350,188 346,196 354,196" fill="#666"/>
  <text x="412" y="252" font-family="sans-serif" font-size="13" fill="#666">滤镜 f：水平投影</text>
  <!-- 区间标注 -->
  <text x="252" y="222" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">I1</text>
  <text x="302" y="222" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">I2</text>
  <text x="352" y="222" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">I3</text>
  <text x="402" y="222" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">I4</text>
  <text x="452" y="222" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">I5</text>
  <!-- Mapper 图 -->
  <text x="350" y="278" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Mapper 图：两个环被重建出来（H₁ = 2）</text>
  <line x1="250" y1="320" x2="287" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="250" y1="320" x2="287" y2="340" stroke="#333" stroke-width="2.5"/>
  <line x1="287" y1="300" x2="350" y2="320" stroke="#333" stroke-width="2.5"/>
  <line x1="287" y1="340" x2="350" y2="320" stroke="#333" stroke-width="2.5"/>
  <line x1="350" y1="320" x2="413" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="350" y1="320" x2="413" y2="340" stroke="#333" stroke-width="2.5"/>
  <line x1="413" y1="300" x2="450" y2="320" stroke="#333" stroke-width="2.5"/>
  <line x1="413" y1="340" x2="450" y2="320" stroke="#333" stroke-width="2.5"/>
  <circle cx="250" cy="320" r="8" fill="#1f6f8b"/>
  <circle cx="287" cy="300" r="8" fill="#1f6f8b"/>
  <circle cx="287" cy="340" r="8" fill="#1f6f8b"/>
  <circle cx="350" cy="320" r="8" fill="#1f6f8b"/>
  <circle cx="413" cy="300" r="8" fill="#1f6f8b"/>
  <circle cx="413" cy="340" r="8" fill="#1f6f8b"/>
  <circle cx="450" cy="320" r="8" fill="#1f6f8b"/>
</svg>
