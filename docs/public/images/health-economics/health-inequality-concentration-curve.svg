<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">集中曲线</title>
  <desc id="desc">横轴为按收入由低到高排列的人口累计占比，纵轴为健康累计占比。完全平等线是 45 度对角线，集中曲线在其下方表示健康向高收入人群集中，两者之间阴影面积为集中指数数值的两倍。</desc>

  <rect width="640" height="480" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="420" x2="556" y2="420" stroke="#333" stroke-width="2"/>
  <polygon points="562,420 548,414 548,426" fill="#333"/>
  <line x1="80" y1="420" x2="80" y2="66" stroke="#333" stroke-width="2"/>
  <polygon points="80,60 74,74 86,74" fill="#333"/>

  <!-- 轴标签 -->
  <text x="300" y="452" font-family="sans-serif" font-size="16" fill="#333">人口累计占比（按收入由低到高）</text>
  <text x="16" y="250" font-family="sans-serif" font-size="16" fill="#333" transform="rotate(-90 30 250)">健康累计占比</text>

  <!-- 完全平等线 -->
  <line x1="80" y1="420" x2="560" y2="60" stroke="#666" stroke-width="2"/>
  <text x="468" y="78" font-family="sans-serif" font-size="15" fill="#666">完全平等线</text>

  <!-- 阴影区域 -->
  <polygon points="80,420 176,391 272,348 368,283 464,204 560,60" fill="#1f6f8b" opacity="0.18"/>

  <!-- 集中曲线 -->
  <polyline points="80,420 176,391 272,348 368,283 464,204 560,60" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="200" y="392" font-family="sans-serif" font-size="16" fill="#c0392b">集中曲线</text>
  <text x="300" y="250" font-family="sans-serif" font-size="15" fill="#1f6f8b">阴影面积 = 2 × 集中指数</text>

  <!-- 标注点：底部20%人口只拥有约8%健康 -->
  <circle cx="176" cy="391" r="4" fill="#333"/>
  <text x="96" y="360" font-family="sans-serif" font-size="14" fill="#333">最穷 20% 人口</text>
  <text x="96" y="378" font-family="sans-serif" font-size="14" fill="#333">只拥有约 8% 健康</text>
</svg>
