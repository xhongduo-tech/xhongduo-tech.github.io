<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="sans-serif">
  <title>均匀线阵波束形成与指向性示意图</title>
  <desc>左侧为竖直均匀线阵接收斜向入射的平面波，相邻阵元存在路程差 d·sinθ；右侧为波束方向图，主瓣指向法线方向，均匀加权的第一旁瓣约 -13 dB，间距过大时出现栅瓣。</desc>
  <rect width="860" height="520" fill="#faf9f5"/>
  <rect x="0" y="0" width="860" height="520" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 左面板标题 -->
  <text x="220" y="28" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">平面波入射均匀线阵</text>

  <!-- 左面板：x 40-400，y 40-480 -->
  <!-- 阵元：竖直阵列在 x=140，阵元 y=90,170,250,330,410（间距80） -->
  <g fill="#1f6f8b" stroke="#1f6f8b">
    <circle cx="140" cy="90" r="9"/>
    <circle cx="140" cy="170" r="9"/>
    <circle cx="140" cy="250" r="9"/>
    <circle cx="140" cy="330" r="9"/>
    <circle cx="140" cy="410" r="9"/>
  </g>
  <line x1="140" y1="90" x2="140" y2="410" stroke="#1f6f8b" stroke-width="2"/>
  <text x="140" y="460" font-size="14" fill="#333" text-anchor="middle">阵元</text>

  <!-- 阵列法线（水平虚线） -->
  <line x1="140" y1="250" x2="380" y2="250" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="370" y="243" font-size="13" fill="#666" text-anchor="end">法线</text>

  <!-- 入射波前：斜线，斜率对应入射角 θ≈25° -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="300" y1="410" x2="360" y2="330"/>
    <line x1="340" y1="410" x2="400" y2="330"/>
    <line x1="380" y1="410" x2="440" y2="330"/>
    <line x1="420" y1="410" x2="480" y2="330"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="180" y1="330" x2="240" y2="250"/>
    <line x1="220" y1="330" x2="280" y2="250"/>
    <line x1="260" y1="330" x2="320" y2="250"/>
    <line x1="300" y1="330" x2="360" y2="250"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="60" y1="250" x2="120" y2="170"/>
    <line x1="100" y1="250" x2="160" y2="170"/>
    <line x1="140" y1="250" x2="200" y2="170"/>
    <line x1="180" y1="250" x2="240" y2="170"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="100" y1="170" x2="160" y2="90"/>
    <line x1="140" y1="170" x2="200" y2="90"/>
    <line x1="180" y1="170" x2="240" y2="90"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="20" y1="90" x2="80" y2="10"/>
    <line x1="60" y1="90" x2="120" y2="10"/>
    <line x1="100" y1="90" x2="160" y2="10"/>
    <line x1="140" y1="90" x2="200" y2="10"/>
  </g>

  <!-- 传播方向箭头 -->
  <line x1="330" y1="250" x2="265" y2="345" stroke="#c0392b" stroke-width="3" marker-end="none"/>
  <polygon points="265,345 275,328 255,330" fill="#c0392b"/>
  <text x="315" y="235" font-size="13" fill="#c0392b" text-anchor="middle">传播方向</text>

  <!-- 入射角 θ -->
  <path d="M 280 250 A 40 40 0 0 0 268 276" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="262" y="272" font-size="14" font-style="italic" fill="#333">θ</text>

  <!-- 路程差标注：在阵元 2（y=170）与阵元 3（y=250）之间 -->
  <line x1="252" y1="250" x2="268" y2="224" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="278" y="262" font-size="13" fill="#1f6f8b">d·sinθ</text>

  <!-- 右面板标题 -->
  <text x="640" y="28" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">均匀线阵方向图 |AF(θ)|</text>

  <!-- 右面板：x 440-840，y 40-480。横轴 θ（-90° 到 90°），纵轴响应 dB（0 到 -45） -->
  <g stroke="#999" stroke-width="1.2">
    <line x1="470" y1="120" x2="810" y2="120"/>
    <line x1="470" y1="80" x2="470" y2="460"/>
    <line x1="470" y1="120" x2="470" y2="460" stroke-dasharray="3 3"/>
  </g>
  <text x="470" y="70" font-size="13" fill="#333" text-anchor="middle">0 dB</text>
  <text x="470" y="145" font-size="13" fill="#333" text-anchor="middle">-13 dB</text>
  <text x="470" y="295" font-size="13" fill="#333" text-anchor="middle">-40 dB</text>
  <text x="640" y="475" font-size="13" fill="#333" text-anchor="middle">θ</text>
  <text x="500" y="475" font-size="13" fill="#666" text-anchor="middle">-90°</text>
  <text x="810" y="475" font-size="13" fill="#666" text-anchor="middle">90°</text>

  <!-- 方向图曲线：主瓣在 θ=0（x=640），旁瓣递减。
       x 映射：-90°→470，0°→640，90°→810（每度 1.889）。
       y 映射：0dB→120，-13dB→约 208，-40dB→约 412（每 dB 7.3）。 -->
  <path d="M 470 230
           C 520 230, 560 210, 590 190
           C 610 175, 620 155, 635 125
           C 638 120, 642 120, 645 125
           C 660 155, 670 175, 690 190
           C 720 210, 760 230, 810 230"
        fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- 第一旁瓣虚线 -13 dB -->
  <line x1="470" y1="208" x2="810" y2="208" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 栅瓣示意（若 d>λ/2 会出现） -->
  <path d="M 530 250 C 545 245, 555 250, 560 270" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 720 250 C 705 245, 695 250, 690 270" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="640" y="250" font-size="13" fill="#c0392b" text-anchor="middle">栅瓣（d &gt; λ/2 时出现）</text>

  <!-- 主瓣标注 -->
  <text x="700" y="105" font-size="14" font-weight="bold" fill="#1f6f8b">主瓣</text>
  <line x1="642" y1="120" x2="672" y2="125" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="520" y="200" font-size="13" fill="#c0392b">第一旁瓣 ≈ −13 dB</text>

  <!-- 图例 -->
  <g font-size="13" fill="#333">
    <line x1="440" y1="492" x2="470" y2="492" stroke="#1f6f8b" stroke-width="3"/>
    <text x="476" y="496">均匀加权方向图</text>
    <line x1="620" y1="492" x2="650" y2="492" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="656" y="496">栅瓣 / 旁瓣电平线</text>
  </g>
</svg>
