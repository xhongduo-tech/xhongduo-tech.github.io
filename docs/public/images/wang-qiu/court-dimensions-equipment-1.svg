<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">网球场尺寸示意图</title>
  <desc id="desc">单打与双打场地的线区划分、发球区、球网与关键尺寸标注</desc>
  <rect x="0" y="0" width="920" height="470" fill="#faf9f5"/>
  <!-- 双打外边界（底线与双打边线） -->
  <rect x="60" y="45" width="800" height="370" fill="#f4ead3" stroke="#333" stroke-width="2"/>
  <!-- 单打边线 -->
  <line x1="60" y1="92" x2="860" y2="92" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="60" y1="368" x2="860" y2="368" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 球网 -->
  <line x1="460" y1="45" x2="460" y2="415" stroke="#c0392b" stroke-width="3"/>
  <!-- 发球线 -->
  <line x1="245" y1="92" x2="245" y2="368" stroke="#333" stroke-width="2"/>
  <line x1="675" y1="92" x2="675" y2="368" stroke="#333" stroke-width="2"/>
  <!-- 中线 -->
  <line x1="245" y1="230" x2="675" y2="230" stroke="#333" stroke-width="2"/>
  <!-- 底线中点 -->
  <line x1="60" y1="230" x2="92" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="860" y1="230" x2="828" y2="230" stroke="#333" stroke-width="2"/>
  <!-- 顶部标注 -->
  <text x="460" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">球网（网柱高 1.07m，中心 0.914m）</text>
  <text x="245" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">发球线</text>
  <text x="245" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">距网 6.40m</text>
  <!-- 右侧标注 -->
  <text x="875" y="100" font-family="sans-serif" font-size="13" fill="#1f6f8b">单打边线</text>
  <text x="875" y="116" font-family="sans-serif" font-size="13" fill="#333">距中线 4.115m</text>
  <text x="875" y="420" font-family="sans-serif" font-size="13" fill="#333">双打边线</text>
  <text x="875" y="436" font-family="sans-serif" font-size="13" fill="#333">距中线 5.485m</text>
  <!-- 左侧标注 -->
  <text x="18" y="60" font-family="sans-serif" font-size="13" fill="#333">底线（长 8.23m 单打 / 10.97m 双打）</text>
  <!-- 底部标注 -->
  <text x="460" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">场地长 23.77m</text>
  <text x="150" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">单打区宽 8.23m</text>
  <text x="770" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">发球区 6.40m × 4.115m</text>
  <!-- 中线标注 -->
  <text x="150" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">中线</text>
  <text x="770" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">中线</text>
  <!-- 中点标注 -->
  <text x="40" y="222" text-anchor="end" font-family="sans-serif" font-size="12" fill="#333">中点</text>
  <text x="880" y="222" font-family="sans-serif" font-size="12" fill="#333">中点</text>
</svg>
