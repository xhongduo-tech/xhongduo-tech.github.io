<svg viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>Lineweaver-Burk 双倒数图：竞争性抑制的判别</title>
<desc>以 1/r 对 1/[S] 作图，无抑制剂直线与竞争性抑制直线在 y 轴截距 1/V_max 处相交，竞争性抑制使斜率增大、K_M 表观增大。</desc>
<rect x="0" y="0" width="520" height="430" fill="#faf9f5"/>

<text x="260" y="30" font-size="16" fill="#333" text-anchor="middle">Lineweaver-Burk 双倒数图：竞争性抑制判别</text>

<!-- axes -->
<line x1="30" y1="360" x2="460" y2="360" stroke="#333" stroke-width="2"/>
<polygon points="460,360 448,355 448,365" fill="#333"/>
<line x1="70" y1="40" x2="70" y2="360" stroke="#333" stroke-width="2"/>
<polygon points="70,40 65,52 75,52" fill="#333"/>

<!-- dashed 1/V_max line -->
<line x1="70" y1="266" x2="460" y2="266" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4"/>
<circle cx="160" cy="266" r="4" fill="#333"/>
<text x="405" y="258" font-size="13" fill="#333">1/V_max</text>

<!-- no-inhibitor line: 1/v = 0.5 + 0.5(1/S) -->
<polyline points="85,360 160,266 325,60" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<!-- competitive line: 1/v = 0.5 + 1.0(1/S) -->
<polyline points="122,360 160,266 243,60" fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- axis labels -->
<text x="24" y="210" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 24 210)">1/r</text>
<text x="255" y="408" font-size="14" fill="#333" text-anchor="middle">1/[S]</text>
<text x="160" y="378" font-size="13" fill="#333" text-anchor="middle">0</text>
<text x="85" y="392" font-size="13" fill="#1f6f8b" text-anchor="middle">-1/K_M</text>
<text x="122" y="392" font-size="13" fill="#c0392b" text-anchor="middle">-1/K_M'</text>

<!-- legends -->
<text x="96" y="150" font-size="14" fill="#1f6f8b" font-weight="bold">无抑制剂</text>
<line x1="150" y1="146" x2="170" y2="230" stroke="#1f6f8b" stroke-width="1.2"/>
<text x="330" y="150" font-size="14" fill="#c0392b" font-weight="bold">竞争性抑制</text>
<line x1="330" y1="154" x2="205" y2="240" stroke="#c0392b" stroke-width="1.2"/>

<text x="260" y="325" font-size="13" fill="#333" text-anchor="middle">竞争性抑制：1/V_max 不变，斜率增大（K_M 表观增大）</text>
</svg>
