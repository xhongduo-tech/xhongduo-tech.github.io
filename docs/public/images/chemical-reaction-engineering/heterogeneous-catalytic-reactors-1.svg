<svg viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>球形催化剂颗粒内的浓度剖面</title>
<desc>比较小蒂勒模数与大蒂勒模数时颗粒内反应物浓度沿径向的分布：小 phi 时浓度几乎处处等于表面浓度，大 phi 时反应只发生在靠近表面的壳层。</desc>
<rect x="0" y="0" width="520" height="430" fill="#faf9f5"/>

<text x="260" y="30" font-size="16" fill="#333" text-anchor="middle">球形颗粒内：扩散 vs 反应的浓度剖面</text>

<!-- axes -->
<line x1="80" y1="370" x2="430" y2="370" stroke="#333" stroke-width="2"/>
<polygon points="430,370 418,365 418,375" fill="#333"/>
<line x1="80" y1="60" x2="80" y2="370" stroke="#333" stroke-width="2"/>

<!-- C_As dashed line -->
<line x1="80" y1="82" x2="430" y2="82" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="432" y="78" font-size="13" fill="#333">C_As</text>

<!-- large phi shaded region (shell reaction) -->
<polygon points="80,362 260,360 330,340 370,270 400,170 430,82 430,370 80,370"
  fill="#c0392b" fill-opacity="0.22" stroke="none"/>

<!-- large phi curve -->
<polyline points="80,362 260,360 330,340 370,270 400,170 430,82"
  fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- small phi curve -->
<polyline points="80,112 200,100 320,90 430,82"
  fill="none" stroke="#1f6f8b" stroke-width="2.5"/>

<!-- axis labels -->
<text x="255" y="402" font-size="14" fill="#333" text-anchor="middle">径向位置 r</text>
<text x="80" y="388" font-size="13" fill="#333" text-anchor="middle">中心 r=0</text>
<text x="430" y="388" font-size="13" fill="#333" text-anchor="end">表面 r=R</text>
<text x="24" y="220" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 24 220)">C_A</text>
<text x="80" y="408" font-size="13" fill="#333" text-anchor="middle">0</text>

<!-- legends with leaders -->
<text x="120" y="155" font-size="14" fill="#1f6f8b" font-weight="bold">小 φ：η≈1，浓度处处≈C_As</text>
<line x1="120" y1="159" x2="150" y2="105" stroke="#1f6f8b" stroke-width="1.2"/>
<text x="96" y="330" font-size="14" fill="#c0392b" font-weight="bold">大 φ：η≪1，反应只在壳层</text>
<line x1="150" y1="324" x2="310" y2="352" stroke="#c0392b" stroke-width="1.2"/>
</svg>
