<svg viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>勒文斯比尔图：CSTR 与 PFR 的体积对比</title>
<desc>以 1/(-r_A) 对转化率 X 作图，PFR 体积是曲线下的红色面积，CSTR 体积是青色的矩形，PFR 体积小于 CSTR。</desc>
<rect x="0" y="0" width="520" height="430" fill="#faf9f5"/>

<text x="260" y="30" font-size="16" fill="#333" text-anchor="middle">勒文斯比尔图：PFR 体积 &lt; CSTR 体积</text>

<!-- axes -->
<line x1="70" y1="360" x2="470" y2="360" stroke="#333" stroke-width="2"/>
<line x1="70" y1="60" x2="70" y2="360" stroke="#333" stroke-width="2"/>

<!-- PFR region: area under curve from X=0 to X=0.6 -->
<polygon points="70,120 120,123 170,133 220,150 270,172 310,196 310,360 70,360"
  fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.5"/>

<!-- CSTR rectangle: width 0..0.6, height to curve value at X=0.6 -->
<rect x="70" y="196" width="240" height="164"
  fill="#1f6f8b" fill-opacity="0.30" stroke="#1f6f8b" stroke-width="2"/>

<!-- curve -->
<polyline points="70,120 120,123 170,133 220,150 270,172 310,196 320,202 370,238 420,281 470,330"
  fill="none" stroke="#333" stroke-width="2.5"/>

<!-- dashed vertical line at X=0.6 and its top marker -->
<line x1="310" y1="196" x2="310" y2="360" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="70" y1="196" x2="310" y2="196" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>

<!-- axis labels -->
<text x="270" y="408" font-size="14" fill="#333" text-anchor="middle">转化率 X</text>
<text x="70" y="380" font-size="13" fill="#333" text-anchor="middle">0</text>
<text x="470" y="380" font-size="13" fill="#333" text-anchor="middle">1</text>
<text x="310" y="380" font-size="13" fill="#333" text-anchor="middle">X</text>
<text x="24" y="210" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 24 210)">1/(-r_A)</text>

<!-- legends with leaders -->
<text x="86" y="148" font-size="14" fill="#c0392b" font-weight="bold">V_PFR（曲线下面积）</text>
<text x="352" y="300" font-size="14" fill="#1f6f8b" font-weight="bold">V_CSTR（矩形）</text>
<line x1="352" y1="294" x2="316" y2="270" stroke="#1f6f8b" stroke-width="1.2"/>
<line x1="86" y1="152" x2="92" y2="200" stroke="#c0392b" stroke-width="1.2"/>
</svg>
