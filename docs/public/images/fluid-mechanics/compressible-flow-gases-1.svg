<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif">
<title>超音速物体的马赫锥与正激波</title>
<desc>左：超音速飞行体身后声波圆堆积成马赫锥，半角 mu = arcsin(1/M)；右插图：正激波使上游超音速气流突变为下游亚音速，密度压强温度跳升。</desc>
<rect x="0" y="0" width="760" height="340" fill="#faf9f5"/>
<text x="40" y="30" font-size="16" fill="#333" font-weight="bold">超音速飞行：声波追不上飞机，堆积成马赫锥</text>

<!-- trajectory -->
<line x1="100" y1="180" x2="620" y2="180" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="620" y1="180" x2="688" y2="180" stroke="#333" stroke-width="2.5"/>
<polygon points="688,174 700,180 688,186" fill="#333"/>
<text x="655" y="172" font-size="14" fill="#333">飞行方向</text>

<!-- projectile -->
<polygon points="604,166 626,180 604,194" fill="#333"/>
<circle cx="612" cy="180" r="4" fill="#c0392b"/>

<!-- wavefront circles (behind, radii = d/2 for M=2) -->
<g stroke="#1f6f8b" stroke-width="1.5" fill="none" opacity="0.7">
<circle cx="560" cy="180" r="30"/>
<circle cx="500" cy="180" r="60"/>
<circle cx="440" cy="180" r="90"/>
<circle cx="380" cy="180" r="120"/>
<circle cx="320" cy="180" r="150"/>
</g>

<!-- Mach cone lines (mu = 30 deg for M=2) -->
<line x1="620" y1="180" x2="403" y2="55" stroke="#c0392b" stroke-width="3"/>
<line x1="620" y1="180" x2="403" y2="305" stroke="#c0392b" stroke-width="3"/>
<text x="450" y="70" font-size="15" fill="#c0392b">马赫锥</text>

<!-- angle arc at apex between backward direction (180 deg) and cone (150 deg) -->
<path d="M 560 180 A 60 60 0 0 0 568 150" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="545" y="168" font-size="14" fill="#333">μ</text>
<text x="400" y="140" font-size="15" fill="#333" font-weight="bold">M = 2</text>
<text x="380" y="160" font-size="14" fill="#333">μ = arcsin(1/M) ≈ 30°</text>

<!-- normal shock inset -->
<text x="642" y="38" font-size="15" fill="#333" font-weight="bold">正激波</text>
<text x="642" y="56" font-size="13" fill="#333">超音速气流穿越后突变减速</text>
<rect x="642" y="70" width="96" height="80" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<line x1="690" y1="70" x2="690" y2="150" stroke="#c0392b" stroke-width="3"/>
<line x1="660" y1="100" x2="684" y2="100" stroke="#1f6f8b" stroke-width="3"/>
<polygon points="684,94 694,100 684,106" fill="#1f6f8b"/>
<line x1="698" y1="120" x2="722" y2="120" stroke="#1f6f8b" stroke-width="2.5"/>
<polygon points="722,114 732,120 722,126" fill="#1f6f8b"/>
<text x="646" y="92" font-size="13" fill="#333">M₁ &gt; 1</text>
<text x="698" y="112" font-size="13" fill="#333">M₂ &lt; 1</text>
<text x="646" y="142" font-size="13" fill="#333">ρ, p, T 跳升</text>

<text x="40" y="325" font-size="14" fill="#555">M &lt; 1 时扰动总能"逃掉"；M &gt; 1 时扰动被甩在身后，声波叠加成间断的激波面。激波是熵增的不可逆过程。</text>
</svg>
