<svg viewBox="0 0 540 370" width="540" height="370" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>支序图：外群定根与衍征分配</title>
  <desc>一棵以 O（外群）定根的支序图，包含 A、B、C 三个内群物种；红色短杠标注共衍征与自衍征的分配位置。</desc>
  <rect width="540" height="370" fill="#faf9f5"/>
  <!-- 树骨架 -->
  <g stroke="#333" stroke-width="2.2" fill="none">
    <!-- 根到 n1 -->
    <line x1="60" y1="330" x2="150" y2="330"/>
    <!-- n1 到 O -->
    <line x1="150" y1="330" x2="480" y2="330"/>
    <line x1="480" y1="330" x2="500" y2="330"/>
    <!-- n1 到 n2 -->
    <line x1="150" y1="330" x2="150" y2="240"/>
    <!-- n2 到 A -->
    <line x1="150" y1="240" x2="480" y2="240"/>
    <line x1="480" y1="240" x2="500" y2="240"/>
    <!-- n2 到 n3 -->
    <line x1="150" y1="240" x2="150" y2="105"/>
    <!-- n3 到 B -->
    <line x1="150" y1="105" x2="480" y2="105"/>
    <line x1="480" y1="105" x2="500" y2="105"/>
    <!-- n3 到 C -->
    <line x1="150" y1="105" x2="150" y2="60"/>
    <line x1="150" y1="60" x2="480" y2="60"/>
    <line x1="480" y1="60" x2="500" y2="60"/>
  </g>
  <!-- 内部节点圆点 -->
  <g fill="#1f6f8b">
    <circle cx="150" cy="330" r="4.5"/>
    <circle cx="150" cy="240" r="4.5"/>
    <circle cx="150" cy="105" r="4.5"/>
  </g>
  <circle cx="60" cy="330" r="4.5" fill="#c0392b"/>
  <!-- 末梢物种名 -->
  <g font-size="15" fill="#333">
    <text x="510" y="334">O（外群）</text>
    <text x="510" y="244">A</text>
    <text x="510" y="109">B</text>
    <text x="510" y="64">C</text>
  </g>
  <!-- 衍征标注（红色短杠 + 文字） -->
  <g stroke="#c0392b" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="288" x2="186" y2="288"/>
    <line x1="150" y1="170" x2="186" y2="170"/>
    <line x1="150" y1="80" x2="186" y2="80"/>
    <line x1="300" y1="330" x2="300" y2="318"/>
  </g>
  <g font-size="13" fill="#c0392b">
    <text x="196" y="284">A、B、C 的共衍征（支持内群单系）</text>
    <text x="196" y="166">B、C 的共衍征（支持 B+C 单系）</text>
    <text x="196" y="76">C 的自衍征（只支持 C 本身）</text>
    <text x="312" y="336">O 保留的共祖征（不构成建群证据）</text>
  </g>
  <!-- 图注 -->
  <text x="60" y="358" font-size="13" fill="#333">支序图只承载分支信息（拓扑），不承载分支长度；红色短杠 = 衍征（apomorphy）分配位置。</text>
</svg>
