<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="sans-serif">
<title>文献载体的演变时间线</title>
<desc>从商代甲骨、商周金文、战国秦汉简牍帛书、东汉造纸、唐宋印刷术到当代电子文本的文献载体演进时间线</desc>
<rect width="920" height="320" fill="#faf9f5"/>
<text x="460" y="38" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">文献载体的演变</text>
<line x1="60" y1="190" x2="862" y2="190" stroke="#333" stroke-width="2"/>
<polygon points="860,185 874,190 860,195" fill="#333"/>
<line x1="60" y1="206" x2="860" y2="206" stroke="#ccc" stroke-width="1"/>

<circle cx="100" cy="190" r="5" fill="#1f6f8b"/>
<text x="100" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">约前14世纪</text>
<text x="100" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">甲骨</text>
<text x="100" y="244" text-anchor="middle" font-size="13" fill="#333">殷商占卜刻辞</text>

<circle cx="225" cy="190" r="5" fill="#1f6f8b"/>
<text x="225" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">商—周</text>
<text x="225" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">金文</text>
<text x="225" y="244" text-anchor="middle" font-size="13" fill="#333">青铜器铭文</text>

<circle cx="350" cy="190" r="5" fill="#1f6f8b"/>
<text x="350" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">战国—汉晋</text>
<text x="350" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">简牍</text>
<text x="350" y="244" text-anchor="middle" font-size="13" fill="#333">竹简木牍</text>

<circle cx="475" cy="190" r="5" fill="#1f6f8b"/>
<text x="475" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">战国—汉</text>
<text x="475" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">帛书</text>
<text x="475" y="244" text-anchor="middle" font-size="13" fill="#333">缣帛</text>

<circle cx="600" cy="190" r="5" fill="#1f6f8b"/>
<text x="600" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">东汉 105 年</text>
<text x="600" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">纸</text>
<text x="600" y="244" text-anchor="middle" font-size="13" fill="#333">蔡伦改进造纸</text>

<circle cx="730" cy="190" r="5" fill="#1f6f8b"/>
<text x="730" y="170" text-anchor="middle" font-size="13" fill="#1f6f8b">唐—宋</text>
<text x="730" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">印刷术</text>
<text x="730" y="244" text-anchor="middle" font-size="13" fill="#333">雕版 · 活字</text>

<circle cx="850" cy="190" r="5" fill="#c0392b"/>
<text x="850" y="170" text-anchor="middle" font-size="13" fill="#c0392b">当代</text>
<text x="850" y="226" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">电子文本</text>
<text x="850" y="244" text-anchor="middle" font-size="13" fill="#333">数字化 · OCR</text>

<text x="460" y="292" text-anchor="middle" font-size="13" fill="#666">更早的载体：材质坚硬、容量小；越新越轻便、越可复制——载体决定知识生产的规模与寿命</text>
</svg>
