<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>自然循环水管锅炉水汽系统示意图</title>
  <desc>汽包、下降管、下集箱、水冷壁与尾部受热面的布置及水汽循环路径</desc>
  <rect width="720" height="460" fill="#faf9f5"/>
  <!-- 汽包 -->
  <rect x="250" y="70" width="220" height="40" rx="12" fill="#1f6f8b" stroke="#333" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" fill="#fff" font-size="16">汽包（锅筒）</text>
  <!-- 蒸汽出口 -->
  <line x1="450" y1="70" x2="450" y2="40" stroke="#333" stroke-width="2"/>
  <polygon points="450,32 445,44 455,44" fill="#c0392b"/>
  <text x="465" y="44" font-size="14" fill="#333">饱和蒸汽 → 过热器</text>
  <!-- 下降管 -->
  <line x1="275" y1="110" x2="275" y2="310" stroke="#1f6f8b" stroke-width="12"/>
  <polygon points="275,318 266,302 284,302" fill="#1f6f8b"/>
  <text x="262" y="215" text-anchor="end" font-size="14" fill="#333">下降管（纯水下行）</text>
  <!-- 下集箱 -->
  <rect x="275" y="318" width="150" height="22" rx="5" fill="#7fb3c9" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="333" text-anchor="middle" font-size="13" fill="#333">下集箱</text>
  <!-- 水冷壁 -->
  <line x1="425" y1="318" x2="425" y2="110" stroke="#c0392b" stroke-width="12"/>
  <polygon points="425,102 416,118 434,118" fill="#c0392b"/>
  <text x="448" y="215" font-size="14" fill="#333">水冷壁（汽水上行）</text>
  <!-- 炉膛 -->
  <rect x="290" y="200" width="120" height="100" fill="#f6e8cf" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="245" text-anchor="middle" font-size="15" fill="#c0392b">🔥 炉膛</text>
  <text x="350" y="272" text-anchor="middle" font-size="13" fill="#333">燃料在此燃烧</text>
  <!-- 炉排 -->
  <line x1="295" y1="300" x2="405" y2="300" stroke="#333" stroke-width="3"/>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#333">炉排 / 燃烧器（进燃料与风）</text>
  <!-- 尾部烟道受热面 -->
  <text x="600" y="80" text-anchor="middle" font-size="14" fill="#333">尾部烟道</text>
  <rect x="545" y="95" width="110" height="46" rx="4" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="123" text-anchor="middle" font-size="13" fill="#333">过热器</text>
  <rect x="545" y="175" width="110" height="46" rx="4" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="203" text-anchor="middle" font-size="13" fill="#333">省煤器</text>
  <rect x="545" y="255" width="110" height="46" rx="4" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="283" text-anchor="middle" font-size="13" fill="#333">空气预热器</text>
  <!-- 烟气流动方向 -->
  <line x1="525" y1="118" x2="545" y2="118" stroke="#333" stroke-width="2"/>
  <polygon points="552,118 540,112 540,124" fill="#333"/>
  <line x1="525" y1="198" x2="545" y2="198" stroke="#333" stroke-width="2"/>
  <polygon points="552,198 540,192 540,204" fill="#333"/>
  <line x1="525" y1="278" x2="545" y2="278" stroke="#333" stroke-width="2"/>
  <polygon points="552,278 540,272 540,284" fill="#333"/>
  <text x="505" y="112" text-anchor="end" font-size="13" fill="#333">烟气</text>
  <!-- 给水入省煤器 -->
  <line x1="490" y1="198" x2="545" y2="198" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="552,198 540,192 540,204" fill="#1f6f8b"/>
  <text x="500" y="190" text-anchor="end" font-size="13" fill="#333">给水</text>
  <!-- 省煤器至汽包 -->
  <line x1="545" y1="175" x2="480" y2="130" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="474,126 476,140 486,132" fill="#1f6f8b"/>
  <text x="475" y="120" text-anchor="end" font-size="12" fill="#333">预热后给水</text>
  <!-- 图注 -->
  <text x="360" y="420" text-anchor="middle" font-size="14" fill="#333">循环路径：给水 → 省煤器 → 汽包 → 下降管 → 下集箱 → 水冷壁（汽化）→ 汽包</text>
  <text x="360" y="442" text-anchor="middle" font-size="13" fill="#666">水走蓝线（红为汽水上行），烟气走灰线，二者经金属壁换热</text>
</svg>
