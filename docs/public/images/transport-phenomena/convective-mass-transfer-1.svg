<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>双膜理论浓度分布示意图</title>
  <desc>气体相与液体相之间存在界面，两相各有一层滞流膜，浓度在膜内线性变化，主体相浓度均匀。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="36" font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">双膜理论（Two-Film Theory）浓度分布</text>
  <g font-family="sans-serif" font-size="15" fill="#333">
    <text x="150" y="80" text-anchor="middle">气相主体</text>
    <text x="492" y="80" text-anchor="middle">液相主体</text>
    <text x="318" y="80" text-anchor="middle">界面</text>
  </g>
  <line x1="170" y1="105" x2="470" y2="105" stroke="#333" stroke-width="2"/>
  <text x="150" y="100" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">气相浓度 p_{A} 高</text>
  <text x="492" y="100" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">液相浓度 c_{A} 低</text>
  <line x1="320" y1="100" x2="320" y2="400" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="332" y="395" font-family="sans-serif" font-size="14" fill="#c0392b">界面</text>
  <rect x="220" y="120" width="100" height="260" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="340" y="120" width="90" height="260" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="135" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">气膜</text>
  <text x="385" y="135" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">液膜</text>
  <polyline points="150,150 220,150 220,260 320,260 320,320 340,320 340,380 470,380"
    fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="150" y1="150" x2="470" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="150" cy="150" r="4" fill="#c0392b"/>
  <circle cx="220" cy="150" r="4" fill="#c0392b"/>
  <circle cx="320" cy="260" r="4" fill="#c0392b"/>
  <circle cx="340" cy="320" r="4" fill="#c0392b"/>
  <circle cx="470" cy="380" r="4" fill="#c0392b"/>
  <text x="140" y="145" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="end">p_{A,b}</text>
  <text x="212" y="145" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="end">p_{A,i}</text>
  <text x="332" y="252" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="start">c_{A,i}</text>
  <text x="352" y="312" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="start">c_{A,b}</text>
  <text x="300" y="200" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">膜内浓度线性下降（扩散阻力）</text>
  <text x="305" y="360" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">主体浓度均匀（对流混合）</text>
  <text x="320" y="415" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">气膜 + 液膜 = 串联传质阻力，界面处浓度由平衡关系决定</text>
</svg>
