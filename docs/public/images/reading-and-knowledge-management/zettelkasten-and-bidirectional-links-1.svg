<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">卡片盒笔记法的三层工作流与双向链接</title>
<desc id="desc">从阅读与灵感进入闪念笔记，经加工拆分为文献笔记（作者的话）与永久笔记（你的话），永久笔记之间通过双向链接结成网络，最终生长出主题与文章。</desc>
<rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333">卡片盒笔记法：从输入到网络的生长</text>

<g>
<rect x="40" y="60" width="170" height="60" rx="8" fill="#f0e9e2" stroke="#333" stroke-width="2"/>
<text x="125" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">输入</text>
<text x="125" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">阅读 / 对话 / 灵感</text>
</g>

<g>
<rect x="300" y="60" width="170" height="60" rx="8" fill="#fdf3d8" stroke="#c9a227" stroke-width="2"/>
<text x="385" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c9a227">闪念笔记</text>
<text x="385" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">随时捕获，稍后处理</text>
</g>
<path d="M210 90 C 250 90, 260 90, 295 90" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<g>
<rect x="40" y="200" width="260" height="80" rx="8" fill="#e3edf1" stroke="#1f6f8b" stroke-width="2"/>
<text x="170" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">文献笔记（作者的话）</text>
<text x="170" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">阅读时转述作者观点</text>
<text x="170" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">标注来源，是素材</text>
</g>
<path d="M340 120 C 280 150, 220 170, 190 195" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<g>
<rect x="340" y="200" width="260" height="80" rx="8" fill="#e8f0e0" stroke="#5a8a3c" stroke-width="2"/>
<text x="470" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5a8a3c">永久笔记（你的话）</text>
<text x="470" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">一条一个想法，原子化</text>
<text x="470" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">用自己的话写完整</text>
</g>
<path d="M430 120 C 445 150, 455 170, 460 195" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<path d="M305 205 C 320 215, 330 215, 340 210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<g>
<rect x="160" y="330" width="320" height="70" rx="8" fill="#f7e6e2" stroke="#c0392b" stroke-width="2.5"/>
<text x="320" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">双向链接的网络</text>
<text x="320" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">永久笔记互相引用，旧想法不断被新笔记连接</text>
<text x="320" y="393" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">越用越值钱：网络而非文件夹</text>
</g>
<path d="M170 280 C 240 305, 260 305, 300 330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<path d="M470 280 C 430 305, 360 310, 330 330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<g>
<rect x="440" y="340" width="160" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="5 3"/>
<text x="520" y="364" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">产出：主题与文章</text>
<text x="520" y="381" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">顺藤摸瓜即成稿</text>
</g>
<path d="M480 345 C 500 355, 505 355, 505 345" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker>
</defs>
</svg>
