<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">康奈尔笔记法的页面分区</title>
<desc id="desc">一张康奈尔笔记纸被分为四块：顶部标题栏、左侧约三分之一宽的线索栏、右侧约三分之二宽的笔记栏、底部总结栏，并标注对应的五步操作记录/简化/背诵/反思/复习。</desc>
<rect x="0" y="0" width="640" height="470" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333">康奈尔笔记法：一页纸的四块分区</text>

<g>
<rect x="40" y="55" width="560" height="360" rx="6" fill="#fff" stroke="#333" stroke-width="2.5"/>
<text x="60" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f6f8b">标题栏</text>
<text x="160" y="82" font-family="sans-serif" font-size="14" fill="#666">主题 / 书名 / 日期 —— 一眼检索</text>
<line x1="40" y1="95" x2="600" y2="95" stroke="#333" stroke-width="2"/>
<line x1="230" y1="95" x2="230" y2="335" stroke="#333" stroke-width="2"/>
<text x="60" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b">线索栏（约 1/3）</text>
<text x="60" y="148" font-family="sans-serif" font-size="13" fill="#333">关键词、问题、提示词</text>
<text x="60" y="170" font-family="sans-serif" font-size="13" fill="#333">（复习时遮住笔记栏，</text>
<text x="60" y="188" font-family="sans-serif" font-size="13" fill="#333">凭它回忆内容）</text>
<text x="255" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5a8a3c">笔记栏（约 2/3）</text>
<text x="255" y="148" font-family="sans-serif" font-size="13" fill="#333">记录正文：概念、论证、例证</text>
<text x="255" y="168" font-family="sans-serif" font-size="13" fill="#333">用自己的话写，短句 + 缩进分层</text>
<text x="255" y="188" font-family="sans-serif" font-size="13" fill="#333">这里放「作者的话」与你的转译</text>
<line x1="40" y1="335" x2="600" y2="335" stroke="#333" stroke-width="2"/>
<text x="60" y="358" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9a227">总结栏（底部 1–2 行）</text>
<text x="60" y="380" font-family="sans-serif" font-size="13" fill="#333">用两三句话概括本页核心：读完后合上本，写「这页在谈什么」</text>
</g>

<g>
<text x="612" y="110" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">5R 步骤</text>
<text x="612" y="136" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">① Record 记录 → 笔记栏</text>
<text x="612" y="158" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">② Reduce 简化 → 线索栏</text>
<text x="612" y="180" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">③ Recite 背诵 → 遮住右栏回忆</text>
<text x="612" y="202" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">④ Reflect 反思 → 总结栏</text>
<text x="612" y="224" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">⑤ Review 复习 → 间隔回看</text>
</g>
</svg>
