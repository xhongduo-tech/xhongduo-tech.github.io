<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">阅读的四个层次：层层包含的关系</title>
<desc id="desc">四个嵌套矩形表示阅读的四个层次：最内层是基础阅读，向外依次是检视阅读、分析阅读、主题阅读；每一层都是上一层的真超集。</desc>
<rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
<text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333">阅读的四个层次（层层包含）</text>
<text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">会读更高层次，必然已掌握更低层次；层次之间是「包含」而非「并列」</text>

<g>
<rect x="70" y="105" width="500" height="290" rx="10" fill="#f7e6e2" stroke="#c0392b" stroke-width="3"/>
<text x="610" y="140" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0392b">L4 主题阅读</text>
<text x="610" y="162" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">读一群相关的书，</text>
<text x="610" y="180" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">综合成一个自己的答案</text>
</g>

<g>
<rect x="135" y="165" width="380" height="180" rx="8" fill="#e3edf1" stroke="#1f6f8b" stroke-width="3"/>
<text x="545" y="200" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f6f8b">L3 分析阅读</text>
<text x="545" y="222" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">咀嚼一本书，问它</text>
<text x="545" y="240" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">「在谈什么、有道理吗」</text>
</g>

<g>
<rect x="200" y="225" width="260" height="75" rx="6" fill="#fdf3d8" stroke="#c9a227" stroke-width="3"/>
<text x="485" y="250" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c9a227">L2 检视阅读</text>
<text x="485" y="272" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">有限时间抓骨架与判断</text>
</g>

<g>
<rect x="265" y="262" width="130" height="42" rx="6" fill="#e8f0e0" stroke="#5a8a3c" stroke-width="3"/>
<text x="415" y="281" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="bold" fill="#5a8a3c">L1 基础</text>
<text x="415" y="299" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">识字、读懂字面</text>
</g>

<text x="330" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">记法：L₁ ⊂ L₂ ⊂ L₃ ⊂ L₄</text>
<text x="330" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">每一层都「包含」下面所有层——这就是层次（level），不是并列的种类（kind）</text>
</svg>
