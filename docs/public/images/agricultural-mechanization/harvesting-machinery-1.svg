<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>联合收割机结构剖面示意</title>
  <desc>联合收割机从割台到清选的五道工序物料流剖面图</desc>
  <rect width="800" height="460" fill="#faf9f5"/>
  <g font-size="15" fill="#333">
    <text x="40" y="40" font-weight="bold">作物进入 →</text>

    <!-- 割台 -->
    <rect x="40" y="70" width="130" height="120" rx="10" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
    <text x="105" y="105" text-anchor="middle" font-weight="bold">割台</text>
    <text x="105" y="130" text-anchor="middle">往复割刀</text>
    <text x="105" y="150" text-anchor="middle">+ 螺旋推运</text>
    <text x="105" y="170" text-anchor="middle">切断收拢</text>

    <!-- 喂入 -->
    <rect x="200" y="70" width="110" height="120" rx="10" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
    <text x="255" y="105" text-anchor="middle" font-weight="bold">喂入器</text>
    <text x="255" y="130" text-anchor="middle">倾斜输送链</text>
    <text x="255" y="150" text-anchor="middle">压成草帘</text>
    <line x1="170" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <!-- 脱粒 -->
    <rect x="340" y="60" width="150" height="140" rx="10" fill="#c0392b" opacity="0.15" stroke="#c0392b"/>
    <text x="415" y="95" text-anchor="middle" font-weight="bold">脱粒</text>
    <text x="415" y="120" text-anchor="middle">滚筒 + 凹板</text>
    <text x="415" y="145" text-anchor="middle">高速打击脱粒</text>
    <text x="415" y="168" text-anchor="middle">v = πDn/60</text>
    <line x1="310" y1="130" x2="340" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <!-- 分离 -->
    <rect x="520" y="180" width="150" height="120" rx="10" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
    <text x="595" y="215" text-anchor="middle" font-weight="bold">分离</text>
    <text x="595" y="240" text-anchor="middle">逐稿器 / 旋转分离</text>
    <text x="595" y="262" text-anchor="middle">抖动分出谷粒</text>
    <line x1="490" y1="130" x2="595" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <!-- 清选 -->
    <rect x="340" y="260" width="150" height="120" rx="10" fill="#c0392b" opacity="0.15" stroke="#c0392b"/>
    <text x="415" y="295" text-anchor="middle" font-weight="bold">清选</text>
    <text x="415" y="320" text-anchor="middle">风扇 + 上下筛</text>
    <text x="415" y="345" text-anchor="middle">谷粒落、杂物吹走</text>
    <line x1="415" y1="200" x2="415" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <!-- 粮箱 -->
    <rect x="90" y="280" width="150" height="100" rx="10" fill="#faf9f5" stroke="#1f6f8b"/>
    <text x="165" y="315" text-anchor="middle" font-weight="bold">粮箱（谷粒）</text>
    <text x="165" y="340" text-anchor="middle">螺旋升运入仓</text>
    <line x1="340" y1="320" x2="240" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <!-- 茎秆排出 -->
    <rect x="520" y="60" width="130" height="90" rx="10" fill="#faf9f5" stroke="#333"/>
    <text x="585" y="90" text-anchor="middle" font-weight="bold">茎秆排出</text>
    <text x="585" y="115" text-anchor="middle">切碎抛撒回田</text>
    <line x1="490" y1="110" x2="520" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>

    <text x="400" y="440" text-anchor="middle" font-size="13">物料流方向：割台 → 喂入 → 脱粒 → 分离 → 清选 → 粮箱 / 茎秆排出</text>
  </g>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
