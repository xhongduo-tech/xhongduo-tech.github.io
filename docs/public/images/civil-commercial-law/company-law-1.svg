<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif">
  <title>公司治理结构：三会一层与审计委员会</title>
  <desc>以股东会为最高权力机构的公司治理示意图：股东会选举产生董事会与监事会，董事会聘任经理，审计委员会可替代监事会行使监督职权。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">公司治理结构：三会一层</text>

  <!-- 股东会 -->
  <rect x="190" y="60" width="260" height="52" rx="8" fill="#1f6f8b" stroke="#0f4a5f" stroke-width="2"/>
  <text x="320" y="82" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">股东（大）会</text>
  <text x="320" y="102" text-anchor="middle" font-size="13" fill="#e8f4f8">权力机构 · 最高意思机关</text>

  <!-- 箭头：股东会 -> 董事会/监事会 -->
  <line x1="220" y1="112" x2="110" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="112" x2="530" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 董事会 -->
  <rect x="30" y="182" width="180" height="52" rx="8" fill="#c0392b" stroke="#8f2216" stroke-width="2"/>
  <text x="120" y="204" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">董事会</text>
  <text x="120" y="224" text-anchor="middle" font-size="13" fill="#fdecea">经营决策机构</text>

  <!-- 监事会/审计委员会 -->
  <rect x="440" y="182" width="180" height="52" rx="8" fill="#c0392b" stroke="#8f2216" stroke-width="2"/>
  <text x="530" y="204" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">监事会 / 审计委员会</text>
  <text x="530" y="224" text-anchor="middle" font-size="13" fill="#fdecea">监督机构</text>

  <!-- 箭头：董事会 -> 经理 -->
  <line x1="120" y1="234" x2="120" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 箭头：监事会/审计 -> 经理 与 董事会（监督） -->
  <line x1="530" y1="234" x2="530" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="532" y="290" font-size="13" fill="#666">监督</text>
  <line x1="530" y1="235" x2="240" y2="235" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="385" y="228" text-anchor="middle" font-size="13" fill="#666">监督</text>

  <!-- 经理 -->
  <rect x="30" y="322" width="180" height="52" rx="8" fill="#8a6d3b" stroke="#5f4a24" stroke-width="2"/>
  <text x="120" y="344" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">经理</text>
  <text x="120" y="364" text-anchor="middle" font-size="13" fill="#f6efe0">执行机构 · 日常经营</text>

  <!-- 右侧注解 -->
  <rect x="430" y="300" width="190" height="74" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="525" y="322" text-anchor="middle" font-size="13" fill="#1f6f8b" font-weight="bold">法定代表人</text>
  <text x="525" y="344" text-anchor="middle" font-size="13" fill="#333">由执行公司事务的</text>
  <text x="525" y="362" text-anchor="middle" font-size="13" fill="#333">董事或经理担任</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
