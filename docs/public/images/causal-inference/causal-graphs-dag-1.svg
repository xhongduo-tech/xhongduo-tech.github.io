<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240">
  <title>吸烟、焦油与肺癌的因果 DAG 示例</title>
  <desc>以吸烟、焦油沉积、肺癌及一个未观测混杂因子基因型构成的 DAG，展示链结构与未观测混杂</desc>
  <rect width="560" height="240" fill="#faf9f5"/>
  <!-- 节点 -->
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <!-- 吸烟 X -->
    <rect x="40" y="90" width="120" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="100" y="118">吸烟 X</text>
    <!-- 基因型 U（未观测） -->
    <rect x="200" y="14" width="140" height="44" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="270" y="41" fill="#1f6f8b">基因型 U（未观测）</text>
    <!-- 焦油 C -->
    <rect x="220" y="160" width="140" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="290" y="188">焦油沉积 C</text>
    <!-- 肺癌 L -->
    <rect x="410" y="160" width="140" height="44" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="480" y="188" fill="#c0392b">肺癌 L</text>
  </g>
  <!-- 箭头 -->
  <g stroke="#333" stroke-width="2" fill="#333" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <line x1="160" y1="112" x2="226" y2="48" stroke="#1f6f8b" stroke-dasharray="6,4" marker-end="url(#arrow1)"/>
  <line x1="220" y1="44" x2="452" y2="160" stroke="#1f6f8b" stroke-dasharray="6,4" marker-end="url(#arrow1)"/>
  <line x1="160" y1="112" x2="220" y2="160"/>
  <line x1="290" y1="204" x2="440" y2="204"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <!-- 图例 -->
  <g font-family="sans-serif" font-size="13" fill="#333">
    <text x="40" y="232">实线：可观测因果　虚线：未观测混杂因子 U（无法直接控制，需靠 do 演算与反事实处理）</text>
  </g>
</svg>
