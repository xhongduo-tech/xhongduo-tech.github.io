<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="sans-serif">
  <title>三类理想化滤波器的幅度响应</title>
  <desc>以归一化频率 u=ω/ωc 为横轴，比较低通、高通、带通三种滤波器的幅度响应曲线：低通在 ωc 后衰减，高通在 ωc 后平坦，带通在 ωc 处达峰。</desc>
  <rect x="0" y="0" width="460" height="300" fill="#faf9f5"/>
  <text x="12" y="20" font-size="14" fill="#c0392b" font-weight="bold">滤波整形：三种基本的幅度响应 |H(jω)|</text>

  <!-- 坐标轴 -->
  <line x1="50" y1="230" x2="420" y2="230" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="50" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="28" y="235" font-size="13" fill="#333">0</text>
  <text x="28" y="160" font-size="12" fill="#666">0.5</text>
  <text x="22" y="86" font-size="12" fill="#666">1.0</text>
  <line x1="45" y1="155" x2="50" y2="155" stroke="#666" stroke-width="1"/>
  <text x="160" y="252" font-size="12" fill="#666">ωc</text>
  <text x="272" y="252" font-size="12" fill="#666">2ωc</text>
  <text x="380" y="252" font-size="12" fill="#666">3ωc</text>

  <!-- 低通 -->
  <polyline points="60,80 93,86 115,96 137,107 170,124 225,147 280,163 335,174 390,183" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="330" y="196" font-size="13" fill="#1f6f8b">低通</text>

  <!-- 高通 -->
  <polyline points="60,230 93,187 115,163 137,144 170,124 225,105 280,96 335,91 390,88" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="310" y="76" font-size="13" fill="#c0392b">高通</text>

  <!-- 带通 -->
  <polyline points="60,230 93,147 115,110 137,89 170,80 225,92 280,110 335,126 390,140" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="150" y="120" font-size="13" fill="#333">带通</text>

  <!-- 低通带宽标注 -->
  <text x="62" y="268" font-size="12" fill="#1f6f8b">通带（保留）</text>
  <line x1="60" y1="262" x2="170" y2="262" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="190" y="268" font-size="12" fill="#c0392b">阻带（衰减）</text>
  <line x1="170" y1="262" x2="390" y2="262" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
