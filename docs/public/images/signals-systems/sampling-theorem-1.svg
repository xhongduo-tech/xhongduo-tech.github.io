<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="sans-serif">
  <title>采样引起的频谱复制与混叠</title>
  <desc>上：采样率足够高（ωs &gt; 2ωM）时，原频谱的副本彼此不重叠，可用低通完美恢复；下：采样率过低（ωs &lt; 2ωM）时副本重叠，重叠区被污染，出现混叠。</desc>
  <rect x="0" y="0" width="460" height="300" fill="#faf9f5"/>
  <text x="12" y="20" font-size="14" fill="#c0392b" font-weight="bold">采样 = 频谱以 ωs 为周期复制</text>

  <!-- 上栏：无混叠 -->
  <text x="12" y="46" font-size="13" fill="#1f6f8b">ωs &gt; 2ωM：副本不重叠，可完美重建</text>
  <line x1="30" y1="105" x2="430" y2="105" stroke="#333" stroke-width="1"/>
  <polygon points="90,105 160,45 230,105" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="230,105 300,45 370,105" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="160,105 230,45 300,105" fill="#1f6f8b" opacity="0.8"/>
  <text x="222" y="38" font-size="12" fill="#1f6f8b">X(jω)</text>
  <text x="70" y="120" font-size="12" fill="#666">-ωs</text>
  <text x="224" y="120" font-size="12" fill="#666">0</text>
  <text x="368" y="120" font-size="12" fill="#666">ωs</text>

  <!-- 下栏：混叠 -->
  <text x="12" y="176" font-size="13" fill="#c0392b">ωs &lt; 2ωM：副本重叠，产生混叠（污染区）</text>
  <line x1="30" y1="235" x2="430" y2="235" stroke="#333" stroke-width="1"/>
  <polygon points="130,235 165,175 200,235" fill="#c0392b" opacity="0.3"/>
  <polygon points="260,235 295,175 330,235" fill="#c0392b" opacity="0.3"/>
  <polygon points="165,235 230,175 295,235" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="95,235 130,175 165,235" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="330,235 365,175 400,235" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="215" y="168" font-size="12" fill="#666">重叠</text>
  <text x="65" y="250" font-size="12" fill="#666">-ωs</text>
  <text x="224" y="250" font-size="12" fill="#666">0</text>
  <text x="360" y="250" font-size="12" fill="#666">ωs</text>
  <text x="300" y="205" font-size="12" fill="#c0392b">污染</text>
</svg>
