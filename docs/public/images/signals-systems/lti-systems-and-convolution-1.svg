<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" font-family="sans-serif">
  <title>卷积的翻转-平移-相乘-积分过程</title>
  <desc>矩形脉冲与矩形脉冲卷积：上图为 x(τ)，中图为在 t=1 处翻转平移后的 h(t-τ) 并与 x 重叠，阴影区面积即卷积值 y(1)；下图为完整卷积结果 y(t) 三角形。</desc>
  <rect x="0" y="0" width="460" height="320" fill="#faf9f5"/>
  <text x="12" y="20" font-size="14" fill="#c0392b" font-weight="bold">卷积的三步：翻转 → 平移 → 相乘并积分</text>

  <!-- 第一栏：x(τ) -->
  <text x="12" y="58" font-size="13" fill="#333">x(τ)（输入脉冲）</text>
  <line x1="30" y1="60" x2="410" y2="60" stroke="#333" stroke-width="1"/>
  <rect x="120" y="30" width="120" height="30" fill="#1f6f8b" opacity="0.85"/>
  <text x="158" y="24" font-size="13" fill="#1f6f8b">高度 = 1</text>
  <text x="120" y="76" font-size="12" fill="#666">τ=0</text>
  <text x="232" y="76" font-size="12" fill="#666">τ=2</text>

  <!-- 第二栏：h(t-τ)，t=1，与 x 重叠 -->
  <text x="12" y="148" font-size="13" fill="#333">h(t−τ)，取 t = 1（已翻转平移）</text>
  <line x1="30" y1="150" x2="410" y2="150" stroke="#333" stroke-width="1"/>
  <rect x="60" y="120" width="120" height="30" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="70" y="114" font-size="13" fill="#c0392b">h 的波形（翻转后）</text>
  <rect x="120" y="120" width="60" height="30" fill="#c0392b" opacity="0.35"/>
  <text x="126" y="142" font-size="12" fill="#333">重叠区</text>
  <text x="57" y="166" font-size="12" fill="#666">τ=-1</text>
  <text x="120" y="166" font-size="12" fill="#666">τ=0</text>
  <text x="172" y="166" font-size="12" fill="#666">τ=1</text>

  <!-- 第三栏：y(t) -->
  <text x="12" y="238" font-size="13" fill="#333">y(t) = x(t) ∗ h(t)（结果三角形）</text>
  <line x1="30" y1="240" x2="410" y2="240" stroke="#333" stroke-width="1"/>
  <polygon points="120,240 240,195 360,240" fill="#1f6f8b" opacity="0.75"/>
  <text x="238" y="188" font-size="13" fill="#1f6f8b">峰值 y(2) = 2</text>
  <text x="120" y="256" font-size="12" fill="#666">t=0</text>
  <text x="240" y="256" font-size="12" fill="#666">t=2</text>
  <text x="356" y="256" font-size="12" fill="#666">t=4</text>
</svg>
