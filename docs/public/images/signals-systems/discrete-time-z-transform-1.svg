<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="sans-serif">
  <title>z 平面：单位圆内的极点稳定</title>
  <desc>z 平面以单位圆划分稳定性：极点落在单位圆内则系统稳定，落在单位圆上为临界，落在单位圆外则不稳定。图中示出稳定极点 z=0.5、单位圆上极点 z=j 与不稳定极点 z=1.2。</desc>
  <rect x="0" y="0" width="460" height="300" fill="#faf9f5"/>
  <text x="12" y="20" font-size="14" fill="#c0392b" font-weight="bold">z 平面：单位圆是离散稳定性的分界线</text>

  <!-- 稳定区 -->
  <circle cx="230" cy="150" r="100" fill="#1f6f8b" opacity="0.12"/>
  <circle cx="230" cy="150" r="100" fill="none" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 坐标轴 -->
  <line x1="30" y1="150" x2="430" y2="150" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="230" y1="25" x2="230" y2="275" stroke="#333" stroke-width="1" opacity="0.5"/>
  <text x="424" y="166" font-size="13" fill="#333">Re</text>
  <text x="238" y="36" font-size="13" fill="#333">Im</text>

  <!-- 极点 -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="273" y1="143" x2="287" y2="157"/>
    <line x1="287" y1="143" x2="273" y2="157"/>
    <line x1="223" y1="43" x2="237" y2="57"/>
    <line x1="237" y1="43" x2="223" y2="57"/>
    <line x1="343" y1="143" x2="357" y2="157"/>
    <line x1="357" y1="143" x2="343" y2="157"/>
  </g>

  <text x="250" y="140" font-size="13" fill="#c0392b">z=0.5（稳定）</text>
  <text x="246" y="62" font-size="13" fill="#c0392b">z=j（单位圆上）</text>
  <text x="308" y="188" font-size="13" fill="#c0392b">z=1.2（不稳定）</text>
  <text x="120" y="130" font-size="13" fill="#1f6f8b">单位圆内 = 稳定区</text>
</svg>
