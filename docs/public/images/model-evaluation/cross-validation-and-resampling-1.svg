<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
<title>五折交叉验证示意图</title>
<desc>数据集被均分为五折，每一折轮流充当测试折，其余四折充当训练折，五轮测试误差取平均即得交叉验证误差估计。</desc>
<rect width="820" height="440" fill="#faf9f5"/>
<text x="410" y="40" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">K 折交叉验证（K = 5）</text>
<rect x="330" y="60" width="20" height="14" fill="#1f6f8b"/>
<text x="360" y="72" font-size="13" fill="#333">训练数据</text>
<rect x="470" y="60" width="20" height="14" fill="#c0392b"/>
<text x="500" y="72" font-size="13" fill="#333">测试数据（当轮不参与训练）</text>
<text x="95" y="122" font-size="14" fill="#333" text-anchor="end" font-weight="bold">第 1 轮</text>
<text x="95" y="176" font-size="14" fill="#333" text-anchor="end" font-weight="bold">第 2 轮</text>
<text x="95" y="230" font-size="14" fill="#333" text-anchor="end" font-weight="bold">第 3 轮</text>
<text x="95" y="284" font-size="14" fill="#333" text-anchor="end" font-weight="bold">第 4 轮</text>
<text x="95" y="338" font-size="14" fill="#333" text-anchor="end" font-weight="bold">第 5 轮</text>
<g>
  <rect x="150" y="104" width="110" height="34" fill="#c0392b"/>
  <text x="205" y="126" font-size="13" fill="#fff" text-anchor="middle">测试</text>
  <rect x="268" y="104" width="110" height="34" fill="#1f6f8b"/>
  <rect x="386" y="104" width="110" height="34" fill="#1f6f8b"/>
  <rect x="504" y="104" width="110" height="34" fill="#1f6f8b"/>
  <rect x="622" y="104" width="110" height="34" fill="#1f6f8b"/>
  <text x="750" y="126" font-size="14" fill="#c0392b" font-weight="bold">e_1</text>
</g>
<g>
  <rect x="150" y="158" width="110" height="34" fill="#1f6f8b"/>
  <rect x="268" y="158" width="110" height="34" fill="#c0392b"/>
  <text x="323" y="180" font-size="13" fill="#fff" text-anchor="middle">测试</text>
  <rect x="386" y="158" width="110" height="34" fill="#1f6f8b"/>
  <rect x="504" y="158" width="110" height="34" fill="#1f6f8b"/>
  <rect x="622" y="158" width="110" height="34" fill="#1f6f8b"/>
  <text x="750" y="180" font-size="14" fill="#c0392b" font-weight="bold">e_2</text>
</g>
<g>
  <rect x="150" y="212" width="110" height="34" fill="#1f6f8b"/>
  <rect x="268" y="212" width="110" height="34" fill="#1f6f8b"/>
  <rect x="386" y="212" width="110" height="34" fill="#c0392b"/>
  <text x="441" y="234" font-size="13" fill="#fff" text-anchor="middle">测试</text>
  <rect x="504" y="212" width="110" height="34" fill="#1f6f8b"/>
  <rect x="622" y="212" width="110" height="34" fill="#1f6f8b"/>
  <text x="750" y="234" font-size="14" fill="#c0392b" font-weight="bold">e_3</text>
</g>
<g>
  <rect x="150" y="266" width="110" height="34" fill="#1f6f8b"/>
  <rect x="268" y="266" width="110" height="34" fill="#1f6f8b"/>
  <rect x="386" y="266" width="110" height="34" fill="#1f6f8b"/>
  <rect x="504" y="266" width="110" height="34" fill="#c0392b"/>
  <text x="559" y="288" font-size="13" fill="#fff" text-anchor="middle">测试</text>
  <rect x="622" y="266" width="110" height="34" fill="#1f6f8b"/>
  <text x="750" y="288" font-size="14" fill="#c0392b" font-weight="bold">e_4</text>
</g>
<g>
  <rect x="150" y="320" width="110" height="34" fill="#1f6f8b"/>
  <rect x="268" y="320" width="110" height="34" fill="#1f6f8b"/>
  <rect x="386" y="320" width="110" height="34" fill="#1f6f8b"/>
  <rect x="504" y="320" width="110" height="34" fill="#1f6f8b"/>
  <rect x="622" y="320" width="110" height="34" fill="#c0392b"/>
  <text x="677" y="342" font-size="13" fill="#fff" text-anchor="middle">测试</text>
  <text x="750" y="342" font-size="14" fill="#c0392b" font-weight="bold">e_5</text>
</g>
<rect x="180" y="378" width="460" height="40" rx="8" fill="#f5e6e0"/>
<text x="410" y="404" font-size="15" fill="#c0392b" text-anchor="middle">交叉验证误差  CV = (e_1 + e_2 + e_3 + e_4 + e_5) / 5</text>
</svg>
