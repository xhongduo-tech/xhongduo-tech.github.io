<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
<title>学习曲线与容量诊断图</title>
<desc>横轴为训练数据量，纵轴为误差。训练误差随数据量增加缓慢下降，验证误差下降更快后趋于平台，两条曲线的间隙反映方差，间隙小则继续加数据收益有限。</desc>
<rect width="820" height="440" fill="#faf9f5"/>
<text x="410" y="36" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">学习曲线：误差随数据量的变化</text>
<line x1="110" y1="380" x2="760" y2="380" stroke="#333" stroke-width="2"/>
<line x1="110" y1="380" x2="110" y2="70" stroke="#333" stroke-width="2"/>
<text x="435" y="410" font-size="14" fill="#333" text-anchor="middle">训练数据量 n →</text>
<text x="62" y="225" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 62 225)">误差 →</text>
<path d="M130 96 C 220 140, 320 170, 420 185 C 540 200, 650 204, 735 205" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="738" y="196" font-size="14" fill="#c0392b" font-weight="bold">验证误差</text>
<path d="M130 190 C 220 205, 320 210, 420 212 C 540 213, 650 213, 735 212" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<text x="738" y="216" font-size="14" fill="#1f6f8b" font-weight="bold">训练误差</text>
<line x1="300" y1="120" x2="300" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="300" y="112" font-size="13" fill="#666" text-anchor="middle">间隙大：方差主导，</text>
<text x="300" y="128" font-size="13" fill="#666" text-anchor="middle">加数据收益显著</text>
<line x1="600" y1="176" x2="600" y2="213" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="602" y="170" font-size="13" fill="#666" text-anchor="start">间隙小：两者均趋平台，</text>
<text x="602" y="186" font-size="13" fill="#666" text-anchor="start">再加数据收益有限</text>
<rect x="120" y="330" width="300" height="34" rx="6" fill="#f5e6e0"/>
<text x="270" y="352" font-size="14" fill="#c0392b" text-anchor="middle">验证误差高而平 → 增加容量（欠拟合）</text>
<rect x="120" y="370" width="300" height="34" rx="6" fill="#e2f0f5"/>
<text x="270" y="392" font-size="14" fill="#1f6f8b" text-anchor="middle">间隙大 → 增加数据 / 正则化（过拟合）</text>
</svg>
