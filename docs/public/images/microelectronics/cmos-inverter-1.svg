<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" font-family="sans-serif">
<title>CMOS 反相器电压传输特性（VTC）</title>
<desc>输出电压 Vout 随输入电压 Vin 变化的曲线，标注开关阈值 VM、输入高低阈值 VIL 与 VIH，以及理想反相器的阶跃曲线。</desc>
<rect x="0" y="0" width="480" height="400" fill="#fff"/>

<!-- 绘图区：x 轴 70→460，y 轴 20→340 -->
<!-- 坐标轴 -->
<line x1="70" y1="340" x2="460" y2="340" stroke="#333" stroke-width="1.5"/>
<line x1="70" y1="20" x2="70" y2="340" stroke="#333" stroke-width="1.5"/>
<line x1="70" y1="100" x2="460" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="70" y1="340" x2="460" y2="340" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="70" y1="340" x2="460" y2="340" stroke="#333" stroke-width="1.5"/>

<!-- 理想反相器阶跃（青色虚线）：在 VM 处跳变 -->
<polyline points="70,100 265,100 265,340 460,340" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>

<!-- 实际 VTC 曲线（红色） -->
<polyline points="70,100 130,102 190,116 240,150 265,180 290,210 340,285 390,325 460,336" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- VM 点与辅助线 -->
<line x1="265" y1="180" x2="265" y2="340" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="70" y1="180" x2="265" y2="180" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="265" cy="180" r="4" fill="#c0392b"/>
<text x="275" y="170" font-size="14" fill="#333">开关阈值 <tspan font-weight="bold">V<tspan font-size="11" dy="3">M</tspan></tspan></text>

<!-- VIL / VIH 标注 -->
<circle cx="190" cy="116" r="3.5" fill="#333"/>
<circle cx="340" cy="285" r="3.5" fill="#333"/>
<text x="186" y="362" font-size="13" fill="#333">V<tspan font-size="10" dy="2">IL</tspan></text>
<text x="336" y="362" font-size="13" fill="#333">V<tspan font-size="10" dy="2">IH</tspan></text>

<!-- 高低输出区标注 -->
<text x="80" y="88" font-size="13" fill="#1f6f8b">V<tspan font-size="10" dy="-2">OH</tspan> ≈ V<tspan font-size="10" dy="0">DD</tspan>（输出高）</text>
<text x="360" y="332" font-size="13" fill="#1f6f8b">V<tspan font-size="10" dy="2">OL</tspan> ≈ 0（输出低）</text>

<!-- 轴刻度 -->
<text x="62" y="345" font-size="13" fill="#333" text-anchor="end">0</text>
<text x="455" y="345" font-size="13" fill="#333" text-anchor="end">V<tspan font-size="10" dy="2">DD</tspan></text>
<text x="62" y="104" font-size="13" fill="#333" text-anchor="end">V<tspan font-size="10" dy="-2">DD</tspan></text>
<text x="62" y="330" font-size="13" fill="#333" text-anchor="end">0</text>

<!-- 坐标轴名称 -->
<text x="250" y="388" font-size="14" fill="#333" text-anchor="middle">输入电压 V<tspan font-size="11" dy="2">in</tspan></text>
<text x="30" y="185" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 30 185)">输出电压 V<tspan font-size="11" dy="-3">out</tspan></text>

<!-- 过渡带陡峭性说明 -->
<text x="470" y="140" font-size="13" fill="#c0392b" text-anchor="end">过渡带越陡，</text>
<text x="470" y="160" font-size="13" fill="#c0392b" text-anchor="end">噪声容限越大</text>
</svg>
