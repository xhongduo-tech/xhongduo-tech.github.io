<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">教育投资的年龄-收入曲线</title>
  <desc id="desc">横轴为年龄，纵轴为年收入。高中就业者较早开始挣钱但曲线平缓、峰值低；大学毕业者晚 3-4 年开始挣钱但起点更高、增速更快、峰值更高。两条曲线围成的面积代表教育的净收益。</desc>
  <rect width="720" height="440" fill="#faf9f5"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">教育投资的年龄-收入曲线</text>

  <!-- axes -->
  <line x1="80" y1="380" x2="660" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="80" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333" transform="rotate(-90 42 210)">年收入</text>
  <text x="660" y="410" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">年龄</text>
  <!-- age ticks -->
  <text x="80" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">16</text>
  <text x="250" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">22</text>
  <text x="420" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">30</text>
  <text x="580" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">45</text>

  <!-- high-school earnings curve (starts age 18) -->
  <polyline points="120,300 170,275 230,240 300,205 380,175 460,158 540,150 620,148" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="560" y="140" font-family="sans-serif" font-size="14" fill="#1f6f8b">高中就业者</text>

  <!-- college earnings curve (starts age 22, dips during school then rises steeper) -->
  <polyline points="120,336 150,330 190,352 230,368 290,250 360,185 440,135 520,100 600,82" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="520" y="72" font-family="sans-serif" font-size="14" fill="#c0392b">大学毕业生</text>

  <!-- shading between curves over career span -->
  <polygon points="290,250 360,185 440,135 520,100 600,82 600,148 540,150 460,158 380,175 300,205 290,250" fill="#c0392b" opacity="0.12"/>

  <!-- school-age cost zone -->
  <text x="185" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">读书期</text>
  <text x="185" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（成本 / 机会成本）</text>

  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">净收益</text>
</svg>
