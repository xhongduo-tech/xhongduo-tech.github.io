<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-labelledby="title desc">
  <title id="title">竹刀各部构造示意图</title>
  <desc id="desc">竹刀从剑尖到柄头各部位的名称标注：剑先、先革、中结、锷、锷止、柄、柄头。</desc>
  <rect width="840" height="230" fill="#faf9f5"/>
  <!-- 剑身（四片竹篾） -->
  <polygon points="70,108 520,98 520,122 70,112" fill="#e8d5a3" stroke="#333" stroke-width="2"/>
  <!-- 竹节纹 -->
  <line x1="180" y1="105" x2="180" y2="116" stroke="#b89b5e" stroke-width="2"/>
  <line x1="260" y1="103" x2="260" y2="118" stroke="#b89b5e" stroke-width="2"/>
  <line x1="420" y1="100" x2="420" y2="121" stroke="#b89b5e" stroke-width="2"/>
  <line x1="470" y1="99" x2="470" y2="121" stroke="#b89b5e" stroke-width="2"/>
  <!-- 先革（剑尖皮革套） -->
  <path d="M 55,112 Q 40,110 42,103 Q 44,96 55,102 L 70,106 L 70,114 L 55,112 Z" fill="#3a3a3a"/>
  <!-- 中结（中部绑带） -->
  <rect x="300" y="97" width="14" height="27" rx="3" fill="#c0392b"/>
  <!-- 锷（护手盘） -->
  <ellipse cx="565" cy="110" rx="22" ry="40" fill="#1f6f8b" stroke="#333" stroke-width="2"/>
  <!-- 锷止 -->
  <rect x="588" y="101" width="10" height="18" rx="2" fill="#333"/>
  <!-- 柄（握柄） -->
  <rect x="600" y="96" width="115" height="28" rx="6" fill="#7a4a21" stroke="#333" stroke-width="2"/>
  <!-- 柄卷纹 -->
  <line x1="615" y1="96" x2="615" y2="124" stroke="#5a3417" stroke-width="2"/>
  <line x1="635" y1="96" x2="635" y2="124" stroke="#5a3417" stroke-width="2"/>
  <line x1="655" y1="96" x2="655" y2="124" stroke="#5a3417" stroke-width="2"/>
  <line x1="675" y1="96" x2="675" y2="124" stroke="#5a3417" stroke-width="2"/>
  <line x1="695" y1="96" x2="695" y2="124" stroke="#5a3417" stroke-width="2"/>
  <!-- 柄头 -->
  <rect x="715" y="95" width="12" height="30" rx="3" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <!-- 标注线 -->
  <line x1="48" y1="60" x2="80" y2="60" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="104" stroke="#333" stroke-width="1.5"/>
  <line x1="307" y1="60" x2="307" y2="96" stroke="#333" stroke-width="1.5"/>
  <line x1="565" y1="60" x2="565" y2="72" stroke="#333" stroke-width="1.5"/>
  <line x1="593" y1="60" x2="593" y2="100" stroke="#333" stroke-width="1.5"/>
  <line x1="655" y1="160" x2="655" y2="124" stroke="#333" stroke-width="1.5"/>
  <line x1="721" y1="160" x2="721" y2="126" stroke="#333" stroke-width="1.5"/>
  <!-- 文字标注 -->
  <text x="48" y="52" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">剑先（剑尖）</text>
  <text x="70" y="52" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">先革</text>
  <text x="307" y="52" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">中结</text>
  <text x="565" y="52" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">锷</text>
  <text x="593" y="52" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">锷止</text>
  <text x="655" y="178" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">柄（握柄）</text>
  <text x="721" y="178" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">柄头</text>
</svg>
