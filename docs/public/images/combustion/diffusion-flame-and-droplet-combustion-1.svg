<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="sans-serif">
  <title>球形液滴燃烧示意图</title>
  <desc>中心燃料液滴被球壳状扩散火焰包围：燃料蒸气从液滴表面向外扩散，氧气从环境向内扩散，二者在火焰面相遇燃烧；右侧温度剖面显示温度在火焰面处达到峰值。</desc>
  <rect width="540" height="420" fill="#faf9f5"/>
  <text x="270" y="34" text-anchor="middle" font-size="19" fill="#333" font-weight="bold">球形液滴燃烧示意（d² 定律）</text>

  <!-- 左半：同心圆结构 -->
  <g stroke="#999" stroke-width="1.2">
    <circle cx="165" cy="235" r="152" fill="none" stroke-dasharray="3 3"/>
    <text x="165" y="70" text-anchor="middle" font-size="13" fill="#666">环境气体（氧 + 惰性气体）</text>
  </g>

  <!-- 火焰面（红色虚线圆） -->
  <circle cx="165" cy="235" r="108" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 5"/>
  <text x="288" y="150" font-size="14" fill="#c0392b" font-weight="bold">火焰面</text>
  <line x1="278" y1="155" x2="255" y2="160" stroke="#c0392b" stroke-width="1.2"/>

  <!-- 液滴（青色实心圆） -->
  <circle cx="165" cy="235" r="44" fill="#1f6f8b"/>
  <circle cx="165" cy="235" r="44" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="240" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">液滴</text>

  <!-- 燃料蒸气向外流动箭头（青色） -->
  <g stroke="#1f6f8b" stroke-width="2.4" fill="#1f6f8b">
    <line x1="165" y1="191" x2="165" y2="148"/>
    <line x1="196" y1="214" x2="223" y2="191"/>
    <line x1="196" y1="256" x2="223" y2="279"/>
    <line x1="165" y1="279" x2="165" y2="310"/>
  </g>
  <g fill="#1f6f8b">
    <polygon points="165,142 160,154 170,154"/>
    <polygon points="229,185 218,189 224,199"/>
    <polygon points="229,285 218,275 224,271"/>
    <polygon points="165,316 160,304 170,304"/>
  </g>
  <text x="230" y="238" font-size="14" fill="#1f6f8b" font-weight="bold">燃料蒸气</text>

  <!-- 氧气向内流动箭头（红色） -->
  <g stroke="#c0392b" stroke-width="2.4">
    <line x1="280" y1="215" x2="258" y2="225"/>
    <line x1="278" y1="255" x2="256" y2="246"/>
    <line x1="165" y1="97" x2="165" y2="120"/>
  </g>
  <g fill="#c0392b">
    <polygon points="252,227 264,220 259,212"/>
    <polygon points="250,244 262,251 257,259"/>
    <polygon points="165,126 160,114 170,114"/>
  </g>
  <text x="294" y="246" font-size="14" fill="#c0392b" font-weight="bold">氧气向内</text>

  <!-- 右侧：径向温度剖面 -->
  <text x="430" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">径向温度剖面</text>

  <!-- 坐标轴 -->
  <line x1="330" y1="330" x2="510" y2="330" stroke="#333" stroke-width="1.6"/>
  <line x1="330" y1="120" x2="330" y2="330" stroke="#333" stroke-width="1.6"/>
  <text x="510" y="352" text-anchor="end" font-size="14" fill="#333">径向距离 r →</text>
  <text x="312" y="140" text-anchor="end" font-size="14" fill="#333" transform="rotate(-90 312 200)" x="312" y="200">温度 T</text>

  <!-- 参考线：液滴表面与火焰面 -->
  <line x1="360" y1="120" x2="360" y2="330" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="360" y="348" text-anchor="middle" font-size="13" fill="#1f6f8b">液滴表面</text>

  <line x1="438" y1="120" x2="438" y2="330" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="438" y="348" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">火焰面</text>

  <!-- 环境温度参考线 -->
  <line x1="330" y1="242" x2="510" y2="242" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="508" y="236" text-anchor="end" font-size="13" fill="#666">T∞（环境温度）</text>

  <!-- 温度曲线：低温→峰值(火焰面)→回落 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.8" points="
    345,262
    355,252
    368,232
    382,200
    396,166
    410,130
    424,102
    438,108
    452,138
    466,172
    480,204
    495,228
    510,240
  "/>
  <circle cx="424" cy="102" r="4" fill="#c0392b"/>
  <text x="424" y="88" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">Tf（火焰温度峰值）</text>

  <!-- 图注 -->
  <text x="270" y="392" text-anchor="middle" font-size="13" fill="#666">液滴直径 d 随时间平方递减：d² = d₀² − Kt</text>
</svg>
