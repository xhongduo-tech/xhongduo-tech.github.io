<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="sans-serif">
<title>鼻窦与鼻侧位示意</title>
<desc>头侧位示意图：额窦、筛窦、上颌窦、蝶窦四个鼻窦及其经窦口鼻道复合体向鼻腔的引流</desc>
<rect width="540" height="460" fill="#faf9f5"/>
<defs>
  <marker id="lead" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L5,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>

<text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">鼻窦引流示意（侧位）</text>

<!-- 头部轮廓（侧位，面向左） -->
<ellipse cx="265" cy="245" rx="195" ry="205" fill="#f2ead9" stroke="#333" stroke-width="2"/>

<!-- 眼眶 -->
<circle cx="180" cy="165" r="24" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<text x="112" y="120" text-anchor="middle" font-size="13" fill="#333">眼眶</text>
<path d="M140,128 L162,150" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 鼻腔（含鼻甲） -->
<path d="M150,195 C120,205 108,235 118,268 C128,300 158,312 178,300 C192,290 192,260 186,240 C182,222 172,202 150,195 Z" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<path d="M140,230 C156,226 172,230 182,240" stroke="#c0392b" stroke-width="1.5" fill="none"/>
<path d="M140,252 C156,250 170,254 178,263" stroke="#c0392b" stroke-width="1.5" fill="none"/>
<path d="M143,274 C155,273 164,276 170,283" stroke="#c0392b" stroke-width="1.5" fill="none"/>
<text x="150" y="345" text-anchor="middle" font-size="13" fill="#333">鼻腔（三条红线＝鼻甲）</text>
<path d="M150,318 L158,302" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 额窦 -->
<ellipse cx="215" cy="100" rx="34" ry="15" fill="#1f6f8b" opacity="0.30" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="150" y="72" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">额窦</text>
<path d="M178,80 L200,92" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 筛窦（一组小细胞） -->
<g fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="1">
  <ellipse cx="228" cy="190" rx="12" ry="9"/>
  <ellipse cx="246" cy="182" rx="10" ry="8"/>
  <ellipse cx="247" cy="200" rx="11" ry="8"/>
  <ellipse cx="232" cy="208" rx="10" ry="8"/>
</g>
<text x="300" y="180" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">筛窦</text>
<path d="M276,180 L255,190" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 上颌窦 -->
<ellipse cx="255" cy="258" rx="48" ry="30" fill="#1f6f8b" opacity="0.25" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="338" y="252" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">上颌窦</text>
<path d="M312,248 L302,252" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 蝶窦 -->
<ellipse cx="322" cy="152" rx="24" ry="17" fill="#1f6f8b" opacity="0.30" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="398" y="132" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">蝶窦</text>
<path d="M370,138 L346,150" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 窦口鼻道复合体 -->
<circle cx="213" cy="222" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="88" y="228" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">窦口鼻道复合体</text>
<path d="M118,228 L200,224" stroke="#c0392b" stroke-width="1.2" marker-end="url(#lead)"/>

<!-- 底部注 -->
<text x="270" y="400" text-anchor="middle" font-size="14" fill="#333">四个鼻窦均以纤细开口引流到鼻腔</text>
<text x="270" y="424" text-anchor="middle" font-size="13" fill="#333">引流障碍（开口被炎症/息肉堵住）＝ 鼻窦炎的核心机制</text>
<text x="270" y="446" text-anchor="middle" font-size="13" fill="#333">引流通路畅通 → 炎症可控；引流不通 → 慢性感染与并发症</text>
</svg>
