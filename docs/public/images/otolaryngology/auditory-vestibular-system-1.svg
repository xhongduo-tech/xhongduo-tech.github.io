<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<title>耳蜗基底膜的频率拓扑</title>
<desc>展开的基底膜示意图：基底窄而硬对应高频，蜗顶宽而软对应低频，声波行波从基底向蜗顶传播</desc>
<rect width="640" height="250" fill="#faf9f5"/>
<defs>
  <linearGradient id="freqGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f6f8b"/>
    <stop offset="50%" stop-color="#6a9fb0"/>
    <stop offset="100%" stop-color="#c0392b"/>
  </linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>

<text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">耳蜗基底膜的频率拓扑（展开示意）</text>

<!-- 基底膜：基底（右）窄而硬，蜗顶（左）宽而软 -->
<polygon points="500,95 90,65 90,175 500,140" fill="url(#freqGrad)" stroke="#333" stroke-width="1.5"/>

<!-- 镫骨 / 卵圆窗 -->
<path d="M550,108 L510,104" stroke="#333" stroke-width="3"/>
<path d="M550,132 L510,136" stroke="#333" stroke-width="3"/>
<rect x="552" y="102" width="12" height="34" fill="#c0392b"/>
<text x="595" y="122" text-anchor="middle" font-size="14" fill="#333">镫骨（高频入端）</text>

<!-- 行波方向箭头 -->
<path d="M480,160 L140,160" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="152" text-anchor="middle" font-size="13" fill="#1f6f8b">行波传播方向</text>

<!-- 频率标注 -->
<text x="495" y="82" text-anchor="end" font-size="14" fill="#c0392b" font-weight="bold">高频 ≈ 20 kHz</text>
<text x="95" y="54" text-anchor="start" font-size="14" fill="#1f6f8b" font-weight="bold">≈ 20 Hz 低频</text>
<text x="505" y="150" text-anchor="start" font-size="13" fill="#333">基底（base）</text>
<text x="80" y="190" text-anchor="start" font-size="13" fill="#333">蜗顶（apex）</text>

<!-- 底注 -->
<text x="300" y="220" text-anchor="middle" font-size="14" fill="#333">基底膜：窄、硬 → 高频共振；宽、软 → 低频共振（Greenwood 对数标度）</text>
<text x="300" y="242" text-anchor="middle" font-size="13" fill="#333">声波经镫骨/卵圆窗传入，行波在特征频率处振幅最大</text>
</svg>
