<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="sans-serif">
<title>睡眠呼吸障碍的咽部气道塌陷与 CPAP</title>
<desc>矢状示意：睡眠中软腭后与舌后平面的咽部气道塌陷，以及 CPAP 正压气流撑开气道</desc>
<rect width="560" height="460" fill="#faf9f5"/>
<defs>
  <marker id="lead" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L5,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>

<text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">咽部气道的塌陷与 CPAP 撑开（矢状示意）</text>

<!-- 头部区域 -->
<rect x="72" y="50" width="268" height="312" rx="80" fill="#f2ead9" stroke="#333" stroke-width="2"/>

<!-- 鼻腔 -->
<polygon points="98,104 296,92 296,112 98,126" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<text x="120" y="150" text-anchor="middle" font-size="13" fill="#333">鼻腔</text>

<!-- 硬腭与软腭 -->
<path d="M100,162 L246,154" stroke="#333" stroke-width="3.5"/>
<path d="M246,154 C258,170 268,186 272,205" stroke="#333" stroke-width="3.5" fill="none"/>
<text x="120" y="180" text-anchor="middle" font-size="13" fill="#333">硬腭</text>
<text x="212" y="178" text-anchor="middle" font-size="13" fill="#333">软腭</text>

<!-- 舌 -->
<ellipse cx="168" cy="222" rx="72" ry="24" fill="#f4c9b6" stroke="#333" stroke-width="1.5"/>
<text x="150" y="262" text-anchor="middle" font-size="13" fill="#333">舌</text>

<!-- 咽腔（气道） -->
<rect x="280" y="96" width="45" height="206" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<text x="328" y="160" text-anchor="end" font-size="13" fill="#333">咽腔</text>

<!-- 会厌 -->
<path d="M258,258 C252,272 256,284 270,288 C278,280 274,266 258,258 Z" fill="#f4c9b6" stroke="#333" stroke-width="1.5"/>
<text x="215" y="292" text-anchor="middle" font-size="13" fill="#333">会厌</text>
<path d="M236,288 L252,282" stroke="#333" stroke-width="1" marker-end="url(#lead)"/>

<!-- 声门 / 喉 -->
<path d="M300,306 L312,322 L324,306" stroke="#333" stroke-width="3" fill="none"/>
<text x="330" y="328" text-anchor="start" font-size="13" fill="#333">声门</text>

<!-- 气管与食管 -->
<rect x="296" y="322" width="26" height="64" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<path d="M300,338 H318 M300,352 H318 M300,366 H318" stroke="#333" stroke-width="1.5"/>
<text x="300" y="404" text-anchor="middle" font-size="13" fill="#333">气管</text>
<rect x="334" y="252" width="20" height="120" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
<text x="358" y="330" text-anchor="start" font-size="13" fill="#333">食管</text>

<!-- 塌陷部位 -->
<ellipse cx="302" cy="180" rx="13" ry="9" fill="#c0392b" opacity="0.55"/>
<ellipse cx="302" cy="238" rx="13" ry="9" fill="#c0392b" opacity="0.55"/>
<text x="412" y="176" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">腭后平面塌陷</text>
<path d="M352,180 L320,180" stroke="#c0392b" stroke-width="1.2" marker-end="url(#lead)"/>
<text x="412" y="238" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">舌后平面塌陷</text>
<path d="M352,238 L320,238" stroke="#c0392b" stroke-width="1.2" marker-end="url(#lead)"/>

<!-- CPAP 面罩与正压气流 -->
<rect x="40" y="80" width="48" height="58" rx="10" fill="#dbeef5" stroke="#1f6f8b" stroke-width="2"/>
<text x="64" y="72" text-anchor="middle" font-size="13" fill="#1f6f8b">CPAP 面罩</text>
<path d="M88,105 L100,112" stroke="#1f6f8b" stroke-width="3" marker-end="url(#lead)"/>
<path d="M88,118 L100,118" stroke="#1f6f8b" stroke-width="3" marker-end="url(#lead)"/>
<path d="M88,131 L100,124" stroke="#1f6f8b" stroke-width="3" marker-end="url(#lead)"/>

<!-- 正压气流路径（蓝色虚线） -->
<path d="M103,115 C160,110 220,110 290,108 C300,140 300,200 302,235" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="7,5" fill="none" marker-end="url(#lead)"/>
<text x="180" y="132" text-anchor="middle" font-size="13" fill="#1f6f8b">正压气流撑开塌陷段</text>

<!-- 图例 -->
<text x="280" y="432" text-anchor="middle" font-size="14" fill="#333">红圈＝睡眠中易塌陷的平面（腭后 / 舌后）</text>
<text x="280" y="452" text-anchor="middle" font-size="13" fill="#333">蓝虚线＝CPAP 施加的持续正压，把气道「气撑」开放</text>
</svg>
