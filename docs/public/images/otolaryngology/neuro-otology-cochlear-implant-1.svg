<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
<title>人工耳蜗信号链</title>
<desc>人工耳蜗系统示意图：体外麦克风、言语处理器、发射线圈，体内接收刺激器、电极阵列植入耳蜗</desc>
<rect width="640" height="300" fill="#faf9f5"/>
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>

<text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">人工耳蜗信号链</text>

<!-- 体外模块 -->
<rect x="40" y="70" width="140" height="70" rx="8" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="110" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">麦克风</text>
<text x="110" y="122" text-anchor="middle" font-size="13" fill="#333">采集声波</text>

<rect x="230" y="70" width="160" height="70" rx="8" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="310" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">言语处理器</text>
<text x="310" y="122" text-anchor="middle" font-size="13" fill="#333">滤波器组分频 + 响度压缩</text>

<rect x="440" y="70" width="160" height="70" rx="8" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="520" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">发射线圈</text>
<text x="520" y="122" text-anchor="middle" font-size="13" fill="#333">射频（RF）跨皮传输</text>

<!-- 体外到体内箭头 -->
<path d="M180,105 L228,105" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<path d="M390,105 L438,105" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<path d="M520,140 L520,175" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>

<text x="420" y="160" text-anchor="middle" font-size="12" fill="#1f6f8b">皮肤（体外 / 体内分界）</text>

<!-- 体内模块 -->
<rect x="420" y="180" width="200" height="70" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="520" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">接收-刺激器</text>
<text x="520" y="232" text-anchor="middle" font-size="13" fill="#333">解码 + 电流脉冲输出</text>

<!-- 电极阵列 -->
<path d="M70,220 L420,220" stroke="#c0392b" stroke-width="5" opacity="0.4"/>
<circle cx="120" cy="220" r="5" fill="#c0392b"/>
<circle cx="170" cy="220" r="5" fill="#c0392b"/>
<circle cx="220" cy="220" r="5" fill="#c0392b"/>
<circle cx="270" cy="220" r="5" fill="#c0392b"/>
<circle cx="320" cy="220" r="5" fill="#c0392b"/>
<circle cx="370" cy="220" r="5" fill="#c0392b"/>
<text x="130" y="252" text-anchor="middle" font-size="13" fill="#c0392b">电极阵列（植入鼓阶，贴近螺旋神经节）</text>

<!-- 听神经 -->
<path d="M420,220 L480,220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="560" y="268" text-anchor="middle" font-size="13" fill="#333">→ 听神经 → 脑干</text>

<text x="110" y="295" text-anchor="middle" font-size="13" fill="#333">体外：麦克风 → 分频 → 编码</text>
<text x="520" y="295" text-anchor="middle" font-size="13" fill="#333">体内：刺激器 → 电极 → 听神经</text>
</svg>
