<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <title>最优注意水平与汉德公式</title>
  <desc>横轴为注意水平 x，纵轴为成本；注意成本 C(x) 递增，预期事故损失 P(x)·L 递减，总成本在 x* 处取最小值，对应汉德公式的最优注意水平。</desc>
  <rect width="640" height="380" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="70" y2="40" stroke="#333" stroke-width="1.5"/>
  <polygon points="610,340 600,336 600,344" fill="#333"/>
  <polygon points="70,40 66,50 74,50" fill="#333"/>
  <text x="580" y="362" font-family="sans-serif" font-size="15" fill="#333">注意水平 x →</text>
  <text x="22" y="60" font-family="sans-serif" font-size="15" fill="#333">成本 ↑</text>
  <!-- care cost C(x) -->
  <line x1="90" y1="300" x2="590" y2="120" stroke="#333" stroke-width="2.5"/>
  <text x="470" y="120" font-family="sans-serif" font-size="14" fill="#333">注意成本 C(x)</text>
  <!-- expected loss P(x)*L -->
  <path d="M90 100 Q 200 130, 330 190 Q 460 250, 590 290" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="96" y="92" font-family="sans-serif" font-size="14" fill="#1f6f8b">预期事故损失 P(x)·L</text>
  <!-- total cost C + P*L (U-shaped) -->
  <path d="M90 285 Q 210 152, 330 165 Q 455 182, 590 225" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="470" y="226" font-family="sans-serif" font-size="14" fill="#c0392b">总成本 C + P·L</text>
  <!-- optimal care line -->
  <line x1="330" y1="165" x2="330" y2="80" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="300" y="72" font-family="sans-serif" font-size="15" fill="#c0392b">x* 最优注意水平</text>
  <circle cx="330" cy="165" r="5" fill="#c0392b"/>
  <!-- under-care zone -->
  <text x="140" y="335" font-family="sans-serif" font-size="14" fill="#333">x &lt; x*（注意不足 → 过失）</text>
  <text x="360" y="335" font-family="sans-serif" font-size="14" fill="#333">x ≥ x*（无过失）</text>
</svg>
