<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">光反应与暗反应的联系示意图</title>
  <desc id="desc">光合作用两个阶段示意：左侧光反应在类囊体薄膜上进行，水在光能驱动下光解，释放氧气，并合成 ATP 与 NADPH；右侧暗反应在叶绿体基质中进行，二氧化碳被固定为 C3，C3 在 ATP 与 NADPH 提供能量与还原力后被还原为糖类，同时再生 C5。光反应为暗反应提供 ATP 与 NADPH，暗反应为光反应提供 ADP、Pi 与 NADP+。</desc>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="34" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">光反应与暗反应的物质—能量循环</text>

  <!-- 光反应方框 -->
  <g stroke="#c0392b" stroke-width="1.6" fill="#fbf0ee">
    <rect x="60" y="100" width="280" height="220" rx="10"/>
  </g>
  <text x="200" y="128" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">光反应阶段</text>
  <text x="200" y="148" font-size="13" fill="#333" text-anchor="middle">场所：类囊体薄膜</text>
  <text x="200" y="180" font-size="13" fill="#333" text-anchor="middle">水光解：2H2O → O2↑ + 4H+ + 4e-</text>
  <text x="200" y="202" font-size="13" fill="#333" text-anchor="middle">ATP 合成：ADP+Pi+能量 → ATP</text>
  <text x="200" y="224" font-size="13" fill="#333" text-anchor="middle">NADPH 合成：NADP++H++2e- → NADPH</text>
  <text x="200" y="258" font-size="13" fill="#1f6f8b" text-anchor="middle">能量：光能 → 活跃化学能</text>
  <text x="200" y="296" font-size="13" fill="#333" text-anchor="middle">产物：O2、ATP、NADPH</text>

  <!-- 暗反应方框 -->
  <g stroke="#1f6f8b" stroke-width="1.6" fill="#eef4f6">
    <rect x="460" y="100" width="280" height="220" rx="10"/>
  </g>
  <text x="600" y="128" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">暗反应阶段</text>
  <text x="600" y="148" font-size="13" fill="#333" text-anchor="middle">场所：叶绿体基质</text>
  <text x="600" y="180" font-size="13" fill="#333" text-anchor="middle">CO2 固定：CO2 + C5 → 2C3</text>
  <text x="600" y="202" font-size="13" fill="#333" text-anchor="middle">C3 还原：2C3 → 糖类 + C5</text>
  <text x="600" y="224" font-size="13" fill="#333" text-anchor="middle">（需 ATP 提供能量、NADPH 提供还原力）</text>
  <text x="600" y="258" font-size="13" fill="#1f6f8b" text-anchor="middle">能量：活跃化学能 → 稳定化学能</text>
  <text x="600" y="296" font-size="13" fill="#333" text-anchor="middle">产物：糖类（有机物）、C5</text>

  <!-- 光反应 到 暗反应：ATP / NADPH -->
  <line x1="342" y1="150" x2="456" y2="150" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="399" y="140" font-size="13" fill="#c0392b" text-anchor="middle">ATP、NADPH</text>

  <!-- 暗反应 到 光反应：ADP / NADP+ -->
  <line x1="456" y1="270" x2="342" y2="270" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="399" y="290" font-size="13" fill="#1f6f8b" text-anchor="middle">ADP、Pi、NADP+</text>

  <!-- 输入输出 -->
  <text x="140" y="82" font-size="13" fill="#333" text-anchor="middle">水 H2O</text>
  <line x1="160" y1="88" x2="180" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="80" font-size="13" fill="#c0392b" text-anchor="middle">氧气 O2 释放</text>
  <line x1="330" y1="86" x2="300" y2="98" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="540" y="82" font-size="13" fill="#333" text-anchor="middle">二氧化碳 CO2</text>
  <line x1="560" y1="88" x2="580" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="82" font-size="13" fill="#1f6f8b" text-anchor="middle">糖类（有机物）</text>
  <line x1="660" y1="86" x2="630" y2="98" stroke="#1f6f8b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="200" y="352" font-size="13" fill="#333" text-anchor="middle">光能 ↓</text>
  <text x="600" y="352" font-size="13" fill="#333" text-anchor="middle">长期无光 → 无 ATP/NADPH → 暗反应停摆</text>

  <text x="400" y="438" font-size="13" fill="#333" text-anchor="middle">光反应为暗反应供能、供还原力；暗反应把“空电池”（ADP、NADP+）送回光反应</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
