<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">光学显微镜结构示意图</title>
  <desc id="desc">侧视的光学显微镜结构示意图。中央竖轴自下而上依次为：镜座、反光镜、载物台（中央为通光孔，台上有压片夹）、物镜、物镜转换器、镜筒、目镜；右侧镜臂上装有粗准焦螺旋与细准焦螺旋。青色虚线为光线路径：自反光镜经通光孔、物镜、镜筒到达目镜。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 光线路径（青色虚线） -->
  <path d="M 360 438 L 360 278 L 360 248 L 360 120 L 360 70" fill="none" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="7 5" marker-start="url(#arrow)"/>

  <!-- 镜座 -->
  <rect x="190" y="560" width="340" height="18" rx="9" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>

  <!-- 镜臂（右侧立柱） -->
  <rect x="385" y="66" width="26" height="494" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>

  <!-- 目镜 -->
  <rect x="352" y="36" width="16" height="30" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>
  <ellipse cx="360" cy="36" rx="10" ry="3.2" fill="#faf9f5" stroke="#333" stroke-width="1.8"/>

  <!-- 镜筒 -->
  <rect x="350" y="66" width="20" height="118" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>

  <!-- 物镜转换器 -->
  <rect x="338" y="184" width="44" height="16" rx="3" fill="#faf9f5" stroke="#333" stroke-width="2"/>

  <!-- 物镜 -->
  <rect x="354" y="200" width="12" height="44" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <rect x="357" y="244" width="6" height="8" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>

  <!-- 载物台 -->
  <rect x="210" y="268" width="300" height="12" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>

  <!-- 通光孔 -->
  <ellipse cx="360" cy="274" rx="12" ry="4.5" fill="#ffffff" stroke="#333" stroke-width="1.6"/>

  <!-- 压片夹 -->
  <path d="M 372 268 L 418 268 L 414 257 L 372 257 Z" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
  <circle cx="378" cy="262.5" r="3" fill="#faf9f5" stroke="#333" stroke-width="1.4"/>

  <!-- 粗准焦螺旋 -->
  <rect x="411" y="140" width="10" height="20" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
  <circle cx="456" cy="150" r="24" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>
  <circle cx="456" cy="150" r="7" fill="none" stroke="#777" stroke-width="1.4"/>

  <!-- 细准焦螺旋 -->
  <rect x="411" y="202" width="10" height="16" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
  <circle cx="456" cy="210" r="19" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <circle cx="456" cy="210" r="5.5" fill="none" stroke="#777" stroke-width="1.2"/>

  <!-- 反光镜（斜置圆盘，支架连于镜臂） -->
  <line x1="405" y1="540" x2="360" y2="430" stroke="#333" stroke-width="3"/>
  <circle cx="360" cy="430" r="4" fill="#faf9f5" stroke="#333" stroke-width="1.8"/>
  <ellipse cx="360" cy="450" rx="34" ry="15" transform="rotate(-20 360 450)" fill="#faf9f5" stroke="#333" stroke-width="2.2"/>

  <!-- 文字标注 -->
  <g font-size="14" fill="#333">
    <text x="250" y="48">目镜</text>
    <text x="250" y="120">镜筒</text>
    <text x="250" y="195">物镜转换器</text>
    <text x="262" y="230">物镜</text>
    <text x="444" y="258">压片夹</text>
    <text x="252" y="304">载物台</text>
    <text x="242" y="336">通光孔</text>
    <text x="270" y="456">反光镜</text>
    <text x="528" y="145">粗准焦螺旋</text>
    <text x="528" y="208">细准焦螺旋</text>
    <text x="528" y="308">镜臂</text>
    <text x="252" y="592">镜座</text>
  </g>

  <!-- 引线（灰色细线，带箭头） -->
  <g stroke="#999" stroke-width="1.1" marker-end="url(#arrow)">
    <line x1="270" y1="48"  x2="348" y2="48"/>
    <line x1="270" y1="120" x2="348" y2="120"/>
    <line x1="270" y1="193" x2="338" y2="192"/>
    <line x1="282" y1="228" x2="352" y2="228"/>
    <line x1="428" y1="258" x2="412" y2="262"/>
    <line x1="272" y1="300" x2="262" y2="276"/>
    <line x1="262" y1="332" x2="348" y2="276"/>
    <line x1="290" y1="452" x2="330" y2="446"/>
    <line x1="508" y1="145" x2="480" y2="150"/>
    <line x1="508" y1="208" x2="475" y2="210"/>
    <line x1="508" y1="308" x2="412" y2="308"/>
    <line x1="272" y1="588" x2="298" y2="572"/>
  </g>

  <!-- 光路说明 -->
  <text x="430" y="420" font-size="13" fill="#1f6f8b">光线路径</text>
</svg>
