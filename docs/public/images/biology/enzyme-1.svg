<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">酶降低化学反应的活化能示意</title>
  <desc id="desc">能量随反应进程变化的示意曲线：横轴为反应进程，纵轴为能量。无酶时反应要翻越很高的活化能门槛（红色曲线，峰高约 Ea 无酶）；有酶时门槛被大幅降低（青色曲线，峰高约 Ea 有酶）。反应物与产物之间的能量差 ΔG 在两种情况下相同，说明酶只加快反应速率、不改变反应的方向与总能量变化。</desc>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="32" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">酶降低化学反应的活化能示意</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="400" x2="90" y2="60" stroke="#333" stroke-width="1.6" marker-end="url(#axis)"/>
  <line x1="90" y1="400" x2="750" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#axis)"/>
  <text x="64" y="82" font-size="13" fill="#333">能量</text>
  <text x="752" y="420" font-size="13" fill="#333" text-anchor="end">反应进程</text>

  <!-- 反应物 / 产物水平线 -->
  <line x1="110" y1="320" x2="310" y2="320" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="110" y="308" font-size="13" fill="#333">反应物</text>
  <line x1="500" y1="380" x2="722" y2="380" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="500" y="398" font-size="13" fill="#333">产物</text>

  <!-- 无酶曲线（红）：门槛很高 -->
  <path d="M 110 320 C 235 115, 330 62, 420 78 C 510 94, 620 175, 720 380" fill="none" stroke="#c0392b" stroke-width="2.6"/>
  <circle cx="420" cy="78" r="4" fill="#c0392b"/>

  <!-- 有酶曲线（青）：门槛被降低 -->
  <path d="M 110 320 C 240 252, 330 246, 420 252 C 510 258, 620 330, 720 380" fill="none" stroke="#1f6f8b" stroke-width="2.6"/>
  <circle cx="420" cy="252" r="4" fill="#1f6f8b"/>

  <!-- 活化能箭头 -->
  <line x1="430" y1="318" x2="430" y2="80" stroke="#c0392b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="444" y="190" font-size="13" fill="#c0392b">Eₐ（无酶）</text>
  <line x1="460" y1="318" x2="460" y2="254" stroke="#1f6f8b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="474" y="292" font-size="13" fill="#1f6f8b">Eₐ（有酶）</text>

  <!-- ΔG 箭头：有无酶相同 -->
  <line x1="640" y1="320" x2="640" y2="380" stroke="#666" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="654" y="352" font-size="13" fill="#333">ΔG（不变）</text>

  <!-- 图例 -->
  <line x1="120" y1="80" x2="160" y2="80" stroke="#c0392b" stroke-width="2.6"/>
  <text x="168" y="84" font-size="13" fill="#333">无酶催化</text>
  <line x1="120" y1="108" x2="160" y2="108" stroke="#1f6f8b" stroke-width="2.6"/>
  <text x="168" y="112" font-size="13" fill="#333">有酶催化</text>

  <text x="400" y="438" font-size="13" fill="#333" text-anchor="middle">催化剂不改变反应方向与 ΔG，只降低活化能、加快反应速率</text>

  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
