<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif">
  <title>干细胞分化为不同功能细胞示意图</title>
  <desc>一个干细胞保留全套基因组，通过基因的选择性表达，分化为神经细胞、红细胞与肌肉细胞等形态功能各异的细胞类型。</desc>
  <rect width="720" height="340" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <circle cx="140" cy="170" r="58" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="140" y="158" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">干细胞</text>
  <text x="140" y="186" font-size="14" text-anchor="middle" fill="#666666">同一套基因组</text>
  <path d="M 198 145 C 300 120, 360 100, 424 88" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 198 170 C 300 170, 360 170, 424 170" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 198 195 C 300 220, 360 240, 424 252" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="60" width="230" height="56" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="88" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">神经细胞</text>
  <text x="545" y="106" font-size="13" text-anchor="middle" fill="#1f6f8b">表达神经递质受体基因</text>
  <rect x="430" y="142" width="230" height="56" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="170" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">红细胞</text>
  <text x="545" y="188" font-size="13" text-anchor="middle" fill="#1f6f8b">表达血红蛋白基因</text>
  <rect x="430" y="224" width="230" height="56" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="252" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">肌肉细胞</text>
  <text x="545" y="270" font-size="13" text-anchor="middle" fill="#1f6f8b">表达肌动蛋白基因</text>
  <text x="360" y="320" font-size="15" text-anchor="middle" fill="#c0392b">分化 = 同一套基因组 + 基因的选择性表达</text>
</svg>
