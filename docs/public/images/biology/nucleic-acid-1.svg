<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">核苷酸的组成与碱基互补配对</title>
  <desc id="desc">左半为核苷酸的组成：一分子磷酸、一分子五碳糖与一分子含氮碱基相连。右半为 DNA 双链中的碱基互补配对：两条脱氧核糖—磷酸骨架之间，腺嘌呤 A 与胸腺嘧啶 T 以两个氢键配对，鸟嘌呤 G 与胞嘧啶 C 以三个氢键配对。</desc>

  <rect x="0" y="0" width="780" height="430" fill="#faf9f5"/>

  <!-- 左半：核苷酸的组成 -->
  <text x="215" y="42" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">核苷酸的组成</text>

  <!-- 磷酸 -->
  <circle cx="105" cy="180" r="30" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="105" y="185" font-size="14" fill="#333" text-anchor="middle">磷酸</text>

  <!-- 五碳糖（五边形） -->
  <polygon points="215,228 248,243 236,278 194,278 182,243" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="215" y="262" font-size="14" fill="#333" text-anchor="middle">五碳</text>
  <text x="215" y="280" font-size="14" fill="#333" text-anchor="middle">糖</text>

  <!-- 含氮碱基 -->
  <rect x="325" y="168" width="95" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="372" y="191" font-size="14" fill="#333" text-anchor="middle">含氮</text>
  <text x="372" y="211" font-size="14" fill="#333" text-anchor="middle">碱基</text>

  <!-- 连接线 -->
  <line x1="130" y1="198" x2="186" y2="240" stroke="#333" stroke-width="1.8"/>
  <line x1="240" y1="250" x2="325" y2="198" stroke="#333" stroke-width="1.8"/>

  <text x="215" y="330" font-size="13" fill="#1f6f8b" text-anchor="middle">三者共同构成一个核苷酸</text>

  <!-- 右半：碱基互补配对 -->
  <text x="570" y="42" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">DNA 双链中的碱基互补配对</text>

  <!-- 上下骨架 -->
  <rect x="460" y="95" width="260" height="22" rx="6" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="590" y="110" font-size="13" fill="#333" text-anchor="middle">脱氧核糖—磷酸骨架</text>

  <rect x="460" y="315" width="260" height="22" rx="6" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="590" y="330" font-size="13" fill="#333" text-anchor="middle">脱氧核糖—磷酸骨架</text>

  <!-- 碱基 A / T -->
  <line x1="515" y1="117" x2="515" y2="135" stroke="#333" stroke-width="1.6"/>
  <rect x="490" y="135" width="50" height="32" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  <text x="515" y="157" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">A</text>

  <line x1="515" y1="315" x2="515" y2="297" stroke="#333" stroke-width="1.6"/>
  <rect x="490" y="265" width="50" height="32" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  <text x="515" y="287" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">T</text>

  <!-- A=T 两个氢键 -->
  <line x1="501" y1="167" x2="501" y2="265" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="529" y1="167" x2="529" y2="265" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="515" y="360" font-size="14" fill="#333" text-anchor="middle">A = T（2 个氢键）</text>

  <!-- 碱基 G / C -->
  <line x1="665" y1="117" x2="665" y2="135" stroke="#333" stroke-width="1.6"/>
  <rect x="640" y="135" width="50" height="32" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  <text x="665" y="157" font-size="16" fill="#1f6f8b" text-anchor="middle" font-weight="bold">G</text>

  <line x1="665" y1="315" x2="665" y2="297" stroke="#333" stroke-width="1.6"/>
  <rect x="640" y="265" width="50" height="32" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  <text x="665" y="287" font-size="16" fill="#1f6f8b" text-anchor="middle" font-weight="bold">C</text>

  <!-- G≡C 三个氢键 -->
  <line x1="648" y1="167" x2="648" y2="265" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="665" y1="167" x2="665" y2="265" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="682" y1="167" x2="682" y2="265" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="665" y="360" font-size="14" fill="#333" text-anchor="middle">G ≡ C（3 个氢键）</text>

  <text x="665" y="398" font-size="13" fill="#1f6f8b" text-anchor="middle">红色虚线表示氢键</text>
</svg>
