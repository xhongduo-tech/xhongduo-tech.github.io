<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">细胞核的结构示意</title>
  <desc id="desc">细胞核结构示意：双层核膜包围核内空间，核膜上分布核孔；核内有核仁与呈细丝状的染色质（DNA 与蛋白质结合）；核膜外侧与粗面内质网相连，粗面内质网上附着核糖体；大分子物质经核孔进出细胞核，如 mRNA 出核、蛋白质入核。</desc>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="32" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">细胞核的结构示意</text>

  <!-- 核膜（双层） -->
  <ellipse cx="400" cy="250" rx="205" ry="128" fill="#fdf3e3" stroke="#8a6d4f" stroke-width="2.5"/>
  <ellipse cx="400" cy="250" rx="190" ry="114" fill="#fdf3e3" stroke="#8a6d4f" stroke-width="1.8"/>

  <!-- 核孔：双层核膜上的小通道 -->
  <g fill="#3a3a3a">
    <g transform="translate(605,250) rotate(90)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(545,340) rotate(135)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(400,378) rotate(0)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(255,340) rotate(45)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(195,250) rotate(90)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(255,160) rotate(135)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(400,122) rotate(0)"><rect x="-9" y="-5" width="18" height="10"/></g>
    <g transform="translate(545,160) rotate(45)"><rect x="-9" y="-5" width="18" height="10"/></g>
  </g>

  <!-- 粗面内质网（与核膜相连） -->
  <g fill="#e8f2f5" stroke="#1f6f8b" stroke-width="2">
    <ellipse cx="112" cy="206" rx="64" ry="12"/>
    <ellipse cx="112" cy="250" rx="64" ry="12"/>
    <ellipse cx="112" cy="294" rx="64" ry="12"/>
    <line x1="176" y1="206" x2="200" y2="212"/>
    <line x1="176" y1="250" x2="195" y2="250"/>
    <line x1="176" y1="294" x2="200" y2="288"/>
  </g>
  <!-- 附着于粗面内质网的核糖体 -->
  <g fill="#1f6f8b">
    <circle cx="70" cy="196" r="3.5"/><circle cx="120" cy="240" r="3.5"/><circle cx="90" cy="282" r="3.5"/>
    <circle cx="140" cy="200" r="3.5"/><circle cx="80" cy="250" r="3.5"/><circle cx="150" cy="294" r="3.5"/>
  </g>

  <!-- 核仁 -->
  <circle cx="330" cy="255" r="38" fill="#c0392b" fill-opacity="0.85"/>

  <!-- 染色质：核内细丝状 -->
  <g stroke="#1f6f8b" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M 250 175 C 285 150, 310 205, 345 185 C 375 168, 360 215, 395 200"/>
    <path d="M 255 335 C 290 315, 320 345, 355 325 C 385 308, 380 335, 420 320"/>
    <path d="M 455 175 C 480 195, 500 165, 525 190 C 545 210, 530 235, 555 225"/>
  </g>

  <!-- 核孔处的大分子流动：mRNA 出核、蛋白质入核 -->
  <path d="M 392 300 L 392 138" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowR)"/>
  <path d="M 412 138 L 412 300" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="372" y="92" text-anchor="end" font-size="13" fill="#c0392b">mRNA 出核</text>
  <text x="418" y="92" text-anchor="start" font-size="13" fill="#1f6f8b">蛋白质入核</text>

  <!-- 标注与引线 -->
  <g font-size="13" fill="#333">
    <text x="608" y="96" fill="#8a6d4f" font-weight="bold">核膜（双层）</text>
    <line x1="600" y1="102" x2="566" y2="140" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="620" y="392" text-anchor="middle">核孔</text>
    <line x1="600" y1="384" x2="545" y2="344" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="282" y="240" text-anchor="end" fill="#c0392b" font-weight="bold">核仁</text>
    <line x1="290" y1="244" x2="322" y2="252" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="470" y="352" fill="#1f6f8b" font-weight="bold">染色质</text>
    <text x="470" y="368" fill="#1f6f8b">（DNA + 蛋白质）</text>
    <line x1="470" y1="340" x2="455" y2="320" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="90" y="330" text-anchor="middle" fill="#1f6f8b" font-weight="bold">粗面内质网</text>
    <text x="90" y="346" text-anchor="middle">（与核膜相连）</text>
    <line x1="90" y1="322" x2="100" y2="296" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="470" y="210">核质</text>
    <text x="600" y="300">细胞质</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
