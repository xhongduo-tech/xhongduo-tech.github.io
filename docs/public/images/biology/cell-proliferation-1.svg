<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">有丝分裂过程中染色体行为的示意</title>
  <desc id="desc">以 2n=4 为例，展示有丝分裂分裂期染色体的行为变化：前期染色体散乱分布、每条含两条姐妹染色单体（X 形）；中期着丝点排列在赤道板上，是观察最佳期；后期着丝点分裂，姐妹染色单体分开成为染色体，染色体数目加倍（由 2n 变 4n）并移向两极；末期形成两个子细胞，每个子细胞染色体数恢复为 2n。</desc>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="34" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">有丝分裂中染色体数目的变化（以 2n=4 为例）</text>

  <!-- 五个阶段方框 -->
  <g stroke="#1f6f8b" stroke-width="1.5" fill="#eef4f6">
    <rect x="28" y="100" width="136" height="250" rx="8"/>
    <rect x="178" y="100" width="136" height="250" rx="8"/>
    <rect x="328" y="100" width="136" height="250" rx="8"/>
    <rect x="478" y="100" width="136" height="250" rx="8"/>
    <rect x="628" y="100" width="136" height="250" rx="8"/>
  </g>

  <!-- 阶段标题 -->
  <text x="96" y="126" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">间期</text>
  <text x="246" y="126" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">前期</text>
  <text x="396" y="126" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">中期</text>
  <text x="546" y="126" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">后期</text>
  <text x="696" y="126" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">末期</text>

  <!-- 细胞（圆圈） -->
  <circle cx="96" cy="195" r="52" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="246" cy="195" r="52" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="396" cy="195" r="52" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="546" cy="195" r="52" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="632" cy="177" r="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="760" cy="177" r="34" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- 间期：两条已复制的染色体（X 形） -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="84" y1="181" x2="96" y2="209"/>
    <line x1="96" y1="181" x2="84" y2="209"/>
    <line x1="102" y1="181" x2="114" y2="209"/>
    <line x1="114" y1="181" x2="102" y2="209"/>
  </g>
  <text x="96" y="226" font-size="13" fill="#333" text-anchor="middle">DNA 复制</text>
  <text x="96" y="244" font-size="13" fill="#333" text-anchor="middle">DNA 2n→4n</text>

  <!-- 前期：两条 X 散乱 -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="230" y1="176" x2="242" y2="204"/>
    <line x1="242" y1="176" x2="230" y2="204"/>
    <line x1="252" y1="180" x2="264" y2="208"/>
    <line x1="264" y1="180" x2="252" y2="208"/>
  </g>
  <text x="246" y="226" font-size="13" fill="#333" text-anchor="middle">染色体散乱</text>
  <text x="246" y="244" font-size="13" fill="#333" text-anchor="middle">DNA 4n · 染色体 2n</text>

  <!-- 中期：两条 X 排在赤道板 -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="386" y1="176" x2="398" y2="204"/>
    <line x1="398" y1="176" x2="386" y2="204"/>
    <line x1="400" y1="176" x2="412" y2="204"/>
    <line x1="412" y1="176" x2="400" y2="204"/>
  </g>
  <line x1="344" y1="190" x2="448" y2="190" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="396" y="226" font-size="13" fill="#333" text-anchor="middle">着丝点排赤道板</text>
  <text x="396" y="244" font-size="13" fill="#333" text-anchor="middle">DNA 4n · 染色体 2n</text>

  <!-- 后期：四条单体分开，移向两极 -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="528" y1="176" x2="528" y2="204"/>
    <line x1="540" y1="176" x2="540" y2="204"/>
    <line x1="552" y1="176" x2="552" y2="204"/>
    <line x1="564" y1="176" x2="564" y2="204"/>
  </g>
  <text x="546" y="226" font-size="13" fill="#333" text-anchor="middle">着丝点分裂</text>
  <text x="546" y="244" font-size="13" fill="#333" text-anchor="middle">DNA 4n · 染色体 4n</text>

  <!-- 末期：两个子细胞，各含两条单体 -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="626" y1="177" x2="626" y2="199"/>
    <line x1="638" y1="177" x2="638" y2="199"/>
    <line x1="754" y1="177" x2="754" y2="199"/>
    <line x1="766" y1="177" x2="766" y2="199"/>
  </g>
  <text x="696" y="236" font-size="13" fill="#333" text-anchor="middle">两个子细胞</text>
  <text x="696" y="254" font-size="13" fill="#333" text-anchor="middle">各 DNA 2n · 染色体 2n</text>

  <!-- 阶段间箭头 -->
  <g stroke="#333" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="164" y1="195" x2="176" y2="195"/>
    <line x1="314" y1="195" x2="326" y2="195"/>
    <line x1="464" y1="195" x2="476" y2="195"/>
    <line x1="614" y1="195" x2="626" y2="195"/>
  </g>

  <text x="400" y="380" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">计数定律：DNA 在间期复制时加倍（2n→4n），染色体在后期着丝点分裂时加倍（2n→4n）</text>
  <text x="400" y="438" font-size="13" fill="#333" text-anchor="middle">中期着丝点排列在赤道板上、形态数目最清晰，是观察染色体的最佳时期</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
