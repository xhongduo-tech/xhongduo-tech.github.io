<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">分泌蛋白的合成与运输路径</title>
  <desc id="desc">细胞截面示意分泌蛋白的合成与运输：细胞核（虚线箭头表示遗传信息 mRNA），附着核糖体的粗面内质网合成并加工肽链，经囊泡运往高尔基体，高尔基体再加工、分类、包装后出芽成囊泡，囊泡与细胞膜融合将蛋白质分泌到细胞外；线粒体全程供能（ATP）。</desc>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>

  <text x="400" y="25" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">分泌蛋白的合成与运输</text>
  <text x="400" y="62" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">细胞外</text>

  <!-- 细胞边界（细胞膜） -->
  <rect x="40" y="78" width="720" height="350" rx="18" fill="#ffffff" stroke="#555" stroke-width="2.5"/>

  <!-- 细胞核 -->
  <ellipse cx="140" cy="180" rx="75" ry="52" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="140" y="185" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">细胞核</text>

  <!-- 遗传信息虚线箭头：细胞核 → 内质网 -->
  <line x1="212" y1="172" x2="286" y2="198" stroke="#999" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowGrey)"/>
  <text x="240" y="158" font-size="13" fill="#555">遗传信息（mRNA）</text>

  <!-- 粗面内质网：四条波浪带 -->
  <g fill="none" stroke="#1f6f8b" stroke-width="2.2">
    <path d="M 290 190 q 12 -7 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
    <path d="M 290 210 q 12 -7 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
    <path d="M 290 230 q 12 -7 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
    <path d="M 290 250 q 12 -7 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
  </g>

  <!-- 核糖体小点 -->
  <g fill="#333">
    <circle cx="320" cy="190" r="3.5"/>
    <circle cx="355" cy="210" r="3.5"/>
    <circle cx="385" cy="190" r="3.5"/>
    <circle cx="420" cy="230" r="3.5"/>
    <circle cx="305" cy="210" r="3.5"/>
  </g>
  <text x="330" y="160" font-size="13" fill="#333">核糖体（附着）</text>
  <line x1="322" y1="163" x2="318" y2="186" stroke="#999" stroke-width="1" marker-end="url(#arrowGrey)"/>

  <text x="350" y="290" font-size="13" fill="#1f6f8b" text-anchor="middle" font-weight="bold">粗面内质网</text>

  <!-- 高尔基体：三层扁平囊 -->
  <g fill="#ffffff" stroke="#1f6f8b" stroke-width="1.8">
    <rect x="515" y="190" width="130" height="12" rx="6"/>
    <rect x="527" y="210" width="106" height="12" rx="6"/>
    <rect x="515" y="230" width="130" height="12" rx="6"/>
  </g>
  <text x="580" y="290" font-size="13" fill="#1f6f8b" text-anchor="middle" font-weight="bold">高尔基体</text>

  <!-- 囊泡①：内质网 → 高尔基体 -->
  <line x1="452" y1="225" x2="512" y2="225" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="480" cy="225" r="13" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="480" y="229" font-size="11" fill="#1f6f8b" text-anchor="middle">囊泡</text>

  <!-- 高尔基体 → 囊泡② -->
  <line x1="600" y1="192" x2="648" y2="152" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="655" cy="140" r="13" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.8"/>

  <!-- 囊泡② → 细胞膜（分泌） -->
  <line x1="658" y1="128" x2="658" y2="92" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="658" cy="74" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="684" y="79" font-size="13" fill="#c0392b">分泌蛋白</text>

  <!-- 线粒体 -->
  <ellipse cx="250" cy="360" rx="75" ry="38" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M 200 352 q 25 -12 50 0 q 25 12 50 0" fill="none" stroke="#777" stroke-width="1.6"/>
  <path d="M 200 368 q 25 -12 50 0 q 25 12 50 0" fill="none" stroke="#777" stroke-width="1.6"/>
  <text x="250" y="415" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">线粒体（供能）</text>

  <!-- ATP 供能箭头 -->
  <line x1="322" y1="340" x2="468" y2="248" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowCyan)"/>
  <text x="380" y="308" font-size="13" fill="#1f6f8b">ATP 供能</text>

  <!-- 底部路线小结 -->
  <text x="600" y="408" font-size="13" fill="#555" text-anchor="middle">路线：核糖体→内质网→高尔基体→细胞膜→细胞外</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
