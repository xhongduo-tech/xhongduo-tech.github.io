<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">原核细胞与真核细胞结构对比示意</title>
  <desc id="desc">左侧为原核细胞（以细菌为例）：外有细胞壁与细胞膜，细胞质中只有拟核（内含环状 DNA）与散在的核糖体。右侧为真核细胞（以动物细胞为例）：有核膜包被的细胞核（含核仁），细胞质中有线粒体、内质网、高尔基体等膜性细胞器及核糖体。图下注：两类细胞都有细胞膜、细胞质、核糖体与 DNA。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="390" y="34" text-anchor="middle" font-size="17" fill="#333">原核细胞与真核细胞结构对比</text>
  <text x="195" y="72" text-anchor="middle" font-size="14" fill="#333">原核细胞（以细菌为例）</text>
  <text x="585" y="72" text-anchor="middle" font-size="14" fill="#333">真核细胞（以动物细胞为例）</text>

  <!-- 原核细胞 -->
  <g>
    <ellipse cx="195" cy="270" rx="150" ry="104" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="195" cy="270" rx="134" ry="88" fill="#eef5f6" stroke="#1f6f8b" stroke-width="2"/>
    <ellipse cx="150" cy="245" rx="54" ry="42" fill="#d7ecf2" stroke="#1f6f8b" stroke-width="1.8"/>
    <circle cx="150" cy="245" r="26" fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="5 3"/>
    <circle cx="238" cy="296" r="4" fill="#c0392b"/>
    <circle cx="262" cy="250" r="4" fill="#c0392b"/>
    <circle cx="198" cy="322" r="4" fill="#c0392b"/>
    <circle cx="130" cy="308" r="4" fill="#c0392b"/>
    <circle cx="210" cy="205" r="4" fill="#c0392b"/>
  </g>

  <!-- 原核细胞标注 -->
  <g font-size="13" fill="#333">
    <text x="8" y="182">细胞壁</text>
    <text x="8" y="242">细胞膜</text>
    <text x="8" y="292">拟核</text>
    <text x="8" y="344">核糖体</text>
  </g>
  <g stroke="#999" stroke-width="1.1" marker-end="url(#arrow)">
    <line x1="52" y1="180" x2="82" y2="200"/>
    <line x1="52" y1="240" x2="70" y2="250"/>
    <line x1="52" y1="290" x2="100" y2="256"/>
    <line x1="52" y1="342" x2="128" y2="308"/>
  </g>

  <!-- 真核细胞 -->
  <g>
    <ellipse cx="585" cy="280" rx="175" ry="125" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2.4"/>
    <ellipse cx="550" cy="240" rx="48" ry="40" fill="#f9ead9" stroke="#c0392b" stroke-width="2"/>
    <circle cx="533" cy="230" r="9" fill="#c0392b"/>
    <path d="M 560 222 q 12 8 6 18 q -8 12 6 18" fill="none" stroke="#c0392b" stroke-width="1.2"/>
    <path d="M 600 160 Q 638 146 675 160" fill="none" stroke="#1f6f8b" stroke-width="3"/>
    <path d="M 602 172 Q 638 158 673 172" fill="none" stroke="#1f6f8b" stroke-width="3"/>
    <path d="M 604 184 Q 638 170 671 184" fill="none" stroke="#1f6f8b" stroke-width="3"/>
    <path d="M 440 318 q 26 -8 52 0" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <path d="M 440 330 q 26 -8 52 0" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <path d="M 440 342 q 26 -8 52 0" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <ellipse cx="655" cy="330" rx="40" ry="22" fill="#e7f0f4" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="630" y1="322" x2="650" y2="326" stroke="#1f6f8b" stroke-width="1.4"/>
    <line x1="660" y1="326" x2="680" y2="322" stroke="#1f6f8b" stroke-width="1.4"/>
    <circle cx="600" cy="290" r="4" fill="#c0392b"/>
    <circle cx="520" cy="335" r="4" fill="#c0392b"/>
    <circle cx="690" cy="285" r="4" fill="#c0392b"/>
  </g>

  <!-- 真核细胞标注 -->
  <g font-size="13" fill="#333" text-anchor="end">
    <text x="745" y="150">高尔基体</text>
    <text x="745" y="215">细胞核</text>
    <text x="745" y="265">核糖体</text>
    <text x="745" y="330">线粒体</text>
    <text x="745" y="395">细胞膜</text>
    <text x="430" y="400">内质网</text>
  </g>
  <g stroke="#999" stroke-width="1.1" marker-end="url(#arrow)">
    <line x1="735" y1="152" x2="668" y2="170"/>
    <line x1="735" y1="218" x2="606" y2="248"/>
    <line x1="735" y1="268" x2="692" y2="286"/>
    <line x1="735" y1="332" x2="696" y2="330"/>
    <line x1="735" y1="392" x2="726" y2="348"/>
    <line x1="440" y1="396" x2="466" y2="348"/>
  </g>

  <text x="390" y="480" text-anchor="middle" font-size="14" fill="#1f6f8b">两类细胞都有细胞膜、细胞质、核糖体与 DNA —— 这就是生命的统一性</text>
</svg>
