<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">氨基酸结构通式与脱水缩合形成肽键</title>
  <desc id="desc">左半为氨基酸结构通式：中心碳原子连接氨基 -NH₂、氢原子 -H、羧基 -COOH 与侧链基团 -R。右半为两个氨基酸脱水缩合：氨基酸①的 -COOH 与氨基酸②的 -NH₂ 相连接，脱去一分子水，形成肽键 -CO-NH-，产物为二肽。</desc>

  <rect x="0" y="0" width="780" height="430" fill="#faf9f5"/>

  <!-- 左半：氨基酸结构通式 -->
  <text x="200" y="42" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">氨基酸结构通式</text>

  <!-- 中心碳原子 -->
  <circle cx="200" cy="210" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="200" y="216" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">C</text>

  <!-- 上左：氨基 -NH2 -->
  <line x1="186" y1="196" x2="128" y2="142" stroke="#333" stroke-width="2"/>
  <text x="112" y="132" font-size="14" fill="#333" text-anchor="end">—NH&#8322;</text>

  <!-- 上右：氢 -H -->
  <line x1="214" y1="196" x2="272" y2="142" stroke="#333" stroke-width="2"/>
  <text x="282" y="136" font-size="14" fill="#333">—H</text>

  <!-- 下左：羧基 -COOH -->
  <line x1="186" y1="224" x2="128" y2="278" stroke="#333" stroke-width="2"/>
  <text x="108" y="272" font-size="14" fill="#333" text-anchor="end">—COOH</text>

  <!-- 下右：R 基 -->
  <line x1="214" y1="224" x2="272" y2="278" stroke="#333" stroke-width="2"/>
  <text x="282" y="272" font-size="14" fill="#333">—R</text>

  <text x="286" y="298" font-size="13" fill="#c0392b">R 基：氨基酸的「身份证」</text>

  <!-- 右半：脱水缩合 -->
  <text x="580" y="42" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">脱水缩合形成肽键</text>

  <!-- 氨基酸① -->
  <rect x="400" y="150" width="150" height="90" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="475" y="182" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">氨基酸①</text>
  <text x="475" y="205" font-size="13" fill="#333" text-anchor="middle">中心C</text>
  <text x="475" y="226" font-size="13" fill="#333" text-anchor="middle">R&#8321;</text>

  <!-- 氨基酸①的 -COOH（红色突出） -->
  <rect x="550" y="182" width="46" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="573" y="200" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">-COOH</text>

  <!-- 氨基酸② -->
  <rect x="620" y="150" width="150" height="90" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="695" y="182" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">氨基酸②</text>
  <text x="695" y="205" font-size="13" fill="#333" text-anchor="middle">中心C</text>
  <text x="695" y="226" font-size="13" fill="#333" text-anchor="middle">R&#8322;</text>

  <!-- 氨基酸②的 -NH2（红色突出） -->
  <rect x="596" y="182" width="46" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="619" y="200" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">-NH&#8322;</text>

  <!-- 肽键标注 -->
  <text x="583" y="156" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">肽键</text>
  <text x="583" y="172" font-size="13" fill="#c0392b" text-anchor="middle">-CO-NH-</text>
  <line x1="583" y1="176" x2="583" y2="186" stroke="#c0392b" stroke-width="1.4"/>

  <!-- 脱去一分子水 -->
  <path d="M 583 110 q -7 -8 0 -16 q 7 8 0 16 z" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <line x1="583" y1="120" x2="583" y2="150" stroke="#1f6f8b" stroke-width="1.4" marker-end="url(#arrowUp)"/>
  <text x="583" y="78" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">脱去一分子水 H&#8322;O</text>

  <!-- 结果 -->
  <rect x="400" y="310" width="370" height="56" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.8"/>
  <text x="585" y="335" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">产物：二肽</text>
  <text x="585" y="355" font-size="13" fill="#333" text-anchor="middle">H&#8322;N—CH(R&#8321;)—CO—NH—CH(R&#8322;)—COOH</text>

  <!-- 箭头：反应物到产物 -->
  <line x1="585" y1="244" x2="585" y2="296" stroke="#333" stroke-width="1.6" marker-end="url(#arrowDown)"/>

  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 10 L 0 5 L 10 0 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
