<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>膨胀因果卷积</title>
<desc>三层因果卷积，膨胀率依次为 1、2、4，感受野指数扩张，每个节点只依赖其左侧输入，最终一个输出覆盖全部时间步</desc>
<rect width="800" height="480" fill="#faf9f5"/>
<!-- 输入层 -->
<g stroke="#1f6f8b" stroke-width="1.3">
<line x1="80" y1="410" x2="125" y2="300"/><line x1="170" y1="410" x2="125" y2="300"/>
<line x1="170" y1="410" x2="215" y2="300"/><line x1="260" y1="410" x2="215" y2="300"/>
<line x1="260" y1="410" x2="305" y2="300"/><line x1="350" y1="410" x2="305" y2="300"/>
<line x1="350" y1="410" x2="395" y2="300"/><line x1="440" y1="410" x2="395" y2="300"/>
<line x1="440" y1="410" x2="485" y2="300"/><line x1="530" y1="410" x2="485" y2="300"/>
<line x1="530" y1="410" x2="575" y2="300"/><line x1="620" y1="410" x2="575" y2="300"/>
<line x1="620" y1="410" x2="665" y2="300"/><line x1="710" y1="410" x2="665" y2="300"/>
<!-- 第1层到第2层 -->
<line x1="125" y1="300" x2="215" y2="195"/><line x1="305" y1="300" x2="215" y2="195"/>
<line x1="215" y1="300" x2="305" y2="195"/><line x1="395" y1="300" x2="305" y2="195"/>
<line x1="305" y1="300" x2="395" y2="195"/><line x1="485" y1="300" x2="395" y2="195"/>
<line x1="395" y1="300" x2="485" y2="195"/><line x1="575" y1="300" x2="485" y2="195"/>
<line x1="485" y1="300" x2="575" y2="195"/><line x1="665" y1="300" x2="575" y2="195"/>
<!-- 第2层到输出 -->
<line x1="215" y1="195" x2="395" y2="95"/><line x1="575" y1="195" x2="395" y2="95"/>
</g>
<!-- 节点 -->
<g fill="#fff" stroke="#1f6f8b" stroke-width="2">
<circle cx="80" cy="410" r="13"/><circle cx="170" cy="410" r="13"/><circle cx="260" cy="410" r="13"/><circle cx="350" cy="410" r="13"/><circle cx="440" cy="410" r="13"/><circle cx="530" cy="410" r="13"/><circle cx="620" cy="410" r="13"/><circle cx="710" cy="410" r="13"/>
<circle cx="125" cy="300" r="13"/><circle cx="215" cy="300" r="13"/><circle cx="305" cy="300" r="13"/><circle cx="395" cy="300" r="13"/><circle cx="485" cy="300" r="13"/><circle cx="575" cy="300" r="13"/><circle cx="665" cy="300" r="13"/>
<circle cx="215" cy="195" r="13"/><circle cx="305" cy="195" r="13"/><circle cx="395" cy="195" r="13"/><circle cx="485" cy="195" r="13"/><circle cx="575" cy="195" r="13"/>
</g>
<circle cx="395" cy="95" r="15" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="395" y="101" fill="#fff" font-size="14" text-anchor="middle">o</text>
<!-- 层标签 -->
<text x="395" y="452" fill="#333" font-size="15" text-anchor="middle">输入 x0 … x7（时间步）</text>
<text x="748" y="305" fill="#c0392b" font-size="14" text-anchor="end">膨胀 1</text>
<text x="748" y="200" fill="#c0392b" font-size="14" text-anchor="end">膨胀 2</text>
<text x="748" y="100" fill="#c0392b" font-size="14" text-anchor="end">膨胀 4</text>
<text x="395" y="30" fill="#333" font-size="15" text-anchor="middle">感受野指数扩张，仅依赖过去</text>
</svg>
