<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="sans-serif">
  <title>实时渲染管线总览</title>
  <desc>CPU 应用阶段打包 draw call，GPU 依次执行几何阶段、光栅化、片元阶段，最终写入帧缓冲</desc>
  <rect width="860" height="330" fill="#faf9f5"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#333">实时渲染管线</text>

  <!-- CPU / GPU 边界 -->
  <rect x="20" y="55" width="820" height="100" fill="#fff" stroke="#1f6f8b" stroke-width="1.5" rx="8"/>
  <text x="40" y="80" font-size="15" font-weight="bold" fill="#1f6f8b">CPU 侧</text>

  <rect x="20" y="165" width="820" height="120" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="40" y="190" font-size="15" font-weight="bold" fill="#c0392b">GPU 侧</text>

  <!-- 阶段 1：应用阶段 -->
  <rect x="45" y="95" width="170" height="45" fill="#1f6f8b" rx="6"/>
  <text x="130" y="114" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">应用阶段</text>
  <text x="130" y="132" font-size="13" fill="#fff" text-anchor="middle">剔除 · 打包 draw call</text>

  <!-- 箭头 1 -->
  <line x1="215" y1="117" x2="258" y2="117" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 阶段 2：几何阶段 -->
  <rect x="258" y="190" width="170" height="45" fill="#c0392b" rx="6"/>
  <text x="343" y="209" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">几何阶段</text>
  <text x="343" y="227" font-size="13" fill="#fff" text-anchor="middle">顶点着色 · 裁剪</text>

  <!-- 箭头 2 -->
  <line x1="428" y1="212" x2="471" y2="212" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 阶段 3：光栅化 -->
  <rect x="471" y="190" width="170" height="45" fill="#c0392b" rx="6"/>
  <text x="556" y="209" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">光栅化</text>
  <text x="556" y="227" font-size="13" fill="#fff" text-anchor="middle">三角形 → 片元</text>

  <!-- 箭头 3 -->
  <line x1="641" y1="212" x2="684" y2="212" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 阶段 4：片元阶段 -->
  <rect x="684" y="190" width="140" height="45" fill="#c0392b" rx="6"/>
  <text x="754" y="209" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">片元阶段</text>
  <text x="754" y="227" font-size="13" fill="#fff" text-anchor="middle">着色 · 深度测试</text>

  <!-- 帧缓冲 -->
  <rect x="684" y="262" width="140" height="40" fill="#333" rx="6"/>
  <text x="754" y="287" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">帧缓冲</text>

  <!-- 帧缓冲箭头 -->
  <line x1="754" y1="235" x2="754" y2="262" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CPU→GPU 交接箭头 -->
  <line x1="130" y1="140" x2="130" y2="165" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrb)"/>
  <text x="145" y="158" font-size="13" fill="#1f6f8b">命令缓冲 / draw call</text>

  <!-- 循环标注 -->
  <text x="40" y="308" font-size="14" fill="#333">每帧 16.7 ms（60 FPS）循环一遍；CPU 与 GPU 按传送带方式并行流水。</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
