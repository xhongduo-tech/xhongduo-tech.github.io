<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="sans-serif">
  <title>转录网络基本模体</title>
  <desc>从左到右依次展示前馈环路 FFL、单输入模体 SIM、稠密重叠调控 DOR 三种在真实转录网络中统计显著的模体。</desc>
  <rect x="0" y="0" width="900" height="300" fill="#faf9f5" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f6f8b" />
    </marker>
  </defs>

  <!-- 面板标题 -->
  <text x="450" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">转录网络的三种基本模体</text>

  <!-- 面板1：FFL -->
  <text x="150" y="280" text-anchor="middle" font-size="14" fill="#c0392b">前馈环路（FFL）</text>
  <line x1="105" y1="60" x2="195" y2="60" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="95" y1="80" x2="138" y2="190" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="207" y1="80" x2="165" y2="190" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <circle cx="80" cy="60" r="22" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="80" y="66" text-anchor="middle" font-size="17" fill="#333">X</text>
  <circle cx="220" cy="60" r="22" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="220" y="66" text-anchor="middle" font-size="17" fill="#333">Y</text>
  <circle cx="150" cy="210" r="22" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="150" y="216" text-anchor="middle" font-size="17" fill="#333">Z</text>

  <!-- 面板2：SIM -->
  <text x="450" y="280" text-anchor="middle" font-size="14" fill="#c0392b">单输入模体（SIM）</text>
  <line x1="412" y1="135" x2="478" y2="80" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="412" y1="150" x2="478" y2="150" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="412" y1="165" x2="478" y2="220" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <circle cx="390" cy="150" r="22" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="390" y="156" text-anchor="middle" font-size="17" fill="#333">X</text>
  <circle cx="500" cy="60" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="500" y="66" text-anchor="middle" font-size="15" fill="#333">Y₁</text>
  <circle cx="500" cy="150" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="500" y="156" text-anchor="middle" font-size="15" fill="#333">Y₂</text>
  <circle cx="500" cy="240" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="500" y="246" text-anchor="middle" font-size="15" fill="#333">Y₃</text>

  <!-- 面板3：DOR -->
  <text x="750" y="280" text-anchor="middle" font-size="14" fill="#c0392b">稠密重叠调控（DOR）</text>
  <line x1="682" y1="60" x2="818" y2="60" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="70" x2="818" y2="140" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="78" x2="818" y2="232" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="142" x2="818" y2="68" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="150" x2="818" y2="150" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="232" x2="818" y2="70" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="240" x2="818" y2="150" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <line x1="682" y1="232" x2="818" y2="232" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)" />
  <circle cx="660" cy="60" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="660" y="66" text-anchor="middle" font-size="15" fill="#333">X₁</text>
  <circle cx="660" cy="150" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="660" y="156" text-anchor="middle" font-size="15" fill="#333">X₂</text>
  <circle cx="660" cy="240" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="660" y="246" text-anchor="middle" font-size="15" fill="#333">X₃</text>
  <circle cx="840" cy="60" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="840" y="66" text-anchor="middle" font-size="15" fill="#333">Y₁</text>
  <circle cx="840" cy="150" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="840" y="156" text-anchor="middle" font-size="15" fill="#333">Y₂</text>
  <circle cx="840" cy="240" r="20" fill="#fff" stroke="#1f6f8b" stroke-width="2.5" />
  <text x="840" y="246" text-anchor="middle" font-size="15" fill="#333">Y₃</text>
</svg>
