<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="sans-serif">
  <title>双稳态的滞后回线</title>
  <desc>稳态 X* 随输入信号 S 的变化曲线：中间存在双稳态区间，向上跳变点 S_A 与向下跳变点 S_B 不同，构成滞后回线，体现记忆。</desc>
  <rect x="0" y="0" width="720" height="430" fill="#faf9f5" />
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f6f8b" />
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b" />
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">双稳态的滞后回线（hysteresis）</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="380" x2="660" y2="380" stroke="#333" stroke-width="2" />
  <line x1="80" y1="380" x2="80" y2="40" stroke="#333" stroke-width="2" />
  <text x="650" y="412" text-anchor="middle" font-size="14" fill="#333">输入信号 S</text>
  <text x="40" y="205" text-anchor="middle" font-size="14" fill="#333">稳态 X*</text>
  <text x="80" y="400" text-anchor="end" font-size="12" fill="#333">0</text>
  <text x="660" y="400" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="66" y="44" text-anchor="end" font-size="12" fill="#333">1</text>

  <!-- 双稳态区间阴影 -->
  <rect x="300" y="135" width="140" height="150" fill="#1f6f8b" opacity="0.10" />
  <text x="370" y="252" text-anchor="middle" font-size="13" fill="#1f6f8b">双稳态区间</text>

  <!-- 分界虚线 -->
  <line x1="300" y1="40" x2="300" y2="380" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" />
  <line x1="440" y1="40" x2="440" y2="380" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="300" y="402" text-anchor="middle" font-size="13" fill="#666">S_B</text>
  <text x="440" y="402" text-anchor="middle" font-size="13" fill="#666">S_A</text>

  <!-- 低分支（稳定） -->
  <path d="M 80,380 C 220,372 360,338 440,285" fill="none" stroke="#1f6f8b" stroke-width="3" />
  <!-- 高分支（稳定） -->
  <path d="M 300,135 C 420,110 550,72 660,52" fill="none" stroke="#1f6f8b" stroke-width="3" />
  <!-- 中间分支（不稳定，虚线） -->
  <path d="M 440,285 C 400,245 330,185 300,135" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" />

  <!-- 滞后方向箭头 -->
  <line x1="300" y1="340" x2="325" y2="328" stroke="#1f6f8b" stroke-width="2.4" marker-end="url(#arrC)" />
  <line x1="522" y1="82" x2="496" y2="93" stroke="#1f6f8b" stroke-width="2.4" marker-end="url(#arrC)" />

  <!-- 跳变箭头 -->
  <line x1="440" y1="282" x2="440" y2="108" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR)" />
  <text x="468" y="190" font-size="12" fill="#c0392b">S 增大：跳向高态</text>
  <line x1="300" y1="138" x2="300" y2="318" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR)" />
  <text x="150" y="245" font-size="12" fill="#c0392b">S 减小：跳回低态</text>

  <!-- 分支标注 -->
  <text x="212" y="352" font-size="13" fill="#1f6f8b">低状态（稳定）</text>
  <text x="556" y="88" font-size="13" fill="#1f6f8b">高状态（稳定）</text>
  <text x="368" y="212" font-size="12" fill="#c0392b">不稳定分支</text>

  <!-- 拐点 -->
  <circle cx="440" cy="285" r="4.5" fill="#c0392b" />
  <circle cx="300" cy="135" r="4.5" fill="#c0392b" />
</svg>
