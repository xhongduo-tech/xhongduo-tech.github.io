<svg viewBox="0 0 800 360" width="800" height="360" xmlns="http://www.w3.org/2000/svg">
  <title>模糊控制器结构</title>
  <desc>模糊控制器由模糊化器、规则库、推理引擎、去模糊化器四部分组成，并与被控对象构成反馈闭环</desc>
  <rect width="800" height="360" fill="#faf9f5"/>
  <text x="400" y="26" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">模糊控制器结构</text>
  <!-- 输入 -->
  <text x="20" y="140" font-family="sans-serif" font-size="14" fill="#333">参考输入 r</text>
  <line x1="60" y1="165" x2="20" y2="165" stroke="#333" stroke-width="2"/>
  <polygon points="60,165 50,160 50,170" fill="#333"/>
  <!-- 模糊化器 -->
  <rect x="60" y="130" width="130" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="125" y="168" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">模糊化器</text>
  <line x1="190" y1="165" x2="235" y2="165" stroke="#333" stroke-width="2"/>
  <polygon points="235,165 225,160 225,170" fill="#333"/>
  <!-- 推理引擎 -->
  <rect x="240" y="130" width="150" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="315" y="168" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">推理引擎</text>
  <line x1="390" y1="165" x2="435" y2="165" stroke="#333" stroke-width="2"/>
  <polygon points="435,165 425,160 425,170" fill="#333"/>
  <!-- 去模糊化器 -->
  <rect x="440" y="130" width="140" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="510" y="168" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">去模糊化器</text>
  <line x1="580" y1="165" x2="635" y2="165" stroke="#333" stroke-width="2"/>
  <polygon points="635,165 625,160 625,170" fill="#333"/>
  <!-- 被控对象 -->
  <rect x="640" y="130" width="110" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="695" y="168" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">被控对象</text>
  <!-- 输出 -->
  <line x1="750" y1="165" x2="790" y2="165" stroke="#333" stroke-width="2"/>
  <polygon points="790,165 780,160 780,170" fill="#333"/>
  <text x="768" y="150" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">控制量 u</text>
  <!-- 规则库 -->
  <rect x="300" y="45" width="130" height="55" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="365" y="78" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">规则库</text>
  <line x1="365" y1="100" x2="365" y2="125" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="365,125 360,115 370,115" fill="#1f6f8b"/>
  <!-- 反馈 -->
  <path d="M 695,200 L 695,330 L 120,330 L 120,200" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="8,5"/>
  <polygon points="120,200 115,212 125,212" fill="#c0392b"/>
  <text x="500" y="318" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">传感器反馈（被控量测量）</text>
  <!-- 连接标注 -->
  <text x="310" y="122" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">模糊集合</text>
  <text x="415" y="122" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">模糊输出</text>
  <text x="585" y="122" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">精确量</text>
</svg>
