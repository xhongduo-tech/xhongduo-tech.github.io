<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <title>常用隶属函数形状</title>
  <desc>经典集合的特征函数为二值阶梯，模糊集合常用三角形、梯形、高斯型隶属函数</desc>
  <rect width="640" height="320" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="260" x2="620" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="260" x2="40" y2="60" stroke="#333" stroke-width="1.5"/>
  <text x="30" y="278" font-family="sans-serif" font-size="14" fill="#333">0</text>
  <text x="30" y="72" font-family="sans-serif" font-size="14" fill="#333">1</text>
  <text x="620" y="286" font-family="sans-serif" font-size="15" fill="#333">x（论域）</text>
  <text x="8" y="60" font-family="sans-serif" font-size="15" fill="#333" transform="rotate(-90 8 60)" text-anchor="middle">μ(x)</text>
  <!-- 经典集合（特征函数） -->
  <path d="M 40,260 L 250,260 L 250,80 L 620,80" stroke="#333" stroke-width="2" fill="none"/>
  <text x="255" y="100" font-family="sans-serif" font-size="14" fill="#333">经典集合（特征函数）</text>
  <!-- 高斯型 -->
  <path d="M 120,196.6 L 160,174.7 L 200,150.8 L 240,127 L 280,105.7 L 320,89.7 L 360,81.1 L 380,80 L 400,81.1 L 440,89.7 L 480,105.7 L 520,127 L 560,150.8 L 600,174.7 L 640,196.6" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <text x="600" y="238" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="end">高斯型</text>
  <!-- 三角形 -->
  <path d="M 180,260 L 380,80 L 580,260" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="380" y="282" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">三角形</text>
  <!-- 梯形 -->
  <path d="M 120,260 L 260,80 L 420,80 L 560,260" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <text x="340" y="68" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">梯形</text>
</svg>
