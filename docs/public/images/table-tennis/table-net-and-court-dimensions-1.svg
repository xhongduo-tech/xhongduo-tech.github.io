<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="sans-serif">
  <title>乒乓球台俯视尺寸图</title>
  <desc>从上方俯视乒乓球台，标注球台长 2.74 米、宽 1.525 米、中线、白色边线与端线、球网尺寸以及比赛场地空间要求。</desc>
  <rect x="0" y="0" width="720" height="470" fill="#faf9f5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">乒乓球台俯视尺寸图（ITTF《乒乓球竞赛规则》第2章）</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#666">（单位：米 m；括号内为厘米 cm）</text>

  <!-- 比赛场地虚线框示意（不小于 14 m × 7 m，未按比例） -->
  <rect x="70" y="88" width="580" height="300" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="8 6" rx="4"/>
  <text x="78" y="102" font-size="13" fill="#1f6f8b">比赛场地不小于 14 m × 7 m（高不低于 5 m）</text>

  <!-- 球台面（深蓝绿色） -->
  <rect x="160" y="140" width="400" height="196" fill="#2c5f7a" stroke="#333" stroke-width="2"/>

  <!-- 白色边线（台面四周 2 cm，示意加宽） -->
  <rect x="160" y="140" width="400" height="196" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- 中线（3 mm，双打发球分界） -->
  <line x1="360" y1="140" x2="360" y2="336" stroke="#ffffff" stroke-width="3"/>

  <!-- 球网（横跨中线，两端各超出台面 15.25 cm） -->
  <line x1="128" y1="238" x2="592" y2="238" stroke="#c0392b" stroke-width="5"/>
  <circle cx="128" cy="238" r="4" fill="#c0392b"/>
  <circle cx="592" cy="238" r="4" fill="#c0392b"/>

  <!-- 长度标注 2.74 m -->
  <line x1="580" y1="140" x2="580" y2="336" stroke="#333" stroke-width="1.5"/>
  <line x1="570" y1="140" x2="590" y2="140" stroke="#333" stroke-width="1.5"/>
  <line x1="570" y1="336" x2="590" y2="336" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="246" font-size="15" fill="#333" font-weight="bold">2.74 m（274 cm）</text>
  <text x="600" y="266" font-size="13" fill="#666">台面长</text>

  <!-- 宽度标注 1.525 m -->
  <line x1="160" y1="356" x2="560" y2="356" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="346" x2="160" y2="366" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="346" x2="560" y2="366" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="384" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1.525 m（152.5 cm）</text>
  <text x="360" y="402" text-anchor="middle" font-size="13" fill="#666">台面宽（含边线）</text>

  <!-- 网高标注 -->
  <text x="128" y="222" font-size="13" fill="#c0392b" text-anchor="end">网高 15.25 cm</text>
  <line x1="132" y1="238" x2="132" y2="224" stroke="#c0392b" stroke-width="1.5"/>

  <!-- 中线标注 -->
  <text x="368" y="176" font-size="13" fill="#ffffff">中线 3 mm（双打分界）</text>

  <!-- 半区标注 -->
  <text x="270" y="250" text-anchor="middle" font-size="15" fill="#ffffff" opacity="0.85">左半区</text>
  <text x="450" y="250" text-anchor="middle" font-size="15" fill="#ffffff" opacity="0.85">右半区</text>
</svg>
