<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">猜硬币博弈的最优回应曲线</title>
  <desc id="desc">横轴为参与者1出正面的概率 p，纵轴为参与者2出正面的概率 q。红色折线为参与者1的最优回应，青色折线为参与者2的最优回应，两者在 p=1/2、q=1/2 处相交，即混合策略纳什均衡点。</desc>
  <rect x="0" y="0" width="620" height="420" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <!-- 坐标轴 -->
    <line x1="70" y1="380" x2="570" y2="380" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="40" x2="70" y2="380" stroke="#333" stroke-width="2"/>
    <!-- 刻度 -->
    <line x1="320" y1="380" x2="320" y2="386" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="210" x2="64" y2="210" stroke="#333" stroke-width="2"/>
    <text x="316" y="398" font-size="14" fill="#333">p = 1/2</text>
    <text x="14" y="216" font-size="14" fill="#333">q = 1/2</text>
    <text x="300" y="404" font-size="14" fill="#333">p = 1</text>
    <text x="44" y="404" font-size="14" fill="#333">p = 0</text>
    <text x="88" y="44" font-size="14" fill="#333">q = 1</text>
    <text x="90" y="374" font-size="14" fill="#333">q = 0</text>
    <!-- 轴标题 -->
    <text x="285" y="416" font-size="16" fill="#333">参与者1出正面的概率 p</text>
    <text x="12" y="52" font-size="16" fill="#333" transform="rotate(-90 24 210)">参与者2出正面的概率 q</text>

    <!-- 参与者1的最优回应（红） -->
    <line x1="70" y1="380" x2="70" y2="210" stroke="#c0392b" stroke-width="3"/>
    <line x1="570" y1="210" x2="570" y2="40" stroke="#c0392b" stroke-width="3"/>
    <line x1="70" y1="210" x2="570" y2="210" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>

    <!-- 参与者2的最优回应（青） -->
    <line x1="70" y1="40" x2="320" y2="40" stroke="#1f6f8b" stroke-width="3"/>
    <line x1="320" y1="380" x2="570" y2="380" stroke="#1f6f8b" stroke-width="3"/>
    <line x1="320" y1="40" x2="320" y2="380" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="7 5"/>

    <!-- 均衡点 -->
    <circle cx="320" cy="210" r="7" fill="#333"/>
    <circle cx="320" cy="210" r="4" fill="#faf9f5"/>
    <text x="338" y="200" font-size="14" fill="#333">混合均衡 (p, q) = (1/2, 1/2)</text>

    <!-- 图例 -->
    <line x1="80" y1="100" x2="120" y2="100" stroke="#c0392b" stroke-width="3"/>
    <text x="130" y="105" font-size="14" fill="#333">参与者1的最优回应（给定 q）</text>
    <line x1="80" y1="126" x2="120" y2="126" stroke="#1f6f8b" stroke-width="3"/>
    <text x="130" y="131" font-size="14" fill="#333">参与者2的最优回应（给定 p）</text>
    <line x1="80" y1="152" x2="120" y2="152" stroke="#333" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="130" y="157" font-size="14" fill="#333">无差异段（对手随机化时任意回应皆可）</text>
  </g>
</svg>
