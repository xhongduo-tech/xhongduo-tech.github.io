<svg viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">市场进入博弈的博弈树</title>
  <desc id="desc">扩展式博弈的示例：潜在进入者 E 先选择进入或不进入；若进入，在位者 I 再选择抵抗或默许。三个终点分别给出收益向量（E 的收益，I 的收益）。</desc>
  <rect x="0" y="0" width="620" height="460" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <!-- 根节点 -->
    <circle cx="310" cy="50" r="9" fill="#333"/>
    <text x="324" y="54" font-size="14" fill="#333">E（进入者）</text>
    <!-- 进入分支 -->
    <line x1="310" y1="59" x2="150" y2="200" stroke="#333" stroke-width="2"/>
    <text x="182" y="120" font-size="14" fill="#333">进入</text>
    <!-- 不进入分支 -->
    <line x1="310" y1="59" x2="470" y2="200" stroke="#333" stroke-width="2"/>
    <text x="408" y="120" font-size="14" fill="#333">不进入</text>
    <!-- 中间决策节点 -->
    <circle cx="150" cy="210" r="9" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="164" y="214" font-size="14" fill="#333">I（在位者）</text>
    <!-- 抵抗分支 -->
    <line x1="144" y1="219" x2="60" y2="360" stroke="#333" stroke-width="2"/>
    <text x="52" y="300" font-size="14" fill="#333">抵抗</text>
    <!-- 默许分支 -->
    <line x1="156" y1="219" x2="240" y2="360" stroke="#333" stroke-width="2"/>
    <text x="190" y="300" font-size="14" fill="#333">默许</text>
    <!-- 终点节点 -->
    <circle cx="60" cy="370" r="5" fill="#333"/>
    <circle cx="240" cy="370" r="5" fill="#333"/>
    <circle cx="470" cy="370" r="5" fill="#333"/>
    <text x="16" y="392" font-size="14" fill="#333">(-1, -1)</text>
    <text x="196" y="392" font-size="14" fill="#333">(2, 1)</text>
    <text x="436" y="392" font-size="14" fill="#333">(0, 2)</text>
    <!-- 注释 -->
    <text x="16" y="432" font-size="13" fill="#666">收益顺序：（进入者，在位者）</text>
    <text x="16" y="452" font-size="13" fill="#666">进入者先动，在位者观察到「进入」后才决策——完美信息</text>
  </g>
</svg>
