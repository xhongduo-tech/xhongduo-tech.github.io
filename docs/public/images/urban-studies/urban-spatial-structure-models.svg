<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="sans-serif">
  <title>城市空间结构的三种经典模型</title>
  <desc>对比伯吉斯同心圆模型、霍伊特扇形模型、哈里斯与乌尔曼多核心模型的空间组织方式。</desc>
  <rect x="0" y="0" width="920" height="360" fill="#faf9f5"/>
  <text x="460" y="28" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">城市空间结构的三种经典模型</text>

  <!-- 模型一：同心圆（伯吉斯） -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="280" height="280" rx="8" fill="#fff" stroke="#d8d4cc" stroke-width="1"/>
    <text x="140" y="20" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">① 同心圆模型（伯吉斯 1925）</text>
    <circle cx="140" cy="150" r="30" fill="#c0392b" opacity="0.85"/>
    <circle cx="140" cy="150" r="60" fill="#e8a97f" fill-opacity="0.55" stroke="#999" stroke-width="1"/>
    <circle cx="140" cy="150" r="90" fill="#f2d8b0" fill-opacity="0.6" stroke="#999" stroke-width="1"/>
    <circle cx="140" cy="150" r="115" fill="#d5e8e0" fill-opacity="0.6" stroke="#999" stroke-width="1"/>
    <circle cx="140" cy="150" r="130" fill="#f0efe9" fill-opacity="0.6" stroke="#999" stroke-width="1"/>
    <text x="140" y="146" font-size="13" fill="#fff" text-anchor="middle">中央</text>
    <text x="140" y="162" font-size="13" fill="#fff" text-anchor="middle">商务区</text>
    <text x="176" y="126" font-size="13" fill="#333" text-anchor="middle">过渡地带</text>
    <text x="176" y="176" font-size="13" fill="#333" text-anchor="middle">工人住宅区</text>
    <text x="60" y="96" font-size="13" fill="#333" text-anchor="middle">中产住宅区</text>
    <text x="208" y="238" font-size="13" fill="#333" text-anchor="middle">通勤区</text>
  </g>

  <!-- 模型二：扇形（霍伊特） -->
  <g transform="translate(320, 55)">
    <rect x="0" y="0" width="280" height="280" rx="8" fill="#fff" stroke="#d8d4cc" stroke-width="1"/>
    <text x="140" y="20" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">② 扇形模型（霍伊特 1939）</text>
    <path d="M140 150 L140 20 A130 130 0 0 1 224 85 Z" fill="#1f6f8b" opacity="0.55"/>
    <path d="M140 150 L228 97 A130 130 0 0 1 240 190 Z" fill="#f2d8b0" opacity="0.7"/>
    <path d="M140 150 L240 194 A130 130 0 0 1 190 280 Z" fill="#e8a97f" opacity="0.55"/>
    <path d="M140 150 L185 280 A130 130 0 0 1 48 240 Z" fill="#c9c9c9" opacity="0.7"/>
    <circle cx="140" cy="150" r="32" fill="#c0392b" opacity="0.85"/>
    <line x1="140" y1="150" x2="140" y2="22" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="140" y="146" font-size="13" fill="#fff" text-anchor="middle">中心</text>
    <text x="140" y="162" font-size="13" fill="#fff" text-anchor="middle">商业区</text>
    <text x="176" y="62" font-size="13" fill="#fff" text-anchor="middle">高收入住宅</text>
    <text x="206" y="140" font-size="13" fill="#333" text-anchor="middle">中收入住宅</text>
    <text x="188" y="236" font-size="13" fill="#333" text-anchor="middle">低收入住宅</text>
    <text x="66" y="216" font-size="13" fill="#333" text-anchor="middle">工业与批发带</text>
    <text x="140" y="18" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">交通干线</text>
  </g>

  <!-- 模型三：多核心（哈里斯与乌尔曼） -->
  <g transform="translate(620, 55)">
    <rect x="0" y="0" width="280" height="280" rx="8" fill="#fff" stroke="#d8d4cc" stroke-width="1"/>
    <text x="140" y="20" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">③ 多核心模型（哈里斯与乌尔曼 1945）</text>
    <line x1="140" y1="150" x2="62" y2="60" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="140" y1="150" x2="216" y2="64" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="140" y1="150" x2="52" y2="206" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="140" y1="150" x2="224" y2="206" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
    <circle cx="140" cy="150" r="34" fill="#c0392b" opacity="0.85"/>
    <circle cx="62" cy="60" r="24" fill="#1f6f8b" opacity="0.65"/>
    <circle cx="216" cy="64" r="24" fill="#7f8c8d" opacity="0.6"/>
    <circle cx="52" cy="206" r="24" fill="#7f8c8d" opacity="0.6"/>
    <circle cx="224" cy="206" r="26" fill="#f2d8b0" stroke="#999" stroke-width="1"/>
    <circle cx="140" cy="252" r="18" fill="#f2d8b0" stroke="#999" stroke-width="1"/>
    <text x="140" y="146" font-size="13" fill="#fff" text-anchor="middle">中央</text>
    <text x="140" y="162" font-size="13" fill="#fff" text-anchor="middle">商业区</text>
    <text x="62" y="64" font-size="11" fill="#fff" text-anchor="middle">次级商业</text>
    <text x="216" y="68" font-size="13" fill="#fff" text-anchor="middle">工业区</text>
    <text x="52" y="210" font-size="13" fill="#fff" text-anchor="middle">批发区</text>
    <text x="224" y="202" font-size="13" fill="#333" text-anchor="middle">近郊住宅区</text>
    <text x="140" y="238" font-size="13" fill="#333" text-anchor="middle">住宅区</text>
  </g>
</svg>
