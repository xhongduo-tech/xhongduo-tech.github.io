<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
  <title>上确界与上界：E = [1, 2) 的示意图</title>
  <desc>数轴上集合 E=[1,2)，上界全体为 [2,+∞)，上确界 sup E=2 是上界中的最小者；下确界 inf E=1 属于 E，故等于最小值。</desc>

  <!-- 数轴 -->
  <line x1="55" y1="180" x2="610" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 刻度与数值 -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="60"  y1="175" x2="60"  y2="185"/>
    <line x1="233" y1="175" x2="233" y2="185"/>
    <line x1="407" y1="175" x2="407" y2="185"/>
    <line x1="580" y1="175" x2="580" y2="185"/>
  </g>
  <g fill="#333" font-size="15" text-anchor="middle">
    <text x="60"  y="205">0</text>
    <text x="233" y="205">1</text>
    <text x="407" y="205">2</text>
    <text x="580" y="205">3</text>
  </g>

  <!-- E = [1, 2) 红色粗线段 -->
  <line x1="233" y1="180" x2="407" y2="180" stroke="#c0392b" stroke-width="6"/>
  <circle cx="233" cy="180" r="7" fill="#c0392b" stroke="#c0392b"/>
  <circle cx="407" cy="180" r="7" fill="#faf9f5" stroke="#c0392b" stroke-width="3"/>
  <text x="320" y="150" fill="#c0392b" font-size="16" text-anchor="middle">E = [1, 2)</text>

  <!-- 上界区域 [2, +∞) 青色 -->
  <line x1="407" y1="180" x2="602" y2="180" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="505" y="162" fill="#1f6f8b" font-size="15" text-anchor="middle">上界：x ≥ 2</text>

  <!-- 标注 -->
  <text x="407" y="108" fill="#333" font-size="16" text-anchor="middle">sup E = 2（最小上界）</text>
  <line x1="407" y1="116" x2="407" y2="166" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="233" y="232" fill="#333" font-size="15" text-anchor="middle">inf E = min E = 1</text>
  <line x1="233" y1="224" x2="233" y2="192" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
