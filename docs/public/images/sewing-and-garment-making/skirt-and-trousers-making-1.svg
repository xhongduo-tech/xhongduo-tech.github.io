<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-labelledby="title desc">
<title id="title">裤装结构示意：腰头、上裆、下裆、侧缝、脚口</title>
<desc id="desc">正面视图的裤装示意图，标注腰头、门襟、上裆（直裆）、下裆（内缝）、侧缝与脚口六个结构部位。</desc>
<rect width="400" height="460" fill="#faf9f5"/>
<!-- 裤身主体 -->
<path d="M100 40 L85 120 L70 400 L180 400 L185 170 L200 150 L215 170 L220 400 L330 400 L315 120 L300 40 Z" fill="#f2ede4" stroke="#333" stroke-width="2"/>
<!-- 腰头 -->
<rect x="98" y="20" width="204" height="22" fill="#faf9f5" stroke="#333" stroke-width="2"/>
<!-- 门襟开口线 -->
<line x1="200" y1="42" x2="200" y2="96" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,3"/>
<!-- 前中线虚线 -->
<line x1="200" y1="96" x2="200" y2="150" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
<!-- 上裆标注线 -->
<line x1="200" y1="42" x2="200" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<!-- 标注文字与引出线 -->
<text x="58" y="34" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="end">腰头</text>
<line x1="96" y1="32" x2="62" y2="32" stroke="#c0392b" stroke-width="1.5"/>
<text x="250" y="74" font-family="sans-serif" font-size="14" fill="#c0392b">门襟</text>
<line x1="204" y1="70" x2="246" y2="70" stroke="#c0392b" stroke-width="1.5"/>
<text x="262" y="102" font-family="sans-serif" font-size="14" fill="#c0392b">上裆（直裆）</text>
<line x1="206" y1="100" x2="258" y2="100" stroke="#c0392b" stroke-width="1.5"/>
<text x="258" y="330" font-family="sans-serif" font-size="14" fill="#c0392b">下裆（内缝）</text>
<line x1="216" y1="330" x2="254" y2="330" stroke="#c0392b" stroke-width="1.5"/>
<text x="52" y="255" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="end">侧缝</text>
<line x1="78" y1="250" x2="56" y2="252" stroke="#c0392b" stroke-width="1.5"/>
<text x="120" y="424" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">脚口</text>
<line x1="120" y1="404" x2="120" y2="420" stroke="#c0392b" stroke-width="1.5"/>
</svg>
