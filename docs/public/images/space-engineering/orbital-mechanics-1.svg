<svg viewBox="0 0 600 360" width="600" height="360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>椭圆轨道与轨道要素</title>
  <desc>以地球为焦点的椭圆轨道示意图，标注近地点、远地点、半长轴 a 与两焦点位置。</desc>
  <rect x="0" y="0" width="600" height="360" fill="#faf9f5"/>
  <!-- 椭圆轨道 -->
  <ellipse cx="300" cy="210" rx="230" ry="130" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 长轴与短轴参考线 -->
  <line x1="70" y1="210" x2="530" y2="210" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <!-- 半长轴 a 线段（红色加深，自中心到远地点） -->
  <line x1="300" y1="210" x2="530" y2="210" stroke="#1f6f8b" stroke-width="2.4"/>
  <!-- 近地点/远地点半径线（自焦点到端点） -->
  <line x1="110" y1="210" x2="70" y2="210" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="110" y1="210" x2="530" y2="210" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- 地球（左焦点） -->
  <circle cx="110" cy="210" r="16" fill="#1f6f8b"/>
  <circle cx="110" cy="210" r="6" fill="#faf9f5"/>
  <!-- 近地点与远地点端点 -->
  <circle cx="70" cy="210" r="5" fill="#c0392b"/>
  <circle cx="530" cy="210" r="5" fill="#c0392b"/>
  <!-- 标签 -->
  <text x="62" y="196" font-size="15" fill="#333">近地点</text>
  <text x="66" y="182" font-size="14" fill="#333">r_p</text>
  <text x="520" y="196" font-size="15" fill="#333">远地点</text>
  <text x="524" y="182" font-size="14" fill="#333">r_a</text>
  <text x="285" y="196" font-size="15" fill="#1f6f8b">a（半长轴）</text>
  <text x="128" y="238" font-size="15" fill="#333">焦点：地球</text>
  <text x="300" y="350" font-size="15" fill="#333">椭圆轨道：天体在焦点上，卫星沿椭圆运动</text>
</svg>
