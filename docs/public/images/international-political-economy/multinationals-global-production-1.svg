<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>微笑曲线：全球价值链上的附加值分布</title>
  <desc>横轴为价值链环节（研发设计、关键部件、制造组装、品牌营销、售后服务），纵轴为附加值高低；曲线两端高、中段低，呈微笑形。</desc>
  <rect width="800" height="480" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333">
    <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold">全球价值链的「微笑曲线」</text>
    <text x="400" y="66" text-anchor="middle" font-size="14">附加值高（两端）→ 低（中段）→ 高（两端）</text>
  </g>
  <!-- axes -->
  <line x1="90" y1="400" x2="740" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="400" x2="90" y2="80" stroke="#333" stroke-width="2"/>
  <text x="40" y="240" font-size="14" fill="#333" transform="rotate(-90 40 240)" text-anchor="middle">附加值（高 → 低 → 高）</text>
  <text x="415" y="450" font-size="14" fill="#333" text-anchor="middle">价值链环节</text>
  <!-- smile curve -->
  <path d="M 110 120 Q 240 260 400 330 Q 560 260 690 120" fill="none" stroke="#1f6f8b" stroke-width="4"/>
  <!-- stage markers -->
  <line x1="110" y1="410" x2="110" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="410" x2="400" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="690" y1="410" x2="690" y2="400" stroke="#333" stroke-width="2"/>
  <text x="110" y="432" text-anchor="middle" font-size="14" fill="#333">研发设计</text>
  <text x="400" y="432" text-anchor="middle" font-size="14" fill="#333">关键部件与组装</text>
  <text x="690" y="432" text-anchor="middle" font-size="14" fill="#333">品牌·营销·售后</text>
  <!-- annotations -->
  <text x="120" y="105" font-size="14" fill="#c0392b" text-anchor="middle">高附加值（芯片、专利）</text>
  <text x="400" y="368" font-size="14" fill="#c0392b" text-anchor="middle">低附加值（组装）</text>
  <text x="678" y="105" font-size="14" fill="#c0392b" text-anchor="middle">高附加值（品牌、服务）</text>
  <text x="400" y="150" font-size="14" fill="#1f6f8b" text-anchor="middle" font-style="italic">iPhone 案例：芯片占高值、组装占低值</text>
</svg>
