<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>冯·杜能农业区位论同心环</title>
<desc>围绕市场城市的五圈同心环：集约农业、林业、谷物种植、粗放畜牧、荒野。</desc>
<rect x="0" y="0" width="480" height="300" fill="#faf9f5"/>
<g transform="translate(240,150)">
  <circle r="150" fill="#e8e0d0"/>
  <circle r="120" fill="#d9e6d2"/>
  <circle r="90" fill="#c3d8b0"/>
  <circle r="60" fill="#f0d8a8"/>
  <circle r="32" fill="#1f6f8b"/>
  <text y="6" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">市场</text>
</g>
<g font-size="13" fill="#333">
  <text x="30" y="60">1 集约农业与园艺</text>
  <text x="30" y="80">2 林业</text>
  <text x="30" y="100">3 谷物种植</text>
  <text x="30" y="120">4 粗放畜牧</text>
  <text x="30" y="140">5 荒野</text>
  <line x1="20" y1="50" x2="20" y2="150" stroke="#333" stroke-width="2"/>
  <text x="12" y="170" font-size="13" fill="#1f6f8b">距离市场↑</text>
  <text x="12" y="188" font-size="13" fill="#1f6f8b">地租↓</text>
</g>
<text x="240" y="285" font-size="13" fill="#333" text-anchor="middle">越靠近市场，运输成本越低，越适合种运费敏感、易腐的商品</text>
</svg>
