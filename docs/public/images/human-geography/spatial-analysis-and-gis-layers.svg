<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>GIS 图层叠加示意图</title>
<desc>三张要素图层（土地利用、道路、人口点）在 GIS 中上下叠加，经叠加分析得到新图层。</desc>
<rect x="0" y="0" width="480" height="300" fill="#faf9f5"/>
<g stroke="#333" stroke-width="2" fill="none">
  <rect x="30" y="50" width="200" height="160"/>
  <rect x="45" y="70" width="60" height="50" fill="#d9e6d2"/>
  <rect x="135" y="140" width="70" height="55" fill="#f0e0c8"/>
  <path d="M 45 150 L 95 150 L 95 190" fill="#e8d8d0"/>
</g>
<g stroke="#1f6f8b" stroke-width="3" fill="none">
  <path d="M 45 120 L 100 95 L 160 110 L 215 70"/>
  <path d="M 60 180 L 120 165 L 190 190 L 220 160"/>
</g>
<g fill="#c0392b">
  <circle cx="100" cy="95" r="6"/>
  <circle cx="160" cy="110" r="5"/>
  <circle cx="80" cy="150" r="7"/>
  <circle cx="185" cy="160" r="4"/>
</g>
<text x="45" y="35" font-size="13" fill="#333" font-weight="bold">图层 1：土地利用</text>
<text x="45" y="230" font-size="13" fill="#1f6f8b" font-weight="bold">图层 2：道路</text>
<text x="45" y="250" font-size="13" fill="#c0392b" font-weight="bold">图层 3：人口点</text>
<g transform="translate(260,50)">
  <rect x="0" y="0" width="190" height="160" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="15" y="20" width="60" height="50" fill="#d9e6d2"/>
  <rect x="105" y="90" width="70" height="55" fill="#f0e0c8"/>
  <path d="M 15 100 L 65 100 L 65 140" fill="#e8d8d0"/>
  <g stroke="#1f6f8b" stroke-width="3" fill="none">
    <path d="M 15 70 L 70 45 L 130 60 L 185 20"/>
    <path d="M 30 130 L 90 115 L 160 140 L 190 110"/>
  </g>
  <g fill="#c0392b">
    <circle cx="70" cy="45" r="6"/>
    <circle cx="130" cy="60" r="5"/>
    <circle cx="50" cy="100" r="7"/>
    <circle cx="150" cy="110" r="4"/>
  </g>
  <text x="15" y="180" font-size="13" fill="#333" font-weight="bold">叠加分析结果</text>
</g>
<text x="260" y="240" font-size="13" fill="#333">多张带空间坐标的图层，</text>
<text x="260" y="260" font-size="13" fill="#333">经空间叠置求出交、并、差，</text>
<text x="260" y="280" font-size="13" fill="#333">得到回答新问题的新图层。</text>
</svg>
