<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
  <title>前注意加工：特征独一即可弹出</title>
  <desc>左图仅有一个红色圆，能被瞬时注意到；右图各圆颜色随机，需要逐个扫描，体现了前注意加工与串行搜索的差别。</desc>
  <rect width="640" height="260" fill="#faf9f5"/>
  <text x="24" y="28" font-size="15" fill="#333">左：仅一个红色圆 → 前注意弹出</text>
  <text x="344" y="28" font-size="15" fill="#333">右：颜色随机 → 逐项串行搜索</text>
  <text x="24" y="52" font-size="13" fill="#666">颜色是前注意通道，目标一眼可见</text>
  <text x="344" y="52" font-size="13" fill="#666">没有独一特征，只能逐个扫过</text>
  <g fill="#999">
    <circle cx="40" cy="90" r="14"/>
    <circle cx="90" cy="90" r="14"/>
    <circle cx="140" cy="90" r="14"/>
    <circle cx="190" cy="90" r="14"/>
    <circle cx="240" cy="90" r="14"/>
    <circle cx="290" cy="90" r="14"/>
    <circle cx="40" cy="140" r="14"/>
    <circle cx="90" cy="140" r="14"/>
    <circle cx="140" cy="140" r="14"/>
    <circle cx="190" cy="140" r="14"/>
    <circle cx="240" cy="140" r="14"/>
    <circle cx="290" cy="140" r="14"/>
    <circle cx="40" cy="190" r="14"/>
    <circle cx="90" cy="190" r="14"/>
    <circle cx="140" cy="190" r="14"/>
    <circle cx="190" cy="190" r="14"/>
    <circle cx="290" cy="190" r="14"/>
    <circle cx="40" cy="230" r="14"/>
    <circle cx="90" cy="230" r="14"/>
    <circle cx="140" cy="230" r="14"/>
    <circle cx="190" cy="230" r="14"/>
    <circle cx="240" cy="230" r="14"/>
    <circle cx="290" cy="230" r="14"/>
  </g>
  <circle cx="240" cy="190" r="14" fill="#c0392b"/>
  <g>
    <circle cx="360" cy="90" r="14" fill="#999"/>
    <circle cx="410" cy="90" r="14" fill="#c0392b"/>
    <circle cx="460" cy="90" r="14" fill="#1f6f8b"/>
    <circle cx="510" cy="90" r="14" fill="#999"/>
    <circle cx="560" cy="90" r="14" fill="#666"/>
    <circle cx="610" cy="90" r="14" fill="#c98a2d"/>
    <circle cx="360" cy="140" r="14" fill="#c0392b"/>
    <circle cx="410" cy="140" r="14" fill="#999"/>
    <circle cx="460" cy="140" r="14" fill="#c98a2d"/>
    <circle cx="510" cy="140" r="14" fill="#1f6f8b"/>
    <circle cx="560" cy="140" r="14" fill="#c0392b"/>
    <circle cx="610" cy="140" r="14" fill="#999"/>
    <circle cx="360" cy="190" r="14" fill="#1f6f8b"/>
    <circle cx="410" cy="190" r="14" fill="#c98a2d"/>
    <circle cx="460" cy="190" r="14" fill="#999"/>
    <circle cx="510" cy="190" r="14" fill="#c0392b"/>
    <circle cx="560" cy="190" r="14" fill="#1f6f8b"/>
    <circle cx="610" cy="190" r="14" fill="#666"/>
    <circle cx="360" cy="230" r="14" fill="#666"/>
    <circle cx="410" cy="230" r="14" fill="#1f6f8b"/>
    <circle cx="460" cy="230" r="14" fill="#c0392b"/>
    <circle cx="510" cy="230" r="14" fill="#c98a2d"/>
    <circle cx="560" cy="230" r="14" fill="#999"/>
    <circle cx="610" cy="230" r="14" fill="#c0392b"/>
  </g>
</svg>
