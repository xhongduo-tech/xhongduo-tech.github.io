<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <title>乙基 1H 谱的劈裂：CH3 三重峰与 CH2 四重峰</title>
  <desc>左侧红色谱棒展示 CH3 受两个相邻等价氢耦合劈裂为三重峰，强度比 1:2:1；右侧青色谱棒展示 CH2 受三个相邻等价氢耦合劈裂为四重峰，强度比 1:3:3:1；下方标注耦合常数 J。</desc>
  <rect x="0" y="0" width="760" height="420" fill="#faf9f5"/>
  <text x="380" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">乙基 1H 谱的劈裂（n+1 规则）</text>

  <!-- 左面板：CH3 三重峰 -->
  <text x="200" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#c0392b">CH3 三重峰</text>
  <line x1="90" y1="330" x2="310" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="330" x2="140" y2="292" stroke="#c0392b" stroke-width="7"/>
  <line x1="190" y1="330" x2="190" y2="250" stroke="#c0392b" stroke-width="7"/>
  <line x1="240" y1="330" x2="240" y2="292" stroke="#c0392b" stroke-width="7"/>
  <text x="140" y="370" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="190" y="370" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="240" y="370" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- J 括号 -->
  <line x1="140" y1="385" x2="190" y2="385" stroke="#333" stroke-width="1.5"/>
  <line x1="190" y1="385" x2="240" y2="385" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="380" x2="140" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="190" y1="380" x2="190" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="240" y1="380" x2="240" y2="390" stroke="#333" stroke-width="1.5"/>
  <text x="165" y="402" text-anchor="middle" font-size="14" fill="#333">J</text>
  <text x="215" y="402" text-anchor="middle" font-size="14" fill="#333">J</text>

  <!-- 右面板：CH2 四重峰 -->
  <text x="580" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f6f8b">CH2 四重峰</text>
  <line x1="470" y1="330" x2="690" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="495" y1="330" x2="495" y2="305" stroke="#1f6f8b" stroke-width="7"/>
  <line x1="545" y1="330" x2="545" y2="255" stroke="#1f6f8b" stroke-width="7"/>
  <line x1="595" y1="330" x2="595" y2="255" stroke="#1f6f8b" stroke-width="7"/>
  <line x1="645" y1="330" x2="645" y2="305" stroke="#1f6f8b" stroke-width="7"/>
  <text x="495" y="370" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="545" y="370" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="595" y="370" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="645" y="370" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- J 括号 -->
  <line x1="495" y1="385" x2="545" y2="385" stroke="#333" stroke-width="1.5"/>
  <line x1="545" y1="385" x2="595" y2="385" stroke="#333" stroke-width="1.5"/>
  <line x1="595" y1="385" x2="645" y2="385" stroke="#333" stroke-width="1.5"/>
  <line x1="495" y1="380" x2="495" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="545" y1="380" x2="545" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="595" y1="380" x2="595" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="645" y1="380" x2="645" y2="390" stroke="#333" stroke-width="1.5"/>

  <text x="380" y="416" text-anchor="middle" font-size="15" fill="#333">同一对氢的 J 相等：两套多重峰的裂距相同，是「彼此耦合」的判据</text>
</svg>
