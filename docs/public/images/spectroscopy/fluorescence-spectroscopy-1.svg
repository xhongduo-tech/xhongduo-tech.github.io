<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif">
  <title>雅布隆斯基图：吸收、荧光、磷光与能量耗散途径</title>
  <desc>能量自下而上排列：基态单重态 S0、激发单重态 S1 与 S2、激发三重态 T1。向上箭头为吸收，向下的实线箭头为荧光（S1→S0）与磷光（T1→S0），波浪线为内转换、系间窜越与振动弛豫。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#faf9f5"/>
  <text x="380" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">雅布隆斯基图：吸收、荧光与磷光</text>

  <!-- 能量轴 -->
  <line x1="520" y1="90" x2="520" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="75" text-anchor="middle" font-size="15" fill="#333">能量 E ↑</text>

  <!-- 能级 -->
  <line x1="170" y1="110" x2="300" y2="110" stroke="#c0392b" stroke-width="4"/>
  <line x1="170" y1="200" x2="300" y2="200" stroke="#c0392b" stroke-width="4"/>
  <line x1="170" y1="350" x2="300" y2="350" stroke="#333" stroke-width="4"/>
  <line x1="330" y1="245" x2="440" y2="245" stroke="#1f6f8b" stroke-width="4" stroke-dasharray="10 5"/>

  <text x="310" y="115" font-size="16" fill="#333">S2</text>
  <text x="310" y="205" font-size="16" fill="#333">S1</text>
  <text x="310" y="355" font-size="16" fill="#333">S0</text>
  <text x="450" y="250" font-size="16" fill="#1f6f8b">T1（三重态）</text>

  <!-- 振动子能级 -->
  <line x1="175" y1="95" x2="185" y2="95" stroke="#c0392b" stroke-width="2"/>
  <line x1="175" y1="80" x2="185" y2="80" stroke="#c0392b" stroke-width="2"/>
  <line x1="175" y1="185" x2="185" y2="185" stroke="#c0392b" stroke-width="2"/>
  <line x1="175" y1="170" x2="185" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="175" y1="335" x2="185" y2="335" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="320" x2="185" y2="320" stroke="#333" stroke-width="2"/>

  <!-- 吸收 -->
  <line x1="200" y1="345" x2="200" y2="115" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="215" y1="345" x2="215" y2="205" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="120" y="235" text-anchor="middle" font-size="14" fill="#c0392b">吸收</text>
  <text x="120" y="253" text-anchor="middle" font-size="13" fill="#333">S0→S1/S2</text>

  <!-- 荧光 -->
  <line x1="260" y1="195" x2="260" y2="355" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="320" y="280" font-size="15" fill="#c0392b">荧光</text>

  <!-- 内转换 -->
  <path d="M 295 122 C 285 138, 305 148, 295 162 C 285 176, 305 186, 295 198" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="445" y="150" font-size="14" fill="#333">内转换（IC）</text>

  <!-- 系间窜越 -->
  <path d="M 288 205 C 300 218, 315 228, 328 240" fill="none" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="470" y="215" font-size="14" fill="#1f6f8b">系间窜越（ISC）</text>

  <!-- 磷光 -->
  <line x1="385" y1="240" x2="385" y2="355" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="410" y="300" font-size="15" fill="#1f6f8b">磷光</text>

  <!-- 振动弛豫 -->
  <path d="M 285 172 C 278 178, 292 180, 285 186" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="445" y="175" font-size="13" fill="#333">振动弛豫</text>

  <text x="380" y="452" text-anchor="middle" font-size="15" fill="#333">荧光（S1→S0，快、纳秒级）比磷光（T1→S0，慢、毫秒~秒级）能量高、波长短</text>
</svg>
