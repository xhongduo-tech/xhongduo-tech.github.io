<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">
  <title>动态 NMR 线形随温度的变化：从慢交换到快交换</title>
  <desc>三个面板展示两态交换体系的 1H 谱线形：低温时两根尖锐峰（慢交换），合并温度附近一根宽峰，高温时一根尖锐平均峰（快交换）。箭头表示温度升高、交换速率增大。</desc>
  <rect x="0" y="0" width="760" height="430" fill="#faf9f5"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">动态 NMR：交换速率决定线形</text>

  <!-- 面板 A：慢交换 -->
  <text x="150" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">低温（k 很小）</text>
  <line x1="140" y1="300" x2="420" y2="300" stroke="#333" stroke-width="2"/>
  <path d="M 205 300 Q 235 110 265 300 Z" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <path d="M 275 300 Q 305 110 335 300 Z" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="235" y="325" text-anchor="middle" font-size="14" fill="#333">δ_A</text>
  <text x="305" y="325" text-anchor="middle" font-size="14" fill="#333">δ_B</text>
  <text x="280" y="370" text-anchor="middle" font-size="14" fill="#333">慢交换：两根尖锐峰</text>

  <!-- 面板 B：合并 -->
  <text x="430" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">T ≈ Tc（k = kc）</text>
  <line x1="350" y1="300" x2="560" y2="300" stroke="#333" stroke-width="2"/>
  <path d="M 395 300 Q 455 70 515 300 Z" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <text x="455" y="325" text-anchor="middle" font-size="14" fill="#333">合并温度：一根宽峰</text>
  <text x="455" y="370" text-anchor="middle" font-size="14" fill="#333">k = πΔν/√2</text>

  <!-- 面板 C：快交换 -->
  <text x="680" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">高温（k 很大）</text>
  <line x1="590" y1="300" x2="740" y2="300" stroke="#333" stroke-width="2"/>
  <path d="M 650 300 Q 665 75 680 300 Z" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <text x="665" y="325" text-anchor="middle" font-size="14" fill="#333">δ_avg</text>
  <text x="665" y="370" text-anchor="middle" font-size="14" fill="#333">快交换：一根平均峰</text>

  <!-- 温度箭头 -->
  <path d="M 335 230 L 355 230" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 345 230 L 352 225 M 345 230 L 352 235" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 565 230 L 585 230" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 575 230 L 582 225 M 575 230 L 582 235" stroke="#333" stroke-width="2" fill="none"/>
  <text x="410" y="412" text-anchor="middle" font-size="15" fill="#333">温度 T 升高 → 交换速率 k 增大 → 谱线先变宽、并拢，再变尖（峰位 = 两种状态的平均）</text>
</svg>
