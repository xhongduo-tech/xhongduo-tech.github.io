<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <title>Cotton 效应：正与负的圆二色谱曲线</title>
  <desc>两个面板展示正负 Cotton 效应：虚线为吸收谱（λmax 处最高），实线为 CD 谱。正 Cotton 效应在短波侧为正、跨过 λmax 后在长波侧为负；负 Cotton 效应与之相反，二者都在 λmax 处过零。</desc>
  <rect x="0" y="0" width="760" height="420" fill="#faf9f5"/>
  <text x="380" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Cotton 效应：CD 谱与吸收谱的配合</text>

  <!-- 面板 A：正 Cotton -->
  <text x="220" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">正 Cotton 效应</text>
  <line x1="130" y1="270" x2="310" y2="270" stroke="#333" stroke-width="2"/>
  <!-- 吸收谱（虚线） -->
  <path d="M 150 270 Q 220 110 290 270 Z" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="8 5"/>
  <!-- CD 谱（实线） -->
  <path d="M 145 150 C 175 170, 195 240, 220 270 C 245 300, 265 340, 295 350" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="160" y="135" font-size="14" fill="#c0392b">+Δε</text>
  <text x="280" y="365" font-size="14" fill="#c0392b">−Δε</text>
  <text x="220" y="292" text-anchor="middle" font-size="13" fill="#333">λmax</text>

  <!-- 面板 B：负 Cotton -->
  <text x="580" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">负 Cotton 效应</text>
  <line x1="490" y1="270" x2="670" y2="270" stroke="#333" stroke-width="2"/>
  <path d="M 510 270 Q 580 110 650 270 Z" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="8 5"/>
  <path d="M 505 350 C 535 330, 555 300, 580 270 C 605 240, 625 200, 655 190" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="525" y="365" font-size="14" fill="#1f6f8b">−Δε</text>
  <text x="640" y="135" font-size="14" fill="#1f6f8b">+Δε</text>
  <text x="580" y="292" text-anchor="middle" font-size="13" fill="#333">λmax</text>

  <!-- 波长轴 -->
  <text x="380" y="405" text-anchor="middle" font-size="15" fill="#333">波长 λ →（虚线：紫外吸收谱；实线：圆二色谱，λmax 处过零）</text>
</svg>
