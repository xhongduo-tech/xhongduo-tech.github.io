<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="sans-serif">
  <title>GShard MoE 层的数据流</title>
  <desc>输入 token x 经路由器打分，Top-2 选中的两个专家参与计算，输出加权求和后与残差 x 相加得到层输出；未选中的专家不参与计算。</desc>
  <rect x="0" y="0" width="780" height="420" fill="#faf9f5"/>

  <!-- 输入 -->
  <rect x="30" y="175" width="140" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="100" y="205" text-anchor="middle" font-size="15" fill="#333">输入 x（token）</text>

  <!-- 路由器 -->
  <rect x="210" y="165" width="180" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="300" y="191" text-anchor="middle" font-size="15" fill="#1f6f8b">路由器（门控）</text>
  <text x="300" y="212" text-anchor="middle" font-size="13" fill="#333">p_i = softmax(x·E)</text>

  <!-- 专家 -->
  <rect x="470" y="30" width="170" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="555" y="59" text-anchor="middle" font-size="15" fill="#333">专家 1</text>
  <rect x="470" y="110" width="170" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="555" y="139" text-anchor="middle" font-size="15" fill="#333">专家 2</text>
  <rect x="470" y="190" width="170" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="555" y="219" text-anchor="middle" font-size="15" fill="#999">专家 3</text>
  <rect x="470" y="270" width="170" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="555" y="299" text-anchor="middle" font-size="15" fill="#999">专家 4</text>

  <!-- 加权求和 -->
  <rect x="210" y="320" width="180" height="56" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="344" text-anchor="middle" font-size="15" fill="#c0392b">加权求和</text>
  <text x="300" y="365" text-anchor="middle" font-size="13" fill="#333">y = g₁·FFN₁(x) + g₂·FFN₂(x)</text>

  <!-- 输出 -->
  <rect x="30" y="330" width="140" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="100" y="359" text-anchor="middle" font-size="15" fill="#333">输出 h = x + y</text>

  <!-- 箭头：输入→路由器 -->
  <line x1="170" y1="200" x2="205" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 箭头：路由器→专家1/2（激活，红） -->
  <line x1="390" y1="172" x2="465" y2="55" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="390" y1="188" x2="465" y2="135" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <!-- 箭头：路由器→专家3/4（未激活，青虚线） -->
  <line x1="390" y1="205" x2="465" y2="215" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="390" y1="220" x2="465" y2="295" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- 专家1/2 → 加权求和 -->
  <polyline points="555,80 555,340 395,340" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="555,160 555,340" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- 加权求和 → 输出 -->
  <line x1="210" y1="348" x2="175" y2="348" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 残差连接 -->
  <path d="M 100 225 C 100 290, 60 290, 100 325" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="34" y="268" font-size="13" fill="#1f6f8b">残差 x（超容时直接跳过）</text>

  <!-- 图例 -->
  <text x="600" y="360" font-size="13" fill="#333">图例：</text>
  <line x1="600" y1="378" x2="640" y2="378" stroke="#c0392b" stroke-width="3"/>
  <text x="648" y="382" font-size="13" fill="#333">激活路径（Top-2）</text>
  <line x1="600" y1="402" x2="640" y2="402" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="648" y="406" font-size="13" fill="#333">未激活路径</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
