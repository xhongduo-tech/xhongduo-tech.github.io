<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif">
  <title>专家并行中的 All-to-All 分发</title>
  <desc>每个设备上保存一组 token 与一个本地专家；路由器决定每个 token 去哪个专家，通过 All-to-All 集体通信把 token 送到对应设备上的专家，计算后再 All-to-All 送回原设备。</desc>
  <rect x="0" y="0" width="780" height="430" fill="#faf9f5"/>

  <text x="390" y="26" text-anchor="middle" font-size="17" fill="#333">MoE 层中的 All-to-All：token 去「拜访」被选中的专家</text>

  <!-- 设备列 -->
  <text x="105" y="56" text-anchor="middle" font-size="14" fill="#1f6f8b">设备（本地 token 组 + 1 个专家）</text>
  <rect x="30" y="70" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="97" text-anchor="middle" font-size="14" fill="#333">设备 D1</text>
  <rect x="30" y="130" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="157" text-anchor="middle" font-size="14" fill="#333">设备 D2</text>
  <rect x="30" y="190" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="217" text-anchor="middle" font-size="14" fill="#333">设备 D3</text>
  <rect x="30" y="250" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="277" text-anchor="middle" font-size="14" fill="#333">设备 D4</text>

  <!-- 专家列 -->
  <text x="675" y="56" text-anchor="middle" font-size="14" fill="#1f6f8b">专家（被切分到各设备）</text>
  <rect x="600" y="70" width="150" height="46" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="97" text-anchor="middle" font-size="14" fill="#c0392b">专家 E1（在 D1）</text>
  <rect x="600" y="130" width="150" height="46" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="157" text-anchor="middle" font-size="14" fill="#c0392b">专家 E2（在 D2）</text>
  <rect x="600" y="190" width="150" height="46" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="217" text-anchor="middle" font-size="14" fill="#c0392b">专家 E3（在 D3）</text>
  <rect x="600" y="250" width="150" height="46" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="277" text-anchor="middle" font-size="14" fill="#c0392b">专家 E4（在 D4）</text>

  <!-- 分发连线（Token 去程） -->
  <path d="M 180 93 C 350 30, 470 60, 595 93" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 180 93 C 350 140, 470 150, 595 153" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M 180 153 C 350 110, 470 120, 595 153" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 180 213 C 350 260, 470 260, 595 273" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 180 273 C 350 200, 470 120, 595 93" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- 回程标注 -->
  <path d="M 595 200 C 470 310, 350 320, 185 273" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="3 6" marker-end="url(#arr)"/>
  <text x="380" y="348" text-anchor="middle" font-size="14" fill="#666">计算完成后，结果再经一次 All-to-All 送回原设备</text>

  <!-- 说明 -->
  <text x="390" y="392" text-anchor="middle" font-size="14" fill="#333">实线=本组 token 的转发；虚线=跨设备转发；红色连线只是示意，真实通信是稠密的排列</text>
  <text x="390" y="416" text-anchor="middle" font-size="14" fill="#333">注意力等稠密层各设备保存副本（数据并行），只有专家被切分（专家并行）</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
