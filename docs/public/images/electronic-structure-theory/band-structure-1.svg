<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>半导体能带结构示意图</title>
<desc>横轴为布里渊区高对称路径 Gamma-L-Gamma-X，纵轴为能量；价带与导带之间形成带隙，价带顶与导带底标注带隙宽度。</desc>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="sans-serif" font-size="14" fill="#333333">
  <!-- axes -->
  <line x1="70" y1="350" x2="600" y2="350" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="350" x2="70" y2="40" stroke="#333333" stroke-width="2"/>
  <!-- axis labels -->
  <text x="300" y="395" text-anchor="middle">波矢 k（高对称路径）</text>
  <text x="30" y="200" text-anchor="middle" transform="rotate(-90 30 200)">能量 E</text>
  <text x="70" y="375" text-anchor="middle" font-weight="bold">Γ</text>
  <text x="230" y="375" text-anchor="middle" font-weight="bold">L</text>
  <text x="380" y="375" text-anchor="middle" font-weight="bold">Γ</text>
  <text x="520" y="375" text-anchor="middle" font-weight="bold">X</text>
  <line x1="230" y1="350" x2="230" y2="340" stroke="#333333" stroke-width="1"/>
  <line x1="380" y1="350" x2="380" y2="340" stroke="#333333" stroke-width="1"/>
  <line x1="520" y1="350" x2="520" y2="340" stroke="#333333" stroke-width="1"/>
  <!-- Fermi level -->
  <line x1="70" y1="255" x2="600" y2="255" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="585" y="248" fill="#c0392b" font-size="13">E_F</text>
  <!-- valence bands (below gap) -->
  <path d="M70 310 C 130 285, 190 275, 230 280 C 270 285, 320 300, 380 305 C 430 310, 470 300, 520 285" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M70 325 C 140 305, 200 300, 230 305 C 280 312, 330 320, 380 322 C 440 324, 480 318, 520 305" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- conduction bands (above gap) -->
  <path d="M70 200 C 130 175, 190 168, 230 170 C 280 172, 330 185, 380 195 C 440 205, 480 195, 520 165" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M70 225 C 140 210, 200 205, 230 208 C 280 212, 330 220, 380 226 C 440 232, 480 228, 520 210" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- band gap annotation -->
  <line x1="380" y1="195" x2="380" y2="305" stroke="#c0392b" stroke-width="1.5"/>
  <text x="392" y="250" fill="#c0392b" font-size="14">带隙 E_g</text>
  <!-- labels for band groups -->
  <text x="95" y="180" fill="#1f6f8b" font-size="13">导带（conduction band）</text>
  <text x="95" y="340" fill="#1f6f8b" font-size="13">价带（valence band）</text>
  <!-- arrow for VBM/CBM -->
  <text x="120" y="262" fill="#333333" font-size="13">费米能级处于带隙中</text>
</g>
</svg>
