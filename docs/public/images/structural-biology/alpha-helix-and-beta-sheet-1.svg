<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="sans-serif">
  <title>拉氏图（Ramachandran plot）：φ 与 ψ 的允许区域</title>
  <desc>以 φ 为横轴、ψ 为纵轴的散点图，标出 α 螺旋右手区、β 折叠区与左手 α 螺旋区的位置与二面角坐标。</desc>
  <rect width="520" height="500" fill="#faf9f5"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">拉氏图：φ 与 ψ 的允许区域</text>
  <text x="260" y="488" text-anchor="middle" font-size="13" fill="#333">φ（N–Cα 旋转角，度）</text>
  <text x="14" y="250" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 14 250)">ψ（Cα–C 旋转角，度）</text>

  <!-- 允许区域 -->
  <rect x="71" y="46" width="145" height="66" fill="#1f6f8b" opacity="0.45"/>
  <rect x="304" y="368" width="145" height="66" fill="#1f6f8b" opacity="0.45"/>
  <rect x="160" y="273" width="67" height="45" fill="#c0392b" opacity="0.50"/>
  <rect x="293" y="140" width="45" height="67" fill="#c0392b" opacity="0.35"/>

  <!-- 网格 -->
  <g stroke="#d8d2c5" stroke-width="1">
    <line x1="60" y1="40" x2="460" y2="40"/>
    <line x1="60" y1="240" x2="460" y2="240"/>
    <line x1="60" y1="440" x2="460" y2="440"/>
    <line x1="60" y1="40" x2="60" y2="440"/>
    <line x1="260" y1="40" x2="260" y2="440"/>
    <line x1="460" y1="40" x2="460" y2="440"/>
    <line x1="160" y1="40" x2="160" y2="440"/>
    <line x1="360" y1="40" x2="360" y2="440"/>
    <line x1="60" y1="140" x2="460" y2="140"/>
    <line x1="60" y1="340" x2="460" y2="340"/>
  </g>

  <!-- 主坐标轴 -->
  <g stroke="#333" stroke-width="2">
    <line x1="60" y1="240" x2="460" y2="240"/>
    <line x1="260" y1="40" x2="260" y2="440"/>
  </g>

  <!-- 刻度标签 -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="60" y="464">-180</text>
    <text x="160" y="464">-90</text>
    <text x="260" y="464">0</text>
    <text x="360" y="464">90</text>
    <text x="460" y="464">180</text>
    <text x="36" y="244">-180</text>
    <text x="36" y="144">-90</text>
    <text x="36" y="46">0</text>
    <text x="36" y="344">90</text>
    <text x="36" y="444">180</text>
  </g>

  <!-- 典型构象点 -->
  <circle cx="196.7" cy="292.2" r="5" fill="#c0392b"/>
  <circle cx="127.8" cy="114.4" r="5" fill="#1f6f8b"/>
  <circle cx="315" cy="173" r="4" fill="#c0392b" opacity="0.6"/>

  <!-- 标注 -->
  <g font-size="13" fill="#333">
    <text x="148" y="96" text-anchor="middle">β 折叠区</text>
    <text x="372" y="410" text-anchor="middle">β 折叠区</text>
    <text x="193" y="300" text-anchor="middle" fill="#c0392b">α 螺旋</text>
    <text x="193" y="314" text-anchor="middle" fill="#c0392b">(-57°, -47°)</text>
    <text x="118" y="132" text-anchor="start" fill="#1f6f8b">β (-119°, +113°)</text>
    <text x="300" y="128" text-anchor="start" fill="#c0392b">左手 α (+57°,+47°)</text>
  </g>
</svg>
