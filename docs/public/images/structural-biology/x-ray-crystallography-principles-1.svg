<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="sans-serif">
  <title>布拉格定律几何：晶面反射与额外路程 2d sinθ</title>
  <desc>入射 X 射线以掠射角 θ 打到相邻两晶面上，相邻晶面反射光束的额外路程为 2d sinθ，相长干涉条件为 2d sinθ = nλ。</desc>
  <rect width="520" height="340" fill="#faf9f5"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">布拉格定律：2d sinθ = nλ</text>

  <!-- 晶面 -->
  <line x1="40" y1="120" x2="480" y2="120" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="40" y1="230" x2="480" y2="230" stroke="#1f6f8b" stroke-width="3"/>
  <text x="444" y="113" font-size="13" fill="#1f6f8b">晶面 1</text>
  <text x="444" y="223" font-size="13" fill="#1f6f8b">晶面 2</text>

  <!-- 面间距虚线 -->
  <line x1="300" y1="120" x2="300" y2="230" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="306" y="180" font-size="13" fill="#333">d</text>

  <!-- 入射光1：经 A(300,130) 到 B(443,230) -->
  <line x1="180" y1="42" x2="300" y2="120" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="300" y1="120" x2="443" y2="230" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 入射光2：经 B'(443,130) -->
  <line x1="323" y1="52" x2="443" y2="120" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 反射光 -->
  <line x1="300" y1="120" x2="440" y2="40" stroke="#333" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="443" y1="120" x2="520" y2="68" stroke="#333" stroke-width="2.5" marker-end="url(#arrK)"/>

  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="arrK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#333"/></marker>
  </defs>

  <!-- 角度标注 -->
  <path d="M 270 120 A 30 30 0 0 0 277 94" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="230" y="96" font-size="13" fill="#333">θ</text>
  <path d="M 320 120 A 30 30 0 0 1 313 94" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="330" y="94" font-size="13" fill="#333">θ</text>

  <!-- 额外路程标注 -->
  <text x="262" y="280" font-size="14" fill="#c0392b" text-anchor="middle">额外路程 = 2d sinθ</text>
  <text x="262" y="300" font-size="13" fill="#555" text-anchor="middle">两束反射光相位相同 ⇒ 相长干涉（亮斑）</text>
</svg>
