<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>核技巧：从线性不可分到线性可分</title>
  <desc>左图为输入空间，两类样本交错，无法用直线分离；映射 φ 把样本送入高维特征空间，右图用平面即可分离两类。核技巧用内积核隐式完成该映射。</desc>
  <rect width="760" height="340" fill="#faf9f5"/>

  <!-- input space -->
  <ellipse cx="150" cy="175" rx="118" ry="95" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="150" y="35" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">输入空间（原始数据）</text>
  <text x="150" y="54" text-anchor="middle" font-size="14" fill="#333">两类交错，线性不可分</text>

  <!-- input points: red (southeast cluster) and teal (northwest cluster) interlacing -->
  <circle cx="120" cy="200" r="5" fill="#c0392b"/>
  <circle cx="150" cy="215" r="5" fill="#c0392b"/>
  <circle cx="182" cy="222" r="5" fill="#c0392b"/>
  <circle cx="168" cy="180" r="5" fill="#c0392b"/>
  <circle cx="102" cy="150" r="5" fill="#1f6f8b"/>
  <circle cx="132" cy="126" r="5" fill="#1f6f8b"/>
  <circle cx="176" cy="140" r="5" fill="#1f6f8b"/>
  <circle cx="196" cy="160" r="5" fill="#1f6f8b"/>
  <line x1="105" y1="160" x2="150" y2="170" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="168" y1="180" x2="180" y2="170" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- arrow -->
  <line x1="282" y1="170" x2="352" y2="170" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
  </defs>
  <text x="317" y="158" text-anchor="middle" font-size="15" fill="#333">φ（x）</text>

  <!-- feature space -->
  <ellipse cx="570" cy="175" rx="140" ry="100" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="570" y="35" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">特征空间（核隐式映射）</text>
  <text x="570" y="54" text-anchor="middle" font-size="14" fill="#333">平面即可分离两类</text>

  <!-- separating hyperplane -->
  <line x1="548" y1="95" x2="548" y2="255" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="548" y="285" text-anchor="middle" font-size="13" fill="#333">分离超平面</text>

  <!-- mapped points: red on left, teal on right -->
  <circle cx="480" cy="180" r="5" fill="#c0392b"/>
  <circle cx="502" cy="208" r="5" fill="#c0392b"/>
  <circle cx="495" cy="148" r="5" fill="#c0392b"/>
  <circle cx="462" cy="168" r="5" fill="#c0392b"/>
  <circle cx="618" cy="172" r="5" fill="#1f6f8b"/>
  <circle cx="605" cy="212" r="5" fill="#1f6f8b"/>
  <circle cx="628" cy="140" r="5" fill="#1f6f8b"/>
  <circle cx="596" cy="150" r="5" fill="#1f6f8b"/>

  <!-- labels for classes -->
  <text x="405" y="110" font-size="13" fill="#c0392b" font-weight="bold">类 1</text>
  <text x="620" y="105" font-size="13" fill="#1f6f8b" font-weight="bold">类 2</text>
</svg>
