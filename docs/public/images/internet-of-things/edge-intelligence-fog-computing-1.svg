<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <title>云—雾—边缘三层计算层级</title>
  <desc>从传感器/执行器到云数据中心的四层架构：设备层、边缘层、雾层、云层，以及层层上行的数据流与下行的控制流。</desc>
  <rect width="640" height="460" fill="#faf9f5"/>
  <!-- 云层 -->
  <rect x="180" y="20" width="280" height="80" rx="10" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="48" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold" text-anchor="middle">云层（Cloud）</text>
  <text x="320" y="72" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">大数据分析 · 长期存储 · 模型训练</text>
  <text x="320" y="92" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">时延：数十 ~ 数百 ms</text>
  <!-- 雾层 -->
  <rect x="160" y="130" width="320" height="80" rx="10" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="158" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold" text-anchor="middle">雾层（Fog）</text>
  <text x="320" y="182" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">区域网关 · 聚合计算 · 本地规则引擎</text>
  <text x="320" y="202" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">时延：10 ~ 50 ms</text>
  <!-- 边缘层 -->
  <rect x="140" y="240" width="360" height="80" rx="10" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="268" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold" text-anchor="middle">边缘层（Edge）</text>
  <text x="320" y="292" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">边缘网关 · 本地推理 · 实时响应（TinyML）</text>
  <text x="320" y="312" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">时延：1 ~ 10 ms</text>
  <!-- 设备层 -->
  <rect x="120" y="350" width="400" height="80" rx="10" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="320" y="378" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">设备层（Device / Perception）</text>
  <text x="320" y="402" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">传感器 · 执行器 · 低功耗 MCU</text>
  <text x="320" y="422" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">时延：微秒 ~ 毫秒级</text>
  <!-- 数据流箭头 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="320" y1="432" x2="320" y2="332"/>
    <line x1="320" y1="322" x2="320" y2="322"/>
    <line x1="320" y1="322" x2="320" y2="212"/>
    <line x1="320" y1="102" x2="320" y2="102"/>
  </g>
  <g fill="#c0392b" font-family="sans-serif" font-size="13">
    <text x="340" y="380" text-anchor="start">▲ 数据上行（原始字节逐层增值）</text>
  </g>
  <g stroke="#1f6f8b" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="360" y1="212" x2="360" y2="322"/>
    <line x1="360" y1="322" x2="360" y2="332"/>
  </g>
  <g fill="#1f6f8b" font-family="sans-serif" font-size="13">
    <text x="380" y="275" text-anchor="start">▼ 控制/决策下行</text>
  </g>
</svg>
