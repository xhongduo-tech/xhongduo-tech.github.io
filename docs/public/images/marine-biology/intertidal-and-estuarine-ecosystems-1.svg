<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">潮间带分带示意图</title>
<desc id="desc">海岸断面自高到低依次为陆地、溅浪带、中潮带、下潮带与潮下带，红虚线标出大潮高潮线与大潮低潮线，各带标注典型生物。</desc>
<rect width="640" height="480" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">潮间带分带与典型生物</text>

<rect x="90" y="60" width="470" height="55" fill="#f0ece3"/>
<rect x="90" y="115" width="470" height="75" fill="#e7dccb"/>
<rect x="90" y="190" width="470" height="100" fill="#cfe3e3"/>
<rect x="90" y="290" width="470" height="55" fill="#b7d5dd"/>
<rect x="90" y="345" width="470" height="85" fill="#1f6f8b" opacity="0.35"/>

<line x1="90" y1="115" x2="560" y2="115" stroke="#999" stroke-width="1"/>
<line x1="90" y1="290" x2="560" y2="290" stroke="#999" stroke-width="1"/>
<line x1="90" y1="190" x2="560" y2="190" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8,5"/>
<line x1="90" y1="345" x2="560" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8,5"/>
<rect x="90" y="60" width="470" height="370" fill="none" stroke="#666" stroke-width="1.5"/>

<text x="100" y="87" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">陆地</text>
<text x="100" y="152" font-family="sans-serif" font-size="13" fill="#333">溅浪带（仅风暴与大潮浸没）</text>
<text x="100" y="240" font-family="sans-serif" font-size="13" fill="#333">中潮带（每日潮涨潮落）</text>
<text x="100" y="317" font-family="sans-serif" font-size="13" fill="#333">下潮带（低潮时也常在水下）</text>
<text x="100" y="387" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">潮下带</text>

<text x="560" y="184" text-anchor="end" font-family="sans-serif" font-size="13" fill="#c0392b">大潮高潮线</text>
<text x="560" y="339" text-anchor="end" font-family="sans-serif" font-size="13" fill="#c0392b">大潮低潮线</text>
<text x="560" y="150" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">暴露时间↑</text>
<text x="560" y="300" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">浸没时间↑</text>

<circle cx="310" cy="135" r="7" fill="#6a8f4d"/>
<circle cx="326" cy="130" r="7" fill="#7ba15c"/>
<circle cx="318" cy="146" r="7" fill="#5d8042"/>
<text x="338" y="152" font-family="sans-serif" font-size="14" fill="#333">地衣</text>

<circle cx="310" cy="220" r="8" fill="#c9c2b8" stroke="#8a7f70" stroke-width="1"/>
<circle cx="326" cy="214" r="8" fill="#d4cdc3" stroke="#8a7f70" stroke-width="1"/>
<circle cx="318" cy="232" r="8" fill="#c2bbb0" stroke="#8a7f70" stroke-width="1"/>
<text x="338" y="236" font-family="sans-serif" font-size="14" fill="#333">藤壶</text>

<ellipse cx="428" cy="218" rx="7" ry="15" fill="#4a3b33" transform="rotate(-30 428 218)"/>
<ellipse cx="448" cy="222" rx="7" ry="15" fill="#5c4b40" transform="rotate(25 448 222)"/>
<text x="462" y="236" font-family="sans-serif" font-size="14" fill="#333">贻贝</text>

<path d="M 305 345 Q 303 325 305 305" stroke="#2f6b42" stroke-width="3" fill="none"/>
<path d="M 320 345 Q 323 320 320 300" stroke="#3d8555" stroke-width="3" fill="none"/>
<path d="M 335 345 Q 332 322 336 305" stroke="#2f6b42" stroke-width="3" fill="none"/>
<text x="322" y="341" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">海藻</text>

<circle cx="430" cy="322" r="10" fill="#b84a2f"/>
<line x1="430" y1="322" x2="420" y2="308" stroke="#b84a2f" stroke-width="2"/>
<line x1="430" y1="322" x2="442" y2="310" stroke="#b84a2f" stroke-width="2"/>
<line x1="430" y1="322" x2="418" y2="322" stroke="#b84a2f" stroke-width="2"/>
<line x1="430" y1="322" x2="444" y2="324" stroke="#b84a2f" stroke-width="2"/>
<line x1="430" y1="322" x2="426" y2="336" stroke="#b84a2f" stroke-width="2"/>
<text x="452" y="330" font-family="sans-serif" font-size="14" fill="#333">海胆</text>

<text x="320" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">红虚线：大潮高潮线 / 大潮低潮线；越向下，浸没时间越长</text>
</svg>
