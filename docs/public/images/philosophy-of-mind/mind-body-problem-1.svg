<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430" role="img" aria-labelledby="title desc">
<title>心身问题的立场地图</title>
<desc>二元论与一元论两大阵营的分类树：二元论下分实体二元论与属性二元论（交互主义、附象论、平行论），一元论下分物理主义（心脑同一论、功能主义、取消主义）与唯心主义。</desc>
<rect width="740" height="430" fill="#faf9f5"/>
<text x="370" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">心身问题的立场地图</text>
<rect x="300" y="52" width="140" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="370" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">心身问题</text>
<line x1="370" y1="92" x2="205" y2="122" stroke="#333" stroke-width="1.5"/>
<line x1="370" y1="92" x2="535" y2="122" stroke="#333" stroke-width="1.5"/>
<rect x="60" y="122" width="290" height="278" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="205" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">二元论：心与物两类</text>
<text x="78" y="178" font-family="sans-serif" font-size="13" fill="#333">· 实体二元论：心与身是两种实体</text>
<text x="78" y="198" font-family="sans-serif" font-size="13" fill="#333">　　（笛卡尔 · 交互论）</text>
<text x="78" y="228" font-family="sans-serif" font-size="13" fill="#333">· 属性二元论：一个基底、两类属性</text>
<text x="90" y="252" font-family="sans-serif" font-size="13" fill="#333">　· 交互主义：心身互相作用</text>
<text x="90" y="274" font-family="sans-serif" font-size="13" fill="#333">　· 附象论：心是副现象、无因果力</text>
<text x="90" y="296" font-family="sans-serif" font-size="13" fill="#333">　· 平行论：心身互不干涉（莱布尼茨）</text>
<text x="78" y="326" font-family="sans-serif" font-size="13" fill="#333">· 共同难题：心理因果如何可能？</text>
<text x="90" y="348" font-family="sans-serif" font-size="13" fill="#333">　（交互难题、排除论证）</text>
<text x="78" y="376" font-family="sans-serif" font-size="13" fill="#333">· 代表：笛卡尔、金在权、查默斯</text>
<rect x="390" y="122" width="290" height="278" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="535" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b">一元论：只有一类实体</text>
<text x="408" y="178" font-family="sans-serif" font-size="13" fill="#333">· 物理主义：一切皆物理</text>
<text x="420" y="202" font-family="sans-serif" font-size="13" fill="#333">　· 心脑同一论：心＝脑</text>
<text x="420" y="224" font-family="sans-serif" font-size="13" fill="#333">　· 功能主义：心＝功能角色</text>
<text x="420" y="246" font-family="sans-serif" font-size="13" fill="#333">　· 取消主义：常识心理论应被取代</text>
<text x="408" y="276" font-family="sans-serif" font-size="13" fill="#333">· 唯心主义：一切皆心（贝克莱）</text>
<text x="408" y="306" font-family="sans-serif" font-size="13" fill="#333">· 共同难题：意识与感受质如何安置？</text>
<text x="420" y="328" font-family="sans-serif" font-size="13" fill="#333">　（解释鸿沟、困难问题）</text>
<text x="408" y="358" font-family="sans-serif" font-size="13" fill="#333">· 主流立场：物理主义</text>
<text x="420" y="380" font-family="sans-serif" font-size="13" fill="#333">　（同一论、功能主义、取消主义）</text>
</svg>
