<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>昆虫口器类型：咀嚼式与刺吸式</title>
  <desc>左图为咀嚼式口器侧面示意图，右图为刺吸式口器口针束横切示意图</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <rect x="10" y="10" width="300" height="360" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="330" y="10" width="300" height="360" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="40" font-size="17" font-weight="bold" fill="#333">咀嚼式口器（侧面）</text>
  <text x="360" y="40" font-size="17" font-weight="bold" fill="#333">刺吸式口器（口针束横切）</text>

  <!-- 头壳 -->
  <rect x="90" y="70" width="170" height="120" rx="20" fill="#f0ede6" stroke="#333" stroke-width="2"/>
  <text x="120" y="100" font-size="13" fill="#333">头壳</text>
  <!-- 复眼 -->
  <circle cx="105" cy="150" r="26" fill="#1f6f8b" opacity="0.55" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="60" y="160" font-size="13" fill="#1f6f8b">复眼</text>
  <!-- 触角 -->
  <line x1="150" y1="70" x2="120" y2="36" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="36" x2="100" y2="52" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="52" x2="86" y2="34" stroke="#333" stroke-width="2"/>
  <text x="80" y="30" font-size="13" fill="#333">触角</text>

  <!-- 上唇 -->
  <rect x="140" y="190" width="70" height="16" rx="4" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="198" x2="100" y2="198" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="96" y="202" font-size="13" fill="#c0392b">上唇</text>
  <!-- 上颚 -->
  <polygon points="155,210 195,206 225,250 205,258" fill="#e8b0a0" stroke="#333" stroke-width="1.5"/>
  <text x="228" y="238" font-size="13" fill="#333">上颚</text>
  <!-- 下颚 -->
  <path d="M160 258 Q 140 280 128 296" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <circle cx="128" cy="296" r="4" fill="#1f6f8b"/>
  <text x="100" y="316" font-size="13" fill="#1f6f8b">下颚须</text>
  <!-- 下唇 -->
  <path d="M185 262 Q 210 290 218 310" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="218" cy="310" r="4" fill="#333"/>
  <text x="222" y="316" font-size="13" fill="#333">下唇须</text>
  <!-- 舌 -->
  <rect x="173" y="216" width="14" height="34" rx="5" fill="#b7b29f" stroke="#333" stroke-width="1"/>
  <text x="148" y="268" font-size="13" fill="#333">舌</text>

  <!-- 右侧：口针束横切 -->
  <!-- 下唇槽 -->
  <path d="M410 160 A 70 70 0 1 0 550 160" fill="none" stroke="#333" stroke-width="3"/>
  <text x="400" y="130" font-size="13" fill="#333">下唇槽（喙）</text>
  <!-- 上颚口针 -->
  <circle cx="465" cy="185" r="12" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <circle cx="495" cy="185" r="12" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <text x="452" y="175" font-size="13" fill="#c0392b">上颚口针</text>
  <!-- 下颚口针 -->
  <circle cx="465" cy="225" r="12" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <circle cx="495" cy="225" r="12" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <!-- 食道与唾道 -->
  <circle cx="480" cy="217" r="3.5" fill="#333"/>
  <circle cx="480" cy="233" r="3.5" fill="#333"/>
  <text x="510" y="230" font-size="13" fill="#1f6f8b">下颚口针</text>
  <text x="470" y="252" font-size="13" fill="#333">上/下：食道·唾道</text>
</svg>
