<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">土地金字塔（生物群落金字塔）</title>
  <desc id="desc">利奥波德的土地金字塔：底层为土壤，向上依次为植物、昆虫与鸟类、啮齿类与小食肉兽、顶级肉食者，人类位于塔顶附近；能量沿塔身自下而上流动并逐级递减。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">土地金字塔（生物群落金字塔）</text>

  <!-- 金字塔主体：底 y=330，尖 y=78，半宽 280 -->
  <!-- 带1 土壤：y 278-330 -->
  <polygon points="320,78 320,330 40,330" fill="#e8dcc8" stroke="#333" stroke-width="1.5"/>
  <!-- 带2 植物：y 226-278 -->
  <polygon points="320,78 320,278 77,278" fill="#cfe3cd" stroke="#333" stroke-width="1.5"/>
  <!-- 带3 昆虫与鸟类：y 174-226 -->
  <polygon points="320,78 320,226 133,226" fill="#d3e0ea" stroke="#333" stroke-width="1.5"/>
  <!-- 带4 啮齿类与小食肉兽：y 122-174 -->
  <polygon points="320,78 320,174 189,174" fill="#f2d8d3" stroke="#333" stroke-width="1.5"/>
  <!-- 带5 顶级肉食者：y 78-122 -->
  <polygon points="320,78 320,122 245,122" fill="#e6ccda" stroke="#333" stroke-width="1.5"/>

  <!-- 分层标签 -->
  <text x="320" y="312" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">土壤（能量与养分贮存库）</text>
  <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">植物（生产者）</text>
  <text x="320" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">昆虫与鸟类</text>
  <text x="320" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">啮齿类与小食肉兽</text>
  <text x="320" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">顶级肉食者</text>

  <!-- 人类标记：位于塔顶附近 -->
  <circle cx="446" cy="90" r="14" fill="#c0392b"/>
  <text x="446" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#faf9f5">人</text>
  <line x1="432" y1="90" x2="398" y2="100" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="462" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">人类（兼营者）</text>

  <!-- 能量箭头（左侧） -->
  <line x1="22" y1="320" x2="22" y2="86" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="22,80 17,92 27,92" fill="#1f6f8b"/>
  <text x="34" y="210" font-family="sans-serif" font-size="14" fill="#1f6f8b" transform="rotate(-90 34 210)">能量沿塔身向上流动，逐级递减</text>

  <!-- 底部说明 -->
  <text x="320" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">上尖下宽：每一级只能把少量能量传给上一级，故顶级肉食者天然最少</text>
</svg>
