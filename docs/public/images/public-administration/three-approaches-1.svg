<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="sans-serif">
  <title>公共行政的三大途径</title>
  <desc>三角形示意图：管理、政治、法律三条途径分别对应效率、回应性、正当程序三种价值，汇聚于中心的公共行政与公共利益。</desc>
  <rect width="800" height="620" fill="#faf9f5"/>
  <text x="400" y="46" text-anchor="middle" font-size="24" fill="#333" font-weight="bold">公共行政的三大途径</text>
  <text x="400" y="74" text-anchor="middle" font-size="14" fill="#666">三条思想传统，三种核心价值，汇聚成一个治理过程</text>

  <!-- triangle -->
  <polygon points="400,130 150,500 650,500" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6 5" opacity="0.5"/>

  <!-- managerial vertex (top) -->
  <circle cx="400" cy="130" r="52" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="400" y="126" text-anchor="middle" font-size="18" fill="#1f6f8b" font-weight="bold">管理途径</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#1f6f8b">效率 · 经济 · 效能</text>
  <text x="400" y="172" text-anchor="middle" font-size="12" fill="#555">科学管理 / NPM / 执行</text>

  <!-- political vertex (bottom-left) -->
  <circle cx="150" cy="500" r="52" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="2.5"/>
  <text x="150" y="496" text-anchor="middle" font-size="18" fill="#c0392b" font-weight="bold">政治途径</text>
  <text x="150" y="520" text-anchor="middle" font-size="13" fill="#c0392b">代表性 · 回应性 · 问责</text>
  <text x="150" y="542" text-anchor="middle" font-size="12" fill="#555">官僚政治 / 铁三角 / 多元</text>

  <!-- legal vertex (bottom-right) -->
  <circle cx="650" cy="500" r="52" fill="#8a6d3b" opacity="0.15" stroke="#8a6d3b" stroke-width="2.5"/>
  <text x="650" y="496" text-anchor="middle" font-size="18" fill="#8a6d3b" font-weight="bold">法律途径</text>
  <text x="650" y="520" text-anchor="middle" font-size="13" fill="#8a6d3b">正当程序 · 平等 · 权利</text>
  <text x="650" y="542" text-anchor="middle" font-size="12" fill="#555">行政法 / 宪法 / 司法审查</text>

  <!-- center -->
  <circle cx="400" cy="360" r="58" fill="#333" opacity="0.92"/>
  <text x="400" y="352" text-anchor="middle" font-size="16" fill="#faf9f5" font-weight="bold">公共行政</text>
  <text x="400" y="375" text-anchor="middle" font-size="13" fill="#faf9f5">公共利益</text>

  <!-- connectors -->
  <line x1="400" y1="182" x2="400" y2="302" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="193" y1="468" x2="352" y2="398" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="607" y1="468" x2="448" y2="398" stroke="#8a6d3b" stroke-width="2.5"/>

  <text x="400" y="592" text-anchor="middle" font-size="13" fill="#666">任一途径单极主导都会失衡：纯效率忽视权利，纯回应牺牲速度，纯程序拖垮行动</text>
</svg>
