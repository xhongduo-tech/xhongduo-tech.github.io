<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="title desc">
<title>外派适应的 U 形曲线</title>
<desc>横轴为外派时间，纵轴为适应程度：蜜月期适应度高，危机期降至低谷，恢复期回升，调整期平稳；归任时出现反向文化休克的低谷。</desc>
<rect x="0" y="0" width="820" height="500" fill="#faf9f5"/>
<text x="410" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">外派适应的 U 形曲线（含归任的反向休克）</text>

<!-- 坐标轴 -->
<line x1="120" y1="420" x2="760" y2="420" stroke="#333" stroke-width="2"/>
<line x1="120" y1="80" x2="120" y2="440" stroke="#333" stroke-width="2"/>
<text x="110" y="90" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">适应程度</text>
<text x="440" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">外派时间 →</text>
<text x="130" y="415" text-anchor="start" font-family="sans-serif" font-size="13" fill="#666">出发</text>
<text x="735" y="415" text-anchor="end" font-family="sans-serif" font-size="13" fill="#666">归任回国</text>

<!-- 曲线：蜜月→危机→恢复→调整（U形），归任后再次回落 -->
<path d="M 130 180 C 220 140, 250 330, 330 380 C 380 405, 480 250, 540 230 C 580 218, 620 260, 660 300 C 690 328, 700 350, 730 350" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

<!-- 阶段标注 -->
<g font-family="sans-serif" font-size="15" fill="#1f6f8b">
<text x="205" y="150" text-anchor="middle">蜜月期</text>
<text x="335" y="415" text-anchor="middle">危机期</text>
<text x="495" y="200" text-anchor="middle">恢复期</text>
<text x="580" y="180" text-anchor="middle">调整期</text>
<text x="700" y="390" text-anchor="middle" fill="#c0392b">反向文化休克</text>
</g>

<!-- 关键点 -->
<g fill="#333">
<circle cx="130" cy="180" r="6"/>
<circle cx="330" cy="380" r="6"/>
<circle cx="540" cy="230" r="6"/>
</g>
<text x="118" y="168" font-family="sans-serif" font-size="13" fill="#333">适应高峰</text>
<text x="300" y="395" font-family="sans-serif" font-size="13" fill="#333">低谷：挫折/迷失</text>
<text x="548" y="218" font-family="sans-serif" font-size="13" fill="#333">平稳融入</text>

<text x="410" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">外派失败常发生在危机期；归任后组织若不安排安置与重用，反向休克将引发高离职</text>
</svg>
