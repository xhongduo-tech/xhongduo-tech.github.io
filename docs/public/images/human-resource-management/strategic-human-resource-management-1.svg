<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="title desc">
<title>VRIO 判据流程图</title>
<desc>依次判断资源是否有价值、稀缺、难模仿、组织能否利用；任一条件不满足则落入劣势、对等或暂时优势，四项全满足得到可持续竞争优势。</desc>
<rect x="0" y="0" width="820" height="560" fill="#faf9f5"/>
<text x="410" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">VRIO：可持续竞争优势的四道判据</text>

<!-- 资源输入 -->
<rect x="280" y="70" width="260" height="48" rx="8" fill="#1f6f8b"/>
<text x="410" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">企业资源 / 能力（含人力资源）</text>

<!-- 四个判定框 -->
<g font-family="sans-serif" font-size="16">
<rect x="70" y="150" width="360" height="66" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="250" y="178" text-anchor="middle" fill="#333" font-weight="bold">V 有价值？</text>
<text x="250" y="200" text-anchor="middle" fill="#666" font-size="14">资源能抓住机会、化解威胁吗？</text>

<rect x="70" y="242" width="360" height="66" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="250" y="270" text-anchor="middle" fill="#333" font-weight="bold">R 稀缺？</text>
<text x="250" y="292" text-anchor="middle" fill="#666" font-size="14">只有少数企业能获得吗？</text>

<rect x="70" y="334" width="360" height="66" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="250" y="362" text-anchor="middle" fill="#333" font-weight="bold">I 难模仿？</text>
<text x="250" y="384" text-anchor="middle" fill="#666" font-size="14">隐性知识、路径依赖、社会复杂性</text>

<rect x="70" y="426" width="360" height="66" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="250" y="454" text-anchor="middle" fill="#333" font-weight="bold">O 组织能利用？</text>
<text x="250" y="476" text-anchor="middle" fill="#666" font-size="14">制度与结构能兑现资源潜力吗？</text>
</g>

<!-- 箭头 -->
<g stroke="#333" stroke-width="2" fill="none">
<line x1="410" y1="118" x2="250" y2="150"/>
<line x1="250" y1="216" x2="250" y2="242"/>
<line x1="250" y1="308" x2="250" y2="334"/>
<line x1="250" y1="400" x2="250" y2="426"/>
<line x1="430" y1="459" x2="610" y2="459"/>
<polygon points="614,459 602,454 602,464" fill="#333"/>
</g>
<text x="520" y="445" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">全“是”</text>

<!-- 结果框 -->
<rect x="480" y="428" width="270" height="62" rx="8" fill="#c0392b"/>
<text x="615" y="455" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff" font-weight="bold">可持续竞争优势</text>
<text x="615" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">V ∧ R ∧ I ∧ O 同时成立</text>

<!-- 否的走向 -->
<g stroke="#c0392b" stroke-width="2" fill="none">
<line x1="70" y1="183" x2="30" y2="183"/>
<line x1="30" y1="183" x2="30" y2="530"/>
<line x1="30" y1="530" x2="300" y2="530"/>
<polygon points="304,530 292,525 292,535" fill="#c0392b"/>
</g>
<text x="24" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b" transform="rotate(-90 24 360)">任一条件为“否”</text>

<!-- 劣势结果 -->
<rect x="310" y="505" width="500" height="40" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="560" y="531" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">V 否：竞争劣势 ｜ R 否：竞争对等 ｜ I/O 否：暂时优势</text>
</svg>
