<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="title desc">
<title>薪酬结构：工资等级区间与 compa-ratio</title>
<desc>三个工资等级各有一个薪酬区间，区间含最低值、中点与最高值；员工 A 的薪酬低于中点，compa-ratio 小于 1，员工 B 高于中点，compa-ratio 大于 1。</desc>
<rect x="0" y="0" width="820" height="500" fill="#faf9f5"/>
<text x="410" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">薪酬结构：等级—区间—compa-ratio</text>

<!-- 纵轴 -->
<line x1="160" y1="90" x2="160" y2="420" stroke="#333" stroke-width="2"/>
<line x1="160" y1="420" x2="760" y2="420" stroke="#333" stroke-width="2"/>
<text x="150" y="100" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">薪酬(高)</text>
<text x="150" y="415" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">薪酬(低)</text>

<!-- 三个等级的区间 -->
<g font-family="sans-serif" font-size="14" fill="#333">
<!-- Grade 1 -->
<line x1="210" y1="360" x2="250" y2="360" stroke="#1f6f8b" stroke-width="4"/>
<line x1="250" y1="360" x2="310" y2="285" stroke="#c0392b" stroke-width="4"/>
<line x1="310" y1="285" x2="350" y2="285" stroke="#1f6f8b" stroke-width="4"/>
<text x="280" y="330" text-anchor="middle">最低 最高</text>
<text x="280" y="255" text-anchor="middle" fill="#c0392b" font-weight="bold">中点 1</text>
<text x="210" y="430" text-anchor="middle" fill="#333">等级 1</text>

<!-- Grade 2 -->
<line x1="380" y1="310" x2="420" y2="310" stroke="#1f6f8b" stroke-width="4"/>
<line x1="420" y1="310" x2="480" y2="220" stroke="#c0392b" stroke-width="4"/>
<line x1="480" y1="220" x2="520" y2="220" stroke="#1f6f8b" stroke-width="4"/>
<text x="450" y="278" text-anchor="middle">最低 最高</text>
<text x="450" y="195" text-anchor="middle" fill="#c0392b" font-weight="bold">中点 2</text>
<text x="450" y="430" text-anchor="middle" fill="#333">等级 2</text>

<!-- Grade 3 -->
<line x1="550" y1="260" x2="590" y2="260" stroke="#1f6f8b" stroke-width="4"/>
<line x1="590" y1="260" x2="650" y2="160" stroke="#c0392b" stroke-width="4"/>
<line x1="650" y1="160" x2="690" y2="160" stroke="#1f6f8b" stroke-width="4"/>
<text x="620" y="225" text-anchor="middle">最低 最高</text>
<text x="620" y="135" text-anchor="middle" fill="#c0392b" font-weight="bold">中点 3</text>
<text x="620" y="430" text-anchor="middle" fill="#333">等级 3</text>
</g>

<!-- 员工 A 与 B -->
<circle cx="300" cy="315" r="7" fill="#1f6f8b"/>
<text x="300" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">员工 A：低于中点</text>
<circle cx="470" cy="250" r="7" fill="#1f6f8b"/>
<text x="470" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">员工 B：高于中点</text>

<!-- 公式 -->
<rect x="160" y="448" width="500" height="40" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="410" y="474" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">compa-ratio = 实际薪酬 ÷ 区间中点（&lt;1 偏下，&gt;1 偏上）</text>
</svg>
