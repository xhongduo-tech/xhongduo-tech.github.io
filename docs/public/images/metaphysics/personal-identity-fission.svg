<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>人格同一性的分裂问题</title>
  <desc>原我 P 在 t1 被分成左右两半分别移植，t2 产生两个后继者 L 与 R，两者都拥有 P 的全部记忆并自称是 P，导致同一性在传递性上陷入矛盾。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">分裂问题：两个后继者都有完整资格</text>

  <defs>
    <marker id="arrowF" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect x="240" y="60" width="160" height="72" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="320" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">原我 P（t₁）</text>
  <text x="320" y="110" text-anchor="middle" font-size="13" fill="#333">大脑两半各有完整心理</text>

  <line x1="280" y1="132" x2="165" y2="268" stroke="#666" stroke-width="2" marker-end="url(#arrowF)"/>
  <line x1="360" y1="132" x2="475" y2="268" stroke="#666" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="200" y="200" font-size="13" fill="#666">左脑移植</text>
  <text x="420" y="200" font-size="13" fill="#666">右脑移植</text>

  <rect x="70" y="270" width="190" height="84" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="165" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">后继者 L（t₂）</text>
  <text x="165" y="318" text-anchor="middle" font-size="13" fill="#333">拥有 P 的全部记忆与性格</text>
  <text x="165" y="340" text-anchor="middle" font-size="13" fill="#c0392b">声称「我是 P」</text>

  <rect x="380" y="270" width="190" height="84" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="475" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">后继者 R（t₂）</text>
  <text x="475" y="318" text-anchor="middle" font-size="13" fill="#333">拥有 P 的全部记忆与性格</text>
  <text x="475" y="340" text-anchor="middle" font-size="13" fill="#c0392b">声称「我是 P」</text>

  <text x="320" y="385" text-anchor="middle" font-size="15" fill="#333">L = P 且 R = P，由同一性传递性应有 L = R —— 但 L 与 R 分明是两个不同的人，矛盾</text>
</svg>
