<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>克里普克语义：必然与可能的可能世界图示</title>
  <desc>现实世界 w0 位于中央，周围四个可达的可能世界 w1 至 w4，其中 w1 与 w4 中命题 p 为真，w2 与 w3 中 p 为假，用以说明必然与可能的语义。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">克里普克语义：一个可能的模态模型</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect x="70" y="60" width="150" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="145" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">可能世界 w₁</text>
  <text x="145" y="105" text-anchor="middle" font-size="14" fill="#1f6f8b">p 为真</text>

  <rect x="420" y="60" width="150" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="495" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">可能世界 w₂</text>
  <text x="495" y="105" text-anchor="middle" font-size="14" fill="#c0392b">p 为假</text>

  <rect x="245" y="150" width="150" height="64" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="320" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">现实世界 w₀</text>
  <text x="320" y="200" text-anchor="middle" font-size="14" fill="#333">p 为真</text>

  <rect x="70" y="265" width="150" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="145" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">可能世界 w₃</text>
  <text x="145" y="310" text-anchor="middle" font-size="14" fill="#c0392b">p 为假</text>

  <rect x="420" y="265" width="150" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="495" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">可能世界 w₄</text>
  <text x="495" y="310" text-anchor="middle" font-size="14" fill="#1f6f8b">p 为真</text>

  <line x1="252" y1="152" x2="166" y2="116" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="388" y1="152" x2="474" y2="116" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="252" y1="212" x2="166" y2="264" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="388" y1="212" x2="474" y2="264" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="120" font-size="13" fill="#666">可达 R</text>

  <text x="60" y="352" font-size="15" fill="#c0392b">□p：对所有可达世界 w∈R(w₀)，都有 w ⊨ p —— 本例中不成立</text>
  <text x="60" y="378" font-size="15" fill="#1f6f8b">◇p：存在可达世界 w∈R(w₀)，使 w ⊨ p —— 本例中成立</text>
</svg>
