<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>闵可夫斯基时空中的光锥与因果结构</title>
  <desc>事件 O 位于时空中心，未来光锥与过去光锥以 45 度界限围成类时区域，两侧为类空区域；只有光锥内的区域与 O 有因果联系。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">闵可夫斯基时空：光锥与因果结构</text>

  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <line x1="320" y1="370" x2="320" y2="40" stroke="#666" stroke-width="2" marker-end="url(#arrowT)"/>
  <text x="338" y="60" font-size="14" fill="#666">时间 → 未来</text>
  <line x1="30" y1="200" x2="610" y2="200" stroke="#666" stroke-width="2"/>
  <text x="600" y="192" text-anchor="end" font-size="14" fill="#666">空间</text>

  <polygon points="320,200 80,40 560,40" fill="#dbe9f0" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="320,200 80,360 560,360" fill="#f6e3d8" stroke="#c0392b" stroke-width="2"/>

  <text x="320" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">未来光锥</text>
  <text x="320" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">过去光锥</text>
  <text x="340" y="228" font-size="15" font-weight="bold" fill="#333">事件 O</text>

  <text x="118" y="188" text-anchor="middle" font-size="14" fill="#999">类空</text>
  <text x="118" y="206" text-anchor="middle" font-size="13" fill="#999">无因果</text>
  <text x="502" y="188" text-anchor="middle" font-size="14" fill="#999">类空</text>
  <text x="502" y="206" text-anchor="middle" font-size="13" fill="#999">无因果</text>

  <text x="452" y="330" font-size="13" fill="#1f6f8b">类时：有确定的先后与</text>
  <text x="452" y="350" font-size="13" fill="#1f6f8b">可能的因果联系</text>
</svg>
