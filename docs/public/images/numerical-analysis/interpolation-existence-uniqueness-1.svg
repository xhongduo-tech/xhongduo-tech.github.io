<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="title desc">
  <title id="title">插值多项式穿过全部数据点</title>
  <desc id="desc">一条红色多项式曲线穿过平面上五个青色插值节点，横轴为 x，纵轴为 y，曲线在 x=0.5 处略低于横轴。</desc>
  <rect x="0" y="0" width="560" height="440" fill="#faf9f5"/>
  <text x="280" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">插值多项式穿过全部数据点</text>
  <text x="280" y="48" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">次数 ≤ n 的多项式 P(x) 满足 P(xᵢ) = yᵢ</text>

  <!-- axes -->
  <line x1="80" y1="326.7" x2="506" y2="326.7" stroke="#333" stroke-width="1.6"/>
  <polygon points="506,326.7 496,322.2 496,331.2" fill="#333"/>
  <line x1="80" y1="60" x2="80" y2="384" stroke="#333" stroke-width="1.6"/>
  <polygon points="80,60 75.5,70 84.5,70" fill="#333"/>
  <text x="516" y="331" font-family="sans-serif" font-size="15" fill="#333">x</text>
  <text x="66" y="56" font-family="sans-serif" font-size="15" fill="#333">y</text>

  <!-- x ticks -->
  <line x1="200" y1="326.7" x2="200" y2="321.7" stroke="#333" stroke-width="1"/>
  <text x="200" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1</text>
  <line x1="320" y1="326.7" x2="320" y2="321.7" stroke="#333" stroke-width="1"/>
  <text x="320" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2</text>
  <line x1="440" y1="326.7" x2="440" y2="321.7" stroke="#333" stroke-width="1"/>
  <text x="440" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">3</text>

  <!-- y ticks -->
  <line x1="80" y1="326.7" x2="85" y2="326.7" stroke="#333" stroke-width="1"/>
  <text x="72" y="331" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">0</text>
  <line x1="80" y1="220" x2="85" y2="220" stroke="#333" stroke-width="1"/>
  <text x="72" y="224" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">2</text>
  <line x1="80" y1="113.3" x2="85" y2="113.3" stroke="#333" stroke-width="1"/>
  <text x="72" y="117" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">4</text>

  <!-- interpolation polynomial: y = (x-2)^3 + 3, sampled -->
  <polyline fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="140,346.7 170,270.8 200,220 230,189.2 260,173.3 290,167.5 320,166.7 350,165.8 380,160 410,144.2 440,113.3 470,62.5"/>

  <!-- data nodes -->
  <circle cx="200" cy="220" r="6" fill="#1f6f8b"/>
  <circle cx="260" cy="173.3" r="6" fill="#1f6f8b"/>
  <circle cx="320" cy="166.7" r="6" fill="#1f6f8b"/>
  <circle cx="380" cy="160" r="6" fill="#1f6f8b"/>
  <circle cx="440" cy="113.3" r="6" fill="#1f6f8b"/>

  <!-- legend -->
  <line x1="120" y1="398" x2="150" y2="398" stroke="#c0392b" stroke-width="3"/>
  <text x="158" y="402" font-family="sans-serif" font-size="14" fill="#333">插值多项式曲线 P(x)</text>
  <circle cx="128" cy="420" r="5" fill="#1f6f8b"/>
  <text x="142" y="424" font-family="sans-serif" font-size="14" fill="#333">插值节点 (xᵢ, yᵢ)</text>
</svg>
