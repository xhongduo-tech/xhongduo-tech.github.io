<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="sans-serif">
  <title>ReAct 循环：思考 → 行动 → 观察</title>
  <desc>ReAct 提示让语言模型在思考、行动、观察三者之间循环迭代，直至给出最终答案。</desc>
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">循环直至给出最终答案</text>

  <rect x="350" y="40" width="200" height="85" rx="12" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" font-size="17" fill="#1f6f8b" font-weight="bold">思考 Thought</text>
  <text x="450" y="95" text-anchor="middle" font-size="14" fill="#333">推理下一步 / 制定计划</text>

  <rect x="60" y="235" width="220" height="90" rx="12" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="268" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">行动 Act</text>
  <text x="170" y="293" text-anchor="middle" font-size="14" fill="#333">调用工具：搜索 / 计算 / 查库</text>

  <rect x="620" y="235" width="220" height="90" rx="12" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="730" y="268" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">观察 Observation</text>
  <text x="730" y="293" text-anchor="middle" font-size="14" fill="#333">读取工具返回的结果</text>

  <path d="M 430 128 C 350 175 250 205 185 235" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 285 280 L 615 280" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 655 232 C 690 185 570 145 505 128" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="185" text-anchor="middle" font-size="14" fill="#666">每一步行动都来自思考，每一次观察都回馈思考</text>
  <text x="450" y="330" text-anchor="middle" font-size="14" fill="#666">外部环境（如维基百科搜索 API）为推理提供真实反馈，减少幻觉</text>
</svg>
