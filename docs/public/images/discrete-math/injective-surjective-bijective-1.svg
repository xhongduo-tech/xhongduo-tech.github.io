<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="sans-serif">
  <title>单射、满射与双射</title>
  <desc>三个面板分别展示单射（不同的输入给出不同的输出，允许空位）、满射（陪域中每个元素都被映射到，允许碰撞）、双射（既无空位也无碰撞，一一对应）。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#faf9f5"/>

  <!-- 面板分隔线 -->
  <line x1="325" y1="90" x2="325" y2="400" stroke="#ddd" stroke-width="1"/>
  <line x1="655" y1="90" x2="655" y2="400" stroke="#ddd" stroke-width="1"/>

  <!-- 面板标题 -->
  <text x="195" y="70" text-anchor="middle" font-size="18" fill="#1f6f8b">单射（一对一）</text>
  <text x="525" y="70" text-anchor="middle" font-size="18" fill="#1f6f8b">满射（映上）</text>
  <text x="855" y="70" text-anchor="middle" font-size="18" fill="#1f6f8b">双射（一一对应）</text>

  <!-- ============ 面板 1：单射，|A|=3，|B|=4 ============ -->
  <ellipse cx="110" cy="230" rx="50" ry="115" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="280" cy="225" rx="50" ry="135" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="110" y="95" text-anchor="middle" font-size="14" fill="#333">A</text>
  <text x="280" y="85" text-anchor="middle" font-size="14" fill="#333">B</text>
  <!-- 定义域元素 -->
  <circle cx="110" cy="150" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="86" y="154" text-anchor="end" font-size="14" fill="#333">a</text>
  <circle cx="110" cy="230" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="86" y="234" text-anchor="end" font-size="14" fill="#333">b</text>
  <circle cx="110" cy="310" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="86" y="314" text-anchor="end" font-size="14" fill="#333">c</text>
  <!-- 陪域元素 -->
  <circle cx="280" cy="120" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="296" y="124" font-size="14" fill="#333">1</text>
  <circle cx="280" cy="190" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="296" y="194" font-size="14" fill="#333">2</text>
  <circle cx="280" cy="260" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="296" y="264" font-size="14" fill="#333">3</text>
  <!-- 未用到的空位 -->
  <circle cx="280" cy="330" r="10" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="296" y="334" font-size="14" fill="#c0392b">4</text>
  <text x="280" y="368" text-anchor="middle" font-size="13" fill="#c0392b">空位</text>
  <!-- 箭头 a→1, b→2, c→3 -->
  <line x1="119.9" y1="148.3" x2="268.2" y2="122.1" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="119.7" y1="227.7" x2="268.3" y2="192.7" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="119.6" y1="307.2" x2="268.5" y2="263.4" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="432" text-anchor="middle" font-size="14" fill="#333">允许空位：4 未被踩到</text>

  <!-- ============ 面板 2：满射，|A|=4，|B|=3 ============ -->
  <ellipse cx="440" cy="235" rx="50" ry="125" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="610" cy="250" rx="50" ry="100" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="440" y="100" text-anchor="middle" font-size="14" fill="#333">A</text>
  <text x="610" y="140" text-anchor="middle" font-size="14" fill="#333">B</text>
  <!-- 定义域元素 -->
  <circle cx="440" cy="130" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="416" y="134" text-anchor="end" font-size="14" fill="#333">a</text>
  <circle cx="440" cy="200" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="416" y="204" text-anchor="end" font-size="14" fill="#333">b</text>
  <circle cx="440" cy="270" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="416" y="274" text-anchor="end" font-size="14" fill="#333">c</text>
  <circle cx="440" cy="340" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="416" y="344" text-anchor="end" font-size="14" fill="#333">d</text>
  <!-- 陪域元素 -->
  <circle cx="610" cy="170" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="626" y="174" font-size="14" fill="#333">1</text>
  <circle cx="610" cy="250" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="626" y="254" font-size="14" fill="#333">2</text>
  <circle cx="610" cy="330" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="626" y="334" font-size="14" fill="#333">3</text>
  <text x="610" y="148" text-anchor="middle" font-size="13" fill="#c0392b">碰撞</text>
  <!-- 箭头：a→1, b→1(碰撞), c→2, d→3 -->
  <line x1="449.7" y1="134.3" x2="598.3" y2="175.3" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="449.9" y1="198.3" x2="598.2" y2="172.1" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="449.9" y1="268.8" x2="598.1" y2="251.4" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450.0" y1="339.4" x2="598.0" y2="330.7" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="432" text-anchor="middle" font-size="14" fill="#333">允许碰撞：a、b 同到 1</text>

  <!-- ============ 面板 3：双射，|A|=3，|B|=3 ============ -->
  <ellipse cx="770" cy="250" rx="50" ry="100" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="940" cy="250" rx="50" ry="100" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="770" y="140" text-anchor="middle" font-size="14" fill="#333">A</text>
  <text x="940" y="140" text-anchor="middle" font-size="14" fill="#333">B</text>
  <!-- 定义域元素 -->
  <circle cx="770" cy="170" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="746" y="174" text-anchor="end" font-size="14" fill="#333">a</text>
  <circle cx="770" cy="250" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="746" y="254" text-anchor="end" font-size="14" fill="#333">b</text>
  <circle cx="770" cy="330" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="746" y="334" text-anchor="end" font-size="14" fill="#333">c</text>
  <!-- 陪域元素 -->
  <circle cx="940" cy="170" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="956" y="174" font-size="14" fill="#333">1</text>
  <circle cx="940" cy="250" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="956" y="254" font-size="14" fill="#333">2</text>
  <circle cx="940" cy="330" r="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="956" y="334" font-size="14" fill="#333">3</text>
  <!-- 箭头：a→1, b→2, c→3 -->
  <line x1="782" y1="170" x2="926" y2="170" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="250" x2="926" y2="250" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="330" x2="926" y2="330" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855" y="432" text-anchor="middle" font-size="14" fill="#333">无空位、无碰撞</text>
</svg>
