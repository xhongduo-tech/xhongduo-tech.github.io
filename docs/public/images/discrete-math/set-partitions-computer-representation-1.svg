<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <title>集合 S 的一个划分</title>
  <desc>把集合 S={1,2,3,4,5,6,7} 划分为三个互不相交的非空块 A1={1,2}、A2={3,4,5}、A3={6,7}，三块的并集恰好等于 S。</desc>
  <rect x="0" y="0" width="700" height="400" fill="#faf9f5"/>
  <!-- 集合 S 的外框 -->
  <rect x="60" y="110" width="580" height="210" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="350" y="140" text-anchor="middle" font-size="17" fill="#333">集合 S = {1, 2, 3, 4, 5, 6, 7}</text>
  <!-- 块 A1 -->
  <rect x="85" y="165" width="160" height="135" rx="10" fill="#dcebf0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="200" text-anchor="middle" font-size="15" fill="#1f6f8b">块 A₁</text>
  <text x="165" y="228" text-anchor="middle" font-size="14" fill="#333">{1, 2}</text>
  <!-- 块 A2 -->
  <rect x="270" y="165" width="160" height="135" rx="10" fill="#f6e3e0" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="15" fill="#c0392b">块 A₂</text>
  <text x="350" y="228" text-anchor="middle" font-size="14" fill="#333">{3, 4, 5}</text>
  <!-- 块 A3 -->
  <rect x="455" y="165" width="160" height="135" rx="10" fill="#dcebf0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="535" y="200" text-anchor="middle" font-size="15" fill="#1f6f8b">块 A₃</text>
  <text x="535" y="228" text-anchor="middle" font-size="14" fill="#333">{6, 7}</text>
  <!-- 底部说明 -->
  <text x="350" y="358" text-anchor="middle" font-size="14" fill="#333">三块两两不相交、每块非空，且 A₁ ∪ A₂ ∪ A₃ = S</text>
</svg>
