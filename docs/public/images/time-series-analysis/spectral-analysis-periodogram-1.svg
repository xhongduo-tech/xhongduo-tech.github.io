<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>时域信号与谱密度的对应：周期分量在频域中形成尖峰</title>
  <desc>上半部分展示一条含周期分量与噪声的时域曲线；下半部分展示其平滑谱估计，在周期对应频率处出现显著尖峰。</desc>
  <rect width="900" height="420" fill="#faf9f5"/>
  <!-- 时域面板 -->
  <text x="60" y="40" font-size="16" fill="#333">时域：x(t)（含周期分量 + 噪声）</text>
  <line x1="60" y1="170" x2="860" y2="170" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="200" font-size="13" fill="#333">时间 t →</text>
  <polyline fill="none" stroke="#1f6f8b" stroke-width="2.5"
    points="60,110 90,96 120,120 150,150 180,162 210,150 240,122 270,100 300,112 330,140 360,158 390,158 420,134 450,106 480,98 510,114 540,144 570,160 600,156 630,132 660,104 690,92 720,108 750,140 780,158 810,156 840,130 860,108"/>
  <line x1="60" y1="90" x2="860" y2="90" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="160" x2="860" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- 分隔 -->
  <line x1="60" y1="220" x2="860" y2="220" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="60" y="252" font-size="16" fill="#333">频域：平滑谱估计 f(ω)（能量按频率摊派）</text>
  <line x1="60" y1="380" x2="860" y2="380" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="406" font-size="13" fill="#333">频率 ω →（0 在左，π 在右）</text>
  <!-- 谱曲线：低频平台 + 周期尖峰 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="60,370 140,368 220,360 300,352 380,346 420,344 450,342 470,340 500,338 540,342 580,346 640,352 700,358 760,362 820,366 860,368"/>
  <!-- 尖峰 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="3"
    points="380,346 400,230 420,344"/>
  <text x="390" y="220" font-size="15" fill="#c0392b" text-anchor="middle">周期尖峰（ω₀）</text>
  <text x="700" y="352" font-size="13" fill="#333">白噪声底座（平台）</text>
  <text x="150" y="400" font-size="13" fill="#1f6f8b">方差 = f(ω) 曲线下面积</text>
</svg>
