<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>轮式移动机器人的独轮车模型</title>
  <desc>世界坐标系 {x, y}，机器人质心在原点，航向角 θ 从 x 轴量起。机器人以线速度 v 沿航向移动，以角速度 ω 转动，满足运动学方程 ẋ = v cosθ、ẏ = v sinθ、θ̇ = ω，并受纯滚动约束 -ẋ sinθ + ẏ cosθ = 0。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#333"/></marker>
    <marker id="b" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c0392b"/></marker>
  </defs>

  <line x1="60" y1="60" x2="290" y2="60" stroke="#c0392b" stroke-width="2" marker-end="url(#b)"/>
  <text x="282" y="52" font-size="13" fill="#c0392b" text-anchor="middle">x</text>
  <line x1="60" y1="60" x2="60" y2="310" stroke="#1f6f8b" stroke-width="2"/>
  <text x="52" y="318" font-size="13" fill="#1f6f8b" text-anchor="middle">y</text>

  <line x1="320" y1="240" x2="450" y2="240" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="320" cy="240" r="42" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="320" y1="240" x2="390" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#b)"/>
  <text x="400" y="160" font-size="13" fill="#c0392b">航向 v</text>

  <path d="M 356 258 A 40 40 0 0 1 366 244" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="372" y="268" font-size="13" fill="#333">θ</text>

  <rect x="280" y="286" width="80" height="14" rx="5" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="320" y="312" font-size="13" fill="#1f6f8b" text-anchor="middle">左轮</text>
  <rect x="280" y="180" width="80" height="14" rx="5" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="320" y="172" font-size="13" fill="#1f6f8b" text-anchor="middle">右轮</text>

  <path d="M 320 200 A 40 40 0 1 1 342 205" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="352" y="196" font-size="13" fill="#c0392b">ω</text>

  <text x="30" y="344" font-size="13" fill="#333">ẋ = v cosθ　　ẏ = v sinθ　　θ̇ = ω　　（约束：−ẋ sinθ + ẏ cosθ = 0）</text>
</svg>
