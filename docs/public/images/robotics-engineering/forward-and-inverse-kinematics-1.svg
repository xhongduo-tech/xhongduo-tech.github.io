<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>2R 平面臂的正向运动学：末端位姿由关节角 θ1、θ2 与杆长 l1、l2 唯一决定</title>
  <desc>基座固定坐标系 {0}，连杆 1 绕基座旋转 θ1 并在关节 1 建立坐标系 {1}，连杆 2 相对连杆 1 旋转 θ2，末端建立坐标系 {2}。末端位置由 x = l1 cosθ1 + l2 cos(θ1+θ2)、y = l1 sinθ1 + l2 sin(θ1+θ2) 给出。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#333"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c0392b"/></marker>
    <marker id="arrC" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1f6f8b"/></marker>
  </defs>
  <text x="320" y="30" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">2R 平面臂的正向运动学</text>

  <circle cx="120" cy="300" r="5" fill="#333"/>
  <text x="108" y="322" font-size="13" fill="#333" text-anchor="middle">基座 {0}</text>
  <line x1="120" y1="300" x2="300" y2="300" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="292" y="318" font-size="13" fill="#c0392b" text-anchor="middle">x₀</text>
  <line x1="120" y1="300" x2="120" y2="100" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="108" y="108" font-size="13" fill="#1f6f8b" text-anchor="middle">y₀</text>

  <path d="M 132 300 A 40 40 0 0 1 152 270" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="168" y="292" font-size="13" fill="#333">θ₁</text>

  <line x1="120" y1="300" x2="223" y2="177" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <circle cx="223" cy="177" r="5" fill="#333"/>
  <text x="150" y="222" font-size="13" fill="#333">l₁</text>
  <line x1="243" y1="185" x2="285" y2="158" stroke="#333" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="205" y="160" font-size="13" fill="#333">{1}</text>
  <line x1="223" y1="177" x2="287" y2="133" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="223" y1="177" x2="253" y2="122" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrC)"/>

  <path d="M 242 190 A 28 28 0 0 1 262 168" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="270" y="188" font-size="13" fill="#333">θ₂</text>

  <line x1="223" y1="177" x2="223" y2="47" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <circle cx="223" cy="47" r="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="238" y="70" font-size="13" fill="#333">末端 {2}</text>
  <text x="238" y="118" font-size="13" fill="#333">l₂</text>
  <line x1="223" y1="47" x2="283" y2="7" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="223" y1="47" x2="233" y2="1" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrC)"/>

  <text x="30" y="350" font-size="13" fill="#333">x = l₁ cosθ₁ + l₂ cos(θ₁+θ₂)　　　y = l₁ sinθ₁ + l₂ sin(θ₁+θ₂)</text>
</svg>
