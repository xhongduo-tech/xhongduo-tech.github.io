<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <title>地球磁偶极场示意图</title>
  <desc>地球内部条形磁铁略倾斜约11度，磁感线从地理南极附近的磁北极（N）发出，弯向外太空后进入地理北极附近的磁南极（S），磁轴与自转轴交角示意。</desc>
  <rect width="640" height="440" fill="#faf9f5"/>
  <circle cx="320" cy="220" r="150" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="320" y1="45" x2="320" y2="395" stroke="#333333" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="320" y="40" text-anchor="middle" font-size="14" fill="#333333">自转轴</text>
  <g transform="rotate(-11 320 220)">
    <rect x="305" y="168" width="30" height="52" fill="#1f6f8b" stroke="#333333" stroke-width="1.5"/>
    <rect x="305" y="220" width="30" height="52" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
    <path d="M 320 268 C 175 318 122 240 192 195 C 244 161 302 190 320 176" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <path d="M 320 268 C 465 318 518 240 448 195 C 396 161 338 190 320 176" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <path d="M 320 256 C 240 292 214 250 258 218 C 290 194 312 196 320 184" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
    <path d="M 320 256 C 400 292 426 250 382 218 C 350 194 328 196 320 184" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
    <polygon points="183,206 196,200 192,214" fill="#1f6f8b"/>
    <polygon points="457,206 444,200 448,214" fill="#1f6f8b"/>
    <text x="297" y="190" text-anchor="middle" font-size="14" fill="#ffffff">S</text>
    <text x="297" y="258" text-anchor="middle" font-size="14" fill="#ffffff">N</text>
  </g>
  <path d="M 326 198 A 30 30 0 0 1 340 220" fill="none" stroke="#333333" stroke-width="1.2"/>
  <polygon points="342,222 331,224 338,231" fill="#333333"/>
  <text x="350" y="222" font-size="14" fill="#333333">磁轴与自转轴约成 11°</text>
  <text x="155" y="100" font-size="14" fill="#1f6f8b">磁南极（S）</text>
  <text x="120" y="118" font-size="14" fill="#333333">≈ 地理北极方向</text>
  <text x="425" y="360" font-size="14" fill="#c0392b">磁北极（N）</text>
  <text x="440" y="378" font-size="14" fill="#333333">≈ 地理南极方向</text>
  <line x1="168" y1="108" x2="286" y2="160" stroke="#888888" stroke-width="1"/>
  <line x1="452" y1="352" x2="338" y2="284" stroke="#888888" stroke-width="1"/>
  <text x="470" y="245" font-size="13" fill="#1f6f8b">磁感线由磁北极发出、</text>
  <text x="470" y="263" font-size="13" fill="#1f6f8b">进入磁南极</text>
  <text x="120" y="200" font-size="12" fill="#777777">磁感线弯曲：赤道处水平、</text>
  <text x="120" y="216" font-size="12" fill="#777777">高纬处垂直（磁倾角）</text>
</svg>
