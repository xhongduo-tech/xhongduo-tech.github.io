<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>板块构造三类边界剖面示意图</title>
  <desc>左侧离散边界：洋中脊处岩浆上涌、两侧板块分离；右侧汇聚边界：海洋板块俯冲到大陆板块之下，形成海沟与火山弧；软流圈以对流缓慢流动，岩石圈为刚性板块。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <rect x="0" y="0" width="640" height="150" fill="#dcecf5"/>
  <text x="20" y="30" font-size="14" fill="#1f6f8b">海水</text>
  <rect x="0" y="200" width="640" height="220" fill="#f0e6d2"/>
  <text x="20" y="380" font-size="15" fill="#333333">软流圈（可缓慢流动）</text>
  <rect x="0" y="148" width="175" height="52" fill="#d9c9a3" stroke="#333333" stroke-width="1.5"/>
  <text x="20" y="175" font-size="14" fill="#333333">大陆地壳</text>
  <rect x="528" y="128" width="112" height="72" fill="#d9c9a3" stroke="#333333" stroke-width="1.5"/>
  <text x="542" y="152" font-size="14" fill="#333333">大陆地壳</text>
  <rect x="175" y="178" width="353" height="22" fill="#cdc4b8" stroke="#333333" stroke-width="1.2"/>
  <text x="196" y="195" font-size="13" fill="#333333">海洋地壳</text>
  <polygon points="300,178 360,178 330,320" fill="#c0392b" opacity="0.85"/>
  <path d="M 330 200 L 330 320" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="338" y="300" font-size="13" fill="#c0392b">岩浆上涌</text>
  <text x="300" y="208" font-size="13" fill="#ffffff">洋中脊</text>
  <path d="M 540 178 C 500 230 470 290 430 330" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="438" y="320" font-size="13" fill="#333333">俯冲板片</text>
  <text x="540" y="172" font-size="14" fill="#1f6f8b">海沟</text>
  <polygon points="550,128 566,128 558,104" fill="#c0392b" stroke="#333333" stroke-width="1"/>
  <text x="566" y="118" font-size="13" fill="#c0392b">火山弧</text>
  <text x="250" y="172" font-size="20" fill="#333333">←</text>
  <text x="415" y="172" font-size="20" fill="#333333">→</text>
  <path d="M 120 300 C 140 260 180 260 200 300" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="200,296 192,300 198,305" fill="#1f6f8b"/>
  <path d="M 200 340 C 220 300 260 300 280 340" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="280,336 272,340 278,345" fill="#1f6f8b"/>
  <text x="120" y="250" font-size="13" fill="#1f6f8b">地幔对流驱动板块运动</text>
  <rect x="0" y="150" width="640" height="50" fill="none" stroke="#333333" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="20" y="143" font-size="14" fill="#333333">岩石圈（刚性板块：地壳 + 岩石圈地幔）</text>
  <text x="20" y="404" font-size="13" fill="#777777">离散边界：板块分离、新洋壳生成</text>
  <text x="330" y="404" font-size="13" fill="#777777">汇聚边界：板块碰撞、俯冲与火山</text>
</svg>
