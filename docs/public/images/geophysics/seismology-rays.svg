<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>地震波在地球内部传播路径示意图</title>
  <desc>地球剖面分为地壳、地幔、液态外核与固态内核。震源在地表顶部，P 波在地幔中向下折射并弯曲回升，掠过核幔边界的 P 波在地表形成 P 波阴影带；PKP 波穿过内核；S 波不能穿过液态外核，止步于核幔边界。</desc>
  <rect width="640" height="480" fill="#faf9f5"/>
  <circle cx="320" cy="250" r="200" fill="#d9c9a3" stroke="#333333" stroke-width="2"/>
  <circle cx="320" cy="250" r="195" fill="#efe6d8"/>
  <circle cx="320" cy="250" r="112" fill="#f0c674"/>
  <circle cx="320" cy="250" r="38" fill="#c0392b"/>
  <text x="260" y="66" font-size="14" fill="#333333">地壳（约 5–70 km）</text>
  <text x="150" y="170" font-size="15" fill="#333333">地幔</text>
  <text x="208" y="252" font-size="14" fill="#333333">外核（液态）</text>
  <text x="288" y="255" font-size="14" fill="#ffffff">内核</text>
  <text x="288" y="271" font-size="13" fill="#ffffff">（固态）</text>
  <polygon points="320,24 312,44 328,44" fill="#c0392b"/>
  <text x="330" y="40" font-size="14" fill="#333333">震源</text>
  <path d="M 320 44 C 392 66 440 110 462 166 C 474 198 478 232 468 262" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="466,270 460,252 474,258" fill="#c0392b"/>
  <text x="480" y="150" font-size="13" fill="#c0392b">P 波（地幔内向下弯曲回升）</text>
  <path d="M 320 44 C 420 70 500 150 488 205 C 478 255 435 320 400 342" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="9 6"/>
  <polygon points="393,348 409,337 410,351" fill="#c0392b"/>
  <text x="430" y="330" font-size="13" fill="#c0392b">PKP：穿过内核</text>
  <path d="M 320 44 C 382 80 412 130 416 182" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="417" cy="183" r="4" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="426" y="176" font-size="13" fill="#1f6f8b">S 波：被外核阻断</text>
  <path d="M 515 292 A 200 200 0 0 0 436 412" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 515 287 A 200 200 0 0 0 440 407 L 436 412 L 515 292 Z" fill="#c0392b" opacity="0.14"/>
  <text x="520" y="330" font-size="13" fill="#c0392b">P 波阴影带</text>
  <text x="520" y="346" font-size="13" fill="#c0392b">（约 103°–143°）</text>
</svg>
