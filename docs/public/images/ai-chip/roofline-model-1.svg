<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="sans-serif">
  <title>Roofline 模型示意</title>
  <desc>横轴为算术强度 I（FLOPs/Byte，对数刻度），纵轴为可达性能（TFLOPS，对数刻度）。带宽线 y = b·I 从原点斜升，在脊点处与算力上限（水平屋顶线）相交；脊点左侧为带宽受限区，右侧为算力受限区。</desc>
  <rect x="0" y="0" width="620" height="460" fill="#faf9f5"/>

  <!-- 两个受限区浅色底 -->
  <rect x="80" y="68" width="277" height="332" fill="#1f6f8b" opacity="0.07"/>
  <rect x="357" y="68" width="243" height="332" fill="#c0392b" opacity="0.07"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="400" x2="610" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#333" stroke-width="2"/>

  <!-- 算力上限（屋顶线） -->
  <line x1="357" y1="68" x2="600" y2="68" stroke="#c0392b" stroke-width="3"/>
  <text x="588" y="56" text-anchor="end" font-size="13" fill="#c0392b">算力上限 P = 80 TFLOPS</text>

  <!-- 带宽线 -->
  <line x1="80" y1="204" x2="357" y2="68" stroke="#1f6f8b" stroke-width="3"/>
  <text x="96" y="188" font-size="13" fill="#1f6f8b">带宽线 y = b·I（b = 2 TB/s）</text>

  <!-- 脊点 -->
  <circle cx="357" cy="68" r="5" fill="#333"/>
  <text x="357" y="48" text-anchor="middle" font-size="13" fill="#333">脊点 I = P/b = 40</text>

  <!-- 三个示例负载点 -->
  <circle cx="80" cy="204" r="5" fill="#c0392b"/>
  <text x="80" y="224" text-anchor="start" font-size="13" fill="#c0392b">逐元素层（带宽受限）</text>
  <circle cx="305" cy="94" r="5" fill="#333"/>
  <text x="305" y="118" text-anchor="middle" font-size="13" fill="#333">典型卷积层</text>
  <circle cx="540" cy="68" r="5" fill="#1f6f8b"/>
  <text x="540" y="50" text-anchor="end" font-size="13" fill="#1f6f8b">大矩阵乘（算力受限）</text>

  <!-- 区域标注 -->
  <text x="200" y="380" text-anchor="middle" font-size="13" fill="#1f6f8b">带宽受限区</text>
  <text x="470" y="380" text-anchor="middle" font-size="13" fill="#c0392b">算力受限区</text>

  <!-- 刻度与轴标签 -->
  <g fill="#333" font-size="12" text-anchor="middle">
    <text x="80" y="416">1</text>
    <text x="184" y="416">4</text>
    <text x="288" y="416">16</text>
    <text x="392" y="416">64</text>
    <text x="496" y="416">256</text>
    <text x="600" y="416">1024</text>
  </g>
  <text x="340" y="438" text-anchor="middle" font-size="14" fill="#333">算术强度 I（FLOPs/Byte，对数刻度）</text>
  <g fill="#333" font-size="12" text-anchor="end">
    <text x="72" y="319">0.1</text>
    <text x="72" y="234">1</text>
    <text x="72" y="149">10</text>
    <text x="72" y="64">100</text>
  </g>
  <text x="40" y="230" transform="rotate(-90 40 230)" text-anchor="middle" font-size="14" fill="#333">可达性能（TFLOPS，对数）</text>
</svg>
