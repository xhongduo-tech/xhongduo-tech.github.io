<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="sans-serif">
  <title>4×4 脉动阵列数据流示意</title>
  <desc>权重 w 从上方逐列装载进入阵列（权重固定），激活值 a 从左侧逐行流入并向右流动，每个处理单元完成一次乘累加 c=c+a·w 并把部分和沿对角线传递，最终累加结果从阵列下方排出。</desc>
  <rect x="0" y="0" width="620" height="520" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="330" y="70" text-anchor="middle" font-size="15" fill="#1f6f8b">权重 w 自上而下装载（权重固定，Weight Stationary）</text>

  <!-- 列权重箭头与标签 -->
  <g stroke="#1f6f8b" stroke-width="2" fill="none">
    <line x1="232" y1="110" x2="232" y2="144" marker-end="url(#arrow)"/>
    <line x1="308" y1="110" x2="308" y2="144" marker-end="url(#arrow)"/>
    <line x1="384" y1="110" x2="384" y2="144" marker-end="url(#arrow)"/>
    <line x1="460" y1="110" x2="460" y2="144" marker-end="url(#arrow)"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="232" y="100">w₁</text>
    <text x="308" y="100">w₂</text>
    <text x="384" y="100">w₃</text>
    <text x="460" y="100">w₄</text>
  </g>

  <!-- 16 个处理单元 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="200" y="150" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="276" y="150" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="352" y="150" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="428" y="150" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="200" y="226" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="276" y="226" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="352" y="226" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="428" y="226" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="200" y="302" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="276" y="302" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="352" y="302" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="428" y="302" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="200" y="378" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="276" y="378" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="352" y="378" width="64" height="64" rx="4" fill="#fff"/>
    <rect x="428" y="378" width="64" height="64" rx="4" fill="#fff"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="232" y="174">MAC</text><text x="232" y="194">c+=a·w</text>
    <text x="308" y="174">MAC</text><text x="308" y="194">c+=a·w</text>
    <text x="384" y="174">MAC</text><text x="384" y="194">c+=a·w</text>
    <text x="460" y="174">MAC</text><text x="460" y="194">c+=a·w</text>
    <text x="232" y="250">MAC</text><text x="232" y="270">c+=a·w</text>
    <text x="308" y="250">MAC</text><text x="308" y="270">c+=a·w</text>
    <text x="384" y="250">MAC</text><text x="384" y="270">c+=a·w</text>
    <text x="460" y="250">MAC</text><text x="460" y="270">c+=a·w</text>
    <text x="232" y="326">MAC</text><text x="232" y="346">c+=a·w</text>
    <text x="308" y="326">MAC</text><text x="308" y="346">c+=a·w</text>
    <text x="384" y="326">MAC</text><text x="384" y="346">c+=a·w</text>
    <text x="460" y="326">MAC</text><text x="460" y="346">c+=a·w</text>
    <text x="232" y="402">MAC</text><text x="232" y="422">c+=a·w</text>
    <text x="308" y="402">MAC</text><text x="308" y="422">c+=a·w</text>
    <text x="384" y="402">MAC</text><text x="384" y="422">c+=a·w</text>
    <text x="460" y="402">MAC</text><text x="460" y="422">c+=a·w</text>
  </g>

  <!-- 行激活箭头与标签 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="164" y1="182" x2="196" y2="182" marker-end="url(#arrow)"/>
    <line x1="164" y1="258" x2="196" y2="258" marker-end="url(#arrow)"/>
    <line x1="164" y1="334" x2="196" y2="334" marker-end="url(#arrow)"/>
    <line x1="164" y1="410" x2="196" y2="410" marker-end="url(#arrow)"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="end">
    <text x="158" y="186">a₁</text>
    <text x="158" y="262">a₂</text>
    <text x="158" y="338">a₃</text>
    <text x="158" y="414">a₄</text>
  </g>
  <text x="120" y="300" transform="rotate(-90 120 300)" font-size="15" fill="#c0392b">激活值 a 自左向右流入</text>

  <!-- 底部输出箭头与标签 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="232" y1="438" x2="232" y2="470" marker-end="url(#arrow)"/>
    <line x1="308" y1="438" x2="308" y2="470" marker-end="url(#arrow)"/>
    <line x1="384" y1="438" x2="384" y2="470" marker-end="url(#arrow)"/>
    <line x1="460" y1="438" x2="460" y2="470" marker-end="url(#arrow)"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="232" y="490">o₁</text>
    <text x="308" y="490">o₂</text>
    <text x="384" y="490">o₃</text>
    <text x="460" y="490">o₄</text>
  </g>
  <text x="330" y="510" text-anchor="middle" font-size="15" fill="#1f6f8b">累加结果 o 自下排出到累加器</text>
</svg>
