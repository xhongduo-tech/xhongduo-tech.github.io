<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Grover 迭代的平面旋转</title>
  <desc>在目标方向与非目标方向张成的二维平面里，Grover 迭代把态矢量每次旋转 2θ，从均匀叠加态逐步转向目标方向。</desc>
  <rect width="640" height="480" fill="#faf9f5" />
  <!-- 两条坐标轴 -->
  <line x1="60" y1="360" x2="580" y2="360" stroke="#999" stroke-width="2" />
  <line x1="320" y1="400" x2="320" y2="60" stroke="#999" stroke-width="2" />
  <!-- x-perp 方向（几乎横轴）与 s 方向 -->
  <line x1="320" y1="360" x2="550" y2="345" stroke="#1f6f8b" stroke-width="3" />
  <line x1="320" y1="360" x2="505" y2="240" stroke="#333" stroke-width="3" />
  <line x1="320" y1="360" x2="560" y2="160" stroke="#c0392b" stroke-width="3" />
  <!-- 弧线表示旋转角 2θ -->
  <path d="M 505 240 A 250 250 0 0 1 560 160" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" />
  <!-- 标注 -->
  <text x="500" y="330" font-family="sans-serif" font-size="16" fill="#1f6f8b">|x⊥⟩（非目标）</text>
  <text x="420" y="215" font-family="sans-serif" font-size="16" fill="#333">|s⟩（均匀叠加）</text>
  <text x="575" y="150" font-family="sans-serif" font-size="16" fill="#c0392b">|x*⟩（目标）</text>
  <text x="470" y="285" font-family="sans-serif" font-size="15" fill="#c0392b">2θ</text>
  <text x="180" y="90" font-family="sans-serif" font-size="18" fill="#333">每次迭代：|s⟩ 绕原点旋转 2θ</text>
  <text x="180" y="118" font-family="sans-serif" font-size="16" fill="#333">k ≈ (π/4)√N 次后对准目标</text>
</svg>
