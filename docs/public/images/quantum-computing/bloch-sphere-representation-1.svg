<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">布洛赫球：坐标轴、地标与布洛赫矢量</title>
  <desc id="desc">布洛赫球示意图。z 轴两端为 |0⟩（北极）与 |1⟩（南极），x 轴两端为 |+⟩ 与 |-⟩，y 轴两端为 |+i⟩ 与 |-i⟩。从球心出发的红色箭头是布洛赫矢量 r，其分量分别为 r_x、r_y、r_z，对应三个 Pauli 算符 X、Y、Z 的期望值。球面上每一点代表一个纯态，球体内部代表混合态。</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="640" fill="#faf9f5"/>

  <text x="350" y="44" text-anchor="middle" font-size="24" fill="#333">布洛赫球：坐标轴、地标与布洛赫矢量</text>
  <text x="350" y="72" text-anchor="middle" font-size="15" fill="#666">布洛赫矢量 r = (sinθcosφ, sinθsinφ, cosθ) = (⟨X⟩, ⟨Y⟩, ⟨Z⟩)</text>

  <!-- 球体 -->
  <circle cx="350" cy="330" r="180" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="350" cy="330" rx="180" ry="60" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 坐标轴 -->
  <line x1="350" y1="150" x2="350" y2="510" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="170" y1="330" x2="530" y2="330" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="262" y1="412" x2="438" y2="248" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 轴名 -->
  <text x="548" y="336" font-size="16" fill="#333" font-weight="bold">x</text>
  <text x="354" y="532" font-size="16" fill="#333" font-weight="bold">z</text>
  <text x="444" y="240" font-size="16" fill="#333" font-weight="bold">y</text>

  <!-- 六个地标 -->
  <circle cx="350" cy="150" r="5" fill="#333"/>
  <text x="350" y="138" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">|0⟩</text>

  <circle cx="350" cy="510" r="5" fill="#333"/>
  <text x="350" y="532" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">|1⟩</text>

  <circle cx="530" cy="330" r="5" fill="#1f6f8b"/>
  <text x="546" y="326" text-anchor="start" font-size="17" fill="#1f6f8b" font-weight="bold">|+⟩</text>

  <circle cx="170" cy="330" r="5" fill="#666"/>
  <text x="150" y="360" text-anchor="end" font-size="17" fill="#666" font-weight="bold">|-⟩</text>

  <circle cx="438" cy="248" r="5" fill="#c0392b"/>
  <text x="442" y="232" font-size="17" fill="#c0392b" font-weight="bold">|+i⟩</text>

  <circle cx="262" cy="412" r="5" fill="#888"/>
  <text x="236" y="440" font-size="17" fill="#888" font-weight="bold">|-i⟩</text>

  <!-- 布洛赫矢量 r -->
  <line x1="350" y1="330" x2="505" y2="205" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <circle cx="505" cy="205" r="4" fill="#c0392b"/>
  <text x="515" y="196" font-size="18" fill="#c0392b" font-weight="bold">r</text>

  <!-- 分量投影线 -->
  <line x1="505" y1="205" x2="505" y2="330" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="505" y1="330" x2="350" y2="330" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="512" y="322" font-size="15" fill="#1f6f8b">r_x</text>
  <text x="426" y="358" font-size="15" fill="#1f6f8b">r_z</text>
  <line x1="505" y1="205" x2="443" y2="253" stroke="#1f6f8b" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="448" y="252" font-size="15" fill="#1f6f8b">r_y</text>

  <!-- 图注 -->
  <text x="350" y="570" text-anchor="middle" font-size="14" fill="#333">球面 = 纯态（|r| = 1），球体内部 = 混合态（|r| &lt; 1），球心 = I/2</text>
  <text x="350" y="592" text-anchor="middle" font-size="14" fill="#333">x、y、z 三根轴分别对应 X、Y、Z 三组测量基，投影即期望值</text>
  <text x="350" y="614" text-anchor="middle" font-size="14" fill="#666">θ 是 r 与 z 轴的夹角，φ 是 r 在 xy 平面投影的方位角</text>
</svg>
