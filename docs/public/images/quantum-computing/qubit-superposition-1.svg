<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">布洛赫球上的量子比特</title>
  <desc id="desc">一个球体：北极标注 |0⟩，南极标注 |1⟩，赤道最右端标注 |+⟩、最左端标注 |-⟩。从球心出发一条红色箭头指向球面一点，代表叠加态 |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ} sin(θ/2)|1⟩。θ 是态矢量与竖直 z 轴的夹角，控制 |0⟩ 与 |1⟩ 的比例；φ 是态矢量在赤道平面上的方位角，控制两分量之间的相对相位。球面上每一点对应一个叠加态。</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="600" fill="#faf9f5"/>

  <text x="350" y="46" text-anchor="middle" font-size="24" fill="#333">布洛赫球上的量子比特</text>
  <text x="350" y="74" text-anchor="middle" font-size="15" fill="#666">叠加态 |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ} sin(θ/2)|1⟩</text>

  <!-- 球体 -->
  <circle cx="350" cy="320" r="170" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="350" cy="320" rx="170" ry="55" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 坐标轴（虚线） -->
  <line x1="350" y1="150" x2="350" y2="490" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="180" y1="320" x2="520" y2="320" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="268" y1="398" x2="432" y2="242" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 极点与赤道标记 -->
  <text x="350" y="140" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">|0⟩</text>
  <circle cx="350" cy="150" r="4" fill="#333"/>
  <text x="350" y="510" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">|1⟩</text>
  <circle cx="350" cy="490" r="4" fill="#333"/>
  <text x="520" y="310" text-anchor="start" font-size="16" fill="#1f6f8b" font-weight="bold">|+⟩</text>
  <text x="180" y="340" text-anchor="end" font-size="16" fill="#666">|-⟩</text>
  <text x="442" y="240" font-size="14" fill="#666">y</text>
  <text x="478" y="326" font-size="14" fill="#666">x</text>

  <!-- 态矢量 |ψ⟩ -->
  <line x1="350" y1="320" x2="470" y2="200" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <circle cx="470" cy="200" r="4" fill="#c0392b"/>
  <text x="482" y="192" font-size="17" fill="#c0392b" font-weight="bold">|ψ⟩</text>

  <!-- θ 角 -->
  <path d="M 350 260 A 60 60 0 0 1 392 278" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="362" y="262" font-size="15" fill="#c0392b">θ</text>

  <!-- φ 角（赤道面上的投影） -->
  <line x1="470" y1="200" x2="470" y2="359" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="470" cy="359" r="4" fill="#1f6f8b"/>
  <path d="M 505 316 A 60 52 0 0 0 474 352" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="478" y="332" font-size="15" fill="#1f6f8b">φ</text>

  <!-- 图注 -->
  <text x="350" y="540" text-anchor="middle" font-size="14" fill="#333">北极 |0⟩（θ=0）、南极 |1⟩（θ=π）、赤道最右 |+⟩（θ=π/2, φ=0）</text>
  <text x="350" y="562" text-anchor="middle" font-size="14" fill="#333">θ 控制 |0⟩ 与 |1⟩ 的比例，φ 控制相对相位——球面每一点都是一个叠加态</text>
</svg>
