<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="sans-serif">
  <title>骑行踩踏的功率相位与死点示意</title>
  <desc>以钟面为参照的脚踏圆：12点到5点方向为功率阶段，6点为死点，9点到12点为回程，标注各区域的发力要点</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">踩踏圆：功率相位与死点（顺时针）</text>

  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#d8e6ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#333"/>
    <!-- 功率阶段 12→5 -->
    <path d="M 0 -130 A 130 130 0 0 1 112 -65" fill="none" stroke="#c0392b" stroke-width="14" stroke-linecap="round"/>
    <!-- 死点区 5→7 -->
    <path d="M 112 -65 A 130 130 0 0 1 112 65" fill="none" stroke="#999" stroke-width="12" stroke-linecap="round"/>
    <!-- 回程区 7→12 -->
    <path d="M 112 65 A 130 130 0 0 1 0 -130" fill="none" stroke="#1f6f8b" stroke-width="12" stroke-linecap="round"/>
    <!-- 钟点标记 -->
    <circle cx="0" cy="-130" r="5" fill="#c0392b"/>
    <text x="0" y="-144" text-anchor="middle" font-size="15" fill="#333">12 点</text>
    <circle cx="130" cy="0" r="5" fill="#c0392b"/>
    <text x="146" y="5" font-size="15" fill="#333">3 点</text>
    <circle cx="0" cy="130" r="5" fill="#333"/>
    <text x="0" y="150" text-anchor="middle" font-size="15" fill="#333">6 点（死点）</text>
    <circle cx="-130" cy="0" r="5" fill="#1f6f8b"/>
    <text x="-146" y="5" text-anchor="end" font-size="15" fill="#333">9 点</text>
    <text x="60" y="-80" font-size="15" fill="#c0392b">功率阶段</text>
    <text x="70" y="-62" font-size="13" fill="#c0392b">向前下方发力</text>
    <text x="40" y="120" font-size="13" fill="#666">滑过死点，不要猛蹬</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#fff" stroke="#d8e6ee"/>
    <line x1="14" y1="24" x2="54" y2="24" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <text x="64" y="28" font-size="14" fill="#333">功率阶段（12–5 点）</text>
    <line x1="14" y1="54" x2="54" y2="54" stroke="#999" stroke-width="7" stroke-linecap="round"/>
    <text x="64" y="58" font-size="14" fill="#333">死点区（5–7 点）</text>
    <line x1="14" y1="84" x2="54" y2="84" stroke="#1f6f8b" stroke-width="7" stroke-linecap="round"/>
    <text x="64" y="88" font-size="14" fill="#333">回程区（7–12 点）</text>
  </g>

  <text x="320" y="340" text-anchor="middle" font-size="14" fill="#666">单腿功率主要来自 12–5 点区域，其余角度靠节奏与惯性滑过</text>
</svg>
