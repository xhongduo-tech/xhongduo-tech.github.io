<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" font-family="sans-serif">
  <title>铁三换项区布局与 T1/T2 流程示意</title>
  <desc>从游泳出水、进入换项区完成 T1 上车，到骑行归来完成 T2 开跑的换项区布局示意</desc>
  <rect width="760" height="460" fill="#faf9f5"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">铁三换项区布局：T1 与 T2 流程</text>

  <!-- 游泳区 -->
  <rect x="20" y="70" width="170" height="330" rx="10" fill="#d8e6ee"/>
  <text x="105" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">游泳区（水）</text>
  <text x="105" y="230" text-anchor="middle" font-size="14" fill="#333">出水点</text>
  <circle cx="105" cy="250" r="16" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="105" y="255" text-anchor="middle" font-size="12" fill="#1f6f8b">上岸</text>

  <!-- 换项区 -->
  <rect x="210" y="70" width="320" height="330" rx="10" fill="#f3ecdf"/>
  <text x="370" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">换项区</text>
  <text x="370" y="120" text-anchor="middle" font-size="13" fill="#666">按号码分区挂车</text>
  <!-- 车架示意 -->
  <g transform="translate(250,150)">
    <rect x="0" y="0" width="240" height="20" rx="4" fill="#c8b98c"/>
    <text x="120" y="14" text-anchor="middle" font-size="12" fill="#333">自行车挂架</text>
    <line x1="30" y1="20" x2="30" y2="120" stroke="#999" stroke-width="3"/>
    <line x1="120" y1="20" x2="120" y2="120" stroke="#999" stroke-width="3"/>
    <line x1="210" y1="20" x2="210" y2="120" stroke="#999" stroke-width="3"/>
  </g>
  <!-- 进入出口箭头 -->
  <path d="M 190 200 L 245 200" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arrRed)"/>
  <text x="205" y="190" font-size="13" fill="#c0392b">T1 入</text>
  <path d="M 455 300 L 505 300" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arrRed)"/>
  <text x="452" y="292" font-size="13" fill="#c0392b">T1 出（骑行）</text>
  <path d="M 505 120 L 455 120" stroke="#1f6f8b" stroke-width="4" fill="none" marker-end="url(#arrBlue)"/>
  <text x="470" y="112" font-size="13" fill="#1f6f8b">T2 入（骑行归）</text>
  <path d="M 245 330 L 190 330" stroke="#1f6f8b" stroke-width="4" fill="none" marker-end="url(#arrBlue)"/>
  <text x="205" y="322" font-size="13" fill="#1f6f8b">T2 出（跑步）</text>

  <!-- 骑行区 -->
  <rect x="550" y="70" width="190" height="330" rx="10" fill="#f7e4e1"/>
  <text x="645" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">骑行区</text>
  <text x="645" y="220" text-anchor="middle" font-size="14" fill="#333">骑行出发线</text>
  <text x="645" y="250" text-anchor="middle" font-size="14" fill="#333">骑行折返线</text>
  <text x="645" y="330" text-anchor="middle" font-size="13" fill="#666">换项区外骑行</text>

  <!-- 跑步区 -->
  <rect x="20" y="405" width="720" height="40" rx="8" fill="#f3ecdf"/>
  <text x="380" y="430" text-anchor="middle" font-size="14" fill="#333">跑步段：出换项区后沿跑步道行进，补给站沿途设置</text>

  <defs>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/></marker>
  </defs>
</svg>
