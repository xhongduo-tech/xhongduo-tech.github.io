<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 330" width="830" height="330" role="img" font-family="sans-serif">
  <title>自由泳划臂四阶段示意</title>
  <desc>从入水、抓水、拉水到推水的自由泳划臂周期，泳者向左前进，手臂依次完成四个阶段</desc>
  <rect width="830" height="330" fill="#faf9f5"/>
  <text x="415" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">自由泳划臂四阶段（泳者向左前进）</text>
  <text x="20" y="315" font-size="14" fill="#666">箭头表示手掌与手臂的发力/移动方向</text>

  <!-- 阶段1 入水 -->
  <g transform="translate(20, 50)">
    <text x="95" y="18" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">① 入水</text>
    <rect x="60" y="70" width="112" height="30" rx="15" fill="#d8e6ee"/>
    <circle cx="54" cy="78" r="17" fill="#d8e6ee" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="70" y1="85" x2="18" y2="78" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="14" cy="77" r="7" fill="#c0392b"/>
    <line x1="0" y1="150" x2="190" y2="150" stroke="#1f6f8b" stroke-width="3" opacity="0.6"/>
    <path d="M 12 70 A 12 12 0 0 1 22 60" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="28" y="58" font-size="13" fill="#c0392b">插入</text>
    <text x="95" y="225" text-anchor="middle" font-size="14" fill="#333">指尖斜插水中，肘部微屈</text>
  </g>

  <!-- 阶段2 抓水 -->
  <g transform="translate(220, 50)">
    <text x="95" y="18" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">② 抓水</text>
    <rect x="60" y="70" width="112" height="30" rx="15" fill="#d8e6ee"/>
    <circle cx="54" cy="78" r="17" fill="#d8e6ee" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="70" y1="85" x2="42" y2="78" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="42" cy="78" r="5" fill="#1f6f8b"/>
    <line x1="42" y1="78" x2="14" y2="108" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="12" cy="110" r="7" fill="#c0392b"/>
    <line x1="0" y1="150" x2="190" y2="150" stroke="#1f6f8b" stroke-width="3" opacity="0.6"/>
    <path d="M 6 102 A 14 14 0 0 1 14 92" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="20" y="88" font-size="13" fill="#c0392b">下压</text>
    <text x="95" y="225" text-anchor="middle" font-size="14" fill="#333">高肘，手掌前伸下压抓水</text>
  </g>

  <!-- 阶段3 拉水 -->
  <g transform="translate(420, 50)">
    <text x="95" y="18" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">③ 拉水</text>
    <rect x="60" y="70" width="112" height="30" rx="15" fill="#d8e6ee"/>
    <circle cx="54" cy="78" r="17" fill="#d8e6ee" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="70" y1="85" x2="86" y2="100" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="86" cy="100" r="5" fill="#1f6f8b"/>
    <line x1="86" y1="100" x2="108" y2="132" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="110" cy="134" r="7" fill="#c0392b"/>
    <line x1="0" y1="150" x2="190" y2="150" stroke="#1f6f8b" stroke-width="3" opacity="0.6"/>
    <path d="M 118 126 A 14 14 0 0 1 114 142" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="126" y="142" font-size="13" fill="#c0392b">后拉</text>
    <text x="95" y="225" text-anchor="middle" font-size="14" fill="#333">肘部屈曲，手掌朝后拉水</text>
  </g>

  <!-- 阶段4 推水 -->
  <g transform="translate(620, 50)">
    <text x="95" y="18" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">④ 推水</text>
    <rect x="60" y="70" width="112" height="30" rx="15" fill="#d8e6ee"/>
    <circle cx="54" cy="78" r="17" fill="#d8e6ee" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="70" y1="85" x2="98" y2="110" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="98" cy="110" r="5" fill="#1f6f8b"/>
    <line x1="98" y1="110" x2="122" y2="128" stroke="#1f6f8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="124" cy="130" r="7" fill="#c0392b"/>
    <line x1="0" y1="150" x2="190" y2="150" stroke="#1f6f8b" stroke-width="3" opacity="0.6"/>
    <path d="M 134 122 A 14 14 0 0 1 132 140" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="142" y="140" font-size="13" fill="#c0392b">推直</text>
    <text x="95" y="225" text-anchor="middle" font-size="14" fill="#333">推至大腿旁，随后空中移臂</text>
  </g>
</svg>
