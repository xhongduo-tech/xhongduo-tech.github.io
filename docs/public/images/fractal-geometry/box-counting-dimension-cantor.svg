<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
<title>Box-counting 维数：康托尔集的两级网格</title>
<desc>康托尔集在不同网格尺度下的格子计数，δ=1/3 时数出 2 格，δ=1/9 时数出 4 格，格子数按 δ^(−D) 增长。</desc>
<rect width="720" height="320" fill="#faf9f5"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">网格越来越细，被碰到的格子数按幂律增长</text>
<g transform="translate(40,0)">
<rect x="40.0" y="172" width="100.0" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="240.0" y="172" width="100.0" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="40.0" y="172" width="100.0" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="240.0" y="172" width="100.0" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<line x1="40.0" y1="172" x2="40.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="140.0" y1="172" x2="140.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="240.0" y1="172" x2="240.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="340.0" y1="172" x2="340.0" y2="252" stroke="#999" stroke-width="1"/>
<rect x="0.0" y="190.0" width="100.0" height="44.0" fill="#333"/>
<rect x="200.0" y="190.0" width="100.0" height="44.0" fill="#333"/>
</g>
<g transform="translate(380,0)">
<rect x="380.0" y="172" width="33.3" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="446.7" y="172" width="33.3" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="580.0" y="172" width="33.3" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="646.7" y="172" width="33.3" height="80" fill="#c0392b" opacity="0.12"/>
<rect x="380.0" y="172" width="33.3" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="446.7" y="172" width="33.3" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="580.0" y="172" width="33.3" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="646.7" y="172" width="33.3" height="80" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<line x1="380.0" y1="172" x2="380.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="413.3" y1="172" x2="413.3" y2="252" stroke="#999" stroke-width="1"/>
<line x1="446.7" y1="172" x2="446.7" y2="252" stroke="#999" stroke-width="1"/>
<line x1="480.0" y1="172" x2="480.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="513.3" y1="172" x2="513.3" y2="252" stroke="#999" stroke-width="1"/>
<line x1="546.7" y1="172" x2="546.7" y2="252" stroke="#999" stroke-width="1"/>
<line x1="580.0" y1="172" x2="580.0" y2="252" stroke="#999" stroke-width="1"/>
<line x1="613.3" y1="172" x2="613.3" y2="252" stroke="#999" stroke-width="1"/>
<line x1="646.7" y1="172" x2="646.7" y2="252" stroke="#999" stroke-width="1"/>
<line x1="680.0" y1="172" x2="680.0" y2="252" stroke="#999" stroke-width="1"/>
<rect x="0.0" y="190.0" width="33.3" height="44.0" fill="#333"/>
<rect x="66.7" y="190.0" width="33.3" height="44.0" fill="#333"/>
<rect x="200.0" y="190.0" width="33.3" height="44.0" fill="#333"/>
<rect x="266.7" y="190.0" width="33.3" height="44.0" fill="#333"/>
</g>
<text x="530.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">δ = 1/9，数出 N(δ) = 4 个格子</text>
<text x="360" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">康托尔集：N(δ) ∝ δ^(−D)，D = log 2 / log 3 ≈ 0.63</text>
</svg>