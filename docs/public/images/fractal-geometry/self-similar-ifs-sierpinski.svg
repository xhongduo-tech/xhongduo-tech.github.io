<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348">
<title>谢尔宾斯基三角的逐级构造</title>
<desc>把三角形分成四份、去掉中间一份，再对剩下三份递归，得到谢尔宾斯基三角。</desc>
<rect width="720" height="348" fill="#faf9f5"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">谢尔宾斯基三角：三个缩小 1/2 的副本，迭代出分形</text>
<polygon points="160,60 70,300 250,300" fill="none" stroke="#999" stroke-width="1.5"/>
<polygon points="160,60 70,300 250,300" fill="#333"/>
<text x="160" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">第 0 级</text>
<polygon points="400,60 310,300 490,300" fill="none" stroke="#999" stroke-width="1.5"/>
<polygon points="400.0,60.0 355.0,180.0 445.0,180.0" fill="#333"/>
<polygon points="355.0,180.0 310.0,300.0 400.0,300.0" fill="#333"/>
<polygon points="445.0,180.0 400.0,300.0 490.0,300.0" fill="#333"/>
<text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">第 1 级</text>
<polygon points="640,60 550,300 730,300" fill="none" stroke="#999" stroke-width="1.5"/>
<polygon points="640.0,60.0 617.5,120.0 662.5,120.0" fill="#333"/>
<polygon points="617.5,120.0 595.0,180.0 640.0,180.0" fill="#333"/>
<polygon points="662.5,120.0 640.0,180.0 685.0,180.0" fill="#333"/>
<polygon points="595.0,180.0 572.5,240.0 617.5,240.0" fill="#333"/>
<polygon points="572.5,240.0 550.0,300.0 595.0,300.0" fill="#333"/>
<polygon points="617.5,240.0 595.0,300.0 640.0,300.0" fill="#333"/>
<polygon points="685.0,180.0 662.5,240.0 707.5,240.0" fill="#333"/>
<polygon points="662.5,240.0 640.0,300.0 685.0,300.0" fill="#333"/>
<polygon points="707.5,240.0 685.0,300.0 730.0,300.0" fill="#333"/>
<text x="640" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">第 2 级</text>
<text x="360" y="344" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">D = log 3 / log 2 ≈ 1.585</text>
</svg>