<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title id="title">NEEDLE 干草垛网格：检索成功与否随针的位置与上下文长度变化</title>
<desc id="desc">示意单针干草垛压力测试：横轴为上下文长度，纵轴为针（关键信息）的插入位置，格子颜色表示模型能否检索出该信息；中间的格子大多失败，即「迷失在中间」现象。</desc>
<rect width="640" height="440" fill="#faf9f5"/>
<text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">NEEDLE：干草垛网格（单针检索）</text>
<text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">深色 = 检索失败，浅色 = 检索成功</text>

<g font-family="sans-serif" font-size="15" fill="#333">
<text x="130" y="128" text-anchor="end">针在开头</text>
<text x="130" y="198" text-anchor="end">针在中间上</text>
<text x="130" y="268" text-anchor="end">针在中间下</text>
<text x="130" y="338" text-anchor="end">针在结尾</text>
</g>

<g font-family="sans-serif" font-size="14" fill="#666">
<text x="215" y="380" text-anchor="middle">4k</text>
<text x="320" y="380" text-anchor="middle">16k</text>
<text x="425" y="380" text-anchor="middle">64k</text>
<text x="530" y="380" text-anchor="middle">128k</text>
<text x="320" y="420" text-anchor="middle">上下文长度（token）→</text>
</g>

<g>
<rect x="150" y="100" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.85"/>
<rect x="255" y="100" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.85"/>
<rect x="360" y="100" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.7"/>
<rect x="465" y="100" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.55"/>
<rect x="150" y="170" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.55"/>
<rect x="255" y="170" width="95" height="55" rx="6" fill="#c0392b" opacity="0.45"/>
<rect x="360" y="170" width="95" height="55" rx="6" fill="#c0392b" opacity="0.6"/>
<rect x="465" y="170" width="95" height="55" rx="6" fill="#c0392b" opacity="0.6"/>
<rect x="150" y="240" width="95" height="55" rx="6" fill="#c0392b" opacity="0.35"/>
<rect x="255" y="240" width="95" height="55" rx="6" fill="#c0392b" opacity="0.5"/>
<rect x="360" y="240" width="95" height="55" rx="6" fill="#c0392b" opacity="0.7"/>
<rect x="465" y="240" width="95" height="55" rx="6" fill="#c0392b" opacity="0.75"/>
<rect x="150" y="310" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.75"/>
<rect x="255" y="310" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.55"/>
<rect x="360" y="310" width="95" height="55" rx="6" fill="#1f6f8b" opacity="0.35"/>
<rect x="465" y="310" width="95" height="55" rx="6" fill="#c0392b" opacity="0.45"/>
</g>

<g font-family="sans-serif" font-size="14" fill="#666">
<rect x="40" y="400" width="14" height="14" rx="3" fill="#1f6f8b" opacity="0.85"/>
<text x="62" y="413">检索成功</text>
<rect x="170" y="400" width="14" height="14" rx="3" fill="#c0392b" opacity="0.6"/>
<text x="192" y="413">检索失败（迷失在中间）</text>
</g>
</svg>
