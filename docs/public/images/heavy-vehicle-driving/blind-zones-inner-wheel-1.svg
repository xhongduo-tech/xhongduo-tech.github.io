<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560">
<title>大型货车盲区与内轮差示意图</title>
<desc>俯视图展示一辆大型货车的车头前方盲区、右侧盲区、左侧后方盲区、正后方盲区，以及右转弯时内轮差扫过的危险区域。</desc>
<rect width="820" height="560" fill="#faf9f5"/>
<g font-family="sans-serif" font-size="15" fill="#333">
<!-- 网格背景 -->
<g stroke="#e8e5dd" stroke-width="1">
<line x1="60" y1="60" x2="60" y2="500"/><line x1="130" y1="60" x2="130" y2="500"/>
<line x1="200" y1="60" x2="200" y2="500"/><line x1="270" y1="60" x2="270" y2="500"/>
<line x1="340" y1="60" x2="340" y2="500"/><line x1="410" y1="60" x2="410" y2="500"/>
<line x1="480" y1="60" x2="480" y2="500"/><line x1="550" y1="60" x2="550" y2="500"/>
<line x1="620" y1="60" x2="620" y2="500"/><line x1="690" y1="60" x2="690" y2="500"/>
<line x1="760" y1="60" x2="760" y2="500"/>
<line x1="60" y1="60" x2="760" y2="60"/><line x1="60" y1="130" x2="760" y2="130"/>
<line x1="60" y1="200" x2="760" y2="200"/><line x1="60" y1="270" x2="760" y2="270"/>
<line x1="60" y1="340" x2="760" y2="340"/><line x1="60" y1="410" x2="760" y2="410"/>
<line x1="60" y1="480" x2="760" y2="480"/>
</g>
<!-- 盲区色块（半透明红） -->
<g fill="#c0392b" opacity="0.18">
<rect x="270" y="20" width="300" height="42"/>                       <!-- 车头前方盲区 -->
<rect x="620" y="80" width="140" height="320"/>                      <!-- 右侧盲区 -->
<rect x="40" y="80" width="100" height="150"/>                       <!-- 左侧后方盲区 -->
<rect x="300" y="430" width="200" height="50"/>                      <!-- 正后方盲区 -->
</g>
<!-- 内轮差危险月牙（右转时） -->
<g fill="#c0392b" opacity="0.32">
<path d="M 620 120 Q 690 160 680 260 Q 690 330 620 360 L 580 330 Q 640 300 630 260 Q 640 210 580 170 Z"/>
</g>
<!-- 挂车（货厢） -->
<rect x="270" y="80" width="300" height="330" fill="#1f6f8b" opacity="0.25" stroke="#1f6f8b" stroke-width="2"/>
<rect x="270" y="80" width="300" height="330" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<!-- 挂车轮 -->
<g fill="#333">
<rect x="290" y="110" width="18" height="46" rx="4"/><rect x="330" y="110" width="18" height="46" rx="4"/>
<rect x="370" y="110" width="18" height="46" rx="4"/>
<rect x="290" y="334" width="18" height="46" rx="4"/><rect x="330" y="334" width="18" height="46" rx="4"/>
<rect x="370" y="334" width="18" height="46" rx="4"/>
<rect x="490" y="110" width="18" height="46" rx="4"/><rect x="490" y="334" width="18" height="46" rx="4"/>
</g>
<!-- 鞍座连接 -->
<rect x="470" y="210" width="26" height="70" fill="#1f6f8b"/>
<!-- 牵引车驾驶室 -->
<rect x="300" y="360" width="170" height="62" fill="#1f6f8b" opacity="0.55" stroke="#1f6f8b" stroke-width="2"/>
<!-- 牵引车前轮（在驾驶室两侧） -->
<g fill="#333">
<rect x="296" y="372" width="40" height="14" rx="4"/><rect x="296" y="398" width="40" height="14" rx="4"/>
<rect x="434" y="372" width="40" height="14" rx="4"/><rect x="434" y="398" width="40" height="14" rx="4"/>
</g>
<!-- 箭头方向（车头朝上） -->
<polygon points="420,8 408,26 432,26" fill="#333"/>
<text x="420" y="18" text-anchor="middle" font-size="14">车头方向</text>
<!-- 盲区标签 -->
<g font-size="15" font-weight="bold">
<text x="420" y="50" text-anchor="middle" fill="#c0392b">① 车头前方盲区</text>
<text x="690" y="240" text-anchor="middle" fill="#c0392b" transform="rotate(90 690 240)">② 右侧盲区</text>
<text x="90" y="150" text-anchor="middle" fill="#c0392b" transform="rotate(-90 90 150)">③ 左侧后方盲区</text>
<text x="400" y="462" text-anchor="middle" fill="#c0392b">④ 正后方盲区</text>
<text x="648" y="130" text-anchor="middle" fill="#c0392b">⑤ 内轮差危险区</text>
</g>
<!-- 标注说明 -->
<g font-size="14">
<text x="60" y="522">标注：</text>
<rect x="120" y="508" width="18" height="16" fill="#1f6f8b" opacity="0.5" stroke="#1f6f8b"/>
<text x="144" y="522">牵引车 + 挂车（车头朝上）</text>
<rect x="330" y="508" width="18" height="16" fill="#c0392b" opacity="0.25" stroke="#c0392b"/>
<text x="354" y="522">驾驶员看不见的盲区 / 内轮差扫过区域</text>
</g>
</g>
</svg>
