<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>Bragg 曲线：重带电粒子在物质中的能量损失随深度的变化</title>
  <desc>横轴为穿透深度，纵轴为每单位长度的能量损失 dE/dx。曲线随深度平缓上升，在射程末端急剧抬升形成布拉格峰，随后骤降为零，即粒子停在射程 R 处。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <line x1="80" y1="345" x2="600" y2="345" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="345" x2="80" y2="45" stroke="#333" stroke-width="2"/>
  <polygon points="600,345 595,339 595,351" fill="#333"/>
  <polygon points="80,45 74,50 86,50" fill="#333"/>
  <text x="585" y="370" font-size="14" fill="#333">穿透深度 x</text>
  <text x="28" y="50" font-size="14" fill="#333">dE/dx</text>
  <text x="28" y="70" font-size="13" fill="#666">（比能损）</text>
  <path d="M 90 332 C 200 328, 300 320, 395 304 C 445 294, 480 258, 497 196 C 508 150, 515 100, 519 55 L 524 55 L 524 336" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="524" y1="55" x2="524" y2="345" stroke="#1f6f8b" stroke-dasharray="5,4" stroke-width="1.5"/>
  <text x="452" y="80" font-size="16" fill="#c0392b">布拉格峰</text>
  <text x="533" y="370" font-size="14" fill="#1f6f8b">射程 R</text>
  <text x="200" y="308" font-size="14" fill="#666">平缓抬升：1/β² 效应</text>
  <text x="120" y="395" font-size="13" fill="#333">粒子一进入物质就连续减速，越慢能量损失越猛，故峰在末端而非入口——</text>
  <text x="120" y="412" font-size="13" fill="#333">这是质子治疗把剂量集中在肿瘤处的物理根源。</text>
</svg>
