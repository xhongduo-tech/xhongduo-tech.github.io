<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>电磁簇射（shower）发展示意</title>
  <desc>高能光子或电子进入致密介质后，通过电子对产生与韧致辐射交替放大粒子数，总粒子数随辐射长度 X0 先增后减，簇射最大深度约在 ln(E/Ec) 倍 X0 处；横轴为簇射深度 t（以 X0 为单位）。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="70" y1="330" x2="600" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="50" stroke="#333" stroke-width="2"/>
  <text x="560" y="355" font-size="14" fill="#333">深度 t（单位：辐射长度 X₀）</text>
  <text x="20" y="60" font-size="14" fill="#333">簇射</text>
  <text x="20" y="78" font-size="13" fill="#333">粒子数 N(t)</text>
  <!-- shower envelope: grow then decay -->
  <path d="M 75 320 C 120 320, 170 315, 220 300 C 290 278, 330 240, 355 205 C 375 175, 390 120, 395 70 L 400 70 C 415 120, 430 200, 470 270 C 500 318, 540 327, 570 328 L 570 332 C 540 331, 500 322, 470 274 C 430 204, 415 124, 400 74 L 395 74 C 390 124, 375 179, 355 209 C 330 244, 290 282, 220 304 C 170 319, 120 324, 75 324 Z" fill="#c0392b" opacity="0.35" stroke="none"/>
  <path d="M 75 322 C 170 320, 290 282, 355 207 C 375 177, 392 122, 398 72" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 402 72 C 415 122, 430 202, 470 272 C 500 320, 540 328, 570 329" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- incoming particle -->
  <line x1="30" y1="320" x2="75" y2="320" stroke="#333" stroke-width="3"/>
  <text x="12" y="310" font-size="14" fill="#333">入射 e⁻ / γ</text>
  <!-- peak marker -->
  <line x1="400" y1="72" x2="400" y2="330" stroke="#666" stroke-dasharray="5,4" stroke-width="1.5"/>
  <text x="380" y="46" font-size="14" fill="#333">簇射极大</text>
  <text x="410" y="60" font-size="13" fill="#666">t_max ≈ ln(E/E_c)</text>
  <!-- depth scale labels -->
  <text x="200" y="350" font-size="13" fill="#666">纵向外延：粒子数↑</text>
  <text x="430" y="350" font-size="13" fill="#666">能量耗尽：粒子数↓</text>
</svg>
