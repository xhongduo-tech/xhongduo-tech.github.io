<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">科学研究四范式的演进：从经验、理论、计算到数据驱动</title>
  <desc id="desc">自左下向右上排列的四个阶梯式方框，代表科学研究的四种范式依次演进。第一范式经验科学（古代至16世纪，自然哲学与实验观察，例：开普勒行星三定律）位于左下；第二范式理论科学（17世纪以来，公理化定律与数学模型，例：牛顿力学、麦克斯韦方程组）位于其右上；第三范式计算科学（20世纪中叶以来，数值模拟与仿真，例：数值天气预报、Monte Carlo模拟）再向右上；第四范式数据驱动（21世纪以来，AI for Science、eScience，例：AlphaFold、GraphCast、GNoME）位于最右上。方框之间以青色箭头相连，表示研究方式由观察描述到数据与模型驱动，抽象程度与数据密集程度不断上升。</desc>

  <!-- 图题 -->
  <text x="580" y="24" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">科学研究四范式的演进</text>
  <text x="580" y="50" font-size="15" fill="#666" text-anchor="middle">从经验、理论、计算到数据驱动（Jim Gray，2007 年提出「eScience」愿景）</text>

  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 范式 1：经验科学 -->
  <g transform="translate(20,435)">
    <rect x="0" y="0" width="230" height="140" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <rect x="16" y="16" width="74" height="24" rx="12" fill="#1f6f8b"/>
    <text x="53" y="32" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">第一范式</text>
    <text x="115" y="70" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">经验科学</text>
    <text x="115" y="94" font-size="14" fill="#333" text-anchor="middle">自然哲学 · 实验观察</text>
    <text x="115" y="114" font-size="13" fill="#666" text-anchor="middle">古代 — 16 世纪</text>
    <text x="115" y="134" font-size="13" fill="#666" text-anchor="middle">例：开普勒行星三定律</text>
  </g>

  <!-- 范式 2：理论科学 -->
  <g transform="translate(310,290)">
    <rect x="0" y="0" width="230" height="140" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <rect x="16" y="16" width="74" height="24" rx="12" fill="#c0392b"/>
    <text x="53" y="32" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">第二范式</text>
    <text x="115" y="70" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">理论科学</text>
    <text x="115" y="94" font-size="14" fill="#333" text-anchor="middle">公理化定律与数学模型</text>
    <text x="115" y="114" font-size="13" fill="#666" text-anchor="middle">17 世纪以来</text>
    <text x="115" y="134" font-size="13" fill="#666" text-anchor="middle">例：牛顿力学、麦克斯韦方程组</text>
  </g>

  <!-- 范式 3：计算科学 -->
  <g transform="translate(600,160)">
    <rect x="0" y="0" width="230" height="140" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <rect x="16" y="16" width="74" height="24" rx="12" fill="#1f6f8b"/>
    <text x="53" y="32" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">第三范式</text>
    <text x="115" y="70" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">计算科学</text>
    <text x="115" y="94" font-size="14" fill="#333" text-anchor="middle">数值模拟与仿真</text>
    <text x="115" y="114" font-size="13" fill="#666" text-anchor="middle">20 世纪中叶以来</text>
    <text x="115" y="134" font-size="13" fill="#666" text-anchor="middle">例：数值天气预报、Monte Carlo 模拟</text>
  </g>

  <!-- 范式 4：数据驱动 -->
  <g transform="translate(890,30)">
    <rect x="0" y="0" width="230" height="140" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <rect x="16" y="16" width="74" height="24" rx="12" fill="#c0392b"/>
    <text x="53" y="32" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">第四范式</text>
    <text x="115" y="70" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">数据驱动科学</text>
    <text x="115" y="94" font-size="14" fill="#333" text-anchor="middle">AI for Science · eScience</text>
    <text x="115" y="114" font-size="13" fill="#666" text-anchor="middle">21 世纪以来</text>
    <text x="115" y="134" font-size="13" fill="#666" text-anchor="middle">例：AlphaFold、GraphCast、GNoME</text>
  </g>

  <!-- 演进箭头 -->
  <path d="M 252 448 Q 280 444 306 432" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 542 308 Q 570 304 598 294" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 832 178 Q 860 174 888 166" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <text x="580" y="612" font-size="14" fill="#666" text-anchor="middle">抽象程度与数据密集程度：经验观察 → 数学建模 → 计算机模拟 → 数据分析与机器学习</text>
</svg>
