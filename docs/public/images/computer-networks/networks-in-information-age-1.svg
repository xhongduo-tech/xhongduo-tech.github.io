<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">互联网的边缘部分与核心部分</title>
  <desc id="desc">互联网的边缘部分与核心部分示意图。图中左右两个虚线框为「边缘部分」，内各有三台端系统主机：左侧青色边框为主机（客户机），右侧红色边框为服务器，其余为普通主机；上下居中一个青色虚线框为「核心部分」，内部有四台路由器 R1、R2、R3、R4，以链路连成网状。每台主机通过一条接入链路连到就近的路由器。一条红色虚线从左下主机连到右下主机，标注「P2P：对等通信」，表示主机之间对等通信；客户机与服务器之间的请求—响应则沿核心部分的网状链路转发。图例说明：青色表示客户机（C/S 请求方），红色表示服务器（C/S 服务方），灰色表示主机（P2P 双方对等），青色圆环表示路由器（核心）。</desc>

  <rect x="0" y="0" width="1000" height="620" fill="#faf9f5"/>

  <!-- 三个区域边框（虚线） -->
  <rect x="55"  y="95"  width="200" height="430" rx="14" fill="none" stroke="#9a907d" stroke-width="1.8" stroke-dasharray="6 5"/>
  <rect x="745" y="95"  width="200" height="430" rx="14" fill="none" stroke="#9a907d" stroke-width="1.8" stroke-dasharray="6 5"/>
  <rect x="325" y="160" width="350" height="300" rx="14" fill="none" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="6 5"/>

  <!-- 区域标签 -->
  <text x="155" y="87" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">边缘部分（端系统）</text>
  <text x="845" y="87" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">边缘部分（端系统）</text>
  <text x="500" y="150" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">核心部分（路由器与链路）</text>

  <!-- 核心部分内部的网状链路 -->
  <g stroke="#999" stroke-width="1.8">
    <line x1="395" y1="230" x2="605" y2="230"/>
    <line x1="605" y1="230" x2="605" y2="390"/>
    <line x1="605" y1="390" x2="395" y2="390"/>
    <line x1="395" y1="390" x2="395" y2="230"/>
    <line x1="395" y1="230" x2="605" y2="390"/>
    <line x1="605" y1="230" x2="395" y2="390"/>
  </g>

  <!-- 主机接入链路 -->
  <g stroke="#999" stroke-width="1.6">
    <line x1="210" y1="176" x2="359" y2="230"/>
    <line x1="210" y1="336" x2="359" y2="390"/>
    <line x1="210" y1="496" x2="359" y2="390"/>
    <line x1="790" y1="176" x2="641" y2="230"/>
    <line x1="790" y1="336" x2="641" y2="390"/>
    <line x1="790" y1="496" x2="641" y2="390"/>
  </g>

  <!-- P2P 对等通信虚线 -->
  <line x1="210" y1="336" x2="790" y2="336" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="500" y="326" font-size="14" fill="#c0392b" text-anchor="middle">P2P：对等通信</text>

  <!-- 路由器节点 -->
  <g>
    <circle cx="395" cy="230" r="36" fill="#fff" stroke="#1f6f8b" stroke-width="2.2"/>
    <text x="395" y="226" font-size="13" fill="#333" text-anchor="middle">路由器</text>
    <text x="395" y="243" font-size="13" fill="#1f6f8b" text-anchor="middle">R1</text>

    <circle cx="605" cy="230" r="36" fill="#fff" stroke="#1f6f8b" stroke-width="2.2"/>
    <text x="605" y="226" font-size="13" fill="#333" text-anchor="middle">路由器</text>
    <text x="605" y="243" font-size="13" fill="#1f6f8b" text-anchor="middle">R2</text>

    <circle cx="395" cy="390" r="36" fill="#fff" stroke="#1f6f8b" stroke-width="2.2"/>
    <text x="395" y="386" font-size="13" fill="#333" text-anchor="middle">路由器</text>
    <text x="395" y="403" font-size="13" fill="#1f6f8b" text-anchor="middle">R3</text>

    <circle cx="605" cy="390" r="36" fill="#fff" stroke="#1f6f8b" stroke-width="2.2"/>
    <text x="605" y="386" font-size="13" fill="#333" text-anchor="middle">路由器</text>
    <text x="605" y="403" font-size="13" fill="#1f6f8b" text-anchor="middle">R4</text>
  </g>

  <!-- 端系统（主机） -->
  <g stroke-width="2">
    <rect x="100" y="150" width="110" height="52" rx="10" fill="#eaf4f5" stroke="#1f6f8b"/>
    <text x="155" y="182" font-size="15" fill="#1f6f8b" text-anchor="middle">客户机</text>

    <rect x="100" y="310" width="110" height="52" rx="10" fill="#fff" stroke="#333"/>
    <text x="155" y="342" font-size="15" fill="#333" text-anchor="middle">主机</text>

    <rect x="100" y="470" width="110" height="52" rx="10" fill="#fff" stroke="#333"/>
    <text x="155" y="502" font-size="15" fill="#333" text-anchor="middle">主机</text>

    <rect x="790" y="150" width="110" height="52" rx="10" fill="#fdf0ee" stroke="#c0392b"/>
    <text x="845" y="182" font-size="15" fill="#c0392b" text-anchor="middle">服务器</text>

    <rect x="790" y="310" width="110" height="52" rx="10" fill="#fff" stroke="#333"/>
    <text x="845" y="342" font-size="15" fill="#333" text-anchor="middle">主机</text>

    <rect x="790" y="470" width="110" height="52" rx="10" fill="#fff" stroke="#333"/>
    <text x="845" y="502" font-size="15" fill="#333" text-anchor="middle">主机</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" fill="#333">
    <rect x="120" y="564" width="14" height="14" rx="3" fill="#eaf4f5" stroke="#1f6f8b" stroke-width="2"/>
    <text x="142" y="576">客户机（C/S 请求方）</text>

    <rect x="330" y="564" width="14" height="14" rx="3" fill="#fdf0ee" stroke="#c0392b" stroke-width="2"/>
    <text x="352" y="576">服务器（C/S 服务方）</text>

    <rect x="520" y="564" width="14" height="14" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="542" y="576">主机（P2P 双方对等）</text>

    <circle cx="712" cy="571" r="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="728" y="576">路由器（核心）</text>
  </g>

  <!-- 图注 -->
  <text x="500" y="608" font-size="13" fill="#666" text-anchor="middle">注：端系统（主机）由用户直接使用，经接入链路连入核心；核心部分的路由器负责分组转发。</text>
</svg>
