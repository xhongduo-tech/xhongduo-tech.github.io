<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="sans-serif">
  <title>五层封装与解封装示意图</title>
  <desc>发送端每一层为上层数据添加自己的首部，接收端每一层剥掉对应首部。</desc>
  <rect x="0" y="0" width="880" height="420" fill="#faf9f5"/>

  <!-- 发送端标签 -->
  <text x="140" y="30" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">发送端：逐层封装</text>
  <!-- 接收端标签 -->
  <text x="740" y="30" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">接收端：逐层解封装</text>

  <!-- 应用层数据 -->
  <rect x="60" y="50" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="69" font-size="14" fill="#333" text-anchor="middle">应用数据（HTTP 报文）</text>

  <!-- TCP 层 发送端 -->
  <rect x="40" y="92" width="200" height="22" fill="#1f6f8b" opacity="0.9"/>
  <text x="140" y="107" font-size="13" fill="#fff" text-anchor="middle">TCP 首部</text>
  <rect x="240" y="92" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="109" font-size="13" fill="#333" text-anchor="middle">应用数据</text>
  <text x="40" y="86" font-size="13" fill="#c0392b" font-weight="bold">运输层</text>
  <text x="420" y="109" font-size="13" fill="#666" text-anchor="end">→ 报文段</text>

  <!-- IP 层 发送端 -->
  <rect x="20" y="134" width="200" height="22" fill="#c0392b" opacity="0.85"/>
  <text x="120" y="149" font-size="13" fill="#fff" text-anchor="middle">IP 首部</text>
  <rect x="220" y="134" width="200" height="22" fill="#1f6f8b" opacity="0.9"/>
  <text x="320" y="149" font-size="13" fill="#fff" text-anchor="middle">TCP 首部</text>
  <rect x="420" y="134" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="510" y="153" font-size="13" fill="#333" text-anchor="middle">应用数据</text>
  <text x="20" y="128" font-size="13" fill="#c0392b" font-weight="bold">网络层</text>
  <text x="600" y="153" font-size="13" fill="#666" text-anchor="end">→ 数据报</text>

  <!-- 数据链路层 发送端 -->
  <rect x="20" y="176" width="240" height="22" fill="#333" opacity="0.75"/>
  <text x="140" y="191" font-size="13" fill="#fff" text-anchor="middle">以太网帧首部（含 MAC）</text>
  <rect x="260" y="176" width="200" height="22" fill="#c0392b" opacity="0.85"/>
  <text x="360" y="191" font-size="13" fill="#fff" text-anchor="middle">IP 首部</text>
  <rect x="460" y="176" width="200" height="22" fill="#1f6f8b" opacity="0.9"/>
  <text x="560" y="191" font-size="13" fill="#fff" text-anchor="middle">TCP 首部</text>
  <rect x="660" y="176" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="750" y="195" font-size="13" fill="#333" text-anchor="middle">应用数据</text>
  <text x="20" y="170" font-size="13" fill="#c0392b" font-weight="bold">数据链路层</text>
  <text x="840" y="195" font-size="13" fill="#666" text-anchor="end">→ 帧</text>

  <!-- 箭头 发送到介质 -->
  <line x1="140" y1="214" x2="140" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="150" y="232" font-size="13" fill="#666">物理层：比特流</text>

  <!-- 介质横线 -->
  <line x1="60" y1="250" x2="820" y2="250" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="242" font-size="13" fill="#666" text-anchor="middle">传输介质</text>

  <!-- 接收端箭头 -->
  <line x1="740" y1="250" x2="740" y2="276" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="730" y="270" font-size="13" fill="#666">物理层还原比特</text>

  <!-- 数据链路层 接收端 剥首部 -->
  <rect x="700" y="286" width="120" height="22" fill="#333" opacity="0.75"/>
  <text x="760" y="301" font-size="13" fill="#fff" text-anchor="middle">剥帧首部</text>
  <rect x="520" y="286" width="200" height="22" fill="#c0392b" opacity="0.85"/>
  <text x="620" y="301" font-size="13" fill="#fff" text-anchor="middle">IP 首部</text>
  <rect x="320" y="286" width="200" height="22" fill="#1f6f8b" opacity="0.9"/>
  <text x="420" y="301" font-size="13" fill="#fff" text-anchor="middle">TCP 首部</text>
  <rect x="60" y="286" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="305" font-size="13" fill="#333" text-anchor="middle">应用数据</text>
  <text x="820" y="301" font-size="13" fill="#666" text-anchor="end">帧</text>

  <!-- 剥 TCP -->
  <line x1="600" y1="314" x2="600" y2="336" stroke="#333" stroke-width="1.5"/>
  <line x1="600" y1="336" x2="150" y2="336" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="332" font-size="13" fill="#666" text-anchor="middle">剥 TCP 首部</text>
  <rect x="60" y="346" width="180" height="28" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="365" font-size="13" fill="#333" text-anchor="middle">应用数据（HTTP 报文）</text>

  <!-- 底部箭头 -->
  <line x1="150" y1="374" x2="150" y2="398" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="160" y="392" font-size="13" fill="#666">逐层向上，最终交给应用</text>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
