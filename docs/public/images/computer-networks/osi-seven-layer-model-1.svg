<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif">
  <title>OSI 七层参考模型：各层职责与数据单元</title>
  <desc>自下而上列出 OSI 七层：物理层、数据链路层、网络层、运输层、会话层、表示层、应用层，右侧标注各层的数据单元与典型协议；运输层用红色强调它是端到端层。</desc>

  <!-- 标题 -->
  <text x="320" y="34" text-anchor="middle" fill="#333333" font-size="18">OSI 七层参考模型</text>
  <text x="320" y="56" text-anchor="middle" fill="#666666" font-size="13">发送：自上而下封装；接收：自下而上解封装</text>

  <!-- 层 7 应用层 -->
  <rect x="50" y="72" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="99" r="12" fill="#1f6f8b"/>
  <text x="74" y="104" text-anchor="middle" fill="#ffffff" font-size="14">7</text>
  <text x="100" y="97" fill="#333333" font-size="15">应用层 Application</text>
  <text x="100" y="116" fill="#333333" font-size="13">为应用进程提供网络服务</text>
  <text x="470" y="99" fill="#1f6f8b" font-size="14">报文 message</text>
  <text x="470" y="116" fill="#333333" font-size="13">HTTP · DNS</text>

  <!-- 层 6 表示层 -->
  <rect x="50" y="134" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="161" r="12" fill="#1f6f8b"/>
  <text x="74" y="166" text-anchor="middle" fill="#ffffff" font-size="14">6</text>
  <text x="100" y="159" fill="#333333" font-size="15">表示层 Presentation</text>
  <text x="100" y="178" fill="#333333" font-size="13">数据格式转换、加密、压缩</text>
  <text x="470" y="161" fill="#1f6f8b" font-size="14">报文 message</text>
  <text x="470" y="178" fill="#333333" font-size="13">TLS · JPEG</text>

  <!-- 层 5 会话层 -->
  <rect x="50" y="196" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="223" r="12" fill="#1f6f8b"/>
  <text x="74" y="228" text-anchor="middle" fill="#ffffff" font-size="14">5</text>
  <text x="100" y="221" fill="#333333" font-size="15">会话层 Session</text>
  <text x="100" y="240" fill="#333333" font-size="13">会话管理、同步、断点续传</text>
  <text x="470" y="223" fill="#1f6f8b" font-size="14">报文 message</text>
  <text x="470" y="240" fill="#333333" font-size="13">RPC</text>

  <!-- 层 4 运输层（红色强调） -->
  <rect x="50" y="258" width="380" height="54" rx="4" fill="#fbeae6" stroke="#c0392b" stroke-width="2"/>
  <circle cx="74" cy="285" r="12" fill="#c0392b"/>
  <text x="74" y="290" text-anchor="middle" fill="#ffffff" font-size="14">4</text>
  <text x="100" y="283" fill="#333333" font-size="15">运输层 Transport</text>
  <text x="100" y="302" fill="#333333" font-size="13">端到端进程通信、可靠与流量控制</text>
  <text x="470" y="285" fill="#c0392b" font-size="14">报文段 segment</text>
  <text x="470" y="302" fill="#333333" font-size="13">TCP · UDP</text>

  <!-- 层 3 网络层 -->
  <rect x="50" y="320" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="347" r="12" fill="#1f6f8b"/>
  <text x="74" y="352" text-anchor="middle" fill="#ffffff" font-size="14">3</text>
  <text x="100" y="345" fill="#333333" font-size="15">网络层 Network</text>
  <text x="100" y="364" fill="#333333" font-size="13">路由选择与分组转发、拥塞控制</text>
  <text x="470" y="347" fill="#1f6f8b" font-size="14">分组 packet</text>
  <text x="470" y="364" fill="#333333" font-size="13">IP · 路由器</text>

  <!-- 层 2 数据链路层 -->
  <rect x="50" y="382" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="409" r="12" fill="#1f6f8b"/>
  <text x="74" y="414" text-anchor="middle" fill="#ffffff" font-size="14">2</text>
  <text x="100" y="407" fill="#333333" font-size="15">数据链路层 Data Link</text>
  <text x="100" y="426" fill="#333333" font-size="13">相邻结点间帧的传送、差错检测</text>
  <text x="470" y="409" fill="#1f6f8b" font-size="14">帧 frame</text>
  <text x="470" y="426" fill="#333333" font-size="13">以太网 · 交换机</text>

  <!-- 层 1 物理层 -->
  <rect x="50" y="444" width="380" height="54" rx="4" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="74" cy="471" r="12" fill="#1f6f8b"/>
  <text x="74" y="476" text-anchor="middle" fill="#ffffff" font-size="14">1</text>
  <text x="100" y="469" fill="#333333" font-size="15">物理层 Physical</text>
  <text x="100" y="488" fill="#333333" font-size="13">透明传输比特流、定义电压与接口</text>
  <text x="470" y="471" fill="#1f6f8b" font-size="14">比特 bit</text>
  <text x="470" y="488" fill="#333333" font-size="13">网线 · 集线器</text>

  <!-- 底部图例 -->
  <rect x="50" y="514" width="540" height="34" rx="6" fill="#faf9f5" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="535" text-anchor="middle" fill="#333333" font-size="13">对等层之间靠协议逻辑通信；相邻层之间经服务访问点（SAP）衔接</text>
</svg>
