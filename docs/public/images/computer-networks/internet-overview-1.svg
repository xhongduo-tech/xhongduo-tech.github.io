<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <title>网络的网络：从局域网到互联网主干的分层结构</title>
  <desc>示意互联网的分层结构：最底层是两个局域网，各自通过路由器接入区域 ISP，区域 ISP 再接入互联网主干；两个区域 ISP 之间可经 IXP 对等互联。右侧标注核心部分与边缘部分的分界。</desc>

  <!-- 互联网主干 -->
  <rect x="70" y="24" width="500" height="34" rx="6" fill="#1f6f8b"/>
  <text x="320" y="46" text-anchor="middle" fill="#ffffff" font-size="16">互联网主干（主干 ISP）</text>

  <!-- 主干到 ISP 的连线 -->
  <line x1="210" y1="58" x2="210" y2="92" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="58" x2="430" y2="92" stroke="#333333" stroke-width="2"/>

  <!-- 区域 ISP -->
  <rect x="140" y="92" width="140" height="52" rx="26" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="210" y="123" text-anchor="middle" fill="#333333" font-size="15">区域 ISP 1</text>
  <rect x="360" y="92" width="140" height="52" rx="26" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="430" y="123" text-anchor="middle" fill="#333333" font-size="15">区域 ISP 2</text>

  <!-- IXP 互联 -->
  <line x1="280" y1="118" x2="360" y2="118" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="108" text-anchor="middle" fill="#c0392b" font-size="13">IXP 互联</text>

  <!-- ISP 到路由器 -->
  <line x1="210" y1="144" x2="210" y2="186" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="144" x2="430" y2="186" stroke="#333333" stroke-width="2"/>

  <!-- 路由器 -->
  <rect x="190" y="186" width="40" height="26" rx="4" fill="#c0392b"/>
  <text x="210" y="230" text-anchor="middle" fill="#333333" font-size="13">路由器</text>
  <rect x="410" y="186" width="40" height="26" rx="4" fill="#c0392b"/>
  <text x="430" y="230" text-anchor="middle" fill="#333333" font-size="13">路由器</text>

  <!-- 路由器到交换机 -->
  <line x1="210" y1="212" x2="210" y2="286" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="212" x2="430" y2="286" stroke="#333333" stroke-width="2"/>

  <!-- 局域网 1 -->
  <rect x="180" y="286" width="60" height="20" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="210" y="320" text-anchor="middle" fill="#333333" font-size="13">交换机</text>
  <line x1="210" y1="306" x2="100" y2="306" stroke="#333333" stroke-width="2"/>
  <line x1="210" y1="306" x2="160" y2="306" stroke="#333333" stroke-width="2"/>
  <line x1="210" y1="306" x2="270" y2="306" stroke="#333333" stroke-width="2"/>
  <circle cx="100" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="160" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="270" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="100" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="160" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="270" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="160" y="400" text-anchor="middle" fill="#333333" font-size="14">局域网 A</text>

  <!-- 局域网 2 -->
  <rect x="400" y="286" width="60" height="20" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="430" y="320" text-anchor="middle" fill="#333333" font-size="13">交换机</text>
  <line x1="430" y1="306" x2="370" y2="306" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="306" x2="500" y2="306" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="306" x2="560" y2="306" stroke="#333333" stroke-width="2"/>
  <circle cx="370" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="500" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="560" cy="306" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="370" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="500" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="560" y="311" text-anchor="middle" fill="#333333" font-size="13">PC</text>
  <text x="460" y="400" text-anchor="middle" fill="#333333" font-size="14">局域网 B</text>

  <!-- 右侧核心/边缘分界标注 -->
  <text x="605" y="120" text-anchor="middle" fill="#1f6f8b" font-size="14">核心部分</text>
  <line x1="585" y1="140" x2="585" y2="280" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="605" y="305" text-anchor="middle" fill="#1f6f8b" font-size="14">边缘部分</text>
</svg>
