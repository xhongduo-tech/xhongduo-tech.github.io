<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>四种时延在数据通路上的产生位置</title>
  <desc>一个分组从源主机经路由器到达目的主机，途中经历的四种时延：发送时延发生在源主机的发送器，传播时延发生在链路媒体上，排队时延与处理时延发生在路由器。</desc>

  <!-- 源主机 -->
  <rect x="30" y="110" width="90" height="56" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="75" y="143" text-anchor="middle" fill="#333333" font-size="15">源主机</text>

  <!-- 路由器 -->
  <rect x="270" y="108" width="100" height="60" rx="6" fill="#fbeae6" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="143" text-anchor="middle" fill="#333333" font-size="15">路由器</text>

  <!-- 目的主机 -->
  <rect x="520" y="110" width="90" height="56" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="565" y="143" text-anchor="middle" fill="#333333" font-size="15">目的主机</text>

  <!-- 链路 1 -->
  <line x1="120" y1="138" x2="270" y2="138" stroke="#333333" stroke-width="3"/>
  <!-- 链路 2 -->
  <line x1="370" y1="138" x2="520" y2="138" stroke="#333333" stroke-width="3"/>

  <!-- 在途分组 1 -->
  <rect x="150" y="130" width="34" height="16" rx="3" fill="#1f6f8b"/>
  <text x="167" y="142" text-anchor="middle" fill="#ffffff" font-size="13">分组</text>

  <!-- 在途分组 2 -->
  <rect x="430" y="130" width="34" height="16" rx="3" fill="#1f6f8b"/>
  <text x="447" y="142" text-anchor="middle" fill="#ffffff" font-size="13">分组</text>

  <!-- 发送时延标注 -->
  <text x="75" y="88" text-anchor="middle" fill="#c0392b" font-size="14">发送时延</text>
  <text x="75" y="106" text-anchor="middle" fill="#c0392b" font-size="13">注入链路 L/v</text>

  <!-- 传播时延标注 1 -->
  <text x="195" y="88" text-anchor="middle" fill="#1f6f8b" font-size="14">传播时延</text>
  <text x="195" y="106" text-anchor="middle" fill="#1f6f8b" font-size="13">沿链路 d/c'</text>

  <!-- 排队与处理时延标注 -->
  <text x="320" y="80" text-anchor="middle" fill="#c0392b" font-size="14">排队 + 处理时延</text>

  <!-- 传播时延标注 2 -->
  <text x="445" y="88" text-anchor="middle" fill="#1f6f8b" font-size="14">传播时延</text>
  <text x="445" y="106" text-anchor="middle" fill="#1f6f8b" font-size="13">沿链路 d/c'</text>

  <!-- 底部图例框 -->
  <rect x="50" y="240" width="540" height="140" rx="8" fill="#faf9f5" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="272" text-anchor="middle" fill="#333333" font-size="15">总时延 = 发送时延 + 传播时延 + 处理时延 + 排队时延</text>
  <text x="74" y="304" fill="#333333" font-size="14">发送时延：源主机发送器内，取决于帧长与发送速率。</text>
  <text x="74" y="328" fill="#333333" font-size="14">传播时延：链路媒体上，取决于距离与传播速率。</text>
  <text x="74" y="352" fill="#333333" font-size="14">排队与处理时延：路由器内，随网络拥塞急剧变化。</text>
</svg>
