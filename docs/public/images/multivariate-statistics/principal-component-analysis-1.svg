<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
<title>PCA 几何示意：椭圆数据云的主轴即主成分方向</title>
<desc>二维数据云呈倾斜椭圆分布，第一主成分方向沿椭圆长轴、第二主成分沿短轴，二者互相垂直，方差最大方向对应长轴。</desc>
<rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>

<!-- 原始坐标轴 X1、X2 -->
<line x1="40" y1="240" x2="600" y2="240" stroke="#999" stroke-width="1.5"/>
<line x1="320" y1="420" x2="320" y2="60" stroke="#999" stroke-width="1.5"/>
<text x="592" y="230" font-family="sans-serif" font-size="16" fill="#555">X₁</text>
<text x="334" y="74" font-family="sans-serif" font-size="16" fill="#555">X₂</text>

<!-- 数据云：倾斜椭圆 -->
<g transform="rotate(-28 320 240)">
  <ellipse cx="320" cy="240" rx="230" ry="88" fill="#1f6f8b" fill-opacity="0.10" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 4"/>
</g>

<!-- 散点 -->
<g fill="#333" opacity="0.55">
  <circle cx="180" cy="300" r="3"/>
  <circle cx="232" cy="272" r="3"/>
  <circle cx="268" cy="318" r="3"/>
  <circle cx="296" cy="206" r="3"/>
  <circle cx="352" cy="180" r="3"/>
  <circle cx="402" cy="236" r="3"/>
  <circle cx="440" cy="268" r="3"/>
  <circle cx="332" cy="260" r="3"/>
  <circle cx="258" cy="210" r="3"/>
  <circle cx="384" cy="318" r="3"/>
  <circle cx="212" cy="240" r="3"/>
  <circle cx="420" cy="186" r="3"/>
  <circle cx="150" cy="268" r="3"/>
  <circle cx="492" cy="300" r="3"/>
</g>

<!-- 重心 -->
<circle cx="320" cy="240" r="5" fill="#c0392b"/>

<!-- 第一主成分方向 e1：沿长轴 -->
<g transform="rotate(-28 320 240)">
  <line x1="90" y1="240" x2="550" y2="240" stroke="#c0392b" stroke-width="3"/>
  <polygon points="550,240 534,232 534,248" fill="#c0392b"/>
  <text x="200" y="212" font-family="sans-serif" font-size="17" fill="#c0392b" font-weight="bold">第一主成分 e₁</text>
</g>

<!-- 第二主成分方向 e2：沿短轴 -->
<g transform="rotate(-28 320 240)">
  <line x1="320" y1="152" x2="320" y2="328" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="320,152 312,168 328,168" fill="#1f6f8b"/>
  <text x="336" y="170" font-family="sans-serif" font-size="17" fill="#1f6f8b" font-weight="bold">e₂</text>
</g>

<text x="50" y="452" font-family="sans-serif" font-size="15" fill="#555">数据云越扁，前两个主成分保留的方差占比越高，降维效果越好。</text>
</svg>
