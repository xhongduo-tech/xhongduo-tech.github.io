<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="title desc">
  <title id="title">全球碳循环的主要储库与通量</title>
  <desc id="desc">大气储库位于顶部，海洋储库在左下，陆地储库在右下，化石燃料储库在底部中央。箭头表示光合作用、呼吸、海气净吸收与化石燃烧排放四条主要通量。</desc>
  <rect width="720" height="500" fill="#faf9f5"/>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 大气储库 -->
  <rect x="210" y="40" width="300" height="78" rx="10" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="360" y="68" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">大气储库</text>
  <text x="360" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">约 750–830 PgC（约 420 ppm CO₂）</text>

  <!-- 海洋储库 -->
  <rect x="40" y="290" width="250" height="120" rx="10" fill="#e8f4f8" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="322" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6f8b">海洋储库</text>
  <text x="165" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">约 38000 PgC</text>
  <text x="165" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">表层：溶解无机碳为主</text>
  <text x="165" y="394" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">深海：千年级翻转</text>

  <!-- 陆地储库 -->
  <rect x="430" y="290" width="250" height="120" rx="10" fill="#eef6ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="555" y="322" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2e8b57">陆地储库</text>
  <text x="555" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2e8b57">植被 + 土壤</text>
  <text x="555" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2e8b57">约 2300 PgC</text>
  <text x="555" y="394" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2e8b57">植物经光合作用固定碳</text>

  <!-- 化石燃料储库 -->
  <rect x="285" y="420" width="150" height="55" rx="10" fill="#f5e6e4" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">化石燃料</text>
  <text x="360" y="464" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">约 4000+ PgC（人类扰动源）</text>

  <!-- 光合作用：大气→陆地 -->
  <line x1="305" y1="118" x2="470" y2="288" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="400" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">光合作用 ~120 PgC/年</text>

  <!-- 呼吸：陆地→大气 -->
  <line x1="548" y1="288" x2="418" y2="118" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="560" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">呼吸 ~120 PgC/年</text>

  <!-- 海气净吸收：大气→海洋 -->
  <line x1="235" y1="118" x2="160" y2="288" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="120" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">海气净吸收 ~2.5 PgC/年</text>

  <!-- 化石排放：化石→大气 -->
  <line x1="352" y1="420" x2="338" y2="120" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="388" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">化石燃烧排放 ~10 PgC/年</text>

  <!-- 图例 -->
  <g font-family="sans-serif" font-size="13" fill="#333">
    <line x1="60" y1="478" x2="100" y2="478" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="106" y="482">碳通量（PgC/年）</text>
    <line x1="220" y1="478" x2="260" y2="478" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="266" y="482">海洋吸收</text>
    <rect x="360" y="470" width="14" height="14" rx="3" fill="#f5e6e4" stroke="#c0392b"/>
    <text x="380" y="482">化石燃料（不可再生）</text>
  </g>
</svg>
