<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="title desc">
  <title id="title">行星边界框架的九条边界与当前状态</title>
  <desc id="desc">以中心「安全运行空间」为核心，周围环绕九条行星边界。按 2023 年前后的评估：气候、生物圈完整性、土地系统、淡水、生物地球化学流与新型实体六条已超限（红）；海洋酸化与气溶胶处于风险上升（橙）；平流层臭氧层处于安全范围（青）。</desc>
  <rect width="720" height="560" fill="#faf9f5"/>
  <circle cx="360" cy="280" r="96" fill="#1f6f8b" opacity="0.15"/>
  <circle cx="360" cy="280" r="96" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="360" y="272" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">安全运行空间</text>
  <text x="360" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">（人类世的可取状态）</text>

  <!-- 气候 超限 -->
  <g>
    <line x1="360" y1="280" x2="360" y2="110" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="288" y="66" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="360" y="87" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">气候</text>
    <text x="360" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 生物圈完整性 超限 -->
  <g>
    <line x1="360" y1="280" x2="469" y2="150" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="409" y="120" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="481" y="141" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">生物圈完整性</text>
    <text x="481" y="161" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 土地系统 超限 -->
  <g>
    <line x1="360" y1="280" x2="527" y2="250" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="455" y="220" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="527" y="241" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">土地系统</text>
    <text x="527" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 淡水 超限 -->
  <g>
    <line x1="360" y1="280" x2="507" y2="365" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="435" y="350" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="507" y="371" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">淡水</text>
    <text x="507" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 生物地球化学流 超限 -->
  <g>
    <line x1="360" y1="280" x2="418" y2="440" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="346" y="430" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="418" y="451" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">生物地球化学流</text>
    <text x="418" y="471" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 新型实体 超限 -->
  <g>
    <line x1="360" y1="280" x2="302" y2="440" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
    <rect x="230" y="430" width="144" height="52" rx="8" fill="#c0392b"/>
    <text x="302" y="451" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">新型实体</text>
    <text x="302" y="471" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">超限</text>
  </g>
  <!-- 海洋酸化 风险 -->
  <g>
    <line x1="360" y1="280" x2="213" y2="365" stroke="#e67e22" stroke-width="1.5" opacity="0.5"/>
    <rect x="141" y="350" width="144" height="52" rx="8" fill="#e67e22"/>
    <text x="213" y="371" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">海洋酸化</text>
    <text x="213" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">风险上升</text>
  </g>
  <!-- 气溶胶 风险 -->
  <g>
    <line x1="360" y1="280" x2="193" y2="250" stroke="#e67e22" stroke-width="1.5" opacity="0.5"/>
    <rect x="121" y="220" width="144" height="52" rx="8" fill="#e67e22"/>
    <text x="193" y="241" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">大气气溶胶</text>
    <text x="193" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">风险上升</text>
  </g>
  <!-- 平流层臭氧 安全 -->
  <g>
    <line x1="360" y1="280" x2="251" y2="150" stroke="#2e8b57" stroke-width="1.5" opacity="0.5"/>
    <rect x="161" y="120" width="180" height="52" rx="8" fill="#2e8b57"/>
    <text x="251" y="141" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fff">平流层臭氧层</text>
    <text x="251" y="161" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">安全范围</text>
  </g>

  <!-- 图例 -->
  <g font-family="sans-serif" font-size="13" fill="#333">
    <rect x="180" y="516" width="14" height="14" rx="3" fill="#c0392b"/>
    <text x="200" y="527">已超限（高不确定性风险）</text>
    <rect x="330" y="516" width="14" height="14" rx="3" fill="#e67e22"/>
    <text x="350" y="527">风险上升</text>
    <rect x="470" y="516" width="14" height="14" rx="3" fill="#2e8b57"/>
    <text x="490" y="527">安全范围</text>
  </g>
</svg>
