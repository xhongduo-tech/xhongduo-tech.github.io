<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>赛道存储：纳米线上的磁畴壁与读头</title>
  <desc>一条水平纳米线上交替排列着磁化方向相反的磁畴，畴壁是它们之间的过渡区。电流推动全部畴壁向右移动，固定的读头依次读出每一个比特。</desc>
  <rect x="0" y="0" width="720" height="380" fill="#faf9f5"/>
  <text x="360" y="44" text-anchor="middle" font-size="16" fill="#333">赛道存储：畴壁是比特，电流是传送带</text>

  <rect x="60" y="150" width="600" height="40" fill="#e8e2d5" stroke="#333" stroke-width="1.5"/>
  <rect x="180" y="150" width="20" height="40" fill="#b8b2a7"/>
  <rect x="320" y="150" width="20" height="40" fill="#b8b2a7"/>
  <rect x="460" y="150" width="20" height="40" fill="#b8b2a7"/>
  <text x="190" y="138" text-anchor="middle" font-size="13" fill="#333">畴壁</text>
  <text x="330" y="138" text-anchor="middle" font-size="13" fill="#333">畴壁</text>
  <text x="470" y="138" text-anchor="middle" font-size="13" fill="#333">畴壁</text>

  <g font-size="22" fill="#333">
    <text x="90" y="178">→</text><text x="125" y="178">→</text><text x="160" y="178">→</text>
    <text x="225" y="178">←</text><text x="260" y="178">←</text><text x="295" y="178">←</text>
    <text x="365" y="178">→</text><text x="400" y="178">→</text><text x="435" y="178">→</text>
    <text x="505" y="178">←</text><text x="540" y="178">←</text><text x="575" y="178">←</text><text x="610" y="178">←</text>
  </g>

  <rect x="345" y="70" width="70" height="44" fill="#1f6f8b" opacity="0.9"/>
  <text x="380" y="90" text-anchor="middle" font-size="14" fill="#faf9f5">读头</text>
  <text x="380" y="108" text-anchor="middle" font-size="13" fill="#faf9f5">MTJ</text>
  <line x1="380" y1="114" x2="380" y2="150" stroke="#1f6f8b" stroke-width="2"/>

  <path d="M120 260 L280 260 L280 252 L310 268 L280 284 L280 276 L120 276 Z" fill="#c0392b"/>
  <text x="215" y="316" text-anchor="middle" font-size="14" fill="#c0392b">电流脉冲推动畴壁向右移动</text>
  <text x="360" y="350" text-anchor="middle" font-size="14" fill="#333">每个磁畴 = 一个比特，读头逐位读出</text>
</svg>
