<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>磁隧道结：平行态与反平行态的隧穿强度</title>
  <desc>磁隧道结由铁磁层 FM1、绝缘势垒层与铁磁层 FM2 构成。平行态时自旋极化隧穿强、电阻低；反平行态时隧穿被抑制、电阻高。</desc>
  <rect x="0" y="0" width="720" height="380" fill="#faf9f5"/>
  <text x="180" y="48" text-anchor="middle" font-size="16" fill="#333">平行态（P）：隧穿强，电阻低</text>
  <text x="540" y="48" text-anchor="middle" font-size="16" fill="#333">反平行态（AP）：隧穿被抑制，电阻高</text>
  <text x="180" y="330" text-anchor="middle" font-size="14" fill="#1f6f8b">多数自旋的终态空位多，隧穿概率大</text>
  <text x="540" y="330" text-anchor="middle" font-size="14" fill="#1f6f8b">初终态自旋失配，隧穿概率被压低</text>
  <text x="360" y="366" text-anchor="middle" font-size="15" fill="#c0392b">TMR 比 = (R_AP − R_P) / R_P</text>

  <g fill="#c0392b" opacity="0.82">
    <rect x="70" y="80" width="220" height="60"/>
    <rect x="70" y="156" width="220" height="60"/>
    <rect x="430" y="80" width="220" height="60"/>
    <rect x="430" y="156" width="220" height="60"/>
  </g>
  <rect x="70" y="140" width="220" height="16" fill="#d4c9a8"/>
  <rect x="430" y="140" width="220" height="16" fill="#d4c9a8"/>

  <g fill="#1f6f8b">
    <path d="M133 152 L133 104 L127 104 L140 84 L153 104 L147 104 L147 152 Z"/>
    <path d="M193 152 L193 104 L187 104 L200 84 L213 104 L207 104 L207 152 Z"/>
    <path d="M253 152 L253 104 L247 104 L260 84 L273 104 L267 104 L267 152 Z"/>
  </g>
  <g fill="#b8b2a7">
    <path d="M493 152 L493 104 L489 104 L500 92 L511 104 L507 104 L507 152 Z"/>
    <path d="M553 152 L553 104 L549 104 L560 92 L571 104 L567 104 L567 152 Z"/>
    <path d="M613 152 L613 104 L609 104 L620 92 L631 104 L627 104 L627 152 Z"/>
  </g>

  <text x="70" y="250" font-size="14" fill="#333">FM2（自由层）</text>
  <text x="70" y="268" font-size="14" fill="#333">绝缘势垒（如 MgO）</text>
  <text x="70" y="286" font-size="14" fill="#333">FM1（被钉扎层）</text>
</svg>
