<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>巨磁电阻多层膜结构：平行态与反平行态</title>
  <desc>左图为自旋平行排列的磁性多层膜 Fe/Cr，多数自旋通道畅通，总电阻低；右图为反平行排列，两种自旋都被散射，总电阻高。</desc>
  <rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>
  <text x="40" y="76" font-size="14" fill="#333">铁磁层 Fe（箭头为磁化方向）</text>
  <text x="410" y="76" font-size="14" fill="#333">非磁间隔层 Cr</text>
  <text x="170" y="320" text-anchor="middle" font-size="16" fill="#333">平行态（P）：电阻低</text>
  <text x="540" y="320" text-anchor="middle" font-size="16" fill="#333">反平行态（AP）：电阻高</text>
  <text x="170" y="352" text-anchor="middle" font-size="14" fill="#1f6f8b">多数自旋通道畅通，电流「抄近路」</text>
  <text x="540" y="352" text-anchor="middle" font-size="14" fill="#1f6f8b">两种自旋都被散射，电流「处处碰壁」</text>
  <text x="360" y="398" text-anchor="middle" font-size="15" fill="#c0392b">GMR 比 = (R_AP − R_P) / R_P</text>

  <g fill="#c0392b" opacity="0.85">
