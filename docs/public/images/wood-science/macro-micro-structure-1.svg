<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>木材的三个基本切面</title>
<desc>一根横放的圆木，左端为横切面（年轮、髓心、树皮），上方标出过髓心的径切面与不过髓心的弦切面。</desc>
<rect width="640" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">
<!-- 圆木主体 -->
<ellipse cx="180" cy="240" rx="40" ry="120" fill="#d8c9a3" stroke="#333" stroke-width="2"/>
<path d="M180 120 L560 120" stroke="#333" stroke-width="2"/>
<path d="M180 360 L560 360" stroke="#333" stroke-width="2"/>
<path d="M560 120 A40 120 0 0 0 560 360" fill="none" stroke="#333" stroke-width="2"/>
<path d="M180 120 A40 120 0 0 1 180 360" fill="none" stroke="#333" stroke-width="2"/>
<!-- 横切面年轮 -->
<g fill="none" stroke="#b6893a" stroke-width="2">
<ellipse cx="180" cy="240" rx="18" ry="70"/>
<ellipse cx="180" cy="240" rx="12" ry="55"/>
<ellipse cx="180" cy="240" rx="7" ry="38"/>
<ellipse cx="180" cy="240" rx="4" ry="22"/>
</g>
<!-- 髓心 -->
<circle cx="180" cy="240" r="3.5" fill="#333"/>
<!-- 树皮条带 -->
<path d="M560 116 A44 124 0 0 0 560 364" fill="none" stroke="#7a5c2e" stroke-width="8" opacity="0.6"/>
<!-- 径切面（过髓心的竖直虚线） -->
<line x1="180" y1="70" x2="180" y2="410" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="180" y="62" text-anchor="middle" font-size="17" fill="#c0392b"><tspan font-weight="bold">径切面</tspan>（过髓心）</text>
<!-- 弦切面（不过髓心的竖直虚线） -->
<line x1="360" y1="70" x2="360" y2="410" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="360" y="62" text-anchor="middle" font-size="17" fill="#1f6f8b"><tspan font-weight="bold">弦切面</tspan>（切于年轮）</text>
<!-- 标签 -->
<text x="120" y="395" font-size="15">横切面</text>
<text x="190" y="395" font-size="15">（生长轮、心边材）</text>
<text x="540" y="160" font-size="15">树干轴向</text>
<line x1="540" y1="168" x2="540" y2="184" stroke="#333" stroke-width="2" marker-end="url(#arw)"/>
</g>
<defs>
<marker id="arw" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
</defs>
</svg>
