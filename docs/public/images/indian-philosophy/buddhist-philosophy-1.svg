<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="sans-serif">
  <title>十二因缘：流转与还灭</title>
  <desc>十二因缘顺观为流转链，由无明到老死；逆观则还灭，断无明即断轮回。</desc>
  <rect x="0" y="0" width="800" height="390" fill="#faf9f5"/>

  <text x="400" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">十二因缘：顺观流转，逆观还灭</text>

  <!-- row 1: 无明 行 识 名色 -->
  <g>
    <rect x="60" y="44" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="135" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">无明</text>
    <rect x="230" y="44" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="305" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">行</text>
    <rect x="400" y="44" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="475" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">识</text>
    <rect x="570" y="44" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="645" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">名色</text>
  </g>
  <g fill="#c0392b">
    <polygon points="230,66 216,60 216,72"/>
    <polygon points="400,66 386,60 386,72"/>
    <polygon points="570,66 556,60 556,72"/>
  </g>
  <line x1="570" y1="88" x2="570" y2="154" stroke="#c0392b" stroke-width="2"/>
  <polygon points="570,154 564,142 576,142" fill="#c0392b"/>

  <!-- row 2: 六入 触 受 爱 (right to left) -->
  <g>
    <rect x="570" y="158" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="645" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">六入</text>
    <rect x="400" y="158" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="475" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">触</text>
    <rect x="230" y="158" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="305" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">受</text>
    <rect x="60" y="158" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="135" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">爱</text>
  </g>
  <g fill="#c0392b">
    <polygon points="570,180 584,174 584,186"/>
    <polygon points="400,180 414,174 414,186"/>
    <polygon points="230,180 244,174 244,186"/>
  </g>
  <line x1="135" y1="202" x2="135" y2="268" stroke="#c0392b" stroke-width="2"/>
  <polygon points="135,268 129,256 141,256" fill="#c0392b"/>

  <!-- row 3: 取 有 生 老死 -->
  <g>
    <rect x="60" y="272" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="135" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">取</text>
    <rect x="230" y="272" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="305" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">有</text>
    <rect x="400" y="272" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="475" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">生</text>
    <rect x="570" y="272" width="150" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="645" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">老死</text>
  </g>
  <g fill="#c0392b">
    <polygon points="230,294 216,288 216,300"/>
    <polygon points="400,294 386,288 386,300"/>
    <polygon points="570,294 556,288 556,300"/>
  </g>

  <!-- closing arrow: 老死 -> 无明 -->
  <path d="M 720,294 C 790,294 790,66 210,66" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="210,66 226,60 226,72" fill="#1f6f8b"/>
  <text x="762" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b" transform="rotate(90 762 190)">还灭</text>

  <text x="400" y="352" text-anchor="middle" font-size="13" fill="#666">顺观：无明→老死，轮回流转；逆观还灭：断无明，则老死亦断</text>
  <text x="400" y="374" text-anchor="middle" font-size="13" fill="#666">「此有故彼有，此无故彼无」——《相应部》</text>
</svg>
