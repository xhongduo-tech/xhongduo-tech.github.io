<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>四种常见 RAID 级别布局</title>
  <desc>对比 RAID-0 条带化、RAID-1 镜像、RAID-5 分布式奇偶校验、RAID-10 镜像加条带四种布局下四块磁盘上的数据块分布。</desc>
  <rect x="0" y="0" width="760" height="560" fill="#faf9f5"/>
  <g fill="#333" font-size="15">
    <text x="20" y="38">RAID-0 条带</text>
    <text x="20" y="168">RAID-1 镜像</text>
    <text x="20" y="298">RAID-5 分布奇偶</text>
    <text x="20" y="428">RAID-10 镜像+条带</text>
  </g>
  <g id="disks">
    <g>
      <text x="115" y="20" font-size="13" fill="#1f6f8b">磁盘0</text>
      <text x="255" y="20" font-size="13" fill="#1f6f8b">磁盘1</text>
      <text x="395" y="20" font-size="13" fill="#1f6f8b">磁盘2</text>
      <text x="535" y="20" font-size="13" fill="#1f6f8b">磁盘3</text>
    </g>
  </g>
  <g id="raid0" font-size="14" text-anchor="middle">
    <g>
      <rect x="80" y="42" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="69" fill="#333">A0</text>
      <rect x="80" y="84" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="111" fill="#333">B0</text>
    </g>
    <g>
      <rect x="220" y="42" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="69" fill="#333">A1</text>
      <rect x="220" y="84" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="111" fill="#333">B1</text>
    </g>
    <g>
      <rect x="360" y="42" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="69" fill="#333">A2</text>
      <rect x="360" y="84" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="111" fill="#333">B2</text>
    </g>
    <g>
      <rect x="500" y="42" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="69" fill="#333">A3</text>
      <rect x="500" y="84" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="111" fill="#333">B3</text>
    </g>
  </g>
  <g id="raid1" font-size="14" text-anchor="middle">
    <g>
      <rect x="80" y="172" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="199" fill="#333">A0</text>
      <rect x="80" y="214" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="241" fill="#333">A1</text>
    </g>
    <g>
      <rect x="220" y="172" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="199" fill="#333">B0</text>
      <rect x="220" y="214" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="241" fill="#333">B1</text>
    </g>
    <g>
      <rect x="360" y="172" width="130" height="42" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="199" fill="#c0392b">A0'</text>
      <rect x="360" y="214" width="130" height="42" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="241" fill="#c0392b">A1'</text>
    </g>
    <g>
      <rect x="500" y="172" width="130" height="42" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="199" fill="#c0392b">B0'</text>
      <rect x="500" y="214" width="130" height="42" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="241" fill="#c0392b">B1'</text>
    </g>
  </g>
  <g id="raid5" font-size="14" text-anchor="middle">
    <g>
      <rect x="80" y="302" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="326" fill="#333">A0</text>
      <rect x="80" y="338" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="362" fill="#333">B0</text>
      <rect x="80" y="374" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="398" fill="#333">C0</text>
    </g>
    <g>
      <rect x="220" y="302" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="326" fill="#333">A1</text>
      <rect x="220" y="338" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="362" fill="#333">B1</text>
      <rect x="220" y="374" width="130" height="36" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="398" fill="#c0392b">P2</text>
    </g>
    <g>
      <rect x="360" y="302" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="326" fill="#333">A2</text>
      <rect x="360" y="338" width="130" height="36" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="362" fill="#c0392b">P1</text>
      <rect x="360" y="374" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="398" fill="#333">C1</text>
    </g>
    <g>
      <rect x="500" y="302" width="130" height="36" fill="#e8eef0" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="326" fill="#c0392b">P0</text>
      <rect x="500" y="338" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="362" fill="#333">B2</text>
      <rect x="500" y="374" width="130" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="398" fill="#333">C2</text>
    </g>
  </g>
  <g id="raid10" font-size="14" text-anchor="middle">
    <g>
      <rect x="80" y="432" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="459" fill="#333">A0</text>
      <rect x="80" y="474" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="145" y="501" fill="#333">A2</text>
    </g>
    <g>
      <rect x="220" y="432" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="459" fill="#333">A0</text>
      <rect x="220" y="474" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="285" y="501" fill="#333">A2</text>
    </g>
    <g>
      <rect x="360" y="432" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="459" fill="#333">A1</text>
      <rect x="360" y="474" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="425" y="501" fill="#333">A3</text>
    </g>
    <g>
      <rect x="500" y="432" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="459" fill="#333">A1</text>
      <rect x="500" y="474" width="130" height="42" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <text x="565" y="501" fill="#333">A3</text>
    </g>
  </g>
  <g font-size="13" fill="#555">
    <text x="80" y="536">数据块：白底   A0' = A0 的镜像副本    P = 奇偶校验块</text>
    <text x="80" y="554" fill="#c0392b">镜像 / 校验块：灰底</text>
  </g>
</svg>
