<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>模拟医学教育的保真度光谱</title>
  <desc>从低保真到高保真的四类模拟方式：基础操作模型、标准化病人、高仿真模拟人、虚拟现实，以及它们擅长训练的内容与典型器材。</desc>
  <rect width="800" height="420" fill="#faf9f5"/>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">模拟医学教育的保真度光谱</text>
  <text x="400" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">从「局部手感」到「沉浸环境」，保真度逐级升高</text>

  <!-- 光谱箭头 -->
  <line x1="90" y1="180" x2="710" y2="180" stroke="#1f6f8b" stroke-width="4"/>
  <polygon points="710,172 730,180 710,188" fill="#1f6f8b"/>
  <text x="90" y="205" font-family="sans-serif" font-size="14" fill="#666">低保真 · 低成本</text>
  <text x="600" y="205" font-family="sans-serif" font-size="14" fill="#666">高保真 · 高成本</text>

  <!-- 四档位方块 -->
  <g>
    <rect x="70" y="130" width="150" height="44" rx="8" fill="#1f6f8b"/>
    <text x="145" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">基础操作模型</text>
    <text x="145" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">穿刺手臂 · 缝合垫</text>
    <text x="145" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">单项操作性技能</text>
  </g>
  <g>
    <rect x="240" y="130" width="150" height="44" rx="8" fill="#2e8b74"/>
    <text x="315" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">标准化病人</text>
    <text x="315" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">受过训练的演员</text>
    <text x="315" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">问诊 · 沟通 · 体检</text>
  </g>
  <g>
    <rect x="410" y="130" width="150" height="44" rx="8" fill="#c07b2b"/>
    <text x="485" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">高仿真模拟人</text>
    <text x="485" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">高级人体模型</text>
    <text x="485" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">急救 · 团队协作</text>
  </g>
  <g>
    <rect x="580" y="130" width="150" height="44" rx="8" fill="#c0392b"/>
    <text x="655" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">虚拟现实 / MR</text>
    <text x="655" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">VR 设备 · 3D 场景</text>
    <text x="655" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">复杂环境 · 罕见灾难</text>
  </g>

  <!-- 底部结论条 -->
  <rect x="90" y="310" width="620" height="70" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="400" y="338" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">选用原则：让保真度等于「目标行为对真实感的最低要求」</text>
  <text x="400" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">练缝合看手感，练沟通看表情，练复苏看应激——各取所需</text>
</svg>
