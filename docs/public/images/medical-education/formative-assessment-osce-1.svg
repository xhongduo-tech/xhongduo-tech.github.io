<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460">
  <title>Miller 能力评估金字塔</title>
  <desc>Miller 金字塔将临床能力分为四层：知道、知道如何、展示如何、实际做，越往上越接近真实实践，对应的评价方法也越复杂。</desc>
  <rect width="560" height="460" fill="#faf9f5"/>
  <text x="280" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">Miller 能力评估金字塔</text>
  <text x="280" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">越往上越接近真实实践 · 越难可靠测量</text>

  <!-- 顶层：实际做 -->
  <polygon points="280,100 470,200 90,200" fill="#c0392b"/>
  <text x="280" y="146" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">实际做（does）</text>
  <text x="280" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">工作场所观察评价</text>

  <!-- 第三层：展示如何 -->
  <polygon points="280,200 480,290 80,290" fill="#c07b2b"/>
  <text x="280" y="246" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">展示如何（shows how）</text>
  <text x="280" y="272" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">OSCE · 模拟演练</text>

  <!-- 第二层：知道如何 -->
  <polygon points="280,290 490,380 70,380" fill="#2e8b74"/>
  <text x="280" y="336" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">知道如何（knows how）</text>
  <text x="280" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">论述题 · 口试</text>

  <!-- 底层：知道 -->
  <polygon points="280,380 500,470 60,470" fill="#1f6f8b"/>
  <text x="280" y="426" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">知道（knows）</text>
  <text x="280" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">多选题笔试</text>
</svg>
