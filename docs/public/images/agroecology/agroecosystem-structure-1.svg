<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <title>农业生态系统的等级结构</title>
  <desc>从生物圈、景观、生态系统、群落、种群到个体六级套嵌的等级结构示意，每一层包含下一层。</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <!-- 生物圈 -->
  <rect x="80" y="20" width="480" height="70" rx="8" fill="#1f6f8b" opacity="0.16"/>
  <text x="320" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">生物圈 Biosphere</text>
  <text x="320" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">全球生命与环境的整体</text>
  <text x="320" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（本图的最外层「箱子」）</text>
  <!-- 景观 -->
  <rect x="150" y="105" width="340" height="62" rx="8" fill="#1f6f8b" opacity="0.3"/>
  <text x="320" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold">景观 Landscape</text>
  <text x="320" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">田块—田埂—林带—水体的空间镶嵌</text>
  <!-- 生态系统 -->
  <rect x="205" y="182" width="230" height="58" rx="8" fill="#c0392b" opacity="0.18"/>
  <text x="320" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold">生态系统 Ecosystem</text>
  <text x="320" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">群落 + 非生物环境</text>
  <!-- 群落 -->
  <rect x="250" y="255" width="140" height="52" rx="8" fill="#c0392b" opacity="0.34"/>
  <text x="320" y="277" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">群落 Community</text>
  <text x="320" y="297" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">多种群相互作用</text>
  <!-- 种群 -->
  <rect x="280" y="322" width="80" height="46" rx="8" fill="#c0392b" opacity="0.52"/>
  <text x="320" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">种群 Population</text>
  <text x="320" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">同种个体群</text>
  <!-- 个体 -->
  <rect x="300" y="383" width="40" height="40" rx="20" fill="#c0392b" opacity="0.75"/>
  <text x="320" y="407" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold">个体 Organism</text>
  <!-- 箭头标注嵌套方向 -->
  <line x1="560" y1="55" x2="560" y2="403" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="240" font-family="sans-serif" font-size="13" fill="#333">尺度放大，逐级嵌套</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
