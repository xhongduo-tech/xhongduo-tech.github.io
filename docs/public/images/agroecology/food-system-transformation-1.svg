<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <title>食物系统转型的五个层次</title>
  <desc>格利斯曼提出的食物系统转型五级阶梯：从提高效率、替代投入、重新设计、重建联系到建立新食物系统，逐级递进。</desc>
  <rect x="0" y="0" width="640" height="560" fill="#faf9f5"/>
  <!-- 阶梯底座 -->
  <polygon points="60,520 580,520 540,470 100,470" fill="#1f6f8b" opacity="0.12"/>
  <text x="320" y="540" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">转型越往上，改变越根本，也越需要全社会的协同</text>

  <!-- 第一级 -->
  <rect x="180" y="430" width="280" height="40" rx="6" fill="#1f6f8b"/>
  <text x="320" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">第 1 级 · 提高常规农业的效率</text>
  <text x="320" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">精量施肥、节水、减少浪费</text>

  <!-- 第二级 -->
  <rect x="160" y="372" width="320" height="40" rx="6" fill="#1f6f8b" opacity="0.85"/>
  <text x="320" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">第 2 级 · 用可持续实践替代常规投入</text>
  <text x="320" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">有机肥、覆盖作物、生物防治替代化肥农药</text>

  <!-- 第三级 -->
  <rect x="140" y="314" width="360" height="40" rx="6" fill="#c0392b" opacity="0.55"/>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">第 3 级 · 重新设计农业生态系统</text>
  <text x="320" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">按生态过程设计：多样性、闭环循环、景观布局</text>

  <!-- 第四级 -->
  <rect x="120" y="256" width="400" height="40" rx="6" fill="#c0392b" opacity="0.7"/>
  <text x="320" y="272" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">第 4 级 · 重建生产者与消费者的直接联系</text>
  <text x="320" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">本地食物体系、社区支持农业（CSA）、缩短链条</text>

  <!-- 第五级 -->
  <rect x="100" y="198" width="440" height="40" rx="6" fill="#c0392b" opacity="0.9"/>
  <text x="320" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">第 5 级 · 建立全新的全球食物系统</text>
  <text x="320" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">公平、伦理、可持续与食物的系统治理</text>

  <!-- 上升箭头 -->
  <line x1="90" y1="450" x2="90" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
