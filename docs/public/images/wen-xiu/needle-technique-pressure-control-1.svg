<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>纹眉进针角度与深度示意</title>
<desc>左侧示意垂直进针、中斜进针、斜刺进针三种角度与皮肤三层的关系；右侧标出理想落色带位于表皮基底层与真皮乳头层交界处。</desc>
<rect width="640" height="400" fill="#faf9f5"/>
<!-- 左侧：皮肤三层 -->
<text x="30" y="40" font-size="15" fill="#333" font-weight="bold">皮肤三层结构</text>
<rect x="30" y="60" width="300" height="70" fill="#f0dcc9" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="95" font-size="14" fill="#333">表皮（角质层→基底层）</text>
<rect x="30" y="130" width="300" height="40" fill="#e8b9a8" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="155" font-size="14" fill="#333">真皮乳头层</text>
<rect x="30" y="170" width="300" height="70" fill="#d99a86" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="205" font-size="14" fill="#fff">真皮网状层</text>
<rect x="30" y="240" width="300" height="60" fill="#f0c9a8" stroke="#c0392b" stroke-width="1.5"/>
<text x="40" y="270" font-size="14" fill="#333">皮下组织（不应到达）</text>
<!-- 理想落色带标记 -->
<line x1="30" y1="130" x2="330" y2="130" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="6 4"/>
<text x="110" y="125" font-size="14" fill="#1f6f8b" font-weight="bold">理想落色带</text>
<!-- 左侧：三种进针角度 -->
<text x="30" y="330" font-size="15" fill="#333" font-weight="bold">三种进针角度</text>
<!-- 垂直进针 90° -->
<line x1="110" y1="335" x2="110" y2="300" stroke="#1f6f8b" stroke-width="3"/>
<circle cx="110" cy="300" r="4" fill="#c0392b"/>
<text x="88" y="355" font-size="13" fill="#333">垂直 90°</text>
<!-- 中斜进针 45° -->
<line x1="180" y1="335" x2="205" y2="308" stroke="#1f6f8b" stroke-width="3"/>
<circle cx="205" cy="308" r="4" fill="#c0392b"/>
<text x="160" y="355" font-size="13" fill="#333">中斜 45°</text>
<!-- 斜刺进针 15° -->
<line x1="250" y1="335" x2="285" y2="312" stroke="#1f6f8b" stroke-width="3"/>
<circle cx="285" cy="312" r="4" fill="#c0392b"/>
<text x="238" y="355" font-size="13" fill="#333">斜刺 15°</text>
<line x1="90" y1="310" x2="300" y2="310" stroke="#333" stroke-width="1"/>
<text x="300" y="330" font-size="13" fill="#333">皮肤表面</text>
<!-- 右侧：深度说明 -->
<text x="390" y="40" font-size="15" fill="#333" font-weight="bold">深浅与后果</text>
<g font-size="14" fill="#333">
<text x="390" y="75">过浅：色淡易脱，数周褪尽</text>
<text x="390" y="110" fill="#1f6f8b" font-weight="bold">正好：微量渗血，留色 1–3 年</text>
<text x="390" y="145">偏深：出血、晕色、发蓝</text>
<text x="390" y="180" fill="#c0392b" font-weight="bold">过深：留疤、难清除</text>
</g>
<!-- 右侧竖轴示意 -->
<line x1="380" y1="60" x2="380" y2="190" stroke="#333" stroke-width="1.5"/>
<line x1="370" y1="60" x2="390" y2="60" stroke="#333" stroke-width="1"/>
<line x1="370" y1="190" x2="390" y2="190" stroke="#333" stroke-width="1"/>
<text x="360" y="55" font-size="13" fill="#333">浅</text>
<text x="360" y="205" font-size="13" fill="#333">深</text>
<rect x="375" y="96" width="10" height="24" fill="#1f6f8b"/>
<text x="405" y="205" font-size="14" fill="#333">深度刻度（示意）</text>
</svg>
