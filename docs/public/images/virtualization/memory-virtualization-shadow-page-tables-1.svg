<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="title desc">
  <title>影子页表：客户页表与 VMM 页表合成一张影子表喂给硬件</title>
  <desc>左侧为客户页表（GVA 到 GPA），客户操作系统认为 GPA 就是物理内存；右侧为 VMM 内存映射（GPA 到 HPA）。VMM 将两者合成影子页表（GVA 到 HPA）直接喂给 MMU，硬件只走一层翻译。客户操作系统写客户页表时触发写保护缺页，VMM 同步影子表。</desc>
  <style>
    text { font-family: sans-serif; fill: #333; }
    .box { stroke: #333; stroke-width: 1.5; }
    .accent { fill: #c0392b; }
    .cyan { fill: #1f6f8b; }
    .soft { fill: #e7eef2; }
    .shad { fill: #f2e6de; }
    .hwbox { fill: #efe8dd; }
  </style>
  <rect x="0" y="0" width="680" height="440" fill="#faf9f5"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold">影子页表：两级翻译合成一层</text>

  <!-- 客户页表 -->
  <rect class="box soft" x="40" y="60" width="180" height="44" rx="4"/>
  <text x="130" y="80" text-anchor="middle" font-size="14" font-weight="bold">客户页表</text>
  <text x="130" y="97" text-anchor="middle" font-size="12">GVA → GPA（假物理地址）</text>

  <!-- VMM 映射 -->
  <rect class="box soft" x="40" y="140" width="180" height="44" rx="4"/>
  <text x="130" y="160" text-anchor="middle" font-size="14" font-weight="bold">VMM 内存映射</text>
  <text x="130" y="177" text-anchor="middle" font-size="12">GPA → HPA（真实地址）</text>

  <!-- 影子页表 -->
  <rect class="box shad" x="250" y="100" width="200" height="56" rx="4"/>
  <text x="350" y="124" text-anchor="middle" font-size="15" font-weight="bold">影子页表</text>
  <text x="350" y="144" text-anchor="middle" font-size="13" class="accent">GVA → HPA（合成结果）</text>

  <!-- MMU -->
  <rect class="box hwbox" x="480" y="104" width="150" height="48" rx="4"/>
  <text x="555" y="125" text-anchor="middle" font-size="14" font-weight="bold">MMU / TLB</text>
  <text x="555" y="143" text-anchor="middle" font-size="12">只走一层翻译</text>

  <!-- 合成箭头 -->
  <path d="M 220 82 L 246 116" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr1)"/>
  <path d="M 220 162 L 246 140" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr1)"/>
  <text x="196" y="112" font-size="12" class="accent" text-anchor="end">合成</text>

  <!-- MMU 使用影子表 -->
  <path d="M 450 128 L 476 128" fill="none" stroke="#1f6f8b" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="463" y="120" text-anchor="middle" font-size="12" class="cyan">TLB 填充</text>

  <!-- 同步回路 -->
  <path d="M 350 160 L 350 240" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 350 240 L 130 240 L 130 186" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="130" y="232" text-anchor="start" font-size="12">客户 OS 写客户页表 →</text>
  <text x="130" y="248" text-anchor="start" font-size="12">写保护缺页 → VMM 同步影子表</text>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c0392b"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 底部说明 -->
  <rect x="40" y="360" width="600" height="58" rx="6" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="60" y="384" font-size="13" class="cyan" font-weight="bold">关键代价</text>
  <text x="60" y="404" font-size="12">读路径：TLB 填充仍是一层页表（不额外变慢）；维护路径：每次写客户页表都触发写保护缺页 + 同步</text>
</svg>
