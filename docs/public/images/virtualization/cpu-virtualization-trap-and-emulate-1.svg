<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-labelledby="title desc">
  <title>陷入模拟：客户机特权指令触发陷阱，VMM 代为处理</title>
  <desc>特权环示意：最内环为 VMM（ring -1），其外为客户机操作系统（ring 0 降权），最外为用户态（ring 3）。客户机操作系统执行特权指令时因权限不足触发陷阱（trap），进入 VMM；VMM 模拟指令后执行 VM resume 返回客户机。</desc>
  <style>
    text { font-family: sans-serif; fill: #333; }
    .ring { stroke: #333; stroke-width: 1.5; fill: none; }
    .vmm { fill: #f2e6de; }
    .guest { fill: #e7eef2; }
    .user { fill: #eef2e7; }
    .accent { fill: #c0392b; }
    .cyan { fill: #1f6f8b; }
  </style>
  <rect x="0" y="0" width="680" height="430" fill="#faf9f5"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold">陷入模拟（Trap-and-Emulate）</text>

  <!-- 特权环：同心圆 -->
  <circle class="ring vmm" cx="330" cy="215" r="52"/>
  <text x="330" y="205" text-anchor="middle" font-size="14" font-weight="bold">VMM</text>
  <text x="330" y="224" text-anchor="middle" font-size="13">ring −1</text>

  <circle class="ring guest" cx="330" cy="215" r="105"/>
  <text x="330" y="300" text-anchor="middle" font-size="14" font-weight="bold">客户机操作系统</text>
  <text x="330" y="318" text-anchor="middle" font-size="13">（降权 ring 0 → ring 1/3 语义）</text>

  <circle class="ring user" cx="330" cy="215" r="160"/>
  <text x="330" y="365" text-anchor="middle" font-size="14" font-weight="bold">客户机用户态应用</text>
  <text x="330" y="383" text-anchor="middle" font-size="13">ring 3</text>

  <!-- 标注：特权指令从客户机陷入 VMM -->
  <text x="560" y="120" font-size="14" class="accent" font-weight="bold">特权指令</text>
  <text x="560" y="138" font-size="13">（改页表、开关中断…）</text>
  <text x="560" y="158" font-size="13">因权限不足 → trap</text>
  <path d="M 560 170 L 560 220 L 386 240" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arred)"/>

  <!-- 标注：VMM 模拟后恢复客户机 -->
  <text x="545" y="300" font-size="14" class="cyan" font-weight="bold">VMM 模拟该指令</text>
  <text x="545" y="318" font-size="13">执行后 resume 客户机</text>
  <path d="M 386 258 L 545 330" fill="none" stroke="#1f6f8b" stroke-width="1.8" marker-end="url(#arrbl)"/>

  <defs>
    <marker id="arred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c0392b"/>
    </marker>
    <marker id="arrbl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 底部流程条 -->
  <rect x="60" y="400" width="560" height="26" rx="4" fill="#e7eef2" stroke="#333"/>
  <text x="70" y="418" font-size="13">条件：敏感指令 ⊆ 特权指令（Popek-Goldberg 定理）→ x86 在 VT-x 之前不满足</text>
</svg>
