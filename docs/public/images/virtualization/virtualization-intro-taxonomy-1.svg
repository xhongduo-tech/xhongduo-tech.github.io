<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="title desc">
  <title>虚拟化的两种基本类型：系统虚拟机与进程虚拟机</title>
  <desc>左侧为系统虚拟机：客户机软件、客户机操作系统运行在 VMM 之上，VMM 直接面对物理硬件；右侧为进程虚拟机：客户应用程序运行在虚拟化层（运行时）之上，其下是宿主操作系统与物理硬件。左侧接口为 ISA，右侧接口为 ABI/API。</desc>
  <style>
    text { font-family: sans-serif; fill: #333; }
    .layer { stroke: #333; stroke-width: 1.5; }
    .vmm { fill: #f2e6de; }
    .guest { fill: #e7eef2; }
    .host { fill: #eef2e7; }
    .hw { fill: #efe8dd; }
    .accent { fill: #c0392b; }
    .cyan { fill: #1f6f8b; }
  </style>
  <rect x="0" y="0" width="680" height="420" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="bold">虚拟化的两种基本类型</text>

  <!-- 左列：系统虚拟机 -->
  <text x="175" y="66" text-anchor="middle" font-size="16" font-weight="bold">系统虚拟机（system VM）</text>
  <g>
    <rect class="layer guest" x="55" y="78" width="240" height="40" rx="4"/>
    <text x="175" y="102" text-anchor="middle" font-size="14">客户机软件（Guest SW）</text>

    <rect class="layer guest" x="55" y="122" width="240" height="40" rx="4"/>
    <text x="175" y="146" text-anchor="middle" font-size="14">客户机操作系统（Guest OS）</text>

    <rect class="layer vmm" x="55" y="166" width="240" height="44" rx="4"/>
    <text x="175" y="185" text-anchor="middle" font-size="14" font-weight="bold">虚拟机监视器 VMM / Hypervisor</text>
    <text x="175" y="201" text-anchor="middle" font-size="13" class="cyan">虚拟化接口：ISA</text>

    <rect class="layer hw" x="55" y="214" width="240" height="40" rx="4"/>
    <text x="175" y="238" text-anchor="middle" font-size="14">物理硬件（CPU / 内存 / 设备）</text>
  </g>

  <!-- 右列：进程虚拟机 -->
  <text x="505" y="66" text-anchor="middle" font-size="16" font-weight="bold">进程虚拟机（process VM）</text>
  <g>
    <rect class="layer guest" x="385" y="78" width="240" height="40" rx="4"/>
    <text x="505" y="102" text-anchor="middle" font-size="14">客户应用程序（Guest App）</text>

    <rect class="layer vmm" x="385" y="122" width="240" height="44" rx="4"/>
    <text x="505" y="141" text-anchor="middle" font-size="14" font-weight="bold">虚拟化层 / 运行时（Runtime）</text>
    <text x="505" y="157" text-anchor="middle" font-size="13" class="accent">虚拟化接口：ABI / API</text>

    <rect class="layer host" x="385" y="170" width="240" height="40" rx="4"/>
    <text x="505" y="194" text-anchor="middle" font-size="14">宿主操作系统（Host OS）</text>

    <rect class="layer hw" x="385" y="214" width="240" height="40" rx="4"/>
    <text x="505" y="238" text-anchor="middle" font-size="14">物理硬件（CPU / 内存 / 设备）</text>
  </g>

  <!-- 底部说明 -->
  <text x="340" y="290" text-anchor="middle" font-size="14">客户是「一个程序」→ 进程虚拟机；客户是「整套操作系统」→ 系统虚拟机</text>
  <text x="340" y="318" text-anchor="middle" font-size="14">判断标准：被虚拟的是一层 ABI/API 世界，还是完整的 ISA 世界</text>

  <!-- 底部对比 -->
  <rect x="80" y="342" width="520" height="56" rx="6" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="100" y="366" font-size="14" class="cyan" font-weight="bold">典型代表</text>
  <text x="100" y="388" font-size="13">进程虚拟机：JVM、.NET CLR、Wine、Rosetta</text>
  <text x="330" y="388" font-size="13">系统虚拟机：VMware ESXi、Xen、KVM、Hyper-V、VirtualBox</text>
</svg>
