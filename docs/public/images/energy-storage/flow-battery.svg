<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>液流电池原理示意图</title>
  <desc>钒液流电池：两个电解液储罐通过泵把电解液打入中间的电池堆，电池堆内部由离子交换膜隔开正负极半电池。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">钒液流电池（VRFB）原理</text>

  <!-- 负极储罐 -->
  <rect x="40" y="140" width="130" height="120" rx="8" fill="#1f6f8b" opacity="0.55"/>
  <text x="105" y="190" text-anchor="middle" font-size="14" fill="#333">负极电解液</text>
  <text x="105" y="212" text-anchor="middle" font-size="13" fill="#333">V²⁺ / V³⁺</text>
  <text x="105" y="230" text-anchor="middle" font-size="13" fill="#333">（放电时氧化）</text>
  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#333">储罐（容量随体积增长）</text>

  <!-- 正极储罐 -->
  <rect x="470" y="140" width="130" height="120" rx="8" fill="#c0392b" opacity="0.55"/>
  <text x="535" y="190" text-anchor="middle" font-size="14" fill="#333">正极电解液</text>
  <text x="535" y="212" text-anchor="middle" font-size="13" fill="#333">VO²⁺ / VO₂⁺</text>
  <text x="535" y="230" text-anchor="middle" font-size="13" fill="#333">（放电时还原）</text>
  <text x="535" y="120" text-anchor="middle" font-size="13" fill="#333">储罐（能量与功率解耦）</text>

  <!-- 泵 -->
  <circle cx="200" cy="200" r="16" fill="none" stroke="#333" stroke-width="2"/>
  <polygon points="200,192 210,200 200,208 190,200" fill="#333"/>
  <text x="200" y="235" text-anchor="middle" font-size="13" fill="#333">泵</text>
  <circle cx="440" cy="200" r="16" fill="none" stroke="#333" stroke-width="2"/>
  <polygon points="440,192 450,200 440,208 430,200" fill="#333"/>
  <text x="440" y="235" text-anchor="middle" font-size="13" fill="#333">泵</text>

  <!-- 管路 -->
  <line x1="170" y1="150" x2="216" y2="186" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="184" x2="200" y2="160" stroke="#333" stroke-width="3" marker-end="url(#arrowB)"/>
  <line x1="424" y1="186" x2="470" y2="150" stroke="#333" stroke-width="3"/>
  <line x1="440" y1="184" x2="440" y2="160" stroke="#333" stroke-width="3" marker-end="url(#arrowB)"/>

  <!-- 电池堆 -->
  <rect x="250" y="120" width="140" height="170" rx="6" fill="#f5f1e8" stroke="#333" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">电池堆（电堆）</text>
  <text x="320" y="166" text-anchor="middle" font-size="13" fill="#333">功率随电堆面积增长</text>
  <!-- 膜 -->
  <rect x="312" y="180" width="16" height="95" fill="#c9c2b4"/>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#333">离子交换膜</text>
  <!-- 电堆内的电极 -->
  <rect x="260" y="180" width="48" height="95" fill="#1f6f8b" opacity="0.35"/>
  <rect x="332" y="180" width="48" height="95" fill="#c0392b" opacity="0.35"/>
  <text x="284" y="205" text-anchor="middle" font-size="13" fill="#333">负极</text>
  <text x="356" y="205" text-anchor="middle" font-size="13" fill="#333">正极</text>

  <!-- 外电路 -->
  <line x1="320" y1="120" x2="320" y2="90" stroke="#333" stroke-width="3"/>
  <rect x="290" y="74" width="60" height="22" rx="4" fill="none" stroke="#333" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="13" fill="#333">负载</text>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
  </defs>
</svg>
