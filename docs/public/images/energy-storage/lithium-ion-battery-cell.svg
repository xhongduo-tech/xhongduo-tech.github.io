<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>锂离子电池充放电原理示意图</title>
  <desc>锂离子电池剖面：充电时锂离子从正极脱嵌穿过隔膜嵌入负极，放电时反向移动，电子沿外电路流动。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">锂离子电池（摇椅电池）剖面</text>

  <!-- 外电路 -->
  <line x1="70" y1="60" x2="350" y2="60" stroke="#333" stroke-width="3"/>
  <rect x="180" y="48" width="60" height="24" rx="4" fill="none" stroke="#333" stroke-width="2"/>
  <text x="210" y="64" text-anchor="middle" font-size="14" fill="#333">负载 / 电源</text>
  <text x="205" y="46" font-size="14" fill="#c0392b">+</text>
  <text x="230" y="46" font-size="14" fill="#1f6f8b">−</text>
  <!-- 电子方向 -->
  <line x1="70" y1="60" x2="180" y2="60" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="240" y1="60" x2="350" y2="60" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="110" y="52" font-size="13" fill="#1f6f8b">电子 e⁻</text>

  <!-- 负极集流体 Cu -->
  <rect x="60" y="90" width="30" height="260" fill="#b8860b"/>
  <text x="75" y="380" text-anchor="middle" font-size="13" fill="#333">Cu 集流体</text>
  <text x="75" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">负极</text>

  <!-- 石墨负极 -->
  <rect x="90" y="90" width="120" height="260" fill="#4a4a4a"/>
  <text x="150" y="130" text-anchor="middle" font-size="14" fill="#faf9f5">石墨（负极）</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#faf9f5">充电时：Li⁺ 嵌入</text>

  <!-- 隔膜 -->
  <rect x="210" y="90" width="26" height="260" fill="#e8e3d8" stroke="#c9c2b4" stroke-width="1"/>
  <text x="223" y="210" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 223 210)">隔膜 + 电解液</text>

  <!-- 正极 LCO -->
  <rect x="236" y="90" width="110" height="260" fill="#c0392b"/>
  <text x="291" y="130" text-anchor="middle" font-size="14" fill="#faf9f5">LiCoO₂（正极）</text>
  <text x="291" y="150" text-anchor="middle" font-size="13" fill="#faf9f5">充电时：Li⁺ 脱嵌</text>

  <!-- 正极集流体 Al -->
  <rect x="346" y="90" width="30" height="260" fill="#d8d8d8"/>
  <text x="361" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">正极</text>
  <text x="361" y="380" text-anchor="middle" font-size="13" fill="#333">Al 集流体</text>

  <!-- Li+ 迁移箭头（穿过隔膜） -->
  <line x1="291" y1="200" x2="291" y2="260" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="150" y1="200" x2="150" y2="260" stroke="#1f6f8b" stroke-width="3"/>
  <text x="223" y="180" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">Li⁺（充电时向右穿过隔膜）</text>
  <text x="223" y="340" text-anchor="middle" font-size="13" fill="#c0392b">放电时 Li⁺ 向左回流，电子经外电路做功</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
