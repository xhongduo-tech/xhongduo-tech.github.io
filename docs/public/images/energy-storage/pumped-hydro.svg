<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>抽水蓄能系统示意图</title>
  <desc>抽水蓄能：上水库与下水库之间由输水管道连接水轮机/水泵机组，低谷时用电把水抽到上水库，高峰时放水发电。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">抽水蓄能（PHES）原理</text>

  <!-- 上水库 -->
  <path d="M 80 90 L 220 90 L 250 130 L 60 130 Z" fill="#1f6f8b" opacity="0.6"/>
  <text x="150" y="112" text-anchor="middle" font-size="14" fill="#faf9f5" font-weight="bold">上水库</text>
  <text x="155" y="150" text-anchor="middle" font-size="13" fill="#333">高处势能（≈ 山）</text>

  <!-- 输水管道 -->
  <line x1="250" y1="130" x2="320" y2="290" stroke="#333" stroke-width="6"/>
  <text x="330" y="230" text-anchor="middle" font-size="13" fill="#333">输水管道</text>
  <!-- 双向箭头 -->
  <line x1="255" y1="140" x2="315" y2="278" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrowP)"/>

  <!-- 机组 -->
  <rect x="300" y="290" width="90" height="45" rx="6" fill="#c0392b" opacity="0.8"/>
  <text x="345" y="318" text-anchor="middle" font-size="14" fill="#faf9f5">水轮机 / 水泵</text>
  <text x="345" y="355" text-anchor="middle" font-size="13" fill="#333">低谷：泵水蓄能；高峰：放水发电</text>

  <!-- 下水库 -->
  <path d="M 380 250 L 540 250 L 570 300 L 350 300 Z" fill="#1f6f8b" opacity="0.6"/>
  <text x="465" y="275" text-anchor="middle" font-size="14" fill="#faf9f5" font-weight="bold">下水库</text>

  <!-- 高度标注 -->
  <line x1="70" y1="90" x2="70" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="60" y1="90" x2="80" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="80" y2="300" stroke="#333" stroke-width="2"/>
  <text x="40" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 40 200)">水头差 h</text>

  <!-- 电网 -->
  <line x1="345" y1="290" x2="345" y2="395" stroke="#333" stroke-width="3"/>
  <text x="345" y="415" text-anchor="middle" font-size="13" fill="#333">电网</text>

  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
