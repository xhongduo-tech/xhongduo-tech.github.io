<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>质子交换膜燃料电池原理示意图</title>
  <desc>PEM 燃料电池：氢气在阳极催化层解离为质子与电子，质子穿过质子交换膜到阴极，电子经外电路做功，在阴极与氧气结合生成水。</desc>
  <defs>
    <marker id="arrowF" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">质子交换膜燃料电池（PEMFC）</text>

  <!-- 阳极流场板 -->
  <rect x="60" y="90" width="150" height="220" rx="6" fill="#f5f1e8" stroke="#333" stroke-width="2"/>
  <text x="135" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">阳极板（H₂ 流场）</text>
  <rect x="80" y="132" width="110" height="12" fill="#1f6f8b"/>
  <rect x="80" y="160" width="110" height="12" fill="#1f6f8b"/>
  <text x="135" y="190" text-anchor="middle" font-size="13" fill="#333">H₂ 通道</text>

  <!-- 阳极催化层 -->
  <rect x="210" y="90" width="40" height="220" fill="#c0392b" opacity="0.55"/>
  <text x="230" y="205" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 230 205)">阳极催化层</text>

  <!-- 质子交换膜 -->
  <rect x="250" y="90" width="40" height="220" fill="#e8e3d8" stroke="#c9c2b4" stroke-width="1"/>
  <text x="270" y="205" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 270 205)">质子交换膜（只过 H⁺）</text>

  <!-- 阴极催化层 -->
  <rect x="290" y="90" width="40" height="220" fill="#1f6f8b" opacity="0.45"/>
  <text x="310" y="205" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 310 205)">阴极催化层</text>

  <!-- 阴极流场板 -->
  <rect x="330" y="90" width="150" height="220" rx="6" fill="#f5f1e8" stroke="#333" stroke-width="2"/>
  <text x="405" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">阴极板（O₂/空气）</text>
  <rect x="350" y="132" width="110" height="12" fill="#c0392b"/>
  <rect x="350" y="160" width="110" height="12" fill="#c0392b"/>
  <text x="405" y="190" text-anchor="middle" font-size="13" fill="#333">O₂ 通道</text>

  <!-- 反应方程与出口 -->
  <text x="320" y="245" text-anchor="middle" font-size="13" fill="#333">阳极：2H₂ → 4H⁺ + 4e⁻</text>
  <text x="320" y="267" text-anchor="middle" font-size="13" fill="#333">阴极：O₂ + 4H⁺ + 4e⁻ → 2H₂O</text>
  <text x="320" y="295" text-anchor="middle" font-size="13" fill="#333">出口：水蒸气（>60 ℃）</text>

  <!-- 外电路 -->
  <line x1="230" y1="90" x2="230" y2="52" stroke="#333" stroke-width="3"/>
  <line x1="310" y1="90" x2="310" y2="52" stroke="#333" stroke-width="3"/>
  <rect x="238" y="36" width="70" height="22" rx="4" fill="none" stroke="#333" stroke-width="2"/>
  <text x="273" y="52" text-anchor="middle" font-size="13" fill="#333">负载</text>
  <text x="272" y="34" font-size="14" fill="#c0392b">+</text>
  <text x="298" y="34" font-size="14" fill="#1f6f8b">−</text>

  <!-- 质子穿越示意 -->
  <line x1="250" y1="130" x2="292" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="271" y="128" text-anchor="middle" font-size="13" fill="#333">H⁺</text>
</svg>
