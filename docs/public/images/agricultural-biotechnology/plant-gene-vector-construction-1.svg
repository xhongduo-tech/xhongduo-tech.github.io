<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
  <title>典型植物表达载体 T-DNA 结构示意图</title>
  <desc>展示双元载体 T-DNA 区域：左右边界之间包含由启动子、目的基因、终止子构成的主表达盒，以及由独立启动子驱动的选择标记表达盒。</desc>
  <rect width="640" height="250" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">植物表达载体 T-DNA 结构示意</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#555">（双元载体中待转移至植物基因组的区域）</text>

  <!-- T-DNA 主线 -->
  <line x1="40" y1="130" x2="600" y2="130" stroke="#333" stroke-width="3"/>

  <!-- LB -->
  <rect x="40" y="112" width="22" height="36" fill="#333"/>
  <text x="51" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">LB</text>

  <!-- 表达盒 1：启动子 -->
  <rect x="78" y="114" width="86" height="32" rx="4" fill="#1f6f8b"/>
  <text x="121" y="135" text-anchor="middle" font-size="14" fill="#fff">启动子</text>
  <text x="121" y="168" text-anchor="middle" font-size="13" fill="#1f6f8b">CaMV 35S</text>

  <!-- 表达盒 1：目的基因 -->
  <rect x="184" y="114" width="128" height="32" rx="4" fill="#c0392b"/>
  <text x="248" y="135" text-anchor="middle" font-size="14" fill="#fff">目的基因（GOI）</text>

  <!-- 表达盒 1：终止子 -->
  <rect x="332" y="114" width="70" height="32" rx="4" fill="#8a8a8a"/>
  <text x="367" y="135" text-anchor="middle" font-size="14" fill="#fff">终止子</text>

  <!-- 表达盒 2：启动子 -->
  <rect x="422" y="114" width="62" height="32" rx="4" fill="#1f6f8b"/>
  <text x="453" y="135" text-anchor="middle" font-size="14" fill="#fff">启动子</text>

  <!-- 表达盒 2：选择标记 -->
  <rect x="504" y="114" width="70" height="32" rx="4" fill="#c0392b"/>
  <text x="539" y="135" text-anchor="middle" font-size="14" fill="#fff">选择标记</text>
  <line x1="539" y1="146" x2="539" y2="152" stroke="#8a8a8a" stroke-width="2"/>

  <!-- 表达盒 2：终止子 -->
  <rect x="534" y="152" width="46" height="26" rx="3" fill="#8a8a8a"/>
  <text x="557" y="169" text-anchor="middle" font-size="13" fill="#fff">终止子</text>

  <!-- RB -->
  <rect x="586" y="112" width="14" height="36" fill="#333"/>
  <text x="593" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">RB</text>

  <!-- 标注框 -->
  <rect x="42" y="200" width="556" height="34" rx="4" fill="#fff" stroke="#d8d4c8"/>
  <text x="320" y="221" text-anchor="middle" font-size="13" fill="#333">LB/RB：T-DNA 左/右边界（转移机器识别此处切下并运送）</text>
</svg>
