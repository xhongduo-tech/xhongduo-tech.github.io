<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">氯化钠在水中的电离示意图</title>
  <desc id="desc">左图为氯化钠晶体：钠离子（红）与氯离子（青）交替排列，被晶格束缚不能自由移动，因此不导电。经中间箭头「溶于水，离子挣脱晶格」后，右图为氯化钠溶液：钠离子与氯离子分别被水分子包裹成水合离子，可在溶液中自由移动，因此溶液导电。</desc>

  <rect width="760" height="420" fill="#faf9f5"/>

  <!-- 左标题 -->
  <text x="156" y="34" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">氯化钠晶体</text>
  <text x="156" y="52" font-size="13" fill="#666" text-anchor="middle">离子被晶格束缚，不能移动 → 不导电</text>

  <!-- 3x3 晶格 -->
  <g stroke="#c9c4bb" stroke-width="1">
    <line x1="60" y1="70" x2="252" y2="70"/>
    <line x1="60" y1="134" x2="252" y2="134"/>
    <line x1="60" y1="198" x2="252" y2="198"/>
    <line x1="60" y1="262" x2="252" y2="262"/>
    <line x1="60" y1="70" x2="60" y2="262"/>
    <line x1="124" y1="70" x2="124" y2="262"/>
    <line x1="188" y1="70" x2="188" y2="262"/>
    <line x1="252" y1="70" x2="252" y2="262"/>
  </g>

  <!-- 氯离子（青）：(92,102) (220,102) (156,166) (92,230) (220,230) -->
  <g fill="#cde8ec" stroke="#1f6f8b" stroke-width="1.5">
    <circle cx="92" cy="102" r="14"/>
    <circle cx="220" cy="102" r="14"/>
    <circle cx="156" cy="166" r="14"/>
    <circle cx="92" cy="230" r="14"/>
    <circle cx="220" cy="230" r="14"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="92" y="107">−</text>
    <text x="220" y="107">−</text>
    <text x="156" y="171">−</text>
    <text x="92" y="235">−</text>
    <text x="220" y="235">−</text>
  </g>

  <!-- 钠离子（红）：(156,102) (92,166) (220,166) (156,230) -->
  <g fill="#fbdcd6" stroke="#c0392b" stroke-width="1.5">
    <circle cx="156" cy="102" r="9"/>
    <circle cx="92" cy="166" r="9"/>
    <circle cx="220" cy="166" r="9"/>
    <circle cx="156" cy="230" r="9"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="156" y="107">+</text>
    <text x="92" y="171">+</text>
    <text x="220" y="171">+</text>
    <text x="156" y="235">+</text>
  </g>

  <!-- 虚线圈住右上角氯离子，暗示将被拆下 -->
  <circle cx="220" cy="102" r="24" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 水分子接近晶格（上方） -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="92" y1="48" x2="78" y2="66"/>
    <line x1="92" y1="48" x2="106" y2="66"/>
  </g>
  <circle cx="92" cy="48" r="7" fill="#e8836a" stroke="#b35038" stroke-width="1.5"/>
  <circle cx="78" cy="66" r="4" fill="#f5efe4" stroke="#999"/>
  <circle cx="106" cy="66" r="4" fill="#f5efe4" stroke="#999"/>

  <!-- 中间大箭头 -->
  <line x1="300" y1="190" x2="422" y2="190" stroke="#333" stroke-width="3"/>
  <polygon points="430,190 414,182 414,198" fill="#333"/>
  <text x="362" y="172" font-size="15" fill="#333" text-anchor="middle">溶于水</text>
  <text x="362" y="228" font-size="13" fill="#666" text-anchor="middle">离子挣脱晶格</text>

  <!-- 右标题 -->
  <text x="600" y="34" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">氯化钠溶液</text>
  <text x="600" y="52" font-size="13" fill="#666" text-anchor="middle">水分子包裹离子，可自由移动 → 导电</text>

  <!-- 水合钠离子：Na+ 在 (540,180) -->
  <circle cx="540" cy="180" r="15" fill="#c0392b"/>
  <text x="540" y="186" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Na⁺</text>

  <g stroke="#999" stroke-width="1.5">
    <line x1="540" y1="128" x2="527" y2="142"/>
    <line x1="540" y1="128" x2="553" y2="142"/>
    <line x1="540" y1="232" x2="527" y2="218"/>
    <line x1="540" y1="232" x2="553" y2="218"/>
    <line x1="486" y1="180" x2="499" y2="166"/>
    <line x1="486" y1="180" x2="499" y2="194"/>
    <line x1="594" y1="180" x2="581" y2="166"/>
    <line x1="594" y1="180" x2="581" y2="194"/>
  </g>
  <g fill="#e8836a" stroke="#b35038" stroke-width="1.5">
    <circle cx="540" cy="128" r="7"/>
    <circle cx="540" cy="232" r="7"/>
    <circle cx="486" cy="180" r="7"/>
    <circle cx="594" cy="180" r="7"/>
  </g>
  <g fill="#f5efe4" stroke="#999">
    <circle cx="527" cy="142" r="4"/>
    <circle cx="553" cy="142" r="4"/>
    <circle cx="527" cy="218" r="4"/>
    <circle cx="553" cy="218" r="4"/>
    <circle cx="499" cy="166" r="4"/>
    <circle cx="499" cy="194" r="4"/>
    <circle cx="581" cy="166" r="4"/>
    <circle cx="581" cy="194" r="4"/>
  </g>

  <!-- 水合氯离子：Cl- 在 (660,180) -->
  <circle cx="660" cy="180" r="19" fill="#1f6f8b"/>
  <text x="660" y="186" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Cl⁻</text>

  <g stroke="#999" stroke-width="1.5">
    <line x1="660" y1="126" x2="645" y2="142"/>
    <line x1="660" y1="126" x2="675" y2="142"/>
    <line x1="660" y1="234" x2="645" y2="218"/>
    <line x1="660" y1="234" x2="675" y2="218"/>
    <line x1="604" y1="180" x2="620" y2="165"/>
    <line x1="604" y1="180" x2="620" y2="195"/>
    <line x1="716" y1="180" x2="700" y2="165"/>
    <line x1="716" y1="180" x2="700" y2="195"/>
  </g>
  <g fill="#e8836a" stroke="#b35038" stroke-width="1.5">
    <circle cx="660" cy="126" r="7"/>
    <circle cx="660" cy="234" r="7"/>
    <circle cx="604" cy="180" r="7"/>
    <circle cx="716" cy="180" r="7"/>
  </g>
  <g fill="#f5efe4" stroke="#999">
    <circle cx="645" cy="142" r="4"/>
    <circle cx="675" cy="142" r="4"/>
    <circle cx="645" cy="218" r="4"/>
    <circle cx="675" cy="218" r="4"/>
    <circle cx="620" cy="165" r="4"/>
    <circle cx="620" cy="195" r="4"/>
    <circle cx="700" cy="165" r="4"/>
    <circle cx="700" cy="195" r="4"/>
  </g>

  <!-- 部分电荷标注 -->
  <text x="549" y="118" font-size="13" fill="#1f6f8b">δ−</text>
  <text x="515" y="135" font-size="13" fill="#c0392b">δ+</text>
  <text x="561" y="135" font-size="13" fill="#c0392b">δ+</text>
  <text x="594" y="180" font-size="13" fill="#1f6f8b">δ−</text>
  <text x="628" y="157" font-size="13" fill="#c0392b">δ+</text>
  <text x="628" y="205" font-size="13" fill="#c0392b">δ+</text>

  <!-- 离子名称标注 -->
  <text x="540" y="288" font-size="14" fill="#333" text-anchor="middle">水合钠离子</text>
  <text x="540" y="306" font-size="13" fill="#666" text-anchor="middle">Na⁺(aq)</text>
  <text x="660" y="288" font-size="14" fill="#333" text-anchor="middle">水合氯离子</text>
  <text x="660" y="306" font-size="13" fill="#666" text-anchor="middle">Cl⁻(aq)</text>

  <!-- 底部说明 -->
  <text x="380" y="376" font-size="14" fill="#333" text-anchor="middle">电离：电解质溶于水或受热熔化时，离解成自由移动的离子的过程</text>
  <text x="380" y="400" font-size="13" fill="#666" text-anchor="middle">水分子 O 端显 δ−、H 端显 δ+：O 端吸引阳离子，H 端吸引阴离子，把离子从晶格上拆下并包裹</text>
</svg>
