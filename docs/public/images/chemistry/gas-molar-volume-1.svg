<svg viewBox="0 0 660 320" width="660" height="320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>同温同压下 1 mol 固体、液体与气体体积差异的来源</title>
<desc>固体与液体中分子紧密排列，体积主要取决于分子本身大小；气体中分子间距远大于分子本身，体积由分子间距离决定，因此同温同压下 1 mol 不同气体的体积几乎相同（标准状况下约 22.4 L）。</desc>
<rect x="0" y="0" width="660" height="320" fill="#faf9f5"/>
<text x="330" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">为什么 1 mol 气体的体积几乎都一样？</text>
<text x="330" y="48" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">固体与液体：分子挤在一起，体积看「分子个头」；气体：分子间距极大，体积看「分子间空当」</text>
<rect x="30" y="70" width="180" height="140" fill="#ffffff" stroke="#333" stroke-width="2"/>
<g fill="#c0392b">
  <circle cx="58" cy="96" r="12"/><circle cx="92" cy="96" r="12"/><circle cx="126" cy="96" r="12"/><circle cx="160" cy="96" r="12"/>
  <circle cx="58" cy="128" r="12"/><circle cx="92" cy="128" r="12"/><circle cx="126" cy="128" r="12"/><circle cx="160" cy="128" r="12"/>
  <circle cx="58" cy="160" r="12"/><circle cx="92" cy="160" r="12"/><circle cx="126" cy="160" r="12"/><circle cx="160" cy="160" r="12"/>
  <circle cx="58" cy="192" r="12"/><circle cx="92" cy="192" r="12"/><circle cx="126" cy="192" r="12"/><circle cx="160" cy="192" r="12"/>
</g>
<text x="120" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">固体</text>
<text x="120" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">分子紧排，体积≈分子大小</text>
<rect x="240" y="70" width="180" height="140" fill="#ffffff" stroke="#333" stroke-width="2"/>
<g fill="#1f6f8b">
  <circle cx="262" cy="100" r="11"/><circle cx="298" cy="92" r="11"/><circle cx="336" cy="104" r="11"/><circle cx="374" cy="96" r="11"/><circle cx="402" cy="106" r="11"/>
  <circle cx="252" cy="130" r="11"/><circle cx="288" cy="124" r="11"/><circle cx="326" cy="132" r="11"/><circle cx="366" cy="122" r="11"/><circle cx="398" cy="140" r="11"/>
  <circle cx="262" cy="160" r="11"/><circle cx="300" cy="156" r="11"/><circle cx="340" cy="164" r="11"/><circle cx="376" cy="154" r="11"/><circle cx="404" cy="166" r="11"/>
  <circle cx="256" cy="192" r="11"/><circle cx="294" cy="188" r="11"/><circle cx="332" cy="196" r="11"/><circle cx="370" cy="186" r="11"/><circle cx="400" cy="196" r="11"/>
</g>
<text x="330" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">液体</text>
<text x="330" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">分子紧挨但无序，体积≈分子大小</text>
<rect x="450" y="70" width="180" height="140" fill="#ffffff" stroke="#333" stroke-width="2"/>
<g fill="#8a6d3b">
  <circle cx="500" cy="120" r="8"/><circle cx="560" cy="100" r="8"/><circle cx="470" cy="160" r="8"/><circle cx="590" cy="170" r="8"/><circle cx="540" cy="150" r="8"/><circle cx="480" cy="110" r="8"/>
</g>
<text x="540" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">气体</text>
<text x="540" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">分子间距≫分子大小</text>
<text x="540" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">体积看分子间空当</text>
<text x="330" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">→ 同温同压下，1 mol 气体的体积几乎相同（标准状况下约 22.4 L）</text>
</svg>
