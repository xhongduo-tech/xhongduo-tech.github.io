<svg viewBox="0 0 460 240" width="460" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">钠与氯形成离子键：最外层电子由钠转移给氯</title>
<desc id="desc">左图钠原子最外层有 1 个电子，右图氯原子最外层有 7 个电子（缺 1 个）。红色箭头表示钠最外层那个电子转移给氯，形成 Na+ 与 Cl-，二者靠静电作用结合为离子键。</desc>
<rect x="0" y="0" width="460" height="240" fill="#faf9f5"/>

<!-- 标题行 -->
<text x="230" y="20" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">钠原子 Na（2，8，1） 与 氯原子 Cl（2，8，7）</text>

<!-- 钠原子 -->
<g>
  <text x="120" y="40" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Na</text>
  <circle cx="120" cy="80" r="13" fill="#1f6f8b"/>
  <text x="120" y="85" font-family="sans-serif" font-size="13" fill="#faf9f5" text-anchor="middle">Na</text>
  <circle cx="120" cy="80" r="30" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="120" cy="80" r="50" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="120" cy="80" r="72" fill="none" stroke="#333" stroke-width="1"/>
  <!-- 第1层 2 个电子 -->
  <circle cx="120" cy="50" r="4" fill="#333"/>
  <circle cx="120" cy="110" r="4" fill="#333"/>
  <!-- 第2层 8 个电子 -->
  <circle cx="170" cy="80" r="4" fill="#333"/>
  <circle cx="155.4" cy="115.4" r="4" fill="#333"/>
  <circle cx="120" cy="130" r="4" fill="#333"/>
  <circle cx="84.6" cy="115.4" r="4" fill="#333"/>
  <circle cx="70" cy="80" r="4" fill="#333"/>
  <circle cx="84.6" cy="44.6" r="4" fill="#333"/>
  <circle cx="120" cy="30" r="4" fill="#333"/>
  <circle cx="155.4" cy="44.6" r="4" fill="#333"/>
  <!-- 第3层 1 个电子（红色，即将转移） -->
  <circle cx="192" cy="80" r="5" fill="#c0392b"/>
</g>

<!-- 氯原子 -->
<g>
  <circle cx="340" cy="80" r="13" fill="#1f6f8b"/>
  <text x="340" y="85" font-family="sans-serif" font-size="13" fill="#faf9f5" text-anchor="middle">Cl</text>
  <circle cx="340" cy="80" r="30" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="340" cy="80" r="50" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="340" cy="80" r="72" fill="none" stroke="#333" stroke-width="1"/>
  <!-- 第1层 2 个电子 -->
  <circle cx="340" cy="50" r="4" fill="#333"/>
  <circle cx="340" cy="110" r="4" fill="#333"/>
  <!-- 第2层 8 个电子 -->
  <circle cx="390" cy="80" r="4" fill="#333"/>
  <circle cx="375.4" cy="115.4" r="4" fill="#333"/>
  <circle cx="340" cy="130" r="4" fill="#333"/>
  <circle cx="304.6" cy="115.4" r="4" fill="#333"/>
  <circle cx="290" cy="80" r="4" fill="#333"/>
  <circle cx="304.6" cy="44.6" r="4" fill="#333"/>
  <circle cx="340" cy="30" r="4" fill="#333"/>
  <circle cx="375.4" cy="44.6" r="4" fill="#333"/>
  <!-- 第3层 7 个电子，左侧留缺口 -->
  <circle cx="412" cy="80" r="4" fill="#333"/>
  <circle cx="390.9" cy="130.9" r="4" fill="#333"/>
  <circle cx="340" cy="152" r="4" fill="#333"/>
  <circle cx="289.1" cy="130.9" r="4" fill="#333"/>
  <circle cx="289.1" cy="29.1" r="4" fill="#333"/>
  <circle cx="340" cy="8" r="4" fill="#333"/>
  <circle cx="390.9" cy="29.1" r="4" fill="#333"/>
  <!-- 缺口处的虚线圆 -->
  <circle cx="268" cy="80" r="6" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
</g>

<!-- 电子转移箭头 -->
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<line x1="197" y1="76" x2="262" y2="76" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230" y="60" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">失去 1 个电子</text>

<!-- 分隔线 -->
<line x1="20" y1="170" x2="440" y2="170" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
<text x="230" y="163" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">电子转移后</text>

<!-- 结果行 -->
<text x="120" y="195" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="middle">Na⁺（2，8）</text>
<text x="340" y="195" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="middle">Cl⁻（2，8，8）</text>
<text x="230" y="225" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">阴阳离子间静电作用 → 离子键</text>
</svg>
