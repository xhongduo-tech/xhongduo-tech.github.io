<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="sans-serif">
  <title>群量剂量-反应曲线：ED50、TD50 与 LD50</title>
  <desc>以对数剂量为横轴、累积反应百分比为纵轴的 S 形剂量-反应曲线，标出半数有效剂量、半数中毒剂量与半数致死剂量。</desc>
  <rect width="480" height="340" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="60" y1="290" x2="440" y2="290"/>
    <line x1="60" y1="290" x2="60" y2="30"/>
  </g>
  <text x="38" y="160" fill="#333" font-size="14" text-anchor="middle" transform="rotate(-90 38 160)">累积反应（%）</text>
  <text x="250" y="325" fill="#333" font-size="14" text-anchor="middle">对数剂量（log 剂量）</text>
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <path d="M 70 282 C 130 280, 175 250, 205 210 C 240 165, 270 120, 320 45 C 350 25, 400 22, 430 20"/>
  </g>
  <g stroke="#1f6f8b" stroke-dasharray="6 4" stroke-width="1.5">
    <line x1="210" y1="290" x2="210" y2="150"/>
    <line x1="290" y1="290" x2="290" y2="68"/>
    <line x1="360" y1="290" x2="360" y2="32"/>
  </g>
  <g fill="#333" font-size="13">
    <text x="210" y="315">ED50</text>
    <text x="290" y="315">TD50</text>
    <text x="360" y="315">LD50</text>
    <text x="200" y="150">50%</text>
  </g>
  <g fill="#1f6f8b" font-size="13">
    <text x="120" y="262">治疗区</text>
    <text x="230" y="120">毒性区</text>
    <text x="330" y="60">致死区</text>
  </g>
</svg>
