<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="title desc">
  <title>风险分析三支柱与风险评估四步</title>
  <desc>风险分析由风险评估、风险管理、风险沟通三支柱构成，风险评估内部含危害识别、危害特征描述、暴露评估、风险特征描述四步</desc>
  <rect width="820" height="460" fill="#ffffff"/>
  <text x="410" y="40" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="20" font-weight="bold">风险分析：三支柱与四步流水线</text>

  <!-- 风险评估四步（底部横向流水线） -->
  <g font-family="sans-serif" font-size="14">
    <rect x="60" y="300" width="150" height="70" rx="8" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="135" y="330" text-anchor="middle" fill="#1f6f8b" font-weight="bold">① 危害识别</text>
    <text x="135" y="352" text-anchor="middle" fill="#333" font-size="12">有没有害？</text>

    <rect x="230" y="300" width="150" height="70" rx="8" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="305" y="330" text-anchor="middle" fill="#1f6f8b" font-weight="bold">② 危害特征描述</text>
    <text x="305" y="352" text-anchor="middle" fill="#333" font-size="12">剂量-反应？</text>

    <rect x="400" y="300" width="150" height="70" rx="8" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="475" y="330" text-anchor="middle" fill="#1f6f8b" font-weight="bold">③ 暴露评估</text>
    <text x="475" y="352" text-anchor="middle" fill="#333" font-size="12">吃到多少？</text>

    <rect x="570" y="300" width="190" height="70" rx="8" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="665" y="330" text-anchor="middle" fill="#c0392b" font-weight="bold">④ 风险特征描述</text>
    <text x="665" y="352" text-anchor="middle" fill="#333" font-size="12">合算：风险多大？</text>
  </g>
  <!-- 步骤间箭头 -->
  <g fill="#999999" font-family="sans-serif" font-size="18">
    <text x="215" y="340" text-anchor="middle">→</text>
    <text x="385" y="340" text-anchor="middle">→</text>
    <text x="555" y="340" text-anchor="middle">→</text>
  </g>

  <!-- 风险评估容器 -->
  <rect x="40" y="260" width="740" height="140" rx="10" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="410" y="252" text-anchor="middle" fill="#1f6f8b" font-family="sans-serif" font-size="15" font-weight="bold">风险评估（科学家 · 客观）</text>

  <!-- 三支柱 -->
  <g font-family="sans-serif" font-size="16">
    <rect x="60" y="90" width="200" height="90" rx="10" fill="#eef5ee" stroke="#2e7d32" stroke-width="2"/>
    <text x="160" y="128" text-anchor="middle" fill="#2e7d32" font-weight="bold">风险评估</text>
    <text x="160" y="152" text-anchor="middle" fill="#333" font-size="13">科学估计风险大小</text>

    <rect x="310" y="90" width="200" height="90" rx="10" fill="#fdf6ec" stroke="#b8860b" stroke-width="2"/>
    <text x="410" y="128" text-anchor="middle" fill="#b8860b" font-weight="bold">风险管理</text>
    <text x="410" y="152" text-anchor="middle" fill="#333" font-size="13">权衡取舍、制定措施</text>

    <rect x="560" y="90" width="200" height="90" rx="10" fill="#f3ecf9" stroke="#7b1fa2" stroke-width="2"/>
    <text x="660" y="128" text-anchor="middle" fill="#7b1fa2" font-weight="bold">风险沟通</text>
    <text x="660" y="152" text-anchor="middle" fill="#333" font-size="13">全程双向对话</text>
  </g>

  <!-- 支柱间箭头 -->
  <g fill="#999999" font-family="sans-serif" font-size="18">
    <text x="270" y="140" text-anchor="middle">↔</text>
    <text x="520" y="140" text-anchor="middle">↔</text>
  </g>

  <text x="410" y="440" text-anchor="middle" fill="#666666" font-family="sans-serif" font-size="14">三支柱分离：评估中立，管理负责，沟通透明</text>
</svg>
