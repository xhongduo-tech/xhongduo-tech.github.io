<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="title desc">
  <title>HACCP 十二步骤与七原则的结构对应</title>
  <desc>左列为十二个逻辑步骤，右列为七项原则，步骤6到12分别对应原则1到7，前五步为准备阶段</desc>
  <rect width="820" height="520" fill="#ffffff"/>
  <!-- 标题 -->
  <text x="410" y="40" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="20" font-weight="bold">HACCP：12 步骤 ⇔ 7 原则</text>

  <!-- 左列：准备阶段（步骤1-5） -->
  <g font-family="sans-serif" font-size="14">
    <rect x="60" y="70" width="300" height="40" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="210" y="94" text-anchor="middle" fill="#1f6f8b">步骤 1–5　准备阶段：小组 / 产品 / 工艺流程图 / 现场核对</text>
  </g>

  <!-- 左列：步骤6-12 -->
  <g font-family="sans-serif" font-size="14">
    <rect x="60" y="130" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="153" text-anchor="middle" fill="#333">6　危害分析</text>
    <rect x="60" y="180" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="203" text-anchor="middle" fill="#333">7　确定 CCP</text>
    <rect x="60" y="230" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="253" text-anchor="middle" fill="#333">8　关键限值 CL</text>
    <rect x="60" y="280" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="303" text-anchor="middle" fill="#333">9　监控程序</text>
    <rect x="60" y="330" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="353" text-anchor="middle" fill="#333">10　纠偏措施</text>
    <rect x="60" y="380" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="403" text-anchor="middle" fill="#333">11　验证程序</text>
    <rect x="60" y="430" width="300" height="36" rx="6" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="453" text-anchor="middle" fill="#333">12　记录与文件</text>
  </g>

  <!-- 右列：原则1-7 -->
  <g font-family="sans-serif" font-size="14">
    <rect x="460" y="130" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="153" text-anchor="middle" fill="#333">原则 1　危害分析</text>
    <rect x="460" y="180" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="203" text-anchor="middle" fill="#333">原则 2　确定关键控制点</text>
    <rect x="460" y="230" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="253" text-anchor="middle" fill="#333">原则 3　关键限值</text>
    <rect x="460" y="280" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="303" text-anchor="middle" fill="#333">原则 4　监控</text>
    <rect x="460" y="330" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="353" text-anchor="middle" fill="#333">原则 5　纠偏措施</text>
    <rect x="460" y="380" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="403" text-anchor="middle" fill="#333">原则 6　验证</text>
    <rect x="460" y="430" width="300" height="36" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="610" y="453" text-anchor="middle" fill="#333">原则 7　记录保持</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#999999" stroke-width="1.5" fill="none">
    <line x1="360" y1="148" x2="460" y2="148"/>
    <line x1="360" y1="198" x2="460" y2="198"/>
    <line x1="360" y1="248" x2="460" y2="248"/>
    <line x1="360" y1="298" x2="460" y2="298"/>
    <line x1="360" y1="348" x2="460" y2="348"/>
    <line x1="360" y1="398" x2="460" y2="398"/>
    <line x1="360" y1="448" x2="460" y2="448"/>
  </g>
</svg>
