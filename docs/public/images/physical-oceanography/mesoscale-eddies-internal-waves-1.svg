<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" font-family="sans-serif">
  <title>内波示意图：等密度面在层结海洋内部波动</title>
  <desc>海面平坦，而主温跃层附近的等密度面发生正弦波动，水平流速与垂直流速分别指向不同方向，内波在海面几乎不可见。</desc>
  <rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
  <!-- 海面 -->
  <line x1="40" y1="60" x2="600" y2="60" stroke="#333" stroke-width="2"/>
  <text x="300" y="40" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">海面（平坦——内波在海面几乎不可见）</text>
  <!-- 上分层 -->
  <text x="310" y="92" font-size="13" fill="#666" text-anchor="middle">上混合层（密度均匀、层结弱）</text>
  <!-- 等密度面：主温跃层，正弦波动，幅度随深度递增到温跃层最大 -->
  <path d="M 40 150 Q 110 110 180 150 T 320 150 T 460 150 T 600 150" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 40 205 Q 110 150 180 205 T 320 205 T 460 205 T 600 205" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 40 262 Q 110 195 180 262 T 320 262 T 460 262 T 600 262" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 标注主温跃层 -->
  <line x1="545" y1="120" x2="545" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="540" y="112" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">主温跃层</text>
  <text x="540" y="290" font-size="13" fill="#c0392b" text-anchor="middle">等密度面上下波动幅度最大</text>
  <!-- 波长标注 -->
  <line x1="40" y1="320" x2="180" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="312" x2="40" y2="328" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="312" x2="180" y2="328" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="342" font-size="14" fill="#333" text-anchor="middle">波长 λ（百米～十公里量级）</text>
  <!-- 流速箭头 -->
  <path d="M 180 320 C 190 260 170 210 185 170" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 181 180 L 195 190 M 181 180 L 178 196" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="140" font-size="13" fill="#333">水平流速 u(z) 随深度转向</text>
  <!-- 等密度面小标签 -->
  <text x="60" y="212" font-size="13" fill="#1f6f8b">ρ₀</text>
  <text x="60" y="270" font-size="13" fill="#1f6f8b">ρ₀+Δρ</text>
  <text x="430" y="70" font-size="13" fill="#666">色带为示意，实际幅度约数米～数十米</text>
</svg>
