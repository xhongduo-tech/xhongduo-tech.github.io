<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" font-family="sans-serif">
  <title>旋转潮波系统：无潮点示意图</title>
  <desc>海盆中的无潮点（振幅为零），等振幅线绕其近似同心分布，同潮时线从无潮点辐射出去，潮波绕无潮点旋转。</desc>
  <rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
  <!-- 海盆水体 -->
  <rect x="70" y="50" width="500" height="270" fill="#eef4f8" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="38" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">海盆（俯视）中的旋转潮波系统</text>
  <!-- 等振幅线：绕无潮点的同心圆，用椭圆近似 -->
  <ellipse cx="320" cy="185" rx="60" ry="52" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="320" cy="185" rx="120" ry="104" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="320" cy="185" rx="180" ry="156" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="438" y="80" font-size="13" fill="#c0392b">等振幅线（越靠外潮差越大）</text>
  <!-- 同潮时线：从无潮点辐射出去 -->
  <line x1="320" y1="185" x2="320" y2="70" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="320" y1="185" x2="470" y2="290" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="320" y1="185" x2="170" y2="290" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="320" y1="185" x2="180" y2="80" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="320" y1="185" x2="470" y2="70" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="500" y="330" font-size="13" fill="#1f6f8b">同潮时线（同一根线上高潮同时到来）</text>
  <!-- 无潮点 -->
  <circle cx="320" cy="185" r="5" fill="#333"/>
  <text x="330" y="205" font-size="14" fill="#333" font-weight="bold">无潮点（振幅为零，潮差为零）</text>
  <!-- 旋转箭头 -->
  <path d="M 380 160 A 80 70 0 0 1 368 258" fill="none" stroke="#333" stroke-width="1.5" marker-end="none"/>
  <path d="M 382 165 L 388 152 M 382 165 L 372 156" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="402" y="150" font-size="13" fill="#333">潮波绕无潮点旋转</text>
  <!-- 海岸 -->
  <rect x="70" y="50" width="500" height="270" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="82" y="330" font-size="13" fill="#666">北半球：逆时针旋转</text>
</svg>
