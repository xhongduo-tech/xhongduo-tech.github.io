<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="sans-serif">
  <title>归并排序的递归树</title>
  <desc>递归树：T(n)=2T(n/2)+cn。第 i 层有 2^i 个节点、每个代价 c(n/2^i)，该层总代价恒为 cn；树高 lg n，共 lg n+1 层，总代价 cn(lg n+1)=Θ(n lg n)。</desc>
  <rect width="880" height="580" fill="#faf9f5"/>

  <g stroke="#999" stroke-width="1.5">
    <line x1="310" y1="116" x2="155" y2="180"/>
    <line x1="310" y1="116" x2="465" y2="180"/>
    <line x1="155" y1="231" x2="78" y2="292"/>
    <line x1="155" y1="231" x2="232" y2="292"/>
    <line x1="465" y1="231" x2="388" y2="292"/>
    <line x1="465" y1="231" x2="542" y2="292"/>
  </g>

  <g fill="#fff" stroke="#1f6f8b" stroke-width="2">
    <circle cx="310" cy="90" r="26"/>
    <circle cx="155" cy="205" r="26"/>
    <circle cx="465" cy="205" r="26"/>
    <circle cx="78" cy="318" r="28"/>
    <circle cx="232" cy="318" r="28"/>
    <circle cx="388" cy="318" r="28"/>
    <circle cx="542" cy="318" r="28"/>
  </g>
  <g fill="#333" font-size="14" text-anchor="middle">
    <text x="310" y="95">cn</text>
    <text x="155" y="210">cn/2</text>
    <text x="465" y="210">cn/2</text>
    <text x="78" y="323">cn/4</text>
    <text x="232" y="323">cn/4</text>
    <text x="388" y="323">cn/4</text>
    <text x="542" y="323">cn/4</text>
  </g>

  <text x="310" y="372" fill="#999" font-size="22" text-anchor="middle">· · ·</text>

  <g stroke="#c0392b" stroke-width="2">
    <rect x="48" y="440" width="70" height="34" rx="6" fill="#fff"/>
    <rect x="168" y="440" width="70" height="34" rx="6" fill="#fff"/>
    <rect x="288" y="440" width="70" height="34" rx="6" fill="#fff"/>
    <rect x="408" y="440" width="70" height="34" rx="6" fill="#fff"/>
    <rect x="528" y="440" width="70" height="34" rx="6" fill="#fff"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="83" y="462">Θ(1)</text>
    <text x="203" y="462">Θ(1)</text>
    <text x="323" y="462">Θ(1)</text>
    <text x="443" y="462">Θ(1)</text>
    <text x="563" y="462">Θ(1)</text>
  </g>
  <text x="310" y="505" fill="#666" font-size="13" text-anchor="middle">n 个叶子，每个代价 Θ(1)，叶子层合计 Θ(n)</text>

  <g fill="#1f6f8b" font-size="14">
    <text x="610" y="95">层级 0：cn</text>
    <text x="610" y="210">层级 1：cn</text>
    <text x="610" y="323">层级 2：cn</text>
    <text x="610" y="372">…</text>
    <text x="610" y="462">叶子层：Θ(n)</text>
  </g>

  <rect x="210" y="528" width="420" height="36" rx="8" fill="#c0392b"/>
  <text x="420" y="551" fill="#fff" font-size="16" text-anchor="middle">总计：cn(lg n + 1) = Θ(n lg n)</text>
</svg>
