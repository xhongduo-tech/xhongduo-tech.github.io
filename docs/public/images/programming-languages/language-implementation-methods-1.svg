<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" font-family="sans-serif">
  <title>三种语言实现路线对比</title>
  <desc>对比纯编译、纯解释与混合实现三种语言实现方法的数据流路径：纯编译将源程序整体翻译为机器码后由硬件直接执行；纯解释由解释器逐条执行源程序；混合实现先将源程序编译为字节码，再由虚拟机解释或即时编译执行。</desc>
  <rect width="1010" height="470" fill="#faf9f5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 行 1：纯编译 -->
  <text x="20" y="76" font-size="18" font-weight="bold" fill="#333">① 纯编译</text>
  <rect x="180" y="38" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="255" y="76" font-size="15" text-anchor="middle" fill="#333">源程序</text>
  <line x1="330" y1="70" x2="388" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="38" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="465" y="76" font-size="15" text-anchor="middle" fill="#333">编译器</text>
  <line x1="540" y1="70" x2="598" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="600" y="38" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="675" y="76" font-size="15" text-anchor="middle" fill="#333">机器码</text>
  <line x1="750" y1="70" x2="798" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="810" y="38" width="170" height="64" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="895" y="76" font-size="15" text-anchor="middle" fill="#333">硬件直接执行</text>

  <!-- 行 2：纯解释 -->
  <text x="20" y="236" font-size="18" font-weight="bold" fill="#333">② 纯解释</text>
  <rect x="180" y="198" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="255" y="236" font-size="15" text-anchor="middle" fill="#333">源程序</text>
  <line x1="330" y1="230" x2="388" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="198" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="465" y="236" font-size="15" text-anchor="middle" fill="#333">解释器</text>
  <line x1="540" y1="230" x2="598" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="600" y="198" width="150" height="64" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="236" font-size="15" text-anchor="middle" fill="#333">逐条执行</text>

  <!-- 行 3：混合实现 -->
  <text x="20" y="396" font-size="18" font-weight="bold" fill="#333">③ 混合实现</text>
  <rect x="180" y="358" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="255" y="396" font-size="15" text-anchor="middle" fill="#333">源程序</text>
  <line x1="330" y1="390" x2="388" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="358" width="150" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="465" y="396" font-size="15" text-anchor="middle" fill="#333">编译器</text>
  <line x1="540" y1="390" x2="598" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="600" y="358" width="150" height="64" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="675" y="396" font-size="15" text-anchor="middle" fill="#333">字节码</text>
  <line x1="750" y1="390" x2="788" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="790" y="358" width="210" height="64" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="895" y="388" font-size="15" text-anchor="middle" fill="#333">虚拟机</text>
  <text x="895" y="410" font-size="13" text-anchor="middle" fill="#333">（解释 / JIT 执行）</text>
</svg>
