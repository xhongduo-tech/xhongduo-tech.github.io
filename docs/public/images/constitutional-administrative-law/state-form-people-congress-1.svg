<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="sans-serif">
  <title>人民代表大会制度下的国家机构关系图</title>
  <desc>人民选举代表组成全国人民代表大会，全国人民代表大会产生其他国家机关；其他国家机关向人大负责、受人大监督。</desc>
  <rect width="800" height="600" fill="#faf9f5"/>

  <!-- 人民 -->
  <rect x="270" y="30" width="260" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="52" text-anchor="middle" font-size="17" fill="#333">人民</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" fill="#666">国家一切权力的所有者</text>

  <!-- 箭头：人民 -> 人大 -->
  <line x1="400" y1="82" x2="400" y2="128" stroke="#333" stroke-width="2"/>
  <polygon points="400,136 394,124 406,124" fill="#333"/>
  <text x="420" y="112" font-size="13" fill="#333">选举代表 组成</text>

  <!-- 全国人民代表大会 -->
  <rect x="220" y="136" width="360" height="60" rx="8" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <text x="400" y="162" text-anchor="middle" font-size="17" fill="#fff">全国人民代表大会</text>
  <text x="400" y="184" text-anchor="middle" font-size="13" fill="#fff">最高国家权力机关（常设机关：全国人大常委会）</text>

  <!-- 总线 -->
  <line x1="160" y1="236" x2="640" y2="236" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="196" x2="400" y2="236" stroke="#333" stroke-width="2"/>
  <polygon points="400,196 394,206 406,206" fill="#333"/>

  <!-- 第一行机关 -->
  <g stroke="#1f6f8b" stroke-width="2">
    <line x1="160" y1="236" x2="160" y2="272" />
    <polygon points="160,280 154,268 166,268" fill="#1f6f8b"/>
    <line x1="400" y1="236" x2="400" y2="272" />
    <polygon points="400,280 394,268 406,268" fill="#1f6f8b"/>
    <line x1="640" y1="236" x2="640" y2="272" />
    <polygon points="640,280 634,268 646,268" fill="#1f6f8b"/>
  </g>

  <g fill="#fff" stroke="#333" stroke-width="1.5">
    <rect x="95" y="280" width="130" height="48" rx="8" fill="#1f6f8b"/>
    <rect x="335" y="280" width="130" height="48" rx="8" fill="#1f6f8b"/>
    <rect x="575" y="280" width="130" height="48" rx="8" fill="#1f6f8b"/>
  </g>
  <text x="160" y="300" text-anchor="middle" font-size="14" fill="#fff">国家主席</text>
  <text x="160" y="319" text-anchor="middle" font-size="12" fill="#e8e8e8">（全国人大选举）</text>
  <text x="400" y="300" text-anchor="middle" font-size="14" fill="#fff">国务院</text>
  <text x="400" y="319" text-anchor="middle" font-size="12" fill="#e8e8e8">（国家最高行政机关）</text>
  <text x="640" y="300" text-anchor="middle" font-size="14" fill="#fff">中央军事委员会</text>
  <text x="640" y="319" text-anchor="middle" font-size="12" fill="#e8e8e8">（国家最高军事领导机关）</text>

  <!-- 虚线：国务院向人大负责 -->
  <path d="M465 300 C 700 300, 740 190, 590 150" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="680" y="215" font-size="13" fill="#c0392b">负责并报告工作</text>
  <text x="682" y="233" font-size="13" fill="#c0392b">受其监督</text>

  <!-- 第二行机关 -->
  <g stroke="#1f6f8b" stroke-width="2">
    <line x1="160" y1="236" x2="160" y2="372" />
    <polygon points="160,380 154,368 166,368" fill="#1f6f8b"/>
    <line x1="400" y1="236" x2="400" y2="372" />
    <polygon points="400,380 394,368 406,368" fill="#1f6f8b"/>
    <line x1="640" y1="236" x2="640" y2="372" />
    <polygon points="640,380 634,368 646,368" fill="#1f6f8b"/>
  </g>

  <g fill="#fff" stroke="#333" stroke-width="1.5">
    <rect x="95" y="380" width="130" height="48" rx="8" fill="#1f6f8b"/>
    <rect x="335" y="380" width="130" height="48" rx="8" fill="#1f6f8b"/>
    <rect x="575" y="380" width="130" height="48" rx="8" fill="#1f6f8b"/>
  </g>
  <text x="160" y="400" text-anchor="middle" font-size="14" fill="#fff">国家监察委员会</text>
  <text x="160" y="419" text-anchor="middle" font-size="12" fill="#e8e8e8">（监察机关）</text>
  <text x="400" y="400" text-anchor="middle" font-size="14" fill="#fff">最高人民法院</text>
  <text x="400" y="419" text-anchor="middle" font-size="12" fill="#e8e8e8">（审判机关）</text>
  <text x="640" y="400" text-anchor="middle" font-size="14" fill="#fff">最高人民检察院</text>
  <text x="640" y="419" text-anchor="middle" font-size="12" fill="#e8e8e8">（法律监督机关）</text>

  <!-- 虚线：最高检向人大负责 -->
  <path d="M505 400 C 720 400, 750 200, 580 190" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 人民监督人大 -->
  <path d="M480 56 C 680 70, 700 150, 600 180" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="650" y="105" font-size="13" fill="#c0392b">人大代表受人民监督</text>

  <!-- 图例 -->
  <line x1="80" y1="500" x2="130" y2="500" stroke="#333" stroke-width="2"/>
  <text x="140" y="504" font-size="13" fill="#333">实线：产生（选举 / 决定）</text>
  <line x1="380" y1="500" x2="430" y2="500" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="440" y="504" font-size="13" fill="#c0392b">虚线：监督（负责并报告工作）</text>

  <text x="400" y="560" text-anchor="middle" font-size="13" fill="#666">民主集中制：在民主基础上集中，在集中指导下民主</text>
</svg>
