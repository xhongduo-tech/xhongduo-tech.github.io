<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">电子烟与加热不燃烧烟具结构对比</title>
  <desc id="desc">左侧为电子烟：烟油仓与雾化芯靠电池加热产生气溶胶；右侧为加热不燃烧烟具：加热片烘烤烟草棒释放烟气。</desc>
  <rect x="0" y="0" width="720" height="460" fill="#faf9f5"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">电子烟与加热不燃烧烟具结构对比</text>

  <!-- 左侧：电子烟 -->
  <text x="160" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c0392b" font-weight="bold">电子烟（雾化）</text>
  <rect x="105" y="90" width="110" height="330" rx="16" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <!-- 吸嘴 -->
  <rect x="120" y="96" width="80" height="36" rx="8" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">吸嘴</text>
  <!-- 烟油仓 -->
  <rect x="120" y="150" width="80" height="70" rx="8" fill="#1f6f8b" opacity="0.35" stroke="#333" stroke-width="2"/>
  <text x="160" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">烟油仓</text>
  <!-- 雾化芯 -->
  <rect x="120" y="236" width="80" height="42" rx="8" fill="#c0392b" opacity="0.5" stroke="#333" stroke-width="2"/>
  <text x="160" y="261" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">雾化芯</text>
  <!-- 电池 -->
  <rect x="120" y="296" width="80" height="100" rx="8" fill="#2e7d32" opacity="0.3" stroke="#333" stroke-width="2"/>
  <text x="160" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">电池</text>
  <!-- 标注 -->
  <g stroke="#c0392b" stroke-width="1.5" fill="#c0392b">
    <line x1="215" y1="257" x2="250" y2="257"/>
    <text x="256" y="261" font-family="sans-serif" font-size="14">加热 200–250 ℃</text>
    <line x1="215" y1="185" x2="250" y2="185"/>
    <text x="256" y="189" font-family="sans-serif" font-size="14">PG/VG+尼古丁+香精</text>
  </g>
  <!-- 气溶胶箭头 -->
  <g stroke="#1f6f8b" stroke-width="2" fill="#1f6f8b">
    <line x1="160" y1="84" x2="160" y2="58"/>
    <polygon points="160,50 153,62 167,62"/>
    <text x="178" y="70" font-family="sans-serif" font-size="14" fill="#1f6f8b">气溶胶</text>
  </g>

  <!-- 分隔线 -->
  <line x1="360" y1="80" x2="360" y2="430" stroke="#ccc" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 右侧：加热不燃烧 -->
  <text x="560" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c0392b" font-weight="bold">加热不燃烧（烘烤）</text>
  <!-- 烟支 -->
  <rect x="520" y="96" width="80" height="86" rx="10" fill="#d9b38c" stroke="#333" stroke-width="2.5"/>
  <line x1="520" y1="150" x2="600" y2="150" stroke="#a0522d" stroke-width="2"/>
  <text x="560" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">烟草棒</text>
  <!-- 烟具 -->
  <rect x="505" y="182" width="110" height="238" rx="16" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
  <!-- 加热片 -->
  <rect x="535" y="200" width="50" height="66" rx="6" fill="#c0392b" opacity="0.55" stroke="#333" stroke-width="2"/>
  <text x="560" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">加热片</text>
  <!-- 电池 -->
  <rect x="520" y="330" width="80" height="70" rx="8" fill="#2e7d32" opacity="0.3" stroke="#333" stroke-width="2"/>
  <text x="560" y="371" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">电池</text>
  <!-- 标注 -->
  <g stroke="#c0392b" stroke-width="1.5" fill="#c0392b">
    <line x1="615" y1="233" x2="648" y2="233"/>
    <text x="654" y="237" font-family="sans-serif" font-size="14">加热 250–350 ℃</text>
    <line x1="615" y1="123" x2="648" y2="123"/>
    <text x="654" y="127" font-family="sans-serif" font-size="14">真实烟草</text>
  </g>
  <!-- 烟气箭头 -->
  <g stroke="#1f6f8b" stroke-width="2" fill="#1f6f8b">
    <line x1="560" y1="84" x2="560" y2="58"/>
    <polygon points="560,50 553,62 567,62"/>
    <text x="578" y="70" font-family="sans-serif" font-size="14" fill="#1f6f8b">烟气</text>
  </g>

  <text x="360" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">温度越低，燃烧产物越少；两者都不点燃，但都含尼古丁</text>
</svg>
