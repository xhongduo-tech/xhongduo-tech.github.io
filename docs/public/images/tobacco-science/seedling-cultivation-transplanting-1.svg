<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">漂浮育苗盘横截面示意图</title>
  <desc id="desc">泡沫育苗盘漂浮在营养液池上，基质穴内育烟苗，根系穿过盘底伸入营养液中。</desc>
  <rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">漂浮育苗盘横截面示意图</text>

  <!-- 营养液池 -->
  <rect x="40" y="270" width="640" height="120" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="40" y="330" width="640" height="60" fill="#1f6f8b" opacity="0.35"/>
  <line x1="40" y1="330" x2="680" y2="330" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 育苗盘 -->
  <rect x="100" y="200" width="520" height="70" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <!-- 基质穴 -->
  <rect x="150" y="212" width="70" height="46" rx="8" fill="#d9b38c" stroke="#333" stroke-width="1.5"/>
  <rect x="280" y="212" width="70" height="46" rx="8" fill="#d9b38c" stroke="#333" stroke-width="1.5"/>
  <rect x="410" y="212" width="70" height="46" rx="8" fill="#d9b38c" stroke="#333" stroke-width="1.5"/>
  <rect x="540" y="212" width="70" height="46" rx="8" fill="#d9b38c" stroke="#333" stroke-width="1.5"/>
  <!-- 盘底镂空示意：基质穴底部穿透 -->
  <line x1="185" y1="258" x2="185" y2="270" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="315" y1="258" x2="315" y2="270" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="445" y1="258" x2="445" y2="270" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="575" y1="258" x2="575" y2="270" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 烟苗：茎 + 叶 -->
  <g stroke="#2e7d32" stroke-width="3" fill="none">
    <line x1="185" y1="200" x2="185" y2="120"/>
    <line x1="315" y1="200" x2="315" y2="100"/>
    <line x1="445" y1="200" x2="445" y2="112"/>
    <line x1="575" y1="200" x2="575" y2="125"/>
  </g>
  <g fill="#4caf50">
    <ellipse cx="170" cy="138" rx="16" ry="6"/>
    <ellipse cx="200" cy="148" rx="15" ry="6"/>
    <ellipse cx="298" cy="118" rx="16" ry="6"/>
    <ellipse cx="332" cy="126" rx="15" ry="6"/>
    <ellipse cx="428" cy="128" rx="16" ry="6"/>
    <ellipse cx="462" cy="138" rx="15" ry="6"/>
    <ellipse cx="558" cy="142" rx="16" ry="6"/>
    <ellipse cx="592" cy="152" rx="15" ry="6"/>
  </g>

  <!-- 根系伸入营养液 -->
  <g stroke="#2e7d32" stroke-width="1.5" fill="none">
    <line x1="185" y1="270" x2="180" y2="340"/>
    <line x1="185" y1="270" x2="192" y2="345"/>
    <line x1="315" y1="270" x2="308" y2="335"/>
    <line x1="315" y1="270" x2="322" y2="348"/>
    <line x1="445" y1="270" x2="440" y2="338"/>
    <line x1="445" y1="270" x2="452" y2="346"/>
  </g>

  <!-- 标注 -->
  <g font-family="sans-serif" font-size="15" fill="#333">
    <line x1="360" y1="235" x2="360" y2="185" stroke="#c0392b" stroke-width="1.5"/>
    <text x="360" y="178" text-anchor="middle" fill="#c0392b" font-weight="bold">泡沫育苗盘</text>
    <line x1="300" y1="224" x2="218" y2="180" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="168" fill="#c0392b">基质穴（泥炭+蛭石）</text>
    <line x1="120" y1="345" x2="120" y2="312" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="120" y="388" text-anchor="middle" fill="#1f6f8b" font-weight="bold">营养液池</text>
    <line x1="575" y1="120" x2="660" y2="100" stroke="#333" stroke-width="1.5"/>
    <text x="672" y="104" fill="#333">烟苗</text>
  </g>
  <text x="360" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">根系穿出盘底镂孔伸入营养液吸肥吸水，盘面保持湿润</text>
</svg>
