<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif">
  <title>弦振动方程的导出：微元受力分析</title>
  <desc>水平绷紧的弦在平衡位置附近做小横振动，取微元 [x, x+Δx]，两端张力 T 的方向与水平夹角分别为 θ1 与 θ2，合力提供微元的竖直加速度。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <line x1="40" y1="300" x2="600" y2="300" stroke="#999" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="610" y="305" fill="#666" font-size="14">x 轴</text>
  <path d="M 60 300 Q 200 180 320 200 Q 440 220 580 300" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 140 300 Q 200 180 260 240" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M 260 240 Q 320 200 380 230" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="140" y1="300" x2="260" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="260" y1="240" x2="380" y2="230" stroke="#666" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="120" y="320" fill="#333" font-size="14">x</text>
  <text x="248" y="330" fill="#333" font-size="14">x+Δx</text>
  <text x="180" y="210" fill="#1f6f8b" font-size="15">θ₁</text>
  <text x="360" y="205" fill="#c0392b" font-size="15">θ₂</text>
  <line x1="260" y1="240" x2="140" y2="210" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="260" y1="240" x2="360" y2="240" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="380" y1="230" x2="240" y2="180" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="380" y1="230" x2="500" y2="230" stroke="#c0392b" stroke-width="1.5"/>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <text x="140" y="180" fill="#1f6f8b" font-size="14">T（左端张力）</text>
  <text x="400" y="210" fill="#c0392b" font-size="14">T（右端张力）</text>
  <text x="190" y="60" fill="#333" font-size="16">竖直合力 ≈ T·uₓₓ·Δx，微元质量 ρΔx</text>
  <text x="190" y="84" fill="#333" font-size="16">牛顿第二定律：ρΔx·uₜₜ = T·uₓₓ·Δx ⇒ uₜₜ = (T/ρ)uₓₓ</text>
  <text x="190" y="120" fill="#666" font-size="14">小角度近似：sinθ ≈ tanθ = uₓ</text>
</svg>
