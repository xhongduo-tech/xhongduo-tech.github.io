<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="sans-serif">
  <title>一维波动方程的区域结构</title>
  <desc>在 (x,t) 平面中，点 P(x0,t0) 的依赖区间是初始线上 [x0-at0, x0+at0]；该区间上初值的决定区域是夹在两条特征线之间的三角形；点 x0 的影响区域是它上方的特征锥。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <line x1="40" y1="380" x2="620" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="400" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="375" fill="#333" font-size="14">x</text>
  <text x="45" y="40" fill="#333" font-size="14">t</text>
  <text x="72" y="388" fill="#666" font-size="13">x₀-at₀</text>
  <text x="360" y="388" fill="#666" font-size="13">x₀+at₀</text>
  <line x1="200" y1="380" x2="320" y2="160" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="460" y1="380" x2="320" y2="160" stroke="#c0392b" stroke-width="2"/>
  <circle cx="320" cy="160" r="4" fill="#333"/>
  <text x="330" y="150" fill="#333" font-size="14">P(x₀,t₀)</text>
  <line x1="200" y1="380" x2="460" y2="380" stroke="#888" stroke-width="2"/>
  <path d="M200 380 L320 160 L460 380 Z" fill="#1f6f8b" opacity="0.12" stroke="none"/>
  <text x="305" y="320" fill="#1f6f8b" font-size="14">决定区域</text>
  <line x1="320" y1="160" x2="430" y2="40" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="320" y1="160" x2="210" y2="40" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="420" y="52" fill="#1f6f8b" font-size="13">影响锥（x₀ 的影响区域）</text>
  <text x="150" y="250" fill="#666" font-size="13">依赖区间 [x₀-at₀, x₀+at₀]</text>
</svg>
