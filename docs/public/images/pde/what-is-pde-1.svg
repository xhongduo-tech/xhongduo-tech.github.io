<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">弦振动模型推导波动方程的受力示意</title>
  <desc id="desc">一根两端固定的弦在平衡位置上方鼓起一个波峰。取弦上一段弦元 [x, x+Δx]，左端 A 与右端 B 的切线方向各受张力 T₁、T₂ 作用，与水平方向分别成角 θ₁、θ₂；两端张力的竖直分量 T₁sinθ₁ 与 T₂sinθ₂ 均向下且不相等，产生竖直方向的合力。图下方给出由牛顿第二定律推出 u_tt = (T/ρ)u_xx = c²u_xx 的公式框。</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect x="0" y="0" width="680" height="470" fill="#faf9f5"/>

  <!-- 顶部标题 -->
  <text x="340" y="34" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">弦振动模型的受力分析（弦元法）</text>

  <!-- 平衡位置（虚线） -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 固定端点 -->
  <g fill="#333">
    <circle cx="100" cy="320" r="4.5"/>
    <circle cx="580" cy="320" r="4.5"/>
  </g>

  <!-- 弦的波形（红色曲线，波峰朝上） -->
  <path d="M 100 320 Q 340 120 580 320" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 竖直投影虚线：从弦元两端垂直到平衡位置 -->
  <line x1="190" y1="259" x2="190" y2="320" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="292" y1="224" x2="292" y2="320" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Δx 双箭头 -->
  <line x1="190" y1="320" x2="292" y2="320" stroke="#333" stroke-width="1.6" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>

  <!-- 位移 u(x,t) 双箭头（波峰处） -->
  <line x1="340" y1="220" x2="340" y2="320" stroke="#333" stroke-width="1.6" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>

  <!-- 弦元两个端点 -->
  <g fill="#1f6f8b">
    <circle cx="190" cy="259" r="4"/>
    <circle cx="292" cy="224" r="4"/>
  </g>

  <!-- 切线（浅灰细线）：A 处较陡，B 处较平 -->
  <line x1="140" y1="285" x2="245" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="246" y1="232" x2="338" y2="216" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 张力 T₁（左端，沿切线向左下） -->
  <line x1="190" y1="259" x2="144" y2="283" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <!-- 张力 T₂（右端，沿切线向右下） -->
  <line x1="292" y1="224" x2="343" y2="233" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow-red)"/>

  <!-- 竖直分量 T₁sinθ₁（青，向下） -->
  <line x1="190" y1="259" x2="190" y2="283" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>
  <!-- 竖直分量 T₂sinθ₂（青，向下，更短） -->
  <line x1="292" y1="224" x2="292" y2="241" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>

  <!-- 角度弧与标注 -->
  <path d="M 164 259 A 26 26 0 0 0 166.9 271" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 314 224 A 22 22 0 0 1 313.7 227.6" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- 文字标注 -->
  <g font-size="14" fill="#333">
    <text x="120" y="268">T₁</text>
    <text x="338" y="218">T₂</text>
    <text x="170" y="266">θ₁</text>
    <text x="322" y="230">θ₂</text>
    <text x="198" y="276" fill="#1f6f8b">T₁sinθ₁</text>
    <text x="300" y="240" fill="#1f6f8b">T₂sinθ₂</text>
    <text x="241" y="346" text-anchor="middle">Δx = x_B − x_A</text>
    <text x="430" y="350">平衡位置</text>
    <text x="350" y="272">u(x,t)</text>
    <text x="241" y="222" text-anchor="middle" fill="#1f6f8b">弦元</text>
    <text x="86" y="348">固定端点</text>
    <text x="566" y="348">固定端点</text>
  </g>

  <!-- 公式框 -->
  <rect x="120" y="380" width="440" height="66" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.3"/>
  <text x="340" y="404" font-size="15" fill="#333" text-anchor="middle">
    牛顿第二定律（弦元）：ρΔx·u<tspan baseline-shift="sub" font-size="11">tt</tspan> ≈ T[u<tspan baseline-shift="sub" font-size="11">x</tspan>(x+Δx) − u<tspan baseline-shift="sub" font-size="11">x</tspan>(x)] ≈ T·u<tspan baseline-shift="sub" font-size="11">xx</tspan>Δx
  </text>
  <text x="340" y="432" font-size="15" fill="#c0392b" text-anchor="middle">
    令 c² = T/ρ，得 u<tspan baseline-shift="sub" font-size="11">tt</tspan> = c²·u<tspan baseline-shift="sub" font-size="11">xx</tspan>
  </text>
</svg>
