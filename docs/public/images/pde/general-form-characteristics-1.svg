<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" font-family="sans-serif">
  <title>波动方程的特征线族</title>
  <desc>在 (x, t) 平面中，波动方程 u_tt = c^2 u_xx 的特征线是两族直线：x 减 ct 等于常数（向右传播）与 x 加 ct 等于常数（向左传播）。扰动沿这些直线以波速 c 传播。</desc>

  <!-- 纸底 -->
  <rect x="0" y="0" width="620" height="420" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="60" y1="360" x2="580" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="60" y2="20" stroke="#333" stroke-width="1.5"/>
  <polygon points="580,360 570,356 570,364" fill="#333"/>
  <polygon points="60,20 56,30 64,30" fill="#333"/>
  <text x="588" y="365" font-size="16" fill="#333">x</text>
  <text x="40" y="26" font-size="16" fill="#333">t</text>
  <text x="70" y="380" font-size="13" fill="#666">O</text>

  <!-- 第一族特征线 x − ct = 常数（蓝色） -->
  <g stroke="#1f6f8b" stroke-width="2">
    <line x1="60" y1="280" x2="300" y2="40"/>   <!-- c = -1 -->
    <line x1="60" y1="360" x2="380" y2="40"/>   <!-- c = 0 -->
    <line x1="140" y1="360" x2="460" y2="40"/>  <!-- c = 1 -->
    <line x1="220" y1="360" x2="540" y2="40"/>  <!-- c = 2 -->
  </g>

  <!-- 第二族特征线 x + ct = 常数（红色） -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="60" y1="200" x2="220" y2="360"/>  <!-- c = 2 -->
    <line x1="60" y1="120" x2="300" y2="360"/>  <!-- c = 3 -->
    <line x1="60" y1="40" x2="380" y2="360"/>   <!-- c = 4 -->
    <line x1="140" y1="40" x2="460" y2="360"/>  <!-- c = 5 -->
    <line x1="220" y1="40" x2="540" y2="360"/>  <!-- c = 6 -->
  </g>

  <!-- 代表点 P 与特征方向标注 -->
  <circle cx="300" cy="200" r="5" fill="#333"/>
  <text x="308" y="192" font-size="15" fill="#333">P</text>
  <text x="250" y="168" font-size="13" fill="#666">信息沿特征线以速度 c 传播</text>

  <!-- 图例 -->
  <g font-size="14">
    <line x1="60" y1="408" x2="100" y2="408" stroke="#1f6f8b" stroke-width="3"/>
    <text x="108" y="413" fill="#333">x − ct = 常数（向右传播）</text>
    <line x1="330" y1="408" x2="370" y2="408" stroke="#c0392b" stroke-width="3"/>
    <text x="378" y="413" fill="#333">x + ct = 常数（向左传播）</text>
  </g>
</svg>
