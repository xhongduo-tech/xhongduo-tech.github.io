<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <title>家蚕完全变态生活史</title>
  <desc>家蚕四个形态阶段卵、幼虫、蛹、成虫的循环，及每个阶段的要点标注。</desc>
  <rect x="0" y="0" width="760" height="320" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">家蚕的完全变态生活史</text>

    <!-- 卵 -->
    <circle cx="100" cy="170" r="46" fill="#e8dcc8" stroke="#333" stroke-width="2"/>
    <circle cx="88" cy="160" r="8" fill="#c0392b" opacity="0.6"/>
    <circle cx="112" cy="180" r="7" fill="#c0392b" opacity="0.6"/>
    <text x="100" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">卵</text>
    <text x="100" y="256" text-anchor="middle" font-size="13" fill="#333">约 300–500 粒</text>
    <text x="100" y="274" text-anchor="middle" font-size="13" fill="#333">卵期约 10 天</text>

    <!-- 幼虫 -->
    <rect x="230" y="150" width="90" height="34" rx="16" fill="#f0e6cf" stroke="#333" stroke-width="2"/>
    <circle cx="320" cy="167" r="4" fill="#333"/>
    <text x="250" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">幼虫</text>
    <text x="250" y="256" text-anchor="middle" font-size="13" fill="#333">5 龄 4 眠 · 约 20–30 天</text>
    <text x="250" y="274" text-anchor="middle" font-size="13" fill="#333">丝腺在此期急速膨大</text>

    <!-- 蛹 -->
    <ellipse cx="390" cy="170" rx="30" ry="22" fill="#c9b98a" stroke="#333" stroke-width="2"/>
    <text x="390" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">蛹</text>
    <text x="390" y="256" text-anchor="middle" font-size="13" fill="#333">茧内 2–3 周</text>
    <text x="390" y="274" text-anchor="middle" font-size="13" fill="#333">不食不动 · 内部重组</text>

    <!-- 成虫 -->
    <g transform="translate(560,170)">
      <path d="M-30,0 Q-60,-28 -78,-14 Q-56,-8 -30,-8 Z" fill="#e0c8a0" stroke="#333" stroke-width="1.5"/>
      <path d="M-30,0 Q-60,28 -78,14 Q-56,8 -30,8 Z" fill="#e0c8a0" stroke="#333" stroke-width="1.5"/>
      <ellipse cx="-20" cy="0" rx="22" ry="9" fill="#d8c090" stroke="#333" stroke-width="1.5"/>
      <ellipse cx="8" cy="0" rx="16" ry="7" fill="#d8c090" stroke="#333" stroke-width="1.5"/>
      <path d="M18,-4 Q34,-26 52,-18 Q38,-6 24,-2 Z" fill="#e0c8a0" stroke="#333" stroke-width="1.5"/>
      <path d="M18,4 Q34,26 52,18 Q38,6 24,2 Z" fill="#e0c8a0" stroke="#333" stroke-width="1.5"/>
      <text x="-20" y="26" text-anchor="middle" font-size="13" fill="#333">交配</text>
    </g>
    <text x="560" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">成虫（蛾）</text>
    <text x="560" y="256" text-anchor="middle" font-size="13" fill="#333">不食 · 雌蛾约 1 周</text>
    <text x="560" y="274" text-anchor="middle" font-size="13" fill="#333">产卵后死亡</text>

    <!-- 箭头 -->
    <path d="M146,170 L222,170" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#a1)"/>
    <path d="M326,170 L352,170" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#a1)"/>
    <path d="M420,170 L518,170" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#a1)"/>
    <path d="M566,160 Q480,86 380,110 Q320,124 140,120 L100,128" stroke="#1f6f8b" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#a1)"/>
    <defs>
      <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
      </marker>
    </defs>
    <text x="184" y="110" text-anchor="middle" font-size="13" fill="#1f6f8b">吐丝结茧</text>
  </g>
</svg>
