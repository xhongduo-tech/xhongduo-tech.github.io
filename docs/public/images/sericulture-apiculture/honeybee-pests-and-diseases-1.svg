<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>狄斯瓦螨的生活史：成蜂期寄生相与巢房繁殖相交替循环</title>
  <desc>狄斯瓦螨的一生在两种生活相间循环：雌螨潜入幼虫巢房产卵繁殖，若螨随幼蜂出房，再转至成蜂体表吸食血淋巴并随蜂传播。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#faf9f5"/>

  <g>
    <rect x="190" y="40" width="320" height="92" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="350" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">① 潜入幼虫巢房（繁殖相开始）</text>
    <text x="350" y="90" text-anchor="middle" font-size="13" fill="#333">雌螨在封盖前潜入即将封盖的幼虫巢房</text>
    <text x="350" y="112" text-anchor="middle" font-size="13" fill="#333">偏爱雄蜂幼虫房（幼虫期长，够完成一个繁殖周期）</text>
  </g>

  <g>
    <rect x="540" y="205" width="150" height="122" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="615" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">② 产卵繁殖</text>
    <text x="553" y="252" font-size="13" fill="#333">在幼虫血淋巴</text>
    <text x="553" y="272" font-size="13" fill="#333">上产卵</text>
    <text x="553" y="292" font-size="13" fill="#333">1 雄螨 + 2–3 雌若螨</text>
    <text x="553" y="312" font-size="13" fill="#333">若螨吸食幼虫体液</text>
  </g>

  <g>
    <rect x="190" y="340" width="320" height="92" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="350" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">③ 随幼蜂出房（扩散）</text>
    <text x="350" y="390" text-anchor="middle" font-size="13" fill="#333">新雌螨与母螨随羽化幼蜂出巢，转入寄生相</text>
    <text x="350" y="412" text-anchor="middle" font-size="13" fill="#333">蛹期带毒 → 幼蜂翅膀畸形（残翅病毒 DWV）</text>
  </g>

  <g>
    <rect x="10" y="205" width="150" height="122" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <text x="85" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">④ 成蜂期寄生相</text>
    <text x="23" y="252" font-size="13" fill="#333">趴在成蜂体表</text>
    <text x="23" y="272" font-size="13" fill="#333">吸食血淋巴</text>
    <text x="23" y="292" font-size="13" fill="#333">随采集蜂飞到</text>
    <text x="23" y="312" font-size="13" fill="#333">新巢房传播</text>
  </g>

  <g>
    <text x="350" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">狄斯瓦螨生活史</text>
    <text x="350" y="276" text-anchor="middle" font-size="14" fill="#333">寄生相 ↔ 繁殖相 循环往复</text>
    <text x="350" y="300" text-anchor="middle" font-size="13" fill="#c0392b">危害：吸血（直接）＋ 传播残翅病毒（间接，更致命）</text>
  </g>

  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="420" y1="132" x2="540" y2="212"/>
    <line x1="615" y1="327" x2="510" y2="346"/>
    <line x1="190" y1="386" x2="160" y2="327"/>
    <line x1="85" y1="205" x2="196" y2="96"/>
  </g>

  <text x="350" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">防治要点：秋季断子期用药最有效 · 割雄蜂脾 · 轮换用药防抗药性</text>
</svg>
