<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>蜂群的社会结构：蜂王、工蜂、雄蜂三型个体各司其职</title>
  <desc>一个正常蜂群由一只蜂王、数万工蜂与数百雄蜂组成，三型个体各司其职，共同构成超个体。</desc>
  <rect width="700" height="440" fill="#faf9f5"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">蜂群的社会结构：三型个体各司其职</text>

  <g>
    <rect x="30" y="70" width="190" height="210" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <rect x="30" y="70" width="190" height="38" rx="10" fill="#c0392b"/>
    <text x="125" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">蜂王</text>
    <text x="45" y="134" font-size="13" fill="#333">雌性 · 二倍体（受精卵）</text>
    <text x="45" y="158" font-size="13" fill="#333">终生吃王浆，级型分化</text>
    <text x="45" y="182" font-size="13" fill="#333">专职产卵，日产上千粒</text>
    <text x="45" y="206" font-size="13" fill="#333">寿命可达数年</text>
    <text x="45" y="230" font-size="13" fill="#333">唯一正常繁殖的雌蜂</text>
    <text x="45" y="260" font-size="14" font-weight="bold" fill="#c0392b">→ 群势的发动机</text>
  </g>

  <g>
    <rect x="255" y="70" width="190" height="210" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <rect x="255" y="70" width="190" height="38" rx="10" fill="#1f6f8b"/>
    <text x="350" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">工蜂</text>
    <text x="270" y="134" font-size="13" fill="#333">雌性 · 生殖器官退化</text>
    <text x="270" y="158" font-size="13" fill="#333">按日龄分工（龄期分工）</text>
    <text x="270" y="182" font-size="13" fill="#333">内勤育幼 → 酿蜜筑巢</text>
    <text x="270" y="206" font-size="13" fill="#333">→ 外勤采集</text>
    <text x="270" y="230" font-size="13" fill="#333">数万只 · 采蜜期活 30–45 天</text>
    <text x="270" y="260" font-size="14" font-weight="bold" fill="#1f6f8b">→ 蜂群的劳动力</text>
  </g>

  <g>
    <rect x="480" y="70" width="190" height="210" rx="10" fill="#ffffff" stroke="#8a7a3c" stroke-width="2"/>
    <rect x="480" y="70" width="190" height="38" rx="10" fill="#8a7a3c"/>
    <text x="575" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">雄蜂</text>
    <text x="495" y="134" font-size="13" fill="#333">雄性 · 单倍体（未受精卵）</text>
    <text x="495" y="158" font-size="13" fill="#333">无螫针 · 不采蜜</text>
    <text x="495" y="182" font-size="13" fill="#333">专职与处女王交配</text>
    <text x="495" y="206" font-size="13" fill="#333">交配后即死</text>
    <text x="495" y="230" font-size="13" fill="#333">越冬前被工蜂逐出</text>
    <text x="495" y="260" font-size="14" font-weight="bold" fill="#8a7a3c">→ 繁殖季节的配角</text>
  </g>

  <g>
    <rect x="30" y="310" width="640" height="110" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="350" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">超个体 = 蜂王 × 1 ＋ 工蜂 × 数万 ＋ 雄蜂 × 数百（繁殖季节）</text>
    <text x="350" y="364" text-anchor="middle" font-size="14" fill="#333">单只蜜蜂无法独自存活，真正「活着」的单位是整个蜂群</text>
    <text x="350" y="388" text-anchor="middle" font-size="14" fill="#333">通讯系统：摆尾舞（编码方向与距离）＋ 信息素（蜂王素、警报素、巢味）</text>
    <text x="350" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">分蜂：超个体水平的「繁殖」</text>
  </g>
</svg>
