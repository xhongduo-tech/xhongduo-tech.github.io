<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="sans-serif">
  <title>朗肯循环 T-s 图</title>
  <desc>温度—熵（T-s）图上绘出的朗肯循环：泵等熵压缩、锅炉定压加热、汽轮机等熵膨胀、冷凝器定压冷凝，外加饱和液线、饱和汽线与临界点。</desc>
  <rect width="640" height="500" fill="#faf9f5"/>
  <defs>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowaxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 坐标轴 -->
  <line x1="80" y1="70" x2="80" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrowaxis)"/>
  <line x1="80" y1="440" x2="600" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrowaxis)"/>
  <text x="52" y="78" font-size="18" fill="#333">T</text>
  <text x="560" y="462" font-size="15" fill="#333">s（熵）</text>

  <!-- 饱和曲线（包络线） -->
  <path d="M 160 430 C 250 320, 285 170, 320 90" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 320 90 C 380 170, 430 320, 520 430" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <circle cx="320" cy="90" r="4" fill="#1f6f8b"/>
  <text x="335" y="64" font-size="14" fill="#1f6f8b">临界点</text>
  <text x="240" y="120" font-size="14" fill="#1f6f8b">饱和液线</text>
  <text x="375" y="120" font-size="14" fill="#1f6f8b">饱和汽线</text>

  <!-- 朗肯循环过程线 -->
  <path d="M 173 413 L 162 390" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <path d="M 162 390 C 195 310, 245 225, 284 180" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <path d="M 284 180 L 376 180" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <path d="M 376 180 C 400 225, 415 260, 430 300" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <path d="M 430 300 L 430 413" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <path d="M 430 413 L 173 413" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <!-- 状态点 -->
  <circle cx="173" cy="413" r="4.5" fill="#c0392b"/>
  <text x="150" y="428" font-size="16" fill="#333" font-weight="bold">1</text>
  <circle cx="162" cy="390" r="4.5" fill="#c0392b"/>
  <text x="143" y="387" font-size="16" fill="#333" font-weight="bold">2</text>
  <circle cx="430" cy="300" r="4.5" fill="#c0392b"/>
  <text x="447" y="296" font-size="16" fill="#333" font-weight="bold">3</text>
  <circle cx="430" cy="413" r="4.5" fill="#c0392b"/>
  <text x="452" y="428" font-size="16" fill="#333" font-weight="bold">4</text>

  <!-- 过程标注 -->
  <text x="120" y="450" font-size="14" fill="#333">1→2 泵（等熵压缩）</text>
  <text x="266" y="200" font-size="14" fill="#333">2→3 锅炉定压加热</text>
  <text x="446" y="248" font-size="14" fill="#333">3→4 汽轮机等熵膨胀</text>
  <text x="296" y="456" font-size="14" fill="#333">4→1 冷凝器定压冷凝</text>

  <!-- 区域标注 -->
  <text x="158" y="300" font-size="15" fill="#555">液相区</text>
  <text x="292" y="330" font-size="15" fill="#555">湿蒸汽区（两相）</text>
  <text x="478" y="220" font-size="15" fill="#555">过热蒸汽区</text>

  <!-- 面积说明 -->
  <text x="440" y="390" font-size="13" fill="#555">循环闭合曲线围出的面积</text>
  <text x="440" y="406" font-size="13" fill="#555">＝ 单位质量工质的净功</text>
</svg>
