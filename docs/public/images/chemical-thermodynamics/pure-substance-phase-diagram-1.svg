<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
<title>纯物质的压强—温度相图</title>
<desc>一张 p-T 相图：固、液、气三个单相区，升华线、汽化线、固液线三条两相共存线，三相点与临界点；其中水的固液线斜率为负，通常物质为虚线正斜率。</desc>
<rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
<!-- 坐标轴 -->
<line x1="60" y1="420" x2="620" y2="420" stroke="#333" stroke-width="2"/>
<line x1="60" y1="420" x2="60" y2="40" stroke="#333" stroke-width="2"/>
<polygon points="620,420 608,415 608,425" fill="#333"/>
<polygon points="60,40 55,52 65,52" fill="#333"/>
<text x="600" y="448" font-family="sans-serif" font-size="16" fill="#333">温度 T</text>
<text x="18" y="55" font-family="sans-serif" font-size="16" fill="#333">压强 p</text>
<!-- 升华线（固-气平衡） -->
<path d="M 100 415 Q 150 372 200 300" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<!-- 汽化线（液-气平衡） -->
<path d="M 200 300 Q 340 230 470 130" fill="none" stroke="#c0392b" stroke-width="3"/>
<!-- 水的固液线（斜率为负） -->
<path d="M 200 300 L 140 60" fill="none" stroke="#333" stroke-width="3"/>
<!-- 通常物质的固液线（虚线，斜率为正） -->
<path d="M 200 300 L 330 70" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<!-- 三相点与临界点 -->
<circle cx="200" cy="300" r="5" fill="#c0392b"/>
<circle cx="470" cy="130" r="5" fill="#c0392b"/>
<text x="215" y="318" font-family="sans-serif" font-size="14" fill="#333">三相点</text>
<text x="215" y="334" font-family="sans-serif" font-size="13" fill="#666">(T=0.01 °C)</text>
<text x="485" y="125" font-family="sans-serif" font-size="14" fill="#333">临界点</text>
<!-- 相区标注 -->
<text x="105" y="200" font-family="sans-serif" font-size="22" fill="#333">固</text>
<text x="330" y="130" font-family="sans-serif" font-size="22" fill="#333">液</text>
<text x="430" y="380" font-family="sans-serif" font-size="22" fill="#333">气</text>
<!-- 曲线注释 -->
<text x="95" y="95" font-family="sans-serif" font-size="13" fill="#666">水：固液线斜率 &lt; 0</text>
<text x="345" y="58" font-family="sans-serif" font-size="13" fill="#666">通常物质（虚线）</text>
<text x="320" y="180" font-family="sans-serif" font-size="13" fill="#666">汽化线</text>
<text x="250" y="268" font-family="sans-serif" font-size="13" fill="#666">升华线</text>
</svg>
