<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif">
  <title>五度标调法示意</title>
  <desc>纵轴把音高分为 1 到 5 五个等级，横轴表示音节内音高走向，画出高平、中升、低降升、高峰四种典型声调轮廓。</desc>
  <rect width="480" height="300" fill="#faf9f5"/>
  <text x="240" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">五度标调法：音高五等分</text>
  <line x1="80" y1="240" x2="440" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="440" y2="60" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="105" x2="440" y2="105" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="150" x2="440" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="195" x2="440" y2="195" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="55" y="64" text-anchor="end" font-size="13" fill="#333">5（高）</text>
  <text x="55" y="109" text-anchor="end" font-size="13" fill="#333">4</text>
  <text x="55" y="154" text-anchor="end" font-size="13" fill="#333">3</text>
  <text x="55" y="199" text-anchor="end" font-size="13" fill="#333">2</text>
  <text x="55" y="244" text-anchor="end" font-size="13" fill="#333">1（低）</text>
  <text x="105" y="265" text-anchor="middle" font-size="13" fill="#333">音节起始</text>
  <text x="415" y="265" text-anchor="middle" font-size="13" fill="#333">音节结束</text>
  <line x1="170" y1="60" x2="360" y2="60" stroke="#c0392b" stroke-width="3"/>
  <text x="415" y="64" text-anchor="end" font-size="13" fill="#c0392b">55 高平</text>
  <line x1="170" y1="150" x2="360" y2="60" stroke="#1f6f8b" stroke-width="3"/>
  <text x="415" y="118" text-anchor="end" font-size="13" fill="#1f6f8b">35 中升</text>
  <line x1="170" y1="195" x2="250" y2="240" stroke="#8a6d3b" stroke-width="3"/>
  <line x1="250" y1="240" x2="360" y2="105" stroke="#8a6d3b" stroke-width="3"/>
  <text x="415" y="172" text-anchor="end" font-size="13" fill="#8a6d3b">214 低降升</text>
  <line x1="170" y1="60" x2="360" y2="240" stroke="#4a6d3b" stroke-width="3"/>
  <text x="415" y="226" text-anchor="end" font-size="13" fill="#4a6d3b">51 高降</text>
</svg>
