<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>Wigner 半圆律示意</title>
  <desc>半圆密度曲线：特征值经验谱分布收敛到支撑在 [-2,2] 上的半圆密度，边缘处以平方根速率趋于零。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <line x1="70" y1="330" x2="600" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="330" x2="180" y2="60" stroke="#333" stroke-width="1.5"/>
  <path d="M 70 330 L 180 330 L 180 60 L 290 60" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 180 330 C 240 320 255 300 260 285 M 180 330 C 120 320 105 300 100 285" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 180 330 C 240 320 255 300 260 285" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 180 330 C 120 320 105 300 100 285" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 100 285 Q 140 240 180 285 Q 220 240 260 285" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="180" y="355" text-anchor="middle" fill="#333" font-size="15">0</text>
  <text x="100" y="355" text-anchor="middle" fill="#333" font-size="15">-2</text>
  <text x="260" y="355" text-anchor="middle" fill="#333" font-size="15">2</text>
  <text x="400" y="355" text-anchor="middle" fill="#333" font-size="15">特征值 λ</text>
  <text x="20" y="120" fill="#333" font-size="15">密度</text>
  <text x="205" y="120" fill="#1f6f8b" font-size="15">半圆 ρ(λ) = (1/2π)√(4−λ²)</text>
  <text x="205" y="145" fill="#c0392b" font-size="15">边缘处平方根消失</text>
  <text x="205" y="170" fill="#333" font-size="14">支撑集 [−2, 2]</text>
</svg>
