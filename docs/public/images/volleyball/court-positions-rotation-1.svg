<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>排球半场六位置与顺时针轮转</title>
  <desc>本队半场的前排 4、3、2 号位与后排 5、6、1 号位分布，以及顺时针轮转方向</desc>
  <rect width="640" height="480" fill="#faf9f5"/>
  <!-- 网 -->
  <line x1="60" y1="40" x2="580" y2="40" stroke="#333" stroke-width="3"/>
  <text x="60" y="32" font-size="14" fill="#1f6f8b" font-weight="bold">球网</text>
  <!-- 场地外框 -->
  <rect x="80" y="40" width="480" height="360" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <!-- 中线（进攻线） -->
  <line x1="80" y1="180" x2="560" y2="180" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="86" y="196" font-size="13" fill="#888">进攻线</text>
  <!-- 端线标注 -->
  <text x="86" y="420" font-size="13" fill="#888">端线</text>
  <!-- 前排位置 4 3 2 -->
  <circle cx="160" cy="100" r="26" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="160" y="107" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">4</text>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#1f6f8b">前排左</text>
  <circle cx="320" cy="100" r="26" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="107" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">3</text>
  <text x="320" y="145" text-anchor="middle" font-size="13" fill="#1f6f8b">前排中</text>
  <circle cx="480" cy="100" r="26" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="480" y="107" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">2</text>
  <text x="480" y="145" text-anchor="middle" font-size="13" fill="#1f6f8b">前排右</text>
  <!-- 后排位置 5 6 1 -->
  <circle cx="160" cy="330" r="26" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="160" y="337" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">5</text>
  <text x="160" y="375" text-anchor="middle" font-size="13" fill="#c0392b">后排左</text>
  <circle cx="320" cy="330" r="26" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="337" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">6</text>
  <text x="320" y="375" text-anchor="middle" font-size="13" fill="#c0392b">后排中</text>
  <circle cx="480" cy="330" r="26" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="337" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">1</text>
  <text x="480" y="375" text-anchor="middle" font-size="13" fill="#c0392b">后排右（发球位）</text>
  <!-- 顺时针轮转箭头 -->
  <path d="M 480 180 Q 480 60 320 52 Q 160 44 138 180" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="520" y="120" font-size="14" fill="#c0392b" font-weight="bold">顺时针轮转</text>
</svg>
