<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>四种淬火方法的冷却曲线示意图</title>
  <desc>以奥氏体等温转变曲线（C 曲线）为背景，示意单液水淬、双液水淬、分级淬火与等温淬火四条冷却路径的温度-时间关系。</desc>
  <rect width="720" height="480" fill="#faf9f5"/>
  <g stroke="#c8c2b8" stroke-width="1">
    <line x1="90" y1="60" x2="90" y2="440"/>
    <line x1="90" y1="440" x2="660" y2="440"/>
  </g>
  <text x="30" y="250" fill="#333" font-size="15" transform="rotate(-90 30 250)">温度（℃）</text>
  <text x="380" y="468" fill="#333" font-size="15" text-anchor="middle">时间（s，对数坐标）</text>
  <g fill="#333" font-size="13" text-anchor="end">
    <text x="82" y="66">800</text>
    <text x="82" y="148">600</text>
    <text x="82" y="240">400</text>
    <text x="82" y="322">250</text>
    <text x="82" y="410">50</text>
  </g>
  <g stroke="#a0998e" stroke-width="1.2" stroke-dasharray="6 4">
    <line x1="90" y1="95" x2="660" y2="95"/>
    <line x1="90" y1="321" x2="660" y2="321"/>
    <line x1="90" y1="416" x2="660" y2="416"/>
  </g>
  <text x="664" y="90" fill="#666" font-size="13">A₁（727 ℃）</text>
  <text x="664" y="316" fill="#666" font-size="13">M_s（约 250 ℃）</text>
  <text x="664" y="411" fill="#666" font-size="13">M_f</text>
  <path d="M 300,200 C 320,120 520,110 600,98" fill="none" stroke="#8d8577" stroke-width="1.6"/>
  <path d="M 300,200 C 250,320 320,420 430,420" fill="none" stroke="#8d8577" stroke-width="1.6"/>
  <text x="560" y="78" fill="#8d8577" font-size="13">奥氏体转变开始线</text>
  <text x="460" y="438" fill="#8d8577" font-size="13">转变终了线</text>
  <text x="360" y="120" fill="#8d8577" font-size="13">珠光体区</text>
  <text x="300" y="265" fill="#8d8577" font-size="13">贝氏体区</text>
  <text x="140" y="385" fill="#8d8577" font-size="13">马氏体区</text>
  <path d="M 150,66 L 175,321 L 180,414" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="132" y="175" fill="#c0392b" font-size="13">① 单液水淬</text>
  <path d="M 150,66 L 172,318 C 205,318 235,340 268,414" fill="none" stroke="#e08a2e" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="140" y="285" fill="#e08a2e" font-size="13">② 双液水-油</text>
  <path d="M 150,66 L 172,307 L 300,307 C 318,340 326,380 336,414" fill="none" stroke="#1f6f8b" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="250" y="298" fill="#1f6f8b" font-size="13">③ 分级淬火（盐浴中停留）</text>
  <path d="M 150,66 L 180,240 L 420,240 L 440,414" fill="none" stroke="#4a8f3d" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="250" y="228" fill="#4a8f3d" font-size="13">④ 等温淬火（贝氏体等温）</text>
</svg>
