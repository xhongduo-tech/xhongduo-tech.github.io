<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>杨氏双缝干涉光路图</title>
  <desc>点光源 S 发出的光经挡板上的双缝 S1 与 S2 分成两列相干波，两缝相距 d、距屏 D，在屏上 P 点叠加；缝间距 d、缝屏距 D 与 P 到光轴的位移 x 决定了到达 P 的两路光程差。</desc>
  <rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
  <rect x="150" y="40" width="18" height="300" fill="#333"/>
  <rect x="150" y="160" width="18" height="12" fill="#faf9f5"/>
  <rect x="150" y="220" width="18" height="12" fill="#faf9f5"/>
  <circle cx="60" cy="196" r="5" fill="#c0392b"/>
  <text x="60" y="170" font-size="14" text-anchor="middle" fill="#333">S</text>
  <text x="150" y="148" font-size="14" text-anchor="middle" fill="#333">S₁</text>
  <text x="150" y="250" font-size="14" text-anchor="middle" fill="#333">S₂</text>
  <line x1="65" y1="196" x2="150" y2="166" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="65" y1="196" x2="150" y2="226" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="540" y="20" width="12" height="340" fill="#1f6f8b"/>
  <circle cx="546" cy="120" r="4" fill="#c0392b"/>
  <text x="560" y="124" font-size="14" fill="#333">P</text>
  <line x1="168" y1="166" x2="540" y2="120" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="168" y1="226" x2="540" y2="120" stroke="#1f6f8b" stroke-width="1.6"/>
  <line x1="60" y1="196" x2="546" y2="196" stroke="#999" stroke-width="0.8" stroke-dasharray="2,3"/>
  <line x1="180" y1="166" x2="180" y2="226" stroke="#333" stroke-width="1"/>
  <text x="192" y="200" font-size="14" fill="#333">d</text>
  <line x1="168" y1="56" x2="540" y2="56" stroke="#333" stroke-width="1"/>
  <text x="354" y="48" font-size="14" text-anchor="middle" fill="#333">D</text>
  <line x1="546" y1="120" x2="546" y2="196" stroke="#333" stroke-width="1"/>
  <text x="556" y="164" font-size="14" fill="#333">x</text>
  <text x="546" y="180" font-size="13" text-anchor="end" fill="#333">θ</text>
  <g fill="#c0392b" opacity="0.9">
    <rect x="558" y="96" width="6" height="10"/>
    <rect x="558" y="120" width="6" height="10"/>
    <rect x="558" y="144" width="6" height="10"/>
  </g>
  <g fill="#c0392b" opacity="0.25">
    <rect x="558" y="78" width="6" height="8"/>
    <rect x="558" y="108" width="6" height="8"/>
    <rect x="558" y="132" width="6" height="8"/>
    <rect x="558" y="156" width="6" height="8"/>
  </g>
  <text x="60" y="350" font-size="13" fill="#333">点光源 S 照亮双缝 S₁、S₂，两路光在屏上 P 点叠加</text>
</svg>
