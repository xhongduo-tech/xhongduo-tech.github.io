<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="sans-serif">
  <title>物理吸附与化学吸附的势能曲线</title>
  <desc>示意图：分子从远处（势能零点）靠近金属表面，先经历较浅的物理吸附阱，再翻越活化势垒进入更深的化学吸附阱。物理吸附阱浅、平衡距离远；化学吸附阱深、平衡距离近。</desc>
  <rect x="0" y="0" width="660" height="420" fill="#ffffff"/>
  <rect x="40" y="50" width="50" height="310" fill="#e8e6e0"/>
  <line x1="90" y1="50" x2="90" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="340" x2="640" y2="340" stroke="#333" stroke-width="2"/>
  <text x="65" y="200" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 65 200)">金属</text>
  <text x="330" y="368" fill="#333" font-size="14" text-anchor="middle">离表面距离 z →</text>
  <text x="78" y="52" fill="#333" font-size="14" text-anchor="end">势能 V</text>
  <text x="620" y="66" fill="#333" font-size="13" text-anchor="end">0（自由分子）</text>
  <path d="M 600,70 C 480,90 370,110 300,150 C 250,180 200,250 150,330" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 600,70 C 430,125 280,185 185,285 C 165,325 145,360 125,400" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="300" y2="340" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="185" y1="285" x2="185" y2="340" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="330" y="140" fill="#1f6f8b" font-size="14">物理吸附阱（浅）</text>
  <text x="330" y="158" fill="#1f6f8b" font-size="13">范德华作用，ΔH ≈ −(10–40) kJ/mol</text>
  <text x="150" y="300" fill="#c0392b" font-size="14">化学吸附阱（深）</text>
  <text x="150" y="318" fill="#c0392b" font-size="13">化学键，ΔH ≈ −(50–400) kJ/mol</text>
  <circle cx="200" cy="258" r="4" fill="#333"/>
  <text x="205" y="248" fill="#333" font-size="13">E<sub>ads</sub>（吸附活化能）</text>
  <line x1="300" y1="150" x2="300" y2="70" stroke="#555" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="312" y="92" fill="#555" font-size="13">ΔH<sub>phys</sub></text>
  <line x1="185" y1="285" x2="185" y2="70" stroke="#555" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="148" y="120" fill="#555" font-size="13">ΔH<sub>chem</sub></text>
</svg>
