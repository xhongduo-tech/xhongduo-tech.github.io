<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">关系（relation）、属性（attribute）与元组（tuple）</title>
  <desc id="desc">一张名为 instructor 的二维表：表头四列（ID、name、dept_name、salary）即属性；每一行是一个元组。左侧红色标注指出表整体是一个关系；右侧红色标注分别指向表头与首行，说明属性即列、元组即行；下方青色标注说明域是属性取值的集合。</desc>

  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect width="860" height="460" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="430" y="32" text-anchor="middle" font-size="20" fill="#333">关系（relation）instructor 的一个实例</text>
  <text x="430" y="54" text-anchor="middle" font-size="15" fill="#555">关系模式：instructor(ID, name, dept_name, salary)</text>

  <!-- 左侧：关系名标注（大括号框住整张表） -->
  <text x="26" y="200" font-size="14" fill="#c0392b" font-weight="bold">关系名</text>
  <text x="26" y="220" font-size="13" fill="#c0392b">（relation）</text>
  <line x1="150" y1="112" x2="150" y2="318" stroke="#c0392b" stroke-width="2"/>
  <line x1="147" y1="112" x2="150" y2="112" stroke="#c0392b" stroke-width="2"/>
  <line x1="147" y1="318" x2="150" y2="318" stroke="#c0392b" stroke-width="2"/>
  <line x1="150" y1="215" x2="172" y2="215" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 表：4 列 ×（表头 + 3 行） -->
  <!-- 列边界：180-300(ID) 300-420(name) 420-540(dept_name) 540-660(salary) -->
  <!-- 表头 y100-150，数据行 y150-210 / 210-270 / 270-330 -->

  <!-- 表头（属性） -->
  <rect x="180" y="100" width="480" height="50" fill="#eef1f6" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="300" y1="100" x2="300" y2="150" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="420" y1="100" x2="420" y2="150" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="540" y1="100" x2="540" y2="150" stroke="#c8c2b4" stroke-width="1.5"/>
  <text x="240" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">ID</text>
  <text x="360" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">name</text>
  <text x="480" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">dept_name</text>
  <text x="600" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">salary</text>

  <!-- 数据行（元组） -->
  <rect x="180" y="150" width="480" height="60" fill="#ffffff" stroke="#c8c2b4" stroke-width="1.5"/>
  <rect x="180" y="210" width="480" height="60" fill="#ffffff" stroke="#c8c2b4" stroke-width="1.5"/>
  <rect x="180" y="270" width="480" height="60" fill="#ffffff" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="300" y1="150" x2="300" y2="330" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="420" y2="330" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="540" y1="150" x2="540" y2="330" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="180" y1="210" x2="660" y2="210" stroke="#c8c2b4" stroke-width="1.5"/>
  <line x1="180" y1="270" x2="660" y2="270" stroke="#c8c2b4" stroke-width="1.5"/>

  <text x="240" y="188" text-anchor="middle" font-size="14" fill="#333">10101</text>
  <text x="360" y="188" text-anchor="middle" font-size="14" fill="#333">Srinivasan</text>
  <text x="480" y="188" text-anchor="middle" font-size="14" fill="#333">CS</text>
  <text x="600" y="188" text-anchor="middle" font-size="14" fill="#333">65000</text>

  <text x="240" y="248" text-anchor="middle" font-size="14" fill="#333">12121</text>
  <text x="360" y="248" text-anchor="middle" font-size="14" fill="#333">Wu</text>
  <text x="480" y="248" text-anchor="middle" font-size="14" fill="#333">Finance</text>
  <text x="600" y="248" text-anchor="middle" font-size="14" fill="#333">90000</text>

  <text x="240" y="308" text-anchor="middle" font-size="14" fill="#333">15151</text>
  <text x="360" y="308" text-anchor="middle" font-size="14" fill="#333">Mozart</text>
  <text x="480" y="308" text-anchor="middle" font-size="14" fill="#333">Music</text>
  <text x="600" y="308" text-anchor="middle" font-size="14" fill="#333">40000</text>

  <!-- 右侧：属性 / 元组 标注 -->
  <text x="690" y="118" font-size="15" fill="#c0392b" font-weight="bold">属性 attribute</text>
  <text x="690" y="138" font-size="13" fill="#c0392b">＝ 列（column）</text>
  <line x1="688" y1="127" x2="666" y2="127" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="690" y="183" font-size="15" fill="#c0392b" font-weight="bold">元组 tuple</text>
  <text x="690" y="203" font-size="13" fill="#c0392b">＝ 行（row）</text>
  <line x1="688" y1="192" x2="666" y2="192" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 下方：域 标注 -->
  <text x="240" y="398" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">域（domain）：属性的取值集合</text>
  <text x="240" y="418" text-anchor="middle" font-size="13" fill="#555">如 ID 列只能取 5 位字符串</text>
  <line x1="240" y1="378" x2="240" y2="336" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>
</svg>
