<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>递归查询的逐轮迭代：沿组织层级向上追溯</title>
  <desc>从工程师出发，第1轮找到直接上级经理，第2轮找到副总裁，第3轮找到首席执行官；三轮结果取并集就是全部祖先。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <!-- 节点 -->
  <g stroke="#333" fill="#fff" stroke-width="2">
    <rect x="140" y="38" width="220" height="44" rx="8"/>
    <rect x="140" y="118" width="220" height="44" rx="8"/>
    <rect x="140" y="198" width="220" height="44" rx="8"/>
    <rect x="140" y="278" width="220" height="44" rx="8"/>
  </g>
  <g fill="#333" font-size="16" text-anchor="middle">
    <text x="250" y="66">首席执行官（CEO）</text>
    <text x="250" y="146">副总裁（VP）</text>
    <text x="250" y="226">经理（Mgr）</text>
    <text x="250" y="306">工程师（Eng）</text>
  </g>
  <!-- 箭头 -->
  <g stroke="#c0392b" stroke-width="2.5" fill="#c0392b">
    <line x1="100" y1="282" x2="100" y2="230"/>
    <polygon points="100,224 95,234 105,234"/>
    <line x1="100" y1="202" x2="100" y2="150"/>
    <polygon points="100,144 95,154 105,154"/>
    <line x1="100" y1="122" x2="100" y2="70"/>
    <polygon points="100,64 95,74 105,74"/>
  </g>
  <g fill="#1f6f8b" font-size="14" text-anchor="start">
    <text x="112" y="258">第1轮：直接上级</text>
    <text x="112" y="178">第2轮：上级的上级</text>
    <text x="112" y="98">第3轮：再上一级</text>
  </g>
  <!-- 说明框 -->
  <g>
    <rect x="420" y="80" width="190" height="152" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="440" y="108" fill="#333" font-size="14" font-weight="bold">全部祖先</text>
    <text x="440" y="132" fill="#333" font-size="14">= 第1轮 ∪ 第2轮 ∪ 第3轮</text>
    <text x="440" y="162" fill="#1f6f8b" font-size="13">每一轮向上走一级</text>
    <text x="440" y="184" fill="#1f6f8b" font-size="13">直到某轮无新增即收敛</text>
    <text x="440" y="214" fill="#1f6f8b" font-size="13">UNION 去重，保证终止</text>
  </g>
</svg>
