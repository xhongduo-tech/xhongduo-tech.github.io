<svg viewBox="0 0 900 340" width="900" height="340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>政策过程的六个环节</title>
<desc>政策过程沿问题认定、议程设置、政策形成、政策采纳、政策执行、政策评估六个环节推进，评估结果反馈回问题认定，构成循环。</desc>
<rect width="900" height="340" fill="#faf9f5"/>
<!-- row 1 -->
<g font-size="15" text-anchor="middle">
<rect x="40" y="40" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="160" y="80" fill="#333" font-weight="bold">① 问题认定</text>
<text x="160" y="106" fill="#333">识别并界定公共问题</text>
<rect x="330" y="40" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="450" y="80" fill="#333" font-weight="bold">② 议程设置</text>
<text x="450" y="106" fill="#333">进入制度议程</text>
<rect x="620" y="40" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="740" y="80" fill="#333" font-weight="bold">③ 政策形成</text>
<text x="740" y="106" fill="#333">酝酿备选方案</text>
</g>
<!-- row 2 -->
<g font-size="15" text-anchor="middle">
<rect x="620" y="200" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="740" y="240" fill="#333" font-weight="bold">④ 政策采纳</text>
<text x="740" y="266" fill="#333">立法 / 行政 / 司法拍板</text>
<rect x="330" y="200" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="450" y="240" fill="#333" font-weight="bold">⑤ 政策执行</text>
<text x="450" y="266" fill="#333">官僚机构落地实施</text>
<rect x="40" y="200" width="240" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="160" y="240" fill="#333" font-weight="bold">⑥ 政策评估</text>
<text x="160" y="266" fill="#333">衡量效果与副作用</text>
</g>
<defs>
<marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#333"/></marker>
<marker id="f3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#c0392b"/></marker>
</defs>
<!-- row1 arrows -->
<line x1="280" y1="85" x2="330" y2="85" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<line x1="570" y1="85" x2="620" y2="85" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<!-- row1->row2 -->
<line x1="740" y1="130" x2="740" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<!-- row2 arrows -->
<line x1="620" y1="245" x2="570" y2="245" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<line x1="330" y1="245" x2="280" y2="245" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<!-- feedback -->
<path d="M 160 290 C 160 330, 14 320, 14 150 C 14 100, 100 90, 155 90" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f3)"/>
<text x="34" y="210" font-size="13" fill="#c0392b" transform="rotate(-90 34 210)">反馈：评估重塑问题定义</text>
</svg>
