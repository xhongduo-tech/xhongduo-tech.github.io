<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="sans-serif">
<title>均匀直线阵及其波束扫描</title>
<desc>N 个等间距 d 排列的各向同性单元组成均匀直线阵，波程差 d·cosθ 产生相位差，调节激励相位即可让波束指向 θ0。</desc>
<rect x="0" y="0" width="480" height="240" fill="#faf9f5"/>
<!-- 阵元 -->
<g>
  <rect x="70" y="110" width="16" height="28" rx="2" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="150" y="110" width="16" height="28" rx="2" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="230" y="110" width="16" height="28" rx="2" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="310" y="110" width="16" height="28" rx="2" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="390" y="110" width="16" height="28" rx="2" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
</g>
<text x="150" y="92" font-size="13" fill="#1f6f8b" text-anchor="middle">单元 1</text>
<text x="318" y="92" font-size="13" fill="#1f6f8b" text-anchor="middle">单元 N</text>
<!-- 间距标注 -->
<line x1="86" y1="150" x2="158" y2="150" stroke="#333" stroke-width="1.5"/>
<text x="122" y="168" font-size="13" fill="#333" text-anchor="middle">间距 d</text>
<!-- 波前与扫描角 -->
<line x1="60" y1="200" x2="440" y2="140" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 3"/>
<text x="300" y="222" font-size="14" fill="#c0392b" text-anchor="middle">波程差 Δ = d·cosθ₀</text>
<path d="M 250 118 L 268 96" stroke="#666" stroke-width="1.5"/>
<text x="280" y="66" font-size="14" fill="#333" text-anchor="middle">主瓣指向 θ₀</text>
<text x="250" y="36" font-size="14" fill="#666" text-anchor="middle">等相位激励可让波束电扫</text>
</svg>
