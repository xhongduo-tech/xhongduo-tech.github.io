<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="sans-serif">
<title>半波偶极子及其正弦电流分布</title>
<desc>半波偶极子两臂各为四分之一波长，电流沿导线呈正弦分布、在末端为零，最大电流在中点馈电处。</desc>
<rect x="0" y="0" width="480" height="240" fill="#faf9f5"/>
<!-- 偶极子两臂 -->
<line x1="240" y1="40" x2="240" y2="120" stroke="#333" stroke-width="4"/>
<line x1="240" y1="120" x2="240" y2="200" stroke="#333" stroke-width="4"/>
<!-- 电流分布曲线（正弦） -->
<path d="M 120 100 C 160 66, 200 46, 238 40
         C 276 46, 316 66, 356 100
         M 120 140 C 160 174, 200 194, 238 200
         C 276 194, 316 174, 356 140"
      fill="none" stroke="#c0392b" stroke-width="2.5"/>
<!-- 馈电点 -->
<circle cx="240" cy="120" r="5" fill="#1f6f8b"/>
<line x1="230" y1="120" x2="230" y2="228" stroke="#1f6f8b" stroke-width="2"/>
<text x="218" y="236" font-size="14" fill="#1f6f8b" text-anchor="middle">馈电点</text>
<text x="240" y="24" font-size="15" fill="#333" text-anchor="middle">λ/2 偶极子两臂</text>
<text x="352" y="86" font-size="14" fill="#c0392b" text-anchor="middle">电流 I(z)</text>
<text x="352" y="156" font-size="14" fill="#c0392b" text-anchor="middle">I(z) = I₀ sin(kz)</text>
<text x="240" y="70" font-size="13" fill="#666" text-anchor="end">末端电流为零</text>
</svg>
