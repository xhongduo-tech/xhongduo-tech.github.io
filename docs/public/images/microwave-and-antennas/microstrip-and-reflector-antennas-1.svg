<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="sans-serif">
<title>矩形微带贴片天线结构</title>
<desc>矩形金属贴片印在介质基片上，下方为接地板，缝隙处电场辐射；L 约半个导波波长，W 决定阻抗。</desc>
<rect x="0" y="0" width="480" height="240" fill="#faf9f5"/>
<!-- 基片 -->
<rect x="90" y="90" width="300" height="90" rx="4" fill="#e8e4da" stroke="#999" stroke-width="1"/>
<text x="240" y="200" font-size="14" fill="#666" text-anchor="middle">介质基片 εr，厚度 h</text>
<!-- 贴片 -->
<rect x="180" y="105" width="120" height="60" rx="3" fill="#c0392b" opacity="0.75" stroke="#c0392b" stroke-width="2"/>
<text x="240" y="140" font-size="14" fill="#fff" text-anchor="middle">金属贴片</text>
<!-- 接地板 -->
<rect x="70" y="165" width="340" height="12" rx="2" fill="#1f6f8b" opacity="0.8"/>
<text x="430" y="176" font-size="13" fill="#1f6f8b" text-anchor="start">接地板</text>
<!-- 尺寸标注 -->
<line x1="180" y1="92" x2="300" y2="92" stroke="#333" stroke-width="1.5"/>
<text x="240" y="84" font-size="14" fill="#333" text-anchor="middle">L ≈ λg/2</text>
<line x1="314" y1="105" x2="314" y2="165" stroke="#333" stroke-width="1.5"/>
<text x="356" y="140" font-size="14" fill="#333" text-anchor="middle">W</text>
<!-- 缝隙辐射 -->
<line x1="176" y1="105" x2="176" y2="165" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 2"/>
<line x1="304" y1="105" x2="304" y2="165" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 2"/>
<text x="168" y="98" font-size="13" fill="#1f6f8b" text-anchor="end">缝隙辐射</text>
<text x="312" y="98" font-size="13" fill="#1f6f8b" text-anchor="start">缝隙辐射</text>
<!-- 馈电 -->
<line x1="200" y1="180" x2="200" y2="228" stroke="#333" stroke-width="2"/>
<text x="200" y="236" font-size="13" fill="#333" text-anchor="middle">馈线</text>
</svg>
