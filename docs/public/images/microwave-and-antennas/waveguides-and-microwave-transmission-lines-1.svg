<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="sans-serif">
<title>矩形波导截面及其 TE10 主模电场分布</title>
<desc>矩形波导宽边 a、窄边 b，TE10 模电场在宽边中点最强、向两边按正弦减弱，电场方向沿窄边。</desc>
<rect x="0" y="0" width="480" height="240" fill="#faf9f5"/>
<!-- 波导截面 -->
<rect x="60" y="50" width="300" height="160" rx="4" fill="#fff" stroke="#333" stroke-width="3"/>
<!-- 宽边/窄边标注 -->
<line x1="60" y1="40" x2="360" y2="40" stroke="#c0392b" stroke-width="1.5"/>
<line x1="60" y1="30" x2="60" y2="50" stroke="#c0392b" stroke-width="1.5"/>
<text x="210" y="32" font-size="15" fill="#c0392b" text-anchor="middle">宽边 a</text>
<line x1="50" y1="50" x2="50" y2="210" stroke="#1f6f8b" stroke-width="1.5"/>
<line x1="40" y1="50" x2="60" y2="50" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="40" y="135" font-size="15" fill="#1f6f8b" text-anchor="middle" transform="rotate(-90 40 135)">窄边 b</text>
<!-- TE10 电场分布：中间最强，两端为零 -->
<g fill="#c0392b" opacity="0.85">
  <ellipse cx="120" cy="90" rx="14" ry="10"/>
  <ellipse cx="120" cy="130" rx="14" ry="10"/>
  <ellipse cx="120" cy="170" rx="14" ry="10"/>
  <ellipse cx="180" cy="90" rx="24" ry="10"/>
  <ellipse cx="180" cy="130" rx="24" ry="10"/>
  <ellipse cx="180" cy="170" rx="24" ry="10"/>
  <ellipse cx="240" cy="90" rx="24" ry="10"/>
  <ellipse cx="240" cy="130" rx="24" ry="10"/>
  <ellipse cx="240" cy="170" rx="24" ry="10"/>
  <ellipse cx="300" cy="90" rx="14" ry="10"/>
  <ellipse cx="300" cy="130" rx="14" ry="10"/>
  <ellipse cx="300" cy="170" rx="14" ry="10"/>
</g>
<text x="210" y="228" font-size="15" fill="#c0392b" text-anchor="middle">电场 E 沿窄边方向，中央最强、两侧为零（TE10 主模）</text>
</svg>
