<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="sans-serif">
<title>从地心说到日心说：两种宇宙模型对比</title>
<desc>左图展示托勒密地心说的本轮与均轮结构，右图展示哥白尼—开普勒日心说的椭圆轨道与太阳位于焦点，底部对比二者关键差异。</desc>
<rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>

<text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">从地心说到日心说：两种宇宙模型</text>

<!-- 左面板：托勒密地心说 -->
<text x="185" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">托勒密地心说（本轮 / 均轮）</text>
<circle cx="185" cy="185" r="95" stroke="#1f6f8b" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<circle cx="185" cy="185" r="9" fill="#c0392b"/>
<text x="185" y="212" text-anchor="middle" font-size="13" fill="#333">地球</text>
<circle cx="257.8" cy="246.1" r="30" stroke="#333" stroke-width="1.5" fill="none"/>
<circle cx="257.8" cy="216.1" r="6" fill="#1f6f8b"/>
<text x="262" y="210" font-size="12" fill="#333">行星</text>
<text x="292" y="248" font-size="12" fill="#333">本轮</text>
<text x="100" y="266" font-size="12" fill="#555">均轮（虚线）</text>

<!-- 右面板：日心椭圆 -->
<text x="535" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">哥白尼—开普勒日心说（椭圆焦点）</text>
<ellipse cx="535" cy="185" rx="120" ry="80" stroke="#1f6f8b" stroke-width="2" fill="none"/>
<circle cx="445.6" cy="185" r="10" fill="#c0392b"/>
<text x="424" y="172" text-anchor="middle" font-size="13" fill="#333">太阳</text>
<circle cx="655" cy="185" r="6" fill="#1f6f8b"/>
<text x="664" y="178" font-size="13" fill="#333">地球</text>
<text x="400" y="202" font-size="12" fill="#555">近日点</text>
<text x="662" y="202" font-size="12" fill="#555">远日点</text>

<text x="360" y="265" text-anchor="middle" font-size="14" fill="#333">关键差异：轨道由「圆 + 圆」变为「椭圆 + 焦点」</text>
<text x="360" y="292" text-anchor="middle" font-size="13" fill="#555">开普勒第二定律：相等时间扫过相等面积，于是近日点快、远日点慢</text>
<text x="360" y="318" text-anchor="middle" font-size="13" fill="#555">托勒密体系需数十个本轮拼凑，日心椭圆只需一组观测数据</text>
</svg>
