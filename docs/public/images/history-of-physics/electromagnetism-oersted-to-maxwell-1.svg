<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="sans-serif">
<title>奥斯特实验：电流使磁场绕导线呈环状</title>
<desc>竖直导线通以向上的电流，导线周围的磁感线呈同心圆，圆周上放置的小指南针全部沿切线方向排布，说明磁场环绕电流方向。</desc>
<rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>

<text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">奥斯特实验（1820）：电流让指南针偏转</text>

<!-- 导线 -->
<line x1="360" y1="62" x2="360" y2="278" stroke="#333" stroke-width="5"/>
<polygon points="356,78 364,78 360,66" fill="#c0392b"/>
<text x="378" y="82" font-size="13" fill="#333">电流方向</text>

<!-- 磁感线：同心圆 -->
<circle cx="360" cy="170" r="55" stroke="#1f6f8b" stroke-width="1.5" fill="none" opacity="0.85"/>
<circle cx="360" cy="170" r="105" stroke="#1f6f8b" stroke-width="1.5" fill="none" opacity="0.85"/>
<circle cx="360" cy="170" r="155" stroke="#1f6f8b" stroke-width="1.5" fill="none" opacity="0.85"/>

<!-- 指南针（沿切向排布的小磁针） -->
<g stroke="#333" stroke-width="2.5" stroke-linecap="round">
  <line x1="460" y1="161" x2="460" y2="179"/>
  <line x1="424.3" y1="247.1" x2="437.1" y2="234.3"/>
  <line x1="351" y1="270" x2="369" y2="270"/>
  <line x1="282.9" y1="234.3" x2="295.7" y2="247.1"/>
  <line x1="260" y1="161" x2="260" y2="179"/>
  <line x1="295.7" y1="92.9" x2="282.9" y2="105.7"/>
  <line x1="351" y1="70" x2="369" y2="70"/>
  <line x1="437.1" y1="92.9" x2="424.3" y2="105.7"/>
</g>
<g fill="#c0392b">
  <circle cx="460" cy="161" r="2.5"/>
  <circle cx="424.3" cy="247.1" r="2.5"/>
  <circle cx="351" cy="270" r="2.5"/>
  <circle cx="282.9" cy="234.3" r="2.5"/>
  <circle cx="260" cy="161" r="2.5"/>
  <circle cx="295.7" cy="92.9" r="2.5"/>
  <circle cx="351" cy="70" r="2.5"/>
  <circle cx="437.1" cy="92.9" r="2.5"/>
</g>

<text x="360" y="300" text-anchor="middle" font-size="14" fill="#333">磁感线在导线周围呈同心圆（右手定则），指南针沿切线排布</text>
<text x="360" y="322" text-anchor="middle" font-size="13" fill="#555">一枚指南针的偏转，把「电」与「磁」两个领域首次连在一起</text>
</svg>
