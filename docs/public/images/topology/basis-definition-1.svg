<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="sans-serif">
  <title>基的两条判定条件</title>
  <desc>左图：点 x 属于开集 U，基元 B 含 x 且落在 U 内（覆盖+嵌入）；右图：两个基元 B1、B2 的交含有 x，第三个基元 B3 含 x 且落在 B1∩B2 内（相交条件）。</desc>

  <rect x="0" y="0" width="720" height="360" fill="#faf9f5"/>
  <text x="360" y="34" font-size="17" fill="#333" text-anchor="middle">基的两条判定条件</text>

  <!-- 左：条件一 -->
  <text x="180" y="66" font-size="15" fill="#333" text-anchor="middle">条件一：每个点被基元「罩住」并塞进开集</text>
  <ellipse cx="180" cy="185" rx="130" ry="90" fill="#c0392b22" stroke="#c0392b" stroke-width="2"/>
  <text x="180" cy="180" y="180" font-size="14" fill="#c0392b" text-anchor="middle">开集 U</text>
  <ellipse cx="168" cy="180" rx="52" ry="38" fill="#1f6f8b26" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="168" y="182" font-size="14" fill="#1f6f8b" text-anchor="middle">基元 B</text>
  <circle cx="168" cy="215" r="5" fill="#333"/>
  <text x="182" y="220" font-size="14" fill="#333">x</text>

  <!-- 右：条件二 -->
  <text x="540" y="66" font-size="15" fill="#333" text-anchor="middle">条件二：交里的点还能被更小的基元包住</text>
  <ellipse cx="472" cy="185" rx="95" ry="82" fill="#1f6f8b26" stroke="#1f6f8b" stroke-width="2"/>
  <text x="430" y="150" font-size="14" fill="#1f6f8b" text-anchor="middle">基元 B1</text>
  <ellipse cx="608" cy="185" rx="95" ry="82" fill="#c0392b22" stroke="#c0392b" stroke-width="2"/>
  <text x="650" y="150" font-size="14" fill="#c0392b" text-anchor="middle">基元 B2</text>
  <circle cx="540" cy="185" r="5" fill="#333"/>
  <text x="554" y="190" font-size="14" fill="#333">x</text>
  <ellipse cx="540" cy="185" rx="40" ry="30" fill="#88888826" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="252" font-size="13" fill="#333" text-anchor="middle">基元 B3 ⊆ B1 ∩ B2</text>

  <line x1="360" y1="120" x2="360" y2="240" stroke="#999" stroke-width="1"/>
  <text x="360" y="300" font-size="14" fill="#333" text-anchor="middle">两条条件齐备，B 就够格当某个拓扑的基</text>
</svg>
