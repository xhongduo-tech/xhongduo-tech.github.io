<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="sans-serif">
  <title>同一个集合可以配不同的拓扑</title>
  <desc>集合 X = {a, b, c} 配两种不同的拓扑：左图 τ₁ = {∅, {a}, {a,b}, X}，右图 τ₂ = {∅, {a}, X}。开集用色圈标出。</desc>

  <rect x="0" y="0" width="720" height="360" fill="#faf9f5"/>
  <text x="360" y="36" font-size="17" fill="#333" text-anchor="middle">同一个集合 X = {a, b, c}，可以配不同的拓扑</text>

  <!-- 左面板 -->
  <rect x="40" y="70" width="280" height="200" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="58" y="96" font-size="15" fill="#333">X</text>

  <!-- 开集 {a,b}：青色椭圆 -->
  <ellipse cx="183" cy="128" rx="95" ry="48" fill="#1f6f8b22" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- 开集 {a}：红色圆 -->
  <circle cx="110" cy="150" r="26" fill="#c0392b22" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>

  <circle cx="110" cy="150" r="4" fill="#333"/>
  <circle cx="255" cy="105" r="4" fill="#333"/>
  <circle cx="255" cy="195" r="4" fill="#333"/>
  <text x="110" y="143" font-size="15" fill="#333" text-anchor="middle">a</text>
  <text x="255" y="96" font-size="15" fill="#333" text-anchor="middle">b</text>
  <text x="255" y="212" font-size="15" fill="#333" text-anchor="middle">c</text>

  <text x="180" y="296" font-size="14" fill="#333" text-anchor="middle">τ₁ = { ∅, {a}, {a,b}, X }</text>

  <!-- 右面板 -->
  <rect x="400" y="70" width="280" height="200" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="418" y="96" font-size="15" fill="#333">X</text>

  <!-- 开集 {a}：红色圆 -->
  <circle cx="470" cy="150" r="26" fill="#c0392b22" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>

  <circle cx="470" cy="150" r="4" fill="#333"/>
  <circle cx="615" cy="105" r="4" fill="#333"/>
  <circle cx="615" cy="195" r="4" fill="#333"/>
  <text x="470" y="143" font-size="15" fill="#333" text-anchor="middle">a</text>
  <text x="615" y="96" font-size="15" fill="#333" text-anchor="middle">b</text>
  <text x="615" y="212" font-size="15" fill="#333" text-anchor="middle">c</text>

  <text x="540" y="296" font-size="14" fill="#333" text-anchor="middle">τ₂ = { ∅, {a}, X }</text>

  <text x="360" y="336" font-size="13" fill="#333" text-anchor="middle">「{a} 是否开」由 τ 说了算，与元素 a 本身无关</text>
</svg>
