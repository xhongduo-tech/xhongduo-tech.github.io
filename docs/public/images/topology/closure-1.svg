<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
  <title>集合 A 的闭包</title>
  <desc>平面上一个青色开放区域 A，红色闭合曲线表示 A 的边界，闭包是 A 与其边界之并。边界点 x 的每个开邻域都与 A 相交。</desc>

  <rect x="0" y="0" width="720" height="400" fill="#faf9f5"/>
  <text x="360" y="34" font-size="17" fill="#333" text-anchor="middle">闭包 = 集合本身 + 它「贴」着的一切边界</text>

  <!-- A 的内部（青色） -->
  <path d="M 200 200 C 140 90, 400 60, 420 150 C 460 120, 560 160, 540 260 C 520 360, 220 380, 200 200 Z" fill="#1f6f8b33" stroke="#1f6f8b" stroke-width="3"/>
  <text x="360" y="225" font-size="16" fill="#1f6f8b" text-anchor="middle">集合 A</text>

  <!-- 边界（红色加粗曲线） -->
  <path d="M 200 200 C 140 90, 400 60, 420 150 C 460 120, 560 160, 540 260 C 520 360, 220 380, 200 200 Z" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="560" y="90" font-size="14" fill="#c0392b">边界 ∂A</text>

  <!-- 边界上的点 x 及其邻域 -->
  <circle cx="360" cy="305" r="5" fill="#333"/>
  <text x="378" y="310" font-size="14" fill="#333">x</text>
  <circle cx="360" cy="305" r="34" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="434" y="322" font-size="13" fill="#333">x 的开邻域</text>

  <text x="360" y="376" font-size="14" fill="#333" text-anchor="middle">x ∈ cl A ⟺ x 的每个开邻域都与 A 相交（含边界点）</text>
</svg>
