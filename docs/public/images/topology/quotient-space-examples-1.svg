<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>正方形对边粘合构造四种曲面</title>
  <desc>四个正方形分别展示圆柱、Möbius 带、环面、射影平面的对边粘合规则。同色边彼此粘合，箭头方向相同表示不扭转，相反表示扭转。</desc>
  <rect x="0" y="0" width="760" height="470" fill="#faf9f5"/>
  <defs>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">圆柱：左右对边同向粘合</text>
  <rect x="40" y="45" width="160" height="160" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="205" x2="40" y2="55" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="200" y1="205" x2="200" y2="55" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>

  <text x="280" y="30" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">Möbius 带：左右对边反向粘合</text>
  <rect x="280" y="45" width="160" height="160" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="205" x2="280" y2="55" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="440" y1="55" x2="440" y2="205" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>

  <text x="40" y="250" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">环面：两对对边同向粘合</text>
  <rect x="40" y="265" width="160" height="160" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="425" x2="40" y2="275" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="200" y1="425" x2="200" y2="275" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="40" y1="265" x2="190" y2="265" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="40" y1="425" x2="190" y2="425" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrBlue)"/>

  <text x="280" y="250" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">射影平面：两对对边反向粘合</text>
  <rect x="280" y="265" width="160" height="160" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="425" x2="280" y2="275" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="440" y1="275" x2="440" y2="425" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="440" y1="265" x2="290" y2="265" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="290" y1="425" x2="440" y2="425" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrBlue)"/>

  <text x="40" y="455" font-family="sans-serif" font-size="14" fill="#555">同色边粘合；箭头同向 = 不扭转，反向 = 扭转。</text>
</svg>
