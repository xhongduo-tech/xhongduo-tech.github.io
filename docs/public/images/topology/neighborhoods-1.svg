<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="sans-serif">
  <title>邻域 N 包住含 x 的开集 U</title>
  <desc>点 x 属于开集 U，U 又含于更大的邻域 N。开集 U 用红色椭圆表示，邻域 N 用青色圆角矩形表示，满足 x ∈ U ⊆ N。</desc>

  <rect x="0" y="0" width="600" height="400" fill="#faf9f5"/>
  <text x="300" y="38" font-size="17" fill="#333" text-anchor="middle">邻域：包住一个开集</text>

  <!-- 邻域 N：青色大圆角矩形 -->
  <rect x="130" y="110" width="340" height="220" rx="42" fill="#1f6f8b1f" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="172" y="152" font-size="15" fill="#1f6f8b">邻域 N</text>

  <!-- 开集 U：红色椭圆 -->
  <ellipse cx="300" cy="205" rx="90" ry="55" fill="#c0392b22" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="203" font-size="15" fill="#c0392b" text-anchor="middle">开集 U</text>

  <!-- 点 x -->
  <circle cx="300" cy="238" r="5" fill="#333"/>
  <text x="316" y="243" font-size="15" fill="#333">x</text>

  <text x="300" y="368" font-size="14" fill="#333" text-anchor="middle">x ∈ U ⊆ N：U 是开集，N 只需「罩住」一个含 x 的开集</text>
</svg>
