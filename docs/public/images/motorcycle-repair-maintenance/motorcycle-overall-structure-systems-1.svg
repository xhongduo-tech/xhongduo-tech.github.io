<circle cx="170" cy="252" r="45" fill="none" stroke="#333" stroke-width="3"/>
<circle cx="170" cy="252" r="9" fill="#333"/>
<circle cx="480" cy="252" r="45" fill="none" stroke="#333" stroke-width="3"/>
<circle cx="480" cy="252" r="9" fill="#333"/>
<path d="M170 252 L215 218 L300 196 L380 200 L470 226 L480 252" fill="none" stroke="#1f6f8b" stroke-width="5"/>
