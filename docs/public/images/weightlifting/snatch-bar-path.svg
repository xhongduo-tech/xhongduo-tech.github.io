<svg viewBox="0 0 420 540" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>抓举杠铃轨迹示意</title>
  <desc>从侧面看，抓举的杠铃轨迹呈 S 形：提铃阶段杠铃先向后贴近身体，过膝进入过渡后随引膝微调，发力阶段快速上升并略向前，最终过头支撑。</desc>
  <rect width="420" height="540" fill="#faf9f5"/>
  <!-- 地面 -->
  <line x1="20" y1="480" x2="400" y2="480" stroke="#333" stroke-width="3"/>
  <text x="30" y="505" font-family="sans-serif" font-size="14" fill="#666">地面</text>
  <!-- 人体重心参考线 -->
  <line x1="210" y1="60" x2="210" y2="480" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="216" y="90" font-family="sans-serif" font-size="13" fill="#1f6f8b">脚掌中部参考线</text>
  <!-- 杠铃轨迹 -->
  <polyline points="150,480 162,460 172,440 180,410 178,380 170,350 175,320 195,285 210,250 218,210 216,160 210,110 210,80"
    fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 杠铃片 -->
  <circle cx="150" cy="480" r="7" fill="#c0392b"/>
  <circle cx="210" cy="80" r="7" fill="#c0392b"/>
  <!-- 阶段标注 -->
  <line x1="150" y1="480" x2="88" y2="500" stroke="#666" stroke-width="1"/>
  <text x="20" y="505" font-family="sans-serif" font-size="14" fill="#666"></text>
  <text x="20" y="530" font-family="sans-serif" font-size="13" fill="#333">1 预备：杠铃位于脚掌中部上方</text>
  <line x1="178" y1="380" x2="300" y2="392" stroke="#666" stroke-width="1"/>
  <text x="286" y="388" font-family="sans-serif" font-size="13" fill="#333">2 提铃至膝</text>
  <line x1="170" y1="350" x2="300" y2="352" stroke="#666" stroke-width="1"/>
  <text x="286" y="348" font-family="sans-serif" font-size="13" fill="#333">3 引膝过渡</text>
  <line x1="195" y1="285" x2="320" y2="292" stroke="#666" stroke-width="1"/>
  <text x="306" y="288" font-family="sans-serif" font-size="13" fill="#c0392b">4 发力：速度峰值</text>
  <line x1="216" y1="160" x2="300" y2="150" stroke="#666" stroke-width="1"/>
  <text x="288" y="146" font-family="sans-serif" font-size="13" fill="#333">5 腾起接铃</text>
  <line x1="210" y1="80" x2="300" y2="70" stroke="#666" stroke-width="1"/>
  <text x="290" y="66" font-family="sans-serif" font-size="13" fill="#333">6 过头起立</text>
</svg>
