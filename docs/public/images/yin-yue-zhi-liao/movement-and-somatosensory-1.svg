<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
  <title>节律性听觉刺激（RAS）原理示意</title>
  <desc>一条时间轴上均匀分布的四个节拍，每个节拍下方对应一步落地的步态，说明外部节拍带动内在步态的同化（entrainment）机制。</desc>
  <rect x="0" y="0" width="640" height="300" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">节律性听觉刺激（RAS）：节拍带动步态</text>

  <!-- timeline axis -->
  <line x1="80" y1="150" x2="560" y2="150" stroke="#333" stroke-width="2"/>
  <text x="80" y="175" text-anchor="middle" font-size="14" fill="#333">拍 1</text>
  <text x="240" y="175" text-anchor="middle" font-size="14" fill="#333">拍 2</text>
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#333">拍 3</text>
  <text x="560" y="175" text-anchor="middle" font-size="14" fill="#333">拍 4</text>

  <!-- beat bars -->
  <rect x="70" y="100" width="20" height="50" fill="#c0392b"/>
  <rect x="230" y="100" width="20" height="50" fill="#c0392b"/>
  <rect x="390" y="100" width="20" height="50" fill="#c0392b"/>
  <rect x="550" y="100" width="20" height="50" fill="#c0392b"/>
  <text x="320" y="85" text-anchor="middle" font-size="15" fill="#c0392b">节拍（听觉刺激）</text>

  <!-- steps aligned with beats -->
  <circle cx="80" cy="235" r="18" fill="#1f6f8b"/>
  <circle cx="240" cy="235" r="18" fill="#1f6f8b"/>
  <circle cx="400" cy="235" r="18" fill="#1f6f8b"/>
  <circle cx="560" cy="235" r="18" fill="#1f6f8b"/>
  <text x="80" y="240" text-anchor="middle" font-size="13" fill="#fff">L</text>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#fff">R</text>
  <text x="400" y="240" text-anchor="middle" font-size="13" fill="#fff">L</text>
  <text x="560" y="240" text-anchor="middle" font-size="13" fill="#fff">R</text>
  <text x="320" y="270" text-anchor="middle" font-size="15" fill="#1f6f8b">落步（左 L / 右 R）与节拍对齐</text>

  <text x="320" y="292" text-anchor="middle" font-size="14" fill="#333">帕金森等步态障碍者借助节拍同步，可改善步频与步幅</text>
</svg>
