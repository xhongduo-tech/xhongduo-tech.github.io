<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="sans-serif">
  <title>劳动力市场均衡与最低工资</title>
  <desc>劳动供给曲线与需求曲线相交决定均衡工资与就业量；最低工资高于均衡工资时产生失业缺口。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="80" y1="400" x2="580" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <polygon points="575,400 585,400 580,392" fill="#333"/>
  <polygon points="80,65 80,55 88,60" fill="#333"/>
  <text x="565" y="418" font-size="16" fill="#333">就业量 E</text>
  <text x="50" y="70" font-size="16" fill="#333">工资 w</text>
  <!-- 需求曲线（向下倾斜，青色） -->
  <line x1="100" y1="120" x2="540" y2="360" stroke="#1f6f8b" stroke-width="3"/>
  <text x="520" y="375" font-size="15" fill="#1f6f8b">需求（MRP）</text>
  <!-- 供给曲线（向上倾斜，红色） -->
  <line x1="100" y1="360" x2="540" y2="120" stroke="#c0392b" stroke-width="3"/>
  <text x="150" y="130" font-size="15" fill="#c0392b">供给</text>
  <!-- 均衡点 -->
  <circle cx="320" cy="240" r="5" fill="#333"/>
  <text x="330" y="235" font-size="15" fill="#333">均衡 E*, w*</text>
  <!-- 均衡虚线 -->
  <line x1="320" y1="240" x2="80" y2="240" stroke="#333" stroke-width="1.2" stroke-dasharray="6,5"/>
  <line x1="320" y1="240" x2="320" y2="400" stroke="#333" stroke-width="1.2" stroke-dasharray="6,5"/>
  <!-- 最低工资线 -->
  <line x1="80" y1="150" x2="540" y2="150" stroke="#333" stroke-width="2.4" stroke-dasharray="10,6"/>
  <text x="400" y="140" font-size="15" fill="#333">最低工资 w_min</text>
  <!-- 失业缺口标注 -->
  <line x1="220" y1="150" x2="220" y2="400" stroke="#333" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="420" y1="150" x2="420" y2="400" stroke="#333" stroke-width="1" stroke-dasharray="3,4"/>
  <path d="M 220 245 L 420 245" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="265" font-size="15" fill="#c0392b">失业缺口 = E 供给 − E 需求</text>
  <text x="230" y="415" font-size="14" fill="#333">E 需求(w_min)</text>
  <text x="400" y="415" font-size="14" fill="#333">E 供给(w_min)</text>
</svg>
