<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>飞碟射击靶场示意：多向与双向</title>
  <desc>左图为多向飞碟：抛靶房在射手正前方，靶碟方向随机向前飞出；右图为双向飞碟：高房与低房分居场地两端，靶碟沿固定轨迹交叉掠过射手。</desc>
  <style>
    text { font-family: sans-serif; fill: #333; }
    .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
    .note { font-size: 14px; text-anchor: middle; fill: #666; }
    .lbl { font-size: 13px; text-anchor: middle; }
    .mach { fill: #1f6f8b; }
    .shoot { fill: #c0392b; }
    .traj { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .arc { stroke: #333; stroke-width: 2; fill: none; }
    .stn { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .house { fill: #1f6f8b; }
  </style>

  <!-- 左图：多向飞碟 -->
  <g>
    <rect x="20" y="20" width="350" height="330" rx="8" fill="#f6f3ec" stroke="#ddd"/>
    <text x="195" y="48" class="title">多向飞碟（trap）</text>

    <!-- 抛靶房 -->
    <rect x="110" y="100" width="170" height="26" rx="4" class="mach"/>
    <text x="195" y="117" class="lbl" fill="#faf9f5">抛靶房（3 台抛靶机）</text>

    <!-- 靶碟轨迹：随机向前 -->
    <path d="M 140 100 C 120 70, 100 55, 80 42" class="traj"/>
    <path d="M 195 100 C 195 70, 195 55, 195 42" class="traj"/>
    <path d="M 250 100 C 270 70, 290 55, 310 42" class="traj"/>
    <text x="60" y="36" class="lbl">靶碟飞出</text>
    <text x="330" y="36" class="lbl">方向随机</text>

    <!-- 射手站位 -->
    <circle cx="195" cy="290" r="16" class="shoot"/>
    <text x="195" y="325" class="lbl">射手</text>

    <text x="195" y="352" class="note">靶从射手正前方抛出，方向与高度随机</text>
  </g>

  <!-- 右图：双向飞碟 -->
  <g>
    <rect x="390" y="20" width="350" height="330" rx="8" fill="#f6f3ec" stroke="#ddd"/>
    <text x="565" y="48" class="title">双向飞碟（skeet）</text>

    <!-- 高房与低房 -->
    <rect x="440" y="110" width="46" height="24" rx="4" class="house"/>
    <text x="463" y="102" class="lbl">高房</text>
    <rect x="644" y="110" width="46" height="24" rx="4" class="house"/>
    <text x="667" y="102" class="lbl">低房</text>

    <!-- 半圆弧与射击站位 -->
    <path d="M 445 240 A 120 120 0 0 1 685 240" class="arc"/>
    <circle cx="475" cy="238" r="9" class="stn"/><text x="475" y="260" class="lbl">1</text>
    <circle cx="515" cy="216" r="9" class="stn"/><text x="515" y="238" class="lbl">2</text>
    <circle cx="565" cy="206" r="9" class="stn"/><text x="565" y="228" class="lbl">3</text>
    <circle cx="615" cy="216" r="9" class="stn"/><text x="615" y="238" class="lbl">4</text>
    <circle cx="655" cy="238" r="9" class="stn"/><text x="655" y="260" class="lbl">5</text>
    <text x="565" y="300" class="lbl">6 · 7 · 8（居中弧线上）</text>

    <!-- 交叉轨迹 -->
    <path d="M 463 128 C 500 170, 540 190, 600 210" class="traj"/>
    <path d="M 667 128 C 630 170, 590 190, 530 210" class="traj"/>

    <text x="565" y="352" class="note">靶碟沿固定轨迹从两端交叉掠过射手面前</text>
  </g>
</svg>
