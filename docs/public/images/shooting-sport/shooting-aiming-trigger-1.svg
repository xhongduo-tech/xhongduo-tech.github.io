<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>瞄准图像：平正准星与常见偏差</title>
  <desc>四幅瞄准示意图：正确平正准星、准星偏高、准星偏低、准星偏左，以及对应的弹着点位置。</desc>
  <style>
    text { font-family: sans-serif; fill: #333; }
    .bar { fill: #333; }
    .post { fill: #1f6f8b; }
    .tgt { fill: #111; }
    .tgt-in { fill: #faf9f5; }
    .x { stroke: #c0392b; stroke-width: 3; stroke-linecap: round; }
    .label { font-size: 15px; text-anchor: middle; }
    .note { font-size: 14px; text-anchor: middle; fill: #666; }
  </style>

  <!-- 面板 1：正确 -->
  <g>
    <rect x="160" y="80" width="14" height="20" class="bar"/>
    <rect x="226" y="80" width="14" height="20" class="bar"/>
    <rect x="193" y="80" width="14" height="14" class="post"/>
    <circle cx="200" cy="52" r="15" class="tgt"/>
    <circle cx="200" cy="52" r="5" class="tgt-in"/>
    <circle cx="200" cy="170" r="18" class="tgt"/>
    <line x1="193" y1="170" x2="207" y2="170" class="x"/>
    <line x1="200" y1="163" x2="200" y2="177" class="x"/>
    <text x="200" y="205" class="label">正确：平正准星</text>
    <text x="200" y="224" class="note">弹着正中</text>
  </g>

  <!-- 面板 2：准星偏高 -->
  <g>
    <rect x="530" y="80" width="14" height="20" class="bar"/>
    <rect x="596" y="80" width="14" height="20" class="bar"/>
    <rect x="563" y="72" width="14" height="14" class="post"/>
    <circle cx="570" cy="52" r="15" class="tgt"/>
    <circle cx="570" cy="52" r="5" class="tgt-in"/>
    <circle cx="570" cy="170" r="18" class="tgt"/>
    <line x1="563" y1="158" x2="577" y2="158" class="x"/>
    <line x1="570" y1="151" x2="570" y2="165" class="x"/>
    <text x="570" y="205" class="label">错误：准星偏高</text>
    <text x="570" y="224" class="note">弹着偏高</text>
  </g>

  <!-- 面板 3：准星偏低 -->
  <g>
    <rect x="160" y="270" width="14" height="20" class="bar"/>
    <rect x="226" y="270" width="14" height="20" class="bar"/>
    <rect x="193" y="278" width="14" height="14" class="post"/>
    <circle cx="200" cy="242" r="15" class="tgt"/>
    <circle cx="200" cy="242" r="5" class="tgt-in"/>
    <circle cx="200" cy="360" r="18" class="tgt"/>
    <line x1="193" y1="372" x2="207" y2="372" class="x"/>
    <line x1="200" y1="365" x2="200" y2="379" class="x"/>
    <text x="200" y="395" class="label">错误：准星偏低</text>
    <text x="200" y="414" class="note">弹着偏低</text>
  </g>

  <!-- 面板 4：准星偏左 -->
  <g>
    <rect x="530" y="270" width="14" height="20" class="bar"/>
    <rect x="596" y="270" width="14" height="20" class="bar"/>
    <rect x="553" y="270" width="14" height="14" class="post"/>
    <circle cx="570" cy="242" r="15" class="tgt"/>
    <circle cx="570" cy="242" r="5" class="tgt-in"/>
    <circle cx="570" cy="360" r="18" class="tgt"/>
    <line x1="560" y1="352" x2="560" y2="368" class="x"/>
    <line x1="552" y1="360" x2="568" y2="360" class="x"/>
    <text x="570" y="395" class="label">错误：准星偏左</text>
    <text x="570" y="414" class="note">弹着偏左</text>
  </g>
</svg>
