<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>云计算的体系架构</title>
  <desc>分层示意：前端、服务层、管理层、资源池、后端物理设施五层构成一朵云的宏观架构</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <!-- 前端 -->
  <rect x="40" y="20" width="560" height="56" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="46" font-size="15" font-weight="bold" fill="#1f6f8b">前端 Front End</text>
  <text x="60" y="66" font-size="13" fill="#333">用户接入层：Web 控制台、CLI、API、移动 App</text>
  <!-- 服务层 -->
  <rect x="40" y="96" width="560" height="56" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="122" font-size="15" font-weight="bold" fill="#1f6f8b">服务层 Service Layer</text>
  <text x="60" y="142" font-size="13" fill="#333">SaaS（应用） ｜ PaaS（平台） ｜ IaaS（基础设施）三种交付形态</text>
  <!-- 管理层 -->
  <rect x="40" y="172" width="560" height="88" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="198" font-size="15" font-weight="bold" fill="#c0392b">管理层 Management Layer（云的“大脑”）</text>
  <text x="60" y="220" font-size="13" fill="#333">计费与结算 ｜ 资源监控 ｜ 安全与认证 ｜ 服务编排</text>
  <text x="60" y="240" font-size="13" fill="#333">负载均衡 ｜ 多租户隔离 ｜ 运维自动化 ｜ 审计日志</text>
  <!-- 资源池 -->
  <rect x="40" y="280" width="560" height="88" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="306" font-size="15" font-weight="bold" fill="#1f6f8b">资源池 Resource Pool</text>
  <text x="60" y="328" font-size="13" fill="#333">计算资源池 ｜ 存储资源池 ｜ 网络资源池</text>
  <text x="60" y="348" font-size="13" fill="#333">由虚拟化技术将物理资源切分为可动态分配的共享池</text>
  <!-- 物理层 -->
  <rect x="40" y="388" width="560" height="52" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="60" y="412" font-size="15" font-weight="bold" fill="#1f6f8b">后端物理设施 Back End</text>
  <text x="60" y="432" font-size="13" fill="#333">数据中心：服务器、存储阵列、交换机、电力与制冷</text>
  <!-- 箭头标注 -->
  <line x1="110" y1="352" x2="110" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
</svg>
