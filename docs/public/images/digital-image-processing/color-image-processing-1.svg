<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif">
  <title>RGB 立方体与 HSI 颜色锥体</title>
  <desc>左图：加色 RGB 立方体，三个基色轴 R、G、B 交汇于黑色原点，互补角分别为青、品红、黄与白。右图：HSI 颜色锥体，H 为绕竖直轴的角度，S 为到轴的距离，I 为竖直高度。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="720" height="380" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">RGB 与 HSI 颜色模型</text>

  <!-- 左侧标题 -->
  <text x="180" y="72" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">加色 RGB 立方体</text>

  <!-- RGB 立方体：三个可见面 -->
  <!-- 顶面（R-G 面） -->
  <polygon points="110,300 210,260 270,295 170,335" fill="#f5e0b0" fill-opacity="0.55" stroke="#333" stroke-width="1.5"/>
  <!-- 前面左（G-U 面） -->
  <polygon points="110,300 170,335 170,255 110,220" fill="#a8d8ea" fill-opacity="0.6" stroke="#333" stroke-width="1.5"/>
  <!-- 前面右（R-U 面） -->
  <polygon points="110,300 210,260 210,180 110,220" fill="#f2b8c6" fill-opacity="0.6" stroke="#333" stroke-width="1.5"/>

  <!-- 隐藏边（虚线） -->
  <line x1="170,335" y1="170" x2="270" y2="295" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="210,260" y1="210" x2="270" y2="295" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 顶点标注 -->
  <circle cx="110" cy="300" r="4" fill="#333"/>
  <text x="92" y="318" text-anchor="middle" font-size="14" fill="#333">黑 (0,0,0)</text>
  <circle cx="210" cy="260" r="4" fill="#c0392b"/>
  <text x="222" y="256" font-size="14" fill="#c0392b" font-weight="bold">R 红</text>
  <circle cx="170" cy="335" r="4" fill="#1f6f8b"/>
  <text x="170" y="356" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">G 绿</text>
  <circle cx="110" cy="220" r="4" fill="#2c5f8a"/>
  <text x="92" y="214" text-anchor="end" font-size="14" fill="#2c5f8a" font-weight="bold">B 蓝</text>

  <circle cx="270" cy="295" r="4" fill="#c98a2b"/>
  <text x="292" y="300" font-size="14" fill="#c98a2b">黄 = R+G</text>
  <circle cx="210" cy="180" r="4" fill="#b04a8a"/>
  <text x="228" y="182" font-size="14" fill="#b04a8a">品红 = R+B</text>
  <circle cx="170" cy="255" r="4" fill="#1f8b7a"/>
  <text x="170" y="246" text-anchor="middle" font-size="14" fill="#1f8b7a">青 = G+B</text>
  <circle cx="270" cy="215" r="4" fill="#555"/>
  <text x="292" y="212" font-size="14" fill="#555">白 (1,1,1)</text>

  <!-- 右侧标题 -->
  <text x="540" y="72" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">知觉 HSI 颜色锥体</text>

  <!-- HSI 锥体：主体三角形 -->
  <polygon points="540,100 440,320 640,320" fill="#a8d8ea" fill-opacity="0.35" stroke="#333" stroke-width="1.5"/>

  <!-- 竖轴 -->
  <line x1="540" y1="100" x2="540" y2="320" stroke="#333" stroke-width="1.8"/>
  <text x="540" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">I 亮度（白→黑）</text>
  <text x="540" y="342" text-anchor="middle" font-size="13" fill="#333">I = 0（黑）</text>

  <!-- 顶点 / 圆心 -->
  <circle cx="540" cy="100" r="4" fill="#333"/>
  <text x="552" y="96" font-size="14" fill="#333">I = 1（白）</text>

  <!-- 色相环标注：0°/120°/240° -->
  <circle cx="540" cy="240" r="55" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="500" y="222" text-anchor="end" font-size="14" fill="#c0392b">H = 0° 红</text>
  <text x="596" y="228" text-anchor="start" font-size="14" fill="#1f6f8b">H = 120° 绿</text>
  <text x="540" y="312" text-anchor="middle" font-size="14" fill="#2c5f8a">H = 240° 蓝</text>

  <!-- 饱和度标注 -->
  <line x1="540" y1="240" x2="495" y2="285" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="448" y="290" text-anchor="end" font-size="14" fill="#1f6f8b" font-weight="bold">S 饱和度</text>
  <text x="480" y="306" text-anchor="middle" font-size="13" fill="#666">S = 0 灰</text>

  <!-- 底部图注 -->
  <text x="360" y="374" text-anchor="middle" font-size="13" fill="#666">RGB 用于显示，HSI 用于「只动亮度、不动颜色」的处理——灰度技术迁到彩色的桥梁</text>
</svg>
