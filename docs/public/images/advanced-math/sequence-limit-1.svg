<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">数列 1/n 收敛于 0：任意小的 ε 邻域最终容纳所有项</title>
  <desc id="desc">数轴上排列着数列 1, 1/2, 1/3, 1/4, 1/5, … 的对应点，它们越来越靠近原点 0。红色虚线画出以 0 为中心、半宽为 ε 的邻域带 (a−ε, a+ε)。取 ε=0.2 时，前四项 1, 1/2, 1/3, 1/4 落在带外，从第 N=5 项起（1/5 恰在带边），后面所有项 1/5, 1/6, … 全部落入带内——带外至多只剩有限多项。</desc>

  <!-- 标题 -->
  <text x="350" y="30" font-size="16" fill="#333" text-anchor="middle">数列 aₙ = 1/n 收敛于 a = 0</text>

  <!-- 数轴 -->
  <line x1="70" y1="150" x2="650" y2="150" stroke="#333" stroke-width="1.6"/>
  <polygon points="650,146 662,150 650,154" fill="#333"/>

  <!-- ε 邻域带 -->
  <rect x="156" y="126" width="128" height="48" fill="#c0392b" opacity="0.10" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="220" y="118" font-size="13" fill="#c0392b" text-anchor="middle">ε 邻域 (a−ε, a+ε)</text>

  <!-- 刻度与标签 -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="220" y1="150" x2="220" y2="156"/>
    <line x1="380" y1="150" x2="380" y2="156"/>
    <line x1="540" y1="150" x2="540" y2="156"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="220" y="176">a = 0</text>
    <text x="380" y="176">1/2</text>
    <text x="540" y="176">1</text>
  </g>

  <!-- 带边标注 -->
  <g font-size="13" fill="#c0392b" text-anchor="middle">
    <text x="156" y="188">a−ε</text>
    <text x="284" y="188">a+ε</text>
  </g>
  <line x1="156" y1="150" x2="156" y2="184" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="284" y1="150" x2="284" y2="184" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 数列的点：1/n 映射到 x = 220 + 320/n -->
  <g fill="#1f6f8b">
    <circle cx="540" cy="150" r="5"/><circle cx="380" cy="150" r="5"/><circle cx="326.7" cy="150" r="5"/>
    <circle cx="300" cy="150" r="5"/><circle cx="284" cy="150" r="5"/><circle cx="273.3" cy="150" r="5"/>
    <circle cx="265.7" cy="150" r="5"/><circle cx="260" cy="150" r="5"/><circle cx="255.6" cy="150" r="5"/>
    <circle cx="252" cy="150" r="5"/><circle cx="246.7" cy="150" r="5"/><circle cx="240" cy="150" r="5"/>
    <circle cx="236" cy="150" r="5"/><circle cx="230.7" cy="150" r="5"/><circle cx="223.2" cy="150" r="5"/>
  </g>
  <g font-size="13" fill="#1f6f8b" text-anchor="middle">
    <text x="540" y="135">a₁=1</text>
    <text x="380" y="135">a₂=1/2</text>
    <text x="326.7" y="135">a₃=1/3</text>
    <text x="300" y="135">a₄=1/4</text>
  </g>

  <!-- N 的标注 -->
  <line x1="284" y1="132" x2="284" y2="144" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="284" y="212" font-size="14" fill="#1f6f8b" text-anchor="middle">n = N = 5</text>
  <text x="350" y="232" font-size="13" fill="#555" text-anchor="middle">当 n &gt; N 时，aₙ 全部落进 ε 邻域，带外至多有限项</text>
</svg>
