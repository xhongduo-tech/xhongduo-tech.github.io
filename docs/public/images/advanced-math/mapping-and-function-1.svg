<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">三种映射：单射、满射与双射</title>
  <desc id="desc">三个并排的小例子示意映射的分类。左列单射：三个定义域元素分别射向三个不同的像，陪域留有一个空位（红色圆圈标注的 4 未被命中）。中列满射：四个定义域元素射向三个陪域元素，每个陪域元素都被命中，但有一个像被命中两次（红色曲线与圆圈标注）。右列双射：三个定义域元素与三个陪域元素一一对应，既无空位也不重复。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="120" y="28">单射（injective）</text>
    <text x="350" y="28">满射（surjective）</text>
    <text x="580" y="28">双射（bijective）</text>
  </g>

  <!-- 第一列：单射 -->
  <g>
    <ellipse cx="75" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <ellipse cx="185" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <text x="75" y="56" font-size="13" fill="#555" text-anchor="middle">定义域</text>
    <text x="185" y="56" font-size="13" fill="#555" text-anchor="middle">陪域</text>
    <g fill="#333">
      <circle cx="75" cy="105" r="4"/><circle cx="75" cy="140" r="4"/><circle cx="75" cy="175" r="4"/>
      <circle cx="185" cy="88" r="4"/><circle cx="185" cy="118" r="4"/><circle cx="185" cy="148" r="4"/><circle cx="185" cy="178" r="4"/>
    </g>
    <g stroke="#777" stroke-width="1.4" marker-end="url(#arrow)">
      <line x1="78" y1="104" x2="181" y2="89"/>
      <line x1="78" y1="139" x2="181" y2="119"/>
      <line x1="78" y1="174" x2="181" y2="149"/>
    </g>
    <g font-size="13" fill="#333" text-anchor="middle">
      <text x="75" y="101">a</text><text x="75" y="136">b</text><text x="75" y="171">c</text>
      <text x="185" y="84">1</text><text x="185" y="114">2</text><text x="185" y="144">3</text><text x="185" y="174">4</text>
    </g>
    <circle cx="185" cy="178" r="7" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="185" y="206" font-size="13" fill="#c0392b" text-anchor="middle">未被命中</text>
  </g>

  <!-- 第二列：满射 -->
  <g>
    <ellipse cx="305" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <ellipse cx="415" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <g fill="#333">
      <circle cx="305" cy="88" r="4"/><circle cx="305" cy="118" r="4"/><circle cx="305" cy="148" r="4"/><circle cx="305" cy="178" r="4"/>
      <circle cx="415" cy="105" r="4"/><circle cx="415" cy="140" r="4"/><circle cx="415" cy="175" r="4"/>
    </g>
    <g stroke="#777" stroke-width="1.4" marker-end="url(#arrow)">
      <line x1="308" y1="87" x2="411" y2="104"/>
      <line x1="308" y1="117" x2="411" y2="139"/>
      <line x1="308" y1="147" x2="411" y2="174"/>
    </g>
    <path d="M 308 177 Q 362 187 411 174" fill="none" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow-red)"/>
    <g font-size="13" fill="#333" text-anchor="middle">
      <text x="305" y="84">a</text><text x="305" y="114">b</text><text x="305" y="144">c</text><text x="305" y="174">d</text>
      <text x="415" y="101">1</text><text x="415" y="136">2</text><text x="415" y="171">3</text>
    </g>
    <circle cx="415" cy="175" r="7" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="429" y="179" font-size="13" fill="#c0392b" text-anchor="start">命中两次</text>
  </g>

  <!-- 第三列：双射 -->
  <g>
    <ellipse cx="535" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <ellipse cx="645" cy="140" rx="40" ry="78" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <g fill="#333">
      <circle cx="535" cy="105" r="4"/><circle cx="535" cy="140" r="4"/><circle cx="535" cy="175" r="4"/>
      <circle cx="645" cy="105" r="4"/><circle cx="645" cy="140" r="4"/><circle cx="645" cy="175" r="4"/>
    </g>
    <g stroke="#777" stroke-width="1.4" marker-end="url(#arrow)">
      <line x1="538" y1="104" x2="641" y2="104"/>
      <line x1="538" y1="139" x2="641" y2="139"/>
      <line x1="538" y1="174" x2="641" y2="174"/>
    </g>
    <g font-size="13" fill="#333" text-anchor="middle">
      <text x="535" y="101">a</text><text x="535" y="136">b</text><text x="535" y="171">c</text>
      <text x="645" y="101">1</text><text x="645" y="136">2</text><text x="645" y="171">3</text>
    </g>
    <text x="590" y="212" font-size="13" fill="#1f6f8b" text-anchor="middle">值域 = 陪域，一一对应</text>
  </g>

  <!-- 底部小结 -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="120" y="236">不同原像 → 不同像，允许空位</text>
    <text x="350" y="236">值域 = 陪域，允许撞车</text>
  </g>
</svg>
