<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="sans-serif">
  <title>双子叶种子与单子叶籽粒纵切面结构对比</title>
  <desc>左侧为菜豆种子纵切面：种皮、两片子叶、胚芽、胚根、胚轴、种脐；右侧为玉米籽粒纵切面：果皮与种皮愈合、胚乳、胚（盾片、胚芽、胚根）。</desc>
  <rect width="920" height="470" fill="#faf9f5"/>

  <!-- 左面板：双子叶 -->
  <text x="225" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">双子叶种子（菜豆）纵切面</text>

  <!-- 种皮 -->
  <ellipse cx="225" cy="250" rx="160" ry="115" fill="#e3d5b3" stroke="#333" stroke-width="3"/>
  <!-- 种脐 -->
  <ellipse cx="92" cy="250" rx="18" ry="30" fill="#c9b079" stroke="#333" stroke-width="1.5"/>
  <!-- 两片子叶 -->
  <ellipse cx="162" cy="252" rx="72" ry="95" fill="#eecf8b" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="288" cy="252" rx="72" ry="95" fill="#eecf8b" stroke="#333" stroke-width="1.5"/>
  <!-- 胚轴 -->
  <line x1="225" y1="150" x2="225" y2="360" stroke="#7a9e7e" stroke-width="5"/>
  <!-- 胚芽 胚根 -->
  <circle cx="225" cy="142" r="17" fill="#a9c46b" stroke="#333" stroke-width="1.5"/>
  <circle cx="225" cy="366" r="17" fill="#a9c46b" stroke="#333" stroke-width="1.5"/>

  <g fill="#333" font-size="15">
    <text x="40" y="120">种皮（testa）</text>
    <line x1="40" y1="126" x2="88" y2="185" stroke="#666" stroke-width="1.2"/>
    <text x="40" y="320">种脐（hilum）</text>
    <line x1="40" y1="326" x2="82" y2="268" stroke="#666" stroke-width="1.2"/>
    <text x="35" y="85">子叶（cotyledon，2 枚）</text>
    <line x1="35" y1="91" x2="150" y2="175" stroke="#666" stroke-width="1.2"/>
    <text x="330" y="130">胚芽（plumule）</text>
    <line x1="330" y1="136" x2="242" y2="148" stroke="#666" stroke-width="1.2"/>
    <text x="330" y="400">胚根（radicle）</text>
    <line x1="330" y1="394" x2="242" y2="372" stroke="#666" stroke-width="1.2"/>
    <text x="165" y="435">胚轴（hypocotyl）</text>
    <line x1="165" y1="428" x2="225" y2="368" stroke="#666" stroke-width="1.2"/>
  </g>

  <!-- 右面板：单子叶 -->
  <text x="690" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">单子叶籽粒（玉米）纵切面</text>

  <!-- 果皮+种皮 -->
  <ellipse cx="690" cy="250" rx="158" ry="112" fill="#e6dcc0" stroke="#333" stroke-width="3"/>
  <!-- 胚乳 -->
  <ellipse cx="640" cy="252" rx="95" ry="90" fill="#9fc4d0" stroke="#333" stroke-width="1.5"/>
  <!-- 胚 -->
  <ellipse cx="795" cy="305" rx="56" ry="66" fill="#eecf8b" stroke="#333" stroke-width="1.5"/>
  <!-- 胚内：胚芽、胚根 -->
  <circle cx="798" cy="272" r="10" fill="#a9c46b" stroke="#333" stroke-width="1.2"/>
  <circle cx="798" cy="350" r="10" fill="#a9c46b" stroke="#333" stroke-width="1.2"/>

  <g fill="#333" font-size="15">
    <text x="500" y="90">胚乳（endosperm，3n）</text>
    <line x1="500" y1="96" x2="590" y2="195" stroke="#666" stroke-width="1.2"/>
    <text x="700" y="120">果皮＋种皮愈合</text>
    <line x1="700" y1="126" x2="700" y2="145" stroke="#666" stroke-width="1.2"/>
    <text x="830" y="175">胚（embryo）</text>
    <line x1="830" y1="181" x2="812" y2="255" stroke="#666" stroke-width="1.2"/>
    <text x="852" y="320">盾片（scutellum）</text>
    <line x1="852" y1="326" x2="820" y2="315" stroke="#666" stroke-width="1.2"/>
    <text x="852" y="250">胚芽</text>
    <line x1="852" y1="256" x2="809" y2="274" stroke="#666" stroke-width="1.2"/>
    <text x="852" y="380">胚根</text>
    <line x1="852" y1="374" x2="808" y2="352" stroke="#666" stroke-width="1.2"/>
  </g>
</svg>
