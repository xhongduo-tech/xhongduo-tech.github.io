<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="sans-serif">
  <title>种子等级金字塔</title>
  <desc>金字塔自上而下依次为育种家种子、基础种子、登记种子、认证种子；越靠上数量越少、纯度越高、代际越近，越靠下数量越大、直接供应市场。</desc>
  <rect width="640" height="520" fill="#faf9f5"/>

  <text x="320" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">种子等级金字塔</text>

  <!-- 金字塔：四层梯形 -->
  <polygon points="320,80 470,120 470,160 320,130 170,160 170,120" fill="#1f6f8b" opacity="0.85"/>
  <polygon points="320,130 500,165 500,215 320,170 140,215 140,165" fill="#2c7d99" opacity="0.85"/>
  <polygon points="320,170 530,210 530,270 320,210 110,270 110,210" fill="#4a9ab5" opacity="0.85"/>
  <polygon points="320,210 560,255 560,330 320,250 80,330 80,255" fill="#6fb3c9" opacity="0.85"/>

  <!-- 分隔线 -->
  <line x1="170" y1="160" x2="470" y2="160" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="215" x2="500" y2="215" stroke="#333" stroke-width="1.5"/>
  <line x1="110" y1="270" x2="530" y2="270" stroke="#333" stroke-width="1.5"/>

  <!-- 层内文字 -->
  <text x="320" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">育种家种子</text>
  <text x="320" y="132" text-anchor="middle" font-size="13" fill="#fff">Breeder seed</text>

  <text x="320" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">基础种子</text>
  <text x="320" y="192" text-anchor="middle" font-size="13" fill="#fff">Foundation seed</text>

  <text x="320" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">登记种子</text>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#fff">Registered seed</text>

  <text x="320" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">认证种子</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#fff">Certified seed</text>

  <!-- 两侧标注 -->
  <g font-size="15" fill="#333">
    <text x="20" y="120">纯度最高</text>
    <text x="20" y="138">数量最少（克–公斤）</text>
    <text x="20" y="156" font-size="13" fill="#777">代际最近</text>

    <text x="20" y="330">纯度达标</text>
    <text x="20" y="348">数量最大（万吨级）</text>
    <text x="20" y="366" font-size="13" fill="#777">直接供应农民</text>

    <line x1="58" y1="150" x2="58" y2="320" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="585" y1="150" x2="585" y2="320" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="598" y="170" font-size="14" fill="#777">向上：</text>
    <text x="598" y="190" font-size="14" fill="#777">质量等级更高</text>
    <text x="598" y="300" font-size="14" fill="#777">向下：</text>
    <text x="598" y="320" font-size="14" fill="#777">供应量更大</text>
  </g>

  <!-- 底部箭头与说明 -->
  <g font-size="14" fill="#666">
    <path d="M 200 380 L 200 404 L 314 404 L 314 392" fill="none" stroke="#c0392b" stroke-width="2"/>
    <polygon points="310,388 320,392 310,396" fill="#c0392b"/>
    <text x="330" y="408" font-size="14">逐级扩繁，每级由上一级繁殖 1–2 代</text>
    <text x="160" y="440" font-size="14">每一级都要经过田间检查与纯度把关，</text>
    <text x="160" y="460" font-size="14">不合格即作废，不许流入下一级。</text>
  </g>
</svg>
