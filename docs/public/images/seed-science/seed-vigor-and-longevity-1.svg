<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="sans-serif">
  <title>不同贮藏条件下种子存活率随时间的变化</title>
  <desc>横轴为贮藏年限，纵轴为存活率百分比。三条 S 形曲线分别对应高温高湿（劣变最快）、中等条件、低温干燥（最耐存）三种贮藏处理，展示寿命随条件的幂律延长。</desc>
  <rect width="860" height="500" fill="#faf9f5"/>

  <text x="430" y="45" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">不同贮藏条件下种子的存活率曲线</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="60" x2="80" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="420" x2="800" y2="420" stroke="#333" stroke-width="2"/>
  <!-- y 轴刻度 -->
  <text x="66" y="428" text-anchor="end" font-size="14" fill="#333">0</text>
  <text x="66" y="248" text-anchor="end" font-size="14" fill="#333">50</text>
  <text x="60" y="74" text-anchor="end" font-size="14" fill="#333">100</text>
  <line x1="80" y1="240" x2="88" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="72" x2="88" y2="72" stroke="#333" stroke-width="1.5"/>

  <!-- x 轴刻度（稀疏示意） -->
  <line x1="180" y1="420" x2="180" y2="428" stroke="#333" stroke-width="1.5"/>
  <line x1="340" y1="420" x2="340" y2="428" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="420" x2="500" y2="428" stroke="#333" stroke-width="1.5"/>
  <line x1="660" y1="420" x2="660" y2="428" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="444" text-anchor="middle" font-size="13" fill="#777">0</text>
  <text x="340" y="444" text-anchor="middle" font-size="13" fill="#777">10 年</text>
  <text x="660" y="444" text-anchor="middle" font-size="13" fill="#777">40 年</text>
  <text x="440" y="474" text-anchor="middle" font-size="15" fill="#333">贮藏年限</text>
  <text x="40" y="240" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 40 240)">存活率（%）</text>

  <!-- 劣变最快：高温高湿（左移的 S 形） -->
  <path d="M 80 72 C 130 74, 165 90, 190 200 C 205 268, 220 330, 270 410 C 300 448, 330 460, 380 462"
        fill="none" stroke="#c0392b" stroke-width="4"/>

  <!-- 中等条件 -->
  <path d="M 80 72 C 200 74, 320 88, 400 210 C 450 282, 500 356, 590 428 C 630 452, 670 460, 720 462"
        fill="none" stroke="#e67e22" stroke-width="4"/>

  <!-- 低温干燥（右移的 S 形，未画完以示可延长） -->
  <path d="M 80 72 C 260 74, 430 82, 520 190 C 570 250, 620 320, 700 400 C 740 440, 770 455, 800 462"
        fill="none" stroke="#1f6f8b" stroke-width="4"/>

  <!-- 50% 参考线 -->
  <line x1="80" y1="240" x2="800" y2="240" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="792" y="234" text-anchor="end" font-size="13" fill="#999">50%（半衰期）</text>

  <!-- 图例 -->
  <g font-size="15" fill="#333">
    <line x1="160" y1="120" x2="200" y2="120" stroke="#c0392b" stroke-width="4"/>
    <text x="208" y="125">高温高湿（劣变最快）</text>
    <line x1="160" y1="150" x2="200" y2="150" stroke="#e67e22" stroke-width="4"/>
    <text x="208" y="155">常温常湿</text>
    <line x1="160" y1="180" x2="200" y2="180" stroke="#1f6f8b" stroke-width="4"/>
    <text x="208" y="185">低温干燥（最耐存）</text>
  </g>

  <!-- 注释 -->
  <g font-size="14" fill="#666">
    <text x="220" y="320">同样是 50% 存活，三条曲线的时间差可达一个数量级以上</text>
    <line x1="220" y1="314" x2="300" y2="252" stroke="#999" stroke-width="1"/>
  </g>
</svg>
