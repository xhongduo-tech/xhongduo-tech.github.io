<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="sans-serif">
  <title>种子吸水过程的三相曲线</title>
  <desc>横轴为吸胀时间（小时），纵轴为种子含水量（占鲜重百分比）。阶段一为快速物理吸胀，阶段二为停滞期（代谢启动与修复），阶段三根突破后生长吸水急剧上升。</desc>
  <rect width="860" height="500" fill="#faf9f5"/>

  <text x="430" y="45" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">种子吸水的三相曲线</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="60" x2="80" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="420" x2="800" y2="420" stroke="#333" stroke-width="2"/>
  <text x="440" y="470" text-anchor="middle" font-size="15" fill="#333">时间（h）</text>
  <text x="40" y="240" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 40 240)">含水量（占鲜重 %）</text>

  <!-- 阶段底色 -->
  <rect x="80" y="60" width="58" height="360" fill="#f3e9d8" opacity="0.6"/>
  <rect x="138" y="60" width="233" height="360" fill="#e2edf0" opacity="0.6"/>
  <rect x="371" y="60" width="429" height="360" fill="#f7e3e0" opacity="0.6"/>

  <!-- 萌发完成的竖线 -->
  <line x1="371" y1="60" x2="371" y2="420" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="371" y="440" text-anchor="middle" font-size="14" fill="#c0392b">根突破（萌发完成）</text>

  <!-- 吸水曲线 -->
  <path d="M80 420 C 105 330, 125 292, 138 282 C 145 278, 240 272, 300 268 C 330 266, 360 262, 371 260 C 400 252, 520 210, 650 165 C 720 142, 770 130, 800 122"
        fill="none" stroke="#c0392b" stroke-width="4"/>

  <!-- 阶段标注 -->
  <text x="109" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">阶段 I</text>
  <text x="109" y="118" text-anchor="middle" font-size="13" fill="#333">物理吸胀</text>
  <text x="255" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">阶段 II</text>
  <text x="255" y="118" text-anchor="middle" font-size="13" fill="#333">停滞期：修复与代谢启动</text>
  <text x="585" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">阶段 III</text>
  <text x="585" y="118" text-anchor="middle" font-size="13" fill="#333">生长：胚根伸长吸水</text>

  <!-- 关键点注释 -->
  <circle cx="138" cy="282" r="4" fill="#c0392b"/>
  <circle cx="371" cy="260" r="4" fill="#c0392b"/>

  <g font-size="14" fill="#666">
    <text x="180" y="330">种子含水量升至 35–45%，吸水趋于平衡</text>
    <line x1="180" y1="324" x2="250" y2="280" stroke="#999" stroke-width="1"/>
    <text x="520" y="180">吸胀吸水与生长吸水叠加，曲线陡升</text>
    <line x1="520" y1="174" x2="580" y2="195" stroke="#999" stroke-width="1"/>
  </g>
</svg>
