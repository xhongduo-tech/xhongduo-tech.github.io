<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
  <title>种子加工与贮藏流程</title>
  <desc>从左到右的流水线：接收、预清、干燥、清选、分级、拌药处理、包装、入库贮藏。每步用箭头连接，标明各环节的核心目的。</desc>
  <rect width="860" height="470" fill="#faf9f5"/>

  <text x="430" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">种子加工与贮藏流程</text>

  <!-- 三个矩形行布局：第一行 4 个，第二行 4 个，蛇形 -->
  <g font-size="15" fill="#333">
    <!-- 行1 -->
    <rect x="40" y="90" width="150" height="66" rx="10" fill="#1f6f8b"/>
    <text x="115" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">接收</text>
    <text x="115" y="138" text-anchor="middle" font-size="13" fill="#eaf3f6">登记批次·测水分含杂</text>

    <rect x="245" y="90" width="150" height="66" rx="10" fill="#2c7d99"/>
    <text x="320" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">预清</text>
    <text x="320" y="138" text-anchor="middle" font-size="13" fill="#eaf3f6">去大杂·保护设备</text>

    <rect x="450" y="90" width="150" height="66" rx="10" fill="#2c7d99"/>
    <text x="525" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">干燥</text>
    <text x="525" y="138" text-anchor="middle" font-size="13" fill="#eaf3f6">降水分至安全水平</text>

    <rect x="655" y="90" width="150" height="66" rx="10" fill="#2c7d99"/>
    <text x="730" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">清选</text>
    <text x="730" y="138" text-anchor="middle" font-size="13" fill="#eaf3f6">除瘪粒杂草杂质</text>

    <!-- 行2 -->
    <rect x="655" y="220" width="150" height="66" rx="10" fill="#4a9ab5"/>
    <text x="730" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">分级</text>
    <text x="730" y="268" text-anchor="middle" font-size="13" fill="#fff">按大小密度分等级</text>

    <rect x="450" y="220" width="150" height="66" rx="10" fill="#4a9ab5"/>
    <text x="525" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">拌药处理</text>
    <text x="525" y="268" text-anchor="middle" font-size="13" fill="#fff">包衣拌药防病防虫</text>

    <rect x="245" y="220" width="150" height="66" rx="10" fill="#6fb3c9"/>
    <text x="320" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">包装</text>
    <text x="320" y="268" text-anchor="middle" font-size="13" fill="#fff">标准袋+标签信息</text>

    <rect x="40" y="220" width="150" height="66" rx="10" fill="#c0392b"/>
    <text x="115" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">入库贮藏</text>
    <text x="115" y="268" text-anchor="middle" font-size="13" fill="#fff">又干又冷又密封</text>
  </g>

  <!-- 箭头：行1 向右 -->
  <polygon points="196,123 236,123 236,118 248,123 236,128 236,123" fill="#333"/>
  <polygon points="401,123 441,123 441,118 453,123 441,128 441,123" fill="#333"/>
  <polygon points="606,123 646,123 646,118 658,123 646,128 646,123" fill="#333"/>

  <!-- 箭头：行1 末尾折到行2 -->
  <polygon points="730,162 730,206 725,206 730,218 735,206 730,206" fill="#333"/>

  <!-- 箭头：行2 向左 -->
  <polygon points="606,253 646,253 646,248 658,253 646,258 646,253" fill="#333"/>
  <polygon points="401,253 441,253 441,248 453,253 441,258 441,253" fill="#333"/>
  <polygon points="196,253 236,253 236,248 248,253 236,258 236,253" fill="#333"/>

  <!-- 底部备注 -->
  <g font-size="14" fill="#666">
    <text x="430" y="340" text-anchor="middle">核心逻辑：每一步都在保住一个质量维度</text>
    <text x="430" y="364" text-anchor="middle">——干燥保寿命、清选保净度、分级保均匀、拌药保健康、贮藏保活力</text>
    <text x="430" y="400" text-anchor="middle" font-size="14" fill="#777">质量在源头决定，加工环节只能「保真」，无法「补回」</text>
  </g>
</svg>
