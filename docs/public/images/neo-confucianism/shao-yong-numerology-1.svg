<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" font-family="sans-serif">
  <title>邵雍「加一倍法」生成八卦</title>
  <desc>邵雍先天学的一分为二生成图：太极分为阴阳两仪，两仪分为四象，四象分为八卦，逐层加倍而成。</desc>
  <rect x="0" y="0" width="680" height="640" fill="#faf9f5"/>
  <style>
    .node { fill: #ffffff; stroke: #1f6f8b; stroke-width: 1.5; }
    .node-em { fill: #ffffff; stroke: #c0392b; stroke-width: 2; }
    .nt { fill: #333333; font-size: 16; font-weight: bold; text-anchor: middle; }
    .nl { fill: #444444; font-size: 13; text-anchor: middle; }
    .edge { stroke: #9aa5a5; stroke-width: 1.2; }
  </style>

  <g stroke="#9aa5a5" stroke-width="1.2">
    <line x1="350" y1="62" x2="230" y2="158"/>
    <line x1="350" y1="62" x2="470" y2="158"/>
    <line x1="230" y1="182" x2="110" y2="278"/>
    <line x1="230" y1="182" x2="270" y2="278"/>
    <line x1="470" y1="182" x2="390" y2="278"/>
    <line x1="470" y1="182" x2="570" y2="278"/>
    <line x1="110" y1="302" x2="60" y2="398"/>
    <line x1="110" y1="302" x2="150" y2="398"/>
    <line x1="270" y1="302" x2="220" y2="398"/>
    <line x1="270" y1="302" x2="320" y2="398"/>
    <line x1="390" y1="302" x2="340" y2="398"/>
    <line x1="390" y1="302" x2="420" y2="398"/>
    <line x1="570" y1="302" x2="530" y2="398"/>
    <line x1="570" y1="302" x2="610" y2="398"/>
  </g>

  <circle cx="350" cy="40" r="26" class="node-em"/>
  <text x="350" y="46" class="nt" fill="#c0392b">太极</text>

  <circle cx="230" cy="170" r="22" class="node"/>
  <text x="230" y="176" class="nt">阳</text>
  <circle cx="470" cy="170" r="22" class="node"/>
  <text x="470" y="176" class="nt">阴</text>

  <circle cx="110" cy="290" r="22" class="node"/>
  <text x="110" y="296" class="nt">太阳</text>
  <circle cx="270" cy="290" r="22" class="node"/>
  <text x="270" y="296" class="nt">少阴</text>
  <circle cx="390" cy="290" r="22" class="node"/>
  <text x="390" y="296" class="nt">少阳</text>
  <circle cx="570" cy="290" r="22" class="node"/>
  <text x="570" y="296" class="nt">太阴</text>

  <g>
    <circle cx="60" cy="410" r="20" class="node"/>
    <text x="60" y="416" class="nt">乾</text>
    <circle cx="150" cy="410" r="20" class="node"/>
    <text x="150" y="416" class="nt">兑</text>
    <circle cx="220" cy="410" r="20" class="node"/>
    <text x="220" y="416" class="nt">离</text>
    <circle cx="320" cy="410" r="20" class="node"/>
    <text x="320" y="416" class="nt">震</text>
    <circle cx="340" cy="410" r="20" class="node"/>
    <text x="340" y="416" class="nt">巽</text>
    <circle cx="420" cy="410" r="20" class="node"/>
    <text x="420" y="416" class="nt">坎</text>
    <circle cx="530" cy="410" r="20" class="node"/>
    <text x="530" y="416" class="nt">艮</text>
    <circle cx="610" cy="410" r="20" class="node"/>
    <text x="610" y="416" class="nt">坤</text>
  </g>

  <text x="340" y="470" class="nl">太阳生乾、兑　少阴生离、震</text>
  <text x="340" y="495" class="nl">少阳生巽、坎　太阴生艮、坤</text>

  <line x1="0" y1="520" x2="680" y2="520" stroke="#d8d2c8" stroke-width="1"/>
  <text x="340" y="555" class="nl" font-size="15" font-weight="bold" fill="#333333">加一倍法：一分为二，二分为四，四分为八</text>
  <text x="340" y="585" class="nl">太极（1）→ 两仪（2）→ 四象（4）→ 八卦（8）</text>
</svg>
