<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="sans-serif">
  <title>周敦颐《太极图说》宇宙生成脉络</title>
  <desc>从「无极而太极」到「圣人主静立人极」的宇宙生成流程图，展示周敦颐太极观的主要环节：无极、太极、动静阴阳、五行四时、万物化生与人极。</desc>
  <rect x="0" y="0" width="640" height="800" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #1f6f8b; stroke-width: 1.5; rx: 8; }
    .box-em { fill: #ffffff; stroke: #c0392b; stroke-width: 2; rx: 8; }
    .t1 { fill: #333333; font-size: 16; font-weight: bold; text-anchor: middle; }
    .t2 { fill: #444444; font-size: 14; text-anchor: middle; }
    .t-em { fill: #c0392b; font-size: 16; font-weight: bold; text-anchor: middle; }
  </style>

  <rect x="130" y="16" width="380" height="56" class="box"/>
  <text x="320" y="51" class="t1">无极而太极</text>

  <line x1="320" y1="72" x2="320" y2="102" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="104" width="380" height="60" class="box"/>
  <text x="320" y="130" class="t1">太极动而生阳</text>
  <text x="320" y="151" class="t2">动极而静，静极复动，一动一静互为其根</text>

  <line x1="320" y1="164" x2="320" y2="194" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="196" width="380" height="60" class="box"/>
  <text x="320" y="222" class="t1">太极静而生阴</text>
  <text x="320" y="243" class="t2">分阴分阳，两仪立焉</text>

  <line x1="320" y1="256" x2="320" y2="286" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="288" width="380" height="60" class="box"/>
  <text x="320" y="314" class="t1">阳变阴合，而生五行</text>
  <text x="320" y="335" class="t2">水 火 木 金 土</text>

  <line x1="320" y1="348" x2="320" y2="378" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="380" width="380" height="60" class="box"/>
  <text x="320" y="406" class="t1">五气顺布，四时行焉</text>
  <text x="320" y="427" class="t2">五行一阴阳，阴阳一太极，太极本无极</text>

  <line x1="320" y1="440" x2="320" y2="470" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="472" width="380" height="60" class="box"/>
  <text x="320" y="498" class="t1">乾道成男，坤道成女</text>
  <text x="320" y="519" class="t2">二气交感，化生万物</text>

  <line x1="320" y1="532" x2="320" y2="562" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="564" width="380" height="60" class="box"/>
  <text x="320" y="590" class="t1">万物生生而变化无穷</text>
  <text x="320" y="611" class="t2">惟人也，得其秀而最灵</text>

  <line x1="320" y1="624" x2="320" y2="654" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="656" width="380" height="68" class="box-em"/>
  <text x="320" y="684" class="t-em">圣人定之以中正仁义而主静</text>
  <text x="320" y="707" class="t2">无欲故静，立人极焉</text>
</svg>
