<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">单位圆上 1 的三个立方根构成正三角形</title>
  <desc id="desc">复平面上的单位圆，三个立方根 1、ω、ω² 分别位于 0°、120°、240° 方向，用实线连成一个以原点为中心的正三角形。三条线段均为等长，体现方根均匀分布在圆周上。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 实轴 -->
  <line x1="60" y1="240" x2="672" y2="240" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 虚轴 -->
  <line x1="350" y1="452" x2="350" y2="40" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 单位圆 -->
  <circle cx="350" cy="240" r="150" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- 正三角形三条边 -->
  <line x1="500" y1="240" x2="275" y2="370" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="275" y1="370" x2="275" y2="110" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="275" y1="110" x2="500" y2="240" stroke="#c0392b" stroke-width="2.2"/>

  <!-- 半径线 -->
  <line x1="350" y1="240" x2="500" y2="240" stroke="#1f6f8b" stroke-width="1.3"/>
  <line x1="350" y1="240" x2="275" y2="370" stroke="#1f6f8b" stroke-width="1.3"/>
  <line x1="350" y1="240" x2="275" y2="110" stroke="#1f6f8b" stroke-width="1.3"/>

  <!-- 三个根的点 -->
  <circle cx="500" cy="240" r="5" fill="#c0392b"/>
  <circle cx="275" cy="370" r="5" fill="#c0392b"/>
  <circle cx="275" cy="110" r="5" fill="#c0392b"/>
  <circle cx="350" cy="240" r="3.5" fill="#333"/>

  <!-- 文字标注 -->
  <g font-size="16" fill="#333">
    <text x="512" y="230">1</text>
    <text x="252" y="392">ω</text>
    <text x="252" y="100">ω²</text>
    <text x="330" y="268">O</text>
  </g>
  <text x="368" y="196" font-size="15" fill="#999">|z|=1</text>
  <text x="632" y="228" font-size="15" fill="#333">实轴</text>
  <text x="376" y="38" font-size="15" fill="#333">虚轴</text>
</svg>
