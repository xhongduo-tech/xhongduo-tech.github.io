<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">球极投影：从北极 N 把复平面上的点 z 映射到球面上的点 P</title>
  <desc id="desc">单位球面的侧视剖面。北极 N 在球顶，南极 S 在球底，水平虚线为穿过球心的复平面（x3=0，侧视成一维）。复平面上的点 z 与北极 N 的连线交球面于 P，即 z 在球面上的像。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 复平面（水平虚线，侧视） -->
  <line x1="80" y1="240" x2="670" y2="240" stroke="#1f6f8b" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="560" y="266" font-size="15" fill="#1f6f8b">复平面 z = x + iy</text>

  <!-- 球面 -->
  <circle cx="350" cy="240" r="160" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>

  <!-- 投影连线 N -> z（穿过球面在 P 相交） -->
  <line x1="350" y1="80" x2="540" y2="240" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 垂直轴 NS -->
  <line x1="350" y1="80" x2="350" y2="400" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3 5"/>

  <!-- 关键点 -->
  <circle cx="350" cy="80" r="5" fill="#333"/>
  <circle cx="350" cy="400" r="4" fill="#333"/>
  <circle cx="507.7" cy="212.8" r="4.5" fill="#c0392b"/>
  <circle cx="540" cy="240" r="4.5" fill="#c0392b"/>

  <!-- 文字标注 -->
  <g font-size="15" fill="#333">
    <text x="360" y="68">北极 N</text>
    <text x="360" y="428">南极 S</text>
  </g>
  <text x="518" y="200" font-size="15" fill="#c0392b">P(x1,x2,x3)</text>
  <text x="552" y="240" font-size="15" fill="#c0392b">z</text>
  <text x="96" y="228" font-size="14" fill="#1f6f8b">x3 = 0</text>
</svg>
