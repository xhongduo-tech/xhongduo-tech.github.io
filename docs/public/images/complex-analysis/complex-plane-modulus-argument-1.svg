<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">复平面上两点 z1 与 z2 的距离 |z1−z2|</title>
  <desc id="desc">复平面示意图。水平实轴与竖直虚轴交于原点 O。点 z1 与 z2 分别位于第一、第二象限。z1 与 z2 之间用一条实线连接并标注 |z1−z2|，代表两点间的距离。两条虚线分别表示两点实部之差 |a1−a2| 与虚部之差 |b1−b2|，构成直角三角形，距离即其斜边。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 实轴 -->
  <line x1="60" y1="300" x2="672" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 虚轴 -->
  <line x1="350" y1="452" x2="350" y2="40" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 虚线：z2 到水平辅助线 -->
  <line x1="210" y1="150" x2="210" y2="300" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 虚线：z1 到水平辅助线 -->
  <line x1="520" y1="150" x2="520" y2="300" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 虚线：水平辅助线连接两投影 -->
  <line x1="210" y1="150" x2="520" y2="150" stroke="#1f6f8b" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- 距离线 z1-z2 -->
  <line x1="520" y1="190" x2="210" y2="150" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 直角标记 -->
  <path d="M 512 190 L 512 182 L 520 182" fill="none" stroke="#999" stroke-width="1.1"/>

  <!-- 关键点 -->
  <circle cx="350" cy="300" r="3.5" fill="#333"/>
  <circle cx="520" cy="190" r="4.5" fill="#333"/>
  <circle cx="210" cy="150" r="4.5" fill="#333"/>

  <!-- 文字标注 -->
  <g font-size="15" fill="#333">
    <text x="330" y="326">原点 O</text>
    <text x="632" y="288">实轴</text>
    <text x="376" y="38">虚轴</text>
    <text x="534" y="176">z1 = a1 + b1i</text>
    <text x="196" y="136">z2 = a2 + b2i</text>
  </g>
  <text x="356" y="205" font-size="16" fill="#c0392b">|z1 − z2|</text>
  <text x="356" y="140" font-size="14" fill="#1f6f8b">|a1 − a2|</text>
  <text x="524" y="255" font-size="14" fill="#999">|b1 − b2|</text>
</svg>
