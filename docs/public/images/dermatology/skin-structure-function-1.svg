<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="title desc">
  <title>皮肤横断面结构示意</title>
  <desc>从角质层到皮下组织的皮肤各层结构，示毛发、皮脂腺、汗腺、血管与神经的分布。</desc>
  <rect x="0" y="0" width="820" height="540" fill="#faf9f5"/>
  <!-- 毛发 shaft -->
  <rect x="318" y="48" width="10" height="120" fill="#8a7a5a"/>
  <rect x="314" y="42" width="18" height="10" fill="#8a7a5a" rx="5"/>
  <!-- 角质层 -->
  <rect x="220" y="50" width="380" height="40" fill="#efe6d0" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="74" font-family="sans-serif" font-size="13" fill="#333">角质层</text>
  <!-- 颗粒层 -->
  <rect x="220" y="90" width="380" height="30" fill="#f5efe0" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="110" font-family="sans-serif" font-size="13" fill="#333">颗粒层</text>
  <!-- 棘层 -->
  <rect x="220" y="120" width="380" height="70" fill="#faf3e3" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="145" font-family="sans-serif" font-size="13" fill="#333">棘层</text>
  <text x="260" y="165" font-family="sans-serif" font-size="13" fill="#7a6a4a">（朗格汉斯细胞）</text>
  <!-- 基底层 -->
  <rect x="220" y="190" width="380" height="26" fill="#f0e6d2" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="208" font-family="sans-serif" font-size="13" fill="#333">基底层</text>
  <circle cx="500" cy="203" r="8" fill="#5a3a2a"/>
  <text x="505" y="207" font-family="sans-serif" font-size="12" fill="#faf9f5">M</text>
  <!-- 基底膜 -->
  <line x1="220" y1="216" x2="600" y2="216" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="612" y="220" font-family="sans-serif" font-size="13" fill="#c0392b">基底膜</text>
  <!-- 乳头层真皮 -->
  <rect x="220" y="216" width="380" height="74" fill="#f9e7e0" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="256" font-family="sans-serif" font-size="13" fill="#333">乳头层真皮</text>
  <text x="260" y="274" font-family="sans-serif" font-size="13" fill="#7a6a4a">（毛细血管网）</text>
  <path d="M480 260 Q500 236 520 260" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- 网状层真皮 -->
  <rect x="220" y="290" width="380" height="120" fill="#f5dcd0" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="318" font-family="sans-serif" font-size="13" fill="#333">网状层真皮</text>
  <text x="260" y="338" font-family="sans-serif" font-size="13" fill="#7a6a4a">（胶原、弹性纤维）</text>
  <!-- 汗腺 -->
  <path d="M430 290 Q430 350 480 368 Q530 386 540 340 Q548 300 500 300" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="548" y="356" font-family="sans-serif" font-size="13" fill="#1f6f8b">汗腺</text>
  <!-- 血管 -->
  <path d="M280 290 Q300 360 270 410" stroke="#c0392b" stroke-width="4" fill="none"/>
  <text x="286" y="420" font-family="sans-serif" font-size="13" fill="#c0392b">血管</text>
  <!-- 毛囊 -->
  <path d="M323 168 L320 330 L334 344 L336 250" stroke="#8a7a5a" stroke-width="4" fill="#cfc0a0" stroke-linejoin="round"/>
  <circle cx="327" cy="352" r="14" fill="#8a7a5a"/>
  <text x="342" y="332" font-family="sans-serif" font-size="13" fill="#7a5a3a">毛囊</text>
  <!-- 皮脂腺 -->
  <circle cx="352" cy="240" r="13" fill="#f0d060" stroke="#8a6a20" stroke-width="1.5"/>
  <text x="368" y="244" font-family="sans-serif" font-size="13" fill="#8a6a20">皮脂腺</text>
  <!-- 皮下组织 -->
  <rect x="220" y="410" width="380" height="80" fill="#fbead0" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="444" font-family="sans-serif" font-size="13" fill="#333">皮下组织</text>
  <text x="260" y="464" font-family="sans-serif" font-size="13" fill="#7a6a4a">（脂肪、筋膜）</text>
  <!-- 表皮 bracket -->
  <text x="120" y="120" font-family="sans-serif" font-size="16" fill="#1f6f8b">表皮</text>
  <line x1="160" y1="66" x2="160" y2="200" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="160" y1="66" x2="150" y2="66" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="160" y1="200" x2="150" y2="200" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="120" y="285" font-family="sans-serif" font-size="16" fill="#1f6f8b">真皮</text>
  <line x1="160" y1="250" x2="160" y2="360" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="160" y1="250" x2="150" y2="250" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="150" y2="360" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="700" y="60" font-family="sans-serif" font-size="13" fill="#7a6a4a">表皮无血管</text>
  <text x="700" y="78" font-family="sans-serif" font-size="13" fill="#7a6a4a">营养靠真皮扩散</text>
</svg>
