<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 345">
  <title>GNSS 三大组成部分示意</title>
  <desc>空间段卫星星座、控制段地面站与用户段接收机之间的关系：卫星向用户广播测距信号，地面站跟踪卫星并上行注入星历与钟差。</desc>
  <rect x="0" y="0" width="520" height="345" fill="#faf9f5"/>
  <ellipse cx="260" cy="138" rx="205" ry="72" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="260" cy="238" r="62" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="243" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">地球</text>
  <g fill="#c0392b">
    <rect x="46" y="130" width="14" height="14" rx="2"/>
    <rect x="253" y="56" width="14" height="14" rx="2"/>
    <rect x="462" y="130" width="14" height="14" rx="2"/>
  </g>
  <text x="53" y="118" font-family="sans-serif" font-size="13" fill="#333">卫星</text>
  <text x="253" y="50" font-family="sans-serif" font-size="13" fill="#333">卫星</text>
  <text x="468" y="118" font-family="sans-serif" font-size="13" fill="#333">卫星</text>
  <rect x="26" y="290" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="101" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">控制段</text>
  <text x="101" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">主控站 · 监测站 · 注入站</text>
  <rect x="344" y="290" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="419" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">用户段</text>
  <text x="419" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">接收机 · 手机 · 测量仪器</text>
  <line x1="205" y1="180" x2="358" y2="282" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <line x1="298" y1="170" x2="392" y2="282" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <text x="322" y="226" font-family="sans-serif" font-size="13" fill="#c0392b">广播测距信号</text>
  <line x1="178" y1="182" x2="126" y2="286" stroke="#1f6f8b" stroke-width="1.6" marker-end="url(#arrowteal)"/>
  <line x1="122" y1="286" x2="186" y2="190" stroke="#1f6f8b" stroke-width="1.6" marker-end="url(#arrowteal)"/>
  <text x="48" y="252" font-family="sans-serif" font-size="13" fill="#1f6f8b">跟踪 / 注入</text>
  <defs>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
