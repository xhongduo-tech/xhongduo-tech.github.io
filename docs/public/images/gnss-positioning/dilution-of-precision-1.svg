<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300">
  <title>好几何与差几何的 DOP 对比</title>
  <desc>左图四颗卫星均匀分布在天区，视线方向分散，定位解被四面体牢牢框住，DOP 小；右图四颗卫星挤在天区一角，视线近于平行，解被拍扁成一条，DOP 大。</desc>
  <rect x="0" y="0" width="520" height="300" fill="#faf9f5"/>
  <text x="130" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">几何好 · PDOP 小</text>
  <text x="390" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">几何差 · PDOP 大</text>
  <circle cx="130" cy="180" r="46" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="390" cy="180" r="46" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="130" cy="180" r="5" fill="#333"/>
  <circle cx="390" cy="180" r="5" fill="#333"/>
  <text x="130" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">接收机</text>
  <text x="390" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">接收机</text>
  <g fill="#c0392b">
    <rect x="48" y="70" width="12" height="12" rx="2"/>
    <rect x="128" y="50" width="12" height="12" rx="2"/>
    <rect x="212" y="70" width="12" height="12" rx="2"/>
    <rect x="130" y="100" width="12" height="12" rx="2"/>
    <rect x="352" y="86" width="12" height="12" rx="2"/>
    <rect x="376" y="112" width="12" height="12" rx="2"/>
    <rect x="404" y="140" width="12" height="12" rx="2"/>
    <rect x="430" y="86" width="12" height="12" rx="2"/>
  </g>
  <g stroke="#888" stroke-width="1" stroke-dasharray="3 3">
    <line x1="54" y1="76" x2="130" y2="180"/>
    <line x1="134" y1="56" x2="130" y2="180"/>
    <line x1="218" y1="76" x2="130" y2="180"/>
    <line x1="136" y1="106" x2="130" y2="180"/>
    <line x1="358" y1="92" x2="390" y2="180"/>
    <line x1="382" y1="118" x2="390" y2="180"/>
    <line x1="410" y1="146" x2="390" y2="180"/>
    <line x1="436" y1="92" x2="390" y2="180"/>
  </g>
  <circle cx="130" cy="180" r="30" fill="none" stroke="#1f6f8b" stroke-width="2.4"/>
  <ellipse cx="390" cy="180" rx="30" ry="6" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text x="130" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">视线分散 · 解域小</text>
  <text x="390" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">视线集中 · 解域拉长</text>
</svg>
