<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
  <title>三球交会与定位几何</title>
  <desc>三颗卫星分别以改正后的伪距为半径画圆（球面投影），接收机位于三个圆交点的中心；第四颗卫星参与解算钟差，图中省略。</desc>
  <rect x="0" y="0" width="520" height="360" fill="#faf9f5"/>
  <circle cx="260" cy="315" r="34" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="260" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">接收机</text>
  <g fill="#c0392b">
    <rect x="68" y="52" width="13" height="13" rx="2"/>
    <rect x="440" y="52" width="13" height="13" rx="2"/>
    <rect x="254" y="20" width="13" height="13" rx="2"/>
  </g>
  <text x="74" y="40" font-family="sans-serif" font-size="13" fill="#333">卫星 1</text>
  <text x="446" y="40" font-family="sans-serif" font-size="13" fill="#333">卫星 2</text>
  <text x="260" y="14" font-family="sans-serif" font-size="13" fill="#333">卫星 3</text>
  <circle cx="74.5" cy="58.5" r="205" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="7 5"/>
  <circle cx="446.5" cy="58.5" r="235" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="7 5"/>
  <circle cx="260.5" cy="26.5" r="250" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="7 5"/>
  <circle cx="260" cy="315" r="9" fill="#1f6f8b"/>
  <text x="332" y="286" font-family="sans-serif" font-size="13" fill="#1f6f8b">三圆交汇区 = 定位解</text>
  <line x1="74.5" y1="58.5" x2="260" y2="315" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="446.5" y1="58.5" x2="260" y2="315" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260.5" y1="26.5" x2="260" y2="315" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="118" y="205" font-family="sans-serif" font-size="13" fill="#c0392b">伪距 1</text>
  <text x="360" y="150" font-family="sans-serif" font-size="13" fill="#c0392b">伪距 2</text>
  <text x="236" y="120" font-family="sans-serif" font-size="13" fill="#c0392b">伪距 3</text>
</svg>
