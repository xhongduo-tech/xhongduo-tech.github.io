<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif">
<title>动脉粥样硬化斑块的进展阶段</title>
<desc>动脉横断面示意：正常动脉、脂纹、纤维斑块与不稳定斑块破裂伴血栓形成四个阶段。</desc>
<rect x="0" y="0" width="800" height="330" fill="#faf9f5"/>
<g stroke="#6b4f2a" stroke-width="14" fill="none">
<circle cx="100" cy="150" r="88"/>
<circle cx="300" cy="150" r="88"/>
<circle cx="500" cy="150" r="88"/>
<circle cx="700" cy="150" r="88"/>
</g>
<g fill="#faf9f5" stroke="#333" stroke-width="1.5">
<circle cx="100" cy="150" r="58"/>
<circle cx="300" cy="150" r="58"/>
<circle cx="500" cy="150" r="58"/>
<circle cx="700" cy="150" r="58"/>
</g>
<path d="M 333.3,102.5 A 58 58 0 0 1 333.3,197.5" fill="none" stroke="#d4a017" stroke-width="20" stroke-linecap="butt"/>
<path d="M 533.3,102.5 A 58 58 0 0 1 533.3,197.5" fill="none" stroke="#8b6914" stroke-width="30" stroke-linecap="butt"/>
<path d="M 733.3,102.5 A 58 58 0 0 1 756,135" fill="none" stroke="#7a5c00" stroke-width="22" stroke-linecap="butt"/>
<path d="M 756,165 A 58 58 0 0 1 733.3,197.5" fill="none" stroke="#7a5c00" stroke-width="22" stroke-linecap="butt"/>
<circle cx="735" cy="150" r="16" fill="#4a2c00"/>
<circle cx="712" cy="150" r="13" fill="#8b0000"/>
<text x="100" y="270" font-size="14" fill="#333" text-anchor="middle">正常动脉</text>
<text x="300" y="270" font-size="14" fill="#333" text-anchor="middle">脂纹</text>
<text x="500" y="270" font-size="14" fill="#333" text-anchor="middle">纤维斑块</text>
<text x="700" y="270" font-size="14" fill="#333" text-anchor="middle">不稳定斑块·破裂</text>
<text x="712" y="185" font-size="12" fill="#8b0000">血栓</text>
<text x="735" y="140" font-size="12" fill="#4a2c00">脂质核</text>
<text x="100" y="305" font-size="12" fill="#999">管腔通畅</text>
<text x="300" y="305" font-size="12" fill="#999">管腔轻微狭窄</text>
<text x="500" y="305" font-size="12" fill="#999">管腔显著狭窄</text>
<text x="700" y="305" font-size="12" fill="#999">斑块破裂 → 血栓</text>
</svg>
