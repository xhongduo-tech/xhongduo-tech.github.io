<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="sans-serif">
<title>心室肌细胞动作电位与窦房结起搏电位</title>
<desc>心室肌细胞动作电位的 0-4 相及各相主要离子流，标出不应期与阈值；右下角为起搏细胞的 4 相自动去极化。</desc>
<rect x="0" y="0" width="800" height="380" fill="#faf9f5"/>
<line x1="60" y1="320" x2="740" y2="320" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="320" x2="60" y2="60" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="149" x2="740" y2="149" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="60" y1="251" x2="740" y2="251" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
<text x="24" y="153" font-size="13" fill="#333">0 mV</text>
<text x="20" y="255" font-size="13" fill="#333">阈值</text>
<text x="24" y="318" font-size="13" fill="#333">-90 mV</text>
<text x="300" y="350" font-size="13" fill="#333">时间 →</text>
<text x="22" y="100" font-size="13" fill="#333" transform="rotate(-90 22 100)">膜电位</text>
<path d="M 60,303 C 90,300 100,150 112,116 C 122,110 136,110 144,130 C 180,150 260,155 300,155 C 330,155 355,290 385,303 L 740,303" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="95" y="100" font-size="15" fill="#c0392b">0</text>
<text x="148" y="100" font-size="15" fill="#c0392b">1</text>
<text x="240" y="105" font-size="15" fill="#c0392b">2</text>
<text x="380" y="240" font-size="15" fill="#c0392b">3</text>
<text x="480" y="330" font-size="15" fill="#c0392b">4</text>
<text x="100" y="84" font-size="13" fill="#1f6f8b">Na⁺ 内流</text>
<text x="240" y="185" font-size="13" fill="#1f6f8b">Ca²⁺ 内流 ≈ K⁺ 外流（平台）</text>
<text x="340" y="235" font-size="13" fill="#1f6f8b">K⁺ 外流</text>
<line x1="112" y1="270" x2="340" y2="270" stroke="#333" stroke-width="1.5"/>
<text x="160" y="288" font-size="13" fill="#333">有效不应期（ERP）</text>
<rect x="430" y="185" width="310" height="125" fill="#fbfaf6" stroke="#999" stroke-width="1"/>
<text x="445" y="203" font-size="13" fill="#333">起搏细胞（窦房结）：4相自动去极化</text>
<path d="M 455,292 C 480,292 500,278 520,268 C 540,258 565,258 580,280 C 595,292 620,292 635,292 C 655,292 680,280 710,270" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<line x1="440" y1="268" x2="740" y2="268" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
<text x="445" y="252" font-size="12" fill="#333">阈值</text>
<text x="455" y="315" font-size="12" fill="#333">4相缓慢去极化</text>
<text x="570" y="250" font-size="12" fill="#333">达阈值→0相</text>
</svg>
