<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif">
  <title>飞行包线 V-n 图</title>
  <desc>以载荷因子 n 为纵轴、空速 V 为横轴：正负失速边界、结构极限载荷线与俯冲速度围成飞行包线。</desc>
  <rect width="640" height="340" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="220" x2="590" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="220" x2="110" y2="60" stroke="#333" stroke-width="2"/>
  <text x="590" y="245" font-size="14" fill="#333" text-anchor="end">空速 V</text>
  <text x="98" y="70" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 98 70)">载荷因子 n</text>
  <!-- n 刻度 -->
  <text x="96" y="225" font-size="12" fill="#666" text-anchor="end">0</text>
  <text x="96" y="145" font-size="12" fill="#666" text-anchor="end">+2</text>
  <text x="96" y="105" font-size="12" fill="#666" text-anchor="end">+2.5</text>
  <text x="96" y="285" font-size="12" fill="#666" text-anchor="end">−1.5</text>
  <!-- 正失速边界 -->
  <path d="M110,220 Q260,170 340,120" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- 负失速边界 -->
  <path d="M110,220 Q150,250 200,280" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- 结构极限载荷线 -->
  <line x1="340" y1="120" x2="570" y2="120" stroke="#c0392b" stroke-width="3"/>
  <line x1="200" y1="280" x2="570" y2="280" stroke="#c0392b" stroke-width="3"/>
  <!-- 俯冲速度线 -->
  <line x1="570" y1="120" x2="570" y2="280" stroke="#333" stroke-width="2"/>
  <!-- 包线区域淡色填充 -->
  <path d="M110,220 Q260,170 340,120 L570,120 L570,280 L200,280 Q150,250 110,220 Z"
        fill="#1f6f8b" fill-opacity="0.12" stroke="none"/>
  <!-- 关键速度刻度 -->
  <line x1="340" y1="220" x2="340" y2="228" stroke="#333" stroke-width="1"/>
  <text x="340" y="242" font-size="13" fill="#333" text-anchor="middle">V_A</text>
  <line x1="470" y1="220" x2="470" y2="228" stroke="#333" stroke-width="1"/>
  <text x="470" y="242" font-size="13" fill="#333" text-anchor="middle">V_C</text>
  <line x1="570" y1="220" x2="570" y2="228" stroke="#333" stroke-width="1"/>
  <text x="570" y="242" font-size="13" fill="#333" text-anchor="middle">V_D</text>
  <!-- 标注 -->
  <text x="205" y="168" font-size="13" fill="#1f6f8b">正失速边界</text>
  <text x="130" y="262" font-size="13" fill="#1f6f8b">负失速边界</text>
  <text x="360" y="108" font-size="13" fill="#c0392b">+2.5g 结构极限</text>
  <text x="360" y="298" font-size="13" fill="#c0392b">−1.5g 结构极限</text>
  <text x="478" y="160" font-size="13" fill="#333">飞行包线</text>
  <text x="60" y="40" font-size="14" fill="#333" font-weight="bold">运输类飞机飞行包线（V-n 图）</text>
</svg>
