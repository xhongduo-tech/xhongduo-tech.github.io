<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">复叠制冷系统示意图</title>
<desc id="desc">高温回路与低温回路两条独立的蒸气压缩循环经复叠换热器接力，把冷库热量逐级传递给大气。</desc>
<defs>
  <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="800" height="520" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">

  <!-- 复叠换热器（共享） -->
  <rect x="335" y="185" width="130" height="120" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="335" y1="245" x2="465" y2="245" stroke="#333" stroke-width="1.2"/>
  <text x="400" y="220" text-anchor="middle" font-size="15" font-weight="bold">复叠换热器</text>
  <text x="400" y="272" text-anchor="middle" font-size="13">H 蒸发侧 / L 冷凝侧</text>

  <!-- 高温回路部件 -->
  <rect x="555" y="20" width="130" height="50" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="620" y="50" text-anchor="middle" font-size="14">冷凝器 H</text>
  <text x="620" y="20" text-anchor="middle" font-size="12" dy="-4">向大气放热</text>
  <rect x="555" y="95" width="100" height="45" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="605" y="123" text-anchor="middle" font-size="14">压缩机 H</text>
  <rect x="200" y="95" width="90" height="45" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="245" y="123" text-anchor="middle" font-size="14">节流阀 H</text>

  <!-- 高温回路流程 -->
  <g fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arr-c)">
    <path d="M 605 95 L 620 72"/>                                  <!-- 压缩机->冷凝器 -->
    <path d="M 555 45 L 430 45 L 430 117 L 290 117"/>              <!-- 冷凝器->节流阀 -->
    <path d="M 200 117 L 200 190 L 335 200"/>                     <!-- 节流阀->复叠换热器 H 侧 -->
    <path d="M 465 215 L 480 215 L 480 117 L 555 117"/>           <!-- 复叠换热器->压缩机 -->
  </g>

  <!-- 低温回路部件 -->
  <rect x="560" y="330" width="110" height="45" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="615" y="358" text-anchor="middle" font-size="14">压缩机 L</text>
  <rect x="300" y="320" width="90" height="45" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="345" y="348" text-anchor="middle" font-size="14">节流阀 L</text>
  <rect x="120" y="335" width="130" height="55" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="185" y="358" text-anchor="middle" font-size="14">蒸发器 L</text>
  <text x="185" y="377" text-anchor="middle" font-size="13">（冷库）</text>

  <!-- 低温回路流程 -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-r)">
    <path d="M 615 330 L 615 305 L 465 305"/>                      <!-- 压缩机->复叠换热器 L 侧 -->
    <path d="M 335 270 L 335 290 L 390 320"/>                     <!-- 复叠换热器->节流阀 -->
    <path d="M 300 342 L 250 342"/>                               <!-- 节流阀->蒸发器 -->
    <path d="M 185 390 L 185 470 L 615 470 L 615 375"/>           <!-- 蒸发器->压缩机 -->
  </g>

  <!-- 温度与回路标注 -->
  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#888">冷库 −60°C</text>
  <text x="620" y="12" text-anchor="middle" font-size="13" fill="#1f6f8b">高温回路（如 R-410A，冷凝 40°C）</text>
  <text x="345" y="307" text-anchor="end" font-size="13" fill="#c0392b">低温回路（如 R-23，蒸发 −60°C）</text>
  <text x="400" y="168" text-anchor="middle" font-size="13" fill="#888">中间温度约 −10°C</text>

</g>
</svg>
