<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">湿空气焓湿图示意图</title>
<desc id="desc">干球温度-含湿量坐标系下的焓湿图：饱和线把图分成气态区与雾区，等相对湿度线与等焓线（近似等湿球线）标注了空气状态点 A 的露点与湿球温度。</desc>
<rect x="0" y="0" width="800" height="560" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">

  <!-- 坐标轴 -->
  <line x1="100" y1="500" x2="760" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="500" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>
  <polygon points="760,500 752,496 752,504" fill="#333"/>
  <polygon points="100,80 96,88 104,88" fill="#333"/>
  <text x="720" y="524" font-size="15">干球温度 t（°C）</text>
  <text x="40" y="88" font-size="15" text-anchor="middle">含湿量 W（g/kg）</text>
  <g font-size="13" text-anchor="middle">
    <text x="100" y="518">0</text><text x="232" y="518">10</text><text x="364" y="518">20</text>
    <text x="496" y="518">30</text><text x="628" y="518">40</text><text x="760" y="518">50</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="92" y="504">0</text><text x="92" y="434">10</text><text x="92" y="364">20</text>
    <text x="92" y="294">30</text><text x="92" y="224">40</text><text x="92" y="154">50</text>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="100" y1="500" x2="106" y2="500"/><line x1="100" y1="430" x2="106" y2="430"/>
    <line x1="100" y1="360" x2="106" y2="360"/><line x1="100" y1="290" x2="106" y2="290"/>
    <line x1="100" y1="220" x2="106" y2="220"/><line x1="100" y1="150" x2="106" y2="150"/>
    <line x1="100" y1="500" x2="100" y2="494"/><line x1="232" y1="500" x2="232" y2="494"/>
    <line x1="364" y1="500" x2="364" y2="494"/><line x1="496" y1="500" x2="496" y2="494"/>
    <line x1="628" y1="500" x2="628" y2="494"/><line x1="760" y1="500" x2="760" y2="494"/>
  </g>

  <!-- 雾区标注（饱和线右侧） -->
  <text x="700" y="452" font-size="13" fill="#888">雾区（过饱和）</text>

  <!-- 等焓线（青色虚线，近似等湿球线） -->
  <g stroke="#1f6f8b" stroke-dasharray="7 5" fill="none">
    <line x1="100" y1="202" x2="760" y2="350"/>
    <line x1="100" y1="272" x2="760" y2="420"/>
    <line x1="100" y1="342" x2="760" y2="490"/>
  </g>
  <text x="536" y="272" font-size="13" fill="#1f6f8b">等焓线（近似等湿球线）</text>

  <!-- 50% 与 75% 相对湿度线 -->
  <polyline points="100,480 232,460 364,423 496,357 628,243" fill="none" stroke="#d9836f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polyline points="100,487 166,481 232,473 298,463 364,449 430,430 496,405 562,373 628,329" fill="none" stroke="#d9836f" stroke-width="1.2"/>
  <text x="612" y="316" font-size="13" fill="#d9836f">φ=50%</text>

  <!-- 饱和线 -->
  <polyline points="100,474 133,468 166,462 199,455 232,447 265,437 298,426 331,413 364,397 397,379 430,359 463,336 496,310 529,280 562,245 595,206 628,157" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="648" y="120" font-size="14" fill="#c0392b" transform="rotate(-28 648 120)">饱和线 φ=100%</text>

  <!-- 状态点 A -->
  <circle cx="430" cy="416" r="5" fill="#c0392b"/>
  <text x="438" y="408" font-size="13">A（25°C，12 g/kg）</text>

  <!-- 露点：水平虚线到饱和线 -->
  <line x1="324" y1="416" x2="430" y2="416" stroke="#333" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="324" cy="416" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="430" font-size="13">露点≈17°C（沿等 W 线向左冷却到饱和）</text>

  <!-- 湿球：沿等焓线到饱和 -->
  <line x1="357" y1="405" x2="430" y2="416" stroke="#1f6f8b" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="357" cy="405" r="4" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="230" y="406" font-size="13" fill="#1f6f8b">湿球≈19.5°C（沿等焓线向左到饱和）</text>

</g>
</svg>
