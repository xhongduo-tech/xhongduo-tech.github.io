<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>CFL 条件：特征线必须落在数值依赖域内</title>
<desc>时间-空间网格上，迎风格式的数值依赖域是红色线段，真解沿特征线回溯的落点必须落在线段内，即 Courant 数 ν 须介于 0 与 1 之间。</desc>
<rect x="0" y="0" width="520" height="420" fill="#faf9f5"/>

<!-- 坐标轴 -->
<line x1="60" y1="360" x2="500" y2="360" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="360" x2="60" y2="60" stroke="#333" stroke-width="1.5"/>
<text x="492" y="378" font-size="16" fill="#333">x</text>
<text x="44" y="72" font-size="16" fill="#333">t</text>

<!-- 网格层标记 -->
<text x="20" y="150" font-size="14" fill="#555">第 n+1 层</text>
<text x="20" y="330" font-size="14" fill="#555">第 n 层</text>
<line x1="80" y1="120" x2="500" y2="120" stroke="#bbb" stroke-dasharray="4 4"/>
<line x1="80" y1="320" x2="500" y2="320" stroke="#bbb" stroke-dasharray="4 4"/>

<!-- 网格点 -->
<g fill="#333">
<circle cx="120" cy="120" r="3"/>
<circle cx="200" cy="120" r="3"/>
<circle cx="280" cy="120" r="4"/>
<circle cx="360" cy="120" r="3"/>
<circle cx="440" cy="120" r="3"/>
<circle cx="120" cy="320" r="3"/>
<circle cx="200" cy="320" r="3"/>
<circle cx="280" cy="320" r="3"/>
<circle cx="360" cy="320" r="3"/>
<circle cx="440" cy="320" r="3"/>
</g>

<!-- 数值依赖域（红色线段 + 模板连线） -->
<line x1="200" y1="320" x2="280" y2="320" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
<line x1="280" y1="120" x2="200" y2="320" stroke="#c0392b" stroke-width="2.5"/>
<line x1="280" y1="120" x2="280" y2="320" stroke="#c0392b" stroke-width="2.5"/>
<text x="228" y="344" font-size="14" fill="#c0392b">数值依赖域</text>
<text x="288" y="210" font-size="14" fill="#c0392b">迎风模板</text>

<!-- 特征线：ν=0.7（安全，落在依赖域内） -->
<line x1="280" y1="120" x2="224" y2="320" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="224" cy="320" r="5" fill="#1f6f8b"/>
<text x="208" y="300" font-size="14" fill="#1f6f8b">特征线落点</text>
<text x="196" y="380" font-size="14" fill="#1f6f8b">ν = ak/h = 0.7（安全）</text>

<!-- 特征线：ν>1（违反 CFL，落在依赖域外） -->
<line x1="280" y1="120" x2="176" y2="320" stroke="#8b4513" stroke-width="2" stroke-dasharray="2 4"/>
<circle cx="176" cy="320" r="5" fill="none" stroke="#8b4513" stroke-width="2"/>
<text x="92" y="290" font-size="14" fill="#8b4513">落点偏出依赖域</text>
<text x="92" y="308" font-size="14" fill="#8b4513">ν &gt; 1（不稳定）</text>

<!-- 下标说明 -->
<text x="272" y="110" font-size="14" fill="#333">(x_j, t_{n+1})</text>
<text x="120" y="340" font-size="13" fill="#333">x_{j-1}</text>
<text x="272" y="340" font-size="13" fill="#333">x_j</text>
<text x="352" y="340" font-size="13" fill="#333">x_{j+1}</text>
</svg>
