<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>一维网格上的线性有限元基函数（帽子函数）</title>
<desc>三个相邻的帽子函数：每个基函数只在相邻两个单元内非零，节点值取 1，其余节点取 0，即 φ_i(x_j)=δ_ij。</desc>
<rect x="0" y="0" width="480" height="320" fill="#faf9f5"/>

<line x1="40" y1="250" x2="470" y2="250" stroke="#333" stroke-width="1.5"/>
<line x1="40" y1="250" x2="40" y2="60" stroke="#333" stroke-width="1.5"/>

<!-- 网格节点 -->
<g fill="#333">
<circle cx="80" cy="250" r="3"/>
<circle cx="180" cy="250" r="3"/>
<circle cx="280" cy="250" r="3"/>
<circle cx="380" cy="250" r="3"/>
<circle cx="480" cy="250" r="3"/>
</g>

<!-- 单元区间阴影 -->
<rect x="180" y="250" width="100" height="8" fill="#c0392b" opacity="0.35"/>
<rect x="280" y="250" width="100" height="8" fill="#c0392b" opacity="0.35"/>

<!-- 帽子函数 -->
<polygon points="80,250 180,100 280,250" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2.5"/>
<polygon points="180,250 280,100 380,250" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2.5"/>
<polygon points="280,250 380,100 480,250" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2.5"/>

<text x="164" y="90" font-size="15" fill="#1f6f8b">φ_i</text>
<text x="264" y="90" font-size="15" fill="#1f6f8b">φ_{i+1}</text>
<text x="364" y="90" font-size="15" fill="#1f6f8b">φ_{i+2}</text>

<text x="72" y="272" font-size="13" fill="#333">x_i</text>
<text x="172" y="272" font-size="13" fill="#333">x_{i+1}</text>
<text x="272" y="272" font-size="13" fill="#333">x_{i+2}</text>
<text x="372" y="272" font-size="13" fill="#333">x_{i+3}</text>

<text x="80" y="308" font-size="14" fill="#c0392b">每个基函数只在相邻两个单元内非零（紧支撑）</text>
<text x="80" y="46" font-size="14" fill="#333">φ_i(x_j) = δ_{ij}：节点处取值 1 或 0</text>
</svg>
