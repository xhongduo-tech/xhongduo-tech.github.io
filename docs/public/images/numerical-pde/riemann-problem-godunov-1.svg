<svg viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>Burgers 方程的 Riemann 问题：激波与稀疏扇形</title>
<desc>左图：初值左高右低（u_L&gt;u_R）时特征线汇入一条激波，激波速度 s=(u_L+u_R)/2；右图：左低右高（u_L&lt;u_R）时特征线发散成稀疏扇形。</desc>
<rect x="0" y="0" width="540" height="400" fill="#faf9f5"/>

<text x="60" y="40" font-size="15" fill="#333">(a) 激波（u_L &gt; u_R）：特征线汇入间断</text>
<text x="330" y="40" font-size="15" fill="#333">(b) 稀疏波（u_L &lt; u_R）：特征线张开成扇形</text>

<!-- 面板 A：激波 -->
<line x1="40" y1="310" x2="270" y2="310" stroke="#333" stroke-width="1.5"/>
<text x="52" y="330" font-size="13" fill="#333">x=0（初始间断）</text>
<line x1="155" y1="310" x2="155" y2="80" stroke="#bbb" stroke-dasharray="3 4"/>

<g stroke="#1f6f8b" stroke-width="2">
<line x1="70" y1="310" x2="180" y2="90"/>
<line x1="105" y1="310" x2="215" y2="90"/>
<line x1="140" y1="310" x2="250" y2="90"/>
</g>
<g stroke="#c0392b" stroke-width="2">
<line x1="200" y1="310" x2="240" y2="90"/>
<line x1="225" y1="310" x2="258" y2="140"/>
<line x1="250" y1="310" x2="268" y2="200"/>
</g>
<line x1="155" y1="310" x2="226" y2="90" stroke="#8b4513" stroke-width="3"/>
<text x="206" y="200" font-size="14" fill="#8b4513">激波 s=(u_L+u_R)/2</text>
<text x="70" y="210" font-size="13" fill="#1f6f8b">u_L=2（快）</text>
<text x="208" y="310" font-size="13" fill="#c0392b" dx="12" dy="-4">u_R=1（慢）</text>

<!-- 面板 B：稀疏扇形 -->
<line x1="300" y1="310" x2="530" y2="310" stroke="#333" stroke-width="1.5"/>
<line x1="410" y1="310" x2="410" y2="80" stroke="#bbb" stroke-dasharray="3 4"/>
<text x="318" y="330" font-size="13" fill="#333">x=0（初始间断）</text>

<g stroke="#1f6f8b" stroke-width="2">
<line x1="330" y1="310" x2="370" y2="90"/>
<line x1="360" y1="310" x2="395" y2="150"/>
<line x1="390" y1="310" x2="410" y2="220"/>
</g>
<g stroke="#c0392b" stroke-width="2">
<line x1="480" y1="310" x2="530" y2="90"/>
<line x1="455" y1="310" x2="515" y2="140"/>
<line x1="430" y1="310" x2="470" y2="200"/>
</g>
<g stroke="#8b4513" stroke-width="2">
<line x1="410" y1="310" x2="452" y2="70"/>
<line x1="410" y1="310" x2="476" y2="70"/>
<line x1="410" y1="310" x2="500" y2="70"/>
<line x1="410" y1="310" x2="524" y2="90"/>
</g>
<text x="440" y="60" font-size="14" fill="#8b4513">稀疏扇形（fan）</text>
<text x="316" y="210" font-size="13" fill="#1f6f8b">u_L=1（慢）</text>
<text x="492" y="170" font-size="13" fill="#c0392b">u_R=2（快）</text>
</svg>
