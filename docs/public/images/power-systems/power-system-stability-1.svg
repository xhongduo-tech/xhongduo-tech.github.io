<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="sans-serif">
  <title>功角曲线与等面积法则</title>
  <desc>故障期间发电机加速面积 A1 与故障切除后的减速面积 A2；A1 等于 A2 时对应临界切除角</desc>
  <rect width="900" height="360" fill="#faf9f5"/>
  <rect x="0" y="0" width="900" height="360" fill="none" stroke="#333" stroke-width="1"/>
  <text x="450" y="24" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">等面积法则：A₁ = A₂ 时刚好维持同步（临界切除）</text>
  <text x="840" y="45" text-anchor="middle" font-size="15" fill="#333">P</text>
  <line x1="100" y1="40" x2="100" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="300" x2="840" y2="300" stroke="#333" stroke-width="2"/>
  <text x="850" y="305" text-anchor="middle" font-size="15" fill="#333">δ</text>

  <text x="150" y="145" font-size="15" fill="#333">Pm</text>
  <line x1="100" y1="160" x2="820" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="150" y="50" font-size="15" fill="#c0392b">故障后 P(e)</text>
  <polyline points="100,300 160,248.2 220,200 280,158.6 340,126.8 400,106.8 460,100 520,106.8 580,126.8 640,158.6 700,200 760,248.2 820,300" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="430" y="84" font-size="15" fill="#1f6f8b">故障后 Pe（切除后）</text>

  <polyline points="100,300 160,274.2 220,250 280,229.2 340,213.4 400,203.4 460,200 520,203.4 580,213.4 640,229.2 700,250 760,274.2 820,300" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="430" y="230" font-size="15" fill="#c0392b">故障期间 Pe（故障）</text>

  <line x1="277.6" y1="160" x2="277.6" y2="300" stroke="#666" stroke-width="1.5"/>
  <text x="277.6" y="318" text-anchor="middle" font-size="15" fill="#333">δ₀</text>
  <line x1="400" y1="160" x2="400" y2="300" stroke="#666" stroke-width="1.5"/>
  <text x="400" y="318" text-anchor="middle" font-size="15" fill="#333">δc</text>
  <line x1="642.4" y1="160" x2="642.4" y2="300" stroke="#666" stroke-width="1.5"/>
  <text x="642.4" y="318" text-anchor="middle" font-size="15" fill="#333">δmax</text>

  <polygon points="277.6,160 280,229.2 340,213.4 400,203.4 400,160" fill="#c0392b" opacity="0.25"/>
  <text x="336" y="196" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">A₁</text>
  <polygon points="400,160 400,106.8 460,100 520,106.8 580,126.8 640,158.6 642.4,160" fill="#1f6f8b" opacity="0.22"/>
  <text x="530" y="140" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">A₂</text>

  <text x="450" y="352" text-anchor="middle" font-size="14" fill="#333">δ₀：初始功角；δc：故障切除角；δmax：故障后稳定极限角。A₁ 是加速面积，A₂ 是可利用的减速面积</text>
</svg>
