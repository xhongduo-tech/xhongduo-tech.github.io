<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif">
  <title>汉代代田法沟垄横截面示意</title>
  <desc>代田法把一亩地开成三条垄两条畎，种子播在畎中，苗长后培垄土，次年垄畎互换。</desc>
  <rect x="0" y="0" width="640" height="340" fill="#faf9f5"/>
  <!-- 天空与土层 -->
  <text x="40" y="40" font-size="20" fill="#333" font-weight="bold">代田法横截面示意（一亩三畎，岁代处）</text>
  <!-- 垄1 -->
  <path d="M70 210 L120 140 L190 140 L210 210 Z" fill="#cbb28a" stroke="#8a734a" stroke-width="2"/>
  <!-- 畎1 -->
  <path d="M210 210 L210 250 L300 250 L300 210 Z" fill="#a98557" stroke="#8a734a" stroke-width="2"/>
  <!-- 垄2 -->
  <path d="M300 210 L345 140 L415 140 L430 210 Z" fill="#cbb28a" stroke="#8a734a" stroke-width="2"/>
  <!-- 畎2 -->
  <path d="M430 210 L430 250 L520 250 L520 210 Z" fill="#a98557" stroke="#8a734a" stroke-width="2"/>
  <!-- 垄3 -->
  <path d="M520 210 L565 140 L620 140 L620 210 L520 210 Z" fill="#cbb28a" stroke="#8a734a" stroke-width="2"/>
  <!-- 地面线 -->
  <line x1="30" y1="210" x2="620" y2="210" stroke="#333" stroke-width="3"/>
  <!-- 种子在畎中 -->
  <circle cx="255" cy="228" r="6" fill="#c0392b"/>
  <circle cx="475" cy="228" r="6" fill="#c0392b"/>
  <text x="255" y="248" font-size="15" fill="#c0392b" text-anchor="middle">种</text>
  <text x="475" y="248" font-size="15" fill="#c0392b" text-anchor="middle">种</text>
  <!-- 标注 -->
  <text x="130" y="120" font-size="17" fill="#333" text-anchor="middle">垄</text>
  <text x="380" y="120" font-size="17" fill="#333" text-anchor="middle">垄</text>
  <text x="565" y="120" font-size="17" fill="#333" text-anchor="middle">垄</text>
  <text x="255" y="285" font-size="17" fill="#333" text-anchor="middle">畎（低沟，播种）</text>
  <text x="475" y="285" font-size="17" fill="#333" text-anchor="middle">畎（低沟，播种）</text>
  <!-- 箭头：垄畎互换 -->
  <line x1="120" y1="300" x2="120" y2="250" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="120" y1="250" x2="120" y2="300" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowb)"/>
  <text x="120" y="325" font-size="15" fill="#1f6f8b" text-anchor="middle">明年垄畎互换</text>
  <!-- 培土 -->
  <text x="560" y="245" font-size="14" fill="#1f6f8b">苗长后培垄土于根部</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
