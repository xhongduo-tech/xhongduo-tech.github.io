<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="sans-serif">
  <title>唐代曲辕犁结构示意</title>
  <desc>曲辕犁由犁底、犁铧、犁壁、犁箭、犁评、曲辕与犁梢构成，曲辕与犁评实现操作灵活与深浅调节。</desc>
  <rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
  <text x="320" y="36" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">唐代曲辕犁结构示意（陆龟蒙《耒耜经》）</text>
  <!-- 地面 -->
  <line x1="40" y1="280" x2="600" y2="280" stroke="#8a734a" stroke-width="3"/>
  <text x="60" y="300" font-size="14" fill="#8a734a">地面</text>
  <!-- 犁底 -->
  <line x1="200" y1="258" x2="440" y2="258" stroke="#333" stroke-width="6"/>
  <text x="330" y="335" font-size="15" fill="#333" text-anchor="middle">犁底（承托全犁）</text>
  <line x1="330" y1="258" x2="330" y2="322" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 犁铧 -->
  <path d="M200 258 L150 244 L150 272 L200 258 Z" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <text x="100" y="248" font-size="15" fill="#c0392b" text-anchor="middle">犁铧（破土）</text>
  <line x1="150" y1="252" x2="118" y2="252" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 犁壁 -->
  <path d="M205 258 Q240 200 300 205 L300 258 Z" fill="#e8dcc0" stroke="#333" stroke-width="2"/>
  <text x="262" y="196" font-size="15" fill="#333" text-anchor="middle">犁壁（翻土）</text>
  <line x1="262" y1="206" x2="262" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 犁箭 -->
  <line x1="340" y1="258" x2="340" y2="130" stroke="#333" stroke-width="5"/>
  <text x="400" y="150" font-size="15" fill="#333" text-anchor="middle">犁箭（垂直主柱）</text>
  <line x1="340" y1="150" x2="360" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 犁评 -->
  <rect x="322" y="118" width="70" height="14" rx="3" fill="#1f6f8b"/>
  <text x="402" y="122" font-size="15" fill="#1f6f8b" text-anchor="start">犁评（可上下，调深浅）</text>
  <!-- 曲辕 -->
  <path d="M340 140 Q300 90 200 84 L120 76" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="185" y="72" font-size="15" fill="#333" text-anchor="middle">曲辕（弯曲，连接牛与犁）</text>
  <!-- 牛 -->
  <path d="M90 60 L40 76 L50 96 L100 84 Z" fill="#1f6f8b"/>
  <text x="66" y="112" font-size="14" fill="#1f6f8b" text-anchor="middle">牛（牵引）</text>
  <!-- 犁梢 -->
  <line x1="440" y1="258" x2="480" y2="120" stroke="#333" stroke-width="6"/>
  <text x="500" y="200" font-size="15" fill="#333" text-anchor="middle">犁梢（手柄）</text>
  <line x1="478" y1="200" x2="492" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
</svg>
