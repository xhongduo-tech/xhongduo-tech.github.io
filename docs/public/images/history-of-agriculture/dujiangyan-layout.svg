<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="sans-serif">
  <title>都江堰水利工程布局示意</title>
  <desc>都江堰由鱼嘴分水、飞沙堰泄洪排沙、宝瓶口引水三大件组成，实现无坝引水、水旱从人。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="36" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">都江堰布局示意（无坝引水）</text>
  <!-- 岷江上游 -->
  <path d="M295 50 L300 120 L340 120 L345 50 Z" fill="#9fc6d8" stroke="#5b8ca6" stroke-width="2"/>
  <text x="320" y="80" font-size="15" fill="#1f6f8b" text-anchor="middle">岷江</text>
  <text x="320" y="100" font-size="13" fill="#1f6f8b" text-anchor="middle">（上游来水）</text>
  <!-- 鱼嘴（分流） -->
  <path d="M320 120 L260 200 L320 230 L380 200 Z" fill="#d8cba8" stroke="#8a734a" stroke-width="2"/>
  <text x="320" y="178" font-size="14" fill="#8a734a" text-anchor="middle">鱼嘴</text>
  <text x="320" y="196" font-size="12" fill="#8a734a" text-anchor="middle">（分水堤）</text>
  <!-- 外江（西，泄洪） -->
  <path d="M260 200 L180 280 L150 360 L190 360 L225 290 L300 225 Z" fill="#bcd8e5" stroke="#5b8ca6" stroke-width="2"/>
  <text x="205" y="330" font-size="15" fill="#1f6f8b" text-anchor="middle">外江</text>
  <text x="205" y="350" font-size="12" fill="#1f6f8b" text-anchor="middle">（泄洪排沙）</text>
  <!-- 内江（东，灌溉） -->
  <path d="M380 200 L420 260 L400 300 L450 300 L470 270 L420 225 Z" fill="#cfe6ef" stroke="#5b8ca6" stroke-width="2"/>
  <text x="430" y="285" font-size="15" fill="#1f6f8b" text-anchor="middle">内江</text>
  <text x="430" y="303" font-size="12" fill="#1f6f8b" text-anchor="middle">（引水灌溉）</text>
  <!-- 飞沙堰 -->
  <line x1="185" y1="255" x2="395" y2="255" stroke="#c0392b" stroke-width="8"/>
  <text x="290" y="245" font-size="14" fill="#c0392b" text-anchor="middle">飞沙堰（溢流坝）</text>
  <!-- 宝瓶口 -->
  <path d="M450 300 L445 345 L480 345 L475 300 Z" fill="#8a734a"/>
  <text x="462" y="368" font-size="14" fill="#8a734a" text-anchor="middle">宝瓶口（窄口引水）</text>
  <!-- 成都平原 -->
  <rect x="440" y="380" width="150" height="26" fill="#e8dcc0" stroke="#8a734a" stroke-width="1.5"/>
  <text x="515" y="397" font-size="14" fill="#333" text-anchor="middle">成都平原（灌区）</text>
  <!-- 流向箭头 -->
  <path d="M470 315 L505 380" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#flow)"/>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
