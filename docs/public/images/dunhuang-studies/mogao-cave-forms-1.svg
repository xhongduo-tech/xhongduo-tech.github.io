<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="sans-serif">
  <title>三种典型洞窟形制俯视示意</title>
  <desc>中心塔柱窟、覆斗顶窟与禅窟三种莫高窟典型洞窟形制的俯视平面示意图，用于直观对比空间结构差异。</desc>
  <rect x="0" y="0" width="900" height="340" fill="#faf9f5"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">三种典型洞窟形制（俯视平面示意）</text>

  <!-- 窟1：中心塔柱窟 -->
  <text x="150" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">中心塔柱窟（北朝）</text>
  <rect x="55" y="85" width="190" height="150" rx="4" fill="#fdf6ec" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="103" font-size="12" fill="#666">入口</text>
  <polygon points="60,120 110,120 110,220 60,220" fill="#fff" stroke="#333" stroke-width="1"/>
  <polygon points="150,85 245,85 245,235 150,235" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="150" y="120" width="52" height="80" rx="2" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <text x="176" y="166" text-anchor="middle" font-size="12" fill="#fff">塔柱</text>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#c0392b">绕塔礼佛</text>
  <text x="120" y="160" text-anchor="middle" font-size="11" fill="#c0392b">（右旋）</text>
  <path d="M 120 225 A 45 45 0 1 1 120 135" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="150" y="255" text-anchor="middle" font-size="12" fill="#666">四壁绘佛传、本生</text>
  <text x="150" y="272" text-anchor="middle" font-size="12" fill="#666">塔柱四面开龛造像</text>

  <!-- 窟2：覆斗顶窟 -->
  <text x="450" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">覆斗顶窟（隋唐）</text>
  <rect x="340" y="85" width="220" height="150" rx="4" fill="#fdf6ec" stroke="#333" stroke-width="1.5"/>
  <polygon points="340,95 560,95 560,235 340,235" fill="#fff" stroke="#333" stroke-width="1"/>
  <polygon points="355,110 545,110 545,220 355,220" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="195" text-anchor="middle" font-size="12" fill="#c0392b">覆斗形窟顶（倒置之斗）</text>
  <rect x="420" y="85" width="60" height="34" rx="2" fill="#1f6f8b" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#fff">正壁佛龛</text>
  <text x="450" y="255" text-anchor="middle" font-size="12" fill="#666">四壁铺陈大型经变画</text>
  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#666">空间开阔，适合群体礼拜</text>

  <!-- 窟3：禅窟 -->
  <text x="760" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">禅窟（北朝）</text>
  <rect x="660" y="85" width="200" height="150" rx="4" fill="#fdf6ec" stroke="#333" stroke-width="1.5"/>
  <rect x="665" y="100" width="190" height="45" rx="2" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="760" y="127" text-anchor="middle" font-size="12" fill="#666">前室（礼佛共修）</text>
  <rect x="668" y="155" width="52" height="70" rx="2" fill="#1f6f8b" stroke="#333" stroke-width="1"/>
  <rect x="734" y="155" width="52" height="70" rx="2" fill="#1f6f8b" stroke="#333" stroke-width="1"/>
  <rect x="800" y="155" width="52" height="70" rx="2" fill="#1f6f8b" stroke="#333" stroke-width="1"/>
  <text x="694" y="196" text-anchor="middle" font-size="11" fill="#fff">禅室</text>
  <text x="760" y="196" text-anchor="middle" font-size="11" fill="#fff">禅室</text>
  <text x="826" y="196" text-anchor="middle" font-size="11" fill="#fff">禅室</text>
  <text x="760" y="255" text-anchor="middle" font-size="12" fill="#666">两侧开小型禅室静修</text>
  <text x="760" y="272" text-anchor="middle" font-size="12" fill="#666">禅观传统的空间化</text>

  <text x="450" y="315" text-anchor="middle" font-size="13" fill="#333">空间决定观看：不同形制安排不同的礼佛动线与视觉焦点</text>
</svg>
