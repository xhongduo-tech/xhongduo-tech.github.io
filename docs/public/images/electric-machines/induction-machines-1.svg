<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img">
<title>感应电机转矩-转速特性曲线</title>
<desc>横轴为转速（0 到同步转速 n_s），纵轴为转矩。曲线从起动转矩开始上升，达到最大转矩 T_max 后下降，到同步转速处为零，右侧为稳定运行区。</desc>
<rect x="0" y="0" width="460" height="320" fill="#faf9f5"/>

<!-- 坐标轴 -->
<line x1="55" y1="265" x2="435" y2="265" stroke="#333" stroke-width="2"/>
<polygon points="435,265 427,261 427,269" fill="#333"/>
<line x1="55" y1="265" x2="55" y2="42" stroke="#333" stroke-width="2"/>
<polygon points="55,42 59,50 51,50" fill="#333"/>
<text x="210" y="310" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">转速 n</text>
<text x="22" y="160" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 22 160)">转矩 T</text>

<!-- 转矩-转速曲线 -->
<path d="M 62,205 C 115,165 185,92 275,62 C 330,98 385,215 420,265" fill="none" stroke="#c0392b" stroke-width="3.5"/>

<!-- 起动转矩 -->
<line x1="62" y1="205" x2="60" y2="205" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="90" y="198" font-family="sans-serif" font-size="14" fill="#1f6f8b">起动转矩 T_start</text>

<!-- 最大转矩 -->
<line x1="55" y1="62" x2="275" y2="62" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="288" y="58" font-family="sans-serif" font-size="14" fill="#1f6f8b">最大转矩 T_max（突破转矩）</text>

<!-- 同步转速 -->
<line x1="420" y1="265" x2="420" y2="42" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
<text x="400" y="36" font-family="sans-serif" font-size="14" fill="#999" text-anchor="middle">同步转速 n_s</text>

<!-- 转差标注 -->
<text x="66" y="282" font-family="sans-serif" font-size="13" fill="#333">n=0, s=1（起动）</text>
<text x="330" y="282" font-family="sans-serif" font-size="13" fill="#333">n=n_s, s=0</text>

<!-- 稳定与不稳定区 -->
<text x="148" y="235" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">不稳定区</text>
<text x="355" y="215" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">稳定运行区</text>

<text x="230" y="182" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">额定运行点（s ≈ 2%～5%）</text>
<circle cx="388" cy="238" r="4" fill="#333"/>
</svg>
