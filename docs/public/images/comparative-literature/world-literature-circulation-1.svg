<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>世界文学的椭圆折射模型</title>
  <desc>一幅图说明达姆罗什的世界文学定义：文本从源文化出发，经翻译与流通折射，进入目标文化，在两文化的双焦点之间构成椭圆折射。</desc>
  <rect width="640" height="420" fill="#faf9f5" />
  <ellipse cx="320" cy="210" rx="150" ry="95" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6" />
  <text x="320" y="72" text-anchor="middle" fill="#333" font-size="17" font-weight="bold">椭圆折射：世界文学的流通模型</text>
  <text x="320" y="96" text-anchor="middle" fill="#666" font-size="14">文本 = 源文化与目标文化的双焦点椭圆</text>
  <circle cx="170" cy="210" r="104" fill="none" stroke="#c0392b" stroke-width="2" />
  <circle cx="470" cy="210" r="104" fill="none" stroke="#c0392b" stroke-width="2" />
  <circle cx="170" cy="210" r="7" fill="#c0392b" />
  <circle cx="470" cy="210" r="7" fill="#c0392b" />
  <text x="170" y="196" text-anchor="middle" fill="#c0392b" font-size="15" font-weight="bold">焦点 A</text>
  <text x="170" y="218" text-anchor="middle" fill="#333" font-size="14">源文化</text>
  <text x="470" y="196" text-anchor="middle" fill="#c0392b" font-size="15" font-weight="bold">焦点 B</text>
  <text x="470" y="218" text-anchor="middle" fill="#333" font-size="14">目标文化</text>
  <text x="170" y="326" text-anchor="middle" fill="#666" font-size="13">原作诞生地（源语言）</text>
  <text x="470" y="326" text-anchor="middle" fill="#666" font-size="13">译文流通地（目标语言）</text>
  <rect x="88" y="330" width="164" height="4" fill="#c0392b" />
  <rect x="388" y="330" width="164" height="4" fill="#c0392b" />
  <rect x="265" y="176" width="110" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" />
  <text x="320" y="196" text-anchor="middle" fill="#333" font-size="14">流通中的</text>
  <text x="320" y="216" text-anchor="middle" fill="#333" font-size="14">世界文学文本</text>
  <path d="M 274 250 C 300 290 340 290 366 250" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)" />
  <path d="M 320 130 C 320 120 320 118 320 112" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)" />
  <text x="320" y="292" text-anchor="middle" fill="#c0392b" font-size="13">翻译 + 流通（折射）</text>
  <text x="292" y="138" text-anchor="middle" fill="#c0392b" font-size="13">重新语境化</text>
  <text x="320" y="386" text-anchor="middle" fill="#666" font-size="13">文本在两个焦点之间运动，意义被双方共同折射</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b" />
    </marker>
  </defs>
</svg>
