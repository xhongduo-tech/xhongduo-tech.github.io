<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">逻辑斯蒂流行曲线</title>
  <desc id="desc">横轴为时间，纵轴为病害严重度 y，S 形曲线经历指数前期、线性爆发期与饱和期，虚线标出最大携带量 K。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="40" x2="80" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="70" x2="600" y2="70" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="598" y="352" font-family="sans-serif" font-size="16" fill="#333" text-anchor="end">时间 t</text>
  <text x="92" y="44" font-family="sans-serif" font-size="16" fill="#333">严重度 y</text>
  <text x="610" y="66" font-family="sans-serif" font-size="16" fill="#1f6f8b">K（最大携带量）</text>
  <path d="M80,358 C180,356 260,340 330,280 S450,120 590,64" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="410" cy="215" r="6" fill="#333"/>
  <text x="418" y="210" font-family="sans-serif" font-size="15" fill="#333">拐点，增速最大</text>
  <text x="150" y="330" font-family="sans-serif" font-size="15" fill="#333">指数前期</text>
  <text x="380" y="330" font-family="sans-serif" font-size="15" fill="#333">线性爆发期</text>
  <text x="510" y="120" font-family="sans-serif" font-size="15" fill="#333">饱和期</text>
</svg>
