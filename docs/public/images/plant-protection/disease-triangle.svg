<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">病害三角</title>
  <desc id="desc">寄主、病原、环境三个条件圆相交，交集中心标注「病害」，并注明三者缺一病害不发生。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>
  <circle cx="222" cy="175" r="132" fill="#1f6f8b" fill-opacity="0.30" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="418" cy="175" r="132" fill="#c0392b" fill-opacity="0.30" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="320" cy="300" r="132" fill="#a67c00" fill-opacity="0.30" stroke="#a67c00" stroke-width="2.5"/>
  <text x="222" y="64" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">寄主</text>
  <text x="418" y="64" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">病原</text>
  <text x="320" y="408" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">环境</text>
  <text x="320" y="228" font-family="sans-serif" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">病害</text>
  <text x="320" y="252" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">三者缺一，病害不发生</text>
</svg>
