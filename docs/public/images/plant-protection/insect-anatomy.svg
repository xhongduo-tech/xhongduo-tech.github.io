<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">昆虫体躯基本构造（侧视）</title>
  <desc id="desc">自左向右为头、胸、腹三体段：头带触角、复眼与口器，胸部长三对足与两对翅，腹部容纳内脏。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <polyline points="128,150 88,104 60,108" fill="none" stroke="#333" stroke-width="2.5"/>
  <polyline points="140,148 104,92 78,96" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="46" y="100" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">触角</text>
  <circle cx="150" cy="180" r="42" fill="#1f6f8b" fill-opacity="0.20" stroke="#333" stroke-width="2.5"/>
  <circle cx="163" cy="163" r="14" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="186" y="152" font-family="sans-serif" font-size="15" fill="#333">复眼</text>
  <text x="96" y="240" font-family="sans-serif" font-size="16" fill="#333">口器</text>
  <text x="96" y="280" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">头</text>
  <ellipse cx="290" cy="185" rx="66" ry="46" fill="#c0392b" fill-opacity="0.20" stroke="#333" stroke-width="2.5"/>
  <polyline points="246,224 226,318" fill="none" stroke="#333" stroke-width="2.5"/>
  <polyline points="290,230 294,330" fill="none" stroke="#333" stroke-width="2.5"/>
  <polyline points="334,224 356,318" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="290" y="352" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">三对足</text>
  <polyline points="255,150 210,88" fill="none" stroke="#333" stroke-width="2.5"/>
  <polyline points="270,145 236,78" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="240" y="66" font-family="sans-serif" font-size="16" fill="#333">翅</text>
  <text x="290" y="258" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">胸</text>
  <ellipse cx="430" cy="205" rx="95" ry="60" fill="#1f6f8b" fill-opacity="0.20" stroke="#333" stroke-width="2.5"/>
  <text x="430" y="292" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">腹</text>
</svg>
