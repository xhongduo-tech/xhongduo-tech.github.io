<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480">
  <title>sl(3,C) 的根系统 A2：正六边形</title>
  <desc>六个根 ±(e1-e2)、±(e2-e3)、±(e1-e3) 分布在正六边形的六个顶点，正根用实心红点、负根用空心青点标注。</desc>
  <rect width="560" height="480" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="280" y1="20" x2="280" y2="460" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="240" x2="520" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- 六边形轮廓（辅助） -->
  <polygon points="280,60 486,150 486,330 280,420 74,330 74,150" fill="none" stroke="#c9c4ba" stroke-width="1.2" stroke-dasharray="6 5"/>
  <!-- 正根：实心红点（六个顶点中三个） -->
  <circle cx="280" cy="60" r="11" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <circle cx="486" cy="330" r="11" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <circle cx="74" cy="330" r="11" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <!-- 负根：空心青点 -->
  <circle cx="486" cy="150" r="11" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="74" cy="150" r="11" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="280" cy="420" r="11" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 根标签 -->
  <text x="280" y="38" font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle">α₁₂ = ε₁−ε₂</text>
  <text x="507" y="334" font-family="sans-serif" font-size="17" fill="#333">α₁₃ = ε₁−ε₃</text>
  <text x="30" y="334" font-family="sans-serif" font-size="17" fill="#333" text-anchor="end">α₂₃ = ε₂−ε₃</text>
  <text x="507" y="144" font-family="sans-serif" font-size="17" fill="#1f6f8b">−α₂₃</text>
  <text x="28" y="144" font-family="sans-serif" font-size="17" fill="#1f6f8b" text-anchor="end">−α₁₃</text>
  <text x="280" y="450" font-family="sans-serif" font-size="17" fill="#1f6f8b" text-anchor="middle">−α₁₂</text>
  <!-- 图例 -->
  <circle cx="120" cy="40" r="8" fill="#c0392b" stroke="#333" stroke-width="1.2"/>
  <text x="136" y="45" font-family="sans-serif" font-size="16" fill="#333">正根（实心）</text>
  <circle cx="286" cy="40" r="8" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2.2"/>
  <text x="302" y="45" font-family="sans-serif" font-size="16" fill="#333">负根（空心）</text>
  <!-- 原点标注 -->
  <circle cx="280" cy="240" r="4" fill="#333"/>
  <text x="296" y="262" font-family="sans-serif" font-size="15" fill="#333">0（Cartan 子代数 H）</text>
</svg>
