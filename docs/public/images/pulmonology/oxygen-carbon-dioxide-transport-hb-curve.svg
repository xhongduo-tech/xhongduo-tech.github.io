<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>氧合血红蛋白解离曲线</title>
  <desc>氧合血红蛋白解离曲线呈 S 形，横轴为血氧分压 PO2，纵轴为氧饱和度 SaO2，标注 P50 与 Bohr 效应（pH 下降 / 温度升高使曲线右移）</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="90" y1="390" x2="610" y2="390"/>
    <line x1="90" y1="390" x2="90" y2="50"/>
  </g>
  <g font-size="16" fill="#333">
    <text x="620" y="410" text-anchor="end">动脉血 PO2 (mmHg)</text>
    <text x="70" y="45" text-anchor="middle">SaO2 (%)</text>
  </g>
  <g font-size="14" fill="#555">
    <text x="90" y="412" text-anchor="middle">0</text>
    <text x="160" y="412" text-anchor="middle">20</text>
    <text x="230" y="412" text-anchor="middle">40</text>
    <text x="300" y="412" text-anchor="middle">60</text>
    <text x="370" y="412" text-anchor="middle">80</text>
    <text x="440" y="412" text-anchor="middle">100</text>
    <text x="540" y="412" text-anchor="middle">120</text>
    <text x="35" y="390" text-anchor="end">0</text>
    <text x="35" y="298" text-anchor="end">50</text>
    <text x="35" y="206" text-anchor="end">75</text>
    <text x="35" y="90" text-anchor="end">100</text>
  </g>
  <!-- axes tick marks -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="160" y1="390" x2="160" y2="398"/>
    <line x1="230" y1="390" x2="230" y2="398"/>
    <line x1="300" y1="390" x2="300" y2="398"/>
    <line x1="370" y1="390" x2="370" y2="398"/>
    <line x1="440" y1="390" x2="440" y2="398"/>
    <line x1="540" y1="390" x2="540" y2="398"/>
  </g>
  <!-- normal curve: P50 at 26.6 mmHg -> x=90+140*(26.6/120)=121, y~50% = 390-0.5*300=240 -->
  <path d="M 90 390 C 105 386, 118 384, 130 381 C 150 376, 166 369, 180 357 C 195 343, 210 324, 226 298 C 242 270, 258 240, 282 205 C 306 172, 334 138, 368 112 C 404 90, 440 78, 480 72 C 520 67, 560 66, 600 66"
        stroke="#1f6f8b" stroke-width="4" fill="none"/>
  <!-- dashed P50 reference -->
  <line x1="121" y1="240" x2="121" y2="412" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="90" y1="240" x2="121" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="126" y="402" fill="#c0392b" font-size="14">P50 = 26.6 mmHg</text>
  <!-- right-shifted (Bohr) curve -->
  <path d="M 90 390 C 106 386, 120 383, 134 379 C 158 372, 180 361, 200 344 C 222 324, 244 298, 276 262 C 306 228, 344 190, 388 152 C 432 118, 476 94, 528 80 C 566 72, 596 69, 610 68"
        stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="8 5"/>
  <text x="430" y="150" fill="#c0392b" font-size="15">右移（Bohr 效应：pH↓、T↑、2,3-DPG↑）</text>
  <!-- labels on curve -->
  <text x="200" y="330" fill="#1f6f8b" font-size="15">正常曲线</text>
  <text x="350" y="64" fill="#1f6f8b" font-size="14">平台段：PO2 高时氧含量几乎饱和</text>
  <text x="120" y="286" fill="#1f6f8b" font-size="14">陡峭段：PO2 低时氧易释放</text>
</svg>
