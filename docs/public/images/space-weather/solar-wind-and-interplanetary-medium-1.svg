<svg viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>帕克螺旋（Parker spiral）示意图</title>
<desc>自转的太阳向四周吹出径向的太阳风；由于太阳自转，等离子体携带的行星际磁场被拉成阿基米德螺旋（帕克螺旋），在 1 AU 处螺旋角约 45 度。</desc>
<rect width="620" height="560" fill="#faf9f5"/>
