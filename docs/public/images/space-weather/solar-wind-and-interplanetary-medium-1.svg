<!-- 太阳 -->
<circle cx="250" cy="285" r="55" fill="#f2c14e" stroke="#c98f1f" stroke-width="2.5"/>
<text x="250" y="291" text-anchor="middle" font-size="20" fill="#6b4a00" font-weight="bold">太阳</text>
<!-- 太阳自转示意 -->
<path d="M 295 245 A 70 70 0 0 1 315 300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr1)"/>
<text x="330" y="228" font-size="14" fill="#333">太阳自转（角速度 Ω）</text>
<!-- 太阳风径向箭头 -->
<g stroke="#c0392b" stroke-width="2.5" fill="none">
<line x1="250" y1="176" x2="250" y2="138" marker-end="url(#arr2)"/>
<line x1="354" y1="225" x2="382" y2="205" marker-end="url(#arr2)"/>
<line x1="146" y1="225" x2="118" y2="205" marker-end="url(#arr2)"/>
</g>
<text x="258" y="128" font-size="14" fill="#c0392b">太阳风（径向流出）</text>
<!-- 螺旋角标注 -->
<text x="432" y="300" font-size="14" fill="#1f6f8b">行星际磁场螺旋线</text>
<text x="432" y="318" font-size="13" fill="#555">1 AU 处螺旋角 ψ ≈ 45°</text>
<text x="432" y="336" font-size="13" fill="#555">（示意图，非等比例）</text>
<defs>
<marker id="arr1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
<marker id="arr2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
</defs>
</svg>
