<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" font-family="sans-serif">
<title>地球磁层结构示意</title>
<desc>太阳风从左侧来流，弓激波与磁层顶把地球磁层压缩成彗星状；夜侧拖出磁尾，内磁层环绕环电流，日侧磁层顶发生磁重联。</desc>
<defs>
  <marker id="arrH" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3 L0,6 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="840" height="540" fill="#faf9f5"/>

<!-- 太阳风箭头 -->
<g stroke="#1f6f8b" stroke-width="2" fill="none">
  <line x1="20" y1="120" x2="250" y2="120" marker-end="url(#arrH)"/>
  <line x1="20" y1="230" x2="250" y2="230" marker-end="url(#arrH)"/>
  <line x1="20" y1="340" x2="250" y2="340" marker-end="url(#arrH)"/>
</g>
<text x="20" y="40" font-size="18" fill="#1f6f8b" font-weight="bold">太阳风（超音速来流）</text>

<!-- 行星际磁场 IMF：南向斜线 -->
<g stroke="#c0392b" stroke-width="2" fill="none">
  <line x1="10" y1="70" x2="150" y2="210" marker-end="url(#arrRed)"/>
  <line x1="10" y1="100" x2="180" y2="270" marker-end="url(#arrRed)"/>
  <line x1="10" y1="140" x2="230" y2="320" marker-end="url(#arrRed)"/>
</g>
<text x="20" y="510" font-size="16" fill="#c0392b" font-weight="bold">行星际磁场（南向 Bz&lt;0）</text>

<!-- 弓激波 -->
<path d="M80,60 C 260,130 320,205 310,270 C 320,335 260,410 80,480" fill="none" stroke="#333" stroke-width="3"/>
<text x="470" y="120" font-size="16" fill="#333">弓激波（bow shock）</text>
<line x1="445" y1="126" x2="305" y2="155" stroke="#999" stroke-width="1"/>

<!-- 磁鞘 -->
<text x="205" y="170" font-size="15" fill="#333">磁鞘</text>

<!-- 磁层顶 -->
<path d="M180,150 C 320,195 355,242 350,270 C 355,298 320,345 180,390" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="500" y="305" font-size="16" fill="#333">磁层顶（magnetopause）</text>
<line x1="475" y1="298" x2="353" y2="272" stroke="#999" stroke-width="1"/>

<!-- 磁重联点 -->
<g stroke="#c0392b" stroke-width="2">
  <line x1="340" y1="260" x2="360" y2="280"/>
  <line x1="340" y1="280" x2="360" y2="260"/>
</g>
<text x="395" y="255" font-size="15" fill="#c0392b">磁重联（南向 IMF 触发）</text>

<!-- 地球 -->
<circle cx="210" cy="270" r="32" fill="#e8e2d8" stroke="#333" stroke-width="2"/>
<text x="205" y="226" font-size="14" fill="#333">N</text>
<text x="205" y="320" font-size="14" fill="#333">S</text>

<!-- 地球闭合磁力线 -->
<g stroke="#1f6f8b" stroke-width="1.5" fill="none">
  <path d="M215,240 C 285,215 335,245 342,264"/>
  <path d="M215,300 C 285,325 335,295 342,276"/>
  <path d="M218,248 C 270,232 310,255 316,268"/>
  <path d="M218,292 C 270,308 310,285 316,272"/>
</g>

<!-- 环电流 -->
<ellipse cx="210" cy="270" rx="72" ry="54" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="90" y="225" font-size="16" fill="#333">环电流</text>
<line x1="128" y1="228" x2="168" y2="235" stroke="#999" stroke-width="1"/>

<!-- 磁尾 -->
<g stroke="#333" stroke-width="2" fill="none">
  <path d="M360,215 C 560,198 700,190 820,182" stroke-dasharray="6 4"/>
  <path d="M360,325 C 560,342 700,350 820,358" stroke-dasharray="6 4"/>
</g>
<line x1="368" y1="270" x2="820" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="700" y="130" font-size="16" fill="#333">磁尾（magnetotail）</text>
<line x1="660" y1="136" x2="660" y2="185" stroke="#999" stroke-width="1"/>
<text x="610" y="290" font-size="15" fill="#c0392b">中性片</text>

<!-- 极尖区 -->
<text x="285" y="105" font-size="15" fill="#333">极尖区</text>
<line x1="288" y1="112" x2="270" y2="155" stroke="#999" stroke-width="1"/>
<text x="285" y="435" font-size="15" fill="#333">极尖区</text>
<line x1="288" y1="428" x2="270" y2="390" stroke="#999" stroke-width="1"/>
</svg>
