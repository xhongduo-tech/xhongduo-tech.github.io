<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" font-family="sans-serif">
<title>地磁感应电流（GIC）回路示意</title>
<desc>高空极光电集流变化产生地磁扰动，在地层感应出水平电场，通过变压器中性点接地把准直流注入电网，形成导线—大地—变压器绕组—导线的闭合回路。</desc>
<defs>
  <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3 L0,6 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/>
  </marker>
  <marker id="arrDark" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
  </marker>
</defs>
<rect x="0" y="0" width="840" height="520" fill="#faf9f5"/>

<!-- 极光电集流 -->
<rect x="40" y="28" width="760" height="38" fill="#ddeff2" stroke="#1f6f8b" stroke-width="1.5"/>
<line x1="700" y1="47" x2="130" y2="47" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<text x="60" y="18" font-size="16" fill="#1f6f8b" font-weight="bold">极光电集流（约 100 km 高空，亚暴电流）</text>

<!-- dB/dt 场线 -->
<g stroke="#333" stroke-width="1.5" stroke-dasharray="6 4">
  <line x1="180" y1="66" x2="180" y2="330"/>
  <line x1="380" y1="66" x2="380" y2="330"/>
  <line x1="580" y1="66" x2="580" y2="330"/>
  <line x1="760" y1="66" x2="760" y2="330"/>
</g>
<text x="600" y="105" font-size="15" fill="#333">变化的地磁场 dB/dt</text>

<!-- 地层 -->
<rect x="40" y="330" width="760" height="190" fill="#eae5da"/>
<line x1="40" y1="425" x2="800" y2="425" stroke="#d8d0c0" stroke-width="1"/>
<line x1="40" y1="505" x2="800" y2="505" stroke="#d8d0c0" stroke-width="1"/>
<line x1="40" y1="330" x2="800" y2="330" stroke="#333" stroke-width="3"/>
<text x="46" y="352" font-size="14" fill="#333">地表</text>
<text x="660" y="352" font-size="14" fill="#333">大地（电阻率 ρ）</text>

<!-- 感应地电场 -->
<g stroke="#c0392b" stroke-width="2.5" fill="none">
  <line x1="150" y1="395" x2="430" y2="395" marker-end="url(#arrRed)"/>
  <line x1="150" y1="455" x2="430" y2="455" marker-end="url(#arrRed)"/>
</g>
<text x="470" y="420" font-size="15" fill="#c0392b">感应地电场 E（V/km）</text>

<!-- 输电铁塔 -->
<g stroke="#333" stroke-width="3" fill="none">
  <line x1="260" y1="330" x2="260" y2="220"/>
  <line x1="235" y1="228" x2="285" y2="228"/>
  <line x1="560" y1="330" x2="560" y2="220"/>
  <line x1="535" y1="228" x2="585" y2="228"/>
</g>
<circle cx="240" cy="226" r="3" fill="#333"/>
<circle cx="280" cy="226" r="3" fill="#333"/>
<circle cx="540" cy="226" r="3" fill="#333"/>
<circle cx="580" cy="226" r="3" fill="#333"/>
<text x="245" y="205" font-size="13" fill="#333">铁塔</text>
<text x="545" y="205" font-size="13" fill="#333">铁塔</text>

<!-- 输电线 -->
<g stroke="#333" stroke-width="1.5" fill="none">
  <path d="M235,228 Q400,252 540,228"/>
  <path d="M285,228 Q450,252 585,228"/>
  <path d="M260,245 Q410,272 560,245"/>
</g>
<text x="400" y="160" font-size="15" fill="#333">输电线路（长导体）</text>
<line x1="400" y1="167" x2="400" y2="245" stroke="#999" stroke-width="1"/>

<!-- 变电站变压器 -->
<rect x="640" y="245" width="70" height="55" fill="#f0ead8" stroke="#333" stroke-width="2"/>
<text x="657" y="276" font-size="14" fill="#333">变压器</text>
<line x1="648" y1="262" x2="585" y2="232" stroke="#333" stroke-width="1.5"/>

<!-- 中性点接地 -->
<line x1="675" y1="300" x2="675" y2="330" stroke="#333" stroke-width="2.5"/>
<line x1="650" y1="330" x2="700" y2="330" stroke="#333" stroke-width="2.5"/>
<circle cx="675" cy="330" r="5" fill="#333"/>
<text x="570" y="312" font-size="14" fill="#333">变压器中性点接地</text>

<!-- GIC 回路 -->
<g stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="7 4">
  <line x1="675" y1="334" x2="675" y2="302" marker-end="url(#arrRed)"/>
  <line x1="648" y1="262" x2="588" y2="233" marker-end="url(#arrRed)"/>
  <line x1="560" y1="240" x2="560" y2="326" marker-end="url(#arrRed)"/>
  <line x1="564" y1="338" x2="671" y2="338" marker-end="url(#arrRed)"/>
</g>
<text x="710" y="235" font-size="16" fill="#c0392b">GIC（准直流）</text>
<text x="410" y="385" font-size="14" fill="#c0392b">大地回流</text>
</svg>
