<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">正常成年人睡眠结构图（睡眠曲线）</title>
<desc id="desc">整夜 8 小时睡眠中 W、REM、N1、N2、N3 五个状态的交替序列：深睡 N3 集中在前半夜，REM 集中在后半夜，共约 4-5 个睡眠周期。</desc>
<rect x="0" y="0" width="800" height="420" fill="#faf9f5"/>
<!-- stage bands -->
<rect x="60" y="55" width="700" height="55" fill="#f3efe7"/>
<rect x="60" y="165" width="700" height="55" fill="#f3efe7"/>
<rect x="60" y="275" width="700" height="55" fill="#f3efe7"/>
<!-- y-axis labels -->
<text x="40" y="88" font-family="sans-serif" font-size="16" text-anchor="end" fill="#333">清醒 W</text>
<text x="40" y="148" font-family="sans-serif" font-size="16" text-anchor="end" fill="#c0392b">REM</text>
<text x="40" y="208" font-family="sans-serif" font-size="16" text-anchor="end" fill="#333">N1</text>
<text x="40" y="268" font-family="sans-serif" font-size="16" text-anchor="end" fill="#333">N2</text>
<text x="40" y="328" font-family="sans-serif" font-size="16" text-anchor="end" fill="#1f6f8b">N3</text>
<!-- stage level y-coordinates -->
<!-- W=80, REM=140, N1=200, N2=260, N3=320 -->
<!-- hypnogram step line: hour -> stage(0=W,1=REM,2=N1,3=N2,4=N3) -->
<polyline fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linejoin="round"
 points="
 60,80
 82,80
 82,200
 96,200
 96,260
 120,260
 120,320
 190,320
 190,260
 208,260
 208,140
 224,140
 224,260
 268,260
 268,320
 310,320
 310,260
 334,260
 334,140
 356,140
 356,260
 392,260
 392,320
 410,320
 410,260
 430,260
 430,140
 490,140
 490,260
 512,260
 512,140
 590,140
 590,260
 620,260
 620,140
 690,140
 690,260
 706,260
 706,80
 730,80
 "/>
<!-- x-axis -->
<line x1="60" y1="360" x2="760" y2="360" stroke="#333" stroke-width="1.5"/>
<text x="60" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">23:00</text>
<text x="200" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">01:00</text>
<text x="340" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">03:00</text>
<text x="480" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">05:00</text>
<text x="620" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">07:00</text>
<text x="760" y="388" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">晨醒</text>
<!-- annotations -->
<text x="120" y="352" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">深睡集中在前半夜</text>
<line x1="120" y1="336" x2="120" y2="326" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="470" y="60" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">后半夜 REM 期逐渐拉长</text>
<line x1="470" y1="80" x2="470" y2="136" stroke="#c0392b" stroke-width="1.5"/>
<!-- cycle brackets -->
<text x="150" y="408" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">周期1</text>
<text x="300" y="408" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">周期2</text>
<text x="460" y="408" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">周期3</text>
<text x="610" y="408" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">周期4</text>
<line x1="60" y1="366" x2="760" y2="366" stroke="#d8d2c6" stroke-width="1"/>
</svg>
