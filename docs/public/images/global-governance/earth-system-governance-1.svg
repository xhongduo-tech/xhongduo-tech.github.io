<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif">
  <title>九条行星边界的治理状态</title>
  <desc>行星边界框架中九条边界，按 2015 年 Steffen 等人的评估标注为安全、接近、越界或未定量四种状态。</desc>
  <rect width="640" height="560" fill="#faf9f5"/>
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#333">行星边界：九条边界的治理状态</text>
  <text x="30" y="66" font-size="13" fill="#555">基于 Steffen 等 (Science, 2015) 的评估，四种状态：</text>
  <circle cx="34" cy="86" r="6" fill="#c0392b"/>
  <text x="48" y="91" font-size="13" fill="#333">已越界</text>
  <circle cx="128" cy="86" r="6" fill="#e6a23c"/>
  <text x="142" y="91" font-size="13" fill="#333">接近 / 不确定区</text>
  <circle cx="256" cy="86" r="6" fill="#3a7d44"/>
  <text x="270" y="91" font-size="13" fill="#333">安全</text>
  <circle cx="326" cy="86" r="6" fill="#8a8a8a"/>
  <text x="340" y="91" font-size="13" fill="#333">未定量</text>

  <g font-size="15">
    <circle cx="34" cy="132" r="6" fill="#c0392b"/>
    <text x="52" y="137" fill="#333">气候变化</text>
    <rect x="420" y="120" width="170" height="26" rx="5" fill="#c0392b"/>
    <text x="505" y="137" fill="#fff" text-anchor="middle" font-size="13">已越界</text>

    <circle cx="34" cy="176" r="6" fill="#c0392b"/>
    <text x="52" y="181" fill="#333">生物圈完整性（生物多样性）</text>
    <rect x="420" y="164" width="170" height="26" rx="5" fill="#c0392b"/>
    <text x="505" y="181" fill="#fff" text-anchor="middle" font-size="13">已越界</text>

    <circle cx="34" cy="220" r="6" fill="#c0392b"/>
    <text x="52" y="225" fill="#333">生物地球化学流（氮 · 磷）</text>
    <rect x="420" y="208" width="170" height="26" rx="5" fill="#c0392b"/>
    <text x="505" y="225" fill="#fff" text-anchor="middle" font-size="13">已越界</text>

    <circle cx="34" cy="264" r="6" fill="#c0392b"/>
    <text x="52" y="269" fill="#333">土地利用变化</text>
    <rect x="420" y="252" width="170" height="26" rx="5" fill="#c0392b"/>
    <text x="505" y="269" fill="#fff" text-anchor="middle" font-size="13">已越界</text>

    <circle cx="34" cy="308" r="6" fill="#e6a23c"/>
    <text x="52" y="313" fill="#333">海洋酸化</text>
    <rect x="420" y="296" width="170" height="26" rx="5" fill="#e6a23c"/>
    <text x="505" y="313" fill="#333" text-anchor="middle" font-size="13">接近 / 不确定</text>

    <circle cx="34" cy="352" r="6" fill="#e6a23c"/>
    <text x="52" y="357" fill="#333">淡水利用</text>
    <rect x="420" y="340" width="170" height="26" rx="5" fill="#e6a23c"/>
    <text x="505" y="357" fill="#333" text-anchor="middle" font-size="13">区域越界</text>

    <circle cx="34" cy="396" r="6" fill="#3a7d44"/>
    <text x="52" y="401" fill="#333">平流层臭氧</text>
    <rect x="420" y="384" width="170" height="26" rx="5" fill="#3a7d44"/>
    <text x="505" y="401" fill="#fff" text-anchor="middle" font-size="13">安全</text>

    <circle cx="34" cy="440" r="6" fill="#8a8a8a"/>
    <text x="52" y="445" fill="#333">大气气溶胶</text>
    <rect x="420" y="428" width="170" height="26" rx="5" fill="#8a8a8a"/>
    <text x="505" y="445" fill="#fff" text-anchor="middle" font-size="13">未定量</text>

    <circle cx="34" cy="484" r="6" fill="#8a8a8a"/>
    <text x="52" y="489" fill="#333">新型实体（化学污染）</text>
    <rect x="420" y="472" width="170" height="26" rx="5" fill="#8a8a8a"/>
    <text x="505" y="489" fill="#fff" text-anchor="middle" font-size="13">未定量</text>
  </g>

  <text x="30" y="534" font-size="13" fill="#555">2015 年评估：4 条边界已越界；若把氮与磷分别计数，则是 5 个维度越界。</text>
</svg>
