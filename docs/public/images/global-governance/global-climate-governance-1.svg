<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif">
  <title>剩余碳预算：1.5°C 与 2°C 目标的排放空间</title>
  <desc>按 IPCC 第六次评估的约数，展示 1.5°C 与 2°C 目标下的剩余碳预算，并标出 2020 年以来已消耗的部分。</desc>
  <rect width="640" height="340" fill="#faf9f5"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">剩余碳预算（示意）</text>
  <text x="30" y="64" font-size="13" fill="#555">全球累计排放空间：目标温度越低，剩余预算越小（IPCC 第六次评估约数）</text>

  <rect x="30" y="80" width="16" height="16" fill="#8a8a8a"/>
  <text x="54" y="93" font-size="13" fill="#333">2020 年以来已消耗（约 160 GtCO2）</text>
  <rect x="290" y="80" width="16" height="16" fill="#3a7d44"/>
  <text x="314" y="93" font-size="13" fill="#333">剩余预算</text>
  <rect x="430" y="80" width="16" height="16" fill="#c0392b"/>
  <text x="454" y="93" font-size="13" fill="#333">预算耗尽</text>

  <text x="60" y="150" font-size="14" fill="#333">1.5°C 目标</text>
  <text x="60" y="168" font-size="13" fill="#555">总预算约 400 GtCO2</text>
  <rect x="60" y="118" width="72" height="28" fill="#8a8a8a"/>
  <rect x="132" y="118" width="109" height="28" fill="#3a7d44"/>
  <line x1="241" y1="112" x2="241" y2="152" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="182" font-size="13" fill="#333">已耗约 160 ｜ 剩余约 240（当前排放下约 6 年耗尽）</text>

  <text x="60" y="230" font-size="14" fill="#333">2°C 目标</text>
  <text x="60" y="248" font-size="13" fill="#555">总预算约 1150 GtCO2</text>
  <rect x="60" y="198" width="72" height="28" fill="#8a8a8a"/>
  <rect x="132" y="198" width="448" height="28" fill="#3a7d44"/>
  <text x="60" y="262" font-size="13" fill="#333">剩余约 990（当前排放下约 25 年耗尽）</text>

  <text x="30" y="298" font-size="13" fill="#555">当前全球年排放约 40 GtCO2。预算按比例示意，具体数值随新评估调整。</text>
</svg>
