<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>卡尔曼滤波的预测—更新循环</title>
<desc>卡尔曼滤波每期先执行预测步骤，用状态方程把上一期的状态估计外推到当前期，再执行更新步骤，用当期观测修正估计。</desc>
<rect width="700" height="330" fill="#faf9f5"/>

<!-- Predict box -->
<rect x="50" y="70" width="270" height="150" rx="14" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="185" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f8b">① 预测（Predict）</text>
<text x="185" y="128" text-anchor="middle" font-size="14" fill="#333">状态方程：α_t = T·α_{t−1} + η_t</text>
<text x="185" y="156" text-anchor="middle" font-size="13" fill="#333">用上一期信息外推状态</text>
<text x="185" y="180" text-anchor="middle" font-size="13" fill="#333">α(t|t−1) = T·α(t−1|t−1)</text>
<text x="185" y="204" text-anchor="middle" font-size="13" fill="#333">P(t|t−1) = T·P·T′ + R</text>

<!-- Update box -->
<rect x="380" y="120" width="270" height="150" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="515" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">② 更新（Update）</text>
<text x="515" y="178" text-anchor="middle" font-size="14" fill="#333">观测方程：y_t = Z·α_t + ε_t</text>
<text x="515" y="206" text-anchor="middle" font-size="13" fill="#333">K = P·Z′·(Z·P·Z′ + H)⁻¹</text>
<text x="515" y="230" text-anchor="middle" font-size="13" fill="#333">α(t|t) = α(t|t−1) + K·(y_t − Z·α(t|t−1))</text>
<text x="515" y="254" text-anchor="middle" font-size="13" fill="#333">用当期观测 y_t 修正估计</text>

<!-- top arrow: predict -> update -->
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>
<line x1="320" y1="110" x2="380" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="108" text-anchor="middle" font-size="13" fill="#333">新观测 y_t 到达</text>

<!-- bottom arrow: update -> predict -->
<line x1="460" y1="270" x2="200" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360" y="278" text-anchor="middle" font-size="13" fill="#333">循环推进：t ← t+1</text>

<!-- footnote -->
<text x="350" y="312" text-anchor="middle" font-size="13" fill="#333">滤波 = 预测 + 更新，每期递推一次；状态估计从 α(t−1|t−1) 进化到 α(t|t)</text>
</svg>
