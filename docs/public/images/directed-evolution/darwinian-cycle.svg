<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="sans-serif">
  <title>定向进化的达尔文循环</title>
  <desc>一轮定向进化的三个环节：制造多样性（文库）、基因型-表型偶联与筛选、扩增放大，循环往复。</desc>
  <rect width="620" height="400" fill="#faf9f5"/>
  <rect x="60" y="50" width="190" height="84" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="155" y="84" text-anchor="middle" font-size="16" fill="#1f6f8b">① 制造多样性</text>
  <text x="155" y="110" text-anchor="middle" font-size="13" fill="#333">随机突变 / 重组 → 文库</text>
  <rect x="370" y="50" width="190" height="84" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="465" y="84" text-anchor="middle" font-size="16" fill="#1f6f8b">② 偶联 + 筛选</text>
  <text x="465" y="110" text-anchor="middle" font-size="13" fill="#333">蛋白与基因绑定，测性能</text>
  <rect x="215" y="270" width="190" height="84" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="310" y="304" text-anchor="middle" font-size="16" fill="#c0392b">③ 扩增胜者</text>
  <text x="310" y="330" text-anchor="middle" font-size="13" fill="#333">复制最优变体，回起点</text>
  <path d="M 250 88 L 360 88" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 470 140 L 385 264" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 230 264 L 120 144" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="60" text-anchor="middle" font-size="13" fill="#333">一轮 = 一个「达尔文循环」</text>
  <text x="310" y="230" text-anchor="middle" font-size="13" fill="#666">多轮迭代，性能逐轮爬升</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
