<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <title>x86 栈帧在缓冲区溢出前后的对比</title>
  <desc>左侧为正常栈帧布局，局部变量数组 buf 向上增长；右侧为溢出后的栈帧，溢出数据越界覆盖了保存的帧指针与返回地址，ret 将跳到攻击者地址。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="320" y="30" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">栈向低地址生长：溢出覆盖返回地址</text>

  <!-- 左侧：正常栈帧 -->
  <text x="160" y="58" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">正常栈帧</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="60" y="70" width="200" height="38" fill="#fff"/>
    <rect x="60" y="108" width="200" height="38" fill="#fff"/>
    <rect x="60" y="146" width="200" height="38" fill="#fff"/>
    <rect x="60" y="184" width="200" height="38" fill="#fff"/>
    <rect x="60" y="222" width="200" height="38" fill="#fff"/>
    <rect x="60" y="260" width="200" height="38" fill="#fff"/>
    <rect x="60" y="298" width="200" height="38" fill="#fff"/>
  </g>
  <text x="160" y="93" font-size="13" fill="#333" text-anchor="middle">高地址 ……</text>
  <text x="160" y="131" font-size="13" fill="#333" text-anchor="middle">局部变量 buf[0…N]</text>
  <text x="160" y="169" font-size="13" fill="#c0392b" text-anchor="middle">保存的帧指针 (EBP)</text>
  <text x="160" y="207" font-size="13" fill="#c0392b" text-anchor="middle">返回地址 (ret)</text>
  <text x="160" y="245" font-size="13" fill="#333" text-anchor="middle">调用者参数</text>
  <text x="160" y="283" font-size="13" fill="#333" text-anchor="middle">调用者栈帧</text>
  <text x="160" y="321" font-size="13" fill="#333" text-anchor="middle">低地址 …</text>

  <!-- 生长箭头（左） -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f6f8b"/>
    </marker>
  </defs>
  <line x1="30" y1="80" x2="30" y2="340" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="22" y="212" font-size="12" fill="#1f6f8b" text-anchor="middle">栈</text>

  <!-- 右侧：溢出后 -->
  <text x="480" y="58" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">溢出后</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="380" y="70" width="200" height="38" fill="#fff"/>
    <rect x="380" y="108" width="200" height="38" fill="#ffe2dd"/>
    <rect x="380" y="146" width="200" height="38" fill="#ffe2dd"/>
    <rect x="380" y="184" width="200" height="38" fill="#c0392b"/>
    <rect x="380" y="222" width="200" height="38" fill="#c0392b"/>
    <rect x="380" y="260" width="200" height="38" fill="#fff"/>
    <rect x="380" y="298" width="200" height="38" fill="#fff"/>
  </g>
  <text x="480" y="93" font-size="13" fill="#333" text-anchor="middle">高地址</text>
  <text x="480" y="131" font-size="13" fill="#333" text-anchor="middle">buf 被超长数据填满</text>
  <text x="480" y="169" font-size="13" fill="#333" text-anchor="middle">数据继续上溢</text>
  <text x="480" y="207" font-size="13" fill="#fff" text-anchor="middle">EBP 被覆盖为 0x41414141</text>
  <text x="480" y="245" font-size="13" fill="#fff" text-anchor="middle">ret = 攻击者地址 (shellcode)</text>
  <text x="480" y="283" font-size="13" fill="#333" text-anchor="middle">参数区（无害）</text>
  <text x="480" y="321" font-size="13" fill="#333" text-anchor="middle">低地址</text>

  <!-- 箭头说明 -->
  <line x1="310" y1="200" x2="368" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="339" y="188" font-size="12" fill="#c0392b" text-anchor="middle">strcpy 越界</text>

  <text x="320" y="370" font-size="13" fill="#333" text-anchor="middle">缓冲区向高地址写（x86 上），而返回地址恰好在更高地址——</text>
  <text x="320" y="392" font-size="13" fill="#333" text-anchor="middle">「多写几个字节」就能让 ret 指向攻击者的 shellcode。</text>
  <text x="320" y="416" font-size="12" fill="#1f6f8b" text-anchor="middle">备注：图中局部变量与 ret 之间的帧指针、对齐等细节已简化</text>
</svg>
