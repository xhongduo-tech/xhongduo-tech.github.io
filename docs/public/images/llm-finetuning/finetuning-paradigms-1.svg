<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">从预训练到对齐的三阶段微调流水线</title>
  <desc id="desc">从左到右三个方框，用箭头串联。第一个方框「① 预训练」：海量无标注语料，自监督的下一个词预测，目标为语言与世界知识，产物是基座模型。第二个方框「② 指令微调 SFT」：指令-回答配对数据，交叉熵仅计算回答部分，目标为对齐用户意图，产物是助手模型。第三个方框「③ 对齐 RLHF/DPO」：人类偏好比较数据，偏好/奖励目标，目标为价值对齐，产物是对齐助手模型。底部文字说明能力跃迁：从只会续写的基座模型，到会对话、会拒绝、守价值的助手模型。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 顶部标题 -->
  <text x="410" y="36" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">微调三阶段流水线</text>
  <text x="410" y="60" font-size="14" fill="#666" text-anchor="middle">每一阶段都改变权重，但数据、目标函数与产物各不相同</text>

  <!-- ① 预训练 -->
  <g>
    <rect x="30" y="90" width="210" height="160" rx="10" fill="#e7eeec" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="135" y="118" font-size="18" fill="#1f6f8b" text-anchor="middle" font-weight="bold">① 预训练</text>
    <text x="135" y="150" font-size="14" fill="#333" text-anchor="middle">海量无标注语料</text>
    <text x="135" y="172" font-size="14" fill="#333" text-anchor="middle">自监督 · 下一个词预测</text>
    <text x="135" y="194" font-size="14" fill="#333" text-anchor="middle">目标：语言与世界知识</text>
    <text x="135" y="228" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">产物：基座模型</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="240" y1="170" x2="300" y2="170" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="158" font-size="13" fill="#333" text-anchor="middle">继续</text>

  <!-- ② 指令微调 SFT -->
  <g>
    <rect x="300" y="90" width="210" height="160" rx="10" fill="#f6e8e4" stroke="#c0392b" stroke-width="2.5"/>
    <text x="405" y="118" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">② 指令微调 SFT</text>
    <text x="405" y="150" font-size="14" fill="#333" text-anchor="middle">指令-回答配对数据</text>
    <text x="405" y="172" font-size="14" fill="#333" text-anchor="middle">交叉熵（仅回答部分）</text>
    <text x="405" y="194" font-size="14" fill="#333" text-anchor="middle">目标：对齐用户意图</text>
    <text x="405" y="228" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">产物：助手模型</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="510" y1="170" x2="570" y2="170" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="158" font-size="13" fill="#333" text-anchor="middle">继续</text>

  <!-- ③ 对齐 RLHF / DPO -->
  <g>
    <rect x="570" y="90" width="210" height="160" rx="10" fill="#f0ece4" stroke="#333" stroke-width="2.5"/>
    <text x="675" y="118" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">③ 对齐 RLHF / DPO</text>
    <text x="675" y="150" font-size="14" fill="#333" text-anchor="middle">人类偏好比较数据</text>
    <text x="675" y="172" font-size="14" fill="#333" text-anchor="middle">偏好 / 奖励目标</text>
    <text x="675" y="194" font-size="14" fill="#333" text-anchor="middle">目标：价值对齐</text>
    <text x="675" y="228" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">产物：对齐助手模型</text>
  </g>

  <!-- 底部能力跃迁说明 -->
  <text x="410" y="300" font-size="15" fill="#333" text-anchor="middle">能力跃迁：只会续写的基座模型 → 会对话、会拒绝、守价值的助手模型</text>
</svg>
