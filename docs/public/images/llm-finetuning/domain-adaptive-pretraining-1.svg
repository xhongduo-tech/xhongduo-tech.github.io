<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">领域自适应预训练中的能力权衡</title>
  <desc id="desc">折线图。横轴为训练步数或领域语料占比，纵轴为能力分数。红色领域能力曲线随训练推进上升，青色通用能力曲线随训练推进下降。两条曲线之间有一片浅色竖带，标出可接受甜区，建议在甜区内挑选 checkpoint。</desc>

  <!-- 标题 -->
  <text x="410" y="34" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">领域自适应预训练：领域能力与通用能力的权衡</text>

  <!-- 坐标轴 -->
  <line x1="120" y1="340" x2="740" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="340" x2="120" y2="70" stroke="#333" stroke-width="2"/>
  <text x="430" y="370" font-size="14" fill="#333" text-anchor="middle">训练步数 / 领域语料占比 →</text>
  <text x="104" y="200" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 104 200)">能力分数 →</text>

  <!-- 甜区竖带 -->
  <rect x="500" y="80" width="130" height="260" fill="#f0ece4" opacity="0.6"/>
  <line x1="500" y1="80" x2="500" y2="340" stroke="#333" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="630" y1="80" x2="630" y2="340" stroke="#333" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="565" y="74" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">可接受甜区</text>

  <!-- 领域能力曲线（上升） -->
  <path d="M 120 150 C 300 180, 500 240, 740 310" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="630" y="336" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">领域能力 ↗</text>

  <!-- 通用能力曲线（下降） -->
  <path d="M 120 310 C 300 290, 500 225, 740 150" fill="none" stroke="#1f6f8b" stroke-width="3.5"/>
  <text x="230" y="302" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">通用能力 ↘</text>

  <!-- 甜区内的推荐 checkpoint -->
  <circle cx="565" cy="252" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/>
  <text x="712" y="252" font-size="14" fill="#333" text-anchor="middle">在此区间选 checkpoint</text>
</svg>
