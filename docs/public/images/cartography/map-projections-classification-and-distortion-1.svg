<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>变形椭圆：球面上的小圆经投影后变成椭圆</title>
<desc>左侧为地球与经纬网，其上一个红色小圆；右侧为投影后小圆被拉伸成椭圆，长轴方向对应最大长度比，短轴方向对应最小长度比。</desc>
<rect x="0" y="0" width="640" height="320" fill="#faf9f5"/>
<!-- 左侧：地球 -->
<circle cx="170" cy="160" r="105" fill="#eef2f5" stroke="#1f6f8b" stroke-width="2"/>
<ellipse cx="170" cy="160" rx="105" ry="34" fill="none" stroke="#1f6f8b" stroke-width="1" opacity="0.5"/>
<line x1="65" y1="160" x2="275" y2="160" stroke="#1f6f8b" stroke-width="1" opacity="0.5"/>
<line x1="170" y1="55" x2="170" y2="265" stroke="#1f6f8b" stroke-width="1" opacity="0.5"/>
<!-- 球面上的小圆 -->
<circle cx="222" cy="120" r="17" fill="#c0392b" fill-opacity="0.35" stroke="#c0392b" stroke-width="2"/>
<text x="222" y="96" text-anchor="middle" font-size="14" fill="#333">球面上的小圆</text>
<!-- 箭头 -->
<polygon points="315,160 330,152 330,168" fill="#333"/>
<line x1="300" y1="160" x2="330" y2="160" stroke="#333" stroke-width="2"/>
<text x="315" y="142" text-anchor="middle" font-size="14" fill="#333">投影</text>
<!-- 右侧：变形椭圆 -->
<ellipse cx="480" cy="160" rx="52" ry="20" fill="#c0392b" fill-opacity="0.22" stroke="#c0392b" stroke-width="2"/>
<line x1="428" y1="160" x2="532" y2="160" stroke="#c0392b" stroke-width="1.5"/>
<line x1="480" y1="140" x2="480" y2="180" stroke="#c0392b" stroke-width="1.5"/>
<text x="532" y="168" font-size="13" fill="#333">长轴方向 = 最大长度比</text>
<text x="480" y="128" text-anchor="middle" font-size="13" fill="#333">短轴方向 = 最小长度比</text>
<text x="480" y="212" text-anchor="middle" font-size="14" fill="#333">投影后的椭圆</text>
<text x="480" y="252" text-anchor="middle" font-size="13" fill="#555">长短轴之比反映角度变形，大小反映长度变形</text>
</svg>
