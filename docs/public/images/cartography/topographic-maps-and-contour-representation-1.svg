<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>等高线原理：水平面切割山体形成等高线</title>
<desc>左侧为山体剖面，三条水平面分别在 110、120、130 米高度切割山体；右侧为从正上方俯视得到的闭合等高线，由外向内为 110、120、130 米，相邻线高差即为等高距。</desc>
<rect x="0" y="0" width="640" height="320" fill="#faf9f5"/>
<text x="150" y="30" text-anchor="middle" font-size="15" fill="#333">立体剖面</text>
<text x="480" y="30" text-anchor="middle" font-size="15" fill="#333">俯视投影（等高线图）</text>
<!-- 山体剖面 -->
<path d="M 40 260 Q 100 92 190 92 Q 280 92 300 260 Z" fill="#e2d8c8" stroke="#8a7a5f" stroke-width="2"/>
<line x1="40" y1="260" x2="300" y2="260" stroke="#8a7a5f" stroke-width="2"/>
<!-- 水平切割面 -->
<line x1="30" y1="200" x2="330" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="30" y1="150" x2="330" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="30" y1="112" x2="330" y2="112" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="20" y="205" font-size="13" fill="#c0392b">110 m</text>
<text x="20" y="155" font-size="13" fill="#c0392b">120 m</text>
<text x="20" y="117" font-size="13" fill="#c0392b">130 m</text>
<text x="150" y="300" text-anchor="middle" font-size="13" fill="#555">山体剖面与水平切割面</text>
<!-- 等高线图 -->
<path d="M 400 200 Q 440 145 480 145 Q 560 145 560 200 Q 560 255 480 255 Q 440 255 400 200 Z" fill="none" stroke="#8a5a2b" stroke-width="2"/>
<path d="M 435 200 Q 460 168 480 168 Q 525 168 525 200 Q 525 232 480 232 Q 460 232 435 200 Z" fill="none" stroke="#8a5a2b" stroke-width="2"/>
<path d="M 460 200 Q 473 185 480 185 Q 500 185 500 200 Q 500 215 480 215 Q 473 215 460 200 Z" fill="none" stroke="#8a5a2b" stroke-width="2"/>
<text x="385" y="205" font-size="13" fill="#8a5a2b">110</text>
<text x="422" y="205" font-size="13" fill="#8a5a2b">120</text>
<text x="447" y="205" font-size="13" fill="#8a5a2b">130</text>
<text x="480" y="242" text-anchor="middle" font-size="13" fill="#8a5a2b">140（峰顶）</text>
<text x="480" y="300" text-anchor="middle" font-size="13" fill="#555">相邻等高线高差 = 等高距（10 m）</text>
</svg>
