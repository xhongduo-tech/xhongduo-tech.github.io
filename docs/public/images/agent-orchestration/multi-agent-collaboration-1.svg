<svg viewBox="0 0 720 430" width="720" height="430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>消息池驱动的多智能体协作</title>
<desc>产品经理、架构师、工程师、测试四个角色智能体围绕一个消息池发布与订阅消息，松耦合地协作。</desc>
<rect width="720" height="430" fill="#faf9f5"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">消息池驱动的多智能体协作</text>

<rect x="270" y="160" width="180" height="120" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="360" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b">消息池</text>
<text x="360" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">message pool</text>
<text x="360" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">发布（publish）</text>
<text x="360" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">订阅（subscribe）</text>

<rect x="50" y="46" width="200" height="62" rx="8" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="150" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">产品经理（需求）</text>
<text x="150" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">产出：需求文档</text>

<rect x="470" y="46" width="200" height="62" rx="8" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="570" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">架构师（设计）</text>
<text x="570" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">产出：设计文档</text>

<rect x="50" y="322" width="200" height="62" rx="8" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="150" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">工程师（编码）</text>
<text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">产出：代码</text>

<rect x="470" y="322" width="200" height="62" rx="8" fill="#eef4f7" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="570" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">测试员（质检）</text>
<text x="570" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">产出：测试报告</text>

<line x1="150" y1="108" x2="300" y2="160" stroke="#1f6f8b" stroke-width="1.8"/>
<line x1="300" y1="160" x2="150" y2="108" stroke="#1f6f8b" stroke-width="0"/>
<path d="M 150 108 L 150 322" stroke="none"/>
<line x1="420" y1="160" x2="570" y2="108" stroke="#1f6f8b" stroke-width="1.8"/>
<line x1="150" y1="322" x2="300" y2="280" stroke="#1f6f8b" stroke-width="1.8"/>
<line x1="570" y1="322" x2="420" y2="280" stroke="#1f6f8b" stroke-width="1.8"/>
<path d="M 570 108 L 570 322" stroke="#1f6f8b" stroke-width="1.8"/>
<path d="M 150 108 H 150" stroke="none"/>

<path d="M 150 108 H 270 V 160" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>
<path d="M 270 160 V 108 H 150" stroke="#1f6f8b" stroke-width="0"/>
<path d="M 570 108 H 450 V 160" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>
<path d="M 150 322 H 270 V 280" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>
<path d="M 570 322 H 450 V 280" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>
<path d="M 360 160 V 100" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>
<path d="M 360 280 V 342" stroke="#1f6f8b" stroke-width="1.8" fill="none" marker-end="url(#arrowb)"/>

<text x="210" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f6f8b">需求</text>
<text x="510" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f6f8b">设计</text>
<text x="360" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f6f8b">归档</text>
<text x="360" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f6f8b">反馈</text>

<defs>
<marker id="arrowb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1f6f8b"/></marker>
</defs>
</svg>
