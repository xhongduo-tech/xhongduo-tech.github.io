<svg viewBox="0 0 720 420" width="720" height="420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LLM 智能体的感知—行动循环</title>
<desc>智能体由画像、记忆、规划、行动四个模块组成，通过动作作用于环境，并从环境获得观测反馈，构成闭环。</desc>
<rect width="720" height="420" fill="#faf9f5"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">LLM 智能体的感知—行动循环</text>

<rect x="28" y="58" width="300" height="330" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="178" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">智能体（LLM 大脑）</text>

<rect x="48" y="100" width="260" height="54" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="178" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">画像（角色、目标）</text>
<text x="178" y="143" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">你是一名 Python 工程师…</text>

<rect x="48" y="166" width="260" height="54" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="178" y="188" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">记忆（工作 + 长期）</text>
<text x="178" y="209" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">历史轨迹 / 向量库</text>

<rect x="48" y="232" width="260" height="54" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="178" y="254" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">规划（分解、反思）</text>
<text x="178" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">把大目标拆成小步骤</text>

<rect x="48" y="298" width="260" height="54" rx="6" fill="#fbeceb" stroke="#c0392b"/>
<text x="178" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">行动（调用工具 / API）</text>
<text x="178" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">搜索、执行代码、写文件</text>

<line x1="178" y1="154" x2="178" y2="166" stroke="#999" stroke-width="1.5"/>
<line x1="178" y1="220" x2="178" y2="232" stroke="#999" stroke-width="1.5"/>
<line x1="178" y1="286" x2="178" y2="298" stroke="#999" stroke-width="1.5"/>

<rect x="440" y="150" width="240" height="150" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="560" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">环境</text>
<text x="560" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">搜索引擎 / 网页</text>
<text x="560" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">代码解释器 / 文件系统</text>
<text x="560" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">游戏 / 模拟器 / 机器人</text>
<text x="560" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">（返回观测结果）</text>

<path d="M 308 325 H 436" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
<text x="372" y="313" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">动作 / 工具调用</text>

<path d="M 560 300 V 396 H 178 V 220" stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
<text x="369" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">观测反馈（Observation）写入记忆，构成闭环</text>

<defs>
<marker id="arrowred" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
<marker id="arrowblue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1f6f8b"/></marker>
</defs>
</svg>
