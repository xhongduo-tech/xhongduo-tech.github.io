<svg viewBox="0 0 720 390" width="720" height="390" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AutoGPT 单智能体循环 与 MetaGPT 多智能体流水线对比</title>
<desc>左侧 AutoGPT 由目标驱动的单智能体循环，右侧 MetaGPT 按 SOP 分工的产品经理、架构师、工程师、测试员流水线。</desc>
<rect width="720" height="390" fill="#faf9f5"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">两种智能体框架的组织方式</text>

<text x="180" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">AutoGPT：单智能体循环</text>
<rect x="30" y="84" width="300" height="272" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>

<rect x="55" y="104" width="250" height="40" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="180" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">目标设定 g</text>
<rect x="55" y="160" width="250" height="40" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="180" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">任务分解 T_t</text>
<rect x="55" y="216" width="250" height="40" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="180" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">工具执行 a_t</text>
<rect x="55" y="272" width="250" height="40" rx="6" fill="#fbeceb" stroke="#c0392b"/>
<text x="180" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">自我评价：完成？</text>

<line x1="180" y1="144" x2="180" y2="160" stroke="#999" stroke-width="1.5"/>
<line x1="180" y1="200" x2="180" y2="216" stroke="#999" stroke-width="1.5"/>
<line x1="180" y1="256" x2="180" y2="272" stroke="#999" stroke-width="1.5"/>
<path d="M 305 292 H 330 V 180 H 305" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowc)"/>
<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">循环，直到判定完成</text>

<text x="540" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">MetaGPT：SOP 流水线</text>
<rect x="390" y="84" width="300" height="272" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>

<rect x="406" y="150" width="62" height="70" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="437" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">产品</text>
<text x="437" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">经理</text>
<text x="437" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">PRD</text>

<rect x="484" y="150" width="62" height="70" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="515" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">架构师</text>
<text x="515" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">设计</text>

<rect x="562" y="150" width="62" height="70" rx="6" fill="#eef4f7" stroke="#1f6f8b"/>
<text x="593" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">工程师</text>
<text x="593" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">代码</text>

<rect x="640" y="150" width="36" height="70" rx="6" fill="#fbeceb" stroke="#c0392b"/>
<text x="658" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">测试</text>
<text x="658" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">用例</text>

<line x1="468" y1="185" x2="484" y2="185" stroke="#c0392b" stroke-width="2"/>
<line x1="546" y1="185" x2="562" y2="185" stroke="#c0392b" stroke-width="2"/>
<line x1="624" y1="185" x2="640" y2="185" stroke="#c0392b" stroke-width="2"/>
<text x="540" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">文档逐级传递：产品 → 设计 → 代码 → 测试</text>
<text x="540" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">每个角色是独立智能体，只做自己那一环</text>

<defs>
<marker id="arrowc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
</defs>
</svg>
