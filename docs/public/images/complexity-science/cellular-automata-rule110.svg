<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 175" width="560" height="175" font-family="sans-serif">
  <title>一维元胞自动机规则 110 的真值表</title>
  <desc>规则 110 的全部 8 种三格邻域图案与对应的下一时刻输出位，规则号 110 即这些输出位组成的二进制数 01101110。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
