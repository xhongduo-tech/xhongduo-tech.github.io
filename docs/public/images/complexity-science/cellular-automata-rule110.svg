  </defs>
  <rect x="0" y="0" width="560" height="175" fill="#faf9f5"/>
  <text x="16" y="28" font-size="16" fill="#333" font-weight="bold">一维元胞自动机：规则 110 的真值表</text>
  <text x="16" y="48" font-size="13" fill="#555">每组显示「三个邻居 → 中心格点下一时刻取值」；8 个输出位连起来即规则号 01101110₂ = 110₁₀</text>

