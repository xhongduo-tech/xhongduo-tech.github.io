<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">边沁全景敞视监狱示意图</title>
  <desc id="desc">俯视图：外圈为环形牢房，分成八格，每个格内有一名背光待看的囚犯（人形标记）；中央为瞭望塔，塔身开百叶窗，内有一位监视者。牢房与塔之间有环形通道。顶部文字「囚犯始终可能被看见」与底部说明「监视者未必在场，可见性本身即规训」。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="360" y="36" text-anchor="middle" font-size="17" fill="#333">全景敞视监狱（Panopticon）——俯视图</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#c0392b">囚犯始终「可能被看见」，却看不见监视者</text>

  <!-- 外圈环形牢房 -->
  <circle cx="360" cy="255" r="185" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>

  <!-- 分割线 -->
  <g stroke="#999" stroke-width="1.4">
    <line x1="360" y1="70"  x2="360" y2="440"/>
    <line x1="175" y1="255" x2="545" y2="255"/>
    <line x1="229" y1="129" x2="491" y2="381"/>
    <line x1="491" y1="129" x2="229" y2="381"/>
  </g>

  <!-- 中央瞭望塔（百叶窗） -->
  <circle cx="360" cy="255" r="52" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <circle cx="360" cy="255" r="30" fill="none" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <!-- 百叶窗横条 -->
  <g stroke="#333" stroke-width="2">
    <line x1="322" y1="222" x2="398" y2="222"/>
    <line x1="318" y1="245" x2="402" y2="245"/>
    <line x1="322" y1="268" x2="398" y2="268"/>
    <line x1="330" y1="291" x2="390" y2="291"/>
  </g>
  <!-- 塔内监视者（简化人形） -->
  <circle cx="360" cy="236" r="9" fill="#c0392b"/>
  <path d="M 348 270 L 348 250 Q 360 243 372 250 L 372 270 Z" fill="#c0392b"/>

  <!-- 牢房内囚犯（8 个简化人形） -->
  <g fill="#333">
    <!-- 顶部 -->
    <circle cx="360" cy="118" r="8"/><path d="M 352 140 L 352 125 Q 360 119 368 125 L 368 140 Z"/>
    <!-- 底部 -->
    <circle cx="360" cy="392" r="8"/><path d="M 352 414 L 352 399 Q 360 393 368 399 L 368 414 Z"/>
    <!-- 左 -->
    <circle cx="210" cy="255" r="8"/><path d="M 202 277 L 202 262 Q 210 256 218 262 L 218 277 Z"/>
    <!-- 右 -->
    <circle cx="510" cy="255" r="8"/><path d="M 502 277 L 502 262 Q 510 256 518 262 L 518 277 Z"/>
    <!-- 左上 -->
    <circle cx="257" cy="172" r="8"/><path d="M 249 194 L 249 179 Q 257 173 265 179 L 265 194 Z"/>
    <!-- 右上 -->
    <circle cx="463" cy="172" r="8"/><path d="M 455 194 L 455 179 Q 463 173 471 179 L 471 194 Z"/>
    <!-- 左下 -->
    <circle cx="257" cy="338" r="8"/><path d="M 249 360 L 249 345 Q 257 339 265 345 L 265 360 Z"/>
    <!-- 右下 -->
    <circle cx="463" cy="338" r="8"/><path d="M 455 360 L 455 345 Q 463 339 471 345 L 471 360 Z"/>
  </g>

  <!-- 图例 -->
  <text x="30" y="70"  font-size="14" fill="#c0392b">● 塔内监视者（可不需在场）</text>
  <text x="30" y="92"  font-size="14" fill="#333">　 囚犯：背光、彼此隔绝</text>

  <!-- 底部说明 -->
  <g font-size="14" fill="#333">
    <text x="30" y="450">可见性本身即规训：囚犯无法确定塔中是否有人，于是替权力完成了自我监视。</text>
  </g>
</svg>
