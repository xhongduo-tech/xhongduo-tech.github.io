<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" font-family="sans-serif">
  <title>四冲程发动机工作循环示意图</title>
  <desc>进气、压缩、做功、排气四个行程中活塞与气门的位置变化：进气行程活塞下行且进气门开，压缩行程活塞上行且两气门关，做功行程活塞下行产生动力，排气行程活塞上行且排气门开。</desc>
  <rect width="820" height="270" fill="#faf9f5"/>

  <!-- Panel 1: 进气 -->
  <g>
    <text x="100" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">① 进气行程</text>
    <!-- cylinder -->
    <rect x="70" y="40" width="60" height="140" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="40" x2="130" y2="40" stroke="#333" stroke-width="2"/>
    <!-- intake valve open (left) -->
    <rect x="74" y="46" width="18" height="10" fill="#c0392b"/>
    <line x1="83" y1="56" x2="83" y2="72" stroke="#c0392b" stroke-width="3"/>
    <!-- exhaust valve closed (right) -->
    <rect x="108" y="46" width="18" height="10" fill="#333"/>
    <!-- piston at bottom -->
    <rect x="72" y="150" width="56" height="14" fill="#1f6f8b"/>
    <line x1="100" y1="164" x2="110" y2="230" stroke="#333" stroke-width="3"/>
    <!-- motion arrow down -->
    <line x1="150" y1="80" x2="150" y2="160" stroke="#1f6f8b" stroke-width="3"/>
    <polygon points="150,170 144,156 156,156" fill="#1f6f8b"/>
    <text x="162" y="125" font-size="14" fill="#1f6f8b">下行</text>
    <text x="100" y="250" text-anchor="middle" font-size="13" fill="#333">吸入混合气</text>
  </g>

  <!-- Panel 2: 压缩 -->
  <g>
    <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">② 压缩行程</text>
    <rect x="270" y="40" width="60" height="140" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="40" x2="330" y2="40" stroke="#333" stroke-width="2"/>
    <!-- both valves closed -->
    <rect x="274" y="46" width="18" height="10" fill="#333"/>
    <rect x="308" y="46" width="18" height="10" fill="#333"/>
    <!-- piston at top -->
    <rect x="272" y="72" width="56" height="14" fill="#1f6f8b"/>
    <line x1="300" y1="86" x2="310" y2="230" stroke="#333" stroke-width="3"/>
    <!-- motion arrow up -->
    <line x1="350" y1="160" x2="350" y2="80" stroke="#1f6f8b" stroke-width="3"/>
    <polygon points="350,70 344,84 356,84" fill="#1f6f8b"/>
    <text x="362" y="125" font-size="14" fill="#1f6f8b">上行</text>
    <!-- compression indicator -->
    <text x="300" y="130" text-anchor="middle" font-size="13" fill="#c0392b">压力↑温度↑</text>
    <text x="300" y="250" text-anchor="middle" font-size="13" fill="#333">两气门关闭</text>
  </g>

  <!-- Panel 3: 做功 -->
  <g>
    <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">③ 做功行程</text>
    <rect x="470" y="40" width="60" height="140" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="470" y1="40" x2="530" y2="40" stroke="#333" stroke-width="2"/>
    <!-- both valves closed -->
    <rect x="474" y="46" width="18" height="10" fill="#333"/>
    <rect x="508" y="46" width="18" height="10" fill="#333"/>
    <!-- flame -->
    <polygon points="500,78 492,92 498,90 500,98 502,90 508,92" fill="#c0392b"/>
    <!-- piston at top moving down -->
    <rect x="472" y="72" width="56" height="14" fill="#1f6f8b"/>
    <line x1="500" y1="86" x2="510" y2="230" stroke="#333" stroke-width="3"/>
    <!-- motion arrow down -->
    <line x1="550" y1="80" x2="550" y2="160" stroke="#1f6f8b" stroke-width="3"/>
    <polygon points="550,170 544,156 556,156" fill="#1f6f8b"/>
    <text x="562" y="125" font-size="14" fill="#1f6f8b">下行</text>
    <text x="500" y="110" text-anchor="middle" font-size="13" fill="#c0392b">点火膨胀</text>
    <text x="500" y="250" text-anchor="middle" font-size="13" fill="#333">对外做功</text>
  </g>

  <!-- Panel 4: 排气 -->
  <g>
    <text x="700" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">④ 排气行程</text>
    <rect x="670" y="40" width="60" height="140" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="670" y1="40" x2="730" y2="40" stroke="#333" stroke-width="2"/>
    <!-- intake closed -->
    <rect x="674" y="46" width="18" height="10" fill="#333"/>
    <!-- exhaust open -->
    <rect x="708" y="46" width="18" height="10" fill="#c0392b"/>
    <line x1="717" y1="56" x2="717" y2="72" stroke="#c0392b" stroke-width="3"/>
    <!-- piston moving up -->
    <rect x="672" y="110" width="56" height="14" fill="#1f6f8b"/>
    <line x1="700" y1="124" x2="710" y2="230" stroke="#333" stroke-width="3"/>
    <!-- motion arrow up -->
    <line x1="750" y1="160" x2="750" y2="80" stroke="#1f6f8b" stroke-width="3"/>
    <polygon points="750,70 744,84 756,84" fill="#1f6f8b"/>
    <text x="762" y="125" font-size="14" fill="#1f6f8b">上行</text>
    <!-- exhaust gas -->
    <text x="700" y="165" text-anchor="middle" font-size="13" fill="#c0392b">排出废气</text>
    <text x="700" y="250" text-anchor="middle" font-size="13" fill="#333">排气门开</text>
  </g>
</svg>
