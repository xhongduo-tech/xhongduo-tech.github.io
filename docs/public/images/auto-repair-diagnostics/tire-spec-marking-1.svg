<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>轮胎规格标记与断面尺寸示意</title>
  <desc>轮胎断面图：断面宽为胎侧最宽处的轴向宽度 205 毫米，胎侧高度等于断面宽乘扁平比 55%，轮辋直径为 16 英寸。规格 205/55 R16 的读法由此而来。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>

  <!-- tire cross-section outer contour -->
  <rect x="170" y="110" width="300" height="200" rx="26" fill="#e8e4da" stroke="#333" stroke-width="2"/>
  <!-- air cavity -->
  <rect x="235" y="150" width="170" height="120" rx="16" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <!-- rim -->
  <rect x="286" y="228" width="68" height="34" fill="#1f6f8b" stroke="#333" stroke-width="2"/>
  <text x="320" y="249" text-anchor="middle" font-size="14" fill="#fff">轮辋</text>

  <!-- section width dimension (top) -->
  <line x1="170" y1="86" x2="470" y2="86" stroke="#c0392b" stroke-width="2"/>
  <polygon points="170,80 182,86 170,92" fill="#c0392b"/>
  <polygon points="470,80 458,86 470,92" fill="#c0392b"/>
  <text x="320" y="76" text-anchor="middle" font-size="15" fill="#c0392b">断面宽 B = 205 mm</text>

  <!-- sidewall height dimension (left) -->
  <line x1="150" y1="122" x2="150" y2="298" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="144,122 158,122 152,110" fill="#1f6f8b"/>
  <polygon points="144,298 158,298 152,310" fill="#1f6f8b"/>
  <text x="138" y="215" text-anchor="middle" font-size="14" fill="#1f6f8b">胎侧高度 H = B × 55%</text>

  <!-- rim diameter dimension (right) -->
  <line x1="496" y1="228" x2="496" y2="262" stroke="#c0392b" stroke-width="2"/>
  <polygon points="490,228 504,228 496,218" fill="#c0392b"/>
  <polygon points="490,262 504,262 496,272" fill="#c0392b"/>
  <text x="514" y="250" font-size="14" fill="#c0392b">轮辋直径 d = 16 in</text>

  <!-- spec text -->
  <text x="320" y="340" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">规格 205/55 R16 91V</text>
  <text x="320" y="364" text-anchor="middle" font-size="13" fill="#333">R 表示子午线结构，91 为载重指数，V 为速度等级</text>
</svg>
