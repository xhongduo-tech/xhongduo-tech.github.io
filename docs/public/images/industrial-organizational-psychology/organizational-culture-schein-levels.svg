<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="sans-serif" fill="#333">
<title>沙因的组织文化三层次模型</title>
<desc>组织文化由外到内分为表层人工饰物、中间信奉的价值观、底层基本假设；越往深处越难看见、越难改变，对行为的支配也越强。</desc>
<rect x="0" y="0" width="920" height="480" fill="#faf9f5"/>

<text x="460" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f6f8b">沙因（Schein）的组织文化三层次</text>

<path d="M 60 300 L 860 300 L 460 440 Z" fill="#cfd8dc" opacity="0.55" stroke="#333" stroke-width="1"/>
<text x="460" y="380" text-anchor="middle" font-size="14" fill="#333">水面之下</text>

<rect x="130" y="80" width="660" height="60" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="460" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">① 人工饰物（Artifacts）—— 表面、可见</text>
<text x="460" y="130" text-anchor="middle" font-size="13" fill="#666">徽标、办公布局、着装、礼仪、公开口号——易看、易变、可欺骗</text>

<rect x="130" y="150" width="660" height="60" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="460" y="178" text-anchor="middle" font-size="16" font-weight="bold">② 信奉的价值观（Espoused Values）—— 宣称的</text>
<text x="460" y="200" text-anchor="middle" font-size="13" fill="#666">使命、愿景、行为准则——墙上写的、嘴上说的</text>

<rect x="130" y="220" width="660" height="60" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="460" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">③ 基本假设（Basic Assumptions）—— 潜意识的</text>
<text x="460" y="270" text-anchor="middle" font-size="13" fill="#666">对人性、工作、关系的无意识信念——看不见、极难改、真正支配行为</text>

<path d="M 460 140 C 420 143, 420 200, 460 216" fill="none" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#c)"/>
<path d="M 460 210 C 420 213, 420 268, 460 284" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#c)"/>
<defs>
<marker id="c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
<path d="M0,0 L9,3.5 L0,7 Z" fill="#333"/>
</marker>
</defs>
<text x="500" y="150" font-size="12" fill="#666">看得见的表现</text>

<text x="460" y="452" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">辨析：核心价值观与表层装饰之间的落差，就是"文化空心化"的测量点。</text>
<text x="460" y="474" text-anchor="middle" font-size="13" fill="#666">改变文化要从最底层的基本假设入手——这也是组织变革最艰难的原因。</text>
</svg>
