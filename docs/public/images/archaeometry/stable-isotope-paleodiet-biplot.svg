<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470">
<title>碳氮稳定同位素双标图</title>
<desc>以骨胶原 δ13C 为横轴、δ15N 为纵轴，C3 植物、C4 植物、食草动物、食肉动物与海生食物各自占据不同区域；营养级沿箭头方向富集约 1‰ 碳、3-5‰ 氮。</desc>
<rect width="700" height="470" fill="#faf9f5"/>
<g font-family="sans-serif" font-size="14" fill="#333">
  <!-- axes -->
  <line x1="60" y1="400" x2="660" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="400" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="438" text-anchor="middle">δ¹³C (‰，VPDB)</text>
  <text x="24" y="230" text-anchor="middle" transform="rotate(-90 24 230)">δ¹⁵N (‰，AIR)</text>
  <!-- ticks x -->
  <text x="60" y="418" text-anchor="middle">-28</text>
  <text x="169" y="418" text-anchor="middle">-24</text>
  <text x="278" y="418" text-anchor="middle">-20</text>
  <text x="387" y="418" text-anchor="middle">-16</text>
  <text x="496" y="418" text-anchor="middle">-12</text>
  <text x="605" y="418" text-anchor="middle">-8</text>
  <!-- ticks y -->
  <text x="46" y="405" text-anchor="end">0</text>
  <text x="46" y="318" text-anchor="end">4</text>
  <text x="46" y="231" text-anchor="end">8</text>
  <text x="46" y="144" text-anchor="end">12</text>
  <text x="46" y="64" text-anchor="end">16</text>
  <!-- C3 plants -->
  <ellipse cx="101" cy="357" rx="22" ry="13" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.5"/>
  <text x="101" y="378" text-anchor="middle">C3 植物</text>
  <text x="101" y="396" text-anchor="middle" font-size="12">稻麦豆</text>
  <!-- C4 plants -->
  <ellipse cx="483" cy="357" rx="22" ry="13" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.5"/>
  <text x="483" y="378" text-anchor="middle">C4 植物</text>
  <text x="483" y="396" text-anchor="middle" font-size="12">粟黍玉米</text>
  <!-- C3 herbivore -->
  <ellipse cx="251" cy="294" rx="28" ry="16" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="251" y="292" text-anchor="middle">C3 食草动物</text>
  <!-- C4 herbivore -->
  <ellipse cx="619" cy="294" rx="28" ry="16" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="619" y="292" text-anchor="middle">C4 食草动物</text>
  <!-- C3 carnivore -->
  <ellipse cx="278" cy="205" rx="34" ry="19" fill="#1f6f8b" fill-opacity="0.16" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="278" y="202" text-anchor="middle">C3 食肉者</text>
  <!-- marine -->
  <ellipse cx="395" cy="100" rx="48" ry="24" fill="#333" fill-opacity="0.12" stroke="#333" stroke-width="1.5"/>
  <text x="395" y="98" text-anchor="middle">海生食物</text>
  <!-- trophic arrows -->
  <line x1="150" y1="330" x2="215" y2="305" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="278" y1="275" x2="278" y2="232" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="322" font-size="13" fill="#c0392b">+1‰ 碳、+3~5‰ 氮</text>
  <text x="216" y="90" text-anchor="middle" font-size="13" fill="#c0392b">每升一个营养级</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
</g>
</svg>
