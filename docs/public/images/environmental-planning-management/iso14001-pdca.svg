<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="sans-serif">
  <title>ISO 14001 环境管理体系的 PDCA 持续改进循环</title>
  <desc>环形 PDCA 循环：P 规划（目标、指标、方案）→ D 实施（运行控制、培训）→ C 检查（监测、内审、合规评价）→ A 改进（管理评审、纠正措施），箭头顺时针循环，中心为环境管理体系持续改进。</desc>
  <rect x="0" y="0" width="520" height="420" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <circle cx="260" cy="210" r="150" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <circle cx="260" cy="210" r="86" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="260" y1="60" x2="260" y2="360" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="110" y1="210" x2="410" y2="210" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 4"/>

  <path d="M 260 66 A 150 150 0 0 1 404 210" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 404 210 A 150 150 0 0 1 260 354" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 260 354 A 150 150 0 0 1 116 210" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 116 210 A 150 150 0 0 1 260 66" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="260" y="126" font-size="17" font-weight="bold" fill="#1f6f8b" text-anchor="middle">P · 规划</text>
  <text x="260" y="146" font-size="13" fill="#333" text-anchor="middle">目标 · 指标 · 环境因素</text>
  <text x="392" y="206" font-size="17" font-weight="bold" fill="#1f6f8b" text-anchor="middle">D · 实施</text>
  <text x="392" y="226" font-size="13" fill="#333" text-anchor="middle">运行控制 · 培训</text>
  <text x="260" y="300" font-size="17" font-weight="bold" fill="#1f6f8b" text-anchor="middle">C · 检查</text>
  <text x="260" y="320" font-size="13" fill="#333" text-anchor="middle">监测 · 内审 · 合规评价</text>
  <text x="128" y="206" font-size="17" font-weight="bold" fill="#1f6f8b" text-anchor="middle">A · 改进</text>
  <text x="128" y="226" font-size="13" fill="#333" text-anchor="middle">管理评审 · 纠正措施</text>

  <text x="260" y="198" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">环境管理体系</text>
  <text x="260" y="222" font-size="15" fill="#c0392b" text-anchor="middle">持续改进</text>

  <text x="260" y="410" font-size="13" fill="#666" text-anchor="middle">PDCA 循环每转一圈，环境绩效上一个台阶</text>
</svg>
