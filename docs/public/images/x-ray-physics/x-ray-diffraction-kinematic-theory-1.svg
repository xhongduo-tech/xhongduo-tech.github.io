<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="sans-serif">
  <title>布拉格衍射几何示意图</title>
  <desc>入射 X 射线以掠射角 θ 射向晶面间距为 d 的平行原子面，相邻晶面反射线的光程差为 2d sinθ，等于波长的整数倍时产生相长干涉。</desc>
  <rect width="800" height="420" fill="#faf9f5"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">布拉格衍射几何</text>
  <text x="400" y="64" text-anchor="middle" font-size="14" fill="#666">2d sinθ = nλ</text>

  <!-- 晶面：一组平行斜线 -->
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="200" y1="380" x2="620" y2="140"/>
    <line x1="245" y1="380" x2="665" y2="140"/>
    <line x1="290" y1="380" x2="710" y2="140"/>
    <line x1="335" y1="380" x2="755" y2="140"/>
  </g>
  <!-- 晶面间距标注 d -->
  <line x1="268" y1="352" x2="313" y2="352" stroke="#333" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="290" y="344" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>

  <!-- 入射束：从左上斜向右下，打到第一条晶面 -->
  <line x1="120" y1="80" x2="398" y2="302" stroke="#c0392b" stroke-width="3"/>
  <path d="M120 80 L 132 68 L 128 88 Z" fill="#c0392b"/>
  <!-- 反射束：从第一条晶面沿反射方向 -->
  <line x1="398" y1="302" x2="676" y2="90" stroke="#c0392b" stroke-width="3"/>
  <path d="M676 90 L 662 96 L 676 102 Z" fill="#c0392b"/>
  <!-- 第二条晶面的反射束（虚线） -->
  <line x1="443" y1="302" x2="721" y2="90" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- 法线 -->
  <line x1="398" y1="302" x2="358" y2="230" stroke="#333" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- θ 角弧线（入射侧） -->
  <path d="M 342 246 A 74 74 0 0 1 396 296" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="352" y="256" font-size="15" fill="#333" font-weight="bold">θ</text>
  <!-- θ 角弧线（反射侧） -->
  <path d="M 402 296 A 74 74 0 0 0 452 242" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="446" y="258" font-size="15" fill="#333" font-weight="bold">θ</text>

  <!-- 原子点 -->
  <g fill="#c0392b">
    <circle cx="398" cy="302" r="6"/>
    <circle cx="443" cy="302" r="6"/>
    <circle cx="488" cy="302" r="6"/>
  </g>

  <!-- 光程差标注 -->
  <line x1="443" y1="302" x2="672" y2="98" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 4"/>
  <line x1="398" y1="302" x2="398" y2="92" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="560" y="150" font-size="14" fill="#1f6f8b">光程差 = 2d sinθ</text>

  <text x="400" y="408" text-anchor="middle" font-size="13" fill="#666">相邻晶面反射线的光程差恰好相差 nλ 时，反射相长</text>
</svg>
