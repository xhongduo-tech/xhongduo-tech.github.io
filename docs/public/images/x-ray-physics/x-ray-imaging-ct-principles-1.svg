<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="sans-serif">
  <title>CT 扇形束扫描几何示意图</title>
  <desc>X 射线源发出扇形束穿过物体断面，对面弧形探测器阵列记录透射强度；源与探测器绕物体旋转一周，每个角度采集一条投影。</desc>
  <rect width="800" height="460" fill="#faf9f5"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">CT 扇形束扫描几何</text>
  <text x="400" y="64" text-anchor="middle" font-size="14" fill="#666">投影 p(s) = ∫ μ(x,y) dl，绕行一周后由拉东逆变换重建</text>

  <!-- 旋转环 -->
  <circle cx="400" cy="245" r="170" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 物体断面（椭圆） -->
  <ellipse cx="400" cy="245" rx="58" ry="46" fill="#e8e2d8" stroke="#333" stroke-width="2"/>
  <!-- 物体内部特征 -->
  <circle cx="388" cy="238" r="16" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <circle cx="414" cy="256" r="11" fill="#c0392b" opacity="0.75"/>
  <text x="400" y="245" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">物体</text>

  <!-- 源 -->
  <g>
    <circle cx="400" cy="75" r="26" fill="#1f6f8b"/>
    <text x="400" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">X 源</text>
  </g>
  <!-- 扇形束 -->
  <path d="M400 75 L 288 320 L 512 320 Z" fill="#1f6f8b" opacity="0.15"/>
  <path d="M400 75 L 330 205 M400 75 L 470 205" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 探测器阵列（弧形） -->
  <g fill="#c0392b">
    <rect x="286" y="316" width="14" height="10"/>
    <rect x="304" y="322" width="14" height="10"/>
    <rect x="322" y="327" width="14" height="10"/>
    <rect x="340" y="331" width="14" height="10"/>
    <rect x="358" y="334" width="14" height="10"/>
    <rect x="376" y="336" width="14" height="10"/>
    <rect x="394" y="337" width="14" height="10"/>
    <rect x="412" y="337" width="14" height="10"/>
    <rect x="430" y="336" width="14" height="10"/>
    <rect x="448" y="334" width="14" height="10"/>
    <rect x="466" y="331" width="14" height="10"/>
    <rect x="484" y="327" width="14" height="10"/>
    <rect x="502" y="322" width="14" height="10"/>
    <rect x="520" y="316" width="14" height="10"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">探测器阵列</text>

  <!-- 旋转方向箭头 -->
  <path d="M 572 245 A 172 172 0 0 1 545 130" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 545 130 L 556 142 L 539 144 Z" fill="#333"/>
  <text x="586" y="190" font-size="14" fill="#333">旋转一周</text>

  <text x="400" y="430" text-anchor="middle" font-size="13" fill="#666">每个旋转角采集一条投影，角度铺满 180°–360° 后重建断面图像</text>
</svg>
