<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>大气三圈环流与两支急流（经向剖面）</title>
  <desc>从北极到赤道的垂直剖面：哈德利环流（赤道上升、副热带下沉）、费雷尔环流（中纬度反环流）、极地环流；副热带急流位于 30° 附近高空，极锋急流位于 60° 附近，地面为信风、中纬度西风与极地东风。</desc>
  <rect x="0" y="0" width="840" height="460" fill="#faf9f5"/>
  <!-- ground -->
  <line x1="40" y1="380" x2="800" y2="380" stroke="#333" stroke-width="2.5"/>
  <text x="420" y="420" text-anchor="middle" fill="#333" font-size="14">地面（左 = 北极 90°N，右 = 赤道 0°）</text>
  <!-- region dividers -->
  <g stroke="#c8c2b4" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="195" y1="70" x2="195" y2="380"/>  <!-- 60N -->
    <line x1="440" y1="70" x2="440" y2="380"/>  <!-- 30N -->
    <line x1="680" y1="70" x2="680" y2="380"/>  <!-- 10N -->
  </g>
  <text x="195" y="64" text-anchor="middle" fill="#666" font-size="13">60°N（极锋）</text>
  <text x="440" y="64" text-anchor="middle" fill="#666" font-size="13">30°N（副热带）</text>
  <text x="680" y="64" text-anchor="middle" fill="#666" font-size="13">10°N</text>
  <!-- Cell labels -->
  <text x="115" y="120" text-anchor="middle" fill="#1f6f8b" font-size="15">极地环流</text>
  <text x="315" y="120" text-anchor="middle" fill="#1f6f8b" font-size="15">费雷尔环流</text>
  <text x="560" y="120" text-anchor="middle" fill="#1f6f8b" font-size="15">哈德利环流</text>
  <defs>
    <marker id="cellArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <!-- Polar cell (counterclockwise: sink at pole, rise at 60) -->
  <g stroke="#1f6f8b" stroke-width="2.4" fill="none">
    <path d="M 100 300 Q 115 220 195 200" marker-end="url(#cellArrow)"/>   <!-- surface poleward -->
    <path d="M 195 200 Q 170 150 120 120" marker-end="url(#cellArrow)"/>   <!-- up at 60 to top -->
    <path d="M 120 120 Q 100 180 100 300" marker-end="url(#cellArrow)"/>   <!-- aloft toward pole then down -->
  </g>
  <!-- Ferrel cell (clockwise: rise at 60? no: sink at 30, rise at 60, surface equatorward) -->
  <g stroke="#1f6f8b" stroke-width="2.4" fill="none">
    <path d="M 440 200 Q 440 120 300 110" marker-end="url(#cellArrow)"/>   <!-- aloft poleward -->
    <path d="M 300 110 Q 250 180 195 200" marker-end="url(#cellArrow)"/>   <!-- sink at 60 -->
    <path d="M 195 200 Q 310 290 440 200" marker-end="url(#cellArrow)"/>   <!-- surface equatorward -->
  </g>
  <!-- Hadley cell (counterclockwise: rise at equator, sink at 30, surface equatorward) -->
  <g stroke="#1f6f8b" stroke-width="2.4" fill="none">
    <path d="M 700 240 Q 700 130 520 120" marker-end="url(#cellArrow)"/>   <!-- up near equator aloft poleward -->
    <path d="M 520 120 Q 460 200 440 200" marker-end="url(#cellArrow)"/>   <!-- sink at 30 -->
    <path d="M 440 200 Q 570 300 700 240" marker-end="url(#cellArrow)"/>   <!-- surface toward equator -->
  </g>
  <!-- Jets -->
  <g stroke="#c0392b" stroke-width="2.6" fill="none">
    <line x1="350" y1="90" x2="510" y2="90"/>
    <line x1="150" y1="130" x2="250" y2="130"/>
  </g>
  <text x="430" y="82" text-anchor="middle" fill="#c0392b" font-size="14">副热带急流（热成风）</text>
  <text x="200" y="150" text-anchor="middle" fill="#c0392b" font-size="14">极锋急流（涡旋驱动）</text>
  <!-- Surface wind belts -->
  <g stroke="#333" stroke-width="2">
    <path d="M 100 380 Q 150 360 195 368" marker-end="url(#cellArrow)" fill="none"/>
    <path d="M 700 380 Q 650 360 600 368" marker-end="url(#cellArrow)" fill="none"/>
  </g>
  <text x="120" y="400" fill="#333" font-size="14">极地东风</text>
  <text x="600" y="400" fill="#333" font-size="14">信风（东风）</text>
  <!-- westerlies at surface midlatitudes (blowing into page/out of page represented by circles) -->
  <text x="330" y="368" text-anchor="middle" fill="#333" font-size="14">中纬度西风 ⊙</text>
  <circle cx="308" cy="372" r="4" fill="none" stroke="#333" stroke-width="1.6"/>
  <circle cx="352" cy="372" r="4" fill="none" stroke="#333" stroke-width="1.6"/>
  <text x="420" y="448" text-anchor="middle" fill="#333" font-size="14">哈德利与极地环流是正环流；费雷尔环流是反环流，由涡旋驱动维持</text>
</svg>
