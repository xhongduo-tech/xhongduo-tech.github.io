<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>埃克曼螺线（北半球）</title>
  <desc>水平面上的风矢量端图：地表风偏向低压一侧 45°，随高度增加风矢量逆时针旋转并趋向地转风，形成一条向内收缩的螺线。</desc>
  <rect x="0" y="0" width="720" height="480" fill="#faf9f5"/>
  <!-- Isobars (vertical, parallel to geostrophic wind) -->
  <g stroke="#c8c2b4" stroke-width="1.4" stroke-dasharray="6 4">
    <line x1="400" y1="60" x2="400" y2="360"/>
    <line x1="470" y1="60" x2="470" y2="360"/>
    <line x1="540" y1="60" x2="540" y2="360"/>
    <line x1="610" y1="60" x2="610" y2="360"/>
  </g>
  <text x="400" y="52" text-anchor="middle" fill="#666" font-size="14">p 减小（北 / 低压）</text>
  <text x="540" y="386" text-anchor="middle" fill="#666" font-size="14">p 增大（南 / 高压）</text>
  <!-- Axes from origin O -->
  <g stroke="#333" stroke-width="1.2" fill="none">
    <line x1="60" y1="320" x2="620" y2="320"/>
    <line x1="60" y1="320" x2="60" y2="80"/>
  </g>
  <text x="620" y="338" text-anchor="end" fill="#333" font-size="14">x（向东）</text>
  <text x="52" y="88" text-anchor="start" fill="#333" font-size="14">y（向北）</text>
  <defs>
    <marker id="ekArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="ekRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="ekBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <!-- Spiral curve through the tips -->
  <polyline points="60,320 210,249 281,274 295,305 290,320 281,322"
            fill="none" stroke="#1f6f8b" stroke-width="2" opacity="0.85"/>
  <!-- Geostrophic wind vector (blue) -->
  <line x1="60" y1="320" x2="281" y2="320" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ekBlue)"/>
  <text x="330" y="315" fill="#1f6f8b" font-size="14">地转风 Vg（沿等压线）</text>
  <!-- Surface wind vector (red), 45 deg toward low pressure (north-west? no: NE) -->
  <line x1="60" y1="320" x2="210" y2="249" stroke="#c0392b" stroke-width="3" marker-end="url(#ekRed)"/>
  <text x="96" y="238" fill="#c0392b" font-size="14">地表风（偏低压 45°）</text>
  <!-- Intermediate wind vectors (dark) -->
  <line x1="60" y1="320" x2="281" y2="274" stroke="#333" stroke-width="2.2" marker-end="url(#ekArrow)"/>
  <line x1="60" y1="320" x2="295" y2="305" stroke="#333" stroke-width="2.2" marker-end="url(#ekArrow)"/>
  <text x="222" y="262" fill="#333" font-size="13">中层风</text>
  <text x="236" y="306" fill="#333" font-size="13">上层风</text>
  <!-- 45-degree angle marker at origin -->
  <path d="M 150 320 A 90 90 0 0 0 110 246" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="128" y="280" fill="#666" font-size="14">45°</text>
  <!-- height labels along spiral -->
  <text x="160" y="180" fill="#333" font-size="14">随高度 z 增加：风矢量逆时针</text>
  <text x="160" y="200" fill="#333" font-size="14">旋转并趋近地转风（螺线收缩）</text>
  <!-- legend -->
  <text x="420" y="430" fill="#333" font-size="14">北半球：摩擦使风斜穿等压线指向低压</text>
  <text x="420" y="452" fill="#333" font-size="14">层厚 D ≈ π√(2K/f) ≈ 1 km（K=10 m²/s）</text>
</svg>
