<svg viewBox="0 0 640 520" width="640" height="520" xmlns="http://www.w3.org/2000/svg">
<title>透辉石—钙长石（Di-An）二元共结系相图</title>
<desc>横轴为成分（左端纯透辉石 Di，右端纯钙长石 An），纵轴为温度。两条液相线自上端两种矿物的熔点下降交于共结点 E（1274 ℃，约 42% An），固相线为过 E 的水平线。图中画出杠杆规则示意：在给定温度下做水平连接线，由杠杆规则求出液、固两相的比例。</desc>
<rect x="0" y="0" width="640" height="520" fill="#faf9f5"/>
<text x="30" y="30" font-family="sans-serif" font-size="16" fill="#333">温度 / ℃</text>
<text x="30" y="50" font-family="sans-serif" font-size="14" fill="#333">T</text>

<!-- 纯组分熔点标注 -->
<text x="52" y="112" font-family="sans-serif" font-size="14" fill="#c0392b">1391 ℃</text>
<text x="500" y="42" font-family="sans-serif" font-size="14" fill="#c0392b">1553 ℃</text>

<!-- 液相线：左侧 Di→E，右侧 An→E -->
<line x1="80" y1="232" x2="300" y2="360" stroke="#333" stroke-width="2.5"/>
<line x1="600" y1="55" x2="300" y2="360" stroke="#333" stroke-width="2.5"/>

<!-- 固相线：过共结点的水平线 -->
<line x1="80" y1="360" x2="600" y2="360" stroke="#333" stroke-width="2.5" stroke-dasharray="8 5"/>

<!-- 共结点 -->
<circle cx="300" cy="360" r="5" fill="#c0392b"/>
<text x="308" y="382" font-family="sans-serif" font-size="15" fill="#333">共结点 E（1274 ℃，约 42% An）</text>

<!-- 相区标注 -->
<text x="300" y="180" font-family="sans-serif" font-size="16" fill="#333">液相 L</text>
<text x="110" y="305" font-family="sans-serif" font-size="14" fill="#333">L + 透辉石</text>
<text x="500" y="305" font-family="sans-serif" font-size="14" fill="#333">L + 钙长石</text>
<text x="285" y="450" font-family="sans-serif" font-size="14" fill="#333">Di + An（固相区）</text>

<!-- 液相线 / 固相线 名称 -->
<text x="150" y="215" font-family="sans-serif" font-size="14" fill="#1f6f8b">液相线</text>
<text x="470" y="205" font-family="sans-serif" font-size="14" fill="#1f6f8b">液相线</text>
<text x="450" y="356" font-family="sans-serif" font-size="14" fill="#1f6f8b">固相线</text>

<!-- 杠杆规则：连接线 -->
<line x1="408" y1="250" x2="600" y2="250" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="430" cy="250" r="5" fill="#c0392b"/>
<text x="342" y="240" font-family="sans-serif" font-size="13" fill="#1f6f8b">连接线（杠杆臂）</text>
<text x="415" y="272" font-family="sans-serif" font-size="13" fill="#c0392b">整体成分 X</text>
<text x="350" y="315" font-family="sans-serif" font-size="13" fill="#333">液相占比 = (600 − 430) / (600 − 408) ≈ 88%</text>

<!-- 成分轴 -->
<line x1="80" y1="485" x2="600" y2="485" stroke="#333" stroke-width="2"/>
<polygon points="600,485 590,480 590,490" fill="#333"/>
<text x="80" y="508" font-family="sans-serif" font-size="15" fill="#333">纯透辉石 Di（0% An）</text>
<text x="470" y="508" font-family="sans-serif" font-size="15" fill="#333">纯钙长石 An（100% An）</text>
<text x="300" y="500" font-family="sans-serif" font-size="14" fill="#333">成分（wt% An）→</text>
</svg>
