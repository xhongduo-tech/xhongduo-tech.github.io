<svg viewBox="0 0 660 540" width="660" height="540" xmlns="http://www.w3.org/2000/svg">
<title>变质相 P–T 图解与变质相系</title>
<desc>横轴为温度（0–800 ℃），纵轴为压力（0–15 kbar，向下增大）。图中划分主要变质相的 P–T 区间：沸石相、葡萄石—绿纤石相、蓝片岩相、绿片岩相、角闪岩相、麻粒岩相、榴辉岩相，以及低压的接触角岩相。三条虚线分别代表弗兰西斯科型（低地温梯度）、巴罗型（中等地温梯度）与布坎型（高地温梯度）的变质相系路径。</desc>
<rect x="0" y="0" width="660" height="540" fill="#faf9f5"/>
<text x="30" y="45" font-family="sans-serif" font-size="15" fill="#333">压力 P（kbar）</text>
<text x="30" y="62" font-family="sans-serif" font-size="15" fill="#333">P</text>
<polygon points="50,70 42,80 58,80" fill="#333"/>
<text x="620" y="520" font-family="sans-serif" font-size="15" fill="#333">温度 T（℃）→</text>

<!-- 相区方框 -->
<rect x="147" y="69" width="82" height="86" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="152" y="118" font-family="sans-serif" font-size="14" fill="#333">沸石相</text>

<rect x="147" y="126" width="109" height="86" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="152" y="175" font-family="sans-serif" font-size="13" fill="#333">葡萄石—</text>
<text x="152" y="192" font-family="sans-serif" font-size="13" fill="#333">绿纤石相</text>

<rect x="181" y="212" width="169" height="230" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="230" y="330" font-family="sans-serif" font-size="15" fill="#333">蓝片岩相</text>

<rect x="283" y="126" width="101" height="172" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="290" y="210" font-family="sans-serif" font-size="14" fill="#333">绿片岩相</text>

<rect x="384" y="126" width="101" height="258" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="396" y="252" font-family="sans-serif" font-size="14" fill="#333">角闪岩相</text>

<rect x="485" y="155" width="135" height="229" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="510" y="268" font-family="sans-serif" font-size="14" fill="#333">麻粒岩相</text>

<rect x="350" y="384" width="270" height="87" fill="#efeae2" stroke="#8a857c" stroke-width="1.5"/>
<text x="442" y="432" font-family="sans-serif" font-size="15" fill="#333">榴辉岩相</text>

<rect x="283" y="60" width="270" height="38" fill="#f6ede2" stroke="#8a857c" stroke-width="1.5"/>
<text x="330" y="84" font-family="sans-serif" font-size="14" fill="#333">角岩相（接触变质，低压）</text>

<!-- 地温梯度虚线 -->
<line x1="175" y1="70" x2="240" y2="440" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="66" y="300" font-family="sans-serif" font-size="13" fill="#c0392b">弗兰西斯科型（低地温梯度）</text>

<line x1="175" y1="70" x2="395" y2="440" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="345" y="92" font-family="sans-serif" font-size="13" fill="#c0392b">巴罗型</text>

<line x1="175" y1="70" x2="560" y2="340" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="470" y="200" font-family="sans-serif" font-size="13" fill="#c0392b">布坎型（高地温梯度）</text>

<!-- 轴标注 -->
<text x="80" y="520" font-family="sans-serif" font-size="14" fill="#333">0</text>
<text x="150" y="520" font-family="sans-serif" font-size="13" fill="#333">100</text>
<text x="290" y="520" font-family="sans-serif" font-size="13" fill="#333">300</text>
<text x="430" y="520" font-family="sans-serif" font-size="13" fill="#333">500</text>
<text x="568" y="520" font-family="sans-serif" font-size="13" fill="#333">700</text>
<text x="30" y="300" font-family="sans-serif" font-size="13" fill="#333">~7</text>
<text x="30" y="470" font-family="sans-serif" font-size="13" fill="#333">~15</text>
</svg>
