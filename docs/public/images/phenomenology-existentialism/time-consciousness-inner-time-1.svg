<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
<title>内时间意识：滞留—原印象—前摄</title>
<desc>横轴为客观时间，红色竖线为原印象（现在），向左逐级消退的刻度为滞留，向右的虚线刻度为前摄。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>

<!-- 标题 -->
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">内时间意识：滞留 — 原印象 — 前摄</text>
<text x="320" y="60" text-anchor="middle" font-size="14" fill="#555">横轴 = 客观时间 t；纵轴方向 = 每个「现在」的意识截面</text>

<!-- 时间轴 -->
<line x1="60" y1="300" x2="590" y2="300" stroke="#333" stroke-width="2"/>
<polygon points="590,300 580,295 580,305" fill="#333"/>
<text x="560" y="330" font-size="14" fill="#333">客观时间 t →</text>

<!-- 滞留刻度（向左逐级消退） -->
<line x1="120" y1="300" x2="120" y2="210" stroke="#1f6f8b" stroke-width="2" opacity="0.3"/>
<line x1="185" y1="300" x2="185" y2="195" stroke="#1f6f8b" stroke-width="2" opacity="0.45"/>
<line x1="250" y1="300" x2="250" y2="180" stroke="#1f6f8b" stroke-width="2" opacity="0.65"/>
<line x1="310" y1="300" x2="310" y2="168" stroke="#1f6f8b" stroke-width="2" opacity="0.85"/>

<!-- 前摄刻度（向右虚线） -->
<line x1="330" y1="300" x2="330" y2="168" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" opacity="0.55"/>
<line x1="385" y1="300" x2="385" y2="185" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>
<line x1="445" y1="300" x2="445" y2="205" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" opacity="0.3"/>
<line x1="505" y1="300" x2="505" y2="230" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" opacity="0.18"/>

<!-- 原印象：现在竖线 -->
<line x1="320" y1="300" x2="320" y2="160" stroke="#c0392b" stroke-width="4"/>
<circle cx="320" cy="160" r="5" fill="#c0392b"/>
<text x="320" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">原印象（现在）</text>

<!-- 滞留包络线 -->
<path d="M120 210 Q 220 150 320 160" fill="none" stroke="#1f6f8b" stroke-width="3" opacity="0.9"/>
<text x="120" y="140" font-size="14" fill="#1f6f8b">滞留（Retention）</text>
<text x="128" y="158" font-size="12" fill="#1f6f8b">逐级收缩，越远越淡</text>

<!-- 前摄包络线 -->
<path d="M320 160 Q 450 150 505 230" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="7,5" opacity="0.9"/>
<text x="460" y="140" font-size="14" fill="#1f6f8b">前摄（Protention）</text>
<text x="452" y="158" font-size="12" fill="#1f6f8b">对将来的预期</text>

<!-- 时间点标注 -->
<text x="120" y="322" text-anchor="middle" font-size="13" fill="#333">t₁（更早）</text>
<text x="250" y="322" text-anchor="middle" font-size="13" fill="#333">t₀</text>
<text x="445" y="322" text-anchor="middle" font-size="13" fill="#333">t₁′（更晚）</text>

<!-- 底注 -->
<text x="320" y="370" text-anchor="middle" font-size="13" fill="#555">一个「现在」不是一个点，而是一小段被滞留与前摄延展的弧</text>
</svg>
