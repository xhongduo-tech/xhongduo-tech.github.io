<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" font-family="sans-serif">
  <title>拜日式十二位置序列与呼吸配合</title>
  <desc>拜日式从祈祷式开始的十二个位置，两行六列排布，箭头表示流动方向，颜色区分吸气（青）、呼气（红）与屏息（金）。</desc>
  <rect x="0" y="0" width="940" height="250" fill="#faf9f5"/>
  <text x="470" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">拜日式十二位置序列（数字＝顺序，颜色＝呼吸）</text>

  <!-- legend -->
  <rect x="640" y="8" width="12" height="12" fill="#e8f1f5" stroke="#1f6f8b"/>
  <text x="656" y="19" font-size="11" fill="#333">吸气</text>
  <rect x="710" y="8" width="12" height="12" fill="#f8eaea" stroke="#c0392b"/>
  <text x="726" y="19" font-size="11" fill="#333">呼气</text>
  <rect x="780" y="8" width="12" height="12" fill="#f5f0e0" stroke="#a67c00"/>
  <text x="796" y="19" font-size="11" fill="#333">屏息/呼气</text>

  <!-- row 1: poses 1-6, y=45, box 130x56, x start 18 step 150 -->
  <!-- 1 祈祷式 -->
  <g>
    <rect x="18" y="45" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="34" cy="62" r="9" fill="#1f6f8b"/>
    <text x="34" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
    <text x="83" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">祈祷式</text>
    <text x="83" y="86" text-anchor="middle" font-size="11" fill="#555">站立合十 · 吸</text>
  </g>
  <!-- 2 展臂式 -->
  <g>
    <rect x="168" y="45" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="184" cy="62" r="9" fill="#1f6f8b"/>
    <text x="184" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
    <text x="233" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">展臂式</text>
    <text x="233" y="86" text-anchor="middle" font-size="11" fill="#555">双臂上举 · 吸</text>
  </g>
  <!-- 3 前屈式 -->
  <g>
    <rect x="318" y="45" width="130" height="56" rx="8" fill="#f8eaea" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="334" cy="62" r="9" fill="#c0392b"/>
    <text x="334" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
    <text x="383" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">前屈式</text>
    <text x="383" y="86" text-anchor="middle" font-size="11" fill="#555">体前屈 · 呼</text>
  </g>
  <!-- 4 骑马式 -->
  <g>
    <rect x="468" y="45" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="484" cy="62" r="9" fill="#1f6f8b"/>
    <text x="484" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
    <text x="533" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">骑马式</text>
    <text x="533" y="86" text-anchor="middle" font-size="11" fill="#555">跨步后腿 · 吸</text>
  </g>
  <!-- 5 平板式 -->
  <g>
    <rect x="618" y="45" width="130" height="56" rx="8" fill="#f8eaea" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="634" cy="62" r="9" fill="#c0392b"/>
    <text x="634" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>
    <text x="683" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">平板式</text>
    <text x="683" y="86" text-anchor="middle" font-size="11" fill="#555">身体成线 · 呼</text>
  </g>
  <!-- 6 八体投地式 -->
  <g>
    <rect x="768" y="45" width="130" height="56" rx="8" fill="#f5f0e0" stroke="#a67c00" stroke-width="1.5"/>
    <circle cx="784" cy="62" r="9" fill="#a67c00"/>
    <text x="784" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">6</text>
    <text x="833" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">八体投地</text>
    <text x="833" y="86" text-anchor="middle" font-size="11" fill="#555">八点触地 · 屏</text>
  </g>

  <!-- row 2: poses 7-12, y=170 -->
  <!-- 7 眼镜蛇式 -->
  <g>
    <rect x="18" y="170" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="34" cy="187" r="9" fill="#1f6f8b"/>
    <text x="34" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">7</text>
    <text x="83" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">眼镜蛇式</text>
    <text x="83" y="211" text-anchor="middle" font-size="11" fill="#555">胸口上提 · 吸</text>
  </g>
  <!-- 8 下犬式 -->
  <g>
    <rect x="168" y="170" width="130" height="56" rx="8" fill="#f8eaea" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="184" cy="187" r="9" fill="#c0392b"/>
    <text x="184" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">8</text>
    <text x="233" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">下犬式</text>
    <text x="233" y="211" text-anchor="middle" font-size="11" fill="#555">身体倒V · 呼</text>
  </g>
  <!-- 9 骑马式(另一侧) -->
  <g>
    <rect x="318" y="170" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="334" cy="187" r="9" fill="#1f6f8b"/>
    <text x="334" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">9</text>
    <text x="383" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">骑马式</text>
    <text x="383" y="211" text-anchor="middle" font-size="11" fill="#555">另侧跨步 · 吸</text>
  </g>
  <!-- 10 前屈式 -->
  <g>
    <rect x="468" y="170" width="130" height="56" rx="8" fill="#f8eaea" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="484" cy="187" r="9" fill="#c0392b"/>
    <text x="484" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">10</text>
    <text x="533" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">前屈式</text>
    <text x="533" y="211" text-anchor="middle" font-size="11" fill="#555">双腿并拢 · 呼</text>
  </g>
  <!-- 11 展臂式 -->
  <g>
    <rect x="618" y="170" width="130" height="56" rx="8" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.5"/>
    <circle cx="634" cy="187" r="9" fill="#1f6f8b"/>
    <text x="634" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">11</text>
    <text x="683" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">展臂式</text>
    <text x="683" y="211" text-anchor="middle" font-size="11" fill="#555">起身展臂 · 吸</text>
  </g>
  <!-- 12 祈祷式 -->
  <g>
    <rect x="768" y="170" width="130" height="56" rx="8" fill="#f8eaea" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="784" cy="187" r="9" fill="#c0392b"/>
    <text x="784" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">12</text>
    <text x="833" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">祈祷式</text>
    <text x="833" y="211" text-anchor="middle" font-size="11" fill="#555">合十还原 · 呼</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="150" y1="73" x2="165" y2="73" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="73" x2="315" y2="73" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="73" x2="465" y2="73" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="73" x2="615" y2="73" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="73" x2="765" y2="73" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- connector row1 pose6 down to row2 pose7 -->
  <line x1="833" y1="103" x2="833" y2="167" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- arrows row 2 -->
  <line x1="150" y1="198" x2="165" y2="198" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="198" x2="315" y2="198" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="198" x2="465" y2="198" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="198" x2="615" y2="198" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="198" x2="765" y2="198" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- return arrow 12 to 1 -->
  <path d="M 83 170 C 83 145, 83 145, 83 103" fill="none" stroke="#a67c00" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowReturn)"/>
  <text x="95" y="140" font-size="11" fill="#a67c00">循环</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c00"/>
    </marker>
  </defs>
</svg>
