<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>等径球最密堆积中的空隙</title>
  <desc>平面等径球堆积中，三个球围成三角形空隙（对应三维中的四面体空隙），四个球围成四边形空隙（对应三维中的八面体空隙）。</desc>
  <rect x="0" y="0" width="660" height="400" fill="#faf9f5"/>

  <text x="40" y="50" fill="#333" font-size="18" font-weight="bold">平面等径球的两种空隙</text>

  <!-- left: three circles triangular arrangement -->
  <circle cx="120" cy="150" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="250" cy="150" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="185" cy="245" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="185" cy="180" r="8" fill="#c0392b"/>
  <text x="185" y="325" fill="#333" font-size="15" text-anchor="middle">三角形空隙</text>
  <text x="185" y="347" fill="#333" font-size="14" text-anchor="middle">（三维：四面体空隙）</text>

  <!-- right: four circles square arrangement -->
  <circle cx="420" cy="150" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="550" cy="150" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="420" cy="260" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="550" cy="260" r="55" fill="#1f6f8b" fill-opacity="0.28" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="485" cy="205" r="9" fill="#c0392b"/>
  <text x="485" y="338" fill="#333" font-size="15" text-anchor="middle">四边形空隙</text>
  <text x="485" y="360" fill="#333" font-size="14" text-anchor="middle">（三维：八面体空隙）</text>
</svg>
