<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="14">
  <title>桁架结点法示意：整体体系与结点隔离体</title>
  <desc>左侧为三杆三角形桁架，结点 A 受竖向荷载 F；右侧为结点 A 的隔离体，两根杆的内力与荷载 F 汇交平衡。</desc>
  <rect x="0" y="0" width="660" height="330" fill="#faf9f5"/>
  <!-- 左侧桁架 -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="70" y1="60" x2="70" y2="210"/>
    <line x1="70" y1="60" x2="270" y2="210"/>
    <line x1="70" y1="210" x2="270" y2="210"/>
  </g>
  <!-- 荷载 F -->
  <g stroke="#c0392b" stroke-width="2.5" fill="#c0392b">
    <line x1="70" y1="34" x2="70" y2="56"/>
    <polygon points="70,62 63,52 77,52"/>
  </g>
  <text x="82" y="42" fill="#c0392b" font-size="15">F</text>
  <circle cx="70" cy="60" r="4" fill="#1f6f8b"/>
  <text x="50" y="54" fill="#333" font-size="15">A</text>
  <circle cx="70" cy="210" r="4" fill="#1f6f8b"/>
  <polygon points="56,212 84,212 70,232" fill="#333" stroke="#333" stroke-width="1.5"/>
  <text x="88" y="222" fill="#333" font-size="14">B（铰支座）</text>
  <circle cx="270" cy="210" r="4" fill="#1f6f8b"/>
  <circle cx="270" cy="236" r="6" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="248" y1="246" x2="292" y2="246" stroke="#333" stroke-width="2"/>
  <text x="258" y="268" fill="#333" font-size="14">C（滚轴）</text>
  <text x="16" y="304" fill="#1f6f8b" font-size="15">整体体系：m + r = 3 + 3 = 6 = 2j，静定</text>

  <!-- 右侧结点隔离体 -->
  <rect x="398" y="24" width="248" height="246" fill="#ffffff" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="410" y="50" fill="#333" font-size="16">结点 A 隔离体</text>
  <circle cx="502" cy="132" r="5" fill="#1f6f8b"/>
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="502" y1="132" x2="502" y2="186"/>
    <polygon points="502,194 495,184 509,184"/>
  </g>
  <text x="514" y="172" fill="#1f6f8b" font-size="15">F_AB</text>
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="502" y1="132" x2="556" y2="186"/>
    <polygon points="562,194 552,186 557,195"/>
  </g>
  <text x="556" y="178" fill="#1f6f8b" font-size="15">F_AC</text>
  <g stroke="#c0392b" stroke-width="2.5" fill="#c0392b">
    <line x1="502" y1="96" x2="502" y2="120"/>
    <polygon points="502,126 495,116 509,116"/>
  </g>
  <text x="514" y="108" fill="#c0392b" font-size="15">F</text>
  <text x="408" y="252" fill="#333" font-size="14">ΣF_x = 0、ΣF_y = 0，解出两根杆的内力</text>
</svg>
