<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title>平流层气溶胶注入示意图</title>
<desc>阳光从左上射向地球，一部分被平流层中的硫酸盐气溶胶反射回太空，一部分透射进入对流层抵达地表；飞机在约 20 公里高度注入 SO2。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>

<!-- 平流层 -->
<rect x="0" y="0" width="640" height="160" fill="#e9f2f8"/>
<text x="20" y="150" font-family="sans-serif" font-size="13" fill="#333">平流层（约 12–50 km）</text>

<!-- 对流层 -->
<rect x="0" y="160" width="640" height="140" fill="#e4f1ef"/>
<text x="20" y="292" font-family="sans-serif" font-size="13" fill="#333">对流层（0–12 km）</text>

<!-- 对流层顶 -->
<line x1="0" y1="160" x2="640" y2="160" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="500" y="155" font-family="sans-serif" font-size="13" fill="#1f6f8b">对流层顶</text>

<!-- 地表 -->
<rect x="0" y="300" width="640" height="100" fill="#3f5d3c"/>
<path d="M0 300 Q 160 288 320 300 T 640 300 L 640 400 L 0 400 Z" fill="#4a6741"/>
<text x="520" y="380" font-family="sans-serif" font-size="15" fill="#faf9f5">地表 / 海洋</text>

<!-- 太阳 -->
<circle cx="70" cy="60" r="26" fill="#f0b429"/>
<line x1="30" y1="60" x2="6" y2="60" stroke="#f0b429" stroke-width="3"/>
<line x1="70" y1="20" x2="70" y2="2" stroke="#f0b429" stroke-width="3"/>
<line x1="110" y1="60" x2="134" y2="60" stroke="#f0b429" stroke-width="3"/>
<line x1="70" y1="100" x2="70" y2="118" stroke="#f0b429" stroke-width="3"/>
<text x="58" y="110" font-family="sans-serif" font-size="15" fill="#333">太阳</text>

<!-- 入射光线（黄） -->
<path d="M 105 70 L 330 140" stroke="#e8a33d" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
<path d="M 110 90 L 340 190" stroke="#e8a33d" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
<path d="M 100 50 L 240 90" stroke="#e8a33d" stroke-width="3" fill="none" marker-end="url(#arrB)"/>

<!-- 反射光线（红） -->
<path d="M 300 120 L 250 45" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
<path d="M 330 145 L 290 55" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
<path d="M 380 165 L 360 60" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>

<defs>
<marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#e8a33d"/></marker>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#c0392b"/></marker>
</defs>

<!-- 硫酸盐气溶胶层 -->
<g fill="#1f6f8b">
<circle cx="250" cy="95" r="4"/>
<circle cx="275" cy="110" r="3.5"/>
<circle cx="300" cy="125" r="4"/>
<circle cx="320" cy="100" r="3"/>
<circle cx="345" cy="135" r="4"/>
<circle cx="290" cy="90" r="3"/>
<circle cx="360" cy="110" r="3.5"/>
<circle cx="230" cy="110" r="3"/>
<circle cx="315" cy="150" r="3.5"/>
<circle cx="370" cy="150" r="3"/>
</g>
<text x="210" y="45" font-family="sans-serif" font-size="14" fill="#1f6f8b">硫酸盐气溶胶层</text>
<text x="150" y="95" font-family="sans-serif" font-size="13" fill="#c0392b">部分反射回太空</text>
<text x="150" y="215" font-family="sans-serif" font-size="13" fill="#333">部分透过，抵达地面</text>

<!-- 飞机与 SO2 羽流 -->
<g>
<rect x="430" y="140" width="26" height="10" rx="3" fill="#333"/>
<polygon points="456,145 470,141 470,149" fill="#333"/>
<line x1="443" y1="150" x2="443" y2="165" stroke="#888" stroke-width="2"/>
<circle cx="443" cy="168" r="2.5" fill="#888"/>
<circle cx="447" cy="172" r="2" fill="#888"/>
<circle cx="452" cy="176" r="2.5" fill="#888"/>
<circle cx="458" cy="180" r="2" fill="#888"/>
<circle cx="465" cy="183" r="2" fill="#888"/>
<circle cx="472" cy="186" r="2" fill="#888"/>
</g>
<text x="430" y="130" font-family="sans-serif" font-size="14" fill="#333">注入器 ≈ 20 km（SO2）</text>

<!-- 图例 -->
<text x="40" y="330" font-family="sans-serif" font-size="14" fill="#333">图例：</text>
<line x1="110" y1="326" x2="150" y2="326" stroke="#e8a33d" stroke-width="4"/>
<text x="155" y="330" font-family="sans-serif" font-size="13" fill="#333">入射阳光</text>
<line x1="110" y1="352" x2="150" y2="352" stroke="#c0392b" stroke-width="4"/>
<text x="155" y="356" font-family="sans-serif" font-size="13" fill="#333">被反射的阳光</text>
</svg>
