<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="620" height="480" font-family="sans-serif">
  <title>海特勒电磁级联模型示意</title>
  <desc>原初高能伽马光子在大气中逐代分裂成电子正电子对与光子，粒子数按 N=2^n 增长、单粒子能量按 E0/2^n 下降，直到临界能量处到达簇射极大。</desc>
  <rect x="0" y="0" width="620" height="480" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="310" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">海特勒模型：电磁级联</text>

  <!-- 大气深度箭头（左侧） -->
  <line x1="46" y1="80" x2="46" y2="416" stroke="#888" stroke-width="2"/>
  <polygon points="46,422 41,412 51,412" fill="#888"/>
  <text x="40" y="240" font-size="14" fill="#666" transform="rotate(-90 40 240)">大气深度 X →</text>

  <!-- 连线 -->
  <line x1="310" y1="80" x2="250" y2="140" stroke="#999" stroke-width="1.4"/>
  <line x1="310" y1="80" x2="370" y2="140" stroke="#999" stroke-width="1.4"/>

  <line x1="250" y1="150" x2="190" y2="200" stroke="#999" stroke-width="1.4"/>
  <line x1="250" y1="150" x2="270" y2="200" stroke="#999" stroke-width="1.4"/>
  <line x1="370" y1="150" x2="350" y2="200" stroke="#999" stroke-width="1.4"/>
  <line x1="370" y1="150" x2="430" y2="200" stroke="#999" stroke-width="1.4"/>

  <line x1="190" y1="210" x2="110" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="190" y1="210" x2="166" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="270" y1="210" x2="222" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="270" y1="210" x2="278" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="350" y1="210" x2="342" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="350" y1="210" x2="398" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="430" y1="210" x2="454" y2="260" stroke="#999" stroke-width="1.4"/>
  <line x1="430" y1="210" x2="510" y2="260" stroke="#999" stroke-width="1.4"/>

  <!-- 继续生长的虚线 -->
  <line x1="110" y1="268" x2="110" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="510" y1="268" x2="510" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="310" y1="268" x2="310" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="310" y="318" text-anchor="middle" font-size="15" fill="#c0392b">⋮</text>

  <!-- 粒子（红=光子，青=电子/正电子） -->
  <!-- n=0 -->
  <circle cx="310" cy="72" r="10" fill="#c0392b"/>
  <!-- n=1 -->
  <circle cx="250" cy="142" r="9" fill="#1f6f8b"/>
  <circle cx="370" cy="142" r="9" fill="#1f6f8b"/>
  <!-- n=2 -->
  <circle cx="190" cy="202" r="8" fill="#c0392b"/>
  <circle cx="270" cy="202" r="8" fill="#c0392b"/>
  <circle cx="350" cy="202" r="8" fill="#c0392b"/>
  <circle cx="430" cy="202" r="8" fill="#c0392b"/>
  <!-- n=3 -->
  <circle cx="110" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="166" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="222" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="278" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="342" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="398" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="454" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="510" cy="260" r="7" fill="#1f6f8b"/>

  <!-- 各代粒子数标注 -->
  <text x="96" y="76" text-anchor="end" font-size="14" fill="#666">N=1</text>
  <text x="96" y="146" text-anchor="end" font-size="14" fill="#666">N=2</text>
  <text x="96" y="206" text-anchor="end" font-size="14" fill="#666">N=4</text>
  <text x="96" y="264" text-anchor="end" font-size="14" fill="#666">N=8</text>
  <text x="96" y="316" text-anchor="end" font-size="14" fill="#666">N=2ⁿ</text>

  <!-- X_max 虚线 -->
  <line x1="110" y1="352" x2="520" y2="352" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="520" y="346" text-anchor="end" font-size="14" fill="#1f6f8b">簇射极大 X_max（N ≈ E₀/E_c）</text>

  <!-- 地面 -->
  <line x1="70" y1="424" x2="560" y2="424" stroke="#333" stroke-width="3"/>
  <text x="315" y="450" text-anchor="middle" font-size="15" fill="#333">地面 · 粒子探测器阵列</text>

  <!-- 公式框（右上） -->
  <rect x="428" y="52" width="176" height="104" rx="6" fill="#ffffff" stroke="#ccc"/>
  <text x="516" y="76" text-anchor="middle" font-size="15" fill="#333">N = 2ⁿ</text>
  <text x="516" y="102" text-anchor="middle" font-size="15" fill="#333">E = E₀ / 2ⁿ</text>
  <text x="516" y="128" text-anchor="middle" font-size="14" fill="#c0392b">E &lt; E_c 时级联停止</text>

  <!-- 图例（左下） -->
  <circle cx="128" cy="408" r="6" fill="#c0392b"/>
  <text x="140" y="412" font-size="14" fill="#333">光子 γ（轫致/对产生）</text>
  <circle cx="128" cy="432" r="6" fill="#1f6f8b"/>
  <text x="140" y="436" font-size="14" fill="#333">电子/正电子 e±</text>
</svg>
