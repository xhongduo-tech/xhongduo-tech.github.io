<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
<title>t 分布拒绝域示意图</title>
<desc>标准 t 分布曲线，左右两侧红色阴影为拒绝域（临界值 ±1.96），中心接受域，右侧阴影内标出观测到的检验统计量 t=2.5。</desc>
<rect x="0" y="0" width="640" height="340" fill="#faf9f5"/>
<g font-family="sans-serif">
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333">t 分布与拒绝域（双侧 α = 0.05）</text>

  <!-- axis -->
  <line x1="60" y1="260" x2="580" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="60" y2="120" stroke="#333" stroke-width="1.5"/>

  <!-- normal curve path (sampled) -->
  <path d="M 60,260
           L 160,259.7
           L 180,259.7
           L 200,258.3
           L 220,253.4
           L 240,239.7
           L 260,211.3
           L 280,169.0
           L 300,127.6
           L 320,110
           L 340,127.6
           L 360,169.0
           L 380,211.3
           L 400,239.7
           L 420,253.4
           L 440,258.3
           L 460,259.7
           L 480,260
           L 580,260"
        fill="none" stroke="#333" stroke-width="2.4"/>

  <!-- left rejection region -->
  <polygon points="240,260 240,239.7 220,253.4 200,258.3 180,259.7 160,259.8 60,260" fill="#c0392b" opacity="0.45"/>
  <!-- right rejection region -->
  <polygon points="398,260 398,237.6 420,253.4 440,258.3 460,259.7 480,259.9 580,260" fill="#c0392b" opacity="0.45"/>

  <!-- critical value lines -->
  <line x1="398" y1="120" x2="398" y2="260" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="242" y1="120" x2="242" y2="260" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="320" y1="110" x2="320" y2="260" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- labels -->
  <text x="398" y="105" text-anchor="middle" font-size="14" fill="#c0392b">t = 1.96</text>
  <text x="242" y="105" text-anchor="middle" font-size="14" fill="#c0392b">t = -1.96</text>
  <text x="320" y="300" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#333">接受域：不能拒绝 H₀</text>
  <text x="495" y="248" text-anchor="middle" font-size="13" fill="#c0392b">α/2</text>
  <text x="205" y="248" text-anchor="middle" font-size="13" fill="#c0392b">α/2</text>

  <!-- observed test statistic -->
  <circle cx="420" cy="260" r="5" fill="#1f6f8b"/>
  <line x1="420" y1="260" x2="420" y2="248" stroke="#1f6f8b" stroke-width="2"/>
  <text x="420" y="236" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">t = 2.5（落入拒绝域）</text>
</g>
</svg>
