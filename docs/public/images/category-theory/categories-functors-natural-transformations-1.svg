<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="sans-serif">
  <title>自然变换的正方形交换图</title>
  <desc>两个函子 F、G 之间的自然变换 α，对任意态射 f: a → b 使正方形交换：α_b ∘ F(f) = G(f) ∘ α_a</desc>
  <rect x="0" y="0" width="560" height="380" fill="#faf9f5"/>
  <g fill="#333" font-size="18" text-anchor="middle">
    <text x="120" y="105">F(a)</text>
    <text x="440" y="105">F(b)</text>
    <text x="120" y="295">G(a)</text>
    <text x="440" y="295">G(b)</text>
  </g>
  <g stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arrowRed)">
    <line x1="150" y1="75" x2="410" y2="75"/>
    <line x1="90" y1="135" x2="90" y2="265"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="2.4" fill="none" marker-end="url(#arrowTeal)">
    <line x1="150" y1="305" x2="410" y2="305"/>
    <line x1="470" y1="135" x2="470" y2="265"/>
  </g>
  <g fill="#333" font-size="17">
    <text x="280" y="58" text-anchor="middle">F(f)</text>
    <text x="400" y="130" text-anchor="end">α_a</text>
    <text x="280" y="288" text-anchor="middle">G(f)</text>
    <text x="70" y="130" text-anchor="end">α_b</text>
  </g>
  <g fill="#7a6f5f" font-size="15" text-anchor="middle">
    <text x="280" y="368">交换性：α_b ∘ F(f) = G(f) ∘ α_a（对一切 f: a → b 成立）</text>
  </g>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
