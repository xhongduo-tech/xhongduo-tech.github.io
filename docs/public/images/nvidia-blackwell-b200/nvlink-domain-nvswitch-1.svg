<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<title>NVLink 域拓扑示意：GPU 经 NVSwitch 全连接</title>
<desc>上层六颗 GPU 各通过链路连到下层三颗 NVSwitch，任意 GPU 之间经交换机全速直达；代表 NVL72 中 72 颗 GPU 与 18 颗 NVSwitch 构成的无阻塞全连接 NVLink 域</desc>
<rect width="800" height="460" fill="#faf9f5"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">NVLink 域拓扑示意（NVL72：72 颗 GPU ↔ 18 颗 NVSwitch）</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#1f6f8b">任意两颗 GPU 之间都有全速直达通路——无收敛（无阻塞）全连接</text>

<!-- links: 6 GPUs (gx,110) to 3 switches (sx,340) -->
<g stroke="#1f6f8b" stroke-width="1.2" opacity="0.55">
  <line x1="70" y1="134" x2="160" y2="318"/>
  <line x1="70" y1="134" x2="400" y2="318"/>
  <line x1="70" y1="134" x2="640" y2="318"/>
  <line x1="200" y1="134" x2="160" y2="318"/>
  <line x1="200" y1="134" x2="400" y2="318"/>
  <line x1="200" y1="134" x2="640" y2="318"/>
  <line x1="330" y1="134" x2="160" y2="318"/>
  <line x1="330" y1="134" x2="400" y2="318"/>
  <line x1="330" y1="134" x2="640" y2="318"/>
  <line x1="460" y1="134" x2="160" y2="318"/>
  <line x1="460" y1="134" x2="400" y2="318"/>
  <line x1="460" y1="134" x2="640" y2="318"/>
  <line x1="590" y1="134" x2="160" y2="318"/>
  <line x1="590" y1="134" x2="400" y2="318"/>
  <line x1="590" y1="134" x2="640" y2="318"/>
  <line x1="720" y1="134" x2="160" y2="318"/>
  <line x1="720" y1="134" x2="400" y2="318"/>
  <line x1="720" y1="134" x2="640" y2="318"/>
</g>

<!-- GPU boxes -->
<g fill="#1f6f8b">
  <rect x="15" y="88" width="110" height="46" rx="6"/>
  <rect x="145" y="88" width="110" height="46" rx="6"/>
  <rect x="275" y="88" width="110" height="46" rx="6"/>
  <rect x="405" y="88" width="110" height="46" rx="6"/>
  <rect x="535" y="88" width="110" height="46" rx="6"/>
  <rect x="665" y="88" width="110" height="46" rx="6"/>
</g>
<g fill="#ffffff" font-size="14" text-anchor="middle">
  <text x="70" y="116">GPU 0</text>
  <text x="200" y="116">GPU 1</text>
  <text x="330" y="116">GPU 2</text>
  <text x="460" y="116">GPU 3</text>
  <text x="590" y="116">GPU 4</text>
  <text x="720" y="116">GPU 5</text>
</g>
<text x="400" y="168" text-anchor="middle" font-size="13" fill="#333">▲ 示意 6 颗 GPU（实际 72 颗），每颗带 18 条 NVLink 5 链路</text>

<!-- Switch boxes -->
<g fill="#c0392b">
  <rect x="95" y="318" width="130" height="46" rx="6"/>
  <rect x="335" y="318" width="130" height="46" rx="6"/>
  <rect x="575" y="318" width="130" height="46" rx="6"/>
</g>
<g fill="#ffffff" font-size="14" text-anchor="middle">
  <text x="160" y="346">NVSwitch 0</text>
  <text x="400" y="346">NVSwitch 1</text>
  <text x="640" y="346">NVSwitch 2</text>
</g>
<text x="400" y="392" text-anchor="middle" font-size="13" fill="#333">▼ 示意 3 颗 NVSwitch（实际 18 颗），每颗 72 个端口</text>

<text x="400" y="432" text-anchor="middle" font-size="13" fill="#333">GPU 只进不出专用高速网络：无需网卡、无需 TCP/IP，延迟微秒以下</text>
</svg>
