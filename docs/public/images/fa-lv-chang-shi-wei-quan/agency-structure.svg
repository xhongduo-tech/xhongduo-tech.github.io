<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>代理三方结构示意图</title>
  <desc>被代理人、代理人、相对人三方关系：被代理人向代理人授权，代理人以被代理人名义与相对人实施法律行为，行为效果归属被代理人。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <rect x="40" y="130" width="150" height="80" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="115" y="165" text-anchor="middle" font-size="17" fill="#333">被代理人</text>
    <text x="115" y="190" text-anchor="middle" font-size="13" fill="#555">（本人）</text>

    <rect x="245" y="50" width="150" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
    <text x="320" y="85" text-anchor="middle" font-size="17" fill="#333">代理人</text>
    <text x="320" y="110" text-anchor="middle" font-size="13" fill="#555">（在权限内行事）</text>

    <rect x="450" y="130" width="150" height="80" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="525" y="165" text-anchor="middle" font-size="17" fill="#333">相对人</text>
    <text x="525" y="190" text-anchor="middle" font-size="13" fill="#555">（第三人）</text>

    <g stroke="#1f6f8b" stroke-width="2" fill="none">
      <line x1="150" y1="150" x2="245" y2="120" marker-end="url(#arrowBlue)"/>
      <line x1="395" y1="120" x2="450" y2="150" marker-end="url(#arrowBlue)"/>
      <line x1="490" y1="210" x2="180" y2="210" marker-end="url(#arrowRed)"/>
    </g>

    <text x="180" y="108" text-anchor="middle" font-size="14" fill="#1f6f8b">① 授权</text>
    <text x="428" y="108" text-anchor="middle" font-size="14" fill="#1f6f8b">② 以被代理人名义实施行为</text>
    <text x="335" y="250" text-anchor="middle" font-size="14" fill="#c0392b">③ 行为效果归属被代理人</text>

    <text x="320" y="310" text-anchor="middle" font-size="13" fill="#555">内部：授权关系　｜　外部：行为关系　｜　结果：效果归属</text>
  </g>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
