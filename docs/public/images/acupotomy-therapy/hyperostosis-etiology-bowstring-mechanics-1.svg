<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>弓弦力学模型与骨质增生形成示意图</title>
  <desc>以弓和弦类比骨骼与软组织：弓（骨）受弦（软组织）牵拉，在骨腱结合部产生应力集中，长期作用下形成骨质增生（骨刺）。</desc>
  <rect x="0" y="0" width="460" height="320" fill="#faf9f5" />

  <!-- 弓（骨骼） -->
  <path d="M 80 250 Q 230 90 380 250" fill="none" stroke="#333" stroke-width="14" stroke-linecap="round" />
  <!-- 弓的内侧描线，突出"骨"的形态 -->
  <path d="M 80 250 Q 230 96 380 250" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 5" />
  <text x="200" y="280" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">弓（骨骼，起支撑作用）</text>

  <!-- 弦（软组织） -->
  <path d="M 88 218 L 372 218" stroke="#1f6f8b" stroke-width="7" stroke-linecap="round" />
  <text x="230" y="206" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="middle">弦（软组织，提供张力）</text>

  <!-- 骨腱结合部：左侧 -->
  <circle cx="88" cy="218" r="7" fill="#c0392b" />
  <circle cx="88" cy="250" r="7" fill="#c0392b" />
  <line x1="88" y1="218" x2="88" y2="250" stroke="#c0392b" stroke-width="4" />
  <text x="66" y="175" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">应力集中点</text>
  <text x="60" y="196" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">（骨腱结合部）</text>

  <!-- 骨质增生（骨刺），右侧骨腱结合部 -->
  <path d="M 372 218 L 392 230 L 380 246 L 372 250 Z" fill="#c0392b" stroke="#333" stroke-width="2" />
  <text x="395" y="180" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">骨质增生</text>
  <text x="398" y="197" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">（骨刺，钙化新生骨）</text>

  <!-- 张力箭头 -->
  <line x1="88" y1="190" x2="88" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="372" y1="190" x2="372" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="165" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">弦的张力持续牵拉两端骨面</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#333" />
    </marker>
  </defs>
</svg>
