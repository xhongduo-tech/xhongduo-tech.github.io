<svg viewBox="0 0 420 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>机械搅拌式生物反应器（STR）示意图</title>
<desc>搅拌式发酵罐：顶部电机带动搅拌轴与两层涡轮桨，底部通入无菌空气经气体分布器分散为气泡，罐体带冷却夹套与 pH、溶氧探头，顶部有排气口。</desc>
<rect x="0" y="0" width="420" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333" font-size="14">
  <!-- 罐体 -->
  <rect x="110" y="80" width="200" height="250" rx="12" fill="none" stroke="#333" stroke-width="3"/>
  <!-- 冷却夹套 -->
  <rect x="96" y="96" width="228" height="218" rx="12" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="86" y="60" text-anchor="middle" fill="#1f6f8b" font-size="13">冷却夹套</text>
  <!-- 液面 -->
  <line x1="112" y1="270" x2="308" y2="270" stroke="#1f6f8b" stroke-width="2"/>
  <text x="200" y="265" text-anchor="middle" fill="#1f6f8b" font-size="13">液面</text>
  <!-- 电机 -->
  <rect x="180" y="40" width="40" height="28" rx="4" fill="#c0392b"/>
  <text x="200" y="62" text-anchor="middle" fill="#faf9f5" font-size="13">电机</text>
  <!-- 搅拌轴 -->
  <line x1="200" y1="68" x2="200" y2="310" stroke="#333" stroke-width="5"/>
  <!-- 上涡轮 -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="170" y1="150" x2="230" y2="150"/>
    <line x1="200" y1="128" x2="200" y2="172"/>
    <line x1="200" y1="130" x2="185" y2="150"/>
    <line x1="200" y1="130" x2="215" y2="150"/>
    <line x1="200" y1="170" x2="185" y2="150"/>
    <line x1="200" y1="170" x2="215" y2="150"/>
  </g>
  <text x="242" y="154" font-size="13">上涡轮桨</text>
  <!-- 下涡轮 -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="170" y1="240" x2="230" y2="240"/>
    <line x1="200" y1="218" x2="200" y2="262"/>
    <line x1="200" y1="220" x2="185" y2="240"/>
    <line x1="200" y1="220" x2="215" y2="240"/>
    <line x1="200" y1="260" x2="185" y2="240"/>
    <line x1="200" y1="260" x2="215" y2="240"/>
  </g>
  <text x="242" y="244" font-size="13">下涡轮桨</text>
  <!-- 气体分布器 -->
  <ellipse cx="200" cy="300" rx="42" ry="8" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="158" y1="300" x2="242" y2="300" stroke="#1f6f8b" stroke-width="2"/>
  <text x="200" y="322" text-anchor="middle" font-size="13">气体分布器（环形）</text>
  <!-- 进气 -->
  <line x1="200" y1="330" x2="200" y2="380" stroke="#333" stroke-width="3"/>
  <text x="200" y="400" text-anchor="middle" font-size="13">无菌空气入口</text>
  <!-- 排气 -->
  <line x1="300" y1="88" x2="320" y2="70" stroke="#333" stroke-width="3"/>
  <polygon points="320,70 314,74 318,62" fill="#333"/>
  <text x="336" y="70" font-size="13">排气口</text>
  <!-- 进料口 -->
  <line x1="120" y1="88" x2="104" y2="70" stroke="#333" stroke-width="3"/>
  <text x="58" y="66" font-size="13">进料口</text>
  <!-- 探头 -->
  <line x1="110" y1="200" x2="80" y2="200" stroke="#c0392b" stroke-width="3"/>
  <text x="58" y="204" font-size="13" fill="#c0392b">pH 探头</text>
  <line x1="310" y1="180" x2="340" y2="180" stroke="#c0392b" stroke-width="3"/>
  <text x="344" y="184" font-size="13" fill="#c0392b">溶氧探头</text>
  <!-- 挡板 -->
  <line x1="116" y1="120" x2="116" y2="258" stroke="#1f6f8b" stroke-width="3"/>
  <text x="60" y="120" font-size="13">挡板</text>
</g>
</svg>
