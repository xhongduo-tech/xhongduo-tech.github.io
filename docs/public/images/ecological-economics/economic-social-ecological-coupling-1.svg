<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>经济-社会-生态嵌套系统示意图</title>
  <desc>三个同心圆表示经济系统嵌入社会系统，社会系统嵌入生态系统；经济从生态系统输入低熵资源、输出高熵废物。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">经济—社会—生态嵌套系统</text>
  <circle cx="320" cy="250" r="195" fill="#e8f1f3" stroke="#1f6f8b" stroke-width="3"/>
  <text x="320" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">生态系统（Ecosphere）</text>
  <text x="150" y="112" text-anchor="middle" font-size="14" fill="#1f6f8b">太阳能 · 物质 · 生命支持</text>
  <circle cx="320" cy="250" r="130" fill="#f4efe6" stroke="#8a7a5c" stroke-width="3"/>
  <text x="320" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b5b3e">社会系统（Society）</text>
  <text x="470" y="196" text-anchor="middle" font-size="14" fill="#6b5b3e">制度 · 文化 · 产权</text>
  <circle cx="320" cy="250" r="70" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/>
  <text x="320" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">经济系统</text>
  <text x="320" y="272" text-anchor="middle" font-size="14" fill="#c0392b">市场 · 生产 · 消费</text>
  <line x1="90" y1="420" x2="238" y2="330" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="120" y="432" text-anchor="middle" font-size="14" fill="#1f6f8b">低熵资源输入</text>
  <line x1="550" y1="420" x2="402" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="522" y="432" text-anchor="middle" font-size="14" fill="#c0392b">高熵废物输出</text>
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
