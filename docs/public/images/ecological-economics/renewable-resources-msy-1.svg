<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <title>可再生资源的逻辑斯蒂增长曲线与最大可持续产量</title>
  <desc>横轴为资源存量 S，纵轴为自然增长率 G(S)；增长曲线是开口向下的抛物线，在 S 等于 K/2 处达到最大可持续产量 MSY，存量超过 K 后增长为负。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">可再生资源增长曲线：G(S) = rS(1 − S/K)</text>
  <line x1="60" y1="360" x2="580" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="360" x2="60" y2="40" stroke="#333" stroke-width="2"/>
  <text x="40" y="210" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 40 210)">增长率 G(S)</text>
  <text x="585" y="385" text-anchor="middle" font-size="15" fill="#333">资源存量 S</text>
  <path d="M 60,360 Q 310,-60 560,360" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <circle cx="310" cy="150" r="5" fill="#c0392b"/>
  <line x1="310" y1="150" x2="310" y2="360" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="310" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">MSY = rK/4</text>
  <text x="322" y="384" text-anchor="start" font-size="14" fill="#c0392b">S = K/2</text>
  <circle cx="560" cy="360" r="4" fill="#333"/>
  <text x="560" y="384" text-anchor="middle" font-size="14" fill="#333">K（环境容量）</text>
  <text x="180" y="205" text-anchor="middle" font-size="14" fill="#1f6f8b">可持续带：增长为正</text>
  <text x="470" y="330" text-anchor="middle" font-size="14" fill="#c0392b">S &gt; K：增长为负（耗竭）</text>
  <text x="120" y="80" text-anchor="middle" font-size="14" fill="#333">提取量 &lt; 增长量 → 存量维持</text>
  <text x="505" y="120" text-anchor="middle" font-size="14" fill="#333">提取量 &gt; 增长量 → 存量下降</text>
</svg>
