<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <title>宋明理学两大系对照：程朱理学与陆王心学</title>
  <desc>左列为程朱理学的理本论体系，右列为陆王心学的心本论体系，中间为两系的根本分歧，底部为共同的佛学刺激来源。</desc>
  <rect x="0" y="0" width="800" height="500" fill="#faf9f5" />
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#333" stroke-width="2" />

  <!-- 标题 -->
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">宋明理学两大系：本体在外，还是在内？</text>

  <!-- 左列：程朱理学 -->
  <rect x="30" y="70" width="340" height="330" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="3" />
  <text x="200" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f6f8b">程朱理学 ｜ 理本论</text>
  <line x1="50" y1="120" x2="350" y2="120" stroke="#1f6f8b" stroke-width="1.5" />
  <text x="200" y="150" text-anchor="middle" font-size="16" fill="#333">本体：理在气先，理为万物之宗</text>
  <text x="200" y="185" text-anchor="middle" font-size="16" fill="#333">工夫：格物穷理，逐物而求其理</text>
  <text x="200" y="220" text-anchor="middle" font-size="16" fill="#333">一理散为万殊：理一分殊</text>
  <text x="200" y="255" text-anchor="middle" font-size="16" fill="#333">境界：主敬涵养，即物明理</text>
  <text x="200" y="310" text-anchor="middle" font-size="15" fill="#666">读书穷理 · 经学正门 · 道问学</text>
  <rect x="110" y="340" width="180" height="40" rx="8" fill="#1f6f8b" />
  <text x="200" y="366" text-anchor="middle" font-size="16" fill="#fff">向外求理</text>

  <!-- 右列：陆王心学 -->
  <rect x="430" y="70" width="340" height="330" rx="12" fill="#fff" stroke="#c0392b" stroke-width="3" />
  <text x="600" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">陆王心学 ｜ 心本论</text>
  <line x1="450" y1="120" x2="750" y2="120" stroke="#c0392b" stroke-width="1.5" />
  <text x="600" y="150" text-anchor="middle" font-size="16" fill="#333">本体：心即理，宇宙便是吾心</text>
  <text x="600" y="185" text-anchor="middle" font-size="16" fill="#333">工夫：致良知，一念反省即是</text>
  <text x="600" y="220" text-anchor="middle" font-size="16" fill="#333">知行合一：真知即行</text>
  <text x="600" y="255" text-anchor="middle" font-size="16" fill="#333">境界：万物一体，良知现成</text>
  <text x="600" y="310" text-anchor="middle" font-size="15" fill="#666">反求诸己 · 简易直截 · 尊德性</text>
  <rect x="510" y="340" width="180" height="40" rx="8" fill="#c0392b" />
  <text x="600" y="366" text-anchor="middle" font-size="16" fill="#fff">向内求理</text>

  <!-- 中间分歧 -->
  <text x="400" y="190" text-anchor="middle" font-size="15" fill="#333">理</text>
  <text x="400" y="215" text-anchor="middle" font-size="15" fill="#333">＝</text>
  <text x="400" y="240" text-anchor="middle" font-size="15" fill="#333">心</text>
  <text x="400" y="280" text-anchor="middle" font-size="14" fill="#666">陆王：心即理</text>
  <text x="400" y="300" text-anchor="middle" font-size="14" fill="#666">程朱：理非心</text>

  <!-- 底部共同刺激 -->
  <rect x="30" y="420" width="740" height="60" rx="10" fill="#333" />
  <text x="400" y="448" text-anchor="middle" font-size="16" fill="#fff">共同刺激：佛学「心性论」与玄学「境界论」逼出儒学复兴</text>
  <text x="400" y="470" text-anchor="middle" font-size="14" fill="#ddd">两系皆以「成圣」为的，分歧只在：成圣的依据与道路在外（理）还是在内（心）</text>
</svg>
