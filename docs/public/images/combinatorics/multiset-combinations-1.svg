<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="sans-serif">
  <title>隔板法：星星与隔板的一一对应</title>
  <desc>把 6 个相同球用 3 块隔板分成 4 份，得到非负整数解 (2, 1, 3, 0)，即 2+1+3+0=6。</desc>
  <rect width="640" height="220" fill="#faf9f5" />
  <text x="320" y="36" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">隔板法：把 6 个相同球分成 4 份</text>

  <!-- Group 1: x1 = 2 -->
  <circle cx="70" cy="92" r="13" fill="#c0392b" />
  <circle cx="108" cy="92" r="13" fill="#c0392b" />
  <!-- Bar 1 -->
  <line x1="145" y1="70" x2="145" y2="114" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round" />
  <!-- Group 2: x2 = 1 -->
  <circle cx="188" cy="92" r="13" fill="#c0392b" />
  <!-- Bar 2 -->
  <line x1="225" y1="70" x2="225" y2="114" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round" />
  <!-- Group 3: x3 = 3 -->
  <circle cx="268" cy="92" r="13" fill="#c0392b" />
  <circle cx="306" cy="92" r="13" fill="#c0392b" />
  <circle cx="344" cy="92" r="13" fill="#c0392b" />
  <!-- Bar 3 (trailing, closes last empty box) -->
  <line x1="381" y1="70" x2="381" y2="114" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round" />
  <!-- Group 4: x4 = 0 (empty) -->

  <text x="320" y="158" text-anchor="middle" font-size="14" fill="#333">星 = 球，隔板 = 分界</text>

  <!-- Labels for each box -->
  <text x="89" y="190" text-anchor="middle" font-size="15" fill="#c0392b">x₁ = 2</text>
  <text x="207" y="190" text-anchor="middle" font-size="15" fill="#c0392b">x₂ = 1</text>
  <text x="323" y="190" text-anchor="middle" font-size="15" fill="#c0392b">x₃ = 3</text>
  <text x="415" y="190" text-anchor="middle" font-size="15" fill="#c0392b">x₄ = 0</text>

  <text x="530" y="205" text-anchor="middle" font-size="13" fill="#666">2 + 1 + 3 + 0 = 6</text>
</svg>
