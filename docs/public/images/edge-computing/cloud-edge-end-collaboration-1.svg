<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>云边端协同全景</title>
  <desc>数据协同、计算协同、模型协同三种协同流在云、边、端三层之间的流动示意。</desc>
  <rect width="640" height="460" fill="#faf9f5"/>
  <text x="20" y="36" font-size="20" fill="#333" font-weight="bold">云 - 边 - 端 协同全景</text>

  <!-- 云端 -->
  <rect x="180" y="56" width="280" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="86" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">云端 Cloud</text>
  <text x="320" y="112" font-size="13" fill="#555" text-anchor="middle">训练模型 · 全局调度 · 冷数据归档</text>
  <text x="320" y="130" font-size="13" fill="#555" text-anchor="middle">时间尺度：小时级</text>

  <!-- 边缘层 -->
  <rect x="180" y="196" width="280" height="84" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="226" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">边缘 Edge</text>
  <text x="320" y="252" font-size="13" fill="#555" text-anchor="middle">实时推理 · 缓存 · 本地决策</text>
  <text x="320" y="270" font-size="13" fill="#555" text-anchor="middle">时间尺度：毫秒 ~ 秒级</text>

  <!-- 端层 -->
  <rect x="180" y="336" width="280" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="366" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">端 End / Device</text>
  <text x="320" y="392" font-size="13" fill="#555" text-anchor="middle">感知 · 轻量处理 · 硬实时控制</text>
  <text x="320" y="410" font-size="13" fill="#555" text-anchor="middle">时间尺度：微秒 ~ 毫秒级</text>

  <!-- 云->边：模型下发 / 全局策略 -->
  <line x1="260" y1="140" x2="260" y2="192" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="252,190 260,200 268,190" fill="#c0392b"/>
  <text x="278" y="168" font-size="13" fill="#c0392b">模型下发 · 全局策略</text>

  <!-- 边->云：摘要 / 统计 / 训练样本 -->
  <line x1="380" y1="196" x2="380" y2="144" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="372,146 380,136 388,146" fill="#1f6f8b"/>
  <text x="392" y="172" font-size="13" fill="#1f6f8b">摘要 / 统计上送</text>

  <!-- 端->边：感知数据 / 请求 -->
  <line x1="260" y1="336" x2="260" y2="284" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="252,286 260,276 268,286" fill="#1f6f8b"/>
  <text x="278" y="312" font-size="13" fill="#1f6f8b">感知数据 / 推理请求</text>

  <!-- 边->端：推理结果 / 控制指令 -->
  <line x1="380" y1="280" x2="380" y2="332" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="372,330 380,340 388,330" fill="#c0392b"/>
  <text x="392" y="308" font-size="13" fill="#c0392b">结果 / 控制指令</text>

  <!-- 图例 -->
  <rect x="40" y="440" width="560" height="16" fill="#faf9f5"/>
  <line x1="40" y1="448" x2="70" y2="448" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="76" y="452" font-size="13" fill="#333">数据协同（上行感知，下行结果）</text>
  <line x1="300" y1="448" x2="330" y2="448" stroke="#c0392b" stroke-width="2.5"/>
  <text x="336" y="452" font-size="13" fill="#333">模型 / 计算协同（下行下发，上行汇总）</text>
</svg>
