<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <title>雕塑的两种基本成型方式：减法与加法</title>
  <desc>左图表示减法雕刻，从整块石料中凿出形体；右图表示加法塑造，在骨架上逐层添加泥土成型。</desc>
  <rect width="560" height="340" fill="#faf9f5"/>
  <text x="280" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">雕塑的两种基本成型方式</text>

  <line x1="312" y1="62" x2="312" y2="248" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 左：减法 石料块 -->
  <rect x="52" y="66" width="180" height="180" fill="#e3dccd" stroke="#333" stroke-width="2"/>
  <text x="142" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">石料</text>
  <!-- 形体：被凿出的头肩（青色，代表"剩下的形体"） -->
  <circle cx="142" cy="138" r="36" fill="#1f6f8b"/>
  <rect x="132" y="170" width="20" height="26" fill="#1f6f8b"/>
  <rect x="104" y="196" width="76" height="40" rx="12" fill="#1f6f8b"/>
  <!-- 被凿去的碎屑：右上角虚线小三角 -->
  <path d="M 216 96 l 14 12 l -4 -20 z" fill="#d9d2c7" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 228 128 l 6 -18 l 12 8 z" fill="#d9d2c7" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- 錾子 -->
  <line x1="248" y1="72" x2="222" y2="98" stroke="#333" stroke-width="2"/>
  <rect x="246" y="56" width="26" height="12" rx="2" transform="rotate(-55 259 62)" fill="#8a6d3b"/>
  <text x="142" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">减法 · 雕（carving）</text>
  <text x="142" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">去多余之料，形自石中出</text>

  <!-- 右：加法 骨架 + 泥 -->
  <line x1="430" y1="66" x2="430" y2="232" stroke="#333" stroke-width="2"/>
  <ellipse cx="430" cy="232" rx="30" ry="8" fill="#b8a98f" stroke="#333" stroke-width="1"/>
  <circle cx="430" cy="138" r="40" fill="#c98a4b"/>
  <ellipse cx="430" cy="150" rx="42" ry="26" fill="#c98a4b"/>
  <ellipse cx="414" cy="128" rx="18" ry="14" fill="#d9a05b"/>
  <ellipse cx="446" cy="144" rx="16" ry="12" fill="#d9a05b"/>
  <rect x="420" y="172" width="20" height="24" fill="#c98a4b"/>
  <rect x="392" y="196" width="76" height="38" rx="12" fill="#c98a4b"/>
  <text x="430" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">加法 · 塑（modeling）</text>
  <text x="430" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">从无到有，料逐层加</text>

  <text x="280" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">减法只减不补，加法可改可加——两种逻辑决定两种雕塑性格</text>
</svg>
