<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif">
  <title>燃烧三要素（火三角）</title>
  <desc>燃烧需要同时具备燃料、氧化剂（氧气）与点火源三个条件，三者缺一，燃烧即停止。</desc>
  <rect x="0" y="0" width="400" height="340" fill="#faf9f5"/>
  <polygon points="200,70 70,270 330,270" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="70" x2="200" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="200" cy="70" r="38" fill="#c0392b"/>
  <text x="200" y="60" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">燃料</text>
  <text x="200" y="80" font-size="13" fill="#fff" text-anchor="middle">可燃物</text>
  <circle cx="70" cy="270" r="38" fill="#1f6f8b"/>
  <text x="70" y="260" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">氧化剂</text>
  <text x="70" y="280" font-size="13" fill="#fff" text-anchor="middle">氧气</text>
  <circle cx="330" cy="270" r="38" fill="#d8a13a"/>
  <text x="330" y="260" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">点火源</text>
  <text x="330" y="280" font-size="13" fill="#fff" text-anchor="middle">热量</text>
  <text x="200" y="180" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">燃烧</text>
  <text x="200" y="205" font-size="14" fill="#c0392b" text-anchor="middle">三者缺一，火即熄灭</text>
</svg>
