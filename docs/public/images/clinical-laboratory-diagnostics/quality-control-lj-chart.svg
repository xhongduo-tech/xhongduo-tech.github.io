<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Levey–Jennings 室内质控图</title>
<desc id="desc">20 个批次的质控测定值围绕均值随机分布，第 15 批超出均值 +3 倍标准差，触发 1_3s 失控规则。</desc>
<rect width="640" height="400" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Levey–Jennings 室内质控图（示例）</text>
<g stroke="#e3e0d8" stroke-width="1">
  <line x1="88" y1="105" x2="588" y2="105"/>
  <line x1="88" y1="135" x2="588" y2="135"/>
  <line x1="88" y1="165" x2="588" y2="165"/>
  <line x1="88" y1="225" x2="588" y2="225"/>
  <line x1="88" y1="255" x2="588" y2="255"/>
  <line x1="88" y1="285" x2="588" y2="285"/>
</g>
<line x1="88" y1="195" x2="588" y2="195" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="596" y="109" font-family="sans-serif" font-size="13" fill="#333">+3SD</text>
<text x="596" y="139" font-family="sans-serif" font-size="13" fill="#1f6f8b">+2SD</text>
<text x="596" y="169" font-family="sans-serif" font-size="13" fill="#1f6f8b">+1SD</text>
<text x="596" y="199" font-family="sans-serif" font-size="13" fill="#c0392b">均值</text>
<text x="596" y="229" font-family="sans-serif" font-size="13" fill="#1f6f8b">−1SD</text>
<text x="596" y="259" font-family="sans-serif" font-size="13" fill="#1f6f8b">−2SD</text>
<text x="596" y="289" font-family="sans-serif" font-size="13" fill="#333">−3SD</text>
<polyline points="88,195 114,186 140,204 166,174 192,216 218,195 244,186 270,225 296,204 322,174 348,219 374,195 400,165 426,150 452,96 478,204 504,186 530,216 556,195 582,201" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<g fill="#1f6f8b">
  <circle cx="88" cy="195" r="3.5"/>
  <circle cx="114" cy="186" r="3.5"/>
  <circle cx="140" cy="204" r="3.5"/>
  <circle cx="166" cy="174" r="3.5"/>
  <circle cx="192" cy="216" r="3.5"/>
  <circle cx="218" cy="195" r="3.5"/>
  <circle cx="244" cy="186" r="3.5"/>
  <circle cx="270" cy="225" r="3.5"/>
  <circle cx="296" cy="204" r="3.5"/>
  <circle cx="322" cy="174" r="3.5"/>
  <circle cx="348" cy="219" r="3.5"/>
  <circle cx="374" cy="195" r="3.5"/>
  <circle cx="400" cy="165" r="3.5"/>
  <circle cx="426" cy="150" r="3.5"/>
  <circle cx="478" cy="204" r="3.5"/>
  <circle cx="504" cy="186" r="3.5"/>
  <circle cx="530" cy="216" r="3.5"/>
  <circle cx="556" cy="195" r="3.5"/>
  <circle cx="582" cy="201" r="3.5"/>
</g>
<circle cx="452" cy="96" r="6" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="452" y1="96" x2="500" y2="70" stroke="#c0392b" stroke-width="1.2"/>
<text x="502" y="66" font-family="sans-serif" font-size="13" fill="#c0392b">1₃s 违规</text>
<line x1="88" y1="330" x2="588" y2="330" stroke="#333" stroke-width="1.5"/>
<line x1="88" y1="330" x2="88" y2="320" stroke="#333"/>
<line x1="588" y1="330" x2="588" y2="320" stroke="#333"/>
<text x="88" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">1</text>
<text x="166" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">4</text>
<text x="244" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">7</text>
<text x="322" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">10</text>
<text x="400" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">13</text>
<text x="478" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">16</text>
<text x="556" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">19</text>
<text x="320" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">批次序号</text>
<text x="24" y="200" transform="rotate(-90 24 200)" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">测定值</text>
</svg>
