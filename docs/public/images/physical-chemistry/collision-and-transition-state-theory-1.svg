<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>反应势能剖面示意</title>
  <desc>反应坐标上的势能曲线：反应物谷底经过活化络合物（过渡态）鞍点到达产物谷底，标注正反应活化能 Ea、逆反应活化能 Ea' 与反应热 ΔH。</desc>
  <rect x="0" y="0" width="420" height="300" fill="#fff"/>
  <!-- axes -->
  <line x1="60" y1="260" x2="400" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="60" y2="20" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="286" text-anchor="middle" font-size="15" fill="#333">反应坐标</text>
  <text x="22" y="140" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 22 140)">势能</text>
  <!-- potential energy curve -->
  <path d="M 90 210 C 140 180, 190 90, 230 60 C 270 30, 320 120, 360 235" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <!-- reactant and product labels -->
  <text x="85" y="230" font-size="15" fill="#333">反应物</text>
  <text x="345" y="253" font-size="15" fill="#333">产物</text>
  <!-- transition state -->
  <circle cx="230" cy="60" r="5" fill="#c0392b"/>
  <text x="150" y="52" font-size="14" fill="#c0392b">过渡态（活化络合物）</text>
  <!-- Ea arrow -->
  <line x1="90" y1="210" x2="90" y2="60" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="97" y="140" font-size="13" fill="#c0392b">Ea</text>
  <!-- reverse Ea arrow -->
  <line x1="360" y1="235" x2="230" y2="60" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="295" y="150" font-size="13" fill="#c0392b">Ea′</text>
  <!-- dH arrow -->
  <line x1="90" y1="235" x2="360" y2="235" stroke="#666" stroke-width="1.2"/>
  <text x="210" y="250" text-anchor="middle" font-size="13" fill="#666">ΔH（反应热）</text>
</svg>
