<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>胶束截面示意</title>
  <desc>球形胶束的截面：亲水头基排列在球面朝外接触水，疏水尾链指向球心聚集成疏水内核。</desc>
  <rect x="0" y="0" width="380" height="240" fill="#fff"/>
  <text x="190" y="28" text-anchor="middle" font-size="16" fill="#333">胶束截面示意（球形胶束）</text>
  <!-- micelle body (hydrophobic core) -->
  <circle cx="190" cy="130" r="70" fill="#f2e7d0" stroke="#c0392b" stroke-width="1.5"/>
  <text x="190" y="126" text-anchor="middle" font-size="14" fill="#c0392b">疏水内核</text>
  <text x="190" y="144" text-anchor="middle" font-size="13" fill="#c0392b">（烃尾聚集）</text>
  <!-- hydrophilic heads on the surface -->
  <g fill="#1f6f8b">
    <circle cx="190" cy="60" r="8"/>
    <circle cx="222" cy="72" r="8"/>
    <circle cx="246" cy="98" r="8"/>
    <circle cx="254" cy="132" r="8"/>
    <circle cx="246" cy="166" r="8"/>
    <circle cx="222" cy="190" r="8"/>
    <circle cx="190" cy="200" r="8"/>
    <circle cx="158" cy="190" r="8"/>
    <circle cx="134" cy="166" r="8"/>
    <circle cx="126" cy="132" r="8"/>
    <circle cx="134" cy="98" r="8"/>
    <circle cx="158" cy="72" r="8"/>
  </g>
  <!-- hydrophobic tails pointing inward -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="190" y1="68" x2="190" y2="120"/>
    <line x1="222" y1="80" x2="206" y2="122"/>
    <line x1="246" y1="106" x2="214" y2="128"/>
    <line x1="246" y1="158" x2="214" y2="136"/>
    <line x1="222" y1="182" x2="206" y2="140"/>
    <line x1="158" y1="182" x2="174" y2="140"/>
    <line x1="134" y1="158" x2="166" y2="136"/>
    <line x1="134" y1="106" x2="166" y2="128"/>
    <line x1="158" y1="80" x2="174" y2="122"/>
  </g>
  <!-- labels -->
  <text x="95" y="220" font-size="13" fill="#1f6f8b">亲水头基（朝水）</text>
  <text x="268" y="220" font-size="13" fill="#c0392b">疏水尾链（朝内）</text>
</svg>
