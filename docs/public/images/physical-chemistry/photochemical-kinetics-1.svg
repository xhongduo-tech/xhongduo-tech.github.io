<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>雅布隆斯基能级图</title>
  <desc>分子能级图：基态 S0、激发单重态 S1/S2 与三重态 T1；标注吸收、内转换、荧光、系间窜越、磷光等跃迁。</desc>
  <rect x="0" y="0" width="420" height="320" fill="#fff"/>
  <!-- energy axis -->
  <line x1="60" y1="40" x2="60" y2="280" stroke="#333" stroke-width="1.5"/>
  <text x="24" y="160" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 24 160)">能量</text>
  <!-- singlet levels -->
  <line x1="120" y1="60" x2="210" y2="60" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="120" y1="130" x2="210" y2="130" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="120" y1="220" x2="210" y2="220" stroke="#1f6f8b" stroke-width="3"/>
  <text x="215" y="64" font-size="13" fill="#333">S2</text>
  <text x="215" y="134" font-size="13" fill="#333">S1</text>
  <text x="215" y="224" font-size="13" fill="#333">S0</text>
  <!-- triplet level -->
  <line x1="270" y1="140" x2="360" y2="140" stroke="#c0392b" stroke-width="3"/>
  <text x="365" y="144" font-size="13" fill="#333">T1</text>
  <!-- absorption arrows -->
  <line x1="140" y1="220" x2="140" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="146" y="180" font-size="12" fill="#c0392b">吸收</text>
  <line x1="170" y1="220" x2="170" y2="60" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="130" font-size="12" fill="#c0392b">吸收</text>
  <!-- internal conversion -->
  <path d="M 205 70 C 220 80, 220 120, 205 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="228" y="105" font-size="12" fill="#666">内转换</text>
  <!-- fluorescence -->
  <path d="M 130 130 C 110 150, 110 205, 130 220" stroke="#1f6f8b" stroke-width="1.5" fill="none" marker-end="url(#arrowC)"/>
  <text x="78" y="180" font-size="12" fill="#1f6f8b">荧光</text>
  <!-- intersystem crossing -->
  <path d="M 210 140 C 230 150, 260 150, 268 145" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="225" y="170" font-size="12" fill="#666">系间窜越</text>
  <!-- phosphorescence -->
  <path d="M 320 140 C 300 170, 280 215, 175 225" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>
  <text x="330" y="220" font-size="12" fill="#c0392b">磷光</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1f6f8b"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#666"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
</svg>
