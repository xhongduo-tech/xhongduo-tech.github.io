<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>李嘉图模型：两国生产可能性边界与贸易获益</title>
<desc>左右两图分别展示本国与外国在生产可能性边界上无贸易均衡，以及贸易后沿世界相对价格线实现的更优消费组合。</desc>
<rect width="700" height="330" fill="#faf9f5"/>
<g stroke="#333" stroke-width="2">
  <line x1="40" y1="280" x2="330" y2="280"/>
  <line x1="40" y1="280" x2="40" y2="40"/>
</g>
<g stroke="#1f6f8b" stroke-width="3">
  <line x1="40" y1="160" x2="280" y2="280"/>
</g>
<text x="20" y="150" font-size="14" fill="#1f6f8b" text-anchor="end">本国 PPF</text>
<text x="20" y="170" font-size="13" fill="#333" text-anchor="end">C + 2W = 24</text>
<circle cx="160" cy="220" r="5" fill="#c0392b"/>
<text x="128" y="235" font-size="13" fill="#c0392b">自给自足 (12, 6)</text>
<g stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4">
  <line x1="280" y1="280" x2="40" y2="40"/>
</g>
<circle cx="160" cy="160" r="5" fill="#c0392b"/>
<text x="100" y="150" font-size="13" fill="#c0392b">贸易后 (12, 12)</text>
<text x="300" y="298" font-size="14" fill="#333">本国：奶酪 Q_C（小时量）</text>
<text x="24" y="44" font-size="14" fill="#333">酒 Q_W</text>
<g stroke="#333" stroke-width="2">
  <line x1="400" y1="280" x2="690" y2="280"/>
  <line x1="400" y1="280" x2="400" y2="40"/>
</g>
<g stroke="#1f6f8b" stroke-width="3">
  <line x1="400" y1="40" x2="520" y2="280"/>
</g>
<text x="382" y="60" font-size="14" fill="#1f6f8b" text-anchor="end">外国 PPF</text>
<text x="382" y="78" font-size="13" fill="#333" text-anchor="end">2C* + W* = 24</text>
<circle cx="460" cy="160" r="5" fill="#c0392b"/>
<text x="470" y="172" font-size="13" fill="#c0392b">自给自足 (6, 12)</text>
<g stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4">
  <line x1="400" y1="40" x2="640" y2="280"/>
</g>
<circle cx="520" cy="160" r="5" fill="#c0392b"/>
<text x="470" y="150" font-size="13" fill="#c0392b">贸易后 (12, 12)</text>
<text x="660" y="298" font-size="14" fill="#333">外国：奶酪 Q_C*</text>
<text x="384" y="44" font-size="14" fill="#333">酒 Q_W*</text>
</svg>
