<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>货币政策三难选择（不可能三角）</title>
<desc>三个顶点分别是固定汇率、资本自由流动、货币政策独立性；每一条边对应同时实现两个目标时不得不放弃第三个的方案。</desc>
<rect width="640" height="480" fill="#faf9f5"/>
<polygon points="320,80 80,380 560,380" fill="#1f6f8b" fill-opacity="0.08" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="320" cy="80" r="6" fill="#c0392b"/>
<text x="320" y="56" font-size="16" fill="#c0392b" text-anchor="middle">固定汇率</text>
<circle cx="80" cy="380" r="6" fill="#c0392b"/>
<text x="80" y="414" font-size="16" fill="#c0392b" text-anchor="middle">资本自由流动</text>
<circle cx="560" cy="380" r="6" fill="#c0392b"/>
<text x="560" y="414" font-size="16" fill="#c0392b" text-anchor="middle">货币政策独立性</text>
<text x="195" y="200" font-size="15" fill="#333" text-anchor="middle">货币联盟 / 美元化</text>
<text x="195" y="222" font-size="14" fill="#666" text-anchor="middle">（香港、欧元区）</text>
<text x="320" y="432" font-size="15" fill="#333" text-anchor="middle">浮动汇率（美国、日本）</text>
<text x="460" y="222" font-size="15" fill="#333" text-anchor="middle">资本管制</text>
<text x="460" y="244" font-size="14" fill="#666" text-anchor="middle">（中国、2010 前）</text>
<text x="320" y="466" font-size="14" fill="#c0392b" text-anchor="middle">三者最多取其二：顶点的任意组合都对应一条边上的某种制度安排</text>
</svg>
