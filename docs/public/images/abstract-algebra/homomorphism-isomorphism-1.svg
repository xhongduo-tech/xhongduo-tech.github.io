<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <title>同态的可交换图表：先算后翻 = 先翻后算</title>
  <desc>左上框是输入有序对 (a, b)，右上框是翻译后的 (φ(a), φ(b))；左竖直箭头是原系统 G 中的运算 ·，右竖直箭头是目标系统 G′ 中的运算 ∗；水平箭头是同态 φ。先沿左、下两条边走，再沿上、右两条边走，结果都是 φ(a) ∗ φ(b)，说明 φ(a·b) = φ(a) ∗ φ(b)。</desc>
  <rect width="720" height="400" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">同态：先算后翻 = 先翻后算</text>

  <text x="185" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">原系统 G</text>
  <text x="535" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">目标系统 G′</text>

  <rect x="95" y="118" width="180" height="64" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="185" y="156" text-anchor="middle" font-size="16" fill="#333">(a, b)</text>

  <rect x="445" y="118" width="180" height="64" rx="8" fill="#1f6f8b" fill-opacity="0.10" stroke="#1f6f8b" stroke-width="2"/>
  <text x="535" y="156" text-anchor="middle" font-size="16" fill="#1f6f8b">(φ(a), φ(b))</text>

  <rect x="95" y="258" width="180" height="64" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="185" y="296" text-anchor="middle" font-size="16" fill="#333">a · b</text>

  <rect x="445" y="258" width="180" height="64" rx="8" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="2"/>
  <text x="535" y="296" text-anchor="middle" font-size="16" fill="#c0392b">φ(a) ∗ φ(b)</text>

  <line x1="285" y1="150" x2="435" y2="150" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="140" text-anchor="middle" font-size="15" fill="#1f6f8b">φ × φ</text>

  <line x1="285" y1="290" x2="435" y2="290" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="320" text-anchor="middle" font-size="15" fill="#1f6f8b">φ</text>

  <line x1="185" y1="192" x2="185" y2="248" stroke="#333" stroke-width="2" marker-end="url(#arrowink)"/>
  <text x="168" y="222" text-anchor="end" font-size="15" fill="#333" font-weight="bold">运算 ·</text>

  <line x1="535" y1="192" x2="535" y2="248" stroke="#333" stroke-width="2" marker-end="url(#arrowink)"/>
  <text x="552" y="222" text-anchor="start" font-size="15" fill="#333" font-weight="bold">运算 ∗</text>

  <text x="360" y="358" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">φ(a · b) = φ(a) ∗ φ(b)</text>
  <text x="360" y="382" text-anchor="middle" font-size="13" fill="#333">两条路径殊途同归，运算骨架被原样搬入 G′</text>
</svg>
