<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="14">
  <title>阶段-关卡（Stage-Gate）创新流程示意图</title>
  <desc>从创意产生到上市的五个阶段，每个阶段之间以关卡把关，形成漏斗式筛选。</desc>
  <rect x="0" y="0" width="720" height="300" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">阶段-关卡（Stage-Gate）流程</text>

  <!-- Stage boxes -->
  <g>
    <rect x="16" y="120" width="104" height="64" rx="8" fill="#1f6f8b"/>
    <text x="68" y="148" text-anchor="middle" fill="#fff" font-size="13">阶段1</text>
    <text x="68" y="166" text-anchor="middle" fill="#fff" font-size="13">创意产生</text>
  </g>
  <g>
    <rect x="168" y="120" width="104" height="64" rx="8" fill="#1f6f8b"/>
    <text x="220" y="148" text-anchor="middle" fill="#fff" font-size="13">阶段2</text>
    <text x="220" y="166" text-anchor="middle" fill="#fff" font-size="13">筛选立项</text>
  </g>
  <g>
    <rect x="320" y="120" width="104" height="64" rx="8" fill="#1f6f8b"/>
    <text x="372" y="148" text-anchor="middle" fill="#fff" font-size="13">阶段3</text>
    <text x="372" y="166" text-anchor="middle" fill="#fff" font-size="13">开发测试</text>
  </g>
  <g>
    <rect x="472" y="120" width="104" height="64" rx="8" fill="#1f6f8b"/>
    <text x="524" y="148" text-anchor="middle" fill="#fff" font-size="13">阶段4</text>
    <text x="524" y="166" text-anchor="middle" fill="#fff" font-size="13">市场测试</text>
  </g>
  <g>
    <rect x="600" y="120" width="104" height="64" rx="8" fill="#c0392b"/>
    <text x="652" y="148" text-anchor="middle" fill="#fff" font-size="13">阶段5</text>
    <text x="652" y="166" text-anchor="middle" fill="#fff" font-size="13">上市与反馈</text>
  </g>

  <!-- Gate diamonds -->
  <polygon points="140,152 156,120 172,152 156,184" fill="#333"/>
  <text x="156" y="110" text-anchor="middle" fill="#333" font-size="12">关卡1</text>
  <polygon points="292,152 308,120 324,152 308,184" fill="#333"/>
  <text x="308" y="110" text-anchor="middle" fill="#333" font-size="12">关卡2</text>
  <polygon points="444,152 460,120 476,152 460,184" fill="#333"/>
  <text x="460" y="110" text-anchor="middle" fill="#333" font-size="12">关卡3</text>
  <polygon points="596,152 612,120 628,152 612,184" fill="#333"/>
  <text x="612" y="110" text-anchor="middle" fill="#333" font-size="12">关卡4</text>

  <!-- Flow arrows -->
  <path d="M16 96 H704" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="360" y="84" text-anchor="middle" fill="#333" font-size="13">创意流：数量由多到少，风险由高到低</text>

  <!-- Labels for go/kill -->
  <text x="156" y="238" text-anchor="middle" fill="#333" font-size="13">放行/终止</text>
  <text x="308" y="238" text-anchor="middle" fill="#333" font-size="13">放行/终止</text>
  <text x="460" y="238" text-anchor="middle" fill="#333" font-size="13">放行/终止</text>
  <text x="612" y="238" text-anchor="middle" fill="#333" font-size="13">放行/终止</text>
  <text x="360" y="272" text-anchor="middle" fill="#1f6f8b" font-size="13">每个关卡按既定标准做 Go / Kill / Hold 决策，资源随关卡递减收敛</text>
</svg>
