<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>历代行政区划层级演变示意</title>
<desc>秦汉至明清五组朝代的一、二、三级政区与基层县的组织层级对比。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<text x="320" y="26" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">中国历代行政区划层级演变示意</text>

<!-- 列头 -->
<text x="96"  y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">秦汉</text>
<text x="224" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">魏晋南北朝</text>
<text x="352" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">隋唐</text>
<text x="480" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">宋</text>
<text x="592" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">元明清</text>

<!-- 一级政区 -->
<rect x="46"  y="78"  width="100" height="40" rx="6" fill="#1f6f8b"/><text x="96"  y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">郡</text>
<rect x="174" y="78"  width="100" height="40" rx="6" fill="#1f6f8b"/><text x="224" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">州（渐分多）</text>
<rect x="302" y="78"  width="100" height="40" rx="6" fill="#1f6f8b"/><text x="352" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">道 / 府州</text>
<rect x="430" y="78"  width="100" height="40" rx="6" fill="#1f6f8b"/><text x="480" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">路</text>
<rect x="542" y="78"  width="100" height="40" rx="6" fill="#1f6f8b"/><text x="592" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">省</text>
<text x="320" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">一级政区（高层次，多由监察区演变而来）</text>

<!-- 二级政区 -->
<rect x="46"  y="160" width="100" height="40" rx="6" fill="#7a6a3a"/>
<rect x="174" y="160" width="100" height="40" rx="6" fill="#7a6a3a"/><text x="224" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">郡</text>
<rect x="302" y="160" width="100" height="40" rx="6" fill="#7a6a3a"/><text x="352" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">县</text>
<rect x="430" y="160" width="100" height="40" rx="6" fill="#7a6a3a"/><text x="480" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">州府</text>
<rect x="542" y="160" width="100" height="40" rx="6" fill="#7a6a3a"/><text x="592" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">府州</text>
<text x="96"  y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">县</text>
<text x="320" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a6a3a">二级政区</text>

<!-- 基层 -->
<rect x="46"  y="242" width="100" height="40" rx="6" fill="#8a8a8a"/>
<rect x="174" y="242" width="100" height="40" rx="6" fill="#8a8a8a"/>
<rect x="302" y="242" width="100" height="40" rx="6" fill="#8a8a8a"/>
<rect x="430" y="242" width="100" height="40" rx="6" fill="#8a8a8a"/>
<rect x="542" y="242" width="100" height="40" rx="6" fill="#8a8a8a"/>
<text x="96"  y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">乡亭里</text>
<text x="224" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">县（乡里）</text>
<text x="352" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">乡里</text>
<text x="480" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">县（乡里）</text>
<text x="592" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">县（保甲）</text>
<text x="320" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a8a8a">基层治理（县以下非正式政区）</text>

<!-- 连线 -->
<line x1="96"  y1="118" x2="96"  y2="160" stroke="#333" stroke-width="2"/>
<line x1="224" y1="118" x2="224" y2="160" stroke="#333" stroke-width="2"/>
<line x1="352" y1="118" x2="352" y2="160" stroke="#333" stroke-width="2"/>
<line x1="480" y1="118" x2="480" y2="160" stroke="#333" stroke-width="2"/>
<line x1="592" y1="118" x2="592" y2="160" stroke="#333" stroke-width="2"/>
<line x1="96"  y1="200" x2="96"  y2="242" stroke="#333" stroke-width="2"/>
<line x1="224" y1="200" x2="224" y2="242" stroke="#333" stroke-width="2"/>
<line x1="352" y1="200" x2="352" y2="242" stroke="#333" stroke-width="2"/>
<line x1="480" y1="200" x2="480" y2="242" stroke="#333" stroke-width="2"/>
<line x1="592" y1="200" x2="592" y2="242" stroke="#333" stroke-width="2"/>

<text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">核心趋势：层级在「两级—三级」间摆动，「县」始终是最稳定的基层政区</text>
<text x="320" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">注：隋唐「道」初为监察区，宋「路」、汉「州」亦由监察区演变为政区</text>
</svg>
