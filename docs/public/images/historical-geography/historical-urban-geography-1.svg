<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>北京城址迁示意图</title>
<desc>蓟城、金中都、元大都、明清北京四代城址的相对位置与水系关系示意。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<text x="320" y="26" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">北京城址迁示意（非精确比例）</text>

<!-- 蓟城 -->
<rect x="90"  y="290" width="80" height="55" rx="4" fill="#b8c9b3"/>
<text x="130" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">蓟城</text>
<text x="130" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">春秋战国—金</text>

<!-- 金中都 -->
<rect x="150" y="225" width="130" height="80" rx="4" fill="#c9c28f"/>
<text x="215" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">金中都</text>
<text x="215" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">扩建蓟城（1153）</text>

<!-- 元大都 -->
<rect x="290" y="80"  width="210" height="190" rx="4" fill="#e6c9a8"/>
<text x="395" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">元大都（1267 建）</text>
<text x="395" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">在蓟城东北另筑新城</text>
<text x="395" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">积水潭水系（通惠河）</text>

<!-- 明清北京 -->
<rect x="330" y="160" width="160" height="100" rx="4" fill="#e8a89b" stroke="#c0392b" stroke-width="2"/>
<text x="410" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">明清北京</text>
<text x="410" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">在元大都基础上南移</text>

<!-- 水系 -->
<path d="M 120 300 Q 150 285 170 300 Q 190 315 215 305" stroke="#1f6f8b" stroke-width="4" fill="none"/>
<text x="95"  y="330" font-family="sans-serif" font-size="13" fill="#1f6f8b">莲花池水系</text>
<path d="M 330 100 Q 380 90 430 105 Q 470 118 500 110" stroke="#1f6f8b" stroke-width="4" fill="none"/>
<text x="470" y="95" font-family="sans-serif" font-size="13" fill="#1f6f8b">高梁河水系</text>

<!-- 迁移箭头 -->
<path d="M 205 230 Q 240 200 300 190" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
<polygon points="300,190 292,194 295,184" fill="#c0392b"/>
<path d="M 380 150 Q 385 120 395 100" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
<polygon points="395,100 393,109 401,106" fill="#c0392b"/>

<text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">城址由西南向东北迁移，关键变量是「水源」：蓟城仰莲花池水系，</text>
<text x="320" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">元大都改倚高梁河—积水潭水系，北京「以水定城」的脉络由此展开。</text>
</svg>
