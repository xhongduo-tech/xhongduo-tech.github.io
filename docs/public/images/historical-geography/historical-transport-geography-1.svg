<svg viewBox="0 0 640 430" width="640" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>中国历史主要交通路线示意</title>
<desc>示意图展示长安为中心的丝绸之路、京杭大运河、黄河长江水道与主要城邑的相对布局。</desc>
<rect x="0" y="0" width="640" height="430" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">中国历史主要交通路线示意</text>
<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">（相对方位示意，非精确比例）</text>

<!-- 陆地底 -->
<path d="M 30 80 Q 150 60 340 70 Q 520 60 610 90 Q 620 200 600 300 Q 580 390 470 400 Q 300 410 140 400 Q 40 390 30 300 Z" fill="#f3eedd"/>

<!-- 黄河 -->
<path d="M 40 205 Q 140 215 200 240 Q 260 260 340 265 Q 430 262 560 245 Q 590 240 615 235" stroke="#7db0c4" stroke-width="6" fill="none"/>
<text x="480" y="232" font-family="sans-serif" font-size="13" fill="#1f6f8b">黄河</text>

<!-- 长江 -->
<path d="M 40 340 Q 160 360 260 355 Q 380 345 500 350 Q 560 352 615 348" stroke="#7db0c4" stroke-width="6" fill="none"/>
<text x="250" y="380" font-family="sans-serif" font-size="13" fill="#1f6f8b">长江</text>

<!-- 丝绸之路 -->
<path d="M 205 235 Q 150 195 100 170 Q 60 150 40 120" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="9 5"/>
<polygon points="40,120 46,128 34,128" fill="#c0392b"/>
<text x="130" y="148" font-family="sans-serif" font-size="13" fill="#c0392b">丝绸之路（河西走廊→西域）</text>

<!-- 京杭大运河 -->
<path d="M 320 88 Q 330 120 340 150 Q 350 190 350 220 Q 350 260 360 290 Q 370 315 390 330" stroke="#7a6a3a" stroke-width="5" fill="none"/>
<polygon points="390,330 383,333 386,323" fill="#7a6a3a"/>
<text x="345" y="118" font-family="sans-serif" font-size="13" fill="#7a6a3a">京杭大运河</text>

<!-- 驿道（关中—中原） -->
<path d="M 220 248 L 275 252" stroke="#8a8a8a" stroke-width="3" fill="none" stroke-dasharray="4 4"/>

<!-- 城邑 -->
<circle cx="205" cy="235" r="5" fill="#333"/><text x="180" y="225" font-family="sans-serif" font-size="14" fill="#333">长安</text>
<circle cx="275" cy="252" r="5" fill="#333"/><text x="260" y="245" font-family="sans-serif" font-size="14" fill="#333">洛阳</text>
<circle cx="320" cy="88" r="5" fill="#333"/><text x="300" y="78" font-family="sans-serif" font-size="14" fill="#333">北京</text>
<circle cx="350" cy="270" r="5" fill="#333"/><text x="330" y="300" font-family="sans-serif" font-size="14" fill="#333">扬州</text>
<circle cx="390" cy="330" r="5" fill="#333"/><text x="375" y="322" font-family="sans-serif" font-size="14" fill="#333">杭州</text>
<circle cx="400" cy="385" r="5" fill="#333"/><text x="385" y="405" font-family="sans-serif" font-size="14" fill="#333">广州</text>

<!-- 图例 -->
<rect x="460" y="75" width="165" height="95" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="470" y="95" font-family="sans-serif" font-size="13" fill="#333" font-weight="bold">图例</text>
<line x1="470" y1="112" x2="500" y2="112" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5"/>
<text x="508" y="116" font-family="sans-serif" font-size="13" fill="#333">陆路（丝路 / 驿道）</text>
<line x1="470" y1="132" x2="500" y2="132" stroke="#7a6a3a" stroke-width="4"/>
<text x="508" y="136" font-family="sans-serif" font-size="13" fill="#333">运河</text>
<line x1="470" y1="152" x2="500" y2="152" stroke="#7db0c4" stroke-width="6"/>
<text x="508" y="156" font-family="sans-serif" font-size="13" fill="#333">自然水道（河 / 江）</text>
</svg>
