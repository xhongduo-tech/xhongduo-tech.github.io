<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>HGIS 数据分层与时间查询示意</title>
<desc>历史地理信息系统将现代底图与多期历史图层按时间维度组织，支持空间查询与时间切片。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<text x="320" y="26" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">HGIS：时间维度的地理信息系统</text>

<!-- 图层堆叠 -->
<rect x="70"  y="70"  width="260" height="50" rx="6" fill="#e8a89b"/>
<text x="200" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">历史聚落 / 交通图层</text>
<rect x="80"  y="128" width="250" height="50" rx="6" fill="#b8c9b3"/>
<text x="205" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">历史水系 / 地貌图层</text>
<rect x="90"  y="186" width="240" height="50" rx="6" fill="#e6c9a8"/>
<text x="210" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">历史政区图层（谭图数字化）</text>
<rect x="100" y="244" width="230" height="50" rx="6" fill="#cfe0ea"/>
<text x="215" y="272" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">现代底图（地形 / 行政）</text>

<!-- 时间轴 -->
<line x1="70" y1="340" x2="380" y2="340" stroke="#333" stroke-width="3"/>
<polygon points="380,340 372,336 372,344" fill="#333"/>
<text x="90" y="330" font-family="sans-serif" font-size="14" fill="#333">公元前</text>
<text x="310" y="330" font-family="sans-serif" font-size="14" fill="#333">公元后</text>
<text x="225" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">时间轴：每个图层可挂载「起止年代」属性，实现时间切片</text>

<!-- 查询框 -->
<rect x="430" y="90" width="180" height="120" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="520" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">空间查询</text>
<text x="520" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">例：「公元 1100 年</text>
<text x="520" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">开封城的政区 +</text>
<text x="520" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">水系 + 人口」</text>

<path d="M 330 130 Q 390 110 430 115" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<polygon points="430,115 422,114 425,123" fill="#1f6f8b"/>
<path d="M 330 145 Q 390 145 428 145" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<polygon points="428,145 420,141 420,149" fill="#1f6f8b"/>
<path d="M 330 165 Q 380 175 420 175" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<polygon points="420,175 412,171 413,179" fill="#1f6f8b"/>

<text x="520" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">输出</text>
<rect x="430" y="265" width="180" height="55" rx="6" fill="#f7e8e4" stroke="#c0392b" stroke-width="2"/>
<text x="520" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">叠加图层 + 统计表</text>
<text x="520" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（含年代、属性字段）</text>
<path d="M 520 210 Q 520 235 520 260" stroke="#c0392b" stroke-width="3" fill="none"/>
<polygon points="520,260 516,252 524,252" fill="#c0392b"/>

<text x="320" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">核心：把「空间 + 时间 + 属性」组织成可查询的数据模型，历史地理由此可计算。</text>
</svg>
