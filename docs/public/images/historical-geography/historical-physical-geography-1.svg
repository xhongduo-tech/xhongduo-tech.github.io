<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>黄河下游历代改道示意</title>
<desc>华北平原上黄河三条历史河道（西汉北流故道、南宋夺淮故道、现行河道）与悬河剖面示意。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">黄河下游历代河道改道示意图（约公元元年前后至现代）</text>

<!-- 左侧高地：太行山/黄土高原边缘 -->
<rect x="20" y="70" width="70" height="300" fill="#dfe6dd"/>
<text x="55" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333" transform="rotate(-90 55 225)">太行山麓高地</text>

<!-- 渤海：右侧 -->
<path d="M 540 70 Q 610 90 610 180 Q 610 340 520 370 L 540 370 L 620 370 L 620 70 Z" fill="#cfe0ea"/>
<text x="580" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">渤海</text>

<!-- 华北平原底 -->
<rect x="90" y="70" width="450" height="300" fill="#f3eedd"/>

<!-- 西汉故道（约公元前602年前后至王莽） -->
<path d="M 90 150 Q 220 140 300 170 Q 380 200 420 240 Q 470 290 540 300" stroke="#1f6f8b" stroke-width="4" fill="none"/>
<text x="230" y="125" font-family="sans-serif" font-size="13" fill="#1f6f8b">西汉故道：东北流，经今河北入渤海</text>

<!-- 夺淮故道（南宋至清咸丰，1128—1855） -->
<path d="M 90 210 Q 210 200 280 230 Q 330 260 380 300 Q 420 340 470 380" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="8 5"/>
<text x="120" y="255" font-family="sans-serif" font-size="13" fill="#c0392b">南宋夺淮故道：东南流，经泗水入淮、入黄海</text>

<!-- 现行河道（1855 铜瓦厢决口北流） -->
<path d="M 90 260 Q 200 250 260 280 Q 330 315 390 340 Q 470 360 540 355" stroke="#7a6a3a" stroke-width="4" fill="none"/>
<text x="300" y="385" font-family="sans-serif" font-size="13" fill="#7a6a3a">现行河道（1855 年北徙至今）</text>

<!-- 悬河剖面插图 -->
<rect x="430" y="95" width="190" height="120" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="525" y="113" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333" font-weight="bold">悬河剖面</text>
<line x1="445" y1="195" x2="605" y2="195" stroke="#8a5a2b" stroke-width="3"/>
<line x1="460" y1="155" x2="590" y2="155" stroke="#1f6f8b" stroke-width="5"/>
<line x1="450" y1="155" x2="450" y2="195" stroke="#c0392b" stroke-width="4"/>
<line x1="600" y1="155" x2="600" y2="195" stroke="#c0392b" stroke-width="4"/>
<text x="525" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">地面线</text>
<text x="525" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">河床高出两岸</text>
<text x="455" y="210" font-family="sans-serif" font-size="12" fill="#c0392b">堤</text>
<text x="595" y="210" font-family="sans-serif" font-size="12" fill="#c0392b">堤</text>
<text x="525" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">地面</text>
</svg>
