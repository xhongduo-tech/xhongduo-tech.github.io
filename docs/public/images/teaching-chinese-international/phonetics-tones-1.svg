<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>普通话四声五度标记法示意图</title>
<desc>四幅图分别表示阴平（55 高平）、阳平（35 中升）、上声（214 降升）、去声（51 全降）的音高走势，纵轴为五度音高。</desc>
<rect width="640" height="360" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">普通话四声：五度标记法</text>

<!-- 纵轴刻度线 -->
<line x1="60" y1="40" x2="600" y2="40" stroke="#d8d4cd" stroke-width="1"/>
<line x1="60" y1="100" x2="600" y2="100" stroke="#d8d4cd" stroke-width="1"/>
<line x1="60" y1="160" x2="600" y2="160" stroke="#d8d4cd" stroke-width="1"/>
<line x1="60" y1="220" x2="600" y2="220" stroke="#d8d4cd" stroke-width="1"/>
<line x1="60" y1="280" x2="600" y2="280" stroke="#d8d4cd" stroke-width="1"/>
<text x="48" y="45" text-anchor="end" font-family="sans-serif" font-size="14" fill="#666">5</text>
<text x="48" y="105" text-anchor="end" font-family="sans-serif" font-size="14" fill="#666">4</text>
<text x="48" y="165" text-anchor="end" font-family="sans-serif" font-size="14" fill="#666">3</text>
<text x="48" y="225" text-anchor="end" font-family="sans-serif" font-size="14" fill="#666">2</text>
<text x="48" y="285" text-anchor="end" font-family="sans-serif" font-size="14" fill="#666">1</text>
<text x="56" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">音高（低→高）</text>

<!-- 阴平 55 -->
<path d="M60 40 L195 40" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="60" cy="40" r="4" fill="#c0392b"/>
<circle cx="195" cy="40" r="4" fill="#c0392b"/>
<text x="127" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">阴平 55</text>
<text x="127" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">mā 妈</text>

<!-- 阳平 35 -->
<path d="M195 160 L330 40" stroke="#1f6f8b" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="195" cy="160" r="4" fill="#1f6f8b"/>
<circle cx="330" cy="40" r="4" fill="#1f6f8b"/>
<text x="262" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">阳平 35</text>
<text x="262" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">má 麻</text>

<!-- 上声 214 -->
<path d="M330 220 L397 280 L465 100" stroke="#d68910" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="220" r="4" fill="#d68910"/>
<circle cx="397" cy="280" r="4" fill="#d68910"/>
<circle cx="465" cy="100" r="4" fill="#d68910"/>
<text x="397" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#d68910" font-weight="bold">上声 214</text>
<text x="397" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">mǎ 马</text>

<!-- 去声 51 -->
<path d="M465 40 L600 280" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="465" cy="40" r="4" fill="#333"/>
<circle cx="600" cy="280" r="4" fill="#333"/>
<text x="532" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">去声 51</text>
<text x="532" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">mà 骂</text>

<line x1="60" y1="280" x2="600" y2="280" stroke="#999" stroke-width="2"/>
</svg>
