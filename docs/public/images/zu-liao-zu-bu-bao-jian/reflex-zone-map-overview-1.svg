<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640" role="img" aria-labelledby="title desc">
  <title id="title">足底反射区三分区示意</title>
  <desc id="desc">左足足底面的反射区三分区示意：趾部为头部与感觉器官区，前掌为胸腔脏器区，足弓为腹腔脏器区，足跟为盆腔与泌尿生殖区。</desc>
  <rect width="440" height="640" fill="#faf9f5"/>
  <!-- 外侧小趾 / 内侧大趾 标注基线 -->
  <text x="20" y="50" font-family="sans-serif" font-size="15" fill="#1f6f8b">内侧（大趾侧）</text>
  <text x="270" y="50" font-family="sans-serif" font-size="15" fill="#1f6f8b">外侧（小趾侧）</text>
  <!-- 足轮廓（左足，足尖朝上） -->
  <path d="M232,70 C215,62 196,60 180,64 C160,70 148,86 142,108 C133,142 128,180 126,230 C124,290 122,350 126,420 C130,490 138,540 156,570 C168,588 184,596 200,598 C216,600 232,596 246,586 C262,572 272,548 276,518 C281,480 282,430 280,370 C278,300 274,230 270,170 C267,120 255,86 232,70 Z" fill="#f5eee0" stroke="#333" stroke-width="2.5"/>
  <!-- 五趾线 -->
  <path d="M150,100 C160,70 178,58 200,58 L200,58 C188,62 178,72 172,86 Z" fill="#f5eee0" stroke="#333" stroke-width="2"/>
  <path d="M200,58 L210,55 C220,54 232,58 240,66 L240,78 C230,64 214,58 200,58 Z" fill="#f5eee0" stroke="#333" stroke-width="2"/>
  <!-- 分区线：头胸界（跖骨头连线） -->
  <path d="M136,190 C160,170 200,162 262,172 C288,176 296,186 292,196 C276,186 240,180 200,180 C170,180 150,184 136,190 Z" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- 分区线：胸腹界 -->
  <path d="M128,330 C160,300 210,290 278,302 C296,306 302,318 296,330 C268,314 220,308 180,316 C162,320 144,326 128,330 Z" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- 分区线：腹盆腔界 -->
  <path d="M126,460 C150,436 190,426 246,432 C272,436 280,448 274,460 C252,448 210,444 172,450 C156,452 140,456 126,460 Z" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- 涌泉/肾反射区 -->
  <circle cx="205" cy="300" r="12" fill="#c0392b" opacity="0.85"/>
  <text x="224" y="304" font-family="sans-serif" font-size="14" fill="#c0392b">涌泉／肾反射区</text>
  <!-- 分区标签 -->
  <text x="60" y="140" font-family="sans-serif" font-size="16" fill="#333">头部与</text>
  <text x="60" y="160" font-family="sans-serif" font-size="16" fill="#333">感觉器官区</text>
  <text x="60" y="255" font-family="sans-serif" font-size="16" fill="#333">胸腔脏器区</text>
  <text x="60" y="385" font-family="sans-serif" font-size="16" fill="#333">腹腔脏器区</text>
  <text x="60" y="525" font-family="sans-serif" font-size="16" fill="#333">盆腔与</text>
  <text x="60" y="545" font-family="sans-serif" font-size="16" fill="#333">泌尿生殖区</text>
  <!-- 基准线标注 -->
  <text x="70" y="200" font-family="sans-serif" font-size="14" fill="#1f6f8b">跖骨头连线（头—胸界）</text>
  <text x="70" y="330" font-family="sans-serif" font-size="14" fill="#1f6f8b">胸—腹界</text>
  <text x="70" y="468" font-family="sans-serif" font-size="14" fill="#1f6f8b">腹—盆腔界</text>
</svg>
