<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>CT 螺旋扫描螺距示意</title>
  <desc>螺旋 CT 扫描时，X 线源绕人体连续旋转，检查床同时匀速进床，X 线焦点在人体表面扫出一条螺旋线；螺距等于每旋转一圈的进床距离除以扫描准直宽度。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">CT 螺旋扫描：旋转 + 进床 = 螺旋</text>
  <circle cx="150" cy="210" r="130" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="150" cy="210" r="96" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="150" y="120" text-anchor="middle" font-size="14" fill="#333">机架（旋转）</text>
  <path d="M 150 80 A 130 130 0 0 1 280 210" fill="none" stroke="#c0392b" stroke-width="6"/>
  <polygon points="296,214 278,214 285,232" fill="#c0392b"/>
  <text x="300" y="120" font-size="14" fill="#c0392b">X 线源旋转方向</text>
  <rect x="52" y="198" width="196" height="24" rx="4" fill="#f0e6d8" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="215" text-anchor="middle" font-size="14" fill="#333">检查床</text>
  <rect x="48" y="196" width="204" height="28" rx="5" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="320" text-anchor="middle" font-size="14" fill="#333">螺旋线：X 线源相对人体扫出的轨迹</text>
  <path d="M 320 214 C 360 214 360 200 400 200 S 440 214 480 214 S 520 200 560 200" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="574,200 558,196 558,204" fill="#1f6f8b"/>
  <text x="470" y="185" text-anchor="middle" font-size="14" fill="#1f6f8b">进床方向</text>
  <line x1="330" y1="270" x2="560" y2="270" stroke="#333" stroke-width="1.5"/>
  <line x1="330" y1="262" x2="330" y2="278" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="262" x2="560" y2="278" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="296" text-anchor="middle" font-size="14" fill="#333">每旋转一圈，进床距离 d</text>
  <line x1="310" y1="330" x2="470" y2="330" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="352" text-anchor="middle" font-size="14" fill="#333">螺距 p = d / 准直宽度 T</text>
</svg>
