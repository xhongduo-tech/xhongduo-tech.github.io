<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>T1 与 T2 弛豫曲线</title>
  <desc>射频脉冲停止后，纵向磁化沿 T1 指数恢复至平衡值，横向磁化沿 T2 指数衰减至零；T1 与 T2 是描述 MRI 信号对比度的两个时间常数。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold">射频脉冲后：两种弛豫同时进行</text>
  <text x="160" y="58" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">T1 纵向弛豫（恢复）</text>
  <text x="480" y="58" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">T2 横向弛豫（衰减）</text>
  <line x1="70" y1="280" x2="290" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="70" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="120" x2="290" y2="120" stroke="#333" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="64" y="124" text-anchor="end" font-size="14" fill="#333">M0</text>
  <text x="290" y="298" text-anchor="end" font-size="14" fill="#333">时间</text>
  <path d="M 70 280 C 120 260 160 210 200 165 C 235 135 265 124 290 120" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="215" y1="280" x2="215" y2="150" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="218" y="296" font-size="14" fill="#1f6f8b">t = T1（约恢复 63%）</text>
  <line x1="390" y1="280" x2="590" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="390" y1="280" x2="390" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="390" y1="120" x2="590" y2="120" stroke="#333" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="384" y="124" text-anchor="end" font-size="14" fill="#333">M0</text>
  <text x="590" y="298" text-anchor="end" font-size="14" fill="#333">时间</text>
  <path d="M 390 120 C 420 135 450 175 480 215 C 515 245 555 262 590 268" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="495" y1="280" x2="495" y2="200" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="495" y="296" text-anchor="middle" font-size="14" fill="#c0392b">t = T2（衰减到约 37%）</text>
  <text x="320" y="336" text-anchor="middle" font-size="14" fill="#333">长 T1/T2 的组织在对应加权图上更亮（详见正文）</text>
</svg>
