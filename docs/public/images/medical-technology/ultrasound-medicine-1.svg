<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>超声多普勒测量角度示意</title>
  <desc>超声束以夹角 theta 射向血管，血流沿血管方向流动；多普勒频移正比于血流速度在超声束方向上的投影 v 乘 cos theta。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" fill="#333" font-weight="bold">多普勒频移：只测"朝向探头"的速度分量</text>
  <rect x="270" y="52" width="100" height="26" rx="4" fill="#1f6f8b"/>
  <text x="320" y="69" text-anchor="middle" font-size="14" fill="#fff">探头（换能器）</text>
  <line x1="320" y1="78" x2="320" y2="170" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="320,178 314,164 326,164" fill="#1f6f8b"/>
  <text x="338" y="130" font-size="14" fill="#1f6f8b">超声束 f0</text>
  <line x1="120" y1="200" x2="520" y2="200" stroke="#333" stroke-width="4"/>
  <line x1="120" y1="248" x2="520" y2="248" stroke="#333" stroke-width="4"/>
  <text x="110" y="228" text-anchor="end" font-size="14" fill="#333">血管壁</text>
  <line x1="300" y1="224" x2="440" y2="224" stroke="#c0392b" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="370" y="218" font-size="14" fill="#c0392b">血流 v</text>
  <line x1="320" y1="172" x2="430" y2="230" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 335 170 A 52 52 0 0 0 346 196" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="352" y="188" font-size="15" fill="#333">θ</text>
  <text x="320" y="288" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">频移公式：f_d = 2 f0 v cos θ / c</text>
  <text x="320" y="318" text-anchor="middle" font-size="14" fill="#333">θ 越大（越斜），测得的速度分量越小；θ = 90° 时测不到</text>
  <text x="320" y="342" text-anchor="middle" font-size="14" fill="#c0392b">规范：检查时尽量让声束与血流平行（θ &lt; 60°）</text>
</svg>
