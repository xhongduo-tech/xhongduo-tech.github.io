<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg">
<title>共聚焦针孔原理</title>
<desc>焦平面发出的荧光聚焦穿过针孔到达探测器；样品上方与下方的离焦荧光在针孔处散开被挡住。</desc>
<rect width="640" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">
<!-- lens -->
<path d="M 300 150 L 340 150 M 300 150 C 310 130 330 130 340 150 C 330 170 310 170 300 150 Z" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="240" y="140" font-size="14">物镜</text>
<!-- sample plane in focus -->
<line x1="120" y1="90" x2="220" y2="90" stroke="#c0392b" stroke-width="2"/>
<text x="40" y="95" font-size="14">焦平面</text>
<line x1="120" y1="40" x2="220" y2="40" stroke="#666" stroke-width="2"/>
<text x="30" y="45" font-size="14">离焦平面（上）</text>
<line x1="120" y1="140" x2="220" y2="140" stroke="#666" stroke-width="2"/>
<text x="25" y="150" font-size="14">离焦平面（下）</text>
<!-- in-focus rays -->
<path d="M 200 90 C 260 105 280 115 320 150" stroke="#c0392b" stroke-width="2" fill="none"/>
<path d="M 140 90 C 230 110 270 130 320 150" stroke="#c0392b" stroke-width="2" fill="none"/>
<!-- pinhole -->
<rect x="395" y="145" width="8" height="10" fill="#333"/>
<line x1="399" y1="150" x2="440" y2="150" stroke="#c0392b" stroke-width="2"/>
<polygon points="432,146 432,154 446,150" fill="#c0392b"/>
<text x="398" y="130" font-size="14">针孔</text>
<text x="455" y="140" font-size="13">探测器</text>
<text x="455" y="157" font-size="13">（焦平面光通过）</text>
<!-- out-of-focus rays -->
<path d="M 200 40 C 270 80 320 130 360 165" stroke="#666" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
<path d="M 200 140 C 270 130 320 140 360 160" stroke="#666" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
<text x="120" y="205" font-size="14">离焦光在针孔处散开 → 被挡住</text>
<rect x="360" y="163" width="26" height="6" fill="#c0392b" opacity="0.6"/>
<text x="120" y="240" font-size="14">焦平面光聚焦穿过针孔 → 信号保留</text>
</g>
</svg>
