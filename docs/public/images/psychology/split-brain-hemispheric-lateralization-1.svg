<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <title id="title">裂脑人半视野实验：把「钥匙」投到左视野</title>
  <desc id="desc">示意图：左视野呈现「钥匙」，视神经在视交叉处交叉，信息进入右半球。左半球有语言中枢但未收到信息，所以患者报告什么都没看到；右手受左半球控制摸不出，而左手受右半球控制能摸出钥匙。胼胝体已切断。</desc>

  <rect x="0" y="0" width="800" height="560" fill="#faf9f5"/>

  <text x="400" y="28" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">裂脑人实验：左视野呈现「钥匙」→ 信息进入右半球</text>

  <!-- 视野框 -->
  <g stroke="#333" stroke-width="1.6">
    <rect x="40" y="70" width="150" height="48" rx="10" fill="#e8f2f5"/>
    <rect x="610" y="70" width="150" height="48" rx="10" fill="#f2f2f0"/>
  </g>
  <text x="115" y="92" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">左视野</text>
  <text x="115" y="110" font-size="14" fill="#333" text-anchor="middle">「钥匙」</text>
  <text x="685" y="92" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">右视野</text>
  <text x="685" y="110" font-size="14" fill="#999" text-anchor="middle">（空白）</text>

  <!-- 双眼 -->
  <circle cx="290" cy="90" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="510" cy="90" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="290" cy="90" r="5" fill="#333"/>
  <circle cx="510" cy="90" r="5" fill="#333"/>
  <text x="290" y="120" font-size="13" fill="#666" text-anchor="middle">左眼</text>
  <text x="510" y="120" font-size="13" fill="#666" text-anchor="middle">右眼</text>

  <!-- 视交叉 -->
  <circle cx="400" cy="170" r="7" fill="#333"/>
  <text x="400" y="196" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">视交叉（左右交叉）</text>

  <!-- 视觉通路：左视野→右半球，右视野→左半球 -->
  <g stroke="#1f6f8b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="192" y1="92" x2="393" y2="165"/>
    <line x1="407" y1="176" x2="625" y2="296"/>
    <line x1="608" y1="92" x2="407" y2="165"/>
    <line x1="393" y1="176" x2="175" y2="296"/>
  </g>

  <!-- 两个半球 -->
  <g stroke-width="2">
    <rect x="80" y="300" width="170" height="120" rx="12" fill="#fff" stroke="#1f6f8b"/>
    <rect x="550" y="300" width="170" height="120" rx="12" fill="#fff" stroke="#c0392b"/>
  </g>
  <text x="165" y="332" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">左半球</text>
  <text x="165" y="356" font-size="14" fill="#333" text-anchor="middle">语言中枢</text>
  <text x="165" y="378" font-size="14" fill="#666" text-anchor="middle">未收到「钥匙」</text>
  <text x="635" y="332" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">右半球</text>
  <text x="635" y="356" font-size="14" fill="#333" text-anchor="middle">识别「钥匙」</text>
  <text x="635" y="378" font-size="14" fill="#666" text-anchor="middle">指挥左手</text>

  <!-- 胼胝体（切断） -->
  <rect x="250" y="345" width="300" height="22" rx="11" fill="#fff" stroke="#999" stroke-width="1.6"/>
  <line x1="382" y1="351" x2="418" y2="361" stroke="#c0392b" stroke-width="3"/>
  <line x1="418" y1="351" x2="382" y2="361" stroke="#c0392b" stroke-width="3"/>
  <text x="400" y="334" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">胼胝体（已切断）</text>

  <!-- 语言报告（左半球）：说不出 -->
  <rect x="30" y="150" width="252" height="52" rx="12" fill="#fdf3e2" stroke="#c0392b" stroke-width="1.6"/>
  <text x="156" y="173" font-size="14" fill="#333" text-anchor="middle">患者报告：</text>
  <text x="156" y="193" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">「我什么都没看到」</text>
  <line x1="145" y1="202" x2="150" y2="296" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 左手（右半球控制）：摸出钥匙 -->
  <rect x="250" y="470" width="210" height="46" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="355" y="491" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">左手（右半球控制）</text>
  <text x="355" y="508" font-size="14" fill="#333" text-anchor="middle">能摸出「钥匙」</text>
  <line x1="600" y1="420" x2="445" y2="472" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="435" font-size="13" fill="#666">右手（左半球控制）摸不出</text>

  <!-- 底部对照说明 -->
  <text x="400" y="540" font-size="14" fill="#333" text-anchor="middle">对照：把「钥匙」投到右视野（进入左半球），他能立刻流利说出——同一刺激、两种视野，结果截然相反。</text>
</svg>
