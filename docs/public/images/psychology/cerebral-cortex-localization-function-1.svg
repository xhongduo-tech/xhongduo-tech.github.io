<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">大脑皮层外侧面：四叶分区与机能定位</title>
  <desc id="desc">大脑左半球外侧面示意图。中央沟与外侧裂将皮层分为额叶、顶叶、枕叶、颞叶四叶。图中以带圈数字标注六个机能区：运动区（中央前回 4 区）、躯体感觉区（中央后回 3-1-2 区）、视觉区（枕叶 17 区）、听觉区（颞横回 41、42 区）、Broca 区（44、45 区）、Wernicke 区（22 区）。</desc>

  <rect x="0" y="0" width="800" height="480" fill="#faf9f5"/>

  <text x="400" y="30" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">大脑皮层外侧面（左半球）：四叶与机能区</text>

  <!-- 四叶填色 -->
  <g stroke-width="1.4">
    <!-- 额叶 -->
    <path d="M 210 260 C 190 135, 300 88, 430 92 C 420 170, 405 240, 355 300 L 240 295 C 225 280, 210 260 Z" fill="#e8f2f5" stroke="#1f6f8b"/>
    <!-- 顶叶 -->
    <path d="M 430 92 C 575 96, 668 150, 666 235 C 660 280, 600 300, 525 282 L 355 300 C 405 240, 420 170, 430 92 Z" fill="#fdf3e2" stroke="#c0392b"/>
    <!-- 枕叶 -->
    <path d="M 666 235 C 664 305, 620 358, 540 366 C 480 372, 465 340, 525 282 C 600 300, 660 280, 666 235 Z" fill="#f0e8f5" stroke="#7a5c9e"/>
    <!-- 颞叶 -->
    <path d="M 240 295 C 320 315, 430 305, 525 282 C 465 340, 480 372, 430 342 C 400 330, 355 314, 315 332 C 275 368, 232 402, 180 376 C 174 322, 225 280, 240 295 Z" fill="#e8f5e9" stroke="#4a7a4a"/>
  </g>

  <!-- 中央沟与外侧裂 -->
  <g stroke="#999" stroke-width="2" fill="none">
    <path d="M 430 92 C 420 170, 405 240, 355 300"/>
    <path d="M 240 295 C 320 315, 430 305, 525 282"/>
  </g>

  <!-- 大脑轮廓 -->
  <path d="M 210 260 C 190 135, 300 88, 440 92 C 575 96, 668 150, 666 235 C 664 305, 620 358, 540 366 C 480 372, 430 342, 400 330 C 355 314, 315 332, 275 368 C 232 402, 180 376, 174 322 C 169 288, 225 280, 210 260 Z" fill="none" stroke="#333" stroke-width="2.6"/>

  <!-- 叶名 -->
  <text x="265" y="150" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">额叶</text>
  <text x="535" y="160" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">顶叶</text>
  <text x="612" y="185" font-size="15" fill="#7a5c9e" text-anchor="middle" font-weight="bold">枕叶</text>
  <text x="355" y="392" font-size="15" fill="#4a7a4a" text-anchor="middle" font-weight="bold">颞叶</text>

  <!-- 机能区编号标记 -->
  <g font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">
    <circle cx="360" cy="185" r="8" fill="#333"/><text x="360" y="189">1</text>
    <circle cx="442" cy="185" r="8" fill="#333"/><text x="442" y="189">2</text>
    <circle cx="612" cy="252" r="8" fill="#333"/><text x="612" y="256">3</text>
    <circle cx="415" cy="345" r="8" fill="#333"/><text x="415" y="349">4</text>
    <circle cx="298" cy="258" r="8" fill="#333"/><text x="298" y="262">5</text>
    <circle cx="478" cy="330" r="8" fill="#333"/><text x="478" y="334">6</text>
  </g>

  <!-- 沟裂标注 -->
  <text x="352" y="248" font-size="13" fill="#666" text-anchor="end">中央沟</text>
  <text x="368" y="330" font-size="13" fill="#666" text-anchor="middle">外侧裂</text>

  <!-- 图例 -->
  <line x1="60" y1="405" x2="740" y2="405" stroke="#ddd" stroke-width="1"/>
  <g font-size="14" fill="#333">
    <text x="60" y="430">1 运动区·中央前回（4区）</text>
    <text x="330" y="430">2 躯体感觉区·中央后回（3-1-2区）</text>
    <text x="610" y="430">3 视觉区·枕叶（17区）</text>
    <text x="60" y="458">4 听觉区·颞横回（41、42区）</text>
    <text x="330" y="458">5 运动性言语区（Broca 区 44、45区）</text>
    <text x="640" y="458">6 听觉性言语区（Wernicke 区 22区）</text>
  </g>
</svg>
