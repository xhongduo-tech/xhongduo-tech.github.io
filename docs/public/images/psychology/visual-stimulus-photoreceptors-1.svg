<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">视觉传导通路示意</title>
  <desc id="desc">左眼与右眼经视神经在视交叉处交换部分纤维，再经视束、外侧膝状体（LGN）投射到枕叶初级视觉皮层（V1）</desc>
  <rect width="800" height="370" fill="#faf9f5"/>
  <!-- 左眼 -->
  <circle cx="170" cy="70" r="34" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <circle cx="170" cy="70" r="12" fill="#333333"/>
  <text x="170" y="122" text-anchor="middle" font-size="16" fill="#333333">左眼</text>
  <!-- 右眼 -->
  <circle cx="630" cy="70" r="34" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <circle cx="630" cy="70" r="12" fill="#333333"/>
  <text x="630" y="122" text-anchor="middle" font-size="16" fill="#333333">右眼</text>
  <!-- 视神经 -->
  <path d="M 195 88 C 260 140 320 165 395 183" fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round"/>
  <path d="M 605 88 C 540 140 480 165 405 183" fill="none" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round"/>
  <text x="282" y="142" text-anchor="middle" font-size="15" fill="#1f6f8b">视神经</text>
  <text x="520" y="142" text-anchor="middle" font-size="15" fill="#1f6f8b">视神经</text>
  <!-- 视交叉 -->
  <circle cx="400" cy="190" r="10" fill="#c0392b"/>
  <text x="400" y="176" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">视交叉</text>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#666666">鼻侧纤维交叉</text>
  <!-- 视束到 LGN -->
  <path d="M 394 198 C 350 225 320 240 285 250" fill="none" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 406 198 C 450 225 480 240 515 250" fill="none" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round"/>
  <!-- LGN -->
  <rect x="228" y="250" width="115" height="34" rx="7" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="285" y="272" text-anchor="middle" font-size="14" fill="#333333">外侧膝状体</text>
  <rect x="457" y="250" width="115" height="34" rx="7" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="514" y="272" text-anchor="middle" font-size="14" fill="#333333">外侧膝状体</text>
  <!-- 视放射 -->
  <path d="M 285 284 L 285 312" stroke="#1f6f8b" stroke-width="5"/>
  <path d="M 514 284 L 514 312" stroke="#1f6f8b" stroke-width="5"/>
  <!-- V1 -->
  <rect x="228" y="312" width="115" height="36" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="285" y="334" text-anchor="middle" font-size="14" fill="#333333">初级视觉皮层</text>
  <rect x="457" y="312" width="115" height="36" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="514" y="334" text-anchor="middle" font-size="14" fill="#333333">初级视觉皮层</text>
  <text x="640" y="334" text-anchor="start" font-size="13" fill="#666666">（V1，枕叶）</text>
</svg>
