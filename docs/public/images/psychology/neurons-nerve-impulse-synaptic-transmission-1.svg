<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">神经元的基本结构与突触传递过程</title>
  <desc id="desc">上半幅为一个神经元的示意图：左侧为树突，中央为细胞体与细胞核，向右伸出轴突，轴突外包绕多段髓鞘，髓鞘之间有郎飞结，轴突末端分支为轴突末梢。下半幅为突触截面图：突触前膜一侧含有突触小泡，小泡与前膜融合释放神经递质，递质通过突触间隙与突触后膜上的受体结合，开放离子通道，产生突触后电位。</desc>

  <rect x="0" y="0" width="800" height="560" fill="#faf9f5"/>

  <!-- ===================== 面板 A：神经元的基本结构 ===================== -->
  <text x="400" y="30" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">神经元的基本结构</text>

  <!-- 树突：从胞体向左分叉 -->
  <g stroke="#1f6f8b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 126 96 L 82 62 L 52 40"/>
    <path d="M 92 72 L 62 78"/>
    <path d="M 124 130 L 70 130 L 44 118"/>
    <path d="M 86 128 L 46 146"/>
    <path d="M 126 164 L 86 198 L 64 224"/>
    <path d="M 96 188 L 68 190"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 82 62 L 52 40 M 52 40 L 38 46"/>
    <path d="M 44 118 L 26 112"/>
    <path d="M 64 224 L 48 232"/>
  </g>

  <!-- 细胞体与细胞核 -->
  <circle cx="170" cy="130" r="48" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="170" cy="130" r="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <!-- 轴突（髓鞘节段 + 郎飞结） -->
  <line x1="218" y1="130" x2="548" y2="130" stroke="#1f6f8b" stroke-width="6"/>
  <g fill="#cfe3ea" stroke="#1f6f8b" stroke-width="2">
    <ellipse cx="255" cy="130" rx="22" ry="14"/>
    <ellipse cx="315" cy="130" rx="22" ry="14"/>
    <ellipse cx="375" cy="130" rx="22" ry="14"/>
    <ellipse cx="435" cy="130" rx="22" ry="14"/>
    <ellipse cx="495" cy="130" rx="22" ry="14"/>
  </g>

  <!-- 轴突末梢分支与终扣 -->
  <g stroke="#1f6f8b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 548 130 L 600 130"/>
    <path d="M 570 130 C 585 118 595 108 608 104"/>
    <path d="M 570 130 C 585 142 595 152 608 156"/>
  </g>
  <circle cx="608" cy="104" r="11" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="2"/>
  <circle cx="608" cy="156" r="11" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 面板 A 标注 -->
  <g font-size="14" fill="#333">
    <text x="75" y="42" text-anchor="middle">树突</text>
    <line x1="75" y1="46" x2="86" y2="64" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="170" y="55" text-anchor="middle">细胞体（胞体）</text>
    <line x1="170" y1="59" x2="170" y2="80" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="212" y="212" text-anchor="middle">细胞核</text>
    <line x1="200" y1="206" x2="182" y2="148" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="320" y="205" text-anchor="middle">轴突</text>
    <line x1="320" y1="198" x2="320" y2="148" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="438" y="205" text-anchor="middle">髓鞘</text>
    <line x1="438" y1="198" x2="438" y2="144" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="372" y="238" text-anchor="middle">郎飞结</text>
    <line x1="358" y1="230" x2="345" y2="144" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="625" y="62" text-anchor="middle">轴突末梢</text>
    <line x1="618" y1="70" x2="612" y2="96" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <!-- 分栏线 -->
  <line x1="30" y1="255" x2="770" y2="255" stroke="#ccc" stroke-width="1.2"/>

  <!-- ===================== 面板 B：突触传递过程 ===================== -->
  <text x="500" y="282" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">突触传递过程（突触结构截面）</text>

  <!-- 突触前神经元末梢 -->
  <rect x="80" y="315" width="220" height="165" rx="18" fill="#e8f2f5" stroke="#1f6f8b" stroke-width="2.5"/>

  <!-- 突触小泡 -->
  <g fill="#fdecea" stroke="#c0392b" stroke-width="1.8">
    <circle cx="120" cy="345" r="11"/>
    <circle cx="150" cy="378" r="11"/>
    <circle cx="125" cy="412" r="11"/>
    <circle cx="165" cy="442" r="11"/>
    <circle cx="205" cy="345" r="11"/>
    <circle cx="240" cy="405" r="11"/>
    <circle cx="268" cy="352" r="11"/>
  </g>
  <!-- 正在融合的小泡 -->
  <circle cx="290" cy="394" r="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <path d="M 296 390 q 6 4 2 9" stroke="#c0392b" stroke-width="1.6" fill="none"/>

  <!-- 突触前膜 -->
  <line x1="300" y1="315" x2="300" y2="480" stroke="#1f6f8b" stroke-width="3.5"/>

  <!-- 突触间隙内的神经递质 -->
  <g fill="#c0392b">
    <circle cx="316" cy="372" r="5"/>
    <circle cx="328" cy="392" r="5"/>
    <circle cx="318" cy="418" r="5"/>
    <circle cx="342" cy="382" r="5"/>
    <circle cx="338" cy="418" r="5"/>
  </g>

  <!-- 突触后膜与受体 -->
  <line x1="360" y1="315" x2="360" y2="480" stroke="#1f6f8b" stroke-width="3.5"/>
  <g fill="#ffffff" stroke="#1f6f8b" stroke-width="1.8">
    <rect x="354" y="362" width="8" height="14" rx="3"/>
    <rect x="354" y="386" width="8" height="14" rx="3"/>
    <rect x="354" y="410" width="8" height="14" rx="3"/>
    <rect x="354" y="434" width="8" height="14" rx="3"/>
  </g>

  <!-- 突触后神经元（树突）区域 -->
  <rect x="360" y="315" width="380" height="165" fill="#f4edde" stroke="#cbbd9e" stroke-width="1.5"/>
  <text x="560" y="306" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">突触后神经元（树突）</text>

  <!-- 编号圆圈 -->
  <g font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">
    <circle cx="98" cy="345" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
    <text x="98" y="349">1</text>
    <circle cx="284" cy="352" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
    <text x="284" y="356">2</text>
    <circle cx="330" cy="430" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
    <text x="330" y="434">3</text>
    <circle cx="390" cy="385" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
    <text x="390" y="389">4</text>
  </g>

  <!-- 面板 B 标注 -->
  <g font-size="14" fill="#333">
    <text x="150" y="475" text-anchor="middle">突触小泡（含神经递质）</text>
    <line x1="158" y1="468" x2="158" y2="454" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="290" y="508" text-anchor="middle">突触前膜</text>
    <line x1="290" y1="500" x2="299" y2="484" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="330" y="508" text-anchor="middle">突触间隙</text>
    <line x1="330" y1="500" x2="330" y2="480" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="410" y="508" text-anchor="middle">突触后膜</text>
    <line x1="400" y1="500" x2="362" y2="484" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="438" y="352" text-anchor="middle">受体</text>
    <line x1="430" y1="356" x2="368" y2="372" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

    <text x="470" y="448" text-anchor="middle">离子通道开放 → 突触后电位</text>
    <line x1="448" y1="442" x2="398" y2="396" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <!-- 流程说明 -->
  <text x="400" y="542" font-size="14" fill="#333" text-anchor="middle">① 动作电位到达末梢 → ② 小泡与前膜融合、释放递质 → ③ 递质与受体结合 → ④ 离子通道开放、产生突触后电位</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
