<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
<title>基底膜上的行波：频率决定波峰位置</title>
<desc>示意不同频率的声波在基底膜上引起行波，最大振幅（波峰）出现在不同位置：高频靠近蜗底，低频靠近蜗顶。</desc>
<rect width="800" height="360" fill="#faf9f5"/>
<text x="400" y="34" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">基底膜上的行波：频率决定波峰位置</text>
<text x="400" y="58" text-anchor="middle" font-size="14" fill="#555">声音越高，波峰越靠近蜗底；声音越低，波峰越靠近蜗顶</text>
<rect x="60" y="240" width="680" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<path d="M60,240 C150,240 160,172 225,168 C290,164 310,240 740,240" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M60,240 C260,240 350,148 435,148 C520,148 600,240 740,240" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<path d="M60,240 C360,240 550,182 640,176 C710,171 738,240 740,240" fill="none" stroke="#333" stroke-width="3"/>
<text x="225" y="150" text-anchor="middle" font-size="14" fill="#c0392b">高频（如 12000 Hz）</text>
<text x="435" y="130" text-anchor="middle" font-size="14" fill="#1f6f8b">中频（如 1000 Hz）</text>
<text x="655" y="160" text-anchor="middle" font-size="14" fill="#333">低频（如 100 Hz）</text>
<text x="90" y="315" text-anchor="middle" font-size="14" fill="#333">蜗底（基部）</text>
<text x="90" y="335" text-anchor="middle" font-size="12" fill="#555">卵圆窗端 · 高频敏感</text>
<text x="710" y="315" text-anchor="middle" font-size="14" fill="#333">蜗顶（顶部）</text>
<text x="710" y="335" text-anchor="middle" font-size="12" fill="#555">低频敏感</text>
<text x="400" y="355" text-anchor="middle" font-size="12" fill="#777">基底膜（沿耳蜗展开示意）</text>
</svg>
