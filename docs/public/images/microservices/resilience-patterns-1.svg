<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>熔断器状态机</title>
  <desc>熔断器在闭合、打开、半开三个状态间切换：失败超阈值则打开，冷却后半开放探测请求，成功则复位。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <circle cx="110" cy="150" r="52" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="110" y="144" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">闭合</text>
  <text x="110" y="166" font-size="12" fill="#333" text-anchor="middle">正常转发</text>
  <circle cx="340" cy="60" r="52" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="340" y="54" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">打开</text>
  <text x="340" y="76" font-size="12" fill="#333" text-anchor="middle">快速失败</text>
  <circle cx="560" cy="180" r="52" fill="#f3e8c8" stroke="#b8860b" stroke-width="2"/>
  <text x="560" y="174" font-size="14" fill="#8a6d1d" text-anchor="middle" font-weight="bold">半开</text>
  <text x="560" y="196" font-size="12" fill="#333" text-anchor="middle">试探恢复</text>
  <line x1="162" y1="132" x2="288" y2="80" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="86" font-size="12" fill="#c0392b" text-anchor="middle">失败超阈值</text>
  <line x1="352" y1="112" x2="472" y2="160" stroke="#b8860b" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="122" font-size="12" fill="#8a6d1d" text-anchor="middle">冷却结束</text>
  <line x1="506" y1="172" x2="170" y2="158" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="262" font-size="12" fill="#1f6f8b" text-anchor="middle">探测成功 → 复位闭合</text>
  <line x1="508" y1="196" x2="220" y2="172" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="330" y="282" font-size="12" fill="#c0392b" text-anchor="middle">探测失败 → 重新打开</text>
  <text x="340" y="240" font-size="13" fill="#333" text-anchor="middle">打开期间：调用立即失败，并触发降级逻辑</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
  </defs>
</svg>
