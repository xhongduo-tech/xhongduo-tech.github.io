<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>单体与微服务的结构对照</title>
  <desc>左侧为单体应用：一个进程内多个模块共享一个数据库；右侧为微服务：多个独立服务各自拥有私有数据库，通过网络互相调用。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="160" y="28" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">单体（Monolith）</text>
  <text x="480" y="28" font-size="15" fill="#333" text-anchor="middle">微服务（Microservices）</text>
  <rect x="40" y="44" width="240" height="180" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="160" y="66" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">一个进程</text>
  <rect x="60" y="82" width="200" height="30" rx="4" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="160" y="102" font-size="13" fill="#333" text-anchor="middle">用户模块</text>
  <rect x="60" y="120" width="200" height="30" rx="4" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="160" y="140" font-size="13" fill="#333" text-anchor="middle">订单模块</text>
  <rect x="60" y="158" width="200" height="30" rx="4" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="160" y="178" font-size="13" fill="#333" text-anchor="middle">支付模块</text>
  <line x1="160" y1="192" x2="160" y2="238" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="70" y="238" width="180" height="30" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="257" font-size="13" fill="#333" text-anchor="middle">共享数据库</text>
  <rect x="360" y="44" width="86" height="72" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="403" y="72" font-size="13" fill="#333" text-anchor="middle">用户服务</text>
  <rect x="368" y="126" width="70" height="24" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="403" y="142" font-size="12" fill="#333" text-anchor="middle">用户库</text>
  <rect x="456" y="44" width="86" height="72" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="499" y="72" font-size="13" fill="#333" text-anchor="middle">订单服务</text>
  <rect x="464" y="126" width="70" height="24" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="499" y="142" font-size="12" fill="#333" text-anchor="middle">订单库</text>
  <rect x="552" y="44" width="86" height="72" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="595" y="72" font-size="13" fill="#333" text-anchor="middle">支付服务</text>
  <rect x="560" y="126" width="70" height="24" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="595" y="142" font-size="12" fill="#333" text-anchor="middle">支付库</text>
  <line x1="446" y1="118" x2="456" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="118" x2="552" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="108" font-size="12" fill="#333" text-anchor="middle">网络调用</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
