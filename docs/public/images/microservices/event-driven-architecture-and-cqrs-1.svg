<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>CQRS：命令模型与查询模型通过事件流同步</title>
  <desc>写请求进入命令模型，命令模型提交本地事务并发布事件；事件流把数据同步到查询模型；读请求由查询模型响应。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="90" y="40" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">命令路径（写）</text>
  <rect x="30" y="60" width="120" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="85" font-size="13" fill="#333" text-anchor="middle">写请求</text>
  <rect x="190" y="60" width="120" height="44" rx="6" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="250" y="85" font-size="13" fill="#1f6f8b" text-anchor="middle" font-weight="bold">命令模型</text>
  <rect x="190" y="120" width="120" height="40" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="145" font-size="13" fill="#333" text-anchor="middle">业务数据库</text>
  <line x1="150" y1="82" x2="190" y2="82" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="250" y1="104" x2="250" y2="120" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="250" y="190" font-size="13" fill="#333" text-anchor="middle">领域事件发布</text>
  <line x1="250" y1="160" x2="250" y2="182" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="180" y="182" width="140" height="40" rx="20" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="207" font-size="13" fill="#c0392b" text-anchor="middle">消息总线（事件流）</text>
  <line x1="320" y1="202" x2="360" y2="202" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="40" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">查询路径（读）</text>
  <rect x="430" y="60" width="120" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="85" font-size="13" fill="#333" text-anchor="middle">读请求</text>
  <rect x="430" y="150" width="120" height="44" rx="6" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="490" y="175" font-size="13" fill="#1f6f8b" text-anchor="middle" font-weight="bold">查询模型</text>
  <rect x="430" y="214" width="120" height="36" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="490" y="236" font-size="13" fill="#333" text-anchor="middle">物化视图/索引</text>
  <line x1="490" y1="82" x2="490" y2="104" stroke="#333" stroke-width="2"/>
  <text x="490" y="120" font-size="12" fill="#333" text-anchor="middle">订阅事件同步</text>
  <line x1="490" y1="104" x2="490" y2="150" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="194" x2="490" y2="214" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="202" x2="430" y2="172" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="340" y="228" font-size="12" fill="#333" text-anchor="middle">最终一致</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f8b"/></marker>
  </defs>
</svg>
