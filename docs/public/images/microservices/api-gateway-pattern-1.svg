<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>API 网关模式</title>
  <desc>客户端只与唯一入口网关通信，网关负责认证、限流、路由与聚合，再把请求转发给内部各服务。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <rect x="30" y="40" width="120" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="62" font-size="13" fill="#333" text-anchor="middle">移动端 App</text>
  <rect x="30" y="110" width="120" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="132" font-size="13" fill="#333" text-anchor="middle">浏览器 / Web</text>
  <rect x="30" y="180" width="120" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="202" font-size="13" fill="#333" text-anchor="middle">第三方合作伙伴</text>
  <line x1="150" y1="63" x2="230" y2="63" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="150" y1="133" x2="230" y2="133" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="150" y1="203" x2="230" y2="203" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="45" width="180" height="170" rx="8" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="72" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">API 网关</text>
  <text x="320" y="96" font-size="12" fill="#333" text-anchor="middle">唯一入口</text>
  <text x="320" y="116" font-size="12" fill="#333" text-anchor="middle">· 认证 / 授权</text>
  <text x="320" y="134" font-size="12" fill="#333" text-anchor="middle">· 限流</text>
  <text x="320" y="152" font-size="12" fill="#333" text-anchor="middle">· 路由</text>
  <text x="320" y="170" font-size="12" fill="#333" text-anchor="middle">· 协议转换</text>
  <text x="320" y="188" font-size="12" fill="#333" text-anchor="middle">· 聚合（可选）</text>
  <line x1="410" y1="80" x2="480" y2="80" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="130" x2="480" y2="130" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="180" x2="480" y2="180" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="480" y="56" width="130" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="545" y="78" font-size="13" fill="#333" text-anchor="middle">用户服务</text>
  <rect x="480" y="116" width="130" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="545" y="138" font-size="13" fill="#333" text-anchor="middle">订单服务</text>
  <rect x="480" y="176" width="130" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="545" y="198" font-size="13" fill="#333" text-anchor="middle">库存服务</text>
  <text x="320" y="248" font-size="12" fill="#c0392b" text-anchor="middle">禁止：网关内写业务规则</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
