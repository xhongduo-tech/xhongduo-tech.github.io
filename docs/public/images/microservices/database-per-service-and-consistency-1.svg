<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>每服务数据库的数据自治</title>
  <desc>三个服务各自拥有私有数据库，数据交换只能通过同步的服务接口或异步的事件总线，任何服务不能直接访问其他服务的数据库。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <rect x="40" y="50" width="120" height="56" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="76" font-size="13" fill="#333" text-anchor="middle">用户服务</text>
  <rect x="48" y="132" width="104" height="34" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="100" y="154" font-size="12" fill="#333" text-anchor="middle">用户库</text>
  <rect x="260" y="50" width="120" height="56" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="76" font-size="13" fill="#333" text-anchor="middle">订单服务</text>
  <rect x="268" y="132" width="104" height="34" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="320" y="154" font-size="12" fill="#333" text-anchor="middle">订单库</text>
  <rect x="480" y="50" width="120" height="56" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="76" font-size="13" fill="#333" text-anchor="middle">支付服务</text>
  <rect x="488" y="132" width="104" height="34" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="540" y="154" font-size="12" fill="#333" text-anchor="middle">支付库</text>
  <line x1="100" y1="106" x2="100" y2="132" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="320" y1="106" x2="320" y2="132" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="540" y1="106" x2="540" y2="132" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="160" y1="78" x2="260" y2="78" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="78" x2="480" y2="78" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="68" font-size="12" fill="#1f6f8b" text-anchor="middle">服务接口调用</text>
  <text x="430" y="68" font-size="12" fill="#1f6f8b" text-anchor="middle">服务接口调用</text>
  <rect x="180" y="200" width="280" height="42" rx="20" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="226" font-size="13" fill="#c0392b" text-anchor="middle">事件总线（异步）</text>
  <line x1="100" y1="166" x2="100" y2="200" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="320" y1="166" x2="320" y2="200" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="540" y1="166" x2="540" y2="200" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="272" font-size="13" fill="#c0392b" text-anchor="middle">禁止：任何服务直接读写其他服务的数据库</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f8b"/></marker>
  </defs>
</svg>
