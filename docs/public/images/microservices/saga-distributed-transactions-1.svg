<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>编排式 Saga 及其补偿流程</title>
  <desc>编排器依次调用订单、库存、支付三个服务完成本地事务；若某一步失败，逆序执行各补偿事务。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <rect x="30" y="20" width="140" height="60" rx="8" fill="#e8f0f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="50" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">编排器</text>
  <text x="100" y="68" font-size="12" fill="#333" text-anchor="middle">Saga 状态机</text>
  <rect x="250" y="20" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="325" y="46" font-size="13" fill="#333" text-anchor="middle">① 订单：创建待确认</text>
  <rect x="250" y="84" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="325" y="110" font-size="13" fill="#333" text-anchor="middle">② 库存：扣减</text>
  <rect x="250" y="148" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="325" y="174" font-size="13" fill="#333" text-anchor="middle">③ 支付：扣款</text>
  <rect x="250" y="212" width="150" height="46" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="325" y="238" font-size="13" fill="#333" text-anchor="middle">④ 订单：已确认</text>
  <line x1="170" y1="43" x2="250" y2="43" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="43" x2="250" y2="107" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="43" x2="250" y2="171" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="43" x2="250" y2="235" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="107" x2="400" y2="148" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="171" x2="400" y2="212" stroke="#333" stroke-width="2"/>
  <text x="478" y="80" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">若 ③ 失败：</text>
  <rect x="430" y="100" width="180" height="34" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="122" font-size="13" fill="#333" text-anchor="middle">②′ 库存：加回（补偿）</text>
  <rect x="430" y="150" width="180" height="34" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="172" font-size="13" fill="#333" text-anchor="middle">①′ 订单：已取消（补偿）</text>
  <line x1="250" y1="171" x2="430" y2="117" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <line x1="400" y1="234" x2="430" y2="167" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f8b"/></marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0392b"/></marker>
  </defs>
</svg>
