<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>RNA 二级结构常见基序示意</title>
  <desc>四个面板分别示意发夹（茎环）、凸泡、内部环与假结：配对区段画为带横档的双线，未配对碱基画为圆点。</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>

  <!-- 面板 A：发夹 / 茎环 -->
  <rect x="10" y="10" width="300" height="215" fill="#ffffff" stroke="#d8d2c5" stroke-width="1.5"/>
  <text x="18" y="30" fill="#1f6f8b" font-size="15" font-weight="bold">发夹 / 茎环（hairpin）</text>
  <line x1="120" y1="60" x2="120" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="60" x2="200" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="124" y1="70" x2="196" y2="70" stroke="#c0392b" stroke-width="2"/>
  <line x1="124" y1="90" x2="196" y2="90" stroke="#c0392b" stroke-width="2"/>
  <line x1="124" y1="110" x2="196" y2="110" stroke="#c0392b" stroke-width="2"/>
  <line x1="124" y1="130" x2="196" y2="130" stroke="#c0392b" stroke-width="2"/>
  <line x1="124" y1="150" x2="196" y2="150" stroke="#c0392b" stroke-width="2"/>
  <path d="M120,60 A40,40 0 0 1 200,60" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="148" cy="38" r="5" fill="#c0392b"/>
  <circle cx="164" cy="32" r="5" fill="#c0392b"/>
  <text x="160" y="190" fill="#333" font-size="14" text-anchor="middle">茎（stem）</text>
  <text x="120" y="176" fill="#1f6f8b" font-size="14" text-anchor="end">5′</text>
  <text x="200" y="176" fill="#1f6f8b" font-size="14" text-anchor="start">3′</text>

  <!-- 面板 B：凸泡 -->
  <rect x="330" y="10" width="300" height="215" fill="#ffffff" stroke="#d8d2c5" stroke-width="1.5"/>
  <text x="338" y="30" fill="#1f6f8b" font-size="15" font-weight="bold">凸泡（bulge）</text>
  <line x1="400" y1="60" x2="400" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="60" x2="480" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="404" y1="70" x2="476" y2="70" stroke="#c0392b" stroke-width="2"/>
  <line x1="404" y1="90" x2="476" y2="90" stroke="#c0392b" stroke-width="2"/>
  <line x1="404" y1="130" x2="476" y2="130" stroke="#c0392b" stroke-width="2"/>
  <line x1="404" y1="150" x2="476" y2="150" stroke="#c0392b" stroke-width="2"/>
  <path d="M480,90 Q540,105 480,120" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="520" cy="105" r="6" fill="#c0392b"/>
  <text x="496" y="88" fill="#333" font-size="14">凸泡</text>
  <text x="400" y="176" fill="#1f6f8b" font-size="14" text-anchor="end">5′</text>
  <text x="480" y="176" fill="#1f6f8b" font-size="14" text-anchor="start">3′</text>

  <!-- 面板 C：内部环 -->
  <rect x="10" y="235" width="300" height="215" fill="#ffffff" stroke="#d8d2c5" stroke-width="1.5"/>
  <text x="18" y="255" fill="#1f6f8b" font-size="15" font-weight="bold">内部环（internal loop）</text>
  <line x1="80" y1="280" x2="80" y2="380" stroke="#333" stroke-width="3"/>
  <line x1="160" y1="280" x2="160" y2="380" stroke="#333" stroke-width="3"/>
  <line x1="84" y1="290" x2="156" y2="290" stroke="#c0392b" stroke-width="2"/>
  <line x1="84" y1="300" x2="156" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="84" y1="370" x2="156" y2="370" stroke="#c0392b" stroke-width="2"/>
  <line x1="84" y1="380" x2="156" y2="380" stroke="#c0392b" stroke-width="2"/>
  <path d="M80,310 C50,330 50,350 80,360" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M160,310 C190,330 190,350 160,360" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="62" cy="326" r="5" fill="#c0392b"/>
  <circle cx="62" cy="344" r="5" fill="#c0392b"/>
  <circle cx="178" cy="326" r="5" fill="#c0392b"/>
  <circle cx="178" cy="344" r="5" fill="#c0392b"/>
  <text x="198" y="342" fill="#333" font-size="14">内部环</text>
  <text x="80" y="396" fill="#1f6f8b" font-size="14" text-anchor="end">5′</text>
  <text x="160" y="396" fill="#1f6f8b" font-size="14" text-anchor="start">3′</text>

  <!-- 面板 D：假结 -->
  <rect x="330" y="235" width="300" height="215" fill="#ffffff" stroke="#d8d2c5" stroke-width="1.5"/>
  <text x="338" y="255" fill="#1f6f8b" font-size="15" font-weight="bold">假结（pseudoknot）</text>
  <line x1="400" y1="280" x2="400" y2="340" stroke="#333" stroke-width="3"/>
  <line x1="470" y1="280" x2="470" y2="340" stroke="#333" stroke-width="3"/>
  <line x1="404" y1="290" x2="466" y2="290" stroke="#c0392b" stroke-width="2"/>
  <line x1="404" y1="300" x2="466" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="404" y1="310" x2="466" y2="310" stroke="#c0392b" stroke-width="2"/>
  <path d="M400,280 A35,35 0 0 1 470,280" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="420" cy="258" r="5" fill="#c0392b"/>
  <circle cx="450" cy="252" r="5" fill="#c0392b"/>
  <path d="M400,340 C400,430 515,415 535,400" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M470,340 C470,420 590,395 615,400" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="535" y1="400" x2="535" y2="440" stroke="#333" stroke-width="3"/>
  <line x1="615" y1="400" x2="615" y2="440" stroke="#333" stroke-width="3"/>
  <line x1="539" y1="410" x2="611" y2="410" stroke="#c0392b" stroke-width="2"/>
  <line x1="539" y1="420" x2="611" y2="420" stroke="#c0392b" stroke-width="2"/>
  <line x1="539" y1="430" x2="611" y2="430" stroke="#c0392b" stroke-width="2"/>
  <text x="548" y="452" fill="#333" font-size="14">第二个茎</text>
  <text x="400" y="268" fill="#1f6f8b" font-size="14" text-anchor="end">5′</text>
  <text x="615" y="456" fill="#1f6f8b" font-size="14" text-anchor="start">3′</text>
</svg>
