<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif" font-size="15">
  <title>零级、一级、二级反应浓度随时间的变化</title>
  <desc>三条曲线展示同一初始浓度下，零级反应浓度线性下降，一级反应指数衰减，二级反应衰减更快且在有限时间内浓度趋于零（发散）的差异。</desc>
  <rect width="460" height="320" fill="#faf9f5"/>
  <line x1="70" y1="270" x2="430" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="270" x2="70" y2="40" stroke="#333" stroke-width="2"/>
  <text x="20" y="160" font-size="14" fill="#333">浓度 [A]</text>
  <text x="240" y="312" font-size="14" fill="#333" text-anchor="middle">时间 t</text>
  <line x1="70" y1="60" x2="430" y2="60" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="78" y="55" font-size="13" fill="#999">[A]₀</text>
  <path d="M70 60 L 400 60" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <path d="M70 60 C 190 60, 290 150, 410 230" stroke="#1f6f8b" stroke-width="2.5" fill="none"/>
  <path d="M70 60 C 150 90, 220 150, 280 250 L 285 250" stroke="#333" stroke-width="2.5" fill="none"/>
  <text x="350" y="72" font-size="14" fill="#c0392b">零级</text>
  <text x="365" y="200" font-size="14" fill="#1f6f8b">一级</text>
  <text x="240" y="255" font-size="14" fill="#333">二级</text>
  <text x="78" y="252" font-size="13" fill="#333">[A] = [A]₀</text>
  <line x1="70" y1="270" x2="70" y2="270" stroke="#333" stroke-width="3"/>
</svg>
