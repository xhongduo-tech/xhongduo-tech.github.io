<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif" font-size="15">
  <title>二维势能面与鞍点</title>
  <desc>势能面等高线图上，反应物谷底与产物谷底之间隔着鞍点即过渡态，虚线为最小能量反应路径。</desc>
  <rect width="460" height="320" fill="#faf9f5"/>
  <ellipse cx="115" cy="245" rx="95" ry="45" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="115" cy="245" rx="70" ry="33" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="115" cy="245" rx="45" ry="21" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="350" cy="180" rx="95" ry="42" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="350" cy="180" rx="68" ry="30" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="350" cy="180" rx="42" ry="19" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <ellipse cx="230" cy="208" rx="120" ry="52" fill="none" stroke="#c0392b" stroke-width="2"/>
  <ellipse cx="230" cy="208" rx="80" ry="34" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <path d="M50 260 C 120 230, 180 214, 230 208 C 290 201, 340 186, 430 172" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="50" cy="260" r="5" fill="#333"/>
  <circle cx="430" cy="172" r="5" fill="#333"/>
  <circle cx="230" cy="208" r="6" fill="#c0392b"/>
  <text x="42" y="285" font-size="15" fill="#333">反应物</text>
  <text x="408" y="160" font-size="15" fill="#333">产物</text>
  <text x="206" y="186" font-size="15" fill="#c0392b">鞍点（过渡态）</text>
  <text x="60" y="112" font-size="13" fill="#666">等高线：能量升高的方向</text>
  <text x="60" y="134" font-size="13" fill="#666">虚线：最小能量反应路径</text>
</svg>
