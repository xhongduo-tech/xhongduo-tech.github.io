<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" font-family="sans-serif" font-size="15">
  <title>反应坐标能量剖面与活化能</title>
  <desc>反应物经过渡态到达产物，向前活化能 Ea 与逆向活化能之差等于反应的能量变化，能垒必须被克服反应才会发生。</desc>
  <rect width="460" height="330" fill="#faf9f5"/>
  <line x1="60" y1="300" x2="440" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="#333" stroke-width="2"/>
  <text x="20" y="180" font-size="14" fill="#333">能量</text>
  <text x="250" y="322" font-size="14" fill="#333" text-anchor="middle">反应坐标</text>
  <path d="M80 250 C 160 250, 180 90, 230 80 C 260 75, 280 160, 400 150" stroke="#1f6f8b" stroke-width="2.5" fill="none"/>
  <line x1="80" y1="250" x2="80" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="230" y1="80" x2="230" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="230" cy="80" r="4" fill="#333"/>
  <text x="55" y="240" font-size="15" fill="#333">反应物</text>
  <text x="385" y="140" font-size="15" fill="#333">产物</text>
  <text x="238" y="78" font-size="14" fill="#c0392b">过渡态</text>
  <line x1="82" y1="250" x2="228" y2="90" stroke="#c0392b" stroke-width="1.5"/>
  <text x="120" y="145" font-size="15" fill="#c0392b">Ea（向前）</text>
  <line x1="232" y1="90" x2="398" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="118" font-size="14" fill="#333">Ea（逆向）</text>
  <line x1="82" y1="250" x2="398" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="235" font-size="14" fill="#999">ΔE（反应能量变化）</text>
</svg>
