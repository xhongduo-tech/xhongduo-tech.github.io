<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif" font-size="15">
  <title>Belousov-Zhabotinsky 反应中离子浓度的持续振荡</title>
  <desc>远离平衡的敞开体系里，溴离子等中间物浓度在时间轴上呈周期性起伏，体系不趋于单调平衡而是围绕一个极限环振荡。</desc>
  <rect width="460" height="320" fill="#faf9f5"/>
  <line x1="60" y1="260" x2="440" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="260" x2="60" y2="40" stroke="#333" stroke-width="2"/>
  <text x="14" y="160" font-size="14" fill="#333">浓度 [X]</text>
  <text x="250" y="302" font-size="14" fill="#333" text-anchor="middle">时间 t</text>
  <path d="M60 180
    C 90 180, 100 100, 130 100
    C 160 100, 170 240, 200 240
    C 230 240, 240 70, 270 70
    C 300 70, 310 250, 340 250
    C 370 250, 380 90, 410 90
    L 440 90"
    stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <line x1="60" y1="160" x2="440" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="72" y="150" font-size="13" fill="#999">平均浓度</text>
  <text x="80" y="120" font-size="13" fill="#c0392b">振荡周期（约 1 分钟量级）</text>
  <line x1="130" y1="84" x2="200" y2="228" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="60" y="42" font-size="13" fill="#666">持续等幅振荡：体系不趋于平衡，而趋向极限环</text>
</svg>
