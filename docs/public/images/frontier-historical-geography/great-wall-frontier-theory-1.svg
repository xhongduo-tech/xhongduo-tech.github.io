<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>长城地带：农牧过渡带示意</title>
<desc>垂直剖面图：自北向南依次为蒙古草原游牧区、长城地带（农牧过渡带，内含400毫米等降水量线虚线）、中原农耕区。说明长城不是一条国界线，而是整个过渡带。</desc>
<rect width="720" height="460" fill="#faf9f5"/>
<rect x="0" y="30" width="720" height="150" fill="#eadfc8"/>
<text x="60" y="95" font-size="24" font-weight="bold" fill="#333">蒙古草原游牧区</text>
<text x="60" y="130" font-size="16" fill="#333">逐水草而居 · 部落组织 · 骑兵机动</text>
<rect x="0" y="180" width="720" height="140" fill="#c0392b" fill-opacity="0.12"/>
<line x1="0" y1="250" x2="720" y2="250" stroke="#c0392b" stroke-width="2" stroke-dasharray="10 8"/>
<text x="230" y="208" font-size="20" font-weight="bold" fill="#c0392b">长城地带（农牧过渡带）</text>
<text x="230" y="236" font-size="16" fill="#333">虚线：400 毫米等降水量线</text>
<text x="230" y="272" font-size="16" fill="#333">明长城即筑于这一带之内</text>
<text x="230" y="298" font-size="16" fill="#333">边疆 = 正在分化的社会地带</text>
<rect x="0" y="320" width="720" height="140" fill="#dde8dc"/>
<text x="60" y="390" font-size="24" font-weight="bold" fill="#333">中原农耕区</text>
<text x="60" y="425" font-size="16" fill="#333">定居农耕 · 编户齐民 · 官僚制</text>
<text x="660" y="28" font-size="16" fill="#1f6f8b">北</text>
<text x="660" y="452" font-size="16" fill="#1f6f8b">南</text>
</svg>
