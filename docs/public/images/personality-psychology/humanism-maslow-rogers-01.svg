<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>马斯洛需要层次金字塔</title>
  <desc>由低到高依次为生理需要、安全需要、归属与爱的需要、尊重需要、自我实现需要。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">马斯洛需要层次金字塔</text>
    <text x="320" y="50" text-anchor="middle" font-size="13" fill="#666">低层需要大体满足后，高层需要更容易浮现（但层级并不绝对锁死）</text>
    <polygon points="320,60 220,110 420,110" fill="#e8b4a0" stroke="#c0392b" stroke-width="1.5"/>
    <text x="320" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">自我实现</text>
    <text x="320" y="102" text-anchor="middle" font-size="13" fill="#333">成为自己能够成为的人</text>
    <polygon points="320,112 190,165 450,165" fill="#efc9a1" stroke="#c0392b" stroke-width="1.5"/>
    <text x="320" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">尊重需要</text>
    <text x="320" y="158" text-anchor="middle" font-size="13" fill="#333">被认可、自尊、有价值感</text>
    <polygon points="320,167 160,225 480,225" fill="#b9d7c9" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="320" y="196" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">归属与爱的需要</text>
    <text x="320" y="214" text-anchor="middle" font-size="13" fill="#333">被接纳、被爱、有归属</text>
    <polygon points="320,227 130,290 510,290" fill="#a8cbe4" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="320" y="258" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">安全需要</text>
    <text x="320" y="276" text-anchor="middle" font-size="13" fill="#333">稳定、秩序、免于恐惧</text>
    <polygon points="320,292 100,360 540,360" fill="#c9c3e0" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="320" y="328" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">生理需要</text>
    <text x="320" y="346" text-anchor="middle" font-size="13" fill="#333">食物、水、睡眠、性——最基础的生存需要</text>
    <text x="320" y="400" text-anchor="middle" font-size="13" fill="#666">匮乏性动机：消除紧张回到平衡　｜　成长性动机：实现潜能走向成长</text>
  </g>
</svg>
