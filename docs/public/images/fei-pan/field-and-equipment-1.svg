<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">
  <title>极限飞盘 WFDF 标准场地平面图</title>
  <desc>总长 100 米、宽 37 米的矩形场地，两端各 18 米深端区，中间 64 米中场，含砖点与中线的标注。</desc>
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">极限飞盘 WFDF 标准场地（总长 100 m × 宽 37 m）</text>
  <rect x="50" y="55" width="126" height="230" fill="#e8eef1" stroke="#333" stroke-width="2"/>
  <rect x="176" y="55" width="448" height="230" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <rect x="624" y="55" width="126" height="230" fill="#e8eef1" stroke="#333" stroke-width="2"/>
  <line x1="176" y1="55" x2="176" y2="285" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="624" y1="55" x2="624" y2="285" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="400" y1="55" x2="400" y2="285" stroke="#666" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="316" cy="170" r="5" fill="#c0392b"/>
  <circle cx="484" cy="170" r="5" fill="#c0392b"/>
  <text x="316" y="205" text-anchor="middle" font-size="14" fill="#c0392b">砖点</text>
  <text x="484" y="205" text-anchor="middle" font-size="14" fill="#c0392b">砖点</text>
  <text x="113" y="140" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">端区</text>
  <text x="113" y="160" text-anchor="middle" font-size="14" fill="#333">18 m</text>
  <text x="400" y="140" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">中场</text>
  <text x="400" y="160" text-anchor="middle" font-size="14" fill="#333">64 m</text>
  <text x="687" y="140" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">端区</text>
  <text x="687" y="160" text-anchor="middle" font-size="14" fill="#333">18 m</text>
  <line x1="50" y1="42" x2="750" y2="42" stroke="#333" stroke-width="1"/>
  <line x1="176" y1="36" x2="176" y2="48" stroke="#333" stroke-width="1"/>
  <line x1="624" y1="36" x2="624" y2="48" stroke="#333" stroke-width="1"/>
  <text x="113" y="38" text-anchor="middle" font-size="13" fill="#333">端区线</text>
  <text x="624" y="52" text-anchor="middle" font-size="13" fill="#333">端区线</text>
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#666">宽度 37 m（图中未按比例缩小）</text>
  <line x1="40" y1="55" x2="40" y2="285" stroke="#333" stroke-width="1"/>
  <line x1="34" y1="55" x2="46" y2="55" stroke="#333" stroke-width="1"/>
  <line x1="34" y1="285" x2="46" y2="285" stroke="#333" stroke-width="1"/>
  <text x="30" y="175" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 30 175)">37 m</text>
</svg>
