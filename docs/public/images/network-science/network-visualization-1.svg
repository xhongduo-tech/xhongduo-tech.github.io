<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="sans-serif">
<title>力导向布局下的网络示意图</title>
<desc>一个 8 节点的网络，中心枢纽节点最大，节点大小按度编码。</desc>
<rect width="420" height="300" fill="#faf9f5"/>
<!-- edges -->
<g stroke="#9a9388" stroke-width="1.4">
<line x1="210" y1="120" x2="90" y2="70"/>
<line x1="210" y1="120" x2="60" y2="170"/>
<line x1="210" y1="120" x2="130" y2="230"/>
<line x1="210" y1="120" x2="300" y2="230"/>
<line x1="210" y1="120" x2="350" y2="120"/>
<line x1="210" y1="120" x2="330" y2="50"/>
<line x1="210" y1="120" x2="150" y2="40"/>
<line x1="90" y1="70" x2="150" y2="40"/>
<line x1="350" y1="120" x2="330" y2="50"/>
<line x1="60" y1="170" x2="130" y2="230"/>
<line x1="300" y1="230" x2="130" y2="230"/>
<line x1="90" y1="70" x2="60" y2="170"/>
<line x1="350" y1="120" x2="300" y2="230"/>
</g>
<!-- nodes: radius proportional to degree -->
<g stroke="#333" stroke-width="1">
<circle cx="210" cy="120" r="26" fill="#c0392b"/>
<circle cx="90" cy="70" r="15" fill="#1f6f8b"/>
<circle cx="60" cy="170" r="14" fill="#1f6f8b"/>
<circle cx="130" cy="230" r="14" fill="#1f6f8b"/>
<circle cx="300" cy="230" r="14" fill="#1f6f8b"/>
<circle cx="350" cy="120" r="14" fill="#1f6f8b"/>
<circle cx="330" cy="50" r="12" fill="#1f6f8b"/>
<circle cx="150" cy="40" r="12" fill="#1f6f8b"/>
</g>
<!-- labels -->
<g fill="#333" font-size="13">
<text x="210" y="118" text-anchor="middle" fill="#faf9f5">枢纽</text>
<text x="90" y="74" text-anchor="middle">A</text>
<text x="60" y="174" text-anchor="middle">B</text>
<text x="130" y="234" text-anchor="middle">C</text>
<text x="300" y="234" text-anchor="middle">D</text>
<text x="350" y="124" text-anchor="middle">E</text>
<text x="330" y="54" text-anchor="middle">F</text>
<text x="150" y="44" text-anchor="middle">G</text>
</g>
<g fill="#333" font-size="12">
<text x="12" y="290">节点大小 ∝ 度；枢纽节点被力导向布局推至近中心位置</text>
</g>
</svg>
