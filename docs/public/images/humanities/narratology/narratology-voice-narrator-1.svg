<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="sans-serif">
  <title>叙述层级示意图：外叙述、内叙述与元叙述</title>
  <desc>三个嵌套的方框表示叙述层级：最外层为外叙述层（层级 0），其内为内叙述层（层级 1）故事世界，再内为元叙述层（层级 2）人物讲的故事。</desc>
  <rect x="0" y="0" width="820" height="500" fill="#faf9f5"/>
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">叙述层级示意图：套盒里的故事</text>

  <!-- 外叙述层（层级 0） -->
  <rect x="40" y="70" width="740" height="390" rx="10" fill="#f0f6f7" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="60" y="100" font-size="16" font-weight="bold" fill="#1f6f8b">外叙述层（层级 0）</text>
  <text x="60" y="122" font-size="14" fill="#333">叙述者讲述整部作品</text>

  <!-- 叙述者节点 -->
  <rect x="70" y="140" width="160" height="46" rx="8" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="150" y="168" text-anchor="middle" font-size="14" fill="#333">叙述者（层级 0）</text>

  <!-- 内叙述层（层级 1） -->
  <rect x="200" y="200" width="520" height="230" rx="10" fill="#eef0ea" stroke="#8a8a6e" stroke-width="2"/>
  <text x="220" y="228" font-size="15" font-weight="bold" fill="#6b6b50">内叙述层（层级 1）：故事世界</text>

  <!-- 人物节点 -->
  <rect x="230" y="250" width="130" height="44" rx="8" fill="#f7f5ec" stroke="#8a8a6e" stroke-width="1.5"/>
  <text x="295" y="277" text-anchor="middle" font-size="14" fill="#333">山鲁佐德（层级 1）</text>
  <rect x="380" y="250" width="120" height="44" rx="8" fill="#f7f5ec" stroke="#8a8a6e" stroke-width="1.5"/>
  <text x="440" y="277" text-anchor="middle" font-size="14" fill="#333">国王（层级 1）</text>

  <!-- 元叙述层（层级 2） -->
  <rect x="250" y="320" width="360" height="90" rx="10" fill="#f8eae8" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="348" font-size="14" font-weight="bold" fill="#c0392b">元叙述层（层级 2）</text>
  <text x="270" y="370" font-size="13" fill="#333">山鲁佐德给国王讲的故事</text>
  <text x="270" y="392" font-size="13" fill="#666">故事里的角色还可以再讲故事（层级 3、4……）</text>

  <!-- 箭头 -->
  <line x1="150" y1="186" x2="150" y2="205" stroke="#1f6f8b" stroke-width="1.5"/>
  <polygon points="143,203 150,215 157,203" fill="#1f6f8b"/>
  <text x="160" y="205" font-size="12" fill="#1f6f8b">讲述</text>

  <line x1="295" y1="294" x2="295" y2="318" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="288,316 295,328 302,316" fill="#c0392b"/>
  <text x="305" y="316" font-size="12" fill="#c0392b">开讲</text>

  <!-- 图注 -->
  <text x="410" y="480" text-anchor="middle" font-size="14" fill="#333">每次「人物开始讲故事」，层级就向下一层；故事讲完，叙述浮回上一层。</text>
</svg>
