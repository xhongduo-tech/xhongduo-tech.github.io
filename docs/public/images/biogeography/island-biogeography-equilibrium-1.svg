<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>岛屿生物地理学平衡理论：迁入率与灭绝率随物种数的变化</title>
<desc>近岛迁入曲线与远岛迁入曲线分别高于对方，小岛灭绝曲线与大岛灭绝曲线分别陡于对方；四条曲线两两相交，交点即不同岛屿的平衡物种数，近而大的岛平衡物种数最高，远而小的岛最低。</desc>
<rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
<style>
  text { font-family: sans-serif; fill: #333; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .tick { stroke: #999; stroke-width: 1; }
  .grid { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 3 3; }
  .in-near { stroke: #1f6f8b; stroke-width: 2.5; fill: none; }
  .in-far  { stroke: #1f6f8b; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
  .ex-small{ stroke: #c0392b; stroke-width: 2.5; fill: none; }
  .ex-large{ stroke: #c0392b; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
  .drop    { stroke: #aaa; stroke-width: 1; stroke-dasharray: 2 3; }
  .eqpt    { fill: #333; }
  .lbl-teal{ fill: #1f6f8b; font-size: 14px; }
  .lbl-red { fill: #c0392b; font-size: 14px; }
  .axislbl { font-size: 15px; fill: #333; }
  .ticklbl { font-size: 13px; fill: #555; }
  .note    { font-size: 13px; fill: #333; }
</style>

<!-- axes -->
<line class="axis" x1="80" y1="60" x2="80" y2="340"/>
<line class="axis" x1="80" y1="340" x2="620" y2="340"/>
<polygon points="620,340 610,336 610,344" fill="#333"/>
<polygon points="80,60 76,70 84,70" fill="#333"/>

<!-- grid & ticks: S axis -->
<line class="grid" x1="210" y1="60" x2="210" y2="340"/>
<line class="grid" x1="340" y1="60" x2="340" y2="340"/>
<line class="grid" x1="470" y1="60" x2="470" y2="340"/>
<line class="grid" x1="600" y1="60" x2="600" y2="340"/>
<text class="ticklbl" x="80"  y="358" text-anchor="middle">0</text>
<text class="ticklbl" x="210" y="358" text-anchor="middle">10</text>
<text class="ticklbl" x="340" y="358" text-anchor="middle">20</text>
<text class="ticklbl" x="470" y="358" text-anchor="middle">30</text>
<text class="ticklbl" x="600" y="358" text-anchor="middle">40</text>

<!-- grid & ticks: rate axis -->
<line class="grid" x1="80" y1="270" x2="600" y2="270"/>
<line class="grid" x1="80" y1="200" x2="600" y2="200"/>
<line class="grid" x1="80" y1="130" x2="600" y2="130"/>
<line class="grid" x1="80" y1="60"  x2="600" y2="60"/>
<text class="ticklbl" x="68" y="344" text-anchor="end">0</text>
<text class="ticklbl" x="68" y="274" text-anchor="end">2.5</text>
<text class="ticklbl" x="68" y="204" text-anchor="end">5</text>
<text class="ticklbl" x="68" y="134" text-anchor="end">7.5</text>
<text class="ticklbl" x="68" y="64"  text-anchor="end">10</text>

<!-- axis labels -->
<text class="axislbl" x="350" y="392" text-anchor="middle">岛上物种数 S（种）</text>
<text class="axislbl" x="34" y="205" text-anchor="middle" transform="rotate(-90 34 205)">速率（迁入 I / 灭绝 E）</text>

<!-- drop lines from equilibria -->
<line class="drop" x1="513" y1="256" x2="513" y2="340"/>
<line class="drop" x1="395" y1="218" x2="395" y2="340"/>
<line class="drop" x1="386" y1="281" x2="386" y2="340"/>
<line class="drop" x1="280" y1="262" x2="280" y2="340"/>

<!-- curves -->
<line class="in-near"  x1="80" y1="116" x2="600" y2="284"/>
<line class="in-far"   x1="80" y1="228" x2="600" y2="318"/>
<line class="ex-small" x1="80" y1="340" x2="600" y2="138"/>
<line class="ex-large" x1="80" y1="340" x2="600" y2="239"/>

<!-- equilibrium points -->
<circle class="eqpt" cx="513" cy="256" r="5"/>
<circle class="eqpt" cx="395" cy="218" r="5"/>
<circle class="eqpt" cx="386" cy="281" r="5"/>
<circle class="eqpt" cx="280" cy="262" r="5"/>

<!-- curve labels -->
<text class="lbl-teal" x="128" y="128">迁入 I（近岛）</text>
<text class="lbl-teal" x="128" y="252">迁入 I（远岛）</text>
<text class="lbl-red"  x="420" y="168">灭绝 E（小岛）</text>
<text class="lbl-red"  x="420" y="262">灭绝 E（大岛）</text>

<!-- equilibrium annotations -->
<text class="note" x="520" y="245" fill="#1f6f8b">Ŝ（近·大）</text>
<text class="note" x="400" y="205" fill="#c0392b">Ŝ（近·小）</text>
<text class="note" x="390" y="295" fill="#1f6f8b">Ŝ（远·大）</text>
<text class="note" x="282" y="278" fill="#c0392b">Ŝ（远·小）</text>

<text class="note" x="100" y="418">平衡点 = 迁入曲线与灭绝曲线的交点；近而大的岛平衡物种数最高，远而小的岛最低。</text>
</svg>
