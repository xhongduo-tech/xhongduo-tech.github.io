<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>STORM/PALM 超分辨成像原理示意</title>
<desc>三个面板对比：左为衍射极限成像，两个靠近的分子光斑重叠成一团无法分辨；中为随机点亮稀疏单分子，每帧只有一小撮分子发光；右为把成千上万帧中每个分子的精确定位点叠加，得到纳米级分辨率的点云图像。</desc>
<rect width="640" height="380" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">STORM / PALM：用时间换空间</text>
<rect x="30" y="60" width="180" height="250" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="120" cy="185" r="55" fill="#c0392b" opacity="0.30"/>
<circle cx="120" cy="185" r="26" fill="#c0392b" opacity="0.55"/>
<circle cx="120" cy="185" r="9" fill="#c0392b" opacity="0.85"/>
<text x="120" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">衍射极限成像</text>
<text x="120" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">两个分子糊成一团</text>
<rect x="230" y="60" width="180" height="250" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="270" cy="140" r="20" fill="#1f6f8b" opacity="0.65"/>
<circle cx="348" cy="225" r="20" fill="#1f6f8b" opacity="0.65"/>
<circle cx="385" cy="135" r="20" fill="#1f6f8b" opacity="0.65"/>
<circle cx="290" cy="250" r="20" fill="#1f6f8b" opacity="0.35"/>
<text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">随机点亮稀疏分子</text>
<text x="320" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">每帧只亮一小撮</text>
<rect x="430" y="60" width="180" height="250" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="455" cy="120" r="4" fill="#c0392b"/>
<circle cx="525" cy="120" r="4" fill="#c0392b"/>
<circle cx="480" cy="195" r="4" fill="#c0392b"/>
<circle cx="545" cy="195" r="4" fill="#c0392b"/>
<circle cx="460" cy="275" r="4" fill="#c0392b"/>
<circle cx="530" cy="275" r="4" fill="#c0392b"/>
<circle cx="502" cy="158" r="4" fill="#1f6f8b"/>
<circle cx="490" cy="235" r="4" fill="#1f6f8b"/>
<text x="520" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">定位点叠加</text>
<text x="520" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">纳米分辨率的点云</text>
</svg>
