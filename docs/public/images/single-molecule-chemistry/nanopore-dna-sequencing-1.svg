<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>纳米孔检测 DNA 易位与电流阻塞示意</title>
<desc>两个电解液腔室由含纳米孔的膜隔开；DNA 链在电场驱动下穿过纳米孔，孔内离子流被 DNA 部分阻断，右侧电流轨迹显示易位期间电流从基线 I0 下降到 Ib。</desc>
<rect width="640" height="400" fill="#faf9f5"/>
<text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">纳米孔单分子检测：电流阻塞</text>
<rect x="40" y="60" width="230" height="105" fill="#eef2fb" stroke="#333" stroke-width="1.5"/>
<text x="155" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">cis 侧（含 DNA）</text>
<rect x="40" y="165" width="230" height="70" fill="#1f6f8b" opacity="0.22" stroke="#1f6f8b" stroke-width="2"/>
<text x="155" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">磷脂双分子层 / 固态膜</text>
<rect x="40" y="235" width="230" height="105" fill="#fbf3e4" stroke="#333" stroke-width="1.5"/>
<text x="155" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">trans 侧</text>
<rect x="140" y="165" width="30" height="70" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="155" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">纳米孔</text>
<path d="M 148,60 Q 168,100 152,130 T 149,165 T 156,200 T 152,235 T 158,270 T 150,320" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3 3"/>
<line x1="205" y1="85" x2="205" y2="320" stroke="#c0392b" stroke-width="2"/>
<polygon points="205,322 198,308 212,308" fill="#c0392b"/>
<text x="232" y="205" font-family="sans-serif" font-size="13" fill="#c0392b">电场驱动易位</text>
<rect x="310" y="60" width="290" height="280" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="455" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">离子电流轨迹</text>
<line x1="345" y1="320" x2="580" y2="320" stroke="#333" stroke-width="2"/>
<line x1="345" y1="90" x2="345" y2="320" stroke="#333" stroke-width="2"/>
<line x1="345" y1="112" x2="430" y2="112" stroke="#1f6f8b" stroke-width="2.5"/>
<line x1="460" y1="112" x2="580" y2="112" stroke="#1f6f8b" stroke-width="2.5"/>
<line x1="430" y1="112" x2="445" y2="250" stroke="#c0392b" stroke-width="2.5"/>
<line x1="445" y1="250" x2="475" y2="250" stroke="#c0392b" stroke-width="2.5"/>
<line x1="475" y1="250" x2="490" y2="112" stroke="#c0392b" stroke-width="2.5"/>
<text x="368" y="106" font-family="sans-serif" font-size="13" fill="#1f6f8b">I0</text>
<text x="368" y="256" font-family="sans-serif" font-size="13" fill="#c0392b">Ib</text>
<text x="452" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">ΔI（易位期间）</text>
<text x="345" y="340" font-family="sans-serif" font-size="13" fill="#333">时间</text>
</svg>
