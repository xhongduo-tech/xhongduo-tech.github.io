<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">凸集与非凸集对比示意图</title>
  <desc id="desc">左图：一个鼓起的凸集（浅青色椭圆），点 x 与 y 都在集合内，连接它们的整条线段也完全落在集合内。右图：一个月牙形的非凸集，点 x 与 y 都在集合内，但连接它们的红色线段中间有一段穿出集合之外。线段表示凸组合 θx+(1−θ)y 随 θ 从 0 滑到 1 时扫过的路径。</desc>

  <!-- 左右面板分隔虚线 -->
  <line x1="360" y1="95" x2="360" y2="300" stroke="#d8d2c0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 左图：凸集 -->
  <g>
    <ellipse cx="185" cy="195" rx="108" ry="80" fill="#e7eeec" stroke="#333" stroke-width="2.5"/>
    <line x1="120" y1="235" x2="248" y2="145" stroke="#333" stroke-width="2.5"/>
    <circle cx="120" cy="235" r="4.5" fill="#333"/>
    <circle cx="248" cy="145" r="4.5" fill="#333"/>
    <text x="96" y="258" font-size="15" fill="#333">x</text>
    <text x="254" y="133" font-size="15" fill="#333">y</text>
    <text x="185" y="72" font-size="18" fill="#333" text-anchor="middle">凸集</text>
    <text x="185" y="320" font-size="13" fill="#333" text-anchor="middle">线段 xy 完全在集合内</text>
  </g>

  <!-- 右图：非凸集（月牙形，由 evenodd 挖去内圆而成） -->
  <g>
    <path d="M 500 100 A 95 95 0 1 0 500 290 A 95 95 0 1 0 500 100 Z
             M 585 107 A 88 88 0 1 1 585 283 A 88 88 0 1 1 585 107 Z"
          fill="#f6e8e4" fill-rule="evenodd" stroke="#333" stroke-width="2.5"/>
    <line x1="470" y1="128" x2="540" y2="275" stroke="#c0392b" stroke-width="2.5"/>
    <circle cx="470" cy="128" r="4.5" fill="#333"/>
    <circle cx="540" cy="275" r="4.5" fill="#333"/>
    <text x="448" y="112" font-size="15" fill="#333">x</text>
    <text x="548" y="297" font-size="15" fill="#333">y</text>
    <text x="500" y="72" font-size="18" fill="#333" text-anchor="middle">非凸集</text>
    <text x="545" y="232" font-size="13" fill="#c0392b">穿出集合</text>
    <text x="500" y="340" font-size="13" fill="#333" text-anchor="middle">线段 xy 有一段在集合外</text>
  </g>
</svg>
