<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">操作系统在硬件与应用之间：资源管理者与扩展的虚拟机</title>
  <desc id="desc">分层示意图。自上而下依次为应用层、操作系统、硬件层。应用层列出浏览器、编辑器、编译器、数据库、AI 训练框架；操作系统层内部自上而下为用户接口（shell 与 GUI）、系统调用接口（虚线框）、内核（进程管理、内存管理、文件管理、设备管理四个功能框）；硬件层列出 CPU、内存、磁盘/SSD、网卡、I/O 设备。左侧青色括号标注「视角① 资源管理者」，右侧红色括号标注「视角② 扩展的虚拟机」，并用箭头与文字说明应用通过系统调用请求服务、内核通过资源调度与驱动响应中断来管理硬件。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect width="860" height="620" fill="#faf9f5"/>

  <!-- 图题 -->
  <text x="430" y="36" font-size="19" fill="#333" text-anchor="middle">操作系统：硬件与应用之间的资源管理者</text>
  <text x="430" y="58" font-size="13" fill="#777" text-anchor="middle">向下管理硬件资源，向上提供便捷接口 —— 《操作系统概念》第1章</text>

  <!-- 应用层 -->
  <rect x="160" y="84" width="540" height="74" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="430" y="114" font-size="16" fill="#333" text-anchor="middle">应用层：应用软件（用户程序）</text>
  <text x="430" y="138" font-size="13" fill="#555" text-anchor="middle">浏览器 · 编辑器 · 编译器 · 数据库 · AI 训练框架</text>

  <!-- 应用 → 操作系统 箭头 -->
  <line x1="430" y1="158" x2="430" y2="202" stroke="#777" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="444" y="185" font-size="13" fill="#333" text-anchor="start">服务请求（系统调用）</text>

  <!-- 操作系统层（青色外框） -->
  <rect x="90" y="210" width="680" height="190" rx="10" fill="#f0f6f9" stroke="#1f6f8b" stroke-width="2.4"/>

  <!-- 用户接口 -->
  <rect x="110" y="228" width="640" height="34" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.4"/>
  <text x="430" y="250" font-size="14" fill="#333" text-anchor="middle">用户接口：shell（命令行）与图形界面（GUI）</text>

  <!-- 系统调用接口（虚线） -->
  <rect x="110" y="276" width="640" height="30" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="430" y="296" font-size="13" fill="#333" text-anchor="middle">系统调用接口（system call）—— 应用程序进入内核的唯一正式入口</text>

  <!-- 内核标签 -->
  <text x="120" y="326" font-size="14" fill="#1f6f8b" text-anchor="start">内核（kernel）</text>

  <!-- 内核四大功能 -->
  <g stroke="#333" stroke-width="1.8">
    <rect x="110" y="334" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="276" y="334" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="442" y="334" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="608" y="334" width="152" height="48" rx="6" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="186" y="355" font-size="14" fill="#333">进程管理</text>
    <text x="186" y="372" font-size="12" fill="#555">调度 / 并发</text>
    <text x="352" y="355" font-size="14" fill="#333">内存管理</text>
    <text x="352" y="372" font-size="12" fill="#555">虚拟内存 / 保护</text>
    <text x="518" y="355" font-size="14" fill="#333">文件管理</text>
    <text x="518" y="372" font-size="12" fill="#555">目录 / 文件系统</text>
    <text x="684" y="355" font-size="14" fill="#333">设备管理</text>
    <text x="684" y="372" font-size="12" fill="#555">驱动 / DMA</text>
  </g>

  <!-- 左侧：视角① 资源管理者（青色括号） -->
  <line x1="72" y1="210" x2="72" y2="400" stroke="#1f6f8b" stroke-width="2.4"/>
  <line x1="60" y1="210" x2="84" y2="210" stroke="#1f6f8b" stroke-width="2.4"/>
  <line x1="60" y1="400" x2="84" y2="400" stroke="#1f6f8b" stroke-width="2.4"/>
  <text transform="rotate(-90 48 305)" x="48" y="305" font-size="14" fill="#1f6f8b" text-anchor="middle">视角① 资源管理者</text>

  <!-- 右侧：视角② 扩展的虚拟机（红色括号） -->
  <line x1="788" y1="210" x2="788" y2="400" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="776" y1="210" x2="800" y2="210" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="776" y1="400" x2="800" y2="400" stroke="#c0392b" stroke-width="2.4"/>
  <text transform="rotate(90 812 305)" x="812" y="305" font-size="14" fill="#c0392b" text-anchor="middle">视角② 扩展的虚拟机</text>

  <!-- 操作系统 → 硬件 双向箭头 -->
  <line x1="430" y1="400" x2="430" y2="452" stroke="#777" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="444" y="431" font-size="13" fill="#333" text-anchor="start">资源调度与驱动 / 中断响应</text>

  <!-- 硬件层 -->
  <rect x="160" y="452" width="540" height="88" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="430" y="478" font-size="14" fill="#333" text-anchor="middle">硬件层（裸机）</text>
  <g stroke="#ddd" stroke-width="1">
    <line x1="268" y1="492" x2="268" y2="518"/>
    <line x1="376" y1="492" x2="376" y2="518"/>
    <line x1="484" y1="492" x2="484" y2="518"/>
    <line x1="592" y1="492" x2="592" y2="518"/>
  </g>
  <g text-anchor="middle">
    <text x="214" y="510" font-size="14" fill="#333">CPU</text>
    <text x="214" y="528" font-size="12" fill="#555">执行程序</text>
    <text x="322" y="510" font-size="14" fill="#333">内存</text>
    <text x="322" y="528" font-size="12" fill="#555">易失存储</text>
    <text x="430" y="510" font-size="14" fill="#333">磁盘 / SSD</text>
    <text x="430" y="528" font-size="12" fill="#555">文件持久化</text>
    <text x="538" y="510" font-size="14" fill="#333">网卡</text>
    <text x="538" y="528" font-size="12" fill="#555">网络通信</text>
    <text x="646" y="510" font-size="14" fill="#333">I/O 设备</text>
    <text x="646" y="528" font-size="12" fill="#555">人机交互</text>
  </g>

  <!-- 底部小结 -->
  <text x="430" y="568" font-size="13" fill="#555" text-anchor="middle">内核向下：把混乱的硬件抽象成易用的虚拟机（扩展的虚拟机视角）</text>
  <text x="430" y="590" font-size="13" fill="#555" text-anchor="middle">内核向上：把稀缺的资源公平地分给竞争的程序（资源管理者视角）</text>
</svg>
