<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">一次中断的完整处理流程</title>
  <desc id="desc">纵向流程图。自上而下七个步骤：设备完成 I/O 发出中断请求、CPU 检查中断请求线并应答、保存现场（程序计数器与寄存器入栈）、用中断号查询中断向量表、跳转执行中断服务程序、恢复现场、返回被中断的指令继续执行。右侧为中断向量表示意，显示中断号映射到处理程序入口，并标注 0 号除零异常、14 号缺页故障、128 号系统调用。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="cyanarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <rect width="720" height="700" fill="#faf9f5"/>

  <text x="360" y="36" font-size="19" fill="#333" text-anchor="middle">一次中断的完整处理流程</text>
  <text x="360" y="58" font-size="13" fill="#777" text-anchor="middle">设备异步通知 CPU，CPU 处理完再返回 —— 《操作系统概念》第1章 §1.2.1</text>

  <!-- 中断向量表（右侧） -->
  <rect x="550" y="84" width="155" height="26" rx="4" fill="#f0f6f9" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="627" y="102" font-size="14" fill="#1f6f8b" text-anchor="middle">中断向量表</text>
  <rect x="550" y="110" width="155" height="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="1"/>
  <text x="560" y="127" font-size="13" fill="#333">0   除零异常</text>
  <rect x="550" y="134" width="155" height="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="1"/>
  <text x="560" y="151" font-size="13" fill="#333">14  缺页故障</text>
  <rect x="550" y="158" width="155" height="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="1"/>
  <text x="560" y="175" font-size="13" fill="#333">128 系统调用</text>
  <text x="627" y="202" font-size="13" fill="#555" text-anchor="middle">中断号 → 处理程序入口</text>

  <!-- 查表箭头：第 4 步指向向量表 -->
  <line x1="520" y1="341" x2="548" y2="122" stroke="#1f6f8b" stroke-width="1.8" marker-end="url(#cyanarrow)"/>
  <text x="545" y="222" font-size="13" fill="#1f6f8b">查表</text>

  <!-- 七个处理步骤 -->
  <g>
    <!-- 1 -->
    <rect x="30" y="84" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="113" r="12" fill="#1f6f8b"/>
    <text x="72" y="118" font-size="13" fill="#ffffff" text-anchor="middle">1</text>
    <text x="96" y="110" font-size="15" fill="#333">设备完成 I/O，发出中断请求</text>
    <text x="96" y="130" font-size="13" fill="#555">拉高中断请求线 interrupt-request line</text>

    <!-- 2 -->
    <rect x="30" y="160" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="189" r="12" fill="#1f6f8b"/>
    <text x="72" y="194" font-size="13" fill="#ffffff" text-anchor="middle">2</text>
    <text x="96" y="186" font-size="15" fill="#333">CPU 检查中断请求线并应答</text>
    <text x="96" y="206" font-size="13" fill="#555">每个指令周期末尾检查一次</text>

    <!-- 3 -->
    <rect x="30" y="236" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="265" r="12" fill="#1f6f8b"/>
    <text x="72" y="270" font-size="13" fill="#ffffff" text-anchor="middle">3</text>
    <text x="96" y="262" font-size="15" fill="#333">保存现场：程序计数器与寄存器入栈</text>
    <text x="96" y="282" font-size="13" fill="#555">为返回被中断指令做准备</text>

    <!-- 4 -->
    <rect x="30" y="312" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="341" r="12" fill="#1f6f8b"/>
    <text x="72" y="346" font-size="13" fill="#ffffff" text-anchor="middle">4</text>
    <text x="96" y="338" font-size="15" fill="#333">用中断号查询中断向量表</text>
    <text x="96" y="358" font-size="13" fill="#555">取得中断服务程序入口地址</text>

    <!-- 5 -->
    <rect x="30" y="388" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="417" r="12" fill="#1f6f8b"/>
    <text x="72" y="422" font-size="13" fill="#ffffff" text-anchor="middle">5</text>
    <text x="96" y="414" font-size="15" fill="#333">跳转执行中断服务程序（ISR）</text>
    <text x="96" y="434" font-size="13" fill="#555">处理事件，务必简短</text>

    <!-- 6 -->
    <rect x="30" y="464" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="493" r="12" fill="#1f6f8b"/>
    <text x="72" y="498" font-size="13" fill="#ffffff" text-anchor="middle">6</text>
    <text x="96" y="490" font-size="15" fill="#333">恢复现场：弹出寄存器与程序计数器</text>
    <text x="96" y="510" font-size="13" fill="#555">按保存的逆序弹出</text>

    <!-- 7 -->
    <rect x="30" y="540" width="490" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
    <circle cx="72" cy="569" r="12" fill="#1f6f8b"/>
    <text x="72" y="574" font-size="13" fill="#ffffff" text-anchor="middle">7</text>
    <text x="96" y="566" font-size="15" fill="#333">返回被中断的指令，继续执行</text>
    <text x="96" y="586" font-size="13" fill="#555">对程序而言仿佛什么都没发生</text>
  </g>

  <!-- 步骤之间的箭头 -->
  <g stroke="#999" stroke-width="2" marker-end="url(#arrow)">
    <line x1="290" y1="142" x2="290" y2="159"/>
    <line x1="290" y1="218" x2="290" y2="235"/>
    <line x1="290" y1="294" x2="290" y2="311"/>
    <line x1="290" y1="370" x2="290" y2="387"/>
    <line x1="290" y1="446" x2="290" y2="463"/>
    <line x1="290" y1="522" x2="290" y2="539"/>
  </g>

  <!-- 底部小结 -->
  <text x="360" y="660" font-size="13" fill="#555" text-anchor="middle">中断处理全程 CPU 独占：必须快（处理短）而干净（现场完整保存 / 恢复）</text>
</svg>
