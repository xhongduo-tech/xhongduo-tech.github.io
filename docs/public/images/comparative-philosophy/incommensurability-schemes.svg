<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">两种概念框架与诠释之桥</title>
<desc id="desc">印度-佛教概念框架与西方概念框架两个椭圆，中间以「翻译之桥」相连；上方标注归化谬误，下方标注异化谬误，中央标注宽容原则。</desc>
<rect x="0" y="0" width="800" height="470" fill="#faf9f5" />
<defs>
<marker id="arrowred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b" />
</marker>
</defs>
<!-- 归化谬误（上方警示） -->
<text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">归化：把「空」硬译成 nothingness，抹平差异</text>
<line x1="300" y1="72" x2="245" y2="112" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowred)" />
<line x1="500" y1="72" x2="555" y2="112" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowred)" />
<!-- 左椭圆：印度-佛教概念框架 -->
<ellipse cx="200" cy="238" rx="178" ry="158" fill="#f1ece1" stroke="#1f6f8b" stroke-width="2" />
<text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6f8b">印度-佛教概念框架</text>
<text x="163" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">空</text>
<text x="242" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">缘起</text>
<text x="158" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">涅槃</text>
<text x="237" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">无我</text>
<!-- 右椭圆：西方概念框架 -->
<ellipse cx="600" cy="238" rx="178" ry="158" fill="#f1ece1" stroke="#1f6f8b" stroke-width="2" />
<text x="600" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6f8b">西方概念框架</text>
<text x="558" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">being（存在）</text>
<text x="642" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">causality（因果）</text>
<text x="556" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">nothingness（虚无）</text>
<text x="636" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">the self（自我）</text>
<!-- 中央翻译之桥 -->
<rect x="358" y="200" width="84" height="72" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2" />
<text x="400" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">翻译之桥</text>
<text x="400" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">诠释即约定</text>
<!-- 宽容原则 -->
<text x="400" y="322" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#333">宽容原则：先假设对方是理性的，再检验具体分歧</text>
<!-- 异化谬误（下方警示） -->
<text x="400" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">异化：拒绝翻译、神秘化为「东方不可知」，取消论证</text>
<line x1="298" y1="408" x2="248" y2="364" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowred)" />
<line x1="502" y1="408" x2="552" y2="364" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowred)" />
</svg>
