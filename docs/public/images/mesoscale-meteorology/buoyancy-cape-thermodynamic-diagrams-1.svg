<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="sans-serif">
  <title>CAPE 与 CIN 示意图：气块路径与环境温度曲线之间的面积</title>
  <desc>示意高度-温度图上，环境温度曲线与气块路径的差值区域：CIN 为地面到 LFC 的负浮力面积，CAPE 为 LFC 到 EL 的正浮力面积。</desc>
  <rect width="640" height="520" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">CAPE 与 CIN：气块路径与环境曲线的面积</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="470" x2="580" y2="470" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="70" text-anchor="middle" font-size="14" fill="#333">高</text>
  <text x="40" y="130" text-anchor="middle" font-size="14" fill="#333">高度</text>
  <text x="40" y="460" text-anchor="middle" font-size="14" fill="#333">低</text>
  <text x="300" y="505" text-anchor="middle" font-size="14" fill="#333">温度 →</text>

  <!-- 环境温度曲线（直线） -->
  <line x1="300" y1="470" x2="520" y2="60" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="540" y="70" font-size="14" fill="#1f6f8b">环境温度</text>

  <!-- 气块路径：干绝热 LCL 之上湿绝热 -->
  <polyline points="300,470 330,400 350,310 372,250 396,200 418,170" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <polyline points="418,170 428,150 436,132 442,118 447,106" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="210" y="250" font-size="14" fill="#c0392b">气块路径</text>

  <!-- CIN 区域：地面到 LFC -->
  <polygon points="300,470 330,400 350,310 345,300 325,310 300,318 300,470" fill="#c0392b" opacity="0.18"/>
  <text x="230" y="380" font-size="14" fill="#c0392b">CIN（负浮力面积）</text>

  <!-- CAPE 区域：LFC 到 EL -->
  <polygon points="350,310 372,250 396,200 418,170 428,150 436,132 442,118 447,106 447,100 428,120 415,138 405,158 395,185 382,225 368,272 356,300 350,310" fill="#1f6f8b" opacity="0.2"/>
  <text x="470" y="225" font-size="14" fill="#1f6f8b">CAPE（正浮力面积）</text>

  <!-- 特征高度 -->
  <line x1="300" y1="310" x2="356" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="120" y="305" font-size="13" fill="#333">LFC（自由对流高度）</text>

  <line x1="447" y1="106" x2="565" y2="106" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="120" y="102" font-size="13" fill="#333">EL（平衡高度，云顶）</text>

  <line x1="300" y1="400" x2="330" y2="400" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="120" y="396" font-size="13" fill="#333">LCL（凝结高度，云底）</text>

  <!-- 标注 -->
  <text x="320" y="478" text-anchor="middle" font-size="13" fill="#333">地面气块起点（未饱和，先沿干绝热线上升）</text>
</svg>
