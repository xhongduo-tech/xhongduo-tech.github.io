<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="sans-serif">
  <title>地形降水与山谷风示意</title>
  <desc>示意气流过山：迎风坡抬升成云降水、背风坡焚风晴暖，叠加谷风与山风的昼夜环流。</desc>
  <rect width="720" height="460" fill="#faf9f5"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">地形降水与山谷风环流</text>

  <!-- 天空 -->
  <text x="60" y="70" font-size="14" fill="#1f6f8b">湿润气流（U）</text>

  <!-- 山体 -->
  <path d="M 260 400 Q 320 220 360 200 Q 400 220 470 400 Z" fill="#a8b59a"/>
  <text x="360" y="300" font-size="13" fill="#333">山脊</text>

  <!-- 迎风坡抬升 + 云 + 降水 -->
  <path d="M 200 120 Q 260 90 330 100 Q 300 130 240 150 Q 200 140 200 120 Z" fill="#9bb8cf" opacity="0.7"/>
  <path d="M 180 90 Q 240 60 300 75 Q 275 100 215 115 Q 180 105 180 90 Z" fill="#8aa8c0" opacity="0.6"/>
  <text x="250" y="60" font-size="14" fill="#1f6f8b">地形云（feeder）</text>
  <text x="300" y="130" font-size="13" fill="#1f6f8b">迎风坡降水</text>
  <line x1="290" y1="160" x2="286" y2="220" stroke="#5b8db8" stroke-width="3"/>
  <line x1="300" y1="165" x2="296" y2="230" stroke="#5b8db8" stroke-width="3"/>
  <line x1="312" y1="168" x2="309" y2="235" stroke="#5b8db8" stroke-width="3"/>

  <!-- 气流箭头翻山 -->
  <path d="M 80 180 Q 240 120 360 150 Q 460 190 640 150" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="600" y="135" font-size="13" fill="#1f6f8b">背风坡下沉</text>

  <!-- 焚风 -->
  <path d="M 520 160 Q 560 240 560 320" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="585" y="250" font-size="13" fill="#c0392b">焚风（干热）</text>

  <!-- 谷风（白天） -->
  <text x="90" y="330" font-size="13" fill="#2e8b8b">白天谷风（上坡）</text>
  <path d="M 150 360 Q 240 300 330 250" fill="none" stroke="#2e8b8b" stroke-width="2.5" marker-end="url(#arrowb)"/>

  <!-- 山风（夜间） -->
  <text x="90" y="380" font-size="13" fill="#5d6d7e">夜间山风（下坡）</text>
  <path d="M 330 290 Q 240 340 150 400" fill="none" stroke="#5d6d7e" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowd)"/>

  <defs>
    <marker id="arrowb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e8b8b"/>
    </marker>
    <marker id="arrowd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5d6d7e"/>
    </marker>
  </defs>

  <!-- 地面 -->
  <line x1="40" y1="400" x2="680" y2="400" stroke="#333" stroke-width="2"/>
  <text x="360" y="440" text-anchor="middle" font-size="13" fill="#333">迎风坡：抬升成云、降水增强 ｜ 背风坡：下沉焚风、晴暖干燥</text>
</svg>
