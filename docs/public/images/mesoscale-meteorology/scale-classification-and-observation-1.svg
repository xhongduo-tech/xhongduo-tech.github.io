<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <title>大气运动尺度谱：中尺度 α/β/γ 三分示意</title>
  <desc>一条从微尺度到天气尺度的水平尺度谱，标注 Orlanski 中尺度 α/β/γ 三档及其典型现象与主导动力学。</desc>
  <rect width="760" height="420" fill="#faf9f5"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">大气运动的水平尺度谱与中尺度三分</text>

  <!-- 坐标轴 -->
  <text x="60" y="96" text-anchor="middle" font-size="14" fill="#333">1 km</text>
  <text x="158" y="96" text-anchor="middle" font-size="14" fill="#333">2 km</text>
  <text x="330" y="96" text-anchor="middle" font-size="14" fill="#333">20 km</text>
  <text x="502" y="96" text-anchor="middle" font-size="14" fill="#333">200 km</text>
  <text x="674" y="96" text-anchor="middle" font-size="14" fill="#333">2000 km</text>
  <text x="733" y="96" text-anchor="end" font-size="14" fill="#333">10⁴ km</text>

  <!-- 尺度条 -->
  <rect x="70" y="112" width="70" height="52" fill="#9aa5b1"/>
  <rect x="140" y="112" width="190" height="52" fill="#1f6f8b"/>
  <rect x="330" y="112" width="172" height="52" fill="#2e8b8b"/>
  <rect x="502" y="112" width="172" height="52" fill="#c0392b"/>
  <rect x="674" y="112" width="58" height="52" fill="#e8c47a"/>

  <!-- 分界刻度 -->
  <line x1="140" y1="104" x2="140" y2="176" stroke="#333" stroke-width="1.2"/>
  <line x1="330" y1="104" x2="330" y2="176" stroke="#333" stroke-width="1.2"/>
  <line x1="502" y1="104" x2="502" y2="176" stroke="#333" stroke-width="1.2"/>
  <line x1="674" y1="104" x2="674" y2="176" stroke="#333" stroke-width="1.2"/>

  <!-- 档位标签 -->
  <text x="105" y="144" text-anchor="middle" font-size="15" fill="#fff">微尺度</text>
  <text x="235" y="144" text-anchor="middle" font-size="15" fill="#fff">中尺度 γ</text>
  <text x="416" y="144" text-anchor="middle" font-size="15" fill="#fff">中尺度 β</text>
  <text x="588" y="144" text-anchor="middle" font-size="15" fill="#fff">中尺度 α</text>
  <text x="703" y="144" text-anchor="middle" font-size="15" fill="#333">天气尺度</text>

  <!-- 典型现象 -->
  <text x="235" y="208" text-anchor="middle" font-size="13" fill="#333">积云单体 · 下击暴流</text>
  <text x="416" y="208" text-anchor="middle" font-size="13" fill="#333">海陆风 · 超级单体</text>
  <text x="588" y="208" text-anchor="middle" font-size="13" fill="#333">飑线 · MCS · 锋面雨带</text>
  <text x="703" y="208" text-anchor="middle" font-size="13" fill="#333">气旋 · 锋面</text>

  <!-- 动力学标注 -->
  <text x="380" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Ro ≈ U / (f·L)　在中尺度跨越 1</text>
  <text x="380" y="282" text-anchor="middle" font-size="14" fill="#333">左端：非地转 + 强垂直运动（惯性力主导）</text>
  <text x="380" y="304" text-anchor="middle" font-size="14" fill="#333">右端：准地转平衡（科里奥利力与气压梯度力相抵）</text>

  <!-- 观测手段 -->
  <rect x="140" y="336" width="534" height="2" fill="#1f6f8b"/>
  <text x="140" y="360" text-anchor="start" font-size="13" fill="#333">常规探空网</text>
  <text x="140" y="378" text-anchor="start" font-size="13" fill="#333">地面自动站网</text>
  <text x="300" y="360" text-anchor="start" font-size="13" fill="#333">双偏振多普勒雷达</text>
  <text x="300" y="378" text-anchor="start" font-size="13" fill="#333">气象卫星（GOES-R）</text>
  <text x="560" y="360" text-anchor="start" font-size="13" fill="#333">风廓线雷达</text>
  <text x="560" y="378" text-anchor="start" font-size="13" fill="#333">下投探空（dropsonde）</text>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#1f6f8b">尺度越小，对观测的时空分辨率要求越高</text>
</svg>
