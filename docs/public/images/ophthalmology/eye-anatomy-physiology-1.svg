<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="t d">
<title id="t">人眼矢状面结构示意图</title>
<desc id="d">人眼横截面示意图，标出角膜、虹膜、瞳孔、晶状体、睫状体、玻璃体、视网膜、视神经、巩膜等主要解剖结构。</desc>
<!-- 巩膜（外层轮廓） -->
<ellipse cx="340" cy="215" rx="225" ry="170" fill="#faf9f5" stroke="#333" stroke-width="3"/>
<!-- 玻璃体（内腔） -->
<ellipse cx="395" cy="215" rx="150" ry="138" fill="#e8edf2" stroke="none"/>
<!-- 视网膜（内层，红色粗弧） -->
<path d="M 175 100 C 380 60, 520 120, 548 215 C 520 310, 380 370, 175 330" fill="none" stroke="#c0392b" stroke-width="6"/>
<!-- 视神经 -->
<rect x="538" y="197" width="127" height="36" rx="10" fill="#c0392b"/>
<!-- 晶状体（双凸） -->
<path d="M 238 175 Q 296 215 238 255 Q 180 215 238 175 Z" fill="#f4efdd" stroke="#333" stroke-width="2"/>
<!-- 睫状体（上下两个楔形） -->
<path d="M 186 142 L 260 155 L 252 178 Z" fill="#d9a46b" stroke="#333" stroke-width="1.5"/>
<path d="M 186 288 L 260 275 L 252 252 Z" fill="#d9a46b" stroke="#333" stroke-width="1.5"/>
<!-- 虹膜 -->
<ellipse cx="188" cy="215" rx="20" ry="82" fill="#8fb3c8" stroke="#333" stroke-width="2"/>
<!-- 瞳孔 -->
<circle cx="188" cy="215" r="15" fill="#1a1a1a"/>
<!-- 角膜（前凸透明层） -->
<path d="M 118 110 C 70 140, 66 290, 118 320 L 130 320 C 105 285, 105 145, 130 110 Z" fill="#dceef2" stroke="#1f6f8b" stroke-width="3"/>
<!-- 光线箭头 -->
<line x1="15" y1="215" x2="58" y2="215" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="58,215 48,211 48,219" fill="#c0392b"/>
<text x="10" y="200" font-size="14" fill="#c0392b" font-family="sans-serif">光线</text>
<!-- 标注与引线 -->
<line x1="45" y1="120" x2="98" y2="118" stroke="#999" stroke-width="1"/>
<text x="10" y="116" font-size="15" fill="#333" font-family="sans-serif">角膜</text>
<line x1="128" y1="90" x2="182" y2="138" stroke="#999" stroke-width="1"/>
<text x="95" y="86" font-size="15" fill="#333" font-family="sans-serif">虹膜</text>
<line x1="128" y1="300" x2="186" y2="236" stroke="#999" stroke-width="1"/>
<text x="98" y="316" font-size="15" fill="#333" font-family="sans-serif">瞳孔</text>
<line x1="360" y1="100" x2="270" y2="168" stroke="#999" stroke-width="1"/>
<text x="366" y="96" font-size="15" fill="#333" font-family="sans-serif">晶状体</text>
<line x1="300" y1="350" x2="248" y2="282" stroke="#999" stroke-width="1"/>
<text x="260" y="368" font-size="15" fill="#333" font-family="sans-serif">睫状体</text>
<line x1="455" y1="330" x2="410" y2="272" stroke="#999" stroke-width="1"/>
<text x="420" y="348" font-size="15" fill="#333" font-family="sans-serif">玻璃体</text>
<line x1="150" y1="385" x2="200" y2="345" stroke="#999" stroke-width="1"/>
<text x="110" y="405" font-size="15" fill="#333" font-family="sans-serif">视网膜</text>
<line x1="600" y1="300" x2="600" y2="240" stroke="#999" stroke-width="1"/>
<text x="555" y="316" font-size="15" fill="#333" font-family="sans-serif">视神经</text>
<line x1="560" y1="60" x2="490" y2="78" stroke="#999" stroke-width="1"/>
<text x="566" y="56" font-size="15" fill="#333" font-family="sans-serif">巩膜</text>
</svg>
