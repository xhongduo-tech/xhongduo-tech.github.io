<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t d">
<title id="t">视觉通路与视交叉示意图</title>
<desc id="d">自双眼经视神经、视交叉、视束、外侧膝状体、视放射至枕叶视皮质的视觉通路示意，红色为交叉的鼻侧纤维，青色为不交叉的颞侧纤维。</desc>
<!-- 双眼 -->
<ellipse cx="150" cy="100" rx="42" ry="34" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
<ellipse cx="570" cy="100" rx="42" ry="34" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
<text x="150" y="52" font-size="16" fill="#333" font-family="sans-serif" text-anchor="middle">左眼</text>
<text x="570" y="52" font-size="16" fill="#333" font-family="sans-serif" text-anchor="middle">右眼</text>
<!-- 鼻侧纤维（交叉，红色）：左眼→右视束，右眼→左视束 -->
<path d="M 148 128 C 200 150, 300 152, 340 160 L 385 186 C 410 202, 432 218, 450 238" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 568 128 C 520 150, 420 152, 380 160 L 335 186 C 310 202, 288 218, 270 238" fill="none" stroke="#c0392b" stroke-width="3"/>
<!-- 颞侧纤维（不交叉，青色） -->
<path d="M 152 128 L 300 160 L 292 232" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<path d="M 568 128 L 420 160 L 428 232" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<!-- 外侧膝状体 LGN -->
<circle cx="270" cy="245" r="15" fill="#dceef2" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="450" cy="245" r="15" fill="#dceef2" stroke="#1f6f8b" stroke-width="2"/>
<text x="270" y="282" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">外侧膝状体</text>
<text x="450" y="282" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">外侧膝状体</text>
<!-- 视放射 -->
<path d="M 268 260 C 250 300, 232 318, 214 342" fill="none" stroke="#666" stroke-width="3"/>
<path d="M 452 260 C 470 300, 488 318, 506 342" fill="none" stroke="#666" stroke-width="3"/>
<!-- 枕叶视皮质 V1 -->
<rect x="150" y="348" width="128" height="52" rx="8" fill="#f0eef6" stroke="#333" stroke-width="2"/>
<text x="214" y="372" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">左枕叶视皮质 V1</text>
<text x="214" y="392" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">处理右侧视野</text>
<rect x="442" y="348" width="128" height="52" rx="8" fill="#f0eef6" stroke="#333" stroke-width="2"/>
<text x="506" y="372" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">右枕叶视皮质 V1</text>
<text x="506" y="392" font-size="14" fill="#333" font-family="sans-serif" text-anchor="middle">处理左侧视野</text>
<!-- 结构标注 -->
<line x1="262" y1="92" x2="252" y2="122" stroke="#999" stroke-width="1"/>
<text x="268" y="88" font-size="15" fill="#333" font-family="sans-serif">视神经</text>
<line x1="360" y1="126" x2="360" y2="152" stroke="#999" stroke-width="1"/>
<text x="330" y="120" font-size="15" fill="#333" font-family="sans-serif">视交叉</text>
<line x1="318" y1="212" x2="306" y2="202" stroke="#999" stroke-width="1"/>
<text x="322" y="230" font-size="15" fill="#333" font-family="sans-serif">视束</text>
<line x1="196" y1="300" x2="232" y2="312" stroke="#999" stroke-width="1"/>
<text x="140" y="300" font-size="15" fill="#333" font-family="sans-serif">视放射</text>
<line x1="524" y1="300" x2="488" y2="312" stroke="#999" stroke-width="1"/>
<text x="536" y="300" font-size="15" fill="#333" font-family="sans-serif">视放射</text>
<!-- 图例 -->
<line x1="36" y1="330" x2="76" y2="330" stroke="#c0392b" stroke-width="3"/>
<text x="84" y="335" font-size="14" fill="#333" font-family="sans-serif">鼻侧纤维（交叉）</text>
<line x1="36" y1="358" x2="76" y2="358" stroke="#1f6f8b" stroke-width="3"/>
<text x="84" y="363" font-size="14" fill="#333" font-family="sans-serif">颞侧纤维（不交叉）</text>
</svg>
