<svg viewBox="0 0 820 460" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>细胞损伤、适应与死亡的路径</title>
  <desc>从正常细胞出发，在应激之下要么进入适应分支（肥大、萎缩、化生、增生）并恢复稳态，要么走向可逆损伤（肿胀、脂肪变），越过不可逆临界点后分别进入坏死或凋亡。</desc>
  <rect width="820" height="460" fill="#ffffff"/>
  <!-- 正常细胞 -->
  <rect x="330" y="20" width="160" height="46" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="410" y="48" text-anchor="middle" font-size="16" fill="#333">正常细胞</text>
  <line x1="410" y1="66" x2="410" y2="96" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="420" y="82" font-size="13" fill="#666">应激/损伤信号</text>
  <rect x="330" y="96" width="160" height="40" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="410" y="121" text-anchor="middle" font-size="14" fill="#333">缺氧 · 毒物 · 感染 · 免疫</text>
  <!-- 分支到适应 -->
  <line x1="380" y1="136" x2="380" y2="170" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="380" y1="170" x2="190" y2="170" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="190" y1="170" x2="190" y2="200" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="285" y="163" text-anchor="middle" font-size="13" fill="#1f6f8b">应激持续但可耐受</text>
  <rect x="70" y="200" width="240" height="86" rx="8" fill="#eaf3f1" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="190" y="226" text-anchor="middle" font-size="15" fill="#1f6f8b">适应</text>
  <text x="190" y="250" text-anchor="middle" font-size="13" fill="#333">肥大 · 增生 · 萎缩 · 化生</text>
  <text x="190" y="272" text-anchor="middle" font-size="13" fill="#333">（代偿性改变表型维持稳态）</text>
  <line x1="190" y1="286" x2="190" y2="330" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="190" y1="330" x2="410" y2="330" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#1f6f8b" font-style="italic">病因撤除→恢复稳态</text>
  <line x1="410" y1="330" x2="410" y2="360" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr4)"/>
  <!-- 可逆损伤 -->
  <line x1="440" y1="136" x2="440" y2="160" stroke="#c0392b" stroke-width="2"/>
  <rect x="320" y="160" width="240" height="58" rx="8" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" font-size="14" fill="#c0392b">可逆损伤</text>
  <text x="440" y="207" text-anchor="middle" font-size="13" fill="#333">细胞肿胀 · 脂肪变（撤因可恢复）</text>
  <line x1="440" y1="218" x2="440" y2="252" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="252" x2="560" y2="252" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="440" y="272" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">不可逆临界点</text>
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#c0392b">（ATP 耗竭 · 线粒体损伤 · 膜破裂）</text>
  <!-- 坏死与凋亡 -->
  <line x1="330" y1="298" x2="330" y2="320" stroke="#c0392b" stroke-width="2"/>
  <line x1="330" y1="320" x2="220" y2="320" stroke="#c0392b" stroke-width="2"/>
  <line x1="220" y1="320" x2="220" y2="346" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="90" y="346" width="260" height="90" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="220" y="370" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">坏死（necrosis）</text>
  <text x="220" y="392" text-anchor="middle" font-size="13" fill="#333">被动死亡 · 膜破裂</text>
  <text x="220" y="410" text-anchor="middle" font-size="13" fill="#333">凝固性 / 液化性 / 干酪样…</text>
  <text x="220" y="428" text-anchor="middle" font-size="13" fill="#c0392b">★ 必然引发炎症</text>
  <line x1="550" y1="298" x2="550" y2="320" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="550" y1="320" x2="600" y2="320" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="600" y1="320" x2="600" y2="346" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr4)"/>
  <rect x="470" y="346" width="260" height="90" rx="8" fill="#eaf3f1" stroke="#1f6f8b" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">凋亡（apoptosis）</text>
  <text x="600" y="392" text-anchor="middle" font-size="13" fill="#333">主动死亡 · 膜完整</text>
  <text x="600" y="410" text-anchor="middle" font-size="13" fill="#333">外源性（死亡受体）/ 内源性（线粒体）</text>
  <text x="600" y="428" text-anchor="middle" font-size="13" fill="#1f6f8b">★ 不引起炎症</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#333"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1f6f8b"/>
    </marker>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
