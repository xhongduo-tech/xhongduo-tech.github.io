<svg viewBox="0 0 840 660" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>肿瘤的十大标志性特征</title>
  <desc>以肿瘤为中心，环绕十个标志：持续增殖信号、逃避生长抑制、抵抗凋亡、无限复制、诱导血管生成、侵袭与转移、代谢重编程、逃避免疫监视、基因组不稳定、促进性炎症。</desc>
  <rect width="840" height="660" fill="#ffffff"/>
  <circle cx="420" cy="330" r="62" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="420" y="322" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">肿瘤</text>
  <text x="420" y="344" text-anchor="middle" font-size="13" fill="#333">十大标志</text>
  <!-- 10 boxes positioned on a circle -->
  <line x1="420" y1="268" x2="420" y2="170" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="474" y1="284" x2="585" y2="216" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="480" y1="312" x2="620" y2="300" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="480" y1="348" x2="620" y2="360" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="474" y1="376" x2="585" y2="444" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="420" y1="392" x2="420" y2="490" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="366" y1="376" x2="255" y2="444" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="360" y1="348" x2="220" y2="360" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="360" y1="312" x2="220" y2="300" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="366" y1="284" x2="255" y2="216" stroke="#c0392b" stroke-width="1.5"/>
  <!-- box helper: x,y centered -->
  <rect x="325" y="106" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="420" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">① 持续增殖信号</text>
  <text x="420" y="154" text-anchor="middle" font-size="13" fill="#333">自足生长信号（RAS/MYC）</text>
  <rect x="490" y="152" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="585" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">② 逃避生长抑制</text>
  <text x="585" y="200" text-anchor="middle" font-size="13" fill="#333">RB/p53 通路失活</text>
  <rect x="625" y="268" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="720" y="294" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">③ 抵抗细胞凋亡</text>
  <text x="720" y="316" text-anchor="middle" font-size="13" fill="#333">BCL2 过表达 / p53 丢失</text>
  <rect x="625" y="328" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="720" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">④ 无限复制潜能</text>
  <text x="720" y="376" text-anchor="middle" font-size="13" fill="#333">端粒酶激活·永生化</text>
  <rect x="490" y="444" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="585" y="470" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑤ 诱导血管生成</text>
  <text x="585" y="492" text-anchor="middle" font-size="13" fill="#333">VEGF 等促血管因子</text>
  <rect x="325" y="490" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="420" y="516" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑥ 激活侵袭与转移</text>
  <text x="420" y="538" text-anchor="middle" font-size="13" fill="#333">EMT·基质金属蛋白酶</text>
  <rect x="160" y="444" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="255" y="470" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑦ 能量代谢重编程</text>
  <text x="255" y="492" text-anchor="middle" font-size="13" fill="#333">Warburg 有氧糖酵解</text>
  <rect x="25" y="328" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="120" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑧ 逃避免疫监视</text>
  <text x="120" y="376" text-anchor="middle" font-size="13" fill="#333">PD-L1 抑制 T 细胞</text>
  <rect x="25" y="268" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="120" y="294" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑨ 基因组不稳定</text>
  <text x="120" y="316" text-anchor="middle" font-size="13" fill="#333">突变·修复缺陷（总引擎）</text>
  <rect x="160" y="152" width="190" height="64" rx="8" fill="#f2f7f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="255" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">⑩ 肿瘤促进性炎症</text>
  <text x="255" y="200" text-anchor="middle" font-size="13" fill="#333">慢性炎症·微环境</text>
</svg>
