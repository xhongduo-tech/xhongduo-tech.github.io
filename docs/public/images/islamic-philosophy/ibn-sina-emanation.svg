<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700">
  <title>伊本·西那的「必然—可能」存在论结构</title>
  <desc>从必然存在者（真主）经十级理智流溢，到月下界可能存在者的纵向结构图，标注「本质与存在」的区分。</desc>
  <rect width="640" height="700" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">伊本·西那：从必然存在者到可能存在者</text>

  <rect x="180" y="60" width="280" height="78" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">必然存在者（真主）</text>
  <text x="320" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">wājib al-wujūd</text>
  <text x="320" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">本质 = 存在 · 因自身而必然</text>

  <line x1="320" y1="138" x2="320" y2="170" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="160" font-family="sans-serif" font-size="13" fill="#1f6f8b">自知 → 流溢</text>

  <rect x="180" y="170" width="280" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">第一理智 I₁</text>
  <text x="320" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">流溢的起点 · 天界层级对应</text>

  <line x1="320" y1="226" x2="320" y2="250" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <rect x="180" y="250" width="280" height="50" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="273" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">第二至第九理智 I₂ … I₉</text>
  <text x="320" y="291" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">逐级「稀薄化」</text>

  <line x1="320" y1="300" x2="320" y2="324" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <rect x="180" y="324" width="280" height="56" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold">第十理智 I₁₀ = 能动理智</text>
  <text x="320" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">光照月下界 · 知识的来源</text>

  <line x1="320" y1="380" x2="320" y2="410" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="100" y="410" width="440" height="190" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">月下界：可能存在者（mumkin al-wujūd）</text>
  <text x="320" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">马 · 人 · 山 · 树 ……</text>
  <text x="320" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">本质 ≠ 存在：马的「马性」不蕴含存在</text>
  <text x="320" y="518" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">存在不由自身，而由他者赋予</text>
  <text x="320" y="552" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold">存在之链必然终止于唯一必然存在者</text>

  <text x="560" y="470" font-family="sans-serif" font-size="13" fill="#333">关键区分</text>
  <text x="560" y="490" font-family="sans-serif" font-size="13" fill="#c0392b">可能存在者</text>
  <text x="560" y="508" font-family="sans-serif" font-size="13" fill="#333">本质 ≠ 存在</text>
  <text x="560" y="534" font-family="sans-serif" font-size="13" fill="#1f6f8b">必然存在者</text>
  <text x="560" y="552" font-family="sans-serif" font-size="13" fill="#333">本质 = 存在</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
