<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="sans-serif">
<title>域对抗神经网络 DANN 结构图</title>
<desc>源域与目标域图像分别进入共享特征抽取器 Gf，特征同时喂给标签分类器 Gy 与经梯度反转层的域判别器 Gd。</desc>
<rect width="840" height="400" fill="#faf9f5"/>
<text x="420" y="36" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">域对抗神经网络（DANN）</text>
<rect x="30" y="90" width="150" height="60" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="105" y="116" font-size="14" fill="#333" text-anchor="middle">源域图像（有标签）</text>
<text x="105" y="138" font-size="13" fill="#666" text-anchor="middle">D_S</text>
<rect x="30" y="230" width="150" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="105" y="256" font-size="14" fill="#333" text-anchor="middle">目标域图像（无标签）</text>
<text x="105" y="278" font-size="13" fill="#666" text-anchor="middle">D_T</text>
<rect x="300" y="160" width="180" height="70" rx="8" fill="#333"/>
<text x="390" y="192" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">特征抽取器 Gf</text>
<text x="390" y="214" font-size="13" fill="#ccc" text-anchor="middle">共享参数 θf</text>
<line x1="180" y1="120" x2="300" y2="178" stroke="#333" stroke-width="2"/>
<line x1="180" y1="260" x2="300" y2="212" stroke="#333" stroke-width="2"/>
<rect x="580" y="60" width="200" height="70" rx="8" fill="#c0392b"/>
<text x="680" y="92" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">标签分类器 Gy</text>
<text x="680" y="114" font-size="13" fill="#f5e6e0" text-anchor="middle">损失 Ly（源域监督）</text>
<line x1="480" y1="185" x2="580" y2="105" stroke="#333" stroke-width="2"/>
<rect x="580" y="220" width="200" height="70" rx="8" fill="#1f6f8b"/>
<text x="680" y="252" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">域判别器 Gd</text>
<text x="680" y="274" font-size="13" fill="#dceff5" text-anchor="middle">损失 Ld（源/目标判别）</text>
<rect x="500" y="175" width="60" height="160" rx="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="530" y="238" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">梯度</text>
<text x="530" y="258" font-size="13" fill="#333" text-anchor="middle">反转</text>
<text x="530" y="278" font-size="13" fill="#333" text-anchor="middle">层</text>
<text x="530" y="298" font-size="12" fill="#666" text-anchor="middle">(GRL)</text>
<line x1="480" y1="205" x2="500" y2="205" stroke="#333" stroke-width="2"/>
<line x1="500" y1="255" x2="580" y2="255" stroke="#333" stroke-width="2"/>
<text x="530" y="330" font-size="13" fill="#666" text-anchor="middle">正向：恒等</text>
<text x="530" y="348" font-size="13" fill="#666" text-anchor="middle">反向：梯度取反</text>
<line x1="530" y1="335" x2="530" y2="315" stroke="#666" stroke-width="1"/>
<text x="420" y="382" font-size="13" fill="#333" text-anchor="middle">min (θf,θy) max θd ［ Ly − λ·Ld ］——特征骗过判别器 → 域不变特征</text>
</svg>
