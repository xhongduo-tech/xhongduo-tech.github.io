<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
<title>MAML 参数空间的起点学习示意</title>
<desc>参数空间中三个任务的解区域呈三角形分布，元起点位于三者交界处，从起点出发沿各自梯度一步到达各任务适应参数。</desc>
<rect width="820" height="440" fill="#faf9f5"/>
<text x="410" y="36" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">参数空间 θ 中的「起点学习」</text>
<path d="M 410 200 L 250 60 L 570 60 Z" fill="#f5e6e0" stroke="#c0392b" stroke-width="1.5" opacity="0.45"/>
<path d="M 180 320 L 330 240 L 420 330 Z" fill="#dceff5" stroke="#1f6f8b" stroke-width="1.5" opacity="0.45"/>
<path d="M 560 330 L 660 250 L 700 350 Z" fill="#e8e8e4" stroke="#666" stroke-width="1.5" opacity="0.45"/>
<text x="400" y="50" font-size="13" fill="#c0392b" text-anchor="middle">任务 1 的好解区域</text>
<text x="300" y="300" font-size="13" fill="#1f6f8b" text-anchor="middle">任务 2 的好解区域</text>
<text x="660" y="320" font-size="13" fill="#666" text-anchor="middle">任务 3 的好解区域</text>
<circle cx="380" cy="230" r="7" fill="#333"/>
<text x="380" y="212" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">θ*</text>
<text x="350" y="265" font-size="13" fill="#333" text-anchor="middle">元起点</text>
<line x1="380" y1="230" x2="270" y2="120" stroke="#c0392b" stroke-width="2"/>
<circle cx="272" cy="120" r="5" fill="#c0392b"/>
<text x="242" y="112" font-size="13" fill="#c0392b" text-anchor="end">θ'₁ = θ − α∇θL₁</text>
<line x1="380" y1="230" x2="310" y2="285" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="310" cy="285" r="5" fill="#1f6f8b"/>
<text x="250" y="318" font-size="13" fill="#1f6f8b" text-anchor="middle">θ'₂</text>
<line x1="380" y1="230" x2="600" y2="290" stroke="#666" stroke-width="2"/>
<circle cx="600" cy="290" r="5" fill="#666"/>
<text x="622" y="288" font-size="13" fill="#666" text-anchor="start">θ'₃</text>
<text x="300" y="160" font-size="13" fill="#c0392b" text-anchor="end">内环：对任务各自走几步</text>
<path d="M 480 60 C 520 20 640 20 680 60" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M 480 60 C 520 20 640 20 680 60" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4" transform="translate(0 6)"/>
<path d="M 480 60 C 520 20 640 20 680 60" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4" transform="translate(0 12)"/>
<text x="700" y="60" font-size="13" fill="#333" text-anchor="start">外环：用各 θ'i 的查询集误差</text>
<text x="700" y="80" font-size="13" fill="#333" text-anchor="start">更新起点 θ ← θ − β∇θΣ</text>
<text x="410" y="412" font-size="13" fill="#333" text-anchor="middle">起点 θ* 不是任何单一任务的解，而是「离每个任务都好解都近」的位置</text>
</svg>
