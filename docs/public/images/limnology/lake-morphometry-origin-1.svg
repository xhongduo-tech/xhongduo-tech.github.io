<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>湖泊盆地的形态测量要素</title>
<desc>湖泊横剖面示意图，标出湖面面积、最大深度、平均深度、容积与岸线等形态测量要素。</desc>
<rect width="420" height="280" fill="#faf9f5"/>
<!-- sky -->
<rect x="20" y="30" width="380" height="60" fill="#e8f1f5"/>
<!-- lake basin (blue fill) -->
<path d="M20 90 L120 90 C150 90 160 110 190 150 C210 178 235 195 260 195 C290 195 310 170 330 150 C360 120 380 95 400 90 L400 250 L20 250 Z" fill="#cfe3ea"/>
<!-- sediment below -->
<path d="M20 90 L120 90 C150 90 160 110 190 150 C210 178 235 195 260 195 C290 195 310 170 330 150 C360 120 380 95 400 90 L400 250 L20 250 Z" fill="#8fb9c7"/>
<!-- shoreline line -->
<line x1="20" y1="90" x2="400" y2="90" stroke="#1f6f8b" stroke-width="2.5"/>
<!-- deepest point marker -->
<circle cx="260" cy="195" r="4" fill="#c0392b"/>
<line x1="260" y1="90" x2="260" y2="195" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="266" y="150" font-size="14" fill="#c0392b">最大深度 z&#8321;&#8336;&#8349;</text>
<!-- mean depth dashed line -->
<line x1="30" y1="145" x2="395" y2="145" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="30" y="140" font-size="14" fill="#c0392b">平均深度 z̄（V / A）</text>
<!-- volume label -->
<text x="120" y="225" font-size="14" fill="#faf9f5">容积 V</text>
<!-- surface area annotation -->
<line x1="20" y1="66" x2="400" y2="66" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="150" y="60" font-size="14" fill="#1f6f8b">湖面面积 A</text>
<!-- shoreline label -->
<text x="330" y="84" font-size="13" fill="#1f6f8b">岸线 L</text>
</svg>
