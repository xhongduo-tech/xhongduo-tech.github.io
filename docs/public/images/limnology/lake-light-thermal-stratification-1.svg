<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>湖泊温度分层结构</title>
<desc>左侧为夏季湖泊横剖面的分层示意（表水层、温跃层、深水层），右侧为水温随深度的典型剖面曲线。</desc>
<rect width="440" height="300" fill="#faf9f5"/>
<!-- left: lake cross-section -->
<text x="40" y="30" font-size="14" fill="#333">夏季分层</text>
<path d="M20 60 L180 60 C195 60 200 66 205 80 C212 100 218 130 220 150 C222 180 225 230 226 270 L20 270 Z" fill="#cfe3ea"/>
<!-- layers -->
<rect x="20" y="60" width="206" height="55" fill="#eef5f8"/>
<rect x="20" y="115" width="220" height="45" fill="#cfe3ea"/>
<rect x="20" y="160" width="226" height="110" fill="#9dbcc9"/>
<line x1="20" y1="115" x2="226" y2="115" stroke="#1f6f8b" stroke-width="2"/>
<line x1="20" y1="160" x2="226" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="28" y="92" font-size="14" fill="#1f6f8b">表水层 epilimnion（暖）</text>
<text x="28" y="145" font-size="13" fill="#1f6f8b">温跃层 metalimnion（温度骤降）</text>
<text x="28" y="205" font-size="14" fill="#faf9f5">深水层 hypolimnion（冷）</text>
<text x="28" y="250" font-size="13" fill="#faf9f5">沉积物</text>
<!-- right: temperature profile -->
<text x="300" y="30" font-size="14" fill="#333">水温剖面</text>
<line x1="260" y1="60" x2="260" y2="270" stroke="#666" stroke-width="1.5"/>
<line x1="260" y1="60" x2="420" y2="60" stroke="#666" stroke-width="1.5"/>
<text x="268" y="274" font-size="13" fill="#333">0</text>
<text x="398" y="274" font-size="13" fill="#333">25 °C</text>
<text x="222" y="60" font-size="13" fill="#333">深</text>
<text x="222" y="275" font-size="13" fill="#333">0</text>
<!-- summer curve -->
<path d="M260 60 C275 60 285 64 295 78 C300 88 302 96 303 104 C304 115 302 120 298 126 C290 138 280 142 268 143 L266 270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<!-- winter curve -->
<path d="M420 270 C405 270 395 262 388 246 C383 236 380 226 379 216 C377 202 378 196 382 190 C388 180 396 176 404 175 L406 60" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 3"/>
<text x="300" y="52" font-size="13" fill="#c0392b">夏</text>
<text x="352" y="270" font-size="13" fill="#1f6f8b">冬</text>
</svg>
