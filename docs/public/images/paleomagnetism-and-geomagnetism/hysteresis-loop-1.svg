<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>磁滞回线示意图</title>
  <desc>以磁化强度 M 为纵轴、外磁场 H 为横轴，绘出一条典型的铁磁性材料磁滞回线，标注饱和磁化强度 Ms、剩余磁化强度 Mr 与矫顽力 Hc。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="60" y1="240" x2="590" y2="240" stroke="#333" stroke-width="2"/>
  <line x1="320" y1="380" x2="320" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="590,240 578,233 578,247" fill="#333"/>
  <polygon points="320,100 313,112 327,112" fill="#333"/>
  <text x="580" y="266" font-size="18" fill="#333">H（外磁场）</text>
  <text x="296" y="110" font-size="18" fill="#333">M</text>
  <!-- 磁滞回线：下降支 -->
  <path d="M 570,180 C 430,180 380,140 320,140 C 260,140 200,240 70,300"
        fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <!-- 磁滞回线：上升支 -->
  <path d="M 70,300 C 210,300 260,340 320,340 C 380,340 440,240 570,180"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- 辅助虚线 -->
  <line x1="320" y1="140" x2="70" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="470" y1="240" x2="470" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="570" cy="180" r="4" fill="#333"/>
  <circle cx="320" cy="140" r="4" fill="#333"/>
  <circle cx="470" cy="240" r="4" fill="#333"/>
  <circle cx="70" cy="300" r="4" fill="#333"/>
  <circle cx="320" cy="340" r="4" fill="#333"/>
  <circle cx="170" cy="240" r="4" fill="#333"/>
  <!-- 标注 -->
  <text x="452" y="166" font-size="15" fill="#333">+Mr（剩余磁化强度）</text>
  <text x="445" y="370" font-size="15" fill="#333">−Mr</text>
  <text x="478" y="226" font-size="15" fill="#333">+Hc</text>
  <text x="160" y="226" font-size="15" fill="#333">−Hc</text>
  <text x="440" y="140" font-size="15" fill="#333">Ms（饱和磁化强度）</text>
  <text x="58" y="330" font-size="15" fill="#333">−Ms</text>
  <text x="120" y="420" font-size="16" fill="#1f6f8b">下降支：H 从大到小</text>
  <text x="400" y="80" font-size="16" fill="#c0392b">上升支：H 从小到大</text>
</svg>
