<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>垂直磁化球体的磁异常剖面</title>
  <desc>地下埋藏一个垂直磁化的球体（剖面为圆），其上方地面的磁异常曲线呈中间正峰、两侧弱负瓣的特征形态。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <!-- 异常曲线 -->
  <path d="M 120,300 L 210,300 C 225,300 260,168 320,150 C 380,168 415,300 430,300 L 520,300"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="320" cy="150" r="4" fill="#c0392b"/>
  <!-- 地表线 -->
  <line x1="90" y1="300" x2="550" y2="300" stroke="#333" stroke-width="2"/>
  <!-- 球体 -->
  <circle cx="320" cy="355" r="38" fill="#1f6f8b" opacity="0.85"/>
  <text x="296" y="362" font-size="15" fill="#faf9f5">磁性体</text>
  <!-- 标注 -->
  <text x="296" y="130" font-size="15" fill="#333">正异常峰</text>
  <text x="190" y="285" font-size="14" fill="#333">负瓣</text>
  <text x="420" y="285" font-size="14" fill="#333">负瓣</text>
  <text x="106" y="318" font-size="14" fill="#333">地面</text>
  <text x="250" y="430" font-size="15" fill="#333">垂直磁化的球体（高纬/化极后）</text>
</svg>
