<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <title>波德三规则：分离、对齐、聚合</title>
  <desc>从左到右三个面板分别展示分离（避开邻居）、对齐（对齐邻居方向）、聚合（飞向群体中心）三种局部规则。</desc>
  <rect x="0" y="0" width="900" height="300" fill="#faf9f5"/>
  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">波德三规则：三条局部规则，合成整群迁徙</text>

  <!-- 面板一：分离 -->
  <rect x="20" y="50" width="280" height="230" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="160" y="78" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">① 分离 Separation</text>
  <circle cx="90" cy="180" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="160" cy="150" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="230" cy="190" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="160" cy="180" r="26" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="160" y1="180" x2="110" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="180" x2="160" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">与邻居保持最小距离，避免碰撞</text>

  <!-- 面板二：对齐 -->
  <rect x="310" y="50" width="280" height="230" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">② 对齐 Alignment</text>
  <polygon points="95,175 115,165 115,185" fill="#c0392b" opacity="0.85"/>
  <polygon points="160,145 180,135 180,155" fill="#c0392b" opacity="0.85"/>
  <polygon points="225,190 245,180 245,200" fill="#c0392b" opacity="0.85"/>
  <polygon points="160,180 180,170 180,190" fill="#1f6f8b"/>
  <line x1="165" y1="178" x2="240" y2="120" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="245" y1="120" x2="275" y2="98" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">速度方向向邻居的平均方向靠拢</text>

  <!-- 面板三：聚合 -->
  <rect x="600" y="50" width="280" height="230" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="740" y="78" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">③ 聚合 Cohesion</text>
  <circle cx="680" cy="185" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="760" cy="155" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="790" cy="200" r="10" fill="#c0392b" opacity="0.85"/>
  <circle cx="743" cy="180" r="6" fill="#1f6f8b"/>
  <line x1="680" y1="185" x2="743" y2="180" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <line x1="760" y1="155" x2="743" y2="180" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <line x1="790" y1="200" x2="743" y2="180" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <text x="740" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">朝邻居位置的平均中心方向移动</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
