<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <title>蚁群的信息素正反馈</title>
  <desc>蚂蚁巢穴与食物源之间存在长、短两条路径，短路径因往返时间更短而积累了更浓的信息素，吸引更多蚂蚁，最终成为主干道。</desc>
  <rect x="0" y="0" width="760" height="320" fill="#faf9f5"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">信息素正反馈：短路径被更多蚂蚁选择，越来越浓</text>

  <!-- 巢穴与食物 -->
  <rect x="20" y="130" width="70" height="55" rx="10" fill="#1f6f8b"/>
  <text x="55" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">巢穴</text>
  <circle cx="672" cy="152" r="34" fill="#c0392b" opacity="0.9"/>
  <text x="672" y="157" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">食物</text>

  <!-- 长路径（浅色虚线） -->
  <path d="M 90 155 C 180 60, 320 40, 420 90 C 500 130, 560 170, 636 155" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 6" opacity="0.45"/>
  <text x="330" y="48" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b" opacity="0.7">长路径：信息素淡（往返慢）</text>

  <!-- 短路径（浓实线） -->
  <path d="M 90 160 C 200 210, 400 225, 636 158" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">短路径：信息素浓（往返快，被放大）</text>

  <!-- 蚂蚁 -->
  <circle cx="360" cy="205" r="5" fill="#333"/>
  <circle cx="420" cy="210" r="5" fill="#333"/>
  <circle cx="280" cy="192" r="5" fill="#333"/>

  <text x="380" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">信息素正比于使用频率：短路径 → 更快往返 → 更多信息素 → 更多蚂蚁</text>
</svg>
