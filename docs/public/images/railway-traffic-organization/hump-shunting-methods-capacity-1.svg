<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <title>驼峰调车纵断面示意图</title>
  <desc>从左至右依次为到达场、推送线、峰顶、加速坡、车辆减速器、调车场扇形股道，示意车辆借重力溜放解体的过程。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="420" fill="#faf9f5"/>

  <!-- 地面参考线 -->
  <line x1="40" y1="330" x2="860" y2="330" stroke="#c8c4ba" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 推送线（到达场至峰顶，平缓上坡） -->
  <polyline points="60,290 340,290 470,205" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>

  <!-- 加速坡（峰顶至第一减速器，陡下坡） -->
  <polyline points="470,205 540,260 620,300" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>

  <!-- 中间坡与减速器区（趋于平缓） -->
  <polyline points="620,300 700,318 780,326" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>

  <!-- 峰顶竖标 -->
  <line x1="470" y1="205" x2="470" y2="330" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="470" cy="205" r="6" fill="#c0392b"/>
  <text x="470" y="180" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">峰顶</text>

  <!-- 到达场 -->
  <rect x="55" y="150" width="130" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="120" y="176" text-anchor="middle" font-size="14" fill="#1f6f8b">到达场</text>

  <!-- 推送线标注 -->
  <text x="300" y="180" text-anchor="middle" font-size="14" fill="#333">推送线（上峰）</text>

  <!-- 车辆示意（推送中的小方块） -->
  <rect x="200" y="270" width="34" height="20" rx="3" fill="#1f6f8b"/>
  <rect x="240" y="270" width="34" height="20" rx="3" fill="#1f6f8b"/>
  <rect x="280" y="270" width="34" height="20" rx="3" fill="#1f6f8b"/>

  <!-- 溜放中的车辆 -->
  <rect x="560" y="252" width="30" height="18" rx="3" fill="#c0392b"/>
  <rect x="655" y="300" width="30" height="18" rx="3" fill="#c0392b"/>

  <!-- 车辆减速器（第一制动位） -->
  <rect x="600" y="285" width="16" height="34" rx="3" fill="#333"/>
  <text x="608" y="348" text-anchor="middle" font-size="13" fill="#333">减速器</text>

  <!-- 调车场扇形股道 -->
  <line x1="760" y1="322" x2="840" y2="240" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="770" y1="324" x2="848" y2="282" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="780" y1="326" x2="856" y2="326" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="770" y1="328" x2="848" y2="370" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="760" y1="330" x2="840" y2="408" stroke="#1f6f8b" stroke-width="4"/>
  <text x="820" y="222" text-anchor="middle" font-size="14" fill="#1f6f8b">调车场</text>

  <!-- 溜放方向箭头 -->
  <polygon points="535,208 520,222 550,222" fill="#c0392b"/>
  <text x="540" y="196" text-anchor="middle" font-size="13" fill="#c0392b">溜放</text>

  <!-- 峰顶平台说明 -->
  <text x="470" y="395" text-anchor="middle" font-size="13" fill="#666">车辆推上峰顶后摘钩，借重力沿加速坡自行溜入调车场股道</text>
</svg>
