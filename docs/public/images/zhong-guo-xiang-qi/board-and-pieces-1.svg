<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="sans-serif">
<title>中国象棋棋盘与初始布阵</title>
<desc>九纵十横的棋盘，中央楚河汉界，上下各有一个九宫，红黑双方棋子按初始位置排列</desc>
<rect x="0" y="0" width="560" height="620" fill="#faf9f5"/>
<!-- 棋盘网格：9 条竖线、10 条横线 -->
<g stroke="#333" stroke-width="2">
  <!-- 竖线 -->
  <line x1="80" y1="60" x2="80" y2="510"/>
  <line x1="130" y1="60" x2="130" y2="510"/>
  <line x1="180" y1="60" x2="180" y2="510"/>
  <line x1="230" y1="60" x2="230" y2="510"/>
  <line x1="280" y1="60" x2="280" y2="510"/>
  <line x1="330" y1="60" x2="330" y2="510"/>
  <line x1="380" y1="60" x2="380" y2="510"/>
  <line x1="430" y1="60" x2="430" y2="510"/>
  <line x1="480" y1="60" x2="480" y2="510"/>
  <!-- 横线：上方九宫区 -->
  <line x1="80" y1="60" x2="480" y2="60"/>
  <line x1="80" y1="110" x2="480" y2="110"/>
  <line x1="80" y1="160" x2="480" y2="160"/>
  <!-- 横线：河界两侧（断开） -->
  <line x1="80" y1="210" x2="230" y2="210"/>
  <line x1="280" y1="210" x2="480" y2="210"/>
  <line x1="80" y1="260" x2="230" y2="260"/>
  <line x1="280" y1="260" x2="480" y2="260"/>
  <line x1="80" y1="310" x2="230" y2="310"/>
  <line x1="280" y1="310" x2="480" y2="310"/>
  <line x1="80" y1="360" x2="230" y2="360"/>
  <line x1="280" y1="360" x2="480" y2="360"/>
  <!-- 横线：下方九宫区 -->
  <line x1="80" y1="410" x2="480" y2="410"/>
  <line x1="80" y1="460" x2="480" y2="460"/>
  <line x1="80" y1="510" x2="480" y2="510"/>
  <!-- 九宫斜线 -->
  <line x1="230" y1="60" x2="330" y2="160"/>
  <line x1="330" y1="60" x2="230" y2="160"/>
  <line x1="230" y1="410" x2="330" y2="510"/>
  <line x1="330" y1="410" x2="230" y2="510"/>
</g>
<!-- 河界文字 -->
<text x="170" y="292" text-anchor="middle" font-size="30" fill="#333">楚　河</text>
<text x="395" y="292" text-anchor="middle" font-size="30" fill="#333">汉　界</text>
<!-- 边界标注 -->
<text x="35" y="75" text-anchor="middle" font-size="13" fill="#1f6f8b">黑方九宫</text>
<text x="525" y="495" text-anchor="middle" font-size="13" fill="#1f6f8b">红方九宫</text>
<text x="525" y="285" text-anchor="middle" font-size="13" fill="#1f6f8b">河界</text>
<!-- 红方棋子 -->
<g fill="#faf9f5" stroke="#c0392b" stroke-width="1.5">
  <circle cx="280" cy="60" r="20"/><circle cx="230" cy="60" r="20"/><circle cx="330" cy="60" r="20"/>
  <circle cx="180" cy="60" r="20"/><circle cx="380" cy="60" r="20"/><circle cx="130" cy="60" r="20"/><circle cx="430" cy="60" r="20"/>
  <circle cx="80" cy="60" r="20"/><circle cx="480" cy="60" r="20"/>
  <circle cx="130" cy="160" r="20"/><circle cx="430" cy="160" r="20"/>
  <circle cx="80" cy="210" r="20"/><circle cx="180" cy="210" r="20"/><circle cx="280" cy="210" r="20"/><circle cx="380" cy="210" r="20"/><circle cx="480" cy="210" r="20"/>
</g>
<g font-size="24" fill="#c0392b" text-anchor="middle" dominant-baseline="central">
  <text x="280" y="60">帥</text><text x="230" y="60">仕</text><text x="330" y="60">仕</text>
  <text x="180" y="60">相</text><text x="380" y="60">相</text><text x="130" y="60">馬</text><text x="430" y="60">馬</text>
  <text x="80" y="60">車</text><text x="480" y="60">車</text>
  <text x="130" y="160">炮</text><text x="430" y="160">炮</text>
  <text x="80" y="210">兵</text><text x="180" y="210">兵</text><text x="280" y="210">兵</text><text x="380" y="210">兵</text><text x="480" y="210">兵</text>
</g>
<!-- 黑方棋子 -->
<g fill="#faf9f5" stroke="#333" stroke-width="1.5">
  <circle cx="280" cy="510" r="20"/><circle cx="230" cy="510" r="20"/><circle cx="330" cy="510" r="20"/>
  <circle cx="180" cy="510" r="20"/><circle cx="380" cy="510" r="20"/><circle cx="130" cy="510" r="20"/><circle cx="430" cy="510" r="20"/>
  <circle cx="80" cy="510" r="20"/><circle cx="480" cy="510" r="20"/>
  <circle cx="130" cy="410" r="20"/><circle cx="430" cy="410" r="20"/>
  <circle cx="80" cy="360" r="20"/><circle cx="180" cy="360" r="20"/><circle cx="280" cy="360" r="20"/><circle cx="380" cy="360" r="20"/><circle cx="480" cy="360" r="20"/>
</g>
<g font-size="24" fill="#333" text-anchor="middle" dominant-baseline="central">
  <text x="280" y="510">將</text><text x="230" y="510">士</text><text x="330" y="510">士</text>
  <text x="180" y="510">象</text><text x="380" y="510">象</text><text x="130" y="510">馬</text><text x="430" y="510">馬</text>
  <text x="80" y="510">車</text><text x="480" y="510">車</text>
  <text x="130" y="410">砲</text><text x="430" y="410">砲</text>
  <text x="80" y="360">卒</text><text x="180" y="360">卒</text><text x="280" y="360">卒</text><text x="380" y="360">卒</text><text x="480" y="360">卒</text>
</g>
</svg>
