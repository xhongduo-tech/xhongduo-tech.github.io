<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>认知行为治疗的 ABC 模型与维持回路</title>
  <desc>激活事件经信念解释产生情绪与行为结果，行为（回避）反向强化信念，形成维持回路。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="36" font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">认知行为治疗：ABC 模型与维持回路</text>

  <!-- A -->
  <rect x="30" y="80" width="150" height="90" rx="10" fill="#1f6f8b" opacity="0.9"/>
  <text x="105" y="112" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">A 激活事件</text>
  <text x="105" y="136" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">被当众批评</text>
  <text x="105" y="156" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">（客观发生）</text>

  <!-- B -->
  <rect x="245" y="80" width="150" height="90" rx="10" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="320" y="112" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">B 信念（解释）</text>
  <text x="320" y="136" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">「我完了，毫无价值」</text>
  <text x="320" y="156" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">（可被校准）</text>

  <!-- C -->
  <rect x="460" y="80" width="150" height="90" rx="10" fill="#f8e8e5" stroke="#c0392b" stroke-width="1.6"/>
  <text x="535" y="112" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">C 结果</text>
  <text x="535" y="136" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">沮丧 · 自责</text>
  <text x="535" y="156" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">回避 · 退缩</text>

  <!-- 箭头 A->B, B->C -->
  <line x1="180" y1="125" x2="240" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395" y1="125" x2="455" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 回路由线：C->B 强化 -->
  <path d="M 535 170 C 535 240, 320 250, 320 210" stroke="#c0392b" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrr)"/>
  <text x="470" y="232" font-family="sans-serif" font-size="13" fill="#c0392b">回避强化信念（负强化）</text>

  <!-- 干预 -->
  <rect x="120" y="290" width="400" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="320" y="316" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">认知重建 + 暴露：修改 B，破除回避回路</text>
  <text x="320" y="342" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">事件不变，解释改变 → 情绪与行为随之改变</text>

  <line x1="320" y1="250" x2="320" y2="286" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
</svg>
