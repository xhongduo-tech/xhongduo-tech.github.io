<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>生物—心理—社会整合模型与素质—应激触发示意</title>
  <desc>三层因素（生物、心理、社会）叠加成素质负荷，应激事件跨越阈值后触发心理障碍。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="36" font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">生物—心理—社会整合模型与素质—应激触发</text>

  <!-- 三层因素 -->
  <rect x="40" y="64" width="180" height="56" rx="8" fill="#1f6f8b" opacity="0.85"/>
  <text x="130" y="86" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">生物层（基因·神经递质</text>
  <text x="130" y="106" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">·HPA轴）</text>

  <rect x="40" y="140" width="180" height="56" rx="8" fill="#1f6f8b" opacity="0.85"/>
  <text x="130" y="162" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">心理层（认知·情绪调节</text>
  <text x="130" y="182" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">·早年图式）</text>

  <rect x="40" y="216" width="180" height="56" rx="8" fill="#1f6f8b" opacity="0.85"/>
  <text x="130" y="238" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">社会层（支持网络·压力事件</text>
  <text x="130" y="258" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">·文化语境）</text>

  <!-- 相互因果箭头 -->
  <line x1="220" y1="92" x2="300" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="96" x2="220" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="220" y1="168" x2="300" y2="196" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="172" x2="220" y2="196" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="268" y="140" font-family="sans-serif" font-size="13" fill="#333">相互因果</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 素质负荷 -->
  <rect x="330" y="70" width="270" height="150" rx="10" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="465" y="98" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="middle" font-weight="bold">素质负荷（易感性）</text>
  <text x="465" y="126" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">高遗传风险 + 创伤图式 + 社会孤立</text>
  <text x="465" y="148" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">↓</text>
  <text x="465" y="170" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发病阈值被压低</text>
  <text x="465" y="198" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">（虚线为阈值线）</text>
  <line x1="352" y1="140" x2="578" y2="140" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- 应激箭与触发 -->
  <line x1="465" y1="220" x2="465" y2="280" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrr)"/>
  <defs>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="500" y="258" font-family="sans-serif" font-size="15" fill="#c0392b">应激事件（丧亲·失业·重病）</text>

  <!-- 结果 -->
  <rect x="330" y="286" width="270" height="90" rx="10" fill="#f8e8e5" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="314" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">跨过阈值 → 心理障碍</text>
  <text x="465" y="340" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">同应激下，素质低者缓冲、</text>
  <text x="465" y="360" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">素质高者发病</text>
</svg>
