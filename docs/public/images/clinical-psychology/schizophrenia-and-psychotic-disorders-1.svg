<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>精神分裂症的多巴胺双通路模型</title>
  <desc>中脑边缘通路多巴胺亢进导致阳性症状；中脑皮层通路多巴胺低下导致阴性症状与认知损害。</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <text x="320" y="36" font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">精神分裂症：多巴胺双通路模型</text>

  <!-- 中脑来源 -->
  <ellipse cx="320" cy="150" rx="120" ry="46" fill="#1f6f8b" opacity="0.85"/>
  <text x="320" y="144" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">中脑多巴胺神经元</text>
  <text x="320" y="166" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">（腹侧被盖区 VTA）</text>

  <!-- 边缘通路 -->
  <path d="M 205 130 C 130 90, 110 60, 120 30" stroke="#c0392b" stroke-width="2.6" fill="none" marker-end="url(#ar1)"/>
  <text x="138" y="82" font-family="sans-serif" font-size="13" fill="#c0392b">边缘通路 ↑↑</text>
  <text x="132" y="102" font-family="sans-serif" font-size="13" fill="#666">多巴胺亢进</text>

  <rect x="40" y="16" width="180" height="62" rx="8" fill="#f8e8e5" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="40" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">阳性症状</text>
  <text x="130" y="60" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">妄想 · 幻觉 · 紊乱</text>

  <!-- 皮层通路 -->
  <path d="M 435 130 C 510 90, 530 60, 520 30" stroke="#1f6f8b" stroke-width="2.6" fill="none" marker-end="url(#ar2)"/>
  <text x="492" y="82" font-family="sans-serif" font-size="13" fill="#1f6f8b">皮层通路 ↓↓</text>
  <text x="488" y="102" font-family="sans-serif" font-size="13" fill="#666">多巴胺低下</text>

  <rect x="420" y="16" width="180" height="62" rx="8" fill="#e8eef0" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="510" y="40" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle" font-weight="bold">阴性 + 认知症状</text>
  <text x="510" y="60" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">情感平淡 · 意志缺乏 · 记忆</text>

  <!-- 药物作用 -->
  <rect x="180" y="250" width="280" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="276" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">抗精神病药：阻断 D2 受体</text>
  <text x="320" y="298" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">阳性症状快速缓解</text>
  <text x="320" y="318" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">阴性/认知改善有限（通路差异）</text>

  <line x1="255" y1="250" x2="255" y2="200" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar3)"/>
  <line x1="385" y1="250" x2="385" y2="200" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar3)"/>
  <text x="320" y="228" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">作用于两条通路</text>

  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1f6f8b"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
  </defs>
</svg>
