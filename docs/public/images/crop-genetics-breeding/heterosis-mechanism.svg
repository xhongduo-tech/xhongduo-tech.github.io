<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="14">
  <title>杂种优势与近交衰退示意图</title>
  <desc>自交使基因型趋于纯合、群体均值下降（近交衰退）；杂交产生杂合子，群体均值回升并超过双亲均值（杂种优势）。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">近交衰退与杂种优势</text>

  <!-- P 世代 -->
  <text x="320" y="60" text-anchor="middle" font-size="14" fill="#333">亲本 P</text>
  <rect x="150" y="70" width="150" height="40" rx="6" fill="#fff" stroke="#333"/>
  <text x="225" y="95" text-anchor="middle" fill="#333">P₁（均值 70）</text>
  <rect x="340" y="70" width="150" height="40" rx="6" fill="#fff" stroke="#333"/>
  <text x="415" y="95" text-anchor="middle" fill="#333">P₂（均值 70）</text>

  <!-- 双亲中值箭头 -->
  <line x1="200" y1="145" x2="225" y2="145" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="140" text-anchor="end" fill="#1f6f8b" font-size="13">中亲值 70</text>

  <!-- 近交衰退 (自交) -->
  <text x="160" y="175" text-anchor="middle" fill="#c0392b" font-weight="bold">连续自交（纯合化）</text>
  <rect x="90" y="190" width="150" height="36" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="165" y="213" text-anchor="middle" fill="#c0392b">近交系均值 62（衰退）</text>
  <line x1="165" y1="185" x2="165" y2="188" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="248" text-anchor="middle" fill="#555" font-size="13">隐性有害基因纯合暴露</text>

  <!-- 杂交 -->
  <text x="450" y="175" text-anchor="middle" fill="#1f6f8b" font-weight="bold">P₁ × P₂ 杂交</text>
  <rect x="360" y="190" width="200" height="36" rx="6" fill="#fff" stroke="#1f6f8b"/>
  <text x="460" y="213" text-anchor="middle" fill="#1f6f8b">F₁ 均值 85（超亲优势）</text>
  <line x1="460" y1="185" x2="460" y2="188" stroke="#1f6f8b" stroke-width="2"/>
  <text x="460" y="248" text-anchor="middle" fill="#555" font-size="13">杂合位点增多，显性互补</text>

  <!-- 虚线参考线 -->
  <line x1="60" y1="280" x2="580" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="60" y="300" fill="#666" font-size="13">基因型纯合度：自交每代 +½（杂合度减半）</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
