<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
  <title>测量系统组成框图</title>
  <desc>被测物理量依次经过传感器、信号调理、数据采集、数据处理与显示，同时激励与电源为传感器提供激励，整机供电。</desc>
  <rect x="0" y="0" width="720" height="300" fill="#faf9f5"/>
  <g font-family="sans-serif" font-size="15" fill="#333">
    <!-- 输入 -->
    <rect x="20" y="130" width="120" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="80" y="156" text-anchor="middle">被测物理量</text>
    <!-- 传感器 -->
    <rect x="180" y="130" width="120" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="240" y="156" text-anchor="middle">传感器</text>
    <!-- 信号调理 -->
    <rect x="340" y="130" width="120" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="400" y="156" text-anchor="middle">信号调理</text>
    <!-- 数据采集 -->
    <rect x="500" y="130" width="120" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="560" y="156" text-anchor="middle">数据采集</text>
    <!-- 处理显示 -->
    <rect x="340" y="230" width="120" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="400" y="256" text-anchor="middle">处理与显示</text>
    <!-- 激励与电源 -->
    <rect x="500" y="230" width="120" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="560" y="256" text-anchor="middle">激励与电源</text>
    <!-- 箭头 1-2 -->
    <line x1="140" y1="150" x2="176" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="180,150 170,145 170,155" fill="#333"/>
    <!-- 箭头 2-3 -->
    <line x1="300" y1="150" x2="336" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="340,150 330,145 330,155" fill="#333"/>
    <!-- 箭头 3-4 -->
    <line x1="460" y1="150" x2="496" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="500,150 490,145 490,155" fill="#333"/>
    <!-- 箭头 4-5 (向下) -->
    <line x1="560" y1="170" x2="560" y2="226" stroke="#333" stroke-width="2"/>
    <polygon points="560,230 555,220 565,220" fill="#333"/>
    <!-- 激励线 传感器 <- 激励 -->
    <line x1="560" y1="230" x2="560" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="560" y1="200" x2="240" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="240" y1="200" x2="240" y2="174" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="240,170 235,180 245,180" fill="#c0392b"/>
    <text x="400" y="196" text-anchor="middle" font-size="13" fill="#c0392b">激励信号</text>
    <!-- 标注 -->
    <text x="20" y="108" font-size="13" fill="#1f6f8b">被测量 → 电信号 → 数字 → 信息</text>
  </g>
</svg>
