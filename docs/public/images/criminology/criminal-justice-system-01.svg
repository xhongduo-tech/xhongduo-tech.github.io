<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="sans-serif" font-size="14">
<title>刑事司法的漏斗：从犯罪到监禁</title>
<desc>刑事司法系统的漏斗模型：每 100 起犯罪报案中约 40 起被逮捕、约 10 起被起诉审判、约 5 起被定罪入狱，系统逐级筛选、大量案件在途中被丢弃。</desc>
<rect width="560" height="470" fill="#faf9f5"/>
<g fill="#1f6f8b" opacity="0.85">
  <polygon points="280,20 480,56 80,56"/>
  <polygon points="280,84 448,116 112,116"/>
  <polygon points="280,148 408,176 152,176"/>
  <polygon points="280,212 368,236 192,236"/>
  <polygon points="280,276 330,292 230,292"/>
</g>
<g text-anchor="middle">
  <text x="280" y="46" font-weight="bold" fill="#fff">100 起报案犯罪</text>
  <text x="280" y="108" font-weight="bold" fill="#fff">约 40 起被捕</text>
  <text x="280" y="170" font-weight="bold" fill="#fff">约 15 起被起诉</text>
  <text x="280" y="232" font-weight="bold" fill="#fff">约 8 起定罪</text>
  <text x="280" y="290" font-weight="bold" fill="#fff">约 5 起入狱</text>
</g>
<text x="280" y="330" text-anchor="middle" fill="#333">每往下走一级，案件数量就大幅衰减</text>
<text x="280" y="350" text-anchor="middle" fill="#c0392b">大量案件在警察筛选、证据不足、</text>
<text x="280" y="368" text-anchor="middle" fill="#c0392b">辩诉交易等环节被丢弃</text>
<g stroke="#333" fill="none">
  <rect x="60" y="396" width="440" height="62" rx="8"/>
</g>
<text x="280" y="420" text-anchor="middle" font-weight="bold" fill="#333">警察 → 法院 → 矫正</text>
<text x="280" y="442" text-anchor="middle" fill="#333">三大子系统互相衔接，构成刑事司法的流水线</text>
</svg>
