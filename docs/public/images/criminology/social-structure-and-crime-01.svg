<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="sans-serif" font-size="14">
<title>伯吉斯同心圆模型与犯罪集中带</title>
<desc>芝加哥学派伯吉斯（Burgess）的同心圆城市结构模型：由内向外分为中心商业区、过渡区、工人住宅区、中产阶级住宅区、通勤带；犯罪高发集中在过渡区。</desc>
<rect width="560" height="420" fill="#faf9f5"/>
<g stroke="#333" fill="none">
  <circle cx="280" cy="210" r="40" fill="#f0e6e4"/>
  <circle cx="280" cy="210" r="92" fill="#f7e3d8"/>
  <circle cx="280" cy="210" r="150" fill="#e6eef0"/>
  <circle cx="280" cy="210" r="205" fill="#eef0d8"/>
</g>
<g stroke="#c0392b" stroke-dasharray="6 4" fill="none" stroke-width="2.5">
  <circle cx="280" cy="210" r="92"/>
</g>
<text x="280" y="205" text-anchor="middle" font-weight="bold" fill="#333">中心商业区</text>
<text x="280" y="222" text-anchor="middle" fill="#333">CBD</text>
<text x="280" y="140" text-anchor="middle" font-weight="bold" fill="#c0392b">过渡区</text>
<text x="280" y="158" text-anchor="middle" fill="#c0392b">犯罪高发带</text>
<text x="362" y="180" text-anchor="middle" fill="#333">工人</text>
<text x="366" y="196" text-anchor="middle" fill="#333">住宅区</text>
<text x="425" y="120" text-anchor="middle" fill="#333">中产</text>
<text x="429" y="136" text-anchor="middle" fill="#333">住宅区</text>
<text x="478" y="86" text-anchor="middle" fill="#333">通勤带</text>
<text x="80" y="382" fill="#c0392b" font-size="13">红色虚线环 = 过渡区：</text>
<text x="80" y="400" fill="#c0392b" font-size="13">社区解体最严重，犯罪率最高</text>
</svg>
