<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif" font-size="14">
  <title>RadixAttention 前缀树：共享前缀在树上只有一条路径</title>
  <desc>两个请求共享前缀「你好，请介绍」，在树上汇合成同一条路径，该前缀的 KV Cache 只计算并存储一次；到分叉点后各自长出独有的后缀节点。</desc>
  <rect x="0" y="0" width="760" height="430" fill="#faf9f5" />

  <text x="380" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">RadixAttention：共享前缀在树上只有一条路径</text>

  <!-- root -->
  <circle cx="380" cy="80" r="26" fill="#333" />
  <text x="380" y="86" text-anchor="middle" fill="#fff" font-size="14">根</text>

  <!-- edge root -> shared -->
  <line x1="380" y1="106" x2="380" y2="138" stroke="#1f6f8b" stroke-width="2" />

  <!-- shared prefix node -->
  <rect x="245" y="138" width="270" height="62" rx="8" fill="#1f6f8b" />
  <text x="380" y="164" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">「你好，请介绍」(6 token)</text>
  <text x="380" y="186" text-anchor="middle" fill="#eaf3f5" font-size="13">KV 已缓存 · 请求 A 与 B 共用</text>

  <!-- edges shared -> children -->
  <line x1="290" y1="200" x2="200" y2="252" stroke="#c0392b" stroke-width="2" />
  <line x1="470" y1="200" x2="560" y2="252" stroke="#c0392b" stroke-width="2" />

  <!-- child A -->
  <rect x="90" y="252" width="220" height="62" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2" />
  <text x="200" y="278" text-anchor="middle" fill="#333" font-size="15">「下微积分」</text>
  <text x="200" y="300" text-anchor="middle" fill="#666" font-size="13">请求 A 的后缀（新算）</text>

  <!-- child B -->
  <rect x="450" y="252" width="220" height="62" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2" />
  <text x="560" y="278" text-anchor="middle" fill="#333" font-size="15">「下量子力学」</text>
  <text x="560" y="300" text-anchor="middle" fill="#666" font-size="13">请求 B 的后缀（新算）</text>

  <!-- annotations -->
  <text x="380" y="352" text-anchor="middle" font-size="14" fill="#333">请求 A = 「你好，请介绍一下微积分」，请求 B = 「你好，请介绍一下量子力学」</text>
  <text x="380" y="376" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">共享前缀「你好，请介绍」的 KV 在树上只存一份，两个请求各自只算后缀</text>
  <text x="380" y="402" text-anchor="middle" font-size="13" fill="#666">最长前缀匹配从根出发；分叉处若落在节点中间，节点被分裂为精确边界</text>
</svg>
