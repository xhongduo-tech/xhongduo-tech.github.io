<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="sans-serif" font-size="14">
  <title>PagedAttention 的块表映射：逻辑块 → 块表 → 物理块</title>
  <desc>KV 序列被切成固定大小的逻辑块，块表把每个逻辑块映射到物理显存中任意空闲的物理块，物理块可以分散、留有空隙，从而避免连续分配的巨大浪费。</desc>
  <rect x="0" y="0" width="860" height="460" fill="#fff" />

  <text x="430" y="34" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">PagedAttention：逻辑块 → 块表 → 物理块</text>

  <text x="40" y="72" font-size="14" fill="#333">逻辑块（KV 序列按固定大小切页，如 16 token/块）</text>
  <g font-size="15">
    <rect x="40"  y="84" width="140" height="56" rx="6" fill="#1f6f8b"/>
    <text x="110" y="118" text-anchor="middle" fill="#fff">逻辑块 0</text>
    <rect x="200" y="84" width="140" height="56" rx="6" fill="#1f6f8b"/>
    <text x="270" y="118" text-anchor="middle" fill="#fff">逻辑块 1</text>
    <rect x="360" y="84" width="140" height="56" rx="6" fill="#1f6f8b"/>
    <text x="430" y="118" text-anchor="middle" fill="#fff">逻辑块 2</text>
    <rect x="520" y="84" width="140" height="56" rx="6" fill="#1f6f8b"/>
    <text x="590" y="118" text-anchor="middle" fill="#fff">逻辑块 3</text>
  </g>

  <text x="40" y="192" font-size="14" fill="#333">块表 Block Table（记录每个逻辑块对应的物理块号）</text>
  <g font-size="15" fill="#333">
    <rect x="40"  y="204" width="140" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="110" y="238" text-anchor="middle">物理块 2</text>
    <rect x="200" y="204" width="140" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="270" y="238" text-anchor="middle">物理块 5</text>
    <rect x="360" y="204" width="140" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="430" y="238" text-anchor="middle">物理块 3</text>
    <rect x="520" y="204" width="140" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="590" y="238" text-anchor="middle">物理块 6</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M110,260 L240,322" marker-end="url(#arrow)"/>
    <path d="M270,260 L480,322" marker-end="url(#arrow)"/>
    <path d="M430,260 L320,322" marker-end="url(#arrow)"/>
    <path d="M590,260 L520,322" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="312" font-size="14" fill="#333">物理显存（物理块按需分配，可分散、留空隙，无连续分配浪费）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40"  y="324" width="80" height="56" rx="4" fill="#fff" stroke="#999"/>
    <text x="80"  y="348" fill="#333">0</text><text x="80"  y="366" fill="#999">空闲</text>
    <rect x="120" y="324" width="80" height="56" rx="4" fill="#fff" stroke="#999"/>
    <text x="160" y="348" fill="#333">1</text><text x="160" y="366" fill="#999">空闲</text>
    <rect x="200" y="324" width="80" height="56" rx="4" fill="#1f6f8b"/>
    <text x="240" y="348" fill="#fff">2</text><text x="240" y="366" fill="#fff">已用</text>
    <rect x="280" y="324" width="80" height="56" rx="4" fill="#1f6f8b"/>
    <text x="320" y="348" fill="#fff">3</text><text x="320" y="366" fill="#fff">已用</text>
    <rect x="360" y="324" width="80" height="56" rx="4" fill="#fff" stroke="#999"/>
    <text x="400" y="348" fill="#333">4</text><text x="400" y="366" fill="#999">空闲</text>
    <rect x="440" y="324" width="80" height="56" rx="4" fill="#1f6f8b"/>
    <text x="480" y="348" fill="#fff">5</text><text x="480" y="366" fill="#fff">已用</text>
    <rect x="520" y="324" width="80" height="56" rx="4" fill="#1f6f8b"/>
    <text x="560" y="348" fill="#fff">6</text><text x="560" y="366" fill="#fff">已用</text>
    <rect x="600" y="324" width="80" height="56" rx="4" fill="#fff" stroke="#999"/>
    <text x="640" y="348" fill="#333">7</text><text x="640" y="366" fill="#999">空闲</text>
    <rect x="680" y="324" width="80" height="56" rx="4" fill="#fff" stroke="#999"/>
    <text x="720" y="348" fill="#333">8</text><text x="720" y="366" fill="#999">空闲</text>
  </g>

  <text x="430" y="436" text-anchor="middle" font-size="13" fill="#666">逻辑上连续（0→1→2→3），物理上分散（2、5、3、6），块表负责翻译</text>
</svg>
