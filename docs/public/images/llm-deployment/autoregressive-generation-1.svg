<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">自回归生成：逐 token 预测与拼接的循环流程</title>
  <desc id="desc">自回归生成的循环示意图。上部分四步主循环：① 输入序列 x₁ x₂ … xₜ₋₁；② 模型前向计算，预测下一 token 的概率分布 P(xₜ | x&lt;t)；③ 解码策略（贪心 / 束搜索 / 采样）从分布中选出一个 token；④ 把新 token xₜ 拼接回序列末尾，序列长度加一；⑤ 再预测：携带新 token 的序列回到第 ② 步，循环直至生成结束符 EOS。下半部分用「太阳 / 从 / 东方」示意序列逐步生长：每轮只在末尾新增一个预测出的 token（红色高亮），第 1 轮预测「升起」，第 2 轮预测「照耀」，第 3 轮预测「大地」，之前预测的 token 成为后续轮的输入。</desc>

  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9a907d"/>
    </marker>
  </defs>

  <rect width="900" height="570" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">自回归生成：预测 → 拼接 → 再预测</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#777">decoder-only 语言模型一次预测一个 token，把新 token 拼回输入，循环直至生成结束符 EOS</text>

  <!-- 主循环：四步 -->
  <!-- ① 输入序列 -->
  <rect x="40" y="120" width="190" height="92" rx="8" fill="#f7f1e6" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">① 输入序列</text>
  <text x="135" y="175" text-anchor="middle" font-size="14" fill="#333">x₁ x₂ … xₜ₋₁</text>
  <text x="135" y="197" text-anchor="middle" font-size="13" fill="#777">已生成的 token</text>

  <!-- 箭头 ①→② -->
  <line x1="232" y1="166" x2="272" y2="166" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="252" y="158" text-anchor="middle" font-size="13" fill="#1f6f8b">模型前向</text>

  <!-- ② 预测分布 -->
  <rect x="280" y="120" width="190" height="92" rx="8" fill="#e8f1f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="375" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">② 预测分布</text>
  <text x="375" y="175" text-anchor="middle" font-size="14" fill="#333">P(xₜ | x&lt;t)</text>
  <text x="375" y="197" text-anchor="middle" font-size="13" fill="#777">下一个 token 的概率</text>

  <!-- 箭头 ②→③ -->
  <line x1="472" y1="166" x2="512" y2="166" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- ③ 解码策略 -->
  <rect x="520" y="120" width="190" height="92" rx="8" fill="#f7e9e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">③ 解码策略</text>
  <text x="615" y="175" text-anchor="middle" font-size="14" fill="#333">贪心 / 束搜索 / 采样</text>
  <text x="615" y="197" text-anchor="middle" font-size="13" fill="#777">从分布中选一个 token</text>

  <!-- 箭头 ③→④ -->
  <line x1="712" y1="166" x2="752" y2="166" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- ④ 拼接 xₜ -->
  <rect x="760" y="120" width="130" height="92" rx="8" fill="#f7e9e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="825" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">④ 拼接 xₜ</text>
  <text x="825" y="175" text-anchor="middle" font-size="14" fill="#333">xₜ 追加到末尾</text>
  <text x="825" y="197" text-anchor="middle" font-size="13" fill="#777">序列长度 +1</text>

  <!-- 回环箭头 ④→①（再预测） -->
  <path d="M825,212 L825,262 L135,262 L135,214" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="450" y="255" text-anchor="middle" font-size="14" fill="#1f6f8b">⑤ 再预测：携带新 token 的序列回到 ②，循环直至 EOS</text>

  <!-- 分隔线 -->
  <line x1="40" y1="298" x2="860" y2="298" stroke="#9a907d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="450" y="326" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">序列逐步生长：每轮只在末尾新增一个 token（示意，真实分词由 Tokenizer 完成）</text>

  <!-- 第 1 轮 -->
  <text x="56" y="372" text-anchor="end" font-size="14" fill="#333">第 1 轮</text>
  <rect x="70" y="354" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="97" y="377" text-anchor="middle" font-size="14" fill="#333">太阳</text>
  <rect x="132" y="354" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="159" y="377" text-anchor="middle" font-size="14" fill="#333">从</text>
  <rect x="194" y="354" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="221" y="377" text-anchor="middle" font-size="14" fill="#333">东方</text>
  <line x1="256" y1="371" x2="280" y2="371" stroke="#9a907d" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <rect x="290" y="354" width="54" height="34" rx="5" fill="#fbe9e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="317" y="377" text-anchor="middle" font-size="14" fill="#c0392b">升起</text>
  <text x="159" y="406" text-anchor="middle" font-size="13" fill="#777">输入</text>
  <text x="317" y="406" text-anchor="middle" font-size="13" fill="#c0392b">预测</text>

  <!-- 第 2 轮 -->
  <text x="56" y="442" text-anchor="end" font-size="14" fill="#333">第 2 轮</text>
  <rect x="70" y="424" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="97" y="447" text-anchor="middle" font-size="14" fill="#333">太阳</text>
  <rect x="132" y="424" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="159" y="447" text-anchor="middle" font-size="14" fill="#333">从</text>
  <rect x="194" y="424" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="221" y="447" text-anchor="middle" font-size="14" fill="#333">东方</text>
  <rect x="256" y="424" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="283" y="447" text-anchor="middle" font-size="14" fill="#333">升起</text>
  <line x1="318" y1="441" x2="342" y2="441" stroke="#9a907d" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <rect x="352" y="424" width="54" height="34" rx="5" fill="#fbe9e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="379" y="447" text-anchor="middle" font-size="14" fill="#c0392b">照耀</text>
  <text x="229" y="476" text-anchor="middle" font-size="13" fill="#777">输入</text>
  <text x="379" y="476" text-anchor="middle" font-size="13" fill="#c0392b">预测</text>

  <!-- 第 3 轮 -->
  <text x="56" y="512" text-anchor="end" font-size="14" fill="#333">第 3 轮</text>
  <rect x="70" y="494" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="97" y="517" text-anchor="middle" font-size="14" fill="#333">太阳</text>
  <rect x="132" y="494" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="159" y="517" text-anchor="middle" font-size="14" fill="#333">从</text>
  <rect x="194" y="494" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="221" y="517" text-anchor="middle" font-size="14" fill="#333">东方</text>
  <rect x="256" y="494" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="283" y="517" text-anchor="middle" font-size="14" fill="#333">升起</text>
  <rect x="318" y="494" width="54" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="345" y="517" text-anchor="middle" font-size="14" fill="#333">照耀</text>
  <line x1="380" y1="511" x2="404" y2="511" stroke="#9a907d" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <rect x="414" y="494" width="54" height="34" rx="5" fill="#fbe9e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="441" y="517" text-anchor="middle" font-size="14" fill="#c0392b">大地</text>
  <text x="299" y="546" text-anchor="middle" font-size="13" fill="#777">输入</text>
  <text x="441" y="546" text-anchor="middle" font-size="13" fill="#c0392b">预测</text>

  <!-- 底部说明 -->
  <text x="450" y="564" text-anchor="middle" font-size="13" fill="#777">终止条件：模型输出 EOS，或达到 max_new_tokens 上限</text>
</svg>
