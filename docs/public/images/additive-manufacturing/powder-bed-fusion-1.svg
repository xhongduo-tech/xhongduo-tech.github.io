<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>粉末床熔融成形原理</title>
  <desc>激光经扫描振镜照射粉床，铺粉辊铺平粉末，成形活塞随层下降，两侧供粉活塞上升供粉。</desc>
  <rect x="0" y="0" width="720" height="460" fill="#faf9f5"/>
  <!-- Laser source -->
  <rect x="320" y="30" width="80" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="360" y="53" text-anchor="middle" font-size="14" fill="#333333">激光源</text>
  <!-- Scan mirror -->
  <rect x="322" y="120" width="76" height="30" rx="5" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="360" y="139" text-anchor="middle" font-size="13" fill="#333333">扫描振镜</text>
  <!-- Laser beam -->
  <line x1="360" y1="66" x2="360" y2="118" stroke="#c0392b" stroke-width="3"/>
  <line x1="360" y1="150" x2="360" y2="212" stroke="#c0392b" stroke-width="3"/>
  <text x="372" y="96" font-size="13" fill="#c0392b">激光束</text>
  <!-- Chamber walls -->
  <path d="M 120 180 L 120 420 L 600 420 L 600 180" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- Powder bed -->
  <rect x="150" y="220" width="420" height="170" fill="#e8e0d0"/>
  <!-- Part inside powder bed (staircase) -->
  <path d="M 320 220 L 320 260 L 360 260 L 360 300 L 400 300 L 400 340 L 440 340 L 440 390 L 320 390 Z" fill="#1f6f8b" opacity="0.85"/>
  <text x="392" y="282" font-size="13" fill="#ffffff">成形件</text>
  <!-- Build piston -->
  <rect x="150" y="390" width="420" height="30" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="360" y="410" text-anchor="middle" font-size="13" fill="#333333">成形活塞（随层下降）</text>
  <!-- Recoater roller -->
  <rect x="190" y="182" width="90" height="22" rx="11" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="235" y="197" text-anchor="middle" font-size="13" fill="#333333">铺粉辊</text>
  <line x1="235" y1="204" x2="320" y2="218" stroke="#333333" stroke-width="1.5" marker-end="url(#arp)" fill="none"/>
  <!-- Left feed piston -->
  <rect x="40" y="250" width="70" height="120" fill="#e8e0d0"/>
  <rect x="40" y="370" width="70" height="50" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="75" y="398" text-anchor="middle" font-size="12" fill="#333333">供粉</text>
  <text x="75" y="412" text-anchor="middle" font-size="12" fill="#333333">活塞↑</text>
  <line x1="112" y1="300" x2="150" y2="300" stroke="#333333" stroke-width="1.5" marker-end="url(#arp)" fill="none"/>
  <text x="80" y="240" text-anchor="middle" font-size="13" fill="#333333">粉末</text>
  <!-- Right feed piston -->
  <rect x="610" y="250" width="70" height="120" fill="#e8e0d0"/>
  <rect x="610" y="370" width="70" height="50" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="645" y="398" text-anchor="middle" font-size="12" fill="#333333">供粉</text>
  <text x="645" y="412" text-anchor="middle" font-size="12" fill="#333333">活塞↑</text>
  <text x="645" y="240" text-anchor="middle" font-size="13" fill="#333333">粉末</text>
  <!-- powder bed label -->
  <text x="160" y="330" font-size="13" fill="#333333">粉床（未熔粉末 = 支撑）</text>
  <defs>
    <marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
