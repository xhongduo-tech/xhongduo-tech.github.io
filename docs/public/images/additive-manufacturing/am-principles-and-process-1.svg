<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>增材制造八步工艺链</title>
  <desc>从 CAD 建模到应用的增材制造通用工艺链，共八步，分两行排列，箭头指示流程方向。</desc>
  <rect x="0" y="0" width="860" height="320" fill="#faf9f5"/>
  <!-- Row 1 -->
  <g>
    <rect x="20" y="50" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="110" y="76" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">① CAD 建模</text>
    <text x="110" y="98" text-anchor="middle" font-size="13" fill="#333333">几何设计</text>
    <rect x="235" y="50" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="325" y="76" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">② STL 转换</text>
    <text x="325" y="98" text-anchor="middle" font-size="13" fill="#333333">曲面三角化</text>
    <rect x="450" y="50" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="540" y="76" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">③ 传输与切层</text>
    <text x="540" y="98" text-anchor="middle" font-size="13" fill="#333333">修补·切片</text>
    <rect x="665" y="50" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="755" y="76" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">④ 机器设置</text>
    <text x="755" y="98" text-anchor="middle" font-size="13" fill="#333333">方向·支撑</text>
  </g>
  <!-- Row 2 -->
  <g>
    <rect x="20" y="200" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="110" y="226" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">⑤ 逐层制造</text>
    <text x="110" y="248" text-anchor="middle" font-size="13" fill="#333333">材料累加</text>
    <rect x="235" y="200" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="325" y="226" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">⑥ 取出与清理</text>
    <text x="325" y="248" text-anchor="middle" font-size="13" fill="#333333">去支撑·清粉</text>
    <rect x="450" y="200" width="180" height="64" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="540" y="226" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">⑦ 后处理</text>
    <text x="540" y="248" text-anchor="middle" font-size="13" fill="#333333">热处理·精加工</text>
    <rect x="665" y="200" width="180" height="64" rx="8" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2"/>
    <text x="755" y="226" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">⑧ 检验与应用</text>
    <text x="755" y="248" text-anchor="middle" font-size="13" fill="#faf9f5">交付使用</text>
  </g>
  <!-- Row1 arrows -->
  <path d="M 200 82 L 233 82" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M 415 82 L 448 82" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M 630 82 L 663 82" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <!-- Down arrow 4 -> 5 -->
  <path d="M 755 114 L 755 198" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <!-- Row2 arrows -->
  <path d="M 200 232 L 233 232" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M 415 232 L 448 232" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M 630 232 L 663 232" stroke="#333333" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
