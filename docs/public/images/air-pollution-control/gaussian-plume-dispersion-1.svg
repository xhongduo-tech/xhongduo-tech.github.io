<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="sans-serif">
<title>高斯烟羽扩散示意图</title>
<desc>一座烟囱排放的烟羽随风向下风向扩散，烟羽中心线在有效源高处保持水平，横截面上浓度呈高斯分布，离源越远分布越宽、峰值越低，地面浓度由真实烟羽与镜像烟羽叠加决定。</desc>

<rect x="0" y="0" width="720" height="460" fill="#faf9f5"/>

<!-- wind arrow -->
<path d="M 20 70 L 130 70" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
<text x="70" y="50" font-size="16" fill="#333">风速 u（水平输运）</text>

<!-- ground -->
<rect x="0" y="400" width="720" height="60" fill="#e8e2d6"/>
<line x1="0" y1="400" x2="720" y2="400" stroke="#333" stroke-width="3"/>
<text x="20" y="430" font-size="15" fill="#333">地面 z = 0</text>

<!-- stack -->
<rect x="95" y="255" width="30" height="145" fill="#8a8a8a"/>
<text x="60" y="300" font-size="15" fill="#333">烟囱高 h_s</text>
<line x1="110" y1="260" x2="110" y2="255" stroke="#333" stroke-width="2"/>

<!-- effective stack height annotation -->
<line x1="60" y1="260" x2="60" y2="200" stroke="#c0392b" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
<text x="18" y="225" font-size="15" fill="#c0392b">H = h_s + Δh</text>

<!-- plume body -->
<path d="M 110 258 C 180 242, 250 214, 300 192 C 430 176, 560 158, 680 142 L 680 258 C 560 270, 430 238, 300 212 C 250 232, 180 254, 110 262 Z" fill="#1f6f8b" opacity="0.30" stroke="none"/>
<!-- dashed centerline -->
<path d="M 110 260 C 200 240, 250 205, 300 200 L 680 200" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7 5" fill="none"/>

<!-- centerline height label -->
<line x1="640" y1="200" x2="640" y2="185" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="300" y="185" font-size="15" fill="#1f6f8b">烟羽中心线（有效源高处）</text>

<!-- Gaussian profile 1 at x=380 -->
<path d="M 380 128 C 373 165, 375 192, 380 200 C 375 208, 373 235, 380 272 C 387 235, 385 208, 380 200 C 385 192, 387 165, 380 128 Z" fill="#c0392b" opacity="0.55"/>
<line x1="380" y1="200" x2="380" y2="238" stroke="#c0392b" stroke-width="2"/>
<text x="392" y="248" font-size="14" fill="#c0392b">σz₁</text>
<text x="345" y="120" font-size="14" fill="#c0392b">横截面浓度剖面（高斯分布）</text>

<!-- Gaussian profile 2 at x=620, wider -->
<path d="M 620 102 C 608 175, 613 196, 620 200 C 613 204, 608 225, 620 298 C 632 225, 627 204, 620 200 C 627 196, 632 175, 620 102 Z" fill="#c0392b" opacity="0.45"/>
<line x1="620" y1="200" x2="620" y2="252" stroke="#c0392b" stroke-width="2"/>
<text x="632" y="262" font-size="14" fill="#c0392b">σz₂</text>

<!-- image plume below ground (reflection) -->
<path d="M 620 400 C 612 430, 615 448, 620 452 C 625 448, 628 430, 620 400 Z" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
<text x="455" y="420" font-size="14" fill="#333">地面反射：真实烟羽 + 镜像烟羽叠加，地面浓度加倍</text>

<!-- distance label -->
<line x1="110" y1="375" x2="380" y2="375" stroke="#333" stroke-width="1.5"/>
<line x1="380" y1="375" x2="620" y2="375" stroke="#333" stroke-width="1.5"/>
<text x="210" y="392" font-size="14" fill="#333">下风向距离 x 增大 →</text>

<!-- rising plume label -->
<text x="150" y="240" font-size="14" fill="#333">热浮升 Δh</text>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<polygon points="0 0, 10 4, 0 8" fill="#333"/>
</marker>
</defs>
</svg>
