<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">版本空间：与训练集一致的假设</title>
  <desc id="desc">按一般到特化的顺序排列假设。最一般的假设「色泽=* 根蒂=* 敲声=*」会误判坏瓜，用红色叉号标出；其余三个假设与训练集一致，构成版本空间，用青色虚线框圈出：{* 蜷缩 浊响}、{* 蜷缩 *}、{* * 浊响}。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 一般到特化的方向标注 -->
  <g font-size="14" fill="#1f6f8b" text-anchor="middle">
    <text x="360" y="28">一般（泛化）</text>
    <text x="360" y="386">特殊（特化）</text>
  </g>

  <!-- 最一般的假设：与训练集矛盾 -->
  <g>
    <rect x="240" y="44" width="240" height="64" rx="10" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
    <text x="360" y="70" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">色泽=*  根蒂=*  敲声=*</text>
    <text x="360" y="92" font-size="13" fill="#c0392b" text-anchor="middle">把坏瓜也判成好瓜，与训练集矛盾 ✗</text>
  </g>

  <!-- 版本空间虚线框 -->
  <rect x="60" y="120" width="600" height="250" rx="16" fill="none" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="74" y="142" font-size="14" fill="#1f6f8b" font-weight="bold">版本空间 VS</text>

  <!-- 左侧：根蒂具体 -->
  <g>
    <rect x="80" y="180" width="250" height="74" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
    <text x="205" y="206" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">色泽=*  根蒂=蜷缩  敲声=*</text>
    <text x="205" y="228" font-size="13" fill="#555" text-anchor="middle">判断正例为真，避开了两个反例</text>
    <text x="205" y="248" font-size="14" fill="#1f6f8b" text-anchor="middle">✓</text>
  </g>

  <!-- 右侧：敲声具体 -->
  <g>
    <rect x="390" y="180" width="250" height="74" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
    <text x="515" y="206" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">色泽=*  根蒂=*  敲声=浊响</text>
    <text x="515" y="228" font-size="13" fill="#555" text-anchor="middle">判断正例为真，避开了两个反例</text>
    <text x="515" y="248" font-size="14" fill="#1f6f8b" text-anchor="middle">✓</text>
  </g>

  <!-- 底部：最特殊 -->
  <g>
    <rect x="235" y="290" width="250" height="64" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
    <text x="360" y="316" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">色泽=*  根蒂=蜷缩  敲声=浊响</text>
    <text x="360" y="338" font-size="13" fill="#555" text-anchor="middle">两个正例的完全覆盖，最特化的解</text>
  </g>

  <!-- 边：一般 -> 具体 -->
  <line x1="360" y1="108" x2="225" y2="178" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="360" y1="108" x2="495" y2="178" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="225" y1="254" x2="320" y2="288" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="495" y1="254" x2="400" y2="288" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
