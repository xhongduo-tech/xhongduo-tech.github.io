<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
<title>误差曲面地形：局部极小、全局最小与鞍点</title>
<desc>一条波浪形误差曲线示意梯度下降可能停在局部极小或全局最小；左侧波谷标注局部极小，右侧更低波谷标注全局最小，两峰之间的波峰标注局部极大（一维截面上的鞍点）。</desc>
<rect width="640" height="400" fill="#faf9f5"/>
<!-- axes -->
<line x1="60" y1="340" x2="600" y2="340" stroke="#333" stroke-width="2"/>
<line x1="60" y1="340" x2="60" y2="40" stroke="#333" stroke-width="2"/>
<text x="600" y="360" font-size="14" fill="#333" text-anchor="end">参数 w</text>
<text x="40" y="50" font-size="14" fill="#333">误差 E</text>
<!-- error curve -->
<path d="M60 120 Q 110 60, 160 150 Q 210 250, 280 300 Q 350 350, 430 230 Q 500 130, 590 80"
      fill="none" stroke="#333" stroke-width="3"/>
<!-- local minimum -->
<circle cx="160" cy="150" r="6" fill="#c0392b"/>
<text x="160" y="120" font-size="15" fill="#c0392b" text-anchor="middle">局部极小</text>
<text x="160" y="180" font-size="13" fill="#c0392b" text-anchor="middle">BP 可能停在这里</text>
<!-- local maximum (saddle in 1D slice) -->
<circle cx="280" cy="300" r="6" fill="#c0392b"/>
<text x="300" y="325" font-size="15" fill="#c0392b" text-anchor="middle">局部极大</text>
<!-- global minimum -->
<circle cx="430" cy="230" r="6" fill="#1f6f8b"/>
<text x="430" y="210" font-size="15" fill="#1f6f8b" text-anchor="middle">全局最小</text>
<text x="430" y="268" font-size="13" fill="#1f6f8b" text-anchor="middle">这才是想要的最优解</text>
<!-- descent arrow -->
<path d="M590 88 L 560 70 L 585 88" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<text x="520" y="60" font-size="13" fill="#1f6f8b">梯度下降方向</text>
</svg>
