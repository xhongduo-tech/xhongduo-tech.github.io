<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <title>偏差与方差：打靶的四种情形</title>
  <desc>四个打靶靶面示意偏差与方差的组合：低偏差低方差弹着点集中在靶心；低偏差高方差散布在靶心四周；高偏差低方差集中但偏离靶心；高偏差高方差又偏又散。</desc>
  <rect x="0" y="0" width="640" height="470" fill="#faf9f5"/>

  <text x="320" y="32" font-size="20" fill="#333" text-anchor="middle">偏差与方差：打靶的四种情形</text>

  <!-- 靶面：左列中心 (155, cy)，右列中心 (475, cy)；外环半径 85 -->
  <g stroke="#333">
    <!-- 第一行：cy = 150 -->
    <circle cx="155" cy="150" r="85" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="155" cy="150" r="60" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="155" cy="150" r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="155" y1="140" x2="155" y2="160" stroke="#c0392b" stroke-width="2"/>
    <line x1="145" y1="150" x2="165" y2="150" stroke="#c0392b" stroke-width="2"/>

    <circle cx="475" cy="150" r="85" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="475" cy="150" r="60" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="475" cy="150" r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="475" y1="140" x2="475" y2="160" stroke="#c0392b" stroke-width="2"/>
    <line x1="465" y1="150" x2="485" y2="150" stroke="#c0392b" stroke-width="2"/>

    <!-- 第二行：cy = 350 -->
    <circle cx="155" cy="350" r="85" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="155" cy="350" r="60" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="155" cy="350" r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="155" y1="340" x2="155" y2="360" stroke="#c0392b" stroke-width="2"/>
    <line x1="145" y1="350" x2="165" y2="350" stroke="#c0392b" stroke-width="2"/>

    <circle cx="475" cy="350" r="85" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="475" cy="350" r="60" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="475" cy="350" r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="475" y1="340" x2="475" y2="360" stroke="#c0392b" stroke-width="2"/>
    <line x1="465" y1="350" x2="485" y2="350" stroke="#c0392b" stroke-width="2"/>
  </g>

  <!-- 弹着点 -->
  <g fill="#1f6f8b">
    <!-- 低偏差 低方差：集中在靶心 -->
    <circle cx="150" cy="145" r="5"/>
    <circle cx="158" cy="154" r="5"/>
    <circle cx="152" cy="140" r="5"/>
    <circle cx="160" cy="149" r="5"/>
    <circle cx="148" cy="155" r="5"/>

    <!-- 低偏差 高方差：散布在靶心四周 -->
    <circle cx="95" cy="100" r="5"/>
    <circle cx="215" cy="200" r="5"/>
    <circle cx="205" cy="90" r="5"/>
    <circle cx="100" cy="195" r="5"/>
    <circle cx="155" cy="160" r="5"/>

    <!-- 高偏差 低方差：集中但偏靶（偏向右下） -->
    <circle cx="193" cy="187" r="5"/>
    <circle cx="198" cy="193" r="5"/>
    <circle cx="190" cy="192" r="5"/>
    <circle cx="201" cy="186" r="5"/>
    <circle cx="196" cy="196" r="5"/>

    <!-- 高偏差 高方差：又偏又散（偏向右下且分散） -->
    <circle cx="175" cy="215" r="5"/>
    <circle cx="215" cy="175" r="5"/>
    <circle cx="210" cy="210" r="5"/>
    <circle cx="180" cy="180" r="5"/>
    <circle cx="200" cy="200" r="5"/>
  </g>

  <!-- 图例文字 -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="155" y="250">低偏差 · 低方差 —— 又准又稳</text>
    <text x="475" y="250">低偏差 · 高方差 —— 平均准，但飘</text>
    <text x="155" y="450">高偏差 · 低方差 —— 稳，但偏靶</text>
    <text x="475" y="450">高偏差 · 高方差 —— 又偏又散</text>
  </g>

  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="155" y="266">靶心 = 真实标记 y</text>
    <text x="475" y="266">靶心 = 真实标记 y</text>
    <text x="155" y="466">靶心 = 真实标记 y</text>
    <text x="475" y="466">靶心 = 真实标记 y</text>
  </g>
</svg>
