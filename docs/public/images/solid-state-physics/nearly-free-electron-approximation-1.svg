<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title>近自由电子：区边界打开能隙</title>
  <desc>自由电子抛物线（虚线）在第一布里渊区边界 k=±π/a 处被周期势劈开，形成宽度为 Eg=2|V_G| 的能隙，实线为近自由近似的两条能带。</desc>
  <rect width="640" height="330" fill="#faf9f5"/>
  <text x="20" y="28" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">近自由电子近似：区边界劈开能隙</text>

  <!-- 坐标轴 -->
  <line x1="320" y1="40" x2="320" y2="270" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="580" y2="270" stroke="#333" stroke-width="1.5"/>
  <text x="568" y="286" font-family="sans-serif" font-size="13" fill="#333">k</text>
  <text x="300" y="52" font-family="sans-serif" font-size="13" fill="#333">E</text>

  <!-- 区边界竖线 -->
  <line x1="150" y1="40" x2="150" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="490" y1="40" x2="490" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="140" y="286" font-family="sans-serif" font-size="13" fill="#666">-π/a</text>
  <text x="470" y="286" font-family="sans-serif" font-size="13" fill="#666">π/a</text>
  <text x="312" y="286" font-family="sans-serif" font-size="13" fill="#666">0</text>

  <!-- 自由电子抛物线（虚线） -->
  <path d="M 150 240 Q 235 120 320 74 Q 405 120 490 240" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- 下能带（实线，色 c0392b） -->
  <path d="M 150 226 Q 235 110 320 66 Q 405 110 490 226" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <!-- 上能带（实线，色 1f6f8b） -->
  <path d="M 150 200 Q 235 150 320 148 Q 405 150 490 200" fill="none" stroke="#1f6f8b" stroke-width="2.4"/>

  <!-- 能隙标注（在 k=π/a 处，x=490） -->
  <line x1="494" y1="200" x2="560" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="494" y1="226" x2="560" y2="226" stroke="#333" stroke-width="1"/>
  <line x1="546" y1="200" x2="546" y2="226" stroke="#333" stroke-width="1"/>
  <text x="552" y="218" font-family="sans-serif" font-size="14" fill="#333">Eg = 2|V_G|</text>

  <!-- 标注 -->
  <text x="330" y="62" font-family="sans-serif" font-size="13" fill="#c0392b">下带（cos² 态，电荷聚在势谷）</text>
  <text x="330" y="150" font-family="sans-serif" font-size="13" fill="#1f6f8b">上带（sin² 态，电荷聚在势峰）</text>
  <text x="120" y="252" font-family="sans-serif" font-size="13" fill="#666">自由电子（虚线，无隙）</text>

  <text x="20" y="312" font-family="sans-serif" font-size="13" fill="#666">区边界 k = ±π/a 满足布拉格条件 2k·G + G² = 0；简并态被微扰劈开</text>
</svg>
