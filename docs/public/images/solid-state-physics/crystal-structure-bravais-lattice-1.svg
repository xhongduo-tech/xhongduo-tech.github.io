<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title>晶体结构 = 布拉伐格子 + 基元</title>
  <desc>左图：二维平行四边形布拉伐格子，每个格点附一个由红、蓝两原子构成的基元，并用基矢 a1、a2 画出原胞；右图：同一格子搭配不同基元得到不同晶体结构。</desc>
  <rect width="640" height="330" fill="#faf9f5"/>
  <text x="20" y="28" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">左：布拉伐格子（黑格点）+ 基元（红·蓝双原子）</text>

  <!-- 左面板：平行四边形格子 -->
  <g>
    <path d="M 90 240 L 90 150 L 112 120 L 112 210 Z" fill="#f3e9dc" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <g stroke="#1f6f8b" stroke-width="1.4" opacity="0.55">
      <line x1="90" y1="240" x2="180" y2="240"/>
      <line x1="180" y1="240" x2="180" y2="150"/>
      <line x1="180" y1="150" x2="202" y2="120"/>
      <line x1="202" y1="120" x2="112" y2="120"/>
      <line x1="112" y1="120" x2="112" y2="210"/>
      <line x1="112" y1="210" x2="202" y2="210"/>
      <line x1="202" y1="210" x2="202" y2="120"/>
      <line x1="90" y1="150" x2="112" y2="120"/>
      <line x1="180" y1="150" x2="180" y2="240"/>
      <line x1="90" y1="210" x2="112" y2="210"/>
      <line x1="90" y1="150" x2="90" y2="240"/>
    </g>
    <!-- 基矢箭头 a1, a2 -->
    <g marker-end="url(#arrow)">
      <line x1="90" y1="240" x2="180" y2="240" stroke="#c0392b" stroke-width="2"/>
      <line x1="90" y1="240" x2="112" y2="210" stroke="#1f6f8b" stroke-width="2"/>
    </g>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
      </marker>
    </defs>
    <text x="132" y="254" font-family="sans-serif" font-size="14" fill="#c0392b" font-style="italic">a₁</text>
    <text x="86" y="218" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-style="italic">a₂</text>
    <!-- 格点与基元原子 -->
    <g>
      <circle cx="90" cy="240" r="8" fill="#333"/>
      <circle cx="108" cy="227" r="6.5" fill="#1f6f8b"/>
      <circle cx="135" cy="240" r="8" fill="#333"/>
      <circle cx="153" cy="227" r="6.5" fill="#1f6f8b"/>
      <circle cx="180" cy="240" r="8" fill="#333"/>
      <circle cx="198" cy="227" r="6.5" fill="#1f6f8b"/>
      <circle cx="112" cy="210" r="8" fill="#333"/>
      <circle cx="130" cy="197" r="6.5" fill="#1f6f8b"/>
      <circle cx="157" cy="210" r="8" fill="#333"/>
      <circle cx="175" cy="197" r="6.5" fill="#1f6f8b"/>
      <circle cx="202" cy="210" r="8" fill="#333"/>
      <circle cx="220" cy="197" r="6.5" fill="#1f6f8b"/>
      <circle cx="112" cy="180" r="8" fill="#333"/>
      <circle cx="130" cy="167" r="6.5" fill="#1f6f8b"/>
      <circle cx="157" cy="180" r="8" fill="#333"/>
      <circle cx="175" cy="167" r="6.5" fill="#1f6f8b"/>
      <circle cx="202" cy="180" r="8" fill="#333"/>
      <circle cx="220" cy="167" r="6.5" fill="#1f6f8b"/>
      <circle cx="90" cy="180" r="8" fill="#333"/>
      <circle cx="108" cy="167" r="6.5" fill="#1f6f8b"/>
      <circle cx="90" cy="150" r="8" fill="#333"/>
      <circle cx="108" cy="137" r="6.5" fill="#1f6f8b"/>
      <circle cx="135" cy="150" r="8" fill="#333"/>
      <circle cx="153" cy="137" r="6.5" fill="#1f6f8b"/>
      <circle cx="180" cy="150" r="8" fill="#333"/>
      <circle cx="198" cy="137" r="6.5" fill="#1f6f8b"/>
      <circle cx="112" cy="120" r="8" fill="#333"/>
      <circle cx="130" cy="107" r="6.5" fill="#1f6f8b"/>
      <circle cx="157" cy="120" r="8" fill="#333"/>
      <circle cx="175" cy="107" r="6.5" fill="#1f6f8b"/>
      <circle cx="202" cy="120" r="8" fill="#333"/>
      <circle cx="220" cy="107" r="6.5" fill="#1f6f8b"/>
    </g>
    <g font-family="sans-serif" font-size="13" fill="#333">
      <text x="80" y="282">● 格点</text>
      <text x="150" y="282" fill="#1f6f8b">● 基元原子 A</text>
      <text x="280" y="282" fill="#c0392b">■ 原胞（基矢张成）</text>
    </g>
  </g>

  <!-- 分隔线 -->
  <line x1="300" y1="60" x2="300" y2="260" stroke="#999" stroke-width="1"/>

  <!-- 右面板：同一格子 + 不同基元 -->
  <g>
    <text x="330" y="28" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">右：同一格子 + 不同基元 → 不同晶体结构</text>
    <!-- 迷你 A：单原子基元 -->
    <text x="330" y="58" font-family="sans-serif" font-size="13" fill="#333">基元 = 单个 A 原子</text>
    <g>
      <circle cx="345" cy="90" r="8" fill="#c0392b"/>
      <circle cx="375" cy="90" r="8" fill="#c0392b"/>
      <circle cx="405" cy="90" r="8" fill="#c0392b"/>
      <circle cx="345" cy="120" r="8" fill="#c0392b"/>
      <circle cx="375" cy="120" r="8" fill="#c0392b"/>
      <circle cx="405" cy="120" r="8" fill="#c0392b"/>
      <circle cx="345" cy="150" r="8" fill="#c0392b"/>
      <circle cx="375" cy="150" r="8" fill="#c0392b"/>
      <circle cx="405" cy="150" r="8" fill="#c0392b"/>
    </g>
    <!-- 迷你 B：双原子基元（二维 NaCl 投影） -->
    <text x="500" y="58" font-family="sans-serif" font-size="13" fill="#333">基元 = A + B（如 NaCl 投影）</text>
    <g>
      <circle cx="515" cy="90" r="8" fill="#c0392b"/>
      <circle cx="545" cy="90" r="8" fill="#c0392b"/>
      <circle cx="575" cy="90" r="8" fill="#c0392b"/>
      <circle cx="515" cy="120" r="8" fill="#c0392b"/>
      <circle cx="545" cy="120" r="8" fill="#c0392b"/>
      <circle cx="575" cy="120" r="8" fill="#c0392b"/>
      <circle cx="515" cy="150" r="8" fill="#c0392b"/>
      <circle cx="545" cy="150" r="8" fill="#c0392b"/>
      <circle cx="575" cy="150" r="8" fill="#c0392b"/>
      <circle cx="530" cy="105" r="6" fill="#1f6f8b"/>
      <circle cx="560" cy="105" r="6" fill="#1f6f8b"/>
      <circle cx="530" cy="135" r="6" fill="#1f6f8b"/>
      <circle cx="560" cy="135" r="6" fill="#1f6f8b"/>
    </g>
    <!-- 箭头与总结 -->
    <text x="330" y="205" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">同一四方格子</text>
    <text x="330" y="228" font-family="sans-serif" font-size="14" fill="#333">＋ 不同基元</text>
    <text x="330" y="258" font-family="sans-serif" font-size="14" fill="#333">＝ 两种不同晶体</text>
    <text x="330" y="288" font-family="sans-serif" font-size="13" fill="#666">结构 = 格子（骨架）+ 基元（血肉）</text>
  </g>
</svg>
