<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc">
  <title>布拉格反射：相邻晶面的光程差</title>
  <desc>两组平行晶面（间距 d），入射线与晶面夹角为 θ，反射线相干叠加；相邻两面的光程差为 2d sinθ，相长干涉条件为 2d sinθ = nλ。</desc>
  <rect width="620" height="320" fill="#faf9f5"/>
  <text x="20" y="28" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">布拉格反射：2d sinθ = nλ</text>

  <!-- 晶面（两组平行线） -->
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="60" y1="130" x2="560" y2="130"/>
    <line x1="60" y1="170" x2="560" y2="170"/>
    <line x1="60" y1="210" x2="560" y2="210"/>
  </g>
  <text x="566" y="134" font-family="sans-serif" font-size="13" fill="#1f6f8b">晶面 1</text>
  <text x="566" y="174" font-family="sans-serif" font-size="13" fill="#1f6f8b">晶面 2</text>
  <text x="566" y="214" font-family="sans-serif" font-size="13" fill="#1f6f8b">晶面 3</text>

  <!-- 晶面间距标注 -->
  <line x1="46" y1="130" x2="46" y2="170" stroke="#333" stroke-width="1"/>
  <line x1="40" y1="130" x2="52" y2="130" stroke="#333" stroke-width="1"/>
  <line x1="40" y1="170" x2="52" y2="170" stroke="#333" stroke-width="1"/>
  <text x="30" y="155" font-family="sans-serif" font-size="14" fill="#333">d</text>

  <!-- 入射束 A、B -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="80" y1="60" x2="220" y2="130"/>
    <line x1="120" y1="60" x2="220" y2="130"/>
  </g>
  <text x="70" y="56" font-family="sans-serif" font-size="13" fill="#c0392b">入射线</text>

  <!-- 反射束 A'、B' -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="220" y1="130" x2="400" y2="40"/>
    <line x1="260" y1="170" x2="440" y2="80"/>
  </g>
  <text x="400" y="36" font-family="sans-serif" font-size="13" fill="#c0392b">反射线</text>

  <!-- 原子位置 -->
  <g fill="#333">
    <circle cx="220" cy="130" r="6"/>
    <circle cx="260" cy="170" r="6"/>
    <circle cx="300" cy="210" r="6"/>
  </g>

  <!-- 垂线与路径差辅助线 -->
  <g stroke="#999" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="170" x2="220" y2="130"/>
    <line x1="260" y1="170" x2="332" y2="138"/>
    <line x1="260" y1="170" x2="236" y2="158"/>
  </g>

  <!-- 角度标注：θ -->
  <path d="M 200 130 L 214 124 L 210 117" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="176" y="116" font-family="sans-serif" font-size="14" fill="#666">θ</text>
  <path d="M 240 170 L 254 164 L 250 157" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="252" y="158" font-family="sans-serif" font-size="14" fill="#666">θ</text>

  <!-- 光程差标注 -->
  <text x="238" y="150" font-family="sans-serif" font-size="13" fill="#333">光程差 = 2d sinθ</text>

  <!-- 公式 -->
  <rect x="60" y="250" width="360" height="48" rx="6" fill="#f3e9dc" stroke="#c0392b" stroke-width="1.2"/>
  <text x="78" y="280" font-family="sans-serif" font-size="18" fill="#333">2d sinθ = nλ（n = 1, 2, 3, …）</text>

  <text x="60" y="308" font-family="sans-serif" font-size="13" fill="#666">θ 是入射线与晶面的夹角；相邻晶面间距为 d</text>
</svg>
