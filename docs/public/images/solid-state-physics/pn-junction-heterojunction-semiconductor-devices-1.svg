<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title>p-n 结平衡能带图</title>
  <desc>左侧为 p 型区、右侧为 n 型区，中间为耗尽区；导带底 E_c 与价带顶 E_v 在结区弯曲，费米能级 E_F 处处拉平，内建电势差 eV_bi 对应能带的垂直位移。</desc>
  <rect width="640" height="330" fill="#faf9f5"/>
  <text x="20" y="28" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">p-n 结平衡能带图（费米能级拉平）</text>

  <!-- 区域底色 -->
  <rect x="60" y="70" width="220" height="200" fill="#fdeeee" opacity="0.5"/>
  <rect x="360" y="70" width="220" height="200" fill="#eef5f8" opacity="0.5"/>
  <rect x="280" y="70" width="80" height="200" fill="#f3e9dc" opacity="0.6"/>
  <text x="140" y="92" font-family="sans-serif" font-size="14" fill="#c0392b">p 区</text>
  <text x="440" y="92" font-family="sans-serif" font-size="14" fill="#1f6f8b">n 区</text>
  <text x="286" y="92" font-family="sans-serif" font-size="13" fill="#a0522d">耗尽区</text>

  <!-- E_c 与 E_v（平滑弯曲） -->
  <path d="M 60 90 L 280 90 Q 320 150 360 180 L 580 180" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 60 160 L 280 160 Q 320 220 360 250 L 580 250" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 费米能级 -->
  <line x1="60" y1="170" x2="580" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- 内建电场箭头 -->
  <path d="M 340 215 L 300 215" fill="none" stroke="#666" stroke-width="2"/>
  <polygon points="300,215 308,211 308,219" fill="#666"/>
  <text x="296" y="236" font-family="sans-serif" font-size="13" fill="#666">内建电场</text>

  <!-- 标注 -->
  <text x="30" y="94" font-family="sans-serif" font-size="13" fill="#1f6f8b">E_c</text>
  <text x="30" y="164" font-family="sans-serif" font-size="13" fill="#c0392b">E_v</text>
  <text x="530" y="162" font-family="sans-serif" font-size="13" fill="#333">E_F（拉平）</text>

  <!-- 内建电势差标注 -->
  <line x1="80" y1="90" x2="80" y2="180" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="180" x2="560" y2="90" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="66" y="140" font-family="sans-serif" font-size="13" fill="#333">eVbi</text>
  <text x="545" y="140" font-family="sans-serif" font-size="13" fill="#333">eVbi</text>

  <text x="60" y="300" font-family="sans-serif" font-size="13" fill="#666">p 侧 E_F 贴近价带，n 侧 E_F 贴近导带；接触后能带弯曲，内建电势 eVbi 阻止扩散</text>
  <text x="60" y="320" font-family="sans-serif" font-size="13" fill="#666">正偏：势垒降低 → 电流指数增大；反偏：势垒升高 → 电流饱和</text>
</svg>
