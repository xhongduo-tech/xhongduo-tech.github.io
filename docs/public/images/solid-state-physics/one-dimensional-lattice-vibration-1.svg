<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title>一维原子链的色散关系</title>
  <desc>左图：单原子链只有一支色散曲线，在布里渊区边界 k=π/a 处频率最大、群速度为零；右图：双原子链分裂出声学支（低频）与光学支（高频），两支之间存在声子禁带。</desc>
  <rect width="640" height="340" fill="#faf9f5"/>
  <text x="20" y="26" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">色散关系 ω(k)（第一布里渊区内）</text>

  <!-- 左面板：单原子链 -->
  <g>
    <text x="30" y="58" font-family="sans-serif" font-size="14" fill="#333">单原子链：一支声子</text>
    <!-- 坐标轴 -->
    <line x1="50" y1="260" x2="290" y2="260" stroke="#333" stroke-width="1.5"/>
    <line x1="50" y1="260" x2="50" y2="90" stroke="#333" stroke-width="1.5"/>
    <text x="270" y="276" font-family="sans-serif" font-size="13" fill="#333">k</text>
    <text x="30" y="100" font-family="sans-serif" font-size="13" fill="#333">ω</text>
    <!-- BZ 边界 -->
    <line x1="50" y1="260" x2="170" y2="260" stroke="#999" stroke-width="0.6" stroke-dasharray="2 2"/>
    <line x1="170" y1="260" x2="290" y2="260" stroke="#999" stroke-width="0.6" stroke-dasharray="2 2"/>
    <text x="160" y="276" font-family="sans-serif" font-size="13" fill="#666">π/a</text>
    <text x="244" y="276" font-family="sans-serif" font-size="13" fill="#666">-π/a</text>
    <!-- 色散曲线 ω = 2√(K/M)|sin(ka/2)| 从 0 到 π/a 用半周期正弦 -->
    <path d="M 170 90 Q 132 170 50 260" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M 170 90 Q 208 170 290 260" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <circle cx="170" cy="90" r="4" fill="#c0392b"/>
    <text x="180" y="88" font-family="sans-serif" font-size="13" fill="#c0392b">ωmax = 2√(K/M)</text>
    <text x="66" y="250" font-family="sans-serif" font-size="13" fill="#666">长波极限 ω ≈ vₛk（声速）</text>
  </g>

  <!-- 右面板：双原子链 -->
  <g>
    <text x="330" y="58" font-family="sans-serif" font-size="14" fill="#333">双原子链：声学支 + 光学支</text>
    <line x1="350" y1="260" x2="600" y2="260" stroke="#333" stroke-width="1.5"/>
    <line x1="350" y1="260" x2="350" y2="80" stroke="#333" stroke-width="1.5"/>
    <text x="580" y="276" font-family="sans-serif" font-size="13" fill="#333">k</text>
    <text x="330" y="96" font-family="sans-serif" font-size="13" fill="#333">ω</text>
    <line x1="350" y1="260" x2="475" y2="260" stroke="#999" stroke-width="0.6" stroke-dasharray="2 2"/>
    <line x1="475" y1="260" x2="600" y2="260" stroke="#999" stroke-width="0.6" stroke-dasharray="2 2"/>
    <text x="465" y="276" font-family="sans-serif" font-size="13" fill="#666">π/a</text>
    <!-- 光学支：在 k=0 有有限频率，向下弯到区边界 -->
    <path d="M 475 92 Q 430 150 350 200" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <path d="M 475 92 Q 520 150 600 200" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <circle cx="350" cy="200" r="4" fill="#1f6f8b"/>
    <!-- 声学支：从原点出发 -->
    <path d="M 475 260 Q 430 240 350 260" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M 475 260 Q 520 240 600 260" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <!-- 禁带标注 -->
    <line x1="350" y1="200" x2="350" y2="260" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="300" y="232" font-family="sans-serif" font-size="12" fill="#666" transform="rotate(-90 300 232)">禁带</text>
    <text x="352" y="116" font-family="sans-serif" font-size="13" fill="#1f6f8b">光学支</text>
    <text x="540" y="252" font-family="sans-serif" font-size="13" fill="#c0392b">声学支</text>
  </g>

  <text x="30" y="312" font-family="sans-serif" font-size="13" fill="#666">k = ±π/a 处群速度 vg = dω/dk = 0，对应布拉格反射（驻波）</text>
  <text x="30" y="332" font-family="sans-serif" font-size="13" fill="#666">双原子链在 k = 0 处声学支从零开始、光学支保持有限频率，中间出现声子禁带</text>
</svg>
