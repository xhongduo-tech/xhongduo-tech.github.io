<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>长期平衡下母体与子体活度随时间的变化</title>
<desc>横轴为时间，纵轴为活度。母体核素半衰期远大于子体，其活度近似恒定；子体活度从零迅速上升并渐近于母体活度，达到长期平衡。</desc>
<rect x="0" y="0" width="660" height="420" fill="#faf9f5"/>
<g stroke="#333" stroke-width="1.5">
  <line x1="70" y1="350" x2="610" y2="350"/>
  <line x1="70" y1="350" x2="70" y2="50"/>
</g>
<!-- 刻度 -->
<g fill="#333" font-family="sans-serif" font-size="14">
  <text x="300" y="382" text-anchor="middle">时间 t</text>
  <text x="40" y="200" text-anchor="middle" transform="rotate(-90 40 200)">活度 A</text>
</g>
<!-- 母体：近似恒定、缓慢下降 -->
<line x1="70" y1="90" x2="590" y2="108" stroke="#1f6f8b" stroke-width="3.5"/>
<text x="600" y="86" fill="#1f6f8b" font-family="sans-serif" font-size="15">母体 A_P（半衰期很长，近似恒定）</text>
<!-- 母体水平虚线 -->
<line x1="70" y1="90" x2="610" y2="90" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
<!-- 子体：从零快速上升渐近于母体 -->
<path d="M70 348 C 130 300, 200 190, 300 140 C 380 112, 480 102, 590 98"
      fill="none" stroke="#c0392b" stroke-width="3.5"/>
<text x="600" y="196" fill="#c0392b" font-family="sans-serif" font-size="15">子体 A_D（从零上升，渐近于母体）</text>
<!-- 标注平衡区 -->
<text x="360" y="74" fill="#1f6f8b" font-family="sans-serif" font-size="15">约 7–10 个子体半衰期后进入长期平衡：</text>
<text x="360" y="94" fill="#1f6f8b" font-family="sans-serif" font-size="15">A_D ≈ A_P，两者同步衰变</text>
<!-- 坐标原点标记 -->
<circle cx="70" cy="350" r="3" fill="#333"/>
<text x="80" y="368" fill="#333" font-family="sans-serif" font-size="13">0</text>
</svg>
