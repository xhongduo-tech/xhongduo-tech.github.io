<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="sans-serif">
  <title>磁光阱构型示意图</title>
  <desc>三对红失谐激光束正交对射，原子云位于中心；反亥姆霍兹线圈产生从中心向外增强的四极磁场，塞曼效应使偏离中心的原子被推回中心。</desc>
  <rect width="560" height="400" fill="#faf9f5"/>
  <!-- laser beams: x pair (horizontal) -->
  <line x1="60" y1="200" x2="180" y2="200" stroke="#c0392b" stroke-width="6"/>
  <line x1="180" y1="200" x2="60" y2="200" stroke="#c0392b" stroke-width="6" opacity="0"/>
  <polygon points="170,194 150,200 170,206" fill="#c0392b"/>
  <text x="70" y="188" font-size="13" fill="#c0392b">x：σ+ / σ−</text>
  <line x1="500" y1="200" x2="380" y2="200" stroke="#c0392b" stroke-width="6"/>
  <polygon points="390,194 410,200 390,206" fill="#c0392b"/>
  <text x="392" y="188" font-size="13" fill="#c0392b">x：σ− / σ+</text>
  <!-- laser beams: z pair (vertical) -->
  <line x1="280" y1="40" x2="280" y2="140" stroke="#c0392b" stroke-width="6"/>
  <polygon points="274,130 280,150 286,130" fill="#c0392b"/>
  <text x="294" y="70" font-size="13" fill="#c0392b">z：σ+</text>
  <line x1="280" y1="360" x2="280" y2="260" stroke="#c0392b" stroke-width="6"/>
  <polygon points="274,270 280,250 286,270" fill="#c0392b"/>
  <text x="294" y="340" font-size="13" fill="#c0392b">z：σ−</text>
  <!-- laser beams: y pair (into/out of page) -->
  <circle cx="150" cy="330" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="170" y="338" font-size="13" fill="#333">y：出纸面（⊗ 反向）</text>
  <line x1="120" y1="330" x2="60" y2="330" stroke="#c0392b" stroke-width="6"/>
  <!-- coils (anti-Helmholtz) -->
  <rect x="160" y="52" width="240" height="26" rx="5" fill="#1f6f8b"/>
  <text x="240" y="70" font-size="14" fill="#fff" text-anchor="middle">反亥姆霍兹线圈（四极磁场）</text>
  <rect x="160" y="322" width="240" height="26" rx="5" fill="#1f6f8b"/>
  <text x="240" y="340" font-size="14" fill="#fff" text-anchor="middle">反亥姆霍兹线圈（四极磁场）</text>
  <!-- magnetic field arrows: radial outward near center -->
  <line x1="255" y1="210" x2="235" y2="225" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="235,225 247,220 240,230" fill="#1f6f8b"/>
  <line x1="305" y1="210" x2="325" y2="225" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="325,225 313,220 320,230" fill="#1f6f8b"/>
  <line x1="255" y1="190" x2="235" y2="175" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="235,175 247,180 240,170" fill="#1f6f8b"/>
  <line x1="305" y1="190" x2="325" y2="175" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="325,175 313,180 320,170" fill="#1f6f8b"/>
  <!-- atom cloud -->
  <ellipse cx="280" cy="200" rx="34" ry="24" fill="#f5c97b" opacity="0.9"/>
  <text x="280" y="205" font-size="14" fill="#333" text-anchor="middle">原子云</text>
  <!-- caption -->
  <text x="60" y="388" font-size="13" fill="#333">中心 B=0，向外磁场线性增强；偏离中心的原子因塞曼位移被推回中心，实现冷却加囚禁</text>
</svg>
