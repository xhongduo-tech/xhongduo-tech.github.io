<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="sans-serif">
  <title>从磁光阱到 BEC 的相空间密度攀升</title>
  <desc>相空间密度 n 乘德布罗意波长三次方，从室温气体的约 10 的负 15 次方，经激光冷却到约 10 的负 6 次方，再经蒸发冷却跨越 BEC 阈值 2.61。</desc>
  <rect width="560" height="340" fill="#faf9f5"/>
  <text x="18" y="34" font-size="14" fill="#333">相空间密度 nλ³</text>
  <text x="18" y="52" font-size="13" fill="#333">（对数刻度）</text>
  <line x1="70" y1="20" x2="70" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="300" x2="510" y2="300" stroke="#333" stroke-width="2"/>
  <text x="82" y="292" font-size="13" fill="#333">10⁻¹⁵</text>
  <text x="82" y="222" font-size="13" fill="#333">10⁻¹⁰</text>
  <text x="82" y="152" font-size="13" fill="#333">10⁻⁵</text>
  <text x="82" y="66" font-size="13" fill="#333">10⁰</text>
  <line x1="70" y1="300" x2="150" y2="300" stroke="#333" stroke-width="3"/>
  <text x="80" y="320" font-size="13" fill="#333">室温气体</text>
  <line x1="150" y1="300" x2="150" y2="175" stroke="#333" stroke-width="3"/>
  <line x1="150" y1="175" x2="260" y2="175" stroke="#333" stroke-width="3"/>
  <text x="160" y="196" font-size="13" fill="#333">激光冷却（MOT）</text>
  <text x="160" y="212" font-size="13" fill="#333">≈ 10⁻⁶</text>
  <line x1="260" y1="175" x2="260" y2="82" stroke="#333" stroke-width="3"/>
  <line x1="260" y1="82" x2="400" y2="82" stroke="#333" stroke-width="3"/>
  <text x="272" y="100" font-size="13" fill="#333">蒸发冷却</text>
  <text x="272" y="116" font-size="13" fill="#333">（射频蒸发）</text>
  <line x1="400" y1="82" x2="400" y2="55" stroke="#333" stroke-width="3"/>
  <line x1="400" y1="55" x2="490" y2="55" stroke="#333" stroke-width="3"/>
  <text x="404" y="44" font-size="14" fill="#c0392b">BEC（T &lt; Tc）</text>
  <line x1="70" y1="95" x2="490" y2="95" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="330" y="86" font-size="14" fill="#c0392b">BEC 阈值 nλ³ ≈ 2.61</text>
  <text x="90" y="334" font-size="13" fill="#333">冷原子实验相空间密度的六个量级，正靠蒸发冷却的最后三步跨越阈值</text>
</svg>
