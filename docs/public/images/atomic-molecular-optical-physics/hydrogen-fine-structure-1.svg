<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="sans-serif">
  <title>氢原子 n=2 能级的精细结构与兰姆位移</title>
  <desc>以玻尔能级 E2 为参考线，精细结构把 n=2 分裂为 2p3/2（j=3/2）与 2s1/2、2p1/2（j=1/2）两组，兰姆位移使 2s1/2 高于 2p1/2 约 1.058 GHz。</desc>
  <rect width="540" height="340" fill="#faf9f5"/>
  <text x="18" y="46" font-size="14" fill="#333">能量</text>
  <text x="18" y="64" font-size="13" fill="#333">（降低 ↓）</text>
  <line x1="70" y1="30" x2="70" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="120" x2="400" y2="120" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="408" y="124" font-size="14" fill="#1f6f8b">玻尔能级 E2 = −3.4 eV</text>
  <line x1="100" y1="178" x2="400" y2="178" stroke="#333" stroke-width="2.5"/>
  <line x1="100" y1="236" x2="400" y2="236" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="100" y1="264" x2="400" y2="264" stroke="#333" stroke-width="2.5"/>
  <text x="104" y="170" font-size="14" fill="#333">2p3/2（j = 3/2）</text>
  <text x="104" y="228" font-size="14" fill="#c0392b">2s1/2（j = 1/2）</text>
  <text x="104" y="256" font-size="14" fill="#333">2p1/2（j = 1/2）</text>
  <line x1="430" y1="178" x2="500" y2="178" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="178" x2="500" y2="264" stroke="#333" stroke-width="1.5"/>
  <line x1="430" y1="264" x2="500" y2="264" stroke="#333" stroke-width="1.5"/>
  <text x="506" y="218" font-size="13" fill="#333">精细结构分裂</text>
  <text x="506" y="234" font-size="13" fill="#333">10.97 GHz</text>
  <line x1="430" y1="236" x2="492" y2="236" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="492" y1="236" x2="500" y2="236" stroke="#c0392b" stroke-width="1.5"/>
  <text x="96" y="300" font-size="13" fill="#333">（能级间距未按真实比例，2p3/2 与 2p1/2 之间为 10.97 GHz，2s1/2 与 2p1/2 之间为 1.058 GHz）</text>
</svg>
