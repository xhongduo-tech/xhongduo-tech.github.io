<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>尘暴（Dust Bowl）的因果链</title>
  <desc>沃斯特《尘暴》的分析框架：生态条件、经济逻辑与制度背景三股力量叠加，导致土壤失去根系保护，最终酿成 1930 年代的黑风暴。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">尘暴（Dust Bowl）的因果链</text>
  <text x="320" y="60" text-anchor="middle" font-size="13" fill="#333">沃斯特《尘暴》的生态—经济—制度分析框架</text>

  <defs>
    <marker id="darrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="20" y="88" width="190" height="100" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="115" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">生态条件</text>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#333">原生草原被翻耕</text>
  <text x="115" y="162" text-anchor="middle" font-size="13" fill="#333">周期性干旱</text>

  <rect x="225" y="88" width="190" height="100" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">经济逻辑</text>
  <text x="320" y="140" text-anchor="middle" font-size="13" fill="#333">机械化耕作、单一小麦</text>
  <text x="320" y="162" text-anchor="middle" font-size="13" fill="#333">资本与信贷扩张</text>

  <rect x="430" y="88" width="190" height="100" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="525" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">制度背景</text>
  <text x="525" y="140" text-anchor="middle" font-size="13" fill="#333">宅地法放垦</text>
  <text x="525" y="162" text-anchor="middle" font-size="13" fill="#333">放任的市场</text>

  <line x1="115" y1="188" x2="270" y2="228" stroke="#333" stroke-width="2.5" marker-end="url(#darrow)"/>
  <line x1="320" y1="188" x2="320" y2="226" stroke="#333" stroke-width="2.5" marker-end="url(#darrow)"/>
  <line x1="525" y1="188" x2="370" y2="228" stroke="#333" stroke-width="2.5" marker-end="url(#darrow)"/>

  <rect x="170" y="232" width="300" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">土壤失去根系保护</text>
  <text x="320" y="282" text-anchor="middle" font-size="13" fill="#333">表层裸露，风蚀加速</text>

  <line x1="320" y1="304" x2="320" y2="332" stroke="#333" stroke-width="2.5" marker-end="url(#darrow)"/>

  <rect x="120" y="336" width="400" height="92" rx="10" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <text x="320" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">1930 年代尘暴</text>
  <text x="320" y="390" text-anchor="middle" font-size="13" fill="#333">黑风暴遮天蔽日</text>
  <text x="320" y="412" text-anchor="middle" font-size="13" fill="#333">农业破产、生态难民（Okies）西迁</text>

  <text x="320" y="458" text-anchor="middle" font-size="12" fill="#333">反馈：大萧条与信贷崩溃，进一步加剧农业破产</text>
</svg>
