<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <title>哥伦布大交换示意图</title>
  <desc>1492 年之后旧大陆与新大陆之间的双向生物大迁移：旧大陆输出小麦、马、牛、猪与天花等病菌；新大陆输出玉米、马铃薯、番茄、烟草等作物。</desc>
  <rect x="0" y="0" width="640" height="430" fill="#faf9f5"/>
  <text x="320" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">哥伦布大交换（Columbian Exchange）</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#333">1492 年之后，两个半球间的生物大迁移</text>

  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <rect x="50" y="170" width="200" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="150" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">旧大陆</text>
  <text x="150" y="228" text-anchor="middle" font-size="13" fill="#333">欧亚非</text>
  <text x="150" y="262" text-anchor="middle" font-size="13" fill="#333">输出：小麦、水稻、甘蔗</text>
  <text x="150" y="284" text-anchor="middle" font-size="13" fill="#333">马、牛、猪、羊</text>
  <text x="150" y="306" text-anchor="middle" font-size="13" fill="#c0392b">天花、麻疹病菌</text>

  <rect x="390" y="170" width="200" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="490" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">新大陆</text>
  <text x="490" y="228" text-anchor="middle" font-size="13" fill="#333">美洲</text>
  <text x="490" y="262" text-anchor="middle" font-size="13" fill="#333">输出：玉米、马铃薯、番茄</text>
  <text x="490" y="284" text-anchor="middle" font-size="13" fill="#333">甘薯、木薯、辣椒</text>
  <text x="490" y="306" text-anchor="middle" font-size="13" fill="#1f6f8b">烟草、可可</text>

  <text x="320" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">旧大陆 → 新大陆</text>
  <line x1="250" y1="140" x2="388" y2="140" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#c0392b">病菌、家畜、作物随船西行</text>

  <line x1="390" y1="370" x2="252" y2="370" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrowL)"/>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#1f6f8b">高产作物随船东归</text>
  <text x="320" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">新大陆 → 旧大陆</text>
</svg>
