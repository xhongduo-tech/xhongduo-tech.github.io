<svg viewBox="0 0 680 448" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>睡眠结构对比：年轻人与老年人</title>
<desc>上图为年轻人的睡眠图，深睡集中在后半夜之前，周期规律，夜间觉醒少；下图为老年人的睡眠图，深睡几乎消失，频繁觉醒打断睡眠，夜间的快速眼动也缩短。图为示意图，仅用于展示睡眠结构随年龄的变化趋势。</desc>
<rect width="680" height="448" fill="#faf9f5"/>
<text x="340" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">睡眠结构图：年轻人 vs 老年人（示意图）</text>

<!-- 面板1：年轻人 -->
<rect x="105" y="48" width="550" height="165" fill="#fdfcfa" stroke="#e0dcd3"/>
<text x="380" y="44" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">年轻人</text>

<!-- 面板2：老年人 -->
<rect x="105" y="248" width="550" height="165" fill="#fdfcfa" stroke="#e0dcd3"/>
<text x="380" y="244" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">老年人</text>

<!-- 网格线 -->
<g stroke="#ece7df" stroke-width="1">
<line x1="110" y1="60" x2="650" y2="60"/>
<line x1="110" y1="90" x2="650" y2="90"/>
<line x1="110" y1="120" x2="650" y2="120"/>
<line x1="110" y1="150" x2="650" y2="150"/>
<line x1="110" y1="180" x2="650" y2="180"/>
<line x1="110" y1="260" x2="650" y2="260"/>
<line x1="110" y1="290" x2="650" y2="290"/>
<line x1="110" y1="320" x2="650" y2="320"/>
<line x1="110" y1="350" x2="650" y2="350"/>
<line x1="110" y1="380" x2="650" y2="380"/>
</g>

<!-- Y 轴标签：面板1 -->
<text x="98" y="63" text-anchor="end" font-size="13" fill="#333">觉醒</text>
<text x="98" y="93" text-anchor="end" font-size="13" fill="#333">REM</text>
<text x="98" y="123" text-anchor="end" font-size="13" fill="#333">N1</text>
<text x="98" y="153" text-anchor="end" font-size="13" fill="#333">N2</text>
<text x="98" y="183" text-anchor="end" font-size="13" fill="#333">N3</text>

<!-- Y 轴标签：面板2 -->
<text x="98" y="263" text-anchor="end" font-size="13" fill="#333">觉醒</text>
<text x="98" y="293" text-anchor="end" font-size="13" fill="#333">REM</text>
<text x="98" y="323" text-anchor="end" font-size="13" fill="#333">N1</text>
<text x="98" y="353" text-anchor="end" font-size="13" fill="#333">N2</text>
<text x="98" y="383" text-anchor="end" font-size="13" fill="#333">N3</text>

<!-- 年轻人睡眠图：深睡集中在后半夜之前，周期规律 -->
<polyline fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-linejoin="round" points="110,60 140,60 140,120 150,150 165,180 240,180 240,150 260,120 270,90 280,150 295,180 330,180 330,150 350,90 365,150 385,180 405,180 405,150 430,90 445,150 465,180 480,150 510,90 540,120 560,60"/>

<!-- 老年人睡眠图：深睡几近消失，觉醒频繁打断 -->
<polyline fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" points="110,60 130,120 145,150 165,180 185,150 200,120 215,60 230,120 245,150 265,90 285,60 300,120 315,150 335,120 350,60 365,120 380,150 400,90 420,120 435,60 450,120 465,150 480,180 495,150 515,90 535,120 550,90 575,60"/>

<!-- 注解 -->
<text x="380" y="231" text-anchor="middle" font-size="13" fill="#1f6f8b">前半夜深睡集中，一夜 4–5 个周期，觉醒极少</text>
<text x="380" y="435" text-anchor="middle" font-size="13" fill="#c0392b">深睡几近消失，觉醒频繁打断，REM 也变短</text>

<!-- 时间轴 -->
<line x1="110" y1="416" x2="650" y2="416" stroke="#333" stroke-width="1"/>
<text x="110" y="443" text-anchor="middle" font-size="13" fill="#333">23:00</text>
<text x="245" y="443" text-anchor="middle" font-size="13" fill="#333">01:00</text>
<text x="380" y="443" text-anchor="middle" font-size="13" fill="#333">03:00</text>
<text x="515" y="443" text-anchor="middle" font-size="13" fill="#333">05:00</text>
<text x="650" y="443" text-anchor="middle" font-size="13" fill="#333">07:00</text>
</svg>
