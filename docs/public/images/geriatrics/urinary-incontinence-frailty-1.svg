<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>衰弱的恶性循环</title>
  <desc>急性疾病导致肌少症，进而跌倒骨折、卧床失能，再住院又加重衰弱，形成围绕中心「衰弱」节点的顺时针恶性循环。</desc>
  <defs>
    <marker id="frailArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#faf9f5"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">衰弱的恶性循环</text>

  <!-- 中心 -->
  <rect x="262" y="205" width="116" height="62" rx="8" fill="#1f6f8b"/>
  <text x="320" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">衰弱</text>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#ffffff">多系统储备下降</text>

  <!-- 节点 -->
  <rect x="235" y="40" width="170" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#333333">急性病 / 住院</text>

  <rect x="470" y="205" width="160" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="550" y="235" text-anchor="middle" font-size="14" fill="#333333">肌少症 / 营养不足</text>

  <rect x="390" y="370" width="160" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="400" text-anchor="middle" font-size="14" fill="#333333">跌倒 / 骨折</text>

  <rect x="90" y="370" width="160" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="400" text-anchor="middle" font-size="14" fill="#333333">卧床 / 压疮 / 血栓</text>

  <rect x="10" y="205" width="160" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="90" y="235" text-anchor="middle" font-size="14" fill="#333333">活动下降 / 失能</text>

  <rect x="90" y="40" width="170" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="175" y="70" text-anchor="middle" font-size="14" fill="#333333">再住院 / 功能恶化</text>

  <!-- 循环箭头 -->
  <line x1="405" y1="70" x2="468" y2="205" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
  <line x1="550" y1="257" x2="495" y2="368" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
  <line x1="390" y1="396" x2="255" y2="396" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
  <line x1="170" y1="370" x2="170" y2="260" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
  <line x1="90" y1="205" x2="140" y2="95" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
  <line x1="260" y1="66" x2="232" y2="66" stroke="#c0392b" stroke-width="2" marker-end="url(#frailArrow)"/>
</svg>
