<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <title>跌倒的危险因素与级联后果</title>
  <desc>内在与外在危险因素共同导致跌倒，跌倒触发骨折、卧床、失能等级联后果，恐惧跌倒又形成再跌倒的恶性循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#faf9f5"/>

  <!-- 内在因素 -->
  <rect x="20" y="45" width="195" height="135" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="117" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">内在因素</text>
  <text x="35" y="90" font-size="13" fill="#333333">肌力与平衡下降</text>
  <text x="35" y="108" font-size="13" fill="#333333">步态异常、慢步速</text>
  <text x="35" y="126" font-size="13" fill="#333333">视力/前庭/本体感减退</text>
  <text x="35" y="144" font-size="13" fill="#333333">认知障碍</text>
  <text x="35" y="162" font-size="13" fill="#333333">多重用药与慢性病</text>

  <!-- 外在因素 -->
  <rect x="20" y="235" width="195" height="135" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="117" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">外在因素</text>
  <text x="35" y="280" font-size="13" fill="#333333">地面湿滑、绊脚地毯</text>
  <text x="35" y="298" font-size="13" fill="#333333">台阶与门槛</text>
  <text x="35" y="316" font-size="13" fill="#333333">照明不足</text>
  <text x="35" y="334" font-size="13" fill="#333333">鞋不合脚</text>
  <text x="35" y="352" font-size="13" fill="#333333">家具阻碍、无人照护</text>

  <!-- 箭头 → 跌倒 -->
  <line x1="215" y1="110" x2="270" y2="158" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="300" x2="270" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 跌倒 -->
  <rect x="272" y="140" width="130" height="72" rx="8" fill="#c0392b"/>
  <text x="337" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">跌倒</text>
  <text x="337" y="196" text-anchor="middle" font-size="13" fill="#ffffff">（触发事件）</text>

  <!-- 级联后果 -->
  <rect x="445" y="30" width="175" height="46" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="532" y="57" text-anchor="middle" font-size="13" fill="#333333">骨折 / 头部外伤</text>
  <rect x="445" y="100" width="175" height="46" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="532" y="127" text-anchor="middle" font-size="13" fill="#333333">卧床 / 长期制动</text>
  <rect x="445" y="170" width="175" height="46" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="532" y="197" text-anchor="middle" font-size="13" fill="#333333">肌少症·压疮·血栓</text>
  <rect x="445" y="240" width="175" height="46" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="532" y="267" text-anchor="middle" font-size="13" fill="#333333">永久失能 / 入住照护机构</text>

  <!-- 级联箭头 -->
  <line x1="402" y1="168" x2="445" y2="62" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="532" y1="76" x2="532" y2="100" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="532" y1="146" x2="532" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="532" y1="216" x2="532" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 恐惧再跌回路 -->
  <rect x="245" y="330" width="250" height="70" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="370" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6f8b">恐惧再跌 → 活动减少</text>
  <text x="370" y="378" text-anchor="middle" font-size="13" fill="#333333">肌肉萎缩（去适应）→ 再跌倒</text>
  <line x1="370" y1="330" x2="348" y2="212" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>
