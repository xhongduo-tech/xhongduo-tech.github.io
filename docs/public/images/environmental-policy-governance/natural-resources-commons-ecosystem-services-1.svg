<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
  <title id="title">渔业可持续产量曲线</title>
  <desc id="desc">以鱼类生物量为横轴、可持续产量为纵轴绘制的逻辑斯蒂增长曲线，标注最大可持续产量 MSY、最大经济产量 MEY 与开放式进入（公地）均衡点的位置关系。</desc>
  <rect x="0" y="0" width="720" height="480" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="440" x2="695" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="440" x2="40" y2="60" stroke="#333" stroke-width="2"/>
  <polygon points="695,440 680,434 680,446" fill="#333"/>
  <polygon points="40,60 46,75 34,75" fill="#333"/>
  <!-- 网格与刻度 -->
  <line x1="360" y1="440" x2="360" y2="80" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="245" y1="440" x2="245" y2="127" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="155" y1="440" x2="155" y2="228" stroke="#666" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="680" y1="440" x2="680" y2="452" stroke="#333" stroke-width="2"/>
  <text x="360" y="466" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">X·(MSY 处)</text>
  <text x="245" y="466" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">X·(MEY 处)</text>
  <text x="155" y="466" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">X·(公地)</text>
  <text x="680" y="466" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">环境容量 K</text>
  <!-- 生长曲线 -->
  <path d="M40,440 L72,372 L104,310 L136,256 L168,210 L200,170 L232,138 L264,112 L296,94 L328,84 L360,80 L392,84 L424,94 L456,112 L488,138 L520,170 L552,210 L584,256 L616,310 L648,372 L680,440"
        fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linecap="round"/>
  <!-- 关键点 -->
  <circle cx="360" cy="80" r="6" fill="#c0392b"/>
  <circle cx="245" cy="127" r="6" fill="#1f6f8b"/>
  <circle cx="155" cy="228" r="6" fill="#666"/>
  <!-- 标注 -->
  <text x="360" y="58" font-family="sans-serif" font-size="16" fill="#c0392b" text-anchor="middle">最大可持续产量 MSY</text>
  <text x="245" y="112" font-family="sans-serif" font-size="15" fill="#1f6f8b" text-anchor="end">最大经济产量 MEY</text>
  <text x="155" y="252" font-family="sans-serif" font-size="15" fill="#666" text-anchor="middle">开放式进入均衡（公地）</text>
  <text x="420" y="300" font-family="sans-serif" font-size="15" fill="#333" text-anchor="start">F(X) = rX(1 − X/K)</text>
  <text x="40" y="30" font-family="sans-serif" font-size="17" fill="#333">鱼类生物量 X（存量）</text>
  <text x="40" y="455" font-family="sans-serif" font-size="15" fill="#333" text-anchor="start">生物量 X →</text>
  <text x="30" y="330" font-family="sans-serif" font-size="15" fill="#333" transform="rotate(-90 30,330)" text-anchor="middle">可持续产量 F(X) →</text>
</svg>
