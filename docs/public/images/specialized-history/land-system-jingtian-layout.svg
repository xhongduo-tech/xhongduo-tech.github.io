<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" font-family="sans-serif">
  <title>井田制九宫布局示意</title>
  <desc>一井方一里、九百亩，按井字分为九块：中间一块为公田，由八家共耕；周围八块为私田，各归一户。</desc>
  <rect x="0" y="0" width="400" height="420" fill="#faf9f5"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">井田制九宫布局示意</text>
  <text x="200" y="50" text-anchor="middle" font-size="13" fill="#666">方里而井 · 井九百亩 · 八家皆私百亩，同养公田</text>

  <g stroke="#333" stroke-width="3">
    <rect x="40" y="70" width="320" height="320" fill="none"/>
    <line x1="146" y1="70" x2="146" y2="390"/>
    <line x1="253" y1="70" x2="253" y2="390"/>
    <line x1="40" y1="176" x2="360" y2="176"/>
    <line x1="40" y1="283" x2="360" y2="283"/>
  </g>

  <g fill="#333" font-size="14" text-anchor="middle">
    <text x="93" y="125">私田</text>
    <text x="200" y="125">私田</text>
    <text x="306" y="125">私田</text>
    <text x="93" y="232">私田</text>
    <text x="306" y="232">私田</text>
    <text x="93" y="340">私田</text>
    <text x="200" y="340">私田</text>
    <text x="306" y="340">私田</text>
  </g>

  <g fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="200" y="225">公田</text>
    <text x="200" y="250" font-size="13" font-weight="normal" fill="#8a3a2a">八家共耕</text>
  </g>

  <text x="40" y="412" font-size="13" fill="#1f6f8b">公田：中央百亩，收成归领主</text>
  <text x="280" y="412" font-size="13" fill="#1f6f8b">私田：周边八块，各归一户</text>
</svg>
