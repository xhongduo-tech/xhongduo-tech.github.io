<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
<title>药物剂量-效应曲线</title>
<desc>量反应与质反应叠加图：横轴为对数剂量，纵轴为效应百分数。蓝色 S 形曲线为治疗效应，红色 S 形曲线为毒性/致死效应，虚线分别标示 ED50 与 LD50，两线之间的水平箭头表示安全范围（治疗窗）。</desc>
<rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>
<g fill="none" stroke="#333" stroke-width="2">
  <line x1="60" y1="360" x2="680" y2="360"/>
  <line x1="60" y1="360" x2="60" y2="60"/>
</g>
<g fill="#333">
  <polygon points="680,360 668,355 668,365"/>
  <polygon points="60,60 55,72 65,72"/>
</g>
<g stroke="#ddd" stroke-width="1">
  <line x1="60" y1="215" x2="680" y2="215"/>
  <line x1="60" y1="80" x2="680" y2="80"/>
</g>
<path d="M 60 350 C 150 350 200 290 280 215 C 360 140 460 90 660 80" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<path d="M 60 350 C 320 350 430 300 540 215 C 605 165 640 120 660 80" fill="none" stroke="#c0392b" stroke-width="3"/>
<g stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4">
  <line x1="280" y1="215" x2="280" y2="360"/>
  <line x1="540" y1="215" x2="540" y2="360"/>
</g>
<circle cx="280" cy="215" r="5" fill="#1f6f8b" stroke="#fff" stroke-width="2"/>
<circle cx="540" cy="215" r="5" fill="#c0392b" stroke="#fff" stroke-width="2"/>
<g fill="#333" font-size="15">
  <text x="45" y="365" text-anchor="end">0%</text>
  <text x="45" y="220" text-anchor="end">50%</text>
  <text x="45" y="85" text-anchor="end">100%</text>
  <text x="280" y="380" text-anchor="middle" font-size="16">ED50</text>
  <text x="540" y="380" text-anchor="middle" font-size="16">LD50</text>
  <text x="330" y="140">治疗效应（ED）</text>
  <text x="560" y="245">毒性效应（LD）</text>
  <text transform="rotate(-90 28 210)" x="28" y="210" text-anchor="middle">效应（%）</text>
  <text x="370" y="410" text-anchor="middle">对数剂量（lgD）</text>
</g>
<g stroke="#666" stroke-width="1.5">
  <line x1="280" y1="62" x2="540" y2="62"/>
  <polygon points="280,62 292,57 292,67"/>
  <polygon points="540,62 528,57 528,67"/>
</g>
<text x="410" y="52" text-anchor="middle" fill="#c0392b" font-size="15">安全范围（治疗窗）</text>
</svg>
