<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>色谱分离与色谱图</title>
  <desc>混合物经色谱柱分离后，检测器记录下两个随时间先后出现的色谱峰，保留时间分别为 tR1 与 tR2，峰宽为 W1 与 W2。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="80" y1="300" x2="600" y2="300"/>
    <line x1="80" y1="300" x2="80" y2="40"/>
  </g>
  <text x="70" y="50" font-size="15" fill="#333" text-anchor="end">信号</text>
  <text x="560" y="330" font-size="15" fill="#333">时间 →</text>
  <text x="250" y="55" font-size="16" fill="#c0392b">色谱峰 1</text>
  <text x="400" y="55" font-size="16" fill="#1f6f8b">色谱峰 2</text>
  <path d="M80,300 C110,300 140,150 180,60 C200,25 220,25 240,60 C280,150 310,300 340,300 Z" fill="#c0392b" opacity="0.35" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M220,300 C250,300 280,120 320,40 C360,-10 400,-10 440,40 C480,120 510,300 540,300 Z" fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="180" y1="132" x2="180" y2="300" stroke="#c0392b" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="320" y1="112" x2="320" y2="300" stroke="#1f6f8b" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="180" y="122" font-size="14" fill="#c0392b" text-anchor="middle">tR1</text>
  <text x="320" y="102" font-size="14" fill="#1f6f8b" text-anchor="middle">tR2</text>
  <line x1="150" y1="190" x2="210" y2="190" stroke="#c0392b" stroke-width="2"/>
  <text x="180" y="182" font-size="14" fill="#c0392b" text-anchor="middle">W1</text>
  <line x1="295" y1="170" x2="345" y2="170" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="162" font-size="14" fill="#1f6f8b" text-anchor="middle">W2</text>
  <text x="480" y="185" font-size="15" fill="#333">两峰保留时间差越大、峰越窄，</text>
  <text x="480" y="207" font-size="15" fill="#333">分离度 R 越高，</text>
  <text x="480" y="229" font-size="15" fill="#333">R ≥ 1.5 即为基线分离。</text>
  <rect x="80" y="330" width="520" height="2" fill="#333"/>
  <text x="80" y="348" font-size="13" fill="#666">进样 → 色谱柱内分离 → 检测器按保留时间记录出峰</text>
</svg>
