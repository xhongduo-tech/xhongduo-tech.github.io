<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="sans-serif">
  <title>Kubernetes 集群架构：控制平面与工作节点</title>
  <desc>左侧控制平面包含 etcd、API Server、Scheduler、Controller Manager；右侧两个工作节点各运行 kubelet、kube-proxy、containerd 与 Pods；kubectl 通过 API Server 提交声明式状态。</desc>
  <defs>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">Kubernetes 集群架构</text>

  <!-- 控制平面 -->
  <rect x="20" y="70" width="290" height="400" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">控制平面 Control Plane</text>

  <!-- kubectl -->
  <rect x="55" y="20" width="110" height="32" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="41" text-anchor="middle" font-size="14" fill="#333333">kubectl</text>
  <line x1="110" y1="52" x2="165" y2="108" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="112" y="66" font-size="13" fill="#333333">声明式提交</text>

  <!-- API Server -->
  <rect x="45" y="112" width="240" height="50" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">API Server</text>

  <!-- Scheduler 与 Controller Manager 并排 -->
  <rect x="45" y="190" width="115" height="44" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="102" y="217" text-anchor="middle" font-size="13" fill="#333333">Scheduler</text>
  <rect x="170" y="190" width="115" height="44" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="227" y="217" text-anchor="middle" font-size="13" fill="#333333">Controller Manager</text>

  <!-- etcd -->
  <rect x="45" y="262" width="240" height="44" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="165" y="289" text-anchor="middle" font-size="13" fill="#333333">etcd（唯一状态源）</text>

  <!-- API 到 etcd 双向 -->
  <line x1="165" y1="162" x2="165" y2="262" stroke="#c0392b" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="176" y="222" font-size="13" fill="#333333">读写状态</text>

  <!-- 工作节点 1 -->
  <rect x="370" y="70" width="430" height="210" rx="10" fill="#faf9f5" stroke="#333333" stroke-width="1.5"/>
  <text x="585" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">工作节点 1（Node）</text>
  <rect x="390" y="108" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="132" text-anchor="middle" font-size="13" fill="#333333">kubelet</text>
  <rect x="390" y="168" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="192" text-anchor="middle" font-size="13" fill="#333333">kube-proxy</text>
  <rect x="390" y="228" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="252" text-anchor="middle" font-size="13" fill="#333333">containerd</text>
  <rect x="555" y="108" width="230" height="160" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="670" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6f8b">Pods（容器）</text>
  <rect x="575" y="142" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="622" y="166" text-anchor="middle" font-size="13" fill="#333333">Pod A</text>
  <rect x="680" y="142" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="727" y="166" text-anchor="middle" font-size="13" fill="#333333">Pod B</text>
  <rect x="575" y="200" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="622" y="224" text-anchor="middle" font-size="13" fill="#333333">Pod C</text>
  <rect x="680" y="200" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="727" y="224" text-anchor="middle" font-size="13" fill="#333333">Pod D</text>

  <!-- API 到节点1 -->
  <line x1="285" y1="130" x2="390" y2="128" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowEnd)"/>

  <!-- 工作节点 2 -->
  <rect x="370" y="310" width="430" height="210" rx="10" fill="#faf9f5" stroke="#333333" stroke-width="1.5"/>
  <text x="585" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">工作节点 2（Node）</text>
  <rect x="390" y="348" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="372" text-anchor="middle" font-size="13" fill="#333333">kubelet</text>
  <rect x="390" y="408" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="432" text-anchor="middle" font-size="13" fill="#333333">kube-proxy</text>
  <rect x="390" y="468" width="140" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="492" text-anchor="middle" font-size="13" fill="#333333">containerd</text>
  <rect x="555" y="348" width="230" height="160" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="670" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6f8b">Pods（容器）</text>
  <rect x="575" y="382" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="622" y="406" text-anchor="middle" font-size="13" fill="#333333">Pod E</text>
  <rect x="680" y="382" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="727" y="406" text-anchor="middle" font-size="13" fill="#333333">Pod F</text>
  <rect x="575" y="440" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="622" y="464" text-anchor="middle" font-size="13" fill="#333333">Pod G</text>
  <rect x="680" y="440" width="95" height="40" rx="5" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="727" y="464" text-anchor="middle" font-size="13" fill="#333333">Pod H</text>

  <!-- API 到节点2 的路径（绕行，不穿过节点1） -->
  <path d="M 285 137 L 330 137 L 330 368 L 390 368" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="300" y="262" font-size="13" fill="#333333">kubelet 汇报 / 指令下发</text>

  <text x="335" y="500" font-size="13" fill="#999999">kubectl → API Server 是唯一入口；Scheduler 与 Controller Manager 通过 watch 驱动</text>
</svg>
