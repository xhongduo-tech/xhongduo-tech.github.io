<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>磁光阱（MOT）原理示意</title>
<desc>三对红失谐圆偏振激光从六个方向射向中心原子云，反亥姆霍兹线圈产生中心为零、向外线性增大的磁场，使原子受到位置依赖的回推力，实现同时冷却与囚禁。</desc>
<rect width="640" height="420" fill="#faf9f5"/>

<!-- 线圈 -->
<rect x="120" y="18" width="400" height="40" rx="8" fill="#d9d2c9" stroke="#333" stroke-width="2"/>
<rect x="120" y="362" width="400" height="40" rx="8" fill="#d9d2c9" stroke="#333" stroke-width="2"/>
<text x="320" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">反亥姆霍兹线圈（电流方向相反）</text>
<text x="320" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">反亥姆霍兹线圈（电流方向相反）</text>

<!-- 磁场梯度箭头 -->
<g stroke="#1f6f8b" stroke-width="2" fill="#1f6f8b">
  <line x1="320" y1="108" x2="320" y2="140"/>
  <line x1="320" y1="312" x2="320" y2="280"/>
  <line x1="270" y1="210" x2="245" y2="222"/>
  <line x1="370" y1="210" x2="395" y2="222"/>
</g>
<text x="332" y="124" font-family="sans-serif" font-size="13" fill="#1f6f8b">B ≈ B′z（离中心越远场越强）</text>

<!-- 水平激光束对 -->
<g stroke="#c0392b" stroke-width="6" fill="#c0392b">
  <line x1="30" y1="200" x2="265" y2="200"/>
  <line x1="375" y1="200" x2="610" y2="200"/>
  <polygon points="265,200 250,193 250,207"/>
  <polygon points="375,200 390,193 390,207"/>
</g>
<text x="150" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">激光 σ⁺（红失谐）</text>
<text x="490" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">激光 σ⁻（红失谐）</text>

<!-- 竖直激光束对 -->
<g stroke="#c0392b" stroke-width="6" fill="#c0392b">
  <line x1="320" y1="420" x2="320" y2="250"/>
  <line x1="320" y1="170" x2="320" y2="0"/>
  <polygon points="320,250 313,265 327,265"/>
  <polygon points="320,170 313,155 327,155"/>
</g>
<text x="344" y="290" font-family="sans-serif" font-size="14" fill="#c0392b">σ⁻</text>
<text x="344" y="120" font-family="sans-serif" font-size="14" fill="#c0392b">σ⁺</text>

<!-- 垂直纸面的第三对（z 方向）：用圆点/叉号表示 -->
<g stroke="#c0392b" stroke-width="3" fill="none">
  <circle cx="120" cy="210" r="12"/>
  <circle cx="520" cy="210" r="12"/>
</g>
<g stroke="#c0392b" stroke-width="3" fill="#c0392b">
  <circle cx="120" cy="210" r="4"/>
  <circle cx="520" cy="210" r="4"/>
</g>
<text x="120" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">第三对束</text>
<text x="520" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">第三对束</text>

<!-- 原子云 -->
<ellipse cx="320" cy="210" rx="42" ry="34" fill="#1f6f8b" fill-opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
<text x="320" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">原子云</text>

<!-- 受力标注 -->
<g stroke="#333" stroke-width="2">
  <line x1="235" y1="228" x2="205" y2="238"/>
  <line x1="405" y1="228" x2="435" y2="238"/>
</g>
<text x="170" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">位置偏左 → 右向回推力更强</text>
<text x="470" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">位置偏右 → 左向回推力更强</text>

<text x="320" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">合力 F = −κr（位置弹簧）− αv（速度阻尼）</text>
</svg>
