<svg viewBox="0 0 640 360" width="640" height="360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>光晶格中两种物态：超流态与 Mott 绝缘态</title>
<desc>左侧超流态：原子波函数（虚线）延展跨越多个格点，相位相干、可隧穿流动；右侧 Mott 绝缘态：每个格点恰好局域一个原子，占据数钉死、相位不确定。</desc>
<rect width="640" height="360" fill="#faf9f5"/>

<!-- 顶部标题 -->
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">同一座光晶格，两种物态</text>

<!-- 画周期势能曲线的函数 -->
<!-- 左面板 -->
<path d="M 30 150 L 30 150 M 50 100 L 50 220 M 75 150 L 75 70 M 100 100 L 100 220 M 125 150 L 125 70 M 150 100 L 150 220 M 175 150 L 175 70 M 200 100 L 200 220 M 225 150 L 225 70 M 250 100 L 250 220 M 275 150 L 275 70 M 300 100 L 300 220" stroke="#999" stroke-width="2" fill="none"/>
<text x="160" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">超流态（SF）：相位相干，原子非定域</text>
<text x="160" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">U/J 小 → 可隧穿、可无阻流动</text>
<path d="M 40 70 C 55 30 70 30 85 70 C 100 110 115 110 130 70 C 145 30 160 30 175 70 C 190 110 205 110 220 70 C 235 30 250 30 265 70 C 280 110 290 110 300 80" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

<!-- 右面板 -->
<path d="M 360 150 L 360 150 M 380 100 L 380 220 M 405 150 L 405 70 M 430 100 L 430 220 M 455 150 L 455 70 M 480 100 L 480 220 M 505 150 L 505 70 M 530 100 L 530 220 M 555 150 L 555 70 M 580 100 L 580 220 M 605 150 L 605 70" stroke="#999" stroke-width="2" fill="none"/>
<text x="480" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">Mott 绝缘态（MI）：占据数钉死</text>
<text x="480" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">U/J 大（单位填充）→ 每格点恰一个原子</text>
<g fill="#c0392b">
  <circle cx="62" cy="70" r="7"/>
  <circle cx="112" cy="70" r="7"/>
  <circle cx="162" cy="70" r="7"/>
  <circle cx="212" cy="70" r="7"/>
  <circle cx="262" cy="70" r="7"/>
</g>
<g fill="#c0392b">
  <circle cx="392" cy="70" r="7"/>
  <circle cx="442" cy="70" r="7"/>
  <circle cx="492" cy="70" r="7"/>
  <circle cx="542" cy="70" r="7"/>
  <circle cx="592" cy="70" r="7"/>
</g>
<text x="392" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">n=1</text>
<text x="442" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">n=1</text>
<text x="492" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">n=1</text>
<text x="542" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">n=1</text>
<text x="592" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">n=1</text>

<!-- 中央分隔 -->
<line x1="320" y1="40" x2="320" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>

<!-- 判据 -->
<text x="320" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">判据：时间飞行（TOF）干涉峰「有 → 无」</text>
<text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">调节 V₀（即 U/J）可连续驱动两种物态之间的量子相变</text>
</svg>
