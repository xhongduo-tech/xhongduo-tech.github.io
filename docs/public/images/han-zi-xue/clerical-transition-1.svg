<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <title>隶变：篆书圆转线条化为隶书方折笔画</title>
  <desc>对比篆书与隶书的笔画特征：篆书用圆转的连续线条，隶书用方折的独立笔画。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">隶变：从篆书到隶书</text>

  <!-- 左：篆书 -->
  <g>
    <rect x="40" y="60" width="260" height="250" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="170" y="90" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">篆 书</text>
    <text x="170" y="112" text-anchor="middle" font-size="13" fill="#555">圆转 · 连续 · 线条</text>
    <!-- 圆转 S 形笔画 -->
    <path d="M 90 180 C 110 140, 150 220, 170 170 C 190 120, 230 200, 250 150" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <!-- 圆点 -->
    <circle cx="100" cy="230" r="8" fill="#c0392b"/>
    <!-- 标注 -->
    <text x="280" y="145" text-anchor="end" font-size="13" fill="#555">一笔圆转</text>
    <line x1="252" y1="150" x2="235" y2="158" stroke="#999" stroke-width="1"/>
    <text x="280" y="245" text-anchor="end" font-size="13" fill="#555">浑圆之点</text>
    <line x1="252" y1="240" x2="120" y2="230" stroke="#999" stroke-width="1"/>
    <text x="170" y="292" text-anchor="middle" font-size="13" fill="#333">线条粗细均匀，</text>
    <text x="170" y="308" text-anchor="middle" font-size="13" fill="#333">以曲线为主</text>
  </g>

  <!-- 右：隶书 -->
  <g>
    <rect x="340" y="60" width="260" height="250" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="470" y="90" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">隶 书</text>
    <text x="470" y="112" text-anchor="middle" font-size="13" fill="#555">方折 · 断笔 · 笔画</text>
    <!-- 方折笔画 -->
    <path d="M 390 180 L 420 150 L 450 190 L 480 140 L 510 180 L 540 150" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- 方点 -->
    <rect x="398" y="222" width="16" height="16" fill="#c0392b"/>
    <!-- 标注 -->
    <text x="580" y="145" text-anchor="end" font-size="13" fill="#555">多方折</text>
    <line x1="545" y1="150" x2="560" y2="148" stroke="#999" stroke-width="1"/>
    <text x="580" y="245" text-anchor="end" font-size="13" fill="#555">方硬之点</text>
    <line x1="545" y1="240" x2="420" y2="230" stroke="#999" stroke-width="1"/>
    <text x="470" y="292" text-anchor="middle" font-size="13" fill="#333">曲线分解为直线，</text>
    <text x="470" y="308" text-anchor="middle" font-size="13" fill="#333">出现波磔与方笔</text>
  </g>

  <!-- 底部箭头说明 -->
  <text x="320" y="340" text-anchor="middle" font-size="14" fill="#333">圆转 → 方折；连续线条 → 独立笔画；象形 → 符号</text>
</svg>
