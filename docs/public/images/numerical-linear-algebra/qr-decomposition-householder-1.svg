<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="sans-serif">
  <title>Householder 反射的几何示意</title>
  <desc>向量 x 经反射器 H_v 关于镜面（反射超平面）反射后落在 x 轴上，长度为 ‖x‖；v 垂直于镜面。</desc>
  <rect width="600" height="400" fill="#faf9f5"/>
  <!-- x 轴 -->
  <line x1="40" y1="250" x2="556" y2="250" stroke="#999" stroke-width="1.5"/>
  <polygon points="556,250 544,243 544,257" fill="#999"/>
  <text x="420" y="236" fill="#333" font-size="15">e₁ 方向（x 轴）</text>
  <!-- 反射超平面（镜面），过原点、垂直于 v -->
  <line x1="-167" y1="346" x2="348" y2="190" stroke="#777" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="30" y="330" fill="#333" font-size="15">反射超平面 H（镜面）</text>
  <!-- 向量 v（垂直于镜面） -->
  <line x1="348" y1="190" x2="330" y2="130" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="330,130 338,132 335,140" fill="#1f6f8b"/>
  <text x="258" y="152" fill="#1f6f8b" font-size="15">v = x − ‖x‖e₁ 垂直于镜面</text>
  <!-- 向量 x（红色） -->
  <line x1="150" y1="250" x2="330" y2="130" stroke="#c0392b" stroke-width="3"/>
  <polygon points="330,130 320,134 328,142" fill="#c0392b"/>
  <text x="338" y="120" fill="#c0392b" font-size="17">x</text>
  <!-- 向量 Hx（青色），落在 x 轴上 -->
  <line x1="150" y1="250" x2="366" y2="250" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="366,250 356,243 356,257" fill="#1f6f8b"/>
  <text x="372" y="238" fill="#1f6f8b" font-size="17">Hx = ‖x‖e₁</text>
  <!-- 直角标记 -->
  <polyline points="352,190 352,180 342,180" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="40" y="70" fill="#333" font-size="16">Householder 反射：H = I − 2vvᵀ/(vᵀv)</text>
  <text x="40" y="96" fill="#333" font-size="14">x 与 Hx 关于镜面对称，|x| = |Hx|，只需一步把 x 对齐到 e₁。</text>
</svg>
