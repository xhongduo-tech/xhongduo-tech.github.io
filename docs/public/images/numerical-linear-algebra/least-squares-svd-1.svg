<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="sans-serif">
  <title>最小二乘的投影几何</title>
  <desc>向量 b 向列空间 col(A) 作正交投影，得到最佳逼近 Ax̂，残差 r = b − Ax̂ 与列空间垂直。</desc>
  <rect width="600" height="400" fill="#faf9f5"/>
  <!-- 列空间平行四边形 -->
  <polygon points="120,220 290,235 370,345 200,330" fill="#1f6f8b" fill-opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
  <!-- 列空间基向量 -->
  <line x1="120" y1="220" x2="290" y2="235" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="290,235 281,230 283,241" fill="#1f6f8b"/>
  <text x="300" y="228" fill="#1f6f8b" font-size="16">col(A)（列空间）</text>
  <!-- b：红色，指向平面外上方 -->
  <line x1="120" y1="220" x2="250" y2="120" stroke="#c0392b" stroke-width="3"/>
  <polygon points="250,120 240,124 248,132" fill="#c0392b"/>
  <text x="258" y="112" fill="#c0392b" font-size="18">b</text>
  <!-- Ax̂：青色投影 -->
  <line x1="120" y1="220" x2="250" y2="280" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="250,280 254,270 263,278" fill="#1f6f8b"/>
  <text x="150" y="268" fill="#1f6f8b" font-size="17">Ax̂</text>
  <text x="280" y="320" fill="#333" font-size="15">b 在 col(A) 上的正交投影</text>
  <!-- 残差：竖直虚线 -->
  <line x1="250" y1="280" x2="250" y2="120" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="262" y="205" fill="#c0392b" font-size="16">残差 r = b − Ax̂</text>
  <!-- 直角标记 -->
  <polyline points="260,280 260,270 250,270" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="40" y="60" fill="#333" font-size="16">最小二乘 = 正交投影</text>
  <text x="40" y="84" fill="#333" font-size="14">min ‖b − Ax‖ 的取点 Ax̂，使残差垂直于列空间。</text>
</svg>
