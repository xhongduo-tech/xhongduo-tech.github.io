<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="sans-serif">
  <title>探索起点假设：Q 表的每一格都要成为回合起点</title>
  <desc>一个 4 行 4 列的 Q 表，全部 16 个格子都被标记为「起点」，说明探索起点要求每个 (s,a) 组合都有非零概率成为回合的起点，以保证全部动作价值都能被采样。</desc>

  <rect width="500" height="340" fill="#faf9f5"/>

  <text x="250" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">探索起点假设：Q 表的每一格都要被「起点」覆盖</text>

  <!-- 列头：动作 -->
  <text x="120" y="60" text-anchor="middle" font-size="13" fill="#333">状态</text>
  <text x="175" y="60" text-anchor="middle" font-size="14" fill="#333">上</text>
  <text x="245" y="60" text-anchor="middle" font-size="14" fill="#333">下</text>
  <text x="315" y="60" text-anchor="middle" font-size="14" fill="#333">左</text>
  <text x="385" y="60" text-anchor="middle" font-size="14" fill="#333">右</text>

  <!-- 行头：状态 -->
  <text x="120" y="98" text-anchor="middle" font-size="14" fill="#333">s₁</text>
  <text x="120" y="146" text-anchor="middle" font-size="14" fill="#333">s₂</text>
  <text x="120" y="194" text-anchor="middle" font-size="14" fill="#333">s₃</text>
  <text x="120" y="242" text-anchor="middle" font-size="14" fill="#333">s₄</text>

  <!-- 表格线 -->
  <g stroke="#999" stroke-width="1.2">
    <line x1="140" y1="70" x2="420" y2="70"/>
    <line x1="140" y1="118" x2="420" y2="118"/>
    <line x1="140" y1="166" x2="420" y2="166"/>
    <line x1="140" y1="214" x2="420" y2="214"/>
    <line x1="140" y1="262" x2="420" y2="262"/>
    <line x1="140" y1="70" x2="140" y2="262"/>
    <line x1="210" y1="70" x2="210" y2="262"/>
    <line x1="280" y1="70" x2="280" y2="262"/>
    <line x1="350" y1="70" x2="350" y2="262"/>
    <line x1="420" y1="70" x2="420" y2="262"/>
  </g>

  <!-- 全部 16 格标记为起点 -->
  <g fill="#c0392b">
    <circle cx="175" cy="94" r="10"/><circle cx="245" cy="94" r="10"/><circle cx="315" cy="94" r="10"/><circle cx="385" cy="94" r="10"/>
    <circle cx="175" cy="142" r="10"/><circle cx="245" cy="142" r="10"/><circle cx="315" cy="142" r="10"/><circle cx="385" cy="142" r="10"/>
    <circle cx="175" cy="190" r="10"/><circle cx="245" cy="190" r="10"/><circle cx="315" cy="190" r="10"/><circle cx="385" cy="190" r="10"/>
    <circle cx="175" cy="238" r="10"/><circle cx="245" cy="238" r="10"/><circle cx="315" cy="238" r="10"/><circle cx="385" cy="238" r="10"/>
  </g>
  <g fill="#ffffff" font-size="11" text-anchor="middle">
    <text x="175" y="98">起</text><text x="245" y="98">起</text><text x="315" y="98">起</text><text x="385" y="98">起</text>
    <text x="175" y="146">起</text><text x="245" y="146">起</text><text x="315" y="146">起</text><text x="385" y="146">起</text>
    <text x="175" y="194">起</text><text x="245" y="194">起</text><text x="315" y="194">起</text><text x="385" y="194">起</text>
    <text x="175" y="242">起</text><text x="245" y="242">起</text><text x="315" y="242">起</text><text x="385" y="242">起</text>
  </g>

  <text x="250" y="292" text-anchor="middle" font-size="13" fill="#333">要求：每次回合以非零概率从每个 (s, a) 出发，把 Q 表每一格都「点亮」</text>
  <text x="250" y="314" text-anchor="middle" font-size="13" fill="#666">未被覆盖的 (s, a) 无法被评估 → 贪心改进会选到「垃圾估计」</text>
</svg>
