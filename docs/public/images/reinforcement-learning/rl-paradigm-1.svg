<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">强化学习：智能体—环境交互回路</title>
  <desc id="desc">强化学习的智能体—环境交互回路示意图。左侧青色边框方框为智能体，标注「观察状态 · 选择动作」「目标：累积回报最大化」；右侧红色边框方框为环境，标注「状态转移」「产生奖励」。两框之间有三条箭头：上方箭头由智能体指向环境，标注「动作 A_t」；中部红色箭头由环境指向智能体，标注「奖励 R_t+1」；下方青色箭头由环境指向智能体，标注「状态 S_t+1」。底部红色文字强调试错与延迟奖励：动作的回报往往要等许多步之后才兑现。图注说明智能体以动作影响环境，环境以奖励与新状态回应，如此循环往复构成强化学习的基本回路。</desc>

  <rect x="0" y="0" width="720" height="400" fill="#faf9f5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="360" y="40" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">智能体—环境交互回路</text>
  <text x="360" y="66" font-size="14" fill="#777" text-anchor="middle">状态 · 动作 · 奖励的试错闭环</text>

  <!-- 智能体 -->
  <rect x="70" y="120" width="220" height="150" rx="14" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="180" y="152" font-size="18" fill="#1f6f8b" text-anchor="middle" font-weight="bold">智能体</text>
  <text x="180" y="182" font-size="14" fill="#555" text-anchor="middle">观察状态 · 选择动作</text>
  <text x="180" y="206" font-size="14" fill="#555" text-anchor="middle">目标：累积回报最大化</text>

  <!-- 环境 -->
  <rect x="430" y="120" width="220" height="150" rx="14" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="152" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">环境</text>
  <text x="540" y="182" font-size="14" fill="#555" text-anchor="middle">状态转移</text>
  <text x="540" y="206" font-size="14" fill="#555" text-anchor="middle">产生奖励</text>

  <!-- 动作 A_t：智能体 -> 环境 -->
  <line x1="292" y1="160" x2="426" y2="160" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="359" y="149" font-size="16" fill="#333" text-anchor="middle">动作 A<tspan dy="3" font-size="11">t</tspan></text>

  <!-- 奖励 R_{t+1}：环境 -> 智能体 -->
  <line x1="428" y1="215" x2="294" y2="215" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="361" y="204" font-size="16" fill="#c0392b" text-anchor="middle">奖励 R<tspan dy="3" font-size="11">t+1</tspan></text>

  <!-- 状态 S_{t+1}：环境 -> 智能体 -->
  <line x1="428" y1="255" x2="294" y2="255" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="361" y="244" font-size="16" fill="#1f6f8b" text-anchor="middle">状态 S<tspan dy="3" font-size="11">t+1</tspan></text>

  <!-- 底部注解与图注 -->
  <text x="360" y="310" font-size="14" fill="#c0392b" text-anchor="middle">试错与延迟奖励：动作的回报往往要等许多步之后才兑现</text>
  <text x="360" y="352" font-size="14" fill="#777" text-anchor="middle">智能体以动作影响环境，环境以奖励与新状态回应，如此循环往复</text>
</svg>
