<svg viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>存在之链的时间化：从静态链条到演化之树</title>
  <desc>左侧是静态存在之链（神到矿物各层同时存在），中间箭头表示 18-19 世纪的时间化过程，右侧是达尔文式的演化之树，以时间向上的分支谱系取代静态链条。</desc>
  <rect x="0" y="0" width="620" height="460" fill="#faf9f5"/>

  <text x="135" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">静态存在之链</text>
  <text x="135" y="48" text-anchor="middle" font-size="12" fill="#666">同时存在 · 无时间</text>

  <!-- chain boxes (top to bottom) -->
  <rect x="55" y="62" width="160" height="30" rx="5" fill="#1f6f8b"/>
  <text x="135" y="82" text-anchor="middle" font-size="13" fill="#faf9f5">神 · 完满</text>
  <rect x="55" y="100" width="160" height="30" rx="5" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="135" y="120" text-anchor="middle" font-size="13" fill="#333">天使</text>
  <rect x="55" y="138" width="160" height="30" rx="5" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="135" y="158" text-anchor="middle" font-size="13" fill="#333">人</text>
  <rect x="55" y="176" width="160" height="30" rx="5" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="135" y="196" text-anchor="middle" font-size="13" fill="#333">动物</text>
  <rect x="55" y="214" width="160" height="30" rx="5" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="135" y="234" text-anchor="middle" font-size="13" fill="#333">植物</text>
  <rect x="55" y="252" width="160" height="30" rx="5" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="135" y="272" text-anchor="middle" font-size="13" fill="#333">矿物</text>
  <text x="135" y="308" text-anchor="middle" font-size="12" fill="#c0392b">层级固定：一格一物</text>
  <text x="135" y="326" text-anchor="middle" font-size="12" fill="#c0392b">物种不变</text>

  <!-- transformation arrow -->
  <line x1="250" y1="180" x2="330" y2="180" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="290" y="165" text-anchor="middle" font-size="13" fill="#c0392b">时间化</text>
  <text x="290" y="205" text-anchor="middle" font-size="11" fill="#666">18—19 世纪</text>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- tree -->
  <text x="465" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">演化之树</text>
  <text x="465" y="48" text-anchor="middle" font-size="12" fill="#666">随时间分支 · 物种可变</text>

  <!-- time axis -->
  <line x1="400" y1="330" x2="400" y2="80" stroke="#666" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="388" y="95" text-anchor="middle" font-size="12" fill="#666">时间</text>
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- root -->
  <circle cx="465" cy="330" r="7" fill="#333"/>
  <text x="465" y="350" text-anchor="middle" font-size="12" fill="#333">共同祖先</text>

  <!-- first bifurcation -->
  <line x1="465" y1="330" x2="465" y2="285" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="465" y1="285" x2="420" y2="250" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="465" y1="285" x2="510" y2="250" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="420" cy="250" r="5" fill="#1f6f8b"/>
  <circle cx="510" cy="250" r="5" fill="#1f6f8b"/>

  <!-- second bifurcation on right -->
  <line x1="510" y1="250" x2="510" y2="215" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="510" y1="215" x2="465" y2="180" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="510" y1="215" x2="555" y2="180" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="465" cy="180" r="5" fill="#1f6f8b"/>
  <circle cx="555" cy="180" r="5" fill="#1f6f8b"/>

  <!-- tip labels -->
  <line x1="465" y1="180" x2="465" y2="150" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="465" y="142" text-anchor="middle" font-size="13" fill="#c0392b">人</text>
  <line x1="555" y1="180" x2="555" y2="150" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="555" y="142" text-anchor="middle" font-size="13" fill="#333">黑猩猩</text>
  <line x1="420" y1="250" x2="420" y2="220" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="420" y="212" text-anchor="middle" font-size="13" fill="#333">斑马</text>
  <line x1="400" y1="330" x2="530" y2="330" stroke="none" stroke-width="0"/>

  <text x="465" y="382" text-anchor="middle" font-size="12" fill="#666">分支 = 新物种</text>
  <text x="465" y="400" text-anchor="middle" font-size="12" fill="#666">人只是其中一支</text>
  <text x="465" y="418" text-anchor="middle" font-size="12" fill="#c0392b">链条 → 树谱（Lovejoy 主线）</text>
</svg>
