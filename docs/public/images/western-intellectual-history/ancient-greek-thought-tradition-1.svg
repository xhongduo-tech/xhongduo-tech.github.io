<svg viewBox="0 0 520 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>存在之链示意图</title>
  <desc>从最高存在（神、太一）经天使、人、动物、植物到矿物的静态等级序列，标注充足律与完满性递减。</desc>
  <rect x="0" y="0" width="520" height="620" fill="#faf9f5"/>
  <text x="260" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">存在之链（The Great Chain of Being）</text>
  <text x="260" y="60" text-anchor="middle" font-size="13" fill="#1f6f8b">静态等级：从上到下，完满性与实在性递减</text>

  <!-- God -->
  <rect x="130" y="80" width="260" height="46" rx="6" fill="#1f6f8b"/>
  <text x="260" y="108" text-anchor="middle" font-size="15" fill="#faf9f5">神 · 太一（最高完满）</text>
  <text x="430" y="103" font-size="13" fill="#333">完满</text>
  <text x="430" y="119" font-size="13" fill="#333">至极</text>

  <!-- Angels -->
  <rect x="130" y="146" width="260" height="46" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="260" y="174" text-anchor="middle" font-size="15" fill="#333">天使 · 纯灵（纯粹理智）</text>

  <!-- Humans -->
  <rect x="130" y="212" width="260" height="46" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="260" y="234" text-anchor="middle" font-size="15" fill="#333">人（理智 + 欲望）</text>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#666">自由意志的居所</text>

  <!-- Animals -->
  <rect x="130" y="278" width="260" height="46" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="260" y="300" text-anchor="middle" font-size="15" fill="#333">动物（感觉与运动）</text>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#666">被欲望驱动</text>

  <!-- Plants -->
  <rect x="130" y="344" width="260" height="46" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="260" y="372" text-anchor="middle" font-size="15" fill="#333">植物（生长与营养）</text>

  <!-- Minerals -->
  <rect x="130" y="410" width="260" height="46" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="260" y="438" text-anchor="middle" font-size="15" fill="#333">矿物 · 质料（单纯存在）</text>
  <text x="430" y="425" font-size="13" fill="#c0392b">实在性</text>
  <text x="430" y="441" font-size="13" fill="#c0392b">最低</text>

  <!-- descending arrow -->
  <line x1="405" y1="130" x2="405" y2="435" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Plenitude note -->
  <text x="260" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">充足律</text>
  <text x="260" y="516" text-anchor="middle" font-size="13" fill="#333">凡是可能存在的，都必然现实地存在</text>
  <text x="260" y="536" text-anchor="middle" font-size="13" fill="#333">—— 宇宙不允许「空缺」，每一格都被填满</text>

  <text x="260" y="578" text-anchor="middle" font-size="12" fill="#666">每一格都在「更像神」与「偏离神」的梯度上占一个位置</text>
  <text x="260" y="598" text-anchor="middle" font-size="12" fill="#666">人是链条的中点：向上有天使，向下有动物</text>
</svg>
