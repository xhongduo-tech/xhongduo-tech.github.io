<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QPSK 与 16QAM 星座图</title>
  <desc id="desc">左图为 QPSK 四点星座，位于正方形四角；右图为 16QAM 的 4×4 点阵星座。星座点间距越大抗噪越强。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <text x="160" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">QPSK（2 bit/符号）</text>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">16QAM（4 bit/符号）</text>

  <!-- QPSK panel -->
  <line x1="160" y1="50" x2="160" y2="310" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="180" x2="280" y2="180" stroke="#999" stroke-width="1"/>
  <text x="286" y="184" font-family="sans-serif" font-size="13" fill="#666">I</text>
  <text x="168" y="46" font-family="sans-serif" font-size="13" fill="#666">Q</text>
  <g stroke="#999" stroke-dasharray="4,4" stroke-width="1">
    <line x1="160" y1="110" x2="280" y2="110"/>
    <line x1="160" y1="250" x2="280" y2="250"/>
    <line x1="90" y1="180" x2="90" y2="310"/>
    <line x1="230" y1="180" x2="230" y2="310"/>
  </g>
  <circle cx="90" cy="110" r="5" fill="#1f6f8b"/>
  <circle cx="230" cy="110" r="5" fill="#1f6f8b"/>
  <circle cx="90" cy="250" r="5" fill="#1f6f8b"/>
  <circle cx="230" cy="250" r="5" fill="#1f6f8b"/>
  <text x="90" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">00</text>
  <text x="230" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">01</text>
  <text x="90" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">10</text>
  <text x="230" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">11</text>
  <text x="160" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">相邻点相位差 90°，Gray 映射只错 1 bit</text>

  <!-- 16QAM panel -->
  <line x1="480" y1="50" x2="480" y2="310" stroke="#999" stroke-width="1"/>
  <line x1="360" y1="180" x2="600" y2="180" stroke="#999" stroke-width="1"/>
  <text x="606" y="184" font-family="sans-serif" font-size="13" fill="#666">I</text>
  <text x="488" y="46" font-family="sans-serif" font-size="13" fill="#666">Q</text>
  <g fill="#c0392b">
    <circle cx="412.5" cy="112.5" r="4"/><circle cx="457.5" cy="112.5" r="4"/><circle cx="502.5" cy="112.5" r="4"/><circle cx="547.5" cy="112.5" r="4"/>
    <circle cx="412.5" cy="157.5" r="4"/><circle cx="457.5" cy="157.5" r="4"/><circle cx="502.5" cy="157.5" r="4"/><circle cx="547.5" cy="157.5" r="4"/>
    <circle cx="412.5" cy="202.5" r="4"/><circle cx="457.5" cy="202.5" r="4"/><circle cx="502.5" cy="202.5" r="4"/><circle cx="547.5" cy="202.5" r="4"/>
    <circle cx="412.5" cy="247.5" r="4"/><circle cx="457.5" cy="247.5" r="4"/><circle cx="502.5" cy="247.5" r="4"/><circle cx="547.5" cy="247.5" r="4"/>
  </g>
  <text x="480" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">点距更小 → 抗噪更弱，频谱效率更高</text>
</svg>
