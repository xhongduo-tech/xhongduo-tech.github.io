<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>隐马尔可夫模型的生成故事</title>
<desc>词性标注的隐马尔可夫模型：顶层为隐藏的马尔可夫链（词性标记），每步生成底层的可观察词。</desc>
<rect width="760" height="260" fill="#faf9f5"/>
<line x1="40" y1="80" x2="720" y2="80" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="40" y1="190" x2="720" y2="190" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="30" y="48" font-size="15" fill="#333" font-weight="bold">隐藏状态：词性序列（马尔可夫链）</text>
<text x="30" y="220" font-size="15" fill="#333" font-weight="bold">可观察输出：词序列</text>
<ellipse cx="110" cy="80" rx="52" ry="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="110" y="85" text-anchor="middle" font-size="14" fill="#333">PRO</text>
<ellipse cx="290" cy="80" rx="52" ry="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="290" y="85" text-anchor="middle" font-size="14" fill="#333">VERB</text>
<ellipse cx="470" cy="80" rx="52" ry="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="470" y="85" text-anchor="middle" font-size="14" fill="#333">DET</text>
<ellipse cx="640" cy="80" rx="52" ry="24" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="640" y="85" text-anchor="middle" font-size="14" fill="#333">NOUN</text>
<line x1="162" y1="80" x2="238" y2="80" stroke="#333" stroke-width="1.5"/>
<text x="200" y="70" text-anchor="middle" font-size="14" fill="#c0392b">A[VERB|PRO]</text>
<line x1="342" y1="80" x2="418" y2="80" stroke="#333" stroke-width="1.5"/>
<text x="380" y="70" text-anchor="middle" font-size="14" fill="#c0392b">A[DET|VERB]</text>
<line x1="522" y1="80" x2="588" y2="80" stroke="#333" stroke-width="1.5"/>
<text x="555" y="70" text-anchor="middle" font-size="14" fill="#c0392b">A[NOUN|DET]</text>
<line x1="110" y1="104" x2="110" y2="166" stroke="#c0392b" stroke-width="1.5"/>
<text x="120" y="140" font-size="14" fill="#c0392b">B[I|PRO]</text>
<line x1="290" y1="104" x2="290" y2="166" stroke="#c0392b" stroke-width="1.5"/>
<text x="300" y="140" font-size="14" fill="#c0392b">B[eat|VERB]</text>
<line x1="470" y1="104" x2="470" y2="166" stroke="#c0392b" stroke-width="1.5"/>
<text x="480" y="140" font-size="14" fill="#c0392b">B[a|DET]</text>
<line x1="640" y1="104" x2="640" y2="166" stroke="#c0392b" stroke-width="1.5"/>
<text x="652" y="140" font-size="14" fill="#c0392b">B[banana|NOUN]</text>
<rect x="40" y="166" width="140" height="24" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="110" y="183" text-anchor="middle" font-size="14" fill="#333">I</text>
<rect x="220" y="166" width="140" height="24" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="290" y="183" text-anchor="middle" font-size="14" fill="#333">eat</text>
<rect x="400" y="166" width="140" height="24" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="470" y="183" text-anchor="middle" font-size="14" fill="#333">a</text>
<rect x="580" y="166" width="140" height="24" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="650" y="183" text-anchor="middle" font-size="14" fill="#333">banana</text>
</svg>
