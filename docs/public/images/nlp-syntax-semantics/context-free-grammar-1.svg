<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>上下文无关文法的句法树</title>
<desc>句子 The dog chased the cat 的短语结构树：S 分为 NP 与 VP，NP 和 VP 内部再逐层分解。</desc>
<rect width="640" height="280" fill="#faf9f5"/>
<line x1="320" y1="30" x2="170" y2="90" stroke="#333" stroke-width="1.5"/>
<line x1="320" y1="30" x2="470" y2="90" stroke="#333" stroke-width="1.5"/>
<text x="320" y="22" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">S</text>
<line x1="170" y1="90" x2="80" y2="150" stroke="#333" stroke-width="1.5"/>
<line x1="170" y1="90" x2="260" y2="150" stroke="#333" stroke-width="1.5"/>
<text x="170" y="82" text-anchor="middle" font-size="14" fill="#c0392b">NP</text>
<line x1="80" y1="150" x2="40" y2="210" stroke="#333" stroke-width="1.5"/>
<line x1="80" y1="150" x2="120" y2="210" stroke="#333" stroke-width="1.5"/>
<text x="80" y="142" text-anchor="middle" font-size="13" fill="#1f6f8b">DT</text>
<text x="40" y="205" text-anchor="middle" font-size="14" fill="#333">The</text>
<text x="120" y="205" text-anchor="middle" font-size="14" fill="#333">dog</text>
<line x1="260" y1="150" x2="230" y2="210" stroke="#333" stroke-width="1.5"/>
<text x="260" y="142" text-anchor="middle" font-size="13" fill="#1f6f8b">NN</text>
<line x1="470" y1="90" x2="400" y2="150" stroke="#333" stroke-width="1.5"/>
<line x1="470" y1="90" x2="560" y2="150" stroke="#333" stroke-width="1.5"/>
<text x="470" y="82" text-anchor="middle" font-size="14" fill="#c0392b">VP</text>
<line x1="400" y1="150" x2="365" y2="210" stroke="#333" stroke-width="1.5"/>
<text x="400" y="142" text-anchor="middle" font-size="13" fill="#1f6f8b">VBD</text>
<text x="365" y="205" text-anchor="middle" font-size="14" fill="#333">chased</text>
<line x1="560" y1="150" x2="500" y2="210" stroke="#333" stroke-width="1.5"/>
<line x1="560" y1="150" x2="620" y2="210" stroke="#333" stroke-width="1.5"/>
<text x="560" y="142" text-anchor="middle" font-size="13" fill="#c0392b">NP</text>
<line x1="500" y1="210" x2="480" y2="258" stroke="#333" stroke-width="1.5"/>
<line x1="500" y1="210" x2="520" y2="258" stroke="#333" stroke-width="1.5"/>
<text x="500" y="202" text-anchor="middle" font-size="13" fill="#1f6f8b">DT</text>
<text x="480" y="253" text-anchor="middle" font-size="14" fill="#333">the</text>
<text x="520" y="253" text-anchor="middle" font-size="14" fill="#333">cat</text>
<line x1="620" y1="210" x2="600" y2="258" stroke="#333" stroke-width="1.5"/>
<text x="620" y="202" text-anchor="middle" font-size="13" fill="#1f6f8b">NN</text>
</svg>
