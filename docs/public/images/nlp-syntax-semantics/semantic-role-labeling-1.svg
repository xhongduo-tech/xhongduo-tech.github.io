<svg viewBox="0 0 720 190" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>语义角色标注示例</title>
<desc>句子 I ate the sushi with chopsticks 的语义角色标注：谓词 ate，论元 ARG0 为 I，ARG1 为 the sushi，附加语 AM-INS 为 with chopsticks。</desc>
<rect width="720" height="190" fill="#faf9f5"/>
<rect x="45" y="40" width="100" height="28" rx="6" fill="#eaf3f7" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="95" y="59" text-anchor="middle" font-size="14" fill="#1f6f8b">ARG0（施事）</text>
<rect x="265" y="40" width="220" height="28" rx="6" fill="#fdf0e9" stroke="#c0392b" stroke-width="1.5"/>
<text x="375" y="59" text-anchor="middle" font-size="14" fill="#c0392b">ARG1（受事）</text>
<rect x="500" y="40" width="205" height="28" rx="6" fill="#eef0e4" stroke="#7a7f2c" stroke-width="1.5"/>
<text x="602" y="59" text-anchor="middle" font-size="14" fill="#7a7f2c">AM-INS（工具）</text>
<line x1="85" y1="68" x2="85" y2="120" stroke="#1f6f8b" stroke-width="1.5"/>
<line x1="375" y1="68" x2="375" y2="120" stroke="#c0392b" stroke-width="1.5"/>
<line x1="602" y1="68" x2="602" y2="120" stroke="#7a7f2c" stroke-width="1.5"/>
<text x="95" y="150" text-anchor="middle" font-size="15" fill="#333">I</text>
<text x="200" y="150" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">ate</text>
<text x="200" y="175" text-anchor="middle" font-size="13" fill="#c0392b">谓词</text>
<text x="320" y="150" text-anchor="middle" font-size="15" fill="#333">the</text>
<text x="430" y="150" text-anchor="middle" font-size="15" fill="#333">sushi</text>
<text x="552" y="150" text-anchor="middle" font-size="15" fill="#333">with</text>
<text x="660" y="150" text-anchor="middle" font-size="15" fill="#333">chopsticks</text>
</svg>
