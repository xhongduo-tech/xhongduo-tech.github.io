<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>依存句法树示例</title>
<desc>句子「我用筷子吃面」的依存树：核心动词「吃」为根，通过 nsubj、obl、obj、case 等依存关系连接各词。</desc>
<rect width="720" height="250" fill="#faf9f5"/>
<path d="M 500 210 Q 290 40 80 210" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="290" y="22" text-anchor="middle" font-size="14" fill="#c0392b">nsubj</text>
<path d="M 500 210 Q 430 100 360 210" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="430" y="84" text-anchor="middle" font-size="14" fill="#1f6f8b">obl</text>
<path d="M 500 210 Q 570 120 640 210" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="570" y="104" text-anchor="middle" font-size="14" fill="#1f6f8b">obj</text>
<path d="M 360 210 Q 290 140 220 210" fill="none" stroke="#666" stroke-width="1.5"/>
<text x="290" y="124" text-anchor="middle" font-size="14" fill="#666">case</text>
<circle cx="500" cy="210" r="3" fill="#c0392b"/>
<text x="500" y="234" text-anchor="middle" font-size="13" fill="#c0392b">root</text>
<text x="80" y="198" text-anchor="middle" font-size="16" fill="#333">我</text>
<text x="220" y="198" text-anchor="middle" font-size="16" fill="#333">用</text>
<text x="360" y="198" text-anchor="middle" font-size="16" fill="#333">筷子</text>
<text x="500" y="198" text-anchor="middle" font-size="16" fill="#333">吃</text>
<text x="640" y="198" text-anchor="middle" font-size="16" fill="#333">面</text>
</svg>
