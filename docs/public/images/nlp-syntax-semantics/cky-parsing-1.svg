<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>CKY 算法填充的图表</title>
<desc>句子 the dog chased the cat 的 CKY 三角图表，单元格[i,j]存放下标 i 到 j 的词串可推导出的所有非终结符。</desc>
<rect width="560" height="300" fill="#faf9f5"/>
<g fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5">
<rect x="60" y="20" width="80" height="42"/>
<rect x="150" y="20" width="80" height="42"/>
<rect x="420" y="20" width="80" height="42"/>
<rect x="150" y="70" width="80" height="42"/>
<rect x="240" y="120" width="80" height="42"/>
<rect x="420" y="120" width="80" height="42"/>
<rect x="330" y="170" width="80" height="42"/>
<rect x="420" y="170" width="80" height="42"/>
<rect x="420" y="220" width="80" height="42"/>
</g>
<g fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3 3">
<rect x="240" y="20" width="80" height="42"/>
<rect x="330" y="20" width="80" height="42"/>
<rect x="60" y="70" width="80" height="42"/>
<rect x="240" y="70" width="80" height="42"/>
<rect x="330" y="70" width="80" height="42"/>
<rect x="420" y="70" width="80" height="42"/>
<rect x="60" y="120" width="80" height="42"/>
<rect x="150" y="120" width="80" height="42"/>
<rect x="330" y="120" width="80" height="42"/>
<rect x="60" y="170" width="80" height="42"/>
<rect x="150" y="170" width="80" height="42"/>
<rect x="240" y="170" width="80" height="42"/>
<rect x="60" y="220" width="80" height="42"/>
<rect x="150" y="220" width="80" height="42"/>
<rect x="240" y="220" width="80" height="42"/>
<rect x="330" y="220" width="80" height="42"/>
</g>
<text x="100" y="46" text-anchor="middle" font-size="14" fill="#333">DT</text>
<text x="190" y="46" text-anchor="middle" font-size="14" fill="#333">NP</text>
<text x="460" y="46" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">S</text>
<text x="190" y="96" text-anchor="middle" font-size="14" fill="#333">NN</text>
<text x="280" y="146" text-anchor="middle" font-size="14" fill="#333">VBD</text>
<text x="460" y="146" text-anchor="middle" font-size="14" fill="#333">VP</text>
<text x="370" y="196" text-anchor="middle" font-size="14" fill="#333">DT</text>
<text x="460" y="196" text-anchor="middle" font-size="14" fill="#333">NP</text>
<text x="460" y="246" text-anchor="middle" font-size="14" fill="#333">NN</text>
<text x="100" y="285" text-anchor="middle" font-size="13" fill="#666">the</text>
<text x="190" y="285" text-anchor="middle" font-size="13" fill="#666">dog</text>
<text x="280" y="285" text-anchor="middle" font-size="13" fill="#666">chased</text>
<text x="370" y="285" text-anchor="middle" font-size="13" fill="#666">the</text>
<text x="460" y="285" text-anchor="middle" font-size="13" fill="#666">cat</text>
<text x="8" y="45" font-size="12" fill="#666">i=0</text>
<text x="8" y="95" font-size="12" fill="#666">i=1</text>
<text x="8" y="145" font-size="12" fill="#666">i=2</text>
<text x="8" y="195" font-size="12" fill="#666">i=3</text>
<text x="8" y="245" font-size="12" fill="#666">i=4</text>
</svg>
