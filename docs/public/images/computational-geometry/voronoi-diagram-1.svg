<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif">
  <title>Voronoi 图及其 Delaunay 对偶</title>
  <desc>五个站点把平面切成五个 Voronoi 单元，虚线为 Delaunay 三角剖分边，红色虚圆是满足空圆性质的三角形外接圆，其圆心恰为 Voronoi 顶点。</desc>
  <rect x="0" y="0" width="640" height="560" fill="#faf9f5"/>
  <rect x="60" y="95" width="520" height="405" fill="none" stroke="#ddd" stroke-width="1"/>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="150" y1="210" x2="450" y2="210"/>
    <line x1="150" y1="210" x2="150" y2="410"/>
    <line x1="150" y1="210" x2="300" y2="310"/>
    <line x1="450" y1="210" x2="450" y2="410"/>
    <line x1="450" y1="210" x2="300" y2="310"/>
    <line x1="150" y1="410" x2="450" y2="410"/>
    <line x1="150" y1="410" x2="300" y2="310"/>
    <line x1="450" y1="410" x2="300" y2="310"/>
  </g>
  <circle cx="191.7" cy="310" r="108.3" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#1f6f8b" stroke-width="2.5" fill="none">
    <line x1="300" y1="100" x2="300" y2="147.5"/>
    <line x1="191.7" y1="310" x2="300" y2="147.5"/>
    <line x1="300" y1="147.5" x2="408.3" y2="310"/>
    <line x1="60" y1="310" x2="191.7" y2="310"/>
    <line x1="408.3" y1="310" x2="580" y2="310"/>
    <line x1="408.3" y1="310" x2="300" y2="472.5"/>
    <line x1="300" y1="472.5" x2="191.7" y2="310"/>
    <line x1="300" y1="472.5" x2="300" y2="500"/>
  </g>
  <g fill="#c0392b">
    <circle cx="150" cy="210" r="6"/>
    <circle cx="450" cy="210" r="6"/>
    <circle cx="150" cy="410" r="6"/>
    <circle cx="450" cy="410" r="6"/>
    <circle cx="300" cy="310" r="6"/>
  </g>
  <g fill="#333" font-size="15">
    <text x="132" y="196">P1</text>
    <text x="466" y="196">P2</text>
    <text x="132" y="428">P3</text>
    <text x="466" y="428">P4</text>
    <text x="298" y="296">P5</text>
  </g>
  <text x="191.7" y="332" fill="#c0392b" font-size="14" text-anchor="middle">空圆</text>
  <text x="191.7" y="350" fill="#c0392b" font-size="13" text-anchor="middle">（外接圆内无其他点）</text>
  <g font-size="14" fill="#333">
    <line x1="60" y1="28" x2="100" y2="28" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="108" y="33">Voronoi 边（垂直平分线）</text>
    <line x1="60" y1="52" x2="100" y2="52" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="108" y="57">Delaunay 边</text>
    <circle cx="80" cy="76" r="5" fill="#c0392b"/>
    <text x="108" y="81">站点（输入点）</text>
    <line x1="60" y1="100" x2="100" y2="100" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="108" y="105">空圆（Delaunay 三角形外接圆，圆心即 Voronoi 顶点）</text>
  </g>
</svg>
