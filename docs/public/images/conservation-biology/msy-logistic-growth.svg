<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <title>最大可持续产量与逻辑斯蒂增长</title>
  <desc>横轴为种群大小 N（0 到环境容纳量 K），纵轴为种群增长速率 dN/dt。增长速率随 N 先升后降，在 N = K/2 处达到最大值 rK/4，即最大可持续产量 MSY。</desc>
  <rect width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">逻辑斯蒂增长下的最大可持续产量（MSY）</text>

  <line x1="80" y1="340" x2="600" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <text x="560" y="362" font-size="15" fill="#333" text-anchor="end">种群大小 N</text>
  <text x="72" y="70" font-size="15" fill="#333">增长速率 dN/dt</text>

  <path d="M 80 340 L 128 239 L 176 161 L 224 105 L 272 71 L 320 60 L 368 71 L 416 105 L 464 161 L 512 239 L 560 340 Z" fill="#c0392b" fill-opacity="0.12" stroke="none"/>
  <path d="M 80 340 L 128 239 L 176 161 L 224 105 L 272 71 L 320 60 L 368 71 L 416 105 L 464 161 L 512 239 L 560 340" fill="none" stroke="#c0392b" stroke-width="4"/>

  <line x1="320" y1="60" x2="320" y2="340" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="378" font-size="14" fill="#333" text-anchor="middle">K/2（半容量）</text>
  <line x1="560" y1="340" x2="560" y2="60" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="560" y="378" font-size="14" fill="#333" text-anchor="middle">K（环境容纳量）</text>

  <circle cx="320" cy="60" r="6" fill="#333"/>
  <text x="320" y="44" font-size="14" fill="#333" text-anchor="middle">MSY = rK/4</text>

  <text x="150" y="180" font-size="14" fill="#1f6f8b" text-anchor="middle">N &lt; K/2：增长快，可多采收</text>
  <text x="470" y="180" font-size="14" fill="#1f6f8b" text-anchor="middle">N &gt; K/2：增长慢，须限量</text>

  <text x="130" y="418" font-size="13" fill="#666">教训：把种群压到 K/2 以下太多，增长骤降甚至转为负，过度捕捞由此引发崩溃。</text>
</svg>
