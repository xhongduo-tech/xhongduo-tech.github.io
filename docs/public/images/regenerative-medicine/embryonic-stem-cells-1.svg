<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="sans-serif">
<title>胚胎干细胞（ESC）的分离与建系流程</title>
<desc>从左到右三幅示意：囊胚的内细胞团、内细胞团置于饲养层上培养、形成 ES 细胞克隆。</desc>
<rect x="0" y="0" width="800" height="340" fill="#faf9f5"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">胚胎干细胞（ESC）的分离与建系流程</text>

<g>
<circle cx="120" cy="190" r="92" fill="#1f6f8b" fill-opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
<ellipse cx="92" cy="160" rx="46" ry="34" fill="#c0392b" fill-opacity="0.55" stroke="#c0392b" stroke-width="2"/>
<text x="120" y="300" text-anchor="middle" font-size="14" fill="#333">① 囊胚</text>
<text x="120" y="320" text-anchor="middle" font-size="13" fill="#333">受精后约第 5–6 天</text>
<text x="52" y="150" font-size="13" fill="#c0392b">内细胞团（ICM）</text>
<text x="185" y="200" font-size="13" fill="#1f6f8b">滋养层</text>
<text x="195" y="222" font-size="13" fill="#1f6f8b">胚泡腔</text>
</g>

<path d="M 232 190 L 292 190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

<g>
<rect x="300" y="110" width="170" height="150" fill="#1f6f8b" fill-opacity="0.1" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="300" y="236" width="170" height="24" fill="#8a8a8a" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<circle cx="335" cy="200" r="14" fill="#c0392b" fill-opacity="0.7"/>
<circle cx="365" cy="188" r="14" fill="#c0392b" fill-opacity="0.7"/>
<circle cx="395" cy="204" r="14" fill="#c0392b" fill-opacity="0.7"/>
<circle cx="428" cy="190" r="14" fill="#c0392b" fill-opacity="0.7"/>
<circle cx="365" cy="214" r="14" fill="#c0392b" fill-opacity="0.7"/>
<text x="385" y="288" text-anchor="middle" font-size="14" fill="#333">② ICM 移入培养皿</text>
<text x="385" y="308" text-anchor="middle" font-size="13" fill="#333">置于饲养层细胞上</text>
<text x="385" y="96" text-anchor="middle" font-size="13" fill="#666">培养皿</text>
<text x="408" y="250" font-size="12" fill="#666">饲养层</text>
</g>

<path d="M 492 190 L 552 190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

<g>
<circle cx="620" cy="170" r="52" fill="#c0392b" fill-opacity="0.35" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="608" cy="150" r="9" fill="#c0392b" fill-opacity="0.8"/>
<circle cx="636" cy="160" r="9" fill="#c0392b" fill-opacity="0.8"/>
<circle cx="620" cy="188" r="9" fill="#c0392b" fill-opacity="0.8"/>
<circle cx="646" cy="182" r="9" fill="#c0392b" fill-opacity="0.8"/>
<circle cx="596" cy="178" r="9" fill="#c0392b" fill-opacity="0.8"/>
<text x="620" y="280" text-anchor="middle" font-size="14" fill="#333">③ 克隆化传代</text>
<text x="620" y="300" text-anchor="middle" font-size="13" fill="#333">ES 细胞克隆（多能）</text>
<text x="620" y="118" text-anchor="middle" font-size="13" fill="#c0392b">Oct4 · Sox2 · Nanog</text>
</g>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
</marker>
</defs>
</svg>
