<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>探地雷达双曲线反射原理</title>
  <desc>探地雷达天线沿地面移动时，埋地管道在雷达剖面上形成开口向下的双曲线反射同相轴。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- ground surface -->
  <line x1="40" y1="70" x2="600" y2="70" stroke="#333" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" font-size="14" fill="#333">地面</text>
  <!-- antenna -->
  <rect x="296" y="38" width="48" height="24" rx="3" fill="#1f6f8b"/>
  <text x="320" y="34" text-anchor="middle" font-size="13" fill="#333">雷达天线</text>
  <!-- soil texture hint -->
  <g stroke="#d8d2c8" stroke-width="1">
    <line x1="80" y1="120" x2="150" y2="120"/>
    <line x1="420" y1="150" x2="490" y2="150"/>
    <line x1="180" y1="230" x2="260" y2="230"/>
    <line x1="420" y1="280" x2="520" y2="280"/>
  </g>
  <!-- hyperbola (left arm) -->
  <path d="M320 170 C 285 175 255 220 228 300 C 215 345 205 365 195 385"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- hyperbola (right arm) -->
  <path d="M320 170 C 355 175 385 220 412 300 C 425 345 435 365 445 385"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- apex marker -->
  <circle cx="320" cy="172" r="3" fill="#c0392b"/>
  <!-- buried pipe -->
  <circle cx="320" cy="300" r="12" fill="#c0392b"/>
  <circle cx="320" cy="300" r="5" fill="#faf9f5"/>
  <text x="356" y="305" font-size="13" fill="#333">埋地管道</text>
  <!-- dashed vertical from antenna to apex -->
  <line x1="320" y1="74" x2="320" y2="172" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- layer boundary -->
  <line x1="40" y1="360" x2="600" y2="360" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="380" font-size="13" fill="#666">第二界面（弱反射）</text>
  <!-- arrow labels -->
  <text x="60" y="250" font-size="13" fill="#1f6f8b">双曲线反射同相轴</text>
  <text x="60" y="266" font-size="13" fill="#666">（管道回波）</text>
  <text x="470" y="120" font-size="13" fill="#666">时间 ↑ = 深度 ↑</text>
  <text x="470" y="136" font-size="13" fill="#666">（纵轴向下为加深）</text>
  <text x="500" y="330" font-size="13" fill="#666">直达波/空气波</text>
  <line x1="430" y1="326" x2="330" y2="326" stroke="#666" stroke-width="1" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
