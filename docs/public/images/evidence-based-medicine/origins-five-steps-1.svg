<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>循证医学三要素</title>
<desc>三个相交圆分别代表最佳研究证据、临床经验与技能、患者价值观与偏好，三者交汇处为循证决策</desc>
<rect width="400" height="300" fill="#faf9f5"/>
<circle cx="140" cy="125" r="88" fill="#1f6f8b" fill-opacity="0.22" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="260" cy="125" r="88" fill="#c0392b" fill-opacity="0.20" stroke="#c0392b" stroke-width="2"/>
<circle cx="200" cy="205" r="88" fill="#2c7a3f" fill-opacity="0.20" stroke="#2c7a3f" stroke-width="2"/>
<text x="118" y="42" text-anchor="middle" font-size="14" fill="#333">最佳研究证据</text>
<text x="282" y="42" text-anchor="middle" font-size="14" fill="#333">临床经验与技能</text>
<text x="200" y="288" text-anchor="middle" font-size="14" fill="#333">患者价值观与偏好</text>
<text x="200" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">循证决策</text>
</svg>
