<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">认知科学六大学科交叉结构图</title>
  <desc id="desc">认知科学的六大学科交叉结构图。中央青色圆为认知科学，标注「心智 · 表征 · 计算」；周围按六边形排列六大学科节点：上方心理学（行为 · 心理过程）、右上神经科学（脑与神经机制）、右下计算机科学（计算 · 智能）、下方人类学（文化 · 进化）、左下语言学（语言的结构）、左上哲学（心身问题 · 知识）。六节点彼此以细线相连成环，并各自以直线连向中央圆心，表示六大学科共同交汇于认知科学。</desc>

  <rect x="0" y="0" width="720" height="540" fill="#faf9f5"/>

  <!-- 六大学科之间的外围连接（六边形环） -->
  <polygon points="360,112 497,191 497,349 360,428 223,349 223,191"
           fill="none" stroke="#9a907d" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 各学科到中央圆心的辐条连线 -->
  <g stroke="#9a907d" stroke-width="1.6">
    <line x1="360" y1="144" x2="360" y2="210"/>
    <line x1="455" y1="217" x2="418" y2="240"/>
    <line x1="455" y1="323" x2="418" y2="300"/>
    <line x1="360" y1="396" x2="360" y2="330"/>
    <line x1="265" y1="323" x2="302" y2="300"/>
    <line x1="265" y1="217" x2="302" y2="240"/>
  </g>

  <!-- 六大学科节点（圆角矩形 + 名称 + 关键词） -->
  <g>
    <rect x="296" y="81"  width="128" height="62" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <text x="360" y="101" font-size="15" fill="#333" text-anchor="middle">心理学</text>
    <text x="360" y="121" font-size="13" fill="#777" text-anchor="middle">行为 · 心理过程</text>

    <rect x="433" y="160" width="128" height="62" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.6"/>
    <text x="497" y="180" font-size="15" fill="#1f6f8b" text-anchor="middle">神经科学</text>
    <text x="497" y="200" font-size="13" fill="#777" text-anchor="middle">脑与神经机制</text>

    <rect x="433" y="318" width="128" height="62" rx="10" fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.6"/>
    <text x="497" y="338" font-size="15" fill="#1f6f8b" text-anchor="middle">计算机科学</text>
    <text x="497" y="358" font-size="13" fill="#777" text-anchor="middle">计算 · 智能</text>

    <rect x="296" y="397" width="128" height="62" rx="10" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
    <text x="360" y="417" font-size="15" fill="#333" text-anchor="middle">人类学</text>
    <text x="360" y="437" font-size="13" fill="#777" text-anchor="middle">文化 · 进化</text>

    <rect x="159" y="318" width="128" height="62" rx="10" fill="#faf9f5" stroke="#c0392b" stroke-width="1.6"/>
    <text x="223" y="338" font-size="15" fill="#c0392b" text-anchor="middle">语言学</text>
    <text x="223" y="358" font-size="13" fill="#777" text-anchor="middle">语言的结构</text>

    <rect x="159" y="160" width="128" height="62" rx="10" fill="#faf9f5" stroke="#c0392b" stroke-width="1.6"/>
    <text x="223" y="180" font-size="15" fill="#c0392b" text-anchor="middle">哲学</text>
    <text x="223" y="200" font-size="13" fill="#777" text-anchor="middle">心身问题 · 知识</text>
  </g>

  <!-- 中央：认知科学核心 -->
  <circle cx="360" cy="270" r="80" fill="#1f6f8b"/>
  <circle cx="360" cy="270" r="80" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="360" y="262" font-size="20" fill="#fff" text-anchor="middle">认知科学</text>
  <text x="360" y="290" font-size="14" fill="#eaf2f5" text-anchor="middle">心智 · 表征 · 计算</text>

  <!-- 图注 -->
  <text x="360" y="518" font-size="13" fill="#777" text-anchor="middle">六大学科交叉于「心智」这一共同研究对象，构成认知科学</text>
</svg>
