<svg viewBox="0 0 480 300" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <title>动作电位波形图</title>
  <desc>神经元的膜电位随时间变化：静息电位约 -70 mV，阈电位约 -55 mV，去极化上升至约 +40 mV，随后复极化并出现约 -90 mV 的后超极化，再回到静息电位。</desc>
  <rect x="0" y="0" width="480" height="300" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333">
    <text x="240" y="24" text-anchor="middle" font-size="16" font-weight="bold">动作电位波形</text>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="50" y1="20" x2="50" y2="260"/>
    <line x1="50" y1="260" x2="460" y2="260"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4">
    <line x1="50" y1="193" x2="450" y2="193"/>
  </g>
  <g stroke="#999" stroke-width="1" stroke-dasharray="3,4">
    <line x1="50" y1="215" x2="450" y2="215"/>
    <line x1="50" y1="50" x2="450" y2="50"/>
    <line x1="50" y1="245" x2="450" y2="245"/>
  </g>
  <path d="M 50 215 L 88 215 L 98 203 L 108 150 L 116 78 L 124 50 L 132 70 L 148 138 L 168 198 L 188 238 L 210 243 L 232 237 L 260 222 L 290 215 L 450 215"
        fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="sans-serif" fill="#333" font-size="13">
    <text x="40" y="53" text-anchor="end">+40 mV</text>
    <text x="40" y="219" text-anchor="end">-70 mV</text>
    <text x="40" y="249" text-anchor="end">-90 mV</text>
    <text x="456" y="197" text-anchor="end">阈电位 -55 mV</text>
    <text x="66" y="238" text-anchor="start">0</text>
    <text x="146" y="238" text-anchor="start">1 ms</text>
    <text x="226" y="238" text-anchor="start">2 ms</text>
    <text x="306" y="238" text-anchor="start">3 ms</text>
    <text x="386" y="238" text-anchor="start">4 ms</text>
  </g>
  <g font-family="sans-serif" font-size="14">
    <text x="112" y="66" fill="#1f6f8b" font-weight="bold">去极化（Na⁺ 内流）</text>
    <text x="182" y="160" fill="#1f6f8b" font-weight="bold">复极化（K⁺ 外流）</text>
    <text x="212" y="262" fill="#333">后超极化</text>
    <text x="330" y="230" fill="#333">静息电位</text>
  </g>
  <g font-family="sans-serif" fill="#c0392b" font-size="13">
    <text x="128" y="202" text-anchor="end">刺激</text>
    <line x1="130" y1="205" x2="94" y2="215" stroke="#c0392b" stroke-width="1.2"/>
  </g>
</svg>
