<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
<title>液压挖掘机主要系统构成示意</title>
<desc>一台履带式液压挖掘机的发动机、液压泵、控制阀、液压缸、回转机构与行走系统的能量传递关系</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">液压挖掘机主要系统能量流示意</text>
<!-- 发动机 -->
<rect x="60" y="80" width="120" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="120" y="106" text-anchor="middle" font-size="14" fill="#333">发动机</text>
<text x="120" y="126" text-anchor="middle" font-size="13" fill="#666">机械能输出</text>
<!-- 液压泵 -->
<rect x="60" y="200" width="120" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="120" y="226" text-anchor="middle" font-size="14" fill="#333">液压泵</text>
<text x="120" y="246" text-anchor="middle" font-size="13" fill="#666">机械能→液压能</text>
<!-- 箭头 发动机→泵 -->
<line x1="120" y1="140" x2="120" y2="200" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="120,205 114,193 126,193" fill="#c0392b"/>
<text x="140" y="174" font-size="13" fill="#c0392b">联轴器传动</text>
<!-- 多路控制阀 -->
<rect x="260" y="200" width="130" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="325" y="226" text-anchor="middle" font-size="14" fill="#333">多路控制阀</text>
<text x="325" y="246" text-anchor="middle" font-size="13" fill="#666">按需分配压力油</text>
<!-- 箭头 泵→阀 -->
<line x1="180" y1="230" x2="260" y2="230" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="260,230 248,224 248,236" fill="#c0392b"/>
<text x="212" y="216" text-anchor="middle" font-size="13" fill="#c0392b">主油路</text>
<!-- 工作装置液压缸 -->
<rect x="440" y="130" width="150" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="515" y="156" text-anchor="middle" font-size="14" fill="#333">动臂/斗杆/铲斗缸</text>
<text x="515" y="176" text-anchor="middle" font-size="13" fill="#666">液压能→直线机械能</text>
<!-- 箭头 阀→工作缸 -->
<line x1="390" y1="215" x2="470" y2="175" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="470,175 458,183 469,187" fill="#c0392b"/>
<!-- 回转马达 -->
<rect x="440" y="260" width="150" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="515" y="286" text-anchor="middle" font-size="14" fill="#333">回转马达</text>
<text x="515" y="306" text-anchor="middle" font-size="13" fill="#666">液压能→旋转机械能</text>
<!-- 箭头 阀→回转 -->
<line x1="390" y1="235" x2="440" y2="290" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="440,290 428,284 441,279" fill="#c0392b"/>
<!-- 行走马达 -->
<rect x="440" y="20" width="150" height="60" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="515" y="46" text-anchor="middle" font-size="14" fill="#333">行走马达＋减速器</text>
<text x="515" y="66" text-anchor="middle" font-size="13" fill="#666">驱动履带行走</text>
<!-- 箭头 阀→行走 -->
<line x1="390" y1="225" x2="470" y2="80" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="470,80 458,86 467,92" fill="#c0392b"/>
<!-- 回油箱 -->
<rect x="260" y="80" width="130" height="50" rx="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="325" y="110" text-anchor="middle" font-size="13" fill="#333">油箱/滤清器/冷却器</text>
<!-- 回油虚线 -->
<line x1="325" y1="200" x2="325" y2="130" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="330" y="172" font-size="12" fill="#666">回油</text>
<text x="300" y="360" text-anchor="middle" font-size="13" fill="#666">发动机→泵→阀→执行元件：机械能与液压能逐级转换，控制阀决定能量去向</text>
</svg>
