<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="sans-serif">
  <title>组合损益分布与 VaR / ES</title>
  <desc>正态分布组合损益曲线，左侧阴影区为 1% 尾部，标注 VaR 分位数与期望损失 ES。</desc>
  <rect x="0" y="0" width="560" height="380" fill="#faf9f5"/>
  <!-- 轴 -->
  <line x1="60" y1="330" x2="540" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="60" y2="30" stroke="#333" stroke-width="1.5"/>
  <!-- 正态曲线：均值 mu=0 (x=300), 标准差 sigma=80 (y 高 210)。峰高 = 1/(sigma*sqrt(2pi)) -->
  <!-- x 映射：x=60 -> -3sigma, x=540 -> +3sigma，即 1sigma=80px -->
  <!-- 曲线点：用近似描点，正态峰 y0=80 -->
  <path d="M60,297 C90,292 120,268 150,230 C180,190 210,130 240,90 C260,62 280,45 300,43 C320,45 340,62 360,90 C390,130 420,190 450,230 C480,268 510,292 540,297" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 1% 左尾阴影：z=-2.33 -> x=300-2.33*80=113.6 -->
  <path d="M60,297 C75,294 90,286 113.6,274 L113.6,330 L60,330 Z" fill="#c0392b" opacity="0.35"/>
  <!-- VaR 线 -->
  <line x1="113.6" y1="330" x2="113.6" y2="274" stroke="#c0392b" stroke-width="2"/>
  <text x="113.6" y="352" text-anchor="middle" font-size="14" fill="#333">VaR（99%）</text>
  <!-- ES 线：z=-2.66 -> x=300-2.66*80=87.2 -->
  <line x1="87.2" y1="330" x2="87.2" y2="283" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="87.2" y="315" text-anchor="end" font-size="14" fill="#333">ES</text>
  <!-- 均值 -->
  <line x1="300" y1="330" x2="300" y2="43" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="300" y="352" text-anchor="middle" font-size="14" fill="#333">0（预期损益）</text>
  <!-- 标签 -->
  <text x="80" y="120" font-size="14" fill="#333">1% 尾部</text>
  <text x="380" y="60" font-size="14" fill="#333">组合损益分布</text>
  <text x="540" y="348" text-anchor="end" font-size="14" fill="#333">损益</text>
</svg>
