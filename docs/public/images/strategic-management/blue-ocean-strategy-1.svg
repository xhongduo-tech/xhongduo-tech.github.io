<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc">
  <title>战略画布：传统马戏团与太阳马戏团的价值曲线对比</title>
  <desc>横轴为竞争要素（价格、明星演出、动物表演、艺术美感、剧场体验），纵轴为提供水平（低到高），两条折线分别代表传统马戏团（红）与太阳马戏团（青）的价值曲线。</desc>
  <rect width="800" height="480" fill="#faf9f5"/>
  <g font-family="sans-serif">
    <line x1="90" y1="400" x2="760" y2="400" stroke="#333" stroke-width="2"/>
    <line x1="90" y1="400" x2="90" y2="60" stroke="#333" stroke-width="2"/>
    <text x="60" y="70" font-size="14" fill="#333" text-anchor="middle">高</text>
    <text x="60" y="400" font-size="14" fill="#333" text-anchor="middle">低</text>
    <text x="425" y="450" font-size="15" fill="#333" text-anchor="middle">竞争要素</text>
    <text x="36" y="230" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 36 230)">提供水平</text>
    <g font-size="14" fill="#333" text-anchor="middle">
      <text x="110" y="425">价格</text>
      <text x="262" y="425">明星演出</text>
      <text x="414" y="425">动物表演</text>
      <text x="566" y="425">艺术美感</text>
      <text x="718" y="425">剧场体验</text>
    </g>
    <line x1="110" y1="400" x2="110" y2="415" stroke="#aaa" stroke-width="1"/>
    <line x1="262" y1="400" x2="262" y2="415" stroke="#aaa" stroke-width="1"/>
    <line x1="414" y1="400" x2="414" y2="415" stroke="#aaa" stroke-width="1"/>
    <line x1="566" y1="400" x2="566" y2="415" stroke="#aaa" stroke-width="1"/>
    <line x1="718" y1="400" x2="718" y2="415" stroke="#aaa" stroke-width="1"/>
    <g font-size="15">
      <polyline points="110,300 262,180 414,160 566,250 718,300" fill="none" stroke="#c0392b" stroke-width="3"/>
      <circle cx="110" cy="300" r="5" fill="#c0392b"/>
      <circle cx="262" cy="180" r="5" fill="#c0392b"/>
      <circle cx="414" cy="160" r="5" fill="#c0392b"/>
      <circle cx="566" cy="250" r="5" fill="#c0392b"/>
      <circle cx="718" cy="300" r="5" fill="#c0392b"/>
      <polyline points="110,340 262,330 414,350 566,170 718,120" fill="none" stroke="#1f6f8b" stroke-width="3"/>
      <circle cx="110" cy="340" r="5" fill="#1f6f8b"/>
      <circle cx="262" cy="330" r="5" fill="#1f6f8b"/>
      <circle cx="414" cy="350" r="5" fill="#1f6f8b"/>
      <circle cx="566" cy="170" r="5" fill="#1f6f8b"/>
      <circle cx="718" cy="120" r="5" fill="#1f6f8b"/>
    </g>
    <g font-size="15">
      <line x1="600" y1="80" x2="660" y2="80" stroke="#c0392b" stroke-width="3"/>
      <text x="668" y="85" fill="#333">传统马戏团</text>
      <line x1="600" y1="110" x2="660" y2="110" stroke="#1f6f8b" stroke-width="3"/>
      <text x="668" y="115" fill="#333">太阳马戏团</text>
    </g>
  </g>
</svg>
