<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">海洋区域划分示意图</title>
  <desc id="desc">自领陆向公海的海洋区域横剖面：内水、领海、毗连区、专属经济区、大陆架、公海与国际海底区域。</desc>
  <rect x="0" y="0" width="1000" height="430" fill="#faf9f5"/>
  <rect x="20" y="90" width="90" height="170" fill="#d9b38c" stroke="#333" stroke-width="2"/>
  <text x="65" y="170" font-family="sans-serif" font-size="20" fill="#333" text-anchor="middle">领陆</text>
  <rect x="110" y="200" width="870" height="90" fill="#cfe8f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="110" y1="200" x2="980" y2="200" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="110" y1="140" x2="110" y2="290" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="110" y="130" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="middle">领海基线</text>
  <line x1="160" y1="200" x2="160" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="260" y1="200" x2="260" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="200" x2="340" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="200" x2="620" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="135" y="185" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">内水</text>
  <text x="210" y="185" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">领海 12 海里</text>
  <text x="300" y="185" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">毗连区 24 海里</text>
  <text x="480" y="185" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">专属经济区 200 海里</text>
  <text x="800" y="185" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">公海</text>
  <rect x="110" y="300" width="590" height="34" fill="#e8dcc8" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="405" y="322" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">大陆架（自然延伸可达大陆边外缘）</text>
  <rect x="700" y="300" width="280" height="34" fill="#e2d9e8" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="840" y="322" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">国际海底区域（深海海床）</text>
  <text x="500" y="372" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle">示意图：各区域宽度自领海基线向海量算，图中比例已压缩（200 海里 ≫ 12 海里）。</text>
  <text x="500" y="394" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle">大陆架与专属经济区在 200 海里内重叠；国际海底区域及其资源为人类共同继承财产。</text>
</svg>
