<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250">
  <title>速率单调调度时序图</title>
  <desc>两个周期任务在速率单调调度下 0 到 15 时间单位的执行时序：高优先级短周期任务 T1 抢占低优先级长周期任务 T2。</desc>
  <rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
  <text x="80" y="28" font-family="sans-serif" font-size="15" fill="#333">时间 t（单位：ms）</text>
  <g font-family="sans-serif" font-size="13" fill="#333">
    <text x="30" y="75">T1</text>
    <text x="10" y="90" font-size="12" fill="#555">(P=3, C=1)</text>
    <text x="30" y="145">T2</text>
    <text x="10" y="160" font-size="12" fill="#555">(P=5, C=2)</text>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="80" y1="32" x2="680" y2="32"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#333">
    <text x="76" y="50" text-anchor="middle">0</text>
    <text x="196" y="50" text-anchor="middle">3</text>
    <text x="316" y="50" text-anchor="middle">6</text>
    <text x="436" y="50" text-anchor="middle">9</text>
    <text x="556" y="50" text-anchor="middle">12</text>
    <text x="676" y="50" text-anchor="middle">15</text>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="80" y1="42" x2="80" y2="50"/>
    <line x1="200" y1="42" x2="200" y2="50"/>
    <line x1="320" y1="42" x2="320" y2="50"/>
    <line x1="440" y1="42" x2="440" y2="50"/>
    <line x1="560" y1="42" x2="560" y2="50"/>
    <line x1="680" y1="42" x2="680" y2="50"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="200" y1="55" x2="200" y2="165"/>
    <line x1="320" y1="55" x2="320" y2="165"/>
    <line x1="440" y1="55" x2="440" y2="165"/>
    <line x1="560" y1="55" x2="560" y2="165"/>
    <line x1="680" y1="55" x2="680" y2="165"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="2">
    <line x1="280" y1="55" x2="280" y2="165"/>
    <line x1="400" y1="55" x2="400" y2="165"/>
    <line x1="640" y1="55" x2="640" y2="165"/>
  </g>
  <rect x="80" y="60" width="600" height="40" fill="#faf9f5" stroke="#bbb"/>
  <rect x="80" y="125" width="600" height="40" fill="#faf9f5" stroke="#bbb"/>
  <g fill="#1f6f8b">
    <rect x="80"  y="60" width="40" height="40"/>
    <rect x="200" y="60" width="40" height="40"/>
    <rect x="320" y="60" width="40" height="40"/>
    <rect x="440" y="60" width="40" height="40"/>
    <rect x="560" y="60" width="40" height="40"/>
  </g>
  <g fill="#c0392b">
    <rect x="120" y="125" width="80" height="40"/>
    <rect x="240" y="125" width="40" height="40"/>
    <rect x="280" y="125" width="40" height="40"/>
    <rect x="360" y="125" width="40" height="40"/>
    <rect x="480" y="125" width="80" height="40"/>
    <rect x="600" y="125" width="40" height="40"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <rect x="80" y="195" width="16" height="16" fill="#1f6f8b"/>
    <text x="104" y="208">T1 执行（高优先级）</text>
    <rect x="260" y="195" width="16" height="16" fill="#c0392b"/>
    <text x="284" y="208">T2 执行（低优先级，被抢占）</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="80" y="228">青虚线：T1 截止期（3,6,9,12,15）　红虚线：T2 截止期（5,10,15）</text>
  </g>
</svg>
