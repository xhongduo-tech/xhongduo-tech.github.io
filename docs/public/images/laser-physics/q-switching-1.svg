<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="sans-serif">
  <title>调 Q 激光器时序图</title>
  <desc>调 Q 过程中粒子数反转缓慢积累，t0 时刻腔损耗骤降，反转被迅速消耗并输出一个巨脉冲。</desc>
  <rect width="600" height="520" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="60" y1="180" x2="560" y2="180"/>
    <line x1="60" y1="180" x2="60" y2="50"/>
    <line x1="60" y1="330" x2="560" y2="330"/>
    <line x1="60" y1="330" x2="60" y2="200"/>
    <line x1="60" y1="480" x2="560" y2="480"/>
    <line x1="60" y1="480" x2="60" y2="350"/>
  </g>
  <line x1="430" y1="40" x2="430" y2="495" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g fill="#c0392b" font-size="15">
    <text x="438" y="45">t₀</text>
    <text x="438" y="65">（调 Q 时刻）</text>
  </g>
  <g fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 60 180 Q 150 120 300 90 Q 380 74 430 70 Q 448 78 470 105 Q 500 145 540 172"/>
  </g>
  <g fill="#c0392b" stroke="#c0392b" stroke-width="2.5">
    <path d="M 60 265 L 430 265 L 434 318 L 560 318"/>
  </g>
  <g fill="#c0392b" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 60 480 L 430 480 Q 447 382 460 372 Q 475 382 490 480 L 560 480"/>
  </g>
  <g fill="#333" font-size="15">
    <text x="70" y="72">粒子数反转 ΔN：泵浦期缓慢积累</text>
    <text x="70" y="218">腔损耗 α：先高（低 Q，阻止振荡）</text>
    <text x="70" y="370">输出功率 P：开关瞬间释放巨脉冲</text>
    <text x="500" y="505">时间 t</text>
    <text x="150" y="195" font-size="14" fill="#1f6f8b">积累 ΔNᵢ</text>
    <text x="470" y="120" font-size="14" fill="#1f6f8b">快速耗尽</text>
    <text x="70" y="252" font-size="14" fill="#c0392b">α 高</text>
    <text x="470" y="252" font-size="14" fill="#c0392b">α 低</text>
  </g>
</svg>
