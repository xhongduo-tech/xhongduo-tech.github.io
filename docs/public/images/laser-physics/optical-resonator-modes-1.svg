<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="sans-serif">
  <title>谐振腔稳定性图（g1–g2 图）</title>
  <desc>以 g1、g2 为坐标轴，阴影区为稳定腔区域 0 &lt; g1·g2 &lt; 1，标注共焦腔、平行平面腔、共心腔三个特殊位置。</desc>
  <rect width="600" height="500" fill="#faf9f5"/>
  <g stroke="#c0392b" fill="none" stroke-width="2">
    <path d="M 300 240 L 100 240" />
    <path d="M 300 240 L 500 240" />
    <path d="M 300 240 L 300 100" />
    <path d="M 300 240 L 300 440" />
  </g>
  <polygon points="300,240 300,100 320,100 350,160 400,140 500,290 500,240" fill="#f3d9c8" opacity="0.85" stroke="none"/>
  <polygon points="300,240 300,440 280,440 250,340 200,360 100,290 100,240" fill="#f3d9c8" opacity="0.85" stroke="none"/>
  <g stroke="#1f6f8b" fill="none" stroke-width="2.5">
    <path d="M 300 240 Q 320 140 350 160 Q 380 180 400 140 Q 440 80 500 290" />
    <path d="M 300 240 Q 280 340 250 340 Q 220 320 200 360 Q 160 420 100 290" />
  </g>
  <g stroke="#333" stroke-width="1" fill="#333">
    <line x1="100" y1="240" x2="500" y2="240"/>
    <line x1="300" y1="100" x2="300" y2="440"/>
  </g>
  <g fill="#333" font-size="15">
    <text x="100" y="268">-2</text>
    <text x="200" y="268">-1</text>
    <text x="396" y="268">1</text>
    <text x="496" y="268">2</text>
    <text x="282" y="108">2</text>
    <text x="282" y="208">1</text>
    <text x="282" y="412">-1</text>
    <text x="282" y="460">-2</text>
    <text x="500" y="260">g1</text>
    <text x="312" y="100">g2</text>
    <text x="300" y="238" font-size="13" fill="#c0392b">O</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="#faf9f5">
    <circle cx="300" cy="240" r="5"/>
    <circle cx="400" cy="140" r="5"/>
    <circle cx="200" cy="340" r="5"/>
  </g>
  <g fill="#333" font-size="15">
    <text x="348" y="218" fill="#c0392b" font-weight="bold">共焦腔</text>
    <text x="420" y="120">平行平面腔</text>
    <text x="110" y="360">共心腔</text>
  </g>
  <text x="430" y="170" fill="#1f6f8b" font-size="14">g1·g2 = 1</text>
  <text x="330" y="300" fill="#1f6f8b" font-size="14">g1·g2 = 1</text>
  <text x="405" y="320" fill="#333" font-size="15">稳定区</text>
  <text x="140" y="195" fill="#333" font-size="15">稳定区</text>
  <text x="30" y="30" fill="#c0392b" font-size="15">0 &lt; g1·g2 &lt; 1 为稳定腔</text>
  <text x="30" y="52" fill="#333" font-size="14">阴影：稳定区；实线：边界 g1·g2 = 1 与 g1·g2 = 0</text>
</svg>
