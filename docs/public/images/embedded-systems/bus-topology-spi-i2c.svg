<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <title>SPI 与 I2C 总线连接示意</title>
  <desc>左侧为 SPI 主从加片选的总线连接，右侧为 I2C 双线带外接上拉电阻、多设备并挂的总线连接。</desc>
  <rect x="0" y="0" width="900" height="400" fill="#faf9f5"/>

  <!-- 左：SPI -->
  <text x="230" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SPI：主从 + 独立片选</text>
  <rect x="175" y="44" width="110" height="44" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="230" y="70" text-anchor="middle" font-size="14" fill="#333">主设备 Master</text>

  <rect x="175" y="150" width="110" height="36" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="230" y="172" text-anchor="middle" font-size="13" fill="#333">从设备 1</text>
  <rect x="175" y="228" width="110" height="36" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" font-size="13" fill="#333">从设备 2</text>
  <rect x="175" y="306" width="110" height="36" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="230" y="328" text-anchor="middle" font-size="13" fill="#333">从设备 3</text>

  <line x1="185" y1="88" x2="185" y2="306" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="200" y1="88" x2="200" y2="306" stroke="#c0392b" stroke-width="2"/>
  <line x1="215" y1="88" x2="215" y2="306" stroke="#333" stroke-width="2"/>
  <line x1="232" y1="88" x2="232" y2="186" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="232" y1="88" x2="232" y2="264" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="232" y1="88" x2="232" y2="342" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="185" y="104" text-anchor="middle" font-size="13" fill="#1f6f8b">SCLK</text>
  <text x="200" y="104" text-anchor="middle" font-size="13" fill="#c0392b">MOSI</text>
  <text x="215" y="104" text-anchor="middle" font-size="13" fill="#333">MISO</text>
  <text x="232" y="104" text-anchor="middle" font-size="13" fill="#888">CS1/2/3</text>

  <!-- 右：I2C -->
  <text x="700" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">I2C：双线并挂 + 上拉电阻</text>
  <line x1="520" y1="70" x2="820" y2="70" stroke="#333" stroke-width="2"/>
  <text x="520" y="60" font-size="13" fill="#333">VCC</text>

  <rect x="580" y="76" width="14" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="700" y="76" width="14" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <line x1="587" y1="92" x2="587" y2="350" stroke="#c0392b" stroke-width="2"/>
  <line x1="707" y1="92" x2="707" y2="350" stroke="#1f6f8b" stroke-width="2"/>

  <rect x="570" y="120" width="160" height="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="141" text-anchor="middle" font-size="13" fill="#333">设备 A</text>
  <rect x="570" y="205" width="160" height="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="226" text-anchor="middle" font-size="13" fill="#333">设备 B</text>
  <rect x="570" y="290" width="160" height="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="311" text-anchor="middle" font-size="13" fill="#333">设备 C</text>

  <text x="557" y="112" text-anchor="end" font-size="13" fill="#c0392b">SDA</text>
  <text x="717" y="112" font-size="13" fill="#1f6f8b">SCL</text>
  <text x="650" y="86" text-anchor="middle" font-size="13" fill="#333">上拉电阻（拉高空闲电平）</text>
</svg>
