<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="sans-serif">
  <title>RM 调度时间线示例</title>
  <desc>两个周期任务 tau1 与 tau2 在速率单调调度下的时间线，超周期为 12，tau1 在 t=8 抢占 tau2。</desc>
  <rect x="0" y="0" width="900" height="300" fill="#faf9f5"/>
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">RM 调度：τ₁=(1,4)，τ₂=(2,6)，超周期 H=12</text>

  <!-- 任务 τ₁ 行 -->
  <text x="60" y="92" font-size="14" fill="#333">任务 τ₁（周期 4，执行 1）</text>
  <rect x="50" y="104" width="65" height="26" fill="#c0392b"/>
  <rect x="310" y="104" width="65" height="26" fill="#c0392b"/>
  <rect x="570" y="104" width="65" height="26" fill="#c0392b"/>

  <!-- 任务 τ₂ 行 -->
  <text x="60" y="168" font-size="14" fill="#333">任务 τ₂（周期 6，执行 2）</text>
  <rect x="115" y="180" width="130" height="26" fill="#1f6f8b"/>
  <rect x="440" y="180" width="65" height="26" fill="#1f6f8b"/>
  <rect x="635" y="180" width="130" height="26" fill="#1f6f8b"/>

  <!-- 抢占标注 -->
  <line x1="570" y1="100" x2="570" y2="176" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="578" y="228" font-size="13" fill="#c0392b">t=8：τ₁ 抢占 τ₂</text>

  <!-- 时间轴 -->
  <line x1="50" y1="248" x2="830" y2="248" stroke="#333" stroke-width="2"/>
  <text x="50" y="272" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="180" y="272" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="310" y="272" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="440" y="272" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="570" y="272" text-anchor="middle" font-size="13" fill="#333">8</text>
  <text x="700" y="272" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="830" y="272" text-anchor="middle" font-size="13" fill="#333">12</text>
</svg>
