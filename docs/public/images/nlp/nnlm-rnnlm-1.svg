<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="sans-serif">
  <title>RNNLM 的按时间展开结构</title>
  <desc>循环神经网络语言模型按时间展开：每个时刻 t 接收输入词 w_t 的嵌入，结合上一时刻的隐状态 h_{t-1}，输出 y_t 预测下一个词；所有时刻共享同一套权重矩阵。</desc>
  <rect width="680" height="380" fill="#faf9f5"/>
  <text x="340" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">RNNLM：隐状态 h_t 记忆整个历史，权重在时间上共享</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 输出行 y=64 -->
  <text x="60" y="64" font-size="14" fill="#666" text-anchor="end">输出</text>
  <rect x="80" y="74" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-size="14" fill="#333">y₁</text>
  <rect x="220" y="74" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="265" y="98" text-anchor="middle" font-size="14" fill="#333">y₂</text>
  <rect x="360" y="74" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="405" y="98" text-anchor="middle" font-size="14" fill="#333">y₃</text>
  <rect x="500" y="74" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="98" text-anchor="middle" font-size="14" fill="#333">y₄</text>
  <text x="125" y="130" text-anchor="middle" font-size="13" fill="#666">P(w₂|w₁)</text>
  <text x="265" y="130" text-anchor="middle" font-size="13" fill="#666">P(w₃|w₁w₂)</text>
  <text x="405" y="130" text-anchor="middle" font-size="13" fill="#666">P(w₄|w₁..w₃)</text>
  <text x="545" y="130" text-anchor="middle" font-size="13" fill="#666">P(w₅|w₁..w₄)</text>

  <!-- 隐状态行 y=184 -->
  <text x="60" y="212" font-size="14" fill="#666" text-anchor="end">隐状态</text>
  <rect x="80" y="194" width="90" height="40" rx="8" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
  <text x="125" y="218" text-anchor="middle" font-size="14" fill="#333">h₁</text>
  <rect x="220" y="194" width="90" height="40" rx="8" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
  <text x="265" y="218" text-anchor="middle" font-size="14" fill="#333">h₂</text>
  <rect x="360" y="194" width="90" height="40" rx="8" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
  <text x="405" y="218" text-anchor="middle" font-size="14" fill="#333">h₃</text>
  <rect x="500" y="194" width="90" height="40" rx="8" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
  <text x="545" y="218" text-anchor="middle" font-size="14" fill="#333">h₄</text>
  <text x="125" y="250" text-anchor="middle" font-size="13" fill="#666">tanh(W·x₁ + U·h₀)</text>
  <text x="545" y="250" text-anchor="middle" font-size="13" fill="#666">记忆 w₁..w₄</text>

  <!-- 输入行 y=304 -->
  <text x="60" y="330" font-size="14" fill="#666" text-anchor="end">输入</text>
  <rect x="80" y="312" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="125" y="336" text-anchor="middle" font-size="14" fill="#333">x₁=w₁</text>
  <rect x="220" y="312" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="265" y="336" text-anchor="middle" font-size="14" fill="#333">x₂=w₂</text>
  <rect x="360" y="312" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="405" y="336" text-anchor="middle" font-size="14" fill="#333">x₃=w₃</text>
  <rect x="500" y="312" width="90" height="40" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="336" text-anchor="middle" font-size="14" fill="#333">x₄=w₄</text>

  <!-- 箭头：x → h -->
  <line x1="125" y1="312" x2="125" y2="238" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="312" x2="265" y2="238" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="312" x2="405" y2="238" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="312" x2="545" y2="238" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头：h_{t-1} → h_t（循环） -->
  <line x1="170" y1="214" x2="212" y2="214" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="214" x2="352" y2="214" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="214" x2="492" y2="214" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 箭头：h → y -->
  <line x1="125" y1="194" x2="125" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="194" x2="265" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="194" x2="405" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="194" x2="545" y2="118" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 图注 -->
  <text x="340" y="370" text-anchor="middle" font-size="13" fill="#666">红色箭头：h_{t-1} → h_t 的循环连接，让 h_t 携带 w₁..w_{t-1} 的全部信息；蓝框右侧文字为共享权重</text>
</svg>
