<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="sans-serif">
  <title>词频—排名双对数图（齐普夫定律示意）</title>
  <desc>横轴为 log 排名，纵轴为 log 词频，服从齐普夫定律的词频分布近似一条斜率为 -1 的直线，右侧为长尾区域</desc>
  <rect width="660" height="460" fill="#faf9f5"/>

  <text x="330" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">词频—排名双对数图（齐普夫定律示意）</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="400" x2="620" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="400" stroke="#333" stroke-width="1.5"/>
  <path d="M 612 397 L 620 400 L 612 403 Z" fill="#333"/>
  <path d="M 97 68 L 100 60 L 103 68 Z" fill="#333"/>

  <!-- 长尾阴影区 -->
  <rect x="475" y="60" width="125" height="340" fill="#c0392b" opacity="0.08"/>
  <text x="537" y="88" text-anchor="middle" font-size="14" fill="#c0392b">长尾</text>

  <!-- 幂律直线：斜率 -1，从 (100,60) 到 (600,400) -->
  <line x1="100" y1="60" x2="600" y2="400" stroke="#1f6f8b" stroke-width="3"/>

  <!-- 词标注 -->
  <text x="86" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">「的」</text>
  <text x="200" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">「一」</text>
  <text x="252" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">「在」</text>
  <text x="430" y="278" text-anchor="middle" font-size="14" fill="#666">低频词⋯⋯</text>

  <!-- 斜率标注 -->
  <text x="300" y="260" text-anchor="middle" font-size="14" fill="#1f6f8b">斜率 ≈ −1</text>

  <!-- X 轴刻度：log 排名 -->
  <text x="100" y="424" text-anchor="middle" font-size="13" fill="#333">1</text>
  <line x1="100" y1="398" x2="100" y2="404" stroke="#333" stroke-width="1"/>
  <text x="225" y="424" text-anchor="middle" font-size="13" fill="#333">10</text>
  <line x1="225" y1="398" x2="225" y2="404" stroke="#333" stroke-width="1"/>
  <text x="350" y="424" text-anchor="middle" font-size="13" fill="#333">10²</text>
  <line x1="350" y1="398" x2="350" y2="404" stroke="#333" stroke-width="1"/>
  <text x="475" y="424" text-anchor="middle" font-size="13" fill="#333">10³</text>
  <line x1="475" y1="398" x2="475" y2="404" stroke="#333" stroke-width="1"/>
  <text x="600" y="424" text-anchor="middle" font-size="13" fill="#333">10⁴</text>
  <line x1="600" y1="398" x2="600" y2="404" stroke="#333" stroke-width="1"/>
  <text x="360" y="448" text-anchor="middle" font-size="14" fill="#333">log 排名 r</text>

  <!-- Y 轴刻度：log 词频 -->
  <text x="86" y="64" text-anchor="end" font-size="13" fill="#333">10⁻¹</text>
  <line x1="98" y1="60" x2="104" y2="60" stroke="#333" stroke-width="1"/>
  <text x="86" y="149" text-anchor="end" font-size="13" fill="#333">10⁻²</text>
  <line x1="98" y1="145" x2="104" y2="145" stroke="#333" stroke-width="1"/>
  <text x="86" y="234" text-anchor="end" font-size="13" fill="#333">10⁻³</text>
  <line x1="98" y1="230" x2="104" y2="230" stroke="#333" stroke-width="1"/>
  <text x="86" y="319" text-anchor="end" font-size="13" fill="#333">10⁻⁴</text>
  <line x1="98" y1="315" x2="104" y2="315" stroke="#333" stroke-width="1"/>
  <text x="86" y="404" text-anchor="end" font-size="13" fill="#333">10⁻⁵</text>
  <line x1="98" y1="400" x2="104" y2="400" stroke="#333" stroke-width="1"/>

  <text x="28" y="240" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 28 240)">log 词频 f</text>
</svg>
