<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif">
  <title>「武汉市长江大桥」最短路径分词的有向无环图</title>
  <desc>七个字符间隙为节点，候选词为弧；红色弧构成从 0 到 7 经过 3 个词的最短路径，将句子切分为武汉市/长江/大桥</desc>
  <rect width="800" height="320" fill="#faf9f5"/>

  <text x="400" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">「武汉市长江大桥」的候选词图（有向无环图 DAG）</text>

  <!-- 位置编号（节点上方） -->
  <text x="70"  y="174" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="160" y="174" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="250" y="174" text-anchor="middle" font-size="12" fill="#888">2</text>
  <text x="340" y="174" text-anchor="middle" font-size="12" fill="#888">3</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#888">4</text>
  <text x="520" y="174" text-anchor="middle" font-size="12" fill="#888">5</text>
  <text x="610" y="174" text-anchor="middle" font-size="12" fill="#888">6</text>
  <text x="700" y="174" text-anchor="middle" font-size="12" fill="#888">7</text>

  <!-- 非最短路径的候选弧（蓝色） -->
  <path d="M 70 200 Q 160 150 250 200" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 250 200 Q 340 150 430 200" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <path d="M 430 200 Q 475 172 520 200" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 520 200 Q 565 172 610 200" fill="none" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 最短路径的弧（红色）：0→3→5→7 -->
  <path d="M 70 200 Q 205 95 340 200" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M 340 200 Q 430 150 520 200" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M 520 200 Q 610 150 700 200" fill="none" stroke="#c0392b" stroke-width="3.5"/>

  <!-- 弧标签 -->
  <text x="160" y="142" text-anchor="middle" font-size="14" fill="#1f6f8b">武汉</text>
  <text x="205" y="88"  text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">武汉市</text>
  <text x="340" y="142" text-anchor="middle" font-size="14" fill="#1f6f8b">市长</text>
  <text x="430" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">长江</text>
  <text x="475" y="165" text-anchor="middle" font-size="13" fill="#1f6f8b">江</text>
  <text x="565" y="165" text-anchor="middle" font-size="13" fill="#1f6f8b">大</text>
  <text x="610" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">大桥</text>

  <!-- 节点：最短路径上的节点 0,3,5,7 为红色系 -->
  <circle cx="70"  cy="200" r="15" fill="#fbe4e1" stroke="#c0392b" stroke-width="2"/>
  <circle cx="160" cy="200" r="15" fill="#e4eef2" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="250" cy="200" r="15" fill="#e4eef2" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="340" cy="200" r="15" fill="#fbe4e1" stroke="#c0392b" stroke-width="2"/>
  <circle cx="430" cy="200" r="15" fill="#e4eef2" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="520" cy="200" r="15" fill="#fbe4e1" stroke="#c0392b" stroke-width="2"/>
  <circle cx="610" cy="200" r="15" fill="#e4eef2" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="700" cy="200" r="15" fill="#fbe4e1" stroke="#c0392b" stroke-width="2"/>

  <!-- 字符标签（节点下方） -->
  <text x="70"  y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">武</text>
  <text x="160" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">汉</text>
  <text x="250" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">市</text>
  <text x="340" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">长</text>
  <text x="430" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">江</text>
  <text x="520" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">大</text>
  <text x="610" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">桥</text>

  <!-- 图例 -->
  <line x1="90"  y1="282" x2="140" y2="282" stroke="#c0392b" stroke-width="3.5"/>
  <text x="150" y="286" font-size="13" fill="#333">红线：最短路径 → 武汉市 / 长江 / 大桥（3 词）</text>
  <line x1="90"  y1="304" x2="140" y2="304" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="150" y="308" font-size="13" fill="#333">蓝线：其他候选词（武汉 / 市、市长、江、大）</text>
</svg>
