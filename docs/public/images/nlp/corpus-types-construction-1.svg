<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <title>语料库的构建流程</title>
  <desc>从原始文本采集、清洗规范化、切分与标注，到划分训练集、开发集与测试集的流程示意图</desc>
  <rect width="760" height="400" fill="#faf9f5"/>

  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">语料库的构建流程</text>

  <!-- 阶段一：原始文本 -->
  <rect x="40" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">原始文本采集</text>
  <text x="140" y="150" text-anchor="middle" font-size="13" fill="#333">网络 · 报刊 · 图书</text>
  <text x="140" y="172" text-anchor="middle" font-size="13" fill="#333">抽样 · 平衡 · 转码</text>
  <text x="140" y="220" text-anchor="middle" font-size="13" fill="#1f6f8b">生语料库来源</text>

  <!-- 阶段二：清洗 -->
  <rect x="280" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">清洗与规范化</text>
  <text x="380" y="150" text-anchor="middle" font-size="13" fill="#333">去重 · 去噪声</text>
  <text x="380" y="172" text-anchor="middle" font-size="13" fill="#333">统一编码 · 去标签</text>

  <!-- 阶段三：切分与标注 -->
  <rect x="520" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="620" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">切分与标注</text>
  <text x="620" y="150" text-anchor="middle" font-size="13" fill="#333">分句 · 分词</text>
  <text x="620" y="172" text-anchor="middle" font-size="13" fill="#333">词性 · 句法 · 语义</text>
  <text x="620" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">标注语料库</text>

  <!-- 箭头 -->
  <path d="M 240 145 L 278 145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 145 L 518 145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 向下分支 -->
  <path d="M 620 200 L 620 255" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 180 255 L 620 255" stroke="#333" stroke-width="2"/>
  <path d="M 180 255 L 180 288" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 255 L 380 288" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 255 L 580 288" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 训练集 -->
  <rect x="90" y="292" width="180" height="70" rx="8" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="180" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">训练集</text>
  <text x="180" y="347" text-anchor="middle" font-size="13" fill="#333">模型学规律</text>

  <!-- 开发集 -->
  <rect x="290" y="292" width="180" height="70" rx="8" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="380" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">开发集</text>
  <text x="380" y="347" text-anchor="middle" font-size="13" fill="#333">调超参数</text>

  <!-- 测试集 -->
  <rect x="490" y="292" width="180" height="70" rx="8" fill="#eef3f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="580" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">测试集</text>
  <text x="580" y="347" text-anchor="middle" font-size="13" fill="#333">最终评估一次</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
