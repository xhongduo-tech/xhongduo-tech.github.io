<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif">
  <title>FastText 字符 n-gram 分解示意图</title>
  <desc>单词 where 被拆成五个字符三元组，词的向量由全部片段向量求和而成。</desc>
  <rect width="760" height="250" fill="#faf9f5"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">FastText：一个词由它的字符 n-gram 拼成</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#666">词 where（n=3），&lt; 与 &gt; 标记词首与词尾</text>

  <rect x="330" y="74" width="100" height="40" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" font-size="17" fill="#333">where</text>

  <g font-size="15" fill="#333">
    <rect x="118" y="140" width="92" height="48" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="164" y="170" text-anchor="middle">&lt;wh</text>

    <rect x="226" y="140" width="92" height="48" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="272" y="170" text-anchor="middle">whe</text>

    <rect x="334" y="140" width="92" height="48" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="380" y="170" text-anchor="middle">her</text>

    <rect x="442" y="140" width="92" height="48" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="488" y="170" text-anchor="middle">ere</text>

    <rect x="550" y="140" width="92" height="48" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="596" y="170" text-anchor="middle">re&gt;</text>
  </g>

  <g font-size="20" fill="#c0392b" text-anchor="middle">
    <text x="196" y="172">+</text>
    <text x="304" y="172">+</text>
    <text x="412" y="172">+</text>
    <text x="520" y="172">+</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333"/>
    </marker>
  </defs>
  <path d="M 380 194 L 380 208" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="228" text-anchor="middle" font-size="15" fill="#333">词向量(w) = z(&lt;wh) + z(whe) + z(her) + z(ere) + z(re&gt;)</text>
  <text x="380" y="246" text-anchor="middle" font-size="12" fill="#666">示意图省略了整词单元 &lt;where&gt;</text>
</svg>
