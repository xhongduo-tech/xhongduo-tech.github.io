<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="sans-serif">
  <title>n-gram 模型的条件依赖关系</title>
  <desc>展示一元、二元、三元模型中每个词对前序词的依赖：unigram 不依赖前词，bigram 的每个词只依赖前一个词，trigram 的每个词依赖前两个词。</desc>
  <rect width="680" height="320" fill="#faf9f5"/>
  <text x="340" y="36" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">n-gram：词 wᵢ 只依赖前面 n−1 个词</text>

  <!-- 行标签 -->
  <text x="22" y="104" font-size="14" fill="#333">unigram</text>
  <text x="22" y="122" font-size="13" fill="#666">n = 1</text>
  <text x="22" y="174" font-size="14" fill="#333">bigram</text>
  <text x="22" y="192" font-size="13" fill="#666">n = 2</text>
  <text x="22" y="244" font-size="14" fill="#333">trigram</text>
  <text x="22" y="262" font-size="13" fill="#666">n = 3</text>

  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 词节点：每组 4 个，宽 80 高 44 -->
  <!-- unigram 行 y=80 -->
  <rect x="150" y="80" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="190" y="107" text-anchor="middle" font-size="16" fill="#333">w₁</text>
  <rect x="264" y="80" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="304" y="107" text-anchor="middle" font-size="16" fill="#333">w₂</text>
  <rect x="378" y="80" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="418" y="107" text-anchor="middle" font-size="16" fill="#333">w₃</text>
  <rect x="492" y="80" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="532" y="107" text-anchor="middle" font-size="16" fill="#333">w₄</text>

  <!-- bigram 行 y=150，箭头连接相邻词 -->
  <rect x="150" y="150" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="190" y="177" text-anchor="middle" font-size="16" fill="#333">w₁</text>
  <rect x="264" y="150" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="304" y="177" text-anchor="middle" font-size="16" fill="#333">w₂</text>
  <rect x="378" y="150" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="418" y="177" text-anchor="middle" font-size="16" fill="#333">w₃</text>
  <rect x="492" y="150" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="532" y="177" text-anchor="middle" font-size="16" fill="#333">w₄</text>
  <line x1="230" y1="172" x2="256" y2="172" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="172" x2="370" y2="172" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="458" y1="172" x2="484" y2="172" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- trigram 行 y=220，箭头跨过一格 -->
  <rect x="150" y="220" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="190" y="247" text-anchor="middle" font-size="16" fill="#333">w₁</text>
  <rect x="264" y="220" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="304" y="247" text-anchor="middle" font-size="16" fill="#333">w₂</text>
  <rect x="378" y="220" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="418" y="247" text-anchor="middle" font-size="16" fill="#333">w₃</text>
  <rect x="492" y="220" width="80" height="44" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
  <text x="532" y="247" text-anchor="middle" font-size="16" fill="#333">w₄</text>
  <path d="M 230 242 C 292 196, 318 196, 370 242" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 344 242 C 408 196, 430 196, 484 242" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 图注 -->
  <text x="340" y="306" text-anchor="middle" font-size="13" fill="#666">箭头表示条件依赖方向：bigram 中 P(w₂|w₁)，trigram 中 P(w₃|w₁w₂)</text>
</svg>
