<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
  <title>单遍编译与多遍编译的对比</title>
  <desc>上图：单遍编译把词法、语法、语义、代码生成合并进一次扫描；下图：多遍编译每一遍只做一道工序，各遍串联。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 单遍编译 -->
  <text x="30" y="32" font-size="16" font-weight="bold" fill="#333">单遍编译</text>

  <rect x="30" y="48" width="110" height="56" rx="6" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="85" y="81" font-size="14" fill="#333" text-anchor="middle">源程序</text>

  <line x1="150" y1="76" x2="194" y2="76" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="48" width="390" height="56" rx="6" fill="#faf9f5" stroke="#c0392b" stroke-width="2"/>
  <text x="395" y="69" font-size="14" fill="#c0392b" text-anchor="middle">词法 → 语法 → 语义 → 代码生成</text>
  <text x="395" y="91" font-size="14" fill="#c0392b" text-anchor="middle">一次扫描（所有工序合并成一遍）</text>

  <line x1="600" y1="76" x2="634" y2="76" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="48" width="130" height="56" rx="6" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="705" y="81" font-size="14" fill="#333" text-anchor="middle">目标代码</text>

  <text x="200" y="130" font-size="13" fill="#666">代价：名字必须先声明后使用，否则一遍之内无法知道它的属性</text>

  <!-- 多遍编译 -->
  <text x="30" y="185" font-size="16" font-weight="bold" fill="#333">多遍编译</text>

  <rect x="30" y="205" width="110" height="56" rx="6" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="85" y="238" font-size="14" fill="#333" text-anchor="middle">源程序</text>

  <line x1="150" y1="233" x2="194" y2="233" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="205" width="100" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="250" y="232" font-size="14" fill="#1f6f8b" text-anchor="middle">第1遍</text>
  <text x="250" y="251" font-size="14" fill="#1f6f8b" text-anchor="middle">词法</text>

  <line x1="310" y1="233" x2="334" y2="233" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="205" width="100" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="390" y="232" font-size="14" fill="#1f6f8b" text-anchor="middle">第2遍</text>
  <text x="390" y="251" font-size="14" fill="#1f6f8b" text-anchor="middle">语法</text>

  <line x1="450" y1="233" x2="474" y2="233" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="205" width="100" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="530" y="232" font-size="14" fill="#1f6f8b" text-anchor="middle">第3遍</text>
  <text x="530" y="251" font-size="14" fill="#1f6f8b" text-anchor="middle">语义</text>

  <line x1="590" y1="233" x2="614" y2="233" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="205" width="140" height="56" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="690" y="232" font-size="14" fill="#1f6f8b" text-anchor="middle">第4遍</text>
  <text x="690" y="251" font-size="14" fill="#1f6f8b" text-anchor="middle">代码生成</text>

  <text x="200" y="290" font-size="13" fill="#666">每一遍读入上一遍的输出；优化等阶段还可反复多遍，直至满意</text>

  <text x="400" y="340" font-size="13" fill="#c0392b" text-anchor="middle">阶段是概念分工，遍是物理扫描——现代编译器几乎都是多遍</text>
</svg>
