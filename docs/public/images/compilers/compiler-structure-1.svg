<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">编译器的两阶段结构：前端（分析）与后端（综合）</title>
  <desc id="desc">上图展示编译器的两阶段结构。上排为八阶段流水线：源程序→词法分析→语法分析→语义分析→中间代码生成→优化→代码生成→目标机器代码；其中词法、语法、语义、中间代码生成四阶段由青色括号标为前端（分析），优化与代码生成两阶段由红色括号标为后端（综合），各阶段下方注明其输出（记号流、语法树、中间表示等）。虚线方框表示符号表与错误处理为各阶段共享。下排为完整的程序语言处理流水线：源程序→预处理器→编译器→汇编器→链接器→可执行代码。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect width="860" height="580" fill="#faf9f5"/>

  <!-- 图题 -->
  <text x="430" y="34" font-size="18" fill="#333" text-anchor="middle">编译器的结构：前端（分析）与后端（综合）</text>
  <text x="430" y="56" font-size="13" fill="#777" text-anchor="middle">以 position = initial + rate * 60 为例（龙书《编译原理》第1章）</text>

  <!-- 各阶段共享：符号表与错误处理 -->
  <rect x="270" y="82" width="320" height="40" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="430" y="107" font-size="14" fill="#333" text-anchor="middle">各阶段共享：符号表（Symbol Table）与错误处理</text>

  <!-- 前端括号（青色） -->
  <line x1="122" y1="148" x2="536" y2="148" stroke="#1f6f8b" stroke-width="2.4"/>
  <line x1="122" y1="148" x2="122" y2="170" stroke="#1f6f8b" stroke-width="2.4"/>
  <line x1="536" y1="148" x2="536" y2="170" stroke="#1f6f8b" stroke-width="2.4"/>
  <text x="329" y="140" font-size="16" fill="#1f6f8b" text-anchor="middle">前端 · 分析（Analysis）</text>

  <!-- 后端括号（红色） -->
  <line x1="546" y1="148" x2="748" y2="148" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="546" y1="148" x2="546" y2="170" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="748" y1="148" x2="748" y2="170" stroke="#c0392b" stroke-width="2.4"/>
  <text x="647" y="140" font-size="16" fill="#c0392b" text-anchor="middle">后端 · 综合（Synthesis）</text>

  <!-- 上排流水线：八阶段 -->
  <g stroke="#333" stroke-width="2">
    <rect x="16"  y="200" width="96" height="60" rx="6" fill="#ffffff"/>
    <rect x="122" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#1f6f8b"/>
    <rect x="228" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#1f6f8b"/>
    <rect x="334" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#1f6f8b"/>
    <rect x="440" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#1f6f8b"/>
    <rect x="546" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <rect x="652" y="200" width="96" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <rect x="758" y="200" width="96" height="60" rx="6" fill="#ffffff"/>
  </g>

  <!-- 上排箭头 -->
  <g stroke="#777" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="112" y1="230" x2="122" y2="230"/>
    <line x1="218" y1="230" x2="228" y2="230"/>
    <line x1="324" y1="230" x2="334" y2="230"/>
    <line x1="430" y1="230" x2="440" y2="230"/>
    <line x1="536" y1="230" x2="546" y2="230"/>
    <line x1="642" y1="230" x2="652" y2="230"/>
    <line x1="748" y1="230" x2="758" y2="230"/>
  </g>

  <!-- 上排框内文字 -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="64"  y="235">源程序</text>
    <text x="170" y="235">词法分析</text>
    <text x="276" y="235">语法分析</text>
    <text x="382" y="235">语义分析</text>
    <text x="488" y="235">中间代码生成</text>
    <text x="594" y="235">优化</text>
    <text x="700" y="235">代码生成</text>
    <text x="806" y="235">目标机器代码</text>
  </g>

  <!-- 上排输出标注 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="64"  y="278">字符流</text>
    <text x="170" y="278">记号流</text>
    <text x="276" y="278">语法树</text>
    <text x="382" y="278">标注后语法树</text>
    <text x="488" y="278">中间表示</text>
    <text x="488" y="296">（三地址码）</text>
    <text x="594" y="278">优化后的 IR</text>
    <text x="700" y="278">目标代码</text>
    <text x="806" y="278">可执行代码</text>
  </g>

  <!-- 分隔线 -->
  <line x1="16" y1="350" x2="700" y2="350" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 下排标题 -->
  <text x="430" y="380" font-size="16" fill="#333" text-anchor="middle">程序语言处理流水线：预处理器 → 汇编器 → 链接器</text>

  <!-- 下排流水线：六阶段 -->
  <g stroke="#333" stroke-width="2">
    <rect x="16"  y="396" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="122" y="396" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="228" y="396" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="334" y="396" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="440" y="396" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="546" y="396" width="96" height="40" rx="6" fill="#ffffff"/>
  </g>

  <!-- 下排箭头 -->
  <g stroke="#777" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="112" y1="416" x2="122" y2="416"/>
    <line x1="218" y1="416" x2="228" y2="416"/>
    <line x1="324" y1="416" x2="334" y2="416"/>
    <line x1="430" y1="416" x2="440" y2="416"/>
    <line x1="536" y1="416" x2="546" y2="416"/>
  </g>

  <!-- 下排框内文字 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="64"  y="420">源程序</text>
    <text x="170" y="420">预处理器</text>
    <text x="276" y="420">编译器</text>
    <text x="382" y="420">汇编器</text>
    <text x="488" y="420">链接器</text>
    <text x="594" y="420">可执行代码</text>
  </g>

  <!-- 下排输出标注 -->
  <g font-size="13" fill="#777" text-anchor="middle">
    <text x="64"  y="454">源码文本</text>
    <text x="170" y="454">纯化源码</text>
    <text x="276" y="454">汇编代码</text>
    <text x="382" y="454">可重定位代码</text>
    <text x="488" y="454">可执行程序</text>
    <text x="594" y="454">机器指令</text>
  </g>
</svg>
