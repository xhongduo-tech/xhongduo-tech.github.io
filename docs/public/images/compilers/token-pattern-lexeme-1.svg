<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">记号、模式与词素：三层映射</title>
  <desc id="desc">左列是两个具体词素 score 与 60；中列是对应的模式 letter(letter|digit)* 与 digit+；右列是归并后的记号与属性值 &lt;id, 符号表指针&gt; 与 &lt;number, 数值&gt;。箭头从左到右连接：词素匹配模式，词素归入记号。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect width="860" height="380" fill="#faf9f5"/>

  <!-- 图题 -->
  <text x="430" y="34" font-size="18" fill="#333" text-anchor="middle">词素 → 模式 → 记号：一次分词的完整映射</text>
  <text x="430" y="56" font-size="13" fill="#777" text-anchor="middle">以 C 语句 printf("total = %d\n", score + 4); 为例（龙书《编译原理》第3章）</text>

  <!-- 列标题 -->
  <text x="120" y="100" font-size="16" fill="#1f6f8b" text-anchor="middle">词素 Lexeme</text>
  <text x="430" y="100" font-size="16" fill="#333" text-anchor="middle">模式 Pattern</text>
  <text x="740" y="100" font-size="16" fill="#c0392b" text-anchor="middle">记号 Token</text>

  <!-- 行1：标识符 -->
  <g stroke="#333" stroke-width="2">
    <rect x="30" y="120" width="180" height="70" rx="6" fill="#ffffff"/>
    <rect x="340" y="120" width="180" height="70" rx="6" fill="#ffffff"/>
    <rect x="650" y="120" width="180" height="70" rx="6" fill="#ffffff"/>
  </g>
  <text x="120" y="158" font-size="15" fill="#333" text-anchor="middle">score</text>
  <text x="430" y="158" font-size="14" fill="#333" text-anchor="middle">letter (letter | digit)*</text>
  <text x="740" y="158" font-size="14" fill="#333" text-anchor="middle">&lt;id, 符号表指针&gt;</text>

  <!-- 行2：数字 -->
  <g stroke="#333" stroke-width="2">
    <rect x="30" y="230" width="180" height="70" rx="6" fill="#ffffff"/>
    <rect x="340" y="230" width="180" height="70" rx="6" fill="#ffffff"/>
    <rect x="650" y="230" width="180" height="70" rx="6" fill="#ffffff"/>
  </g>
  <text x="120" y="268" font-size="15" fill="#333" text-anchor="middle">60</text>
  <text x="430" y="268" font-size="14" fill="#333" text-anchor="middle">digit+</text>
  <text x="740" y="268" font-size="14" fill="#333" text-anchor="middle">&lt;number, 数值 60&gt;</text>

  <!-- 行1箭头 -->
  <g stroke="#777" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="210" y1="155" x2="340" y2="155"/>
    <line x1="520" y1="155" x2="650" y2="155"/>
  </g>
  <!-- 行2箭头 -->
  <g stroke="#777" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="210" y1="265" x2="340" y2="265"/>
    <line x1="520" y1="265" x2="650" y2="265"/>
  </g>

  <!-- 箭头旁标注 -->
  <text x="275" y="148" font-size="13" fill="#777" text-anchor="middle">匹配</text>
  <text x="585" y="148" font-size="13" fill="#777" text-anchor="middle">归入</text>

  <!-- 底部说明 -->
  <text x="430" y="345" font-size="14" fill="#333" text-anchor="middle">词素是具体文本，模式是形状规则，记号是类别 + 属性值</text>
</svg>
