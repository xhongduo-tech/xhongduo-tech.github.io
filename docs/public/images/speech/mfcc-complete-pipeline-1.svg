<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>MFCC 提取流水线</title>
  <desc>语音信号经预加重、分帧加窗、FFT、Mel 滤波器组、取对数、DCT 与截断，得到 MFCC 特征向量</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="360" y="32" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">MFCC 提取流水线：语音 → 特征向量</text>

  <!-- row 1 boxes -->
  <g stroke="#1f6f8b" stroke-width="1.5" fill="#f5f1e8">
    <rect x="20" y="66" width="130" height="54" rx="6"/>
    <rect x="190" y="66" width="130" height="54" rx="6"/>
    <rect x="360" y="66" width="130" height="54" rx="6"/>
    <rect x="530" y="66" width="130" height="54" rx="6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="85" y="87">语音信号</text>
    <text x="85" y="107" font-size="13" fill="#555">s(n)</text>
    <text x="255" y="87">预加重</text>
    <text x="255" y="107" font-size="13" fill="#555">H(z)=1−0.97z⁻¹</text>
    <text x="425" y="87">分帧加窗</text>
    <text x="425" y="107" font-size="13" fill="#555">25 ms 汉明窗</text>
    <text x="595" y="87">FFT</text>
    <text x="595" y="107" font-size="13" fill="#555">功率谱 |X(k)|²</text>
  </g>

  <!-- row 1 arrows -->
  <g stroke="#888" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="152" y1="93" x2="184" y2="93"/>
    <line x1="322" y1="93" x2="354" y2="93"/>
    <line x1="492" y1="93" x2="524" y2="93"/>
  </g>

  <!-- down arrow from FFT to Mel filter -->
  <g stroke="#888" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="595" y1="120" x2="595" y2="152"/>
    <line x1="595" y1="152" x2="85" y2="152"/>
    <line x1="85" y1="152" x2="85" y2="178"/>
  </g>

  <!-- row 2 boxes -->
  <g stroke="#c0392b" stroke-width="1.5" fill="#fdf2ef">
    <rect x="20" y="178" width="130" height="54" rx="6"/>
    <rect x="190" y="178" width="130" height="54" rx="6"/>
    <rect x="360" y="178" width="130" height="54" rx="6"/>
    <rect x="530" y="178" width="130" height="54" rx="6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="85" y="199">Mel 滤波器组</text>
    <text x="85" y="219" font-size="13" fill="#555">M 个三角滤波器</text>
    <text x="255" y="199">取对数</text>
    <text x="255" y="219" font-size="13" fill="#555">log S_m</text>
    <text x="425" y="199">DCT</text>
    <text x="425" y="219" font-size="13" fill="#555">去相关·压缩</text>
    <text x="595" y="199">MFCC 特征</text>
    <text x="595" y="219" font-size="13" fill="#555">截断前 K 维</text>
  </g>

  <!-- row 2 arrows -->
  <g stroke="#888" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="152" y1="205" x2="184" y2="205"/>
    <line x1="322" y1="205" x2="354" y2="205"/>
    <line x1="492" y1="205" x2="524" y2="205"/>
  </g>

  <!-- footnote -->
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#777">MFCC 与普通倒谱的差别只在两处：Mel 滤波器组 + DCT 截断</text>
</svg>
