<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">等响度曲线（ISO 226）</title>
  <desc id="desc">横轴为物理频率（20 Hz–20 kHz，对数刻度），纵轴为声压级（0–130 dB SPL，线性刻度）。每条曲线代表一个固定响度级（phon）：该频率下与该曲线相等响度的声音，其 1 kHz 参考音的声压级就是曲线上标注的 phon 值。最下面一条是听阈（0 phon，绿色—墨色虚线标注），曲线在 2–4 kHz 处略有下凹，说明人耳对这段最敏感；频率越低或越高，需要越大的声压级才能达到同样的响度。40 phon 曲线近似 dBA 计权曲线。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="880" height="520" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="440" y="26" text-anchor="middle" font-size="16" fill="#333">等响度曲线：同一条曲线上的声音「听感一样响」</text>

  <!-- 绘图区：x 120-830（20Hz-20kHz 对数），y 40-430（SPL 130-0） -->
  <!-- 水平网格：每 20 dB 一条 -->
  <g stroke="#e2dccf" stroke-width="1">
    <line x1="120" y1="40"  x2="830" y2="40"/>
    <line x1="120" y1="70"  x2="830" y2="70"/>
    <line x1="120" y1="130" x2="830" y2="130"/>
    <line x1="120" y1="190" x2="830" y2="190"/>
    <line x1="120" y1="250" x2="830" y2="250"/>
    <line x1="120" y1="310" x2="830" y2="310"/>
    <line x1="120" y1="370" x2="830" y2="370"/>
    <line x1="120" y1="430" x2="830" y2="430"/>
    <!-- 垂直网格（对数刻度）：20,50,100,200,500,1k,2k,5k,10k,20k -->
    <line x1="120" y1="40" x2="120" y2="430"/>
    <line x1="214" y1="40" x2="214" y2="430"/>
    <line x1="285" y1="40" x2="285" y2="430"/>
    <line x1="357" y1="40" x2="357" y2="430"/>
    <line x1="451" y1="40" x2="451" y2="430"/>
    <line x1="522" y1="40" x2="522" y2="430"/>
    <line x1="593" y1="40" x2="593" y2="430"/>
    <line x1="688" y1="40" x2="688" y2="430"/>
    <line x1="759" y1="40" x2="759" y2="430"/>
    <line x1="830" y1="40" x2="830" y2="430"/>
  </g>

  <!-- 1 kHz 参考线（加粗淡线） -->
  <line x1="522" y1="40" x2="522" y2="430" stroke="#c9c2b4" stroke-width="1.6"/>

  <!-- 等响度曲线：0(听阈) 20 40 60 80 100 phon -->
  <path d="M 120.0,220.0 Q 214.2,304.0 249.8,328.0 Q 285.4,352.0 321.0,371.5 Q 356.7,391.0 403.8,403.0 Q 450.8,415.0 486.5,419.5 Q 522.1,424.0 557.7,430.0 Q 593.3,436.0 614.2,437.5 Q 635.0,439.0 649.8,439.0 Q 664.6,439.0 676.0,434.5 Q 687.5,430.0 711.7,421.0 Q 735.8,412.0 747.3,403.0 Q 758.8,394.0 794.4,359.5 L 830.0,325.0"
        fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="6 3"/>
  <path d="M 120.0,145.0 Q 214.2,226.0 249.8,253.0 Q 285.4,280.0 321.0,298.0 Q 356.7,316.0 403.8,331.0 Q 450.8,346.0 486.5,358.0 Q 522.1,370.0 557.7,373.0 Q 593.3,376.0 614.2,377.5 Q 635.0,379.0 649.8,379.0 Q 664.6,379.0 676.0,376.0 Q 687.5,373.0 711.7,362.5 Q 735.8,352.0 747.3,343.0 Q 758.8,334.0 794.4,295.0 L 830.0,256.0"
        fill="none" stroke="#7aa3a8" stroke-width="2.0"/>
  <path d="M 120.0,100.0 Q 214.2,166.0 249.8,199.0 Q 285.4,232.0 321.0,250.0 Q 356.7,268.0 403.8,283.0 Q 450.8,298.0 486.5,304.0 Q 522.1,310.0 557.7,313.0 Q 593.3,316.0 614.2,317.5 Q 635.0,319.0 649.8,319.0 Q 664.6,319.0 676.0,314.5 Q 687.5,310.0 711.7,302.5 Q 735.8,295.0 747.3,287.5 Q 758.8,280.0 794.4,241.0 L 830.0,202.0"
        fill="none" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="8 4"/>
  <path d="M 120.0,73.0 Q 214.2,118.0 249.8,142.0 Q 285.4,166.0 321.0,184.0 Q 356.7,202.0 403.8,220.0 Q 450.8,238.0 486.5,244.0 Q 522.1,250.0 557.7,253.0 Q 593.3,256.0 614.2,257.5 Q 635.0,259.0 649.8,259.0 Q 664.6,259.0 676.0,254.5 Q 687.5,250.0 711.7,244.0 Q 735.8,238.0 747.3,232.0 Q 758.8,226.0 794.4,187.0 L 830.0,148.0"
        fill="none" stroke="#1f6f8b" stroke-width="2.0"/>
  <path d="M 120.0,52.0 Q 214.2,88.0 249.8,103.0 Q 285.4,118.0 321.0,131.5 Q 356.7,145.0 403.8,161.5 Q 450.8,178.0 486.5,184.0 Q 522.1,190.0 557.7,193.0 Q 593.3,196.0 614.2,197.5 Q 635.0,199.0 649.8,199.0 Q 664.6,199.0 676.0,194.5 Q 687.5,190.0 711.7,184.0 Q 735.8,178.0 747.3,173.5 Q 758.8,169.0 794.4,137.5 L 830.0,106.0"
        fill="none" stroke="#1f6f8b" stroke-width="2.0"/>
  <path d="M 120.0,43.0 Q 214.2,58.0 249.8,70.0 Q 285.4,82.0 321.0,91.0 Q 356.7,100.0 403.8,113.5 Q 450.8,127.0 486.5,128.5 Q 522.1,130.0 557.7,133.0 Q 593.3,136.0 614.2,137.5 Q 635.0,139.0 649.8,139.0 Q 664.6,139.0 676.0,134.5 Q 687.5,130.0 711.7,125.5 Q 735.8,121.0 747.3,116.5 Q 758.8,112.0 794.4,91.0 L 830.0,70.0"
        fill="none" stroke="#1f6f8b" stroke-width="2.0"/>

  <!-- 右端 phon 标签 -->
  <text x="838" y="323" font-size="13" fill="#333">0 phon（听阈）</text>
  <text x="838" y="254" font-size="13" fill="#7aa3a8">20</text>
  <text x="838" y="200" font-size="13" fill="#c0392b">40</text>
  <text x="838" y="146" font-size="13" fill="#1f6f8b">60</text>
  <text x="838" y="104" font-size="13" fill="#1f6f8b">80</text>
  <text x="838" y="68"  font-size="13" fill="#1f6f8b">100</text>

  <!-- 关键标注 -->
  <text x="620" y="316" font-size="13" fill="#c0392b">40 phon ≈ dBA 计权</text>
  <text x="596" y="452" font-size="13" fill="#555">1 kHz</text>
  <text x="636" y="452" font-size="13" fill="#555">（响度级基准）</text>

  <!-- 左轴 SPL 标注 -->
  <text x="92" y="433" text-anchor="end" font-size="13" fill="#333">0</text>
  <text x="92" y="373" text-anchor="end" font-size="13" fill="#333">20</text>
  <text x="92" y="313" text-anchor="end" font-size="13" fill="#333">40</text>
  <text x="92" y="253" text-anchor="end" font-size="13" fill="#333">60</text>
  <text x="92" y="193" text-anchor="end" font-size="13" fill="#333">80</text>
  <text x="92" y="133" text-anchor="end" font-size="13" fill="#333">100</text>
  <text x="92" y="73"  text-anchor="end" font-size="13" fill="#333">120</text>
  <text x="22" y="235" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 22 235)">声压级 SPL（dB）</text>

  <!-- 横轴频率标注 -->
  <text x="120" y="452" text-anchor="middle" font-size="13" fill="#333">20</text>
  <text x="214" y="452" text-anchor="middle" font-size="13" fill="#333">50</text>
  <text x="285" y="452" text-anchor="middle" font-size="13" fill="#333">100</text>
  <text x="357" y="452" text-anchor="middle" font-size="13" fill="#333">200</text>
  <text x="451" y="452" text-anchor="middle" font-size="13" fill="#333">500</text>
  <text x="522" y="452" text-anchor="middle" font-size="13" fill="#333">1k</text>
  <text x="593" y="452" text-anchor="middle" font-size="13" fill="#333">2k</text>
  <text x="688" y="452" text-anchor="middle" font-size="13" fill="#333">5k</text>
  <text x="759" y="452" text-anchor="middle" font-size="13" fill="#333">10k</text>
  <text x="830" y="452" text-anchor="middle" font-size="13" fill="#333">20k</text>
  <text x="475" y="478" text-anchor="middle" font-size="14" fill="#555">频率（Hz，对数刻度）</text>

  <!-- 图例 -->
  <rect x="470" y="52" width="342" height="120" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  <line x1="482" y1="74" x2="518" y2="74" stroke="#333" stroke-width="2.2" stroke-dasharray="6 3"/>
  <text x="526" y="78" font-size="13" fill="#333">0 phon：听阈（绝对阈限）</text>
  <line x1="482" y1="98" x2="518" y2="98" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="8 4"/>
  <text x="526" y="102" font-size="13" fill="#333">40 phon：近似 dBA 计权曲线</text>
  <line x1="482" y1="122" x2="518" y2="122" stroke="#1f6f8b" stroke-width="2.0"/>
  <text x="526" y="126" font-size="13" fill="#333">60 / 80 / 100 phon</text>
  <line x1="482" y1="146" x2="518" y2="146" stroke="#7aa3a8" stroke-width="2.0"/>
  <text x="526" y="150" font-size="13" fill="#333">20 phon</text>
  <text x="482" y="166" font-size="12" fill="#777">每条曲线上所有声音，听感响度相等</text>
</svg>
