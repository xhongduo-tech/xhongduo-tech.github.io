<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>短时傅里叶变换流程示意</title>
<desc>左图为一段语音波形，三段灰色窗框分别截取一帧；右侧三幅小图为各帧的频谱；把每帧频谱作为一列排布即得语谱图。</desc>
<rect x="0" y="0" width="720" height="360" fill="#faf9f5"/>
<text x="20" y="28" font-family="sans-serif" font-size="16" fill="#333">短时傅里叶变换：先切帧，再逐帧求频谱</text>

<!-- 波形面板 -->
<rect x="20" y="50" width="250" height="230" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="30" y="72" font-family="sans-serif" font-size="13" fill="#333">语音波形 x(n)</text>

<!-- 三个窗框 -->
<rect x="60" y="60" width="44" height="180" fill="#1f6f8b" opacity="0.22"/>
<rect x="112" y="60" width="44" height="180" fill="#1f6f8b" opacity="0.22"/>
<rect x="164" y="60" width="44" height="180" fill="#1f6f8b" opacity="0.22"/>
<text x="66" y="268" font-family="sans-serif" font-size="13" fill="#1f6f8b">窗1</text>
<text x="118" y="268" font-family="sans-serif" font-size="13" fill="#1f6f8b">窗2</text>
<text x="170" y="268" font-family="sans-serif" font-size="13" fill="#1f6f8b">窗3</text>

<!-- 波形 -->
<polyline points="30,170 42,150 54,160 66,174 78,156 90,162 102,178 114,148 126,163 138,171 150,152 162,166 174,179 186,153 198,161 210,172 222,154 234,165 246,176 258,158 266,164"
  fill="none" stroke="#333" stroke-width="1.5"/>

<!-- 箭头 -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
  </marker>
</defs>
<line x1="272" y1="118" x2="308" y2="138" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="272" y1="190" x2="308" y2="210" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="272" y1="262" x2="308" y2="282" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- 频谱面板 1 -->
<rect x="315" y="95" width="270" height="80" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="325" y="113" font-family="sans-serif" font-size="13" fill="#333">帧 1 频谱 |X(m,k)|</text>
<line x1="325" y1="168" x2="580" y2="168" stroke="#333" stroke-width="1"/>
<line x1="325" y1="100" x2="325" y2="168" stroke="#333" stroke-width="1"/>
<polyline points="330,164 358,154 388,120 418,160 448,132 478,162 508,144 540,160 570,158 578,164"
  fill="none" stroke="#c0392b" stroke-width="1.6"/>

<!-- 频谱面板 2 -->
<rect x="315" y="185" width="270" height="80" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="325" y="203" font-family="sans-serif" font-size="13" fill="#333">帧 2 频谱 |X(m,k)|</text>
<line x1="325" y1="258" x2="580" y2="258" stroke="#333" stroke-width="1"/>
<line x1="325" y1="190" x2="325" y2="258" stroke="#333" stroke-width="1"/>
<polyline points="330,254 355,254 385,234 415,126 445,156 475,134 505,160 535,150 565,160 578,254"
  fill="none" stroke="#c0392b" stroke-width="1.6"/>

<!-- 频谱面板 3 -->
<rect x="315" y="275" width="270" height="80" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="325" y="293" font-family="sans-serif" font-size="13" fill="#333">帧 3 频谱 |X(m,k)|</text>
<line x1="325" y1="348" x2="580" y2="348" stroke="#333" stroke-width="1"/>
<line x1="325" y1="280" x2="325" y2="348" stroke="#333" stroke-width="1"/>
<polyline points="330,344 350,344 380,336 410,128 440,156 470,148 500,134 530,160 560,158 578,344"
  fill="none" stroke="#c0392b" stroke-width="1.6"/>

<text x="20" y="330" font-family="sans-serif" font-size="14" fill="#1f6f8b">把每一帧的频谱作为一列依次排好 → 就是下一节的语谱图</text>
</svg>
