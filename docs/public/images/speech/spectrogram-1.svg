<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>语谱图示意：一句话的时间-频率画像</title>
<desc>中央浊音段呈现横向暗带（共振峰 F1/F2/F3）与纵向条纹（声门脉冲），首尾清音段为高频噪声散点，浊清交界处有塞音爆破竖线。</desc>
<rect x="0" y="0" width="760" height="400" fill="#faf9f5"/>
<text x="20" y="28" font-family="sans-serif" font-size="16" fill="#333">语谱图示意：一句话的「时间—频率」画像</text>

<!-- 清音区标签 -->
<text x="98" y="54" font-family="sans-serif" font-size="13" fill="#333">清音 /s/</text>
<line x1="112" y1="60" x2="118" y2="68" stroke="#333" stroke-width="1"/>
<text x="620" y="54" font-family="sans-serif" font-size="13" fill="#333">清音 /ʃ/</text>
<line x1="616" y1="60" x2="612" y2="68" stroke="#333" stroke-width="1"/>
<text x="352" y="50" font-family="sans-serif" font-size="13" fill="#333">浊音段（元音）</text>
<line x1="380" y1="55" x2="380" y2="62" stroke="#333" stroke-width="1"/>

<!-- 绘图区 -->
<rect x="110" y="60" width="580" height="270" fill="#ffffff" stroke="#333" stroke-width="1.2"/>

<!-- 纵轴刻度 -->
<text x="98" y="64" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">4k</text>
<text x="98" y="132" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">3k</text>
<text x="98" y="199" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">2k</text>
<text x="98" y="267" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">1k</text>
<text x="98" y="334" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">0</text>
<line x1="110" y1="194" x2="690" y2="194" stroke="#333" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="110" y1="262" x2="690" y2="262" stroke="#333" stroke-width="0.5" stroke-dasharray="3 4"/>

<!-- 横轴刻度 -->
<text x="110" y="346" font-family="sans-serif" font-size="13" fill="#333">0</text>
<text x="300" y="346" font-family="sans-serif" font-size="13" fill="#333">100ms</text>
<text x="490" y="346" font-family="sans-serif" font-size="13" fill="#333">200ms</text>
<text x="680" y="346" font-family="sans-serif" font-size="13" fill="#333">300ms</text>

<!-- 清音区：高频噪声散点 -->
<g stroke="#333" stroke-width="1.2" opacity="0.35">
  <line x1="118" y1="120" x2="130" y2="124"/><line x1="126" y1="146" x2="140" y2="150"/>
  <line x1="114" y1="170" x2="128" y2="166"/><line x1="132" y1="196" x2="146" y2="192"/>
  <line x1="120" y1="212" x2="138" y2="216"/><line x1="128" y1="240" x2="144" y2="236"/>
  <line x1="116" y1="262" x2="134" y2="258"/><line x1="140" y1="278" x2="148" y2="282"/>
  <line x1="124" y1="300" x2="142" y2="296"/><line x1="132" y1="104" x2="146" y2="100"/>
</g>
<g stroke="#333" stroke-width="1.2" opacity="0.35">
  <line x1="574" y1="118" x2="588" y2="122"/><line x1="580" y1="146" x2="596" y2="150"/>
  <line x1="568" y1="170" x2="584" y2="166"/><line x1="590" y1="196" x2="604" y2="192"/>
  <line x1="576" y1="214" x2="594" y2="218"/><line x1="586" y1="240" x2="602" y2="236"/>
  <line x1="572" y1="262" x2="590" y2="258"/><line x1="600" y1="278" x2="608" y2="282"/>
  <line x1="582" y1="300" x2="600" y2="296"/><line x1="588" y1="102" x2="604" y2="98"/>
</g>

<!-- 塞音爆破：浊清交界竖线 -->
<line x1="150" y1="66" x2="150" y2="324" stroke="#c0392b" stroke-width="2.4"/>
<line x1="560" y1="66" x2="560" y2="324" stroke="#c0392b" stroke-width="1.6"/>

<!-- 浊音段：纵向条纹（声门脉冲） -->
<g stroke="#333" stroke-width="1.4" opacity="0.08">
  <line x1="152" y1="65" x2="152" y2="325"/><line x1="162" y1="65" x2="162" y2="325"/>
  <line x1="172" y1="65" x2="172" y2="325"/><line x1="182" y1="65" x2="182" y2="325"/>
  <line x1="192" y1="65" x2="192" y2="325"/><line x1="202" y1="65" x2="202" y2="325"/>
  <line x1="212" y1="65" x2="212" y2="325"/><line x1="222" y1="65" x2="222" y2="325"/>
  <line x1="232" y1="65" x2="232" y2="325"/><line x1="242" y1="65" x2="242" y2="325"/>
  <line x1="252" y1="65" x2="252" y2="325"/><line x1="262" y1="65" x2="262" y2="325"/>
  <line x1="272" y1="65" x2="272" y2="325"/><line x1="282" y1="65" x2="282" y2="325"/>
  <line x1="292" y1="65" x2="292" y2="325"/><line x1="302" y1="65" x2="302" y2="325"/>
  <line x1="312" y1="65" x2="312" y2="325"/><line x1="322" y1="65" x2="322" y2="325"/>
  <line x1="332" y1="65" x2="332" y2="325"/><line x1="342" y1="65" x2="342" y2="325"/>
  <line x1="352" y1="65" x2="352" y2="325"/><line x1="362" y1="65" x2="362" y2="325"/>
  <line x1="372" y1="65" x2="372" y2="325"/><line x1="382" y1="65" x2="382" y2="325"/>
  <line x1="392" y1="65" x2="392" y2="325"/><line x1="402" y1="65" x2="402" y2="325"/>
  <line x1="412" y1="65" x2="412" y2="325"/><line x1="422" y1="65" x2="422" y2="325"/>
  <line x1="432" y1="65" x2="432" y2="325"/><line x1="442" y1="65" x2="442" y2="325"/>
  <line x1="452" y1="65" x2="452" y2="325"/><line x1="462" y1="65" x2="462" y2="325"/>
  <line x1="472" y1="65" x2="472" y2="325"/><line x1="482" y1="65" x2="482" y2="325"/>
  <line x1="492" y1="65" x2="492" y2="325"/><line x1="502" y1="65" x2="502" y2="325"/>
  <line x1="512" y1="65" x2="512" y2="325"/><line x1="522" y1="65" x2="522" y2="325"/>
  <line x1="532" y1="65" x2="532" y2="325"/><line x1="542" y1="65" x2="542" y2="325"/>
  <line x1="552" y1="65" x2="552" y2="325"/>
</g>

<!-- 共振峰横向暗带 -->
<rect x="150" y="272" width="410" height="14" fill="#333" opacity="0.55"/>
<rect x="150" y="216" width="410" height="12" fill="#333" opacity="0.5"/>
<rect x="150" y="123" width="410" height="10" fill="#333" opacity="0.42"/>

<!-- 共振峰标签 -->
<text x="120" y="283" font-family="sans-serif" font-size="13" fill="#333">F1</text>
<text x="120" y="226" font-family="sans-serif" font-size="13" fill="#333">F2</text>
<text x="120" y="133" font-family="sans-serif" font-size="13" fill="#333">F3</text>

<!-- 轴标题 -->
<text x="22" y="200" font-family="sans-serif" font-size="14" fill="#333" transform="rotate(-90 22 200)">频率</text>
<text x="385" y="372" font-family="sans-serif" font-size="14" fill="#333">时间</text>

<!-- 图例 -->
<text x="110" y="392" font-family="sans-serif" font-size="14" fill="#1f6f8b">横向暗带=共振峰（F1/F2/F3）　纵向条纹=声门脉冲（浊音）　高频散点=清音噪声　红色竖线=塞音爆破</text>
</svg>
