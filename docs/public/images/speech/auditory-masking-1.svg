<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">同时掩蔽：掩蔽音抬高听阈并向上扩散</title>
  <desc id="desc">横轴为频率（对数刻度 20 Hz–20 kHz），纵轴为声压级（0–100 dB SPL）。青色曲线为安静听阈，在约 2–4 kHz 处最低；深灰色竖条表示 1 kHz、60 dB 的掩蔽音；红色曲线为加入掩蔽音后的听阈，在掩蔽音附近大幅抬高，并向高频方向扩散（掩蔽向上扩散），低频侧抬升较小。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="880" height="480" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="440" y="26" text-anchor="middle" font-size="16" fill="#333">同时掩蔽：一个 1 kHz 强声如何吃掉周围的弱声</text>

  <!-- 绘图区网格与坐标轴 -->
  <g stroke="#e2dccf" stroke-width="1">
    <line x1="120" y1="40" x2="120" y2="430"/>
    <line x1="120" y1="430" x2="840" y2="430"/>
    <line x1="120" y1="430" x2="840" y2="430"/>
    <!-- 水平网格 0,20,40,60,80,100 dB -->
    <line x1="120" y1="430" x2="840" y2="430"/>
    <line x1="120" y1="352" x2="840" y2="352"/>
    <line x1="120" y1="274" x2="840" y2="274"/>
    <line x1="120" y1="196" x2="840" y2="196"/>
    <line x1="120" y1="118" x2="840" y2="118"/>
    <line x1="120" y1="40"  x2="840" y2="40"/>
    <!-- 垂直网格 100Hz,1kHz,10kHz -->
    <line x1="288" y1="40" x2="288" y2="430"/>
    <line x1="528" y1="40" x2="528" y2="430"/>
    <line x1="768" y1="40" x2="768" y2="430"/>
  </g>

  <!-- 轴标签 -->
  <text x="60" y="436" text-anchor="middle" font-size="14" fill="#333">20</text>
  <text x="288" y="436" text-anchor="middle" font-size="14" fill="#333">100 Hz</text>
  <text x="528" y="436" text-anchor="middle" font-size="14" fill="#333">1 kHz</text>
  <text x="768" y="436" text-anchor="middle" font-size="14" fill="#333">10 kHz</text>
  <text x="840" y="436" text-anchor="middle" font-size="14" fill="#333">20 kHz</text>
  <text x="480" y="458" text-anchor="middle" font-size="14" fill="#555">频率（对数刻度）</text>

  <text x="88" y="433" text-anchor="end" font-size="13" fill="#333">0</text>
  <text x="88" y="355" text-anchor="end" font-size="13" fill="#333">20</text>
  <text x="88" y="277" text-anchor="end" font-size="13" fill="#333">40</text>
  <text x="88" y="199" text-anchor="end" font-size="13" fill="#333">60</text>
  <text x="88" y="121" text-anchor="end" font-size="13" fill="#333">80</text>
  <text x="88" y="43"  text-anchor="end" font-size="13" fill="#333">100</text>
  <text x="40" y="235" text-anchor="middle" font-size="14" fill="#555" transform="rotate(-90 40 235)">声压级（dB SPL）</text>

  <!-- 安静听阈（青色） -->
  <path d="M 120 157 C 180 170 240 220 288 274 C 330 310 380 340 402 352 C 450 380 500 405 528 414 C 570 425 610 428 642 430 C 660 430 665 425 672 422 C 710 405 730 398 744 391 C 770 360 790 340 817 274 C 830 250 838 230 840 215"
        fill="none" stroke="#1f6f8b" stroke-width="2.4"/>

  <!-- 掩蔽音：1 kHz 60 dB -->
  <line x1="528" y1="430" x2="528" y2="196" stroke="#666" stroke-width="3"/>
  <circle cx="528" cy="196" r="5" fill="#666"/>
  <text x="528" y="470" text-anchor="middle" font-size="13" fill="#666">掩蔽音 1 kHz · 60 dB</text>

  <!-- 掩蔽后听阈（红色） -->
  <path d="M 383 313 C 420 305 440 298 455 294 C 480 270 510 230 528 208 C 545 218 560 228 570 227 C 580 235 590 242 600 243 C 620 252 635 260 642 266 C 655 274 665 282 672 282 C 690 293 705 300 715 301 C 730 304 740 305 744 305 C 770 305 795 300 817 294"
        fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <!-- 掩蔽向上扩散箭头 -->
  <line x1="676" y1="300" x2="744" y2="278" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="742" y="270" font-size="13" fill="#c0392b">掩蔽向上扩散</text>

  <!-- 图例 -->
  <rect x="600" y="44" width="228" height="88" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  <line x1="612" y1="66" x2="648" y2="66" stroke="#1f6f8b" stroke-width="2.4"/>
  <text x="656" y="70" font-size="13" fill="#333">安静听阈</text>
  <line x1="612" y1="92" x2="648" y2="92" stroke="#666" stroke-width="3"/>
  <text x="656" y="96" font-size="13" fill="#333">掩蔽音（1 kHz, 60 dB）</text>
  <line x1="612" y1="118" x2="648" y2="118" stroke="#c0392b" stroke-width="2.6"/>
  <text x="656" y="122" font-size="13" fill="#333">掩蔽后的听阈</text>

  <!-- 临界频带说明 -->
  <text x="408" y="176" text-anchor="end" font-size="13" fill="#555">临界频带内掩蔽最强：</text>
  <text x="408" y="196" text-anchor="end" font-size="13" fill="#555">越靠近 1 kHz，听阈抬得越高</text>
</svg>
