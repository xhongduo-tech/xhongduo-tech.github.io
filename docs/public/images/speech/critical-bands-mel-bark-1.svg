<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Mel 与 Bark：两种感知频率刻度</title>
  <desc id="desc">横轴为物理频率（0–10 kHz，线性刻度）；左纵轴为 Mel 刻度（0–3000 mel），红色实线为 mel(f)=2595·log10(1+f/700)；右纵轴为 Bark 刻度（0–24 Bark），青色虚线为 bark(f)=13·arctan(0.00076f)+3.5·arctan((f/7500)^2)。两条曲线近似重合，说明两种刻度都在逼近同一条「感知对数曲线」；1 kHz 处约为 1000 mel 与 8.5 Bark。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="880" height="480" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="440" y="26" text-anchor="middle" font-size="16" fill="#333">两个感知频率刻度：Mel 与 Bark 都在逼近「对数耳朵」</text>

  <!-- 绘图区：x 0-10000 Hz（线性），y 40-430 -->
  <g stroke="#e2dccf" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="430"/>
    <line x1="100" y1="430" x2="840" y2="430"/>
    <!-- 垂直网格：0,2k,4k,6k,8k,10k Hz -->
    <line x1="100" y1="40" x2="100" y2="430"/>
    <line x1="248" y1="40" x2="248" y2="430"/>
    <line x1="396" y1="40" x2="396" y2="430"/>
    <line x1="544" y1="40" x2="544" y2="430"/>
    <line x1="692" y1="40" x2="692" y2="430"/>
    <line x1="840" y1="40" x2="840" y2="430"/>
    <!-- 水平网格：对应 mel 0,500,...,3000 与 bark 0,4,...,24 -->
    <line x1="100" y1="430" x2="840" y2="430"/>
    <line x1="100" y1="365" x2="840" y2="365"/>
    <line x1="100" y1="300" x2="840" y2="300"/>
    <line x1="100" y1="235" x2="840" y2="235"/>
    <line x1="100" y1="170" x2="840" y2="170"/>
    <line x1="100" y1="105" x2="840" y2="105"/>
    <line x1="100" y1="40"  x2="840" y2="40"/>
  </g>

  <!-- 1 kHz 参考线 -->
  <line x1="174" y1="40" x2="174" y2="430" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="174" y="52" text-anchor="middle" font-size="13" fill="#666">1 kHz</text>
  <text x="176" y="285" text-anchor="start" font-size="13" fill="#666">≈ 1000 mel ≈ 8.5 Bark</text>

  <!-- Mel 曲线（红色实线） -->
  <path d="M 100 430 C 130 400 150 330 174 300 C 200 265 225 245 248 232 C 300 200 350 170 396 151 C 450 128 500 110 544 99 C 600 85 650 68 692 61 C 760 52 810 45 840 40"
        fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <!-- Bark 曲线（青色虚线） -->
  <path d="M 100 430 C 130 400 150 330 174 292 C 200 260 225 240 248 217 C 300 195 350 170 396 149 C 450 130 500 118 544 111 C 600 100 650 90 692 84 C 760 78 810 70 840 66"
        fill="none" stroke="#1f6f8b" stroke-width="2.4" stroke-dasharray="7 5"/>

  <!-- 左轴 Mel 标注 -->
  <text x="72" y="433" text-anchor="end" font-size="13" fill="#333">0</text>
  <text x="72" y="368" text-anchor="end" font-size="13" fill="#333">500</text>
  <text x="72" y="303" text-anchor="end" font-size="13" fill="#333">1000</text>
  <text x="72" y="238" text-anchor="end" font-size="13" fill="#333">1500</text>
  <text x="72" y="173" text-anchor="end" font-size="13" fill="#333">2000</text>
  <text x="72" y="108" text-anchor="end" font-size="13" fill="#333">2500</text>
  <text x="72" y="43"  text-anchor="end" font-size="13" fill="#333">3000</text>
  <text x="28" y="235" text-anchor="middle" font-size="14" fill="#c0392b" transform="rotate(-90 28 235)">Mel 刻度</text>

  <!-- 右轴 Bark 标注 -->
  <text x="868" y="433" text-anchor="start" font-size="13" fill="#333">0</text>
  <text x="868" y="368" text-anchor="start" font-size="13" fill="#333">4</text>
  <text x="868" y="303" text-anchor="start" font-size="13" fill="#333">8</text>
  <text x="868" y="238" text-anchor="start" font-size="13" fill="#333">12</text>
  <text x="868" y="173" text-anchor="start" font-size="13" fill="#333">16</text>
  <text x="868" y="108" text-anchor="start" font-size="13" fill="#333">20</text>
  <text x="868" y="43"  text-anchor="start" font-size="13" fill="#333">24</text>
  <text x="856" y="235" text-anchor="middle" font-size="14" fill="#1f6f8b" transform="rotate(90 856 235)">Bark 刻度</text>

  <!-- 横轴标注 -->
  <text x="100" y="452" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="248" y="452" text-anchor="middle" font-size="13" fill="#333">2k</text>
  <text x="396" y="452" text-anchor="middle" font-size="13" fill="#333">4k</text>
  <text x="544" y="452" text-anchor="middle" font-size="13" fill="#333">6k</text>
  <text x="692" y="452" text-anchor="middle" font-size="13" fill="#333">8k</text>
  <text x="840" y="452" text-anchor="middle" font-size="13" fill="#333">10k</text>
  <text x="470" y="474" text-anchor="middle" font-size="14" fill="#555">物理频率（Hz，线性刻度）</text>

  <!-- 图例 -->
  <rect x="560" y="44" width="272" height="64" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  <line x1="572" y1="66" x2="608" y2="66" stroke="#c0392b" stroke-width="2.6"/>
  <text x="616" y="70" font-size="13" fill="#333">Mel：mel(f)=2595·log10(1+f/700)</text>
  <line x1="572" y1="92" x2="608" y2="92" stroke="#1f6f8b" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="616" y="96" font-size="13" fill="#333">Bark：z=13·arctan(0.00076f)+3.5·arctan((f/7500)²)</text>
</svg>
