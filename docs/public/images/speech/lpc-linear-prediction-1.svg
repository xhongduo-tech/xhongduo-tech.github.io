<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>LPC 谱包络与谐波梳</title>
  <desc>浊音帧的谐波梳（灰色竖线）与 LPC 谱包络（红色平滑曲线），包络在共振峰 F1、F2、F3 处隆起</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">LPC 谱包络：穿过谐波梳的平滑曲线</text>

  <!-- axes -->
  <line x1="40" y1="320" x2="600" y2="320" stroke="#555" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="40" y2="320" stroke="#555" stroke-width="1.5"/>
  <text x="16" y="100" font-size="13" fill="#333">幅度</text>
  <text x="16" y="114" font-size="13" fill="#333">(dB)</text>

  <!-- frequency ticks -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <line x1="40" y1="320" x2="40" y2="327" stroke="#555"/>
    <text x="40" y="344">0</text>
    <line x1="175" y1="320" x2="175" y2="327" stroke="#555"/>
    <text x="175" y="344">1k</text>
    <line x1="310" y1="320" x2="310" y2="327" stroke="#555"/>
    <text x="310" y="344">2k</text>
    <line x1="445" y1="320" x2="445" y2="327" stroke="#555"/>
    <text x="445" y="344">3k</text>
    <line x1="580" y1="320" x2="580" y2="327" stroke="#555"/>
    <text x="580" y="344">4k</text>
    <text x="320" y="366" font-size="13">频率（Hz）</text>
  </g>

  <!-- harmonic bars -->
  <g stroke="#b8b2a8" stroke-width="3">
    <line x1="60" y1="320" x2="60" y2="285"/>
    <line x1="82" y1="320" x2="82" y2="215"/>
    <line x1="104" y1="320" x2="104" y2="152"/>
    <line x1="126" y1="320" x2="126" y2="178"/>
    <line x1="148" y1="320" x2="148" y2="225"/>
    <line x1="170" y1="320" x2="170" y2="258"/>
    <line x1="192" y1="320" x2="192" y2="200"/>
    <line x1="214" y1="320" x2="214" y2="140"/>
    <line x1="236" y1="320" x2="236" y2="122"/>
    <line x1="258" y1="320" x2="258" y2="145"/>
    <line x1="280" y1="320" x2="280" y2="190"/>
    <line x1="302" y1="320" x2="302" y2="240"/>
    <line x1="324" y1="320" x2="324" y2="215"/>
    <line x1="346" y1="320" x2="346" y2="185"/>
    <line x1="368" y1="320" x2="368" y2="172"/>
    <line x1="390" y1="320" x2="390" y2="195"/>
    <line x1="412" y1="320" x2="412" y2="225"/>
    <line x1="434" y1="320" x2="434" y2="260"/>
    <line x1="456" y1="320" x2="456" y2="285"/>
    <line x1="478" y1="320" x2="478" y2="292"/>
    <line x1="500" y1="320" x2="500" y2="295"/>
    <line x1="522" y1="320" x2="522" y2="298"/>
    <line x1="544" y1="320" x2="544" y2="300"/>
    <line x1="566" y1="320" x2="566" y2="300"/>
  </g>

  <!-- envelope translucent fill -->
  <path d="M60 285 C80 285 95 150 115 150 C140 150 155 265 180 265 C205 265 220 120 245 120 C270 120 290 255 310 255 C335 255 350 170 375 170 C405 170 425 285 450 285 C490 285 535 300 570 300 L570 320 L60 320 Z" fill="#c0392b" opacity="0.10" stroke="none"/>
  <!-- envelope line -->
  <path d="M60 285 C80 285 95 150 115 150 C140 150 155 265 180 265 C205 265 220 120 245 120 C270 120 290 255 310 255 C335 255 350 170 375 170 C405 170 425 285 450 285 C490 285 535 300 570 300" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- formant markers -->
  <g fill="#c0392b" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="115" y="138">F1</text>
    <text x="245" y="106">F2</text>
    <text x="375" y="158">F3</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <line x1="408" y1="124" x2="445" y2="124" stroke="#b8b2a8" stroke-width="3"/>
    <text x="452" y="128">谐波（间隔 = f0）</text>
    <line x1="408" y1="150" x2="445" y2="150" stroke="#c0392b" stroke-width="3.5"/>
    <text x="452" y="154">LPC 谱包络</text>
  </g>
</svg>
