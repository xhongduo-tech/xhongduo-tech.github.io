<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">有理数中的柯西列收拢向缺失的极限 √2</title>
  <desc id="desc">水平线代表有理数轴 ℚ。整数 1 与 2 用实线刻度标出；√2 位于二者之间，用红色空心圆表示——它是有理数轴上的一个「洞」，不属于 ℚ。序列 1, 1.4, 1.41, 1.414, … 用青色圆点表示，从左向右不断收拢逼近 √2，却永远无法命中。下方文字说明：柯西列在内部自我凝聚，但极限点不在空间里。</desc>

  <!-- number line Q -->
  <line x1="70" y1="120" x2="690" y2="120" stroke="#333" stroke-width="2"/>

  <!-- tick 1 -->
  <line x1="150" y1="112" x2="150" y2="128" stroke="#333" stroke-width="1.6"/>
  <text x="150" y="152" font-size="16" fill="#333" text-anchor="middle">1</text>
  <!-- tick 2 -->
  <line x1="450" y1="112" x2="450" y2="128" stroke="#333" stroke-width="1.6"/>
  <text x="450" y="152" font-size="16" fill="#333" text-anchor="middle">2</text>

  <text x="70" y="100" font-size="15" fill="#666">ℚ：有理数轴</text>

  <!-- the missing point sqrt(2) -->
  <circle cx="274" cy="120" r="7" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="274" y="90" font-size="15" fill="#c0392b" text-anchor="middle">√2 ∉ ℚ</text>
  <line x1="274" y1="128" x2="274" y2="200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Cauchy sequence approaching -->
  <g fill="#1f6f8b">
    <circle cx="150" cy="120" r="5"/>
    <circle cx="258" cy="120" r="5"/>
    <circle cx="268" cy="120" r="5"/>
    <circle cx="272" cy="120" r="5"/>
  </g>
  <text x="150" y="180" font-size="14" fill="#1f6f8b" text-anchor="middle">1</text>
  <text x="258" y="180" font-size="14" fill="#1f6f8b" text-anchor="middle">1.4</text>
  <text x="269" y="180" font-size="14" fill="#1f6f8b" text-anchor="middle">1.41…</text>

  <!-- arrow toward the hole -->
  <path d="M 300 120 L 288 120" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="380" y="214" font-size="15" fill="#333" text-anchor="middle">柯西列 1, 1.4, 1.41, 1.414, … 在内部不断收拢，</text>
  <text x="380" y="236" font-size="15" fill="#333" text-anchor="middle">却永远命中不了 ℚ 之外的极限点 —— 这就是不完备。</text>
</svg>
