<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">稠密集的几何直觉：任意点 x 的任意开球里都能找到 D 中的点</title>
  <desc id="desc">大矩形代表度量空间 X，青色小点代表稠密子集 D 的元素，红色虚线圆代表以 x 为心、r 为半径的开球 B(x,r)，球内可以找到 D 中的点 d，并画出了半径指示线 r。下方文字给出稠密的等价定义：D 的闭包等于整个 X。</desc>

  <rect x="20" y="30" width="720" height="300" fill="#faf9f5" stroke="#333" stroke-width="1.6"/>
  <text x="720" y="52" font-size="15" fill="#666" text-anchor="end">X</text>

  <!-- dense subset D scatter -->
  <g fill="#1f6f8b" fill-opacity="0.8">
    <circle cx="60" cy="70" r="4"/><circle cx="120" cy="45" r="4"/><circle cx="200" cy="70" r="4"/>
    <circle cx="290" cy="55" r="4"/><circle cx="380" cy="80" r="4"/><circle cx="470" cy="60" r="4"/>
    <circle cx="560" cy="90" r="4"/><circle cx="650" cy="75" r="4"/><circle cx="705" cy="120" r="4"/>
    <circle cx="80" cy="145" r="4"/><circle cx="95" cy="225" r="4"/><circle cx="60" cy="285" r="4"/>
    <circle cx="150" cy="262" r="4"/><circle cx="230" cy="245" r="4"/><circle cx="330" cy="232" r="4"/>
    <circle cx="420" cy="252" r="4"/><circle cx="510" cy="222" r="4"/><circle cx="600" cy="242" r="4"/>
    <circle cx="680" cy="205" r="4"/><circle cx="365" cy="142" r="4"/><circle cx="450" cy="122" r="4"/>
    <circle cx="545" cy="152" r="4"/><circle cx="622" cy="182" r="4"/><circle cx="700" cy="275" r="4"/>
    <circle cx="115" cy="305" r="4"/><circle cx="305" cy="295" r="4"/><circle cx="505" cy="300" r="4"/>
    <circle cx="660" cy="305" r="4"/>
    <!-- dots inside the ball -->
    <circle cx="130" cy="112" r="4"/><circle cx="275" cy="135" r="4"/>
    <circle cx="240" cy="185" r="5"/>
  </g>

  <!-- open ball B(x, r) -->
  <circle cx="200" cy="150" r="88" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="200" y1="150" x2="288" y2="150" stroke="#c0392b" stroke-width="1.3"/>
  <text x="238" y="140" font-size="14" fill="#c0392b">r</text>

  <!-- the point x -->
  <circle cx="200" cy="150" r="5" fill="#333"/>
  <text x="200" y="135" font-size="15" fill="#333" text-anchor="middle">x</text>

  <!-- the dense point d -->
  <circle cx="240" cy="185" r="5" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="256" y="198" font-size="15" fill="#1f6f8b">d ∈ D</text>

  <text x="380" y="362" font-size="16" fill="#333" text-anchor="middle">稠密：对任意 x ∈ X、任意 r &gt; 0，开球 B(x, r) 内总存在 D 中的点</text>
  <text x="380" y="392" font-size="14" fill="#666" text-anchor="middle">等价地：D 的闭包等于整个 X，记作 D̅ = X</text>
</svg>
