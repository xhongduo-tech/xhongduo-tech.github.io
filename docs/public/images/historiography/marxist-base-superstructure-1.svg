<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="sans-serif">
  <title>历史唯物主义的基本结构</title>
  <desc>自上而下展示上层建筑、经济基础与生产力的关系：生产力决定生产关系（经济基础），经济基础决定上层建筑；上层建筑对经济基础、经济基础对生产力有反作用。</desc>
  <rect width="860" height="480" fill="#faf9f5"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">历史唯物主义的基本结构</text>

  <!-- 上层建筑 -->
  <rect x="150" y="60" width="500" height="90" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="400" y="96" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">上层建筑（superstructure）</text>
  <text x="400" y="120" text-anchor="middle" font-size="13" fill="#333">政治、法律、国家机器</text>
  <text x="400" y="138" text-anchor="middle" font-size="13" fill="#333">宗教、道德、哲学、意识形态</text>

  <!-- 经济基础 -->
  <rect x="150" y="190" width="500" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">经济基础（生产关系的总和）</text>
  <text x="400" y="250" text-anchor="middle" font-size="13" fill="#333">生产资料所有制 + 分配关系</text>
  <text x="400" y="268" text-anchor="middle" font-size="13" fill="#333">人在生产中的地位与关系</text>

  <!-- 生产力 -->
  <rect x="150" y="320" width="500" height="90" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="356" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">生产力（productive forces）</text>
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#333">劳动者 + 劳动工具 + 劳动对象</text>
  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#333">社会发展的最终动力</text>

  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 决定箭头（向下） -->
  <line x1="80" y1="150" x2="80" y2="190" stroke="#c0392b" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="66" y="174" text-anchor="middle" font-size="13" fill="#c0392b">决定</text>
  <line x1="80" y1="280" x2="80" y2="320" stroke="#c0392b" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="66" y="304" text-anchor="middle" font-size="13" fill="#c0392b">决定</text>

  <!-- 反作用箭头（向上，虚线） -->
  <line x1="720" y1="320" x2="720" y2="280" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <text x="742" y="304" font-size="13" fill="#1f6f8b">反作用</text>
  <line x1="720" y1="190" x2="720" y2="150" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <text x="742" y="174" font-size="13" fill="#1f6f8b">反作用</text>

  <text x="430" y="452" text-anchor="middle" font-size="13" fill="#333">社会存在决定社会意识；生产力与生产关系的矛盾，是社会变革的根本动力</text>
</svg>
