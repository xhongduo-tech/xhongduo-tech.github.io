<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%">
<title>翼型几何要素示意</title>
<desc>展示翼型的弦线、弯度线、前缘、后缘与攻角的定义</desc>
<rect width="640" height="320" fill="#faf9f5"/>
<line x1="60" y1="150" x2="560" y2="150" stroke="#333" stroke-width="1.5"/>
<path d="M 60 150 Q 310 132 560 150" fill="none" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M 60 150 C 130 120 240 106 330 110 C 420 114 500 128 560 150 C 500 166 420 180 330 184 C 240 188 130 174 60 150 Z" fill="#e8e4da" stroke="#333" stroke-width="1.5"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
</marker>
</defs>
<line x1="30" y1="212" x2="158" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 118 150 A 60 60 0 0 0 116.5 137.3" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="60" cy="150" r="4" fill="#c0392b"/>
<circle cx="560" cy="150" r="4" fill="#c0392b"/>
<text x="96" y="140" font-family="sans-serif" font-size="16" fill="#333">弦线</text>
<text x="128" y="116" font-family="sans-serif" font-size="16" fill="#1f6f8b">弯度线</text>
<text x="20" y="226" font-family="sans-serif" font-size="16" fill="#c0392b">来流 V∞</text>
<text x="122" y="146" font-family="sans-serif" font-size="15" fill="#c0392b">α</text>
<text x="130" y="86" font-family="sans-serif" font-size="16" fill="#333">上表面</text>
<text x="130" y="212" font-family="sans-serif" font-size="16" fill="#333">下表面</text>
<text x="14" y="138" font-family="sans-serif" font-size="15" fill="#333">前缘</text>
<text x="498" y="100" font-family="sans-serif" font-size="15" fill="#333">后缘</text>
<text x="300" y="205" font-family="sans-serif" font-size="15" fill="#333">弦长 c</text>
