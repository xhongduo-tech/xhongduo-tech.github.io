<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="sans-serif">
  <title>转化路径的五个阶段与两座死亡之谷</title>
  <desc>从 T0 基础发现到 T4 人群健康的五个转化阶段，在基础与临床之间、证据与实践之间存在两座死亡之谷；下方为反向转化箭头。</desc>
  <rect width="1000" height="430" fill="#faf9f5"/>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrowRev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>

  <!-- 阶段方块 -->
  <g stroke="#1f6f8b" stroke-width="2" fill="#ffffff">
    <rect x="65"  y="150" width="130" height="90" rx="8"/>
    <rect x="265" y="150" width="130" height="90" rx="8"/>
    <rect x="465" y="150" width="130" height="90" rx="8"/>
    <rect x="665" y="150" width="130" height="90" rx="8"/>
    <rect x="865" y="150" width="130" height="90" rx="8"/>
  </g>
  <g fill="#333333" text-anchor="middle" font-size="15">
    <text x="130" y="180">T0</text>
    <text x="130" y="200">基础发现</text>
    <text x="130" y="220" font-size="13">靶点 / 机制 / 分子</text>
    <text x="330" y="180">T1</text>
    <text x="330" y="200">转化到人</text>
    <text x="330" y="220" font-size="13">首次人体试验 / 安全</text>
    <text x="530" y="180">T2</text>
    <text x="530" y="200">转化到患者</text>
    <text x="530" y="220" font-size="13">疗效 / 注册证据</text>
    <text x="730" y="180">T3</text>
    <text x="730" y="200">转化到实践</text>
    <text x="730" y="220" font-size="13">实施 / 行为改变</text>
    <text x="930" y="180">T4</text>
    <text x="930" y="200">转化到人群</text>
    <text x="930" y="220" font-size="13">政策 / 公共健康</text>
  </g>

  <!-- 主路径连线与前进箭头 -->
  <line x1="65" y1="260" x2="995" y2="260" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="200" y1="260" x2="260" y2="260" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="460" y2="260" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="260" x2="660" y2="260" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="260" x2="860" y2="260" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 两座死亡之谷 -->
  <g stroke="#c0392b" stroke-width="2.5" fill="none">
    <polyline points="200,260 230,320 260,260"/>
    <polyline points="600,260 630,320 660,260"/>
  </g>
  <g fill="#c0392b" text-anchor="middle">
    <text x="230" y="345" font-size="15">第一座死亡之谷</text>
    <text x="230" y="365" font-size="13">成药性流失（T0→T1）</text>
    <text x="630" y="345" font-size="15">第二座死亡之谷</text>
    <text x="630" y="365" font-size="13">证据难落地（T2→T3）</text>
  </g>

  <!-- 反向转化 -->
  <line x1="930" y1="395" x2="130" y2="395" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRev)"/>
  <g fill="#c0392b" text-anchor="start">
    <text x="380" y="415" font-size="15">反向转化 reverse translation（临床观察 → 基础研究）</text>
  </g>
</svg>
