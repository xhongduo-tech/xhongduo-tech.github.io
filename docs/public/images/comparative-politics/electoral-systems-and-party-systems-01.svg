<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="sans-serif">
  <title>选举制度分类图</title>
  <desc>选举制度按计票方式分为多数制、比例代表制与混合制三大类，各类下列出代表性制度，底部给出杜瓦热定律。</desc>
  <rect width="800" height="470" fill="#faf9f5"/>
  <rect x="330" y="20" width="140" height="46" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">选举制度</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#333">选票如何换算成席位</text>
  <!-- branches -->
  <line x1="360" y1="66" x2="180" y2="110" stroke="#c0392b" stroke-width="2"/>
  <line x1="400" y1="66" x2="400" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="66" x2="620" y2="110" stroke="#1f6f8b" stroke-width="2"/>
  <!-- category boxes -->
  <rect x="80" y="110" width="200" height="44" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">多数制</text>
  <text x="180" y="146" text-anchor="middle" font-size="13" fill="#333">胜者得席位</text>
  <rect x="325" y="110" width="150" height="44" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">混合制</text>
  <text x="400" y="146" text-anchor="middle" font-size="13" fill="#333">多数 + 比例</text>
  <rect x="520" y="110" width="200" height="44" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="620" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f6f8b">比例代表制</text>
  <text x="620" y="146" text-anchor="middle" font-size="13" fill="#333">得票率近似等于得席率</text>
  <!-- leaf connectors -->
  <line x1="180" y1="154" x2="180" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="130" y1="154" x2="130" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="230" y1="154" x2="230" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="400" y1="154" x2="400" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="154" x2="620" y2="180" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="690" y1="154" x2="690" y2="180" stroke="#1f6f8b" stroke-width="2"/>
  <!-- leaf boxes row 1 -->
  <rect x="55" y="180" width="150" height="52" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="130" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">简单多数制</text>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#333">FPTP 一票定赢</text>
  <rect x="105" y="180" width="150" height="52" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="180" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">绝对多数制</text>
  <text x="180" y="218" text-anchor="middle" font-size="13" fill="#333">二轮决胜</text>
  <rect x="155" y="180" width="150" height="52" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="230" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">排序选择制</text>
  <text x="230" y="218" text-anchor="middle" font-size="13" fill="#333">AV / 即时复决</text>
  <rect x="310" y="180" width="180" height="52" rx="6" fill="#fff" stroke="#333"/>
  <text x="400" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">平行混合制 MMM</text>
  <text x="400" y="218" text-anchor="middle" font-size="13" fill="#333">两条赛跑各算各的</text>
  <rect x="545" y="180" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b"/>
  <text x="620" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">名单比例制</text>
  <text x="620" y="218" text-anchor="middle" font-size="13" fill="#333">闭式 / 开放名单</text>
  <rect x="615" y="180" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b"/>
  <text x="690" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">单记可让渡制</text>
  <text x="690" y="218" text-anchor="middle" font-size="13" fill="#333">STV 偏好转移</text>
  <!-- MMP note -->
  <line x1="400" y1="232" x2="400" y2="260" stroke="#333" stroke-width="2"/>
  <rect x="300" y="260" width="200" height="44" rx="6" fill="#fff" stroke="#333" stroke-dasharray="5,3"/>
  <text x="400" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">混合成员制 MMP</text>
  <text x="400" y="295" text-anchor="middle" font-size="13" fill="#333">比例席位矫正多数席位</text>
  <!-- law note -->
  <rect x="140" y="330" width="520" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">杜瓦热定律</text>
  <text x="400" y="380" text-anchor="middle" font-size="14" fill="#333">简单多数制 → 倾向于两党制</text>
  <text x="400" y="400" text-anchor="middle" font-size="14" fill="#333">比例代表制 → 倾向于多党制</text>
  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#666">机制：机械效应（席次折算）+ 心理效应（选民/政党策略调整）</text>
</svg>
