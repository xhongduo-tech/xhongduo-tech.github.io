<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>柔性制造系统（FMS）典型环式布局</title>
  <desc>环式布局：四台数控加工工作站沿 AGV 环形导引路径布置，左侧为装卸站，中央为计算机控制系统。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <!-- AGV 环形导引路径 -->
  <rect x="30" y="40" width="580" height="320" rx="120" ry="120" fill="none" stroke="#1f6f8b" stroke-width="6" stroke-dasharray="18 10"/>
  <text x="612" y="370" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="end">AGV 环形导引路径</text>
  <!-- 数控加工工作站 1-4 -->
  <g>
    <rect x="150" y="80" width="150" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="225" y="106" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">数控机床 1</text>
    <text x="225" y="126" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">加工工作站</text>
  </g>
  <g>
    <rect x="340" y="80" width="150" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="415" y="106" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">数控机床 2</text>
    <text x="415" y="126" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">加工工作站</text>
  </g>
  <g>
    <rect x="150" y="260" width="150" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="225" y="286" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">数控机床 3</text>
    <text x="225" y="306" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">加工工作站</text>
  </g>
  <g>
    <rect x="340" y="260" width="150" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="415" y="286" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">数控机床 4</text>
    <text x="415" y="306" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">加工工作站</text>
  </g>
  <!-- 装卸站 -->
  <g>
    <rect x="60" y="160" width="110" height="70" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="115" y="191" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="middle">装卸站</text>
    <text x="115" y="211" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">上料 / 下料</text>
  </g>
  <!-- 中央计算机 -->
  <g>
    <rect x="260" y="165" width="120" height="70" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="320" y="196" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">中央计算机</text>
    <text x="320" y="216" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">调度与控制</text>
  </g>
  <!-- 连线：计算机到各站 -->
  <g stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="320" y1="165" x2="225" y2="140"/>
    <line x1="320" y1="165" x2="415" y2="140"/>
    <line x1="320" y1="235" x2="225" y2="260"/>
    <line x1="320" y1="235" x2="415" y2="260"/>
    <line x1="260" y1="200" x2="170" y2="200"/>
  </g>
  <!-- AGV 小车 -->
  <g>
    <rect x="520" y="185" width="46" height="30" fill="#1f6f8b" rx="4"/>
    <text x="543" y="204" font-family="sans-serif" font-size="14" fill="#faf9f5" text-anchor="middle">AGV</text>
    <path d="M 556 200 L 576 200 M 570 194 L 576 200 L 570 206" fill="none" stroke="#faf9f5" stroke-width="2"/>
  </g>
</svg>
