<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420">
  <title>ISA-95 自动化金字塔与数据流向</title>
  <desc>五层金字塔：第4层ERP、第3层MES、第2层SCADA、第1层PLC、第0层现场设备；数据双向流动。</desc>
  <rect x="0" y="0" width="480" height="420" fill="#faf9f5"/>
  <!-- 金字塔分层：自上而下逐层变宽 -->
  <polygon points="240,20 400,100 80,100" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <polygon points="240,120 425,200 55,200" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="240,220 450,300 30,300" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="240,320 470,400 10,400" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- 层标签 -->
  <text x="240" y="55" font-family="sans-serif" font-size="17" fill="#faf9f5" text-anchor="middle">第4层 · ERP 企业资源计划</text>
  <text x="240" y="80" font-family="sans-serif" font-size="13" fill="#faf9f5" text-anchor="middle">订单 · 财务 · 长期计划</text>
  <text x="240" y="150" font-family="sans-serif" font-size="17" fill="#c0392b" text-anchor="middle">第3层 · MES 制造执行系统</text>
  <text x="240" y="175" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">工单执行 · 追溯 · 质量 · 调度</text>
  <text x="240" y="250" font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle">第2层 · SCADA 数据采集与监控</text>
  <text x="240" y="275" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">实时监视 · 报警 · 历史数据</text>
  <text x="240" y="350" font-family="sans-serif" font-size="17" fill="#1f6f8b" text-anchor="middle">第1层 · PLC / DCS 控制器</text>
  <text x="240" y="375" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">逻辑控制 · 闭环调节 · 顺序控制</text>
  <text x="240" y="412" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">第0层 · 传感器 / 执行器 / 现场设备</text>
  <!-- 双向数据流箭头 -->
  <g stroke="#1f6f8b" stroke-width="2.5">
    <path d="M 120 108 L 120 116 L 150 116" fill="none"/>
    <path d="M 150 116 L 120 116" fill="none"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="80" y1="200" x2="150" y2="200"/>
    <line x1="150" y1="200" x2="80" y2="200"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="2.5">
    <line x1="70" y1="300" x2="140" y2="300"/>
    <line x1="140" y1="300" x2="70" y2="300"/>
  </g>
  <text x="30" y="60" font-family="sans-serif" font-size="14" fill="#1f6f8b">计划下传</text>
  <text x="30" y="215" font-family="sans-serif" font-size="14" fill="#1f6f8b">数据上传</text>
  <text x="30" y="315" font-family="sans-serif" font-size="14" fill="#1f6f8b">双向流动</text>
  <!-- IIoT 侧接线：第0层直连云/边缘 -->
  <line x1="400" y1="392" x2="455" y2="392" stroke="#c0392b" stroke-width="2"/>
  <text x="462" y="396" font-family="sans-serif" font-size="13" fill="#c0392b">IIoT / 边缘直连</text>
</svg>
