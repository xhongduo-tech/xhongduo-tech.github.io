<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title desc">
  <title id="title">正弦脉宽调制（SPWM）的产生原理</title>
  <desc id="desc">上图为高频三角载波与低频正弦参考波逐点比较；下图为比较得到的双极性 PWM 输出脉冲串，脉冲宽度正比于正弦参考的瞬时值，其基波即期望的正弦电压。</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <!-- panel divider -->
  <line x1="30" y1="215" x2="610" y2="215" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Panel 1: carrier + sine -->
  <g font-family="sans-serif" fill="#333" font-size="15">
    <text x="34" y="34">① 三角载波 <tspan fill="#c0392b" font-weight="bold">v_tri</tspan> 与正弦参考 <tspan fill="#1f6f8b" font-weight="bold">v*</tspan> 逐点比较</text>
  </g>
  <polyline points="40,80 75,160 110,80 145,160 180,80 215,160 250,80 285,160 320,80 355,160 390,80 425,160 460,80 495,160 530,80 565,160 600,80" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <polyline points="40,120 60,111.8 80,104.4 100,98.9 120,95.6 133,95 140,95.2 160,97.5 180,102.3 200,109.2 220,117.3 227,120 240,125.4 260,132.9 280,139.3 300,143.7 320,145 340,143.7 360,139.8 380,132.8 400,124.3 414,120 420,118 440,109.2 460,102.3 480,97.4 500,95.2 507,95 520,95.8 540,98.8 560,104.1 580,111.3 600,116.5" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <line x1="40" y1="120" x2="600" y2="120" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="612" y="124" font-family="sans-serif" font-size="14" fill="#333">0</text>
  <line x1="227" y1="180" x2="227" y2="348" stroke="#333" stroke-width="1.2" stroke-dasharray="5,5"/>

  <!-- Panel 2: PWM output -->
  <g font-family="sans-serif" fill="#333" font-size="15">
    <text x="34" y="244">② 输出脉冲串：v* &gt; v_tri 时输出 +V_d，否则输出 −V_d，脉宽随正弦变化</text>
  </g>
  <!-- -Vd level line -->
  <line x1="40" y1="350" x2="600" y2="350" stroke="#333" stroke-width="1.6"/>
  <g fill="#1f6f8b">
    <rect x="54" y="250" width="48" height="100"/>
    <rect x="117" y="250" width="28" height="100"/>
    <rect x="145" y="250" width="26" height="100"/>
    <rect x="192" y="250" width="23" height="100"/>
    <rect x="215" y="250" width="12" height="100"/>
    <rect x="276" y="250" width="9" height="100"/>
    <rect x="285" y="250" width="7" height="100"/>
    <rect x="347" y="250" width="8" height="100"/>
    <rect x="355" y="250" width="16" height="100"/>
    <rect x="410" y="250" width="15" height="100"/>
    <rect x="425" y="250" width="26" height="100"/>
    <rect x="478" y="250" width="17" height="100"/>
    <rect x="495" y="250" width="28" height="100"/>
    <rect x="548" y="250" width="17" height="100"/>
  </g>
  <line x1="250" y1="250" x2="600" y2="250" stroke="#999" stroke-width="1.4"/>
  <line x1="250" y1="350" x2="600" y2="350" stroke="#999" stroke-width="1.4"/>
  <text x="606" y="256" font-family="sans-serif" font-size="14" fill="#333">+V_d</text>
  <text x="606" y="356" font-family="sans-serif" font-size="14" fill="#333">−V_d</text>
  <!-- fundamental dashed sine -->
  <polyline points="40,300 60,282.6 80,247.2 100,251.7 120,237.5 140,253.6 160,269.5 180,255.8 200,282.2 220,307.9 227,300 240,293.1 260,322.8 280,348.3 300,356.3 320,362.5 340,356.3 360,349.6 380,326.2 400,312.8 414,300 420,294.9 440,275.8 460,255.8 480,241.6 500,238.2 507,237.5 520,240.5 540,256.2 560,275.8 580,292.2 600,291.2" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="34" y="392" font-family="sans-serif" font-size="15" fill="#333">③ 基波（虚线）近似正弦，其幅值为 m_a·V_d——正弦参考的形状被"搬"到了输出上</text>
</svg>
