<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">降压变换器（Buck）主电路示意图</title>
  <desc id="desc">直流源 V_d 经开关 S 与二极管 D 斩波，电感 L 平抑电流，电容 C 与负载 R 并联滤波，输出平均电压 V_o 等于占空比 D 乘以 V_d。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2.5" fill="none">
    <!-- top rail -->
    <line x1="70" y1="139" x2="70" y2="80"/>
    <line x1="70" y1="80" x2="150" y2="80"/>
    <!-- switch S -->
    <line x1="150" y1="80" x2="150" y2="130"/>
    <line x1="150" y1="130" x2="168" y2="160"/>
    <line x1="150" y1="160" x2="150" y2="200"/>
    <!-- inductor L -->
    <line x1="150" y1="200" x2="240" y2="200"/>
    <path d="M240,200 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" />
    <line x1="320" y1="200" x2="400" y2="200"/>
    <!-- capacitor C -->
    <line x1="400" y1="200" x2="400" y2="215"/>
    <line x1="392" y1="215" x2="408" y2="215"/>
    <line x1="392" y1="240" x2="408" y2="240"/>
    <line x1="400" y1="240" x2="400" y2="250"/>
    <!-- load R -->
    <line x1="400" y1="200" x2="445" y2="200"/>
    <rect x="445" y="170" width="32" height="60"/>
    <line x1="477" y1="200" x2="540" y2="200"/>
    <!-- output arrow -->
    <line x1="540" y1="200" x2="585" y2="200"/>
    <line x1="576" y1="192" x2="585" y2="200"/>
    <line x1="576" y1="208" x2="585" y2="200"/>
    <!-- diode D -->
    <line x1="150" y1="200" x2="150" y2="214"/>
    <polygon points="150,214 142,228 158,228" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>
    <line x1="142" y1="232" x2="158" y2="232"/>
    <line x1="150" y1="232" x2="150" y2="250"/>
    <!-- source -->
    <circle cx="70" cy="165" r="26" fill="#faf9f5"/>
    <line x1="70" y1="139" x2="70" y2="191"/>
    <line x1="70" y1="191" x2="70" y2="250"/>
    <!-- bottom rail -->
    <line x1="70" y1="250" x2="540" y2="250"/>
    <!-- ground -->
    <line x1="110" y1="250" x2="110" y2="260"/>
    <line x1="100" y1="266" x2="120" y2="266"/>
    <line x1="105" y1="272" x2="115" y2="272"/>
  </g>
  <g font-family="sans-serif" fill="#333" font-size="16">
    <text x="24" y="174" font-weight="bold">V</text>
    <text x="38" y="174" font-weight="bold">d</text>
    <text x="86" y="150" font-size="15">+</text>
    <text x="86" y="186" font-size="15">−</text>
    <text x="114" y="124" font-weight="bold">S</text>
    <text x="258" y="182" font-weight="bold">L</text>
    <text x="420" y="232" font-weight="bold">C</text>
    <text x="452" y="160" font-weight="bold">R</text>
    <text x="590" y="188" font-weight="bold">V</text>
    <text x="604" y="188" font-weight="bold">o</text>
    <text x="100" y="242" font-weight="bold">D</text>
  </g>
  <g font-family="sans-serif" fill="#c0392b" font-size="15">
    <text x="198" y="78">斩波开关 S（MOSFET / IGBT，由 PWM 驱动）</text>
    <text x="258" y="268">自由轮流二极管 D：开关关断时续流，保证电感电流连续</text>
  </g>
</svg>
