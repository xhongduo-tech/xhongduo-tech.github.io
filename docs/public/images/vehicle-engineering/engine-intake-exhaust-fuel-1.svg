<svg viewBox="0 0 400 430" width="400" height="430" xmlns="http://www.w3.org/2000/svg">
  <title>四冲程汽油机配气相位图</title>
  <desc>以曲轴转角圆环表示进排气门开启时刻：进气门在上止点前 10° 开启、下止点后 50° 关闭，排气门在下止点前 50° 开启、上止点后 10° 关闭，两弧在上止点附近重叠约 20°，形成气门重叠角。</desc>
  <rect width="400" height="430" fill="#faf9f5"/>
  <circle cx="200" cy="210" r="150" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="210" r="6" fill="#333"/>
  <!-- 进气门开启弧：上止点前10°→下止点后50°，青 -->
  <path d="M 174.0 62.3 A 150 150 0 1 1 85.1 306.4" fill="none" stroke="#1f6f8b" stroke-width="10" opacity="0.85"/>
  <!-- 排气门开启弧：下止点前50°→上止点后10°，红 -->
  <path d="M 314.9 306.4 A 150 150 0 1 1 226.0 62.3" fill="none" stroke="#c0392b" stroke-width="10" opacity="0.85"/>
  <!-- TDC / BDC 标记 -->
  <line x1="200" y1="55" x2="200" y2="365" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="200" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">上止点（TDC）</text>
  <text x="200" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">下止点（BDC）</text>
  <!-- 气门重叠标注 -->
  <text x="200" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">气门重叠角 ≈ 20°</text>
  <!-- 各开闭时刻标注 -->
  <text x="158" y="84" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f6f8b">进气门开：上止点前 10°</text>
  <text x="66" y="296" text-anchor="start" font-family="sans-serif" font-size="13" fill="#1f6f8b">进气门关：下止点后 50°</text>
  <text x="334" y="296" text-anchor="end" font-family="sans-serif" font-size="13" fill="#c0392b">排气门开：下止点前 50°</text>
  <text x="242" y="84" text-anchor="start" font-family="sans-serif" font-size="13" fill="#c0392b">排气门关：上止点后 10°</text>
  <!-- 图例 -->
  <rect x="60" y="368" width="16" height="10" fill="#1f6f8b" opacity="0.85"/>
  <text x="84" y="378" font-family="sans-serif" font-size="13" fill="#333">进气门开启期</text>
  <rect x="210" y="368" width="16" height="10" fill="#c0392b" opacity="0.85"/>
  <text x="234" y="378" font-family="sans-serif" font-size="13" fill="#333">排气门开启期</text>
</svg>
