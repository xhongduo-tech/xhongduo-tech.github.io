<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <title>花剑、重剑、佩剑有效部位对比</title>
  <desc>三个剑种的人体有效部位对比：花剑仅躯干，重剑全身，佩剑腰部以上含手臂与头部</desc>
  <rect width="720" height="420" fill="#faf9f5"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">三大剑种有效部位对比</text>
  <text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">白 = 有效部位　灰 = 无效部位</text>

  <!-- 花剑：躯干有效 -->
  <g transform="translate(60, 80)">
    <text x="90" y="-8" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">花剑（Foil）</text>
    <ellipse cx="90" cy="78" rx="30" ry="34" fill="#c9c9c9" stroke="#333" stroke-width="1.5"/>
    <rect x="62" y="110" width="56" height="42" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="40" y="150" width="26" height="44" fill="#c9c9c9" stroke="#333" stroke-width="1.5"/>
    <rect x="114" y="150" width="26" height="44" fill="#c9c9c9" stroke="#333" stroke-width="1.5"/>
    <rect x="60" y="192" width="60" height="48" fill="#c9c9c9" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">躯干</text>
    <text x="90" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">臂、腿、头无效</text>
  </g>

  <!-- 重剑：全身有效 -->
  <g transform="translate(270, 80)">
    <text x="90" y="-8" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">重剑（Épée）</text>
    <ellipse cx="90" cy="78" rx="30" ry="34" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="62" y="110" width="56" height="42" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="40" y="150" width="26" height="44" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="114" y="150" width="26" height="44" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="60" y="192" width="60" height="48" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b" font-weight="bold">全身皆为有效部位</text>
  </g>

  <!-- 佩剑：腰部以上有效 -->
  <g transform="translate(480, 80)">
    <text x="90" y="-8" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">佩剑（Sabre）</text>
    <ellipse cx="90" cy="78" rx="30" ry="34" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="62" y="110" width="56" height="42" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="40" y="150" width="26" height="44" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="114" y="150" width="26" height="44" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
    <rect x="60" y="192" width="60" height="48" fill="#c9c9c9" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">腰线以上</text>
    <text x="90" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">腿无效，允许劈与刺</text>
  </g>
</svg>
