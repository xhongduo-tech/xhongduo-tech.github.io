<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
  <title>剑道布局与关键线位</title>
  <desc>14 米标准剑道俯视图：中心线、两条中位线、两条警告线、两条端线</desc>
  <rect width="720" height="260" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">标准剑道（Piste）俯视图</text>

  <!-- 剑道主体 -->
  <rect x="30" y="60" width="660" height="90" fill="#e8e4da" stroke="#333" stroke-width="2"/>

  <!-- 中心线 -->
  <line x1="360" y1="60" x2="360" y2="150" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="360" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">中心线</text>

  <!-- 中位线 (2m from center, at 300 & 420) -->
  <line x1="300" y1="60" x2="300" y2="150" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="420" y1="60" x2="420" y2="150" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="300" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">中位线</text>
  <text x="420" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">中位线</text>

  <!-- 警告线 (2m from end, at 30+... wait: end line at 30 and 690; warning 2m from end = 150 and 570) -->
  <line x1="150" y1="60" x2="150" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="570" y1="60" x2="570" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="150" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">警告线</text>
  <text x="570" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">警告线</text>

  <!-- 端线 -->
  <line x1="30" y1="55" x2="30" y2="155" stroke="#000" stroke-width="4"/>
  <line x1="690" y1="55" x2="690" y2="155" stroke="#000" stroke-width="4"/>
  <text x="30" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#000">端线</text>
  <text x="690" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#000">端线</text>

  <!-- 尺寸标注 -->
  <text x="360" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">全长 14 米　宽 1.5–2 米　金属导电表面</text>

  <!-- 两个运动员 -->
  <circle cx="330" cy="105" r="14" fill="#c0392b" opacity="0.85"/>
  <circle cx="390" cy="105" r="14" fill="#1f6f8b" opacity="0.85"/>
  <text x="330" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">A</text>
  <text x="390" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">B</text>
</svg>
