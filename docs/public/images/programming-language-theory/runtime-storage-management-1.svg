<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="sans-serif">
  <title>程序虚拟地址空间的经典布局</title>
  <desc>从高地址到低地址依次为栈、空闲区、堆、静态数据与代码段，栈向下、堆向上增长。</desc>
  <rect x="0" y="0" width="520" height="640" fill="#faf9f5"/>
  <text x="20" y="40" font-size="16" fill="#333" font-weight="bold">高地址</text>
  <text x="20" y="600" font-size="16" fill="#333" font-weight="bold">低地址</text>

  <!-- 栈 -->
  <rect x="150" y="50" width="240" height="180" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="170" y="72" font-size="14" fill="#1f6f8b" font-weight="bold">栈（stack）</text>
  <rect x="170" y="84" width="200" height="34" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="270" y="105" font-size="13" fill="#333" text-anchor="middle">活动记录 3（较早）</text>
  <rect x="170" y="126" width="200" height="34" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="270" y="147" font-size="13" fill="#333" text-anchor="middle">活动记录 2</text>
  <rect x="170" y="168" width="200" height="34" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="189" font-size="13" fill="#333" text-anchor="middle">活动记录 1（当前调用）</text>
  <path d="M402 80 L422 80 L422 230 L402 230" stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#arrowDown)"/>
  <text x="428" y="160" font-size="13" fill="#1f6f8b">向下增长</text>

  <!-- 空闲区 -->
  <rect x="150" y="240" width="240" height="56" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="272" font-size="13" fill="#666" text-anchor="middle">空闲区（栈与堆共享）</text>

  <!-- 堆 -->
  <rect x="150" y="306" width="240" height="180" fill="#f7e8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="328" font-size="14" fill="#c0392b" font-weight="bold">堆（heap）</text>
  <rect x="170" y="340" width="200" height="34" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="270" y="361" font-size="13" fill="#333" text-anchor="middle">对象 C（闭包 / 新对象）</text>
  <rect x="170" y="382" width="200" height="34" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="270" y="403" font-size="13" fill="#333" text-anchor="middle">对象 B</text>
  <rect x="170" y="424" width="200" height="34" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="270" y="445" font-size="13" fill="#333" text-anchor="middle">对象 A（较早）</text>
  <path d="M402 306 L422 306 L422 470 L402 470" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowUp)"/>
  <text x="428" y="392" font-size="13" fill="#c0392b">向上增长</text>

  <!-- 静态数据 -->
  <rect x="150" y="496" width="240" height="48" fill="#eee" stroke="#333" stroke-width="2"/>
  <text x="270" y="525" font-size="13" fill="#333" text-anchor="middle">静态数据（全局变量 / 常量）</text>

  <!-- 代码段 -->
  <rect x="150" y="554" width="240" height="48" fill="#eee" stroke="#333" stroke-width="2"/>
  <text x="270" y="583" font-size="13" fill="#333" text-anchor="middle">代码段（text：机器指令）</text>

  <defs>
    <marker id="arrowDown" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowUp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
