<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>右足足底反射区示意</title>
  <desc>右足足底概略分区：趾区对应头面，前掌对应心肺部，足弓对应胃肠部，足跟对应肾与生殖区。</desc>
  <rect x="0" y="0" width="420" height="320" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="#fdf6ec">
    <path d="M 205 290
             C 168 288, 142 268, 132 232
             C 122 198, 118 160, 122 120
             C 126 84, 140 52, 164 34
             C 182 21, 206 16, 230 22
             C 252 28, 268 46, 276 74
             C 284 102, 286 140, 282 180
             C 278 220, 266 258, 244 278
             C 232 289, 218 292, 205 290 Z"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4" fill="none">
    <path d="M 120 92 C 160 88, 210 86, 278 92"/>
    <path d="M 126 150 C 170 146, 220 146, 276 150"/>
    <path d="M 132 210 C 175 206, 225 206, 270 210"/>
  </g>
  <g fill="#c0392b" font-size="16" font-weight="bold">
    <text x="300" y="70">趾区</text>
    <text x="300" y="128">前掌区</text>
    <text x="300" y="188">足弓区</text>
    <text x="300" y="248">足跟区</text>
  </g>
  <g fill="#333" font-size="14">
    <text x="300" y="92">头·脑·眼·耳</text>
    <text x="300" y="150">心·肺</text>
    <text x="300" y="210">胃·脾·肠</text>
    <text x="300" y="270">肾·膀胱·生殖</text>
  </g>
  <g stroke="#c0392b" stroke-width="1" fill="none">
    <path d="M 150 66 L 296 66"/>
    <path d="M 150 122 L 296 122"/>
    <path d="M 152 182 L 296 182"/>
    <path d="M 160 242 L 296 242"/>
  </g>
</svg>
