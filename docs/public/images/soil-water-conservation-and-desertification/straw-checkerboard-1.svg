<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <title>草方格沙障：平面布置与断面结构</title>
  <desc>上图：草方格沙障的平面网格与主风方向，方格边长 1 m；下图：断面结构，稻草露出沙面与压入沙中各约 15–20 cm。</desc>
  <rect width="640" height="440" fill="#faf9f5"/>

  <!-- 图1：平面布置 -->
  <text x="20" y="30" font-size="16" fill="#333" font-weight="bold">平面布置（俯视）</text>

  <!-- 主风向箭头 -->
  <g stroke="#c0392b" stroke-width="3" fill="#c0392b">
    <line x1="20" y1="62" x2="88" y2="62"/>
    <polygon points="94,62 81,55 81,69"/>
    <line x1="20" y1="96" x2="88" y2="96"/>
    <polygon points="94,96 81,89 81,103"/>
    <line x1="20" y1="130" x2="88" y2="130"/>
    <polygon points="94,130 81,123 81,137"/>
  </g>
  <text x="22" y="160" font-size="13" fill="#c0392b">主风向</text>

  <defs>
    <pattern id="strawGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="16" x2="16" y2="0" stroke="#b08d3e" stroke-width="2"/>
      <line x1="4" y1="16" x2="16" y2="4" stroke="#c9a84f" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- 方格网格：6列 x 4行，格 52 -->
  <g fill="url(#strawGrid)" stroke="#8a7a55" stroke-width="1.5">
    <rect x="120" y="45" width="52" height="52"/>
    <rect x="176" y="45" width="52" height="52"/>
    <rect x="232" y="45" width="52" height="52"/>
    <rect x="288" y="45" width="52" height="52"/>
    <rect x="344" y="45" width="52" height="52"/>
    <rect x="400" y="45" width="52" height="52"/>
    <rect x="120" y="101" width="52" height="52"/>
    <rect x="176" y="101" width="52" height="52"/>
    <rect x="232" y="101" width="52" height="52"/>
    <rect x="288" y="101" width="52" height="52"/>
    <rect x="344" y="101" width="52" height="52"/>
    <rect x="400" y="101" width="52" height="52"/>
    <rect x="120" y="157" width="52" height="52"/>
    <rect x="176" y="157" width="52" height="52"/>
    <rect x="232" y="157" width="52" height="52"/>
    <rect x="288" y="157" width="52" height="52"/>
    <rect x="344" y="157" width="52" height="52"/>
    <rect x="400" y="157" width="52" height="52"/>
    <rect x="120" y="213" width="52" height="52"/>
    <rect x="176" y="213" width="52" height="52"/>
    <rect x="232" y="213" width="52" height="52"/>
    <rect x="288" y="213" width="52" height="52"/>
    <rect x="344" y="213" width="52" height="52"/>
    <rect x="400" y="213" width="52" height="52"/>
  </g>

  <!-- 标注方格尺寸 -->
  <line x1="120" y1="285" x2="172" y2="285" stroke="#1f6f8b" stroke-width="2"/>
  <polygon points="172,285 163,281 163,289" fill="#1f6f8b"/>
  <line x1="120" y1="288" x2="120" y2="270" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="126" y="300" font-size="14" fill="#1f6f8b">方格边长 1 m × 1 m</text>

  <!-- 图2：断面结构 -->
  <text x="20" y="335" font-size="16" fill="#333" font-weight="bold">断面结构（侧视）</text>

  <!-- 沙体 -->
  <path d="M20,392 L20,428 L620,428 L620,392 Q560,386 500,390 Q440,396 380,389 Q320,383 260,390 Q200,397 140,391 Q80,386 20,392 Z" fill="#e8d5a3"/>
  <!-- 沙面线 -->
  <path d="M20,392 Q80,386 140,391 Q200,397 260,390 Q320,383 380,389 Q440,396 500,390 Q560,386 620,392" fill="none" stroke="#8a7a55" stroke-width="2"/>

  <!-- 稻草束：露出+埋入 -->
  <g fill="#c9a84f" stroke="#a07f2e" stroke-width="1">
    <rect x="60" y="368" width="12" height="46"/>
    <rect x="95" y="372" width="12" height="42"/>
    <rect x="130" y="365" width="12" height="49"/>
    <rect x="165" y="370" width="12" height="44"/>
    <rect x="200" y="366" width="12" height="48"/>
    <rect x="235" y="371" width="12" height="43"/>
    <rect x="270" y="367" width="12" height="47"/>
    <rect x="305" y="372" width="12" height="42"/>
    <rect x="340" y="365" width="12" height="49"/>
    <rect x="375" y="370" width="12" height="44"/>
    <rect x="410" y="366" width="12" height="48"/>
    <rect x="445" y="371" width="12" height="43"/>
    <rect x="480" y="367" width="12" height="47"/>
    <rect x="515" y="372" width="12" height="42"/>
    <rect x="550" y="365" width="12" height="49"/>
  </g>

  <!-- 露出部分标注 -->
  <line x1="550" y1="345" x2="570" y2="345" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="570" y1="345" x2="578" y2="345" stroke="#1f6f8b" stroke-width="2"/>
  <text x="578" y="349" font-size="13" fill="#1f6f8b">露出沙面 15–20 cm</text>

  <!-- 埋入部分标注 -->
  <line x1="550" y1="400" x2="570" y2="400" stroke="#c0392b" stroke-width="2"/>
  <text x="578" y="404" font-size="13" fill="#c0392b">压入沙中 15–20 cm</text>

  <!-- 沙面标注 -->
  <text x="86" y="385" font-size="13" fill="#8a7a55">沙面</text>

  <!-- 主风向（断面） -->
  <g stroke="#c0392b" stroke-width="2.5" fill="#c0392b">
    <line x1="20" y1="352" x2="70" y2="352"/>
    <polygon points="76,352 66,347 66,357"/>
  </g>
  <text x="20" y="344" font-size="12" fill="#c0392b">风</text>
</svg>
