<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" font-size="14">
  <title>蛛网模型的价格调整路径</title>
  <desc>离散时间价格动态：从期初价格出发，在供给曲线与需求曲线之间来回摆动并收敛到均衡价格的蛛网螺旋路径。</desc>
  <rect width="400" height="320" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="40" y1="280" x2="370" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="280" x2="40" y2="30" stroke="#333" stroke-width="1.5"/>
  <polygon points="370,280 358,275 358,285" fill="#333"/>
  <polygon points="40,30 35,42 45,42" fill="#333"/>
  <text x="352" y="300" fill="#333">数量 Q</text>
  <text x="14" y="36" fill="#333">价格 P</text>
  <!-- demand: P = 10 - Q -->
  <line x1="40" y1="40" x2="360" y2="280" stroke="#c0392b" stroke-width="2"/>
  <text x="296" y="70" fill="#c0392b">需求 D</text>
  <!-- supply: P = 2.5 + 1.25 Q -->
  <line x1="40" y1="220" x2="232" y2="40" stroke="#1f6f8b" stroke-width="2"/>
  <text x="196" y="52" fill="#1f6f8b">供给 S</text>
  <!-- equilibrium -->
  <line x1="146.7" y1="280" x2="146.7" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="40" y1="120" x2="146.7" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="146.7" cy="120" r="4.5" fill="#333"/>
  <text x="156" y="112" fill="#333">均衡 E</text>
  <!-- cobweb spiral -->
  <polyline points="40,208 52.8,208 52.8,49.6 221.8,49.6 221.8,176.3 86.6,176.3 86.6,75 194.7,75 194.7,156"
             fill="none" stroke="#333" stroke-width="1.4"/>
  <circle cx="40" cy="208" r="3" fill="#333"/>
  <text x="8" y="205" fill="#333">P₀</text>
  <text x="44" y="120" fill="#333">P*</text>
  <text x="150" y="296" fill="#333">Q*</text>
</svg>
