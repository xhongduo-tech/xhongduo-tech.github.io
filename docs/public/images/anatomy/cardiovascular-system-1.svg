<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">体循环与肺循环示意图</title>
  <desc id="desc">心脏右侧泵出缺氧血经肺动脉入肺，在肺泡交换氧气后经肺静脉回左心；左心泵出富氧血经主动脉分布全身，回流的缺氧血经上、下腔静脉回右心。红色为富氧血，青色为缺氧血。</desc>
  <rect width="640" height="440" fill="#faf9f5" />
  <text x="320" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">体循环与肺循环（前视图）</text>

  <!-- 心脏 -->
  <rect x="70" y="190" width="90" height="150" fill="#1f6f8b" opacity="0.55" stroke="#1f6f8b" stroke-width="2" rx="10" />
  <text x="115" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">右心</text>
  <text x="115" y="290" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#fff">RA/RV</text>
  <rect x="160" y="190" width="90" height="150" fill="#c0392b" opacity="0.65" stroke="#c0392b" stroke-width="2" rx="10" />
  <text x="205" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">左心</text>
  <text x="205" y="290" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#fff">LA/LV</text>
  <text x="160" y="370" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">心脏</text>

  <!-- 肺循环（缺氧，青色）：右心 → 肺动脉 → 肺 → 肺静脉 → 左心 -->
  <path d="M 130 190 C 130 120 250 110 330 110 L 330 120" fill="none" stroke="#1f6f8b" stroke-width="3.5" />
  <path d="M 330 122 L 334 110 L 326 110 Z" fill="#1f6f8b" />
  <text x="200" y="95" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">肺动脉（缺氧血）</text>

  <!-- 肺（两个） -->
  <ellipse cx="360" cy="95" rx="52" ry="55" fill="#e8f1f4" stroke="#1f6f8b" stroke-width="2" />
  <text x="360" y="92" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1f6f8b">右肺</text>
  <text x="360" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f6f8b">（气体交换）</text>
  <ellipse cx="480" cy="95" rx="52" ry="55" fill="#e8f1f4" stroke="#1f6f8b" stroke-width="2" />
  <text x="480" y="92" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1f6f8b">左肺</text>
  <text x="480" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f6f8b">（气体交换）</text>

  <!-- 肺静脉（富氧，红色）回左心 -->
  <path d="M 390 145 C 360 200 250 185 210 195" fill="none" stroke="#c0392b" stroke-width="3.5" />
  <path d="M 212 191 L 208 200 L 220 195 Z" fill="#c0392b" />
  <text x="320" y="195" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">肺静脉（富氧血）</text>

  <!-- 体循环（富氧，红色）：左心 → 主动脉 → 全身 → 腔静脉 → 右心 -->
  <path d="M 220 190 C 250 100 320 60 470 60 L 470 95" fill="none" stroke="#c0392b" stroke-width="3.5" />
  <path d="M 466 92 L 474 92 L 470 84 Z" fill="#c0392b" />
  <text x="360" y="45" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">主动脉（富氧血）</text>

  <!-- 全身组织 -->
  <ellipse cx="470" cy="200" rx="90" ry="65" fill="#f7f3ea" stroke="#c0392b" stroke-width="2" />
  <text x="470" y="195" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">全身组织</text>
  <text x="470" y="213" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555">（氧与养分消耗）</text>

  <!-- 主动脉继续下行到组织 -->
  <path d="M 470 135 L 470 175" fill="none" stroke="#c0392b" stroke-width="3" />

  <!-- 腔静脉（缺氧，青色）回右心 -->
  <path d="M 430 260 C 330 340 200 350 120 345" fill="none" stroke="#1f6f8b" stroke-width="3.5" />
  <path d="M 124 349 L 118 340 L 114 352 Z" fill="#1f6f8b" />
  <text x="300" y="345" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">上/下腔静脉（缺氧血）</text>

  <!-- 图例 -->
  <circle cx="120" cy="410" r="8" fill="#c0392b" />
  <text x="134" y="414" font-family="sans-serif" font-size="14" fill="#333">富氧血（动脉血）</text>
  <circle cx="320" cy="410" r="8" fill="#1f6f8b" />
  <text x="334" y="414" font-family="sans-serif" font-size="14" fill="#333">缺氧血（静脉血）</text>
</svg>
