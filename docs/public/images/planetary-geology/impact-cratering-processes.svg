<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>撞击坑形成过程剖面示意图</title>
  <desc>剖面展示撞击体高速撞击后，冲击波传播、挖坑阶段形成瞬态坑与抛出物、以及简单坑与复杂坑（中央峰）的最终形态。</desc>
  <rect width="760" height="440" fill="#faf9f5"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">撞击成坑过程（剖面示意）</text>
  <!-- 阶段一：冲击 -->
  <text x="40" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">① 冲击阶段</text>
  <line x1="70" y1="110" x2="130" y2="110" stroke="#c0392b" stroke-width="2"/>
  <polygon points="130,98 130,122 158,110" fill="#333"/>
  <text x="170" y="104" font-family="sans-serif" font-size="13" fill="#c0392b">v ≈ 10–40 km/s</text>
  <circle cx="165" cy="130" r="8" fill="#333"/>
  <text x="180" y="134" font-family="sans-serif" font-size="13" fill="#333">撞击体</text>
  <path d="M30,150 Q120,138 200,152" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <path d="M40,170 Q130,158 215,172" stroke="#1f6f8b" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="30" y="192" font-family="sans-serif" font-size="13" fill="#555">冲击波向靶体内部传播</text>
  <!-- 阶段二：挖坑 -->
  <text x="320" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">② 挖坑阶段</text>
  <path d="M300,110 Q360,180 420,110 Q360,130 300,110 Z" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <path d="M340,138 Q360,168 380,138" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="400" y="150" font-family="sans-serif" font-size="13" fill="#c0392b">瞬态坑</text>
  <text x="280" y="196" font-family="sans-serif" font-size="13" fill="#555">抛出物（ejecta）</text>
  <path d="M300,110 L290,60 M420,110 L430,60" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M290,60 L250,45 M430,60 L470,45" stroke="#999" stroke-width="1"/>
  <!-- 阶段三：最终形态 -->
  <text x="560" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">③ 最终形态</text>
  <path d="M520,110 Q560,175 600,110 L600,200 L520,200 Z" fill="#d9b57f" stroke="#333" stroke-width="1.5"/>
  <path d="M540,145 Q560,160 580,145" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">简单坑：碗状、唇边隆起</text>
  <!-- 复杂坑插图 -->
  <path d="M520,270 Q540,320 520,340 Q560,350 600,340 Q580,320 600,270 Z" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <path d="M550,308 Q560,290 570,308" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">复杂坑：中央峰 + 平坦坑底</text>
  <text x="560" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">月球上简单→复杂转变坑径约 15–20 km</text>
  <!-- 底部 -->
  <text x="380" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">抛出物、溅射覆盖层与熔融玻璃组成坑周「溅射毯」，定年与地质填图都依赖它们。</text>
</svg>
