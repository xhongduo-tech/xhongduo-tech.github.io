<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>风沙跃移与沙丘形态示意图</title>
  <desc>上图展示风沙跃移：颗粒沿抛物线轨迹跳跃前进并撞击起跳更多颗粒；下图对比沙丘两种基本形态：横向沙丘（垂直于风向）与新月形沙丘（两翼顺风弯曲）。</desc>
  <rect width="760" height="440" fill="#faf9f5"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">风沙跃移（saltation）与沙丘形态</text>
  <!-- 风向箭头 -->
  <line x1="30" y1="60" x2="200" y2="60" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrWind)"/>
  <text x="60" y="52" font-family="sans-serif" font-size="14" fill="#1f6f8b">风向 →</text>
  <!-- 跃移轨迹 -->
  <path d="M60,150 Q95,60 135,150" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <circle cx="95" cy="75" r="4" fill="#c0392b"/>
  <circle cx="60" cy="150" r="4" fill="#333"/>
  <path d="M120,150 Q155,60 195,150" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <circle cx="155" cy="75" r="4" fill="#c0392b"/>
  <path d="M180,150 Q215,60 255,150" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <circle cx="215" cy="75" r="4" fill="#c0392b"/>
  <!-- 地表 -->
  <line x1="20" y1="150" x2="720" y2="150" stroke="#333" stroke-width="2"/>
  <text x="620" y="140" font-family="sans-serif" font-size="13" fill="#c0392b">颗粒跳跃式前进</text>
  <text x="620" y="168" font-family="sans-serif" font-size="13" fill="#555">撞击起跳更多颗粒 → 串级</text>
  <text x="620" y="186" font-family="sans-serif" font-size="13" fill="#555">火星上跳跃更远、更平</text>
  <!-- 沙丘示意 -->
  <text x="120" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">横向沙丘（transverse）</text>
  <path d="M40,290 Q120,230 200,290 L200,320 L40,320 Z" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <path d="M40,290 Q120,258 200,290" stroke="#555" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <text x="120" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">丘脊线垂直于风向，风从左侧吹来</text>
  <line x1="40" y1="345" x2="90" y2="345" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrWind)"/>
  <!-- 新月形沙丘 -->
  <text x="600" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">新月形沙丘（barchan）</text>
  <path d="M540,320 Q600,240 660,320 Q620,285 600,290 Q580,285 540,320 Z" fill="#d9b57f" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">两翼顺风弯曲成月牙，前缘沙脊陡峭</text>
  <line x1="520" y1="360" x2="570" y2="360" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrWind)"/>
  <text x="380" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">沙丘整体缓慢顺风迁移；火星沙丘迁移速度比地球慢约一个数量级。</text>
  <defs>
    <marker id="arrWind" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
