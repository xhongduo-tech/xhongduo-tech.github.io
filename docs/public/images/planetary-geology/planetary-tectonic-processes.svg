<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <title>张性构造与压性构造对比示意图</title>
  <desc>上图展示岩石圈受张性应力产生正断层与地堑，下图展示受压性应力产生逆断层与褶皱，附断层几何要素标注。</desc>
  <rect width="760" height="420" fill="#faf9f5"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">张性构造（extensional）与压性构造（compressional）</text>
  <!-- 上图：张性 -->
  <text x="20" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">张性应力</text>
  <line x1="20" y1="72" x2="340" y2="72" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="350" y1="72" x2="700" y2="72" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowR)"/>
  <!-- 岩块 -->
  <polygon points="60,120 320,120 320,180 60,180" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <polygon points="330,120 580,120 580,180 330,180" fill="#d9b57f" stroke="#333" stroke-width="1.5"/>
  <polygon points="170,170 260,170 260,190 170,190" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="215" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">地堑（graben）</text>
  <line x1="120" y1="200" x2="130" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="40" y="250" font-family="sans-serif" font-size="13" fill="#555">正断层（normal fault）</text>
  <text x="40" y="268" font-family="sans-serif" font-size="13" fill="#555">上盘下滑，断层面倾角约 60°</text>
  <text x="560" y="62" font-family="sans-serif" font-size="14" fill="#555">例：火星水手谷、月球月谷</text>
  <!-- 下图：压性 -->
  <text x="20" y="300" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">压性应力</text>
  <line x1="20" y1="310" x2="240" y2="310" stroke="#c0392b" stroke-width="2"/>
  <line x1="250" y1="310" x2="700" y2="310" stroke="#c0392b" stroke-width="2"/>
  <!-- 岩块 -->
  <polygon points="60,340 320,340 320,400 60,400" fill="#d9b57f" stroke="#333" stroke-width="1.5"/>
  <polygon points="150,320 230,320 230,400 150,400" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <polygon points="330,340 580,340 580,400 330,400" fill="#e8d5a8" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">逆冲/褶皱隆起（wrinkle ridge）</text>
  <line x1="140" y1="398" x2="130" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="20" y="332" font-family="sans-serif" font-size="13" fill="#555">逆断层（thrust fault）</text>
  <text x="560" y="332" font-family="sans-serif" font-size="14" fill="#555">例：水星瓣状陡坎、月球皱纹岭</text>
  <text x="380" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">上盘沿断层面逆冲抬升</text>
  <!-- 箭头 marker -->
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
