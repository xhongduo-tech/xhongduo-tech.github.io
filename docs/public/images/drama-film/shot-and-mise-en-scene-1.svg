<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
  <title>电影景别示意图</title>
  <desc>一个直立人物，右侧用色带标注特写、近景、中景、全景、远景五级景别对应的取景范围。</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="30" y="30" font-size="15" fill="#333" font-weight="bold">景别（由近到远）</text>
  <!-- 人物 -->
  <circle cx="180" cy="56" r="16" fill="#333"/>
  <line x1="180" y1="72" x2="180" y2="150" stroke="#333" stroke-width="5"/>
  <line x1="180" y1="95" x2="150" y2="120" stroke="#333" stroke-width="4"/>
  <line x1="180" y1="95" x2="210" y2="120" stroke="#333" stroke-width="4"/>
  <line x1="180" y1="150" x2="168" y2="250" stroke="#333" stroke-width="5"/>
  <line x1="180" y1="150" x2="192" y2="250" stroke="#333" stroke-width="5"/>
  <!-- 边界刻度说明 -->
  <text x="40" y="78" font-size="13" fill="#555">头顶 y=40</text>
  <text x="40" y="100" font-size="13" fill="#555">下巴 y=72</text>
  <text x="40" y="122" font-size="13" fill="#555">胸口 y=95</text>
  <text x="40" y="155" font-size="13" fill="#555">腰部 y=150</text>
  <text x="40" y="255" font-size="13" fill="#555">脚底 y=250</text>
  <!-- 景别色带 -->
  <rect x="215" y="40" width="150" height="32" fill="#1f6f8b" fill-opacity="0.18"/>
  <rect x="215" y="72" width="150" height="23" fill="#c0392b" fill-opacity="0.15"/>
  <rect x="215" y="95" width="150" height="55" fill="#1f6f8b" fill-opacity="0.15"/>
  <rect x="215" y="150" width="150" height="100" fill="#c0392b" fill-opacity="0.12"/>
  <rect x="215" y="250" width="150" height="30" fill="#888888" fill-opacity="0.18"/>
  <!-- 边界线 -->
  <line x1="215" y1="72" x2="365" y2="72" stroke="#333" stroke-width="1"/>
  <line x1="215" y1="95" x2="365" y2="95" stroke="#333" stroke-width="1"/>
  <line x1="215" y1="150" x2="365" y2="150" stroke="#333" stroke-width="1"/>
  <line x1="215" y1="250" x2="365" y2="250" stroke="#333" stroke-width="1"/>
  <!-- 标签 -->
  <text x="225" y="62" font-size="14" fill="#1f6f8b" font-weight="bold">特写（面部）</text>
  <text x="225" y="89" font-size="14" fill="#c0392b" font-weight="bold">近景（胸部以上）</text>
  <text x="225" y="130" font-size="14" fill="#1f6f8b" font-weight="bold">中景（腰部以上）</text>
  <text x="225" y="205" font-size="14" fill="#c0392b" font-weight="bold">全景（全身）</text>
  <text x="225" y="270" font-size="14" fill="#555" font-weight="bold">远景（全身+环境）</text>
</svg>
