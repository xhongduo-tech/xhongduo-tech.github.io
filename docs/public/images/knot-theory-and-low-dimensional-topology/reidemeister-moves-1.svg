<svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="sans-serif">
<title id="ttl">三类 Reidemeister 移动示意</title>
<desc id="desc">R1 消去一个卷，R2 消去重叠，R3 让一根绳滑越交叉点。</desc>
<rect x="0" y="0" width="420" height="150" fill="#faf9f5"/>
<text x="210" y="20" text-anchor="middle" font-size="14" fill="#333">三类局部移动（红色 → 黑色）</text>
<text x="60" y="45" text-anchor="middle" font-size="13" fill="#c0392b">R1 卷</text>
<path d="M 20 70 q 20 -30 40 0 q 20 30 40 0" stroke="#c0392b" stroke-width="3" fill="none"/>
<line x1="95" y1="80" x2="120" y2="80" stroke="#333" stroke-width="3"/>
<text x="180" y="45" text-anchor="middle" font-size="13" fill="#c0392b">R2 重叠</text>
<path d="M 130 60 C 160 60 150 100 180 100" stroke="#c0392b" stroke-width="3" fill="none"/>
<path d="M 130 100 C 160 100 150 60 180 60" stroke="#c0392b" stroke-width="3" fill="none"/>
<line x1="205" y1="60" x2="235" y2="60" stroke="#333" stroke-width="3"/>
<line x1="205" y1="100" x2="235" y2="100" stroke="#333" stroke-width="3"/>
<text x="315" y="45" text-anchor="middle" font-size="13" fill="#c0392b">R3 滑越</text>
<path d="M 250 60 L 290 60" stroke="#c0392b" stroke-width="3" fill="none"/>
<path d="M 265 45 L 275 75" stroke="#c0392b" stroke-width="3" fill="none"/>
<path d="M 250 80 L 290 80" stroke="#c0392b" stroke-width="3" fill="none"/>
<line x1="330" y1="60" x2="370" y2="60" stroke="#333" stroke-width="3"/>
<line x1="345" y1="45" x2="355" y2="75" stroke="#333" stroke-width="3"/>
<line x1="330" y1="80" x2="370" y2="80" stroke="#333" stroke-width="3"/>
</svg>
