<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="sans-serif">
<title id="ttl">结图交叉点的上/下记号</title>
<desc id="desc">左图为一条绳从另一条上方经过的交叉点画法，右图为相反的上下关系。</desc>
<rect x="0" y="0" width="320" height="120" fill="#faf9f5"/>
<text x="160" y="20" text-anchor="middle" font-size="13" fill="#333">交叉点：谁在上，谁在下</text>
<path d="M 30 90 Q 90 30 150 90" stroke="#c0392b" stroke-width="4" fill="none"/>
<path d="M 30 30 Q 90 90 150 30" stroke="#333" stroke-width="4" fill="none"/>
<text x="90" y="112" text-anchor="middle" font-size="13" fill="#333">左绳在上</text>
<path d="M 190 30 Q 250 90 310 30" stroke="#c0392b" stroke-width="4" fill="none"/>
<path d="M 190 90 Q 250 30 310 90" stroke="#333" stroke-width="4" fill="none"/>
<text x="250" y="112" text-anchor="middle" font-size="13" fill="#333">右绳在上</text>
</svg>
