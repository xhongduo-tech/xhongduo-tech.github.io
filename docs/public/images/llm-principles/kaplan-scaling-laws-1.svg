<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif">
  <title>缩放定律：双对数坐标下的幂律直线</title>
  <desc>示意三条幂律：测试损失随模型规模、数据量、算力增大而在双对数坐标下呈直线下降，斜率分别为 -0.076、-0.095、-0.050。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">缩放定律：双对数坐标下的幂律直线（示意）</text>

  <!-- 绘图区 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="80" y1="60" x2="80" y2="360"/>
    <line x1="80" y1="360" x2="600" y2="360"/>
  </g>

  <!-- X 轴刻度与标签 -->
  <g font-size="13" fill="#333">
    <line x1="80" y1="360" x2="80" y2="366" stroke="#333"/>
    <text x="80" y="382" text-anchor="middle">1e8</text>
    <line x1="253" y1="360" x2="253" y2="366" stroke="#333"/>
    <text x="253" y="382" text-anchor="middle">1e10</text>
    <line x1="427" y1="360" x2="427" y2="366" stroke="#333"/>
    <text x="427" y="382" text-anchor="middle">1e12</text>
    <line x1="600" y1="360" x2="600" y2="366" stroke="#333"/>
    <text x="600" y="382" text-anchor="middle">1e14</text>
    <text x="340" y="404" text-anchor="middle" font-size="14">规模（参数 N / 数据 D / 算力 C，对数刻度）</text>
  </g>

  <!-- Y 轴刻度与标签 -->
  <g font-size="13" fill="#333">
    <line x1="74" y1="60" x2="80" y2="60" stroke="#333"/>
    <text x="70" y="64" text-anchor="end">3.2</text>
    <line x1="74" y1="169" x2="80" y2="169" stroke="#333"/>
    <text x="70" y="173" text-anchor="end">2.0</text>
    <line x1="74" y1="278" x2="80" y2="278" stroke="#333"/>
    <text x="70" y="282" text-anchor="end">1.26</text>
    <line x1="74" y1="360" x2="80" y2="360" stroke="#333"/>
    <text x="70" y="364" text-anchor="end">0.89</text>
    <text x="20" y="210" text-anchor="middle" font-size="14" transform="rotate(-90 20 210)">测试损失 L（对数刻度）</text>
  </g>

  <!-- L(D)：斜率最陡，α=0.095 -->
  <line x1="90" y1="115" x2="590" y2="335" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="598" y="316" fill="#1f6f8b" font-size="13" text-anchor="end">L(D)，α = 0.095</text>

  <!-- L(N)：斜率居中，α=0.076 -->
  <line x1="90" y1="155" x2="590" y2="345" stroke="#c0392b" stroke-width="2.5"/>
  <text x="598" y="338" fill="#c0392b" font-size="13" text-anchor="end">L(N)，α = 0.076</text>

  <!-- L(C)：斜率最缓，α=0.050 -->
  <line x1="90" y1="225" x2="590" y2="355" stroke="#666" stroke-width="2.5"/>
  <text x="598" y="356" fill="#666" font-size="13" text-anchor="end">L(C)，α = 0.050</text>

  <text x="90" y="420" font-size="13" fill="#666">注：示意曲线，但三线斜率的相对陡峭程度与论文拟合指数一致；损失无法无限下降，下限见 Chinchilla 的不可约损失 E。</text>
</svg>
