<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">语言模型的演进：从统计到神经</title>
  <desc id="desc">三阶段演进示意图。左：N-gram 统计语言模型，依赖词频计数与稀疏 one-hot 表示，标注组合爆炸 V 的 N 次方；中：Word2Vec 分布式表示，稠密向量、CBOW 与 Skip-gram 两种结构，相似词向量靠近；右：循环语言模型 RNNLM，隐状态随时间传递、可建模变长历史，但长依赖导致梯度消失，需 LSTM 门控。两处箭头分别标注「稀疏到稠密」「静态到时序」。底部为集大成者 Transformer 与大语言模型，本专栏第二章展开。</desc>

  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect width="720" height="470" fill="#faf9f5"/>

  <!-- 主标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="20" fill="#333">语言模型的演进：从统计到神经</text>

  <!-- ========== 面板 1：N-gram 统计模型 ========== -->
  <rect x="20" y="56" width="198" height="262" fill="#f7f1e6" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="32" y="80" font-size="16" fill="#333" font-weight="bold">① N-gram 统计模型</text>

  <rect x="32" y="94" width="174" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="1.2" rx="4"/>
  <text x="119" y="119" text-anchor="middle" font-size="14" fill="#333">词序列：我 喜欢 数学</text>

  <text x="32" y="162" font-size="14" fill="#333" font-weight="bold">按词频计数估计概率</text>
  <text x="32" y="184" font-size="13" fill="#555">P(喜欢 | 我) = C(我喜欢) / C(我)</text>

  <text x="32" y="214" font-size="14" fill="#333" font-weight="bold">表示：one-hot 稀疏</text>
  <rect x="32" y="224" width="174" height="30" fill="#fff" stroke="#1f6f8b" stroke-width="1.2" rx="4"/>
  <text x="119" y="244" text-anchor="middle" font-size="13" fill="#555">[0, 0, 0, 1, 0, …] 仅一位为 1</text>

  <text x="32" y="282" font-size="13" fill="#c0392b" font-weight="bold">痛点：组合爆炸 V^N、稀疏</text>
  <text x="32" y="302" font-size="13" fill="#c0392b">未见过的 N 元组概率为 0</text>

  <!-- ========== 面板 2：Word2Vec 分布式表示 ========== -->
  <rect x="252" y="56" width="198" height="262" fill="#e8f1f3" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="264" y="80" font-size="16" fill="#333" font-weight="bold">② Word2Vec 分布式表示</text>

  <rect x="264" y="94" width="174" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="1.2" rx="4"/>
  <text x="351" y="113" text-anchor="middle" font-size="13" fill="#333">稠密向量（词嵌入）</text>
  <text x="351" y="129" text-anchor="middle" font-size="13" fill="#555">v(猫) = [0.3, -0.4, 0.8, …]</text>

  <text x="264" y="162" font-size="14" fill="#333" font-weight="bold">两种学习结构</text>
  <rect x="264" y="172" width="174" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="1.2" rx="4"/>
  <text x="351" y="190" text-anchor="middle" font-size="13" fill="#333">CBOW：上下文 → 中心词</text>
  <text x="351" y="206" text-anchor="middle" font-size="13" fill="#555">Skip-gram：中心词 → 上下文</text>

  <text x="264" y="240" font-size="13" fill="#c0392b" font-weight="bold">关键性质：相似词 → 向量靠近</text>
  <text x="264" y="258" font-size="13" fill="#c0392b">v(猫) ≈ v(狗)，不再正交</text>
  <text x="264" y="280" font-size="13" fill="#555">训练开销大 → 负采样加速</text>
  <text x="264" y="300" font-size="13" fill="#555">（稠密、可泛化、可运算）</text>

  <!-- ========== 面板 3：RNN 语言模型 ========== -->
  <rect x="484" y="56" width="198" height="262" fill="#f7e9e6" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="496" y="80" font-size="16" fill="#333" font-weight="bold">③ 循环语言模型 RNNLM</text>

  <rect x="496" y="94" width="174" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="1.2" rx="4"/>
  <text x="583" y="113" text-anchor="middle" font-size="13" fill="#333">隐状态随时间传递</text>
  <text x="583" y="129" text-anchor="middle" font-size="13" fill="#555">h_t = f(h_{t-1}, x_t)</text>

  <text x="496" y="168" font-size="14" fill="#333" font-weight="bold">历史长度原则上无限</text>
  <text x="496" y="190" font-size="13" fill="#555">窗口不再是固定的 N-1</text>

  <text x="496" y="222" font-size="13" fill="#c0392b" font-weight="bold">长依赖困难：梯度消失 / 爆炸</text>
  <text x="496" y="244" font-size="13" fill="#c0392b">误差沿时间链相乘 → 指数衰减</text>

  <text x="496" y="274" font-size="14" fill="#333" font-weight="bold">缓解：LSTM 门控（引子）</text>
  <text x="496" y="294" font-size="13" fill="#555">输入门 / 遗忘门 / 输出门</text>

  <!-- 阶段间箭头 -->
  <line x1="220" y1="187" x2="248" y2="187" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="234" y="172" text-anchor="middle" font-size="13" fill="#1f6f8b">稀疏 → 稠密</text>

  <line x1="452" y1="187" x2="480" y2="187" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="466" y="172" text-anchor="middle" font-size="13" fill="#1f6f8b">静态 → 时序</text>

  <!-- 底部：Transformer / 大语言模型 -->
  <rect x="20" y="344" width="662" height="60" fill="#333" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="351" y="368" text-anchor="middle" font-size="16" fill="#faf9f5" font-weight="bold">④ 集大成者：Transformer / 大语言模型</text>
  <text x="351" y="390" text-anchor="middle" font-size="14" fill="#e8f1f3">注意力机制同时解决「长依赖」与「不可并行」——本专栏第二章展开</text>

  <!-- 底部说明 -->
  <text x="360" y="440" text-anchor="middle" font-size="14" fill="#777">范式转变：表示由「符号」变「向量」，参数由「计数」变「学习」</text>
</svg>
