<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif">
  <title>轿车盲区示意：后视镜盲区与前盲区</title>
  <desc>俯视图显示一辆轿车周围的主要盲区：左右后视镜盲区、正后方盲区、车头下方盲区，以及后视镜可覆盖的视野范围。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <rect x="0" y="0" width="640" height="440" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 车道参考线 -->
  <line x1="0" y1="120" x2="640" y2="120" stroke="#d8d2c5" stroke-width="2" stroke-dasharray="10 6"/>
  <line x1="0" y1="320" x2="640" y2="320" stroke="#d8d2c5" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- 右后视镜盲区（右侧大三角楔） -->
  <polygon points="355,265 610,390 610,150 355,175" fill="#c0392b" opacity="0.30"/>
  <!-- 左后视镜盲区（左侧小三角楔） -->
  <polygon points="285,265 30,390 30,150 285,175" fill="#c0392b" opacity="0.30"/>
  <!-- 正后方盲区 -->
  <polygon points="285,390 355,390 355,440 285,440" fill="#c0392b" opacity="0.30"/>
  <!-- 车头前下方盲区 -->
  <rect x="285" y="0" width="70" height="70" fill="#c0392b" opacity="0.30"/>

  <!-- 车身（俯视） -->
  <rect x="285" y="120" width="70" height="200" rx="14" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <!-- 挡风玻璃与后窗 -->
  <rect x="293" y="165" width="54" height="22" rx="6" fill="#cfd8dc" stroke="#333" stroke-width="2"/>
  <rect x="293" y="253" width="54" height="22" rx="6" fill="#cfd8dc" stroke="#333" stroke-width="2"/>
  <!-- 侧窗 -->
  <rect x="291" y="195" width="6" height="45" fill="#cfd8dc" stroke="#333" stroke-width="1"/>
  <rect x="343" y="195" width="6" height="45" fill="#cfd8dc" stroke="#333" stroke-width="1"/>
  <!-- 外后视镜 -->
  <rect x="277" y="205" width="10" height="26" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="353" y="205" width="10" height="26" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- 后视镜可覆盖视野（青色虚线锥） -->
  <line x1="282" y1="210" x2="60" y2="120" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="282" y1="230" x2="60" y2="320" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="358" y1="210" x2="580" y2="120" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="358" y1="230" x2="580" y2="320" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 驾驶员眼位 -->
  <circle cx="320" cy="210" r="5" fill="#333"/>
  <text x="332" y="206" font-size="14" fill="#333">驾驶者</text>

  <!-- 标注文字 -->
  <text x="470" y="290" font-size="15" fill="#c0392b" font-weight="bold">右后视镜盲区</text>
  <text x="470" y="308" font-size="13" fill="#333">侧方并线车辆常藏于此</text>
  <text x="70" y="290" font-size="15" fill="#c0392b" font-weight="bold">左后视镜盲区</text>
  <text x="55" y="308" font-size="13" fill="#333">超车时需转头确认</text>
  <text x="300" y="424" font-size="15" fill="#c0392b" font-weight="bold">正后方盲区</text>
  <text x="300" y="60" font-size="15" fill="#c0392b" font-weight="bold">车头下方盲区</text>
  <text x="468" y="118" font-size="13" fill="#1f6f8b">后视镜视野</text>
  <text x="96" y="118" font-size="13" fill="#1f6f8b">后视镜视野</text>
</svg>
