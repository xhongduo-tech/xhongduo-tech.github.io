<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="sans-serif">
  <title>明清北京城中轴线示意图</title>
  <desc>自南向北依次为永定门、正阳门、天安门、端门、午门、太和殿、神武门、景山、钟鼓楼，中轴线贯通城市南北，宫城居中。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">明清北京城中轴线（自南向北）</text>
  <line x1="320" y1="56" x2="320" y2="392" stroke="#333" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="560" y="70" text-anchor="middle" font-size="13" fill="#333">外城</text>
  <rect x="180" y="82" width="280" height="30" rx="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="102" text-anchor="middle" font-size="14" fill="#333">永定门（外城正南门）</text>
  <text x="560" y="120" text-anchor="middle" font-size="13" fill="#333">内城</text>
  <rect x="180" y="128" width="280" height="30" rx="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="148" text-anchor="middle" font-size="14" fill="#333">正阳门（内城正南门）</text>
  <text x="560" y="170" text-anchor="middle" font-size="13" fill="#333">皇城</text>
  <rect x="180" y="176" width="280" height="30" rx="4" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" font-size="14" fill="#333">天安门（皇城正门）</text>
  <rect x="180" y="212" width="280" height="30" rx="4" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="232" text-anchor="middle" font-size="14" fill="#333">端门</text>
  <text x="560" y="244" text-anchor="middle" font-size="13" fill="#333">宫城（紫禁城）</text>
  <rect x="180" y="248" width="280" height="30" rx="4" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="268" text-anchor="middle" font-size="14" fill="#333">午门（宫城正门）</text>
  <rect x="180" y="284" width="280" height="34" rx="4" fill="#f2e3d0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="320" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">太和殿（中轴高潮）</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#c0392b">外朝三大殿之首</text>
  <rect x="180" y="324" width="280" height="30" rx="4" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="344" text-anchor="middle" font-size="14" fill="#333">神武门（宫城北门）</text>
  <rect x="180" y="360" width="280" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="380" text-anchor="middle" font-size="14" fill="#333">景山（中轴收束）</text>
  <text x="60" y="392" text-anchor="middle" font-size="13" fill="#666">南</text>
  <text x="60" y="60" text-anchor="middle" font-size="13" fill="#666">北</text>
  <text x="600" y="392" text-anchor="middle" font-size="13" fill="#666">钟鼓楼（北端）</text>
</svg>
