<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="sans-serif" font-size="14">
  <title>土压平衡盾构纵剖面与掌子面压力平衡</title>
  <desc>盾构机前方为待开挖土体，刀盘后为充满开挖土的土舱，螺旋输送机排出土体并调节舱压；掌子面两侧压力平衡条件为舱内压力约等于土压力与水压力之和。</desc>
  <rect x="0" y="0" width="720" height="430" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="30" y="34" fill="#333" font-size="18">土压平衡盾构（EPB）纵剖面</text>

  <!-- 已建隧道：管片 -->
  <text x="90" y="66" fill="#1f6f8b" font-size="15">已建隧道（管片衬砌）</text>
  <g stroke="#999" stroke-width="2">
    <line x1="80" y1="120" x2="80" y2="300"/>
    <line x1="130" y1="120" x2="130" y2="300"/>
    <line x1="180" y1="120" x2="180" y2="300"/>
    <line x1="230" y1="120" x2="230" y2="300"/>
    <line x1="280" y1="120" x2="280" y2="300"/>
    <line x1="330" y1="120" x2="330" y2="300"/>
    <line x1="380" y1="120" x2="380" y2="300"/>
    <line x1="420" y1="120" x2="420" y2="300"/>
  </g>
  <rect x="80" y="120" width="340" height="180" fill="#1f6f8b" fill-opacity="0.06" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="96" y="336" fill="#333" font-size="14">隧道管片一环一环拼装</text>

  <!-- 盾构机体 -->
  <rect x="420" y="118" width="180" height="184" fill="none" stroke="#333" stroke-width="3"/>
  <text x="432" y="150" fill="#333" font-size="16">盾构机</text>
  <!-- 盾尾 -->
  <line x1="420" y1="118" x2="420" y2="302" stroke="#333" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="404" y="110" fill="#666" font-size="13">盾尾</text>
  <!-- 土舱 -->
  <rect x="460" y="118" width="140" height="184" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="2"/>
  <text x="474" y="150" fill="#c0392b" font-size="16">土舱（开挖土）</text>
  <!-- 刀盘 -->
  <line x1="600" y1="118" x2="600" y2="302" stroke="#333" stroke-width="5"/>
  <text x="604" y="312" fill="#333" font-size="15">刀盘</text>
  <!-- 螺旋输送机 -->
  <g stroke="#666" stroke-width="4">
    <line x1="540" y1="302" x2="452" y2="362"/>
  </g>
  <circle cx="452" cy="362" r="10" fill="#666"/>
  <text x="424" y="392" fill="#333" font-size="14">螺旋输送机排出土体</text>

  <!-- 掌子面土体 -->
  <g fill="#f1e9d8">
    <rect x="600" y="118" width="120" height="184"/>
  </g>
  <g stroke="#b8a580" stroke-width="1.4">
    <line x1="610" y1="118" x2="610" y2="302"/><line x1="630" y1="118" x2="630" y2="302"/>
    <line x1="650" y1="118" x2="650" y2="302"/><line x1="670" y1="118" x2="670" y2="302"/>
    <line x1="690" y1="118" x2="690" y2="302"/>
  </g>
  <text x="630" y="86" fill="#333" font-size="15">待开挖土体</text>

  <!-- 压力箭头：前方土压+水压（向左） -->
  <g stroke="#c0392b" stroke-width="2.5" fill="#c0392b">
    <line x1="638" y1="170" x2="612" y2="170"/>
    <polygon points="604,170 616,161 616,179"/>
    <line x1="638" y1="210" x2="612" y2="210"/>
    <polygon points="604,210 616,201 616,219"/>
    <line x1="638" y1="250" x2="612" y2="250"/>
    <polygon points="604,250 616,241 616,259"/>
  </g>
  <text x="556" y="172" fill="#c0392b" font-size="15">p = 土压力 + 水压力</text>

  <!-- 压力箭头：舱压（向右） -->
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="486" y1="190" x2="512" y2="190"/>
    <polygon points="520,190 508,181 508,199"/>
    <line x1="486" y1="230" x2="512" y2="230"/>
    <polygon points="520,230 508,221 508,239"/>
  </g>
  <text x="424" y="258" fill="#1f6f8b" font-size="15">舱压 pc</text>

  <line x1="30" y1="412" x2="690" y2="412" stroke="#999" stroke-width="1"/>
  <text x="34" y="402" fill="#666" font-size="14">平衡条件：pc ≈ 土压力 + 水压力 —— 调节螺旋输送机转速与推进速度维持平衡</text>
</svg>
