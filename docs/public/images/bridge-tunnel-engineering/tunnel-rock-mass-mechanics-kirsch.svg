<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="sans-serif" font-size="14">
  <title>圆形隧道洞周边界切向应力集中</title>
  <desc>左图静水压力场 K0=1 时边界切向应力处处为 2p0；右图单向应力场（仅竖向 p0）时侧壁集中为 3p0，洞顶出现拉应力 -p0。</desc>
  <rect x="0" y="0" width="720" height="430" fill="#faf9f5"/>

  <!-- 左：静水压力场 -->
  <text x="70" y="36" fill="#333" font-size="18">静水压力场（K0 = 1）</text>
  <text x="70" y="58" fill="#333" font-size="14">边界切向应力处处相等</text>
  <circle cx="185" cy="235" r="60" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <!-- 竖向应力箭头 -->
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="185" y1="110" x2="185" y2="158"/>
    <polygon points="185,170 176,158 194,158"/>
    <line x1="185" y1="360" x2="185" y2="312"/>
    <polygon points="185,300 176,312 194,312"/>
  </g>
  <text x="200" y="130" fill="#1f6f8b" font-size="15">p0</text>
  <text x="200" y="350" fill="#1f6f8b" font-size="15">p0</text>
  <!-- 水平应力箭头 -->
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="60" y1="235" x2="108" y2="235"/>
    <polygon points="120,235 108,226 108,244"/>
    <line x1="310" y1="235" x2="262" y2="235"/>
    <polygon points="250,235 262,226 262,244"/>
  </g>
  <text x="36" y="228" fill="#1f6f8b" font-size="15">p0</text>
  <text x="314" y="228" fill="#1f6f8b" font-size="15">p0</text>
  <!-- 边界标注 -->
  <circle cx="245" cy="235" r="4" fill="#c0392b"/>
  <line x1="245" y1="235" x2="292" y2="235" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="238" y="282" fill="#c0392b" font-size="16">σθ = 2p0（处处）</text>
  <text x="70" y="398" fill="#333" font-size="14">均匀受压，洞周无拉应力</text>

  <!-- 右：单向应力场 -->
  <text x="420" y="36" fill="#333" font-size="18">单向应力场（仅竖向 p0）</text>
  <text x="420" y="58" fill="#333" font-size="14">应力集中在侧壁，洞顶受拉</text>
  <circle cx="535" cy="235" r="60" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <g stroke="#1f6f8b" stroke-width="2.5" fill="#1f6f8b">
    <line x1="535" y1="110" x2="535" y2="158"/>
    <polygon points="535,170 526,158 544,158"/>
    <line x1="535" y1="360" x2="535" y2="312"/>
    <polygon points="535,300 526,312 544,312"/>
  </g>
  <text x="548" y="130" fill="#1f6f8b" font-size="15">p0</text>
  <text x="548" y="350" fill="#1f6f8b" font-size="15">p0</text>
  <!-- 侧壁集中标注 -->
  <circle cx="595" cy="235" r="4" fill="#c0392b"/>
  <line x1="595" y1="235" x2="648" y2="235" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="470" y="300" fill="#c0392b" font-size="16">侧壁 σθ = 3p0</text>
  <!-- 洞顶受拉标注 -->
  <circle cx="535" cy="175" r="4" fill="#c0392b"/>
  <text x="470" y="146" fill="#c0392b" font-size="16">洞顶 σθ = −p0（拉）</text>
  <text x="420" y="398" fill="#333" font-size="14">应力集中系数 3，拉应力区要特别注意</text>
</svg>
