<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="sans-serif">
  <title>疫苗接种率与有效再生数：群体免疫阈值</title>
  <desc>横轴为疫苗接种率 p，纵轴为有效再生数 Reff；Reff = R0(1-p) 为一条下降直线，与水平线 Reff=1 交于群体免疫阈值 H=1-1/R0。</desc>
  <rect width="700" height="440" fill="#faf9f5"/>

  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">疫苗接种率 p 与有效再生数 Reff</text>
  <text x="350" y="60" text-anchor="middle" font-size="14" fill="#555">Reff = R0(1 − p)，当 Reff &lt; 1 疫情收敛（群体免疫）</text>

  <!-- axes -->
  <line x1="90" y1="370" x2="640" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="370" stroke="#333" stroke-width="2"/>
  <text x="620" y="398" text-anchor="middle" font-size="15" fill="#333">接种率 p</text>
  <text x="70" y="70" text-anchor="end" font-size="15" fill="#333">Reff</text>

  <!-- ticks -->
  <text x="90" y="390" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="640" y="390" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="365" y="390" text-anchor="middle" font-size="13" fill="#333">H = 1 − 1/R0</text>

  <!-- Reff = R0(1-p) line, R0 = 3 -->
  <line x1="90" y1="80" x2="640" y2="370" stroke="#c0392b" stroke-width="3"/>

  <!-- Reff = 1 threshold -->
  <line x1="90" y1="263.3" x2="640" y2="263.3" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="620" y="255" text-anchor="end" font-size="14" font-weight="bold" fill="#1f6f8b">Reff = 1</text>

  <!-- intersection marker: p where R0(1-p)=1 => p=2/3 of width, Reff=1 -->
  <line x1="456.7" y1="70" x2="456.7" y2="370" stroke="#555" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- shaded region to the right of H -->
  <rect x="456.7" y="263.3" width="183.3" height="106.7" fill="#1f6f8b" opacity="0.15"/>
  <text x="548" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6f8b">疫苗覆盖达标区</text>
  <text x="548" y="358" text-anchor="middle" font-size="13" fill="#1f6f8b">Reff &lt; 1，疫情收敛</text>

  <text x="240" y="160" font-size="14" fill="#c0392b">Reff = R0(1 − p)</text>
  <text x="240" y="180" font-size="13" fill="#555">R0 = 3 时：H = 1 − 1/3 ≈ 67%</text>

  <!-- label at H -->
  <text x="456.7" y="66" text-anchor="middle" font-size="13" fill="#333">接种率 = H</text>

  <!-- note -->
  <text x="350" y="425" text-anchor="middle" font-size="13" fill="#555">麻疹 R0≈12–18，对应 H≈92–94%，故疫苗接种须极其接近全覆盖</text>
</svg>
