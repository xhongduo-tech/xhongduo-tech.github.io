<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img">
  <title>暗箱（camera obscura）成像原理图</title>
  <desc>光从物体出发，透过暗箱的小孔沿直线传播，在对面的墙上形成上下颠倒的像——这就是最早的照相机的光学原理。</desc>
  <rect x="0" y="0" width="800" height="440" fill="#faf9f5"/>

  <!-- 暗箱盒体 -->
  <rect x="240" y="80" width="360" height="300" fill="#e8e2d4" stroke="#333" stroke-width="2.5"/>
  <text x="380" y="170" font-family="sans-serif" font-size="14" fill="#333">暗箱（不透光盒子）</text>
  <text x="380" y="190" font-family="sans-serif" font-size="13" fill="#666">外面亮、里面暗</text>

  <!-- 左墙上的小孔（断开一段表示开口） -->
  <line x1="240" y1="80" x2="240" y2="188" stroke="#333" stroke-width="2.5"/>
  <line x1="240" y1="212" x2="240" y2="380" stroke="#333" stroke-width="2.5"/>
  <circle cx="240" cy="200" r="4" fill="#1f6f8b"/>
  <text x="100" y="196" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold">小孔（针孔）</text>

  <!-- 物体：向上的箭头 -->
  <line x1="80" y1="150" x2="80" y2="250" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="80,150 74,162 86,162" fill="#1f6f8b"/>
  <text x="42" y="290" font-family="sans-serif" font-size="14" fill="#333">物体（烛光、人、树）</text>

  <!-- 光线（直线传播，穿过小孔） -->
  <line x1="80" y1="150" x2="240" y2="200" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
  <line x1="240" y1="200" x2="600" y2="312" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
  <line x1="80" y1="250" x2="240" y2="200" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
  <line x1="240" y1="200" x2="600" y2="88" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text x="250" y="360" font-family="sans-serif" font-size="14" fill="#c0392b">光线沿直线传播，穿过小孔后交叉</text>

  <!-- 倒立的像：向下的箭头 -->
  <line x1="600" y1="88" x2="600" y2="312" stroke="#c0392b" stroke-width="3"/>
  <polygon points="600,312 594,300 606,300" fill="#c0392b"/>
  <text x="610" y="205" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">倒立的像</text>

  <!-- 右侧说明 -->
  <text x="610" y="330" font-family="sans-serif" font-size="13" fill="#666">像会上下颠倒</text>
  <text x="610" y="348" font-family="sans-serif" font-size="13" fill="#666">这就是最早的照相机</text>
  <text x="610" y="366" font-family="sans-serif" font-size="13" fill="#666">（维米尔可能用它观察光影）</text>
</svg>
