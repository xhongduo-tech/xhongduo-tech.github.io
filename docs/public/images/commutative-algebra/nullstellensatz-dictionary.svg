<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330">
  <title>零点定理的词典：几何与代数对照</title>
  <desc>k 代数闭时 k 的 n 次仿射空间与多项式环之间的基本词典：点对应极大理想，子簇对应根理想，不可约子簇对应素理想，坐标环对应商环</desc>
  <rect width="460" height="330" fill="#faf9f5"/>
  <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">零点定理词典：k 代数闭，kⁿ ↔ k[x₁,…,xₙ]</text>
  <text x="90" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">几何 kⁿ</text>
  <text x="370" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">代数 k[x]</text>

  <rect x="10" y="70" width="160" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="90" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">点 p = (a1,…,an)</text>
  <rect x="290" y="70" width="160" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">极大理想 (x1−a1,…,xn−an)</text>

  <rect x="10" y="125" width="160" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="90" y="149" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">代数子簇 V(𝔞)</text>
  <rect x="290" y="125" width="160" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="149" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">根理想 √𝔞 = 𝔞</text>

  <rect x="10" y="180" width="160" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="90" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">不可约子簇</text>
  <rect x="290" y="180" width="160" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">素理想</text>

  <rect x="10" y="235" width="160" height="40" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="90" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">坐标环 k[V] = k[x]/𝔞</text>
  <rect x="290" y="235" width="160" height="40" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">商环 k[x]/𝔞</text>

  <line x1="180" y1="90" x2="282" y2="90" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="145" x2="282" y2="145" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="200" x2="282" y2="200" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="255" x2="282" y2="255" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="230" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">V(𝔞) 与 I 互为反演：I(V(𝔞)) = √𝔞</text>
</svg>
