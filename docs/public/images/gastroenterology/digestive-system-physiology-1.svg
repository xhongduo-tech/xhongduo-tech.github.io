<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
  <title>消化道的九米流水线示意图</title>
  <desc>从口腔到结肠的消化道分段示意图，标注各段主要功能与消化液汇合枢纽。</desc>
  <rect width="800" height="460" fill="#faf9f5"/>
  <g font-size="14" fill="#333">
    <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold">消化道九米流水线（示意图）</text>

    <!-- 口腔 -->
    <rect x="60" y="80" width="120" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="120" y="105" text-anchor="middle" font-weight="bold">口腔</text>
    <text x="120" y="125" text-anchor="middle" font-size="12">唾液淀粉酶</text>
    <text x="120" y="142" text-anchor="middle" font-size="12">机械粉碎</text>

    <!-- 食管 -->
    <rect x="220" y="80" width="120" height="70" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="280" y="105" text-anchor="middle" font-weight="bold">食管</text>
    <text x="280" y="125" text-anchor="middle" font-size="12">蠕动传输</text>
    <text x="280" y="142" text-anchor="middle" font-size="12">LES 防反流</text>

    <!-- 胃 -->
    <rect x="380" y="70" width="150" height="95" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="455" y="98" text-anchor="middle" font-weight="bold">胃</text>
    <text x="455" y="118" text-anchor="middle" font-size="12">胃酸 pH≈1–2</text>
    <text x="455" y="135" text-anchor="middle" font-size="12">胃蛋白酶</text>
    <text x="455" y="152" text-anchor="middle" font-size="12">内因子</text>

    <!-- 十二指肠 -->
    <path d="M 530 115 L 610 115 L 610 230 L 490 230 L 490 195" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="612" y="175" text-anchor="start" font-weight="bold" fill="#1f6f8b">十二指肠</text>
    <text x="612" y="195" text-anchor="start" font-size="12">三路消化液枢纽</text>
    <text x="612" y="212" text-anchor="start" font-size="12">胰液·胆汁·肠液</text>

    <!-- 胰腺 -->
    <rect x="380" y="260" width="100" height="55" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="430" y="285" text-anchor="middle" font-weight="bold">胰腺</text>
    <text x="430" y="303" text-anchor="middle" font-size="12">胰酶 + NaHCO₃</text>

    <!-- 肝 + 胆囊 -->
    <rect x="520" y="260" width="120" height="55" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="580" y="285" text-anchor="middle" font-weight="bold">肝 · 胆囊</text>
    <text x="580" y="303" text-anchor="middle" font-size="12">胆汁 · 乳化脂肪</text>
    <path d="M 530 287 L 510 287" stroke="#1f6f8b" stroke-width="2"/>
    <path d="M 380 287 L 360 287" stroke="#1f6f8b" stroke-width="2"/>

    <!-- 小肠 -->
    <rect x="60" y="230" width="280" height="95" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="200" y="260" text-anchor="middle" font-weight="bold">空肠 · 回肠（吸收主战场）</text>
    <text x="200" y="282" text-anchor="middle" font-size="12">单糖 · 氨基酸 · 脂肪酸</text>
    <text x="200" y="299" text-anchor="middle" font-size="12">水与电解质 · 维生素</text>

    <!-- 结肠 -->
    <path d="M 60 230 L 60 360 L 360 360 L 360 340" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="380" y="375" text-anchor="middle" font-weight="bold" fill="#1f6f8b">结肠</text>
    <text x="380" y="398" text-anchor="middle" font-size="12">回收水与 Na⁺ · 发酵</text>
    <text x="380" y="415" text-anchor="middle" font-size="12">浓缩 · 储存 · 成便</text>

    <!-- 底部守恒 -->
    <text x="400" y="448" text-anchor="middle" font-size="14" fill="#c0392b">每日分泌 ≈ 7 L，粪便排出 ≈ 0.1–0.2 L —— 差值全靠小肠结肠重吸收</text>
  </g>
</svg>
