<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img" aria-labelledby="title desc">
<title>气-液-固（VLS）生长机制示意</title>
<desc>VLS 三步：气相供料、液滴富集、固相析出，晶体在液滴下方沿轴向生长。</desc>
<rect x="0" y="0" width="760" height="460" fill="#faf9f5"/>
<text x="380" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">气-液-固（VLS）生长机制</text>

<!-- 衬底 -->
<rect x="60" y="360" width="300" height="40" fill="#1f6f8b" rx="4"/>
<text x="210" y="387" text-anchor="middle" font-size="15" fill="#fff">衬底</text>

<!-- 纳米线 -->
<rect x="180" y="180" width="60" height="180" fill="#c0392b" opacity="0.85"/>
<text x="210" y="280" text-anchor="middle" font-size="14" fill="#fff" transform="rotate(-90 210 280)">硅纳米线（固相晶体）</text>

<!-- 催化剂液滴 -->
<ellipse cx="210" cy="165" rx="42" ry="30" fill="#e67e22"/>
<text x="210" y="162" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Au-Si</text>
<text x="210" y="180" text-anchor="middle" font-size="13" fill="#fff">液滴</text>

<!-- 气相分子 -->
<text x="470" y="70" font-size="15" fill="#333" font-weight="bold">1. 气相供料</text>
<g stroke="#1f6f8b" stroke-width="2" fill="none">
  <path d="M 420 100 q 6 -8 14 -6" />
  <path d="M 470 110 q 6 -8 14 -6" />
  <path d="M 520 100 q 6 -8 14 -6" />
</g>
<g font-size="13" fill="#1f6f8b">
  <text x="368" y="108">SiH₄ 分子</text>
  <text x="446" y="118">SiH₄</text>
  <text x="498" y="108">SiH₄</text>
</g>

<!-- 箭头：气相到液滴 -->
<path d="M 430 130 C 380 140 340 148 260 152" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<text x="340" y="138" font-size="13" fill="#c0392b">2. 溶入液滴（富集）</text>

<!-- 箭头：液滴到晶体 -->
<path d="M 220 192 L 220 230" stroke="#1f6f8b" stroke-width="2.5" fill="none" marker-end="url(#arr2)"/>
<text x="242" y="218" font-size="13" fill="#1f6f8b">3. 过饱和析出</text>

<!-- 结构标注 -->
<line x1="222" y1="360" x2="222" y2="420" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="230" y1="420" x2="330" y2="420" stroke="#333" stroke-width="1.5"/>
<text x="332" y="424" font-size="14" fill="#333">晶体沿轴向生长</text>

<!-- 底部说明 -->
<rect x="420" y="330" width="310" height="100" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5" rx="8"/>
<text x="575" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">要点</text>
<text x="440" y="378" font-size="13" fill="#333">· 线径由催化剂液滴尺寸决定</text>
<text x="440" y="398" font-size="13" fill="#333">· 液滴悬浮在纳米线顶端</text>
<text x="440" y="418" font-size="13" fill="#333">· 定向生长，打破各向同性结晶</text>

<defs>
  <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
  <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1f6f8b"/></marker>
</defs>
</svg>
