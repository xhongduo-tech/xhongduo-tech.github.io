<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>现场勘查的完整工作流程</title>
  <desc>从现场保护出发，经过现场访问与现场勘验两条并行路径，汇合到现场分析，最终支撑侦查方向决策。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <!-- 标题 -->
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">现场勘查的完整工作流程</text>
  <!-- 起点：现场保护 -->
  <rect x="220" y="70" width="200" height="46" rx="8" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">① 现场保护（警戒 · 固定原状）</text>
  <!-- 从起点向下的箭头 -->
  <line x1="320" y1="116" x2="320" y2="148" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 分支标注 -->
  <text x="320" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">分两条并行路径</text>
  <!-- 左支：现场访问（人） -->
  <rect x="60" y="185" width="230" height="120" rx="8" fill="#c0392b" opacity="0.08" stroke="#c0392b" stroke-width="2"/>
  <text x="175" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">② 现场访问（查人）</text>
  <text x="175" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">报案人 · 目击者 · 受害人</text>
  <text x="175" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">时间线 · 人物关系</text>
  <text x="175" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">目击所见 · 反常迹象</text>
  <line x1="260" y1="60" x2="260" y2="110" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M290,166 L175,166 L175,182" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- 右支：现场勘验（查物） -->
  <rect x="350" y="185" width="230" height="120" rx="8" fill="#1f6f8b" opacity="0.08" stroke="#1f6f8b" stroke-width="2"/>
  <text x="465" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">③ 现场勘验（查物）</text>
  <text x="465" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">静态勘验 → 动态勘验</text>
  <text x="465" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">发现 · 固定 · 提取痕迹物证</text>
  <text x="465" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">拍照 · 绘图 · 笔录留痕</text>
  <line x1="380" y1="60" x2="380" y2="110" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M350,166 L465,166 L465,182" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- 汇合向下 -->
  <line x1="175" y1="305" x2="175" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="465" y1="305" x2="465" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="330" x2="465" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="320" y1="330" x2="320" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 现场分析 -->
  <rect x="200" y="350" width="240" height="46" rx="8" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="379" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">④ 现场分析 / 现场重建</text>
</svg>
