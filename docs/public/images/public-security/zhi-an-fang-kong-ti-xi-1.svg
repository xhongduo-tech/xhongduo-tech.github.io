<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>治安防控体系的三防协同结构</title>
  <desc>人防、物防、技防三层防御协同，共同抵御治安风险，通过感知、研判、预警、处置闭环运转。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">治安防控体系：三防协同</text>
  <!-- 风险源（左侧） -->
  <rect x="30" y="160" width="100" height="90" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="80" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0392b">治安风险</text>
  <text x="80" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">违法犯罪</text>
  <text x="80" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">隐患事故</text>
  <!-- 风险指向三层防御的箭头 -->
  <line x1="130" y1="195" x2="185" y2="195" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 三层防御 -->
  <g font-family="sans-serif">
    <!-- 物防（最外层） -->
    <rect x="200" y="120" width="380" height="55" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
    <text x="390" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">① 物防（物理屏障）</text>
    <text x="390" y="166" text-anchor="middle" font-size="12" fill="#333">围墙 · 门禁 · 防盗设施 —— 阻挡与延迟</text>
    <!-- 人防（中层） -->
    <rect x="200" y="195" width="380" height="55" rx="8" fill="#c0392b" opacity="0.10" stroke="#c0392b" stroke-width="2"/>
    <text x="390" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">② 人防（人力防控）</text>
    <text x="390" y="241" text-anchor="middle" font-size="12" fill="#333">巡逻 · 岗亭 · 群防群治 —— 判断与处置</text>
    <!-- 技防（最内层） -->
    <rect x="200" y="270" width="380" height="55" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
    <text x="390" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">③ 技防（智能感知）</text>
    <text x="390" y="316" text-anchor="middle" font-size="12" fill="#333">监控 · 报警 · 大数据预警 —— 感知与记录</text>
  </g>
  <!-- 层间箭头：层层递进 -->
  <line x1="390" y1="175" x2="390" y2="193" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="250" x2="390" y2="268" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 闭环标注 -->
  <path d="M580,120 L600,120 L600,325 L580,325" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="598" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666" transform="rotate(90,598,228)">感知 · 研判 · 预警 · 处置</text>
</svg>
