<svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>赫罗图（H-R 图）</title>
  <desc>以光谱型（温度）为横轴、光度为纵轴的恒星分类图，标注主序带、红巨星支、白矮星区与太阳的位置。</desc>
  <rect width="480" height="380" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="70" y1="40" x2="70" y2="300"/>
    <line x1="70" y1="300" x2="450" y2="300"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="70" y="318">O</text>
    <text x="133" y="318">B</text>
    <text x="196" y="318">A</text>
    <text x="259" y="318">F</text>
    <text x="322" y="318">G</text>
    <text x="385" y="318">K</text>
    <text x="448" y="318">M</text>
  </g>
  <g fill="#333" font-size="12" text-anchor="end">
    <text x="62" y="45">10⁴</text>
    <text x="62" y="110">10²</text>
    <text x="62" y="175">1</text>
    <text x="62" y="240">10⁻²</text>
    <text x="62" y="305">10⁻⁴</text>
  </g>
  <g fill="#333" font-size="14" text-anchor="middle">
    <text x="62" y="20" transform="rotate(-90 62 170)" transform-origin="62 170">光度 L/L☉</text>
    <text x="260" y="348">光谱型（温度降低 →）</text>
  </g>
  <g stroke-linecap="round">
    <polyline points="90,55 130,78 170,108 210,140 255,172 320,215 395,265"
      fill="none" stroke="#1f6f8b" stroke-width="16" opacity="0.22"/>
    <polyline points="90,55 130,78 170,108 210,140 255,172 320,215 395,265"
      fill="none" stroke="#1f6f8b" stroke-width="3" opacity="0.9"/>
  </g>
  <g stroke-linecap="round">
    <path d="M 300 98 Q 370 82 430 55" fill="none" stroke="#c0392b" stroke-width="14" opacity="0.22"/>
    <path d="M 300 98 Q 370 82 430 55" fill="none" stroke="#c0392b" stroke-width="3" opacity="0.9"/>
  </g>
  <ellipse cx="140" cy="248" rx="28" ry="15" fill="#c0392b" opacity="0.18" stroke="#c0392b" stroke-width="2"/>
  <circle cx="255" cy="172" r="5" fill="#c0392b" stroke="none"/>
  <g fill="#333" font-size="14">
    <text x="240" y="180">太阳 ☉</text>
    <text x="255" y="205" fill="#1f6f8b">主序带</text>
    <text x="352" y="78" fill="#c0392b">红巨星支</text>
    <text x="100" y="275" fill="#c0392b">白矮星</text>
  </g>
</svg>
