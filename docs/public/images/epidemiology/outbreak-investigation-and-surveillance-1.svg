  <line x1="562" y1="230" x2="562" y2="246" stroke="#333" stroke-width="1.2"/>
  <line x1="616" y1="230" x2="616" y2="246" stroke="#333" stroke-width="1.2"/>
  <text x="472" y="262" text-anchor="middle" font-size="13" fill="#333">第1代</text>
  <text x="562" y="262" text-anchor="middle" font-size="13" fill="#333">第2代</text>
  <text x="616" y="262" text-anchor="middle" font-size="13" fill="#333">第3代</text>
  <text x="555" y="282" text-anchor="middle" font-size="13" fill="#555">代际间隔 ≈ 潜伏期</text>
  <text x="400" y="246" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="526" y="246" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="706" y="246" text-anchor="middle" font-size="13" fill="#333">18</text>
</svg>
