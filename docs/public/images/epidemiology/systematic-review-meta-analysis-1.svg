<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif">
  <title>Meta 分析森林图</title>
  <desc>森林图：每行一项研究的相对危险度 RR 与 95% 置信区间，中间竖线为无效应线 RR=1，底部红色菱形为合并效应。</desc>
  <rect width="720" height="340" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Meta 分析森林图（示意）</text>

  <line x1="100" y1="290" x2="680" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="506" y1="75" x2="506" y2="290" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="506" y="305" text-anchor="middle" font-size="13" fill="#c0392b">1.0（无效应）</text>
  <line x1="100" y1="290" x2="100" y2="296" stroke="#333"/>
  <line x1="332" y1="290" x2="332" y2="296" stroke="#333"/>
  <line x1="680" y1="290" x2="680" y2="296" stroke="#333"/>
  <text x="100" y="312" text-anchor="middle" font-size="13" fill="#333">0.2</text>
  <text x="332" y="312" text-anchor="middle" font-size="13" fill="#333">0.5</text>
  <text x="680" y="312" text-anchor="middle" font-size="13" fill="#333">2.0</text>
  <text x="390" y="332" text-anchor="middle" font-size="13" fill="#555">相对危险度 RR（对数刻度）</text>

  <text x="60" y="60" font-size="13" fill="#555">研究</text>
  <text x="660" y="60" text-anchor="end" font-size="13" fill="#555">RR（95% CI）</text>

  <text x="60" y="95" font-size="14" fill="#333">研究 A（权重 12%）</text>
  <line x1="331" y1="91" x2="608" y2="91" stroke="#333" stroke-width="2"/>
  <rect x="475" y="87" width="8" height="8" fill="#1f6f8b"/>
  <text x="660" y="95" text-anchor="end" font-size="13" fill="#333">0.90（0.50–1.50）</text>

  <text x="60" y="130" font-size="14" fill="#333">研究 B（权重 18%）</text>
  <line x1="305" y1="126" x2="530" y2="126" stroke="#333" stroke-width="2"/>
  <rect x="412" y="122" width="8" height="8" fill="#1f6f8b"/>
  <text x="660" y="130" text-anchor="end" font-size="13" fill="#333">0.70（0.45–1.10）</text>

  <text x="60" y="165" font-size="14" fill="#333">研究 C（权重 20%）</text>
  <line x1="275" y1="161" x2="493" y2="161" stroke="#333" stroke-width="2"/>
  <rect x="373" y="157" width="8" height="8" fill="#1f6f8b"/>
  <text x="660" y="165" text-anchor="end" font-size="13" fill="#333">0.60（0.40–0.95）</text>

  <text x="60" y="200" font-size="14" fill="#333">研究 D（权重 24%）</text>
  <line x1="242" y1="196" x2="465" y2="196" stroke="#333" stroke-width="2"/>
  <rect x="351" y="192" width="8" height="8" fill="#1f6f8b"/>
  <text x="660" y="200" text-anchor="end" font-size="13" fill="#333">0.55（0.35–0.85）</text>

  <text x="60" y="235" font-size="14" fill="#333">研究 E（权重 26%）</text>
  <line x1="242" y1="231" x2="423" y2="231" stroke="#333" stroke-width="2"/>
  <rect x="327" y="227" width="8" height="8" fill="#1f6f8b"/>
  <text x="660" y="235" text-anchor="end" font-size="13" fill="#333">0.50（0.35–0.72）</text>

  <text x="60" y="279" font-size="14" fill="#333" font-weight="bold">合并（随机效应）</text>
  <polygon points="393,271 443,275 393,279 346,275" fill="#c0392b"/>
  <text x="660" y="279" text-anchor="end" font-size="13" fill="#333" font-weight="bold">0.64（0.53–0.78）</text>
</svg>
