<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="sans-serif">
  <title>SIR 模型：易感者、感染者、康复者随时间的变化</title>
  <desc>易感者 S 随时间单调下降，感染者 I 先升后降形成流行峰，康复者 R 单调上升，三条曲线近似满足 S+I+R=1。</desc>
  <rect width="720" height="320" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SIR 模型：一场流行的时间演化</text>
  <rect x="70" y="60" width="1" height="180" fill="#999"/>
  <rect x="70" y="240" width="580" height="1" fill="#999"/>
  <text x="66" y="54" text-anchor="end" font-size="13" fill="#333">占人口比例</text>
  <line x1="70" y1="140" x2="650" y2="140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="66" y="84" text-anchor="end" font-size="12" fill="#888">1.0</text>
  <text x="66" y="144" text-anchor="end" font-size="12" fill="#888">0.5</text>
  <text x="70" y="262" font-size="13" fill="#555">0</text>
  <text x="650" y="262" font-size="13" fill="#555">时间 t</text>

  <polyline points="70,44 150,60 230,100 310,160 390,204 470,216 550,232 630,234"
    fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="150" y="52" font-size="14" fill="#1f6f8b" font-weight="bold">S 易感者</text>

  <polyline points="70,238 150,232 230,212 310,204 390,216 470,230 550,236 630,238"
    fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="310" y="192" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">I 感染者</text>

  <polyline points="70,238 150,228 230,208 310,156 390,100 470,66 550,52 630,48"
    fill="none" stroke="#555" stroke-width="3"/>
  <text x="470" y="54" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">R 康复者</text>

  <line x1="310" y1="60" x2="310" y2="202" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="310" y="50" text-anchor="middle" font-size="13" fill="#c0392b">流行峰（I 最大）</text>

  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#555">R0 = βN/γ 决定峰是否出现；免疫 / 疫苗 = 把 S 提前移到 R，压低峰</text>
</svg>
