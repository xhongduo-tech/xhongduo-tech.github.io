<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="sans-serif">
  <title>隶变「线条到笔画」演变示意图</title>
  <desc>对比篆书圆转线条、隶书方折波磔笔画与楷书端正笔画三个阶段的字形单位变化。</desc>
  <rect width="780" height="320" fill="#faf9f5"/>

  <rect x="30" y="60" width="210" height="180" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="135" y="40" font-size="16" fill="#1f6f8b" text-anchor="middle">篆书（线条）</text>
  <circle cx="110" cy="140" r="34" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 170 110 Q 185 150 172 200" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 120 150 Q 150 155 175 158" fill="none" stroke="#333" stroke-width="2"/>
  <text x="135" y="225" font-size="13" fill="#666" text-anchor="middle">圆转、粗细均匀的线条</text>

  <text x="290" y="150" font-size="26" fill="#333" text-anchor="middle">→</text>

  <rect x="320" y="60" width="210" height="180" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="425" y="40" font-size="16" fill="#c0392b" text-anchor="middle">隶书（笔画）</text>
  <rect x="365" y="115" width="60" height="55" rx="4" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 455 128 h 30" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="455" cy="126" r="3.5" fill="#333"/>
  <path d="M 484 130 q 10 2 12 10" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <text x="425" y="225" font-size="13" fill="#666" text-anchor="middle">方折笔画，蚕头燕尾</text>

  <text x="580" y="150" font-size="26" fill="#333" text-anchor="middle">→</text>

  <rect x="610" y="60" width="150" height="180" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="685" y="40" font-size="16" fill="#333" text-anchor="middle">楷书（笔画）</text>
  <path d="M 650 110 h 70" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 660 160 h 60" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M 685 110 v 50" fill="none" stroke="#333" stroke-width="3"/>
  <text x="685" y="225" font-size="13" fill="#666" text-anchor="middle">点画分明、结构方正</text>

  <text x="390" y="285" font-size="14" fill="#c0392b" text-anchor="middle">古文字（篆系）　⟶　今文字（隶楷）　＝「从画字到写字」</text>
</svg>
