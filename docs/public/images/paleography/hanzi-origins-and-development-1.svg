<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="sans-serif">
  <title>汉字发展时间坐标图</title>
  <desc>从史前陶符到楷书的汉字发展脉络时间轴，分为前文字、古文字、今文字三个阶段。</desc>
  <rect width="860" height="360" fill="#faf9f5"/>
  <line x1="40" y1="180" x2="820" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="820,180 808,174 808,186" fill="#333"/>

  <text x="60" y="130" font-size="15" fill="#1f6f8b">前文字阶段</text>
  <text x="60" y="150" font-size="13" fill="#333">陶符 · 记号</text>
  <circle cx="120" cy="180" r="8" fill="#1f6f8b"/>
  <text x="90" y="225" font-size="13" fill="#333" text-anchor="middle">半坡陶符</text>
  <text x="90" y="243" font-size="12" fill="#666" text-anchor="middle">约前6000—前3000年</text>

  <text x="300" y="130" font-size="15" fill="#c0392b">古文字阶段</text>
  <text x="300" y="150" font-size="13" fill="#333">象形 → 表意 → 假借 → 形声</text>
  <circle cx="270" cy="180" r="8" fill="#c0392b"/>
  <text x="270" y="225" font-size="13" fill="#333" text-anchor="middle">甲骨文</text>
  <text x="270" y="243" font-size="12" fill="#666" text-anchor="middle">商（约前14—前11世纪）</text>

  <circle cx="430" cy="180" r="8" fill="#c0392b"/>
  <text x="430" y="225" font-size="13" fill="#333" text-anchor="middle">金文</text>
  <text x="430" y="243" font-size="12" fill="#666" text-anchor="middle">西周（约前11—前8世纪）</text>

  <circle cx="575" cy="180" r="8" fill="#c0392b"/>
  <text x="575" y="225" font-size="13" fill="#333" text-anchor="middle">战国文字（分化）</text>
  <text x="575" y="243" font-size="12" fill="#666" text-anchor="middle">春秋战国（约前770—前221）</text>

  <circle cx="705" cy="180" r="8" fill="#c0392b"/>
  <text x="705" y="225" font-size="13" fill="#333" text-anchor="middle">小篆</text>
  <text x="705" y="243" font-size="12" fill="#666" text-anchor="middle">秦（前221年后）</text>

  <text x="700" y="110" font-size="15" fill="#1f6f8b">今文字阶段</text>
  <circle cx="775" cy="180" r="8" fill="#1f6f8b"/>
  <text x="775" y="150" font-size="13" fill="#333" text-anchor="middle">隶书 · 楷书</text>
  <text x="775" y="290" font-size="12" fill="#666" text-anchor="middle">汉—魏晋，沿用至今</text>

  <text x="60" y="320" font-size="13" fill="#666">主线：从「画得像」（象形为本）走向「写得快」（表音化与简化）</text>
</svg>
