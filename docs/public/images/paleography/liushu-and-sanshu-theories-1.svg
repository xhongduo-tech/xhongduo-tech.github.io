<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif">
  <title>裘锡圭三书说分类示意图</title>
  <desc>汉字分为表意、假借、形声三类，分类标准统一为以形表义、以音表义、形音兼备。</desc>
  <rect width="760" height="360" fill="#faf9f5"/>

  <rect x="320" y="20" width="120" height="44" rx="8" fill="#333"/>
  <text x="380" y="48" font-size="16" fill="#fff" text-anchor="middle">汉字</text>

  <line x1="380" y1="64" x2="140" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="64" x2="380" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="64" x2="620" y2="110" stroke="#333" stroke-width="2"/>

  <rect x="50" y="110" width="180" height="44" rx="8" fill="#1f6f8b"/>
  <text x="140" y="137" font-size="15" fill="#fff" text-anchor="middle">表意字（以形表义）</text>
  <text x="140" y="180" font-size="13" fill="#333" text-anchor="middle">象形 · 指事 · 会意</text>
  <text x="140" y="200" font-size="13" fill="#666" text-anchor="middle">日、月｜上、下｜休、明</text>

  <rect x="290" y="110" width="180" height="44" rx="8" fill="#1f6f8b"/>
  <text x="380" y="137" font-size="15" fill="#fff" text-anchor="middle">假借字（以音表义）</text>
  <text x="380" y="180" font-size="13" fill="#333" text-anchor="middle">本无其字，依声托事</text>
  <text x="380" y="200" font-size="13" fill="#666" text-anchor="middle">其、我、来</text>

  <rect x="530" y="110" width="180" height="44" rx="8" fill="#1f6f8b"/>
  <text x="620" y="137" font-size="15" fill="#fff" text-anchor="middle">形声字（形音兼备）</text>
  <text x="620" y="180" font-size="13" fill="#333" text-anchor="middle">形旁表义 + 声旁标音</text>
  <text x="620" y="200" font-size="13" fill="#666" text-anchor="middle">江、河、想</text>

  <text x="380" y="245" font-size="14" fill="#c0392b" text-anchor="middle">任何汉字必属其一，且只属其一</text>
  <text x="380" y="280" font-size="13" fill="#666" text-anchor="middle">考释策略：表意求形 → 假借求音 → 形声先找声旁</text>
</svg>
