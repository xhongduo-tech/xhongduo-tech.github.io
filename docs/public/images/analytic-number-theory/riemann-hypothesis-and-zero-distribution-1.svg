<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg">
<title>Zeta 函数零点的临界带与临界线示意</title>
<desc>在复平面 s 平面中画出临界带 0 &lt; Re(s) &lt; 1（浅青底）、临界线 Re(s)=1/2（青色竖线）、极点 s=1（红点）、平凡零点（负实轴上的黑点）以及非平凡零点（临界线上的青点）。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<!-- axes -->
<line x1="320" y1="30" x2="320" y2="370" stroke="#333" stroke-width="2"/>
<line x1="60" y1="200" x2="600" y2="200" stroke="#333" stroke-width="2"/>
<text x="610" y="205" font-family="sans-serif" font-size="14" fill="#333">Re(s)</text>
<text x="330" y="30" font-family="sans-serif" font-size="14" fill="#333">Im(s)</text>
<!-- critical strip -->
<rect x="290" y="40" width="60" height="320" fill="#1f6f8b" opacity="0.12"/>
<text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">临界带</text>
<!-- critical line -->
<line x1="320" y1="40" x2="320" y2="360" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="322" y="48" font-family="sans-serif" font-size="14" fill="#1f6f8b">临界线 Re(s)=1/2</text>
<!-- vertical lines sigma=0 and sigma=1 -->
<line x1="290" y1="40" x2="290" y2="360" stroke="#333" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="350" y1="40" x2="350" y2="360" stroke="#333" stroke-width="1" stroke-dasharray="2 3"/>
<text x="290" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">σ=0</text>
<text x="350" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">σ=1</text>
<!-- pole at s=1 -->
<circle cx="350" cy="200" r="5" fill="#c0392b"/>
<text x="360" y="196" font-family="sans-serif" font-size="13" fill="#c0392b">s=1 极点</text>
<!-- trivial zeros on negative real axis -->
<g fill="#333">
  <circle cx="250" cy="200" r="4"/>
  <circle cx="180" cy="200" r="4"/>
  <circle cx="110" cy="200" r="4"/>
  <circle cx="80" cy="200" r="4"/>
</g>
<text x="120" y="188" font-family="sans-serif" font-size="13" fill="#333">平凡零点 -2,-4,-6,…</text>
<!-- nontrivial zeros on critical line (illustrative) -->
<g fill="#1f6f8b">
  <circle cx="320" cy="150" r="4"/>
  <circle cx="320" cy="175" r="4"/>
  <circle cx="320" cy="225" r="4"/>
  <circle cx="320" cy="250" r="4"/>
  <circle cx="320" cy="120" r="4"/>
  <circle cx="320" cy="275" r="4"/>
</g>
<text x="250" y="105" font-family="sans-serif" font-size="13" fill="#1f6f8b">非平凡零点 ρ=1/2+iγ（示意）</text>
<!-- symmetry note -->
<text x="60" y="42" font-family="sans-serif" font-size="13" fill="#333">零点关于临界线与实轴对称；RH 断言全部非平凡零点落在临界线上</text>
</svg>
