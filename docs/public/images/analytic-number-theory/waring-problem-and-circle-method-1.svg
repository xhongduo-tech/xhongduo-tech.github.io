<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg">
<title>圆法：单位圆上的主圆弧与从圆弧</title>
<desc>单位圆周上，围绕小分母有理点 a/q 的红色主圆弧与其余青色从圆弧；主圆弧承担主项，从圆弧贡献误差。</desc>
<rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
<circle cx="320" cy="200" r="150" fill="none" stroke="#333" stroke-width="2"/>
<line x1="320" y1="200" x2="620" y2="200" stroke="#333" stroke-width="1" stroke-dasharray="2 3"/>
<text x="620" y="220" font-family="sans-serif" font-size="13" fill="#333">α = 0 ≡ 1 (mod 1)</text>
<!-- major arcs around rational points: small red arcs -->
<!-- a/q = 0/1, 1/2, 1/3, 2/3, 1/4, 3/4, 1/5, 2/5, 3/5, 4/5 -->
<g stroke="#c0392b" stroke-width="7" fill="none">
  <path d="M 465 200 A 150 150 0 0 1 475 190" />
  <path d="M 165 200 A 150 150 0 0 0 155 190" />
  <path d="M 320 50 A 150 150 0 0 0 305 52" />
  <path d="M 320 350 A 150 150 0 0 1 305 348" />
  <path d="M 258 283 A 150 150 0 0 0 250 290" />
  <path d="M 382 117 A 150 150 0 0 1 390 110" />
  <path d="M 448 296 A 150 150 0 0 1 438 305" />
  <path d="M 192 104 A 150 150 0 0 0 202 95" />
  <path d="M 396 300 A 150 150 0 0 1 404 293" />
  <path d="M 244 100 A 150 150 0 0 0 236 107" />
</g>
<!-- labels for rational points -->
<g font-family="sans-serif" font-size="13" fill="#c0392b">
  <text x="470" y="195">0/1</text>
  <text x="160" y="196">1/2</text>
  <text x="300" y="44">1/3</text>
  <text x="300" y="372">2/3</text>
  <text x="244" y="298">1/4</text>
  <text x="398" y="104">3/4</text>
  <text x="452" y="312">1/5</text>
  <text x="176" y="88">2/5</text>
  <text x="402" y="318">3/5</text>
  <text x="222" y="84">4/5</text>
</g>
<!-- minor arcs: cyan band along the remaining circle -->
<g stroke="#1f6f8b" stroke-width="2" fill="none" opacity="0.9">
  <path d="M 620 200 A 150 150 0 0 1 470 295" />
  <path d="M 470 200 A 150 150 0 0 1 395 296" />
  <path d="M 320 350 A 150 150 0 0 1 246 289" />
  <path d="M 240 290 A 150 150 0 0 1 196 102" />
  <path d="M 244 102 A 150 150 0 0 1 396 102" />
</g>
<!-- legend -->
<rect x="44" y="300" width="190" height="74" fill="#fff" stroke="#333"/>
<line x1="56" y1="318" x2="88" y2="318" stroke="#c0392b" stroke-width="6"/>
<text x="98" y="322" font-family="sans-serif" font-size="13" fill="#333">主圆弧（局部/主项）</text>
<line x1="56" y1="344" x2="88" y2="344" stroke="#1f6f8b" stroke-width="4"/>
<text x="98" y="348" font-family="sans-serif" font-size="13" fill="#333">从圆弧（随机/误差）</text>
<text x="330" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">主圆弧围绕小分母有理点 a/q，从圆弧为其余部分</text>
</svg>
