<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">两单元并联可修系统的马尔可夫状态转移图</title>
<desc id="desc">状态0为双机正常，状态1为单机工作，状态2为双机失效；失效率转移向右，修复率转移向左。</desc>
<rect width="680" height="300" fill="#faf9f5"/>
<text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">两单元并联可修系统的马尔可夫状态转移图</text>

<defs>
  <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#c0392b"/>
  </marker>
  <marker id="arrow-rep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6f8b"/>
  </marker>
</defs>

<!-- 失效转移：向右（上方） -->
<path d="M 232 148 L 278 148" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrow-fail)"/>
<text x="255" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">2λ</text>
<path d="M 402 148 L 448 148" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrow-fail)"/>
<text x="425" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">λ</text>

<!-- 修复转移：向左（下方） -->
<path d="M 300 196 L 254 196" stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#arrow-rep)"/>
<text x="277" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">μ</text>
<path d="M 470 196 L 424 196" stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#arrow-rep)"/>
<text x="447" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">2μ</text>

<!-- 状态节点 -->
<g>
  <circle cx="170" cy="160" r="56" fill="#eef6f8" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="170" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold">状态0</text>
  <text x="170" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">双机正常</text>
  <text x="170" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">系统工作</text>
</g>
<g>
  <circle cx="340" cy="160" r="56" fill="#eef6f8" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b" font-weight="bold">状态1</text>
  <text x="340" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">单机工作</text>
  <text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">系统工作</text>
</g>
<g>
  <circle cx="510" cy="160" r="56" fill="#fdf0ef" stroke="#c0392b" stroke-width="2.5"/>
  <text x="510" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b" font-weight="bold">状态2</text>
  <text x="510" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">双机失效</text>
  <text x="510" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">系统失效</text>
</g>

<text x="340" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">λ = 单机失效率，μ = 单机修复率；失效向右，修复向左</text>
<text x="340" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">稳态可用度 A = P0 + P1 = 1 − (λ/(λ+μ))²</text>
</svg>
