<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" font-family="sans-serif">
  <title>计算机四代发展时间线</title>
  <desc>从 1946 年到 2026 年，计算机器件依次为电子管、晶体管、中小规模集成电路、大规模与超大规模集成电路（VLSI）；软件从机器语言、高级语言、操作系统演进到系统软件与人工智能。示意图非严格时间比例。</desc>
  <rect x="0" y="0" width="800" height="370" fill="#faf9f5"/>

  <!-- 时间轴 -->
  <line x1="40" y1="54" x2="768" y2="54" stroke="#c0392b" stroke-width="2"/>
  <polygon points="768,54 758,48 758,60" fill="#c0392b"/>
  <text x="780" y="59" font-size="14" fill="#c0392b">时间</text>

  <!-- 年份刻度 -->
  <line x1="40" y1="48" x2="40" y2="58" stroke="#999999" stroke-width="1"/>
  <text x="40" y="76" font-size="13" fill="#666666" text-anchor="middle">1946</text>
  <line x1="220" y1="48" x2="220" y2="58" stroke="#999999" stroke-width="1"/>
  <text x="220" y="76" font-size="13" fill="#666666" text-anchor="middle">1958</text>
  <line x1="400" y1="48" x2="400" y2="58" stroke="#999999" stroke-width="1"/>
  <text x="400" y="76" font-size="13" fill="#666666" text-anchor="middle">1965</text>
  <line x1="580" y1="48" x2="580" y2="58" stroke="#999999" stroke-width="1"/>
  <text x="580" y="76" font-size="13" fill="#666666" text-anchor="middle">1972</text>
  <line x1="760" y1="48" x2="760" y2="58" stroke="#999999" stroke-width="1"/>
  <text x="760" y="76" font-size="13" fill="#666666" text-anchor="middle">2026</text>

  <!-- 第一代：电子管 -->
  <rect x="40" y="88" width="180" height="196" rx="4" fill="#f6f2e9" stroke="#d9d3c5" stroke-width="1"/>
  <rect x="40" y="88" width="180" height="5" rx="2" fill="#c0392b" opacity="0.85"/>
  <text x="130" y="120" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">电子管时代</text>
  <text x="130" y="142" font-size="13" fill="#777777" text-anchor="middle">1946–1957</text>
  <line x1="52" y1="152" x2="208" y2="152" stroke="#e0dacb" stroke-width="1"/>
  <text x="130" y="178" font-size="14" fill="#333333" text-anchor="middle">器件：真空电子管</text>
  <text x="130" y="200" font-size="14" fill="#333333" text-anchor="middle">代表：ENIAC</text>
  <text x="130" y="222" font-size="14" fill="#333333" text-anchor="middle">软件：机器语言</text>

  <!-- 第二代：晶体管 -->
  <rect x="220" y="88" width="180" height="196" rx="4" fill="#f6f2e9" stroke="#d9d3c5" stroke-width="1"/>
  <rect x="220" y="88" width="180" height="5" rx="2" fill="#1f6f8b" opacity="0.85"/>
  <text x="310" y="120" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">晶体管时代</text>
  <text x="310" y="142" font-size="13" fill="#777777" text-anchor="middle">1958–1964</text>
  <line x1="232" y1="152" x2="388" y2="152" stroke="#e0dacb" stroke-width="1"/>
  <text x="310" y="178" font-size="14" fill="#333333" text-anchor="middle">器件：晶体管、磁芯</text>
  <text x="310" y="200" font-size="14" fill="#333333" text-anchor="middle">代表：IBM 7090</text>
  <text x="310" y="222" font-size="14" fill="#333333" text-anchor="middle">软件：高级语言</text>

  <!-- 第三代：中小规模集成电路 -->
  <rect x="400" y="88" width="180" height="196" rx="4" fill="#f6f2e9" stroke="#d9d3c5" stroke-width="1"/>
  <rect x="400" y="88" width="180" height="5" rx="2" fill="#c0392b" opacity="0.85"/>
  <text x="490" y="120" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">集成电路时代</text>
  <text x="490" y="142" font-size="13" fill="#777777" text-anchor="middle">1965–1971</text>
  <line x1="412" y1="152" x2="568" y2="152" stroke="#e0dacb" stroke-width="1"/>
  <text x="490" y="178" font-size="14" fill="#333333" text-anchor="middle">器件：中小规模 IC</text>
  <text x="490" y="200" font-size="14" fill="#333333" text-anchor="middle">代表：System/360</text>
  <text x="490" y="222" font-size="14" fill="#333333" text-anchor="middle">软件：操作系统</text>

  <!-- 第四代：大规模与超大规模集成电路 -->
  <rect x="580" y="88" width="180" height="196" rx="4" fill="#f6f2e9" stroke="#d9d3c5" stroke-width="1"/>
  <rect x="580" y="88" width="180" height="5" rx="2" fill="#1f6f8b" opacity="0.85"/>
  <text x="670" y="120" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">超大规模集成电路时代</text>
  <text x="670" y="142" font-size="13" fill="#777777" text-anchor="middle">1972–2026</text>
  <line x1="592" y1="152" x2="748" y2="152" stroke="#e0dacb" stroke-width="1"/>
  <text x="670" y="178" font-size="14" fill="#333333" text-anchor="middle">器件：大规模与 VLSI</text>
  <text x="670" y="200" font-size="14" fill="#333333" text-anchor="middle">代表：微处理器</text>
  <text x="670" y="222" font-size="14" fill="#333333" text-anchor="middle">软件：系统软件、AI</text>

  <text x="400" y="330" font-size="13" fill="#999999" text-anchor="middle">示意图 · 非严格时间比例，仅示意四个时代的大致先后</text>
</svg>
