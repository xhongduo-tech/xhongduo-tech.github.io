<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="sans-serif" role="img">
  <title>冯·诺依曼结构：五大部件与连接</title>
  <desc>计算机由运算器、控制器、存储器、输入设备、输出设备五大部件组成；运算器与控制器合称 CPU，与主存合称主机；青色箭头为数据/指令通路，红色箭头为控制信号。</desc>
  <rect x="0" y="0" width="920" height="600" fill="#faf9f5"/>
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 存储器 -->
  <rect x="330" y="40" width="260" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="460" y="82" text-anchor="middle" font-size="20" fill="#333">存储器（主存）</text>
  <text x="460" y="114" text-anchor="middle" font-size="14" fill="#666">存储体 · MAR · MDR</text>

  <!-- CPU 虚线容器 -->
  <rect x="200" y="250" width="520" height="170" rx="10" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="215" y="278" font-size="16" fill="#c0392b">CPU（中央处理器）</text>

  <!-- 运算器 -->
  <rect x="250" y="300" width="180" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="340" y="340" text-anchor="middle" font-size="18" fill="#333">运算器</text>
  <text x="340" y="368" text-anchor="middle" font-size="13" fill="#666">ALU · 累加器 ACC</text>

  <!-- 控制器 -->
  <rect x="490" y="300" width="180" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="580" y="340" text-anchor="middle" font-size="18" fill="#333">控制器</text>
  <text x="580" y="368" text-anchor="middle" font-size="13" fill="#666">CU · PC · IR</text>

  <!-- 输入设备 -->
  <rect x="70" y="470" width="200" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="170" y="512" text-anchor="middle" font-size="18" fill="#333">输入设备</text>
  <text x="170" y="540" text-anchor="middle" font-size="13" fill="#666">键盘 · 鼠标 · 扫描仪</text>

  <!-- 输出设备 -->
  <rect x="650" y="470" width="200" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="750" y="512" text-anchor="middle" font-size="18" fill="#333">输出设备</text>
  <text x="750" y="540" text-anchor="middle" font-size="13" fill="#666">显示器 · 打印机</text>

  <!-- 存储器 ↔ 运算器（数据/指令） -->
  <line x1="400" y1="150" x2="400" y2="300" stroke="#1f6f8b" stroke-width="2" marker-start="url(#arrD)" marker-end="url(#arrD)"/>
  <text x="408" y="228" font-size="14" fill="#1f6f8b">数据 / 指令</text>

  <!-- 控制器 → 存储器（控制） -->
  <line x1="560" y1="300" x2="560" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="572" y="225" font-size="14" fill="#c0392b">控制</text>

  <!-- 控制器 → 运算器（控制） -->
  <line x1="490" y1="345" x2="430" y2="345" stroke="#c0392b" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="454" y="338" text-anchor="middle" font-size="13" fill="#c0392b">控制</text>

  <!-- 输入设备 → 存储器（数据输入） -->
  <polyline points="170,470 170,95 328,95" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="180" y="250" font-size="14" fill="#1f6f8b">数据输入</text>

  <!-- 存储器 → 输出设备（数据输出） -->
  <polyline points="590,95 750,95 750,468" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="655" y="88" font-size="14" fill="#1f6f8b">数据输出</text>

  <!-- 控制器 → 输入设备（控制） -->
  <polyline points="500,390 500,430 110,430 110,468" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrC)"/>
  <!-- 控制器 → 输出设备（控制） -->
  <polyline points="670,390 670,430 690,430 690,468" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrC)"/>

  <!-- 图例 -->
  <line x1="210" y1="575" x2="280" y2="575" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="290" y="580" font-size="14" fill="#333">数据 / 指令通路</text>
  <line x1="540" y1="575" x2="610" y2="575" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrC)"/>
  <text x="620" y="580" font-size="14" fill="#333">控制信号</text>
</svg>
