<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
<title>四原则与共同道德的中继站结构</title>
<desc>共同道德位于底层，四条原则（尊重自主、不伤害、行善、公正）居于中层，具体规则与情境判断位于顶层，三层之间以箭头相连。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
</marker>
</defs>
<rect x="15" y="30" width="610" height="46" rx="6" fill="#ffffff" stroke="#333333"/>
<text x="320" y="59" text-anchor="middle" font-size="15" fill="#333333">具体规则与情境判断（Rules · Specification · Acts）</text>
<rect x="15" y="170" width="132" height="72" rx="6" fill="#ffffff" stroke="#333333"/>
<text x="81" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">尊重自主</text>
<text x="81" y="220" text-anchor="middle" font-size="13" fill="#333333">知情同意</text>
<rect x="172" y="170" width="132" height="72" rx="6" fill="#ffffff" stroke="#333333"/>
<text x="238" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">不伤害</text>
<text x="238" y="220" text-anchor="middle" font-size="13" fill="#333333">首先不害</text>
<rect x="329" y="170" width="132" height="72" rx="6" fill="#ffffff" stroke="#333333"/>
<text x="395" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">行善</text>
<text x="395" y="220" text-anchor="middle" font-size="13" fill="#333333">促进福祉</text>
<rect x="486" y="170" width="132" height="72" rx="6" fill="#ffffff" stroke="#333333"/>
<text x="552" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">公正</text>
<text x="552" y="220" text-anchor="middle" font-size="13" fill="#333333">公平分配</text>
<rect x="180" y="390" width="280" height="48" rx="6" fill="#faf9f5" stroke="#333333"/>
<text x="320" y="419" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">共同道德（Common Morality）</text>
<line x1="320" y1="390" x2="320" y2="330" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="81" y1="330" x2="552" y2="330" stroke="#c0392b" stroke-width="2"/>
<line x1="81" y1="330" x2="81" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="238" y1="330" x2="238" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="395" y1="330" x2="395" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="552" y1="330" x2="552" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="81" y1="170" x2="81" y2="76" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="238" y1="170" x2="238" y2="76" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="395" y1="170" x2="395" y2="76" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="552" y1="170" x2="552" y2="76" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
