<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <title>p-n 结平衡能带图</title>
  <desc>p 型区与 n 型区之间能带弯曲，费米能级拉平，空间电荷区两侧的导带底差为内建电势</desc>
  <rect x="0" y="0" width="480" height="320" fill="#faf9f5"/>
  <!-- 区域划分 -->
  <rect x="60" y="50" width="160" height="240" fill="#c0392b" opacity="0.08"/>
  <rect x="260" y="50" width="160" height="240" fill="#1f6f8b" opacity="0.08"/>
  <line x1="220" y1="50" x2="220" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="260" y1="50" x2="260" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="120" y="66" font-family="sans-serif" font-size="16" fill="#333">p 型区</text>
  <text x="330" y="66" font-family="sans-serif" font-size="16" fill="#333">n 型区</text>
  <text x="214" y="66" font-family="sans-serif" font-size="14" fill="#333">空间电荷区</text>
  <!-- 导带 -->
  <path d="M60 175 L220 175 C 226 175, 240 210, 260 210 L420 210" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="70" y="168" font-family="sans-serif" font-size="14" fill="#1f6f8b">E_c</text>
  <text x="408" y="222" font-family="sans-serif" font-size="14" fill="#1f6f8b">E_c</text>
  <!-- 价带 -->
  <path d="M60 235 L220 235 C 226 235, 240 270, 260 270 L420 270" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="70" y="228" font-family="sans-serif" font-size="14" fill="#c0392b">E_v</text>
  <text x="408" y="282" font-family="sans-serif" font-size="14" fill="#c0392b">E_v</text>
  <!-- 费米能级 -->
  <line x1="60" y1="225" x2="420" y2="225" stroke="#333" stroke-width="2" stroke-dasharray="8 3"/>
  <text x="150" y="242" font-family="sans-serif" font-size="14" fill="#333">E_F（费米能级）</text>
  <!-- 内建电势箭头 -->
  <line x1="440" y1="175" x2="440" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="435" y1="175" x2="445" y2="175" stroke="#333" stroke-width="1.5"/>
  <line x1="435" y1="210" x2="445" y2="210" stroke="#333" stroke-width="1.5"/>
  <text x="448" y="198" font-family="sans-serif" font-size="13" fill="#333">qV_bi</text>
</svg>
