<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>n 沟道 MOSFET 剖面结构图</title>
  <desc>p 型衬底上两个 n+ 源漏区，中间薄氧化层上方为栅极，栅压感生反型层沟道</desc>
  <rect x="0" y="0" width="480" height="300" fill="#faf9f5"/>
  <!-- 衬底 -->
  <rect x="60" y="180" width="360" height="100" fill="#e8e4dc" stroke="#333" stroke-width="1"/>
  <text x="240" y="262" font-family="sans-serif" font-size="15" fill="#333">p 型衬底</text>
  <!-- n+ 源区 -->
  <rect x="60" y="130" width="90" height="90" fill="#c0392b" opacity="0.55" stroke="#333" stroke-width="1"/>
  <text x="105" y="178" font-family="sans-serif" font-size="14" fill="#333">n+ 源区</text>
  <!-- n+ 漏区 -->
  <rect x="330" y="130" width="90" height="90" fill="#c0392b" opacity="0.55" stroke="#333" stroke-width="1"/>
  <text x="375" y="178" font-family="sans-serif" font-size="14" fill="#333">n+ 漏区</text>
  <!-- 氧化层 -->
  <rect x="150" y="130" width="180" height="50" fill="#d6e4ef" stroke="#333" stroke-width="1"/>
  <text x="240" y="161" font-family="sans-serif" font-size="14" fill="#333">氧化层 SiO₂</text>
  <!-- 栅极 -->
  <rect x="160" y="78" width="160" height="52" fill="#555" stroke="#333" stroke-width="1"/>
  <text x="240" y="110" font-family="sans-serif" font-size="15" fill="#faf9f5">栅极 Gate</text>
  <!-- 沟道（反型层） -->
  <rect x="150" y="180" width="180" height="14" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="240" y="232" font-family="sans-serif" font-size="13" fill="#1f6f8b">沟道（反型层）</text>
  <line x1="240" y1="222" x2="240" y2="198" stroke="#1f6f8b" stroke-width="1"/>
  <!-- 端子标注 -->
  <text x="105" y="118" font-family="sans-serif" font-size="16" fill="#333">S 源极</text>
  <text x="375" y="118" font-family="sans-serif" font-size="16" fill="#333">D 漏极</text>
  <line x1="60" y1="118" x2="60" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="118" x2="420" y2="130" stroke="#333" stroke-width="2"/>
</svg>
