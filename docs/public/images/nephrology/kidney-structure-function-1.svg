<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="sans-serif">
  <title>肾单位结构与血液供应</title>
  <desc>肾单位示意图：肾小体（肾小球与肾小囊）、近端小管、髓袢、远端小管、集合管，以及入球/出球小动脉、管周毛细血管与直小血管；皮质在上、髓质在下。</desc>
  <rect x="0" y="0" width="760" height="560" fill="#faf9f5"/>
  <line x1="0" y1="150" x2="760" y2="150" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="70" y="140" font-size="15" fill="#333">皮质</text>
  <text x="70" y="525" font-size="15" fill="#333">髓质</text>

  <!-- 肾小体：Bowman 囊 -->
  <ellipse cx="180" cy="82" rx="52" ry="46" fill="#f2e3c8" stroke="#b07c3e" stroke-width="2"/>
  <!-- 肾小球毛细血管丛 -->
  <circle cx="180" cy="80" r="30" fill="#f4c7c3" stroke="#c0392b" stroke-width="2"/>
  <path d="M160 68 a28 22 0 0 1 34 -6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M166 96 a26 24 0 0 1 30 2" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M168 74 a30 26 0 0 1 8 30" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="40" font-size="14" fill="#333">肾小体（肾小球 + 肾小囊）</text>

  <!-- 入球小动脉 -->
  <path d="M40 62 L118 66 L150 74" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polygon points="150,74 139,66 141,80" fill="#c0392b"/>
  <text x="34" y="48" font-size="14" fill="#333">入球小动脉</text>

  <!-- 出球小动脉 -->
  <path d="M204 90 L262 104 L300 120 L330 118" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polygon points="330,118 319,112 319,125" fill="#c0392b"/>
  <text x="246" y="94" font-size="14" fill="#333">出球小动脉</text>

  <!-- 管周毛细血管 -->
  <path d="M300 120 q30 -18 60 -6 q34 14 60 -8" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="300" y="48" font-size="14" fill="#333">管周毛细血管</text>

  <!-- 近端小管（盘曲） -->
  <path d="M232 96 q34 34 8 40 q-30 4 -4 36 q34 30 4 52" fill="none" stroke="#b07c3e" stroke-width="5"/>
  <text x="238" y="62" font-size="14" fill="#333">近端小管</text>

  <!-- 髓袢降支（细段） -->
  <path d="M260 238 L276 400 L292 428" fill="none" stroke="#b07c3e" stroke-width="4"/>
  <!-- 髓袢升支（粗段） -->
  <path d="M300 432 L330 392 L348 160" fill="none" stroke="#b07c3e" stroke-width="6"/>
  <text x="252" y="330" font-size="14" fill="#333">髓袢降支</text>
  <text x="352" y="330" font-size="14" fill="#333">髓袢升支</text>

  <!-- 直小血管（发夹样伴行） -->
  <path d="M225 150 L225 420 M225 420 L222 150" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M225 150 L228 410 L225 150" fill="none" stroke="#1f6f8b" stroke-width="2" opacity="0.7"/>
  <text x="202" y="480" font-size="14" fill="#333">直小血管</text>

  <!-- 远端小管（盘曲） -->
  <path d="M348 160 q40 -22 20 24 q-22 40 6 44 q30 6 10 30" fill="none" stroke="#b07c3e" stroke-width="5"/>
  <text x="368" y="96" font-size="14" fill="#333">远端小管</text>

  <!-- 集合管 -->
  <path d="M400 168 L422 200 L420 500" fill="none" stroke="#b07c3e" stroke-width="7"/>
  <text x="436" y="320" font-size="14" fill="#333">集合管</text>
  <polygon points="420,520 409,504 431,504" fill="#b07c3e"/>
  <text x="436" y="540" font-size="14" fill="#333">尿液 → 肾盏</text>

  <!-- 足细胞示意 -->
  <g opacity="0.0"></g>
</svg>
