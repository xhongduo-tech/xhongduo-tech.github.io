<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <title>慢性肾脏病的肾功能下降轨迹</title>
  <desc>CKD 中 eGFR 随时间下降：未干预时斜率陡峭，早期诊断并综合干预（降压、降蛋白尿、控糖、纠正酸中毒与磷代谢）后斜率变平，推迟进入 G5 透析阶段的时间。</desc>
  <rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>

  <!-- axes -->
  <line x1="90" y1="55" x2="90" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="360" x2="660" y2="360" stroke="#333" stroke-width="2"/>
  <polygon points="90,41 82,57 98,57" fill="#333"/>
  <polygon points="674,360 658,352 658,368" fill="#333"/>
  <text x="24" y="46" font-size="14" fill="#333">eGFR</text>
  <text x="590" y="382" font-size="14" fill="#333">时间（年）</text>
  <text x="98" y="363" font-size="13" fill="#333">90</text>
  <text x="98" y="245" font-size="13" fill="#333">60</text>
  <text x="98" y="140" font-size="13" fill="#333">30</text>
  <text x="98" y="98" font-size="13" fill="#333">15</text>

  <!-- stage bands -->
  <rect x="90" y="55" width="570" height="66" fill="#f2e3c8" opacity="0.5"/>
  <rect x="90" y="121" width="570" height="66" fill="#f4c7c3" opacity="0.4"/>
  <line x1="90" y1="98" x2="660" y2="98" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="540" y="86" font-size="13" fill="#c0392b">G5 透析期（eGFR &lt; 15）</text>

  <!-- intervention point -->
  <circle cx="250" cy="228" r="6" fill="#333"/>
  <text x="160" y="218" font-size="14" fill="#333">诊断点：早期干预</text>
  <line x1="250" y1="228" x2="250" y2="358" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- untreated steep line -->
  <path d="M110 205 C180 218 250 228 300 238 C360 250 420 262 470 275 L620 320" fill="none" stroke="#c0392b" stroke-width="4"/>
  <text x="540" y="300" font-size="15" fill="#c0392b">未干预：斜率陡</text>

  <!-- treated flat line -->
  <path d="M250 228 C300 245 380 268 470 288 C530 300 600 312 640 318" fill="none" stroke="#1f6f8b" stroke-width="4"/>
  <text x="470" y="258" font-size="15" fill="#1f6f8b">综合干预：斜率变平</text>

  <!-- annotation arrows -->
  <line x1="520" y1="278" x2="480" y2="298" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="580" y1="308" x2="580" y2="290" stroke="#333" stroke-width="1.5"/>
  <text x="592" y="300" font-size="13" fill="#333">推迟进入 G5</text>
</svg>
