<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <title>肾小球滤过的 Starling 力</title>
  <desc>肾小球毛细血管腔与鲍曼囊腔之间的四个压力：毛细血管静水压 60、囊内压 18、毛细血管胶体渗透压 32、囊内渗透压约 0，净滤过压约 10 mmHg。</desc>
  <rect x="0" y="0" width="720" height="400" fill="#faf9f5"/>

  <!-- 毛细血管腔 -->
  <rect x="40" y="90" width="240" height="220" rx="18" fill="#f4c7c3" stroke="#c0392b" stroke-width="2"/>
  <text x="70" y="205" font-size="17" fill="#333">肾小球</text>
  <text x="70" y="230" font-size="17" fill="#333">毛细血管腔</text>

  <!-- 鲍曼囊腔 -->
  <rect x="440" y="90" width="240" height="220" rx="18" fill="#dcecf1" stroke="#1f6f8b" stroke-width="2"/>
  <text x="470" y="205" font-size="17" fill="#333">鲍曼囊腔</text>
  <text x="470" y="230" font-size="17" fill="#333">（原尿）</text>

  <!-- 滤过屏障 -->
  <rect x="292" y="90" width="136" height="220" fill="#f2e3c8" stroke="#b07c3e" stroke-width="2"/>
  <text x="302" y="120" font-size="14" fill="#333">滤过屏障</text>
  <text x="302" y="140" font-size="14" fill="#333">内皮 / 基底膜 /</text>
  <text x="302" y="160" font-size="14" fill="#333">裂孔隔膜</text>

  <!-- PGC -->
  <line x1="120" y1="180" x2="300" y2="180" stroke="#c0392b" stroke-width="5"/>
  <polygon points="300,180 284,171 284,189" fill="#c0392b"/>
  <text x="150" y="168" font-size="16" fill="#c0392b">P_GC = 60 mmHg</text>

  <!-- PBC -->
  <line x1="520" y1="240" x2="440" y2="240" stroke="#1f6f8b" stroke-width="5"/>
  <polygon points="440,240 456,231 456,249" fill="#1f6f8b"/>
  <text x="452" y="228" font-size="16" fill="#1f6f8b">P_BC = 18 mmHg</text>

  <!-- piGC -->
  <line x1="520" y1="270" x2="330" y2="270" stroke="#666" stroke-width="4" stroke-dasharray="7 5"/>
  <polygon points="330,270 346,261 346,279" fill="#666"/>
  <text x="382" y="262" font-size="16" fill="#666">π_GC = 32 mmHg</text>

  <!-- piBC -->
  <line x1="330" y1="300" x2="450" y2="300" stroke="#888" stroke-width="3" stroke-dasharray="5 4"/>
  <polygon points="450,300 434,291 434,309" fill="#888"/>
  <text x="352" y="322" font-size="15" fill="#888">π_BC ≈ 0 mmHg</text>

  <!-- Net -->
  <line x1="120" y1="130" x2="360" y2="130" stroke="#333" stroke-width="6"/>
  <polygon points="360,130 344,121 344,139" fill="#333"/>
  <text x="150" y="120" font-size="16" fill="#333">净滤过压 = 10 mmHg</text>
  <text x="150" y="64" font-size="15" fill="#333">GFR = Kf × 净滤过压 = 12.5 × 10 = 125 mL/min</text>
</svg>
