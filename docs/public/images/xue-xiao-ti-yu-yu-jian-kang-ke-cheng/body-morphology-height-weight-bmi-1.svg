<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
  <title>BMI 分类量尺示意图</title>
  <desc>一条从偏瘦到肥胖的 BMI 量尺，标注各分类区间与边界值</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="320" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">BMI 分类量尺（成年人参考标准）</text>

  <!-- 量尺：BMI 15 到 30 映射到 x=60 到 x=580 -->
  <!-- 偏瘦 zone：15–18.5 -->
  <rect x="60" y="110" width="82.5" height="60" fill="#f5d6a8" stroke="#333" stroke-width="1"/>
  <!-- 正常 zone：18.5–24 -->
  <rect x="142.5" y="110" width="123.75" height="60" fill="#a8d5a8" stroke="#333" stroke-width="1"/>
  <!-- 超重 zone：24–28 -->
  <rect x="266.25" y="110" width="90" height="60" fill="#f0c060" stroke="#333" stroke-width="1"/>
  <!-- 肥胖 zone：28–30 -->
  <rect x="356.25" y="110" width="45" height="60" fill="#d97b6c" stroke="#333" stroke-width="1"/>

  <!-- 刻度 -->
  <line x1="60" y1="170" x2="60" y2="180" stroke="#333" stroke-width="2"/>
  <text x="60" y="198" text-anchor="middle" font-size="14" fill="#333">15</text>
  <line x1="142.5" y1="170" x2="142.5" y2="180" stroke="#333" stroke-width="2"/>
  <text x="142.5" y="198" text-anchor="middle" font-size="14" fill="#333">18.5</text>
  <line x1="266.25" y1="170" x2="266.25" y2="180" stroke="#333" stroke-width="2"/>
  <text x="266.25" y="198" text-anchor="middle" font-size="14" fill="#333">24</text>
  <line x1="356.25" y1="170" x2="356.25" y2="180" stroke="#333" stroke-width="2"/>
  <text x="356.25" y="198" text-anchor="middle" font-size="14" fill="#333">28</text>
  <line x1="401.25" y1="170" x2="401.25" y2="180" stroke="#333" stroke-width="2"/>
  <text x="401.25" y="198" text-anchor="middle" font-size="14" fill="#333">30</text>

  <!-- 分类标签 -->
  <text x="101" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">偏瘦</text>
  <text x="204" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">正常</text>
  <text x="311" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">超重</text>
  <text x="379" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">肥胖</text>

  <!-- 注释 -->
  <text x="320" y="235" text-anchor="middle" font-size="14" fill="#1f6f8b">单位：kg/m²（体重千克 ÷ 身高米²）</text>
  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#666">儿童青少年按性别、年龄对应的百分位标准判定</text>
  <text x="320" y="284" text-anchor="middle" font-size="13" fill="#c0392b">分类边界以正式标准文件为准，上图仅供理解量尺逻辑</text>
</svg>
