<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>加壳与脱壳的运行时流程</title>
<desc>展示加壳程序的生命周期：文件里只有壳代码与加密数据，运行期壳解包还原原始代码，最后跳到原始入口点 OEP 开始执行真实程序。</desc>
<rect x="0" y="0" width="780" height="400" fill="#faf9f5"/>
<text x="390" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">加壳程序的生命周期：从磁盘到 OEP</text>

<!-- 左：磁盘镜像 -->
<text x="150" y="66" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">磁盘上的文件</text>
<rect x="40" y="80" width="220" height="34" rx="4" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="60" y="102" font-size="13" fill="#333">壳代码（入口，可读）</text>
<rect x="40" y="118" width="220" height="34" rx="4" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="60" y="140" font-size="13" fill="#333">加密/压缩的原始代码</text>
<text x="150" y="178" text-anchor="middle" font-size="13" fill="#333">高熵、导入表极简</text>

<!-- 中：还原循环 -->
<text x="390" y="66" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">运行期：解包器还原</text>
<rect x="300" y="80" width="180" height="34" rx="4" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="390" y="102" text-anchor="middle" font-size="13" fill="#333">执行壳代码</text>
<rect x="300" y="118" width="180" height="34" rx="4" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="390" y="140" text-anchor="middle" font-size="13" fill="#333">逐段解密/解压到内存</text>
<rect x="300" y="156" width="180" height="34" rx="4" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="390" y="178" text-anchor="middle" font-size="13" fill="#333">rep movsb / xor 循环</text>

<!-- 右：还原后 -->
<text x="630" y="66" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">还原后的内存</text>
<rect x="540" y="80" width="180" height="34" rx="4" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="560" y="102" font-size="13" fill="#333">原始代码（可读）</text>
<rect x="540" y="118" width="180" height="34" rx="4" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="140" font-size="13" fill="#333">OEP：控制权移交点</text>

<!-- 箭头 -->
<path d="M 260 110 L 296 110" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 484 110 L 536 110" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="210" text-anchor="middle" font-size="13" fill="#333">分析者的出手点：对还原后的代码区下内存访问断点，跟到 OEP</text>

<!-- 底部：脱壳四步 -->
<g font-size="13" fill="#333">
<rect x="60" y="250" width="660" height="110" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="80" y="276" font-size="14" fill="#c0392b" font-weight="bold">手工脱壳四步</text>
<text x="80" y="302">① 调试器加载，停在壳入口，单步观察还原方向</text>
<text x="80" y="324">② 对原始代码区下内存访问断点，等还原循环命中</text>
<text x="80" y="346">③ 单步跟到 OEP（函数序言、首个真实调用）</text>
</g>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
</marker>
</defs>
</svg>
