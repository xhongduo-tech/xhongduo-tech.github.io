<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>递归下降反汇编得到的控制流图</title>
<desc>四个基本块组成的控制流图：0x401000 块内 test 后条件分支 jz 分出两个出口，0x401008 块经 jmp 连到 0x401025，0x401020 块顺序连接到 0x401025。</desc>
<rect x="0" y="0" width="760" height="520" fill="#faf9f5"/>
<text x="380" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">控制流图（CFG）：四个基本块与四条边</text>

<!-- 基本块 A -->
<g>
<rect x="40" y="70" width="300" height="130" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="60" y="98" font-size="15" fill="#c0392b" font-weight="bold">块A 0x401000</text>
<text x="60" y="124" font-size="13" fill="#333">mov eax,[rsp+8]</text>
<text x="60" y="148" font-size="13" fill="#333">test eax,eax  置ZF</text>
<text x="60" y="172" font-size="13" fill="#333">jz 0x401020  (条件分支)</text>
</g>

<!-- 基本块 B -->
<g>
<rect x="420" y="70" width="300" height="130" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="440" y="98" font-size="15" fill="#c0392b" font-weight="bold">块B 0x401008</text>
<text x="440" y="124" font-size="13" fill="#333">add eax,1</text>
<text x="440" y="148" font-size="13" fill="#333">mov [rsp+8],eax</text>
<text x="440" y="172" font-size="13" fill="#333">jmp 0x401025  (无条件跳转)</text>
</g>

<!-- 基本块 C -->
<g>
<rect x="420" y="280" width="300" height="90" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="440" y="308" font-size="15" fill="#c0392b" font-weight="bold">块C 0x401020</text>
<text x="440" y="334" font-size="13" fill="#333">mov eax,0  (分支目标入口)</text>
</g>

<!-- 基本块 D -->
<g>
<rect x="40" y="400" width="300" height="80" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="60" y="428" font-size="15" fill="#c0392b" font-weight="bold">块D 0x401025</text>
<text x="60" y="454" font-size="13" fill="#333">ret  (唯一出口)</text>
</g>

<!-- 边：A fallthrough -> B -->
<line x1="340" y1="135" x2="420" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380" y="124" text-anchor="middle" font-size="13" fill="#1f6f8b">ZF=0 顺序执行</text>

<!-- 边：A jz -> C -->
<path d="M 190 200 L 190 250 Q 190 268 208 268 L 420 268 Q 570 268 570 280" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="352" y="262" text-anchor="middle" font-size="13" fill="#c0392b">jz 成立（ZF=1）</text>

<!-- 边：C -> D -->
<path d="M 570 370 L 570 386 Q 570 400 420 400 L 340 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="392" text-anchor="middle" font-size="13" fill="#333">顺序连接</text>

<!-- 边：B jmp -> D -->
<path d="M 420 135 L 340 135 Q 120 135 120 268 Q 120 400 190 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="268" text-anchor="middle" font-size="13" fill="#1f6f8b">jmp 无条件</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
</marker>
</defs>
</svg>
