<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">曲率与密切圆示意图</title>
  <desc id="desc">一条向上弯折的曲线 α(s)（墨色抛物线）从左上向右下延伸、在切点 P 处最「凹」。青色直线是过 P 的切线，红色虚线圆是密切圆（曲率圆），圆心 C 在 P 的法线方向上，红色线段 PC 的长度即曲率半径 ρ = 1/κ。曲率刻画切向量方向随弧长变化的快慢，弯曲越厉害，ρ 越小、κ 越大。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 曲线 α(s)（墨色抛物线，顶点在 P） -->
  <path d="M 230 372.6 L 240 360 L 250 348.6 L 260 338.4 L 270 329.4 L 280 321.6 L 290 315 L 300 309.6 L 310 305.4 L 320 302.4 L 330 300.6 L 340 300 L 350 300.6 L 360 302.4 L 370 305.4 L 380 309.6 L 390 315 L 400 321.6 L 410 329.4 L 420 338.4 L 430 348.6 L 440 360 L 450 372.6" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 弧长增大方向小箭头 -->
  <path d="M 260 338.4 L 276 333" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 420 338.4 L 436 333" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 切线（青色，过 P） -->
  <line x1="230" y1="300" x2="450" y2="300" stroke="#1f6f8b" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>

  <!-- 密切圆（红色虚线，圆心 C 半径 ρ） -->
  <circle cx="340" cy="217" r="83" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- 曲率半径 ρ（P → C，红色箭头） -->
  <line x1="340" y1="300" x2="340" y2="222" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow-red)"/>

  <!-- 关键点 -->
  <circle cx="340" cy="300" r="5" fill="#333"/>
  <circle cx="340" cy="217" r="5" fill="#c0392b"/>

  <!-- 文字标注 -->
  <g font-size="15" fill="#333">
    <text x="352" y="318">切点 P = α(s₀)</text>
    <text x="368" y="258" fill="#c0392b">ρ = 1/κ</text>
    <text x="352" y="206" fill="#c0392b">曲率中心 C</text>
    <text x="430" y="172" fill="#c0392b">密切圆（曲率圆）</text>
    <text x="232" y="330" fill="#1f6f8b">切线 T</text>
    <text x="458" y="392" fill="#333">曲线 α(s)</text>
    <text x="320" y="242" fill="#c0392b" font-size="16">N</text>
    <text x="70" y="60" font-size="14" fill="#777">弯曲越厉害 → κ 越大 → ρ = 1/κ 越小</text>
  </g>
</svg>
