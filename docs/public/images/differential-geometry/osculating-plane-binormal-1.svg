<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">密切平面与 Frenet 标架示意图</title>
  <desc id="desc">墨色曲线 α(s)（山谷形）的凹侧朝下。青色半透明平行四边形是与曲线在切点 P 贴合得最好的密切平面（由切向量 T 与主法向量 N 张成，也是密切圆所在平面）。红色箭头 T 沿切线方向，红色箭头 N 指向曲率中心 C（凹侧），绿色短箭头 B = T × N 是副法向量，指向读者（垂直于密切平面）。红色虚线圆是密切圆。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 密切平面（青色半透明平行四边形，示意纸面所在的平面） -->
  <polygon points="70,110 610,120 640,360 70,340" fill="#1f6f8b" fill-opacity="0.10" stroke="#1f6f8b" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 密切圆（红色虚线，圆心 C 在 P 的正下方，凹侧） -->
  <circle cx="340" cy="378" r="118" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- 曲线 α(s)（山谷形，墨色） -->
  <path d="M 70,150 C 180,330 460,330 570,150" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>

  <!-- 切向量 T（红色，过 P 水平向右） -->
  <line x1="320" y1="260" x2="430" y2="260" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>

  <!-- 主法向量 N（红色，P → 曲率中心方向，竖直向下） -->
  <line x1="340" y1="260" x2="340" y2="362" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>

  <!-- 副法向量 B（绿色，垂直纸面指向读者，用 ⊙ 表示） -->
  <line x1="348" y1="246" x2="398" y2="192" stroke="#2e8b57" stroke-width="2.6"/>
  <circle cx="398" cy="192" r="6" fill="#2e8b57"/>
  <circle cx="398" cy="192" r="2.2" fill="#faf9f5"/>

  <!-- 关键点 -->
  <circle cx="340" cy="260" r="5" fill="#333"/>
  <circle cx="340" cy="378" r="5" fill="#c0392b"/>

  <!-- 文字标注 -->
  <g font-size="15" fill="#333">
    <text x="348" y="252">切点 P = α(s₀)</text>
    <text x="352" y="288" fill="#c0392b">N（指向曲率中心 C）</text>
    <text x="352" y="392" fill="#c0392b">曲率中心 C</text>
    <text x="436" y="252" fill="#c0392b">T（切向量）</text>
    <text x="412" y="176" fill="#2e8b57">B = T × N（指向读者）</text>
    <text x="452" y="330" fill="#1f6f8b">密切平面（T 与 N 张成）</text>
    <text x="70" y="60" font-size="14" fill="#777">密切平面 = 密切圆所在平面：曲线在 P 附近最贴近的平面</text>
  </g>
</svg>
