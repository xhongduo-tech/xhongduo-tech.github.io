<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">正则曲线、切线与参数点示意图</title>
  <desc id="desc">一条光滑的正则曲线 α(t)（墨色 S 形曲线）从左上向右下延伸，参数 t 增大方向用箭头标出。青色直线是过点 α(t₁) 的切线，红色箭头是该点的切向量 α′(t₁)。曲线上标出三个参数点 t₀、t₁、t₂，其中 t₁ 为切点处参数。曲线处处光滑、没有尖点，这是正则性的直观体现。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 正则曲线 α(t)（墨色 S 形） -->
  <path d="M 60 313.2 L 70 312.4 L 80 311.6 L 90 310.6 L 100 309.6 L 110 308.5 L 120 307.2 L 130 305.9 L 140 304.4 L 150 302.7 L 160 300.9 L 170 299.0 L 180 296.9 L 190 294.6 L 200 292.1 L 210 289.5 L 220 286.6 L 230 283.6 L 240 280.4 L 250 277.0 L 260 273.4 L 270 269.6 L 280 265.7 L 290 261.7 L 300 257.5 L 310 253.2 L 320 248.9 L 330 244.4 L 340 240.0 L 350 235.6 L 360 231.1 L 370 226.8 L 380 222.5 L 390 218.3 L 400 214.3 L 410 210.4 L 420 206.6 L 430 203.0 L 440 199.6 L 450 196.4 L 460 193.4 L 470 190.5 L 480 187.9 L 490 185.4 L 500 183.1 L 510 181.0 L 520 179.1 L 530 177.3 L 540 175.6 L 550 174.1 L 560 172.8 L 570 171.5 L 580 170.4 L 590 169.4 L 600 168.4 L 610 167.6 L 620 166.8" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 参数 t 增大方向的小箭头（沿曲线） -->
  <path d="M 180 296.9 L 196 293.5" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 500 183.1 L 516 179.7" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 切线（青色，过 α(t₁)） -->
  <line x1="210" y1="297.8" x2="470" y2="182.2" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow-cyan)"/>

  <!-- 切向量 α′(t₁)（红色箭头，自切点出发） -->
  <line x1="340" y1="240" x2="410" y2="208.9" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- 参数点 -->
  <g>
    <circle cx="140" cy="304.4" r="4" fill="#333"/>
    <circle cx="340" cy="240" r="5" fill="#c0392b"/>
    <circle cx="500" cy="183.1" r="4" fill="#333"/>
  </g>

  <!-- 文字标注 -->
  <g font-size="15" fill="#333">
    <text x="138" y="327">t₀</text>
    <text x="498" y="172">t₂</text>
    <text x="446" y="238" fill="#1f6f8b">切线 l(t₁)</text>
    <text x="352" y="200" fill="#c0392b">切向量 α′(t₁)</text>
    <text x="352" y="268">切点 α(t₁)</text>
    <text x="540" y="150" fill="#333">正则曲线 α(t)</text>
    <text x="70" y="382" font-size="14" fill="#777">参数 t 增大方向 →</text>
  </g>
</svg>
