<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LIGO 迈克耳孙干涉仪光学布局</title>
<desc>激光从左侧进入，经分光镜分束进入两条互相垂直的臂，臂端为悬挂的端镜（法布里-珀罗腔），两束光返回分光镜合束干涉后被光电探测器读取。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<!-- laser source -->
<rect x="40" y="180" width="70" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="75" y="205" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">激光器</text>
<!-- beam splitter -->
<rect x="170" y="185" width="10" height="30" rx="1" fill="#c0392b" stroke="#333" stroke-width="1"/>
<text x="210" y="170" font-family="sans-serif" font-size="13" fill="#333">分光镜</text>
<!-- incident beam -->
<line x1="110" y1="200" x2="170" y2="200" stroke="#c0392b" stroke-width="3"/>
<!-- arm to x-mirror (east) -->
<line x1="175" y1="195" x2="420" y2="195" stroke="#1f6f8b" stroke-width="3"/>
<line x1="175" y1="205" x2="420" y2="205" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="6 6"/>
<!-- x-mirror -->
<rect x="420" y="170" width="10" height="60" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="470" y="163" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">端镜 X</text>
<text x="470" y="178" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">(法布里-珀罗腔)</text>
<!-- arm to y-mirror (north) -->
<line x1="185" y1="200" x2="185" y2="80" stroke="#1f6f8b" stroke-width="3"/>
<line x1="175" y1="200" x2="175" y2="80" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="6 6"/>
<!-- y-mirror -->
<rect x="160" y="60" width="60" height="10" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="190" y="45" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">端镜 Y</text>
<text x="190" y="30" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">(法布里-珀罗腔)</text>
<!-- returning beam to photodetector -->
<line x1="175" y1="215" x2="320" y2="300" stroke="#c0392b" stroke-width="3"/>
<line x1="185" y1="215" x2="320" y2="305" stroke="#c0392b" stroke-width="3"/>
<!-- photodetector -->
<rect x="318" y="295" width="70" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="353" y="312" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">光电探测器</text>
<!-- arm labels -->
<text x="300" y="230" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">臂长 L = 4 km</text>
<text x="240" y="130" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">臂长 L = 4 km</text>
<!-- incident/return labels -->
<text x="140" y="215" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">入射</text>
<text x="245" y="290" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">合束干涉</text>
<!-- title -->
<text x="320" y="395" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">引力波使两臂长度差随时间变化，干涉光强随之起伏</text>
</svg>
