<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="sans-serif">
  <title>三角形的五心与欧拉线</title>
  <desc>三角形 ABC 中，外心 O、重心 G、垂心 H 三点共线（欧拉线），且 OG:GH = 1:2；内心 I 位于三角形内部。</desc>
  <rect x="0" y="0" width="420" height="320" fill="#faf9f5"/>
  <g stroke="#999" stroke-dasharray="6 4" stroke-width="1" fill="none">
    <line x1="40" y1="270" x2="285" y2="155"/>
    <line x1="360" y1="260" x2="125" y2="160"/>
    <line x1="210" y1="50" x2="200" y2="265"/>
  </g>
  <g stroke="#999" stroke-dasharray="2 3" stroke-width="1" fill="none">
    <line x1="40" y1="270" x2="256.6" y2="115.2"/>
    <line x1="360" y1="260" x2="164.5" y2="108.9"/>
    <line x1="210" y1="50" x2="216.7" y2="264"/>
  </g>
  <circle cx="198.5" cy="217" r="167.1" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="8 4" fill="none"/>
  <line x1="198.5" y1="217" x2="213" y2="146.4" stroke="#c0392b" stroke-width="2"/>
  <polygon points="40,270 360,260 210,50" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="198.5" cy="217" r="4" fill="#1f6f8b"/>
  <circle cx="203.3" cy="193.3" r="4" fill="#c0392b"/>
  <circle cx="207.5" cy="184.5" r="4" fill="#8a6d1f"/>
  <circle cx="213" cy="146.4" r="4" fill="#c0392b"/>
  <text x="40" y="292" font-size="16" fill="#333" font-weight="bold">A</text>
  <text x="368" y="282" font-size="16" fill="#333" font-weight="bold">B</text>
  <text x="206" y="44" font-size="16" fill="#333" font-weight="bold">C</text>
  <text x="128" y="222" font-size="14" fill="#1f6f8b">O 外心</text>
  <text x="132" y="200" font-size="14" fill="#c0392b">G 重心</text>
  <text x="232" y="188" font-size="14" fill="#8a6d1f">I 内心</text>
  <text x="236" y="150" font-size="14" fill="#c0392b">H 垂心</text>
  <text x="40" y="40" font-size="15" fill="#333" font-weight="bold">欧拉线：O—G—H 共线，OG : GH = 1 : 2</text>
  <g stroke="#999" stroke-width="0.8" fill="none">
    <line x1="142" y1="218" x2="194" y2="217"/>
    <line x1="146" y1="196" x2="199" y2="194"/>
    <line x1="228" y1="186" x2="211" y2="185"/>
    <line x1="232" y1="152" x2="217" y2="150"/>
  </g>
  <text x="52" y="305" font-size="13" fill="#666">虚线：中线与高；青色虚线圆：外接圆</text>
</svg>
