<svg viewBox="0 0 640 420" width="640" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>欧氏梯度与自然梯度对比</title>
  <desc>Fisher 度量下等高线呈椭圆，普通梯度沿坐标轴方向（黑色箭头）并不垂直于等高线；自然梯度（红色箭头）经 g 逆旋转后垂直等高线，直指极小。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <!-- 椭圆等高线（Fisher 度量下的同心圆被坐标系拉伸） -->
  <g fill="none" stroke="#1f6f8b" stroke-width="1.2" opacity="0.45">
    <ellipse cx="320" cy="210" rx="60" ry="110"/>
    <ellipse cx="320" cy="210" rx="110" ry="170"/>
    <ellipse cx="320" cy="210" rx="160" ry="225"/>
  </g>
  <!-- 坐标轴 -->
  <line x1="60" y1="210" x2="580" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="320" y1="400" x2="320" y2="20" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="565" y="230" font-family="sans-serif" font-size="16" fill="#666">θ¹</text>
  <text x="332" y="34" font-family="sans-serif" font-size="16" fill="#666">θ²</text>

  <!-- 起点 -->
  <circle cx="150" cy="150" r="8" fill="#333"/>
  <text x="120" y="138" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold">θ₀</text>

  <!-- 普通梯度（黑色）沿坐标方向，不垂直等高线 -->
  <path d="M 150 150 L 90 220" fill="none" stroke="#333" stroke-width="3.5"/>
  <text x="60" y="250" font-family="sans-serif" font-size="15" fill="#333">普通梯度 ∇L</text>

  <!-- 自然梯度（红色）垂直等高线 -->
  <path d="M 150 150 L 290 320" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="240" y="352" font-family="sans-serif" font-size="15" fill="#c0392b">自然梯度 g⁻¹∇L</text>

  <!-- 极小点 -->
  <circle cx="320" cy="210" r="8" fill="#c0392b"/>
  <text x="330" y="204" font-family="sans-serif" font-size="18" fill="#c0392b" font-weight="bold">θ*</text>

  <!-- 直角示意：自然梯度垂直于等高线 -->
  <path d="M 170 120 L 162 132 L 174 140 L 182 128 Z" fill="#c0392b" opacity="0.5"/>
  <text x="350" y="120" font-family="sans-serif" font-size="14" fill="#666">椭圆 = Fisher 度量下等「分布距离」的圆</text>
</svg>
