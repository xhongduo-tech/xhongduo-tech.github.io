<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">康托尔蛇形枚举：N×N 与 N 对等</title>
  <desc id="desc">以 m 为横轴、n 为纵轴的格点图，展示康托尔蛇形枚举。深青色圆点按对角线来回顺序标号 1 到 21，并连成一条折线；浅灰色圆点是尚未被枚举到的格点。蛇形从 (0,0) 出发，先沿 m 增大方向走到 (1,0)，再沿对角线向 n 增大方向走到 (0,1)、(0,2)，随后沿对角线折回走到 (2,0)、(3,0)，如此往返覆盖全部格点，正好给出 N×N 到 N 的双射。</desc>
  <rect x="0" y="0" width="520" height="400" fill="#faf9f5"/>
  <text x="260" y="28" font-size="17" fill="#333" font-weight="bold" text-anchor="middle">康托尔蛇形枚举：N×N 与 N 对等</text>

  <!-- 坐标轴 -->
  <line x1="50" y1="360" x2="410" y2="360" stroke="#333" stroke-width="1.6"/>
  <polygon points="410,355 420,360 410,365" fill="#333"/>
  <text x="420" y="356" font-size="14" fill="#333">m</text>
  <line x1="50" y1="360" x2="50" y2="45" stroke="#333" stroke-width="1.6"/>
  <polygon points="45,45 50,35 55,45" fill="#333"/>
  <text x="44" y="50" font-size="14" fill="#333" text-anchor="end">n</text>

  <!-- 刻度标签 -->
  <text x="70" y="374" font-size="13" fill="#666" text-anchor="middle">0</text>
  <text x="125" y="374" font-size="13" fill="#666" text-anchor="middle">1</text>
  <text x="180" y="374" font-size="13" fill="#666" text-anchor="middle">2</text>
  <text x="235" y="374" font-size="13" fill="#666" text-anchor="middle">3</text>
  <text x="290" y="374" font-size="13" fill="#666" text-anchor="middle">4</text>
  <text x="345" y="374" font-size="13" fill="#666" text-anchor="middle">5</text>
  <text x="58" y="334" font-size="13" fill="#666" text-anchor="start">0</text>
  <text x="58" y="279" font-size="13" fill="#666" text-anchor="start">1</text>
  <text x="58" y="224" font-size="13" fill="#666" text-anchor="start">2</text>
  <text x="58" y="169" font-size="13" fill="#666" text-anchor="start">3</text>
  <text x="58" y="114" font-size="13" fill="#666" text-anchor="start">4</text>
  <text x="58" y="59" font-size="13" fill="#666" text-anchor="start">5</text>

  <!-- 6×6 全部格点（浅灰） -->
  <g fill="#cfc9c0">
    <circle cx="70" cy="330" r="3"/><circle cx="125" cy="330" r="3"/><circle cx="180" cy="330" r="3"/><circle cx="235" cy="330" r="3"/><circle cx="290" cy="330" r="3"/><circle cx="345" cy="330" r="3"/>
    <circle cx="70" cy="275" r="3"/><circle cx="125" cy="275" r="3"/><circle cx="180" cy="275" r="3"/><circle cx="235" cy="275" r="3"/><circle cx="290" cy="275" r="3"/><circle cx="345" cy="275" r="3"/>
    <circle cx="70" cy="220" r="3"/><circle cx="125" cy="220" r="3"/><circle cx="180" cy="220" r="3"/><circle cx="235" cy="220" r="3"/><circle cx="290" cy="220" r="3"/><circle cx="345" cy="220" r="3"/>
    <circle cx="70" cy="165" r="3"/><circle cx="125" cy="165" r="3"/><circle cx="180" cy="165" r="3"/><circle cx="235" cy="165" r="3"/><circle cx="290" cy="165" r="3"/><circle cx="345" cy="165" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="125" cy="110" r="3"/><circle cx="180" cy="110" r="3"/><circle cx="235" cy="110" r="3"/><circle cx="290" cy="110" r="3"/><circle cx="345" cy="110" r="3"/>
    <circle cx="70" cy="55" r="3"/><circle cx="125" cy="55" r="3"/><circle cx="180" cy="55" r="3"/><circle cx="235" cy="55" r="3"/><circle cx="290" cy="55" r="3"/><circle cx="345" cy="55" r="3"/>
  </g>

  <!-- 蛇形折线 -->
  <polyline points="70,330 125,330 70,275 70,220 125,275 180,330 235,330 180,275 125,220 70,165 70,110 125,165 180,220 235,275 290,330 345,330 290,275 235,220 180,165 125,110 70,55"
    fill="none" stroke="#1f6f8b" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 已编号的格点（深青 + 白字编号） -->
  <g font-size="11" font-weight="bold">
    <circle cx="70" cy="330" r="10" fill="#1f6f8b"/><text x="70" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">1</text>
    <circle cx="125" cy="330" r="10" fill="#1f6f8b"/><text x="125" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">2</text>
    <circle cx="70" cy="275" r="10" fill="#1f6f8b"/><text x="70" y="275" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">3</text>
    <circle cx="70" cy="220" r="10" fill="#1f6f8b"/><text x="70" y="220" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">4</text>
    <circle cx="125" cy="275" r="10" fill="#1f6f8b"/><text x="125" y="275" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">5</text>
    <circle cx="180" cy="330" r="10" fill="#1f6f8b"/><text x="180" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">6</text>
    <circle cx="235" cy="330" r="10" fill="#1f6f8b"/><text x="235" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">7</text>
    <circle cx="180" cy="275" r="10" fill="#1f6f8b"/><text x="180" y="275" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">8</text>
    <circle cx="125" cy="220" r="10" fill="#1f6f8b"/><text x="125" y="220" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">9</text>
    <circle cx="70" cy="165" r="10" fill="#1f6f8b"/><text x="70" y="165" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">10</text>
    <circle cx="70" cy="110" r="10" fill="#1f6f8b"/><text x="70" y="110" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">11</text>
    <circle cx="125" cy="165" r="10" fill="#1f6f8b"/><text x="125" y="165" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">12</text>
    <circle cx="180" cy="220" r="10" fill="#1f6f8b"/><text x="180" y="220" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">13</text>
    <circle cx="235" cy="275" r="10" fill="#1f6f8b"/><text x="235" y="275" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">14</text>
    <circle cx="290" cy="330" r="10" fill="#1f6f8b"/><text x="290" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">15</text>
    <circle cx="345" cy="330" r="10" fill="#1f6f8b"/><text x="345" y="330" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">16</text>
    <circle cx="290" cy="275" r="10" fill="#1f6f8b"/><text x="290" y="275" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">17</text>
    <circle cx="235" cy="220" r="10" fill="#1f6f8b"/><text x="235" y="220" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">18</text>
    <circle cx="180" cy="165" r="10" fill="#1f6f8b"/><text x="180" y="165" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">19</text>
    <circle cx="125" cy="110" r="10" fill="#1f6f8b"/><text x="125" y="110" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">20</text>
    <circle cx="70" cy="55" r="10" fill="#1f6f8b"/><text x="70" y="55" fill="#faf9f5" text-anchor="middle" dominant-baseline="middle">21</text>
  </g>
</svg>
