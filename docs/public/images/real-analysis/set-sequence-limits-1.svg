<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">集合列 A_n 的上、下极限示意图</title>
  <desc id="desc">设集合列 A_n = [0, 1+(-1)^(n+1)]，奇数项为区间 [0,2]，偶数项为单点集 {0}。青色线段与圆点表示每个 A_n：奇数行画出区间 [0,2]，偶数行只画点 0。红色虚线经过 x=0.5 处，只穿过奇数行的区间而从不穿过偶数行，说明 0.5 出现于无穷多个 A_n 但并非最终一直在，因此它属于上极限集而不属于下极限集。青色小圆圈标在 x=0 处，点 0 在每一行都出现，故属于下极限集 {0}。底部数轴标出 0、0.5、1、2。</desc>
  <rect x="0" y="0" width="560" height="400" fill="#faf9f5"/>
  <text x="30" y="30" font-size="17" fill="#333" font-weight="bold">集合列 A_n = [0, 1+(-1)^(n+1)] 的上、下极限</text>
  <text x="30" y="54" font-size="14" fill="#c0392b">红点：0.5 出现无穷多次 → 属于上极限集 limsup A_n</text>
  <text x="30" y="72" font-size="14" fill="#1f6f8b">青点：0 每一行都在 → 属于下极限集 liminf A_n</text>

  <!-- 红色竖虚线 x=0.5 -->
  <line x1="195" y1="86" x2="195" y2="326" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="195" y="84" font-size="13" fill="#c0392b" text-anchor="middle">0.5</text>

  <!-- 行：n=1..8 -->
  <g>
    <!-- 逐行的基线轨道 -->
    <line x1="120" y1="95" x2="420" y2="95" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="127" x2="420" y2="127" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="159" x2="420" y2="159" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="191" x2="420" y2="191" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="223" x2="420" y2="223" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="255" x2="420" y2="255" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="287" x2="420" y2="287" stroke="#e5e0d8" stroke-width="1"/>
    <line x1="120" y1="319" x2="420" y2="319" stroke="#e5e0d8" stroke-width="1"/>

    <!-- 奇数行：区间 [0,2] 即 x=120..420 -->
    <line x1="120" y1="95" x2="420" y2="95" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="159" x2="420" y2="159" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="223" x2="420" y2="223" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="287" x2="420" y2="287" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>

    <!-- 偶数行：单点集 {0}，即 x=120 -->
    <circle cx="120" cy="127" r="5" fill="#1f6f8b"/>
    <circle cx="120" cy="191" r="5" fill="#1f6f8b"/>
    <circle cx="120" cy="255" r="5" fill="#1f6f8b"/>
    <circle cx="120" cy="319" r="5" fill="#1f6f8b"/>

    <!-- 点 0 在每行都出现：青色小圈 -->
    <circle cx="120" cy="95" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="127" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="159" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="191" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="223" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="255" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="287" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>
    <circle cx="120" cy="319" r="8" fill="none" stroke="#2a8c5e" stroke-width="1.6"/>

    <!-- 行号标签 -->
    <text x="106" y="99" font-size="13" fill="#666" text-anchor="end">A1</text>
    <text x="106" y="131" font-size="13" fill="#666" text-anchor="end">A2</text>
    <text x="106" y="163" font-size="13" fill="#666" text-anchor="end">A3</text>
    <text x="106" y="195" font-size="13" fill="#666" text-anchor="end">A4</text>
    <text x="106" y="227" font-size="13" fill="#666" text-anchor="end">A5</text>
    <text x="106" y="259" font-size="13" fill="#666" text-anchor="end">A6</text>
    <text x="106" y="291" font-size="13" fill="#666" text-anchor="end">A7</text>
    <text x="106" y="323" font-size="13" fill="#666" text-anchor="end">A8</text>

    <!-- 0.5 处红点：奇数行（区间含 0.5） -->
    <circle cx="195" cy="95" r="5" fill="#c0392b"/>
    <circle cx="195" cy="159" r="5" fill="#c0392b"/>
    <circle cx="195" cy="223" r="5" fill="#c0392b"/>
    <circle cx="195" cy="287" r="5" fill="#c0392b"/>

    <!-- 数轴 -->
    <line x1="120" y1="358" x2="420" y2="358" stroke="#333" stroke-width="1.8"/>
    <polygon points="420,353 430,358 420,363" fill="#333"/>
    <line x1="120" y1="353" x2="120" y2="363" stroke="#333" stroke-width="1.4"/>
    <line x1="195" y1="353" x2="195" y2="363" stroke="#333" stroke-width="1.4"/>
    <line x1="270" y1="353" x2="270" y2="363" stroke="#333" stroke-width="1.4"/>
    <line x1="420" y1="353" x2="420" y2="363" stroke="#333" stroke-width="1.4"/>
    <text x="120" y="380" font-size="14" fill="#333" text-anchor="middle">0</text>
    <text x="195" y="380" font-size="14" fill="#333" text-anchor="middle">0.5</text>
    <text x="270" y="380" font-size="14" fill="#333" text-anchor="middle">1</text>
    <text x="420" y="380" font-size="14" fill="#333" text-anchor="middle">2</text>
    <text x="330" y="344" font-size="14" fill="#666">limsup A_n = [0,2]</text>
    <text x="330" y="362" font-size="14" fill="#666">liminf A_n = {0}</text>
  </g>
</svg>
