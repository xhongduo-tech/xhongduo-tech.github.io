<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title>康托尔集的三分构造</title>
  <desc>从区间[0,1]出发，每一行去掉上一行每个保留区间的中间三分之一，前5行展示迭代过程，最终康托尔集是第无穷行。</desc>
  <rect width="600" height="360" fill="#faf9f5"/>
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">康托尔集的构造：每行去掉中间三分之一</text>
  <g font-family="sans-serif" font-size="13" fill="#333">
    <!-- Row labels -->
    <text x="40" y="72" text-anchor="end">n = 0</text>
    <text x="40" y="122" text-anchor="end">n = 1</text>
    <text x="40" y="172" text-anchor="end">n = 2</text>
    <text x="40" y="222" text-anchor="end">n = 3</text>
    <text x="40" y="272" text-anchor="end">n = 4</text>
  </g>
  <!-- Row 0: [0,1] -->
  <g fill="#c0392b">
    <rect x="100" y="60" width="400" height="14" rx="2"/>
  </g>
  <!-- Row 1 -->
  <g fill="#c0392b">
    <rect x="100" y="110" width="133.3" height="14" rx="2"/>
    <rect x="366.7" y="110" width="133.3" height="14" rx="2"/>
  </g>
  <!-- Row 2 -->
  <g fill="#c0392b">
    <rect x="100" y="160" width="44.4" height="14" rx="2"/>
    <rect x="188.9" y="160" width="44.4" height="14" rx="2"/>
    <rect x="366.7" y="160" width="44.4" height="14" rx="2"/>
    <rect x="455.6" y="160" width="44.4" height="14" rx="2"/>
  </g>
  <!-- Row 3 -->
  <g fill="#c0392b">
    <rect x="100" y="210" width="14.8" height="14" rx="2"/>
    <rect x="129.6" y="210" width="14.8" height="14" rx="2"/>
    <rect x="188.9" y="210" width="14.8" height="14" rx="2"/>
    <rect x="218.5" y="210" width="14.8" height="14" rx="2"/>
    <rect x="366.7" y="210" width="14.8" height="14" rx="2"/>
    <rect x="396.3" y="210" width="14.8" height="14" rx="2"/>
    <rect x="455.6" y="210" width="14.8" height="14" rx="2"/>
    <rect x="485.2" y="210" width="14.8" height="14" rx="2"/>
  </g>
  <!-- Row 4: 16 segments of width 100/16 = 6.25 -->
  <g fill="#c0392b">
    <rect x="100" y="260" width="6.25" height="14" rx="2"/>
    <rect x="112.5" y="260" width="6.25" height="14" rx="2"/>
    <rect x="125" y="260" width="6.25" height="14" rx="2"/>
    <rect x="137.5" y="260" width="6.25" height="14" rx="2"/>
    <rect x="156.25" y="260" width="6.25" height="14" rx="2"/>
    <rect x="168.75" y="260" width="6.25" height="14" rx="2"/>
    <rect x="181.25" y="260" width="6.25" height="14" rx="2"/>
    <rect x="193.75" y="260" width="6.25" height="14" rx="2"/>
    <rect x="212.5" y="260" width="6.25" height="14" rx="2"/>
    <rect x="225" y="260" width="6.25" height="14" rx="2"/>
    <rect x="237.5" y="260" width="6.25" height="14" rx="2"/>
    <rect x="250" y="260" width="6.25" height="14" rx="2"/>
    <rect x="268.75" y="260" width="6.25" height="14" rx="2"/>
    <rect x="281.25" y="260" width="6.25" height="14" rx="2"/>
    <rect x="293.75" y="260" width="6.25" height="14" rx="2"/>
    <rect x="306.25" y="260" width="6.25" height="14" rx="2"/>
  </g>
  <!-- Axis -->
  <line x1="100" y1="310" x2="500" y2="310" stroke="#333" stroke-width="2"/>
  <text x="100" y="330" text-anchor="middle" font-size="13" fill="#1f6f8b">0</text>
  <text x="500" y="330" text-anchor="middle" font-size="13" fill="#1f6f8b">1</text>
  <line x1="300" y1="308" x2="300" y2="312" stroke="#333" stroke-width="2"/>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#333">1/2（被挖掉）</text>
  <text x="300" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">红色线段的极限点集就是康托尔集 C</text>
</svg>
