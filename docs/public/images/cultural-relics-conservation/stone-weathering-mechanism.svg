<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>石质文物风化破坏机制示意</title>
  <desc>酸雨与盐结晶共同作用使石质文物表面结壳、内部孔隙膨胀并层状剥落</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">石质文物风化破坏机制</text>

  <!-- 酸雨云与雨滴 -->
  <ellipse cx="300" cy="78" rx="70" ry="24" fill="#cdd6dd"/>
  <ellipse cx="360" cy="84" rx="50" ry="20" fill="#cdd6dd"/>
  <text x="330" y="52" text-anchor="middle" font-size="14" fill="#1f6f8b">酸雨云</text>
  <line x1="340" y1="102" x2="340" y2="128" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="300" y1="102" x2="300" y2="124" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="380" y1="102" x2="380" y2="126" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="430" y="118" font-size="14" fill="#333">含 H₂SO₄</text>

  <!-- 石头主体 -->
  <rect x="100" y="140" width="440" height="190" fill="#e8dcc8" stroke="#333" stroke-width="2"/>
  <!-- 砂岩颗粒纹理 -->
  <g fill="#cbb896">
    <circle cx="140" cy="300" r="5"/><circle cx="180" cy="280" r="4"/><circle cx="220" cy="310" r="5"/>
    <circle cx="260" cy="290" r="4"/><circle cx="300" cy="305" r="5"/><circle cx="340" cy="285" r="4"/>
    <circle cx="380" cy="305" r="5"/><circle cx="420" cy="290" r="4"/><circle cx="460" cy="305" r="5"/>
    <circle cx="500" cy="285" r="4"/><circle cx="150" cy="250" r="4"/><circle cx="360" cy="250" r="4"/>
  </g>

  <!-- 表面石膏结壳 -->
  <rect x="100" y="140" width="440" height="34" fill="#6f6a5f" opacity="0.85"/>
  <text x="320" y="161" text-anchor="middle" font-size="15" fill="#fff">硫酸钙结壳 CaSO₄·2H₂O</text>

  <!-- 内部盐结晶膨胀的孔隙 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <circle cx="190" cy="250" r="18"/>
    <circle cx="300" cy="270" r="20"/>
    <circle cx="430" cy="245" r="16"/>
  </g>
  <text x="190" y="228" text-anchor="middle" font-size="14" fill="#c0392b">盐晶</text>
  <text x="300" y="248" text-anchor="middle" font-size="14" fill="#c0392b">盐晶</text>
  <text x="430" y="224" text-anchor="middle" font-size="14" fill="#c0392b">盐晶</text>
  <!-- 膨胀箭头 -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="172" y1="250" x2="150" y2="250"/><polygon points="150,250 158,246 158,254" fill="#c0392b"/>
    <line x1="208" y1="250" x2="230" y2="250"/><polygon points="230,250 222,246 222,254" fill="#c0392b"/>
    <line x1="280" y1="270" x2="258" y2="270"/><polygon points="258,270 266,266 266,274" fill="#c0392b"/>
    <line x1="320" y1="270" x2="342" y2="270"/><polygon points="342,270 334,266 334,274" fill="#c0392b"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="15" fill="#c0392b">盐结晶体积膨胀 → 内部张力</text>

  <!-- 层状剥落 -->
  <rect x="100" y="320" width="120" height="10" fill="#6f6a5f" opacity="0.7"/>
  <line x1="100" y1="330" x2="40" y2="348" stroke="#333" stroke-width="2"/>
  <polygon points="40,348 56,342 50,354" fill="#333"/>
  <text x="30" y="372" font-size="14" fill="#333">层状剥落</text>

  <!-- 生物附着 -->
  <g fill="#5a7d5a">
    <path d="M500 150 q10 -14 20 0 z"/><path d="M520 150 q8 -12 16 0 z"/><path d="M538 150 q9 -13 18 0 z"/>
  </g>
  <text x="540" y="170" font-size="14" fill="#333">微生物</text>
</svg>
