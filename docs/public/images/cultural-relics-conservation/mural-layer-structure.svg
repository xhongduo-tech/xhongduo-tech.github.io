<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>壁画地层结构与典型病害示意</title>
  <desc>壁画由支撑体、粗泥层、细泥层、白粉层与颜料层构成，病害发生在层与层之间</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">壁画的层状结构与典型病害</text>

  <!-- 支撑体 -->
  <rect x="90" y="330" width="380" height="55" fill="#9a938c" stroke="#333" stroke-width="2"/>
  <text x="280" y="360" text-anchor="middle" font-size="15" fill="#fff">支撑体（岩体 / 墙体）</text>

  <!-- 粗泥层 -->
  <rect x="90" y="272" width="380" height="58" fill="#c4a67c" stroke="#333" stroke-width="2"/>
  <text x="280" y="303" text-anchor="middle" font-size="15" fill="#333">粗泥层（麦草泥）</text>
  <!-- 酥碱结晶 -->
  <g fill="#fff">
    <rect x="120" y="300" width="8" height="8" transform="rotate(45 124 304)"/>
    <rect x="150" y="306" width="8" height="8" transform="rotate(45 154 310)"/>
    <rect x="180" y="298" width="8" height="8" transform="rotate(45 184 302)"/>
  </g>

  <!-- 细泥层 -->
  <rect x="90" y="214" width="380" height="58" fill="#d8bd93" stroke="#333" stroke-width="2"/>
  <text x="280" y="245" text-anchor="middle" font-size="15" fill="#333">细泥层（麻刀泥）</text>

  <!-- 白粉层 -->
  <rect x="90" y="184" width="380" height="30" fill="#e8e6dc" stroke="#333" stroke-width="2"/>
  <text x="280" y="204" text-anchor="middle" font-size="14" fill="#333">白粉层（石灰 / 高岭土）</text>

  <!-- 颜料层 -->
  <rect x="90" y="150" width="380" height="34" fill="#7a4a2f" stroke="#333" stroke-width="2"/>
  <text x="280" y="172" text-anchor="middle" font-size="15" fill="#fff">颜料层（矿物颜料 + 胶结材料）</text>

  <!-- 起甲示意：颜料层翘起的小片 -->
  <g fill="none" stroke="#c0392b" stroke-width="2">
    <path d="M340 184 q0 -14 26 -10 q-2 10 -4 10"/>
    <path d="M410 184 q0 -12 20 -8"/>
  </g>
  <text x="352" y="176" font-size="13" fill="#c0392b">起甲</text>

  <!-- 空鼓示意 -->
  <ellipse cx="230" cy="258" rx="46" ry="9" fill="#c0392b" opacity="0.18" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="262" font-size="13" fill="#c0392b">空鼓（层间分离）</text>

  <!-- 酥碱标注 -->
  <text x="90" y="360" font-size="0" fill="#333"/>
  <line x1="104" y1="306" x2="40" y2="306" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="300" text-anchor="end" font-size="14" fill="#c0392b">酥碱（盐结晶）</text>

  <!-- 图例说明 -->
  <text x="500" y="180" font-size="14" fill="#333">剖面自下而上：</text>
  <text x="500" y="202" font-size="13" fill="#333">支撑体 → 粗泥 →</text>
  <text x="500" y="220" font-size="13" fill="#333">细泥 → 白粉 → 颜料</text>
  <text x="500" y="252" font-size="13" fill="#c0392b">病害多发于层界处</text>
  <text x="500" y="272" font-size="13" fill="#333">（起甲在颜料层，</text>
  <text x="500" y="292" font-size="13" fill="#333">空鼓在泥层之间，</text>
  <text x="500" y="312" font-size="13" fill="#333">酥碱在地仗内部）</text>
</svg>
