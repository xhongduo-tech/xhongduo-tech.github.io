<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>青铜病循环机制示意</title>
  <desc>氯离子在铜体、氯化亚铜与碱式氯化铜（粉状锈）之间循环，使青铜不断被腐蚀</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">青铜病：氯的催化循环</text>

  <!-- 铜本体（上） -->
  <rect x="230" y="60" width="180" height="66" rx="10" fill="#c98857" stroke="#333" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">青铜本体 Cu</text>
  <text x="320" y="112" text-anchor="middle" font-size="13" fill="#fff">健康时表面生成保护性锈层</text>

  <!-- 氯化亚铜（左下） -->
  <rect x="40" y="250" width="210" height="90" rx="10" fill="#8a8f98" stroke="#333" stroke-width="2"/>
  <text x="145" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">氯化亚铜 CuCl</text>
  <text x="145" y="306" text-anchor="middle" font-size="13" fill="#fff">埋藏期氯离子已渗入铜体</text>
  <text x="145" y="324" text-anchor="middle" font-size="13" fill="#fff">形成的「潜伏层」</text>

  <!-- 粉状锈（右下） -->
  <rect x="390" y="250" width="210" height="90" rx="10" fill="#4a9c6e" stroke="#333" stroke-width="2"/>
  <text x="495" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">碱式氯化铜</text>
  <text x="495" y="298" text-anchor="middle" font-size="13" fill="#fff">Cu₂(OH)₃Cl（粉状锈）</text>
  <text x="495" y="318" text-anchor="middle" font-size="13" fill="#fff">粉末状，可传染扩散 + 释出 HCl</text>

  <!-- 中央说明 -->
  <ellipse cx="320" cy="200" rx="110" ry="40" fill="#1f6f8b" opacity="0.12"/>
  <text x="320" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6f8b">循环往复</text>
  <text x="320" y="216" text-anchor="middle" font-size="13" fill="#333">青铜病把铜体不断吃掉</text>

  <!-- 箭头 Cu -> CuCl -->
  <path d="M270 126 Q160 150 128 245" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="180" font-size="13" fill="#c0392b">Cl⁻ 渗入</text>

  <!-- 箭头 CuCl -> 粉状锈 -->
  <path d="M255 300 L380 300" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="290" text-anchor="middle" font-size="13" fill="#c0392b">+O₂ +H₂O 反应</text>

  <!-- 箭头 粉状锈 -> Cu -->
  <path d="M370 126 Q480 150 510 245" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="470" y="180" font-size="13" fill="#c0392b">释出 HCl 再腐蚀铜</text>
</svg>
