<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>分子对接示意图</title>
  <desc>配体分子嵌入受体蛋白结合口袋的示意，展示对接要评价的位姿与接触</desc>
  <rect width="800" height="360" fill="#faf9f5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">分子对接：把配体放进受体的口袋里评价</text>

  <!-- receptor blob -->
  <ellipse cx="400" cy="110" rx="330" ry="95" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="120" y="60" font-size="15" fill="#1f6f8b" font-weight="bold">受体蛋白</text>

  <!-- pocket mouth -->
  <path d="M 285,205 A 115,80 0 0 0 515,205" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- ligand -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <polygon points="400,165 428,180 428,210 400,225 372,210 372,180"/>
    <line x1="400" y1="180" x2="430" y2="150"/>
    <line x1="372" y1="225" x2="360" y2="255"/>
    <line x1="400" y1="225" x2="400" y2="255"/>
  </g>
  <g stroke="#c0392b" stroke-width="5" fill="none">
    <line x1="430" y1="150" x2="448" y2="136"/>
  </g>
  <circle cx="448" cy="134" r="9" fill="#c0392b"/>
  <g font-size="13" fill="#333">
    <text x="445" y="128">O</text>
    <text x="400" y="276" text-anchor="middle" font-weight="bold">配体</text>
  </g>

  <!-- contacts -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="372" y1="180" x2="315" y2="195"/>
    <line x1="448" y1="145" x2="505" y2="180"/>
    <line x1="390" y1="252" x2="385" y2="295"/>
  </g>

  <!-- annotation -->
  <text x="540" y="120" font-size="14" fill="#c0392b">结合口袋</text>
  <text x="540" y="142" font-size="13" fill="#888">（打分函数在此评价接触、氢键、疏水）</text>
  <text x="400" y="335" text-anchor="middle" font-size="13" fill="#888">虚线为配体-蛋白接触；对接搜索位姿并打分，分数用于虚拟筛选排序而非当精确结合自由能</text>
</svg>
