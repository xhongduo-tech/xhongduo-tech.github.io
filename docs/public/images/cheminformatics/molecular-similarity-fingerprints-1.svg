<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>ECFP 的同心原子环境</title>
  <desc>以中心原子为圆心，半径 1、2、3 键的同心壳层逐渐并入原子环境，构成 ECFP 片段</desc>
  <rect width="800" height="360" fill="#faf9f5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">ECFP：以中心原子为圆心的同心环境</text>

  <!-- shells -->
  <circle cx="400" cy="190" r="55" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="400" cy="190" r="110" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="400" cy="190" r="165" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="442" y="150" font-size="13" fill="#1f6f8b">半径 1</text>
  <text x="500" y="96" font-size="13" fill="#1f6f8b">半径 2</text>
  <text x="552" y="42" font-size="13" fill="#1f6f8b">半径 3</text>

  <!-- bonds -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="400" y1="190" x2="400" y2="135"/>
    <line x1="400" y1="135" x2="400" y2="80"/>
    <line x1="400" y1="80" x2="400" y2="25"/>
    <line x1="400" y1="190" x2="447.6" y2="217.5"/>
    <line x1="447.6" y1="217.5" x2="495" y2="245"/>
    <line x1="495" y1="245" x2="542.9" y2="272.5"/>
    <line x1="400" y1="190" x2="352.4" y2="217.5"/>
    <line x1="352.4" y1="217.5" x2="304.7" y2="245"/>
    <line x1="304.7" y1="245" x2="257.1" y2="272.5"/>
  </g>

  <!-- atoms -->
  <g stroke="#333" stroke-width="1.5">
    <circle cx="400" cy="190" r="14" fill="#c0392b"/>
    <circle cx="400" cy="135" r="11" fill="#ffffff"/>
    <circle cx="400" cy="80" r="11" fill="#ffffff"/>
    <circle cx="400" cy="25" r="11" fill="#ffffff"/>
    <circle cx="447.6" cy="217.5" r="11" fill="#ffffff"/>
    <circle cx="495" cy="245" r="11" fill="#ffffff"/>
    <circle cx="542.9" cy="272.5" r="11" fill="#ffffff"/>
    <circle cx="352.4" cy="217.5" r="11" fill="#ffffff"/>
    <circle cx="304.7" cy="245" r="11" fill="#ffffff"/>
    <circle cx="257.1" cy="272.5" r="11" fill="#ffffff"/>
  </g>

  <!-- center label -->
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">C</text>

  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#888">每轮迭代把「自身 + 邻居」哈希一次：半径 1 只用直接邻居，半径 2 并入隔一个键的原子，半径 3 再外扩一圈</text>
</svg>
