<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>逆合成分析树</title>
  <desc>从目标分子向下断开，逐层得到合成子与中间体，直到可购买的原料，形成一棵倒长的树</desc>
  <rect width="800" height="360" fill="#faf9f5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">逆合成分析：从目标分子倒推到原料（倒长的树）</text>

  <!-- edges -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="400" y1="78" x2="230" y2="128"/>
    <line x1="400" y1="78" x2="570" y2="128"/>
    <line x1="230" y1="150" x2="120" y2="233"/>
    <line x1="230" y1="150" x2="320" y2="233"/>
    <line x1="570" y1="150" x2="460" y2="233"/>
    <line x1="570" y1="150" x2="620" y2="233"/>
  </g>
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3">
    <line x1="400" y1="78" x2="230" y2="128"/>
    <line x1="400" y1="78" x2="570" y2="128"/>
    <line x1="230" y1="150" x2="120" y2="233"/>
    <line x1="230" y1="150" x2="320" y2="233"/>
    <line x1="570" y1="150" x2="460" y2="233"/>
    <line x1="570" y1="150" x2="620" y2="233"/>
  </g>

  <!-- TM -->
  <circle cx="400" cy="62" r="20" fill="#c0392b"/>
  <text x="400" y="67" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">TM</text>

  <!-- synthons -->
  <g stroke="#1f6f8b" stroke-width="1.5">
    <circle cx="230" cy="139" r="16" fill="#ffffff"/>
    <circle cx="570" cy="139" r="16" fill="#ffffff"/>
  </g>
  <text x="230" y="144" text-anchor="middle" font-size="13" fill="#1f6f8b" font-weight="bold">S1</text>
  <text x="570" y="144" text-anchor="middle" font-size="13" fill="#1f6f8b" font-weight="bold">S2</text>

  <!-- leaves -->
  <g stroke="#2e7d32" stroke-width="1.5">
    <circle cx="120" cy="245" r="15" fill="#ffffff"/>
    <circle cx="320" cy="245" r="15" fill="#ffffff"/>
    <circle cx="460" cy="245" r="15" fill="#ffffff"/>
    <circle cx="620" cy="245" r="15" fill="#ffffff"/>
  </g>
  <text x="120" y="250" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">R1</text>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">R2</text>
  <text x="460" y="250" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">R3</text>
  <text x="620" y="250" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">R4</text>

  <!-- labels -->
  <text x="400" y="96" text-anchor="middle" font-size="13" fill="#c0392b">目标分子</text>
  <text x="230" y="174" text-anchor="middle" font-size="13" fill="#1f6f8b">合成子/中间体</text>
  <text x="570" y="174" text-anchor="middle" font-size="13" fill="#1f6f8b">合成子/中间体</text>
  <text x="220" y="276" font-size="13" fill="#2e7d32">可购买的原料</text>
  <text x="480" y="276" font-size="13" fill="#2e7d32">可购买的原料</text>

  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#888">每条虚线代表一次「切断」（逆转化）；搜索从 TM 向下扩展，直到全部叶子都是可购买原料，路线即告完成</text>
</svg>
