<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>丁烷绕中心 C–C 键旋转的能量曲线</title>
  <desc>势能面上反式（最低）、旁式（次低）与重叠式（最高）的示意曲线，横轴为二面角，纵轴为相对能量</desc>
  <rect width="800" height="360" fill="#faf9f5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">丁烷绕中心 C–C 键旋转：能量 vs 二面角</text>

  <!-- axes -->
  <line x1="80" y1="280" x2="730" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="120" x2="80" y2="300" stroke="#333" stroke-width="2"/>
  <text x="70" y="285" text-anchor="end" font-size="13" fill="#333">0</text>
  <text x="40" y="138" font-size="13" fill="#333">能量高</text>

  <!-- curve -->
  <polyline fill="none" stroke="#1f6f8b" stroke-width="3"
    points="80,130 106.7,258 133.3,205 160,152 186.7,280 213.3,152 240,205 266.7,258 293.3,130 320,258 346.7,205 373.3,152 400,280 426.7,152 453.3,205 480,258 506.7,130 533.3,258 560,205 586.7,152 613.3,280 640,152 666.7,205 693.3,258 720,130"/>

  <!-- x labels -->
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="80" y="300">0°</text>
    <text x="186.7" y="300">60°</text>
    <text x="293.3" y="300">120°</text>
    <text x="400" y="300">180°</text>
    <text x="506.7" y="300">240°</text>
    <text x="613.3" y="300">300°</text>
    <text x="720" y="300">360°</text>
  </g>
  <text x="400" y="325" text-anchor="middle" font-size="13" fill="#888">二面角 φ（扭转角）</text>

  <!-- markers -->
  <g fill="#c0392b">
    <circle cx="400" cy="280" r="7"/>
    <circle cx="186.7" cy="280" r="6"/>
    <circle cx="613.3" cy="280" r="6"/>
    <circle cx="80" cy="130" r="6"/>
    <circle cx="293.3" cy="130" r="6"/>
    <circle cx="506.7" cy="130" r="6"/>
    <circle cx="720" cy="130" r="6"/>
  </g>

  <g font-size="14" fill="#333">
    <text x="420" y="270" font-weight="bold">反式（全局极小）</text>
    <text x="205" y="268" font-weight="bold">旁式</text>
    <text x="625" y="268" font-weight="bold">旁式</text>
    <text x="95" y="118" font-weight="bold">重叠式（能量峰）</text>
    <text x="470" y="118" font-weight="bold">重叠式</text>
  </g>

  <text x="400" y="352" text-anchor="middle" font-size="13" fill="#888">局部极小（旁式）与全局极小（反式）相差约 3.8 kJ/mol，常温下均占可观比例</text>
</svg>
