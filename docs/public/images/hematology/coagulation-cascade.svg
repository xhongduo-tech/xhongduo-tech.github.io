<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>凝血级联：内源、外源与共同通路的瀑布式接力</title>
<desc>内源通路（F XII 至 F IX、F VIII）与外源通路（组织因子 TF 与 F VIIa 复合物）在 F X 处汇合，进入共同通路，经凝血酶生成最终形成纤维蛋白血凝块；F VIII 与 F IX 的缺陷分别是血友病 A 与血友病 B。</desc>
<rect x="0" y="0" width="760" height="500" fill="#faf9f5"/>
<g stroke="#333" stroke-width="1.6" fill="none">
<line x1="155" y1="99" x2="155" y2="130"/>
<line x1="155" y1="174" x2="155" y2="205"/>
<line x1="565" y1="99" x2="565" y2="130"/>
<line x1="155" y1="249" x2="315" y2="264"/>
<line x1="565" y1="174" x2="445" y2="264"/>
<line x1="380" y1="304" x2="380" y2="335"/>
<line x1="380" y1="379" x2="380" y2="410"/>
</g>
<g font-size="16" fill="#333" text-anchor="middle">
<text x="155" y="38">内源通路（APTT 延长）</text>
<text x="565" y="38">外源通路（PT 延长）</text>
<text x="70" y="290" text-anchor="start">共同通路</text>
</g>
<g font-size="15" fill="#333" text-anchor="middle">
<rect x="70" y="55" width="170" height="44" rx="10" fill="#eef3f6" stroke="#1f6f8b"/>
<text x="155" y="83">F XII → F XI</text>
<rect x="70" y="130" width="170" height="44" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="155" y="158">F IX</text>
<rect x="70" y="205" width="170" height="44" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="155" y="233">F VIII</text>
<rect x="480" y="55" width="170" height="44" rx="10" fill="#eef3f6" stroke="#1f6f8b"/>
<text x="565" y="83">组织因子 TF</text>
<rect x="480" y="130" width="170" height="44" rx="10" fill="#eef3f6" stroke="#1f6f8b"/>
<text x="565" y="158">F VIIa-TF 复合物</text>
<rect x="290" y="260" width="180" height="44" rx="10" fill="#1f6f8b"/>
<text x="380" y="288" fill="#fff">F X → F Xa</text>
<rect x="290" y="335" width="180" height="44" rx="10" fill="#1f6f8b"/>
<text x="380" y="363" fill="#fff">凝血酶原 → 凝血酶</text>
<rect x="290" y="410" width="180" height="44" rx="10" fill="#c0392b"/>
<text x="380" y="438" fill="#fff">纤维蛋白原 → 纤维蛋白</text>
</g>
<g font-size="14" fill="#c0392b" text-anchor="start">
<text x="248" y="155">血友病 B（FIX 缺乏）</text>
<text x="248" y="230">血友病 A（FVIII 缺乏）</text>
</g>
<g font-size="13" fill="#333">
<rect x="40" y="460" width="680" height="30" rx="8" fill="#f0ece4" stroke="#1f6f8b"/>
<text x="380" y="480" text-anchor="middle">负反馈刹车：抗凝血酶、蛋白 C / 蛋白 S 抑制级联——凝血与抗凝必须平衡</text>
</g>
</svg>
