<svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>造血树：从造血干细胞到成熟血细胞</title>
<desc>造血干细胞分化为共同髓系祖细胞与共同淋巴系祖细胞，再逐级分化为红细胞、血小板、各类粒细胞、单核巨噬细胞及 B、T、NK 淋巴细胞的分化路径示意。</desc>
<rect x="0" y="0" width="880" height="480" fill="#faf9f5"/>
<g stroke="#333" stroke-width="1.6" fill="none">
<line x1="420" y1="78" x2="250" y2="168"/>
<line x1="420" y1="78" x2="590" y2="168"/>
<line x1="250" y1="218" x2="150" y2="308"/>
<line x1="250" y1="218" x2="350" y2="308"/>
<line x1="590" y1="218" x2="590" y2="308"/>
<line x1="150" y1="358" x2="90" y2="440"/>
<line x1="150" y1="358" x2="220" y2="440"/>
<line x1="350" y1="358" x2="300" y2="440"/>
<line x1="350" y1="358" x2="400" y2="440"/>
<line x1="350" y1="358" x2="505" y2="440"/>
<line x1="505" y1="308" x2="505" y2="440"/>
<line x1="590" y1="308" x2="650" y2="440"/>
<line x1="590" y1="308" x2="730" y2="440"/>
<line x1="590" y1="308" x2="810" y2="440"/>
</g>
<g font-size="15" fill="#333" text-anchor="middle">
<rect x="330" y="26" width="180" height="52" rx="26" fill="#c0392b"/>
<text x="420" y="47" fill="#fff" font-weight="bold">造血干细胞</text>
<text x="420" y="65" fill="#fff" font-size="13">HSC（自我更新 · 多能）</text>
<rect x="175" y="168" width="150" height="50" rx="10" fill="#1f6f8b"/>
<text x="250" y="189" fill="#fff">共同髓系祖细胞</text>
<text x="250" y="207" fill="#fff" font-size="13">CMP</text>
<rect x="515" y="168" width="150" height="50" rx="10" fill="#1f6f8b"/>
<text x="590" y="189" fill="#fff">共同淋巴系祖细胞</text>
<text x="590" y="207" fill="#fff" font-size="13">CLP</text>
<rect x="80" y="308" width="140" height="50" rx="10" fill="#1f6f8b"/>
<text x="150" y="330" fill="#fff">巨核-红系祖细胞</text>
<text x="150" y="348" fill="#fff" font-size="13">MEP</text>
<rect x="270" y="308" width="160" height="50" rx="10" fill="#1f6f8b"/>
<text x="350" y="330" fill="#fff">粒-单核祖细胞</text>
<text x="350" y="348" fill="#fff" font-size="13">GMP</text>
<rect x="510" y="308" width="160" height="50" rx="10" fill="#1f6f8b"/>
<text x="590" y="330" fill="#fff">淋巴系祖细胞</text>
<text x="590" y="348" fill="#fff" font-size="13">继续定向</text>
</g>
<g font-size="15" fill="#333" text-anchor="middle">
<rect x="45" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="90" y="459">巨核→血小板</text>
<rect x="175" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="220" y="459">红细胞</text>
<rect x="255" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="300" y="459">中性粒细胞</text>
<rect x="355" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="400" y="459">单核/巨噬</text>
<rect x="450" y="440" width="110" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="505" y="459">嗜酸/嗜碱性粒细胞</text>
<rect x="605" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="650" y="459">B 细胞</text>
<rect x="685" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="730" y="459">T 细胞</text>
<rect x="765" y="440" width="90" height="28" rx="6" fill="#fff" stroke="#1f6f8b"/>
<text x="810" y="459">NK 细胞</text>
</g>
<g font-size="13" fill="#c0392b">
<text x="432" y="132" text-anchor="start">自我更新（维持干细胞池）</text>
<text x="140" y="365" text-anchor="start" fill="#888">TPO / EPO</text>
<text x="420" y="365" text-anchor="start" fill="#888">G-CSF 等</text>
</g>
</svg>
