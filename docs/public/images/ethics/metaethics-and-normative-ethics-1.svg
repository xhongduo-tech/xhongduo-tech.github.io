<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="sans-serif">
  <title>伦理学的疆域：三分法及流派走向</title>
  <desc>描述伦理学、规范伦理学、元伦理学三种研究方式及其各自下属的主要流派示意图，中间以「正当与善谁优先」作为义务论与后果论的分水岭。</desc>
  <rect x="0" y="0" width="840" height="470" fill="#faf9f5"/>
  <text x="420" y="44" text-anchor="middle" font-size="24" fill="#333" font-weight="bold">伦理学的疆域</text>
  <text x="420" y="70" text-anchor="middle" font-size="15" fill="#666">三分法 · 三种研究方式</text>

  <!-- 顶层三类 -->
  <rect x="30" y="100" width="240" height="74" rx="10" fill="#1f6f8b"/>
  <text x="150" y="130" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">描述伦理学</text>
  <text x="150" y="156" text-anchor="middle" font-size="13" fill="#e8f1f4">事实层面 · 人实际上怎么做</text>

  <rect x="300" y="100" width="240" height="74" rx="10" fill="#1f6f8b"/>
  <text x="420" y="130" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">规范伦理学</text>
  <text x="420" y="156" text-anchor="middle" font-size="13" fill="#e8f1f4">应当层面 · 给出行为标准</text>

  <rect x="570" y="100" width="240" height="74" rx="10" fill="#1f6f8b"/>
  <text x="690" y="130" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">元伦理学</text>
  <text x="690" y="156" text-anchor="middle" font-size="13" fill="#e8f1f4">分析层面 · 道德语言的意义</text>

  <!-- 规范伦理学的两个问题 -->
  <text x="420" y="216" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">规范伦理学：两个基本问题</text>
  <rect x="60" y="238" width="170" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="145" y="261" text-anchor="middle" font-size="14" fill="#333">义务问题</text>
  <text x="145" y="281" text-anchor="middle" font-size="13" fill="#666">什么行动是正当的？</text>
  <rect x="610" y="238" width="170" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="695" y="261" text-anchor="middle" font-size="14" fill="#333">价值问题</text>
  <text x="695" y="281" text-anchor="middle" font-size="13" fill="#666">什么东西是善的？</text>

  <!-- 分水岭 -->
  <line x1="60" y1="308" x2="780" y2="308" stroke="#c0392b" stroke-width="3"/>
  <text x="420" y="332" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">分水岭：正当与善，谁优先？</text>

  <!-- 规范伦理学两大流派 -->
  <rect x="60" y="352" width="220" height="58" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="170" y="376" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">后果论 / 功利主义</text>
  <text x="170" y="398" text-anchor="middle" font-size="13" fill="#666">善先于正当（第2篇）</text>
  <rect x="330" y="352" width="220" height="58" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="440" y="376" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">义务论 / 康德传统</text>
  <text x="440" y="398" text-anchor="middle" font-size="13" fill="#666">正当先于善（第3篇）</text>
  <rect x="600" y="352" width="210" height="58" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="705" y="376" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">德性伦理学</text>
  <text x="705" y="398" text-anchor="middle" font-size="13" fill="#666">跳出二分（第4篇）</text>

  <text x="420" y="448" text-anchor="middle" font-size="14" fill="#888">元伦理学下的实在论与非认知主义，见第 5、8 篇</text>
</svg>
