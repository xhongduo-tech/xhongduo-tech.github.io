<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif" font-size="14">
  <title>双电层结构与电势分布</title>
  <desc>左图为带负电粒子表面附近的离子分布：斯特恩层吸附阳离子，扩散层中阳离子浓度随距离衰减，剪切面处为 Zeta 电势。右图为电势随距离的衰减曲线。</desc>
  <rect width="800" height="560" fill="#faf9f5"/>
  <!-- 左图：粒子表面 -->
  <rect x="60" y="80" width="60" height="420" fill="#e8e4da"/>
  <line x1="120" y1="80" x2="120" y2="500" stroke="#333" stroke-width="2"/>
  <text x="48" y="52" fill="#333" font-size="15">粒子表面（带负电）</text>
  <!-- 表面负电荷 -->
  <text x="100" y="140" fill="#c0392b" font-size="15">−</text>
  <text x="100" y="200" fill="#c0392b" font-size="15">−</text>
  <text x="100" y="260" fill="#c0392b" font-size="15">−</text>
  <text x="100" y="320" fill="#c0392b" font-size="15">−</text>
  <text x="100" y="380" fill="#c0392b" font-size="15">−</text>
  <text x="100" y="440" fill="#c0392b" font-size="15">−</text>
  <!-- 斯特恩层（吸附阳离子） -->
  <rect x="122" y="90" width="55" height="400" fill="#ffffff" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="134" y="150" fill="#1f6f8b" font-size="15">+</text>
  <text x="158" y="180" fill="#1f6f8b" font-size="15">+</text>
  <text x="140" y="230" fill="#1f6f8b" font-size="15">+</text>
  <text x="158" y="290" fill="#1f6f8b" font-size="15">+</text>
  <text x="134" y="350" fill="#1f6f8b" font-size="15">+</text>
  <text x="156" y="420" fill="#1f6f8b" font-size="15">+</text>
  <text x="150" y="505" fill="#1f6f8b" font-size="15">斯特恩层（Stern）</text>
  <!-- 扩散层（浓度递减的阳离子） -->
  <text x="195" y="170" fill="#1f6f8b" font-size="15">+</text>
  <text x="230" y="215" fill="#1f6f8b" font-size="15">+</text>
  <text x="265" y="275" fill="#1f6f8b" font-size="15">+</text>
  <text x="300" y="340" fill="#1f6f8b" font-size="15">+</text>
  <text x="330" y="405" fill="#1f6f8b" font-size="15">+</text>
  <text x="355" y="455" fill="#1f6f8b" font-size="15">+</text>
  <text x="225" y="525" fill="#333" font-size="15">扩散层（Gouy–Chapman，浓度递减）</text>
  <!-- 体相 -->
  <text x="420" y="180" fill="#999" font-size="14">+</text>
  <text x="452" y="240" fill="#999" font-size="14">−</text>
  <text x="438" y="330" fill="#999" font-size="14">+</text>
  <text x="420" y="400" fill="#999" font-size="14">−</text>
  <text x="450" y="455" fill="#999" font-size="14">+</text>
  <text x="390" y="520" fill="#999" font-size="14">体相溶液（电中性）</text>
  <!-- 剪切面 -->
  <line x1="300" y1="85" x2="300" y2="495" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="272" y="70" fill="#c0392b" font-size="14" font-weight="bold">剪切面（滑动面）</text>
  <!-- 分隔线 -->
  <line x1="30" y1="62" x2="780" y2="62" stroke="#333" stroke-width="1" opacity="0.35"/>
  <!-- 右图：电势曲线 -->
  <text x="580" y="52" fill="#333" font-size="16">电势分布</text>
  <line x1="470" y1="90" x2="470" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="470" y1="440" x2="780" y2="440" stroke="#333" stroke-width="1.5"/>
  <text x="760" y="472" fill="#333" font-size="14">距表面距离</text>
  <text x="426" y="60" fill="#333" font-size="15">ψ</text>
  <!-- 电势曲线 -->
  <path d="M470 110 L505 205 Q560 300 640 320 Q700 355 740 405 Q760 430 775 437"
        fill="none" stroke="#333" stroke-width="3"/>
  <text x="420" y="112" fill="#333" font-size="14">ψ₀（表面电势）</text>
  <circle cx="505" cy="205" r="3" fill="#333"/>
  <text x="505" y="188" fill="#333" font-size="14">ψ_d（斯特恩电势）</text>
  <!-- Zeta 电势 -->
  <circle cx="640" cy="320" r="3" fill="#c0392b"/>
  <line x1="640" y1="320" x2="470" y2="320" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="372" y="336" fill="#c0392b" font-size="15" font-weight="bold">ζ（Zeta 电势）</text>
  <!-- Debye 长度标注 -->
  <line x1="505" y1="450" x2="605" y2="450" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="505" y1="444" x2="505" y2="456" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="605" y1="444" x2="605" y2="456" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="522" y="500" fill="#1f6f8b" font-size="14">κ⁻¹（Debye 长度，衰减到 ψ/e 处）</text>
</svg>
