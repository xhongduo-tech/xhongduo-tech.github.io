<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>转基因、基因敲除与条件性敲入示意</title>
  <desc>对比三种基因工程动物的基因组操作方式：转基因随机插入外源基因实现过表达，基因敲除使目标基因失活，条件性敲入用 Cre/loxP 实现时空特异表达。</desc>
  <rect x="0" y="0" width="820" height="380" fill="#faf9f5"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">三种基因工程动物的基因组操作</text>

  <rect x="20" y="55" width="250" height="300" rx="6" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="2"/>
  <text x="145" y="85" text-anchor="middle" font-size="16" fill="#1f6f8b" font-weight="bold">转基因（过表达）</text>
  <rect x="40" y="105" width="210" height="46" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="145" y="124" text-anchor="middle" font-size="13" fill="#333">基因组 DNA</text>
  <text x="145" y="143" text-anchor="middle" font-size="13" fill="#333">［…基因A…］</text>
  <rect x="55" y="165" width="180" height="40" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="145" y="182" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">外源基因（随机插入）</text>
  <text x="145" y="201" text-anchor="middle" font-size="12" fill="#c0392b">插入位点不固定</text>
  <text x="145" y="235" text-anchor="middle" font-size="13" fill="#333">→ 基因剂量↑，蛋白过表达</text>
  <text x="145" y="260" text-anchor="middle" font-size="13" fill="#333">→ 研究「基因多了会怎样」</text>
  <text x="145" y="330" text-anchor="middle" font-size="12" fill="#666">方法：原核显微注射等</text>

  <rect x="285" y="55" width="250" height="300" rx="6" fill="#fdf2ec" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">基因敲除（功能丧失）</text>
  <rect x="305" y="105" width="210" height="46" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="410" y="124" text-anchor="middle" font-size="13" fill="#333">基因组 DNA</text>
  <text x="410" y="143" text-anchor="middle" font-size="13" fill="#333">［…基因B…］</text>
  <line x1="340" y1="165" x2="480" y2="165" stroke="#c0392b" stroke-width="3"/>
  <line x1="340" y1="168" x2="480" y2="168" stroke="#c0392b" stroke-width="1.5"/>
  <text x="410" y="195" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">目标基因被破坏（✕）</text>
  <text x="410" y="222" text-anchor="middle" font-size="13" fill="#333">→ 该基因功能丧失</text>
  <text x="410" y="247" text-anchor="middle" font-size="13" fill="#333">→ 研究「缺了这个基因会怎样」</text>
  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#666">方法：ES 打靶 / CRISPR-Cas9</text>

  <rect x="550" y="55" width="250" height="300" rx="6" fill="#f7f0e6" stroke="#b7791f" stroke-width="2"/>
  <text x="675" y="85" text-anchor="middle" font-size="16" fill="#b7791f" font-weight="bold">条件性敲入（时空可控）</text>
  <rect x="570" y="105" width="210" height="46" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="675" y="124" text-anchor="middle" font-size="13" fill="#333">loxP 标记的基因C</text>
  <text x="675" y="143" text-anchor="middle" font-size="13" fill="#333">[loxP][基因C][loxP]</text>
  <text x="675" y="178" text-anchor="middle" font-size="13" fill="#b7791f">＋ 组织特异的 Cre 酶</text>
  <text x="675" y="205" text-anchor="middle" font-size="13" fill="#b7791f">Cre 只在特定组织表达 →</text>
  <text x="675" y="230" text-anchor="middle" font-size="13" fill="#333">loxP 间片段被切除/激活</text>
  <text x="675" y="255" text-anchor="middle" font-size="13" fill="#333">→ 只在目标组织改变基因</text>
  <text x="675" y="330" text-anchor="middle" font-size="12" fill="#666">方法：Cre/loxP 系统</text>

  <text x="410" y="368" text-anchor="middle" font-size="13" fill="#666">三者的共同目标：把「基因」变成一个可操纵的实验变量</text>
</svg>
