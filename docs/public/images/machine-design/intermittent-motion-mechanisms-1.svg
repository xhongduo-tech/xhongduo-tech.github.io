<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>四槽槽轮机构简图</title>
<desc>拨盘绕自身中心匀速转动，拨销进入槽轮的径向槽时驱动槽轮转过一个槽位，离开后由锁止弧使槽轮保持停歇。</desc>
<rect width="640" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">
<text x="170" y="50" font-size="16">四槽槽轮（Geneva）机构简图</text>
<circle cx="200" cy="260" r="80" fill="#f6efe7" stroke="#333" stroke-width="2.5"/>
<circle cx="200" cy="260" r="6" fill="#c0392b"/>
<circle cx="320" cy="260" r="14" fill="#1f6f8b" stroke="#fff" stroke-width="2"/>
<circle cx="430" cy="260" r="110" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M430 260 L430 152" stroke="#333" stroke-width="9"/>
<path d="M430 260 L430 368" stroke="#333" stroke-width="9"/>
<path d="M430 260 L524 260" stroke="#333" stroke-width="9"/>
<path d="M430 260 L336 260" stroke="#333" stroke-width="9"/>
<circle cx="430" cy="260" r="5" fill="#c0392b"/>
<path d="M295 160 A 78 78 0 0 1 215 340" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="40" y="150" font-size="13">锁止弧</text>
<text x="322" y="235" font-size="13" fill="#1f6f8b">拨销</text>
<text x="150" y="285" font-size="13">拨盘 O₁（匀速）</text>
<text x="450" y="150" font-size="13">槽口</text>
<text x="470" y="300" font-size="13">槽轮 O₂（间歇）</text>
<line x1="200" y1="260" x2="430" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>
<text x="300" y="255" font-size="13" fill="#999">l</text>
<path d="M200 180 A 80 80 0 0 1 210 185" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="215" y="175" font-size="13" fill="#c0392b">ω₁</text>
</g>
</svg>
