<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>四杆机构运动简图</title>
<desc>机架、主动杆、连杆、从动杆由四个转动副连接成闭环，主动杆输入角速度后机构自由度为一，运动完全确定。</desc>
<rect width="640" height="420" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#333">
<text x="240" y="40" font-size="16">四杆机构运动简图（自由度 F = 1）</text>
<line x1="120" y1="340" x2="520" y2="340" stroke="#333" stroke-width="4"/>
<line x1="120" y1="320" x2="520" y2="320" stroke="#333" stroke-width="4"/>
<line x1="120" y1="320" x2="120" y2="340" stroke="#333" stroke-width="4"/>
<line x1="520" y1="320" x2="520" y2="340" stroke="#333" stroke-width="4"/>
<text x="280" y="352" font-size="13">机架（固定构件）</text>
<line x1="120" y1="330" x2="240" y2="190" stroke="#1f6f8b" stroke-width="4"/>
<line x1="240" y1="190" x2="430" y2="150" stroke="#1f6f8b" stroke-width="4"/>
<line x1="430" y1="150" x2="520" y2="330" stroke="#1f6f8b" stroke-width="4"/>
<circle cx="120" cy="330" r="9" fill="#faf9f5" stroke="#c0392b" stroke-width="3"/>
<circle cx="240" cy="190" r="9" fill="#faf9f5" stroke="#c0392b" stroke-width="3"/>
<circle cx="430" cy="150" r="9" fill="#faf9f5" stroke="#c0392b" stroke-width="3"/>
<circle cx="520" cy="330" r="9" fill="#faf9f5" stroke="#c0392b" stroke-width="3"/>
<text x="168" y="230" font-size="13">主动杆（输入 ω）</text>
<text x="308" y="172" font-size="13">连杆</text>
<text x="452" y="205" font-size="13">从动杆</text>
<text x="96" y="320" font-size="13" fill="#c0392b">A</text>
<text x="246" y="180" font-size="13" fill="#c0392b">B</text>
<text x="436" y="140" font-size="13" fill="#c0392b">C</text>
<text x="528" y="324" font-size="13" fill="#c0392b">D</text>
<path d="M240 190 Q260 140 300 140" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M300 140 Q340 140 360 165" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="262" y="132" font-size="13" fill="#c0392b">ω₁</text>
</g>
</svg>
