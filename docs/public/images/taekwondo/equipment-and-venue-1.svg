<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <title>跆拳道竞技护具佩戴布局示意图</title>
  <desc>正面人形示意图，标注护头、护胸、护臂、护腿、护裆、护齿六件竞技护具的佩戴部位。</desc>
  <rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>
  <!-- 人形主体 -->
  <g stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- 头 -->
    <circle cx="360" cy="72" r="34" fill="#fff"/>
    <!-- 颈 -->
    <line x1="360" y1="106" x2="360" y2="122"/>
    <!-- 躯干 -->
    <path d="M 330 122 Q 300 160 296 210 L 424 210 Q 420 160 390 122" fill="#fff"/>
    <!-- 双臂 -->
    <path d="M 300 140 L 240 185 L 238 235" />
    <path d="M 420 140 L 480 185 L 482 235" />
    <!-- 双腿 -->
    <path d="M 316 210 L 312 300 L 300 372" />
    <path d="M 404 210 L 408 300 L 420 372" />
    <!-- 双脚 -->
    <path d="M 300 372 L 288 380 M 420 372 L 432 380" />
  </g>
  <!-- 护头（头戴式） -->
  <ellipse cx="360" cy="72" rx="38" ry="40" fill="#c0392b" fill-opacity="0.22" stroke="#c0392b" stroke-width="2"/>
  <path d="M 360 34 v 14" stroke="#c0392b" stroke-width="2"/>
  <!-- 护胸（躯干护具） -->
  <path d="M 322 132 Q 300 168 298 200 L 422 200 Q 420 168 398 132" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 护臂（左） -->
  <rect x="222" y="188" width="34" height="58" rx="10" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2"/>
  <!-- 护臂（右） -->
  <rect x="464" y="188" width="34" height="58" rx="10" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2"/>
  <!-- 护腿（左） -->
  <rect x="286" y="252" width="40" height="92" rx="12" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 护腿（右） -->
  <rect x="394" y="252" width="40" height="92" rx="12" fill="#1f6f8b" fill-opacity="0.25" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 护裆 -->
  <ellipse cx="360" cy="252" rx="24" ry="18" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2"/>
  <!-- 引线与标签 -->
  <g fill="#333" font-size="14">
    <line x1="322" y1="60" x2="150" y2="44" stroke="#c0392b" stroke-width="1.2"/>
    <text x="40" y="48">护头（电子头盔）</text>
    <line x1="300" y1="170" x2="120" y2="158" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="40" y="162">护胸（电子躯干护具）</text>
    <line x1="222" y1="214" x2="150" y2="252" stroke="#c0392b" stroke-width="1.2"/>
    <text x="40" y="256">护臂</text>
    <line x1="286" y1="300" x2="120" y2="330" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="40" y="334">护腿</text>
    <line x1="360" y1="270" x2="360" y2="330" stroke="#c0392b" stroke-width="1.2"/>
    <text x="318" y="350">护裆</text>
    <line x1="360" y1="46" x2="540" y2="30" stroke="#c0392b" stroke-width="1.2"/>
    <text x="520" y="34">护齿（咬合佩戴）</text>
  </g>
  <!-- 底部图注 -->
  <text x="360" y="400" text-anchor="middle" fill="#666" font-size="14">全套护具：护头 · 护胸 · 护臂 · 护腿 · 护裆 · 护齿（WT 竞技标准）</text>
</svg>
