<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%">
<title>悬链面轮廓</title>
<desc>示意图：悬链面沿旋转轴的剖面，左右两条悬链线曲线在中部收出细腰，虚线标注旋转轴、腰部最细处与曲线方程 z = c·cosh(r/c)。</desc>
<rect width="600" height="420" fill="#faf9f5"/>

<!-- 旋转轴 -->
<line x1="300" y1="30" x2="300" y2="390" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="310" y="45" font-family="sans-serif" font-size="14" fill="#777">旋转轴</text>

<!-- 左右悬链线（收腰轮廓） -->
<path d="M 170,60 C 285,100 295,160 295,210 C 295,260 285,320 170,360" fill="none" stroke="#1f6f8b" stroke-width="3.5"/>
<path d="M 430,60 C 315,100 305,160 305,210 C 305,260 315,320 430,360" fill="none" stroke="#1f6f8b" stroke-width="3.5"/>

<!-- 腰部标记 -->
<line x1="285" y1="210" x2="315" y2="210" stroke="#c0392b" stroke-width="2"/>
<text x="240" y="202" font-family="sans-serif" font-size="14" fill="#c0392b">腰部（半径最小）</text>

<!-- 曲线方程标注 -->
<text x="80" y="320" font-family="sans-serif" font-size="15" fill="#1f6f8b">悬链线</text>
<text x="80" y="342" font-family="sans-serif" font-size="15" fill="#1f6f8b">z = c·cosh(r/c)</text>

<!-- 说明文字 -->
<text x="300" y="402" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">悬链面：绕轴旋转悬链线得到，平均曲率 H ≡ 0</text>
</svg>
