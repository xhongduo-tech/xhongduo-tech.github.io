<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%">
<title>带角点的分片光滑极值曲线</title>
<desc>示意图：分片光滑极值曲线在角点 c 处斜率从 y'⁻ 跳到 y'⁺，左切线水平、右切线倾斜，标注角点与两条切线。</desc>
<rect width="600" height="400" fill="#faf9f5"/>

<!-- 左端参考竖线 -->
<line x1="100" y1="30" x2="100" y2="380" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="500" y1="30" x2="500" y2="380" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

<!-- 左切线（水平，虚线） -->
<line x1="180" y1="320" x2="300" y2="320" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<!-- 右切线（沿折线段方向，虚线） -->
<line x1="300" y1="320" x2="430" y2="255" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>

<!-- 分片光滑极值曲线：水平段 + 斜段 -->
<path d="M 100,320 L 300,320" fill="none" stroke="#333" stroke-width="3.5"/>
<path d="M 300,320 L 500,195" fill="none" stroke="#333" stroke-width="3.5"/>

<!-- 角点 -->
<circle cx="300" cy="320" r="6" fill="#c0392b"/>
<text x="300" y="352" font-family="sans-serif" font-size="16" fill="#c0392b">角点 c</text>

<!-- 斜率标注 -->
<text x="190" y="305" font-family="sans-serif" font-size="14" fill="#c0392b">y′⁻（左斜率）</text>
<text x="360" y="240" font-family="sans-serif" font-size="14" fill="#1f6f8b">y′⁺（右斜率）</text>

<!-- 角点处连续性条件 -->
<text x="300" y="382" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">角条件：F_y′ 与 F − y′F_y′ 在角点连续</text>

<!-- 端点 -->
<circle cx="100" cy="320" r="5" fill="#333"/>
<circle cx="500" cy="195" r="5" fill="#333"/>
<text x="75" y="342" font-family="sans-serif" font-size="16" fill="#333">a</text>
<text x="505" y="178" font-family="sans-serif" font-size="16" fill="#333">b</text>
</svg>
