<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif">
  <title>养殖水体氮循环示意</title>
  <desc>饲料投入经鱼代谢生成氨，亚硝化细菌将氨氧化为亚硝酸盐，硝化细菌再氧化为硝酸盐，最终被藻类吸收或经换水排出；全程依赖溶氧与碱度，pH 升高会放大分子态氨毒性。</desc>
  <rect x="0" y="0" width="760" height="330" fill="#faf9f5"/>
  <g font-size="15" fill="#333" text-anchor="middle">
    <!-- A: ammonia -->
    <rect x="30" y="110" width="110" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="85" y="136">氨 NH3</text>
    <text x="85" y="158">（鱼鳃排出）</text>
    <text x="85" y="176" font-size="13" fill="#c0392b">毒性强</text>
    <!-- B: nitrosomonas -->
    <rect x="170" y="110" width="110" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="225" y="136">亚硝化细菌</text>
    <text x="225" y="158" font-size="13" font-style="italic">Nitrosomonas</text>
    <!-- C: nitrite -->
    <rect x="310" y="110" width="110" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="365" y="136">亚硝酸盐</text>
    <text x="365" y="158" font-size="15">NO2−</text>
    <text x="365" y="176" font-size="13" fill="#c0392b">有毒·褐血病</text>
    <!-- D: nitrobacter -->
    <rect x="450" y="110" width="110" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="505" y="136">硝化细菌</text>
    <text x="505" y="158" font-size="13" font-style="italic">Nitrobacter</text>
    <!-- E: nitrate -->
    <rect x="590" y="110" width="110" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="645" y="136">硝酸盐</text>
    <text x="645" y="158" font-size="15">NO3−</text>
    <text x="645" y="176" font-size="13">低毒</text>
    <!-- bottom under E: uptake -->
    <rect x="590" y="238" width="110" height="52" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
    <text x="645" y="261">藻类吸收</text>
    <text x="645" y="280">换水排出</text>
  </g>
  <!-- arrows -->
  <g fill="#333" stroke="#333" stroke-width="1.5">
    <line x1="140" y1="144" x2="163" y2="144"/>
    <polygon points="166,144 155,138 155,150"/>
    <line x1="280" y1="144" x2="303" y2="144"/>
    <polygon points="306,144 295,138 295,150"/>
    <line x1="420" y1="144" x2="443" y2="144"/>
    <polygon points="446,144 435,138 435,150"/>
    <line x1="560" y1="144" x2="583" y2="144"/>
    <polygon points="586,144 575,138 575,150"/>
    <line x1="645" y1="178" x2="645" y2="231"/>
    <polygon points="645,234 639,223 651,223"/>
  </g>
  <!-- teal note: dependence -->
  <rect x="30" y="250" width="380" height="56" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="220" y="274" font-size="14" fill="#1f6f8b" text-anchor="middle">硝化链每一步都消耗溶氧与碱度</text>
  <text x="220" y="294" font-size="14" fill="#1f6f8b" text-anchor="middle">溶氧不足 → 氨/亚硝酸盐累积</text>
  <!-- red note: pH -->
  <rect x="440" y="250" width="290" height="56" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="585" y="274" font-size="14" fill="#c0392b" text-anchor="middle">pH 每升 1，分子态氨 NH3 比例</text>
  <text x="585" y="294" font-size="14" fill="#c0392b" text-anchor="middle">约增 10 倍 → 毒性剧增</text>
</svg>
