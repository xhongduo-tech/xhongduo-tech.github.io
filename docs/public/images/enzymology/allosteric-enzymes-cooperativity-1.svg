<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" role="img" aria-labelledby="title desc">
  <title>米氏酶与别构酶的 v–[S] 曲线对比</title>
  <desc>青色双曲线为普通米氏酶（Hill 系数 n=1），红色 S 形曲线为别构酶（n&gt;1），两者在同一点达到半饱和 ½Vmax。</desc>

  <text x="430" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">米氏酶（双曲线）与别构酶（S 形）的 v–[S] 曲线</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="340" x2="820" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="60" y2="80" stroke="#333" stroke-width="1.5"/>
  <polygon points="60,80 55,95 65,95" fill="#333"/>
  <polygon points="820,340 805,335 805,345" fill="#333"/>
  <text x="820" y="365" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333">[S]</text>
  <text x="30" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">v</text>

  <!-- Vmax 渐近线 -->
  <line x1="60" y1="102" x2="500" y2="102" stroke="#666" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="508" y="106" font-family="sans-serif" font-size="14" fill="#333">Vmax</text>

  <!-- ½Vmax 与中点 -->
  <line x1="60" y1="221" x2="140" y2="221" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="10" y="225" font-family="sans-serif" font-size="13" fill="#333">½Vmax</text>
  <circle cx="140" cy="221" r="3.5" fill="#333"/>

  <!-- 米氏双曲线 -->
  <path d="M 60 340 L 80 292 L 100 261 L 120 238 L 140 221 L 160 208 L 180 197 L 220 181 L 260 170 L 300 161 L 380 150 L 460 142 L 520 137" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 别构 S 形曲线 -->
  <path d="M 60 340 L 68 336 L 76 338 L 84 332 L 92 326 L 100 312 L 108 298 L 116 279 L 124 259 L 132 240 L 140 221 L 148 204 L 156 190 L 164 178 L 172 166 L 180 157 L 190 147 L 204 137 L 220 127 L 260 116 L 340 107 L 420 105 L 500 103 L 560 102" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 中点标注 -->
  <line x1="140" y1="221" x2="140" y2="340" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="148" y="355" font-family="sans-serif" font-size="13" fill="#333">Km（米氏）或 [S]₀.₅（别构）</text>

  <!-- 图例 -->
  <g font-family="sans-serif" font-size="14" fill="#333">
    <rect x="600" y="120" width="230" height="80" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <line x1="612" y1="145" x2="650" y2="145" stroke="#1f6f8b" stroke-width="3"/>
    <text x="660" y="150">米氏酶（n=1）</text>
    <line x1="612" y1="178" x2="650" y2="178" stroke="#c0392b" stroke-width="3"/>
    <text x="660" y="183">别构酶（n&gt;1）</text>
  </g>
</svg>
