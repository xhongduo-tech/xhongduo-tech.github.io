<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" role="img" aria-labelledby="title desc">
  <title>米氏饱和曲线与 Lineweaver-Burk 双倒数图</title>
  <desc>左图为底物浓度对初速率的影响，呈双曲线，标出 Vmax 与 Km；右图为 1/v 对 1/[S] 的双倒数直线，纵截距为 1/Vmax，横截距为 -1/Km。</desc>

  <text x="430" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">米氏饱和曲线（左）与 Lineweaver-Burk 双倒数图（右）</text>

  <!-- 左侧：米氏曲线 -->
  <g font-family="sans-serif" fill="#333">
    <text x="55" y="365" text-anchor="middle" font-size="14">[S]</text>
    <text x="25" y="330" text-anchor="middle" font-size="14">v</text>
    <text x="38" y="95" text-anchor="start" font-size="13" fill="#666">Vmax（渐近线）</text>
  </g>
  <!-- 坐标轴 -->
  <line x1="60" y1="330" x2="385" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="60" y2="80" stroke="#333" stroke-width="1.5"/>
  <polygon points="60,80 55,95 65,95" fill="#333"/>
  <polygon points="385,330 370,325 370,335" fill="#333"/>
  <!-- 渐近线 -->
  <line x1="60" y1="106" x2="385" y2="106" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <!-- Vmax 双曲线 -->
  <path d="M 60 330 C 80 300 95 262 110 236 L 120 222 C 128 212 132 205 140 200 C 152 190 166 180 180 172 C 200 161 230 152 260 145 C 300 137 350 129 385 124" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- ½Vmax 与 Km 虚线 -->
  <line x1="60" y1="218" x2="124" y2="218" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="124" y1="218" x2="124" y2="330" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="124" cy="218" r="3.5" fill="#c0392b"/>
  <text x="128" y="212" font-size="13" fill="#c0392b">½Vmax</text>
  <text x="130" y="350" font-size="13" fill="#333">Km</text>
  <text x="128" y="138" font-size="13" fill="#c0392b">Vmax</text>

  <!-- 右侧：双倒数图 -->
  <g font-family="sans-serif" fill="#333">
    <text x="625" y="365" text-anchor="middle" font-size="14">1/[S]</text>
    <text x="440" y="330" text-anchor="middle" font-size="14">1/v</text>
  </g>
  <line x1="470" y1="330" x2="820" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="470" y1="330" x2="470" y2="80" stroke="#333" stroke-width="1.5"/>
  <polygon points="470,80 465,95 475,95" fill="#333"/>
  <polygon points="820,330 805,325 805,335" fill="#333"/>
  <!-- 双倒数直线：过纵截距 1/Vmax 与负横截距 -1/Km -->
  <line x1="295" y1="330" x2="820" y2="159" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="470" cy="244" r="3.5" fill="#1f6f8b"/>
  <circle cx="295" cy="330" r="3.5" fill="#1f6f8b"/>
  <text x="478" y="238" font-size="13" fill="#1f6f8b">纵截距 = 1/Vmax</text>
  <text x="200" y="345" font-size="13" fill="#1f6f8b">横截距 = −1/Km</text>
  <text x="560" y="200" font-size="13" fill="#333">斜率 = Km/Vmax</text>
</svg>
