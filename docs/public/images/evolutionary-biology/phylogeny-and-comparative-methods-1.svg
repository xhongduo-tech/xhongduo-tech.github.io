<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="sans-serif">
  <title>系统发育树：分叉顺序决定亲缘</title>
  <desc>一棵含 A、B、C、D 四个类群的系统发育树，展示最近共同祖先决定亲缘关系，并标注单系群与并系群的区别。</desc>
  <rect x="0" y="0" width="860" height="380" fill="#faf9f5"/>
  <text x="30" y="30" font-size="17" fill="#333" font-weight="bold">系统发育树：亲缘由最近共同祖先决定</text>
  <!-- 树结构：根在左，分叉到 A B C D -->
  <polyline points="40,190 90,190 130,120 160,120 200,60 240,60 260,35" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polyline points="240,60 260,85" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polyline points="130,120 160,120 200,180 240,180 260,155" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polyline points="240,180 260,205" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polyline points="90,190 130,240 160,240 200,290 240,290 260,265" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polyline points="240,290 260,315" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 节点标注 -->
  <circle cx="90" cy="190" r="4" fill="#333"/>
  <circle cx="130" cy="120" r="4" fill="#c0392b"/>
  <circle cx="200" cy="60" r="4" fill="#c0392b"/>
  <circle cx="200" cy="180" r="4" fill="#c0392b"/>
  <circle cx="130" cy="240" r="4" fill="#c0392b"/>
  <circle cx="200" cy="290" r="4" fill="#c0392b"/>
  <!-- 终端类群 -->
  <text x="268" y="30" font-size="16" fill="#333" font-weight="bold">A</text>
  <text x="268" y="90" font-size="16" fill="#333" font-weight="bold">B</text>
  <text x="268" y="160" font-size="16" fill="#333" font-weight="bold">C</text>
  <text x="268" y="270" font-size="16" fill="#333" font-weight="bold">D</text>
  <!-- 说明文字 -->
  <text x="30" y="350" font-size="14" fill="#333">● 红点 = 共同祖先（分叉节点）。A 与 B 的最近共同祖先（顶端红点）比 A 与 C 的更晚 → A、B 是姊妹类群。</text>
  <text x="30" y="372" font-size="14" fill="#c0392b">群的划分只认单系群：A+B（一个祖先 + 全部后代）是单系；若把 A+B+C 称为“AB 类群”则错误——它漏掉了 A、B 的后代 C。</text>
  <text x="400" y="50" font-size="13" fill="#333">并系群示例：把「爬行动物（不含鸟类）」画在树上</text>
  <text x="400" y="70" font-size="13" fill="#333">会得到一个「只含部分后代」的框，违反单系原则。</text>
</svg>
