<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="sans-serif">
  <title>机械合金化的冷焊—断裂—再焊循环</title>
  <desc>初始粉末颗粒在磨球撞击下反复经历冷焊成复合颗粒、断裂细化、再焊形成层状结构、最终原子级混合成合金的四个阶段。</desc>
  <rect width="540" height="380" fill="#faf9f5"/>
  <text x="270" y="36" text-anchor="middle" fill="#333" font-size="16"><tspan font-weight="bold">机械合金化四阶段循环</tspan></text>
  <g font-size="14">
    <rect x="30" y="70" width="100" height="110" rx="8" fill="#f2efe9" stroke="#333" stroke-width="2"/>
    <circle cx="66" cy="112" r="15" fill="#1f6f8b"/>
    <circle cx="98" cy="118" r="13" fill="#c0392b"/>
    <circle cx="80" cy="150" r="12" fill="#1f6f8b"/>
    <circle cx="104" cy="158" r="10" fill="#c0392b"/>
    <text x="80" y="195" text-anchor="middle" fill="#333" font-size="13">① 初始粉末</text>
    <text x="80" y="214" text-anchor="middle" fill="#333" font-size="13">（A 蓝 / B 红）</text>
    <rect x="165" y="70" width="100" height="110" rx="8" fill="#f2efe9" stroke="#333" stroke-width="2"/>
    <path d="M 175 100 L 220 90 L 255 105 L 250 160 L 200 168 L 178 150 Z" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M 185 105 L 240 100 L 245 155" stroke="#1f6f8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 215 92 L 210 155" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="215" y="195" text-anchor="middle" fill="#333" font-size="13">② 冷焊</text>
    <text x="215" y="214" text-anchor="middle" fill="#333" font-size="13">（层状复合颗粒）</text>
    <rect x="300" y="70" width="100" height="110" rx="8" fill="#f2efe9" stroke="#333" stroke-width="2"/>
    <rect x="315" y="95" width="40" height="55" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <rect x="355" y="88" width="32" height="50" fill="none" stroke="#c0392b" stroke-width="2"/>
    <rect x="322" y="108" width="14" height="6" fill="#1f6f8b"/>
    <rect x="340" y="118" width="14" height="6" fill="#c0392b"/>
    <rect x="322" y="128" width="14" height="6" fill="#1f6f8b"/>
    <text x="350" y="195" text-anchor="middle" fill="#333" font-size="13">③ 断裂细化</text>
    <text x="350" y="214" text-anchor="middle" fill="#333" font-size="13">（层厚变薄）</text>
    <rect x="435" y="70" width="90" height="110" rx="8" fill="#f2efe9" stroke="#333" stroke-width="2"/>
    <rect x="455" y="100" width="50" height="45" fill="#1f6f8b" stroke="#333" stroke-width="1"/>
    <rect x="455" y="112" width="50" height="5" fill="#c0392b"/>
    <rect x="455" y="124" width="50" height="5" fill="#c0392b"/>
    <text x="480" y="195" text-anchor="middle" fill="#333" font-size="13">④ 原子级混合</text>
    <text x="480" y="214" text-anchor="middle" fill="#333" font-size="13">（合金/固溶体）</text>
  </g>
  <g fill="none" stroke="#c0392b" stroke-width="2">
    <path d="M 136 125 L 160 125" marker-end="url(#ma-arrow)"/>
    <path d="M 271 125 L 294 125" marker-end="url(#ma-arrow)"/>
    <path d="M 406 125 L 429 125" marker-end="url(#ma-arrow)"/>
  </g>
  <defs>
    <marker id="ma-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <path d="M 360 320 Q 480 320 500 280" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="300" text-anchor="middle" fill="#c0392b" font-size="14">磨球反复撞击 → 循环重复，直到层厚达亚微米/纳米级</text>
  <text x="270" y="340" text-anchor="middle" fill="#333" font-size="13">气氛：惰性气体（Ar）｜ 抑制过度冷焊：过程控制剂（PCA）</text>
</svg>
