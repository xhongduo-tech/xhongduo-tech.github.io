<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="sans-serif">
  <title>摩托车总体构造示意</title>
  <desc>从侧面展示摩托车的车把、油箱、坐垫、车架、发动机、排气管、前后悬挂、前后轮、链条与变速踏板等主要部件的相对位置。</desc>
  <rect width="820" height="470" fill="#faf9f5"/>
  <!-- 地面 -->
  <line x1="40" y1="400" x2="780" y2="400" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 后轮 -->
  <circle cx="190" cy="340" r="58" fill="none" stroke="#333" stroke-width="12"/>
  <circle cx="190" cy="340" r="34" fill="none" stroke="#333" stroke-width="3"/>
  <!-- 前轮 -->
  <circle cx="630" cy="340" r="58" fill="none" stroke="#333" stroke-width="12"/>
  <circle cx="630" cy="340" r="34" fill="none" stroke="#333" stroke-width="3"/>
  <!-- 主车架（脊梁） -->
  <line x1="190" y1="330" x2="585" y2="175" stroke="#1f6f8b" stroke-width="9" stroke-linecap="round"/>
  <!-- 后悬挂摇臂 -->
  <line x1="285" y1="295" x2="190" y2="330" stroke="#1f6f8b" stroke-width="7" stroke-linecap="round"/>
  <!-- 前叉（前悬挂） -->
  <line x1="585" y1="180" x2="630" y2="335" stroke="#1f6f8b" stroke-width="9" stroke-linecap="round"/>
  <!-- 发动机 -->
  <rect x="305" y="255" width="120" height="78" rx="8" fill="#c0392b" opacity="0.85"/>
  <!-- 油箱 -->
  <polygon points="430,150 558,168 545,108 430,112" fill="#1f6f8b" opacity="0.75"/>
  <!-- 坐垫 -->
  <rect x="330" y="118" width="108" height="26" rx="10" fill="#333"/>
  <!-- 车把 -->
  <line x1="560" y1="148" x2="628" y2="168" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- 排气管 -->
  <polyline points="330,330 300,372 240,382" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- 链条 -->
  <line x1="318" y1="318" x2="190" y2="330" stroke="#888" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- 变速踏板 -->
  <line x1="318" y1="350" x2="300" y2="382" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="382" x2="322" y2="388" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- 标注引线与文字 -->
  <g stroke="#333" stroke-width="1.2" fill="#333">
    <line x1="588" y1="152" x2="630" y2="120"/>
    <text x="636" y="118" font-size="15">车把</text>
    <line x1="495" y1="118" x2="495" y2="88"/>
    <text x="472" y="80" font-size="15">油箱</text>
    <line x1="385" y1="116" x2="385" y2="86"/>
    <text x="360" y="78" font-size="15">坐垫</text>
    <line x1="470" y1="215" x2="520" y2="245"/>
    <text x="524" y="244" font-size="15">车架</text>
    <line x1="365" y1="295" x2="365" y2="230"/>
    <text x="330" y="222" font-size="15">发动机</text>
    <line x1="260" y1="382" x2="220" y2="408"/>
    <text x="170" y="420" font-size="15">排气管</text>
    <line x1="655" y1="255" x2="700" y2="232"/>
    <text x="704" y="232" font-size="15">前叉</text>
    <line x1="700" y1="360" x2="742" y2="352"/>
    <text x="746" y="352" font-size="15">前轮</text>
    <line x1="252" y1="324" x2="240" y2="290"/>
    <text x="218" y="282" font-size="15">链条</text>
    <line x1="238" y1="296" x2="238" y2="260"/>
    <text x="205" y="252" font-size="15">后悬挂</text>
    <line x1="150" y1="352" x2="108" y2="352"/>
    <text x="56" y="356" font-size="15">后轮</text>
    <line x1="318" y1="382" x2="350" y2="408"/>
    <text x="352" y="420" font-size="15">变速踏板</text>
  </g>
</svg>
