<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img">
<title>脊椎动物支序图</title>
<desc>支序图：五个分类单元按照共同衍征逐级分组。最左侧七鳃鳗先分出（外群），随后鲨鱼、真骨鱼、肺鱼依次分出，四足动物在最右侧。每个节点代表一个单系群。</desc>
<rect width="920" height="540" fill="#faf9f5"/>
<text x="460" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#333">支序图：按共同衍征分组（cladogram）</text>

<g font-family="sans-serif" text-anchor="middle">
<g>
<rect x="40" y="70" width="150" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="115" y="89" font-size="16" font-weight="bold" fill="#333">七鳃鳗</text>
<text x="115" y="105" font-size="12" fill="#555">无颌类（外群）</text>
</g>
<g>
<rect x="205" y="70" width="150" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="280" y="89" font-size="16" font-weight="bold" fill="#333">鲨鱼</text>
<text x="280" y="105" font-size="12" fill="#555">软骨鱼类</text>
</g>
<g>
<rect x="370" y="70" width="150" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="445" y="89" font-size="16" font-weight="bold" fill="#333">真骨鱼</text>
<text x="445" y="105" font-size="12" fill="#555">辐鳍鱼类</text>
</g>
<g>
<rect x="535" y="70" width="150" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="610" y="89" font-size="16" font-weight="bold" fill="#333">肺鱼</text>
<text x="610" y="105" font-size="12" fill="#555">肉鳍鱼类</text>
</g>
<g>
<rect x="700" y="70" width="150" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="775" y="89" font-size="16" font-weight="bold" fill="#333">四足动物</text>
<text x="775" y="105" font-size="12" fill="#555">羊膜类·含人</text>
</g>
</g>

<g stroke="#333" stroke-width="2" fill="none">
<line x1="640" y1="470" x2="640" y2="92"/>
<line x1="640" y1="410" x2="115" y2="410"/>
<line x1="115" y1="410" x2="115" y2="114"/>
<line x1="640" y1="330" x2="280" y2="330"/>
<line x1="280" y1="330" x2="280" y2="114"/>
<line x1="640" y1="250" x2="445" y2="250"/>
<line x1="445" y1="250" x2="445" y2="114"/>
<line x1="640" y1="170" x2="610" y2="170"/>
<line x1="610" y1="170" x2="610" y2="114"/>
<line x1="640" y1="92" x2="775" y2="92"/>
</g>

<g font-family="sans-serif">
<line x1="640" y1="470" x2="668" y2="470" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="474" font-size="15" fill="#333">脊椎骨（脊椎动物门）</text>
<line x1="640" y1="410" x2="668" y2="410" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="414" font-size="15" fill="#333">颌（有颌类）</text>
<line x1="640" y1="330" x2="668" y2="330" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="334" font-size="15" fill="#333">硬骨（硬骨鱼纲）</text>
<line x1="640" y1="250" x2="668" y2="250" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="254" font-size="15" fill="#333">肺／泳鳔（肉鳍鱼）</text>
<line x1="640" y1="170" x2="668" y2="170" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="174" font-size="15" fill="#333">四肢（四足总纲）</text>
<line x1="640" y1="92" x2="668" y2="92" stroke="#c0392b" stroke-width="5"/>
<text x="680" y="96" font-size="15" fill="#333">羊膜卵（羊膜动物）</text>
</g>

<text x="460" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">越靠右的类群拥有越多的共同衍征；每个节点（红杠）代表一个共同祖先及其全部后裔，即一个单系群</text>
</svg>
