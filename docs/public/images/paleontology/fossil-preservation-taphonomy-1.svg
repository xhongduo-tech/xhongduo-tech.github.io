<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img">
<title>埋藏学信息漏斗</title>
<desc>从活体生物到被发现的化石，每一环节都在丢失个体与形态信息，最终进入化石记录的只是曾经生命的一小部分。</desc>
<rect width="1000" height="580" fill="#faf9f5"/>
<text x="500" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#333">埋藏学信息漏斗（taphonomic filter）</text>
<text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">从死亡到被发现，信息逐级衰减——研究化石之前，先读懂它丢了什么</text>

<g font-family="sans-serif">
<rect x="50" y="110" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="185" y="144" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">① 活体生物</text>
<text x="185" y="170" text-anchor="middle" font-size="14" fill="#555">完整的生物群落</text>

<rect x="365" y="110" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="500" y="144" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">② 死亡与分解</text>
<text x="500" y="170" text-anchor="middle" font-size="14" fill="#555">有机质氧化·腐食</text>

<rect x="680" y="110" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="815" y="144" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">③ 搬运与磨蚀</text>
<text x="815" y="170" text-anchor="middle" font-size="14" fill="#555">机械破碎·分选</text>

<rect x="50" y="300" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="185" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">④ 掩埋</text>
<text x="185" y="360" text-anchor="middle" font-size="14" fill="#555">沉积物覆盖·缺氧</text>

<rect x="365" y="300" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="500" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">⑤ 石化与成岩</text>
<text x="500" y="360" text-anchor="middle" font-size="14" fill="#555">矿化·压溶·压实</text>

<rect x="680" y="300" width="270" height="84" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="815" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">⑥ 出露与发现</text>
<text x="815" y="360" text-anchor="middle" font-size="14" fill="#555">抬升·侵蚀·采集</text>

<line x1="320" y1="152" x2="365" y2="152" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="635" y1="152" x2="680" y2="152" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="815" y1="194" x2="815" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="185" y1="194" x2="185" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="500" y1="194" x2="500" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="320" y1="384" x2="365" y2="384" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="635" y1="384" x2="680" y2="384" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

<g fill="#c0392b">
<text x="185" y="252" text-anchor="middle" font-size="14">↓ 信息丢失</text>
<text x="500" y="252" text-anchor="middle" font-size="14">↓ 信息丢失</text>
<text x="815" y="470" text-anchor="middle" font-size="14">↓ 信息丢失</text>
<text x="185" y="470" text-anchor="middle" font-size="14">↓ 信息丢失</text>
<text x="500" y="470" text-anchor="middle" font-size="14">↓ 信息丢失</text>
</g>

<rect x="40" y="508" width="920" height="56" rx="10" fill="#f0ece4"/>
<text x="500" y="542" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">最终被写入「化石记录」的，只是曾经生命的一小部分——</text>
<text x="500" y="556" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">每一环节都像一道低通滤波器，优先淘汰软组织、小个体与不结实的骨骼</text>

<defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<polygon points="0 0, 10 4, 0 8" fill="#333"/>
</marker>
</defs>
</svg>
