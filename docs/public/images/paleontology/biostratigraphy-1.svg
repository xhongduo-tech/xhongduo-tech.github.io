<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" role="img">
<title>延限带与组合延限带</title>
<desc>地层柱状图左侧为岩性，右侧五个柱代表五个物种沿剖面的延限（FAD 为首次出现，LAD 为末次出现）；红色阴影区为物种 B 与 C 的重叠延限，即组合延限带。</desc>
<rect width="940" height="640" fill="#faf9f5"/>
<text x="470" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#333">生物地层学的核心工具：延限带（range zone）</text>
<text x="470" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">纵轴向上为年轻地层；每一物种柱从 FAD（底）延伸到 LAD（顶）</text>

<text x="60" y="105" font-family="sans-serif" font-size="15" fill="#c0392b">年轻 ↑</text>
<text x="48" y="640" font-family="sans-serif" font-size="15" fill="#c0392b">老 ↓</text>

<g font-family="sans-serif">
<rect x="110" y="100" width="130" height="140" fill="#d9c9a3" stroke="#8a7a55" stroke-width="2"/>
<text x="175" y="165" text-anchor="middle" font-size="16" fill="#333">上段</text>
<text x="175" y="188" text-anchor="middle" font-size="13" fill="#555">砂页岩</text>
<rect x="110" y="240" width="130" height="150" fill="#b8c6c8" stroke="#7a8a8c" stroke-width="2"/>
<text x="175" y="310" text-anchor="middle" font-size="16" fill="#333">中段</text>
<text x="175" y="333" text-anchor="middle" font-size="13" fill="#555">灰岩</text>
<rect x="110" y="390" width="130" height="150" fill="#cfc6b8" stroke="#8f8575" stroke-width="2"/>
<text x="175" y="460" text-anchor="middle" font-size="16" fill="#333">下段</text>
<text x="175" y="483" text-anchor="middle" font-size="13" fill="#555">页岩</text>
</g>

<g stroke-width="26">
<line x1="290" y1="540" x2="290" y2="300" stroke="#1f6f8b"/>
<line x1="400" y1="520" x2="400" y2="210" stroke="#1f6f8b"/>
<line x1="510" y1="350" x2="510" y2="120" stroke="#1f6f8b"/>
<line x1="620" y1="430" x2="620" y2="190" stroke="#1f6f8b"/>
<line x1="730" y1="200" x2="730" y2="100" stroke="#1f6f8b"/>
</g>

<g font-family="sans-serif" text-anchor="middle">
<text x="290" y="575" font-size="14" fill="#333">种 A</text>
<text x="400" y="575" font-size="14" fill="#333">种 B</text>
<text x="510" y="575" font-size="14" fill="#333">种 C</text>
<text x="620" y="575" font-size="14" fill="#333">种 D</text>
<text x="730" y="575" font-size="14" fill="#333">种 E</text>
</g>

<g font-family="sans-serif" fill="#333">
<polygon points="290,540 278,553 302,553" fill="#c0392b"/>
<text x="310" y="556" font-size="14" fill="#c0392b">FAD（首现）</text>
<polygon points="290,300 278,287 302,287" fill="#c0392b"/>
<text x="310" y="290" font-size="14" fill="#c0392b">LAD（末现）</text>
</g>

<rect x="372" y="210" width="166" height="140" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="455" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8f1f16">组合延限带</text>
<text x="455" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8f1f16">B 与 C 延限</text>
<text x="455" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8f1f16">重叠的区间</text>

<text x="470" y="616" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">「组合延限带」= 两个物种延限的重叠区间，常用于跨盆地的地层对比</text>
</svg>
