<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>层序地层学体系域图解：HST₁–SB₁–LST–TST–MFS–HST–SB₂</title>
  <desc>陆—海剖面示意图，展示一个层序内低位、海侵、高位体系域的几何关系与关键界面，包含下切谷、海侵退积与高位进积。</desc>
  <rect width="560" height="400" fill="#faf9f5"/>
  <!-- 陆地 -->
  <polygon points="0,70 120,70 120,205 60,215 0,220" fill="#e8d5a0"/>
  <text x="35" y="150" font-size="15" fill="#5a4a2f">陆地</text>
  <!-- 海平面 -->
  <line x1="120" y1="70" x2="560" y2="70" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="120" y="60" font-size="14" fill="#1f6f8b">海平面</text>
  <!-- 海 -->
  <polygon points="120,70 560,70 560,310 510,280 450,245 390,228 335,222 315,258 300,220 250,215 120,205" fill="#dce9f2"/>
  <text x="300" y="120" font-size="15" fill="#1f6f8b">海</text>
  <!-- HST₁（前序高位） -->
  <polygon points="120,205 250,215 300,220 315,258 335,222 390,228 450,245 510,280 560,310 560,400 120,400" fill="#efead9"/>
  <polyline points="130,255 280,295 430,335" fill="none" stroke="#c8bfa8" stroke-width="1.2"/>
  <polyline points="150,280 300,318 450,356" fill="none" stroke="#c8bfa8" stroke-width="1.2"/>
  <polyline points="170,305 320,340 470,376" fill="none" stroke="#c8bfa8" stroke-width="1.2"/>
  <text x="250" y="355" font-size="14" fill="#8a7d55">HST₁（前序高位体系域）</text>
  <!-- SB₁ -->
  <polyline points="120,205 250,215 300,220 315,258 335,222 390,228 450,245 510,280 560,310" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="240" y="240" font-size="14" fill="#c0392b">SB₁</text>
  <!-- 下切谷充填 -->
  <polygon points="300,220 315,258 335,222" fill="#c9b89a" stroke="#8a7d55" stroke-width="1"/>
  <text x="268" y="268" font-size="13" fill="#5a4a2f">下切谷</text>
  <!-- LST 低位楔 -->
  <polygon points="340,229 390,228 450,245 510,280 480,258 420,242" fill="#c9b89a" stroke="#8a7d55" stroke-width="1"/>
  <polyline points="400,236 470,258" fill="none" stroke="#8a7d55" stroke-width="1"/>
  <text x="385" y="270" font-size="14" fill="#5a4a2f">LST（低位体系域）</text>
  <!-- TS 海侵面 -->
  <polyline points="120,208 250,218 300,224 340,229 420,242 510,272" fill="none" stroke="#24404f" stroke-width="1.6"/>
  <text x="500" y="288" font-size="13" fill="#24404f">TS 海侵面</text>
  <!-- TST 海侵体系域 -->
  <polygon points="120,203 220,208 360,222 450,240 530,268 510,272 420,242 340,229 300,224 250,218 120,208" fill="#cfe0d8"/>
  <polyline points="150,212 280,220" stroke="#7fa896" stroke-width="1.1"/>
  <polyline points="170,216 260,221" stroke="#7fa896" stroke-width="1.1"/>
  <polyline points="190,220 250,224" stroke="#7fa896" stroke-width="1.1"/>
  <text x="138" y="232" font-size="14" fill="#2f5b4a">TST（海侵体系域·退积）</text>
  <!-- MFS 最大海泛面 -->
  <polyline points="120,203 220,208 360,222 450,240 530,268" fill="none" stroke="#1f6f8b" stroke-width="2.2" stroke-dasharray="8,4"/>
  <text x="438" y="250" font-size="13" fill="#1f6f8b">MFS 最大海泛面</text>
  <!-- HST 高位体系域 -->
  <polygon points="120,200 220,205 360,218 450,236 530,264 560,280 560,310 530,268 450,240 360,222 220,208 120,203" fill="#eadfc3"/>
  <polyline points="160,210 320,226 460,248 540,270" fill="none" stroke="#c8b98f" stroke-width="1.2"/>
  <polyline points="230,214 360,226 480,246 545,266" fill="none" stroke="#c8b98f" stroke-width="1.2"/>
  <text x="300" y="248" font-size="14" fill="#7a6a3f">HST（高位体系域·进积）</text>
  <!-- SB₂ -->
  <polyline points="120,200 220,205 360,218 450,236 530,264 560,280" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="505" y="252" font-size="14" fill="#c0392b">SB₂</text>
</svg>
