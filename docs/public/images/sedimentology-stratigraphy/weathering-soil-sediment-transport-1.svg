<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Hjulström 图解：侵蚀、搬运与沉积三区</title>
  <desc>以粒径为横轴、流速为纵轴的双对数坐标图，上部曲线为侵蚀起动流速，下部曲线为沉降末速，二者之间为搬运区。</desc>
  <rect width="480" height="340" fill="#faf9f5"/>
  <!-- 侵蚀区（红） -->
  <polygon points="60,35 150,50 250,80 320,105 400,130 450,140 450,30 60,30" fill="#f3d3cf"/>
  <!-- 沉积区（青） -->
  <polygon points="60,220 150,230 250,240 320,245 450,250 450,290 60,290" fill="#d3e5ec"/>
  <!-- 坐标轴 -->
  <line x1="60" y1="290" x2="455" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="295" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="290" x2="450" y2="290" stroke="#333" stroke-width="1.5"/>
  <!-- x 轴刻度 0.01,0.1,1,10 -->
  <line x1="60" y1="290" x2="60" y2="296" stroke="#333"/>
  <line x1="190" y1="290" x2="190" y2="296" stroke="#333"/>
  <line x1="320" y1="290" x2="320" y2="296" stroke="#333"/>
  <line x1="450" y1="290" x2="450" y2="296" stroke="#333"/>
  <text x="60" y="312" font-size="13" fill="#333" text-anchor="middle">0.01</text>
  <text x="190" y="312" font-size="13" fill="#333" text-anchor="middle">0.1</text>
  <text x="320" y="312" font-size="13" fill="#333" text-anchor="middle">1</text>
  <text x="450" y="312" font-size="13" fill="#333" text-anchor="middle">10</text>
  <text x="255" y="332" font-size="14" fill="#333" text-anchor="middle">粒径 d（mm，对数刻度）</text>
  <!-- y 轴刻度 0.1,1,10,100 -->
  <line x1="54" y1="290" x2="60" y2="290" stroke="#333"/>
  <line x1="54" y1="203" x2="60" y2="203" stroke="#333"/>
  <line x1="54" y1="117" x2="60" y2="117" stroke="#333"/>
  <line x1="54" y1="30" x2="60" y2="30" stroke="#333"/>
  <text x="50" y="294" font-size="13" fill="#333" text-anchor="end">0.1</text>
  <text x="50" y="207" font-size="13" fill="#333" text-anchor="end">1</text>
  <text x="50" y="121" font-size="13" fill="#333" text-anchor="end">10</text>
  <text x="50" y="34" font-size="13" fill="#333" text-anchor="end">100</text>
  <text x="18" y="165" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 18 165)">流速 v（cm/s，对数刻度）</text>
  <!-- 侵蚀起动流速曲线 -->
  <polyline points="60,35 150,50 250,80 320,105 400,130 450,140" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 沉降末速曲线 -->
  <polyline points="60,220 150,230 250,240 320,245 450,250" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 区标签 -->
  <text x="360" y="62" font-size="15" fill="#c0392b">侵蚀区</text>
  <text x="195" y="172" font-size="15" fill="#333">搬运区</text>
  <text x="330" y="270" font-size="15" fill="#1f6f8b">沉积区</text>
  <!-- 曲线注记 -->
  <text x="208" y="86" font-size="13" fill="#c0392b">侵蚀起动流速</text>
  <text x="300" y="226" font-size="13" fill="#1f6f8b">沉降末速</text>
  <text x="118" y="92" font-size="13" fill="#c0392b">（黏土因内聚力</text>
  <text x="118" y="110" font-size="13" fill="#c0392b">反需更高流速）</text>
</svg>
