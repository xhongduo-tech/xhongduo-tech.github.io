<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="sans-serif" font-size="14">
  <title>注意力矩阵的平方增长</title>
  <desc>Q与K的乘积生成n乘n的分数矩阵，上下文长度翻倍时代价翻四倍。</desc>
  <rect x="0" y="0" width="720" height="430" fill="#faf9f5"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">注意力分数矩阵 S = QK&#8901;</text>

  <!-- 左：Q 矩阵 -->
  <rect x="60" y="70" width="90" height="140" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="105" y="100" text-anchor="middle" fill="#1f6f8b" font-weight="bold">Q</text>
  <text x="105" y="240" text-anchor="middle" fill="#333">n × d</text>

  <!-- 上：Kᵀ 矩阵 -->
  <rect x="170" y="40" width="180" height="80" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="260" y="62" text-anchor="middle" fill="#1f6f8b" font-weight="bold">K&#8901;</text>
  <text x="260" y="34" text-anchor="middle" fill="#333">d × n</text>

  <!-- 右：S 矩阵 -->
  <rect x="180" y="90" width="160" height="160" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="260" y="180" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">S</text>
  <text x="260" y="198" text-anchor="middle" fill="#c0392b" font-size="13">n × n</text>

  <!-- 乘号 -->
  <text x="125" y="150" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">×</text>
  <text x="350" y="170" font-size="22" fill="#333">=</text>

  <!-- 增长曲线 -->
  <text x="470" y="80" font-size="15" fill="#333" font-weight="bold">上下文长度翻倍，代价翻四倍</text>
  <rect x="470" y="95" width="220" height="220" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="485" y1="300" x2="675" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="485" y1="300" x2="485" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="322" text-anchor="middle" fill="#333">n（上下文长度）</text>
  <text x="472" y="120" text-anchor="middle" fill="#333" font-size="13">代价</text>
  <path d="M 485 295 Q 540 290 580 240 T 660 120" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="630" y="150" fill="#c0392b" font-size="13">O(n²)</text>

  <!-- 数字标注 -->
  <text x="360" y="340" text-anchor="middle" fill="#333" font-size="14">n = 2&#185;&#8310; ≈ 65536 时：</text>
  <text x="360" y="362" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">n² ≈ 4.3 × 10⁹ 个元素，单张矩阵 ≈ 17 GB</text>
  <text x="360" y="386" text-anchor="middle" fill="#333" font-size="13">还只是一个注意力头、一层的开销</text>
</svg>
