<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" font-size="14">
  <title>GPU 存储层级与注意力的数据流动</title>
  <desc>SRAM 在芯片内、HBM 在芯片外，标准注意力在 HBM 与 SRAM 之间来回搬运 n 乘 n 矩阵。</desc>
  <rect x="0" y="0" width="720" height="380" fill="#faf9f5"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">GPU 存储层级：FlashAttention 的战场</text>

  <!-- SRAM -->
  <rect x="250" y="60" width="220" height="80" fill="#ffffff" stroke="#c0392b" stroke-width="2.5" rx="6"/>
  <text x="360" y="90" text-anchor="middle" fill="#c0392b" font-weight="bold">SRAM（片上缓存）</text>
  <text x="360" y="110" text-anchor="middle" fill="#333">容量小（A100 约 192 KB/核）· 快</text>
  <text x="360" y="130" text-anchor="middle" fill="#333">带宽约 19 TB/s</text>

  <!-- HBM -->
  <rect x="130" y="210" width="460" height="90" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.5" rx="6"/>
  <text x="360" y="240" text-anchor="middle" fill="#1f6f8b" font-weight="bold">HBM（高带宽显存）</text>
  <text x="360" y="262" text-anchor="middle" fill="#333">容量大（A100 有 40–80 GB）· 慢</text>
  <text x="360" y="284" text-anchor="middle" fill="#333">带宽约 2 TB/s——比 SRAM 慢约 10 倍</text>

  <!-- 箭头 -->
  <line x1="360" y1="140" x2="360" y2="205" stroke="#333" stroke-width="2"/>
  <polygon points="354,196 360,212 366,196" fill="#333"/>
  <text x="378" y="178" font-size="13" fill="#333">标准注意力：n×n 矩阵在此来回往返</text>

  <!-- 标准实现的往返说明 -->
  <rect x="60" y="315" width="280" height="45" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="200" y="335" text-anchor="middle" fill="#c0392b" font-size="13">标准：写 S → 读 S 做 softmax → 写 P → 读 P</text>
  <text x="200" y="352" text-anchor="middle" fill="#333" font-size="13">一趟 n×n 矩阵要进出 HBM 多次</text>

  <rect x="380" y="315" width="280" height="45" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="520" y="335" text-anchor="middle" fill="#1f6f8b" font-size="13">FlashAttention：分块后在 SRAM 内算完</text>
  <text x="520" y="352" text-anchor="middle" fill="#333" font-size="13">只把结果 O 写回 HBM，n×n 矩阵不复存在</text>
</svg>
