<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="sans-serif">
  <title>MCMC 采样示意：链沿后验密度行走</title>
  <desc>单峰后验密度曲线下，马尔可夫链从左下方起点出发，在高密度区（峰顶）密集采样、在低密度区快速穿过，链上采样点的疏密近似反映后验密度高低。</desc>
  <rect width="820" height="460" fill="#faf9f5"/>
  <path d="M60,390 C140,150 220,80 300,120 C360,150 380,180 410,210 C440,240 460,255 520,268 C600,285 690,320 770,390" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M60,390 L770,390 L60,390 Z" fill="#d6e8f0" opacity="0.35"/>
  <line x1="60" y1="390" x2="770" y2="390" stroke="#333" stroke-width="2"/>
  <text x="70" y="60" font-size="15" fill="#1f6f8b">后验密度 p(θ|y) 的高处</text>
  <text x="70" y="82" font-size="14" fill="#333">链在此停留久、样本密</text>
  <text x="300" y="160" font-size="14" fill="#1f6f8b">峰顶（高密度区）</text>
  <line x1="410" y1="205" x2="410" y2="230" stroke="#c0392b" stroke-width="2"/>
  <line x1="470" y1="252" x2="470" y2="275" stroke="#c0392b" stroke-width="2"/>
  <line x1="520" y1="266" x2="520" y2="290" stroke="#c0392b" stroke-width="2"/>
  <line x1="380" y1="185" x2="380" y2="210" stroke="#c0392b" stroke-width="2"/>
  <line x1="350" y1="160" x2="350" y2="185" stroke="#c0392b" stroke-width="2"/>
  <line x1="440" y1="230" x2="440" y2="252" stroke="#c0392b" stroke-width="2"/>
  <line x1="310" y1="130" x2="310" y2="155" stroke="#c0392b" stroke-width="2"/>
  <line x1="600" y1="285" x2="600" y2="308" stroke="#c0392b" stroke-width="2"/>
  <line x1="660" y1="310" x2="660" y2="335" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="345" x2="700" y2="370" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="60" font-size="14" fill="#c0392b">采样点（越靠近峰越密）</text>
  <polyline points="60,390 95,360 130,340 165,320 200,300 235,280 270,260 305,140 340,120 375,180 410,210 445,245 480,258 515,265 550,270 585,280 620,300 655,322 690,345 725,365 760,385 770,390" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="78" y="420" font-size="14" fill="#333">链起点（低密度区）</text>
  <text x="560" y="420" font-size="14" fill="#333">θ 取值 →</text>
</svg>
