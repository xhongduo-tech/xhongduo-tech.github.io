<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <title>五级流水线时序图：数据冒险与转发</title>
  <desc>四条例入流水线的指令在八个时钟周期内的阶段占据情况，突出显示第一条指令的执行阶段与第二条指令的执行阶段之间的数据冒险，以及转发路径。</desc>
  <rect width="720" height="400" fill="#faf9f5"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#333">五级流水线时序（IF · ID · EX · MEM · WB）</text>
  <text x="20" y="48" font-size="13" fill="#666">I1 在 EX 写出 %rbx，I2 下一拍就要读 %rbx —— 数据冒险，用转发解决</text>

  <!-- cycle labels -->
  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="181" y="70">t1</text>
    <text x="243" y="70">t2</text>
    <text x="305" y="70">t3</text>
    <text x="367" y="70">t4</text>
    <text x="429" y="70">t5</text>
    <text x="491" y="70">t6</text>
    <text x="553" y="70">t7</text>
    <text x="615" y="70">t8</text>
  </g>

  <!-- instruction rows -->
  <g font-size="13" fill="#333">
    <text x="10" y="112">I1 addq</text>
    <text x="10" y="170">I2 subq</text>
    <text x="10" y="228">I3 movq</text>
    <text x="10" y="286">I4 imulq</text>
  </g>

  <!-- grid cells -->
  <g font-size="14" text-anchor="middle">
    <!-- I1 row -->
    <rect x="150" y="84" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="181" y="113" fill="#333">IF</text>
    <rect x="212" y="84" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="243" y="113" fill="#333">ID</text>
    <rect x="274" y="84" width="62" height="48" fill="#cfe8ee" stroke="#c0392b" stroke-width="2.5"/><text x="305" y="113" fill="#333">EX</text>
    <rect x="336" y="84" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="367" y="113" fill="#333">MEM</text>
    <rect x="398" y="84" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="429" y="113" fill="#333">WB</text>
    <!-- I2 row -->
    <rect x="150" y="142" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="181" y="171" fill="#999">IF</text>
    <rect x="212" y="142" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="243" y="171" fill="#333">ID</text>
    <rect x="274" y="142" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="305" y="171" fill="#333">EX</text>
    <rect x="336" y="142" width="62" height="48" fill="#cfe8ee" stroke="#c0392b" stroke-width="2.5"/><text x="367" y="171" fill="#333">EX</text>
    <rect x="398" y="142" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="429" y="171" fill="#333">MEM</text>
    <rect x="460" y="142" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="491" y="171" fill="#333">WB</text>
    <!-- I3 row -->
    <rect x="150" y="200" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="181" y="229" fill="#999">IF</text>
    <rect x="212" y="200" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="243" y="229" fill="#999">ID</text>
    <rect x="274" y="200" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="305" y="229" fill="#333">EX</text>
    <rect x="336" y="200" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="367" y="229" fill="#333">MEM</text>
    <rect x="398" y="200" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="429" y="229" fill="#333">WB</text>
    <rect x="460" y="200" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="491" y="229" fill="#999">—</text>
    <rect x="522" y="200" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="553" y="229" fill="#999">—</text>
    <rect x="584" y="200" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="615" y="229" fill="#999">—</text>
    <!-- I4 row -->
    <rect x="150" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="181" y="287" fill="#999">IF</text>
    <rect x="212" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="243" y="287" fill="#999">ID</text>
    <rect x="274" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="305" y="287" fill="#999">EX</text>
    <rect x="336" y="258" width="62" height="48" fill="#eae6de" stroke="#999" stroke-width="1"/><text x="367" y="287" fill="#333">MEM</text>
    <rect x="398" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="429" y="287" fill="#999">—</text>
    <rect x="460" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="491" y="287" fill="#999">—</text>
    <rect x="522" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="553" y="287" fill="#999">—</text>
    <rect x="584" y="258" width="62" height="48" fill="#f6f4ee" stroke="#bbb" stroke-width="1"/><text x="615" y="287" fill="#999">—</text>
  </g>

  <!-- forwarding arrow -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <path d="M 305 134 L 348 143" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="318" y="132" font-size="13" fill="#c0392b">转发（把 EX 输出直接送到下一条 EX 的输入）</text>

  <!-- note -->
  <text x="150" y="330" font-size="13" fill="#666">若没有转发，I2 必须在 ID 阶段多停一拍（插入气泡），整个流水线浪费一个时钟周期。</text>
  <line x1="150" y1="350" x2="646" y2="350" stroke="#ddd" stroke-width="1"/>
  <text x="150" y="372" font-size="13" fill="#333"><tspan fill="#c0392b">■</tspan> 红色 = 数据冒险与转发路径　<tspan fill="#1f6f8b">■</tspan> 青色 = 执行（EX）阶段　<tspan fill="#eae6de">■</tspan> 灰 = 其他阶段　<tspan fill="#f6f4ee">■</tspan> 浅 = 尚未到达</text>
</svg>
