<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CT 值（Hounsfield 单位）刻度条</title>
<desc>一张水平条形图，展示不同组织的 CT 值范围：空气 -1000、脂肪约 -100、水 0、软组织与血液 20-80、钙化大于 100、骨皮质接近 +1000，单位为 Hounsfield 单位（HU）。</desc>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">CT 值刻度（Hounsfield 单位，HU）</text>

<!-- 刻度条主体 -->
<rect x="40" y="60" width="560" height="60" rx="4" fill="#faf9f5" stroke="#333" stroke-width="2"/>
<rect x="40"   y="60" width="252" height="60" rx="4" fill="#e8e6e1"/>
<rect x="292"  y="60" width="28"  height="60" fill="#d8b23a"/>
<rect x="320"  y="60" width="11"  height="60" fill="#4a90c4"/>
<rect x="331"  y="60" width="19"  height="60" fill="#c0392b"/>
<rect x="350"  y="60" width="14"  height="60" fill="#a05050"/>
<rect x="364"  y="60" width="36"  height="60" fill="#8a7a6a"/>
<rect x="400"  y="60" width="200" height="60" rx="4" fill="#f4f2ee"/>

<!-- 刻度线与数值 -->
<g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
<line x1="40"  y1="120" x2="40"  y2="130" stroke="#333" stroke-width="2"/>
<text x="40"  y="148">-1000（空气）</text>
<line x1="320" y1="120" x2="320" y2="130" stroke="#333" stroke-width="2"/>
<text x="320" y="148">0（水）</text>
<line x1="600" y1="120" x2="600" y2="130" stroke="#333" stroke-width="2"/>
<text x="600" y="148">+1000（骨）</text>
</g>

<!-- 标注 -->
<g font-family="sans-serif" font-size="14" fill="#333">
<text x="166" y="168" text-anchor="middle">空气 / 肺</text>
<text x="306" y="168" text-anchor="middle">脂肪</text>
<text x="324" y="168" text-anchor="middle">水</text>
<text x="341" y="168" text-anchor="middle">软组织</text>
<text x="357" y="168" text-anchor="middle">血液</text>
<text x="382" y="168" text-anchor="middle">血肿</text>
<text x="500" y="168" text-anchor="middle">钙化 / 骨</text>
</g>

<text x="320" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">窗宽（WW）决定展示跨度，窗位（WL）决定中心：</text>
<text x="320" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">显示值 = (CT − WL + WW/2) / WW × 255</text>
</svg>
