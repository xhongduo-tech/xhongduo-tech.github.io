<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>T1 纵向弛豫与 T2 横向弛豫曲线</title>
<desc>双坐标系示意图：左图 T1 纵向磁化 Mz 从 0 指数恢复向 M0（M0(1-e^-t/T1)）；右图 T2 横向磁化 Mxy 从 M0 指数衰减向 0（M0 e^-t/T2）。</desc>

<!-- 左图：T1 -->
<text x="150" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">T1 纵向弛豫（恢复）</text>
<g stroke="#333" stroke-width="1.5">
<line x1="50" y1="270" x2="50" y2="40" />
<line x1="50" y1="270" x2="290" y2="270" />
</g>
<text x="40" y="52" font-family="sans-serif" font-size="14" fill="#333">M0</text>
<line x1="50" y1="70"  x2="290" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="38" y="276" font-family="sans-serif" font-size="14" fill="#333">0</text>
<text x="150" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">时间 t</text>
<text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Mz(t) = M0 (1 − e^(−t/T1))</text>

<path d="M 50 270 C 90 266, 130 250, 170 225 C 215 195, 255 150, 290 90"
      fill="none" stroke="#1f6f8b" stroke-width="3"/>
<line x1="50" y1="150" x2="132" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="132" cy="150" r="4" fill="#c0392b"/>
<text x="136" y="146" font-family="sans-serif" font-size="13" fill="#c0392b">t = T1 时恢复约 63%</text>

<!-- 右图：T2 -->
<text x="490" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">T2 横向弛豫（衰减）</text>
<g stroke="#333" stroke-width="1.5">
<line x1="390" y1="270" x2="390" y2="40" />
<line x1="390" y1="270" x2="630" y2="270" />
</g>
<text x="380" y="52" font-family="sans-serif" font-size="14" fill="#333">M0</text>
<line x1="390" y1="70"  x2="630" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="378" y="276" font-family="sans-serif" font-size="14" fill="#333">0</text>
<text x="490" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">时间 t</text>
<text x="490" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Mxy(t) = M0 e^(−t/T2)</text>

<path d="M 390 70 C 410 88, 430 110, 450 132 C 470 156, 520 210, 630 262"
      fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="390" y1="150" x2="470" y2="150" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="470" cy="150" r="4" fill="#1f6f8b"/>
<text x="474" y="146" font-family="sans-serif" font-size="13" fill="#1f6f8b">t = T2 时衰减到约 37%</text>

<text x="320" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">90° 脉冲后，纵向磁化按 T1 恢复、横向磁化按 T2 消逝</text>
</svg>
