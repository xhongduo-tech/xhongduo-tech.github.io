<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190">
  <title>M/M/1 队列的生灭状态转移图</title>
  <desc>以系统内顾客数 n 为状态的连续时间马尔可夫链：任一状态 n 以速率 λ 增到 n+1（生，红色），以速率 μ 减到 n-1（灭，青色）。这是排队论里最经典的一张图。</desc>
  <rect x="0" y="0" width="680" height="190" fill="#faf9f5"/>
  <g text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <circle cx="90" cy="95" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="90" y="100">0</text>
    <circle cx="250" cy="95" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="250" y="100">1</text>
    <circle cx="410" cy="95" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="410" y="100">2</text>
    <circle cx="570" cy="95" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="570" y="100">n</text>
  </g>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <g fill="none" stroke-width="2">
    <path d="M 118 76 C 160 50 200 48 226 66" stroke="#c0392b" marker-end="url(#arrowRed)"/>
    <path d="M 278 76 C 320 50 360 48 386 66" stroke="#c0392b" marker-end="url(#arrowRed)"/>
    <path d="M 438 76 C 480 50 520 48 546 66" stroke="#c0392b" marker-end="url(#arrowRed)"/>
    <path d="M 226 124 C 200 142 160 140 136 118" stroke="#1f6f8b" marker-end="url(#arrowBlue)"/>
    <path d="M 386 124 C 360 142 320 140 296 118" stroke="#1f6f8b" marker-end="url(#arrowBlue)"/>
    <path d="M 546 124 C 520 142 480 140 456 118" stroke="#1f6f8b" marker-end="url(#arrowBlue)"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="16">
    <text x="174" y="62" fill="#c0392b">λ</text>
    <text x="334" y="62" fill="#c0392b">λ</text>
    <text x="494" y="62" fill="#c0392b">λ</text>
    <text x="174" y="156" fill="#1f6f8b">μ</text>
    <text x="334" y="156" fill="#1f6f8b">μ</text>
    <text x="494" y="156" fill="#1f6f8b">μ</text>
  </g>
</svg>
