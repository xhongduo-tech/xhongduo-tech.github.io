<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350">
  <title>k-out-of-n 系统结构（示例 n=4，k=3）</title>
  <desc>输入信号经 n 个并联部件的可靠性单元，再送入表决器：至少 k 个部件输出有效时系统工作。n=4、k=3 表示四中取三。</desc>
  <rect x="0" y="0" width="680" height="350" fill="#faf9f5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <g fill="none" stroke="#333" stroke-width="1.6">
    <path d="M 66 172 L 186 52" marker-end="url(#arr)"/>
    <path d="M 66 172 L 186 122" marker-end="url(#arr)"/>
    <path d="M 66 172 L 186 192" marker-end="url(#arr)"/>
    <path d="M 66 172 L 186 262" marker-end="url(#arr)"/>
    <path d="M 330 52 L 432 166" marker-end="url(#arr)"/>
    <path d="M 330 122 L 432 166" marker-end="url(#arr)"/>
    <path d="M 330 192 L 432 166" marker-end="url(#arr)"/>
    <path d="M 330 262 L 432 166" marker-end="url(#arr)"/>
    <line x1="566" y1="172" x2="616" y2="172" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <circle cx="40" cy="172" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="40" y="177">入</text>
    <rect x="190" y="30" width="140" height="44" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="260" y="56">部件 1</text>
    <rect x="190" y="100" width="140" height="44" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="260" y="126">部件 2</text>
    <rect x="190" y="170" width="140" height="44" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="260" y="196">部件 3</text>
    <rect x="190" y="240" width="140" height="44" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="260" y="266">部件 4</text>
    <rect x="436" y="150" width="130" height="44" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="501" y="168">表决器</text>
    <text x="501" y="184" font-size="12">至少 k=3 个有效</text>
    <circle cx="632" cy="172" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="632" y="177">出</text>
    <text x="160" y="20" font-size="13">n = 4 个并联部件（k-out-of-n，k=3）</text>
  </g>
</svg>
