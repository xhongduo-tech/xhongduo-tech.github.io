<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="sans-serif">
<title>六类硅酸盐结构的硅氧四面体聚合方式</title>
<desc>用三角形示意硅氧四面体（SiO4），顶点为氧、中心为硅；比较岛状、双四面体、环状、单链、双链、架状六种聚合方式及对应的硅氧比。</desc>
<style>
  .tri{fill:#dceaf2;stroke:#1f6f8b;stroke-width:1.8}
  .si{fill:#c0392b}
  .ob{fill:#1f6f8b}
  .lab{fill:#333;font-size:15px;text-anchor:middle}
  .ratio{fill:#666;font-size:13px;text-anchor:middle}
  .ttl{fill:#333;font-size:16px;text-anchor:middle;font-weight:bold}
  .lg{fill:#333;font-size:13px}
</style>

<text x="450" y="28" class="ttl">硅氧四面体的六种聚合方式（顶点 = 氧，中心 = 硅）</text>
<circle cx="700" cy="48" r="4" class="ob"/>
<text x="712" y="53" class="lg">桥氧（共享氧）</text>

<!-- P1 岛状 -->
<g>
  <polygon points="60,115 90,85 120,115" class="tri"/>
  <polygon points="140,115 170,85 200,115" class="tri"/>
  <polygon points="100,140 130,110 160,140" class="tri"/>
  <circle cx="90" cy="105" r="3.5" class="si"/>
  <circle cx="170" cy="105" r="3.5" class="si"/>
  <circle cx="130" cy="130" r="3.5" class="si"/>
  <text x="120" y="165" class="lab">岛状</text>
  <text x="120" y="183" class="ratio">Si:O = 1:4（橄榄石）</text>
</g>

<!-- P2 双四面体 -->
<g>
  <polygon points="300,55 263,95 337,95" class="tri"/>
  <polygon points="300,55 263,140 337,140" class="tri"/>
  <circle cx="300" cy="55" r="4" class="ob"/>
  <circle cx="300" cy="81.7" r="3.5" class="si"/>
  <circle cx="300" cy="111.7" r="3.5" class="si"/>
  <text x="340" y="165" class="lab">双四面体</text>
  <text x="340" y="183" class="ratio">Si:O = 2:7（绿帘石）</text>
</g>

<!-- P3 环状 -->
<g>
  <polygon points="622,90 590,107.3 590,72.7" class="tri"/>
  <polygon points="595,137 590,107.3 560,124.6" class="tri"/>
  <polygon points="522,137 560,124.6 530,107.3" class="tri"/>
  <polygon points="498,90 530,107.3 530,72.7" class="tri"/>
  <polygon points="522,43 530,72.7 560,55.4" class="tri"/>
  <polygon points="595,43 560,55.4 590,72.7" class="tri"/>
  <circle cx="590" cy="107.3" r="3" class="ob"/>
  <circle cx="560" cy="124.6" r="3" class="ob"/>
  <circle cx="530" cy="107.3" r="3" class="ob"/>
  <circle cx="530" cy="72.7" r="3" class="ob"/>
  <circle cx="560" cy="55.4" r="3" class="ob"/>
  <circle cx="590" cy="72.7" r="3" class="ob"/>
  <text x="560" y="165" class="lab">环状</text>
  <text x="560" y="183" class="ratio">Si:O = 1:3（绿柱石）</text>
</g>

<!-- P4 单链 -->
<g>
  <polygon points="60,200 35,250 85,250" class="tri"/>
  <polygon points="110,200 85,250 135,250" class="tri"/>
  <polygon points="160,200 135,250 185,250" class="tri"/>
  <polygon points="210,200 185,250 235,250" class="tri"/>
  <circle cx="85" cy="250" r="3" class="ob"/>
  <circle cx="135" cy="250" r="3" class="ob"/>
  <circle cx="185" cy="250" r="3" class="ob"/>
  <text x="120" y="305" class="lab">单链（辉石）</text>
  <text x="120" y="323" class="ratio">Si:O = 1:3</text>
</g>

<!-- P5 双链 -->
<g>
  <polygon points="300,195 275,245 325,245" class="tri"/>
  <polygon points="350,195 325,245 375,245" class="tri"/>
  <polygon points="400,195 375,245 425,245" class="tri"/>
  <polygon points="450,195 425,245 475,245" class="tri"/>
  <polygon points="300,295 275,245 325,245" class="tri"/>
  <polygon points="350,295 325,245 375,245" class="tri"/>
  <polygon points="400,295 375,245 425,245" class="tri"/>
  <polygon points="450,295 425,245 475,245" class="tri"/>
  <circle cx="300" cy="245" r="3" class="ob"/>
  <circle cx="350" cy="245" r="3" class="ob"/>
  <circle cx="400" cy="245" r="3" class="ob"/>
  <circle cx="450" cy="245" r="3" class="ob"/>
  <text x="340" y="305" class="lab">双链（角闪石）</text>
  <text x="340" y="323" class="ratio">Si:O = 4:11</text>
</g>

<!-- P6 架状 -->
<g>
  <polygon points="605,240 582.5,279 537.5,279 515,240 537.5,201 582.5,201" class="tri" fill="none"/>
  <polygon points="672.5,279 650,318 605,318 582.5,279 605,240 650,240" class="tri" fill="none"/>
  <polygon points="627.5,201 605,240 582.5,201 605,162 650,162 650,201" class="tri" fill="none"/>
  <polygon points="582.5,201 537.5,201 515,240 537.5,279 582.5,279 560,240" class="tri" fill="none"/>
  <polygon points="582.5,123 537.5,123 515,162 537.5,201 582.5,201 560,162" class="tri" fill="none"/>
  <polygon points="492.5,279 470,240 492.5,201 515,201 537.5,240 515,279" class="tri" fill="none"/>
  <polygon points="515,318 492.5,279 515,240 537.5,240 537.5,279 515,318" class="tri" fill="none"/>
  <text x="560" y="305" class="lab">架状（长石 / 石英）</text>
  <text x="560" y="323" class="ratio">Si:O = 1:2</text>
</g>
</svg>
