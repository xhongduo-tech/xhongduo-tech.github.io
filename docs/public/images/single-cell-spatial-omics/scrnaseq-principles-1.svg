<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif">
  <title>单细胞 RNA 测序流程</title>
  <desc>展示从组织解离到生成基因×细胞计数矩阵的 scRNA-seq 四步流程，包括微滴包裹、逆转录加条形码与 UMI、扩增与测序。</desc>
  <rect x="0" y="0" width="900" height="480" fill="#faf9f5"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">单细胞 RNA 测序：从组织到计数矩阵</text>

  <!-- Step 1 组织解离 -->
  <rect x="30" y="80" width="180" height="120" rx="10" fill="#1f6f8b" opacity="0.9"/>
  <text x="120" y="115" text-anchor="middle" font-size="15" fill="#fff">① 单细胞分离</text>
  <text x="120" y="140" text-anchor="middle" font-size="13" fill="#fff">组织解离 → 细胞悬液</text>
  <text x="120" y="160" text-anchor="middle" font-size="13" fill="#fff">FACS / 微滴 / 孔板</text>
  <text x="120" y="182" text-anchor="middle" font-size="13" fill="#fff">（每个细胞被隔开）</text>

  <text x="222" y="140" text-anchor="middle" font-size="20" fill="#c0392b">→</text>

  <!-- Step 2 微滴 + 逆转录 -->
  <rect x="250" y="80" width="200" height="120" rx="10" fill="#1f6f8b"/>
  <text x="350" y="115" text-anchor="middle" font-size="15" fill="#fff">② 逆转录 + 上户口</text>
  <text x="350" y="140" text-anchor="middle" font-size="13" fill="#fff">微珠引物：细胞条形码</text>
  <text x="350" y="160" text-anchor="middle" font-size="13" fill="#fff">＋ UMI ＋ oligo-dT</text>
  <text x="350" y="182" text-anchor="middle" font-size="13" fill="#fff">mRNA → 带标签 cDNA</text>

  <text x="462" y="140" text-anchor="middle" font-size="20" fill="#c0392b">→</text>

  <!-- Step 3 扩增 -->
  <rect x="490" y="80" width="160" height="120" rx="10" fill="#1f6f8b"/>
  <text x="570" y="115" text-anchor="middle" font-size="15" fill="#fff">③ 扩增</text>
  <text x="570" y="140" text-anchor="middle" font-size="13" fill="#fff">PCR 指数扩增</text>
  <text x="570" y="160" text-anchor="middle" font-size="13" fill="#fff">或 IVT 线性扩增</text>
  <text x="570" y="182" text-anchor="middle" font-size="13" fill="#fff">（引入噪声！）</text>

  <text x="662" y="140" text-anchor="middle" font-size="20" fill="#c0392b">→</text>

  <!-- Step 4 测序 -->
  <rect x="690" y="80" width="180" height="120" rx="10" fill="#1f6f8b"/>
  <text x="780" y="115" text-anchor="middle" font-size="15" fill="#fff">④ 测序</text>
  <text x="780" y="140" text-anchor="middle" font-size="13" fill="#fff">读条形码 → 各归其细胞</text>
  <text x="780" y="160" text-anchor="middle" font-size="13" fill="#fff">比对回基因组</text>
  <text x="780" y="182" text-anchor="middle" font-size="13" fill="#fff">UMI 去重 → 分子计数</text>

  <!-- Bottom matrix -->
  <rect x="120" y="280" width="660" height="150" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="308" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">基因 × 细胞 计数矩阵（UMI 去重后）</text>
  <text x="150" y="335" font-size="13" fill="#666">行 = 基因</text>
  <text x="150" y="355" font-size="13" fill="#666">列 = 细胞</text>
  <text x="150" y="375" font-size="13" fill="#666">格 = 该细胞的该基因</text>
  <text x="150" y="395" font-size="13" fill="#666">    分子数（0/1/几十…）</text>
  <rect x="360" y="325" width="400" height="80" rx="6" fill="#eef4f6"/>
  <text x="380" y="352" font-size="14" fill="#333">· 稀疏：大量格为 0（dropout 假零）</text>
  <text x="380" y="374" font-size="14" fill="#333">· 每列是一次「单细胞快照」</text>
  <text x="380" y="396" font-size="14" fill="#333">· 后续聚类 / 轨迹 / 通讯的输入</text>
</svg>
