<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <title>翼型绕流与升力来源示意</title>
  <desc>来流自左向右掠过翼型，上表面流线密集压强低为负压区，下表面流线稀疏压强较高；上下表面压差合成垂直于来流方向的升力。</desc>
  <rect x="0" y="0" width="720" height="420" fill="#faf9f5"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">翼型绕流与升力来源</text>
  <!-- 来流箭头 -->
  <line x1="40" y1="200" x2="120" y2="200" stroke="#1f6f8b" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="72" y="180" text-anchor="middle" font-size="15" fill="#1f6f8b">来流 V∞</text>
  <!-- 上表面流线（密集，负压） -->
  <path d="M 120 150 Q 340 70 600 128" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <path d="M 120 130 Q 340 52 600 110" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 120 170 Q 340 90 600 146" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- 下表面流线（稀疏，正压） -->
  <path d="M 120 250 Q 340 300 600 240" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 120 280 Q 340 320 600 262" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 翼型外形 -->
  <path d="M 150 200 C 210 120 430 120 560 200 C 430 262 210 262 150 200 Z" fill="#8aa9b8" stroke="#333" stroke-width="2.5"/>
  <line x1="150" y1="200" x2="560" y2="200" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="355" y="230" text-anchor="middle" font-size="14" fill="#333">弦线（弦长 c）</text>
  <!-- 负压标注 -->
  <text x="360" y="118" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">上表面：流线密 → 流速大 → 低压（吸力）</text>
  <!-- 正压标注 -->
  <text x="360" y="372" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">下表面：流线疏 → 流速小 → 较高压</text>
  <!-- 升力箭头 -->
  <line x1="360" y1="330" x2="360" y2="70" stroke="#c0392b" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="392" y="210" font-size="16" fill="#c0392b" font-weight="bold">升力 L ⊥ 来流</text>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
