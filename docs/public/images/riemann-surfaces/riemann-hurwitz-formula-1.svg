<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">分歧覆盖的三角剖分：基三角形有两个原像层，分支点处两层粘合</title>
  <desc id="desc">左图为基曲面 Y 上的一个三角形 T 及其分支值顶点 q；右图为覆盖曲面 X 上 T 的两个原像三角形 T1 与 T2，两个分支点原像 p1、p2 在分支值上方粘合，对应分歧指数 e_p = 2。</desc>
  <rect width="460" height="300" fill="#faf9f5"/>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <!-- 左：基曲面 Y -->
    <line x1="50" y1="240" x2="210" y2="240" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="50" y1="240" x2="130" y2="130" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="210" y1="240" x2="130" y2="130" stroke="#1f6f8b" stroke-width="2"/>
    <circle cx="50" cy="240" r="6" fill="#c0392b"/>
    <text x="14" y="262" fill="#c0392b">q（分支值，取为顶点）</text>
    <text x="105" y="275" fill="#333">Y：基三角形 T</text>
    <!-- 右：覆盖曲面 X -->
    <polygon points="290,55 430,55 360,135" fill="#e8f1f4" stroke="#1f6f8b" stroke-width="2"/>
    <polygon points="295,150 435,150 365,230" fill="#f6e9e7" stroke="#1f6f8b" stroke-width="2"/>
    <circle cx="360" cy="135" r="5" fill="#c0392b"/>
    <circle cx="365" cy="230" r="5" fill="#c0392b"/>
    <text x="378" y="140" fill="#c0392b">p₁</text>
    <text x="383" y="235" fill="#c0392b">p₂</text>
    <text x="300" y="120" fill="#333">第 1 层 T₁</text>
    <text x="305" y="215" fill="#333">第 2 层 T₂</text>
    <text x="255" y="265" fill="#333">X：T 的两个原像 T₁、T₂（d = 2）</text>
    <!-- 联系：两层在分支值上方粘合 -->
    <line x1="360" y1="135" x2="365" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="18" y="60" fill="#1f6f8b">f 局部像 ζ ↦ ζ^e_p，e_p = 2</text>
    <!-- 箭头：从基到覆盖 -->
    <line x1="215" y1="190" x2="282" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="216" y="180" fill="#333">f（次数 d）</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
</svg>
