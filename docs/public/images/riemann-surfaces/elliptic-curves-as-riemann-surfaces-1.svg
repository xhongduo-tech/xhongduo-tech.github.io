<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">环面 = 复平面模格：基本平行四边形对边粘合</title>
  <desc id="desc">左图为复平面中的基本平行四边形，顶点 0、ω1、ω2、ω1+ω2，两组对边分别标成相同颜色表示将彼此粘合；右图为粘合后得到的亏格 1 环面（椭圆曲线）。</desc>
  <rect width="460" height="300" fill="#faf9f5"/>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <!-- 左：基本平行四边形 -->
    <polygon points="40,230 180,140 260,170 120,260" fill="#e8f1f4" stroke="#1f6f8b" stroke-width="2"/>
    <circle cx="40" cy="230" r="4" fill="#333"/>
    <text x="22" y="250" fill="#333">0</text>
    <text x="168" y="132" fill="#1f6f8b">ω₁</text>
    <text x="112" y="278" fill="#1f6f8b">ω₂</text>
    <text x="252" y="162" fill="#c0392b">ω₁+ω₂</text>
    <!-- 对边标记：一组红色、一组蓝色 -->
    <line x1="40" y1="230" x2="120" y2="260" stroke="#c0392b" stroke-width="3"/>
    <line x1="180" y1="140" x2="260" y2="170" stroke="#c0392b" stroke-width="3"/>
    <text x="88" y="278" fill="#c0392b">a（同色边粘合）</text>
    <line x1="40" y1="230" x2="180" y2="140" stroke="#1f6f8b" stroke-width="3"/>
    <line x1="120" y1="260" x2="260" y2="170" stroke="#1f6f8b" stroke-width="3"/>
    <text x="14" y="120" fill="#1f6f8b">b（同色边粘合）</text>
    <text x="70" y="300" fill="#333">ℂ/Λ：把对面边粘起来</text>
    <!-- 箭头 -->
    <line x1="292" y1="200" x2="330" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 右：环面示意 -->
    <ellipse cx="395" cy="140" rx="42" ry="70" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <ellipse cx="395" cy="140" rx="58" ry="34" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    <ellipse cx="380" cy="150" rx="18" ry="30" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="358" y="60" fill="#333">粘合后：环面 T² = 椭圆曲线</text>
    <text x="356" y="80" fill="#333">（亏格 1，带群律）</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
</svg>
