<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="14">
  <title>网络效应与锁入效应示意</title>
  <desc>两种技术 A 与 B 的价值随采用者人数变化的曲线。A 起步高但网络效应弱，B 起步低但网络效应强，两线在采用者比例 50% 处相交。社会被锁在 A 上，因为无人能独自跨越临界点。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <g fill="#333" font-size="14">
    <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold">技术采纳的锁入效应</text>
    <text x="70" y="380" font-size="13">0</text>
    <text x="600" y="380" text-anchor="end" font-size="13">采用 B 的人数比例 x（%）</text>
    <text x="30" y="52" font-size="13">价值</text>
  </g>
  <line x1="60" y1="330" x2="620" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="60" y2="40" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="1" opacity="0.6">
    <line x1="60" y1="330" x2="60" y2="330"/>
  </g>
  <text x="54" y="334" font-size="13">0</text>
  <text x="66" y="340" font-size="12">0%</text>
  <text x="600" y="344" font-size="12" text-anchor="end">100%</text>

  <g>
    <line x1="60" y1="242" x2="620" y2="242" stroke="#1f6f8b" stroke-width="3"/>
    <line x1="60" y1="294" x2="600" y2="73" stroke="#c0392b" stroke-width="3"/>
  </g>

  <text x="150" y="228" fill="#1f6f8b" font-size="15">V_A(x) = 40 + 0.3x（现状技术，网络效应弱）</text>
  <text x="420" y="100" fill="#c0392b" font-size="15">V_B(x) = 10 + 0.9x（更优技术，网络效应强）</text>

  <line x1="330" y1="330" x2="330" y2="180" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="170" text-anchor="middle" fill="#333" font-size="14">临界点 x=50</text>

  <circle cx="330" cy="180" r="5" fill="#c0392b"/>

  <g>
    <circle cx="120" cy="262" r="5" fill="#333"/>
    <text x="120" y="308" text-anchor="middle" fill="#333" font-size="14">当前均衡：锁入 A</text>
    <text x="120" y="324" text-anchor="middle" fill="#333" font-size="12">（x&lt;50，选择 A 对每个人都更划算）</text>
  </g>

  <g>
    <rect x="420" y="280" width="190" height="52" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="515" y="300" text-anchor="middle" fill="#c0392b" font-size="14">越过临界点后 B 更优</text>
    <text x="515" y="318" text-anchor="middle" fill="#333" font-size="12">但需要集体协调，无人能单独跨越</text>
  </g>

  <text x="120" y="150" fill="#333" font-size="13">锁入区：个体理性，全局次优</text>
  <line x1="120" y1="156" x2="310" y2="156" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
