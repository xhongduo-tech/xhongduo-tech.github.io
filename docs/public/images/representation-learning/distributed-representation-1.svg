<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <title>局部表示与分布式表示对比</title>
  <desc>左侧：局部表示中每个概念对应一个独立神经元（祖母细胞）；右侧：分布式表示中概念由多个特征维度组合而成，不同概念共享特征。</desc>
  <rect x="0" y="0" width="760" height="400" fill="#faf9f5"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">局部表示 vs 分布式表示</text>

  <!-- 左面板：局部表示 -->
  <text x="190" y="78" text-anchor="middle" font-size="16" fill="#333">局部表示（一概念一神经元）</text>
  <g font-size="14">
    <rect x="40"  y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="115" y="145" text-anchor="middle" fill="#333">轿车</text>
    <rect x="40"  y="110" width="150" height="60" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
    <text x="115" y="145" text-anchor="middle" fill="#faf9f5" font-weight="bold">轿车</text>
    <rect x="40"  y="190" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="115" y="225" text-anchor="middle" fill="#333">卡车</text>
    <rect x="40"  y="270" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="115" y="305" text-anchor="middle" fill="#333">猫</text>
    <rect x="40"  y="350" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="115" y="385" text-anchor="middle" fill="#333">狗</text>
  </g>
  <text x="115" y="300" text-anchor="middle" font-size="13" fill="#666"></text>

  <!-- 中间箭头：轿车被编码为 -->
  <g>
    <line x1="230" y1="130" x2="360" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowL)"/>
    <text x="295" y="110" text-anchor="middle" font-size="13" fill="#333">编码</text>
  </g>

  <!-- 右面板：分布式表示 -->
  <text x="570" y="78" text-anchor="middle" font-size="16" fill="#333">分布式表示（特征组合）</text>
  <g font-size="14">
    <rect x="410" y="110" width="150" height="60" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
    <text x="485" y="145" text-anchor="middle" fill="#faf9f5" font-weight="bold">轮子</text>
    <rect x="410" y="190" width="150" height="60" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
    <text x="485" y="225" text-anchor="middle" fill="#faf9f5" font-weight="bold">引擎</text>
    <rect x="410" y="270" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="485" y="305" text-anchor="middle" fill="#333">四腿</text>
    <rect x="410" y="350" width="150" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="485" y="385" text-anchor="middle" fill="#333">毛发</text>
  </g>
  <text x="620" y="150" text-anchor="start" font-size="13" fill="#666">轿车 = 轮子 + 引擎</text>
  <text x="620" y="175" text-anchor="start" font-size="13" fill="#666">卡车 = 轮子 + 引擎</text>
  <text x="620" y="230" text-anchor="start" font-size="13" fill="#666">（共享相同特征）</text>
  <text x="620" y="305" text-anchor="start" font-size="13" fill="#666">猫 = 四腿 + 毛发</text>
  <text x="620" y="330" text-anchor="start" font-size="13" fill="#666">狗 = 四腿 + 毛发</text>
  <text x="620" y="385" text-anchor="start" font-size="13" fill="#666">（共享相同特征）</text>

  <defs>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
