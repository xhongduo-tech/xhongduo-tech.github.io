<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <title>流形学习假设示意图</title>
  <desc>左侧：高维空间中真实数据聚集在一条低维流形（弯曲带子）附近，噪声落在流形之外；右侧：表示学习把流形展平成平面，两个正交方向分别对应一种独立变化因子。</desc>
  <rect x="0" y="0" width="760" height="400" fill="#faf9f5"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">流形学习假设：数据栖息在低维流形上</text>

  <!-- 左面板：高维空间与流形 -->
  <text x="200" y="76" text-anchor="middle" font-size="15" fill="#333">高维空间 R<superscript>D</superscript>（D 很大）</text>
  <rect x="30" y="100" width="360" height="240" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- 弯曲流形带子 -->
  <path d="M 45 300 C 130 250, 190 260, 260 200 S 330 160, 375 130"
        fill="none" stroke="#1f6f8b" stroke-width="34" stroke-linecap="round" opacity="0.35"/>
  <path d="M 45 300 C 130 250, 190 260, 260 200 S 330 160, 375 130"
        fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 流形上的点 -->
  <g fill="#c0392b">
    <circle cx="80" cy="290" r="5"/>
    <circle cx="140" cy="265" r="5"/>
    <circle cx="210" cy="250" r="5"/>
    <circle cx="285" cy="215" r="5"/>
    <circle cx="340" cy="172" r="5"/>
    <circle cx="360" cy="140" r="5"/>
  </g>
  <!-- 流形外的点（噪声） -->
  <g fill="#999">
    <circle cx="120" cy="180" r="4"/>
    <circle cx="250" cy="150" r="4"/>
    <circle cx="320" cy="300" r="4"/>
  </g>
  <text x="255" y="230" text-anchor="middle" font-size="14" fill="#1f6f8b">低维流形</text>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#999">流形外的点 = 噪声/无效数据</text>

  <!-- 中间箭头 -->
  <g>
    <line x1="420" y1="220" x2="450" y2="220" stroke="#333" stroke-width="2.5" marker-end="url(#arrowR)"/>
    <text x="435" y="205" text-anchor="middle" font-size="13" fill="#333">表示学习</text>
    <text x="435" y="255" text-anchor="middle" font-size="13" fill="#666">把流形展平</text>
  </g>

  <!-- 右面板：展平的表示空间 -->
  <text x="595" y="76" text-anchor="middle" font-size="15" fill="#333">表示空间 R<superscript>d</superscript>（d 很小）</text>
  <rect x="470" y="100" width="260" height="240" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- 网格线 -->
  <g stroke="#e0ddd5" stroke-width="1">
    <line x1="510" y1="100" x2="510" y2="340"/>
    <line x1="550" y1="100" x2="550" y2="340"/>
    <line x1="590" y1="100" x2="590" y2="340"/>
    <line x1="630" y1="100" x2="630" y2="340"/>
    <line x1="670" y1="100" x2="670" y2="340"/>
    <line x1="470" y1="140" x2="730" y2="140"/>
    <line x1="470" y1="180" x2="730" y2="180"/>
    <line x1="470" y1="220" x2="730" y2="220"/>
    <line x1="470" y1="260" x2="730" y2="260"/>
    <line x1="470" y1="300" x2="730" y2="300"/>
  </g>
  <!-- 正交轴 -->
  <line x1="470" y1="340" x2="730" y2="340" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="470" y1="340" x2="470" y2="100" stroke="#1f6f8b" stroke-width="2"/>
  <text x="710" y="360" text-anchor="middle" font-size="14" fill="#1f6f8b">方向 1（因子 A）</text>
  <text x="450" y="105" text-anchor="middle" font-size="14" fill="#1f6f8b" transform="rotate(-90 450 105)">方向 2（因子 B）</text>
  <!-- 网格上的点 -->
  <g fill="#c0392b">
    <circle cx="550" cy="220" r="5"/>
    <circle cx="590" cy="260" r="5"/>
    <circle cx="630" cy="180" r="5"/>
    <circle cx="670" cy="220" r="5"/>
  </g>
  <text x="600" y="130" text-anchor="middle" font-size="13" fill="#666">线性操作（加减、内积）恢复语义</text>

  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
