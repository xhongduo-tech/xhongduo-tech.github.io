<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <title>经济基础与上层建筑：马克思主义的文化模型</title>
  <desc>三层结构模型：底层为经济基础（生产方式，含生产力与生产关系），中层为法律—政治上层建筑（国家、法律、政党），顶层为意识形态形式（文学、艺术、宗教、哲学）；经济基础归根到底决定上层建筑，上层建筑对基础具有相对自主的反作用。阿尔都塞的修正：经济只在「最后关头」起决定作用。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" fill="#333">经济基础与上层建筑：文学的位置</text>

  <rect x="170" y="64" width="300" height="62" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="15" fill="#333">意识形态形式</text>
  <text x="320" y="112" text-anchor="middle" font-size="13" fill="#333">文学 · 艺术 · 宗教 · 哲学</text>

  <rect x="170" y="170" width="300" height="62" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" font-size="15" fill="#333">法律—政治上层建筑</text>
  <text x="320" y="218" text-anchor="middle" font-size="13" fill="#333">国家 · 法律 · 政党</text>

  <rect x="150" y="278" width="340" height="82" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="320" y="304" text-anchor="middle" font-size="16" fill="#c0392b">经济基础：生产方式</text>
  <text x="320" y="328" text-anchor="middle" font-size="13" fill="#333">生产力（人 · 工具 · 技术）</text>
  <text x="320" y="348" text-anchor="middle" font-size="13" fill="#333">生产关系（所有制 · 阶级）</text>

  <line x1="520" y1="278" x2="520" y2="236" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="170" x2="520" y2="130" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="262" font-size="13" fill="#1f6f8b">归根到底</text>
  <text x="532" y="280" font-size="13" fill="#1f6f8b">的决定作用</text>
  <text x="532" y="156" font-size="13" fill="#1f6f8b">决定（相对自主）</text>

  <line x1="110" y1="130" x2="110" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="110" y1="236" x2="110" y2="278" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="40" y="200" font-size="13" fill="#c0392b">反作用</text>
  <text x="40" y="218" font-size="13" fill="#c0392b">（相对自主）</text>

  <rect x="50" y="392" width="540" height="36" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="415" text-anchor="middle" font-size="13" fill="#333">阿尔都塞的修正：经济只在「最后关头」起决定作用；上层建筑（含文学）相对自主</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
