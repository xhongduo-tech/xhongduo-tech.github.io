<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="title desc">
  <title id="title">四冲程内燃机配气正时图</title>
  <desc id="desc">曲轴转两圈（720°）内的气门开闭相位：排气门开 EVO 于做功冲程后段，进气门开 IVO 于排气终了前，排气门关 EVC 于进气初，进气门关 IVC 于压缩冲程初，进气门与排气门在接近上止点处有一小段重叠。</desc>
  <rect width="560" height="480" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- main circle -->
    <circle cx="280" cy="240" r="150" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <!-- TDC / BDC marks -->
    <line x1="280" y1="70" x2="280" y2="100" stroke="#333" stroke-width="1.6"/>
    <line x1="280" y1="380" x2="280" y2="410" stroke="#333" stroke-width="1.6"/>
    <text x="280" y="52" text-anchor="middle">上止点（TDC）</text>
    <text x="280" y="436" text-anchor="middle">下止点（BDC）</text>
    <!-- stroke labels -->
    <text x="430" y="120" fill="#555" font-size="14">做功冲程</text>
    <text x="430" y="350" fill="#555" font-size="14">进气冲程</text>
    <text x="120" y="120" fill="#555" font-size="14">排气冲程</text>
    <text x="120" y="350" fill="#555" font-size="14">压缩冲程</text>
    <!-- exhaust valve open arc (red) r=150 -->
    <path d="M 394.9 331.4 A 150 150 0 1 1 318.8 90.1" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <!-- intake valve open arc (cyan) r=165 -->
    <path d="M 237.3 75.6 A 165 165 0 1 1 144.9 329.7" fill="none" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round"/>
    <!-- event tick marks -->
    <g stroke="#333" stroke-width="1.4">
      <line x1="396" y1="326" x2="418" y2="312"/>
      <line x1="319" y1="95" x2="331" y2="110"/>
      <line x1="236" y1="80" x2="224" y2="94"/>
      <line x1="158" y1="316" x2="138" y2="330"/>
      <line x1="229" y1="99" x2="219" y2="114"/>
    </g>
    <!-- event labels -->
    <text x="426" y="318" fill="#c0392b" font-size="14">EVO 130°（BBDC 50°）</text>
    <text x="428" y="340" fill="#555" font-size="13">排气门开</text>
    <text x="338" y="112" fill="#c0392b" font-size="14">EVC 375°（ATDC 15°）</text>
    <text x="202" y="100" fill="#1f6f8b" font-size="14">IVO 345°（BTDC 15°）</text>
    <text x="102" y="336" fill="#1f6f8b" font-size="14">IVC 595°（ABDC 55°）</text>
    <text x="208" y="134" fill="#333" font-size="14">点火</text>
    <!-- overlap bracket -->
    <line x1="224" y1="70" x2="332" y2="70" stroke="#333" stroke-width="1.2"/>
    <text x="278" y="62" text-anchor="middle" fill="#333" font-size="13">气门重叠角 ≈ 30°</text>
    <!-- rotation arrow -->
    <path d="M 385 105 A 150 150 0 0 1 400 130" fill="none" stroke="#888" stroke-width="1.6"/>
    <polygon points="398,122 409,125 401,134" fill="#888"/>
    <text x="430" y="82" fill="#888" font-size="13">曲轴顺时针旋转（720°）</text>
    <!-- legend -->
    <line x1="60" y1="70" x2="92" y2="70" stroke="#c0392b" stroke-width="5"/>
    <text x="100" y="75" font-size="14">排气门开启期</text>
    <line x1="60" y1="96" x2="92" y2="96" stroke="#1f6f8b" stroke-width="5"/>
    <text x="100" y="101" font-size="14">进气门开启期</text>
    <text x="60" y="130" fill="#555" font-size="13">四冲程两圈共 720°</text>
    <text x="60" y="150" fill="#555" font-size="13">每冲程 180°</text>
  </g>
</svg>
