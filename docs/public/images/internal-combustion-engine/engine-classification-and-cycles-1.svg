<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="title desc">
  <title id="title">奥托循环与狄塞尔循环的 p-V 图对比</title>
  <desc id="desc">同一压缩比下，奥托循环定容加热（竖直线），狄塞尔循环定压加热（水平线），二者均由等熵压缩、等熵膨胀、定容放热构成。</desc>
  <rect width="560" height="420" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- axes -->
    <polyline points="60,360 540,360" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrx)"/>
    <polyline points="60,360 60,30" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arry)"/>
    <text x="510" y="382">体积 V</text>
    <text x="24" y="52">压力 p</text>
    <text x="52" y="383" font-size="13">0</text>
    <!-- Otto cycle (cyan) -->
    <path d="M 470 354 C 380 350, 300 345, 240 338 C 200 332, 165 318, 148 300 C 135 287, 125 270, 120 253 L 120 69 C 130 78, 143 92, 160 108 C 190 136, 235 170, 290 210 C 330 238, 390 280, 440 315 C 455 327, 465 338, 470 344 Z"
          fill="#1f6f8b" fill-opacity="0.08" stroke="#1f6f8b" stroke-width="2.5"/>
    <circle cx="470" cy="354" r="3.5" fill="#1f6f8b"/><text x="482" y="358" fill="#1f6f8b">1</text>
    <circle cx="120" cy="253" r="3.5" fill="#1f6f8b"/><text x="98" y="248" fill="#1f6f8b">2</text>
    <circle cx="120" cy="69" r="3.5" fill="#1f6f8b"/><text x="104" y="60" fill="#1f6f8b">3</text>
    <circle cx="470" cy="344" r="3.5" fill="#1f6f8b"/><text x="482" y="340" fill="#1f6f8b">4</text>
    <!-- Diesel cycle (red) -->
    <path d="M 470 354 C 380 350, 300 345, 240 338 C 200 332, 165 318, 148 300 C 135 287, 125 270, 120 253 L 220 253 C 250 253, 280 268, 310 289 C 350 316, 400 334, 445 344 C 458 348, 466 350, 470 350 Z"
          fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4"/>
    <circle cx="220" cy="253" r="3.5" fill="#c0392b"/><text x="230" y="244" fill="#c0392b">3′</text>
    <circle cx="470" cy="350" r="3.5" fill="#c0392b"/><text x="482" y="352" fill="#c0392b">4′</text>
    <!-- annotations -->
    <line x1="120" y1="69" x2="120" y2="253" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="128" y="160" fill="#1f6f8b" font-size="14" transform="rotate(-90 128 160)">奥托：定容加热</text>
    <line x1="120" y1="253" x2="220" y2="253" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="140" y="242" fill="#c0392b" font-size="14">狄塞尔：定压加热</text>
    <text x="250" y="312" fill="#333" font-size="14">等熵膨胀</text>
    <text x="330" y="160" fill="#333" font-size="14" transform="rotate(90 330 160)">等熵膨胀</text>
    <!-- compression ratio marker -->
    <line x1="470" y1="380" x2="470" y2="368" stroke="#333" stroke-width="1.5"/>
    <line x1="120" y1="380" x2="120" y2="368" stroke="#333" stroke-width="1.5"/>
    <text x="240" y="380" fill="#333" font-size="13" text-anchor="middle">r = V₁/V₂ = V₄/V₂（本图为 8）</text>
    <!-- legend -->
    <line x1="70" y1="52" x2="100" y2="52" stroke="#1f6f8b" stroke-width="2.5"/><text x="106" y="56" font-size="14">奥托循环</text>
    <line x1="70" y1="76" x2="100" y2="76" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4"/><text x="106" y="80" font-size="14">狄塞尔循环</text>
  </g>
  <defs>
    <marker id="arrx" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arry" markerWidth="10" markerHeight="10" refX="3" refY="0" orient="auto" markerUnits="strokeWidth">
      <path d="M0,6 L3,0 L6,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
