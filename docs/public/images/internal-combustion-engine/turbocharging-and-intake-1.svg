<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" role="img" aria-labelledby="title desc">
  <title id="title">涡轮增压器工作原理示意图</title>
  <desc id="desc">高温排气驱动涡轮，涡轮与压气机共用一根轴，压气机压缩进气后经中冷器冷却，再送入气缸进气歧管。</desc>
  <rect width="560" height="390" fill="#faf9f5"/>
  <g font-family="sans-serif" fill="#333" font-size="14">
    <!-- turbine -->
    <circle cx="120" cy="220" r="60" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
    <circle cx="120" cy="220" r="30" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1.4"/>
    <path d="M 90 220 A 30 30 0 0 1 150 220" fill="none" stroke="#c0392b" stroke-width="1.3"/>
    <path d="M 90 220 A 30 30 0 0 0 150 220" fill="none" stroke="#c0392b" stroke-width="1.3"/>
    <text x="120" y="295" text-anchor="middle" font-size="14">涡轮（废气驱动）</text>
    <!-- compressor -->
    <circle cx="440" cy="220" r="60" fill="#fff" stroke="#1f6f8b" stroke-width="2.4"/>
    <circle cx="440" cy="220" r="30" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="1.4"/>
    <path d="M 410 220 A 30 30 0 0 1 470 220" fill="none" stroke="#1f6f8b" stroke-width="1.3"/>
    <path d="M 410 220 A 30 30 0 0 0 470 220" fill="none" stroke="#1f6f8b" stroke-width="1.3"/>
    <text x="440" y="295" text-anchor="middle" font-size="14">压气机（压缩进气）</text>
    <!-- shaft -->
    <line x1="180" y1="220" x2="380" y2="220" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect x="250" y="200" width="60" height="40" fill="#faf9f5" stroke="#333" stroke-width="1.4"/>
    <text x="280" y="224" text-anchor="middle" font-size="13">轴承</text>
    <text x="280" y="150" text-anchor="middle" font-size="14">共用一根轴（涡轮带动压气机）</text>
    <!-- exhaust flow -->
    <polygon points="15,150 60,160 60,148" fill="#c0392b"/>
    <line x1="15" y1="155" x2="60" y2="155" stroke="#c0392b" stroke-width="2"/>
    <text x="15" y="140" fill="#c0392b" font-size="14">高温排气（来自气缸）</text>
    <polygon points="108,300 120,322 132,300" fill="#c0392b"/>
    <line x1="120" y1="280" x2="120" y2="312" stroke="#c0392b" stroke-width="2"/>
    <text x="145" y="312" fill="#c0392b" font-size="14">做功后排气排出</text>
    <!-- air flow -->
    <polygon points="520,160 545,160 545,148" fill="#1f6f8b"/>
    <line x1="500" y1="155" x2="545" y2="155" stroke="#1f6f8b" stroke-width="2"/>
    <text x="440" y="140" text-anchor="end" fill="#1f6f8b" font-size="14">环境空气吸入</text>
    <!-- compressed air to intercooler -->
    <polygon points="440,105 440,80 452,80" fill="#1f6f8b"/>
    <line x1="440" y1="160" x2="440" y2="90" stroke="#1f6f8b" stroke-width="2"/>
    <text x="455" y="185" fill="#1f6f8b" font-size="14">压缩空气（高温）</text>
    <!-- intercooler -->
    <rect x="290" y="30" width="130" height="60" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <line x1="300" y1="45" x2="410" y2="45" stroke="#1f6f8b" stroke-width="1.2"/>
    <line x1="300" y1="60" x2="410" y2="60" stroke="#1f6f8b" stroke-width="1.2"/>
    <line x1="300" y1="75" x2="410" y2="75" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="355" y="20" text-anchor="middle" font-size="14">中冷器（冷却后进气）</text>
    <!-- to engine -->
    <polygon points="200,75 290,75 290,63" fill="#1f6f8b"/>
    <line x1="290" y1="60" x2="200" y2="60" stroke="#1f6f8b" stroke-width="2"/>
    <text x="200" y="48" fill="#1f6f8b" font-size="14">进气歧管 → 气缸</text>
    <!-- energy annotation -->
    <text x="280" y="352" text-anchor="middle" font-size="14" fill="#333">废气膨胀功驱动涡轮，涡轮经轴带动压气机，把新鲜空气「免费」压进气缸</text>
  </g>
</svg>
