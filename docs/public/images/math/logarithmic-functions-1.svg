<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">指数函数与对数函数的反函数关系</title>
<desc id="desc">y=2^x 与 y=log_2 x 的图象关于直线 y=x 对称。指数函数过点 (0,1)、以 x 轴为渐近线；对数函数过点 (1,0)、以 y 轴为渐近线。两曲线关于 y=x 对称。</desc>
<rect width="560" height="440" fill="#faf9f5"/>
<text x="40" y="36" font-family="sans-serif" font-size="15" fill="#333">指数函数 y = 2^x 与对数函数 y = log_2 x 互为反函数</text>

<!-- axes -->
<line x1="100" y1="360" x2="460" y2="360" stroke="#333" stroke-width="1.5"/>
<line x1="100" y1="60" x2="100" y2="420" stroke="#333" stroke-width="1.5"/>
<polygon points="448,355 448,365 462,360" fill="#333"/>
<polygon points="95,72 105,72 100,60" fill="#333"/>
<text x="466" y="354" font-family="sans-serif" font-size="15" fill="#333">x</text>
<text x="106" y="56" font-family="sans-serif" font-size="15" fill="#333">y</text>

<!-- tick labels -->
<text x="138" y="380" font-family="sans-serif" font-size="13" fill="#333">1</text>
<text x="178" y="380" font-family="sans-serif" font-size="13" fill="#333">2</text>
<text x="258" y="380" font-family="sans-serif" font-size="13" fill="#333">4</text>
<text x="418" y="380" font-family="sans-serif" font-size="13" fill="#333">8</text>
<text x="84" y="284" font-family="sans-serif" font-size="13" fill="#333">2</text>
<text x="84" y="204" font-family="sans-serif" font-size="13" fill="#333">4</text>
<text x="84" y="124" font-family="sans-serif" font-size="13" fill="#333">6</text>
<text x="84" y="60" font-family="sans-serif" font-size="13" fill="#333">8</text>

<!-- symmetry line y = x (dashed) -->
<line x1="100" y1="360" x2="400" y2="60" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="300" y="238" font-family="sans-serif" font-size="13" fill="#999" transform="rotate(-45 300 238)">y = x（对称轴）</text>

<!-- y = 2^x (red) -->
<polyline points="60,340 80,331.7 100,320 120,303.4 140,280 160,246.9 180,200 200,133.7 220,40" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="100" cy="320" r="4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="30" y="312" font-family="sans-serif" font-size="14" fill="#c0392b">y = 2^x</text>

<!-- y = log_2 x (cyan) -->
<polyline points="120,389.5 124,380.6 132,372.9 140,360 160,336.6 180,320 220,296.6 260,280 340,256.6 420,240" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<circle cx="140" cy="360" r="4" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="424" y="232" font-family="sans-serif" font-size="14" fill="#1f6f8b">y = log_2 x</text>

<!-- key points -->
<text x="108" y="310" font-family="sans-serif" font-size="13" fill="#333">(0, 1)</text>
<text x="146" y="354" font-family="sans-serif" font-size="13" fill="#333">(1, 0)</text>

<!-- asymptote labels -->
<text x="330" y="384" font-family="sans-serif" font-size="13" fill="#888">x 轴：指数函数的渐近线</text>
<text x="22" y="96" font-family="sans-serif" font-size="13" fill="#888">y 轴：对数函数的渐近线</text>

<!-- legend note -->
<text x="280" y="416" font-family="sans-serif" font-size="13" fill="#333">两曲线关于直线 y = x 对称，故互为反函数</text>
</svg>
