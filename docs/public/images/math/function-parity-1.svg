<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">偶函数与奇函数的对称性</title>
<desc id="desc">左图：偶函数 y=x^2 的图象关于 y 轴对称，点 A(1,1) 与 A'(-1,1) 互为镜像。右图：奇函数 y=x^3 的图象关于原点对称，点 B(1,1) 与 B'(-1,-1) 关于原点中心对称。</desc>
<rect width="560" height="320" fill="#faf9f5"/>
<text x="52" y="42" font-family="sans-serif" font-size="15" fill="#333">偶函数 y = x²：图象关于 y 轴对称</text>
<text x="318" y="42" font-family="sans-serif" font-size="15" fill="#333">奇函数 y = x³：图象关于原点对称</text>

<!-- Panel A axes -->
<line x1="20" y1="190" x2="262" y2="190" stroke="#333" stroke-width="1.5"/>
<line x1="140" y1="60" x2="140" y2="300" stroke="#333" stroke-width="1.5"/>
<polygon points="250,185 250,195 264,190" fill="#333"/>
<polygon points="135,73 145,73 140,60" fill="#333"/>
<text x="266" y="184" font-family="sans-serif" font-size="15" fill="#333">x</text>
<text x="124" y="58" font-family="sans-serif" font-size="15" fill="#333">y</text>
<text x="108" y="82" font-family="sans-serif" font-size="15" fill="#c0392b">对称轴</text>

<!-- Panel A parabola y = x^2 -->
<polyline points="24.5,75.3 35.5,96.1 46.5,114.9 57.5,131.5 68.5,146.1 79.5,158.5 90.5,168.9 101.5,177.3 112.5,183.5 123.5,187.7 134.5,189.7 145.5,189.7 156.5,187.7 167.5,183.5 178.5,177.3 189.5,168.9 200.5,158.5 211.5,146.1 222.5,131.5 233.5,114.9 244.5,96.1 255.5,75.3" fill="none" stroke="#333" stroke-width="2.5"/>
<line x1="85" y1="164" x2="195" y2="164" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="85" cy="164" r="4" fill="#c0392b"/>
<circle cx="195" cy="164" r="4" fill="#c0392b"/>
<text x="62" y="146" font-family="sans-serif" font-size="14" fill="#c0392b">A′(−1, 1)</text>
<text x="182" y="146" font-family="sans-serif" font-size="14" fill="#c0392b">A(1, 1)</text>

<!-- Panel B axes -->
<line x1="290" y1="190" x2="540" y2="190" stroke="#333" stroke-width="1.5"/>
<line x1="410" y1="60" x2="410" y2="300" stroke="#333" stroke-width="1.5"/>
<polygon points="528,185 528,195 542,190" fill="#333"/>
<polygon points="405,73 415,73 410,60" fill="#333"/>
<text x="544" y="184" font-family="sans-serif" font-size="15" fill="#333">x</text>
<text x="394" y="58" font-family="sans-serif" font-size="15" fill="#333">y</text>
<text x="418" y="222" font-family="sans-serif" font-size="15" fill="#c0392b">对称中心</text>

<!-- Panel B cubic y = x^3 -->
<polyline points="324.75,286.8 335.75,254 346.75,229.5 357.75,212.3 368.75,201 379.75,194.3 390.75,191.1 401.75,190.1 412.75,190 423.75,189.6 434.75,187.6 445.75,182.9 456.75,174 467.75,159.9 478.75,139.2 489.75,110.7 495.25,93.3" fill="none" stroke="#333" stroke-width="2.5"/>
<line x1="355" y1="216" x2="465" y2="164" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="355" cy="216" r="4" fill="#c0392b"/>
<circle cx="465" cy="164" r="4" fill="#c0392b"/>
<text x="330" y="234" font-family="sans-serif" font-size="14" fill="#c0392b">B′(−1, −1)</text>
<text x="466" y="152" font-family="sans-serif" font-size="14" fill="#c0392b">B(1, 1)</text>
</svg>
