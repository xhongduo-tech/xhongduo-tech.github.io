<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">五个常用幂函数的图象</title>
<desc id="desc">幂函数 y=x、y=x^2、y=x^3、y=x^(1/2)、y=x^(-1) 的图象。五条曲线都过点 (1,1)。α&gt;0 时在第一象限递增，α&lt;0 时递减；在 (0,1) 内指数越小值越大，在 (1,+∞) 内指数越大增长越快。</desc>
<rect width="560" height="420" fill="#faf9f5"/>
<text x="40" y="36" font-family="sans-serif" font-size="15" fill="#333">幂函数 y = x^α（α = 1, 2, 3, ½, −1）的图象</text>

<!-- axes -->
<line x1="130" y1="340" x2="430" y2="340" stroke="#333" stroke-width="1.5"/>
<line x1="280" y1="60" x2="280" y2="410" stroke="#333" stroke-width="1.5"/>
<polygon points="418,335 418,345 432,340" fill="#333"/>
<polygon points="275,72 285,72 280,60" fill="#333"/>
<text x="436" y="334" font-family="sans-serif" font-size="15" fill="#333">x</text>
<text x="286" y="58" font-family="sans-serif" font-size="15" fill="#333">y</text>
<line x1="355" y1="336" x2="355" y2="344" stroke="#333" stroke-width="1.5"/>
<line x1="276" y1="312" x2="284" y2="312" stroke="#333" stroke-width="1.5"/>
<text x="352" y="360" font-family="sans-serif" font-size="15" fill="#333">1</text>
<text x="264" y="316" font-family="sans-serif" font-size="15" fill="#333">1</text>

<!-- y = x  (thin black) -->
<line x1="130" y1="396" x2="430" y2="284" stroke="#333" stroke-width="1.5"/>

<!-- y = x^2  (cyan) -->
<polyline points="130,228 148.75,254.25 167.5,277 186.25,296.25 205,312 223.75,324.25 242.5,333 261.25,338.25 280,340 298.75,338.25 317.5,333 336.25,324.25 355,312 373.75,296.25 392.5,277 411.25,254.25 430,228" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>

<!-- y = x^3  (red) -->
<polyline points="182.5,401.5 204.25,368.85 226,350.45 247.75,342.23 269.5,340.08 291.25,339.9 313,337.6 334.75,329.1 356.5,310.3 378.25,277.1 400,225.3" fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- y = sqrt(x)  (black, with markers) -->
<polyline points="280,340 298.75,326 317.5,320.2 336.25,315.75 355,312 373.75,308.7 392.5,305.7 411.25,302.96 430,300.4 448.75,298 467.5,295.7 486.25,293.6 505,291.5" fill="none" stroke="#333" stroke-width="2.5"/>
<circle cx="317.5" cy="320.2" r="2.5" fill="#333"/>
<circle cx="355" cy="312" r="2.5" fill="#333"/>
<circle cx="392.5" cy="305.7" r="2.5" fill="#333"/>
<circle cx="430" cy="300.4" r="2.5" fill="#333"/>
<circle cx="467.5" cy="295.7" r="2.5" fill="#333"/>

<!-- y = 1/x  (red dashed) -->
<polyline points="130,354 167.5,358.7 205,368 223.75,377.3 235,386.7 242.5,396 246.25,402.2" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4"/>
<polyline points="313.75,277.8 317.5,284 325,293.3 336.25,302.7 355,312 373.75,317.6 392.5,321.3 411.25,324 430,326" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4"/>

<!-- common point (1,1) -->
<circle cx="355" cy="312" r="4.5" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="366" y="304" font-family="sans-serif" font-size="14" fill="#c0392b">(1, 1)</text>

<!-- legend -->
<rect x="414" y="38" width="132" height="136" rx="4" fill="#faf9f5" stroke="#c9c2b2" stroke-width="1"/>
<line x1="422" y1="54" x2="450" y2="54" stroke="#333" stroke-width="1.5"/>
<text x="456" y="58" font-family="sans-serif" font-size="14" fill="#333">y = x</text>
<line x1="422" y1="80" x2="450" y2="80" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="456" y="84" font-family="sans-serif" font-size="14" fill="#333">y = x²</text>
<line x1="422" y1="106" x2="450" y2="106" stroke="#c0392b" stroke-width="2.5"/>
<text x="456" y="110" font-family="sans-serif" font-size="14" fill="#333">y = x³</text>
<line x1="422" y1="132" x2="442" y2="132" stroke="#333" stroke-width="2.5"/>
<circle cx="444" cy="132" r="2.5" fill="#333"/>
<text x="456" y="136" font-family="sans-serif" font-size="14" fill="#333">y = √x</text>
<line x1="422" y1="158" x2="450" y2="158" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="456" y="162" font-family="sans-serif" font-size="14" fill="#333">y = 1/x</text>
</svg>
