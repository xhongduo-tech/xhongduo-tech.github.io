<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">从单位圆展开正弦曲线</title>
  <desc id="desc">单位圆上角 α 的终边交点 P 的纵坐标 sin α，被搬运到右侧平面，描出 y = sin x 的正弦曲线。</desc>
  <rect width="720" height="300" fill="#faf9f5"/>
  <!-- 左面板：单位圆 -->
  <line x1="40" y1="150" x2="250" y2="150" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="30" x2="140" y2="270" stroke="#333" stroke-width="1.5"/>
  <circle cx="140" cy="150" r="70" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="150" x2="185" y2="96.4" stroke="#333" stroke-width="2"/>
  <path d="M 156 150 A 16 16 0 0 1 150.3 137.7" fill="none" stroke="#888" stroke-width="1"/>
  <text x="160" y="140" font-family="sans-serif" font-size="14" fill="#333">α</text>
  <line x1="185" y1="96.4" x2="185" y2="150" stroke="#c0392b" stroke-width="3"/>
  <circle cx="185" cy="96.4" r="4" fill="#333"/>
  <text x="192" y="118" font-family="sans-serif" font-size="15" fill="#c0392b">sin α</text>
  <text x="146" y="166" font-family="sans-serif" font-size="14" fill="#333">O</text>
  <text x="244" y="166" font-family="sans-serif" font-size="14" fill="#333">x</text>
  <text x="146" y="32" font-family="sans-serif" font-size="14" fill="#333">y</text>
  <text x="128" y="78" font-family="sans-serif" font-size="14" fill="#333">1</text>
  <text x="96" y="24" font-family="sans-serif" font-size="15" fill="#333">单位圆</text>
  <!-- 虚线投影 -->
  <line x1="185" y1="96.4" x2="338.3" y2="96.4" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- 右面板：坐标轴 -->
  <line x1="280" y1="80" x2="280" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="280" y1="150" x2="700" y2="150" stroke="#333" stroke-width="1.5"/>
  <!-- 正弦曲线 -->
  <polyline points="280,150 315,115 350,89.4 385,80 420,89.4 455,115 490,150 525,185 560,210.6 595,220 630,210.6 665,185 700,150" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <!-- 余弦曲线（虚线，表示正弦左移 π/2） -->
  <polyline points="280,80 315,89.4 350,115 385,150 420,185 455,210.6 490,220 525,210.6 560,185 595,150 630,115 665,89.4 700,80" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,5"/>
  <circle cx="338.3" cy="96.4" r="3.5" fill="#c0392b"/>
  <!-- 右面板刻度 -->
  <text x="276" y="164" font-family="sans-serif" font-size="14" fill="#333">O</text>
  <text x="373" y="164" font-family="sans-serif" font-size="14" fill="#333">π/2</text>
  <text x="483" y="164" font-family="sans-serif" font-size="14" fill="#333">π</text>
  <text x="583" y="164" font-family="sans-serif" font-size="14" fill="#333">3π/2</text>
  <text x="688" y="164" font-family="sans-serif" font-size="14" fill="#333">2π</text>
  <text x="266" y="86" font-family="sans-serif" font-size="14" fill="#333">1</text>
  <text x="262" y="226" font-family="sans-serif" font-size="14" fill="#333">-1</text>
  <text x="420" y="28" font-family="sans-serif" font-size="15" fill="#333">正弦曲线 y = sin x</text>
  <text x="560" y="120" font-family="sans-serif" font-size="13" fill="#888">余弦（虚线）</text>
</svg>
