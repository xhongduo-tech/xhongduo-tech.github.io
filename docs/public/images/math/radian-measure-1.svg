<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">弧度定义：弧长等于半径的圆心角为 1 弧度</title>
  <desc id="desc">单位圆上，从 A 到 B 的弧长等于半径 r，所对的圆心角为 1 弧度。</desc>
  <rect width="420" height="320" fill="#faf9f5"/>
  <circle cx="210" cy="170" r="110" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="210" y1="170" x2="320" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="210" y1="170" x2="269" y2="77" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 320 170 A 110 110 0 0 0 269 77" fill="none" stroke="#1f6f8b" stroke-width="4"/>
  <line x1="210" y1="170" x2="245" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="245" y="156" font-family="sans-serif" font-size="14" fill="#333">1 rad</text>
  <text x="272" y="188" font-family="sans-serif" font-size="16" fill="#c0392b">r</text>
  <text x="296" y="108" font-family="sans-serif" font-size="15" fill="#1f6f8b">弧长 = r</text>
  <text x="192" y="192" font-family="sans-serif" font-size="14" fill="#333">O</text>
  <text x="324" y="158" font-family="sans-serif" font-size="14" fill="#333">A</text>
  <text x="252" y="66" font-family="sans-serif" font-size="14" fill="#333">B</text>
</svg>
