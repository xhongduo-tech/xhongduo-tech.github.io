<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <title>Faustmann 土地期望值随轮伐期变化</title>
  <desc>LEV 随轮伐期先升后降，峰值对应经济最优轮伐期；单次轮伐净现值则单调趋平，两线对比显示机会成本使最优轮伐期提前</desc>
  <rect width="900" height="560" fill="#faf9f5"/>
  <line x1="90" y1="480" x2="860" y2="480" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="480" x2="90" y2="60" stroke="#333" stroke-width="2"/>
  <text x="450" y="535" text-anchor="middle" fill="#333" font-size="16">林龄 / 轮伐期（年）</text>
  <text x="30" y="270" text-anchor="middle" fill="#333" font-size="16" transform="rotate(-90 30 270)">每公顷现值（元）</text>
  <line x1="90" y1="478" x2="860" y2="478" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="800" y="470" text-anchor="end" fill="#999" font-size="13">LEV = 0（盈亏平衡）</text>
  <g fill="#ccc">
    <line x1="240" y1="480" x2="240" y2="60" stroke="#eee" stroke-width="1"/>
    <line x1="390" y1="480" x2="390" y2="60" stroke="#eee" stroke-width="1"/>
    <line x1="540" y1="480" x2="540" y2="60" stroke="#eee" stroke-width="1"/>
    <line x1="690" y1="480" x2="690" y2="60" stroke="#eee" stroke-width="1"/>
    <text x="240" y="500" text-anchor="middle" fill="#666" font-size="13">20</text>
    <text x="390" y="500" text-anchor="middle" fill="#666" font-size="13">40</text>
    <text x="540" y="500" text-anchor="middle" fill="#666" font-size="13">60</text>
    <text x="690" y="500" text-anchor="middle" fill="#666" font-size="13">80</text>
    <text x="840" y="500" text-anchor="middle" fill="#666" font-size="13">100</text>
  </g>
  <text x="180" y="250" text-anchor="middle" fill="#666" font-size="13">轮伐过短：生长未完成</text>
  <text x="790" y="240" text-anchor="middle" fill="#666" font-size="13">轮伐过长：资金与土地闲置</text>
  <path d="M 165 500 C 200 495 225 485 255 478 C 300 455 350 380 390 300 C 435 215 480 160 540 105 C 560 92 575 84 585 84 C 620 92 660 120 690 140 C 740 168 800 200 840 225" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 165 495 C 210 480 260 472 315 470 C 370 440 430 370 465 290 C 495 250 520 238 540 235 C 600 220 680 210 765 205 C 790 204 820 200 840 198" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="585" cy="84" r="6" fill="#c0392b"/>
  <line x1="585" y1="84" x2="585" y2="480" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="585" y="70" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">最优轮伐期 t*</text>
  <text x="700" y="190" text-anchor="middle" fill="#c0392b" font-size="15" font-weight="bold">LEV(r)：土地期望值</text>
  <text x="700" y="250" text-anchor="middle" fill="#666" font-size="15">单次轮伐净现值</text>
  <text x="620" y="230" text-anchor="middle" fill="#c0392b" font-size="14">随轮伐期先升后降</text>
</svg>
