<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="sans-serif">
  <title>火三角</title>
  <desc>可燃物、热、氧气三要素同时具备，燃烧才能发生与维持；去掉任一角，火即熄灭</desc>
  <rect width="900" height="540" fill="#faf9f5"/>
  <circle cx="450" cy="190" r="150" fill="#c0392b" opacity="0.28"/>
  <circle cx="300" cy="390" r="150" fill="#1f6f8b" opacity="0.28"/>
  <circle cx="600" cy="390" r="150" fill="#c0392b" opacity="0.28"/>
  <circle cx="450" cy="320" r="52" fill="#333"/>
  <text x="450" y="318" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">燃烧</text>
  <text x="450" y="341" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">火灾</text>
  <text x="450" y="150" text-anchor="middle" fill="#333" font-size="21" font-weight="bold">可燃物</text>
  <text x="300" y="425" text-anchor="middle" fill="#333" font-size="21" font-weight="bold">热</text>
  <text x="600" y="425" text-anchor="middle" fill="#333" font-size="21" font-weight="bold">氧气</text>
  <text x="450" y="256" text-anchor="middle" fill="#333" font-size="15">燃料管理与隔离带</text>
  <text x="318" y="292" text-anchor="middle" fill="#333" font-size="15">降温 · 扑救</text>
  <text x="582" y="292" text-anchor="middle" fill="#333" font-size="15">覆盖 · 防火剂</text>
</svg>
