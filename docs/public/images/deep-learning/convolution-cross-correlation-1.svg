<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
  <title>二维互相关运算</title>
  <desc>左侧 3×3 输入矩阵，中间 2×2 卷积核，右侧 2×2 输出；高亮的 2×2 窗口与核逐元素相乘求和得到输出第一个元素 37。</desc>
  <rect width="640" height="300" fill="#faf9f5" />
  <text x="100" y="24" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">输入（3×3）</text>
  <text x="280" y="24" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">核（2×2）</text>
  <text x="480" y="24" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">输出（2×2）</text>

  <!-- 输入网格 3×3，每个单元 40×40 -->
  <g stroke="#333" stroke-width="1">
    <rect x="40" y="40" width="120" height="120" fill="none" />
    <line x1="80" y1="40" x2="80" y2="160" />
    <line x1="120" y1="40" x2="120" y2="160" />
    <line x1="40" y1="80" x2="160" y2="80" />
    <line x1="40" y1="120" x2="160" y2="120" />
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">
    <text x="60" y="60">1</text><text x="100" y="60">2</text><text x="140" y="60">3</text>
    <text x="60" y="100">4</text><text x="100" y="100">5</text><text x="140" y="100">6</text>
    <text x="60" y="140">7</text><text x="100" y="140">8</text><text x="140" y="140">9</text>
  </g>

  <!-- 高亮左上 2×2 窗口 -->
  <rect x="40" y="40" width="80" height="80" fill="none" stroke="#1f6f8b" stroke-width="3" />

  <!-- 核 2×2 -->
  <g stroke="#333" stroke-width="1">
    <rect x="240" y="40" width="80" height="80" fill="none" />
    <line x1="280" y1="40" x2="280" y2="120" />
    <line x1="240" y1="80" x2="320" y2="80" />
  </g>
  <g font-size="16" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">
    <text x="260" y="60">1</text><text x="300" y="60">2</text>
    <text x="260" y="100">3</text><text x="300" y="100">4</text>
  </g>

  <!-- 输出 2×2 -->
  <g stroke="#333" stroke-width="1">
    <rect x="440" y="40" width="80" height="80" fill="none" />
    <line x1="480" y1="40" x2="480" y2="120" />
    <line x1="440" y1="80" x2="520" y2="80" />
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">
    <text x="460" y="60">37</text><text x="500" y="60">47</text>
    <text x="460" y="100">67</text><text x="500" y="100">77</text>
  </g>

  <!-- 窗口与核的元素乘 -->
  <g font-size="13" fill="#1f6f8b">
    <text x="180" y="70">1×1 + 2×2</text>
    <text x="180" y="88">+ 4×3 + 5×4</text>
    <text x="180" y="106">= 37</text>
  </g>
  <path d="M 160 60 C 200 60, 210 60, 240 60" stroke="#1f6f8b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 325 60 C 370 60, 380 60, 440 60" stroke="#1f6f8b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6f8b" />
    </marker>
  </defs>

  <!-- 滑动窗口的第二个位置：向右移一列 -->
  <rect x="80" y="40" width="80" height="80" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" />
  <text x="120" y="200" font-size="13" fill="#c0392b" text-anchor="middle">核向右滑一列</text>
  <text x="120" y="218" font-size="13" fill="#c0392b" text-anchor="middle">得到输出第 2 个元素</text>

  <!-- 底部公式 -->
  <text x="320" y="268" font-size="14" fill="#333" text-anchor="middle">输出(i,j) = Σ 窗口元素 ⊙ 核元素（逐元素相乘再求和）</text>
</svg>
