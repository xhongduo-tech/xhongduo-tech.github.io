<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>奇异值分解的几何意义</title>
<desc>单位圆被矩阵 A 作用后映射成椭圆：右奇异向量 v1、v2 是输入侧的正交方向，左奇异向量 u1、u2 是椭圆两个半轴的方向，半轴长即奇异值。A = U D V^T 即「旋转—伸缩—旋转」。</desc>
<rect x="0" y="0" width="700" height="350" fill="#faf9f5"/>
<defs>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>
</defs>

<text x="160" y="30" text-anchor="middle" font-size="15" fill="#333">单位圆与右奇异向量</text>
<circle cx="160" cy="185" r="85" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="160" y1="185" x2="224" y2="148" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="234" y="140" font-size="14" fill="#1f6f8b">v₁</text>
<line x1="160" y1="185" x2="123" y2="121" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="106" y="114" font-size="14" fill="#1f6f8b">v₂</text>

<line x1="285" y1="185" x2="392" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arrow-dark)"/>
<text x="338" y="170" text-anchor="middle" font-size="14" fill="#333">A = U D Vᵀ</text>

<text x="545" y="30" text-anchor="middle" font-size="15" fill="#333">A 作用后的椭圆</text>
<ellipse cx="545" cy="185" rx="144.5" ry="42.5" transform="rotate(-30 545 185)" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="545" y1="185" x2="670" y2="113" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="650" y="100" font-size="14" fill="#c0392b">σ₁u₁</text>
<line x1="545" y1="185" x2="524" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="492" y="134" font-size="14" fill="#c0392b">σ₂u₂</text>

<text x="545" y="320" text-anchor="middle" font-size="13" fill="#333">半轴长 = 奇异值：σ₁ = 1.7，σ₂ = 0.5</text>
</svg>
