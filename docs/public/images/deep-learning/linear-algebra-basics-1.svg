<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="sans-serif">
<title>张量的阶数与形状：从标量到三阶张量</title>
<desc>用四个面板分别示意 0 阶标量、1 阶向量、2 阶矩阵与 3 阶张量的几何形状，并标注各自的轴数与形状记号。</desc>
<rect x="0" y="0" width="880" height="620" fill="#faf9f5"/>
<text x="440" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">张量的阶数与形状</text>
<text x="440" y="64" text-anchor="middle" font-size="14" fill="#666">阶数 = 轴的个数；形状是一个 tuple，依次列出每个轴的大小</text>
<line x1="440" y1="80" x2="440" y2="600" stroke="#eee" stroke-width="1.5"/>
<line x1="20" y1="300" x2="860" y2="300" stroke="#eee" stroke-width="1.5"/>

<!-- ========== 面板 A：0 阶 标量 ========== -->
<text x="60" y="102" font-size="18" font-weight="bold" fill="#c0392b">0 阶 · 标量 scalar</text>
<rect x="130" y="150" width="110" height="80" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="185" y="202" text-anchor="middle" font-size="34" fill="#333">7</text>
<text x="60" y="262" font-size="15" fill="#333">单个数字：<tspan font-weight="bold">x ∈ ℝ</tspan></text>
<text x="60" y="284" font-size="15" fill="#333">NumPy 形状 <tspan font-family="monospace">()</tspan>，轴数 0</text>

<!-- ========== 面板 B：1 阶 向量 ========== -->
<text x="500" y="102" font-size="18" font-weight="bold" fill="#1f6f8b">1 阶 · 向量 vector</text>
<rect x="580" y="130" width="46" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="603" y="158" text-anchor="middle" font-size="18" fill="#333">1</text>
<rect x="580" y="174" width="46" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="603" y="202" text-anchor="middle" font-size="18" fill="#333">2</text>
<rect x="580" y="218" width="46" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="603" y="246" text-anchor="middle" font-size="18" fill="#333">3</text>
<text x="500" y="262" font-size="15" fill="#333">一列有序数：<tspan font-weight="bold">x ∈ ℝ<tspan baseline-shift="super" font-size="11">3</tspan></tspan></text>
<text x="500" y="284" font-size="15" fill="#333">行向量 = 列向量的转置 x<tspan baseline-shift="super" font-size="11">⊤</tspan></text>

<!-- ========== 面板 C：2 阶 矩阵 ========== -->
<text x="60" y="330" font-size="18" font-weight="bold" fill="#c0392b">2 阶 · 矩阵 matrix</text>
<rect x="90" y="360" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="110" y="388" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">11</tspan></text>
<rect x="140" y="360" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="160" y="388" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">12</tspan></text>
<rect x="190" y="360" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="210" y="388" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">13</tspan></text>
<rect x="90" y="410" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="110" y="438" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">21</tspan></text>
<rect x="140" y="410" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="160" y="438" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">22</tspan></text>
<rect x="190" y="410" width="40" height="40" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
<text x="210" y="438" text-anchor="middle" font-size="16" fill="#333">a<tspan baseline-shift="sub" font-size="11">23</tspan></text>
<text x="60" y="480" font-size="15" fill="#333">矩形数表：<tspan font-weight="bold">A ∈ ℝ<tspan baseline-shift="super" font-size="11">m×n</tspan></tspan>，共 m 行 n 列</text>
<text x="60" y="502" font-size="15" fill="#333">元素 A<tspan baseline-shift="sub" font-size="11">ij</tspan>：第 i 行、第 j 列</text>

<!-- ========== 面板 D：3 阶 张量 ========== -->
<text x="500" y="330" font-size="18" font-weight="bold" fill="#1f6f8b">3 阶 · 张量 tensor</text>
<!-- 后层网格（最远） -->
<g stroke="#1f6f8b" stroke-width="1.5" fill="none" stroke-opacity="0.3">
  <rect x="596" y="348" width="76" height="76"/>
  <line x1="622" y1="348" x2="622" y2="424"/>
  <line x1="648" y1="348" x2="648" y2="424"/>
  <line x1="596" y1="374" x2="672" y2="374"/>
  <line x1="596" y1="400" x2="672" y2="400"/>
</g>
<!-- 中间层网格 -->
<g stroke="#1f6f8b" stroke-width="1.5" fill="none" stroke-opacity="0.55">
  <rect x="578" y="364" width="76" height="76"/>
  <line x1="604" y1="364" x2="604" y2="440"/>
  <line x1="630" y1="364" x2="630" y2="440"/>
  <line x1="578" y1="390" x2="654" y2="390"/>
  <line x1="578" y1="416" x2="654" y2="416"/>
</g>
<!-- 前层网格（最近） -->
<g>
  <rect x="560" y="380" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="572" y="397" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="586" y="380" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="598" y="397" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="612" y="380" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="624" y="397" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="560" y="406" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="572" y="423" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="586" y="406" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="598" y="423" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="612" y="406" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="624" y="423" text-anchor="middle" font-size="14" fill="#333">6</text>
  <rect x="560" y="432" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="572" y="449" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="586" y="432" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="598" y="449" text-anchor="middle" font-size="14" fill="#333">8</text>
  <rect x="612" y="432" width="24" height="24" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="624" y="449" text-anchor="middle" font-size="14" fill="#333">9</text>
</g>
<!-- 深度箭头 -->
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
  </marker>
</defs>
<line x1="672" y1="424" x2="644" y2="452" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="680" y="436" font-size="14" fill="#333">深度（第 3 轴）</text>
<text x="500" y="480" font-size="15" fill="#333">多个矩阵沿深度堆叠：如一张 3 通道图片 (3, H, W)</text>
<text x="500" y="502" font-size="15" fill="#333">NumPy 形状 (n<tspan baseline-shift="sub" font-size="11">1</tspan>, n<tspan baseline-shift="sub" font-size="11">2</tspan>, n<tspan baseline-shift="sub" font-size="11">3</tspan>)，轴数 3</text>
</svg>
