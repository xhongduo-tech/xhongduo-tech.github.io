<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="sans-serif">
  <title>Roofline 模型：可达性能天花板曲线</title>
  <desc>横轴为算术强度（FLOPs/byte，对数坐标），纵轴为可达性能（TFLOPs，对数坐标）。内存带宽斜线与算力峰值水平线组成 L 形天花板，交点为 ridge point（约 295 FLOPs/byte），左侧为内存瓶颈区，右侧为计算瓶颈区，三个示例 kernel 标注在图上。</desc>
  <rect width="900" height="640" fill="#faf9f5"/>
  <text x="440" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Roofline 模型（H100，FP16 张量核，教学近似）</text>

  <!-- 绘图区坐标轴 -->
  <line x1="90" y1="540" x2="790" y2="540" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="90" y2="540" stroke="#333" stroke-width="1.5"/>

  <!-- x 轴刻度 -->
  <line x1="90" y1="536" x2="90" y2="544" stroke="#333" stroke-width="1"/>
  <text x="90" y="562" text-anchor="middle" font-size="13" fill="#333">0.1</text>
  <line x1="228" y1="536" x2="228" y2="544" stroke="#333" stroke-width="1"/>
  <text x="228" y="562" text-anchor="middle" font-size="13" fill="#333">1</text>
  <line x1="366" y1="536" x2="366" y2="544" stroke="#333" stroke-width="1"/>
  <text x="366" y="562" text-anchor="middle" font-size="13" fill="#333">10</text>
  <line x1="504" y1="536" x2="504" y2="544" stroke="#333" stroke-width="1"/>
  <text x="504" y="562" text-anchor="middle" font-size="13" fill="#333">100</text>
  <line x1="642" y1="536" x2="642" y2="544" stroke="#333" stroke-width="1"/>
  <text x="642" y="562" text-anchor="middle" font-size="13" fill="#333">1000</text>
  <line x1="780" y1="536" x2="780" y2="544" stroke="#333" stroke-width="1"/>
  <text x="780" y="562" text-anchor="middle" font-size="13" fill="#333">10000</text>
  <text x="440" y="596" text-anchor="middle" font-size="15" fill="#333">算术强度 I = W / B（FLOPs / byte，对数坐标）</text>

  <!-- y 轴刻度 -->
  <line x1="86" y1="540" x2="94" y2="540" stroke="#333" stroke-width="1"/>
  <text x="80" y="544" text-anchor="end" font-size="13" fill="#333">0.1</text>
  <line x1="86" y1="420" x2="94" y2="420" stroke="#333" stroke-width="1"/>
  <text x="80" y="424" text-anchor="end" font-size="13" fill="#333">1</text>
  <line x1="86" y1="300" x2="94" y2="300" stroke="#333" stroke-width="1"/>
  <text x="80" y="304" text-anchor="end" font-size="13" fill="#333">10</text>
  <line x1="86" y1="180" x2="94" y2="180" stroke="#333" stroke-width="1"/>
  <text x="80" y="184" text-anchor="end" font-size="13" fill="#333">100</text>
  <line x1="86" y1="60" x2="94" y2="60" stroke="#333" stroke-width="1"/>
  <text x="80" y="64" text-anchor="end" font-size="13" fill="#333">1000</text>
  <text x="64" y="300" text-anchor="middle" font-size="15" fill="#333" transform="rotate(-90 64 300)">可达性能（TFLOPs，对数）</text>

  <!-- 内存瓶颈斜线：可达 = 带宽 × I（斜率即带宽），从 (90,477) 到 ridge (569,61) -->
  <line x1="90" y1="477" x2="569" y2="61" stroke="#c0392b" stroke-width="3"/>
  <text x="330" y="430" font-size="13" fill="#c0392b">可达 = 带宽 × I</text>

  <!-- 计算瓶颈水平线：可达 = 峰值算力 -->
  <line x1="569" y1="61" x2="780" y2="61" stroke="#1f6f8b" stroke-width="3"/>
  <text x="660" y="50" text-anchor="middle" font-size="13" fill="#1f6f8b">可达 = 峰值算力 ≈ 989 TFLOPs</text>

  <!-- ridge 虚线 -->
  <line x1="569" y1="61" x2="569" y2="540" stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="575" y="470" font-size="13" fill="#666">ridge point ≈ 295</text>

  <!-- 区域标注 -->
  <text x="210" y="110" font-size="15" font-weight="bold" fill="#c0392b">内存瓶颈区</text>
  <text x="210" y="130" font-size="13" fill="#666">减 B 才有效</text>
  <text x="650" y="200" font-size="15" font-weight="bold" fill="#1f6f8b">计算瓶颈区</text>
  <text x="650" y="220" font-size="13" fill="#666">减 W / 提算力才有效</text>

  <!-- 示例点：逐元素 -->
  <circle cx="145" cy="429" r="5" fill="#c0392b"/>
  <text x="145" y="458" text-anchor="middle" font-size="13" fill="#c0392b">逐元素 I ≈ 0.25</text>
  <!-- 示例点：注意力 QKᵀ -->
  <circle cx="519" cy="104" r="5" fill="#c0392b"/>
  <text x="507" y="90" text-anchor="end" font-size="13" fill="#c0392b">注意力 QKᵀ I ≈ 128</text>
  <!-- 示例点：大矩阵乘 -->
  <circle cx="702" cy="61" r="5" fill="#1f6f8b"/>
  <text x="702" y="86" text-anchor="middle" font-size="13" fill="#1f6f8b">大矩阵乘 I ≈ 2731</text>
</svg>
