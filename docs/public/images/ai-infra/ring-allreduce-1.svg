<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <title>Ring AllReduce 的环形拓扑与分块示意（P=4）</title>
  <desc>四个节点组成环形，每节点把 N 字节数据切成 4 块。第一圈 scatter-reduce 沿环做 3 步、边传边归约把分块压小；第二圈 allgather 把归约后的分块沿环扩散，3 步后人人持有完整归约结果。每节点发出 2(P-1)/P·N 字节。</desc>
  <rect width="900" height="560" fill="#faf9f5"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Ring AllReduce 的环形拓扑（P = 4）</text>

  <!-- 四个节点 -->
  <rect x="380" y="50" width="140" height="95" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">节点 P0</text>

  <rect x="700" y="210" width="140" height="95" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="770" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">节点 P1</text>

  <rect x="380" y="380" width="140" height="95" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">节点 P2</text>

  <rect x="60" y="210" width="140" height="95" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">节点 P3</text>

  <!-- 每个节点内的 4 个分块（各 N/4） -->
  <rect x="388" y="98" width="26" height="30" fill="#c0392b"/>
  <rect x="420" y="98" width="26" height="30" fill="#1f6f8b"/>
  <rect x="452" y="98" width="26" height="30" fill="#d4956a"/>
  <rect x="484" y="98" width="26" height="30" fill="#7f8c8d"/>

  <rect x="708" y="258" width="26" height="30" fill="#c0392b"/>
  <rect x="740" y="258" width="26" height="30" fill="#1f6f8b"/>
  <rect x="772" y="258" width="26" height="30" fill="#d4956a"/>
  <rect x="804" y="258" width="26" height="30" fill="#7f8c8d"/>

  <rect x="388" y="428" width="26" height="30" fill="#c0392b"/>
  <rect x="420" y="428" width="26" height="30" fill="#1f6f8b"/>
  <rect x="452" y="428" width="26" height="30" fill="#d4956a"/>
  <rect x="484" y="428" width="26" height="30" fill="#7f8c8d"/>

  <rect x="68" y="258" width="26" height="30" fill="#c0392b"/>
  <rect x="100" y="258" width="26" height="30" fill="#1f6f8b"/>
  <rect x="132" y="258" width="26" height="30" fill="#d4956a"/>
  <rect x="164" y="258" width="26" height="30" fill="#7f8c8d"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 环形箭头：P0→P1→P2→P3→P0 -->
  <line x1="522" y1="100" x2="698" y2="238" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="762" y1="305" x2="522" y2="393" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="425" x2="202" y2="302" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="208" x2="383" y2="54" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="175" font-size="14" fill="#666">沿环方向：每步向前传 1 块（N/P）</text>

  <!-- 分块颜色图例 -->
  <rect x="240" y="470" width="18" height="18" fill="#c0392b"/>
  <text x="262" y="484" font-size="13" fill="#333">分块0</text>
  <rect x="330" y="470" width="18" height="18" fill="#1f6f8b"/>
  <text x="352" y="484" font-size="13" fill="#333">分块1</text>
  <rect x="420" y="470" width="18" height="18" fill="#d4956a"/>
  <text x="442" y="484" font-size="13" fill="#333">分块2</text>
  <rect x="510" y="470" width="18" height="18" fill="#7f8c8d"/>
  <text x="532" y="484" font-size="13" fill="#333">分块3</text>

  <!-- 说明文字 -->
  <text x="440" y="508" text-anchor="middle" font-size="14" fill="#333">第 1 圈 scatter-reduce：沿环转 P−1=3 步，边传边归约，分块被「压小」</text>
  <text x="440" y="530" text-anchor="middle" font-size="14" fill="#333">第 2 圈 allgather：归约后的分块沿环扩散，3 步后人人持有完整结果</text>
  <text x="440" y="552" text-anchor="middle" font-size="14" fill="#c0392b">每节点发出 2(P−1)/P · N = 1.5N 字节（P=4），与节点数基本无关</text>
</svg>
