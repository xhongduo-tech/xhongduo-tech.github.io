<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="sans-serif">
  <title>传统 TCP 路径与 RDMA 路径的数据搬运动画（示意）</title>
  <desc>左：传统 TCP 路径中数据要经历四次拷贝并多次穿越内核态；右：RDMA 路径中注册内存与网卡直接 DMA 交互，内核被旁路，实现零拷贝。</desc>
  <rect width="880" height="480" fill="#faf9f5"/>

  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- ===== 左：传统 TCP 路径 ===== -->
  <rect x="10" y="20" width="420" height="445" fill="#fdfcf8" stroke="#ccc"/>
  <text x="220" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">传统 TCP 路径</text>
  <text x="220" y="66" text-anchor="middle" font-size="13" fill="#c0392b">4 次拷贝 · 多次系统调用与上下文切换</text>

  <!-- 进程 A -->
  <rect x="50" y="95" width="170" height="46" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="123" text-anchor="middle" font-size="14" fill="#333">进程 A（用户态）</text>

  <!-- 内核态 -->
  <rect x="50" y="185" width="170" height="155" fill="#ece7dc" stroke="#333" stroke-width="1.5"/>
  <text x="62" y="206" font-size="13" font-weight="bold" fill="#333">内核态</text>
  <text x="135" y="236" text-anchor="middle" font-size="13" fill="#333">Socket 缓冲</text>
  <text x="135" y="262" text-anchor="middle" font-size="13" fill="#333">TCP/IP 协议栈</text>
  <text x="135" y="288" text-anchor="middle" font-size="13" fill="#333">（重组 / 校验 / 分片）</text>
  <text x="135" y="318" text-anchor="middle" font-size="12" fill="#888">上下文切换 ×N</text>

  <!-- NIC A -->
  <rect x="50" y="385" width="170" height="40" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="410" text-anchor="middle" font-size="14" fill="#333">NIC</text>

  <!-- 网线 -->
  <line x1="220" y1="405" x2="640" y2="405" stroke="#999" stroke-width="2.5"/>
  <text x="430" y="398" text-anchor="middle" font-size="13" fill="#666">以太网 / 网络</text>

  <!-- 拷贝箭头：红色 -->
  <line x1="135" y1="141" x2="135" y2="183" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="146" y="166" font-size="12" fill="#c0392b">① 拷贝</text>
  <line x1="135" y1="340" x2="135" y2="383" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="146" y="365" font-size="12" fill="#c0392b">② 拷贝/DMA</text>

  <!-- NIC B -->
  <rect x="700" y="385" width="170" height="40" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="785" y="410" text-anchor="middle" font-size="14" fill="#333">NIC</text>

  <!-- 内核态右 -->
  <rect x="700" y="185" width="170" height="155" fill="#ece7dc" stroke="#333" stroke-width="1.5"/>
  <text x="712" y="206" font-size="13" font-weight="bold" fill="#333">内核态</text>
  <text x="785" y="236" text-anchor="middle" font-size="13" fill="#333">Socket 缓冲</text>
  <text x="785" y="262" text-anchor="middle" font-size="13" fill="#333">TCP/IP 协议栈</text>
  <text x="785" y="318" text-anchor="middle" font-size="12" fill="#888">上下文切换 ×N</text>

  <!-- 进程 B -->
  <rect x="700" y="95" width="170" height="46" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="785" y="123" text-anchor="middle" font-size="14" fill="#333">进程 B（用户态）</text>

  <!-- 拷贝箭头右：红色 -->
  <line x1="785" y1="383" x2="785" y2="340" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="796" y="365" font-size="12" fill="#c0392b">③ DMA/拷贝</text>
  <line x1="785" y1="183" x2="785" y2="141" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="796" y="166" font-size="12" fill="#c0392b">④ 拷贝</text>

  <!-- ===== 右：RDMA 路径 ===== -->
  <rect x="450" y="20" width="420" height="445" fill="#fdfcf8" stroke="#1f6f8b"/>
  <text x="660" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">RDMA 路径</text>
  <text x="660" y="66" text-anchor="middle" font-size="13" fill="#1f6f8b">内核旁路 · 零拷贝 · 网卡卸载</text>

  <!-- 进程 A 注册内存 -->
  <rect x="480" y="95" width="180" height="46" fill="#e6f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="570" y="123" text-anchor="middle" font-size="14" fill="#333">进程 A · 注册内存（MR）</text>

  <!-- 内核被旁路（虚线框） -->
  <rect x="480" y="185" width="180" height="155" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="482" y1="338" x2="658" y2="187" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="266" text-anchor="middle" font-size="13" fill="#888">内核被旁路</text>
  <text x="570" y="288" text-anchor="middle" font-size="12" fill="#888">（无协议栈、无拷贝）</text>

  <!-- RNIC A -->
  <rect x="480" y="385" width="180" height="40" fill="#e6f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="570" y="410" text-anchor="middle" font-size="14" fill="#333">RNIC（RDMA 网卡）</text>

  <!-- RNIC B -->
  <rect x="700" y="385" width="170" height="40" fill="#e6f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="785" y="410" text-anchor="middle" font-size="14" fill="#333">RNIC</text>

  <!-- 网线右 -->
  <line x1="660" y1="405" x2="700" y2="405" stroke="#999" stroke-width="2.5"/>
  <text x="680" y="438" text-anchor="middle" font-size="12" fill="#666">IB / RoCE</text>

  <!-- 内核被旁路（右虚线框） -->
  <rect x="700" y="185" width="170" height="155" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="702" y1="338" x2="868" y2="187" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785" y="266" text-anchor="middle" font-size="13" fill="#888">内核被旁路</text>

  <!-- 进程 B 注册内存 -->
  <rect x="700" y="95" width="170" height="46" fill="#e6f0f3" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="785" y="123" text-anchor="middle" font-size="14" fill="#333">进程 B · 注册内存（MR）</text>

  <!-- DMA 双向箭头：青色 -->
  <line x1="570" y1="141" x2="570" y2="383" stroke="#1f6f8b" stroke-width="2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="586" y="268" font-size="12" fill="#1f6f8b">DMA 直读直写</text>
  <line x1="785" y1="141" x2="785" y2="383" stroke="#1f6f8b" stroke-width="2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="801" y="268" font-size="12" fill="#1f6f8b">DMA 直读直写</text>

  <!-- 底部说明 -->
  <text x="440" y="472" text-anchor="middle" font-size="14" fill="#333">左：数据在用户态与内核态之间反复搬运（4 次拷贝、多次切换）；右：注册内存与网卡直接 DMA，CPU/GPU 不参与数据面。</text>
</svg>
