<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">一个流式多处理器（SM）的内部结构示意</title>
  <desc id="desc">一个 SM 的内部结构示意（以 A100 为例）。顶部是 4 个 Warp 调度器（红色），每周期各发射一条指令；其下是「指令分发」条带；中间是 4 个分区（P0-P3），每个分区内含一批 FP32/INT32 核心（浅灰小方块）、一个 LD/ST 单元、一个 Tensor Core（青蓝）；底部是贯穿全 SM 的寄存器堆（米色，64K×32-bit=256KB）与 Shared Memory/L1（青蓝，最高 164KB）。图下方示意数据流：L2/HBM 全局内存 → Shared Memory → 寄存器 → 计算单元；指令流：Warp 调度器 → 各分区。图中比例为示意，非精确实测。</desc>

  <rect x="0" y="0" width="960" height="600" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="480" y="34" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">一个流式多处理器（SM）的内部结构（示意，以 A100 为例）</text>

  <!-- ============ SM 卡片 ============ -->
  <rect x="40" y="52" width="880" height="452" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
  <text x="60" y="80" font-size="17" font-weight="bold" fill="#333">流式多处理器（SM）</text>
  <text x="60" y="100" font-size="13" fill="#777">A100：108 个 SM · 每 SM 最多驻留 2048 线程 / 64 warp</text>

  <!-- Warp 调度器行 -->
  <rect x="60" y="112" width="200" height="46" rx="6" fill="#f8e0da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="132" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Warp 调度器 S0</text>
  <text x="160" y="150" font-size="13" fill="#333" text-anchor="middle">每周期发射 1 条指令</text>

  <rect x="275" y="112" width="200" height="46" rx="6" fill="#f8e0da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="132" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Warp 调度器 S1</text>
  <text x="375" y="150" font-size="13" fill="#333" text-anchor="middle">每周期发射 1 条指令</text>

  <rect x="490" y="112" width="200" height="46" rx="6" fill="#f8e0da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="590" y="132" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Warp 调度器 S2</text>
  <text x="590" y="150" font-size="13" fill="#333" text-anchor="middle">每周期发射 1 条指令</text>

  <rect x="705" y="112" width="200" height="46" rx="6" fill="#f8e0da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="805" y="132" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Warp 调度器 S3</text>
  <text x="805" y="150" font-size="13" fill="#333" text-anchor="middle">每周期发射 1 条指令</text>

  <!-- 指令分发条带 -->
  <rect x="60" y="168" width="845" height="26" rx="4" fill="#efeae2" stroke="#999" stroke-width="1"/>
  <text x="482" y="186" font-size="13" fill="#333" text-anchor="middle">指令分发（每周期向每个分区发射一条 warp 指令）</text>

  <!-- 分区 P0-P3 -->
  <g>
    <!-- P0 -->
    <rect x="60" y="204" width="200" height="196" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="160" y="226" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">分区 P0</text>
    <!-- 核心网格 4x4 -->
    <g fill="#e7e2d9" stroke="#777" stroke-width="1">
      <rect x="80" y="236" width="18" height="18" rx="2"/><rect x="104" y="236" width="18" height="18" rx="2"/><rect x="128" y="236" width="18" height="18" rx="2"/><rect x="152" y="236" width="18" height="18" rx="2"/>
      <rect x="80" y="258" width="18" height="18" rx="2"/><rect x="104" y="258" width="18" height="18" rx="2"/><rect x="128" y="258" width="18" height="18" rx="2"/><rect x="152" y="258" width="18" height="18" rx="2"/>
      <rect x="80" y="280" width="18" height="18" rx="2"/><rect x="104" y="280" width="18" height="18" rx="2"/><rect x="128" y="280" width="18" height="18" rx="2"/><rect x="152" y="280" width="18" height="18" rx="2"/>
      <rect x="80" y="302" width="18" height="18" rx="2"/><rect x="104" y="302" width="18" height="18" rx="2"/><rect x="128" y="302" width="18" height="18" rx="2"/><rect x="152" y="302" width="18" height="18" rx="2"/>
    </g>
    <text x="160" y="334" font-size="13" fill="#333" text-anchor="middle">FP32 / INT32 核心</text>
    <rect x="80" y="344" width="160" height="24" rx="4" fill="#e7e2d9" stroke="#777" stroke-width="1"/>
    <text x="160" y="361" font-size="13" fill="#333" text-anchor="middle">LD/ST 单元</text>
    <rect x="80" y="372" width="160" height="22" rx="4" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="160" y="388" font-size="13" fill="#1f6f8b" text-anchor="middle">Tensor Core</text>

    <!-- P1 -->
    <rect x="275" y="204" width="200" height="196" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="375" y="226" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">分区 P1</text>
    <g fill="#e7e2d9" stroke="#777" stroke-width="1">
      <rect x="295" y="236" width="18" height="18" rx="2"/><rect x="319" y="236" width="18" height="18" rx="2"/><rect x="343" y="236" width="18" height="18" rx="2"/><rect x="367" y="236" width="18" height="18" rx="2"/>
      <rect x="295" y="258" width="18" height="18" rx="2"/><rect x="319" y="258" width="18" height="18" rx="2"/><rect x="343" y="258" width="18" height="18" rx="2"/><rect x="367" y="258" width="18" height="18" rx="2"/>
      <rect x="295" y="280" width="18" height="18" rx="2"/><rect x="319" y="280" width="18" height="18" rx="2"/><rect x="343" y="280" width="18" height="18" rx="2"/><rect x="367" y="280" width="18" height="18" rx="2"/>
      <rect x="295" y="302" width="18" height="18" rx="2"/><rect x="319" y="302" width="18" height="18" rx="2"/><rect x="343" y="302" width="18" height="18" rx="2"/><rect x="367" y="302" width="18" height="18" rx="2"/>
    </g>
    <text x="375" y="334" font-size="13" fill="#333" text-anchor="middle">FP32 / INT32 核心</text>
    <rect x="295" y="344" width="160" height="24" rx="4" fill="#e7e2d9" stroke="#777" stroke-width="1"/>
    <text x="375" y="361" font-size="13" fill="#333" text-anchor="middle">LD/ST 单元</text>
    <rect x="295" y="372" width="160" height="22" rx="4" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="375" y="388" font-size="13" fill="#1f6f8b" text-anchor="middle">Tensor Core</text>

    <!-- P2 -->
    <rect x="490" y="204" width="200" height="196" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="590" y="226" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">分区 P2</text>
    <g fill="#e7e2d9" stroke="#777" stroke-width="1">
      <rect x="510" y="236" width="18" height="18" rx="2"/><rect x="534" y="236" width="18" height="18" rx="2"/><rect x="558" y="236" width="18" height="18" rx="2"/><rect x="582" y="236" width="18" height="18" rx="2"/>
      <rect x="510" y="258" width="18" height="18" rx="2"/><rect x="534" y="258" width="18" height="18" rx="2"/><rect x="558" y="258" width="18" height="18" rx="2"/><rect x="582" y="258" width="18" height="18" rx="2"/>
      <rect x="510" y="280" width="18" height="18" rx="2"/><rect x="534" y="280" width="18" height="18" rx="2"/><rect x="558" y="280" width="18" height="18" rx="2"/><rect x="582" y="280" width="18" height="18" rx="2"/>
      <rect x="510" y="302" width="18" height="18" rx="2"/><rect x="534" y="302" width="18" height="18" rx="2"/><rect x="558" y="302" width="18" height="18" rx="2"/><rect x="582" y="302" width="18" height="18" rx="2"/>
    </g>
    <text x="590" y="334" font-size="13" fill="#333" text-anchor="middle">FP32 / INT32 核心</text>
    <rect x="510" y="344" width="160" height="24" rx="4" fill="#e7e2d9" stroke="#777" stroke-width="1"/>
    <text x="590" y="361" font-size="13" fill="#333" text-anchor="middle">LD/ST 单元</text>
    <rect x="510" y="372" width="160" height="22" rx="4" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="590" y="388" font-size="13" fill="#1f6f8b" text-anchor="middle">Tensor Core</text>

    <!-- P3 -->
    <rect x="705" y="204" width="200" height="196" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="805" y="226" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">分区 P3</text>
    <g fill="#e7e2d9" stroke="#777" stroke-width="1">
      <rect x="725" y="236" width="18" height="18" rx="2"/><rect x="749" y="236" width="18" height="18" rx="2"/><rect x="773" y="236" width="18" height="18" rx="2"/><rect x="797" y="236" width="18" height="18" rx="2"/>
      <rect x="725" y="258" width="18" height="18" rx="2"/><rect x="749" y="258" width="18" height="18" rx="2"/><rect x="773" y="258" width="18" height="18" rx="2"/><rect x="797" y="258" width="18" height="18" rx="2"/>
      <rect x="725" y="280" width="18" height="18" rx="2"/><rect x="749" y="280" width="18" height="18" rx="2"/><rect x="773" y="280" width="18" height="18" rx="2"/><rect x="797" y="280" width="18" height="18" rx="2"/>
      <rect x="725" y="302" width="18" height="18" rx="2"/><rect x="749" y="302" width="18" height="18" rx="2"/><rect x="773" y="302" width="18" height="18" rx="2"/><rect x="797" y="302" width="18" height="18" rx="2"/>
    </g>
    <text x="805" y="334" font-size="13" fill="#333" text-anchor="middle">FP32 / INT32 核心</text>
    <rect x="725" y="344" width="160" height="24" rx="4" fill="#e7e2d9" stroke="#777" stroke-width="1"/>
    <text x="805" y="361" font-size="13" fill="#333" text-anchor="middle">LD/ST 单元</text>
    <rect x="725" y="372" width="160" height="22" rx="4" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="805" y="388" font-size="13" fill="#1f6f8b" text-anchor="middle">Tensor Core</text>
  </g>

  <!-- 寄存器堆 -->
  <rect x="60" y="410" width="845" height="40" rx="6" fill="#f6e7c8" stroke="#a87f2c" stroke-width="1.4"/>
  <text x="482" y="428" font-size="14" font-weight="bold" fill="#7a5a1e" text-anchor="middle">寄存器堆（Register File）：64K × 32-bit = 256 KB</text>
  <text x="482" y="445" font-size="13" fill="#7a5a1e" text-anchor="middle">全部线程的私有寄存器，按 4 分区组织，供所有分区共享</text>

  <!-- Shared Memory / L1 -->
  <rect x="60" y="458" width="845" height="32" rx="6" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.4"/>
  <text x="482" y="479" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">Shared Memory / L1：A100 最高 164 KB（与 L1 缓存共享同一块 SRAM，可按需配比）</text>

  <!-- 数据流说明 -->
  <rect x="60" y="520" width="845" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="482" y="540" font-size="14" fill="#333" text-anchor="middle">数据流：全局内存 / L2 → Shared Memory → 寄存器 → 计算单元</text>
  <text x="482" y="556" font-size="13" fill="#777" text-anchor="middle">指令流：Warp 调度器 → 指令分发 → 各分区（核心 / Tensor Core / LD·ST）</text>

  <!-- 图例 -->
  <rect x="60" y="572" width="16" height="16" rx="3" fill="#f8e0da" stroke="#c0392b" stroke-width="1.2"/>
  <text x="82" y="585" font-size="13" fill="#333">调度器 / 控制</text>
  <rect x="190" y="572" width="16" height="16" rx="3" fill="#e7e2d9" stroke="#777" stroke-width="1.2"/>
  <text x="212" y="585" font-size="13" fill="#333">通用计算单元（FP32/INT32）</text>
  <rect x="380" y="572" width="16" height="16" rx="3" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="402" y="585" font-size="13" fill="#333">Tensor Core / 存储</text>
  <rect x="530" y="572" width="16" height="16" rx="3" fill="#f6e7c8" stroke="#a87f2c" stroke-width="1.2"/>
  <text x="552" y="585" font-size="13" fill="#333">寄存器堆</text>
</svg>
