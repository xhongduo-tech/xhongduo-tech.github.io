<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <title>单棵二叉树的带宽瓶颈与双二叉树（DBT）的互补结构</title>
  <desc>左图：单棵二叉树，数据沿叶子上浮归约到根再下沉广播，根链路单点瓶颈、叶子只发不收，一半链路闲置。右图：双二叉树由两棵互补的树组成，A 的根在 B 中是叶子、B 的根在 A 中是叶子，数据切成块分走两棵树并行推进，全部链路都被利用。</desc>
  <rect width="900" height="560" fill="#faf9f5"/>

  <!-- 左面板标题 -->
  <text x="215" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">单棵二叉树：带宽瓶颈</text>

  <!-- 左面板：树，根在上 -->
  <circle cx="215" cy="90" r="20" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="215" y="95" text-anchor="middle" font-size="14" fill="#333">根</text>

  <circle cx="130" cy="170" r="18" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="175" text-anchor="middle" font-size="13" fill="#333">内</text>
  <circle cx="300" cy="170" r="18" fill="#f2ead9" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="175" text-anchor="middle" font-size="13" fill="#333">内</text>

  <circle cx="60" cy="255" r="18" fill="#e8e4da" stroke="#333" stroke-width="1.2"/>
  <text x="60" y="260" text-anchor="middle" font-size="12" fill="#333">叶</text>
  <circle cx="200" cy="255" r="18" fill="#e8e4da" stroke="#333" stroke-width="1.2"/>
  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#333">叶</text>
  <circle cx="280" cy="255" r="18" fill="#e8e4da" stroke="#333" stroke-width="1.2"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">叶</text>
  <circle cx="390" cy="255" r="18" fill="#e8e4da" stroke="#333" stroke-width="1.2"/>
  <text x="390" y="260" text-anchor="middle" font-size="12" fill="#333">叶</text>

  <!-- 边：正常 -->
  <line x1="215" y1="108" x2="136" y2="154" stroke="#333" stroke-width="1.5"/>
  <line x1="215" y1="108" x2="294" y2="154" stroke="#333" stroke-width="1.5"/>
  <line x1="130" y1="188" x2="68" y2="238" stroke="#333" stroke-width="1.2"/>
  <line x1="130" y1="188" x2="192" y2="238" stroke="#333" stroke-width="1.2"/>
  <line x1="300" y1="188" x2="288" y2="238" stroke="#333" stroke-width="1.2"/>
  <line x1="300" y1="188" x2="382" y2="238" stroke="#333" stroke-width="1.2"/>

  <!-- 根瓶颈高亮 -->
  <line x1="136" y1="154" x2="204" y2="104" stroke="#c0392b" stroke-width="3"/>
  <line x1="294" y1="154" x2="226" y2="104" stroke="#c0392b" stroke-width="3"/>
  <text x="215" y="70" text-anchor="middle" font-size="14" fill="#c0392b">根只有 1 条链路承载全部数据</text>

  <!-- 叶子闲置注释 -->
  <text x="60" y="300" text-anchor="middle" font-size="13" fill="#666">叶子只发不收</text>
  <text x="60" y="318" text-anchor="middle" font-size="13" fill="#666">→ 一半链路闲置</text>

  <text x="215" y="350" text-anchor="middle" font-size="14" fill="#333">带宽项 O(log P)·N，根卡死吞吐</text>

  <!-- 分割线 -->
  <line x1="430" y1="40" x2="430" y2="540" stroke="#c8bfb0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 右面板标题 -->
  <text x="665" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">双二叉树 DBT：两树互补，链路用满</text>

  <!-- 树 A（青）-->
  <text x="560" y="70" font-size="14" font-weight="bold" fill="#1f6f8b">树 A</text>
  <circle cx="560" cy="110" r="17" fill="#dfeaf0" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="560" y="115" text-anchor="middle" font-size="12" fill="#333">0（根）</text>
  <circle cx="500" cy="175" r="17" fill="#e8e4da" stroke="#1f6f8b" stroke-width="1.3"/>
  <text x="500" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
  <circle cx="620" cy="175" r="17" fill="#e8e4da" stroke="#1f6f8b" stroke-width="1.3"/>
  <text x="620" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <line x1="555" y1="126" x2="505" y2="160" stroke="#1f6f8b" stroke-width="1.5"/>
  <line x1="565" y1="126" x2="615" y2="160" stroke="#1f6f8b" stroke-width="1.5"/>

  <!-- 树 B（红）-->
  <text x="780" y="70" font-size="14" font-weight="bold" fill="#c0392b">树 B</text>
  <circle cx="780" cy="110" r="17" fill="#f7e3de" stroke="#c0392b" stroke-width="1.6"/>
  <text x="780" y="115" text-anchor="middle" font-size="12" fill="#333">7（根）</text>
  <circle cx="700" cy="175" r="17" fill="#e8e4da" stroke="#c0392b" stroke-width="1.3"/>
  <text x="700" y="180" text-anchor="middle" font-size="12" fill="#333">6</text>
  <circle cx="860" cy="175" r="17" fill="#e8e4da" stroke="#c0392b" stroke-width="1.3"/>
  <text x="860" y="180" text-anchor="middle" font-size="12" fill="#333">5</text>
  <line x1="775" y1="126" x2="705" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="785" y1="126" x2="855" y2="160" stroke="#c0392b" stroke-width="1.5"/>

  <!-- 互补注释 -->
  <text x="665" y="215" text-anchor="middle" font-size="13" fill="#333">A 的根 0 在 B 中是叶子</text>
  <text x="665" y="235" text-anchor="middle" font-size="13" fill="#333">B 的根 7 在 A 中是叶子</text>
  <text x="665" y="255" text-anchor="middle" font-size="13" fill="#666">→ 两棵树的瓶颈节点互不重叠</text>

  <!-- 数据分块走两树 -->
  <rect x="500" y="285" width="150" height="46" fill="#dfeaf0" stroke="#1f6f8b" stroke-width="1.4"/>
  <text x="575" y="306" text-anchor="middle" font-size="13" fill="#333">分块 1 → 树 A</text>
  <text x="575" y="322" text-anchor="middle" font-size="12" fill="#666">归约+广播</text>
  <rect x="680" y="285" width="150" height="46" fill="#f7e3de" stroke="#c0392b" stroke-width="1.4"/>
  <text x="755" y="306" text-anchor="middle" font-size="13" fill="#333">分块 2 → 树 B</text>
  <text x="755" y="322" text-anchor="middle" font-size="12" fill="#666">归约+广播</text>

  <!-- 底部说明 -->
  <text x="665" y="370" text-anchor="middle" font-size="14" fill="#333">数据切成块，两块分别走两棵互补的树</text>
  <text x="665" y="392" text-anchor="middle" font-size="14" fill="#333">并行推进、互不干扰</text>

  <text x="665" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">延迟 O(log P)</text>
  <text x="665" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">带宽回到 Ring 量级 ≈ 2Nβ</text>

  <text x="665" y="505" text-anchor="middle" font-size="14" fill="#333">步数对比（P=16）：Ring 30 步 vs DBT 8 步</text>
  <text x="665" y="528" text-anchor="middle" font-size="14" fill="#c0392b">NCCL 的 Tree 算法即 DBT（NCCL ≥ 2.4）</text>
</svg>
