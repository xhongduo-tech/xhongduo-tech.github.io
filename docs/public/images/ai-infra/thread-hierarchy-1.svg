<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Grid、Block、Thread 三级线程层次与索引示意</title>
  <desc id="desc">CUDA 三级线程层次示意。最外层大虚线框是网格（Grid），gridDim=(Gx,Gy)，内含 3×2=6 个 block；每个 block 内含 4×3=12 个 thread（小圆圈），blockDim=(Bx,By)，坐标用 blockIdx=(bx,by) 标记；每个线程的块内坐标用 threadIdx=(tx,ty) 标记。同一 block 内的线程共享共享内存并可用 __syncthreads() 同步；不同 block 之间不能同步。每个 block 完整驻留在一个 SM 上，block 内线程按 32 个一组被切成 warp。图中比例为示意，非精确实测。</desc>

  <rect x="0" y="0" width="960" height="600" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="480" y="34" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">Grid、Block、Thread 三级线程层次（示意，非精确实测）</text>

  <!-- ============ Grid 虚线框 ============ -->
  <rect x="40" y="56" width="880" height="360" rx="12" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="82" font-size="16" font-weight="bold" fill="#c0392b">网格 Grid（一次 kernel 启动的全部 block）</text>
  <text x="830" y="82" font-size="14" fill="#777" text-anchor="end">gridDim = (Gx, Gy)</text>

  <!-- Block 行：6 个 block，3 列 x 2 行 -->
  <!-- Block 尺寸：每个 250 宽，间距 20；x: 60, 355, 650  ; y: 100, 250 -->
  <!-- Block (0,0) -->
  <rect x="60" y="100" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="75" y="122" font-size="14" font-weight="bold" fill="#1f6f8b">Block(0,0)</text>
  <text x="270" y="122" font-size="13" fill="#777" text-anchor="end">blockDim = (Bx, By)</text>
  <!-- 线程圆点 4x3 -->
  <g>
    <circle cx="90" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="90" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="90" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>
  <text x="255" y="160" font-size="13" fill="#333" text-anchor="end">threadIdx = (tx, ty)</text>

  <!-- Block (1,0) -->
  <rect x="355" y="100" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="370" y="122" font-size="14" font-weight="bold" fill="#1f6f8b">Block(1,0)</text>
  <g>
    <circle cx="385" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="385" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="385" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>

  <!-- Block (2,0) -->
  <rect x="650" y="100" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="665" y="122" font-size="14" font-weight="bold" fill="#1f6f8b">Block(2,0)</text>
  <g>
    <circle cx="680" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="150" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="680" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="190" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="680" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="230" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>

  <!-- Block (0,1) -->
  <rect x="60" y="256" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="75" y="278" font-size="14" font-weight="bold" fill="#1f6f8b">Block(0,1)</text>
  <g>
    <circle cx="90" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="90" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="90" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="130" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="170" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="210" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>

  <!-- Block (1,1) -->
  <rect x="355" y="256" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="370" y="278" font-size="14" font-weight="bold" fill="#1f6f8b">Block(1,1)</text>
  <g>
    <circle cx="385" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="385" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="385" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="425" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="465" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="505" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>

  <!-- Block (2,1) -->
  <rect x="650" y="256" width="250" height="140" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.6"/>
  <text x="665" y="278" font-size="14" font-weight="bold" fill="#1f6f8b">Block(2,1)</text>
  <g>
    <circle cx="680" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="306" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="680" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="346" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
    <circle cx="680" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="720" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="760" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/><circle cx="800" cy="386" r="9" fill="#dceaf0" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>

  <!-- blockIdx 标注 -->
  <text x="60" y="432" font-size="14" fill="#333">blockIdx = (bx, by)：block 在 grid 内的坐标；gridDim = (Gx, Gy)：grid 每维的 block 数</text>

  <!-- 下方说明框 -->
  <rect x="40" y="448" width="880" height="108" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#333">软件层次 → 硬件映射</text>
  <text x="60" y="498" font-size="14" fill="#333">· 全局一维下标：i = blockIdx.x × blockDim.x + threadIdx.x</text>
  <text x="60" y="520" font-size="14" fill="#333">· 一个 block 完整驻留一个 SM，执行期间不迁移；block 间不能同步</text>
  <text x="60" y="542" font-size="14" fill="#333">· block 内线程按 32 个一组切成 warp，交给 SM 的 warp 调度器（warp 是硬件概念）</text>
</svg>
