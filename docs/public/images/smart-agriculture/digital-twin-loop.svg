<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>农业数字孪生闭环</title>
<desc>物理农田通过实时数据流汇入大数据平台，驱动虚拟农田的数字孪生模型，模型仿真预测后输出处方建议，再由变量作业执行回物理农田，构成闭环。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
</marker>
</defs>
<rect width="760" height="500" fill="#faf9f5"/>
<rect x="50" y="130" width="200" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="150" y="170" font-size="17" fill="#333" text-anchor="middle">物理农田</text>
<text x="150" y="195" font-size="14" fill="#666" text-anchor="middle">传感器 · 农机 · 卫星</text>
<text x="150" y="218" font-size="14" fill="#666" text-anchor="middle">GPS · 产量监测 · 变量作业</text>
<rect x="280" y="30" width="200" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="380" y="60" font-size="17" fill="#333" text-anchor="middle">大数据平台</text>
<text x="380" y="84" font-size="14" fill="#666" text-anchor="middle">采集 · 清洗 · 存储 · 分析</text>
<rect x="510" y="130" width="200" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="610" y="170" font-size="17" fill="#333" text-anchor="middle">数字孪生模型</text>
<text x="610" y="195" font-size="14" fill="#666" text-anchor="middle">作物生长模型 · 土壤模型</text>
<text x="610" y="218" font-size="14" fill="#666" text-anchor="middle">仿真 · 预测 · 情景推演</text>
<rect x="280" y="340" width="200" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="380" y="372" font-size="17" fill="#333" text-anchor="middle">决策与执行</text>
<text x="380" y="396" font-size="14" fill="#666" text-anchor="middle">处方图 · 灌溉调度 · 变量作业</text>
<path d="M 250 155 C 262 110, 268 100, 278 85" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="252" y="98" font-size="14" fill="#1f6f8b">实时数据</text>
<path d="M 480 85 C 490 100, 498 110, 508 155" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="470" y="98" font-size="14" fill="#1f6f8b">数据驱动 · 同步</text>
<path d="M 610 240 C 590 285, 560 315, 485 345" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="520" y="315" font-size="14" fill="#c0392b">仿真预测 · 情景推演</text>
<path d="M 280 345 C 200 320, 170 290, 150 242" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="150" y="330" font-size="14" fill="#c0392b">处方建议 · 执行反馈</text>
<text x="380" y="470" font-size="13" fill="#666" text-anchor="middle">闭环：现实数据驱动模型，模型决策反哺现实，双向持续更新。</text>
</svg>
