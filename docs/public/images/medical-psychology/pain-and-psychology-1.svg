<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="sans-serif">
  <title>疼痛的闸门控制理论示意</title>
  <desc>痛觉细纤维与触压粗纤维投射到脊髓胶状质细胞，闸门决定传递细胞的兴奋，进而控制痛信号上行；大脑下行通路可调节闸门。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#faf9f5"/>

  <rect x="215" y="15" width="130" height="46" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="42" text-anchor="middle" font-size="13" fill="#333">大脑（下行控制）</text>

  <rect x="150" y="135" width="260" height="180" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="158" text-anchor="middle" font-size="13" fill="#333">脊髓背角</text>

  <line x1="25" y1="150" x2="150" y2="185" stroke="#c0392b" stroke-width="2.5"/>
  <text x="48" y="120" font-size="13" fill="#c0392b">Aδ/C 细纤维（痛觉）</text>

  <line x1="25" y1="280" x2="150" y2="262" stroke="#1f6f8b" stroke-width="6"/>
  <text x="42" y="305" font-size="13" fill="#1f6f8b">Aβ 粗纤维（触压）</text>

  <line x1="152" y1="185" x2="285" y2="185" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="222" y="176" text-anchor="middle" font-size="13" fill="#333">兴奋(+)</text>

  <line x1="155" y1="193" x2="188" y2="238" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="163" y="205" font-size="13" fill="#333">抑制(−)</text>

  <line x1="152" y1="260" x2="185" y2="248" stroke="#1f6f8b" stroke-width="5" marker-end="url(#arr-blue)"/>
  <text x="176" y="272" font-size="13" fill="#333">兴奋(+)</text>

  <circle cx="205" cy="250" r="17" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="205" y="255" text-anchor="middle" font-size="13" fill="#333">SG</text>
  <text x="205" y="300" text-anchor="middle" font-size="13" fill="#333">胶状质细胞</text>

  <circle cx="305" cy="185" r="19" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="305" y="191" text-anchor="middle" font-size="13" fill="#333">T</text>
  <text x="305" y="150" text-anchor="middle" font-size="13" fill="#333">传递细胞</text>

  <line x1="222" y1="247" x2="284" y2="197" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="258" y="228" font-size="13" fill="#333">抑制(−)</text>

  <line x1="305" y1="166" x2="283" y2="65" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="312" y="118" font-size="13" fill="#333">上行→痛觉</text>

  <path d="M 220 61 C 205 110 198 180 196 228" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="138" y="120" font-size="13" fill="#1f6f8b">下行调节</text>
</svg>
