<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif">
  <title>2:1 轨道共振示意</title>
  <desc>内行星公转两圈时外行星公转一圈，会合点在对跖方向交替出现，避免两者近距离接近</desc>
  <rect width="420" height="300" fill="#faf9f5"/>
  <text x="210" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2:1 轨道共振</text>
  <text x="210" y="48" text-anchor="middle" font-size="13" fill="#555">内行星公转 2 圈时，外行星公转 1 圈</text>
  <circle cx="210" cy="170" r="55" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="210" cy="170" r="110" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="210" cy="170" r="8" fill="#c0392b"/>
  <text x="210" y="196" text-anchor="middle" font-size="13" fill="#c0392b">太阳</text>
  <line x1="210" y1="170" x2="320" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="210" y1="170" x2="100" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="265" cy="170" r="9" fill="#1f6f8b"/>
  <circle cx="155" cy="170" r="9" fill="#1f6f8b"/>
  <text x="265" y="146" text-anchor="middle" font-size="13" fill="#1f6f8b">内行星</text>
  <circle cx="320" cy="170" r="11" fill="#c0392b"/>
  <circle cx="100" cy="170" r="11" fill="#c0392b"/>
  <text x="320" y="147" text-anchor="middle" font-size="13" fill="#c0392b">外行星</text>
  <text x="265" y="204" text-anchor="middle" font-size="13" fill="#333">会合点 A</text>
  <text x="155" y="204" text-anchor="middle" font-size="13" fill="#333">会合点 B</text>
  <text x="410" y="282" text-anchor="end" font-size="13" fill="#666">会合点在对跖方向交替出现，两体永不近距离接近</text>
</svg>
