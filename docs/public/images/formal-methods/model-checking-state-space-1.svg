<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <title>克里普克结构示例：互斥系统的安全性质</title>
  <desc>一个四状态转移系统。状态 s0、s1、s2 相互可达且满足互斥性质；坏状态 s3 无入边、不可达，因此 AG 非 bad 成立。</desc>
  <rect x="0" y="0" width="660" height="300" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 状态 s0（初始，双圈） -->
  <circle cx="130" cy="150" r="26" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <circle cx="130" cy="150" r="34" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="130" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">s0</text>
  <text x="130" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">init, idle</text>

  <!-- 状态 s1 -->
  <circle cx="330" cy="70" r="26" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="330" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">s1</text>
  <text x="330" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">try</text>

  <!-- 状态 s2 -->
  <circle cx="330" cy="230" r="26" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="330" y="236" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">s2</text>
  <text x="330" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">crit</text>

  <!-- 坏状态 s3（不可达，虚线红圈） -->
  <circle cx="540" cy="150" r="26" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">s3</text>
  <text x="540" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">bad（不可达）</text>

  <!-- 转移箭头 -->
  <path d="M155,130 C 210,100 250,85 300,78" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M155,170 C 210,200 250,212 300,222" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M320,97 C 320,120 320,190 320,206" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- s1 回 s0 -->
  <path d="M305,62 C 250,45 190,45 158,105" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- s2 自环 -->
  <path d="M356,225 C 380,225 380,252 356,252 C 344,252 344,238 348,234" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 结论文字 -->
  <text x="330" y="20" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">可达状态：{ s0, s1, s2 }</text>
  <text x="330" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">M ⊨ AG ¬bad = 真（坏状态不可达）</text>
</svg>
