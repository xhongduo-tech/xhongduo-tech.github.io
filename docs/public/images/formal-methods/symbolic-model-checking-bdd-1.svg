<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <title>布尔函数 f(a,b)=a∨b 的决策树与规约后的 ROBDD</title>
  <desc>左侧是变量的完全决策树，右侧是删除冗余节点与合并同构子树后的有序二元决策图（ROBDD），节点从 7 个降至 3 个，且成为该函数的规范表示。</desc>
  <rect x="0" y="0" width="700" height="320" fill="#faf9f5"/>
  <defs>
    <marker id="arrowBdd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="160" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">决策树（7 节点）</text>
  <text x="500" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">ROBDD（3 节点）</text>
  <text x="350" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">f(a,b) = a ∨ b，变量顺序 a、b：删除冗余 + 合并同构，7 节点 → 3 节点</text>

  <!-- ===== 左：决策树 ===== -->
  <circle cx="160" cy="70" r="22" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="160" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">a</text>
  <circle cx="70" cy="170" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="70" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">b</text>
  <circle cx="250" cy="170" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="250" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">b</text>

  <path d="M150,92 C 120,120 90,140 78,150" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBdd)"/>
  <path d="M170,92 C 200,120 230,140 242,150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBdd)"/>
  <text x="128" y="120" font-family="sans-serif" font-size="14" fill="#1f6f8b">1</text>
  <text x="212" y="120" font-family="sans-serif" font-size="14" fill="#c0392b">0</text>

  <!-- 叶子 -->
  <rect x="18" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="33" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">0</text>
  <rect x="110" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="125" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">1</text>
  <rect x="205" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="220" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">1</text>
  <rect x="290" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="305" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">1</text>

  <path d="M62,190 C 50,210 40,228 36,242" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBdd)"/>
  <path d="M78,190 C 95,210 110,228 116,242" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBdd)"/>
  <path d="M242,190 C 230,210 222,228 218,242" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBdd)"/>
  <path d="M258,190 C 275,210 290,228 296,242" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBdd)"/>
  <text x="40" y="222" font-family="sans-serif" font-size="13" fill="#1f6f8b">1</text>
  <text x="96" y="222" font-family="sans-serif" font-size="13" fill="#c0392b">0</text>
  <text x="220" y="222" font-family="sans-serif" font-size="13" fill="#1f6f8b">1</text>
  <text x="276" y="222" font-family="sans-serif" font-size="13" fill="#c0392b">0</text>

  <!-- ===== 右：ROBDD ===== -->
  <circle cx="500" cy="70" r="22" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">a</text>
  <circle cx="430" cy="170" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="430" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">b</text>

  <path d="M514,92 C 550,140 575,200 583,232" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBdd)"/>
  <path d="M488,92 C 465,120 448,140 438,150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBdd)"/>
  <text x="536" y="180" font-family="sans-serif" font-size="13" fill="#1f6f8b">1</text>
  <text x="470" y="130" font-family="sans-serif" font-size="13" fill="#c0392b">0</text>

  <rect x="578" y="245" width="30" height="24" rx="4" fill="#1f6f8b"/>
  <text x="593" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">1</text>
  <rect x="508" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="523" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">1</text>
  <rect x="360" y="245" width="30" height="24" rx="4" fill="#333"/>
  <text x="375" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">0</text>

  <path d="M438,190 C 470,215 505,230 514,242" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBdd)"/>
  <path d="M422,190 C 400,215 385,230 378,242" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBdd)"/>
  <text x="482" y="222" font-family="sans-serif" font-size="13" fill="#1f6f8b">1</text>
  <text x="400" y="222" font-family="sans-serif" font-size="13" fill="#c0392b">0</text>
</svg>
