<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330">
  <title>离散时间马尔可夫链：最多重传一次的通信协议</title>
  <desc>状态"首次发送"以 0.8 成功、0.2 进入重传；"重传"以 0.8 成功、0.2 失败。最终成功的概率为 0.8 加 0.2 乘 0.8，等于 0.96。</desc>
  <rect x="0" y="0" width="560" height="330" fill="#faf9f5"/>
  <defs>
    <marker id="arrowPmc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 状态 s0 -->
  <circle cx="130" cy="165" r="28" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">s0</text>
  <text x="130" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">首次发送</text>

  <!-- 状态 s1 -->
  <circle cx="395" cy="165" r="28" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="395" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">s1</text>
  <text x="395" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">重传</text>

  <!-- 状态 成功（吸收） -->
  <circle cx="260" cy="55" r="28" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="260" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">成功</text>
  <text x="260" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">吸收，自环 1.0</text>

  <!-- 状态 失败（吸收） -->
  <circle cx="260" cy="275" r="28" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">失败</text>
  <text x="260" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">吸收，自环 1.0</text>

  <!-- s0 -> 成功 -->
  <path d="M150,138 C 180,95 215,70 234,58" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrowPmc)"/>
  <text x="196" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">0.8</text>

  <!-- s0 -> s1 -->
  <path d="M158,172 C 210,172 320,172 362,172" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrowPmc)"/>
  <text x="260" y="164" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">0.2</text>

  <!-- s1 -> 成功 -->
  <path d="M375,138 C 345,95 305,70 288,58" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrowPmc)"/>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">0.8</text>

  <!-- s1 -> 失败 -->
  <path d="M375,192 C 345,235 305,258 288,272" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrowPmc)"/>
  <text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">0.2</text>

  <text x="280" y="20" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">P[ F 成功 ] = 0.8 + 0.2 × 0.8 = 0.96</text>
  <text x="280" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">验证 P≥0.9 [F 成功] 成立；P≥0.99 [F 成功] 不成立</text>
</svg>
