<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>线性-二次模型下的细胞存活曲线</title>
  <desc>存活分数随辐射剂量指数下降，曲线由线性项与二次项叠加而成</desc>
  <rect width="640" height="480" fill="#fff"/>
  <text x="320" y="38" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">细胞存活曲线（线性-二次模型）</text>

  <line x1="80" y1="420" x2="600" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="420" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="424" font-size="13" fill="#333" text-anchor="end">存活分数 S（对数轴）</text>
  <text x="360" y="448" font-size="13" fill="#333" text-anchor="middle">辐射剂量 D（Gy）</text>

  <text x="52" y="90" font-size="13" fill="#333" text-anchor="end">10⁰</text>
  <text x="52" y="230" font-size="13" fill="#333" text-anchor="end">10⁻²</text>
  <text x="52" y="372" font-size="13" fill="#333" text-anchor="end">10⁻⁴</text>

  <text x="520" y="120" font-size="13" fill="#333" text-anchor="middle">α 段：初始斜率（每 Gy 直线下降）</text>

  <path d="M80,60 Q300,150 580,395" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="80" y1="60" x2="280" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="150" y="110" font-size="13" fill="#333">低剂量区：曲线“肩部”平缓</text>
  <text x="300" y="330" font-size="13" fill="#333">高剂量区：细胞累积损伤致死</text>
  <text x="180" y="200" font-size="14" fill="#1f6f8b">S = exp(−(αD + βD²))</text>
</svg>
