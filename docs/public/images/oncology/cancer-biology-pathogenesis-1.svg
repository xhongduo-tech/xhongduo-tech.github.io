<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="sans-serif">
  <title>癌症的十项标志</title>
  <desc>汉南与温伯格 2011 年提出的癌细胞演化中获得的能力网格图</desc>
  <rect width="640" height="500" fill="#fff"/>
  <text x="320" y="42" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">癌症的十项标志（Hanahan &amp; Weinberg，2011）</text>
  <text x="320" y="66" font-size="14" fill="#666" text-anchor="middle">癌细胞在演化中逐步获得的能力</text>

  <g fill="#faf9f5" stroke="#1f6f8b" stroke-width="1.5">
    <rect x="30" y="100" width="280" height="56" rx="8"/>
    <rect x="330" y="100" width="280" height="56" rx="8"/>
    <rect x="30" y="180" width="280" height="56" rx="8"/>
    <rect x="330" y="180" width="280" height="56" rx="8"/>
    <rect x="30" y="260" width="280" height="56" rx="8"/>
    <rect x="330" y="260" width="280" height="56" rx="8"/>
    <rect x="30" y="340" width="280" height="56" rx="8"/>
    <rect x="330" y="340" width="280" height="56" rx="8"/>
    <rect x="30" y="420" width="280" height="56" rx="8"/>
    <rect x="330" y="420" width="280" height="56" rx="8"/>
  </g>

  <g fill="#333" font-size="15" text-anchor="middle">
    <text x="170" y="134">持续增殖信号</text>
    <text x="470" y="134">逃避生长抑制</text>
    <text x="170" y="214">抵抗细胞凋亡</text>
    <text x="470" y="214">复制无限（端粒）</text>
    <text x="170" y="294">诱导血管生成</text>
    <text x="470" y="294">激活侵袭与转移</text>
    <text x="170" y="374">重编程能量代谢</text>
    <text x="470" y="374">逃避免疫摧毁</text>
    <text x="170" y="454">基因组不稳定与突变</text>
    <text x="470" y="454">肿瘤促炎微环境</text>
  </g>
</svg>
