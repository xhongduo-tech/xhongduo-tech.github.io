<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <title>癌症免疫循环（简化）</title>
  <desc>抗原释放、T 细胞活化、迁移浸润、识别杀伤四步闭环；CTLA-4 是活化步的刹车，PD-1/PD-L1 是杀伤步的刹车</desc>
  <rect width="640" height="480" fill="#fff"/>
  <text x="320" y="38" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">癌症免疫循环：抗原释放 → 活化 → 迁移 → 杀伤（循环往复）</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <rect x="215" y="80" width="210" height="64" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="108" font-size="14" fill="#333" text-anchor="middle">抗原递呈</text>
  <text x="320" y="130" font-size="13" fill="#333" text-anchor="middle">T 细胞活化（淋巴结）</text>

  <rect x="430" y="208" width="190" height="64" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <text x="525" y="236" font-size="14" fill="#333" text-anchor="middle">T 细胞迁移</text>
  <text x="525" y="258" font-size="13" fill="#333" text-anchor="middle">与肿瘤浸润</text>

  <rect x="215" y="336" width="210" height="64" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="364" font-size="14" fill="#333" text-anchor="middle">识别并杀伤</text>
  <text x="320" y="386" font-size="13" fill="#333" text-anchor="middle">肿瘤细胞</text>

  <rect x="20" y="208" width="190" height="64" rx="6" fill="#faf9f5" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="236" font-size="14" fill="#333" text-anchor="middle">肿瘤抗原释放</text>
  <text x="115" y="258" font-size="13" fill="#333" text-anchor="middle">（新抗原暴露）</text>

  <line x1="120" y1="205" x2="255" y2="148" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="130" x2="492" y2="203" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="270" x2="428" y2="332" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="212" y1="368" x2="212" y2="278" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="414" y="165" font-size="13" fill="#c0392b" text-anchor="end">CTLA-4：活化步的刹车</text>
  <text x="430" y="322" font-size="13" fill="#c0392b" text-anchor="end">PD-1/PD-L1：杀伤步的刹车</text>

  <text x="320" y="462" font-size="13" fill="#333" text-anchor="middle">箭头即循环方向；每转一圈，免疫压力都在对肿瘤做一次再筛选</text>
</svg>
