<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">圆周运动的角量与线量示意</title>
  <desc id="desc">平面上以 O 为圆心的圆周轨迹，点 P 在右上方，红色半径 r 从 O 指向 P，O 处红色小圆弧标出角位置 θ；青色箭头为过 P 沿切线方向的线速度 v，红色箭头为从 P 指向圆心 O 的向心加速度 a_n；圆心 O 附近一条青色弧线箭头表示角速度 ω 的旋转方向。</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- 纸底 -->
  <rect x="0" y="0" width="780" height="520" fill="#faf9f5"/>

  <!-- 坐标轴（墨色，过圆心） -->
  <line x1="80" y1="270" x2="660" y2="270" stroke="#777" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
  <line x1="300" y1="470" x2="300" y2="60" stroke="#777" stroke-width="1.4" marker-end="url(#arrow-ink)"/>

  <!-- 圆周轨迹（墨色圆环） -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 半径 r（红色，O 到 P） -->
  <line x1="300" y1="270" x2="446" y2="148" stroke="#c0392b" stroke-width="2.2"/>

  <!-- 角位置 θ 弧（红色，从 +x 轴到半径） -->
  <path d="M 340 270 A 40 40 0 0 0 330.6 244.3" fill="none" stroke="#c0392b" stroke-width="1.6"/>

  <!-- 角速度 ω 弧线（青色，圆心左上方，逆时针） -->
  <path d="M 261 247.5 A 45 45 0 0 0 292 225.7" fill="none" stroke="#1f6f8b" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

  <!-- 线速度 v（青色，切向，P 处指左上） -->
  <line x1="446" y1="148" x2="394" y2="87" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#arrow-teal)"/>

  <!-- 向心加速度 a_n（红色，从 P 指向圆心） -->
  <line x1="446" y1="148" x2="391" y2="191" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow-red)"/>

  <!-- 关键点 -->
  <g fill="#333">
    <circle cx="300" cy="270" r="4"/>
    <circle cx="446" cy="148" r="4"/>
  </g>

  <!-- 文字标注 -->
  <g font-size="14" fill="#333">
    <text x="288" y="291">O</text>
    <text x="452" y="140">P</text>
    <text x="666" y="266">x</text>
    <text x="296" y="48">y</text>
    <text x="365" y="222" fill="#c0392b">r</text>
    <text x="346" y="262" fill="#c0392b">θ</text>
    <text x="294" y="212" fill="#1f6f8b">ω</text>
    <text x="368" y="92" fill="#1f6f8b">v（切线方向）</text>
    <text x="382" y="196" fill="#c0392b">a_n（指向圆心）</text>
    <!-- 图例 -->
    <text x="545" y="80">线速度 v 沿切线</text>
    <text x="545" y="104" fill="#c0392b">向心加速度 a_n 指向圆心</text>
    <text x="545" y="128" fill="#c0392b">角位置 θ、角速度 ω</text>
  </g>
</svg>
