<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <title>针孔相机模型的成像几何</title>
  <desc>场景点 P 发出的光线穿过光心 C，在像平面 z=f 上形成像点 p。X 是场景点距光轴的高度，x 是像点距光轴的高度，Z 是物距，f 是焦距。由相似三角形得 x/f = X/Z。</desc>
  <rect width="720" height="400" fill="#faf9f5"/>
  <line x1="120" y1="210" x2="660" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="260" y1="60" x2="260" y2="360" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="264" y="52" font-family="sans-serif" font-size="15" fill="#1f6f8b">像平面 z = f</text>
  <circle cx="180" cy="210" r="6" fill="#1f6f8b"/>
  <text x="146" y="248" font-family="sans-serif" font-size="15" fill="#333">光心 C</text>
  <circle cx="560" cy="90" r="5" fill="#c0392b"/>
  <text x="470" y="72" font-family="sans-serif" font-size="15" fill="#333">场景点 P(X, Y, Z)</text>
  <line x1="560" y1="90" x2="180" y2="210" stroke="#333" stroke-width="1.5"/>
  <circle cx="260" cy="184.7" r="5" fill="#c0392b"/>
  <text x="268" y="172" font-family="sans-serif" font-size="15" fill="#333">像点 p(x, y)</text>
  <line x1="560" y1="90" x2="560" y2="210" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="568" y="156" font-family="sans-serif" font-size="14" fill="#c0392b" transform="rotate(90 568 156)">X</text>
  <line x1="260" y1="184.7" x2="260" y2="210" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="238" y="202" font-family="sans-serif" font-size="14" fill="#c0392b">x</text>
  <text x="150" y="96" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b">x / f = X / Z</text>
  <line x1="180" y1="238" x2="260" y2="238" stroke="#666" stroke-width="1"/>
  <line x1="180" y1="230" x2="180" y2="246" stroke="#666" stroke-width="1"/>
  <line x1="260" y1="230" x2="260" y2="246" stroke="#666" stroke-width="1"/>
  <text x="186" y="264" font-family="sans-serif" font-size="14" fill="#666">f（焦距）</text>
  <line x1="180" y1="360" x2="560" y2="360" stroke="#999" stroke-width="1"/>
  <line x1="180" y1="352" x2="180" y2="368" stroke="#999" stroke-width="1"/>
  <line x1="560" y1="352" x2="560" y2="368" stroke="#999" stroke-width="1"/>
  <text x="350" y="386" font-family="sans-serif" font-size="15" fill="#333">Z（物距）</text>
  <text x="620" y="236" font-family="sans-serif" font-size="14" fill="#666">光轴（z 轴）</text>
</svg>
