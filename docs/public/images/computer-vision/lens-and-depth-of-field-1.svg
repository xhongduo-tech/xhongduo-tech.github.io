<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <title>薄透镜对焦与弥散圆</title>
  <desc>薄透镜把对焦物点 A 的光线会聚到传感器上的清晰像点；近处物点 B 的光线在传感器之后会聚，因此传感器上截到一个有限直径的弥散圆（CoC）。</desc>
  <rect width="720" height="400" fill="#faf9f5"/>
  <line x1="50" y1="210" x2="700" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="247" y="100" width="6" height="220" fill="#1f6f8b"/>
  <text x="216" y="86" font-family="sans-serif" font-size="15" fill="#1f6f8b">薄透镜</text>
  <line x1="520" y1="60" x2="520" y2="360" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="524" y="52" font-family="sans-serif" font-size="15" fill="#1f6f8b">传感器（像平面）</text>
  <circle cx="100" cy="210" r="5" fill="#333"/>
  <text x="86" y="192" font-family="sans-serif" font-size="14" fill="#333">A：对焦物点</text>
  <text x="76" y="210" font-family="sans-serif" font-size="13" fill="#333">（物距 u_f）</text>
  <polyline points="100,210 250,150 520,210" fill="none" stroke="#333" stroke-width="1.5"/>
  <polyline points="100,210 250,270 520,210" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="520" cy="210" r="5" fill="#c0392b"/>
  <text x="528" y="196" font-family="sans-serif" font-size="14" fill="#333">清晰像点</text>
  <circle cx="60" cy="210" r="5" fill="#c0392b"/>
  <text x="46" y="180" font-family="sans-serif" font-size="14" fill="#c0392b">B：近处物点</text>
  <text x="36" y="198" font-family="sans-serif" font-size="13" fill="#c0392b">（u &lt; u_f）</text>
  <line x1="60" y1="210" x2="250" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="210" x2="250" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="250" y1="150" x2="600" y2="210" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="250" y1="270" x2="600" y2="210" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="600" cy="210" r="4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="606" y="204" font-family="sans-serif" font-size="13" fill="#c0392b">会聚点在</text>
  <text x="606" y="220" font-family="sans-serif" font-size="13" fill="#c0392b">传感器之后</text>
  <line x1="520" y1="196.3" x2="520" y2="223.7" stroke="#c0392b" stroke-width="3.5"/>
  <text x="392" y="244" font-family="sans-serif" font-size="14" fill="#c0392b">弥散圆（CoC）</text>
  <line x1="520" y1="210" x2="430" y2="232" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="70" y="60" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">c = A·|v − s| / v</text>
  <text x="196" y="344" font-family="sans-serif" font-size="14" fill="#666">光圈直径 A（f 数 N = f / A）</text>
  <text x="600" y="240" font-family="sans-serif" font-size="14" fill="#666">光轴</text>
</svg>
