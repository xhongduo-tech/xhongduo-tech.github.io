<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="14">
  <title>频域滤波的完整流程</title>
  <desc>空间域图像经傅里叶变换得到频域幅度谱，与滤波掩膜逐点相乘后，再经逆傅里叶变换回到空间域。</desc>
  <rect x="0" y="0" width="640" height="300" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">频域滤波流程：卷积定理的实践</text>

  <!-- 第一行：三个框 -->
  <rect x="20"  y="70" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="95" y="92" text-anchor="middle" fill="#333">空间域图像</text>
  <text x="95" y="110" text-anchor="middle" font-size="12" fill="#555">f(x, y)</text>

  <rect x="245" y="70" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="92" text-anchor="middle" fill="#333">频域幅度谱</text>
  <text x="320" y="110" text-anchor="middle" font-size="12" fill="#555">|F(u, v)|（低频居中）</text>

  <rect x="470" y="70" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="545" y="92" text-anchor="middle" fill="#333">滤波后频谱</text>
  <text x="545" y="110" text-anchor="middle" font-size="12" fill="#555">F(u,v) · H(u,v)</text>

  <!-- 第一行箭头 -->
  <line x1="172" y1="96" x2="240" y2="96" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="206" y="88" text-anchor="middle" font-size="12" fill="#c0392b">傅里叶</text>
  <text x="206" y="116" text-anchor="middle" font-size="12" fill="#c0392b">FFT</text>

  <line x1="397" y1="96" x2="465" y2="96" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="431" y="88" text-anchor="middle" font-size="12" fill="#c0392b">乘掩膜</text>
  <text x="431" y="116" text-anchor="middle" font-size="12" fill="#c0392b">H(u,v)</text>

  <!-- 第二行：输出框 -->
  <rect x="245" y="200" width="150" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="222" text-anchor="middle" fill="#333">输出图像</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#555">g(x, y)</text>

  <!-- 下行箭头 -->
  <line x1="545" y1="124" x2="545" y2="180" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="560" y="157" text-anchor="middle" font-size="12" fill="#c0392b">逆变换 IFFT</text>

  <line x1="320" y1="190" x2="320" y2="196" stroke="#c0392b" stroke-width="1.6"/>

  <!-- 低通/高通/带通提示 -->
  <text x="320" y="285" text-anchor="middle" font-size="13" fill="#555">低通：保留中心 → 平滑　|　高通：保留外围 → 边缘　|　带通：保留一个环带 → 金字塔层</text>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
