<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif" font-size="14">
  <title>盒式核与高斯核的一维权重对比</title>
  <desc>同一窗口大小下，盒式核各位置权重相等，高斯核中心权重最大、向两侧平滑衰减。</desc>
  <rect x="0" y="0" width="640" height="320" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">盒式核与高斯核的一维权重对比（窗口宽度相同）</text>

  <!-- 盒式核：5 个等宽等高的柱 -->
  <text x="150" y="66" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">盒式核：权重处处相等</text>
  <line x1="70" y1="250" x2="240" y2="250" stroke="#333" stroke-width="1.5"/>
  <rect x="78"  y="150" width="28" height="100" fill="#1f6f8b" opacity="0.85"/>
  <rect x="112" y="150" width="28" height="100" fill="#1f6f8b" opacity="0.85"/>
  <rect x="146" y="150" width="28" height="100" fill="#1f6f8b" opacity="0.85"/>
  <rect x="180" y="150" width="28" height="100" fill="#1f6f8b" opacity="0.85"/>
  <rect x="214" y="150" width="28" height="100" fill="#1f6f8b" opacity="0.85"/>
  <text x="156" y="275" text-anchor="middle" fill="#333">权重 = 1/5</text>
  <text x="156" y="142" text-anchor="middle" font-size="13" fill="#1f6f8b">平均 → 细节被无差别抹平</text>

  <!-- 高斯核：7 个中心高两侧低的柱 -->
  <text x="470" y="66" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">高斯核：中心权重最大</text>
  <line x1="380" y1="250" x2="580" y2="250" stroke="#333" stroke-width="1.5"/>
  <rect x="390" y="205" width="24" height="45"  fill="#c0392b" opacity="0.85"/>
  <rect x="420" y="170" width="24" height="80"  fill="#c0392b" opacity="0.85"/>
  <rect x="450" y="122" width="24" height="128" fill="#c0392b" opacity="0.85"/>
  <rect x="480" y="100" width="24" height="150" fill="#c0392b" opacity="0.9"/>
  <rect x="510" y="122" width="24" height="128" fill="#c0392b" opacity="0.85"/>
  <rect x="540" y="170" width="24" height="80"  fill="#c0392b" opacity="0.85"/>
  <rect x="570" y="205" width="24" height="45"  fill="#c0392b" opacity="0.85"/>
  <text x="480" y="275" text-anchor="middle" fill="#333">中心最重，随距离平滑衰减（σ 控制衰减快慢）</text>

  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#555">归一化（权重和 = 1）后，两者都不改变平均亮度</text>
</svg>
