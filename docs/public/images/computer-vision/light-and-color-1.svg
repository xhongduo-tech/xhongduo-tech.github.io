<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">可见光谱与波长区间示意</title>
  <desc id="desc">顶部为电磁波谱轴线，标注无线电波、微波、红外、可见光、紫外、X射线等波段；中部是 380–780 nm 的可见光彩色渐变条，标出紫、蓝、青、绿、黄、橙、红各色调区间与 380/450/520/560/630/780 nm 波长刻度；底部给出 c=λν 关系与白光色散说明。</desc>

  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e57c2"/>
      <stop offset="0.175" stop-color="#3f51b5"/>
      <stop offset="0.275" stop-color="#03a9f4"/>
      <stop offset="0.35" stop-color="#4caf50"/>
      <stop offset="0.45" stop-color="#ffeb3b"/>
      <stop offset="0.525" stop-color="#ff9800"/>
      <stop offset="0.625" stop-color="#f4511e"/>
      <stop offset="1" stop-color="#d32f2f"/>
    </linearGradient>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#faf9f5"/>

  <text x="380" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">可见光谱与波长区间（380–780 nm）</text>

  <!-- 电磁波谱轴线 -->
  <line x1="80" y1="100" x2="680" y2="100" stroke="#333" stroke-width="2" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)"/>
  <text x="120" y="84" text-anchor="middle" font-size="14" fill="#333">无线电波</text>
  <text x="250" y="84" text-anchor="middle" font-size="14" fill="#333">微波</text>
  <text x="340" y="84" text-anchor="middle" font-size="14" fill="#333">红外</text>
  <text x="430" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">可见光</text>
  <text x="565" y="84" text-anchor="middle" font-size="14" fill="#333">紫外</text>
  <text x="650" y="84" text-anchor="middle" font-size="14" fill="#333">X 射线</text>

  <!-- 可见光局部放大指示 -->
  <line x1="416" y1="96" x2="416" y2="104" stroke="#c0392b" stroke-width="2"/>
  <line x1="444" y1="96" x2="444" y2="104" stroke="#c0392b" stroke-width="2"/>
  <line x1="430" y1="104" x2="430" y2="150" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <text x="446" y="140" font-size="13" fill="#c0392b">可见光（放大）</text>

  <!-- 可见光渐变条 -->
  <rect x="140" y="160" width="500" height="80" fill="url(#spectrum)" stroke="#333" stroke-width="1.5"/>

  <!-- 频率标注 -->
  <text x="150" y="150" font-size="14" fill="#1f6f8b">频率 ν 大</text>
  <text x="630" y="150" text-anchor="end" font-size="14" fill="#1f6f8b">频率 ν 小</text>

  <!-- 波长刻度与数值 -->
  <line x1="140" y1="240" x2="140" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="140" y="270" text-anchor="middle" font-size="15" fill="#333">380</text>
  <line x1="228" y1="240" x2="228" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="228" y="270" text-anchor="middle" font-size="15" fill="#333">450</text>
  <line x1="315" y1="240" x2="315" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="315" y="270" text-anchor="middle" font-size="15" fill="#333">520</text>
  <line x1="365" y1="240" x2="365" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="365" y="270" text-anchor="middle" font-size="15" fill="#333">560</text>
  <line x1="453" y1="240" x2="453" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="453" y="270" text-anchor="middle" font-size="15" fill="#333">630</text>
  <line x1="640" y1="240" x2="640" y2="250" stroke="#333" stroke-width="1.6"/>
  <text x="640" y="270" text-anchor="middle" font-size="15" fill="#333">780</text>

  <!-- 色调名称 -->
  <text x="184" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#5e35b1">紫</text>
  <text x="253" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e88e5">蓝</text>
  <text x="296" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#00897b">青</text>
  <text x="340" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#43a047">绿</text>
  <text x="384" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#f9a825">黄</text>
  <text x="428" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#ef6c00">橙</text>
  <text x="546" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">红</text>

  <!-- 波长增大方向 -->
  <line x1="140" y1="326" x2="640" y2="326" stroke="#333" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <text x="390" y="318" text-anchor="middle" font-size="14" fill="#333">波长 λ（nm）增大 →</text>

  <!-- 底部说明框 -->
  <rect x="140" y="352" width="500" height="58" rx="6" fill="#f1ede1" stroke="#c9c2b0"/>
  <text x="155" y="376" font-size="13.5" fill="#333">c = λν ≈ 3.0×10⁸ m/s（真空）　E = hν（频率越高，光子能量越大）</text>
  <text x="155" y="398" font-size="13.5" fill="#333">白光 = 所有波长的光混合（1666 年牛顿用三棱镜将其色散）</text>
</svg>
