<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="sans-serif">
  <title>农业面源污染的传输路径示意</title>
  <desc>展示面源污染与点源污染的对比：四块农田的降雨径流把氮磷分散汇入河流，河流进入下游湖库引发富营养化；右侧一个集中的点源排污口与之形成对照。</desc>
  <rect width="860" height="540" fill="#faf9f5"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#5b9bd5"/>
    </marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">农业面源污染的传输路径示意</text>

  <!-- 降雨 -->
  <g stroke="#1f6f8b" stroke-width="2">
    <line x1="140" y1="48" x2="150" y2="60"/>
    <line x1="170" y1="48" x2="180" y2="60"/>
    <line x1="250" y1="48" x2="260" y2="60"/>
    <line x1="280" y1="48" x2="290" y2="60"/>
    <line x1="540" y1="48" x2="550" y2="60"/>
    <line x1="570" y1="48" x2="580" y2="60"/>
    <line x1="700" y1="48" x2="710" y2="60"/>
    <line x1="730" y1="48" x2="740" y2="60"/>
  </g>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#1f6f8b">降雨径流（事件的、间歇的）</text>

  <!-- 农田 -->
  <rect x="30" y="80" width="120" height="70" rx="8" fill="#f7f3e8" stroke="#333" stroke-width="2"/>
  <text x="90" y="118" text-anchor="middle" font-size="15" fill="#333">农田 A</text>

  <rect x="200" y="100" width="120" height="70" rx="8" fill="#f7f3e8" stroke="#333" stroke-width="2"/>
  <text x="260" y="138" text-anchor="middle" font-size="15" fill="#333">农田 B</text>

  <rect x="500" y="80" width="120" height="70" rx="8" fill="#f7f3e8" stroke="#333" stroke-width="2"/>
  <text x="560" y="118" text-anchor="middle" font-size="15" fill="#333">农田 C</text>

  <rect x="670" y="100" width="120" height="70" rx="8" fill="#f7f3e8" stroke="#333" stroke-width="2"/>
  <text x="730" y="138" text-anchor="middle" font-size="15" fill="#333">农田 D</text>

  <!-- 河流 -->
  <path d="M 430 165 L 430 365" stroke="#5b9bd5" stroke-width="20" fill="none"/>
  <text x="445" y="280" font-size="14" fill="#1f6f8b">河流</text>

  <!-- 农田径流汇入 -->
  <line x1="150" y1="150" x2="412" y2="200" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="320" y1="170" x2="422" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="500" y1="150" x2="438" y2="220" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="670" y1="170" x2="448" y2="250" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="160" y="200" font-size="13" fill="#c0392b">农田径流</text>
  <text x="160" y="216" font-size="13" fill="#c0392b">（氮磷随水走）</text>

  <!-- 淋洗 -->
  <line x1="260" y1="172" x2="205" y2="300" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ab)"/>
  <text x="100" y="320" font-size="13" fill="#1f6f8b">渗漏 / 淋洗</text>

  <!-- 湖库 -->
  <ellipse cx="430" cy="425" rx="125" ry="45" fill="#a9d6c9" stroke="#1f6f8b" stroke-width="2"/>
  <text x="430" y="420" text-anchor="middle" font-size="14" fill="#333">下游湖库</text>
  <text x="430" y="438" text-anchor="middle" font-size="13" fill="#c0392b">富营养化 · 藻类爆发</text>

  <!-- 点源对比 -->
  <rect x="640" y="320" width="80" height="34" rx="6" fill="#e8eef0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="680" y="341" text-anchor="middle" font-size="13" fill="#1f6f8b">排污口</text>
  <line x1="640" y1="337" x2="452" y2="330" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="700" y="305" font-size="13" fill="#1f6f8b">点源：一个集中排放口</text>

  <!-- 图例 -->
  <text x="430" y="515" text-anchor="middle" font-size="13" fill="#555">红色＝面源（分散的多个源头，随降雨间歇发生）　青色＝点源（集中、连续、可监测）</text>
</svg>
