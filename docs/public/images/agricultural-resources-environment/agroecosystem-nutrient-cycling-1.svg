<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="sans-serif">
  <title>农业生态系统氮循环示意</title>
  <desc>展示农业生态系统中氮的库与流：输入（化肥、生物固氮、大气沉降）、土壤内部的矿化与硝化、作物吸收与收获带走，以及氨挥发、反硝化、淋洗三条流失路径。</desc>
  <rect width="860" height="560" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">农业生态系统的氮循环示意</text>

  <!-- 大气氮库 -->
  <rect x="300" y="52" width="260" height="60" rx="10" fill="#e8eef0" stroke="#1f6f8b" stroke-width="2"/>
  <text x="430" y="78" text-anchor="middle" font-size="16" fill="#333">大气氮库</text>
  <text x="430" y="98" text-anchor="middle" font-size="13" fill="#1f6f8b">N₂ · NH₃ · N₂O</text>

  <!-- 作物 -->
  <rect x="590" y="52" width="220" height="60" rx="10" fill="#f7f3e8" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="78" text-anchor="middle" font-size="16" fill="#333">作物（籽粒）</text>
  <text x="700" y="98" text-anchor="middle" font-size="13" fill="#c0392b">收获带走 → 离开农田</text>

  <!-- 土壤三库 -->
  <rect x="60" y="220" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="160" y="252" text-anchor="middle" font-size="16" fill="#333">土壤有机氮</text>
  <text x="160" y="272" text-anchor="middle" font-size="13" fill="#555">缓释 · 储备库</text>

  <rect x="300" y="220" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="400" y="252" text-anchor="middle" font-size="16" fill="#333">铵态氮 NH₄⁺</text>
  <text x="400" y="272" text-anchor="middle" font-size="13" fill="#555">易挥发 · 易吸附</text>

  <rect x="540" y="220" width="200" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="640" y="252" text-anchor="middle" font-size="16" fill="#333">硝态氮 NO₃⁻</text>
  <text x="640" y="272" text-anchor="middle" font-size="13" fill="#555">易移动 · 易淋洗</text>

  <!-- 地下水 -->
  <rect x="540" y="480" width="200" height="46" rx="10" fill="#dcebf2" stroke="#1f6f8b" stroke-width="2"/>
  <text x="640" y="508" text-anchor="middle" font-size="15" fill="#1f6f8b">地下水 · 硝酸盐污染</text>

  <!-- 内部转化 -->
  <line x1="260" y1="255" x2="298" y2="255" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="279" y="245" text-anchor="middle" font-size="13" fill="#333">矿化</text>

  <line x1="500" y1="255" x2="538" y2="255" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="519" y="245" text-anchor="middle" font-size="13" fill="#333">硝化</text>

  <!-- 输入 -->
  <line x1="390" y1="112" x2="180" y2="218" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="250" y="150" text-anchor="middle" font-size="13" fill="#1f6f8b">生物固氮 · 大气沉降</text>

  <line x1="20" y1="255" x2="58" y2="255" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="40" y="240" font-size="13" fill="#1f6f8b">化肥</text>
  <text x="40" y="278" font-size="13" fill="#1f6f8b">（工业固氮）</text>

  <line x1="160" y1="330" x2="160" y2="292" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="175" y="320" font-size="13" fill="#1f6f8b">有机肥 · 还田</text>

  <!-- 作物吸收 -->
  <line x1="400" y1="218" x2="660" y2="114" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="180" text-anchor="middle" font-size="13" fill="#333">作物吸收</text>

  <line x1="640" y1="218" x2="700" y2="114" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 流失：红 -->
  <line x1="400" y1="112" x2="400" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="415" y="170" font-size="13" fill="#c0392b">氨挥发 NH₃</text>

  <line x1="490" y1="112" x2="610" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="570" y="175" font-size="13" fill="#c0392b">反硝化 N₂O / N₂</text>

  <line x1="640" y1="292" x2="640" y2="478" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="655" y="400" font-size="13" fill="#c0392b">淋洗 NO₃⁻</text>

  <text x="430" y="545" text-anchor="middle" font-size="13" fill="#555">蓝色＝输入　黑色＝循环/吸收　红色＝流失（环境污染的通道）</text>
</svg>
