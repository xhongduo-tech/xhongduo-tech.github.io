<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>日光温室剖面示意</title>
  <desc>温室由透光覆盖层、拱形骨架、顶通风窗、加热管与栽培床构成。太阳短波辐射穿透覆盖层加热地面与作物，再以长波辐射被覆盖层阻挡在室内，形成温室效应；顶窗排走过剩热量，底部加热管补充夜间地温。</desc>
  <rect width="700" height="430" fill="#faf9f5"/>
  <!-- sun -->
  <circle cx="85" cy="60" r="34" fill="#f6c453"/>
  <!-- sun rays (shortwave in) -->
  <g stroke="#f6c453" stroke-width="4" stroke-dasharray="8 6" fill="none">
    <line x1="145" y1="70" x2="250" y2="130"/>
    <line x1="150" y1="115" x2="275" y2="160"/>
    <line x1="175" y1="50" x2="330" y2="110"/>
    <line x1="195" y1="95" x2="385" y2="145"/>
  </g>
  <!-- greenhouse arch (semicircle r=180, center 300,230) -->
  <path d="M120 390 L120 230 A 180 180 0 0 1 480 230 L480 390 Z" fill="none" stroke="#1f6f8b" stroke-width="6"/>
  <!-- inner glass line -->
  <path d="M132 390 L132 231 A 172 172 0 0 1 468 231 L468 390" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- top vent open -->
  <rect x="278" y="46" width="56" height="9" rx="4" fill="#c0392b"/>
  <line x1="306" y1="55" x2="306" y2="150" stroke="#c0392b" stroke-width="3"/>
  <text x="330" y="52" font-size="15" fill="#c0392b">顶窗开</text>
  <!-- side vent -->
  <rect x="456" y="300" width="9" height="46" fill="#c0392b"/>
  <!-- ground -->
  <line x1="60" y1="390" x2="640" y2="390" stroke="#333" stroke-width="4"/>
  <!-- planting bed -->
  <rect x="205" y="378" width="250" height="12" fill="#8b7355"/>
  <!-- plants -->
  <g fill="#3f7d4e">
    <path d="M235 386 Q230 346 219 322 Q241 342 247 368 Z"/>
    <path d="M315 386 Q312 348 302 328 Q322 344 325 366 Z"/>
    <path d="M400 386 Q395 348 386 330 Q406 346 410 368 Z"/>
  </g>
  <!-- heating pipe -->
  <rect x="150" y="362" width="400" height="10" rx="5" fill="#c0392b"/>
  <!-- long-wave blocked label on cover -->
  <path d="M120 230 A 180 180 0 0 1 480 230" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 5"/>
  <!-- labels -->
  <text x="46" y="122" font-size="16" fill="#333">阳光</text>
  <text x="44" y="150" font-size="15" fill="#333">短波进</text>
  <text x="22" y="176" font-size="15" fill="#c0392b">长波出不去</text>
  <text x="500" y="140" font-size="15" fill="#1f6f8b">透光覆盖层</text>
  <text x="500" y="310" font-size="15" fill="#333">侧墙</text>
  <text x="20" y="368" font-size="15" fill="#c0392b">加热管</text>
  <text x="470" y="416" font-size="15" fill="#333">地面 · 地温</text>
  <text x="208" y="414" font-size="15" fill="#3f7d4e">栽培床（基质）</text>
</svg>
