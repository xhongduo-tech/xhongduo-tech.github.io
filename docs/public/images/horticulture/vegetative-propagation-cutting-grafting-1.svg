<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title>扦插生根与嫁接愈合示意图</title>
<desc>左图为茎插条：插条上部保留叶片，基部皮层内长出不定根并伸出土面；右图为嫁接：接穗与砧木的形成层对齐，接口处形成愈伤组织并连通维管束。</desc>
<rect width="640" height="380" fill="#faf9f5"/>

<!-- 图一标题 -->
<text x="160" y="40" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">扦插</text>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">嫁接</text>

<!-- 扦插：插条 -->
<rect x="130" y="70" width="34" height="170" rx="6" fill="#8d6e63"/>
<rect x="128" y="236" width="38" height="6" fill="#6d4c41"/>

<!-- 插条上的叶片 -->
<path d="M147 90 q -55 -10 -70 -40 q 45 8 70 34 z" fill="#7a9e4f"/>
<path d="M147 90 q 55 -10 70 -40 q -45 8 -70 34 z" fill="#6d9441"/>
<path d="M147 120 q -45 4 -60 -24 q 40 6 60 20 z" fill="#8ab25e"/>

<!-- 不定根 -->
<path d="M133 238 q -16 26 -22 60" stroke="#5d4037" stroke-width="5" fill="none"/>
<path d="M143 240 q -6 30 -8 62" stroke="#5d4037" stroke-width="5" fill="none"/>
<path d="M153 238 q 6 30 8 62" stroke="#5d4037" stroke-width="5" fill="none"/>
<path d="M162 238 q 18 24 24 56" stroke="#5d4037" stroke-width="5" fill="none"/>
<path d="M140 300 q -20 14 -30 20" stroke="#5d4037" stroke-width="4" fill="none"/>
<path d="M152 305 q -2 20 -4 28" stroke="#5d4037" stroke-width="4" fill="none"/>
<path d="M164 300 q 16 14 24 20" stroke="#5d4037" stroke-width="4" fill="none"/>

<!-- 土层 -->
<line x1="60" y1="310" x2="280" y2="310" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
<text x="170" y="330" font-size="14" fill="#333" text-anchor="middle">土层</text>

<text x="170" y="62" font-size="14" fill="#1f6f8b" text-anchor="middle">插条（茎段）</text>
<text x="170" y="352" font-size="14" fill="#c0392b" text-anchor="middle">不定根（皮层内分化）</text>
<path d="M140 236 L160 232" stroke="#c0392b" stroke-width="2"/>
<circle cx="152" cy="234" r="3" fill="#c0392b"/>

<!-- 图二：嫁接 -->
<rect x="440" y="150" width="60" height="190" rx="6" fill="#8d6e63"/>
<text x="470" y="262" font-size="14" fill="#333" text-anchor="middle">砧木</text>

<rect x="428" y="70" width="72" height="90" rx="6" fill="#a1887f"/>
<text x="464" y="120" font-size="14" fill="#333" text-anchor="middle">接穗</text>

<!-- 接口 / 愈伤组织 -->
<ellipse cx="464" cy="152" rx="40" ry="14" fill="#c0392b" opacity="0.85"/>
<text x="464" y="186" font-size="14" fill="#c0392b" text-anchor="middle">愈伤组织（愈合）</text>

<!-- 形成层虚线（对齐示意） -->
<line x1="452" y1="88" x2="452" y2="140" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="5 4"/>
<line x1="452" y1="160" x2="452" y2="320" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="5 4"/>
<text x="500" y="100" font-size="14" fill="#1f6f8b" text-anchor="start">形成层</text>
<text x="500" y="322" font-size="14" fill="#1f6f8b" text-anchor="start">形成层对齐</text>
<line x1="486" y1="112" x2="498" y2="104" stroke="#1f6f8b" stroke-width="2"/>
<line x1="486" y1="312" x2="498" y2="320" stroke="#1f6f8b" stroke-width="2"/>

<!-- 接穗芽 -->
<circle cx="428" cy="98" r="6" fill="#6d9441"/>
<path d="M428 92 q -4 -12 4 -16 q 2 10 4 14 z" fill="#7a9e4f"/>

<!-- 左→右 连接语 -->
<path d="M300 190 l30 0 l0 8 l34 -8 l-34 -8 l0 8" fill="none" stroke="#333" stroke-width="2"/>
</svg>
