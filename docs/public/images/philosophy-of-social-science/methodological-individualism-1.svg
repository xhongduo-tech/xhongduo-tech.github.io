<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <title>科尔曼船：宏观与微观的桥</title>
  <desc>科尔曼船示意图：社会结构经个体信念、个体行动，再汇聚为宏观社会结果，完整解释必须穿过微观层面。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>

  <!-- 宏观左：社会结构 -->
  <rect x="40" y="40" width="220" height="90" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold">宏观：社会结构</tspan></text>
  <text x="150" y="100" text-anchor="middle" font-size="14" fill="#333">制度 · 规范 · 市场结构</text>
  <text x="150" y="120" text-anchor="middle" font-size="13" fill="#666">例：新教伦理的环境</text>

  <!-- 宏观右：社会结果 -->
  <rect x="380" y="40" width="220" height="90" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="490" y="75" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold">宏观：社会结果</tspan></text>
  <text x="490" y="100" text-anchor="middle" font-size="14" fill="#333">集体行为 · 制度变迁</text>
  <text x="490" y="120" text-anchor="middle" font-size="13" fill="#666">例：资本主义的发展</text>

  <!-- 微观左：个体处境 -->
  <rect x="40" y="250" width="220" height="90" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="150" y="285" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold">微观：个体信念</tspan></text>
  <text x="150" y="310" text-anchor="middle" font-size="14" fill="#333">价值观 · 偏好 · 信息</text>
  <text x="150" y="330" text-anchor="middle" font-size="13" fill="#666">例：勤奋工作、节俭</text>

  <!-- 微观右：个体行动 -->
  <rect x="380" y="250" width="220" height="90" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="490" y="285" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold">微观：个体行动</tspan></text>
  <text x="490" y="310" text-anchor="middle" font-size="14" fill="#333">选择 · 行动 · 互动</text>
  <text x="490" y="330" text-anchor="middle" font-size="13" fill="#666">例：积累财富、经营</text>

  <!-- 箭头 1：宏观→微观 -->
  <path d="M150 130 L150 240" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="170" y="190" font-size="14" fill="#c0392b">① 结构→信念</text>

  <!-- 箭头 2：微观→微观 -->
  <path d="M260 295 L370 295" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="315" y="285" text-anchor="middle" font-size="14" fill="#c0392b">② 信念→行动</text>

  <!-- 箭头 3：微观→宏观 -->
  <path d="M490 250 L490 140" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="505" y="200" font-size="14" fill="#c0392b">③ 汇聚→结果</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
