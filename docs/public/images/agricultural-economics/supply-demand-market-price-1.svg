<svg viewBox="0 0 500 375" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>蛛网模型价格振荡示意图（收敛情形）</title>
<desc>价格 P 为纵轴、数量 Q 为横轴的供求图。需求曲线自上而下，供给曲线自下而上且比需求曲线更陡，二者交于均衡点 E。折线从供给线上的一点开始，沿垂直到达需求线、再水平到供给线、再垂直……形成一圈圈向内收缩的螺旋，表示价格与数量逐期振荡并收敛到均衡。</desc>
<rect x="0" y="0" width="500" height="375" fill="#faf9f5"/>
<!-- axes -->
<line x1="70" y1="50" x2="70" y2="330" stroke="#333" stroke-width="2"/>
<line x1="70" y1="330" x2="470" y2="330" stroke="#333" stroke-width="2"/>
<text x="30" y="60" font-family="sans-serif" font-size="15" fill="#333">P 价格</text>
<text x="452" y="348" font-family="sans-serif" font-size="15" fill="#333">Q 数量</text>
<!-- demand and supply lines -->
<line x1="120" y1="90" x2="450" y2="300" stroke="#c0392b" stroke-width="2.5"/>
<line x1="110" y1="320" x2="430" y2="90" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="128" y="82" font-family="sans-serif" font-size="15" fill="#c0392b">需求 D</text>
<text x="408" y="82" font-family="sans-serif" font-size="15" fill="#1f6f8b">供给 S</text>
<!-- equilibrium -->
<circle cx="284" cy="195" r="4.5" fill="#333"/>
<text x="292" y="188" font-family="sans-serif" font-size="14" fill="#333">均衡 E</text>
<!-- cobweb spiral -->
<polyline points="193,260 193,137 365,137 365,246 213,246 213,149 347,149 347,234"
  fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="150" y="272" font-family="sans-serif" font-size="14" fill="#333">P₀</text>
<text x="150" y="130" font-family="sans-serif" font-size="14" fill="#333">P₁</text>
<text x="376" y="246" font-family="sans-serif" font-size="14" fill="#333">P₂</text>
<text x="190" y="155" font-family="sans-serif" font-size="14" fill="#333">P₃</text>
<text x="200" y="110" font-family="sans-serif" font-size="13" fill="#666">价格逐期振荡并收敛</text>
</svg>
