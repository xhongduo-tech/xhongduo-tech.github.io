<svg viewBox="0 0 640 400" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>中国木构的关节——斗拱</title>
  <desc>示意图展示中国木构建筑中斗拱的位置与结构：屋顶的大屋顶压在层层交错的斗与拱上，斗拱把屋顶重量均匀传导到柱身与地基。</desc>

  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="320" y="30" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">中国木构的关节——斗拱</text>

  <!-- 屋顶 -->
  <path d="M 90 80 Q 320 58 550 80 L 560 92 L 540 92 L 540 86 Q 320 68 100 86 L 100 92 L 80 92 Z" fill="#c0392b" opacity="0.85"/>
  <text x="320" y="72" font-size="14" fill="#fff" text-anchor="middle">大屋顶（檐）</text>

  <!-- 斗拱层：三层 -->
  <!-- 第三层（最顶） -->
  <g>
    <rect x="270" y="96" width="100" height="14" fill="#1f6f8b"/>
    <rect x="250" y="110" width="24" height="18" fill="#333" opacity="0.85"/>
    <rect x="366" y="110" width="24" height="18" fill="#333" opacity="0.85"/>
  </g>
  <!-- 第二层 -->
  <g>
    <rect x="290" y="132" width="60" height="14" fill="#1f6f8b"/>
    <rect x="270" y="146" width="22" height="16" fill="#333" opacity="0.85"/>
    <rect x="348" y="146" width="22" height="16" fill="#333" opacity="0.85"/>
  </g>
  <!-- 第一层（最底，坐于柱头） -->
  <g>
    <rect x="300" y="166" width="40" height="14" fill="#1f6f8b"/>
  </g>

  <!-- 柱身 -->
  <rect x="306" y="184" width="28" height="150" fill="#1f6f8b" opacity="0.85"/>
  <rect x="298" y="330" width="44" height="22" fill="#333" opacity="0.6"/>
  <text x="320" y="388" font-size="14" fill="#333" text-anchor="middle">柱础（地基）</text>

  <!-- 标注：斗与拱 -->
  <line x1="250" y1="119" x2="150" y2="150" stroke="#c0392b" stroke-width="1.2"/>
  <text x="60" y="160" font-size="14" fill="#c0392b">斗（方形垫块）</text>

  <line x1="378" y1="103" x2="500" y2="130" stroke="#1f6f8b" stroke-width="1.2"/>
  <text x="452" y="142" font-size="14" fill="#1f6f8b">拱（弓形承托）</text>

  <line x1="340" y1="173" x2="500" y2="200" stroke="#333" stroke-width="1.2"/>
  <text x="452" y="214" font-size="14" fill="#333">柱（承重）</text>

  <!-- 底部说明 -->
  <text x="320" y="362" font-size="14" fill="#333" text-anchor="middle">斗拱层层交错，把屋顶重量分散到柱身与地基</text>
</svg>
