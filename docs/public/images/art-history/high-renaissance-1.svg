<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>文艺复兴的透视与金字塔构图</title>
  <desc>左图显示《最后的晚餐》式的单点透视：正交线汇聚到灭点（基督头部）；右图显示金字塔构图：以基督为顶点的三角罩住门徒群像。</desc>

  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="320" y="28" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">透视（左）与金字塔构图（右）</text>

  <!-- ===== 左：透视示意图 ===== -->
  <text x="150" y="56" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">单点透视（《最后的晚餐》）</text>

  <g transform="translate(20,64)">
    <!-- 画面框 -->
    <rect x="10" y="10" width="280" height="240" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- 正交线汇聚到灭点 -->
    <g stroke="#1f6f8b" stroke-width="1.5" opacity="0.75">
      <line x1="10" y1="10" x2="150" y2="120"/>
      <line x1="290" y1="10" x2="150" y2="120"/>
      <line x1="10" y1="250" x2="150" y2="120"/>
      <line x1="290" y1="250" x2="150" y2="120"/>
    </g>
    <!-- 地平线 -->
    <line x1="10" y1="120" x2="290" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- 灭点：基督头部 -->
    <circle cx="150" cy="120" r="9" fill="#c0392b"/>
    <text x="150" y="126" font-size="13" fill="#fff" text-anchor="middle">头</text>
    <!-- 顶部标注 -->
    <text x="150" y="34" font-size="13" fill="#1f6f8b" text-anchor="middle">画面 = 透明窗户</text>
    <text x="282" y="118" font-size="13" fill="#c0392b" text-anchor="end">灭点</text>
    <!-- 正交线标注 -->
    <text x="238" y="252" font-size="13" fill="#1f6f8b" text-anchor="start">透视正交线</text>
    <text x="150" y="288" font-size="13" fill="#333" text-anchor="middle">平行线都汇聚向灭点</text>
  </g>

  <!-- ===== 右：金字塔构图示意图 ===== -->
  <text x="490" y="56" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">金字塔构图（圣母像）</text>

  <g transform="translate(350,64)">
    <!-- 画面框 -->
    <rect x="10" y="10" width="280" height="240" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- 三角 -->
    <polygon points="150,60 60,250 240,250" fill="none" stroke="#c0392b" stroke-width="2"/>
    <!-- 顶点：圣母/基督 -->
    <circle cx="150" cy="60" r="9" fill="#c0392b"/>
    <text x="150" y="66" font-size="13" fill="#fff" text-anchor="middle">顶</text>
    <!-- 底边人物示意 -->
    <circle cx="80" cy="250" r="8" fill="#1f6f8b" opacity="0.8"/>
    <circle cx="150" cy="250" r="8" fill="#1f6f8b" opacity="0.8"/>
    <circle cx="220" cy="250" r="8" fill="#1f6f8b" opacity="0.8"/>
    <!-- 标注 -->
    <text x="150" y="44" font-size="13" fill="#c0392b" text-anchor="middle">基督（顶点）</text>
    <text x="243" y="170" font-size="13" fill="#c0392b" text-anchor="start">三角</text>
    <text x="120" y="292" font-size="13" fill="#1f6f8b" text-anchor="middle">圣徒群像（底边）</text>
    <text x="150" y="318" font-size="13" fill="#333" text-anchor="middle">三角带来稳定与神圣</text>
  </g>
</svg>
