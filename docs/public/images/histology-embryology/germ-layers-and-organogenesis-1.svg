<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="title desc">
  <title id="title">原肠胚形成：从二胚层胚盘到三胚层</title>
  <desc id="desc">三幅示意图从左到右展示原肠胚形成：二胚层胚盘的上胚层细胞经原条迁入下胚层形成内胚层，并在两层之间形成中胚层，最终形成外胚层、中胚层、内胚层三个胚层。</desc>
  <rect x="0" y="0" width="800" height="430" fill="#faf9f5"/>

  <!-- Panel 1 -->
  <g>
    <text x="120" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">① 二胚层胚盘（第 2 周末）</text>
    <rect x="30" y="55" width="180" height="26" rx="4" fill="#e8d8b8" stroke="#333" stroke-width="2"/>
    <text x="120" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">羊膜腔底 · 上胚层</text>
    <rect x="30" y="92" width="180" height="26" rx="4" fill="#b8d0d8" stroke="#333" stroke-width="2"/>
    <text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">下胚层</text>
    <rect x="30" y="128" width="180" height="26" rx="4" fill="#d8cfb8" stroke="#333" stroke-width="2"/>
    <text x="120" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">卵黄囊顶</text>
    <!-- primitive streak mark -->
    <line x1="205" y1="58" x2="205" y2="115" stroke="#c0392b" stroke-width="3"/>
    <text x="228" y="92" font-family="sans-serif" font-size="13" fill="#c0392b">原条</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#1f6f8b" stroke-width="3" fill="#1f6f8b">
    <path d="M225 90 L270 90" marker-end="url(#arrow1)"/>
  </g>

  <!-- Panel 2 -->
  <g>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">② 上胚层细胞经原条迁入（第 3 周）</text>
    <rect x="290" y="55" width="220" height="24" rx="4" fill="#e8d8b8" stroke="#333" stroke-width="2"/>
    <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">上胚层</text>
    <!-- migration arrows -->
    <g stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow2)">
      <path d="M360 55 Q 330 80 340 110" fill="none"/>
      <path d="M420 55 Q 455 80 445 110" fill="none"/>
    </g>
    <!-- mesoderm forming -->
    <rect x="290" y="100" width="220" height="18" rx="3" fill="#d8c8b0" stroke="#333" stroke-width="2"/>
    <text x="560" y="115" font-family="sans-serif" font-size="13" fill="#333">新形成的</text>
    <text x="560" y="131" font-family="sans-serif" font-size="13" fill="#333">内胚层</text>
    <!-- endoderm (hypoblast replaced) -->
    <rect x="290" y="128" width="220" height="20" rx="3" fill="#b8d0d8" stroke="#333" stroke-width="2"/>
    <text x="560" y="92" font-family="sans-serif" font-size="13" fill="#333">新形成的</text>
    <text x="560" y="108" font-family="sans-serif" font-size="13" fill="#333">中胚层</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#1f6f8b" stroke-width="3">
    <line x1="525" y1="90" x2="575" y2="90" marker-end="url(#arrow1)"/>
  </g>

  <!-- Panel 3 -->
  <g>
    <text x="680" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">③ 三胚层胚盘</text>
    <rect x="600" y="55" width="160" height="24" rx="4" fill="#e8d8b8" stroke="#333" stroke-width="2"/>
    <text x="680" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">外胚层</text>
    <rect x="600" y="90" width="160" height="24" rx="4" fill="#d8c8b0" stroke="#333" stroke-width="2"/>
    <text x="680" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">中胚层</text>
    <rect x="600" y="125" width="160" height="24" rx="4" fill="#b8d0d8" stroke="#333" stroke-width="2"/>
    <text x="680" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">内胚层</text>
  </g>

  <!-- derivatives -->
  <g font-family="sans-serif" font-size="13" fill="#333">
    <text x="680" y="190" text-anchor="middle">外胚层 → 表皮、神经系统</text>
    <text x="680" y="212" text-anchor="middle">中胚层 → 肌肉、骨、循环、泌尿</text>
    <text x="680" y="234" text-anchor="middle">内胚层 → 消化、呼吸的上皮</text>
  </g>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
