<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>冷却路径与封闭温度（t–T 图）</title>
  <desc>温度–时间图：地壳岩石从 900°C 缓慢冷却并在地表加速剥露，水平虚线标出各体系的封闭温度，岩石冷却穿过每一条虚线时，对应定年体系给出一个「冷却年龄」。</desc>
  <rect width="460" height="380" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="60" y1="320" x2="420" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="320" x2="60" y2="30" stroke="#333" stroke-width="2"/>
  <polygon points="420,320 412,316 412,324" fill="#333"/>
  <polygon points="60,30 56,38 64,38" fill="#333"/>
  <!-- closure temperature lines -->
  <line x1="60" y1="62" x2="420" y2="62" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="74" x2="420" y2="74" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="115" x2="420" y2="115" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="149" x2="420" y2="149" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="320" x2="420" y2="320" stroke="#999" stroke-width="1"/>
  <!-- cooling path -->
  <polyline points="60,320 145,230 230,150 315,85 400,45" fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- crossing points -->
  <circle cx="60" cy="320" r="5" fill="#333"/>
  <circle cx="230" cy="150" r="5" fill="#333"/>
  <circle cx="276" cy="115" r="5" fill="#333"/>
  <circle cx="338" cy="74" r="5" fill="#333"/>
  <circle cx="364" cy="62" r="5" fill="#333"/>
  <!-- closure labels (right side) -->
  <text x="424" y="66" font-family="sans-serif" font-size="13" fill="#666">(U–Th)/He 磷灰石 ~70°C</text>
  <text x="424" y="79" font-family="sans-serif" font-size="13" fill="#666">裂变径迹 磷灰石 ~110°C</text>
  <text x="424" y="120" font-family="sans-serif" font-size="13" fill="#666">裂变径迹 锆石 ~240°C</text>
  <text x="424" y="154" font-family="sans-serif" font-size="13" fill="#666">Ar 黑云母 ~350°C</text>
  <text x="424" y="325" font-family="sans-serif" font-size="13" fill="#666">U–Pb 锆石 ~900°C</text>
  <!-- age labels under crossing points -->
  <text x="60" y="342" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">4.0 Ga</text>
  <text x="230" y="342" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">2.0 Ga</text>
  <text x="276" y="342" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">1.5 Ga</text>
  <text x="338" y="342" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">0.7 Ga</text>
  <text x="364" y="342" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">0.4 Ga</text>
  <!-- cooling arrow -->
  <text x="300" y="200" font-family="sans-serif" font-size="14" fill="#c0392b">冷却路径</text>
  <text x="300" y="217" font-family="sans-serif" font-size="13" fill="#666">剥露加速 → 曲线变陡</text>
  <!-- axis labels -->
  <text x="420" y="355" font-family="sans-serif" font-size="15" fill="#333" text-anchor="end">时间（Ga，距今）</text>
  <text x="30" y="175" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 30 175)">温度（°C）</text>
  <text x="66" y="44" font-family="sans-serif" font-size="12" fill="#333">0°C</text>
</svg>
