<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>基底节直接与间接通路</title>
  <desc>皮质—纹状体—苍白球—丘脑环路，直接通路促进运动、间接通路抑制运动，多巴胺调节两条通路。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">基底节环路：直接通路与间接通路</text>

  <!-- 皮质 -->
  <rect x="210" y="45" width="220" height="40" rx="6" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#333">大脑皮质（辅助运动区）</text>

  <!-- 纹状体 -->
  <rect x="210" y="150" width="220" height="40" rx="6" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
  <text x="320" y="175" text-anchor="middle" font-size="14" fill="#333">纹状体（壳核）</text>

  <!-- 丘脑 -->
  <rect x="210" y="330" width="220" height="40" rx="6" fill="#1f6f8b" opacity="0.15" stroke="#1f6f8b"/>
  <text x="320" y="355" text-anchor="middle" font-size="14" fill="#333">丘脑（VA/VL）</text>

  <!-- 直接通路 -->
  <line x1="320" y1="85" x2="320" y2="150" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="335" y="120" font-size="12" fill="#1f6f8b">兴奋性</text>
  <path d="M 320 190 L 500 230 L 500 330 L 390 350" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#1f6f8b">直接通路（促进）</text>
  <text x="500" y="232" text-anchor="middle" font-size="12" fill="#c0392b">Gpi 抑制 → 去抑制</text>
  <circle cx="500" cy="250" r="16" fill="#faf9f5" stroke="#1f6f8b"/>
  <text x="500" y="255" text-anchor="middle" font-size="13" fill="#1f6f8b">Gpi</text>
  <circle cx="320" cy="250" r="16" fill="#faf9f5" stroke="#1f6f8b"/>
  <text x="320" y="255" text-anchor="middle" font-size="13" fill="#1f6f8b">STN</text>

  <!-- 间接通路 -->
  <path d="M 320 190 L 150 230 L 150 330 L 250 350" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="150" y="215" text-anchor="middle" font-size="12" fill="#c0392b">间接通路（抑制）</text>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#c0392b">STN → Gpi → 丘脑被抑</text>
  <line x1="320" y1="255" x2="320" y2="330" stroke="#333" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr2)"/>

  <!-- 黑质 -->
  <rect x="60" y="165" width="120" height="34" rx="6" fill="#c0392b" opacity="0.12" stroke="#c0392b"/>
  <text x="120" y="186" text-anchor="middle" font-size="12" fill="#c0392b">黑质 SNc</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#c0392b">多巴胺</text>
  <path d="M 180 185 L 205 175" stroke="#c0392b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="185" y="210" font-size="11" fill="#c0392b">D1 兴奋/ D2 抑制</text>

  <!-- 丘脑回到皮质 -->
  <line x1="320" y1="330" x2="320" y2="290" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="310" font-size="12" fill="#1f6f8b">回皮质</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f6f8b"/></marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>

  <text x="320" y="398" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">帕金森病：多巴胺丢失 → 直接通路弱 + 间接通路强 → 运动「刹车」</text>
</svg>
