<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>脑干三个水平横断面与交叉体征</title>
  <desc>中脑、脑桥、延髓三个横断面的脑神经核与传导束，说明交叉性体征的来源。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">脑干三水平 · 交叉性体征从何而来</text>

  <!-- 中脑横断面 -->
  <g>
    <ellipse cx="170" cy="120" rx="95" ry="70" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
    <text x="170" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">中脑 midbrain</text>
    <circle cx="150" cy="105" r="10" fill="#c0392b" opacity="0.85"/>
    <text x="150" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">III</text>
    <text x="150" y="130" text-anchor="middle" font-size="12" fill="#333">动眼神经核</text>
    <rect x="120" y="145" width="40" height="12" rx="2" fill="#c0392b"/>
    <text x="140" y="172" text-anchor="middle" font-size="12" fill="#333">皮质脊髓束（已交叉·同侧下行）</text>
    <text x="170" y="210" text-anchor="middle" font-size="12" fill="#c0392b">Weber 综合征：同侧 III 麻痹 + 对侧偏瘫</text>
  </g>

  <!-- 脑桥横断面 -->
  <g>
    <ellipse cx="320" cy="120" rx="95" ry="70" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
    <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">脑桥 pons</text>
    <circle cx="300" cy="100" r="9" fill="#c0392b" opacity="0.85"/>
    <text x="300" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">VI</text>
    <circle cx="340" cy="100" r="9" fill="#c0392b" opacity="0.85"/>
    <text x="340" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">VII</text>
    <text x="320" y="126" text-anchor="middle" font-size="12" fill="#333">外展/面神经核 + 水平凝视中枢</text>
    <rect x="278" y="140" width="40" height="12" rx="2" fill="#c0392b"/>
    <text x="298" y="167" text-anchor="middle" font-size="12" fill="#333">皮质脊髓束</text>
    <text x="320" y="210" text-anchor="middle" font-size="12" fill="#c0392b">Millard-Gubler：同侧 VI+VII 麻痹 + 对侧偏瘫</text>
  </g>

  <!-- 延髓横断面 -->
  <g>
    <ellipse cx="480" cy="120" rx="95" ry="70" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
    <text x="480" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">延髓 medulla</text>
    <circle cx="460" cy="102" r="9" fill="#c0392b" opacity="0.85"/>
    <text x="460" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">IX/X</text>
    <text x="480" y="124" text-anchor="middle" font-size="12" fill="#333">疑核 + 前庭核 + 脊髓丘脑束</text>
    <rect x="450" y="140" width="40" height="12" rx="2" fill="#c0392b"/>
    <text x="470" y="167" text-anchor="middle" font-size="12" fill="#333">锥体交叉区</text>
    <text x="480" y="210" text-anchor="middle" font-size="12" fill="#c0392b">Wallenberg：Horner + 交叉性痛温觉分离</text>
  </g>

  <!-- 底部结论 -->
  <line x1="40" y1="250" x2="600" y2="250" stroke="#333" stroke-width="1"/>
  <text x="320" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">交叉体征 = 同侧脑神经 + 对侧肢体</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#333">传导束在延髓锥体交叉换边，神经核/神经干不出脑干</text>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#1f6f8b">先定水平（哪对脑神经），再定偏侧（哪侧肢体）→ 病灶节段锁定</text>
  <text x="320" y="350" text-anchor="middle" font-size="13" fill="#c0392b">红色警报：瞳孔散大固定 + 复视 + 头痛 → 动眼神经外压（动脉瘤/脑疝）</text>
</svg>
