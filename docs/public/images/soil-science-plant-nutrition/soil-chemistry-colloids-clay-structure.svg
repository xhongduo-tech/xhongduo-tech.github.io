<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <title>1:1 与 2:1 型硅酸盐黏土矿物的层状结构</title>
  <desc>左图为 1:1 型高岭石：一层硅氧四面体片紧贴一层铝氧八面体片，层间无间隙；右图为 2:1 型蒙脱石：铝氧八面体片夹在两层硅氧四面体片之间，层间存在可吸附水分与阳离子的空隙。</desc>
  <rect x="0" y="0" width="680" height="300" fill="#faf9f5"/>

  <text x="170" y="30" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">1:1 型 · 高岭石</text>
  <text x="170" y="48" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">层间无空隙，吸附与膨胀弱</text>

  <!-- 1:1 left panel: two sheets, tight -->
  <rect x="60" y="70" width="220" height="46" rx="4" fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
  <text x="170" y="97" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">硅氧四面体片</text>

  <rect x="60" y="120" width="220" height="46" rx="4" fill="#c0392b" opacity="0.30" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="147" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">铝氧八面体片</text>

  <rect x="60" y="170" width="220" height="46" rx="4" fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
  <text x="170" y="197" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">硅氧四面体片（相邻晶层）</text>
  <text x="170" y="235" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">晶层间以氢键 + 强吸附紧密结合</text>

  <!-- 2:1 right panel -->
  <text x="505" y="30" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">2:1 型 · 蒙脱石</text>
  <text x="505" y="48" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">层间有可膨胀空隙，CEC 高</text>

  <rect x="395" y="60" width="220" height="40" rx="4" fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
  <text x="505" y="84" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">硅氧四面体片</text>

  <rect x="395" y="104" width="220" height="40" rx="4" fill="#c0392b" opacity="0.30" stroke="#c0392b" stroke-width="2"/>
  <text x="505" y="128" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">铝氧八面体片</text>

  <rect x="395" y="148" width="220" height="40" rx="4" fill="#1f6f8b" opacity="0.35" stroke="#1f6f8b" stroke-width="2"/>
  <text x="505" y="172" font-family="sans-serif" font-size="14" fill="#1f6f8b" text-anchor="middle">硅氧四面体片</text>

  <rect x="395" y="192" width="220" height="34" rx="4" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="505" y="212" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">层间：水 + 可交换阳离子</text>

  <text x="505" y="258" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">干湿交替时层间可胀缩（Vertisol 的根源）</text>
</svg>
