<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
  <title>菌根菌丝越过磷亏缺带扩大吸收范围</title>
  <desc>根系周围因快速吸收磷而在土壤中形成磷亏缺带；丛枝菌根真菌的根外菌丝穿越亏缺带延伸进入未耗竭土壤，把磷运回根内，相当于扩大了根系的吸收半径。</desc>
  <rect x="0" y="0" width="680" height="320" fill="#faf9f5"/>

  <text x="340" y="26" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">根际磷亏缺带与菌根菌丝的补救</text>

  <!-- root (left) -->
  <rect x="40" y="90" width="130" height="130" rx="40" fill="#c0392b" opacity="0.25" stroke="#c0392b" stroke-width="3"/>
  <text x="105" y="140" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">根</text>
  <text x="105" y="162" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">（快速吸磷）</text>

  <!-- depletion zone ring -->
  <ellipse cx="105" cy="155" rx="205" ry="150" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="105" y="310" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">磷亏缺带边界</text>

  <!-- low P region label -->
  <text x="285" y="120" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">亏缺带：磷浓度低</text>
  <!-- high P region -->
  <text x="560" y="60" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">亏缺带之外：磷充足</text>

  <!-- AM hypha going out -->
  <path d="M 170 100 Q 300 60 540 90" stroke="#1f6f8b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 170 120 Q 330 140 560 150" stroke="#1f6f8b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- vesicle/arbuscule dots along hyphae -->
  <circle cx="300" cy="73" r="6" fill="#1f6f8b"/>
  <circle cx="420" cy="88" r="6" fill="#1f6f8b"/>
  <circle cx="330" cy="132" r="6" fill="#1f6f8b"/>
  <circle cx="470" cy="144" r="6" fill="#1f6f8b"/>

  <text x="300" y="195" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">根外菌丝：越过亏缺带</text>
  <text x="300" y="215" font-family="sans-serif" font-size="13" fill="#1f6f8b" text-anchor="middle">把磷运回根内</text>

  <!-- nutrient symbols in far region -->
  <text x="555" y="120" font-family="sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle">P</text>
  <text x="555" y="170" font-family="sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle">P</text>
  <text x="600" y="230" font-family="sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle">P</text>
  <text x="500" y="250" font-family="sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle">P</text>

  <text x="340" y="295" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">扩散慢 → 磷亏缺带窄；菌丝相当于把「吸收半径」从 1 cm 扩大到了数 cm 以上</text>
</svg>
