<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>马尔萨斯陷阱：人口与真实工资的均衡</title>
  <desc>示意图：真实工资随人口规模递减的曲线与生存工资线的交点构成马尔萨斯均衡；实际工资高于均衡时人口扩张、压低工资，低于均衡时人口收缩、抬高工资。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" font-size="17" text-anchor="middle" fill="#333" font-weight="bold">马尔萨斯陷阱：工资-人口均衡</text>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="360" stroke="#333" stroke-width="2"/>
  <text x="600" y="392" font-size="14" text-anchor="end" fill="#333">人口规模 P →</text>
  <text x="40" y="200" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90 40 200)">真实工资 w →</text>
  <line x1="80" y1="150" x2="600" y2="150" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="560" y="140" font-size="14" text-anchor="end" fill="#c0392b">生存工资 s（长期均衡线）</text>
  <path d="M 100 250 Q 320 175 580 92" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="560" y="300" font-size="14" text-anchor="end" fill="#1f6f8b">w(P)：土地报酬递减 → 人口越多工资越低</text>
  <circle cx="290" cy="180" r="6" fill="#333"/>
  <text x="290" y="168" font-size="14" text-anchor="middle" fill="#333">均衡 P*</text>
  <path d="M 300 170 L 330 190 M 340 196 L 300 178" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="420" y="210" font-size="13" fill="#c0392b">w &gt; s：人口扩张，工资被拉回</text>
  <text x="420" y="230" font-size="13" fill="#c0392b">w &lt; s：饥荒/迟婚，人口收缩</text>
  <text x="120" y="335" font-size="13" fill="#666">现代增长的钥匙：技术进步把 w(P) 曲线上移，均衡工资得以离开生存线</text>
</svg>
