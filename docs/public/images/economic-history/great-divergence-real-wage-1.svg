<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>大分流：伦敦与北京真实工资（示意）</title>
  <desc>示意图：1500–1900 年伦敦与北京福利比率走势，示意两地在 1800 年前后真实工资开始大幅分岔。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" font-size="17" text-anchor="middle" fill="#333" font-weight="bold">大分流：伦敦与北京真实工资（示意）</text>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="360" stroke="#333" stroke-width="2"/>
  <text x="600" y="392" font-size="14" text-anchor="end" fill="#333">年份 →</text>
  <text x="34" y="200" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90 34 200)">福利比率 WR →</text>
  <line x1="80" y1="330" x2="600" y2="330" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="120" y="322" font-size="13" fill="#c0392b">生存线 WR ≈ 1</text>
  <path d="M 80 305 L 200 295 L 300 285 L 390 270 L 450 210 L 510 130 L 580 70" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="520" y="100" font-size="15" fill="#1f6f8b" font-weight="bold">伦敦</text>
  <path d="M 80 320 L 200 318 L 300 316 L 390 314 L 470 318 L 560 316" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="530" y="342" font-size="15" fill="#c0392b" font-weight="bold">北京</text>
  <line x1="390" y1="60" x2="390" y2="360" stroke="#333" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="390" y="378" font-size="13" text-anchor="middle" fill="#333">约 1800</text>
  <text x="180" y="90" font-size="13" fill="#666">分岔前：两者都在生存线附近小幅波动</text>
  <text x="448" y="150" font-size="13" fill="#666">分岔：工业化推高</text>
  <text x="448" y="170" font-size="13" fill="#666">西北欧真实工资</text>
</svg>
