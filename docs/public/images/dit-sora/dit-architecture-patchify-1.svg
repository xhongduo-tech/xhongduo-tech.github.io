<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>DiT 图像生成流水线</title>
<desc>从 latent 输入经 Patch 化、线性嵌入与位置编码得到 token 序列，再经过 L 个 DiT 块与解码器输出预测噪声的流程图；右侧标注条件注入。</desc>
<rect x="0" y="0" width="640" height="560" fill="#faf9f5"/>
<g fill="#ffffff" stroke="#333333" stroke-width="1.5">
<rect x="200" y="20" width="240" height="46" rx="8"/>
<rect x="160" y="112" width="320" height="54" rx="8"/>
<rect x="170" y="212" width="300" height="46" rx="8"/>
<rect x="100" y="330" width="340" height="88" rx="8"/>
<rect x="470" y="350" width="150" height="52" rx="8"/>
<rect x="160" y="462" width="320" height="46" rx="8"/>
</g>
<g fill="#333333" font-size="14" text-anchor="middle">
<text x="320" y="47">输入 latent z（32×32×4）</text>
<text x="320" y="138">Patch 化：切成 p×p 块</text>
<text x="320" y="157">p=2 → N=256 个 patch</text>
<text x="320" y="240">线性嵌入 + 位置编码 → token 序列</text>
<text x="270" y="365">L 个 DiT 块</text>
<text x="270" y="385">（自注意力 + MLP + 残差）</text>
<text x="270" y="405">（含 AdaLN-Zero 条件注入）</text>
<text x="545" y="372">条件 c</text>
<text x="545" y="390">时间步 + 类别嵌入</text>
<text x="320" y="490">LayerNorm → 线性 → unpatchify</text>
</g>
<g stroke="#c0392b" stroke-width="1.2" fill="none">
<rect x="235" y="95" width="60" height="14" rx="3"/>
<rect x="305" y="95" width="60" height="14" rx="3"/>
<rect x="375" y="95" width="60" height="14" rx="3"/>
</g>
<g fill="#c0392b" font-size="13" text-anchor="middle">
<text x="335" y="90">256 个 token</text>
</g>
<g stroke="#333333" stroke-width="1.5" fill="none">
<path d="M 320 66 L 320 110" marker-end="url(#a1)"/>
<path d="M 320 166 L 320 210" marker-end="url(#a1)"/>
<path d="M 320 258 L 320 328" marker-end="url(#a1)"/>
<path d="M 470 376 L 442 376" marker-end="url(#a1)"/>
<path d="M 320 418 L 320 460" marker-end="url(#a1)"/>
</g>
<g fill="#1f6f8b" font-size="14" text-anchor="middle">
<text x="320" y="520">输出：预测噪声 ε_θ</text>
</g>
<rect x="180" y="505" width="280" height="36" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<defs>
<marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#333333"/>
</marker>
</defs>
</svg>
