<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>错误预算示意图</title>
  <desc>上图表示一个月内 99.9% 的时间可用、0.1% 的时间属于错误预算；下图放大错误预算段，展示它被数次发布与实验消费掉</desc>
  <rect width="640" height="300" fill="#faf9f5"/>
  <text x="20" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">错误预算：把可靠性当作可以花掉的货币</text>

  <text x="20" y="76" font-family="sans-serif" font-size="14" fill="#333">一个月 100% 的时间（约 43200 分钟）</text>
  <rect x="60" y="84" width="500" height="36" fill="#1f6f8b"/>
  <rect x="560" y="84" width="20" height="36" fill="#c0392b"/>
  <text x="66" y="106" font-family="sans-serif" font-size="14" fill="#ffffff">可用：99.9% 达标</text>
  <text x="466" y="76" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="end">错误预算 0.1%</text>
  <text x="570" y="142" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">= 每月约 43.2 分钟</text>

  <line x1="570" y1="124" x2="570" y2="214" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="560" y1="124" x2="560" y2="214" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="20" y="204" font-family="sans-serif" font-size="14" fill="#333">放大看错误预算：被一次次日程消费</text>
  <rect x="60" y="214" width="120" height="40" fill="#c0392b"/>
  <rect x="180" y="214" width="2" height="40" fill="#faf9f5"/>
  <rect x="182" y="214" width="142" height="40" fill="#c0392b"/>
  <rect x="324" y="214" width="2" height="40" fill="#faf9f5"/>
  <rect x="326" y="214" width="179" height="40" fill="#c0392b"/>
  <rect x="505" y="214" width="2" height="40" fill="#faf9f5"/>
  <rect x="507" y="214" width="73" height="40" fill="#c0392b"/>

  <text x="120" y="235" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">发布 A</text>
  <text x="120" y="251" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">10 分钟</text>
  <text x="253" y="235" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">实验 B</text>
  <text x="253" y="251" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">12 分钟</text>
  <text x="415" y="235" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">发布 C</text>
  <text x="415" y="251" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">15 分钟</text>
  <text x="543" y="235" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">故障</text>
  <text x="543" y="251" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">6.2 分钟</text>

  <text x="20" y="282" font-family="sans-serif" font-size="13" fill="#666">预算烧光后，新发布被冻结，直到预算“回血”</text>
</svg>
