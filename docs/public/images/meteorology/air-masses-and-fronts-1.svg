<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>冷锋与暖锋垂直剖面示意</title>
<desc>左图为冷锋剖面：冷气团楔入暖气团之下，锋面陡峭，云系为积雨云，降水窄而强；右图为暖锋剖面：暖气团沿平缓锋面爬升，云系层状铺展，降水区宽阔。</desc>
<rect x="0" y="0" width="660" height="360" fill="#ffffff"/>
<!-- 左右分栏线 -->
<line x1="325" y1="30" x2="325" y2="330" stroke="#ccc" stroke-width="1"/>
<!-- ========== 左栏：冷锋 ========== -->
<text x="45" y="46" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">冷锋</text>
<text x="45" y="64" font-family="sans-serif" font-size="13" fill="#666">冷气团向前推进，锋面陡峭</text>
<!-- 地面 -->
<line x1="20" y1="300" x2="310" y2="300" stroke="#333" stroke-width="3"/>
<!-- 冷气团（楔形蓝色区） -->
<polygon points="20,300 20,190 95,300" fill="#dcebf2"/>
<polygon points="20,190 95,300 20,300" fill="#dcebf2"/>
<!-- 锋面斜线 -->
<line x1="40" y1="300" x2="175" y2="120" stroke="#1f6f8b" stroke-width="3"/>
<!-- 冷锋符号（蓝色三角） -->
<polygon points="105,236 98,246 112,246" fill="#1f6f8b"/>
<polygon points="130,205 123,215 137,215" fill="#1f6f8b"/>
<polygon points="155,174 148,184 162,184" fill="#1f6f8b"/>
<!-- 积雨云 -->
<ellipse cx="205" cy="150" rx="45" ry="26" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="190" cy="125" rx="30" ry="22" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="222" cy="122" rx="28" ry="22" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="205" cy="95" rx="24" ry="18" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 阵雨 -->
<line x1="205" y1="176" x2="200" y2="240" stroke="#6aa3c8" stroke-width="2"/>
<line x1="222" y1="176" x2="218" y2="240" stroke="#6aa3c8" stroke-width="2"/>
<line x1="188" y1="176" x2="183" y2="240" stroke="#6aa3c8" stroke-width="2"/>
<!-- 标注 -->
<text x="60" y="260" font-family="sans-serif" font-size="14" fill="#1f6f8b">冷气团（前进方向 →）</text>
<text x="230" y="200" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">积雨云</text>
<text x="230" y="222" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">阵雨窄而强</text>
<text x="95" y="140" font-family="sans-serif" font-size="13" fill="#c0392b">暖气团被抬升</text>
<text x="42" y="330" font-family="sans-serif" font-size="13" fill="#999">坡陡（约 1:50），移速快</text>
<!-- ========== 右栏：暖锋 ========== -->
<text x="345" y="46" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">暖锋</text>
<text x="345" y="64" font-family="sans-serif" font-size="13" fill="#666">暖气团爬升，锋面平缓</text>
<!-- 地面 -->
<line x1="335" y1="300" x2="625" y2="300" stroke="#333" stroke-width="3"/>
<!-- 冷气团（蓝色区，在暖锋前） -->
<polygon points="335,300 425,300 335,210" fill="#dcebf2"/>
<polygon points="335,210 425,300 335,300" fill="#dcebf2"/>
<!-- 锋面斜线（平缓） -->
<line x1="610" y1="300" x2="430" y2="150" stroke="#c0392b" stroke-width="3"/>
<!-- 暖锋符号（红色半圆） -->
<circle cx="580" cy="300" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="555" cy="272" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="530" cy="244" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<!-- 卷云（最前方高层） -->
<ellipse cx="590" cy="150" rx="26" ry="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="600" cy="132" rx="20" ry="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 卷层云 -->
<ellipse cx="545" cy="168" rx="34" ry="9" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 高层云 -->
<ellipse cx="500" cy="190" rx="36" ry="11" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 雨层云 -->
<ellipse cx="450" cy="215" rx="34" ry="14" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 宽雨带 -->
<line x1="442" y1="229" x2="438" y2="290" stroke="#6aa3c8" stroke-width="2"/>
<line x1="458" y1="229" x2="455" y2="290" stroke="#6aa3c8" stroke-width="2"/>
<line x1="474" y1="222" x2="472" y2="290" stroke="#6aa3c8" stroke-width="2"/>
<!-- 标注 -->
<text x="600" y="105" font-family="sans-serif" font-size="13" fill="#999">卷云（先兆）</text>
<text x="348" y="262" font-family="sans-serif" font-size="13" fill="#1f6f8b">冷气团</text>
<text x="480" y="170" font-family="sans-serif" font-size="13" fill="#c0392b">暖气团爬升</text>
<text x="400" y="325" font-family="sans-serif" font-size="13" fill="#999">坡缓（约 1:100–1:200），移速慢，雨区宽</text>
<text x="570" y="325" font-family="sans-serif" font-size="13" fill="#c0392b">暖锋前进方向</text>
</svg>
