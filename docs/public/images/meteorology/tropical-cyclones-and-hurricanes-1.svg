<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>热带气旋垂直剖面结构示意</title>
<desc>中心为晴空下沉的眼，眼壁环绕最强上升气流与积雨云，外侧是螺旋雨带，顶部高空外流，海面暖湿空气辐合流入。</desc>
<defs>
<marker id="hc-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M5 0 L10 10 L0 10 z" fill="#c0392b"/></marker>
<marker id="hc-out" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e67e22"/></marker>
<marker id="hc-in" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker>
<marker id="hc-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M5 10 L10 0 L0 0 z" fill="#666"/></marker>
</defs>
<rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
<!-- 海面 -->
<rect x="0" y="350" width="640" height="70" fill="#cfe4f2"/>
<line x1="0" y1="350" x2="640" y2="350" stroke="#1f6f8b" stroke-width="2"/>
<!-- 眼（晴空柱） -->
<rect x="298" y="150" width="44" height="200" fill="#fff8f0" stroke="#d8b98a" stroke-width="1"/>
<text x="320" y="148" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">眼</text>
<line x1="310" y1="230" x2="310" y2="290" stroke="#666" stroke-width="2.5" marker-end="url(#hc-down)"/>
<line x1="330" y1="250" x2="330" y2="300" stroke="#666" stroke-width="2.5" marker-end="url(#hc-down)"/>
<!-- 眼壁（左） -->
<ellipse cx="278" cy="180" rx="26" ry="60" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="268" cy="110" rx="24" ry="50" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="290" cy="80" rx="26" ry="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 眼壁（右） -->
<ellipse cx="362" cy="180" rx="26" ry="60" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="372" cy="110" rx="24" ry="50" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<ellipse cx="350" cy="80" rx="26" ry="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<!-- 眼壁上升气流 -->
<line x1="268" y1="300" x2="268" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#hc-up)"/>
<line x1="372" y1="300" x2="372" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#hc-up)"/>
<!-- 螺旋雨带（外侧云团） -->
<ellipse cx="205" cy="235" rx="40" ry="18" fill="#eaeaea" stroke="#aaa" stroke-width="1.5"/>
<ellipse cx="160" cy="260" rx="30" ry="14" fill="#eaeaea" stroke="#aaa" stroke-width="1.5"/>
<ellipse cx="435" cy="235" rx="40" ry="18" fill="#eaeaea" stroke="#aaa" stroke-width="1.5"/>
<ellipse cx="480" cy="260" rx="30" ry="14" fill="#eaeaea" stroke="#aaa" stroke-width="1.5"/>
<!-- 雨带阵雨 -->
<line x1="200" y1="255" x2="196" y2="330" stroke="#6aa3c8" stroke-width="2"/>
<line x1="212" y1="253" x2="209" y2="330" stroke="#6aa3c8" stroke-width="2"/>
<line x1="440" y1="255" x2="437" y2="330" stroke="#6aa3c8" stroke-width="2"/>
<!-- 高空外流 -->
<line x1="255" y1="62" x2="140" y2="70" stroke="#e67e22" stroke-width="3" marker-end="url(#hc-out)"/>
<line x1="385" y1="62" x2="500" y2="70" stroke="#e67e22" stroke-width="3" marker-end="url(#hc-out)"/>
<!-- 低层辐合流入 -->
<line x1="120" y1="348" x2="285" y2="342" stroke="#1f6f8b" stroke-width="3" marker-end="url(#hc-in)"/>
<line x1="520" y1="348" x2="355" y2="342" stroke="#1f6f8b" stroke-width="3" marker-end="url(#hc-in)"/>
<!-- 标注 -->
<text x="268" y="185" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">眼壁</text>
<text x="140" y="300" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">螺旋雨带</text>
<text x="120" y="90" font-family="sans-serif" font-size="13" fill="#e67e22">高空外流（暖核反气旋）</text>
<text x="100" y="385" font-family="sans-serif" font-size="13" fill="#1f6f8b">暖湿气流辐合流入</text>
<text x="320" y="40" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">眼壁：最强上升气流与最强风速</text>
<text x="320" y="405" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">热带气旋垂直剖面（示意图）</text>
</svg>
