<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>大气垂直温度结构剖面</title>
<desc>横轴为温度（摄氏度），纵轴为高度（公里）。对流层温度随高度递减，平流层随高度递增，中间层递减，热层骤升。图右侧标注四个主要大气层的名称与高度范围。</desc>
<rect x="0" y="0" width="640" height="520" fill="#ffffff"/>
<!-- 图层色带 -->
<rect x="100" y="440" width="460" height="40" fill="#f5f2ea"/>
<rect x="100" y="297" width="460" height="143" fill="#fbfaf6"/>
<rect x="100" y="168" width="460" height="129" fill="#f5f2ea"/>
<rect x="100" y="40" width="460" height="128" fill="#fbfaf6"/>
<!-- 边界虚线 -->
<line x1="100" y1="440" x2="560" y2="440" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="100" y1="297" x2="560" y2="297" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="100" y1="168" x2="560" y2="168" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<!-- 温度曲线 -->
<polyline points="453,480 235,440 407,297 131,168" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
<polyline points="131,168 560,60" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/>
<!-- 坐标轴 -->
<line x1="100" y1="480" x2="100" y2="40" stroke="#333" stroke-width="2"/>
<line x1="100" y1="480" x2="560" y2="480" stroke="#333" stroke-width="2"/>
<line x1="100" y1="40" x2="560" y2="40" stroke="#333" stroke-width="2"/>
<!-- X 轴刻度与标注 -->
<line x1="100" y1="480" x2="100" y2="488" stroke="#333"/>
<line x1="254" y1="480" x2="254" y2="488" stroke="#333"/>
<line x1="407" y1="480" x2="407" y2="488" stroke="#333"/>
<line x1="560" y1="480" x2="560" y2="488" stroke="#333"/>
<text x="100" y="506" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">-100</text>
<text x="254" y="506" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">-50</text>
<text x="407" y="506" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">0</text>
<text x="560" y="506" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">50</text>
<text x="330" y="518" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">温度（°C）</text>
<!-- Y 轴刻度与标注 -->
<line x1="92" y1="480" x2="100" y2="480" stroke="#333"/>
<line x1="92" y1="407" x2="100" y2="407" stroke="#333"/>
<line x1="92" y1="333" x2="100" y2="333" stroke="#333"/>
<line x1="92" y1="260" x2="100" y2="260" stroke="#333"/>
<line x1="92" y1="187" x2="100" y2="187" stroke="#333"/>
<line x1="92" y1="113" x2="100" y2="113" stroke="#333"/>
<line x1="92" y1="40" x2="100" y2="40" stroke="#333"/>
<text x="84" y="484" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">0</text>
<text x="84" y="411" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">20</text>
<text x="84" y="337" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">40</text>
<text x="84" y="264" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">60</text>
<text x="84" y="191" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">80</text>
<text x="84" y="117" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">100</text>
<text x="84" y="44" font-family="sans-serif" font-size="13" fill="#333" text-anchor="end">120</text>
<text x="30" y="260" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 30 260)">高度（km）</text>
<!-- 层名标注 -->
<text x="115" y="472" font-family="sans-serif" font-size="15" fill="#1f6f8b"><tspan font-weight="bold">对流层</tspan>（0–11 km）</text>
<text x="115" y="382" font-family="sans-serif" font-size="15" fill="#1f6f8b"><tspan font-weight="bold">平流层</tspan>（11–50 km）</text>
<text x="115" y="244" font-family="sans-serif" font-size="15" fill="#1f6f8b"><tspan font-weight="bold">中间层</tspan>（50–85 km）</text>
<text x="115" y="104" font-family="sans-serif" font-size="15" fill="#1f6f8b"><tspan font-weight="bold">热层</tspan>（85–120 km）</text>
<!-- 边界名 -->
<text x="470" y="456" font-family="sans-serif" font-size="13" fill="#999" text-anchor="end">对流层顶（约 –56°C）</text>
<text x="470" y="314" font-family="sans-serif" font-size="13" fill="#999" text-anchor="end">平流层顶（约 0°C）</text>
<text x="470" y="184" font-family="sans-serif" font-size="13" fill="#999" text-anchor="end">中间层顶（约 –90°C）</text>
<text x="320" y="80" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">热层：温度随高度骤升（但空气极稀薄）</text>
<text x="330" y="432" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="end">气温随高度递减（平均 6.5 K/km）</text>
</svg>
