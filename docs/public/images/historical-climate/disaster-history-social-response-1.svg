<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">灾害冲击传导链与荒政响应机制示意图</title>
  <desc id="desc">上行红色链条展示气候异常经农业减产、粮价飞涨、流民四起走向社会动乱的传导；下行青色链条展示荒政（仓储、平粜、赈济、以工代赈）如何在各环节截断灾害冲击。</desc>
  <rect width="880" height="440" fill="#faf9f5"/>
  <!-- 上行：灾害传导链 -->
  <text x="20" y="30" font-size="15" fill="#c0392b">灾害传导链</text>
  <g stroke="#c0392b" stroke-width="1.5">
    <rect x="20" y="45" width="140" height="55" rx="8" fill="#fdf0ee"/>
    <rect x="190" y="45" width="140" height="55" rx="8" fill="#fdf0ee"/>
    <rect x="360" y="45" width="140" height="55" rx="8" fill="#fdf0ee"/>
    <rect x="530" y="45" width="140" height="55" rx="8" fill="#fdf0ee"/>
    <rect x="700" y="45" width="140" height="55" rx="8" fill="#fdf0ee"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="90" y="77">气候异常</text>
    <text x="260" y="77">农业减产</text>
    <text x="430" y="77">粮价飞涨</text>
    <text x="600" y="77">流民四起</text>
    <text x="770" y="77">社会动乱</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="none">
    <line x1="160" y1="72" x2="188" y2="72"/>
    <line x1="330" y1="72" x2="358" y2="72"/>
    <line x1="500" y1="72" x2="528" y2="72"/>
    <line x1="670" y1="72" x2="698" y2="72"/>
  </g>
  <!-- 下行：荒政响应 -->
  <text x="20" y="230" font-size="15" fill="#1f6f8b">荒政响应（截断链条）</text>
  <g stroke="#1f6f8b" stroke-width="1.5">
    <rect x="20" y="245" width="140" height="55" rx="8" fill="#eef4f6"/>
    <rect x="190" y="245" width="140" height="55" rx="8" fill="#eef4f6"/>
    <rect x="360" y="245" width="140" height="55" rx="8" fill="#eef4f6"/>
    <rect x="530" y="245" width="140" height="55" rx="8" fill="#eef4f6"/>
    <rect x="700" y="245" width="140" height="55" rx="8" fill="#eef4f6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="90" y="277">灾前仓储</text>
    <text x="260" y="277">平粜 常平仓</text>
    <text x="430" y="277">赈济 蠲免</text>
    <text x="600" y="277">以工代赈</text>
    <text x="770" y="277">恢复重建</text>
  </g>
  <g stroke-dasharray="5 4" stroke="#666" stroke-width="1.5">
    <line x1="260" y1="100" x2="260" y2="243"/>
    <line x1="430" y1="100" x2="430" y2="243"/>
    <line x1="600" y1="100" x2="600" y2="243"/>
  </g>
  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="285" y="178">缓冲减幅</text>
    <text x="455" y="178">补贴民生</text>
    <text x="625" y="178">吸纳劳力</text>
  </g>
  <!-- 底部注 -->
  <text x="20" y="420" font-size="13" fill="#666">机理：粮食需求缺乏弹性，供给稍减价格即暴涨；荒政越早介入，链条越难走完。</text>
</svg>
