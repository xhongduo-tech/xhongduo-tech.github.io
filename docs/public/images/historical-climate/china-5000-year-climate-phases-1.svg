<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">中国近五千年气温变化曲线示意图</title>
  <desc id="desc">根据竺可桢《中国近五千年气候变迁的初步研究》的定性结论绘制的示意图，纵轴为相对现代的温度距平（摄氏度），横轴为时间，展示仰韶殷商温暖期、周初寒冷期、隋唐温暖期、明清小冰期等多次冷暖交替。</desc>
  <rect width="900" height="440" fill="#faf9f5"/>
  <g font-size="14" fill="#333">
    <!-- 零距平参考线 -->
    <line x1="80" y1="205" x2="870" y2="205" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="885" y="209" font-size="13">0 °C（现代基准）</text>
    <!-- y 轴刻度 -->
    <text x="45" y="54" text-anchor="end" font-size="13">+2</text>
    <text x="45" y="132" text-anchor="end" font-size="13">+1</text>
    <text x="45" y="209" text-anchor="end" font-size="13">0</text>
    <text x="45" y="287" text-anchor="end" font-size="13">-1</text>
    <text x="45" y="365" text-anchor="end" font-size="13">-2</text>
    <line x1="80" y1="50" x2="80" y2="360" stroke="#333" stroke-width="1.5"/>
    <line x1="80" y1="360" x2="870" y2="360" stroke="#333" stroke-width="1.5"/>
    <text x="38" y="392" text-anchor="middle" font-size="14">气温距平（°C）</text>
    <!-- x 轴刻度 -->
    <text x="80" y="382" text-anchor="middle" font-size="13">公元前3000</text>
    <text x="396" y="382" text-anchor="middle" font-size="13">公元前1000</text>
    <text x="554" y="382" text-anchor="middle" font-size="13">公元元年</text>
    <text x="712" y="382" text-anchor="middle" font-size="13">公元1000</text>
    <text x="854" y="382" text-anchor="middle" font-size="13">1900年</text>
    <text x="872" y="382" text-anchor="end" font-size="13">今</text>
  </g>
  <!-- 温度曲线 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="3"
    points="80,166.25 111.6,57.75 159,50 238,65.5 317,88.75 380.2,127.5 411.8,181.75 443.4,236 490.8,212.75 554,166.25 585.6,189.5 617.2,243.75 648.8,267 680.4,243.75 696.2,205 727.8,143 743.6,166.25 767.3,197.25 791,228.25 814.7,251.5 830.5,298 846.3,274.75 854.2,243.75 859.1,220.5 870,166.25"/>
  <!-- 分期标注 -->
  <g font-size="14" fill="#1f6f8b">
    <text x="235" y="30" text-anchor="middle">仰韶—殷商 温暖期（较今约高 2 °C）</text>
    <text x="150" y="300" text-anchor="middle" fill="#c0392b">周初转冷</text>
    <text x="665" y="308" text-anchor="middle">东汉—南北朝 寒冷期</text>
    <text x="722" y="118" text-anchor="middle" fill="#c0392b">隋唐 温暖期</text>
    <text x="806" y="330" text-anchor="middle">明清小冰期（17 世纪最冷）</text>
    <text x="862" y="140" text-anchor="middle" fill="#c0392b">20 世纪回暖</text>
  </g>
</svg>
