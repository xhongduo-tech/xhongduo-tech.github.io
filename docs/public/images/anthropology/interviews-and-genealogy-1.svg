<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif">
  <title>亲属符号图：方为男性、圆为女性</title>
  <desc>亲属谱系法的国际通用符号示意：父（方）、母（圆）以婚姻横线相连，竖线连到自我（实心方）与其姊妹（圆），右侧说明各符号含义。</desc>
  <rect width="640" height="340" fill="#faf9f5"/>

  <!-- 父亲：方 -->
  <rect x="110" y="60" width="64" height="64" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="142" y="86" text-anchor="middle" font-size="15" fill="#333">父</text>
  <text x="142" y="106" text-anchor="middle" font-size="13" fill="#666">(方)</text>

  <!-- 母亲：圆 -->
  <circle cx="292" cy="92" r="32" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="292" y="90" text-anchor="middle" font-size="15" fill="#333">母</text>
  <text x="292" y="108" text-anchor="middle" font-size="13" fill="#666">(圆)</text>

  <!-- 婚姻横线 -->
  <line x1="174" y1="92" x2="258" y2="92" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="216" y="80" text-anchor="middle" font-size="14" fill="#1f6f8b">= 婚姻</text>

  <!-- 继嗣竖线 -->
  <line x1="216" y1="124" x2="216" y2="176" stroke="#333" stroke-width="2.5"/>
  <text x="216" y="156" text-anchor="middle" font-size="13" fill="#666">= 继嗣</text>

  <!-- 自我 Ego：实心方 -->
  <rect x="184" y="178" width="64" height="64" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="216" y="204" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">自我</text>
  <text x="216" y="224" text-anchor="middle" font-size="13" fill="#fff">Ego</text>

  <!-- 手足横线 -->
  <line x1="248" y1="210" x2="316" y2="210" stroke="#333" stroke-width="2.5"/>
  <text x="282" y="200" text-anchor="middle" font-size="13" fill="#666">= 手足</text>

  <!-- 姊妹：圆 -->
  <circle cx="348" cy="210" r="32" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="348" y="208" text-anchor="middle" font-size="15" fill="#333">姊</text>
  <text x="348" y="226" text-anchor="middle" font-size="13" fill="#666">(圆)</text>

  <!-- 图例 -->
  <g font-size="14" fill="#333">
    <rect x="110" y="278" width="18" height="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="138" y="292">方 = 男性　圆 = 女性</text>
    <rect x="110" y="306" width="18" height="18" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
    <text x="138" y="320">实心 = 自我 Ego（叙述者）</text>
  </g>
</svg>
