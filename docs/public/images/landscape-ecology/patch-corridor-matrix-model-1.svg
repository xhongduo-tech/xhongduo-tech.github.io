<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="sans-serif">
  <title>斑块-廊道-基质模型示意图</title>
  <desc>一幅景观马赛克：灰色背景为基质，嵌入的深色不规则图形为斑块，连接斑块的浅青色长条为廊道。</desc>
  <rect width="480" height="300" fill="#f3efe7"/>
  <rect x="10" y="10" width="460" height="280" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 廊道（水平两条与斜向一条，青色） -->
  <rect x="60" y="120" width="120" height="18" rx="9" fill="#1f6f8b"/>
  <rect x="190" y="120" width="130" height="18" rx="9" fill="#1f6f8b"/>
  <rect x="330" y="120" width="120" height="18" rx="9" fill="#1f6f8b"/>
  <path d="M 120 100 Q 140 70 170 60 L 182 68 Q 152 80 134 104 Z" fill="#1f6f8b"/>
  <!-- 斑块（红色系不规则多边形） -->
  <path d="M 60 40 L 105 30 L 130 55 L 95 85 L 55 70 Z" fill="#c0392b"/>
  <path d="M 300 200 L 360 195 L 380 235 L 330 260 L 285 235 Z" fill="#c0392b"/>
  <path d="M 400 30 L 445 40 L 435 80 L 395 70 Z" fill="#c0392b"/>
  <path d="M 50 220 L 95 215 L 90 255 L 45 250 Z" fill="#c0392b"/>
  <!-- 标签 -->
  <text x="24" y="294" font-size="13" fill="#333" font-weight="bold">基质（matrix）：面积大、连通性好，控制景观动态</text>
  <text x="140" y="110" font-size="14" fill="#1f6f8b" font-weight="bold">廊道</text>
  <text x="120" y="255" font-size="13" fill="#c0392b" font-weight="bold">斑块</text>
  <text x="360" y="40" font-size="13" fill="#333">边缘</text>
</svg>
