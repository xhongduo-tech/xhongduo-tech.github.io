<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>食品科学学科知识地图</title>
  <desc>以食品科学为中心，连接食品化学、食品微生物学、食品工程原理与营养安全四大支柱的示意图</desc>
  <rect width="640" height="420" fill="#faf9f5"/>
  <line x1="320" y1="210" x2="150" y2="100" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="320" y1="210" x2="490" y2="100" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="320" y1="210" x2="150" y2="330" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="320" y1="210" x2="490" y2="330" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="240" y="180" width="160" height="60" rx="10" fill="#1f6f8b"/>
  <text x="320" y="216" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold">食品科学</text>
  <rect x="60" y="70" width="180" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">食品化学</text>
  <rect x="400" y="70" width="180" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="490" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">食品微生物学</text>
  <rect x="60" y="300" width="180" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">食品工程原理</text>
  <rect x="400" y="300" width="180" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="490" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">营养与安全</text>
  <text x="320" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">四大支柱交汇，构成「从农田到餐桌」的科学基础</text>
</svg>
