<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>热致死曲线与 D 值</title>
  <desc>以纵轴为活菌数对数、横轴为加热时间，描绘恒定高温下微生物指数死亡曲线，并标注使活菌数下降一个数量级所需的 D 值</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <line x1="70" y1="320" x2="600" y2="320" stroke="#333333" stroke-width="1.5"/>
  <line x1="70" y1="320" x2="70" y2="40" stroke="#333333" stroke-width="1.5"/>
  <text x="30" y="100" font-family="sans-serif" font-size="13" fill="#333333">6</text>
  <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#333333">5</text>
  <text x="30" y="180" font-family="sans-serif" font-size="13" fill="#333333">4</text>
  <text x="30" y="220" font-family="sans-serif" font-size="13" fill="#333333">3</text>
  <text x="30" y="260" font-family="sans-serif" font-size="13" fill="#333333">2</text>
  <text x="30" y="300" font-family="sans-serif" font-size="13" fill="#333333">1</text>
  <text x="70" y="30" font-family="sans-serif" font-size="13" fill="#333333">log₁₀N（活菌数对数）</text>
  <text x="330" y="345" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">加热时间 t（min）</text>
  <line x1="100" y1="140" x2="220" y2="180" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="220" y1="180" x2="340" y2="220" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="340" y1="220" x2="460" y2="260" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="460" y1="260" x2="580" y2="300" stroke="#1f6f8b" stroke-width="2.5"/>
  <circle cx="100" cy="140" r="4" fill="#c0392b"/>
  <circle cx="220" cy="180" r="4" fill="#c0392b"/>
  <line x1="100" y1="205" x2="220" y2="205" stroke="#333333" stroke-width="1.2"/>
  <text x="160" y="198" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">D</text>
  <text x="160" y="225" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">活菌数减少 90%</text>
  <text x="585" y="120" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="end">恒定高温下的指数死亡</text>
</svg>
