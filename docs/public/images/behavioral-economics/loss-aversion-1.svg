<svg viewBox="0 0 640 440" width="640" height="440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>前景理论价值函数：参照点与损失厌恶</title>
<desc>以参照点为原点的 S 形价值函数：收益区凹、损失区凸且更陡，直观显示损失厌恶。</desc>
<rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
<!-- 坐标轴 -->
<line x1="40" y1="240" x2="600" y2="240" stroke="#333" stroke-width="1.5"/>
<line x1="320" y1="400" x2="320" y2="40" stroke="#333" stroke-width="1.5"/>
<polygon points="600,240 588,234 588,246" fill="#333"/>
<polygon points="320,40 314,52 326,52" fill="#333"/>
<!-- 象限色带（淡） -->
<rect x="320" y="40" width="280" height="200" fill="#1f6f8b" opacity="0.05"/>
<rect x="40" y="240" width="280" height="160" fill="#c0392b" opacity="0.05"/>
<!-- 参照点虚线 -->
<line x1="320" y1="240" x2="520" y2="240" stroke="#1f6f8b" stroke-dasharray="4,4" stroke-width="1"/>
<text x="528" y="236" fill="#1f6f8b" font-size="14">Δx = 0（现状参照点）</text>
<!-- 收益段：凹曲线，从原点缓慢上升 -->
<path d="M 320 240 Q 420 210 520 168" stroke="#1f6f8b" stroke-width="3" fill="none"/>
<!-- 损失段：凸曲线，从原点陡降 -->
<path d="M 320 240 Q 220 320 110 372" stroke="#c0392b" stroke-width="3" fill="none"/>
<!-- 等量得失对比虚线 -->
<line x1="110" y1="240" x2="110" y2="372" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
<line x1="110" y1="240" x2="530" y2="240" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
<line x1="530" y1="240" x2="530" y2="162" stroke="#1f6f8b" stroke-dasharray="3,3" stroke-width="1"/>
<text x="104" y="255" fill="#c0392b" font-size="13">-x</text>
<text x="530" y="155" fill="#1f6f8b" font-size="13">+x</text>
<!-- 轴标签 -->
<text x="575" y="264" fill="#333" font-size="15" text-anchor="end">损益 Δx（相对参照点）</text>
<text x="330" y="60" fill="#333" font-size="15">心理价值 v(Δx)</text>
<!-- 曲线标注 -->
<text x="470" y="180" fill="#1f6f8b" font-size="15">收益：凹，越赚越钝</text>
<text x="60" y="380" fill="#c0392b" font-size="15">损失：凸且更陡</text>
<text x="128" y="228" fill="#333" font-size="14">失去 x 的痛苦 ＞ 得到 x 的快乐</text>
<circle cx="320" cy="240" r="4" fill="#333"/>
<text x="326" y="258" fill="#333" font-size="15">参照点</text>
</svg>
