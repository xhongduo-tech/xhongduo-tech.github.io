<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="sans-serif">
  <title>Spaun 系统架构示意</title>
  <desc>基于 NEF 的 Spaun 脑模拟架构：视觉输入经 V1/IT 与 PFC 工作记忆处理，基底节负责路由，运动皮层驱动二维机械臂输出，整体可完成八项认知任务。</desc>

  <rect x="0" y="0" width="860" height="470" fill="#faf9f5"/>

  <text x="430" y="40" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">Spaun：一个能「考试」的 250 万神经元脑模拟</text>
  <text x="430" y="64" text-anchor="middle" font-size="14" fill="#1f6f8b">神经工程框架 NEF · 全部输入为 28×28 图像 · 全部输出经二维机械臂绘制</text>

  <!-- 输入 -->
  <rect x="30" y="150" width="150" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">视觉输入</text>
  <text x="105" y="214" text-anchor="middle" font-size="14" fill="#333">28×28 图像</text>
  <text x="105" y="238" text-anchor="middle" font-size="13" fill="#1f6f8b">手写 / 印刷字符</text>

  <!-- 视觉系统 -->
  <rect x="220" y="140" width="190" height="130" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="315" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">视觉系统 V1/IT</text>
  <text x="315" y="198" text-anchor="middle" font-size="14" fill="#333">卷积 → 特征</text>
  <text x="315" y="222" text-anchor="middle" font-size="14" fill="#333">→ 语义指针</text>
  <text x="315" y="250" text-anchor="middle" font-size="13" fill="#1f6f8b">相似字符 → 相近向量</text>

  <!-- 工作记忆 -->
  <rect x="450" y="140" width="190" height="130" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="545" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">前额叶皮层 PFC</text>
  <text x="545" y="198" text-anchor="middle" font-size="14" fill="#333">工作记忆</text>
  <text x="545" y="222" text-anchor="middle" font-size="14" fill="#333">语义指针保持</text>
  <text x="545" y="250" text-anchor="middle" font-size="13" fill="#1f6f8b">序列的首因 / 近因效应</text>

  <!-- 运动 -->
  <rect x="680" y="140" width="160" height="130" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="760" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">运动皮层</text>
  <text x="760" y="198" text-anchor="middle" font-size="14" fill="#333">生成动作指令</text>
  <text x="760" y="222" text-anchor="middle" font-size="14" fill="#333">驱动机械臂</text>
  <text x="760" y="250" text-anchor="middle" font-size="13" fill="#1f6f8b">绘图式输出</text>

  <!-- 机械臂输出 -->
  <rect x="680" y="340" width="160" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="760" y="374" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">二维机械臂</text>
  <text x="760" y="398" text-anchor="middle" font-size="14" fill="#333">物理模型 · 绘制答案</text>

  <!-- 基底节 -->
  <rect x="300" y="330" width="220" height="90" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="410" y="360" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">基底节 BG</text>
  <text x="410" y="384" text-anchor="middle" font-size="14" fill="#333">动作选择 · 路由控制</text>
  <text x="410" y="408" text-anchor="middle" font-size="13" fill="#1f6f8b">按线索决定运行哪个皮层模块</text>

  <!-- 主流程箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <line x1="180" y1="205" x2="218" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="205" x2="448" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="205" x2="678" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="272" x2="760" y2="338" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 基底节路由虚线 -->
  <line x1="340" y1="330" x2="330" y2="272" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dash)"/>
  <line x1="410" y1="330" x2="450" y2="272" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dash)"/>
  <line x1="480" y1="330" x2="700" y2="272" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dash)"/>

  <!-- 任务注解 -->
  <rect x="30" y="330" width="240" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">八项认知任务（同一套回路）</text>
  <text x="46" y="378" font-size="13" fill="#333">· 图像识别　· 复制绘制</text>
  <text x="46" y="398" font-size="13" fill="#333">· 序列记忆　· 计数</text>
  <text x="46" y="418" font-size="13" fill="#333">· 算术推理　· 问答</text>
  <text x="46" y="438" font-size="13" fill="#333">· 模式归纳（瑞文测验 88%）</text>

  <text x="860" y="462" text-anchor="end" font-size="13" fill="#999">参考：Eliasmith et al., Science 338:1202–1205, 2012</text>
</svg>
