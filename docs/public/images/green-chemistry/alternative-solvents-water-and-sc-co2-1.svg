<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <title>二氧化碳相图示意</title>
  <desc>二氧化碳的固、液、气三相区域与超临界流体区域示意图，标注三相点与临界点</desc>
  <rect x="0" y="0" width="640" height="460" fill="#faf9f5"/>
  <g font-size="14" fill="#333">
    <!-- 轴 -->
    <line x1="70" y1="440" x2="600" y2="440" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="440" stroke="#333" stroke-width="1.5"/>
    <text x="320" y="458" text-anchor="middle" font-size="14">温度 T / °C</text>
    <text x="40" y="245" text-anchor="middle" font-size="14" transform="rotate(-90 40 245)">压力 P / bar</text>
    <!-- T 轴刻度 -->
    <text x="70" y="430" text-anchor="middle" font-size="13">-80</text>
    <line x1="70" y1="440" x2="70" y2="446" stroke="#333" stroke-width="1"/>
    <text x="282" y="430" text-anchor="middle" font-size="13">0</text>
    <line x1="282" y1="440" x2="282" y2="446" stroke="#333" stroke-width="1"/>
    <text x="364" y="430" text-anchor="middle" font-size="13">31.1</text>
    <line x1="364" y1="440" x2="364" y2="446" stroke="#333" stroke-width="1"/>
    <text x="441" y="430" text-anchor="middle" font-size="13">60</text>
    <line x1="441" y1="440" x2="441" y2="446" stroke="#333" stroke-width="1"/>
    <text x="600" y="430" text-anchor="middle" font-size="13">120</text>
    <line x1="600" y1="440" x2="600" y2="446" stroke="#333" stroke-width="1"/>
    <!-- P 轴刻度 -->
    <text x="58" y="445" text-anchor="end" font-size="13">0</text>
    <text x="58" y="429" text-anchor="end" font-size="13">5.2</text>
    <text x="58" y="240" text-anchor="end" font-size="13">73.8</text>
    <text x="58" y="55" text-anchor="end" font-size="13">140</text>
  </g>
  <!-- 超临界区域（P>Pc 且 T>Tc 的右上象限） -->
  <rect x="364" y="50" width="236" height="185" fill="#1f6f8b" opacity="0.16"/>
  <!-- 临界等温线 / 等压线（虚线） -->
  <line x1="364" y1="50" x2="364" y2="235" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70" y1="235" x2="364" y2="235" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 相边界曲线 -->
  <path d="M 132 425 C 110 432, 90 437, 72 439" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 132 425 C 128 350, 126 250, 124 150, 123 60" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M 132 425 C 185 380, 285 300, 364 235" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 三相点与临界点 -->
  <circle cx="132" cy="425" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <circle cx="364" cy="235" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <text x="132" y="416" text-anchor="middle" font-size="13" fill="#c0392b">三相点</text>
  <text x="132" y="447" text-anchor="middle" font-size="12" fill="#c0392b">(−56.6 °C, 5.2 bar)</text>
  <text x="364" y="222" text-anchor="middle" font-size="13" fill="#c0392b">临界点</text>
  <text x="364" y="256" text-anchor="middle" font-size="12" fill="#c0392b">(31.1 °C, 73.8 bar)</text>
  <!-- 区域标签 -->
  <text x="82" y="404" font-size="14" fill="#333">固态</text>
  <text x="230" y="330" font-size="14" fill="#333">液态</text>
  <text x="500" y="405" font-size="14" fill="#333">气态</text>
  <text x="480" y="120" text-anchor="middle" font-size="15" fill="#1f6f8b">超临界流体 scCO₂</text>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="#1f6f8b">兼具液体溶解力与气体扩散性</text>
</svg>
