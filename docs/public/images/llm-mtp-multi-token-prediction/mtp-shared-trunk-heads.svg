<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="sans-serif">
  <title>共享主干 + 多预测头的 MTP 整体架构</title>
  <desc>输入 token 经共享主干 Transformer 编码得到隐藏表示 h_t，h_t 同时馈入 K 个并行的预测头，各自输出对 x_{t+1} 至 x_{t+K} 的词表分布。</desc>
  <rect x="0" y="0" width="680" height="380" fill="#faf9f5"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#333">共享主干 + 多预测头的 MTP 整体架构</text>

  <rect x="20" y="70" width="120" height="70" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="100" font-size="14" text-anchor="middle" fill="#333">输入 token</text>
  <text x="80" y="122" font-size="13" text-anchor="middle" fill="#555">x₁ x₂ x₃ x₄ …</text>

  <line x1="140" y1="105" x2="200" y2="105" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="200" y="55" width="180" height="100" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="290" y="84" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f6f8b">共享主干</text>
  <text x="290" y="106" font-size="13" text-anchor="middle" fill="#333">Transformer 层堆叠</text>
  <text x="290" y="126" font-size="13" text-anchor="middle" fill="#555">（全部预测头共用参数）</text>
  <text x="290" y="146" font-size="13" text-anchor="middle" fill="#555">输出单一隐藏表示 h_t</text>

  <line x1="380" y1="105" x2="440" y2="105" stroke="#c0392b" stroke-width="2" marker-end="url(#arw)"/>

  <text x="455" y="90" font-size="13" fill="#333">h_t 同时馈入 K 个预测头</text>

  <line x1="380" y1="105" x2="430" y2="180" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="380" y1="105" x2="430" y2="230" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="380" y1="105" x2="430" y2="280" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="440" y="160" width="210" height="42" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="545" y="178" font-size="14" text-anchor="middle" fill="#333">预测头 1</text>
  <text x="545" y="195" font-size="13" text-anchor="middle" fill="#555">LayerNorm → 投影 → 输出头</text>
  <text x="545" y="215" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">p(x_{t+1})</text>

  <rect x="440" y="210" width="210" height="42" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="545" y="228" font-size="14" text-anchor="middle" fill="#333">预测头 2</text>
  <text x="545" y="245" font-size="13" text-anchor="middle" fill="#555">LayerNorm → 投影 → 输出头</text>
  <text x="545" y="265" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">p(x_{t+2})</text>

  <rect x="440" y="260" width="210" height="42" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="545" y="278" font-size="14" text-anchor="middle" fill="#333">预测头 K</text>
  <text x="545" y="295" font-size="13" text-anchor="middle" fill="#555">LayerNorm → 投影 → 输出头</text>
  <text x="545" y="315" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">p(x_{t+K})</text>

  <text x="20" y="352" font-size="13" fill="#555">每个预测头独立参数，但共享同一隐藏表示 —— 参数微增，监督信号翻 K 倍。</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
