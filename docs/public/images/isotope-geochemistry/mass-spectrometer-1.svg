<svg viewBox="0 0 720 320" width="720" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>同位素质谱结构示意</title>
  <desc>离子源、扇形磁场与法拉第杯接收器构成的同位素质谱仪三部分示意图，不同质荷比离子在磁场中偏转半径不同。</desc>
  <rect width="720" height="320" fill="#faf9f5"/>
  <!-- 离子源 -->
  <rect x="40" y="120" width="150" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="115" y="100" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">离子源</text>
  <text x="115" y="150" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">灯丝加热 /</text>
  <text x="115" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">等离子体电离</text>
  <text x="115" y="204" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f6f8b">M⁺</text>
  <!-- 加速区 -->
  <line x1="190" y1="170" x2="230" y2="170" stroke="#c0392b" stroke-width="3"/>
  <text x="210" y="160" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#c0392b">加速</text>
  <!-- 磁铁（扇形场） -->
  <path d="M 230 100 L 230 240 A 110 110 0 0 0 430 240 L 430 100 Z" fill="#e8eef2" stroke="#1f6f8b" stroke-width="2"/>
  <text x="330" y="175" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1f6f8b" font-weight="bold">扇形磁场 B</text>
  <text x="330" y="200" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f6f8b">按质荷比分离</text>
  <!-- 离子束路径：轻中重 -->
  <path d="M 190 168 C 260 90 400 96 500 80" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="520" y="80" font-family="sans-serif" font-size="13" fill="#c0392b">轻离子（偏转大）</text>
  <path d="M 190 170 C 260 140 400 150 500 140" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="520" y="145" font-family="sans-serif" font-size="13" fill="#333333">中间离子</text>
  <path d="M 190 172 C 260 210 400 220 500 205" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="520" y="212" font-family="sans-serif" font-size="13" fill="#1f6f8b">重离子（偏转小）</text>
  <!-- 接收器 -->
  <g stroke="#333333" stroke-width="2">
    <line x1="560" y1="66" x2="680" y2="66"/>
    <line x1="560" y1="140" x2="680" y2="140"/>
    <line x1="560" y1="215" x2="680" y2="215"/>
  </g>
  <rect x="670" y="54" width="26" height="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="670" y="128" width="26" height="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="670" y="203" width="26" height="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="684" y="70" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">L</text>
  <text x="684" y="144" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">M</text>
  <text x="684" y="219" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">H</text>
  <text x="620" y="262" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333" font-weight="bold">法拉第杯阵列</text>
  <text x="330" y="292" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">离子电流之比 = 同位素比值，多接收器同时计数以提高精度</text>
</svg>
