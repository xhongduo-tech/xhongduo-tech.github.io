<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif" font-size="14">
  <title>Loihi 芯片架构示意</title>
  <desc>128 个神经形态核通过异步网格状片上网络互连，每个核内有神经元状态、突触 SRAM 与学习引擎；另有若干 x86 控制核负责网络管理与外部通信。</desc>
  <rect x="0" y="0" width="640" height="430" fill="#fff"/>
  <!-- NoC mesh grid of cores -->
  <g stroke="#8a8a8a" stroke-width="1.2">
    <line x1="90" y1="90" x2="330" y2="90"/><line x1="90" y1="140" x2="330" y2="140"/>
    <line x1="90" y1="190" x2="330" y2="190"/><line x1="90" y1="240" x2="330" y2="240"/>
    <line x1="90" y1="90" x2="90" y2="240"/><line x1="150" y1="90" x2="150" y2="240"/>
    <line x1="210" y1="90" x2="210" y2="240"/><line x1="270" y1="90" x2="270" y2="240"/>
    <line x1="330" y1="90" x2="330" y2="240"/>
  </g>
  <!-- routers at intersections -->
  <g fill="#1f6f8b">
    <circle cx="90" cy="90" r="4"/><circle cx="150" cy="90" r="4"/><circle cx="210" cy="90" r="4"/><circle cx="270" cy="90" r="4"/><circle cx="330" cy="90" r="4"/>
    <circle cx="90" cy="140" r="4"/><circle cx="150" cy="140" r="4"/><circle cx="210" cy="140" r="4"/><circle cx="270" cy="140" r="4"/><circle cx="330" cy="140" r="4"/>
    <circle cx="90" cy="190" r="4"/><circle cx="150" cy="190" r="4"/><circle cx="210" cy="190" r="4"/><circle cx="270" cy="190" r="4"/><circle cx="330" cy="190" r="4"/>
    <circle cx="90" cy="240" r="4"/><circle cx="150" cy="240" r="4"/><circle cx="210" cy="240" r="4"/><circle cx="270" cy="240" r="4"/><circle cx="330" cy="240" r="4"/>
  </g>
  <!-- labels on representative core -->
  <text x="108" y="82" fill="#333">神经形态核 ×128</text>
  <text x="108" y="160" fill="#333">· 每核 1024 个神经元</text>
  <text x="108" y="176" fill="#333">· 突触状态在片上 SRAM</text>
  <text x="108" y="192" fill="#333">· 学习引擎（STDP / 奖励调制）</text>
  <!-- mesh label -->
  <text x="120" y="268" fill="#1f6f8b">异步片上网络 NoC：事件包按需路由，空闲零能耗</text>
  <!-- x86 row -->
  <rect x="90" y="310" width="66" height="46" fill="#f5efe0" stroke="#333" stroke-width="1.4"/>
  <rect x="170" y="310" width="66" height="46" fill="#f5efe0" stroke="#333" stroke-width="1.4"/>
  <rect x="250" y="310" width="66" height="46" fill="#f5efe0" stroke="#333" stroke-width="1.4"/>
  <text x="123" y="333" fill="#333" text-anchor="middle">x86</text>
  <text x="123" y="348" fill="#333" text-anchor="middle">控制核</text>
  <text x="203" y="333" fill="#333" text-anchor="middle">x86</text>
  <text x="203" y="348" fill="#333" text-anchor="middle">控制核</text>
  <text x="283" y="333" fill="#333" text-anchor="middle">x86</text>
  <text x="283" y="348" fill="#333" text-anchor="middle">控制核</text>
  <text x="90" y="388" fill="#333">x86 核：管理网络拓扑、加载配置、与外部主机通信</text>
  <!-- overall -->
  <text x="360" y="120" fill="#333">规模（片上总量）：</text>
  <text x="360" y="140" fill="#333">约 100 万神经元</text>
  <text x="360" y="160" fill="#333">约 1.2 亿突触</text>
  <text x="360" y="200" fill="#333">工艺：Intel 14 nm</text>
  <text x="360" y="220" fill="#333">时间步长可配置</text>
  <text x="360" y="240" fill="#333">事件驱动 → 低功耗</text>
</svg>
