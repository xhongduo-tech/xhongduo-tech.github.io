<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif" font-size="14">
  <title>帧相机与事件相机的对比</title>
  <desc>上方：帧相机按固定帧率采样，帧间快速运动完全丢失；下方：事件相机在每个像素亮度变化越过阈值时输出异步事件，保留毫秒与亚毫秒级细节。</desc>
  <rect x="0" y="0" width="640" height="430" fill="#fff"/>
  <!-- panel 1: frame camera -->
  <text x="320" y="34" fill="#333" font-size="16" text-anchor="middle">帧相机：等间隔采样</text>
  <line x1="70" y1="80" x2="600" y2="80" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="96" fill="#333" text-anchor="end">时间 t</text>
  <!-- signal truth -->
  <path d="M 70 140 C 130 130 180 112 240 118 C 300 124 360 132 420 124 C 480 116 540 96 600 92" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <!-- frame samples -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="120" y1="60" x2="120" y2="160"/>
    <line x1="260" y1="60" x2="260" y2="160"/>
    <line x1="400" y1="60" x2="400" y2="160"/>
    <line x1="540" y1="60" x2="540" y2="160"/>
  </g>
  <circle cx="120" cy="138" r="4" fill="#c0392b"/>
  <circle cx="260" cy="124" r="4" fill="#c0392b"/>
  <circle cx="400" cy="120" r="4" fill="#c0392b"/>
  <circle cx="540" cy="90" r="4" fill="#c0392b"/>
  <text x="106" y="44" fill="#c0392b">t1</text>
  <text x="246" y="44" fill="#c0392b">t2</text>
  <text x="386" y="44" fill="#c0392b">t3</text>
  <text x="526" y="44" fill="#c0392b">t4</text>
  <text x="130" y="186" fill="#c0392b">帧间快速运动完全丢失（模糊）</text>
  <text x="180" y="204" fill="#8a8a8a">虚线：真实运动轨迹</text>
  <!-- divider -->
  <line x1="40" y1="230" x2="600" y2="230" stroke="#8a8a8a" stroke-width="1"/>
  <!-- panel 2: event camera -->
  <text x="320" y="262" fill="#333" font-size="16" text-anchor="middle">事件相机：像素级异步事件</text>
  <line x1="70" y1="310" x2="600" y2="310" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="326" fill="#333" text-anchor="end">时间 t</text>
  <!-- events: + red, - blue -->
  <g>
    <circle cx="90" cy="290" r="5" fill="#c0392b"/>
    <circle cx="140" cy="286" r="5" fill="#c0392b"/>
    <circle cx="180" cy="292" r="5" fill="#1f6f8b"/>
    <circle cx="230" cy="288" r="5" fill="#c0392b"/>
    <circle cx="260" cy="284" r="5" fill="#c0392b"/>
    <circle cx="310" cy="290" r="5" fill="#1f6f8b"/>
    <circle cx="350" cy="286" r="5" fill="#c0392b"/>
    <circle cx="395" cy="292" r="5" fill="#1f6f8b"/>
    <circle cx="420" cy="285" r="5" fill="#c0392b"/>
    <circle cx="470" cy="290" r="5" fill="#1f6f8b"/>
    <circle cx="510" cy="286" r="5" fill="#c0392b"/>
    <circle cx="555" cy="288" r="5" fill="#1f6f8b"/>
  </g>
  <text x="90" y="276" fill="#c0392b">+</text>
  <text x="140" y="272" fill="#c0392b">+</text>
  <text x="230" y="274" fill="#c0392b">+</text>
  <text x="260" y="270" fill="#c0392b">+</text>
  <text x="350" y="272" fill="#c0392b">+</text>
  <text x="420" y="271" fill="#c0392b">+</text>
  <text x="510" y="272" fill="#c0392b">+</text>
  <text x="180" y="340" fill="#1f6f8b">−</text>
  <text x="310" y="338" fill="#1f6f8b">−</text>
  <text x="395" y="340" fill="#1f6f8b">−</text>
  <text x="470" y="338" fill="#1f6f8b">−</text>
  <text x="555" y="336" fill="#1f6f8b">−</text>
  <text x="92" y="372" fill="#c0392b">红 +：亮度上升（对比度增）</text>
  <text x="92" y="392" fill="#1f6f8b">蓝 −：亮度下降（对比度减）</text>
  <text x="340" y="372" fill="#333">事件带亚毫秒时间戳</text>
  <text x="340" y="392" fill="#333">只在变化处产生 → 稀疏</text>
</svg>
