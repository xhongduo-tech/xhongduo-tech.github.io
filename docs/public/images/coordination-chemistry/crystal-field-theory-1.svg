<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" font-family="sans-serif">
  <title>八面体场中 d 轨道的分裂</title>
  <desc>自由离子五个简并 d 轨道在八面体场中分裂为两组：能量较低的 t2g（三个轨道）与能量较高的 eg（两个轨道），分裂能为 Δo。</desc>
  <rect width="460" height="340" fill="#faf9f5"/>
  <text x="230" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">八面体场中 d 轨道的分裂</text>
  <text x="120" y="70" text-anchor="middle" font-size="14" fill="#1f6f8b">自由离子</text>
  <text x="350" y="70" text-anchor="middle" font-size="14" fill="#1f6f8b">八面体场中</text>
  <line x1="80" y1="200" x2="160" y2="200" stroke="#333" stroke-width="3"/>
  <text x="120" y="190" text-anchor="middle" font-size="13" fill="#333">5 个简并 d 轨道</text>
  <line x1="120" y1="205" x2="120" y2="235" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="235" x2="120" y2="305" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="300" y1="130" x2="400" y2="130" stroke="#c0392b" stroke-width="3"/>
  <text x="350" y="120" text-anchor="middle" font-size="13" fill="#c0392b">e g（两个轨道）</text>
  <line x1="300" y1="230" x2="400" y2="230" stroke="#1f6f8b" stroke-width="3"/>
  <text x="350" y="250" text-anchor="middle" font-size="13" fill="#1f6f8b">t 2g（三个轨道）</text>
  <line x1="300" y1="235" x2="300" y2="305" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="300" y1="180" x2="400" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="350" y="172" text-anchor="middle" font-size="13" fill="#888">重心（baricenter）</text>
  <line x1="120" y1="200" x2="300" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="200" x2="300" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 365 178 A 18 18 0 0 0 365 142" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="300" y="150" text-anchor="end" font-size="13" fill="#c0392b">Δ o</text>
  <text x="230" y="300" text-anchor="middle" font-size="13" fill="#333">eg 比 t2g 高 0.6 Δo，t2g 比重心低 0.4 Δo（重心守恒）</text>
</svg>
