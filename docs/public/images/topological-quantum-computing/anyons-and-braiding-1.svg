<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif">
  <title>辫子群生成元与 Yang-Baxter 关系</title>
  <desc>三个面板：左图为生成元 σ1（前两条辫股交换），中图为生成元 σ2（后两条辫股交换），右图给出辫子群的两组关系式。</desc>
  <rect width="760" height="300" fill="#faf9f5"/>

  <!-- 面板 1：σ1 -->
  <text x="90" y="24" font-size="16" fill="#333" text-anchor="middle">σ₁：辫股 1 与 2 交换</text>
  <!-- 辫股 C（不交换），黑色，x=170 -->
  <line x1="170" y1="40" x2="170" y2="270" stroke="#333" stroke-width="3"/>
  <!-- 辫股 A 与 B 在 (80,150) 交叉；A（青）在上，B（红）在下 -->
  <path d="M50,40 C65,90 65,120 80,150 C95,180 95,210 110,270" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M110,40 C95,90 95,120 80,150 C65,180 65,210 50,270" fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- B 在交叉处断开（画出纸张色短段） -->
  <path d="M110,40 C95,90 95,120 80,143" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M80,157 C65,190 65,210 50,270" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="80" y1="143" x2="80" y2="157" stroke="#faf9f5" stroke-width="5"/>
  <circle cx="80" cy="150" r="4" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>
  <!-- 顶端/底端位置标号 -->
  <text x="50" y="18" font-size="13" fill="#333" text-anchor="middle">1</text>
  <text x="110" y="18" font-size="13" fill="#333" text-anchor="middle">2</text>
  <text x="170" y="18" font-size="13" fill="#333" text-anchor="middle">3</text>

  <!-- 面板 2：σ2 -->
  <text x="300" y="24" font-size="16" fill="#333" text-anchor="middle">σ₂：辫股 2 与 3 交换</text>
  <line x1="240" y1="40" x2="240" y2="270" stroke="#333" stroke-width="3"/>
  <path d="M300,40 C315,90 315,120 330,150 C345,180 345,210 360,270" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M360,40 C345,90 345,120 330,150 C315,180 315,210 300,270" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M360,40 C345,90 345,120 330,143" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M330,157 C315,190 315,210 300,270" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="330" y1="143" x2="330" y2="157" stroke="#faf9f5" stroke-width="5"/>
  <circle cx="330" cy="150" r="4" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 面板 3：关系式 -->
  <text x="570" y="24" font-size="16" fill="#333" text-anchor="middle">辫子群 Bₙ 的关系</text>
  <line x1="420" y1="40" x2="420" y2="270" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="570" y="90" font-size="17" fill="#333" text-anchor="middle">σᵢ σⱼ = σⱼ σᵢ， |i−j| ≥ 2</text>
  <text x="570" y="150" font-size="17" fill="#c0392b" text-anchor="middle">σᵢ σᵢ₊₁ σᵢ = σᵢ₊₁ σᵢ σᵢ₊₁</text>
  <text x="570" y="210" font-size="14" fill="#666" text-anchor="middle">Yang-Baxter 关系</text>
  <text x="570" y="250" font-size="14" fill="#666" text-anchor="middle">不成立的是 σᵢ² = 1（对称群才有）</text>
</svg>
