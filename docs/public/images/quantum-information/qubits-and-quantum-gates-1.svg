<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360">
  <title>单量子比特的 Bloch 球表示</title>
  <desc>Bloch 球：北极 |0&gt;、南极 |1&gt;、z 轴竖直、x 轴水平，|ψ&gt; 为任意纯态，θ 为与 z 轴的夹角。</desc>
  <rect width="420" height="360" fill="#faf9f5"/>
  <circle cx="210" cy="180" r="120" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <ellipse cx="210" cy="180" rx="120" ry="40" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="210" y1="60" x2="210" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="180" x2="330" y2="180" stroke="#333" stroke-width="2"/>
  <circle cx="210" cy="60" r="4" fill="#1f6f8b"/>
  <circle cx="210" cy="300" r="4" fill="#1f6f8b"/>
  <circle cx="330" cy="180" r="4" fill="#1f6f8b"/>
  <text x="214" y="56" font-family="sans-serif" font-size="15" fill="#333">|0⟩</text>
  <text x="214" y="316" font-family="sans-serif" font-size="15" fill="#333">|1⟩</text>
  <text x="336" y="174" font-family="sans-serif" font-size="15" fill="#333">|+⟩</text>
  <text x="206" y="344" font-family="sans-serif" font-size="15" fill="#333">Z</text>
  <text x="334" y="204" font-family="sans-serif" font-size="15" fill="#333">X</text>
  <line x1="210" y1="180" x2="314" y2="120" stroke="#c0392b" stroke-width="3"/>
  <circle cx="314" cy="120" r="6" fill="#c0392b"/>
  <text x="320" y="108" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">|ψ⟩</text>
  <path d="M 210 140 A 40 40 0 0 1 244.6 160" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="236" y="150" font-family="sans-serif" font-size="15" fill="#c0392b">θ</text>
</svg>
