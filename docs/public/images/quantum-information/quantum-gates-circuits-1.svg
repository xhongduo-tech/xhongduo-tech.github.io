<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
  <title>两比特量子电路示例</title>
  <desc>展示量子电路的书写规则：每条横线代表一个量子比特，方块是单比特门，受控非门用控制点与目标点相连，末端为测量符号。</desc>
  <rect width="640" height="260" fill="#faf9f5"/>
  <!-- wire 1 -->
  <line x1="60" y1="70" x2="560" y2="70" stroke="#333" stroke-width="2"/>
  <text x="20" y="75" font-size="16" fill="#333">|0⟩</text>
  <!-- wire 2 -->
  <line x1="60" y1="170" x2="560" y2="170" stroke="#333" stroke-width="2"/>
  <text x="20" y="175" font-size="16" fill="#333">|0⟩</text>
  <!-- H gate on wire 1 -->
  <rect x="140" y="45" width="50" height="50" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="165" y="78" font-size="20" text-anchor="middle" fill="#1f6f8b">H</text>
  <!-- CNOT: control dot on wire1, target on wire2 -->
  <circle cx="300" cy="70" r="7" fill="#c0392b"/>
  <line x1="300" y1="77" x2="300" y2="163" stroke="#c0392b" stroke-width="2"/>
  <circle cx="300" cy="170" r="12" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="175" font-size="14" text-anchor="middle" fill="#c0392b">⊕</text>
  <!-- X gate on wire 2 -->
  <rect x="420" y="145" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="445" y="178" font-size="20" text-anchor="middle" fill="#333">X</text>
  <!-- measurement on wire 1 -->
  <circle cx="500" cy="70" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="495" y1="75" x2="505" y2="65" stroke="#333" stroke-width="2"/>
  <line x1="505" y1="75" x2="495" y2="65" stroke="#333" stroke-width="2"/>
  <!-- measurement on wire 2 -->
  <circle cx="500" cy="170" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="495" y1="175" x2="505" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="505" y1="175" x2="495" y2="165" stroke="#333" stroke-width="2"/>
  <!-- legend -->
  <text x="60" y="230" font-size="14" fill="#333">每条横线 = 一个量子比特；时间自左向右；方块 = 单比特门；⊕ 受控目标；末端的仪表盘 = 测量。</text>
  <text x="60" y="252" font-size="14" fill="#1f6f8b">H = 哈达玛门，X = Pauli-X 门，受控非门把两个比特的关联「写」出来。</text>
</svg>
