<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">下丘脑—垂体—甲状腺轴（HPT 轴）</title>
  <desc id="d">下丘脑分泌 TRH 刺激垂体分泌 TSH，TSH 刺激甲状腺合成 T4 与 T3，T4、T3 经虚线负反馈抑制下丘脑与垂体。</desc>
  <rect width="640" height="470" fill="#faf9f5"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="a3R" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <rect x="220" y="24" width="200" height="52" rx="8"/>
    <rect x="220" y="150" width="200" height="52" rx="8"/>
    <rect x="220" y="276" width="200" height="52" rx="8"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="320" y="55">下丘脑</text>
    <text x="320" y="181">垂体前叶</text>
    <text x="320" y="307">甲状腺</text>
  </g>

  <g stroke="#1f6f8b" stroke-width="2" fill="none">
    <line x1="320" y1="76" x2="320" y2="148" marker-end="url(#a3)"/>
    <line x1="320" y1="202" x2="320" y2="274" marker-end="url(#a3)"/>
  </g>
  <g fill="#1f6f8b" font-family="sans-serif" font-size="14" text-anchor="start">
    <text x="332" y="118">TRH（促甲状腺激素释放激素）</text>
    <text x="332" y="244">TSH（促甲状腺激素）</text>
  </g>

  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M 425 302 C 520 210, 500 110, 420 92" marker-end="url(#a3R)"/>
    <path d="M 425 302 C 560 280, 560 190, 420 176" marker-end="url(#a3R)"/>
  </g>
  <g fill="#c0392b" font-family="sans-serif" font-size="14" text-anchor="start">
    <text x="452" y="140">T4 / T3 负反馈（−）</text>
    <text x="452" y="240">T4 / T3 负反馈（−）</text>
  </g>

  <g fill="#333" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="320" y="362">甲状腺合成：碘 + 甲状腺球蛋白 → T4 → T3（脱碘酶）</text>
    <text x="320" y="382">血清检测：TSH 最敏感，其次游离 T4</text>
  </g>
</svg>
