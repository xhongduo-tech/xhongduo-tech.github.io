<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">血糖稳态：胰岛素与胰高血糖素的双环调节</title>
  <desc id="d">血糖升高刺激胰岛 β 细胞分泌胰岛素，促进肌肉、脂肪与肝脏摄取葡萄糖使血糖回落；血糖降低刺激 α 细胞分泌胰高血糖素，促进肝脏释放葡萄糖使血糖回升。</desc>
  <rect width="640" height="460" fill="#faf9f5"/>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="a6R" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <rect x="250" y="190" width="140" height="56" rx="8"/>
    <rect x="250" y="20" width="140" height="60" rx="8"/>
    <rect x="470" y="120" width="140" height="56" rx="8"/>
    <rect x="470" y="250" width="140" height="56" rx="8"/>
    <rect x="30" y="120" width="140" height="56" rx="8"/>
    <rect x="30" y="250" width="140" height="56" rx="8"/>
  </g>

  <g fill="#333" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="320" y="222">血糖水平</text>
    <text x="320" y="48">胰腺：胰岛</text>
    <text x="320" y="66" font-size="13">（α 与 β 细胞）</text>
    <text x="540" y="141">胰岛素</text>
    <text x="540" y="159" font-size="13">（β 细胞分泌）</text>
    <text x="540" y="271">肌肉 / 脂肪 / 肝脏</text>
    <text x="540" y="289" font-size="13">摄取葡萄糖、糖原合成</text>
    <text x="100" y="141">胰高血糖素</text>
    <text x="100" y="159" font-size="13">（α 细胞分泌）</text>
    <text x="100" y="271">肝脏</text>
    <text x="100" y="289" font-size="13">糖原分解、糖异生</text>
  </g>

  <g stroke="#1f6f8b" stroke-width="2" fill="none">
    <line x1="320" y1="190" x2="320" y2="82" marker-end="url(#a6)"/>
    <line x1="390" y1="50" x2="468" y2="120" marker-end="url(#a6)"/>
    <line x1="540" y1="176" x2="540" y2="248" marker-end="url(#a6)"/>
    <path d="M 468 306 C 430 270, 410 250, 392 250" marker-end="url(#a6R)"/>
    <line x1="250" y1="50" x2="172" y2="118" marker-end="url(#a6)"/>
    <line x1="100" y1="176" x2="100" y2="248" marker-end="url(#a6)"/>
    <path d="M 172 306 C 210 270, 228 250, 248 250" marker-end="url(#a6R)"/>
  </g>

  <g fill="#1f6f8b" font-family="sans-serif" font-size="14" text-anchor="start">
    <text x="330" y="130" font-size="13">血糖偏离正常，反馈调节启动</text>
    <text x="400" y="92" font-size="13">分泌</text>
    <text x="548" y="232" font-size="13">血糖升高</text>
    <text x="330" y="330" font-size="13">葡萄糖摄取增加，血糖回落</text>
    <text x="60" y="92" font-size="13">分泌</text>
    <text x="10" y="232" font-size="13">血糖降低</text>
    <text x="240" y="330" font-size="13">葡萄糖释放增加，血糖回升</text>
  </g>

  <g fill="#333" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="320" y="370">两环反向、互为拮抗：胰岛素是唯一的降糖激素，胰高血糖素是首要的升糖激素</text>
  </g>
</svg>
