<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>各系统生长发育模式（Scammon 曲线）</title>
  <desc>四种组织器官系统从出生到 20 岁，占成人水平的百分比随年龄变化：淋巴系统先升后降、神经系统先快后缓、体格生长快慢快、生殖系统青春期前缓慢后迅速上升。</desc>
  <rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
  <rect x="0" y="0" width="640" height="420" fill="none" stroke="#333" stroke-width="1.5"/>

  <g stroke="#d8d5cd" stroke-width="1">
    <line x1="70" y1="370" x2="610" y2="370"/>
    <line x1="70" y1="286.5" x2="610" y2="286.5"/>
    <line x1="70" y1="203" x2="610" y2="203"/>
    <line x1="70" y1="119.5" x2="610" y2="119.5"/>
    <line x1="70" y1="36" x2="610" y2="36"/>
  </g>

  <line x1="70" y1="203" x2="610" y2="203" stroke="#999" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="74" y="198" font-size="13" fill="#666">100%（成人水平）</text>

  <g font-size="13" fill="#333">
    <text x="60" y="374" text-anchor="end">0</text>
    <text x="60" y="290.5" text-anchor="end">50</text>
    <text x="60" y="207" text-anchor="end">100</text>
    <text x="60" y="123.5" text-anchor="end">150</text>
    <text x="60" y="40" text-anchor="end">200</text>
    <text x="18" y="205" transform="rotate(-90 18 205)" text-anchor="middle">占成人值的百分比（%）</text>
  </g>

  <g font-size="13" fill="#333">
    <text x="70" y="395" text-anchor="middle">0</text>
    <text x="205" y="395" text-anchor="middle">5</text>
    <text x="340" y="395" text-anchor="middle">10</text>
    <text x="475" y="395" text-anchor="middle">15</text>
    <text x="610" y="395" text-anchor="middle">20</text>
    <text x="340" y="415" text-anchor="middle">年龄（岁）</text>
  </g>

  <polyline points="70,331.25 124,277 232,184 340,109.6 394,91 475,118.9 556,160.75 610,196.4"
    fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="70,331.25 97,284.75 124,253.75 178,238.25 232,230.5 340,222.75 610,215"
    fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="70,346.75 178,315.75 286,284.75 394,253.75 502,230.5 610,215"
    fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="70,354.5 286,351.4 340,345.2 394,311.1 475,258.4 556,221.2 610,215"
    fill="none" stroke="#b26b00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <g font-size="14" fill="#333">
    <rect x="430" y="24" width="180" height="112" rx="6" fill="#faf9f5" stroke="#ccc"/>
    <rect x="440" y="36" width="14" height="4" fill="#c0392b"/>
    <text x="462" y="42">淋巴系统</text>
    <rect x="440" y="58" width="14" height="4" fill="#1f6f8b"/>
    <text x="462" y="64">神经系统</text>
    <rect x="440" y="80" width="14" height="4" fill="#333"/>
    <text x="462" y="86">全身（体格）</text>
    <rect x="440" y="102" width="14" height="4" fill="#b26b00"/>
    <text x="462" y="108">生殖系统</text>
  </g>

  <text x="300" y="78" font-size="13" fill="#c0392b">淋巴：青春期前超成人，随后回缩</text>
  <text x="86" y="300" font-size="13" fill="#1f6f8b">神经：先快后缓</text>
  <text x="120" y="360" font-size="13" fill="#333">体格：快—慢—快</text>
  <text x="392" y="352" font-size="13" fill="#b26b00">生殖：青春期骤升</text>
</svg>
