<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="sans-serif">
  <title>自蒸馏机制：预测器与 stop-gradient</title>
  <desc>同一网络处理两个增强视角，预测器只加在在线分支，目标分支经过 stop-gradient 截断梯度，损失为两个视角表征的负余弦相似度。</desc>
  <rect x="0" y="0" width="920" height="560" fill="#faf9f5"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">自蒸馏（SimSiam 式）：同一编码器 + 预测器 + stop-gradient</text>

  <rect x="395" y="48" width="130" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="69" text-anchor="middle" font-size="14" fill="#333">输入图像 x</text>

  <rect x="230" y="120" width="130" height="32" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="295" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">增强视角 v₁</text>
  <rect x="560" y="120" width="130" height="32" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="625" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">增强视角 v₂</text>
  <line x1="460" y1="82" x2="325" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="460" y1="82" x2="595" y2="120" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="186" width="160" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="207" text-anchor="middle" font-size="13" fill="#333">编码器 f</text>
  <rect x="550" y="186" width="160" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="207" text-anchor="middle" font-size="13" fill="#333">编码器 f（同一套）</text>
  <line x1="295" y1="152" x2="295" y2="186" stroke="#333" stroke-width="1.5"/>
  <line x1="625" y1="152" x2="625" y2="186" stroke="#333" stroke-width="1.5"/>
  <line x1="370" y1="203" x2="550" y2="203" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="460" y="196" text-anchor="middle" font-size="12" fill="#c0392b">共享权重</text>

  <rect x="210" y="252" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="272" text-anchor="middle" font-size="13" fill="#333">投影头 g</text>
  <rect x="550" y="252" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="272" text-anchor="middle" font-size="13" fill="#333">投影头 g（同一套）</text>
  <line x1="290" y1="220" x2="290" y2="252" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="220" x2="630" y2="252" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="318" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="338" text-anchor="middle" font-size="14" fill="#333">表征 z₁</text>
  <rect x="550" y="318" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="338" text-anchor="middle" font-size="14" fill="#333">表征 z₂</text>
  <line x1="290" y1="284" x2="290" y2="318" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="284" x2="630" y2="318" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="384" width="160" height="34" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">预测器 h</text>
  <line x1="290" y1="350" x2="290" y2="384" stroke="#333" stroke-width="1.5"/>

  <rect x="550" y="384" width="160" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="630" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">stop-gradient</text>
  <text x="630" y="413" text-anchor="middle" font-size="11" fill="#c0392b">梯度在此截断</text>
  <line x1="630" y1="350" x2="630" y2="384" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="452" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="472" text-anchor="middle" font-size="14" fill="#333">p₁ = h(z₁)</text>
  <rect x="550" y="452" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="472" text-anchor="middle" font-size="14" fill="#333">sg(z₂)</text>
  <line x1="290" y1="418" x2="290" y2="452" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="418" x2="630" y2="452" stroke="#333" stroke-width="1.5"/>

  <rect x="330" y="500" width="260" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="460" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">损失 = −cos(p₁, sg(z₂))，反向对称再来一次</text>
  <line x1="290" y1="484" x2="350" y2="500" stroke="#c0392b" stroke-width="2"/>
  <line x1="630" y1="484" x2="570" y2="500" stroke="#c0392b" stroke-width="2"/>
</svg>
