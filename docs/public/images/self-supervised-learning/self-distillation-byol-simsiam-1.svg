<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="sans-serif">
  <title>BYOL 的自蒸馏回路：在线学徒 + EMA 慢速老师</title>
  <desc>同一图像的两个增强视角分别过在线网络与目标网络；在线分支含预测器并接梯度，目标分支无梯度；目标网络参数由在线网络参数的指数滑动平均更新。</desc>
  <rect x="0" y="0" width="920" height="560" fill="#faf9f5"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">BYOL 的自蒸馏回路：在线学徒 + EMA 慢速老师</text>

  <rect x="395" y="48" width="130" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="69" text-anchor="middle" font-size="14" fill="#333">输入图像 x</text>

  <rect x="230" y="120" width="130" height="32" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="295" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">增强视角 v₁</text>
  <rect x="560" y="120" width="130" height="32" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="625" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">增强视角 v₂</text>
  <line x1="460" y1="82" x2="325" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="460" y1="82" x2="595" y2="120" stroke="#333" stroke-width="1.5"/>

  <text x="290" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">在线分支 · 接梯度</text>
  <text x="630" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">目标分支 · 无梯度</text>

  <rect x="210" y="186" width="160" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="207" text-anchor="middle" font-size="13" fill="#333">编码器 f_θ</text>
  <rect x="550" y="186" width="160" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="207" text-anchor="middle" font-size="13" fill="#333">编码器 f_ξ</text>
  <line x1="295" y1="152" x2="295" y2="186" stroke="#333" stroke-width="1.5"/>
  <line x1="625" y1="152" x2="625" y2="186" stroke="#333" stroke-width="1.5"/>

  <line x1="375" y1="203" x2="540" y2="203" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="540,203 532,199 532,207" fill="#c0392b"/>
  <text x="458" y="196" text-anchor="middle" font-size="13" fill="#c0392b">EMA 慢速老师：ξ ← τξ + (1−τ)θ，τ ≈ 0.996</text>

  <rect x="210" y="252" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="272" text-anchor="middle" font-size="13" fill="#333">投影头 g_θ</text>
  <rect x="550" y="252" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="272" text-anchor="middle" font-size="13" fill="#333">投影头 g_ξ</text>
  <line x1="290" y1="220" x2="290" y2="252" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="220" x2="630" y2="252" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="318" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="338" text-anchor="middle" font-size="14" fill="#333">表征 z_θ</text>
  <rect x="550" y="318" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="338" text-anchor="middle" font-size="14" fill="#333">表征 z'_ξ</text>
  <line x1="290" y1="284" x2="290" y2="318" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="284" x2="630" y2="318" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="384" width="160" height="34" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">预测器 q_θ（只在在线分支）</text>
  <line x1="290" y1="350" x2="290" y2="384" stroke="#333" stroke-width="1.5"/>

  <rect x="550" y="384" width="160" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="630" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">目标视为常数</text>
  <text x="630" y="413" text-anchor="middle" font-size="11" fill="#c0392b">等价 stop-gradient</text>
  <line x1="630" y1="350" x2="630" y2="384" stroke="#333" stroke-width="1.5"/>

  <rect x="210" y="452" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="472" text-anchor="middle" font-size="14" fill="#333">q_θ(z_θ)</text>
  <rect x="550" y="452" width="160" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="472" text-anchor="middle" font-size="14" fill="#333">z'_ξ（常数）</text>
  <line x1="290" y1="418" x2="290" y2="452" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="418" x2="630" y2="452" stroke="#333" stroke-width="1.5"/>

  <rect x="310" y="500" width="300" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="460" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">损失 = ‖q̄_θ(z_θ) − z̄'_ξ‖₂²（对称项取平均）</text>
  <line x1="290" y1="484" x2="340" y2="500" stroke="#c0392b" stroke-width="2"/>
  <line x1="630" y1="484" x2="580" y2="500" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="120" y="525" text-anchor="middle" font-size="13" fill="#c0392b">红色↑：梯度只回传在线分支</text>
  <text x="800" y="525" text-anchor="middle" font-size="13" fill="#1f6f8b">蓝色┄：目标路径无梯度</text>

  <line x1="290" y1="484" x2="290" y2="452" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,452 286,460 294,460" fill="#c0392b"/>
  <line x1="290" y1="418" x2="290" y2="384" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,384 286,392 294,392" fill="#c0392b"/>
  <line x1="290" y1="350" x2="290" y2="318" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,318 286,326 294,326" fill="#c0392b"/>
  <line x1="290" y1="284" x2="290" y2="252" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,252 286,260 294,260" fill="#c0392b"/>
  <line x1="290" y1="220" x2="290" y2="186" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,186 286,194 294,194" fill="#c0392b"/>
</svg>
