<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="sans-serif">
  <title>MAE 掩码自编码器架构</title>
  <desc>输入图像切块后随机遮罩 75%，可见块进入编码器，补入掩码标记后由解码器重建全部 patch，损失只计算被遮块。</desc>
  <rect x="0" y="0" width="920" height="520" fill="#faf9f5"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">掩码自编码器 MAE：遮住 75% 的块，再让解码器把它们重建回来</text>

  <!-- Row 1 -->
  <rect x="40" y="120" width="130" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="140" text-anchor="middle" font-size="13" fill="#333">输入图像 224×224</text>
  <text x="105" y="156" text-anchor="middle" font-size="12" fill="#666">16×16 块切分</text>

  <rect x="200" y="120" width="150" height="44" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="275" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">随机遮罩 75%</text>
  <text x="275" y="156" text-anchor="middle" font-size="12" fill="#666">每批遮罩不同</text>

  <line x1="170" y1="142" x2="200" y2="142" stroke="#333" stroke-width="1.5"/>

  <!-- masked grid 4x4 -->
  <g>
    <line x1="382" y1="92" x2="580" y2="92" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="580" y1="92" x2="580" y2="282" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="580" y1="282" x2="382" y2="282" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="382" y1="282" x2="382" y2="92" stroke="#c0392b" stroke-width="1.5"/>
  </g>
  <g fill="#dbeef2" stroke="#1f6f8b" stroke-width="1">
    <rect x="390" y="100" width="40" height="40"/>
    <rect x="482" y="192" width="40" height="40"/>
    <rect x="436" y="146" width="40" height="40"/>
    <rect x="528" y="238" width="40" height="40"/>
  </g>
  <g fill="#fff" stroke="#c0392b" stroke-width="1">
    <rect x="436" y="100" width="40" height="40"/>
    <rect x="482" y="100" width="40" height="40"/>
    <rect x="528" y="100" width="40" height="40"/>
    <rect x="390" y="146" width="40" height="40"/>
    <rect x="482" y="146" width="40" height="40"/>
    <rect x="528" y="146" width="40" height="40"/>
    <rect x="390" y="192" width="40" height="40"/>
    <rect x="436" y="192" width="40" height="40"/>
    <rect x="528" y="192" width="40" height="40"/>
    <rect x="390" y="238" width="40" height="40"/>
    <rect x="436" y="238" width="40" height="40"/>
    <rect x="482" y="238" width="40" height="40"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.5">
    <line x1="438" y1="102" x2="474" y2="138"/><line x1="474" y1="102" x2="438" y2="138"/>
    <line x1="484" y1="102" x2="520" y2="138"/><line x1="520" y1="102" x2="484" y2="138"/>
    <line x1="530" y1="102" x2="566" y2="138"/><line x1="566" y1="102" x2="530" y2="138"/>
    <line x1="392" y1="148" x2="428" y2="184"/><line x1="428" y1="148" x2="392" y2="184"/>
    <line x1="484" y1="148" x2="520" y2="184"/><line x1="520" y1="148" x2="484" y2="184"/>
    <line x1="530" y1="148" x2="566" y2="184"/><line x1="566" y1="148" x2="530" y2="184"/>
    <line x1="392" y1="194" x2="428" y2="230"/><line x1="428" y1="194" x2="392" y2="230"/>
    <line x1="438" y1="194" x2="474" y2="230"/><line x1="474" y1="194" x2="438" y2="230"/>
    <line x1="530" y1="194" x2="566" y2="230"/><line x1="566" y1="194" x2="530" y2="230"/>
    <line x1="392" y1="240" x2="428" y2="276"/><line x1="428" y1="240" x2="392" y2="276"/>
    <line x1="438" y1="240" x2="474" y2="276"/><line x1="474" y1="240" x2="438" y2="276"/>
    <line x1="484" y1="240" x2="520" y2="276"/><line x1="520" y1="240" x2="484" y2="276"/>
  </g>
  <text x="482" y="302" text-anchor="middle" font-size="13" fill="#333">遮罩 75%：青色为可见块，红色 × 为被遮块</text>

  <line x1="482" y1="278" x2="620" y2="142" stroke="#333" stroke-width="1.5"/>
  <rect x="620" y="120" width="250" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="140" text-anchor="middle" font-size="13" fill="#333">编码器 ViT（大模型）</text>
  <text x="745" y="156" text-anchor="middle" font-size="12" fill="#666">只处理可见块，计算省 3.5 倍</text>
  <line x1="745" y1="164" x2="745" y2="196" stroke="#333" stroke-width="1.5"/>
  <rect x="620" y="196" width="250" height="36" rx="6" fill="#eaf4f5" stroke="#1f6f8b" stroke-width="1.5"/>
  <text x="745" y="219" text-anchor="middle" font-size="14" fill="#1f6f8b">潜表征（低维）</text>

  <!-- Row 2 -->
  <line x1="745" y1="232" x2="745" y2="320" stroke="#333" stroke-width="1.5"/>
  <rect x="620" y="320" width="250" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="340" text-anchor="middle" font-size="13" fill="#333">轻量解码器（小模型）</text>
  <text x="745" y="356" text-anchor="middle" font-size="12" fill="#666">为被遮块补入 mask token</text>

  <line x1="620" y1="342" x2="580" y2="342" stroke="#333" stroke-width="1.5"/>

  <!-- reconstructed grid 4x4 -->
  <g fill="#eaf4f5" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="4,3">
    <rect x="390" y="330" width="40" height="40"/><rect x="436" y="330" width="40" height="40"/><rect x="482" y="330" width="40" height="40"/><rect x="528" y="330" width="40" height="40"/>
    <rect x="390" y="376" width="40" height="40"/><rect x="436" y="376" width="40" height="40"/><rect x="482" y="376" width="40" height="40"/><rect x="528" y="376" width="40" height="40"/>
    <rect x="390" y="422" width="40" height="40"/><rect x="436" y="422" width="40" height="40"/><rect x="482" y="422" width="40" height="40"/><rect x="528" y="422" width="40" height="40"/>
    <rect x="390" y="468" width="40" height="40"/><rect x="436" y="468" width="40" height="40"/><rect x="482" y="468" width="40" height="40"/><rect x="528" y="468" width="40" height="40"/>
  </g>
  <text x="482" y="520" text-anchor="middle" font-size="13" fill="#333">解码器重建全部 patch（虚线为被遮块的重建）</text>

  <rect x="620" y="410" width="250" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="745" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">MSE 损失：只对重建的被遮块算</text>
  <line x1="620" y1="420" x2="570" y2="470" stroke="#c0392b" stroke-width="2"/>
</svg>
