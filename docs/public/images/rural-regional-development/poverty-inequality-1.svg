<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <title>钱伯斯的剥夺陷阱（贫困陷阱）</title>
  <desc>五边形示意图：贫困、身体虚弱、隔离、脆弱性、无权五簇劣势相互强化，形成闭环的贫困陷阱。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#faf9f5"/>
  <title>剥夺陷阱</title>
  <g font-family="sans-serif" font-size="15" fill="#333">
    <circle cx="280" cy="70" r="8" fill="#c0392b"/>
    <text x="280" y="38" text-anchor="middle" fill="#c0392b" font-size="16">贫　困</text>
    <circle cx="150" cy="255" r="8" fill="#c0392b"/>
    <text x="150" y="292" text-anchor="middle" fill="#c0392b" font-size="16">身体虚弱</text>
    <circle cx="195" cy="85" r="8" fill="#c0392b"/>
    <text x="195" y="60" text-anchor="middle" fill="#c0392b" font-size="16">无　权</text>
    <circle cx="365" cy="85" r="8" fill="#c0392b"/>
    <text x="365" y="60" text-anchor="middle" fill="#c0392b" font-size="16">隔　离</text>
    <circle cx="410" cy="255" r="8" fill="#c0392b"/>
    <text x="410" y="292" text-anchor="middle" fill="#c0392b" font-size="16">脆弱性</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="280" y1="78" x2="158" y2="247" marker-end="url(#arrow)"/>
    <line x1="150" y1="247" x2="195" y2="93" marker-end="url(#arrow)"/>
    <line x1="203" y1="85" x2="357" y2="85" marker-end="url(#arrow)"/>
    <line x1="365" y1="93" x2="402" y2="247" marker-end="url(#arrow)"/>
    <line x1="402" y1="255" x2="288" y2="78" marker-end="url(#arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#1f6f8b">
    <text x="280" y="330" text-anchor="middle">五簇劣势互相为因果：任何一簇被打破，</text>
    <text x="280" y="352" text-anchor="middle">其余四簇都随之松动——这是脱贫干预的杠杆点。</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#666">
    <text x="280" y="390" text-anchor="middle">Chambers, Putting the Last First (1983), ch.4</text>
  </g>
</svg>
