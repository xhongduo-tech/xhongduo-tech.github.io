<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <title>恰亚诺夫的主观均衡：家庭劳动投入的决定</title>
  <desc>横轴为家庭劳动投入小时数，纵轴为边际量。边际消费效用曲线递减，边际劳动负效用曲线递增，两条曲线的交点决定家庭的最优劳动投入 L*。</desc>
  <rect width="560" height="380" fill="#faf9f5"/>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <line x1="70" y1="320" x2="520" y2="320" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="20" x2="70" y2="320" stroke="#333" stroke-width="1.5"/>
    <text x="505" y="345" font-size="15" text-anchor="end">家庭劳动投入 L（小时）</text>
    <text x="18" y="30" font-size="15">边际量</text>
    <text x="70" y="345" text-anchor="middle">0</text>
    <text x="420" y="345" text-anchor="middle">L*</text>
    <line x1="420" y1="320" x2="420" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="70" y1="120" x2="420" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <g font-family="sans-serif" font-size="15">
    <path d="M 90 295 Q 260 200 450 132" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="455" y="128" fill="#c0392b">边际消费效用</text>
    <path d="M 90 60 Q 260 90 500 258" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
    <text x="430" y="60" fill="#1f6f8b">边际劳动负效用</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <circle cx="420" cy="120" r="5" fill="#c0392b"/>
    <text x="300" y="110">均衡点：劳动边际产量=消费与闲暇的边际替代率</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#666">
    <text x="90" y="370">恰亚诺夫：农户按「劳动—消费平衡」决定劳动投入，而非按利润最大化。</text>
  </g>
</svg>
