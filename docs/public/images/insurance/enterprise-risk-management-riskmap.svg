<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <title>企业风险地图（风险图谱）</title>
  <desc>以损失幅度为横轴、发生概率为纵轴绘制的风险地图，不同风险落入红、黄、绿不同风险区域。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">企业风险地图（风险图谱）</text>
  <g font-family="sans-serif">
    <!-- 概率轴说明 -->
    <text x="30" y="400" text-anchor="middle" font-size="14" fill="#333">发生概率（高 ↑）</text>
    <text x="600" y="20" text-anchor="end" font-size="14" fill="#333">损失幅度（大 →）</text>
    <!-- 区域背景 -->
    <rect x="60" y="60" width="300" height="210" fill="#f0e9e0"/>
    <rect x="360" y="60" width="230" height="210" fill="#f2c4c4"/>
    <rect x="60" y="270" width="300" height="110" fill="#d7e7d0"/>
    <rect x="360" y="270" width="230" height="110" fill="#f2e2b3"/>
    <!-- 区域标签 -->
    <text x="210" y="310" text-anchor="middle" font-size="15" fill="#2e6b2e" font-weight="bold">低风险区</text>
    <text x="475" y="310" text-anchor="middle" font-size="15" fill="#b07d10" font-weight="bold">中风险区</text>
    <text x="475" y="120" text-anchor="middle" font-size="15" fill="#a22a1f" font-weight="bold">高风险区</text>
    <text x="210" y="120" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold">次高风险区</text>
    <!-- 坐标轴 -->
    <line x1="60" y1="380" x2="60" y2="60" stroke="#555" stroke-width="2"/>
    <line x1="60" y1="380" x2="590" y2="380" stroke="#555" stroke-width="2"/>
    <!-- 风险点 -->
    <circle cx="140" cy="120" r="7" fill="#1f6f8b"/>
    <text x="140" y="100" text-anchor="middle" font-size="13" fill="#333">轻微工伤（低概率）</text>
    <circle cx="330" cy="340" r="7" fill="#1f6f8b"/>
    <text x="330" y="362" text-anchor="middle" font-size="13" fill="#333">小额财产损失</text>
    <circle cx="470" cy="150" r="7" fill="#c0392b"/>
    <text x="470" y="132" text-anchor="middle" font-size="13" fill="#333">重大产品责任事故</text>
    <circle cx="500" cy="300" r="7" fill="#c0392b"/>
    <text x="500" y="322" text-anchor="middle" font-size="13" fill="#333">关键设备火灾</text>
    <circle cx="230" cy="200" r="7" fill="#1f6f8b"/>
    <text x="230" y="222" text-anchor="middle" font-size="13" fill="#333">员工舞弊</text>
  </g>
</svg>
