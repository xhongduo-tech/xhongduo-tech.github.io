<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <title>再保险方法分类图</title>
  <desc>按承保方式分临分与合同再保险，按分保比例分比例与非比例再保险，四个象限列出代表方法。</desc>
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">再保险方法分类</text>
  <g font-family="sans-serif">
    <!-- 轴标签 -->
    <text x="160" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">按分保比例分</text>
    <text x="555" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">按分保比例分</text>
    <text x="30" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">按承保方式分</text>
    <text x="30" y="330" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">按承保方式分</text>
    <!-- 四象限 -->
    <rect x="60" y="95" width="200" height="160" fill="#f0e9e0" stroke="#999" stroke-width="1"/>
    <rect x="260" y="95" width="200" height="160" fill="#f2e2b3" stroke="#999" stroke-width="1"/>
    <rect x="460" y="95" width="140" height="160" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="60" y="255" width="200" height="160" fill="#d7e7d0" stroke="#999" stroke-width="1"/>
    <rect x="260" y="255" width="200" height="160" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="460" y="255" width="140" height="160" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <!-- 象限标签与内容 -->
    <text x="160" y="130" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold">比例再保险</text>
    <text x="360" y="130" text-anchor="middle" font-size="15" fill="#b07d10" font-weight="bold">非比例再保险</text>
    <text x="160" y="160" text-anchor="middle" font-size="13" fill="#333">成数分保</text>
    <text x="160" y="182" text-anchor="middle" font-size="13" fill="#333">溢额分保</text>
    <text x="360" y="160" text-anchor="middle" font-size="13" fill="#333">超额损失分保</text>
    <text x="360" y="182" text-anchor="middle" font-size="13" fill="#333">（逐次/逐事故）</text>
    <text x="160" y="290" text-anchor="middle" font-size="15" fill="#2e6b2e" font-weight="bold">临分再保险</text>
    <text x="160" y="320" text-anchor="middle" font-size="13" fill="#333">逐单协商、逐单承保</text>
    <text x="160" y="345" text-anchor="middle" font-size="13" fill="#333">比例与非比例均可</text>
    <text x="360" y="290" text-anchor="middle" font-size="15" fill="#2e6b2e" font-weight="bold">合同再保险</text>
    <text x="360" y="320" text-anchor="middle" font-size="13" fill="#333">一揽子自动约定</text>
    <text x="360" y="345" text-anchor="middle" font-size="13" fill="#333">比例与非比例均可</text>
    <!-- 说明脚注 -->
    <text x="320" y="435" text-anchor="middle" font-size="13" fill="#555">两个维度正交：任何一张分保业务，都可按这两把尺子定位</text>
  </g>
</svg>
