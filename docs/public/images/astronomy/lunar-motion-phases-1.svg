<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>月相成因示意图：月球绕地轨道与从地球看到的月相</title>
<desc>太阳在左，光线近似平行射向右方。月球沿虚线轨道绕地球运动，轨道上每个月球圆面都画出朝向太阳的一侧被照亮。从地球中心出发的虚线穿过每个月球位置，延伸指向外侧的月相外观小图，标注朔、娥眉月、上弦月、盈凸月、望、亏凸月、下弦月、残月。</desc>
<rect x="0" y="0" width="780" height="520" fill="#faf9f5"/>

<!-- 太阳 -->
<circle cx="50" cy="250" r="26" fill="#c97b3d"/>
<text x="50" y="300" text-anchor="middle" font-size="16" fill="#333">太阳</text>
<!-- 阳光射线 -->
<line x1="76" y1="222" x2="118" y2="222" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="76" y1="250" x2="118" y2="250" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="76" y1="278" x2="118" y2="278" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="48" y="212" text-anchor="middle" font-size="13" fill="#7a6a55">阳光（近似平行）</text>

<!-- 月球轨道 -->
<circle cx="380" cy="250" r="165" fill="none" stroke="#b8b2a4" stroke-width="1.2" stroke-dasharray="5 5"/>

<!-- 视线：地球 → 月球 → 外观小图 -->
<g stroke="#b8b2a4" stroke-width="0.8" stroke-dasharray="3 4">
<line x1="380" y1="250" x2="155" y2="250"/>
<line x1="380" y1="250" x2="220.9" y2="409.1"/>
<line x1="380" y1="250" x2="380" y2="475"/>
<line x1="380" y1="250" x2="539.1" y2="409.1"/>
<line x1="380" y1="250" x2="605" y2="250"/>
<line x1="380" y1="250" x2="539.1" y2="90.9"/>
<line x1="380" y1="250" x2="380" y2="25"/>
<line x1="380" y1="250" x2="220.9" y2="90.9"/>
</g>

<!-- 轨道上 8 个月球位置：朝太阳（左侧）一面亮 -->
<g stroke="#333" stroke-width="0.8">
<!-- 新月(左) -->
<path d="M 215,235 A 14,14 0 0 0 215,265 Z" fill="#faf9f5"/>
<path d="M 215,235 A 14,14 0 0 1 215,265 Z" fill="#333"/>
<!-- 娥眉月(左下) -->
<path d="M 263.3,352.7 A 14,14 0 0 0 263.3,380.7 Z" fill="#faf9f5"/>
<path d="M 263.3,352.7 A 14,14 0 0 1 263.3,380.7 Z" fill="#333"/>
<!-- 上弦月(下) -->
<path d="M 380,401 A 14,14 0 0 0 380,429 Z" fill="#faf9f5"/>
<path d="M 380,401 A 14,14 0 0 1 380,429 Z" fill="#333"/>
<!-- 盈凸月(右下) -->
<path d="M 496.7,352.7 A 14,14 0 0 0 496.7,380.7 Z" fill="#faf9f5"/>
<path d="M 496.7,352.7 A 14,14 0 0 1 496.7,380.7 Z" fill="#333"/>
<!-- 满月(右) -->
<path d="M 545,235 A 14,14 0 0 0 545,265 Z" fill="#faf9f5"/>
<path d="M 545,235 A 14,14 0 0 1 545,265 Z" fill="#333"/>
<!-- 亏凸月(右上) -->
<path d="M 496.7,119.3 A 14,14 0 0 0 496.7,147.3 Z" fill="#faf9f5"/>
<path d="M 496.7,119.3 A 14,14 0 0 1 496.7,147.3 Z" fill="#333"/>
<!-- 下弦月(上) -->
<path d="M 380,71 A 14,14 0 0 0 380,99 Z" fill="#faf9f5"/>
<path d="M 380,71 A 14,14 0 0 1 380,99 Z" fill="#333"/>
<!-- 残月(左上) -->
<path d="M 263.3,119.3 A 14,14 0 0 0 263.3,147.3 Z" fill="#faf9f5"/>
<path d="M 263.3,119.3 A 14,14 0 0 1 263.3,147.3 Z" fill="#333"/>
</g>

<!-- 地球 -->
<circle cx="380" cy="250" r="18" fill="#1f6f8b" opacity="0.9"/>
<text x="380" y="278" text-anchor="middle" font-size="16" fill="#333">地球</text>

<!-- 外侧月相小图 -->
<defs>
<clipPath id="ph0"><circle cx="155" cy="250" r="16"/></clipPath>
<clipPath id="ph1"><circle cx="220.9" cy="409.1" r="16"/></clipPath>
<clipPath id="ph2"><circle cx="380" cy="475" r="16"/></clipPath>
<clipPath id="ph3"><circle cx="539.1" cy="409.1" r="16"/></clipPath>
<clipPath id="ph4"><circle cx="605" cy="250" r="16"/></clipPath>
<clipPath id="ph5"><circle cx="539.1" cy="90.9" r="16"/></clipPath>
<clipPath id="ph6"><circle cx="380" cy="25" r="16"/></clipPath>
<clipPath id="ph7"><circle cx="220.9" cy="90.9" r="16"/></clipPath>
</defs>

<g>
<!-- 朔：全暗 -->
<circle cx="155" cy="250" r="16" fill="#333"/>
<circle cx="155" cy="250" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 娥眉月：右侧亮 -->
<circle cx="220.9" cy="409.1" r="16" fill="#333"/>
<circle cx="231.9" cy="409.1" r="16" fill="#faf9f5" clip-path="url(#ph1)"/>
<circle cx="220.9" cy="409.1" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 上弦月：右半亮 -->
<circle cx="380" cy="475" r="16" fill="#333"/>
<circle cx="397" cy="475" r="16" fill="#faf9f5" clip-path="url(#ph2)"/>
<circle cx="380" cy="475" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 盈凸月：左留一窄暗边 -->
<circle cx="539.1" cy="409.1" r="16" fill="#333"/>
<circle cx="544.1" cy="409.1" r="16" fill="#faf9f5" clip-path="url(#ph3)"/>
<circle cx="539.1" cy="409.1" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 望：全亮 -->
<circle cx="605" cy="250" r="16" fill="#faf9f5"/>
<circle cx="605" cy="250" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 亏凸月：右留一窄暗边 -->
<circle cx="539.1" cy="90.9" r="16" fill="#333"/>
<circle cx="534.1" cy="90.9" r="16" fill="#faf9f5" clip-path="url(#ph5)"/>
<circle cx="539.1" cy="90.9" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 下弦月：左半亮 -->
<circle cx="380" cy="25" r="16" fill="#333"/>
<circle cx="363" cy="25" r="16" fill="#faf9f5" clip-path="url(#ph6)"/>
<circle cx="380" cy="25" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
<!-- 残月：左侧亮 -->
<circle cx="220.9" cy="90.9" r="16" fill="#333"/>
<circle cx="209.9" cy="90.9" r="16" fill="#faf9f5" clip-path="url(#ph7)"/>
<circle cx="220.9" cy="90.9" r="16" fill="none" stroke="#333" stroke-width="1.2"/>
</g>

<!-- 月相名称 -->
<g font-size="14" fill="#333" text-anchor="middle">
<text x="155" y="272">朔（新月）</text>
<text x="220.9" y="431">娥眉月</text>
<text x="380" y="497">上弦月</text>
<text x="539.1" y="431">盈凸月</text>
<text x="605" y="272">望（满月）</text>
<text x="539.1" y="113">亏凸月</text>
<text x="380" y="47">下弦月</text>
<text x="220.9" y="113">残月</text>
</g>

<text x="390" y="516" text-anchor="middle" font-size="14" fill="#7a6a55">外侧小圆为从地球看到的月相外观（示意，不按比例）</text>
</svg>
