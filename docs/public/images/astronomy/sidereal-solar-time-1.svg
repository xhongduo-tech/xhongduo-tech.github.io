<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>恒星日与太阳日的区别</title>
<desc>地球绕太阳公转，指向遥远恒星的方向近似不变，而指向太阳的方向每天改变约 1 度。一恒星日后恒星已回到子午线，太阳却还差一个约 0.99 度的小角，故太阳日比恒星日长约 3 分 56 秒。</desc>
<rect width="640" height="500" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-size="15" fill="#c0392b">恒星日 ≈ 23ʰ56ᵐ04ˢ；太阳日 = 24ʰ —— 太阳日比恒星日长约 3 分 56 秒</text>

<!-- 公转轨道（示意，不按比例） -->
<circle cx="320" cy="260" r="150" fill="none" stroke="#b9b3a9" stroke-width="1.5" stroke-dasharray="6 4"/>
<!-- 轨道方向示意箭头 -->
<polygon points="404,148 416,144 411,136" fill="#666"/>

<!-- 太阳 -->
<circle cx="320" cy="90" r="26" fill="#e6c15c" stroke="#c9a227" stroke-width="1.5"/>
<text x="320" y="58" text-anchor="middle" font-size="15" fill="#333">太阳</text>

<!-- 地球 A -->
<circle cx="320" cy="410" r="22" fill="#1f6f8b"/>
<text x="320" y="448" text-anchor="middle" font-size="14" fill="#333">地球 A：此刻太阳在子午线上（正午）</text>

<!-- A 处：太阳方向 = 恒星方向（竖直向上） -->
<line x1="320" y1="410" x2="320" y2="130" stroke="#c0392b" stroke-width="2"/>
<polygon points="320,112 314,130 326,130" fill="#c0392b"/>
<text x="333" y="156" font-size="13" fill="#c0392b">此刻太阳方向（同时指向一颗遥远恒星）</text>

<!-- 地球 B：一恒星日后 -->
<circle cx="443" cy="348" r="22" fill="#1f6f8b"/>
<text x="443" y="390" text-anchor="middle" font-size="14" fill="#333">地球 B：一恒星日后（位置与角度夸大）</text>

<!-- B 处：恒星方向（竖直向上，与 A 处平行） -->
<line x1="443" y1="348" x2="443" y2="205" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="443,187 437,205 449,205" fill="#1f6f8b"/>
<text x="455" y="200" font-size="13" fill="#1f6f8b">恒星方向（不变）</text>

<!-- B 处：太阳方向 -->
<line x1="443" y1="348" x2="320" y2="90" stroke="#c0392b" stroke-width="2"/>

<!-- 角度弧与标注 -->
<path d="M 443 292 A 56 56 0 0 0 419 297" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="415" y="274" font-size="14" fill="#333">θ</text>
<text x="330" y="320" text-anchor="middle" font-size="13" fill="#333">一恒星日后，太阳尚未回到子午线，还需再转 θ ≈ 0.99°（图中放大）</text>
</svg>
