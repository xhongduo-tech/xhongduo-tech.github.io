<svg viewBox="0 0 680 420" width="680" height="420" xmlns="http://www.w3.org/2000/svg">
<title>轨道六要素示意</title>
<desc>以黄道面为参考面，展示升交点黄经 Ω、轨道倾角 i、近点角距 ω 与半长轴 a 等轨道要素</desc>
<rect width="680" height="420" fill="#faf9f5"/>
<!-- main orbit -->
<ellipse cx="395" cy="230" rx="190" ry="135.7" fill="none" stroke="#333" stroke-width="2"/>
<!-- semi-major axis a -->
<line x1="395" y1="230" x2="205" y2="230" stroke="#999" stroke-width="1.5"/>
<text x="350" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">a</text>
<!-- sun at focus -->
<circle cx="262" cy="230" r="14" fill="#c0392b" stroke="#333" stroke-width="2"/>
<text x="262" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">太阳（焦点）</text>
<!-- perihelion / aphelion -->
<circle cx="205" cy="230" r="5" fill="#333"/>
<text x="182" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">近日点</text>
<circle cx="585" cy="230" r="5" fill="#333"/>
<text x="575" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">远日点</text>
<!-- vernal equinox direction -->
<line x1="262" y1="230" x2="430" y2="230" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="430,230 418,224 418,236" fill="#1f6f8b"/>
<text x="445" y="224" font-family="sans-serif" font-size="13" fill="#1f6f8b">春分点方向 ♈</text>
<!-- line of nodes -->
<line x1="490" y1="347.5" x2="208.9" y2="202.6" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="490" cy="347.5" r="5" fill="#c0392b"/>
<text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">升交点 ☊</text>
<circle cx="208.9" cy="202.6" r="5" fill="#c0392b"/>
<text x="208.9" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">降交点</text>
<!-- omega arc -->
<path d="M302,250.6 A45,45 0 0 1 217,230" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="245" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">ω</text>
<!-- Omega arc -->
<path d="M302,230 A40,40 0 0 1 297.5,248.3" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="305" y="252" font-family="sans-serif" font-size="13" fill="#1f6f8b">Ω</text>
<!-- inclination inset -->
<rect x="20" y="20" width="215" height="120" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="127" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">侧视图：轨道倾角 i</text>
<line x1="30" y1="100" x2="185" y2="100" stroke="#333" stroke-width="2"/>
<line x1="90" y1="100" x2="216.9" y2="40.8" stroke="#1f6f8b" stroke-width="2"/>
<text x="140" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">黄道面（参考面）</text>
<text x="212" y="52" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f6f8b">行星轨道面</text>
<path d="M112,100 A22,22 0 0 0 109.9,90.7" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="118" y="88" font-family="sans-serif" font-size="13" fill="#c0392b">i</text>
<!-- legend -->
<text x="340" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Ω：春分点到升交点（参考面内）；ω：升交点到近日点（轨道面内）；a：半长轴；e：偏心率</text>
</svg>
