<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">赤经与时角：从北天极上方俯视天赤道</title>
  <desc id="desc">以从北天极上方俯视的视角看天赤道。圆环是天赤道，中心是北天极；竖直虚线是子午圈（时角起算点），自它沿天赤道向西量出红色弧线为时角 t；自春分点 γ 沿天赤道向东量出青色弧线为赤经 α。可见时角与赤经沿相反方向量取，二者的差由恒星时联系。</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="480" fill="#faf9f5"/>

  <text x="200" y="26" text-anchor="middle" font-size="15" fill="#333">从北天极上方俯视天赤道</text>
  <text x="200" y="46" text-anchor="middle" font-size="13" fill="#777">赤经向东（逆时针）量，时角向西（顺时针）量</text>

  <!-- 天赤道 -->
  <circle cx="200" cy="240" r="150" fill="none" stroke="#333" stroke-width="1.6"/>

  <!-- 子午圈（时角起算点），竖直虚线 -->
  <line x1="200" y1="240" x2="200" y2="390" stroke="#777" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 时圈（过恒星、过春分点） -->
  <line x1="200" y1="240" x2="311.5" y2="139.6" stroke="#bbb" stroke-width="1"/>
  <line x1="200" y1="240" x2="70.1" y2="165" stroke="#bbb" stroke-width="1"/>

  <!-- 赤经弧：春分点 γ → 恒星 σ，向东（逆时针，过天顶上方） -->
  <path d="M 311.5 139.6 A 150 150 0 0 0 70.1 165" fill="none" stroke="#1f6f8b" stroke-width="3" marker-end="url(#arrow-cyan)"/>

  <!-- 时角弧：子午圈 → 恒星 σ，向西（顺时针，过左方） -->
  <path d="M 200 390 A 150 150 0 0 1 70.1 165" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- 关键点 -->
  <g fill="#333">
    <circle cx="200" cy="240" r="4"/>
    <circle cx="311.5" cy="139.6" r="4"/>
    <circle cx="70.1" cy="165" r="4"/>
  </g>

  <!-- 文字标注 -->
  <g font-size="14" fill="#333">
    <text x="200" y="244" text-anchor="middle">北天极</text>
    <text x="320" y="124" text-anchor="start">春分点 γ</text>
    <text x="28" y="158" text-anchor="start">恒星 σ</text>
    <text x="200" y="414" text-anchor="middle">子午圈（时角起算点）</text>
  </g>
  <text x="184" y="84" text-anchor="middle" font-size="14" fill="#1f6f8b">赤经 α</text>
  <text x="70" y="334" text-anchor="middle" font-size="14" fill="#c0392b">时角 t</text>

  <!-- 图例 -->
  <text x="30" y="450" font-size="13" fill="#c0392b">● 时角 t：自子午圈沿天赤道向西量</text>
  <text x="30" y="468" font-size="13" fill="#1f6f8b">● 赤经 α：自春分点沿天赤道向东量</text>
</svg>
