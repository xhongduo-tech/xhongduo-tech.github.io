<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">岁差：地球自转轴绕黄道轴画圆锥</title>
  <desc id="desc">示意地球自转轴的岁差。地球在下方（自转并带赤道隆起），竖直虚线为黄道轴，顶端是北黄极；围绕北黄极的虚线椭圆是自转轴的进动轨迹，北天极 P 沿它每约 26 000 年绕一圈。当前自转轴（实线）指向现在的北天极 P，约 1.3 万年前自转轴（虚线）指向 P′。穿过地球的水平虚线是黄道面，青色斜线是当前的天赤道面，二者夹角即黄赤交角 ε ≈ 23.4°。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="620" fill="#faf9f5"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333">岁差：地球自转轴绕黄道轴画圆锥</text>
  <text x="320" y="52" text-anchor="middle" font-size="13" fill="#777">示意图（自转轴、黄道轴与赤道面的相对关系）</text>

  <!-- 黄道轴（竖直） -->
  <line x1="320" y1="480" x2="320" y2="110" stroke="#777" stroke-width="1.5"/>
  <text x="332" y="122" font-size="14" fill="#333">黄道轴</text>

  <!-- 北黄极 -->
  <circle cx="320" cy="110" r="4" fill="#333"/>
  <text x="320" y="94" text-anchor="middle" font-size="14" fill="#333">北黄极</text>

  <!-- 进动轨迹（虚线椭圆） -->
  <ellipse cx="320" cy="110" rx="150" ry="42" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- 岁差方向小箭头 -->
  <path d="M 450 131 A 150 42 0 0 1 469.4 113.7" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="476" y="104" font-size="13" fill="#c0392b">岁差方向</text>

  <!-- 现在的自转轴与北天极 -->
  <line x1="320" y1="480" x2="450" y2="131" stroke="#333" stroke-width="2.5"/>
  <circle cx="450" cy="131" r="4.5" fill="#333"/>
  <text x="398" y="292" font-size="14" fill="#333">自转轴（现在）</text>
  <text x="456" y="124" font-size="14" fill="#333">北天极 P（现在）</text>

  <!-- 约 1.3 万年前的自转轴与北天极 -->
  <line x1="320" y1="480" x2="190" y2="89" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="190" cy="89" r="4" fill="#999"/>
  <text x="98" y="204" font-size="13" fill="#777">自转轴（约 1.3 万年前）</text>
  <text x="176" y="78" text-anchor="end" font-size="13" fill="#777">P′（约 1.3 万年前）</text>

  <!-- 地球 -->
  <circle cx="320" cy="480" r="42" fill="none" stroke="#333" stroke-width="2.2"/>
  <text x="320" y="546" text-anchor="middle" font-size="14" fill="#333">地球（自转 + 赤道隆起）</text>

  <!-- 黄道面（水平） -->
  <line x1="140" y1="480" x2="500" y2="480" stroke="#999" stroke-width="1.3" stroke-dasharray="2 3"/>
  <text x="500" y="474" text-anchor="end" font-size="13" fill="#777">黄道面</text>

  <!-- 天赤道面（与自转轴垂直，青色） -->
  <line x1="189" y1="431" x2="451" y2="529" stroke="#1f6f8b" stroke-width="2"/>
  <text x="330" y="520" font-size="13" fill="#1f6f8b">天赤道面</text>

  <!-- 黄赤交角 ε -->
  <path d="M 320 420 A 60 60 0 0 1 340.9 423.8" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="326" y="406" font-size="13" fill="#333">ε ≈ 23.4°</text>

  <!-- 说明 -->
  <text x="320" y="580" text-anchor="middle" font-size="15" fill="#333">自转轴绕黄道轴画圆锥，圆锥半角 ≈ 黄赤交角 ε ≈ 23.4°，周期约 26 000 年</text>
  <text x="320" y="602" text-anchor="middle" font-size="14" fill="#333">春分点每年沿黄道西移约 50.3″，回归年因此比恒星年短约 20 分钟</text>
</svg>
