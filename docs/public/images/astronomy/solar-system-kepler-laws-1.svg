<svg viewBox="0 0 680 420" width="680" height="420" xmlns="http://www.w3.org/2000/svg">
<title>开普勒第二定律：等面积定律</title>
<desc>行星沿椭圆轨道绕太阳运动，近日点附近角位移大、远日点附近角位移小，但相等时间内扫过相等面积</desc>
<rect width="680" height="420" fill="#faf9f5"/>
<!-- orbit -->
<ellipse cx="340" cy="210" rx="260" ry="130" fill="none" stroke="#333" stroke-width="2"/>
<!-- semi-major axis -->
<line x1="340" y1="210" x2="600" y2="210" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="470" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">a（半长轴）</text>
<!-- sun at focus -->
<circle cx="184" cy="210" r="18" fill="#c0392b" stroke="#333" stroke-width="2"/>
<text x="184" y="252" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">太阳（焦点）</text>
<!-- perihelion / aphelion points -->
<circle cx="80" cy="210" r="5" fill="#333"/>
<text x="80" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">近日点</text>
<circle cx="600" cy="210" r="5" fill="#333"/>
<text x="600" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">远日点</text>
<!-- equal-area triangles -->
<polygon points="184,210 115,265 115,135" fill="#1f6f8b" fill-opacity="0.22" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="184,210 599,211 599,189" fill="#1f6f8b" fill-opacity="0.22" stroke="#1f6f8b" stroke-width="2"/>
<text x="130" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">近日点附近：跑得快，角位移大</text>
<text x="560" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b">远日点附近：跑得慢，角位移小</text>
<text x="340" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">相等时间内扫过相等面积（两块阴影区域面积相等）</text>
</svg>
