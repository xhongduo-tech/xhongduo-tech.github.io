<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">天文三角形 PZX</title>
  <desc id="desc">以子午面为纸面的天球剖面。大圆是子午圈，水平直径是地平圈，上方为可见天空；天顶 Z 在顶部，北点 N 与南点 S 在地平圈两端，北天极 P 在子午圈上距北点高度约等于观测纬度 φ。天体 X 与 Z、P 围成天文三角形：边 ZP=90°−φ（余纬）、PX=90°−δ（极距）、ZX=90°−h（天顶距），在 P 的角为时角 t，在 Z 的角为方位角 A。</desc>

  <rect x="0" y="0" width="640" height="580" fill="#faf9f5"/>

  <!-- 天球（子午圈） -->
  <circle cx="320" cy="300" r="220" fill="none" stroke="#333" stroke-width="2.2"/>

  <!-- 地平圈（水平直径） -->
  <line x1="100" y1="300" x2="540" y2="300" stroke="#666" stroke-width="1.6"/>

  <!-- 天文三角形三边 -->
  <path d="M 320 80 A 220 220 0 0 1 151 159" fill="none" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="151" y1="159" x2="445" y2="150" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="320" y1="80" x2="445" y2="150" stroke="#c0392b" stroke-width="2.6"/>

  <!-- 角弧：在 P 的时角 t -->
  <path d="M 178.2 146.3 A 30 30 0 0 1 181 158.1" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <!-- 角弧：在 Z 的方位角 A -->
  <path d="M 350.6 97 A 35 35 0 0 1 288.3 94.8" fill="none" stroke="#c0392b" stroke-width="1.6"/>

  <!-- 关键点 -->
  <g fill="#333">
    <circle cx="320" cy="80" r="4"/>
    <circle cx="151" cy="159" r="4"/>
    <circle cx="445" cy="150" r="4"/>
  </g>

  <!-- 顶点标注 -->
  <g font-size="15" fill="#333">
    <text x="332" y="76">Z（天顶）</text>
    <text x="112" y="142">P（北天极）</text>
    <text x="455" y="146">X（天体）</text>
    <text x="100" y="324" text-anchor="middle">N（北点）</text>
    <text x="540" y="324" text-anchor="middle">S（南点）</text>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#777">地平圈</text>
  <text x="524" y="80" text-anchor="end" font-size="13" fill="#777">子午圈</text>

  <!-- 边长标注 -->
  <g font-size="14" fill="#c0392b">
    <text x="222" y="92" text-anchor="end">ZP = 90°−φ</text>
    <text x="302" y="146" text-anchor="middle">PX = 90°−δ</text>
    <text x="382" y="106" text-anchor="middle">ZX = z = 90°−h</text>
  </g>

  <!-- 角标注 -->
  <text x="188" y="174" font-size="14" fill="#c0392b">t（时角）</text>
  <text x="322" y="120" font-size="14" fill="#c0392b">A（方位角）</text>

  <!-- 说明 -->
  <text x="320" y="552" text-anchor="middle" font-size="15" fill="#333">天文三角形 PZX：天顶 Z、北天极 P、天体 X 围成的球面三角形</text>
  <text x="320" y="572" text-anchor="middle" font-size="14" fill="#333">边 ZP=90°−φ（余纬）、PX=90°−δ（极距）、ZX=90°−h（天顶距）；在 P 的角为时角 t，在 Z 的角为方位角 A</text>
</svg>
