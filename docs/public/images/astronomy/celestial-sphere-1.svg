<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">天球与基本点圈示意图</title>
  <desc id="desc">以子午面为纸面的天球剖面示意图。大圆是天球（子午圈），水平直径是地平圈，其上方为可见天空、下方（浅色阴影）为地平线以下。铅垂线向上交天球于天顶 Z，向下交于天底 Z′；斜向虚线是天轴，两端为北天极 P 与南天极 P′；青色斜线是天赤道，红色斜交椭圆是黄道，二者交于春分点与秋分点。圆心处是观测者。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 天球（纸底墨色） -->
  <circle cx="340" cy="240" r="175" fill="#faf9f5" stroke="#333" stroke-width="2.5"/>

  <!-- 地平线以下的可见区分割（下半球着色） -->
  <path d="M165 240 A175 175 0 0 1 515 240 L165 240 Z" fill="#ece7d9"/>

  <!-- 地平圈（水平直径） -->
  <line x1="165" y1="240" x2="515" y2="240" stroke="#333" stroke-width="1.6"/>

  <!-- 天赤道（斜直径，青色） -->
  <line x1="227.5" y1="374" x2="452.5" y2="106" stroke="#1f6f8b" stroke-width="2"/>

  <!-- 黄道（斜交椭圆，红色） -->
  <ellipse cx="340" cy="240" rx="175" ry="90" transform="rotate(-73.5 340 240)" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- 天轴（虚线） -->
  <line x1="206" y1="127.5" x2="474" y2="352.5" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 周日视运动方向（绕北天极逆时针的小弧箭头） -->
  <path d="M 238 127.5 A 32 32 0 0 0 206 95.5" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- 关键点 -->
  <g fill="#333">
    <circle cx="340" cy="65" r="4"/>
    <circle cx="340" cy="415" r="3.2"/>
    <circle cx="206" cy="127.5" r="4"/>
    <circle cx="474" cy="352.5" r="3.2"/>
    <circle cx="340" cy="240" r="3.5"/>
    <circle cx="165" cy="240" r="2.6"/>
    <circle cx="515" cy="240" r="2.6"/>
  </g>
  <g fill="#1f6f8b">
    <circle cx="434" cy="128" r="3"/>
    <circle cx="246" cy="352" r="3"/>
  </g>

  <!-- 文字标注 -->
  <g font-size="14" fill="#333">
    <text x="320" y="52">天顶 Z</text>
    <text x="344" y="431">天底 Z′</text>
    <text x="172" y="114">北天极 P</text>
    <text x="486" y="341">南天极 P′</text>
    <text x="146" y="258">北点 N</text>
    <text x="528" y="258">南点 S</text>
    <text x="298" y="262">观测者</text>
    <text x="462" y="258">地平圈</text>
    <text x="296" y="178" fill="#777">天轴</text>
    <text x="228" y="80" fill="#777">子午圈</text>
  </g>
  <text x="282" y="160" font-size="14" fill="#1f6f8b">天赤道</text>
  <text x="404" y="64" font-size="14" fill="#c0392b">黄道</text>
  <text x="446" y="140" font-size="14" fill="#1f6f8b">春分点 γ</text>
  <text x="196" y="366" font-size="14" fill="#1f6f8b">秋分点</text>
</svg>
