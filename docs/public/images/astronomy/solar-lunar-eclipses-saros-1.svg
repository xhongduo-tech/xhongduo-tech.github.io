<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>日食影锥几何：太阳、月球、本影与半影</title>
<desc>太阳在左，月球在中，地球在右。太阳光线从两侧掠过月球边缘，交汇出本影锥（深色三角形）与半影区（浅色梯形）。本影锥顶点落在地球表面，对应日全食；当月球较远时本影顶点够不到地面，对应日环食。图中标出本影、半影、本影顶点与全食带。</desc>
<rect x="0" y="0" width="760" height="420" fill="#faf9f5"/>

<!-- 太阳 -->
<circle cx="55" cy="200" r="36" fill="#c97b3d"/>
<text x="55" y="254" text-anchor="middle" font-size="16" fill="#333">太阳</text>
<line x1="91" y1="172" x2="130" y2="172" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="91" y1="200" x2="130" y2="200" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="91" y1="228" x2="130" y2="228" stroke="#c97b3d" stroke-width="1.5" stroke-dasharray="3 4"/>

<!-- 半影区（先画，浅色） -->
<polygon points="330,187 635,112 635,288 330,213" fill="#cfc9ba" opacity="0.85"/>

<!-- 本影锥（后画，深色） -->
<polygon points="330,187 575,200 330,213" fill="#4a4a4a"/>

<!-- 月球 -->
<circle cx="330" cy="200" r="13" fill="#8a8a8a" stroke="#5a5a5a" stroke-width="1"/>
<text x="330" y="176" text-anchor="middle" font-size="15" fill="#333">月球</text>

<!-- 地球 -->
<circle cx="600" cy="200" r="22" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="2"/>
<text x="600" y="236" text-anchor="middle" font-size="16" fill="#333">地球</text>

<!-- 本影顶点落点（全食带） -->
<circle cx="575" cy="200" r="4" fill="#333"/>
<text x="575" y="178" text-anchor="middle" font-size="13" fill="#333">本影顶点</text>

<!-- 标注线 -->
<line x1="350" y1="150" x2="470" y2="150" stroke="#7a6a55" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="475" y="154" font-size="14" fill="#333">本影：日全食区</text>
<line x1="350" y1="150" x2="470" y2="150" stroke="#7a6a55" stroke-width="0.8" stroke-dasharray="3 3"/>

<line x1="470" y1="268" x2="640" y2="268" stroke="#7a6a55" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="645" y="272" font-size="14" fill="#333">半影：日偏食区</text>

<!-- 全食带说明 -->
<text x="618" y="162" text-anchor="end" font-size="13" fill="#333">全食带</text>
<line x1="618" y1="166" x2="582" y2="196" stroke="#7a6a55" stroke-width="0.8"/>

<text x="380" y="400" text-anchor="middle" font-size="14" fill="#7a6a55">示意，不按比例：月球近地时本影触及地面（日全食），远地时本影顶点落在地面之前（日环食）</text>
</svg>
