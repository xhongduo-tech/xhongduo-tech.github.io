<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" font-family="sans-serif">
<title>地球大气的电磁窗口</title>
<desc>横轴为电磁波段（伽马射线到射电，波长增大），纵轴为辐射能穿透到的高度；竖条显示各波段从太空下探到地面的程度，可见光与射电到达地面，其余波段被高层大气吸收。</desc>

<rect x="0" y="0" width="1060" height="480" fill="#faf9f5"/>

<text x="530" y="36" text-anchor="middle" font-size="22" fill="#333">地球大气的电磁窗口</text>
<text x="530" y="62" text-anchor="middle" font-size="14" fill="#555">横轴：电磁波段（波长增大 →）　竖条：该波段从太空穿透到的高度（触底 = 到达地面）</text>

<!-- 波段顶栏标签 -->
<text x="140" y="86" text-anchor="middle" font-size="16" fill="#333">伽马射线</text>
<text x="265" y="86" text-anchor="middle" font-size="16" fill="#333">X 射线</text>
<text x="385" y="86" text-anchor="middle" font-size="16" fill="#333">紫外</text>
<text x="465" y="86" text-anchor="middle" font-size="16" fill="#333">可见光</text>
<text x="565" y="86" text-anchor="middle" font-size="16" fill="#333">红外</text>
<text x="730" y="86" text-anchor="middle" font-size="16" fill="#333">射电</text>

<!-- 波长范围 -->
<text x="140" y="106" text-anchor="middle" font-size="13" fill="#666">10⁻¹⁴–10⁻¹¹ m</text>
<text x="265" y="106" text-anchor="middle" font-size="13" fill="#666">10⁻¹¹–10⁻⁸ m</text>
<text x="385" y="106" text-anchor="middle" font-size="13" fill="#666">10⁻⁸–4×10⁻⁷ m</text>
<text x="465" y="106" text-anchor="middle" font-size="13" fill="#666">4–7×10⁻⁷ m</text>
<text x="565" y="106" text-anchor="middle" font-size="13" fill="#666">7×10⁻⁷–10⁻³ m</text>
<text x="730" y="106" text-anchor="middle" font-size="13" fill="#666">10⁻³–10² m</text>

<!-- 高度参考虚线：500km=110, 100km=366, 40km=404, 10km=424 -->
<g stroke="#bbb" stroke-dasharray="4 4" stroke-width="1">
  <line x1="70" y1="110" x2="830" y2="110"/>
  <line x1="70" y1="366" x2="830" y2="366"/>
  <line x1="70" y1="404" x2="830" y2="404"/>
  <line x1="70" y1="424" x2="830" y2="424"/>
</g>

<!-- 波段穿透竖条 -->
<rect x="80"  y="110" width="120" height="294" fill="#c0392b" opacity="0.45" stroke="#c0392b" stroke-width="1"/>
<rect x="200" y="366" width="130" height="64"  fill="#1f6f8b" opacity="0.45" stroke="#1f6f8b" stroke-width="1"/>
<rect x="330" y="404" width="110" height="26"  fill="#7f8c8d" opacity="0.5"  stroke="#7f8c8d" stroke-width="1"/>
<rect x="440" y="110" width="50"  height="320" fill="#e8b33a" opacity="0.9"  stroke="#b8860b" stroke-width="1"/>
<rect x="490" y="110" width="150" height="320" fill="#1f6f8b" opacity="0.16" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="640" y="110" width="180" height="320" fill="#c0392b" opacity="0.55" stroke="#c0392b" stroke-width="1"/>

<!-- 可见光 / 射电：到达地面标注 -->
<text x="465" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">到达地面</text>
<text x="465" y="320" text-anchor="middle" font-size="13" fill="#333">（肉眼窗口）</text>
<text x="730" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">到达地面</text>
<text x="730" y="320" text-anchor="middle" font-size="13" fill="#333">（射电窗口）</text>

<!-- 被吸收波段：短注 -->
<text x="140" y="132" text-anchor="middle" font-size="13" fill="#c0392b">高层大气吸收</text>
<text x="265" y="132" text-anchor="middle" font-size="13" fill="#1f6f8b">高层大气吸收</text>
<text x="385" y="132" text-anchor="middle" font-size="13" fill="#7f8c8d">臭氧层吸收</text>
<text x="565" y="200" text-anchor="middle" font-size="13" fill="#1f6f8b">大多被水汽/CO₂ 吸收</text>
<text x="565" y="220" text-anchor="middle" font-size="13" fill="#1f6f8b">仅少量窗口到地面</text>

<!-- 地面线 -->
<line x1="70" y1="430" x2="830" y2="430" stroke="#333" stroke-width="2"/>
<text x="66" y="434" text-anchor="end" font-size="13" fill="#333">0 km</text>
<text x="66" y="408" text-anchor="end" font-size="13" fill="#666">40 km</text>
<text x="66" y="370" text-anchor="end" font-size="13" fill="#666">100 km</text>
<text x="66" y="114" text-anchor="end" font-size="13" fill="#666">500 km</text>
<text x="24" y="270" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 24 270)">穿透高度</text>

<!-- 高度说明 -->
<text x="838" y="114" font-size="13" fill="#666">500 km　卫星轨道</text>
<text x="838" y="370" font-size="13" fill="#666">100 km　大气层顶附近</text>
<text x="838" y="408" font-size="13" fill="#666">40 km　探空气球</text>
<text x="838" y="428" font-size="13" fill="#666">10 km　对流层顶 / 民航</text>

<!-- 波长增大箭头 -->
<line x1="110" y1="466" x2="790" y2="466" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="458" text-anchor="middle" font-size="14" fill="#333">波长增大 →</text>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
</defs>

<text x="530" y="476" text-anchor="middle" font-size="13" fill="#888">示意图：只表示波段与高度的相对关系，高度轴为示意，非精确</text>
</svg>
