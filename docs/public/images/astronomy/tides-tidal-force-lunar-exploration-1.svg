<svg viewBox="0 0 680 420" width="680" height="420" xmlns="http://www.w3.org/2000/svg">
<title>月球引潮力与地球两侧潮汐隆起</title>
<desc>月球引力在地球近月侧与远月侧产生两个潮汐隆起，说明一天两次涨潮的成因</desc>
<rect width="680" height="420" fill="#faf9f5"/>
<!-- moon -->
<circle cx="590" cy="210" r="38" fill="#d8d3c8" stroke="#333" stroke-width="2"/>
<text x="590" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">月球</text>
<!-- line from moon to earth center -->
<line x1="552" y1="210" x2="390" y2="210" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<!-- earth solid -->
<circle cx="300" cy="210" r="70" fill="#e7e2d8" stroke="#333" stroke-width="2"/>
<text x="300" y="214" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">地球</text>
<!-- ocean envelope (tidal bulges) -->
<ellipse cx="300" cy="210" rx="108" ry="70" fill="none" stroke="#1f6f8b" stroke-width="3"/>
<!-- near side bulge arrow -->
<line x1="408" y1="210" x2="470" y2="210" stroke="#c0392b" stroke-width="3"/>
<polygon points="470,210 458,204 458,216" fill="#c0392b"/>
<!-- far side bulge arrow -->
<line x1="192" y1="210" x2="130" y2="210" stroke="#c0392b" stroke-width="3"/>
<polygon points="130,210 142,204 142,216" fill="#c0392b"/>
<!-- labels -->
<text x="470" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">近月侧隆起</text>
<text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">远月侧隆起</text>
<text x="470" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（潮汐力向右）</text>
<text x="130" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">（潮汐力向左）</text>
<text x="300" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">引潮力是「引力差」：近月侧引力强、远月侧引力弱，两侧同时向外推，形成两个隆起</text>
</svg>
