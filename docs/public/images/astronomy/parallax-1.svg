<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="sans-serif">
<title>周年视差：用地球的公转丈量恒星的距离</title>
<desc>地球在公转轨道两侧（相隔 2 AU）看同一颗邻近恒星，恒星相对遥远的背景恒星发生角度为 2p 的位移，半角 p 即周年视差。由 tan p = 1 AU / d 可得距离。</desc>

<rect x="0" y="0" width="860" height="520" fill="#faf9f5"/>

<text x="430" y="34" text-anchor="middle" font-size="20" fill="#333">周年视差：用地球的公转丈量恒星的距离</text>

<!-- 地球公转基线（视向投影为竖直线） -->
<line x1="150" y1="150" x2="150" y2="390" stroke="#999" stroke-width="1.5" stroke-dasharray="7 5"/>

<!-- 太阳 -->
<circle cx="150" cy="270" r="14" fill="#e8b33a" stroke="#b8860b" stroke-width="2"/>
<text x="150" y="308" text-anchor="middle" font-size="14" fill="#333">太阳</text>

<!-- 直角标记 -->
<path d="M150,256 L166,256 L166,270" fill="none" stroke="#666" stroke-width="1.2"/>

<!-- 地球两位置 -->
<circle cx="150" cy="150" r="9" fill="#1f6f8b"/>
<text x="150" y="128" text-anchor="middle" font-size="14" fill="#333">地球 A（1 月）</text>
<circle cx="150" cy="390" r="9" fill="#1f6f8b"/>
<text x="150" y="418" text-anchor="middle" font-size="14" fill="#333">地球 B（7 月）</text>

<text x="170" y="214" font-size="14" fill="#555">1 AU</text>
<text x="170" y="352" font-size="14" fill="#555">1 AU</text>

<!-- 视线：地球 A/B 到邻近恒星 -->
<line x1="150" y1="150" x2="660" y2="270" stroke="#333" stroke-width="1.5"/>
<line x1="150" y1="390" x2="660" y2="270" stroke="#333" stroke-width="1.5"/>

<!-- 参考方向：太阳到邻近恒星 -->
<line x1="150" y1="270" x2="660" y2="270" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- 邻近恒星 -->
<circle cx="660" cy="270" r="15" fill="#c0392b"/>
<text x="660" y="205" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">邻近恒星</text>
<text x="660" y="225" text-anchor="middle" font-size="13" fill="#555">（距离 d，待测）</text>

<!-- 遥远的背景恒星 -->
<g fill="#888">
  <circle cx="730" cy="190" r="3"/>
  <circle cx="760" cy="235" r="2.5"/>
  <circle cx="790" cy="300" r="3"/>
  <circle cx="815" cy="205" r="2.5"/>
  <circle cx="745" cy="330" r="2.5"/>
  <circle cx="820" cy="285" r="2"/>
</g>
<text x="770" y="375" text-anchor="middle" font-size="13" fill="#555">遥远的背景恒星</text>
<text x="770" y="393" text-anchor="middle" font-size="13" fill="#555">（近似固定）</text>

<!-- 视差角标记 -->
<line x1="660" y1="270" x2="612" y2="270" stroke="#666" stroke-width="1.2"/>
<line x1="660" y1="270" x2="613.3" y2="259" stroke="#666" stroke-width="1.2"/>
<text x="618" y="264" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">p</text>
<line x1="660" y1="270" x2="613.3" y2="281" stroke="#666" stroke-width="1.2"/>
<text x="618" y="290" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">p</text>
<text x="470" y="252" font-size="13" fill="#555">半角 p 即周年视差</text>

<!-- 公式块 -->
<text x="430" y="464" text-anchor="middle" font-size="17" fill="#333">tan p = 1 AU / d</text>
<text x="430" y="490" text-anchor="middle" font-size="15" fill="#333">p 极小 ⇒ p(rad) ≈ 1 AU / d，即　d(pc) = 1 / p(角秒)</text>
<text x="430" y="512" text-anchor="middle" font-size="13" fill="#666">示意图：视差角严重夸大（真实 p 小于 1 角秒，比图中小数十万倍）；基线 = 地球公转直径 = 2 AU</text>
</svg>
