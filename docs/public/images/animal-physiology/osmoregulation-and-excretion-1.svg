<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <title>髓袢逆流倍增原理示意图</title>
  <desc>肾单位髓袢的降支与升支构成逆流倍增器：降支对水通透、对盐不通透，水不断外流；升支对水不通透、主动泵出氯化钠，在髓质间质中建立从皮质到髓尖逐渐升高的渗透压梯度。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">髓袢逆流倍增：一根管子的两次转折</text>

  <!-- 区域标注：皮质 / 髓质 -->
  <line x1="40" y1="120" x2="600" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="112" font-family="sans-serif" font-size="14" fill="#666">皮质</text>
  <text x="56" y="440" font-family="sans-serif" font-size="14" fill="#666">髓质（肾乳头顶端）</text>

  <!-- 降支（左侧竖管） -->
  <rect x="220" y="90" width="34" height="250" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="237" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold">降支</text>
  <text x="237" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">对水通透</text>
  <text x="237" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">对 NaCl 不通透</text>
  <line x1="237" y1="95" x2="237" y2="335" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowdown)"/>
  <!-- 水流出的箭头（左侧） -->
  <line x1="218" y1="140" x2="196" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowleft)"/>
  <line x1="218" y1="200" x2="196" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowleft)"/>
  <line x1="218" y1="260" x2="196" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowleft)"/>
  <text x="150" y="144" font-family="sans-serif" font-size="13" fill="#333">水</text>
  <text x="150" y="204" font-family="sans-serif" font-size="13" fill="#333">水</text>
  <text x="150" y="264" font-family="sans-serif" font-size="13" fill="#333">水</text>

  <!-- 连接部（发夹状转折） -->
  <rect x="220" y="330" width="200" height="34" rx="6" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>

  <!-- 升支（右侧竖管） -->
  <rect x="386" y="90" width="34" height="250" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <text x="403" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">升支</text>
  <text x="403" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">对水不通透</text>
  <text x="403" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">主动泵出 NaCl</text>
  <line x1="403" y1="335" x2="403" y2="95" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowup)"/>
  <!-- NaCl 泵出的箭头（右侧） -->
  <line x1="422" y1="140" x2="444" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowright)"/>
  <line x1="422" y1="200" x2="444" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowright)"/>
  <line x1="422" y1="260" x2="444" y2="260" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowright)"/>
  <text x="450" y="144" font-family="sans-serif" font-size="13" fill="#c0392b" font-weight="bold">NaCl</text>
  <text x="450" y="204" font-family="sans-serif" font-size="13" fill="#c0392b" font-weight="bold">NaCl</text>
  <text x="450" y="264" font-family="sans-serif" font-size="13" fill="#c0392b" font-weight="bold">NaCl</text>

  <!-- 髓质间质渗透压梯度 -->
  <text x="330" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">间质渗透压（mOsm/L）</text>
  <line x1="286" y1="130" x2="384" y2="130" stroke="#999" stroke-width="1"/>
  <text x="330" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">≈ 300</text>
  <text x="330" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">≈ 600</text>
  <text x="330" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">≈ 900</text>
  <text x="330" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c0392b">≈ 1200</text>

  <!-- 底部说明 -->
  <text x="320" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">降支失水 → 管液浓缩；升支泵盐 → 间质加深</text>
  <text x="320" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">逆流反复「放大」，髓尖间质可高达 1200（沙漠鼠 5500+）</text>
  <text x="320" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">箭头方向表示液体流向；间质渗透压从皮质向髓尖递增</text>

  <defs>
    <marker id="arrowdown" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/></marker>
    <marker id="arrowup" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto"><path d="M0,8 L8,4 L0,0 Z" fill="#c0392b"/></marker>
    <marker id="arrowleft" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#333"/></marker>
    <marker id="arrowright" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
  </defs>
</svg>
