<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <title>素理想分裂的金字塔：域与 Galois 子群的对应</title>
  <desc>固定素理想 P 在 p 之上，Galois 扩张 L/K 的分解律 e·f·g = [L:K]。左侧为分解域与惯性域构成的金字塔，右侧为对应的 Galois 子群列。</desc>
  <rect x="0" y="0" width="880" height="500" fill="#faf9f5" />

  <text x="440" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">素理想分裂的金字塔：域与 Galois 子群的对应</text>
  <text x="440" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">固定素理想 P 在 p 之上，分解律 e·f·g = [L : K]</text>

  <!-- 左侧域金字塔 -->
  <line x1="185" y1="120" x2="185" y2="200" stroke="#333" stroke-width="2" />
  <line x1="185" y1="240" x2="185" y2="320" stroke="#333" stroke-width="2" />
  <line x1="185" y1="360" x2="185" y2="440" stroke="#333" stroke-width="2" />

  <rect x="125" y="78" width="120" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="2" />
  <text x="185" y="105" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">L</text>

  <rect x="125" y="198" width="140" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="2" />
  <text x="195" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">L^I 惯性域</text>

  <rect x="125" y="318" width="140" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="2" />
  <text x="195" y="345" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">L^D 分解域</text>

  <rect x="125" y="438" width="60" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="2" />
  <text x="155" y="465" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">K</text>

  <!-- 左侧度数标注 -->
  <text x="20" y="163" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">[L : L^I] = e</text>
  <text x="20" y="182" font-family="sans-serif" font-size="13" fill="#c0392b">（完全分歧）</text>
  <text x="20" y="283" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">[L^I : L^D] = f</text>
  <text x="20" y="302" font-family="sans-serif" font-size="13" fill="#c0392b">（惯性）</text>
  <text x="20" y="403" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">[L^D : K] = g</text>
  <text x="20" y="422" font-family="sans-serif" font-size="13" fill="#c0392b">（分裂）</text>

  <!-- 右侧 Galois 子群列 -->
  <line x1="665" y1="120" x2="665" y2="200" stroke="#1f6f8b" stroke-width="2" />
  <line x1="665" y1="240" x2="665" y2="320" stroke="#1f6f8b" stroke-width="2" />
  <line x1="665" y1="360" x2="665" y2="440" stroke="#1f6f8b" stroke-width="2" />

  <rect x="635" y="78" width="60" height="44" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2" />
  <text x="665" y="105" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">{1}</text>

  <rect x="635" y="198" width="60" height="44" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2" />
  <text x="665" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">I</text>

  <rect x="635" y="318" width="60" height="44" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2" />
  <text x="665" y="345" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b">D</text>

  <rect x="635" y="438" width="96" height="44" rx="6" fill="#faf9f5" stroke="#1f6f8b" stroke-width="2" />
  <text x="683" y="465" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">Gal(L/K)</text>

  <!-- 右侧阶标注 -->
  <text x="755" y="163" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">|I| = e</text>
  <text x="755" y="283" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">|D| = e·f</text>
  <text x="755" y="403" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b">|G| = e·f·g</text>

  <!-- Galois 对应的虚线 -->
  <line x1="275" y1="100" x2="635" y2="100" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" />
  <line x1="295" y1="220" x2="635" y2="220" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" />
  <line x1="295" y1="340" x2="635" y2="340" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" />
  <line x1="215" y1="460" x2="635" y2="460" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" />

  <text x="440" y="493" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">虚线：Galois 对应（子群 ↔ 不动域）</text>
</svg>
