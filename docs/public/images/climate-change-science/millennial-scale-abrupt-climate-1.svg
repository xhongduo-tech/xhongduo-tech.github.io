<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
<title>丹斯伽德-厄施格（D-O）振荡与海因里希事件示意</title>
<desc>格陵兰冰芯温度示意曲线：一次次快速升温后逐渐冷却的锯齿形态，每隔数个循环叠加一次更冷的海因里希事件。</desc>
<rect x="0" y="0" width="600" height="380" fill="#faf9f5"/>
<text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333" font-weight="bold">格陵兰温度示意：D-O 振荡的锯齿形态</text>
<line x1="70" y1="320" x2="560" y2="320" stroke="#333" stroke-width="2"/>
<line x1="70" y1="60" x2="70" y2="320" stroke="#333" stroke-width="2"/>
<text x="60" y="70" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">暖</text>
<text x="60" y="315" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">冷</text>
<text x="560" y="345" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">距今（千年前）→</text>
<!-- D-O sawtooth path: warm spike then gradual cooling, repeated -->
<polyline points="70,300 110,300 130,150 170,180 210,210 250,215 260,140 300,170 340,200 380,205 390,130 430,160 470,190 510,195 520,120 560,150"
  fill="none" stroke="#1f6f8b" stroke-width="3"/>
<!-- Heinrich events: deeper cold dips marked -->
<circle cx="250" cy="215" r="5" fill="#c0392b"/>
<circle cx="380" cy="205" r="5" fill="#c0392b"/>
<circle cx="510" cy="195" r="5" fill="#c0392b"/>
<text x="250" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">H</text>
<text x="380" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">H</text>
<text x="510" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">H</text>
<text x="180" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">快速升温（数十年）</text>
<line x1="150" y1="160" x2="220" y2="195" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="330" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">逐渐冷却（千年尺度）</text>
<line x1="330" y1="258" x2="330" y2="240" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">H = 海因里希事件（冰夜碎屑层，极端冷）</text>
</svg>
