<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
<title>海平面上升预算：2006–2018 年全球平均 3.7 mm/年 的分量构成</title>
<desc>堆叠条形图示意热膨胀、山地冰川、格陵兰冰盖、南极冰盖与陆地储水对海平面上升的贡献份额。</desc>
<rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">全球平均海平面上升预算（示意，2006–2018，约 3.7 mm/年）</text>
<text x="80" y="110" font-family="sans-serif" font-size="13" fill="#333">热膨胀</text>
<rect x="160" y="92" width="240" height="36" fill="#c0392b"/>
<text x="160" y="115" font-family="sans-serif" font-size="13" fill="#fff">约 40%（1.5 mm/年）</text>
<text x="80" y="165" font-family="sans-serif" font-size="13" fill="#333">山地冰川</text>
<rect x="160" y="147" width="128" height="36" fill="#1f6f8b"/>
<text x="160" y="170" font-family="sans-serif" font-size="13" fill="#fff">约 22%</text>
<text x="80" y="220" font-family="sans-serif" font-size="13" fill="#333">格陵兰冰盖</text>
<rect x="160" y="202" width="128" height="36" fill="#e67e22"/>
<text x="160" y="225" font-family="sans-serif" font-size="13" fill="#fff">约 22%</text>
<text x="80" y="275" font-family="sans-serif" font-size="13" fill="#333">南极冰盖</text>
<rect x="160" y="257" width="64" height="36" fill="#8a4a00"/>
<text x="160" y="280" font-family="sans-serif" font-size="13" fill="#fff">约 11%</text>
<text x="80" y="330" font-family="sans-serif" font-size="13" fill="#333">陆地储水等</text>
<rect x="160" y="312" width="32" height="36" fill="#7f8c8d"/>
<text x="160" y="335" font-family="sans-serif" font-size="13" fill="#fff">约 5%</text>
<text x="420" y="110" font-family="sans-serif" font-size="13" fill="#333">比例参照 240 px ≈ 3.7 mm/年</text>
<text x="420" y="200" font-family="sans-serif" font-size="13" fill="#333">份额为 IPCC AR6 数量级的近似示意，</text>
<text x="420" y="220" font-family="sans-serif" font-size="13" fill="#333">详见第 9 章的分量区间表</text>
</svg>
