<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
<title>人为辐射强迫（ERF）各分量示意（1750—2019）</title>
<desc>条形图：温室气体为正强迫（红），气溶胶与平流层臭氧为负强迫（青），人为净强迫约 +2.72 W/m²。</desc>
<rect x="0" y="0" width="640" height="420" fill="#faf9f5"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">人为辐射强迫（有效辐射强迫，1750—2019，W/m²）</text>
<line x1="250" y1="60" x2="250" y2="405" stroke="#333" stroke-width="2"/>
<text x="250" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">0</text>
<text x="250" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">冷却（负） ← 0 → 加热（正）</text>
<text x="580" y="52" text-anchor="end" font-family="sans-serif" font-size="13" fill="#c0392b">+3</text>
<line x1="460" y1="60" x2="460" y2="405" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<!-- CO2 -->
<rect x="250" y="78" width="151" height="26" fill="#c0392b"/>
<text x="240" y="96" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">CO₂</text>
<text x="406" y="96" font-family="sans-serif" font-size="13" fill="#333">+2.16</text>
<!-- CH4 -->
<rect x="250" y="118" width="38" height="26" fill="#c0392b"/>
<text x="240" y="136" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">CH₄</text>
<text x="293" y="136" font-family="sans-serif" font-size="13" fill="#333">+0.54</text>
<!-- N2O -->
<rect x="250" y="158" width="15" height="26" fill="#c0392b"/>
<text x="240" y="176" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">N₂O</text>
<text x="270" y="176" font-family="sans-serif" font-size="13" fill="#333">+0.21</text>
<!-- Halocarbons -->
<rect x="250" y="198" width="29" height="26" fill="#c0392b"/>
<text x="240" y="216" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">卤代烃</text>
<text x="284" y="216" font-family="sans-serif" font-size="13" fill="#333">+0.41</text>
<!-- tropospheric O3 -->
<rect x="250" y="238" width="33" height="26" fill="#c0392b"/>
<text x="240" y="256" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">对流层 O₃</text>
<text x="288" y="256" font-family="sans-serif" font-size="13" fill="#333">+0.47</text>
<!-- stratospheric O3 -->
<rect x="246.5" y="278" width="4" height="26" fill="#1f6f8b"/>
<text x="240" y="296" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">平流层 O₃</text>
<text x="256" y="296" font-family="sans-serif" font-size="13" fill="#333">−0.05</text>
<!-- aerosols -->
<rect x="173" y="318" width="77" height="26" fill="#1f6f8b"/>
<text x="240" y="336" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">气溶胶（净）</text>
<text x="165" y="336" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333">−1.1</text>
<!-- total -->
<rect x="250" y="358" width="190" height="28" fill="#8a4a00"/>
<text x="240" y="377" text-anchor="end" font-family="sans-serif" font-size="13" fill="#333" font-weight="bold">人为净强迫</text>
<text x="445" y="377" font-family="sans-serif" font-size="14" fill="#8a4a00" font-weight="bold">+2.72</text>
<text x="250" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">净增暖</text>
</svg>
