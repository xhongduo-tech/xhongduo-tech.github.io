<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">路程与位移的区别示意</title>
  <desc id="desc">上图：沿直线运动的一维坐标轴，物体从位置 x1 运动到位置 x2，红色箭头表示位移 Δx = x2 - x1。下图：从 A 运动到 B，灰色虚线是实际运动轨迹（路程 s），红色箭头是从初位置 A 指向末位置 B 的有向线段（位移）；弯曲路程明显长于直线位移。</desc>

  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 上：一维坐标轴 -->
  <text x="60" y="46" font-size="15" fill="#333">直线运动：位移 = 末位置坐标 − 初位置坐标</text>
  <line x1="90" y1="112" x2="592" y2="112" stroke="#333" stroke-width="2.5" marker-end="url(#arrow-axis)"/>
  <text x="588" y="130" text-anchor="middle" font-size="14" fill="#333">x</text>

  <!-- 原点 O -->
  <line x1="170" y1="105" x2="170" y2="119" stroke="#333" stroke-width="2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14" fill="#777">O</text>

  <!-- x1 -->
  <circle cx="300" cy="112" r="5" fill="#1f6f8b"/>
  <text x="300" y="92" text-anchor="middle" font-size="14" fill="#1f6f8b">x₁</text>

  <!-- x2 -->
  <circle cx="520" cy="112" r="5" fill="#1f6f8b"/>
  <text x="520" y="92" text-anchor="middle" font-size="14" fill="#1f6f8b">x₂</text>

  <!-- 位移箭头 -->
  <line x1="300" y1="128" x2="520" y2="128" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="410" y="152" text-anchor="middle" font-size="14" fill="#c0392b">位移 Δx = x₂ − x₁</text>

  <!-- 分隔线 -->
  <line x1="60" y1="184" x2="620" y2="184" stroke="#c8c2b4" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 下：一般路径 -->
  <text x="60" y="212" font-size="15" fill="#333">一般路径：路程（轨迹长度）≥ 位移的大小（有向线段）</text>

  <!-- 起点 A 与终点 B -->
  <circle cx="150" cy="318" r="6" fill="#1f6f8b"/>
  <text x="150" y="352" text-anchor="middle" font-size="14" fill="#333">A（初位置）</text>
  <circle cx="560" cy="318" r="6" fill="#1f6f8b"/>
  <text x="560" y="352" text-anchor="middle" font-size="14" fill="#333">B（末位置）</text>

  <!-- 路程曲线 -->
  <path d="M 150 318 Q 240 218 355 260 T 560 318" fill="none" stroke="#777" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="352" y="228" text-anchor="middle" font-size="14" fill="#777">路程 s（轨迹长度）</text>

  <!-- 位移直线 -->
  <line x1="150" y1="318" x2="560" y2="318" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="355" y="306" text-anchor="middle" font-size="14" fill="#c0392b">位移（有向线段）</text>
</svg>
