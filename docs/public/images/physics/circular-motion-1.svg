<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="sans-serif">
  <title>圆周运动的线速度与角速度</title>
  <desc>物体从 A 沿圆弧运动到 P，半径扫过圆心角 Δθ、弧长为 Δs；P 点的线速度 v 沿切线方向。v = ωr 连接线速度与角速度。</desc>
  <rect width="560" height="340" fill="#faf9f5"/>
  <!-- 整圆 -->
  <circle cx="240" cy="170" r="120" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- 圆心 O -->
  <circle cx="240" cy="170" r="3" fill="#333"/>
  <text x="222" y="198" font-size="14" fill="#333">圆心 O</text>
  <!-- 半径到 A（角 0） -->
  <line x1="240" y1="170" x2="360" y2="170" stroke="#6b7f8c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="360" cy="170" r="3" fill="#6b7f8c"/>
  <text x="366" y="166" font-size="14" fill="#6b7f8c">A</text>
  <!-- 半径到 P -->
  <line x1="240" y1="170" x2="317" y2="78" stroke="#6b7f8c" stroke-width="2"/>
  <circle cx="317" cy="78" r="3.5" fill="#333"/>
  <text x="324" y="72" font-size="15" fill="#333">P</text>
  <text x="282" y="124" font-size="14" fill="#6b7f8c">半径 r</text>
  <!-- 弧长 Δs（强调圆弧） -->
  <path d="M 360 170 A 120 120 0 0 0 317 78" fill="none" stroke="#1f6f8b" stroke-width="4"/>
  <text x="340" y="140" font-size="14" fill="#1f6f8b">弧长 Δs</text>
  <!-- 角位移 Δθ -->
  <path d="M 270 170 A 30 30 0 0 0 259 147" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="246" y="162" font-size="14" fill="#333">Δθ</text>
  <!-- 线速度 v：P 点切线方向 -->
  <line x1="317" y1="78" x2="359" y2="113" stroke="#c0392b" stroke-width="3"/>
  <polygon points="359,113 346,108 354,122" fill="#c0392b"/>
  <text x="362" y="116" font-size="14" fill="#c0392b">线速度 v（沿切线）</text>
  <!-- 说明文字 -->
  <text x="60" y="40" font-size="15" fill="#333">线速度 v 沿切线，角速度 ω 描述半径转动的快慢</text>
  <text x="60" y="62" font-size="13" fill="#6b7f8c">v = ωr：半径越大，同一角速度下扫过的弧长越长</text>
</svg>
