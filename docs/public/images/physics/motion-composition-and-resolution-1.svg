<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="sans-serif">
  <title>小船过河的运动合成</title>
  <desc>俯视河面：船在静水中的速度 v_船 垂直指向对岸，水流速度 v_水 指向下游，合速度 v_合 使船沿斜线到达对岸，河宽为 d。</desc>
  <rect width="560" height="340" fill="#faf9f5"/>
  <!-- 河岸 -->
  <rect x="0" y="0" width="560" height="60" fill="#ede7db"/>
  <rect x="0" y="280" width="560" height="60" fill="#ede7db"/>
  <text x="20" y="35" font-size="15" fill="#333">上游河岸</text>
  <text x="20" y="312" font-size="15" fill="#333">下游河岸</text>
  <!-- 河面 -->
  <rect x="0" y="60" width="560" height="220" fill="#e3eef4"/>
  <!-- 水流方向示意箭头 -->
  <line x1="80" y1="100" x2="140" y2="100" stroke="#6b7f8c" stroke-width="2"/>
  <polygon points="140,100 132,95 132,105" fill="#6b7f8c"/>
  <text x="146" y="104" font-size="14" fill="#6b7f8c">水流 v_水</text>
  <!-- 小船 -->
  <rect x="52" y="164" width="26" height="12" rx="2" fill="#333"/>
  <text x="52" y="158" font-size="14" fill="#333">船</text>
  <!-- v_船：垂直指向对岸 -->
  <line x1="65" y1="176" x2="65" y2="256" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="65,256 59,244 71,244" fill="#1f6f8b"/>
  <text x="72" y="222" font-size="14" fill="#1f6f8b">v_船</text>
  <!-- v_水：指向下游 -->
  <line x1="78" y1="176" x2="138" y2="176" stroke="#8a6d3b" stroke-width="3"/>
  <polygon points="138,176 126,170 126,182" fill="#8a6d3b"/>
  <text x="100" y="196" font-size="14" fill="#8a6d3b">v_水</text>
  <!-- 合速度：平行四边形对角线 -->
  <line x1="65" y1="176" x2="138" y2="256" stroke="#c0392b" stroke-width="3"/>
  <polygon points="138,256 126,248 132,264" fill="#c0392b"/>
  <text x="122" y="274" font-size="15" fill="#c0392b">合速度 v_合</text>
  <!-- 实际轨迹虚线 -->
  <line x1="65" y1="176" x2="160" y2="280" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="162" y="236" font-size="13" fill="#c0392b">实际轨迹</text>
  <!-- 河宽标注 -->
  <line x1="520" y1="60" x2="520" y2="280" stroke="#333" stroke-width="1.5"/>
  <polygon points="520,60 516,72 524,72" fill="#333"/>
  <polygon points="520,280 516,268 524,268" fill="#333"/>
  <text x="480" y="178" font-size="14" fill="#333">河宽 d</text>
</svg>
