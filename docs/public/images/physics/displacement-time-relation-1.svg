<svg viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>匀变速直线运动的 v-t 图像与位移</title>
  <desc>v-t 图像为过 (0, v0) 斜率为 a 的直线。从 t=0 到 t 的位移等于直线下方的面积，可拆成矩形 v0·t 与三角形 ½at²。</desc>
  <rect width="520" height="430" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="60" y1="345" x2="500" y2="345" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="345" x2="60" y2="30" stroke="#333" stroke-width="2"/>
  <polygon points="500,345 488,339 488,351" fill="#333"/>
  <polygon points="60,30 54,42 66,42" fill="#333"/>
  <text x="500" y="370" font-family="sans-serif" font-size="16" fill="#333">t</text>
  <text x="40" y="40" font-family="sans-serif" font-size="16" fill="#333">v</text>
  <text x="44" y="363" font-family="sans-serif" font-size="14" fill="#333">O</text>

  <!-- 矩形（v0·t）：底 y=221..345，x=60..480 -->
  <rect x="60" y="221" width="420" height="124" fill="rgba(31,111,139,0.16)"/>
  <!-- 三角形（½at²）：(60,221) (480,35) (480,221) -->
  <polygon points="60,221 480,35 480,221" fill="rgba(192,57,43,0.14)"/>

  <!-- 直线 v = v0 + at -->
  <line x1="60" y1="221" x2="480" y2="35" stroke="#333" stroke-width="2.5"/>

  <!-- 辅助虚线 -->
  <line x1="60" y1="221" x2="480" y2="221" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="480" y1="35" x2="480" y2="345" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- 坐标刻度标注 -->
  <text x="36" y="226" font-family="sans-serif" font-size="15" fill="#333">v₀</text>
  <text x="38" y="45" font-family="sans-serif" font-size="15" fill="#333">v</text>
  <text x="486" y="365" font-family="sans-serif" font-size="15" fill="#333">t</text>

  <!-- 面积标注 -->
  <text x="215" y="290" font-family="sans-serif" font-size="14" fill="#1f6f8b">矩形面积 = v₀·t</text>
  <text x="215" y="120" font-family="sans-serif" font-size="14" fill="#c0392b">三角形面积 = ½at²</text>

  <!-- 总结 -->
  <text x="260" y="408" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">总位移 x = v₀t + ½at²</text>
</svg>
