<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">同一运动在不同参考系下的描述示意</title>
  <desc id="desc">一辆向右匀速行驶的车厢底板（带车轮）载着一位乘客，乘客释放一只小球。青色竖直虚线表示小球相对车厢的运动轨迹：竖直下落；红色抛物线虚线表示小球相对地面的运动轨迹：沿抛物线运动。图中还标出地面、车厢运动方向与释放点。</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- 地面 -->
  <rect x="50" y="380" width="580" height="60" fill="#ece7d9"/>
  <line x1="50" y1="380" x2="630" y2="380" stroke="#333" stroke-width="3"/>
  <text x="60" y="400" font-size="13" fill="#777">地面</text>

  <!-- 车厢底板 -->
  <rect x="250" y="340" width="190" height="16" rx="3" fill="#faf9f5" stroke="#333" stroke-width="2"/>

  <!-- 车轮 -->
  <line x1="285" y1="356" x2="285" y2="362" stroke="#333" stroke-width="3"/>
  <line x1="405" y1="356" x2="405" y2="362" stroke="#333" stroke-width="3"/>
  <circle cx="285" cy="370" r="10" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="285" cy="370" r="3" fill="#333"/>
  <circle cx="405" cy="370" r="10" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="405" cy="370" r="3" fill="#333"/>

  <!-- 车厢运动方向 -->
  <line x1="240" y1="318" x2="300" y2="318" stroke="#777" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="236" y="308" font-size="13" fill="#777">车厢运动方向</text>

  <!-- 乘客 -->
  <circle cx="326" cy="300" r="11" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <line x1="326" y1="311" x2="326" y2="340" stroke="#333" stroke-width="3"/>
  <line x1="326" y1="314" x2="340" y2="286" stroke="#333" stroke-width="2.5"/>

  <!-- 小球（释放点） -->
  <circle cx="340" cy="278" r="7" fill="#faf9f5" stroke="#333" stroke-width="2"/>
  <text x="340" y="264" text-anchor="middle" font-size="13" fill="#333">释放点</text>

  <!-- 相对车厢：竖直下落（青色） -->
  <line x1="340" y1="285" x2="340" y2="340" stroke="#1f6f8b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-cyan)"/>
  <circle cx="340" cy="340" r="4" fill="#1f6f8b"/>

  <!-- 相对地面：抛物线（红色） -->
  <path d="M 340 285 Q 383 298 408 340" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <circle cx="408" cy="340" r="4" fill="#c0392b"/>

  <!-- 顶部说明 -->
  <text x="60" y="58" font-size="15" fill="#1f6f8b">以车厢为参考系：小球竖直下落</text>
  <text x="405" y="58" font-size="15" fill="#c0392b">以地面为参考系：小球沿抛物线运动</text>

  <!-- 轨迹旁标注 -->
  <text x="330" y="332" text-anchor="end" font-size="14" fill="#1f6f8b">相对车厢：竖直下落</text>
  <text x="416" y="332" font-size="14" fill="#c0392b">相对地面：沿抛物线运动</text>
</svg>
