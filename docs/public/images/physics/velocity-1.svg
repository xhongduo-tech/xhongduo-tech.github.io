<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">位置-时间图像：割线斜率与切线斜率</title>
  <desc id="desc">位置 x 随时间 t 的抛物线图像。过 P、Q 两点的红色割线，其斜率表示时间间隔 Δt 内的平均速度；过 P 点的金色切线，其斜率表示 P 时刻的瞬时速度。图中用虚线和括号标出对应的 Δt 与 Δx。</desc>

  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <line x1="80" y1="46" x2="130" y2="46" stroke="#c0392b" stroke-width="3"/>
  <text x="138" y="50" font-size="14" fill="#c0392b">割线 PQ：平均速度 v̄ = Δx/Δt（斜率）</text>
  <line x1="80" y1="74" x2="130" y2="74" stroke="#b58900" stroke-width="3"/>
  <text x="138" y="78" font-size="14" fill="#8a6d1d">过 P 的切线：瞬时速度 v = dx/dt（斜率）</text>

  <!-- 坐标轴 -->
  <line x1="110" y1="360" x2="610" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="610" y="384" text-anchor="middle" font-size="14" fill="#333">时间 t</text>
  <line x1="110" y1="70" x2="110" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="86" y="78" font-size="14" fill="#333">位置 x</text>
  <text x="100" y="376" text-anchor="end" font-size="13" fill="#777">O</text>

  <!-- 曲线 x(t) -->
  <path d="M 170 330 Q 350 205 540 120" fill="none" stroke="#1f6f8b" stroke-width="3"/>

  <!-- 投影虚线 -->
  <line x1="290" y1="252" x2="290" y2="360" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="110" y1="252" x2="290" y2="252" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="434" y1="171" x2="434" y2="360" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="110" y1="171" x2="434" y2="171" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 割线（平均速度） -->
  <line x1="250" y1="274" x2="470" y2="151" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>

  <!-- 切线（瞬时速度） -->
  <line x1="150" y1="287" x2="580" y2="180" stroke="#b58900" stroke-width="2.6" stroke-dasharray="2 0"/>

  <!-- 点 P、Q -->
  <circle cx="290" cy="252" r="5.5" fill="#333"/>
  <text x="290" y="240" text-anchor="middle" font-size="14" fill="#333">P</text>
  <circle cx="434" cy="171" r="5.5" fill="#333"/>
  <text x="434" y="159" text-anchor="middle" font-size="14" fill="#333">Q</text>

  <!-- Δt 括号 -->
  <line x1="290" y1="370" x2="434" y2="370" stroke="#c0392b" stroke-width="2"/>
  <line x1="290" y1="364" x2="290" y2="376" stroke="#c0392b" stroke-width="2"/>
  <line x1="434" y1="364" x2="434" y2="376" stroke="#c0392b" stroke-width="2"/>
  <text x="362" y="394" text-anchor="middle" font-size="14" fill="#c0392b">Δt</text>

  <!-- Δx 括号 -->
  <line x1="96" y1="252" x2="96" y2="171" stroke="#c0392b" stroke-width="2"/>
  <line x1="90" y1="252" x2="102" y2="252" stroke="#c0392b" stroke-width="2"/>
  <line x1="90" y1="171" x2="102" y2="171" stroke="#c0392b" stroke-width="2"/>
  <text x="78" y="215" text-anchor="middle" font-size="14" fill="#c0392b">Δx</text>

  <!-- 坐标标注 -->
  <text x="290" y="346" text-anchor="middle" font-size="14" fill="#333">t₁</text>
  <text x="434" y="346" text-anchor="middle" font-size="14" fill="#333">t₂</text>
  <text x="92" y="257" text-anchor="end" font-size="14" fill="#333">x₁</text>
  <text x="92" y="176" text-anchor="end" font-size="14" fill="#333">x₂</text>

  <!-- 曲线标注 -->
  <text x="520" y="138" font-size="14" fill="#1f6f8b">位置随时间变化 x(t)</text>
</svg>
