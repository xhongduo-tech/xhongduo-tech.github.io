<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>悬挂球的共点力平衡受力图</title>
  <desc>一个光滑小球用两根绳子悬挂在天花板上，处于静止平衡。小球受竖直向下的重力 G、沿左绳方向的拉力 T₁ 与沿右绳方向的拉力 T₂，三力作用线交于球心，合力为零。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>

  <!-- 天花板 -->
  <rect x="80" y="20" width="480" height="22" fill="#cfc8bb" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="20" x2="120" y2="42" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="20" x2="320" y2="42" stroke="#333" stroke-width="1.2"/>
  <line x1="520" y1="20" x2="520" y2="42" stroke="#333" stroke-width="1.2"/>

  <!-- 固定点 -->
  <circle cx="180" cy="50" r="5" fill="#333"/>
  <circle cx="460" cy="50" r="5" fill="#333"/>

  <!-- 左绳（固定点 180,50 → 球顶 300,200） -->
  <line x1="180" y1="50" x2="300" y2="200" stroke="#333" stroke-width="2.2"/>
  <!-- 右绳（固定点 460,50 → 球顶 340,200） -->
  <line x1="460" y1="50" x2="340" y2="200" stroke="#333" stroke-width="2.2"/>

  <!-- 小球 -->
  <circle cx="320" cy="240" r="40" fill="#f0ece3" stroke="#333" stroke-width="2.2"/>
  <text x="320" y="247" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">球</text>

  <!-- 拉力 T₁（左上，红色）：方向沿左绳向上 -->
  <line x1="320" y1="240" x2="246" y2="156" stroke="#c0392b" stroke-width="3"/>
  <polygon points="240,150 244,168 256,162" fill="#c0392b"/>
  <text x="244" y="138" font-family="sans-serif" font-size="16" fill="#c0392b">T₁</text>

  <!-- 拉力 T₂（右上，青色）：方向沿右绳向上 -->
  <line x1="320" y1="240" x2="394" y2="156" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="400,150 396,168 384,162" fill="#1f6f8b"/>
  <text x="380" y="138" font-family="sans-serif" font-size="16" fill="#1f6f8b">T₂</text>

  <!-- 重力 G（向下，墨色） -->
  <line x1="320" y1="280" x2="320" y2="320" stroke="#333" stroke-width="3"/>
  <polygon points="320,330 313,316 327,316" fill="#333"/>
  <text x="336" y="316" font-family="sans-serif" font-size="16" fill="#333">G = mg</text>

  <!-- 底部结论 -->
  <text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">平衡时：T₁、T₂ 的合力与 G 等大反向</text>
</svg>
