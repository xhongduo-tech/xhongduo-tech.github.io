<svg viewBox="0 0 460 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>弹簧悬挂物体的受力分析</title>
  <desc>天花板下悬挂一弹簧与物体，物体静止。受竖直向下的重力 G = mg 与竖直向上的弹力 F = k·Δx，二力等大反向。弹簧相对原长伸长了 Δx。</desc>
  <rect width="460" height="400" fill="#faf9f5"/>

  <!-- 天花板 -->
  <rect x="60" y="20" width="340" height="26" fill="#cfc8bb" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="20" x2="90" y2="46" stroke="#333" stroke-width="1.2"/>
  <line x1="230" y1="20" x2="230" y2="46" stroke="#333" stroke-width="1.2"/>
  <line x1="370" y1="20" x2="370" y2="46" stroke="#333" stroke-width="1.2"/>

  <!-- 弹簧（锯齿） -->
  <polyline points="230,50 242,50 218,67 242,84 218,101 242,118 218,135 242,152 218,169 230,185"
            fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 原长虚线（弹簧无形变时的末端位置） -->
  <line x1="140" y1="115" x2="310" y2="115" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4"/>

  <!-- 物体（方块） -->
  <rect x="185" y="185" width="90" height="60" fill="#f0ece3" stroke="#333" stroke-width="2.2"/>
  <text x="230" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">m</text>

  <!-- 弹力 F（向上，青色） -->
  <line x1="258" y1="185" x2="258" y2="115" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="258,108 252,120 264,120" fill="#1f6f8b"/>

  <!-- 重力 G（向下，红色） -->
  <line x1="230" y1="245" x2="230" y2="315" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="230,322 224,310 236,310" fill="#c0392b"/>

  <!-- 伸长量 Δx 括号（右侧） -->
  <line x1="320" y1="115" x2="320" y2="185" stroke="#666" stroke-width="1.4"/>
  <line x1="312" y1="115" x2="328" y2="115" stroke="#666" stroke-width="1.4"/>
  <line x1="312" y1="185" x2="328" y2="185" stroke="#666" stroke-width="1.4"/>

  <!-- 标注文字 -->
  <text x="148" y="108" font-family="sans-serif" font-size="14" fill="#666">原长 x₀</text>
  <text x="330" y="156" font-family="sans-serif" font-size="14" fill="#666">Δx</text>
  <text x="268" y="148" font-family="sans-serif" font-size="14" fill="#1f6f8b">F = k·Δx</text>
  <text x="240" y="300" font-family="sans-serif" font-size="14" fill="#c0392b">G = mg</text>

  <!-- 平衡条件 -->
  <text x="230" y="375" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">平衡时 F = G，即 k·Δx = mg</text>
</svg>
