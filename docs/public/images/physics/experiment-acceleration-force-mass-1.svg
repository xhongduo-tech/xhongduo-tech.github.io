<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>探究加速度与力、质量关系的实验装置</title>
  <desc>小车在左端垫高的长木板上运动，右端经细绳绕过定滑轮下挂槽码，左端纸带穿过打点计时器，右端有垫块平衡摩擦。</desc>
  <rect x="0" y="0" width="760" height="360" fill="#faf9f5"/>
  <!-- 长木板（左高右低） -->
  <line x1="70" y1="180" x2="610" y2="205" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="228" fill="#333" font-size="13">长木板（左端垫高，平衡摩擦力）</text>
  <!-- 垫块 -->
  <polygon points="610,205 610,290 540,290" fill="#f0ece6" stroke="#333" stroke-width="2"/>
  <text x="552" y="282" fill="#333" font-size="13">垫块</text>
  <!-- 小车 -->
  <rect x="300" y="124" width="92" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="316" cy="178" r="13" fill="#333"/>
  <circle cx="376" cy="181" r="13" fill="#333"/>
  <text x="332" y="116" fill="#333" font-size="14">小车</text>
  <!-- 打点计时器 -->
  <rect x="86" y="140" width="76" height="46" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="90" y="128" fill="#333" font-size="13">打点计时器</text>
  <!-- 纸带 -->
  <line x1="162" y1="166" x2="300" y2="168" stroke="#1f6f8b" stroke-width="5"/>
  <text x="196" y="158" fill="#1f6f8b" font-size="13">纸带</text>
  <!-- 定滑轮 -->
  <circle cx="614" cy="200" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- 细绳 -->
  <line x1="392" y1="155" x2="614" y2="188" stroke="#c0392b" stroke-width="2"/>
  <line x1="614" y1="215" x2="614" y2="285" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="162" fill="#c0392b" font-size="13">细绳</text>
  <!-- 槽码 -->
  <rect x="594" y="285" width="40" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="578" y="336" fill="#333" font-size="13">槽码</text>
</svg>
