<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>水平面上滑块的受力分析</title>
  <desc>一个滑块放在水平面上，受到竖直向下的重力 G、竖直向上的支持力 N、水平向右的拉力 F 与水平向左的滑动摩擦力 f。拉力 F 使滑块相对地面向右滑动，因此摩擦力向左。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>

  <!-- 地面 -->
  <rect x="120" y="200" width="400" height="8" fill="#333"/>
  <text x="320" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">水平地面（粗糙）</text>

  <!-- 滑块 -->
  <rect x="270" y="120" width="100" height="80" fill="#f0ece3" stroke="#333" stroke-width="2.2"/>
  <text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">滑块</text>

  <!-- 重力 G（向下，红色） -->
  <line x1="320" y1="200" x2="320" y2="266" stroke="#c0392b" stroke-width="3"/>
  <polygon points="320,276 313,262 327,262" fill="#c0392b"/>
  <text x="336" y="252" font-family="sans-serif" font-size="16" fill="#c0392b">G = mg</text>

  <!-- 支持力 N（向上，青色） -->
  <line x1="320" y1="120" x2="320" y2="54" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="320,44 313,58 327,58" fill="#1f6f8b"/>
  <text x="336" y="74" font-family="sans-serif" font-size="16" fill="#1f6f8b">N</text>

  <!-- 拉力 F（向右，青色） -->
  <line x1="370" y1="176" x2="452" y2="176" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="462,176 446,170 446,182" fill="#1f6f8b"/>
  <text x="396" y="162" font-family="sans-serif" font-size="16" fill="#1f6f8b">F（拉力）</text>

  <!-- 滑动摩擦力 f（向左，红色） -->
  <line x1="270" y1="148" x2="188" y2="148" stroke="#c0392b" stroke-width="3"/>
  <polygon points="178,148 194,142 194,154" fill="#c0392b"/>
  <text x="194" y="134" font-family="sans-serif" font-size="16" fill="#c0392b">f（摩擦力）</text>

  <!-- 底部结论 -->
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">滑块向右滑动：f 向左，大小 f = μN</text>
</svg>
