<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>两个共点力的合成（平行四边形定则）</title>
  <desc>以共点力 F₁、F₂ 为邻边作平行四边形，从公共作用点 O 到对角顶点 C 的对角线即合力 F。F₁ 沿水平方向，F₂ 与 F₁ 的夹角为 θ，虚线是平行四边形的另外两条边。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>

  <!-- 虚线：补全平行四边形 -->
  <line x1="400" y1="250" x2="512" y2="90" stroke="#999" stroke-width="1.6" stroke-dasharray="6,5"/>
  <line x1="282" y1="90" x2="512" y2="90" stroke="#999" stroke-width="1.6" stroke-dasharray="6,5"/>

  <!-- F1（水平向右，青色） -->
  <line x1="170" y1="250" x2="400" y2="250" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="410,250 394,244 394,256" fill="#1f6f8b"/>
  <text x="272" y="240" font-family="sans-serif" font-size="16" fill="#1f6f8b">F₁</text>

  <!-- F2（斜向上，红色） -->
  <line x1="170" y1="250" x2="282" y2="90" stroke="#c0392b" stroke-width="3"/>
  <polygon points="288,82 270,92 282,102" fill="#c0392b"/>
  <text x="196" y="166" font-family="sans-serif" font-size="16" fill="#c0392b">F₂</text>

  <!-- 合力 F（对角线，墨色） -->
  <line x1="170" y1="250" x2="512" y2="90" stroke="#333" stroke-width="3.2"/>
  <polygon points="522,82 502,94 514,104" fill="#333"/>
  <text x="352" y="152" font-family="sans-serif" font-size="17" fill="#333">F</text>

  <!-- 夹角 θ 弧线 -->
  <path d="M 200,250 A 30,30 0 0 0 206,234" fill="none" stroke="#666" stroke-width="1.6"/>
  <text x="196" y="266" font-family="sans-serif" font-size="16" fill="#666">θ</text>

  <!-- 顶点标注 -->
  <text x="162" y="266" font-family="sans-serif" font-size="15" fill="#333">O</text>
  <text x="520" y="84" font-family="sans-serif" font-size="15" fill="#333">C</text>

  <!-- 底部说明 -->
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">F = √(F₁² + F₂² + 2F₁F₂cosθ)</text>
</svg>
