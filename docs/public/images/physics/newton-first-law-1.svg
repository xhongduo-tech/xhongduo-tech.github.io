<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>伽利略理想斜面实验</title>
  <desc>小球从左侧斜面同一高度 h 释放，右侧斜面倾角越小滚得越远；右斜面趋于水平时，小球永不停止。</desc>
  <rect x="0" y="0" width="760" height="360" fill="#faf9f5"/>
  <!-- 同一高度参考线 -->
  <line x1="120" y1="150" x2="700" y2="150" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="112" y="138" fill="#999" font-size="14">同一高度 h</text>
  <!-- 左斜面 -->
  <line x1="130" y1="150" x2="360" y2="295" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <text x="86" y="126" fill="#333" font-size="14">释放</text>
  <!-- 小球 -->
  <circle cx="135" cy="154" r="11" fill="#c0392b"/>
  <!-- 右侧斜面：三种倾角 -->
  <line x1="360" y1="295" x2="470" y2="150" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="356" y="238" fill="#c0392b" font-size="13">① 大倾角：滚到等高</text>
  <line x1="360" y1="295" x2="610" y2="150" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="466" y="266" fill="#1f6f8b" font-size="13">② 小倾角：滚得更远才等高</text>
  <line x1="360" y1="295" x2="740" y2="295" stroke="#666" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="428" y="320" fill="#666" font-size="13">③ 水平：永不停止（理想化）</text>
  <!-- 谷点标记 -->
  <circle cx="360" cy="295" r="4" fill="#333"/>
</svg>
