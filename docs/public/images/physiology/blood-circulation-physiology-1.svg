<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="sans-serif">
<title>心动周期中左房压、左室压、主动脉压与心室容积的变化</title>
<desc>一个心动周期约 0.8 秒的示意图：上方为心电图（P 波、QRS、T 波），中部为主动脉压、左室压与左房压三条压力曲线，下方为左室容积曲线；竖虚线标出等容收缩期、射血期、等容舒张期与充盈期四个时相，并标出二尖瓣与主动脉瓣的开闭时刻。</desc>
<rect x="0" y="0" width="840" height="540" fill="#faf9f5"/>
<text x="420" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">一个心动周期中的压力与容积变化（示意图）</text>

<!-- 心电图（顶部带） -->
<text x="96" y="42" text-anchor="middle" font-size="13" fill="#1f6f8b">心电</text>
<path d="M78,58 L92,58 Q98,40 104,58 L128,58 L208,58 Q246,42 252,58 L598,58 Q640,46 662,58 L800,58" fill="none" stroke="#333" stroke-width="2"/>
<text x="98" y="52" font-size="13" fill="#333">R</text>
<text x="232" y="50" font-size="13" fill="#333">T</text>
<text x="648" y="50" font-size="13" fill="#333">P</text>

<!-- 时相标注带 -->
<text x="106" y="78" text-anchor="middle" font-size="13" fill="#333">等容收缩期</text>
<text x="215" y="78" text-anchor="middle" font-size="13" fill="#333">射血期</text>
<text x="325" y="78" text-anchor="middle" font-size="13" fill="#333">等容舒张期</text>
<text x="560" y="78" text-anchor="middle" font-size="13" fill="#333">充盈期（快速 + 减慢 + 心房收缩）</text>

<!-- 压力图区域 -->
<rect x="70" y="92" width="740" height="208" fill="none" stroke="#999" stroke-width="1"/>
<text x="60" y="100" text-anchor="end" font-size="13" fill="#666">120</text>
<line x1="70" y1="116" x2="810" y2="116" stroke="#ddd" stroke-width="1"/>
<text x="60" y="188" text-anchor="end" font-size="13" fill="#666">80</text>
<line x1="70" y1="164" x2="810" y2="164" stroke="#ddd" stroke-width="1"/>
<text x="60" y="292" text-anchor="end" font-size="13" fill="#666">0</text>
<text x="24" y="180" text-anchor="middle" font-size="13" fill="#666" transform="rotate(-90 24 180)">压力 (mmHg)</text>

<!-- 左室压 -->
<path d="M80,254 L120,250 Q130,140 138,116 Q180,108 210,116 Q250,120 296,124 L320,250 Q340,256 354,254 L800,254" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>

<!-- 主动脉压 -->
<path d="M80,164 Q110,166 138,168 Q150,150 170,120 Q190,114 210,115 C260,115 286,122 296,126 Q360,132 470,144 Q640,158 800,166" fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- 左房压 -->
<path d="M80,250 Q120,252 150,250 Q180,244 210,248 Q250,246 296,244 Q330,248 354,252 Q400,252 620,254 Q640,246 662,242 Q700,248 760,252 L800,252" fill="none" stroke="#888" stroke-width="2"/>

<!-- 时相分界虚线 -->
<line x1="138" y1="92" x2="138" y2="540" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="296" y1="92" x2="296" y2="540" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="354" y1="92" x2="354" y2="540" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>

<!-- 瓣膜开关标注 -->
<text x="138" y="320" text-anchor="middle" font-size="13" fill="#333">主动脉瓣开</text>
<text x="296" y="320" text-anchor="middle" font-size="13" fill="#333">主动脉瓣关</text>
<text x="354" y="320" text-anchor="middle" font-size="13" fill="#333">二尖瓣开</text>
<text x="80" y="320" text-anchor="start" font-size="13" fill="#333">二尖瓣关（收缩开始）</text>

<!-- 曲线图例 -->
<text x="600" y="110" font-size="13" fill="#c0392b">— 主动脉压</text>
<text x="600" y="128" font-size="13" fill="#1f6f8b">— 左室压</text>
<text x="600" y="146" font-size="13" fill="#888">— 左房压</text>

<!-- 容积图区域 -->
<rect x="70" y="336" width="740" height="120" fill="none" stroke="#999" stroke-width="1"/>
<text x="60" y="346" text-anchor="end" font-size="13" fill="#666">120</text>
<text x="60" y="446" text-anchor="end" font-size="13" fill="#666">50</text>
<text x="24" y="396" text-anchor="middle" font-size="13" fill="#666" transform="rotate(-90 24 396)">左室容积 (ml)</text>

<!-- 容积曲线 -->
<path d="M80,332 C100,332 120,330 138,330 Q180,420 250,442 C270,445 286,444 296,442 L354,442 Q420,400 480,350 C560,336 620,332 656,330 Q720,326 800,332" fill="none" stroke="#333" stroke-width="2.5"/>
<text x="250" y="452" text-anchor="middle" font-size="13" fill="#333">收缩末容积</text>
<text x="470" y="356" text-anchor="middle" font-size="13" fill="#333">舒张末容积</text>

<!-- 心音标注 -->
<text x="128" y="470" text-anchor="middle" font-size="13" fill="#c0392b">第一心音</text>
<text x="304" y="470" text-anchor="middle" font-size="13" fill="#c0392b">第二心音</text>
<text x="440" y="520" text-anchor="middle" font-size="14" fill="#333">0.8 s（心率约 75 次/分时的一个心动周期）</text>
</svg>
