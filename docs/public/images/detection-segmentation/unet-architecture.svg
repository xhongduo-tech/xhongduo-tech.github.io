<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <title>U-Net 结构示意图</title>
  <desc>U-Net 的 U 形结构：左侧编码器逐层下采样压缩语义，右侧解码器逐层上采样恢复细节，每层之间由跳跃连接（拼接）把编码器特征传给对应解码器层。</desc>
  <rect width="900" height="560" fill="#faf9f5"/>

  <!-- 编码器（左）方块 -->
  <g>
    <rect x="40" y="40" width="120" height="120" fill="#e8eef1" stroke="#1f6f8b" stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" fill="#333" font-size="15">输入</text>
    <text x="100" y="128" text-anchor="middle" fill="#333" font-size="14">572×572×1</text>

    <rect x="40" y="180" width="100" height="100" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="90" y="224" text-anchor="middle" fill="#333" font-size="14">编码块1</text>
    <text x="90" y="246" text-anchor="middle" fill="#333" font-size="14">256×256×64</text>

    <rect x="40" y="300" width="80" height="80" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="80" y="334" text-anchor="middle" fill="#333" font-size="14">编码块2</text>
    <text x="80" y="354" text-anchor="middle" fill="#333" font-size="14">128×128×128</text>

    <rect x="40" y="400" width="60" height="60" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="70" y="427" text-anchor="middle" fill="#333" font-size="14">编码块3</text>
    <text x="70" y="447" text-anchor="middle" fill="#333" font-size="13">64×64×256</text>
  </g>

  <!-- 最底层 -->
  <rect x="330" y="190" width="120" height="120" fill="#fdf3d8" stroke="#8a6d1a" stroke-width="2"/>
  <text x="390" y="234" text-anchor="middle" fill="#333" font-size="15">瓶颈层</text>
  <text x="390" y="258" text-anchor="middle" fill="#333" font-size="14">32×32×512</text>
  <text x="390" y="278" text-anchor="middle" fill="#333" font-size="13">特征最浓缩</text>

  <!-- 编码器下采样箭头 -->
  <polygon points="165,60 185,60 175,45 205,60 175,75" fill="#1f6f8b"/>
  <polygon points="145,205 165,205 155,190 185,205 155,220" fill="#1f6f8b"/>
  <polygon points="125,325 145,325 135,310 165,325 135,340" fill="#1f6f8b"/>

  <!-- 解码器（右）方块 -->
  <g>
    <rect x="740" y="40" width="120" height="120" fill="#e8eef1" stroke="#1f6f8b" stroke-width="2"/>
    <text x="800" y="105" text-anchor="middle" fill="#333" font-size="15">输出</text>
    <text x="800" y="128" text-anchor="middle" fill="#333" font-size="14">388×388×C</text>

    <rect x="740" y="180" width="100" height="100" fill="#e4f4e3" stroke="#2a7a2a" stroke-width="2"/>
    <text x="790" y="224" text-anchor="middle" fill="#333" font-size="14">解码块1</text>
    <text x="790" y="246" text-anchor="middle" fill="#333" font-size="14">256×256×64</text>

    <rect x="740" y="300" width="80" height="80" fill="#e4f4e3" stroke="#2a7a2a" stroke-width="2"/>
    <text x="780" y="334" text-anchor="middle" fill="#333" font-size="14">解码块2</text>
    <text x="780" y="354" text-anchor="middle" fill="#333" font-size="14">128×128×128</text>

    <rect x="740" y="400" width="60" height="60" fill="#e4f4e3" stroke="#2a7a2a" stroke-width="2"/>
    <text x="770" y="427" text-anchor="middle" fill="#333" font-size="14">解码块3</text>
    <text x="770" y="447" text-anchor="middle" fill="#333" font-size="13">64×64×256</text>
  </g>

  <!-- 解码器上采样箭头 -->
  <polygon points="465,60 485,60 475,45 505,60 475,75" fill="#2a7a2a"/>
  <polygon points="465,205 485,205 475,190 505,205 475,220" fill="#2a7a2a"/>
  <polygon points="465,325 485,325 475,310 505,325 475,340" fill="#2a7a2a"/>

  <!-- 跳跃连接 -->
  <line x1="140" y1="80" x2="740" y2="80" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrR)"/>
  <line x1="140" y1="230" x2="740" y2="230" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrR)"/>
  <line x1="140" y1="340" x2="740" y2="340" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrR)"/>
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="440" y="70" text-anchor="middle" fill="#c0392b" font-size="15">跳跃连接（拼接）</text>
  <text x="440" y="220" text-anchor="middle" fill="#c0392b" font-size="15">跳跃连接（拼接）</text>
  <text x="440" y="330" text-anchor="middle" fill="#c0392b" font-size="15">跳跃连接（拼接）</text>

  <!-- 标注 -->
  <text x="100" y="500" text-anchor="middle" fill="#1f6f8b" font-size="15">左侧编码器：下采样，语义渐强</text>
  <text x="800" y="500" text-anchor="middle" fill="#2a7a2a" font-size="15">右侧解码器：上采样，细节恢复</text>
  <text x="450" y="535" text-anchor="middle" fill="#333" font-size="15">U 形对称：每层解码都「拼接」对应编码层的特征，位置信息不丢失</text>
</svg>
