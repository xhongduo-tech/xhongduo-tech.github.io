<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="sans-serif">
  <title>三维渲染管线：坐标空间的一层层变换</title>
  <desc>五个坐标空间盒子依次排列，箭头标注变换矩阵 M、V、P 与透视除法和视口变换，示意三维顶点如何一步步变成屏幕像素。</desc>
  <rect x="0" y="0" width="640" height="250" fill="#faf9f5"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333">三维渲染管线：坐标空间的一层层变换</text>

  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="24" y="60" width="96" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="72" y="82">对象空间</text>
    <text x="72" y="100" font-size="12" fill="#666">顶点数据</text>

    <rect x="150" y="60" width="96" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="198" y="82">世界空间</text>
    <text x="198" y="100" font-size="12" fill="#666">场景装配</text>

    <rect x="276" y="60" width="96" height="52" rx="6" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
    <text x="324" y="82">视图空间</text>
    <text x="324" y="100" font-size="12" fill="#666">摄像机坐标</text>

    <rect x="402" y="60" width="96" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="450" y="82">裁剪空间</text>
    <text x="450" y="100" font-size="12" fill="#666">投影变换</text>

    <rect x="528" y="60" width="96" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="576" y="82">屏幕空间</text>
    <text x="576" y="100" font-size="12" fill="#666">像素绘制</text>
  </g>

  <g font-size="14" fill="#666">
    <line x1="120" y1="86" x2="150" y2="86" stroke="#666" stroke-width="1.5"/>
    <text x="135" y="76" text-anchor="middle" fill="#1f6f8b">M</text>

    <line x1="246" y1="86" x2="276" y2="86" stroke="#666" stroke-width="1.5"/>
    <text x="261" y="76" text-anchor="middle" fill="#1f6f8b">V</text>

    <line x1="372" y1="86" x2="402" y2="86" stroke="#666" stroke-width="1.5"/>
    <text x="387" y="76" text-anchor="middle" fill="#c0392b">P</text>

    <line x1="498" y1="86" x2="528" y2="86" stroke="#666" stroke-width="1.5"/>
    <text x="513" y="76" text-anchor="middle" fill="#c0392b">÷w</text>
  </g>

  <text x="320" y="150" text-anchor="middle" font-size="14" fill="#333">一次顶点变换的完整链路：</text>
  <text x="320" y="178" text-anchor="middle" font-size="15" fill="#c0392b">p屏幕 = 视口变换 ( P · V · M · p对象 )</text>
  <text x="320" y="205" text-anchor="middle" font-size="13" fill="#666">M 把模型放进世界，V 把世界转到摄像机前方，P 做透视投影，÷w 完成透视除法</text>
  <text x="320" y="230" text-anchor="middle" font-size="13" fill="#666">（这个公式对场景里的每一个顶点执行，再对每个三角形光栅化填色）</text>
</svg>
