<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif">
  <title>数字化的两个步骤：采样与量化</title>
  <desc>左侧是连续的模拟信号波形与红色采样点，右侧是量化电平虚线网格与红色数字阶梯信号，示意数字化等于采样加量化。</desc>
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333">数字化 = 采样（取点） + 量化（归级）</text>

  <text x="40" y="66" font-size="14" fill="#1f6f8b">模拟信号（连续）</text>
  <text x="40" y="86" font-size="13" fill="#666">采样点</text>

  <!-- 模拟信号波形 -->
  <polyline points="40,180 66,135 92,111 118,119 144,156 170,204 196,241 222,249 248,225 274,180"
    fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 采样点与虚线 -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="40" y1="180" x2="40" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="66" y1="135" x2="66" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="92" y1="111" x2="92" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="118" y1="119" x2="118" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="144" y1="156" x2="144" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="170" y1="204" x2="170" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="196" y1="241" x2="196" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="222" y1="249" x2="222" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="248" y1="225" x2="248" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
    <line x1="274" y1="180" x2="274" y2="300" stroke-dasharray="3 4" stroke="#bbb"/>
  </g>
  <g fill="#c0392b">
    <circle cx="40" cy="180" r="4.5"/>
    <circle cx="66" cy="135" r="4.5"/>
    <circle cx="92" cy="111" r="4.5"/>
    <circle cx="118" cy="119" r="4.5"/>
    <circle cx="144" cy="156" r="4.5"/>
    <circle cx="170" cy="204" r="4.5"/>
    <circle cx="196" cy="241" r="4.5"/>
    <circle cx="222" cy="249" r="4.5"/>
    <circle cx="248" cy="225" r="4.5"/>
    <circle cx="274" cy="180" r="4.5"/>
  </g>

  <line x1="40" y1="300" x2="300" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="318" text-anchor="middle" font-size="13" fill="#666">时间 t</text>

  <!-- 右侧量化区域 -->
  <line x1="340" y1="100" x2="620" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#c0392b">数字信号（量化阶梯）</text>
  <g stroke="#999" stroke-dasharray="4 4" stroke-width="1">
    <line x1="340" y1="110" x2="620" y2="110"/>
    <line x1="340" y1="135" x2="620" y2="135"/>
    <line x1="340" y1="160" x2="620" y2="160"/>
    <line x1="340" y1="180" x2="620" y2="180"/>
    <line x1="340" y1="205" x2="620" y2="205"/>
    <line x1="340" y1="225" x2="620" y2="225"/>
    <line x1="340" y1="250" x2="620" y2="250"/>
  </g>
  <text x="340" y="330" font-size="13" fill="#666">量化电平（虚线）</text>

  <!-- 数字阶梯 -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5">
    <polyline points="340,180 368,180 368,135 396,135 396,110 424,110 424,135 452,135 452,160 480,160 480,205 508,205 508,250 536,250 536,250 564,250 564,225 592,225 592,180 620,180"/>
  </g>
  <text x="480" y="345" text-anchor="middle" font-size="13" fill="#666">每个采样点被归入最近的电平，信息从「连续」变成「可数的级别」</text>
</svg>
