<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>卧式车床主要组成部分示意图</title>
  <desc>卧式车床由主轴箱、卡盘、工件、刀架、床鞍、尾座、床身、丝杠与光杠等组成，工件作主运动、刀具作进给运动</desc>
  <rect width="640" height="380" fill="#faf9f5"/>
  <!-- 导轨 -->
  <rect x="90" y="242" width="430" height="8" fill="#1f6f8b"/>
  <!-- 床身 -->
  <rect x="90" y="250" width="430" height="26" fill="#333"/>
  <!-- 床腿 -->
  <rect x="90" y="276" width="34" height="74" fill="#555"/>
  <rect x="486" y="276" width="34" height="74" fill="#555"/>
  <!-- 主轴箱 -->
  <rect x="28" y="138" width="84" height="124" rx="4" fill="#1f6f8b"/>
  <!-- 卡盘 -->
  <rect x="112" y="170" width="24" height="60" fill="#c0392b"/>
  <!-- 工件 -->
  <rect x="136" y="166" width="254" height="32" fill="#c0392b"/>
  <!-- 尾座 -->
  <rect x="392" y="160" width="76" height="92" rx="4" fill="#1f6f8b"/>
  <!-- 顶尖 -->
  <polygon points="392,186 384,186 384,172 392,172" fill="#333"/>
  <!-- 床鞍 -->
  <rect x="238" y="250" width="100" height="18" fill="#666"/>
  <!-- 中滑板 -->
  <rect x="262" y="236" width="52" height="14" fill="#888"/>
  <!-- 刀架 -->
  <rect x="270" y="202" width="38" height="34" fill="#555"/>
  <!-- 车刀 -->
  <polygon points="288,198 308,198 308,204 292,204" fill="#c0392b"/>
  <!-- 丝杠 -->
  <line x1="112" y1="290" x2="522" y2="290" stroke="#1f6f8b" stroke-width="5"/>
  <!-- 光杠 -->
  <line x1="112" y1="304" x2="522" y2="304" stroke="#9a9a9a" stroke-width="5"/>
  <!-- 标注 -->
  <text x="30" y="128" font-size="14" fill="#333">主轴箱</text>
  <text x="106" y="160" font-size="13" fill="#333">卡盘</text>
  <text x="222" y="158" font-size="14" fill="#333">工件</text>
  <text x="398" y="150" font-size="14" fill="#333">尾座</text>
  <text x="314" y="222" font-size="14" fill="#333">刀架</text>
  <text x="440" y="268" font-size="14" fill="#faf9f5">床身</text>
  <text x="352" y="284" font-size="13" fill="#1f6f8b">丝杠</text>
  <text x="352" y="300" font-size="13" fill="#555">光杠</text>
</svg>
