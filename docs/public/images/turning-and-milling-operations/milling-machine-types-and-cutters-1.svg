<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="sans-serif">
  <title>逆铣与顺铣示意图</title>
  <desc>逆铣时铣刀转向与工件进给方向相反，顺铣时铣刀转向与工件进给方向相同</desc>
  <rect width="460" height="300" fill="#faf9f5"/>
  <!-- 逆铣 -->
  <text x="70" y="40" font-size="16" fill="#333" font-weight="bold">逆铣</text>
  <circle cx="115" cy="120" r="52" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="115" y1="68" x2="115" y2="82" stroke="#c0392b" stroke-width="3"/>
  <line x1="63" y1="120" x2="77" y2="120" stroke="#c0392b" stroke-width="3"/>
  <line x1="115" y1="158" x2="115" y2="172" stroke="#c0392b" stroke-width="3"/>
  <line x1="167" y1="120" x2="153" y2="120" stroke="#c0392b" stroke-width="3"/>
  <path d="M 167 120 A 52 52 0 0 1 115 172" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="107,172 115,166 115,178" fill="#1f6f8b"/>
  <rect x="55" y="200" width="120" height="26" fill="#e8e0d0" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="150" y2="240" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="150,240 138,235 138,245" fill="#c0392b"/>
  <text x="98" y="236" font-size="13" fill="#c0392b">进给</text>
  <text x="52" y="268" font-size="13" fill="#333">刀齿运动方向与进给相反</text>
  <!-- 顺铣 -->
  <text x="290" y="40" font-size="16" fill="#333" font-weight="bold">顺铣</text>
  <circle cx="335" cy="120" r="52" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="335" y1="68" x2="335" y2="82" stroke="#c0392b" stroke-width="3"/>
  <line x1="283" y1="120" x2="297" y2="120" stroke="#c0392b" stroke-width="3"/>
  <line x1="335" y1="158" x2="335" y2="172" stroke="#c0392b" stroke-width="3"/>
  <line x1="387" y1="120" x2="373" y2="120" stroke="#c0392b" stroke-width="3"/>
  <path d="M 335 68 A 52 52 0 0 0 387 120" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="387,128 381,120 393,120" fill="#1f6f8b"/>
  <rect x="275" y="200" width="120" height="26" fill="#e8e0d0" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="240" x2="370" y2="240" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="370,240 358,235 358,245" fill="#c0392b"/>
  <text x="318" y="236" font-size="13" fill="#c0392b">进给</text>
  <text x="272" y="268" font-size="13" fill="#333">刀齿运动方向与进给相同</text>
  <text x="120" y="292" font-size="13" fill="#555">青弧箭头=铣刀转向；工件统一向右进给</text>
</svg>
