<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <title>最小二乘的几何：向量 b 在列空间上的正交投影</title>
  <desc>过原点的直线代表列空间 Col(A)，向量 b 被正交投影到直线上得 A x-hat，残差 e 垂直于列空间。</desc>
  <rect width="560" height="400" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="330" x2="540" y2="330" stroke="#c9c3b8" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="360" stroke="#c9c3b8" stroke-width="1.5"/>
  <text x="532" y="346" font-family="sans-serif" font-size="14" fill="#888">x₁</text>
  <text x="52" y="26" font-family="sans-serif" font-size="14" fill="#888">x₂</text>
  <text x="58" y="344" font-family="sans-serif" font-size="14" fill="#666">O</text>
  <!-- 列空间直线（过原点，方向 (2,1)），延伸到两侧 -->
  <line x1="462" y1="134" x2="-20" y2="384" stroke="#1f6f8b" stroke-width="3"/>
  <text x="410" y="120" font-family="sans-serif" font-size="15" fill="#1f6f8b">列空间 Col(A)</text>
  <!-- 投影向量 A x-hat：原点到 P(238,246) -->
  <line x1="70" y1="330" x2="238" y2="246" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="238,246 226,252 234,238" fill="#c0392b"/>
  <text x="150" y="300" font-family="sans-serif" font-size="15" fill="#c0392b">Ax̂（投影）</text>
  <!-- 向量 b：原点到 B(204,179) -->
  <line x1="70" y1="330" x2="204" y2="179" stroke="#333" stroke-width="2.5"/>
  <polygon points="204,179 192,188 213,191" fill="#333"/>
  <text x="215" y="168" font-family="sans-serif" font-size="15" fill="#333">b（观测）</text>
  <!-- 残差 e：P 到 B -->
  <line x1="238" y1="246" x2="204" y2="179" stroke="#6b8e23" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="250" y="205" font-family="sans-serif" font-size="15" fill="#6b8e23">e = b − Ax̂（残差）</text>
  <!-- 直角标记：在 P 处 -->
  <polyline points="248.7,251.4 243.3,262.1 232.6,256.7" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- 点标注 -->
  <circle cx="70" cy="330" r="4" fill="#333"/>
  <circle cx="238" cy="246" r="4" fill="#c0392b"/>
  <circle cx="204" cy="179" r="4" fill="#333"/>
  <!-- 图例说明 -->
  <text x="320" y="350" font-family="sans-serif" font-size="14" fill="#666">残差 e 垂直于列空间 ⇒ e 长度即误差平方和的根</text>
</svg>
