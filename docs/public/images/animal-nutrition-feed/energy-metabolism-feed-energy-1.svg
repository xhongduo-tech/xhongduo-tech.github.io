<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" role="img" aria-labelledby="title desc">
  <title>饲料能量分级递减示意图</title>
  <desc>总能 GE 依次扣除粪能、尿能与甲烷气能、热增耗，逐步得到消化能 DE、代谢能 ME 与净能 NE；净能再分配为维持与生产。</desc>
  <rect x="0" y="0" width="640" height="660" fill="#faf9f5"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">饲料能量分级：GE → DE → ME → NE</text>

  <!-- GE -->
  <rect x="170" y="60" width="300" height="56" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333" font-weight="bold">总能 GE</text>
  <text x="320" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">完全燃烧的全部化学能</text>

  <!-- 粪能损失 -->
  <path d="M320 116 V150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="60" y="150" width="250" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="185" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">− 粪能 E_粪</text>
  <text x="185" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">未消化残渣 + 肠道脱落物</text>

  <!-- DE -->
  <rect x="170" y="210" width="300" height="56" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">消化能 DE</text>
  <text x="320" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">被消化吸收的部分</text>

  <!-- 尿能+气能 -->
  <path d="M320 266 V300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="330" y="300" width="270" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">− 尿能 E_尿 + 甲烷气能 E_气</text>
  <text x="465" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">尿素等含氮废物 · 反刍动物甲烷</text>

  <!-- ME -->
  <rect x="170" y="360" width="300" height="56" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f6f8b" font-weight="bold">代谢能 ME</text>
  <text x="320" y="406" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">进入体内代谢池的能量</text>

  <!-- HI -->
  <path d="M320 416 V450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="60" y="450" width="250" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="185" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">− 热增耗 HI</text>
  <text x="185" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">消化代谢的加工费</text>

  <!-- NE -->
  <rect x="170" y="510" width="300" height="56" rx="10" fill="#eaf6f8" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="536" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">净能 NE</text>
  <text x="320" y="556" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">真正用于维持与生产</text>

  <!-- NE split -->
  <path d="M320 566 V598" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M170 598 H470" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M170 598 V612" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrr)"/>
  <path d="M470 598 V612" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrr)"/>
  <rect x="30" y="616" width="190" height="34" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="638" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">维持 NE_m（优先·高效）</text>
  <rect x="420" y="616" width="190" height="34" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="515" y="638" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">生产 NE_g / NE_l（效率低）</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
</svg>
