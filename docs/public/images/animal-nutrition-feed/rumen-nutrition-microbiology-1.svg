<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560">
  <title>瘤胃微生物发酵的养分转化示意图</title>
  <desc>饲料中的纤维素、淀粉与尿素氮进入瘤胃，被细菌、原虫、真菌发酵，产出挥发性脂肪酸、微生物蛋白与甲烷。</desc>
  <rect x="0" y="0" width="820" height="560" fill="#faf9f5"/>
  <style>
    text { font-family: sans-serif; }
    .title { font-size: 22px; font-weight: bold; fill: #333; }
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .rumen { fill: #eef4f6; stroke: #1f6f8b; stroke-width: 2; }
    .label { font-size: 15px; fill: #333; }
    .sub { font-size: 13px; fill: #666; }
    .arrow { stroke: #1f6f8b; stroke-width: 2; fill: none; }
    .arrow-red { stroke: #c0392b; stroke-width: 2; fill: none; }
  </style>

  <text x="410" y="38" text-anchor="middle" class="title">瘤胃：一台靠微生物运转的发酵反应器</text>

  <!-- 饲料 input -->
  <rect x="60" y="70" width="240" height="78" rx="8" class="box"/>
  <text x="180" y="100" text-anchor="middle" class="label"><tspan>饲料（植物性）</tspan></text>
  <text x="180" y="122" text-anchor="middle" class="sub">纤维素 · 半纤维素 · 淀粉 · 尿素（NPN）</text>

  <!-- 唾液尿素 recycling -->
  <rect x="520" y="70" width="240" height="78" rx="8" class="box"/>
  <text x="640" y="100" text-anchor="middle" class="label"><tspan>唾液 + 肝脏循环尿素</tspan></text>
  <text x="640" y="122" text-anchor="middle" class="sub">尿素 → NH₃，供微生物合成蛋白</text>

  <!-- 瘤胃 big box -->
  <rect x="100" y="190" width="620" height="140" rx="16" class="rumen"/>
  <text x="410" y="222" text-anchor="middle" class="label"><tspan>瘤胃（约占胃总容积 80%）</tspan></text>
  <text x="410" y="248" text-anchor="middle" class="sub">细菌（降解纤维/淀粉/蛋白） · 原虫 · 厌氧真菌 · 产甲烷古菌</text>
  <text x="410" y="282" text-anchor="middle" class="sub">发酵产物：乙酸、丙酸、丁酸 · NH₃ · 微生物蛋白 · H₂ / CO₂</text>
  <text x="410" y="312" text-anchor="middle" class="sub">温度 38–40 ℃ · pH 5.5–7.0 · 厌氧环境</text>

  <!-- arrows from feed to rumen -->
  <line x1="180" y1="148" x2="260" y2="190" class="arrow"/>
  <text x="200" y="172" text-anchor="middle" class="sub">采食</text>

  <!-- VFA box -->
  <rect x="60" y="390" width="240" height="88" rx="8" class="box"/>
  <text x="180" y="418" text-anchor="middle" class="label"><tspan>挥发性脂肪酸（VFA）</tspan></text>
  <text x="180" y="440" text-anchor="middle" class="sub">乙酸 : 丙酸 : 丁酸 ≈ 60 : 25 : 15</text>
  <text x="180" y="462" text-anchor="middle" class="sub">经瘤胃壁吸收 → 主要能量来源</text>

  <!-- microbial protein box -->
  <rect x="330" y="390" width="240" height="88" rx="8" class="box"/>
  <text x="450" y="418" text-anchor="middle" class="label"><tspan>微生物蛋白</tspan></text>
  <text x="450" y="440" text-anchor="middle" class="sub">菌体蛋白 → 真胃/小肠消化</text>
  <text x="450" y="462" text-anchor="middle" class="sub">供给反刍动物 60%–80% 的氨基酸</text>

  <!-- CH4 box -->
  <rect x="620" y="390" width="180" height="88" rx="8" class="box"/>
  <text x="710" y="418" text-anchor="middle" class="label"><tspan>甲烷 CH₄</tspan></text>
  <text x="710" y="440" text-anchor="middle" class="sub">嗳气排出</text>
  <text x="710" y="462" text-anchor="middle" class="sub">温室气体 + 能量损失 2%–12%</text>

  <!-- arrows from rumen to boxes -->
  <line x1="180" y1="330" x2="180" y2="390" class="arrow"/>
  <line x1="450" y1="330" x2="450" y2="390" class="arrow"/>
  <line x1="650" y1="330" x2="680" y2="390" class="arrow-red"/>

  <!-- urea recycling arrow from rumen top-right back to saliva -->
  <line x1="520" y1="190" x2="620" y2="148" class="arrow-red"/>
  <text x="640" y="168" text-anchor="middle" class="sub">氨再循环</text>

  <!-- note -->
  <text x="410" y="520" text-anchor="middle" class="sub">饲料 →（瘤胃发酵）→ VFA + 微生物蛋白 + CH₄ · 尿素再循环减少氮损失</text>
</svg>
