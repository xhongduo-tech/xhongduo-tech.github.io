<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title>瘤胃发酵与四个胃腔示意</title>
  <desc>日粮进入瘤胃，微生物发酵产生 VFA、微生物蛋白与甲烷；VFA 经瘤胃壁吸收，微生物蛋白进入皱胃被消化。</desc>
  <rect x="0" y="0" width="960" height="520" fill="#faf9f5"/>
  <text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold">反刍动物瘤胃发酵链</text>

  <!-- 口腔/食管 -->
  <rect x="20" y="80" width="130" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">口腔 · 食管</text>
  <text x="85" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">采食 · 咀嚼</text>
  <path d="M150 110 H210" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 瘤胃 -->
  <rect x="210" y="40" width="240" height="140" rx="14" fill="#fdf6e3" stroke="#c0392b" stroke-width="2.5"/>
  <text x="330" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b" font-weight="bold">瘤胃 + 网胃</text>
  <text x="330" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">厌氧 38–41℃ pH 5.5–7</text>
  <text x="330" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">细菌 / 原虫 / 真菌 / 古菌</text>
  <text x="330" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">纤维 · 淀粉 · 蛋白发酵</text>
  <text x="330" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">尿素 → 氨 → 微生物蛋白</text>

  <!-- 瓣胃 -->
  <rect x="520" y="70" width="110" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="575" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">瓣胃</text>
  <text x="575" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">吸水 · 滤过</text>
  <path d="M450 110 H515" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 皱胃 -->
  <rect x="700" y="70" width="110" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="755" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">皱胃（真胃）</text>
  <text x="755" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">胃酸 · 胃蛋白酶</text>
  <path d="M630 100 H695" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 小肠 -->
  <rect x="850" y="70" width="90" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="895" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">小肠</text>
  <text x="895" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">消化微生物蛋白</text>
  <path d="M810 100 H845" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- VFA 分支 -->
  <path d="M330 180 V230" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowr)"/>
  <path d="M330 230 H470 V255" stroke="#c0392b" stroke-width="2" fill="none"/>
  <rect x="360" y="258" width="220" height="86" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="470" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold">产物① 挥发性脂肪酸 VFA</text>
  <text x="470" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">乙酸（乳脂） · 丙酸（糖） · 丁酸</text>
  <text x="470" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">经瘤胃壁吸收 → 占代谢能 60–80%</text>

  <!-- MCP 分支 -->
  <path d="M420 180 V200" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <path d="M420 200 H700" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <path d="M700 200 V330" stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#arrowb)"/>
  <rect x="620" y="336" width="220" height="66" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="730" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f6f8b" font-weight="bold">产物② 微生物蛋白 MCP</text>
  <text x="730" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">进入皱胃被消化 → 占小肠蛋白 60–80%</text>

  <!-- CH4 分支 -->
  <path d="M240 180 V430" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M240 430 H250" stroke="#c0392b" stroke-width="2" fill="none"/>
  <rect x="90" y="436" width="300" height="58" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">产物③ 甲烷 CH₄（嗳气）</text>
  <text x="240" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">损失总能 2–12% · 温室气体 · 氢气安全阀</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/></marker>
  </defs>
</svg>
