<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" font-family="sans-serif">
  <title>迈克尔逊干涉仪测长原理</title>
  <desc>光源经分束镜分为参考臂与测量臂，测量臂反射镜随被测对象移动，两束光返回后叠加产生干涉条纹，由探测器计数。</desc>
  <rect x="0" y="0" width="400" height="320" fill="#faf9f5"/>
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">迈克尔逊干涉仪测长原理</text>

  <!-- 光源 -->
  <rect x="18" y="140" width="60" height="34" fill="#1f6f8b" fill-opacity="0.18" stroke="#1f6f8b" stroke-width="2"/>
  <text x="48" y="161" text-anchor="middle" font-size="13" fill="#1f6f8b">稳频激光器</text>

  <!-- 分束镜 -->
  <polygon points="100,120 140,160 100,200 60,160" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="218" text-anchor="middle" font-size="13" fill="#c0392b">分束镜</text>

  <!-- 光源到分束镜 -->
  <line x1="78" y1="157" x2="96" y2="157" stroke="#333" stroke-width="2"/>
  <path d="M 88 153 L 98 157 L 88 161" fill="#333"/>

  <!-- 参考臂（固定反射镜） -->
  <line x1="100" y1="120" x2="100" y2="80" stroke="#333" stroke-width="2"/>
  <path d="M 96 90 L 100 78 L 104 90" fill="#333"/>
  <rect x="88" y="56" width="24" height="24" fill="#333"/>
  <text x="132" y="64" font-size="13" fill="#333">固定反射镜</text>

  <!-- 测量臂（移动反射镜） -->
  <line x1="140" y1="160" x2="250" y2="160" stroke="#333" stroke-width="2"/>
  <path d="M 240 156 L 252 160 L 240 164" fill="#333"/>
  <rect x="252" y="148" width="24" height="24" fill="#333"/>
  <text x="258" y="186" font-size="13" fill="#333">移动反射镜</text>
  <text x="258" y="202" font-size="13" fill="#c0392b">（随被测对象移动）</text>

  <!-- 往返标注 -->
  <path d="M 252 140 C 300 120 300 100 252 140" stroke="#1f6f8b" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
  <text x="296" y="120" font-size="13" fill="#1f6f8b">往返 2L</text>

  <!-- 返回叠加到探测器 -->
  <line x1="100" y1="200" x2="100" y2="270" stroke="#333" stroke-width="2"/>
  <path d="M 96 260 L 100 272 L 104 260" fill="#333"/>
  <rect x="60" y="270" width="80" height="26" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="100" y="287" text-anchor="middle" font-size="13" fill="#1f6f8b">探测器（数条纹）</text>

  <!-- 干涉公式 -->
  <text x="200" y="310" text-anchor="middle" font-size="14" fill="#c0392b">L = (N + ε) · λ / 2</text>
</svg>
