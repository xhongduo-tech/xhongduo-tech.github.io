<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380" font-family="sans-serif">
  <title>铯喷泉原子钟原理示意</title>
  <desc>冷铯原子云沿真空飞行管向上抛出后回落，两次穿过微波谐振腔，采用拉姆齐分离振荡场法。</desc>
  <rect x="0" y="0" width="400" height="380" fill="#faf9f5"/>
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">铯喷泉原子钟原理示意</text>

  <!-- 真空飞行管 -->
  <rect x="165" y="60" width="80" height="250" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="255" y="180" font-size="13" fill="#333">真空飞行管</text>

  <!-- 微波谐振腔 -->
  <rect x="175" y="70" width="60" height="34" fill="#1f6f8b" fill-opacity="0.18" stroke="#1f6f8b" stroke-width="2"/>
  <text x="205" y="60" text-anchor="middle" font-size="13" fill="#1f6f8b">微波谐振腔</text>

  <!-- 上升轨迹 -->
  <line x1="215" y1="300" x2="215" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 211 140 L 215 124 L 219 140" fill="#c0392b"/>
  <text x="228" y="200" font-size="13" fill="#c0392b">上升</text>

  <!-- 回落轨迹 -->
  <line x1="193" y1="130" x2="193" y2="300" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 189 290 L 193 306 L 197 290" fill="#c0392b"/>
  <text x="130" y="200" font-size="13" fill="#c0392b">回落（再次穿过腔）</text>

  <!-- 原子云 -->
  <circle cx="205" cy="95" r="9" fill="#c0392b"/>
  <text x="205" y="78" text-anchor="middle" font-size="13" fill="#c0392b">铯原子云</text>

  <!-- 拉姆齐两次作用标注 -->
  <line x1="235" y1="88" x2="262" y2="105" stroke="#333" stroke-width="1"/>
  <text x="264" y="110" font-size="13" fill="#333">上升与回落</text>
  <text x="264" y="126" font-size="13" fill="#333">各穿腔一次</text>
  <text x="264" y="142" font-size="13" fill="#333">（拉姆齐法）</text>

  <!-- 激光冷却与探测区 -->
  <rect x="150" y="310" width="110" height="34" fill="#1f6f8b" fill-opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="205" y="332" text-anchor="middle" font-size="13" fill="#1f6f8b">激光冷却与探测区</text>
  <text x="205" y="360" text-anchor="middle" font-size="13" fill="#333">冷却→抛起→回落→探测跃迁率→反馈锁频</text>
</svg>
