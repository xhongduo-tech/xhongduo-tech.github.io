<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="sans-serif">
  <title>墨卡托投影示意图</title>
  <desc>左侧球面经纬网投影到切圆柱，右侧展开为平面地图；赤道处无变形，高纬度被纵向拉伸。</desc>
  <rect x="0" y="0" width="680" height="420" fill="#faf9f5"/>

  <!-- 标题 -->
  <text x="340" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">墨卡托投影：从球面到平面</text>

  <!-- 左侧：球面与切圆柱 -->
  <g stroke="#1f6f8b" stroke-width="1.4" fill="none">
    <!-- 圆柱（赤道处相切）：两条竖线 -->
    <line x1="90" y1="52" x2="90" y2="348" stroke="#999"/>
    <line x1="292" y1="52" x2="292" y2="348" stroke="#999"/>
    <line x1="90" y1="52" x2="292" y2="52" stroke="#999" stroke-dasharray="4 3"/>
    <line x1="90" y1="348" x2="292" y2="348" stroke="#999" stroke-dasharray="4 3"/>
    <!-- 球体 -->
    <circle cx="191" cy="200" r="118" stroke="#333" stroke-width="1.8" fill="#fdfcf9"/>
    <!-- 纬线（横椭圆，等角墨卡托经纬网示意） -->
    <ellipse cx="191" cy="140" rx="118" ry="20" stroke="#1f6f8b"/>
    <ellipse cx="191" cy="170" rx="118" ry="36" stroke="#1f6f8b"/>
    <line x1="73" y1="200" x2="309" y2="200" stroke="#c0392b" stroke-width="2"/>
    <ellipse cx="191" cy="230" rx="118" ry="36" stroke="#1f6f8b"/>
    <ellipse cx="191" cy="260" rx="118" ry="20" stroke="#1f6f8b"/>
    <!-- 经线（纵椭圆） -->
    <ellipse cx="191" cy="200" rx="52" ry="118" stroke="#1f6f8b"/>
    <ellipse cx="191" cy="200" rx="90" ry="118" stroke="#1f6f8b"/>
    <line x1="191" y1="82" x2="191" y2="318" stroke="#1f6f8b"/>
  </g>

  <!-- 投影方向箭头：纬线等高处从球面水平射到圆柱 -->
  <g stroke="#c0392b" stroke-width="1.5" fill="#c0392b" marker-end="none">
    <line x1="309" y1="170" x2="309" y2="170"/>
  </g>
  <line x1="309" y1="164" x2="309" y2="176" stroke="#c0392b" stroke-width="3"/>
  <line x1="73" y1="230" x2="73" y2="218" stroke="#c0392b" stroke-width="3"/>
  <text x="330" y="140" text-anchor="start" font-size="13" fill="#c0392b">纬线水平</text>
  <text x="330" y="157" text-anchor="start" font-size="13" fill="#c0392b">投影到圆柱</text>
  <text x="40" y="210" text-anchor="middle" font-size="13" fill="#333">球面</text>
  <text x="191" y="222" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">赤道（无变形）</text>
  <text x="191" y="120" text-anchor="middle" font-size="13" fill="#333">纬线</text>
  <text x="300" y="94" text-anchor="end" font-size="13" fill="#333">经线</text>

  <!-- 右侧：展开的平面地图 -->
  <g>
    <rect x="400" y="60" width="250" height="290" fill="#fdfcf9" stroke="#333" stroke-width="1.8"/>
    <!-- 经线：等间距竖线 -->
    <line x1="430" y1="60" x2="430" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="460" y1="60" x2="460" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="490" y1="60" x2="490" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="520" y1="60" x2="520" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="550" y1="60" x2="550" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="580" y1="60" x2="580" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="610" y1="60" x2="610" y2="350" stroke="#1f6f8b" stroke-width="1"/>
    <!-- 纬线：间距向上递增（高纬度拉伸） -->
    <line x1="400" y1="330" x2="650" y2="330" stroke="#c0392b" stroke-width="2"/>
    <line x1="400" y1="290" x2="650" y2="290" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="400" y1="250" x2="650" y2="250" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="400" y1="210" x2="650" y2="210" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="400" y1="170" x2="650" y2="170" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="400" y1="120" x2="650" y2="120" stroke="#1f6f8b" stroke-width="1"/>
    <line x1="400" y1="70" x2="650" y2="70" stroke="#1f6f8b" stroke-width="1"/>
  </g>
  <text x="525" y="348" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">赤道附近间距小</text>
  <text x="525" y="96" text-anchor="middle" font-size="13" fill="#c0392b">高纬度被拉伸</text>
  <text x="525" y="45" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">展开为平面地图</text>

  <!-- 底部说明 -->
  <text x="340" y="398" text-anchor="middle" font-size="13" fill="#555">等角投影保持方向，但比例因子随纬度放大：k = sec φ</text>
</svg>
