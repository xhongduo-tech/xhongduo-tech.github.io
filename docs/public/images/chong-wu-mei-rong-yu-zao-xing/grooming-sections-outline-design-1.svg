<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="100%" font-family="sans-serif">
  <title>宠物修剪分区示意图</title>
  <desc>犬体侧面视图，标注头部、颈部、背部、腹部、前肢、后肢与尾部七个修剪分区及其轮廓要点。</desc>
  <rect x="0" y="0" width="500" height="330" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="2" fill="#e8e4da">
    <ellipse cx="200" cy="135" rx="105" ry="42"/>
    <circle cx="78" cy="112" r="30"/>
    <ellipse cx="52" cy="122" rx="20" ry="14"/>
    <ellipse cx="90" cy="82" rx="10" ry="16"/>
    <rect x="138" y="168" width="24" height="62" rx="10"/>
    <rect x="172" y="168" width="24" height="62" rx="10"/>
    <rect x="252" y="168" width="26" height="62" rx="10"/>
    <rect x="286" y="168" width="24" height="62" rx="10"/>
  </g>
  <path d="M300 118 Q 330 92 342 68" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M112 93 L112 177" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M255 93 L255 177" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M78 82 A30 30 0 0 0 48 112" stroke="#c0392b" stroke-width="0" fill="#c0392b" opacity="0.16"/>
  <circle cx="78" cy="112" r="30" fill="#c0392b" opacity="0.14"/>
  <ellipse cx="200" cy="112" rx="80" ry="14" fill="#1f6f8b" opacity="0.20"/>
  <ellipse cx="200" cy="158" rx="66" ry="13" fill="#c0392b" opacity="0.14"/>
  <rect x="138" y="168" width="58" height="62" rx="10" fill="#c0392b" opacity="0.12"/>
  <rect x="252" y="168" width="58" height="62" rx="10" fill="#1f6f8b" opacity="0.16"/>
  <path d="M300 118 Q 330 92 342 68" stroke="#1f6f8b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.35"/>
  <g fill="#333" font-size="15">
    <text x="45" y="45">头部（头圆）</text>
    <line x1="78" y1="72" x2="78" y2="58" stroke="#c0392b" stroke-width="1.2"/>
    <text x="140" y="42">颈部</text>
    <line x1="115" y1="58" x2="120" y2="70" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="200" y="34" text-anchor="middle">背部（背线）</text>
    <line x1="200" y1="50" x2="200" y2="88" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="330" y="42">尾部</text>
    <line x1="322" y1="60" x2="316" y2="78" stroke="#1f6f8b" stroke-width="1.2"/>
    <text x="200" y="268" text-anchor="middle">腹部（底线）</text>
    <line x1="200" y1="238" x2="200" y2="178" stroke="#c0392b" stroke-width="1.2"/>
    <text x="122" y="302">前肢</text>
    <line x1="158" y1="270" x2="160" y2="235" stroke="#c0392b" stroke-width="1.2"/>
    <text x="278" y="302">后肢</text>
    <line x1="278" y1="270" x2="272" y2="235" stroke="#1f6f8b" stroke-width="1.2"/>
  </g>
  <g fill="#1f6f8b" font-size="13">
    <text x="120" y="196">颈肩交界线</text>
    <text x="262" y="196">腰臀交界线</text>
  </g>
</svg>
