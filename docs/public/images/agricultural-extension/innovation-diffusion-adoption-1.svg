<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <title>农业创新的扩散 S 曲线与采用者分类</title>
  <desc>横轴为时间，纵轴为累计采用率；S 形扩散曲线被四条虚线划分为创新者、早期采用者、早期多数、后期多数、落后者五类采用者。</desc>
  <rect x="0" y="0" width="640" height="380" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="70" y1="320" x2="600" y2="320"/>
    <line x1="70" y1="70" x2="70" y2="320"/>
  </g>
  <g fill="#333" font-size="13">
    <text x="300" y="352" text-anchor="middle">时间</text>
    <text x="34" y="200" text-anchor="middle" transform="rotate(-90 34 200)">累计采用率（%）</text>
    <text x="72" y="336" text-anchor="end">0</text>
    <text x="72" y="86" text-anchor="end">100</text>
  </g>
  <path d="M 60,319 C 140,316 165,296 210,282 C 255,268 272,228 300,200 C 328,172 345,132 390,118 C 435,104 460,90 500,86 C 530,84 560,82 580,81"
        fill="none" stroke="#1f6f8b" stroke-width="3.5"/>
  <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 5">
    <line x1="120" y1="320" x2="120" y2="80"/>
    <line x1="210" y1="320" x2="210" y2="80"/>
    <line x1="300" y1="320" x2="300" y2="80"/>
    <line x1="390" y1="320" x2="390" y2="80"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="90" y="344" fill="#333">创新者</text>
    <text x="165" y="344" fill="#333">早期采用者</text>
    <text x="255" y="344" fill="#333">早期多数</text>
    <text x="345" y="344" fill="#333">后期多数</text>
    <text x="470" y="344" fill="#333">落后者</text>
    <text x="90" y="362" fill="#666">2.5%</text>
    <text x="165" y="362" fill="#666">13.5%</text>
    <text x="255" y="362" fill="#666">34%</text>
    <text x="345" y="362" fill="#666">34%</text>
    <text x="470" y="362" fill="#666">16%</text>
  </g>
  <text x="90" y="115" fill="#c0392b" font-size="13">创新者</text>
  <text x="150" y="150" fill="#1f6f8b" font-size="13">早期多数</text>
  <text x="470" y="170" fill="#1f6f8b" font-size="13">后期多数</text>
  <text x="500" y="120" fill="#666" font-size="13">落后者</text>
</svg>
