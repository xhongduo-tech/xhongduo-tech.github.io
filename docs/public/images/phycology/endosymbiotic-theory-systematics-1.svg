<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" font-family="sans-serif">
  <title>藻类叶绿体的内共生起源示意</title>
  <desc>异养真核祖先吞入蓝藻发生初级内共生，产生灰胞藻、红藻、绿藻；绿藻与红藻又被其他真核吞入，发生次级内共生，产生裸藻及硅藻、褐藻、金藻等类群。</desc>
  <rect x="0" y="0" width="780" height="640" fill="#faf9f5"/>
  <text x="390" y="40" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">藻类叶绿体的内共生起源（示意）</text>

  <rect x="40" y="80" width="220" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" fill="#333">异养真核祖先</text>
  <text x="150" y="132" text-anchor="middle" font-size="13" fill="#1f6f8b">（吞食性，无叶绿体）</text>

  <rect x="500" y="80" width="220" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="610" y="110" text-anchor="middle" font-size="14" fill="#333">蓝藻（光合细菌）</text>
  <text x="610" y="132" text-anchor="middle" font-size="13" fill="#1f6f8b">叶绿素 a + 藻胆蛋白</text>

  <path d="M 260 120 H 500" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="380" y="108" text-anchor="middle" font-size="13" fill="#c0392b">初级内共生 · 2 层膜</text>

  <rect x="40" y="220" width="680" height="90" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="380" y="248" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">原始色素体生物 Archaeplastida</text>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#333">叶绿体由蓝藻直接改造而来，保留双层被膜</text>
  <text x="380" y="292" text-anchor="middle" font-size="13" fill="#333">灰胞藻（蓝小体带肽聚糖）｜红藻｜绿藻（含轮藻 → 高等植物）</text>
  <path d="M 610 160 V 220" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="640" y="192" text-anchor="middle" font-size="12" fill="#c0392b">成为叶绿体</text>

  <text x="380" y="345" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">次级内共生：叶绿体再次被吞</text>

  <rect x="40" y="365" width="300" height="80" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="190" y="392" text-anchor="middle" font-size="14" fill="#333">吞入红藻</text>
  <text x="190" y="412" text-anchor="middle" font-size="13" fill="#1f6f8b">叶绿体 4 层膜</text>
  <text x="190" y="430" text-anchor="middle" font-size="13" fill="#666">（红藻被膜 + 宿主内吞膜）</text>

  <rect x="440" y="365" width="300" height="80" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="590" y="392" text-anchor="middle" font-size="14" fill="#333">吞入绿藻</text>
  <text x="590" y="412" text-anchor="middle" font-size="13" fill="#1f6f8b">叶绿体 3 层膜</text>
  <text x="590" y="430" text-anchor="middle" font-size="13" fill="#666">（绿藻被膜 + 宿主内吞膜）</text>

  <path d="M 190 310 L 190 365" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowB)"/>
  <text x="205" y="345" font-size="12" fill="#1f6f8b">红藻被吞</text>
  <path d="M 590 310 L 590 365" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowB)"/>
  <text x="605" y="345" font-size="12" fill="#1f6f8b">绿藻被吞</text>

  <rect x="40" y="500" width="300" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="190" y="528" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">不等鞭毛类等（Stramenopiles）</text>
  <text x="190" y="550" text-anchor="middle" font-size="13" fill="#333">硅藻 · 褐藻 · 金藻 · 黄藻</text>
  <text x="190" y="570" text-anchor="middle" font-size="13" fill="#333">定鞭藻（球石藻）· 部分甲藻</text>
  <text x="190" y="590" text-anchor="middle" font-size="13" fill="#1f6f8b">色素：叶绿素 a+c + 岩藻黄素</text>
  <path d="M 190 445 V 500" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <rect x="440" y="500" width="300" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="590" y="528" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">裸藻门（Euglenoids）</text>
  <text x="590" y="550" text-anchor="middle" font-size="13" fill="#333">眼虫（Euglena）等</text>
  <text x="590" y="570" text-anchor="middle" font-size="13" fill="#333">3 层膜叶绿体 + 裸藻淀粉</text>
  <text x="590" y="590" text-anchor="middle" font-size="13" fill="#1f6f8b">色素：叶绿素 a+b</text>
  <path d="M 590 445 V 500" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
</svg>
