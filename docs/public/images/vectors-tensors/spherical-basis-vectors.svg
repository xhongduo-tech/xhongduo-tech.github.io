<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" role="img" aria-labelledby="title desc">
  <title id="title">球坐标系中一点处的单位基向量 e_r、e_θ、e_φ</title>
  <desc id="desc">原点 O 出发的径向虚线 r，过 P 的垂直辅助虚线，以及 P 点处互相垂直的三个单位向量 e_r（沿 r 增大方向，红）、e_θ（沿 θ 增大方向，青）、e_φ（沿 φ 增大方向，墨）。</desc>
  <rect x="0" y="0" width="540" height="460" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="260" y1="360" x2="470" y2="360" stroke="#333" stroke-width="1.6"/>
  <polygon points="470,360 462,355 462,365" fill="#333"/>
  <text x="476" y="356" font-family="sans-serif" font-size="15" fill="#333">x</text>
  <line x1="260" y1="360" x2="90" y2="300" stroke="#333" stroke-width="1.6"/>
  <polygon points="90,300 101,306 94,294" fill="#333"/>
  <text x="76" y="300" font-family="sans-serif" font-size="15" fill="#333">y</text>
  <line x1="260" y1="360" x2="260" y2="70" stroke="#333" stroke-width="1.6"/>
  <polygon points="260,70 255,82 265,82" fill="#333"/>
  <text x="252" y="56" font-family="sans-serif" font-size="15" fill="#333">z</text>
  <text x="246" y="372" font-family="sans-serif" font-size="15" fill="#333">O</text>
  <!-- θ 参考：z 轴上的虚线辅助线 -->
  <line x1="260" y1="360" x2="260" y2="300" stroke="#1f6f8b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- 径向虚线 r -->
  <line x1="260" y1="360" x2="316" y2="219" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="278" y="296" font-family="sans-serif" font-size="15" fill="#1f6f8b">r</text>
  <!-- 到水平面的投影虚线 -->
  <line x1="316" y1="219" x2="316" y2="339" stroke="#333" stroke-width="1.1" stroke-dasharray="3,4"/>
  <line x1="260" y1="360" x2="316" y2="339" stroke="#333" stroke-width="1.1" stroke-dasharray="3,4"/>
  <!-- θ 角弧 -->
  <path d="M 260 315 A 45 45 0 0 0 276.6 318.6" fill="none" stroke="#1f6f8b" stroke-width="1.4"/>
  <text x="240" y="320" font-family="sans-serif" font-size="15" fill="#1f6f8b">θ</text>
  <!-- φ 角弧 -->
  <path d="M 300 360 A 40 40 0 0 0 297.4 346" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="306" y="352" font-family="sans-serif" font-size="15" fill="#333">φ</text>
  <!-- 点 P -->
  <circle cx="316" cy="219" r="4" fill="#c0392b"/>
  <text x="322" y="214" font-family="sans-serif" font-size="15" fill="#333">P</text>
  <!-- 基向量 e_r -->
  <line x1="316" y1="219" x2="342" y2="155" stroke="#c0392b" stroke-width="2.2"/>
  <polygon points="342,155 331,159 340,165" fill="#c0392b"/>
  <text x="344" y="148" font-family="sans-serif" font-size="16" fill="#c0392b">e_r</text>
  <!-- 基向量 e_θ -->
  <line x1="316" y1="219" x2="336" y2="254" stroke="#1f6f8b" stroke-width="2.2"/>
  <polygon points="336,254 325,251 333,245" fill="#1f6f8b"/>
  <text x="338" y="264" font-family="sans-serif" font-size="16" fill="#1f6f8b">e_θ</text>
  <!-- 基向量 e_φ -->
  <line x1="316" y1="219" x2="250" y2="202" stroke="#333" stroke-width="2.2"/>
  <polygon points="250,202 259,197 262,207" fill="#333"/>
  <text x="236" y="200" font-family="sans-serif" font-size="16" fill="#333">e_φ</text>
  <!-- 图例 -->
  <text x="30" y="420" font-family="sans-serif" font-size="14" fill="#333">红：e_r（r 增大方向）　青：e_θ（θ 增大方向）　墨：e_φ（φ 增大方向）</text>
  <text x="30" y="442" font-family="sans-serif" font-size="14" fill="#333">三点处三个基向量互相垂直，组成球坐标的正交归一基。</text>
</svg>
