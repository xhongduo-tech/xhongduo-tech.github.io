<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
<title>索绪尔的符号：能指与所指</title>
<desc>符号由能指（音响形象/字形）与所指（概念）结合而成，二者之间的联结是任意的、约定俗成的。</desc>
<rect x="0" y="0" width="640" height="260" fill="#faf9f5"/>
<text x="40" y="32" font-size="16" font-weight="bold" fill="#333">索绪尔的符号：能指 + 所指</text>
<!-- signifier -->
<ellipse cx="180" cy="120" rx="130" ry="75" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="180" y="100" font-size="16" font-weight="bold" fill="#1f6f8b" text-anchor="middle">能指</text>
<text x="180" y="120" font-size="12" fill="#555" text-anchor="middle">signifier</text>
<text x="180" y="142" font-size="13" fill="#333" text-anchor="middle">音响形象 / 字形</text>
<text x="180" y="160" font-size="13" fill="#555" text-anchor="middle">例：读音「gǒu」、字形「狗」</text>
<!-- bar + arrows -->
<line x1="320" y1="72" x2="320" y2="168" stroke="#333" stroke-width="2"/>
<text x="320" y="90" font-size="20" fill="#333" text-anchor="middle">→</text>
<text x="320" y="158" font-size="20" fill="#333" text-anchor="middle">←</text>
<text x="320" y="202" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">任意性</text>
<!-- signified -->
<ellipse cx="460" cy="120" rx="130" ry="75" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="460" y="100" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">所指</text>
<text x="460" y="120" font-size="12" fill="#555" text-anchor="middle">signified</text>
<text x="460" y="142" font-size="13" fill="#333" text-anchor="middle">概念</text>
<text x="460" y="160" font-size="13" fill="#555" text-anchor="middle">例：犬科动物的概念</text>
<text x="40" y="240" font-size="14" fill="#555">能指与所指的结合构成符号；二者的联结是任意的、约定俗成的，靠社会契约维持。</text>
</svg>
