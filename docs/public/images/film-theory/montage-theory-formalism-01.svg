<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<title>蒙太奇公式：并置产生新意义</title>
<desc>两个镜头 A 与 B 并置后产生不属于任何一者的新意义 C，即「1 + 1 &gt; 2」。</desc>
<rect x="0" y="0" width="640" height="250" fill="#faf9f5"/>
<text x="40" y="34" font-size="16" font-weight="bold" fill="#333">蒙太奇公式：并置产生新意义</text>
<!-- shot A -->
<rect x="40" y="56" width="160" height="112" rx="10" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<circle cx="120" cy="84" r="11" fill="#1f6f8b" opacity="0.55"/>
<text x="120" y="112" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">镜头 A</text>
<text x="120" y="132" font-size="13" fill="#555" text-anchor="middle">一把手枪</text>
<text x="120" y="152" font-size="13" fill="#555" text-anchor="middle">（静态特写）</text>
<text x="228" y="116" font-size="30" fill="#333" text-anchor="middle">＋</text>
<!-- shot B -->
<rect x="250" y="56" width="160" height="112" rx="10" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<circle cx="330" cy="84" r="11" fill="#c0392b" opacity="0.55"/>
<text x="330" y="112" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">镜头 B</text>
<text x="330" y="132" font-size="13" fill="#555" text-anchor="middle">面无表情的脸</text>
<text x="330" y="152" font-size="13" fill="#555" text-anchor="middle">（中性特写）</text>
<text x="440" y="116" font-size="30" fill="#333" text-anchor="middle">→</text>
<!-- result C -->
<rect x="470" y="56" width="150" height="112" rx="10" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="545" y="88" font-size="22" fill="#c0392b" text-anchor="middle">★</text>
<text x="545" y="112" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">新意义 C</text>
<text x="545" y="132" font-size="13" fill="#555" text-anchor="middle">威胁</text>
<text x="545" y="152" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1 + 1 &gt; 2</text>
<text x="40" y="210" font-size="14" fill="#555">C 不是 A 与 B 之和，而是两者并置产生的第三种东西——意义诞生于剪辑，而非镜头本身。</text>
</svg>
