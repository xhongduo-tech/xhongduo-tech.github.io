<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
<title>故事与情节：fabula 与 syuzhet</title>
<desc>同一组事件在「故事」（按因果与时间排列）与「情节」（银幕实际呈现顺序）中的两种排列方式。</desc>
<rect x="0" y="0" width="640" height="300" fill="#faf9f5"/>
<text x="40" y="30" font-size="16" font-weight="bold" fill="#333">故事 fabula：按因果与时间排列的事件</text>
<!-- top row: fabula E1..E5 -->
<rect x="40" y="48" width="100" height="52" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="90" y="70" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">E1</text>
<text x="90" y="88" font-size="13" fill="#333" text-anchor="middle">争吵</text>
<rect x="155" y="48" width="100" height="52" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="205" y="70" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">E2</text>
<text x="205" y="88" font-size="13" fill="#333" text-anchor="middle">枪响</text>
<rect x="270" y="48" width="100" height="52" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="320" y="70" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">E3</text>
<text x="320" y="88" font-size="13" fill="#333" text-anchor="middle">倒下</text>
<rect x="385" y="48" width="100" height="52" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="435" y="70" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">E4</text>
<text x="435" y="88" font-size="13" fill="#333" text-anchor="middle">逃亡</text>
<rect x="500" y="48" width="100" height="52" rx="8" fill="#1f6f8b" opacity="0.12" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="550" y="70" font-size="14" font-weight="bold" fill="#1f6f8b" text-anchor="middle">E5</text>
<text x="550" y="88" font-size="13" fill="#333" text-anchor="middle">被捕</text>
<text x="145" y="78" font-size="18" fill="#1f6f8b" text-anchor="middle">→</text>
<text x="260" y="78" font-size="18" fill="#1f6f8b" text-anchor="middle">→</text>
<text x="375" y="78" font-size="18" fill="#1f6f8b" text-anchor="middle">→</text>
<text x="490" y="78" font-size="18" fill="#1f6f8b" text-anchor="middle">→</text>
<!-- dashed connectors: fabula event -> its position in syuzhet -->
<line x1="90" y1="100" x2="320" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
<line x1="205" y1="100" x2="550" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
<line x1="320" y1="100" x2="90" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
<line x1="435" y1="100" x2="435" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
<line x1="550" y1="100" x2="205" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
<text x="40" y="130" font-size="16" font-weight="bold" fill="#333">情节 syuzhet：银幕实际呈现的顺序</text>
<!-- bottom row: syuzhet E3 E5 E1 E4 E2 -->
<rect x="40" y="150" width="100" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="90" y="172" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E3</text>
<text x="90" y="190" font-size="13" fill="#333" text-anchor="middle">倒下</text>
<rect x="155" y="150" width="100" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="205" y="172" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E5</text>
<text x="205" y="190" font-size="13" fill="#333" text-anchor="middle">被捕</text>
<rect x="270" y="150" width="100" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="320" y="172" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E1</text>
<text x="320" y="190" font-size="13" fill="#333" text-anchor="middle">争吵</text>
<rect x="385" y="150" width="100" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="435" y="172" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E4</text>
<text x="435" y="190" font-size="13" fill="#333" text-anchor="middle">逃亡</text>
<rect x="500" y="150" width="100" height="52" rx="8" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
<text x="550" y="172" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E2</text>
<text x="550" y="190" font-size="13" fill="#333" text-anchor="middle">枪响</text>
<text x="145" y="180" font-size="18" fill="#c0392b" text-anchor="middle">→</text>
<text x="260" y="180" font-size="18" fill="#c0392b" text-anchor="middle">→</text>
<text x="375" y="180" font-size="18" fill="#c0392b" text-anchor="middle">→</text>
<text x="490" y="180" font-size="18" fill="#c0392b" text-anchor="middle">→</text>
<text x="40" y="244" font-size="14" fill="#555">观众在线性观看中，依据图式把情节重建为故事——这是叙事认知的关键。</text>
</svg>
