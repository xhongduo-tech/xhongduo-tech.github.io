<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <title>Kripke 可能世界框架示意</title>
  <desc>三个可能世界 w1、w2、w3，箭头表示可达关系 R：w1 可达 w2 与 w3，w2 与 w3 各自自反。每个世界标注命题 p 的真值，以及必然算子 □ 与可能算子 ◇ 在该世界的真值。</desc>
  <rect width="640" height="420" fill="#faf9f5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>

  <!-- accessibility arrows -->
  <line x1="198" y1="190" x2="382" y2="148" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="198" y1="230" x2="382" y2="292" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 112 Q505 130 472 150" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 312 Q505 330 472 350" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- worlds -->
  <circle cx="150" cy="210" r="48" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="430" cy="130" r="48" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="430" cy="310" r="48" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- world labels -->
  <text x="150" y="200" text-anchor="middle" font-size="17" fill="#333">w₁</text>
  <text x="150" y="224" text-anchor="middle" font-size="15" fill="#1f6f8b">p：真</text>
  <text x="430" y="120" text-anchor="middle" font-size="17" fill="#333">w₂</text>
  <text x="430" y="144" text-anchor="middle" font-size="15" fill="#1f6f8b">p：真</text>
  <text x="430" y="300" text-anchor="middle" font-size="17" fill="#333">w₃</text>
  <text x="430" y="324" text-anchor="middle" font-size="15" fill="#c0392b">p：假</text>

  <!-- modal annotations -->
  <text x="150" y="280" text-anchor="middle" font-size="15" fill="#333">□p 真　◇p 真</text>
  <text x="430" y="198" text-anchor="middle" font-size="15" fill="#333">□p 真　◇p 真</text>
  <text x="430" y="378" text-anchor="middle" font-size="15" fill="#333">□p 假　◇p 假</text>

  <!-- caption -->
  <text x="40" y="404" font-size="16" fill="#333">□φ 在 w 为真 ⇔ φ 在所有 w 可达的世界为真</text>
</svg>
