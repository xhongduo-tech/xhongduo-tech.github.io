<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="sans-serif">
  <title>哲学本体论与知识表示工程：双线关系示意</title>
  <desc>上方为哲学线（存在之问 → 存在论范畴 → 本体论承诺），下方为知识表示线（概念化 → 本体工程 → 语义网/知识图谱），三条虚线将两线的术语一一对应，两线最终汇合于「显式 · 共享 · 可计算的概念化」。</desc>

  <rect x="0" y="0" width="860" height="620" fill="#faf9f5"/>

  <text x="430" y="46" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">哲学本体论与知识表示工程：双线关系示意</text>
  <text x="430" y="74" text-anchor="middle" font-size="14" fill="#666">哲学追问「何物存在」，工程规定「承诺何物存在」——两条线如何相遇</text>

  <!-- 哲学线 -->
  <text x="40" y="104" font-size="16" font-weight="bold" fill="#c0392b">哲学线 · 形而上学传统</text>

  <rect x="30" y="118" width="220" height="130" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="140" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">存在之问</text>
  <text x="140" y="186" text-anchor="middle" font-size="15" fill="#666">being qua being</text>
  <text x="140" y="218" text-anchor="middle" font-size="15" fill="#333">追问：何物存在？</text>

  <rect x="320" y="118" width="220" height="130" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">存在论范畴</text>
  <text x="430" y="186" text-anchor="middle" font-size="15" fill="#666">十范畴 · 属种结构</text>
  <text x="430" y="218" text-anchor="middle" font-size="15" fill="#333">实体 · 属性 · 关系</text>

  <rect x="610" y="118" width="220" height="130" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="720" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">本体论承诺</text>
  <text x="720" y="186" text-anchor="middle" font-size="15" fill="#666">承认何物为真</text>
  <text x="720" y="218" text-anchor="middle" font-size="14" fill="#333">存在即约束变元之值</text>

  <!-- 知识表示线 -->
  <text x="40" y="312" font-size="16" font-weight="bold" fill="#1f6f8b">知识表示线 · 知识表示工程</text>

  <rect x="30" y="326" width="220" height="130" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="140" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">概念化</text>
  <text x="140" y="394" text-anchor="middle" font-size="15" fill="#666">conceptualization</text>
  <text x="140" y="426" text-anchor="middle" font-size="15" fill="#333">世界的内在模型</text>

  <rect x="320" y="326" width="220" height="130" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="430" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">本体工程</text>
  <text x="430" y="394" text-anchor="middle" font-size="15" fill="#666">类 · 个体 · 关系 · 公理</text>
  <text x="430" y="426" text-anchor="middle" font-size="15" fill="#333">OWL / RDF 形式化</text>

  <rect x="610" y="326" width="220" height="130" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="720" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">语义网 · 知识图谱</text>
  <text x="720" y="394" text-anchor="middle" font-size="15" fill="#666">共享显式规范</text>
  <text x="720" y="426" text-anchor="middle" font-size="15" fill="#333">机器可解释的数据</text>

  <!-- 上下对应的虚线 -->
  <line x1="140" y1="248" x2="140" y2="326" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="430" y1="248" x2="430" y2="326" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="720" y1="248" x2="720" y2="326" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="152" y="288" font-size="13" fill="#333">问题同源</text>
  <text x="442" y="288" font-size="13" fill="#333">术语对应</text>
  <text x="732" y="288" font-size="13" fill="#333">从承诺到标注</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 三条线汇入椭圆 -->
  <path d="M 140 456 Q 140 500 260 520" fill="none" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="456" x2="430" y2="490" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 456 Q 720 500 600 520" fill="none" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 汇合点 -->
  <ellipse cx="430" cy="536" rx="270" ry="46" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="532" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">双线汇合：显式 · 共享 · 可计算的概念化</text>
  <text x="430" y="560" text-anchor="middle" font-size="14" fill="#666">哲学提供「何物存在」的追问，工程提供「如何表达」的方案</text>
</svg>
