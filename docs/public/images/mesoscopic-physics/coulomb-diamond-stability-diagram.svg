<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>单电子晶体管的库仑菱形稳定图</title>
  <desc>以门电压 Vg 为横轴、源漏偏压 Vsd 为纵轴，导电区域呈菱形结构，菱形交点对应不同电子数 N。</desc>
  <rect x="0" y="0" width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">单电子晶体管的库仑菱形稳定图</text>
  <line x1="80" y1="330" x2="600" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="330" y1="330" x2="330" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="375" text-anchor="middle" font-size="13" fill="#333">门电压 V_g →</text>
  <text x="40" y="180" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 40 180)">源漏偏压 V_sd →</text>
  <g fill="#c0392b" opacity="0.18">
    <polygon points="200,330 330,180 460,330"/>
    <polygon points="330,180 460,330 590,330 460,180"/>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="200" y1="330" x2="330" y2="180"/>
    <line x1="330" y1="180" x2="460" y2="330"/>
    <line x1="330" y1="180" x2="330" y2="60"/>
    <line x1="460" y1="330" x2="590" y2="330"/>
  </g>
  <text x="330" y="285" text-anchor="middle" font-size="13" fill="#333">N = 1（阻塞区）</text>
  <text x="470" y="310" text-anchor="middle" font-size="13" fill="#333">N = 2</text>
  <text x="330" y="110" text-anchor="middle" font-size="13" fill="#1f6f8b">偏压过大 → 隧穿开启（激发态）</text>
  <line x1="150" y1="300" x2="200" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="155" y="295" font-size="12" fill="#666">−e/2C</text>
  <line x1="460" y1="300" x2="510" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="465" y="295" font-size="12" fill="#666">+e/2C</text>
  <text x="360" y="345" font-size="13" fill="#333">菱形的高度 = 2E_C / e，菱形的宽度由门电容 C_g 决定</text>
</svg>
