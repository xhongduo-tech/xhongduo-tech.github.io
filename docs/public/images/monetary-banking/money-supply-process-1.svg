<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="sans-serif">
  <title>存款创造链条</title>
  <desc>央行注入 1000 美元基础货币后，银行体系按 10% 法定准备金率逐级放贷，存款按等比级数收敛到 10000 美元。</desc>
  <rect width="920" height="460" fill="#faf9f5"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">存款创造链条：$1000 基础货币如何变成 $10000 存款</text>
  <text x="460" y="60" text-anchor="middle" font-size="14" fill="#c0392b">法定准备金率 r = 10%；简化：公众不持现、银行不留超额准备金</text>

  <!-- 央行 box -->
  <rect x="20" y="96" width="175" height="132" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="107" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">央行</text>
  <text x="107" y="148" text-anchor="middle" font-size="13" fill="#333">公开市场购买国债</text>
  <text x="107" y="170" text-anchor="middle" font-size="13" fill="#333">注入基础货币</text>
  <text x="107" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+$1000 准备金</text>
  <text x="107" y="214" text-anchor="middle" font-size="13" fill="#666">货币基础 MB↑</text>

  <!-- 箭头 -->
  <path d="M 199 162 L 250 162" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker></defs>

  <!-- 银行 A -->
  <rect x="255" y="96" width="175" height="132" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="342" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">银行 A</text>
  <text x="342" y="148" text-anchor="middle" font-size="13" fill="#333">新存款</text>
  <text x="342" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">$1000</text>
  <text x="342" y="192" text-anchor="middle" font-size="13" fill="#666">留准备金 $100</text>
  <text x="342" y="212" text-anchor="middle" font-size="13" fill="#666">放贷 $900</text>

  <path d="M 434 162 L 485 162" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 银行 B -->
  <rect x="490" y="96" width="175" height="132" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="577" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">银行 B</text>
  <text x="577" y="148" text-anchor="middle" font-size="13" fill="#333">新存款</text>
  <text x="577" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">$900</text>
  <text x="577" y="192" text-anchor="middle" font-size="13" fill="#666">留准备金 $90</text>
  <text x="577" y="212" text-anchor="middle" font-size="13" fill="#666">放贷 $810</text>

  <path d="M 669 162 L 720 162" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 银行 C -->
  <rect x="725" y="96" width="175" height="132" rx="8" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="812" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">银行 C</text>
  <text x="812" y="148" text-anchor="middle" font-size="13" fill="#333">新存款</text>
  <text x="812" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">$810</text>
  <text x="812" y="192" text-anchor="middle" font-size="13" fill="#666">留准备金 $81</text>
  <text x="812" y="212" text-anchor="middle" font-size="13" fill="#666">放贷 $729 ⋯</text>

  <!-- 等比级数求和 -->
  <line x1="60" y1="262" x2="860" y2="262" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">总存款 = $1000 + $900 + $810 + $729 + ⋯</text>
  <text x="460" y="326" text-anchor="middle" font-size="16" fill="#333">= $1000 × (1 + 0.9 + 0.9² + 0.9³ + ⋯) = $1000 × 1 / (1 − 0.9)</text>
  <text x="460" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">= $10000 = $1000 × (1 / r)</text>

  <text x="460" y="398" text-anchor="middle" font-size="14" fill="#1f6f8b">货币乘数 m = 1 / r = 10（仅含法定准备金；c 与 e 存在时乘数更小）</text>
</svg>
