<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="sans-serif">
  <title>AD-AS 分析：扩张性货币政策</title>
  <desc>扩张性货币政策使 AD 曲线右移，短期均衡沿短期总供给曲线移动到产出高于潜在水平、物价上升的 E2；预期调整后短期总供给曲线左移，长期均衡回到潜在产出、物价更高的 E3。</desc>
  <rect width="900" height="540" fill="#faf9f5"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">扩张性货币政策的 AD-AS 分析</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#333">短期：产出高于潜在、物价上升（E₂）；长期：预期调整、产出回到 Y*、物价更高（E₃）</text>

  <!-- 坐标轴 -->
  <line x1="160" y1="430" x2="850" y2="430" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="90" x2="160" y2="440" stroke="#333" stroke-width="2"/>
  <text x="500" y="470" text-anchor="middle" font-size="15" fill="#333">总产出 Y</text>
  <text x="116" y="260" text-anchor="middle" font-size="15" fill="#333">价格水平 P</text>

  <!-- LRAS -->
  <line x1="506" y1="96" x2="506" y2="430" stroke="#666" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="516" y="112" font-size="14" font-weight="bold" fill="#666">LRAS</text>

  <!-- SRAS1 -->
  <line x1="203" y1="409" x2="797" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <text x="806" y="148" font-size="14" font-weight="bold" fill="#c0392b">SRAS₁</text>

  <!-- AD1 -->
  <line x1="203" y1="142" x2="797" y2="409" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="780" y="422" font-size="14" font-weight="bold" fill="#1f6f8b">AD₁</text>

  <!-- AD2 (宽松政策右移) -->
  <line x1="203" y1="95" x2="797" y2="363" stroke="#1f6f8b" stroke-width="2.5" stroke-dasharray="2 0"/>
  <text x="700" y="352" font-size="14" font-weight="bold" fill="#1f6f8b">AD₂</text>

  <!-- SRAS2 (预期调整后左移) -->
  <line x1="203" y1="362" x2="797" y2="105" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 0"/>
  <text x="788" y="100" font-size="14" font-weight="bold" fill="#c0392b">SRAS₂</text>

  <!-- 均衡点与虚线 -->
  <line x1="558" y1="255" x2="558" y2="430" stroke="#333" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="160" y1="255" x2="558" y2="255" stroke="#333" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="160" y1="231" x2="506" y2="231" stroke="#333" stroke-width="1.2" stroke-dasharray="4 4"/>

  <circle cx="506" cy="279" r="5" fill="#333"/>
  <circle cx="558" cy="255" r="5" fill="#333"/>
  <circle cx="506" cy="231" r="5" fill="#333"/>

  <text x="492" y="268" font-size="14" font-weight="bold" fill="#333">E₁</text>
  <text x="566" y="244" font-size="14" font-weight="bold" fill="#333">E₂</text>
  <text x="492" y="222" font-size="14" font-weight="bold" fill="#333">E₃</text>

  <text x="496" y="452" font-size="14" fill="#333">Y*</text>
  <text x="548" y="452" font-size="14" fill="#333">Y₂</text>
  <text x="138" y="283" font-size="13" fill="#333">P₁</text>
  <text x="138" y="259" font-size="13" fill="#333">P₂</text>
  <text x="138" y="235" font-size="13" fill="#333">P₃</text>

  <!-- 箭头：AD 右移 -->
  <text x="380" y="120" font-size="14" fill="#1f6f8b">宽松政策：AD 右移</text>
  <text x="610" y="120" font-size="14" fill="#c0392b">预期上调：SRAS 左移</text>

  <text x="450" y="512" text-anchor="middle" font-size="14" fill="#333">短期：沿 SRAS₁ 到 E₂（产出 > Y*）→ 长期：SRAS 左移回 E₃（产出 = Y*，物价更高）</text>
  <text x="450" y="532" text-anchor="middle" font-size="13" fill="#666">长期货币中性：货币政策只改变物价水平，不改变实际产出</text>
</svg>
