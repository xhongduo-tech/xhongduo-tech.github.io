<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <title>采空区上覆岩层三带示意</title>
  <desc>展示长壁采空区上方垮落带、裂隙带、弯曲下沉带与地表沉陷盆地的位置关系，以及工作面与支架的示意。</desc>
  <rect x="0" y="0" width="640" height="480" fill="#faf9f5"/>
  <rect x="0" y="0" width="640" height="480" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 地表 -->
  <rect x="0" y="30" width="640" height="26" fill="#c8d6b0" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="48" font-family="sans-serif" font-size="14" fill="#333">地表</text>

  <!-- 弯曲下沉带 -->
  <path d="M 0 56 Q 180 150 320 150 Q 460 150 640 56 L 640 220 L 0 220 Z" fill="#dce7ee" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="120" font-family="sans-serif" font-size="15" fill="#1f6f8b">弯曲下沉带</text>

  <!-- 沉陷盆地 -->
  <path d="M 150 56 Q 240 96 320 98 Q 400 96 490 56" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="78" font-family="sans-serif" font-size="13" fill="#c0392b">地表沉陷盆地</text>

  <!-- 裂隙带 -->
  <path d="M 0 220 L 640 220 L 640 316 L 0 316 Z" fill="#f0e6d2" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="220" x2="150" y2="316" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="220" x2="300" y2="316" stroke="#333" stroke-width="1"/>
  <line x1="360" y1="220" x2="340" y2="316" stroke="#333" stroke-width="1"/>
  <line x1="460" y1="220" x2="490" y2="316" stroke="#333" stroke-width="1"/>
  <text x="272" y="276" font-family="sans-serif" font-size="15" fill="#1f6f8b">裂隙带</text>

  <!-- 垮落带 -->
  <path d="M 120 316 L 520 316 L 520 388 L 120 388 Z" fill="#e8d5c4" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="316" x2="180" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="240" y1="316" x2="220" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="300" y1="316" x2="320" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="380" y1="316" x2="360" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="440" y1="316" x2="460" y2="388" stroke="#333" stroke-width="1"/>
  <text x="260" y="360" font-family="sans-serif" font-size="15" fill="#1f6f8b">垮落带（冒落带）</text>

  <!-- 采空区 -->
  <rect x="120" y="388" width="400" height="52" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="270" y="418" font-family="sans-serif" font-size="15" fill="#333">采空区</text>

  <!-- 工作面煤体与支架 -->
  <rect x="520" y="388" width="70" height="52" fill="#9aa5a0" stroke="#333" stroke-width="1.5"/>
  <text x="528" y="428" font-family="sans-serif" font-size="13" fill="#fff">未采煤体</text>

  <!-- 支架 -->
  <rect x="495" y="420" width="25" height="20" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <text x="455" y="452" font-family="sans-serif" font-size="13" fill="#333">液压支架</text>

  <!-- 底板 -->
  <rect x="120" y="440" width="472" height="30" fill="#b0b8b4" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="458" font-family="sans-serif" font-size="14" fill="#333">底板</text>

  <!-- 三带高度标注 -->
  <line x1="548" y1="316" x2="578" y2="316" stroke="#333" stroke-width="1"/>
  <line x1="548" y1="220" x2="578" y2="220" stroke="#333" stroke-width="1"/>
  <text x="560" y="272" font-family="sans-serif" font-size="13" fill="#333">裂隙带高</text>
</svg>
