<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">模拟信号与数字信号对比</title>
  <desc id="desc">上方为连续变化的模拟信号曲线（正弦波），任意时刻都有确定的电压值；下方为只在高低两种电平之间跳变的数字方波，高电平对应逻辑 1，低电平对应逻辑 0。数字电路只处理两种电平，这是用电路表达二进制的物理基础。</desc>

  <rect x="0" y="0" width="720" height="470" fill="#faf9f5"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" fill="#333">模拟信号与数字信号</text>

  <!-- 模拟信号面板 -->
  <text x="360" y="68" text-anchor="middle" font-size="15" fill="#1f6f8b">模拟信号 —— 时间与数值都连续</text>
  <text x="360" y="94" text-anchor="middle" font-size="13" fill="#666">连续：每个时刻都有确定的电压值</text>

  <polyline points="M80.0,150.0 L92.0,137.2 L104.0,125.4 L116.0,115.3 L128.0,107.7 L140.0,103.2 L152.0,102.0 L164.0,104.3 L176.0,109.9 L188.0,118.4 L200.0,129.2 L212.0,141.4 L224.0,154.3 L236.0,166.9 L248.0,178.2 L260.0,187.5 L272.0,194.1 L284.0,197.6 L296.0,197.6 L308.0,194.1 L320.0,187.5 L332.0,178.2 L344.0,166.9 L356.0,154.3 L368.0,141.4 L380.0,129.2 L392.0,118.4 L404.0,109.9 L416.0,104.3 L428.0,102.0 L440.0,103.2 L452.0,107.7 L464.0,115.3 L476.0,125.4 L488.0,137.2 L500.0,150.0 L512.0,162.8 L524.0,174.6 L536.0,184.7 L548.0,192.3 L560.0,196.8 L572.0,198.0 L584.0,195.7 L596.0,190.1 L608.0,181.6 L620.0,170.8 L632.0,158.6" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="60" y1="224" x2="650" y2="224" stroke="#999" stroke-width="1.5"/>
  <polygon points="658,219 658,229 666,224" fill="#999"/>
  <text x="668" y="222" font-size="13" fill="#666">时间 t</text>

  <line x1="30" y1="252" x2="690" y2="252" stroke="#ddd" stroke-width="1"/>

  <!-- 数字信号面板 -->
  <text x="360" y="278" text-anchor="middle" font-size="15" fill="#c0392b">数字信号 —— 时间与取值都离散</text>

  <line x1="18" y1="332" x2="640" y2="332" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="18" y1="412" x2="640" y2="412" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>

  <text x="24" y="324" font-size="14" fill="#c0392b">高电平（逻辑 1）</text>
  <text x="24" y="432" font-size="14" fill="#c0392b">低电平（逻辑 0）</text>

  <polyline points="M80,412 L150,412 L150,332 L220,332 L220,412 L290,412 L290,332 L360,332 L360,412 L430,412 L430,332 L500,332 L500,412 L570,412 L570,332 L640,332" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>

  <line x1="150" y1="332" x2="150" y2="412" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="322" text-anchor="middle" font-size="13" fill="#333">上升沿</text>
  <text x="220" y="428" text-anchor="middle" font-size="13" fill="#333">下降沿</text>

  <line x1="60" y1="448" x2="650" y2="448" stroke="#999" stroke-width="1.5"/>
  <polygon points="658,443 658,453 666,448" fill="#999"/>
  <text x="668" y="446" font-size="13" fill="#666">时间 t</text>

  <text x="360" y="464" text-anchor="middle" font-size="13" fill="#666">数字电路只处理两种电平 —— 这是用电路表达二进制的物理基础</text>
</svg>
