<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg">
  <title>四位二进制补码的数值环</title>
  <desc>以环示意 4 位二进制补码：数值从 -8 到 +7，沿顺时针方向加 1，首尾相接成环（模 16）；+7 加 1 会跨过符号边界变成 -8，即溢出。</desc>
  <rect width="460" height="380" fill="#faf9f5"/>
  <text x="230" y="20" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">四位二进制补码：数值环（沿顺时针加 1）</text>
  <g transform="translate(0,25)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
      </marker>
    </defs>

    <circle cx="230" cy="170" r="105" fill="none" stroke="#1f6f8b" stroke-width="2"/>

    <line x1="230" y1="170" x2="230" y2="65" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4" transform="rotate(168.75 230 170)"/>
    <line x1="230" y1="170" x2="230" y2="65" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4" transform="rotate(348.75 230 170)"/>

    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(0 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(22.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(45 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(67.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(90 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(112.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(135 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(157.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(180 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(202.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(225 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(247.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(270 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(292.5 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(315 230 170)"/>
    <line x1="230" y1="73" x2="230" y2="57" stroke="#333" stroke-width="1.5" transform="rotate(337.5 230 170)"/>

    <path d="M 265.2 255.0 A 92 92 0 0 1 230 262" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="230" y="90" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">0</text>
    <text x="260.6" y="96.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">1</text>
    <text x="286.6" y="113.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">2</text>
    <text x="303.9" y="139.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">3</text>
    <text x="310" y="170" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">4</text>
    <text x="303.9" y="200.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">5</text>
    <text x="286.6" y="226.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">6</text>
    <text x="260.6" y="243.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">7</text>
    <text x="230" y="250" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">-8</text>
    <text x="199.4" y="243.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-7</text>
    <text x="173.4" y="226.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-6</text>
    <text x="156.1" y="200.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-5</text>
    <text x="150" y="170" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-4</text>
    <text x="156.1" y="139.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-3</text>
    <text x="173.4" y="113.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#333">-2</text>
    <text x="199.4" y="96.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">-1</text>

    <text x="230" y="40" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">0000</text>
    <text x="279.7" y="49.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0001</text>
    <text x="321.9" y="78.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0010</text>
    <text x="350.1" y="120.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0011</text>
    <text x="360" y="170" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0100</text>
    <text x="350.1" y="219.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0101</text>
    <text x="321.9" y="261.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">0110</text>
    <text x="279.7" y="290.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">0111</text>
    <text x="230" y="300" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">1000</text>
    <text x="180.3" y="290.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1001</text>
    <text x="138.1" y="261.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1010</text>
    <text x="109.9" y="219.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1011</text>
    <text x="100" y="170" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1100</text>
    <text x="109.9" y="120.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1101</text>
    <text x="138.1" y="78.1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#1f6f8b">1110</text>
    <text x="180.3" y="49.9" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="13" fill="#c0392b">1111</text>

    <text x="230" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333" font-weight="bold">4 位补码：范围 -8 ~ +7</text>
    <text x="230" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">沿顺时针方向数值 +1</text>
    <text x="230" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">首尾相接成环（模 16）</text>

    <text x="252" y="248" font-family="sans-serif" font-size="13" fill="#c0392b">+1</text>
    <text x="230" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">+7 加 1 跨过虚线（符号边界）跳到 -8：符号位翻转，这就是溢出</text>
  </g>
</svg>
