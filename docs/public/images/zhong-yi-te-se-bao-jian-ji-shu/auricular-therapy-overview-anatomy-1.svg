<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540">
  <title>耳廓解剖分区示意图</title>
  <desc>左耳耳廓九个基本分区的示意图：耳轮、耳舟、对耳轮、三角窝、耳甲艇、耳甲腔、耳屏、对耳屏、耳垂，并标出耳轮脚。</desc>
  <rect width="640" height="540" fill="#faf9f5" />
  <text x="60" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#c0392b">耳廓解剖分区（左耳）</text>

  <!-- 耳轮：整个耳廓底色（最外缘卷曲部） -->
  <path d="M 250 60
           C 120 75, 60 185, 60 310
           C 60 440, 150 520, 275 520
           C 405 520, 480 425, 480 300
           C 480 195, 430 105, 340 70
           C 310 60, 270 55, 250 60 Z"
        fill="#f0d9c9" stroke="#333" stroke-width="3" />

  <!-- 耳舟：耳轮与对耳轮之间的窄沟（用纸色带表示） -->
  <path d="M 330 95
           C 225 110, 150 195, 148 300
           C 147 355, 160 405, 185 445
           L 205 440
           C 178 400, 165 355, 166 305
           C 168 210, 235 140, 320 120 Z"
        fill="#faf9f5" stroke="#333" stroke-width="2" />

  <!-- 对耳轮体（纵向隆起） -->
  <path d="M 225 455
           C 175 420, 160 350, 172 250
           C 178 200, 195 170, 215 155
           L 235 185
           C 215 200, 198 225, 195 260
           C 188 330, 205 400, 245 435 Z"
        fill="#e3b8a0" stroke="#333" stroke-width="2" />

  <!-- 对耳轮上脚 -->
  <path d="M 215 155
           C 250 120, 300 105, 345 105
           C 355 105, 365 108, 372 115
           C 350 122, 310 130, 270 150
           C 245 162, 228 172, 215 155 Z"
        fill="#e3b8a0" stroke="#333" stroke-width="2" />

  <!-- 对耳轮下脚 -->
  <path d="M 215 155
           C 190 135, 160 128, 135 130
           C 125 132, 118 137, 115 145
           C 140 142, 170 152, 195 175 Z"
        fill="#e3b8a0" stroke="#333" stroke-width="2" />

  <!-- 三角窝：对耳轮上下脚之间的凹陷 -->
  <path d="M 175 148
           C 180 118, 215 100, 260 108
           C 285 112, 295 122, 292 134
           C 265 128, 230 132, 205 150 Z"
        fill="#cfe0ec" stroke="#333" stroke-width="2" />

  <!-- 耳甲艇：耳轮脚上方的耳甲部分 -->
  <path d="M 205 180
           C 225 155, 260 145, 285 152
           C 310 158, 315 175, 300 190
           C 280 205, 245 210, 220 200
           C 210 196, 205 190, 205 180 Z"
        fill="#eccdb8" stroke="#333" stroke-width="2" />

  <!-- 耳轮脚：深入耳内的横嵴，分隔艇与腔 -->
  <path d="M 300 195 C 265 205, 230 210, 205 205" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 205 205 L 200 225" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 4" />

  <!-- 耳甲腔：耳轮脚下方的耳甲部分 -->
  <path d="M 205 225
           C 220 215, 250 215, 268 225
           C 285 238, 280 260, 262 275
           C 240 292, 205 295, 190 278
           C 178 262, 185 240, 205 225 Z"
        fill="#eccdb8" stroke="#333" stroke-width="2" />

  <!-- 耳屏 -->
  <path d="M 88 300
           C 100 290, 118 292, 128 305
           C 136 316, 130 335, 116 342
           C 100 348, 88 338, 84 320 Z"
        fill="#e0b89a" stroke="#333" stroke-width="2" />

  <!-- 对耳屏 -->
  <path d="M 112 395
           C 128 388, 146 395, 150 412
           C 152 428, 138 442, 120 442
           C 104 440, 100 422, 112 395 Z"
        fill="#e0b89a" stroke="#333" stroke-width="2" />

  <!-- 外耳道口 -->
  <circle cx="150" cy="345" r="12" fill="#333" />

  <!-- 耳垂 -->
  <path d="M 180 475
           C 215 495, 320 500, 385 482
           C 405 476, 415 460, 415 448
           C 380 468, 300 480, 240 472
           C 215 468, 195 468, 180 475 Z"
        fill="#f5e3d0" stroke="#333" stroke-width="2" />

  <!-- 分区编号 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">
    <circle cx="395" cy="92" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="395" y="97">1</text>
    <circle cx="335" cy="185" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="335" y="190">2</text>
    <circle cx="252" cy="310" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="252" y="315">3</text>
    <circle cx="222" cy="128" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="222" y="133">4</text>
    <circle cx="255" cy="170" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="255" y="175">5</text>
    <circle cx="230" cy="252" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="230" y="257">6</text>
    <circle cx="102" cy="322" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="102" y="327">7</text>
    <circle cx="126" cy="420" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="126" y="425">8</text>
    <circle cx="285" cy="502" r="14" fill="#fff" stroke="#333" stroke-width="2" /><text x="285" y="507">9</text>
  </g>

  <!-- 耳轮脚标注 -->
  <path d="M 232 205 L 250 155" fill="none" stroke="#1f6f8b" stroke-width="2" />
  <text x="300" y="142" font-family="sans-serif" font-size="14" fill="#1f6f8b">耳轮脚</text>

  <!-- 图例 -->
  <g font-family="sans-serif" font-size="15" fill="#333">
    <text x="520" y="80" font-size="18" font-weight="bold" fill="#c0392b">分区图例</text>
    <text x="520" y="110"><tspan font-weight="bold">1</tspan> 耳轮 Helix</text>
    <text x="520" y="135"><tspan font-weight="bold">2</tspan> 耳舟 Scapha</text>
    <text x="520" y="160"><tspan font-weight="bold">3</tspan> 对耳轮 Antihelix</text>
    <text x="520" y="185"><tspan font-weight="bold">4</tspan> 三角窝 Triangular fossa</text>
    <text x="520" y="210"><tspan font-weight="bold">5</tspan> 耳甲艇 Cymba conchae</text>
    <text x="520" y="235"><tspan font-weight="bold">6</tspan> 耳甲腔 Cavum conchae</text>
    <text x="520" y="260"><tspan font-weight="bold">7</tspan> 耳屏 Tragus</text>
    <text x="520" y="285"><tspan font-weight="bold">8</tspan> 对耳屏 Antitragus</text>
    <text x="520" y="310"><tspan font-weight="bold">9</tspan> 耳垂 Earlobe</text>
  </g>
</svg>
