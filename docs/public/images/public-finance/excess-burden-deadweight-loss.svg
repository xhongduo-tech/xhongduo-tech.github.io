<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <title>税收的无谓损失（超额负担）</title>
  <desc>供给为水平线，征收从量税后消费者价格上升、均衡数量下降，税收收入为矩形，矩形右侧与需求曲线之间的三角即无谓损失。</desc>
  <rect width="480" height="360" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="80" y1="50" x2="80" y2="300"/>
    <line x1="80" y1="300" x2="430" y2="300"/>
  </g>
  <polygon points="167,140 167,220 284,220" fill="#c0392b" fill-opacity="0.18"/>
  <rect x="80" y="140" width="87" height="80" fill="#1f6f8b" fill-opacity="0.12"/>
  <line x1="80" y1="80" x2="400" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="80" y1="220" x2="440" y2="220" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="80" y1="140" x2="167" y2="140" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="167" y1="140" x2="167" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="284" y1="220" x2="284" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="352" y="112" font-family="sans-serif" font-size="13" fill="#333">需求线</text>
  <text x="352" y="214" font-family="sans-serif" font-size="13" fill="#1f6f8b">供给（MC）</text>
  <text x="20" y="142" font-family="sans-serif" font-size="13" fill="#333">p0+t</text>
  <text x="32" y="224" font-family="sans-serif" font-size="13" fill="#333">p0</text>
  <text x="171" y="316" font-family="sans-serif" font-size="13" fill="#333">Q1</text>
  <text x="288" y="316" font-family="sans-serif" font-size="13" fill="#333">Q0</text>
  <text x="102" y="196" font-family="sans-serif" font-size="13" fill="#333">税收收入</text>
  <text x="196" y="168" font-family="sans-serif" font-size="13" fill="#c0392b">无谓损失</text>
  <text x="110" y="80" font-family="sans-serif" font-size="13" fill="#333">超额负担 = ½ × t × ΔQ</text>
</svg>
