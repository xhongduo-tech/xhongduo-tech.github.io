<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <title>最优污染水平与皮古税</title>
  <desc>污染的边际收益曲线向下倾斜、边际损害曲线向上倾斜，两者交点决定社会最优污染量 E*，最优皮古税等于该点的边际损害。</desc>
  <rect width="480" height="360" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="80" y1="40" x2="80" y2="300"/>
    <line x1="80" y1="300" x2="440" y2="300"/>
  </g>
  <text x="18" y="175" font-family="sans-serif" font-size="13" fill="#333">边际量</text>
  <text x="350" y="322" font-family="sans-serif" font-size="13" fill="#333">污染量 E</text>
  <line x1="80" y1="100" x2="380" y2="300" stroke="#1f6f8b" stroke-width="2.5"/>
  <line x1="80" y1="260" x2="380" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="80" y1="200" x2="230" y2="200" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="230" y1="100" x2="230" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="230" cy="200" r="4" fill="#333"/>
  <text x="386" y="118" font-family="sans-serif" font-size="13" fill="#1f6f8b">MB（减少污染的收益）</text>
  <text x="386" y="152" font-family="sans-serif" font-size="13" fill="#c0392b">MD（边际损害）</text>
  <text x="236" y="196" font-family="sans-serif" font-size="13" fill="#333">t* = MD(E*)</text>
  <text x="236" y="318" font-family="sans-serif" font-size="13" fill="#333">E*</text>
  <text x="140" y="92" font-family="sans-serif" font-size="13" fill="#333">最优污染不是零：E* 处 MB = MD</text>
</svg>
