<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <title>公共物品的最优供给：需求纵向加总</title>
  <desc>消费者 A 与 B 的私人边际收益曲线纵向相加得到总边际收益曲线，与边际成本水平线的交点决定最优公共物品数量。</desc>
  <rect width="480" height="360" fill="#faf9f5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="80" y1="40" x2="80" y2="300"/>
    <line x1="80" y1="300" x2="440" y2="300"/>
  </g>
  <text x="20" y="175" font-family="sans-serif" font-size="13" fill="#333">价格</text>
  <text x="390" y="322" font-family="sans-serif" font-size="13" fill="#333">数量</text>
  <line x1="80" y1="180" x2="320" y2="276" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="80" y1="204" x2="320" y2="281" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="80" y1="84" x2="320" y2="242" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="80" y1="228" x2="440" y2="228" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="280" y1="84" x2="280" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="280" cy="228" r="4" fill="#c0392b"/>
  <text x="215" y="128" font-family="sans-serif" font-size="13" fill="#c0392b">ΣMB = MB_A + MB_B</text>
  <text x="332" y="272" font-family="sans-serif" font-size="13" fill="#1f6f8b">MB_A</text>
  <text x="332" y="296" font-family="sans-serif" font-size="13" fill="#1f6f8b">MB_B</text>
  <text x="336" y="222" font-family="sans-serif" font-size="13" fill="#333">MC</text>
  <text x="284" y="316" font-family="sans-serif" font-size="13" fill="#333">Q*</text>
  <text x="150" y="210" font-family="sans-serif" font-size="13" fill="#333">最优条件：ΣMB = MC</text>
</svg>
