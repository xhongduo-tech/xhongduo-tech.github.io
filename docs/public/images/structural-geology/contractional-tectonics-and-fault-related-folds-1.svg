<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240">
<title>断层转折褶皱的断坪—断坡—断坪几何</title>
<desc>逆冲断层由底部断坪、倾斜断坡与顶部断坪组成，上盘地层爬过断坡时被折成背斜，即断层转折褶皱。</desc>
<rect width="460" height="240" fill="#faf9f5"/>

<!-- fault -->
<polyline points="20,195 170,195 290,135 450,135" fill="none" stroke="#c0392b" stroke-width="3"/>
<!-- movement arrow along ramp -->
<line x1="196" y1="190" x2="224" y2="175" stroke="#c0392b" stroke-width="2"/>
<polygon points="232,170 216,182 220,168" fill="#c0392b"/>

<!-- beds in hanging wall -->
<polyline points="20,160 170,160 290,100 450,100" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="20,135 170,135 290,75 450,75" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="20,110 170,110 290,50 450,50" fill="none" stroke="#333" stroke-width="1.5"/>

<!-- fold crest annotation -->
<line x1="300" y1="42" x2="300" y2="18" stroke="#333" stroke-width="1"/>
<text x="262" y="16" font-family="sans-serif" font-size="14" fill="#333">断层转折褶皱</text>

<text x="52" y="220" font-family="sans-serif" font-size="14" fill="#c0392b">断坪</text>
<text x="196" y="200" font-family="sans-serif" font-size="14" fill="#c0392b">断坡</text>
<text x="360" y="160" font-family="sans-serif" font-size="14" fill="#c0392b">断坪</text>
</svg>
