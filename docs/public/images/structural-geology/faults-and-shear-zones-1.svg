<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250">
<title>Anderson 断层理论的三种主应力配置</title>
<desc>三幅示意图分别表示正断层、逆冲断层与走滑断层对应的主应力轴配置与断层产状。</desc>
<rect width="620" height="250" fill="#faf9f5"/>

<!-- Panel 1: normal fault, x 10-210 -->
<rect x="12" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<line x1="70" y1="18" x2="180" y2="208" stroke="#333" stroke-width="3"/>
<!-- sigma1 vertical arrows -->
<line x1="140" y1="4" x2="140" y2="18" stroke="#c0392b" stroke-width="2"/>
<polygon points="132,16 140,26 148,16" fill="#c0392b"/>
<line x1="140" y1="207" x2="140" y2="224" stroke="#c0392b" stroke-width="2"/>
<polygon points="132,212 140,202 148,212" fill="#c0392b"/>
<text x="145" y="12" font-family="sans-serif" font-size="14" fill="#c0392b">σ1</text>
<!-- sigma3 horizontal arrows -->
<line x1="6" y1="110" x2="16" y2="110" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="4,110 18,102 18,118" fill="#1f6f8b"/>
<line x1="205" y1="110" x2="215" y2="110" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="220,110 206,102 206,118" fill="#1f6f8b"/>
<text x="12" y="100" font-family="sans-serif" font-size="14" fill="#1f6f8b">σ3</text>
<text x="28" y="232" font-family="sans-serif" font-size="14" fill="#333">正断层：σ1 竖直</text>

<!-- Panel 2: thrust, x 215-415 -->
<rect x="217" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<line x1="222" y1="70" x2="412" y2="185" stroke="#333" stroke-width="3"/>
<!-- sigma3 vertical -->
<line x1="315" y1="4" x2="315" y2="18" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="307,16 315,26 323,16" fill="#1f6f8b"/>
<line x1="315" y1="207" x2="315" y2="224" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="307,212 315,202 323,212" fill="#1f6f8b"/>
<text x="320" y="12" font-family="sans-serif" font-size="14" fill="#1f6f8b">σ3</text>
<!-- sigma1 horizontal -->
<line x1="211" y1="105" x2="221" y2="105" stroke="#c0392b" stroke-width="2"/>
<polygon points="209,105 223,97 223,113" fill="#c0392b"/>
<line x1="410" y1="105" x2="420" y2="105" stroke="#c0392b" stroke-width="2"/>
<polygon points="425,105 411,97 411,113" fill="#c0392b"/>
<text x="219" y="95" font-family="sans-serif" font-size="14" fill="#c0392b">σ1</text>
<text x="233" y="232" font-family="sans-serif" font-size="14" fill="#333">逆冲断层：σ3 竖直</text>

<!-- Panel 3: strike-slip, x 420-620 -->
<rect x="422" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<line x1="520" y1="18" x2="520" y2="208" stroke="#333" stroke-width="3"/>
<!-- slip arrows -->
<line x1="455" y1="108" x2="500" y2="108" stroke="#c0392b" stroke-width="2"/>
<polygon points="450,108 466,99 466,117" fill="#c0392b"/>
<line x1="540" y1="108" x2="585" y2="108" stroke="#c0392b" stroke-width="2"/>
<polygon points="590,108 574,99 574,117" fill="#c0392b"/>
<circle cx="520" cy="165" r="9" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="520" cy="165" r="2.5" fill="#1f6f8b"/>
<text x="530" y="170" font-family="sans-serif" font-size="14" fill="#1f6f8b">σ2</text>
<text x="438" y="232" font-family="sans-serif" font-size="14" fill="#333">走滑断层：σ2 竖直</text>
</svg>
