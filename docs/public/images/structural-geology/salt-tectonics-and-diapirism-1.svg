<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250">
<title>盐底辟演化的三阶段：盐枕—盐栓—盐席</title>
<desc>从左到右依次是盐枕（盐层加厚上拱）、主动底辟（盐栓刺穿上覆地层）与盐席（盐体溢流铺展），展示底辟作用的形态演化。</desc>
<rect width="620" height="250" fill="#faf9f5"/>

<!-- Panel 1: salt pillow, x 10-210 -->
<rect x="12" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<ellipse cx="110" cy="150" rx="80" ry="20" fill="#c0392b"/>
<!-- overburden beds arched over pillow -->
<path d="M 20 120 Q 110 106 200 120" fill="none" stroke="#333" stroke-width="1.5"/>
<path d="M 20 92 Q 110 82 200 92" fill="none" stroke="#333" stroke-width="1.5"/>
<path d="M 20 66 Q 110 58 200 66" fill="none" stroke="#333" stroke-width="1.5"/>
<path d="M 20 42 Q 110 36 200 42" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="76" y="232" font-family="sans-serif" font-size="14" fill="#333">盐枕</text>

<!-- Panel 2: active diapir, x 217-417 -->
<rect x="217" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<!-- salt source layer -->
<rect x="217" y="175" width="198" height="28" fill="#c0392b"/>
<!-- salt neck + head -->
<rect x="298" y="82" width="26" height="93" fill="#c0392b"/>
<ellipse cx="311" cy="76" rx="30" ry="20" fill="#c0392b"/>
<!-- upturned overburden beds on both flanks -->
<line x1="217" y1="120" x2="294" y2="110" stroke="#333" stroke-width="1.5"/>
<line x1="217" y1="92" x2="294" y2="96" stroke="#333" stroke-width="1.5"/>
<line x1="217" y1="66" x2="294" y2="62" stroke="#333" stroke-width="1.5"/>
<line x1="328" y1="110" x2="415" y2="120" stroke="#333" stroke-width="1.5"/>
<line x1="328" y1="96" x2="415" y2="92" stroke="#333" stroke-width="1.5"/>
<line x1="328" y1="62" x2="415" y2="66" stroke="#333" stroke-width="1.5"/>
<text x="278" y="232" font-family="sans-serif" font-size="14" fill="#333">主动底辟（盐栓）</text>

<!-- Panel 3: salt sheet, x 422-620 -->
<rect x="422" y="15" width="198" height="195" fill="#fff" stroke="#333" stroke-width="1"/>
<!-- salt source layer -->
<rect x="422" y="180" width="198" height="23" fill="#c0392b"/>
<!-- salt neck -->
<rect x="503" y="95" width="24" height="85" fill="#c0392b"/>
<!-- extruded salt sheet spreading at surface -->
<ellipse cx="520" cy="82" rx="58" ry="14" fill="#c0392b"/>
<ellipse cx="470" cy="80" rx="26" ry="10" fill="#c0392b"/>
<ellipse cx="570" cy="80" rx="26" ry="10" fill="#c0392b"/>
<!-- flanking overburden beds -->
<line x1="422" y1="125" x2="505" y2="118" stroke="#333" stroke-width="1.5"/>
<line x1="422" y1="97" x2="505" y2="92" stroke="#333" stroke-width="1.5"/>
<line x1="525" y1="118" x2="620" y2="125" stroke="#333" stroke-width="1.5"/>
<line x1="525" y1="92" x2="620" y2="97" stroke="#333" stroke-width="1.5"/>
<text x="497" y="232" font-family="sans-serif" font-size="14" fill="#333">被动底辟（盐席/盐冰川）</text>
</svg>
