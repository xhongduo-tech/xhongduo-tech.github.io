<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270">
<title>莫尔圆：平面应力状态</title>
<desc>以σ3与σ1为直径端点的莫尔圆，圆周上的点P代表与σ1夹角θ的斜截面上的正应力与剪应力。</desc>
<rect width="400" height="270" fill="#faf9f5"/>
<line x1="30" y1="135" x2="380" y2="135" stroke="#333" stroke-width="1.5"/>
<line x1="200" y1="250" x2="200" y2="20" stroke="#333" stroke-width="1.5"/>
<text x="366" y="150" font-family="sans-serif" font-size="14" fill="#333">σn</text>
<text x="206" y="34" font-family="sans-serif" font-size="14" fill="#333">τ</text>
<circle cx="200" cy="135" r="90" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<line x1="110" y1="135" x2="290" y2="135" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="110" cy="135" r="3.5" fill="#c0392b"/>
<circle cx="290" cy="135" r="3.5" fill="#c0392b"/>
<text x="88" y="124" font-family="sans-serif" font-size="13" fill="#c0392b">σ3</text>
<text x="272" y="124" font-family="sans-serif" font-size="13" fill="#c0392b">σ1</text>
<line x1="200" y1="135" x2="257.8" y2="66.1" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="257.8" cy="66.1" r="3.5" fill="#c0392b"/>
<text x="266" y="60" font-family="sans-serif" font-size="13" fill="#c0392b">P(σn, τ)</text>
<line x1="257.8" y1="66.1" x2="257.8" y2="135" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M 221 135 A 21 21 0 0 0 213.5 118.5" fill="none" stroke="#333" stroke-width="1"/>
<text x="205" y="140" font-family="sans-serif" font-size="13" fill="#333">2θ</text>
</svg>
