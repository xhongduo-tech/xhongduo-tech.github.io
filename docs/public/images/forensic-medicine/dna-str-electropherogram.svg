<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="sans-serif">
  <title>STR 位点遗传示意：父、母与子</title>
  <desc>三个电泳图谱分别显示父（等位基因14、17）、母（12、16）与子（16、17）在一个STR位点上的峰。子从父母各继承一个等位基因，峰高反映纯合或杂合。</desc>
  <rect width="820" height="520" fill="#faf9f5"/>
  <rect x="0" y="0" width="820" height="520" fill="none" stroke="#333" stroke-width="2"/>

  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">STR 位点遗传：子各继承一峰</text>

  <!-- x axis grid lines for allele positions -->
  <line x1="150" y1="470" x2="700" y2="470" stroke="#333" stroke-width="2"/>
  <!-- allele ticks -->
  <text x="150" y="492" text-anchor="middle" font-size="14" fill="#333">12</text>
  <text x="225" y="492" text-anchor="middle" font-size="14" fill="#333">13</text>
  <text x="300" y="492" text-anchor="middle" font-size="14" fill="#333">14</text>
  <text x="375" y="492" text-anchor="middle" font-size="14" fill="#333">15</text>
  <text x="450" y="492" text-anchor="middle" font-size="14" fill="#333">16</text>
  <text x="525" y="492" text-anchor="middle" font-size="14" fill="#333">17</text>
  <text x="600" y="492" text-anchor="middle" font-size="14" fill="#333">18</text>
  <text x="425" y="514" text-anchor="middle" font-size="14" fill="#333">等位基因（重复数）</text>

  <!-- vertical gridlines -->
  <line x1="150" y1="110" x2="150" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="225" y1="110" x2="225" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="300" y1="110" x2="300" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="375" y1="110" x2="375" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="450" y1="110" x2="450" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="525" y1="110" x2="525" y2="470" stroke="#d9d4c8" stroke-width="1"/>
  <line x1="600" y1="110" x2="600" y2="470" stroke="#d9d4c8" stroke-width="1"/>

  <!-- father panel -->
  <text x="80" y="150" font-size="15" font-weight="bold" fill="#333">父</text>
  <line x1="150" y1="160" x2="700" y2="160" stroke="#1f6f8b" stroke-width="1.5"/>
  <path d="M 290 160 L 300 130 L 310 160 Z" fill="#1f6f8b"/>
  <path d="M 515 160 L 525 130 L 535 160 Z" fill="#1f6f8b"/>
  <text x="300" y="120" text-anchor="middle" font-size="13" fill="#1f6f8b">14</text>
  <text x="525" y="120" text-anchor="middle" font-size="13" fill="#1f6f8b">17</text>
  <text x="720" y="150" font-size="13" fill="#333">等位基因 14、17（杂合）</text>

  <!-- mother panel -->
  <text x="80" y="280" font-size="15" font-weight="bold" fill="#333">母</text>
  <line x1="150" y1="290" x2="700" y2="290" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 140 290 L 150 260 L 160 290 Z" fill="#c0392b"/>
  <path d="M 440 290 L 450 260 L 460 290 Z" fill="#c0392b"/>
  <text x="150" y="250" text-anchor="middle" font-size="13" fill="#c0392b">12</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" fill="#c0392b">16</text>
  <text x="720" y="280" font-size="13" fill="#333">等位基因 12、16（杂合）</text>

  <!-- child panel -->
  <text x="80" y="410" font-size="15" font-weight="bold" fill="#333">子</text>
  <line x1="150" y1="420" x2="700" y2="420" stroke="#333" stroke-width="1.5"/>
  <path d="M 440 420 L 450 390 L 460 420 Z" fill="#333"/>
  <path d="M 515 420 L 525 390 L 535 420 Z" fill="#333"/>
  <text x="450" y="380" text-anchor="middle" font-size="13" fill="#333">16（来自母）</text>
  <text x="525" y="380" text-anchor="middle" font-size="13" fill="#333">17（来自父）</text>
  <text x="720" y="410" font-size="13" fill="#333">各得父母一峰</text>

  <!-- transmission arrows -->
  <path d="M 450 265 L 452 380" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 525 135 L 523 380" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
