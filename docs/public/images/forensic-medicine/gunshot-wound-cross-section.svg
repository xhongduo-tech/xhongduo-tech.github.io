<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="sans-serif">
  <title>枪弹伤剖面：入口、弹道与空腔</title>
  <desc>示意图展示高速弹头穿过躯体的剖面：入口伤有创缘内翻与擦伤轮，弹道为永久性创伤道，周围虚线为瞬时空腔，出口伤创缘外翻、不规则。</desc>
  <rect width="820" height="460" fill="#faf9f5"/>
  <rect x="0" y="0" width="820" height="460" fill="none" stroke="#333" stroke-width="2"/>

  <text x="410" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">枪弹伤剖面：能量的三种去向</text>

  <!-- body outline (cross-section torso) -->
  <path d="M 240 110 Q 300 70 410 78 Q 520 70 580 110 Q 620 180 600 250 Q 580 320 520 352 Q 410 376 300 352 Q 240 320 220 250 Q 200 180 240 110 Z"
        fill="#f2ede4" stroke="#333" stroke-width="3"/>

  <!-- bullet path line -->
  <line x1="150" y1="255" x2="700" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- temporary cavity (dashed ellipse) -->
  <ellipse cx="410" cy="205" rx="130" ry="52" fill="#1f6f8b" opacity="0.18" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="560" y="132" text-anchor="middle" font-size="14" fill="#1f6f8b">瞬时空腔（虚线椭圆）</text>
  <text x="560" y="150" text-anchor="middle" font-size="13" fill="#333">高速弹能量释放所致</text>

  <!-- permanent cavity -->
  <path d="M 268 236 L 570 183 L 574 193 L 272 246 Z" fill="#c0392b" opacity="0.75"/>
  <text x="330" y="268" font-size="14" fill="#c0392b">永久性创伤道</text>
  <text x="330" y="285" font-size="13" fill="#333">被碾碎的坏死组织带</text>

  <!-- bullet -->
  <circle cx="690" cy="172" r="8" fill="#333"/>
  <text x="700" y="196" font-size="14" fill="#333">弹头方向</text>

  <!-- entrance wound -->
  <circle cx="250" cy="248" r="14" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <circle cx="250" cy="248" r="6" fill="#faf9f5"/>
  <line x1="150" y1="255" x2="238" y2="249" stroke="#c0392b" stroke-width="3"/>
  <text x="120" y="300" font-size="15" font-weight="bold" fill="#c0392b">入口伤</text>
  <text x="120" y="318" font-size="13" fill="#333">创缘内翻、有擦伤轮</text>

  <!-- exit wound -->
  <circle cx="580" cy="180" r="17" fill="#333"/>
  <circle cx="580" cy="180" r="8" fill="#faf9f5"/>
  <line x1="587" y1="176" x2="690" y2="174" stroke="#333" stroke-width="3"/>
  <text x="600" y="218" font-size="15" font-weight="bold" fill="#333">出口伤</text>
  <text x="600" y="236" font-size="13" fill="#333">创缘外翻、不规则</text>

  <!-- kinetic energy notes -->
  <text x="410" y="408" text-anchor="middle" font-size="15" fill="#333">毁伤总量由动能决定：</text>
  <text x="410" y="430" text-anchor="middle" font-size="15" fill="#333">E = ½mv²，入体速度越高、能量沉积越大</text>
</svg>
