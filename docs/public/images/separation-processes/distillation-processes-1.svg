<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" font-family="sans-serif">
<title>McCabe–Thiele 图解法</title>
<desc>平衡线与精馏段操作线之间走阶梯，阶梯数即理论塔板数；图中示出平衡线、对角线、精馏段操作线与提馏段操作线。</desc>
<rect width="640" height="480" fill="#faf9f5"/>
<text x="320" y="34" text-anchor="middle" font-size="18" fill="#333">McCabe–Thiele 图解法</text>

<!-- 坐标轴 -->
<g stroke="#333" stroke-width="1.5">
<line x1="80" y1="400" x2="570" y2="400" marker-end="url(#arrx)"/>
<line x1="80" y1="400" x2="80" y2="50" marker-end="url(#arry)"/>
</g>
<text x="590" y="406" font-size="14" fill="#333">x（液相摩尔分数）</text>
<text x="60" y="46" font-size="14" fill="#333">y（汽相摩尔分数）</text>

<defs>
<marker id="arrx" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
</marker>
<marker id="arry" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
</marker>
</defs>

<!-- 对角线 y=x -->
<line x1="80" y1="400" x2="540" y2="120" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="505" y="120" font-size="13" fill="#777" transform="rotate(-33,505,120)">对角线 y = x</text>

<!-- 平衡线 y = 1.8x/(1+0.8x)，从 (0,0) 到 (1,1) 略弯 -->
<path d="M80,400 Q230,300 400,205 Q470,170 540,120" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="352" y="252" font-size="13" fill="#1f6f8b">平衡线 y = f(x)</text>

<!-- 精馏段操作线：过 (xD,xD)=(540,120) 与点 (x=380, y=215) -->
<line x1="430" y1="196" x2="540" y2="120" stroke="#c0392b" stroke-width="2"/>
<text x="497" y="152" font-size="13" fill="#c0392b" transform="rotate(-38,497,152)">精馏段操作线</text>

<!-- 提馏段操作线：过 (xB,xB) 与进料点，画到 q 线交点附近 -->
<line x1="80" y1="400" x2="430" y2="196" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="200" y="330" font-size="13" fill="#c0392b" transform="rotate(29,200,330)">提馏段操作线</text>

<!-- 阶梯（示例 4 级）从 (540,120) 开始 -->
<g stroke="#333" stroke-width="1.8" fill="none">
<line x1="540" y1="120" x2="540" y2="111"/>
<line x1="540" y1="111" x2="514" y2="111"/>
<line x1="514" y1="111" x2="514" y2="129"/>
<line x1="514" y1="129" x2="490" y2="129"/>
<line x1="490" y1="129" x2="490" y2="145"/>
<line x1="490" y1="145" x2="468" y2="145"/>
<line x1="468" y1="145" x2="468" y2="160"/>
<line x1="468" y1="160" x2="448" y2="160"/>
</g>

<!-- xD, xB 标注 -->
<line x1="540" y1="120" x2="540" y2="404" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="540" y="422" text-anchor="middle" font-size="13" fill="#c0392b">x_D</text>
<line x1="80" y1="400" x2="540" y2="120" stroke="#999" stroke-width="0" />
<text x="88" y="422" font-size="13" fill="#c0392b">x_B</text>
</svg>
