<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" font-family="sans-serif">
<title>膜分离示意图</title>
<desc>进料侧与渗透侧之间有一层选择透过性膜，溶质被截留在膜表面形成浓差极化层。</desc>
<rect width="640" height="360" fill="#faf9f5"/>
<text x="320" y="36" text-anchor="middle" font-size="18" fill="#333">膜分离与浓差极化</text>

<!-- 进料侧 -->
<rect x="60" y="80" width="250" height="210" fill="#eaf2f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="185" y="110" text-anchor="middle" font-size="15" fill="#1f6f8b">进料侧（高压）</text>

<!-- 浓差极化层 -->
<rect x="310" y="80" width="60" height="210" fill="#f6d9d9" stroke="#c0392b" stroke-width="1.5"/>
<text x="340" y="185" text-anchor="middle" font-size="13" fill="#c0392b">浓差</text>
<text x="340" y="202" text-anchor="middle" font-size="13" fill="#c0392b">极化层</text>

<!-- 膜 -->
<rect x="370" y="80" width="28" height="210" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
<text x="384" y="60" text-anchor="middle" font-size="14" fill="#333">膜</text>

<!-- 渗透侧 -->
<rect x="398" y="80" width="190" height="210" fill="#f2efe9" stroke="#333" stroke-width="1.5"/>
<text x="493" y="110" text-anchor="middle" font-size="15" fill="#333">渗透侧（低压，纯组分）</text>

<!-- 进料箭头 -->
<line x1="150" y1="46" x2="150" y2="78" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrf)"/>
<text x="150" y="36" text-anchor="middle" font-size="13" fill="#1f6f8b">进料</text>
<line x1="260" y1="46" x2="260" y2="78" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrf)"/>

<!-- 截留液出口 -->
<line x1="185" y1="292" x2="185" y2="322" stroke="#c0392b" stroke-width="2" marker-end="url(#arrb)"/>
<text x="185" y="338" text-anchor="middle" font-size="13" fill="#c0392b">截留液（浓缩液）</text>

<!-- 渗透物出口 -->
<line x1="493" y1="292" x2="493" y2="322" stroke="#333" stroke-width="2" marker-end="url(#arrb)"/>
<text x="493" y="338" text-anchor="middle" font-size="13" fill="#333">渗透物（透过膜）</text>

<!-- 小分子穿膜示意 -->
<g stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrf)">
<line x1="398" y1="120" x2="350" y2="140"/>
<line x1="398" y1="180" x2="350" y2="180"/>
<line x1="398" y1="240" x2="350" y2="220"/>
</g>
<text x="560" y="150" font-size="12" fill="#666">溶剂分子小、溶解扩散快</text>
<text x="560" y="230" font-size="12" fill="#666">溶质被膜截留、在表面富集</text>

<defs>
<marker id="arrf" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
</marker>
<marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
</marker>
</defs>
</svg>
