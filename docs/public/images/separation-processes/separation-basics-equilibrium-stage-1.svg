<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" font-family="sans-serif">
<title>逆流级联示意图</title>
<desc>四块平衡级串联成逆流级联，进料自左端进入，轻相从左向右流动，重相自右向左流动。</desc>
<rect width="640" height="380" fill="#faf9f5"/>
<text x="320" y="38" text-anchor="middle" font-size="18" fill="#333">逆流级联：多级平衡器的串联</text>
<text x="320" y="62" text-anchor="middle" font-size="13" fill="#555">每一级内两相充分接触达到平衡，级间两相逆向流动</text>

<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
</marker>
<marker id="arrR" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M9,0 L0,3 L9,6 Z" fill="#1f6f8b"/>
</marker>
</defs>

<g stroke="#333" stroke-width="2" fill="none">
<rect x="100" y="150" width="90" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<rect x="240" y="150" width="90" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="150" width="90" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<rect x="520" y="150" width="90" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
</g>

<text x="145" y="194" text-anchor="middle" font-size="14" fill="#333">第 1 级</text>
<text x="285" y="194" text-anchor="middle" font-size="14" fill="#333">第 2 级</text>
<text x="425" y="194" text-anchor="middle" font-size="14" fill="#333">第 3 级</text>
<text x="565" y="194" text-anchor="middle" font-size="14" fill="#333">第 4 级</text>

<!-- 进料 -->
<line x1="145" y1="100" x2="145" y2="146" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<text x="145" y="90" text-anchor="middle" font-size="14" fill="#c0392b">进料</text>

<!-- 轻相产品 -->
<line x1="565" y1="146" x2="565" y2="100" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<text x="565" y="90" text-anchor="middle" font-size="14" fill="#c0392b">轻相产品</text>

<!-- 轻相 级间 左→右 -->
<line x1="192" y1="132" x2="238" y2="132" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="332" y1="132" x2="378" y2="132" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="472" y1="132" x2="518" y2="132" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="120" text-anchor="middle" font-size="13" fill="#333">轻相流向（汽 / 萃余相）</text>

<!-- 重相 级间 右→左 -->
<line x1="518" y1="250" x2="472" y2="250" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrR)"/>
<line x1="378" y1="250" x2="332" y2="250" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrR)"/>
<line x1="238" y1="250" x2="192" y2="250" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="320" y="272" text-anchor="middle" font-size="13" fill="#1f6f8b">重相流向（液 / 萃取相）</text>

<!-- 分离剂 -->
<line x1="565" y1="310" x2="565" y2="256" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="565" y="332" text-anchor="middle" font-size="14" fill="#1f6f8b">分离剂进入</text>

<!-- 重相产品 -->
<line x1="145" y1="256" x2="145" y2="310" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="145" y="332" text-anchor="middle" font-size="14" fill="#1f6f8b">重相产品</text>
</svg>
