<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="sans-serif">
  <title>海相沉积物中微生物再矿化的氧化还原分带</title>
  <desc>随深度增大依次为有氧呼吸、反硝化、锰还原、铁还原、硫酸盐还原与产甲烷带；右侧为孔隙水剖面：氧在表层即耗尽，硫酸盐缓慢下降，硫化物随深度上升。</desc>
  <rect width="880" height="470" fill="#faf9f5"/>
  <text x="30" y="36" font-size="16" fill="#333">沉积物深度 → 电子受体的接力</text>
  <text x="60" y="66" font-size="14" fill="#1f6f8b">海水（含 O₂ 与 SO₄²⁻）</text>
  <line x1="40" y1="84" x2="480" y2="84" stroke="#1f6f8b" stroke-width="3"/>
  <text x="60" y="106" font-size="13" fill="#333">沉积物—水界面</text>
  <rect x="40" y="114" width="440" height="52" fill="#f5ddd6"/>
  <rect x="40" y="166" width="440" height="50" fill="#f0e0c8"/>
  <rect x="40" y="216" width="440" height="46" fill="#e8d8b8"/>
  <rect x="40" y="262" width="440" height="46" fill="#dcd0a8"/>
  <rect x="40" y="308" width="440" height="56" fill="#c9c29b"/>
  <rect x="40" y="364" width="440" height="80" fill="#b8b29a"/>
  <text x="58" y="140" font-size="14" fill="#c0392b">有氧呼吸　O₂ → H₂O　（ΔG ≈ −479 kJ/mol）</text>
  <text x="58" y="192" font-size="14" fill="#333">反硝化　NO₃⁻ → N₂　（≈ −453）</text>
  <text x="58" y="241" font-size="14" fill="#333">锰还原　Mn(IV) → Mn²⁺　（≈ −349）</text>
  <text x="58" y="288" font-size="14" fill="#333">铁还原　Fe(III) → Fe²⁺　（≈ −114）</text>
  <text x="58" y="338" font-size="14" fill="#333">硫酸盐还原　SO₄²⁻ → HS⁻　（≈ −77）</text>
  <text x="58" y="402" font-size="14" fill="#333">产甲烷　CO₂ → CH₄　（≈ −59）</text>
  <text x="30" y="240" font-size="13" fill="#333">深</text>
  <text x="30" y="420" font-size="13" fill="#333">度</text>
  <text x="30" y="440" font-size="13" fill="#333">↓</text>
  <line x1="560" y1="84" x2="560" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="560" y1="440" x2="830" y2="440"/>
  <text x="580" y="106" font-size="14" fill="#333">孔隙水剖面（浓度 →）</text>
  <text x="575" y="150" font-size="14" fill="#c0392b">O₂</text>
  <text x="575" y="320" font-size="14" fill="#1f6f8b">SO₄²⁻</text>
  <text x="575" y="350" font-size="14" fill="#333">H₂S</text>
  <path d="M600,120 C 610,150 620,180 622,200" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M600,360 C 650,320 720,280 800,250" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <path d="M600,420 C 640,405 700,390 760,380" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="640" y="240" font-size="13" fill="#333">O₂ 表层即耗尽</text>
  <text x="700" y="300" font-size="13" fill="#1f6f8b">SO₄²⁻ 缓慢下降</text>
  <text x="690" y="395" font-size="13" fill="#333">H₂S 随深度上升</text>
</svg>
