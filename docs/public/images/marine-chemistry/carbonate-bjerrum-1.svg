<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="sans-serif">
  <title>海水中碳酸体系各物种分数随 pH 变化的 Bjerrum 图</title>
  <desc>横轴为 pH，纵轴为各碳酸物种占总溶解无机碳的比例。约 pH 小于 5.9 时以 CO2 为主，pH 5.9–8.9 之间以 HCO3 为主，pH 大于 8.9 时以 CO3 为主。现代表层海水 pH 约 8.1，处于 HCO3 主导区。</desc>
  <rect width="860" height="480" fill="#faf9f5"/>
  <line x1="70" y1="40" x2="70" y2="410"/>
  <line x1="70" y1="410" x2="820" y2="410"/>
  <rect x="255" y="40" width="330" height="370" fill="#d6e8f0" opacity="0.35"/>
  <text x="390" y="66" font-size="14" fill="#1f6f8b">现代表层海水 pH ≈ 8.1</text>
  <line x1="620" y1="40" x2="620" y2="410" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M75,90 C 140,95 200,110 235,130 C 270,152 285,165 295,175 C 310,195 330,250 350,290 C 380,340 450,382 540,398 C 620,408 740,409 815,409" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M75,408 C 140,405 200,392 235,368 C 270,344 285,330 295,316 C 310,292 330,245 355,200 C 380,158 430,120 500,105 C 570,92 700,90 815,90" fill="none" stroke="#1f6f8b" stroke-width="3.5"/>
  <path d="M75,406 C 120,400 160,380 190,348 C 230,306 300,200 340,150 C 390,90 480,60 560,50 C 640,43 740,41 815,41" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="255" y1="40" x2="255" y2="410" stroke="#999" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="585" y1="40" x2="585" y2="410" stroke="#999" stroke-width="1.5" stroke-dasharray="3,4"/>
  <text x="200" y="430" font-size="14" fill="#c0392b">CO2（溶解）</text>
  <text x="470" y="430" font-size="14" fill="#1f6f8b">HCO3⁻</text>
  <text x="650" y="430" font-size="14" fill="#333">CO3²⁻</text>
  <text x="240" y="425" font-size="13" fill="#333">pK1′≈5.9</text>
  <text x="568" y="425" font-size="13" fill="#333">pK2′≈8.9</text>
  <text x="70" y="415" font-size="13" fill="#333">0</text>
  <text x="70" y="52" font-size="13" fill="#333">1</text>
  <text x="60" y="230" font-size="13" fill="#333">分数</text>
  <text x="420" y="450" font-size="14" fill="#333">pH →</text>
  <text x="70" y="28" font-size="14" fill="#333">物种分数</text>
</svg>
