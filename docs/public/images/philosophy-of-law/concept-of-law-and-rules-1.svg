<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="title desc">
<title>法律体系的结构：初级规则与次级规则的结合</title>
<desc>哈特把法律体系刻画为初级规则与次级规则的结合：初级规则施加义务但有不确定性、静态性与无效率三个缺陷；次级规则中的承认规则、变更规则与裁判规则分别治愈这些缺陷，其中承认规则是效力判准，自身作为社会事实而存在。</desc>
<rect width="860" height="470" fill="#faf9f5"/>
<text x="430" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">法律体系 S ＝ 初级规则 ＋ 次级规则（哈特）</text>

<rect x="30" y="66" width="350" height="350" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="205" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c0392b">初级规则 R_P（义务规则）</text>
<text x="205" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">施加义务：「不得杀人」「不得偷窃」</text>
<line x1="60" y1="142" x2="350" y2="142" stroke="#ddd" stroke-width="1"/>
<text x="205" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">只靠它时的三宗罪</text>
<text x="205" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">① 不确定性 —— 谁是规则？</text>
<text x="205" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">② 静态性 —— 不会改变</text>
<text x="205" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">③ 无效率 —— 无人裁判</text>
<line x1="60" y1="278" x2="350" y2="278" stroke="#ddd" stroke-width="1"/>
<text x="205" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">有效性：r ∈ R_P ⇔ R_rec ⊢ r</text>
<text x="205" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">（派生有效性，靠承认规则检验）</text>
<text x="205" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">公民普遍服从 → 实效条件</text>

<text x="406" y="240" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#333">＋</text>

<rect x="435" y="66" width="395" height="350" rx="10" fill="#fff" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="632" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1f6f8b">次级规则 R_S（授予权力）</text>

<rect x="455" y="116" width="355" height="80" rx="8" fill="#eef5f8" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="632" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">承认规则 R_rec（终极判准）</text>
<text x="632" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">判定「什么是有效法律」</text>
<text x="632" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">自身是社会事实，由官员接受而存在</text>

<rect x="455" y="206" width="355" height="66" rx="8" fill="#eef5f8" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="632" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">变更规则 R_chg（立法）</text>
<text x="632" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">治愈静态性：授权立法者修改规则</text>

<rect x="455" y="282" width="355" height="66" rx="8" fill="#eef5f8" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="632" y="308" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f6f8b">裁判规则 R_adj（司法）</text>
<text x="632" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">治愈无效率：授权法官裁判、执行</text>

<text x="632" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">R_S 整体＝关于规则的规则（合法性条件）</text>
</svg>
