<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="sans-serif">
<title>碱基编辑与先导编辑原理对比</title>
<desc>左侧：碱基编辑器用脱氨酶把 C 直接改写为 U，再复制为 T，完成 C→T 转换；右侧：先导编辑器用 nCas9-逆转录酶和 pegRNA 的 PBS 与 RT 模板，在切口处按模板补写新序列。</desc>
<rect width="960" height="470" fill="#faf9f5"/>
<text x="480" y="40" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">碱基编辑 vs 先导编辑：无 DSB 的精密改写</text>

<!-- Left panel: Base editing -->
<text x="250" y="86" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">碱基编辑（CBE：C→T）</text>
<!-- DNA double strand -->
<path d="M 90 150 L 410 150" stroke="#333" stroke-width="4"/>
<path d="M 90 176 L 410 176" stroke="#333" stroke-width="4"/>
<text x="160" y="143" font-size="14" fill="#c0392b" font-weight="bold">C</text>
<text x="182" y="143" font-size="14" fill="#333">G</text>
<text x="240" y="186" font-size="14" fill="#333">T</text>
<text x="262" y="186" font-size="14" fill="#333">A</text>
<text x="310" y="143" font-size="14" fill="#333">C · G 位点</text>
<!-- deaminase box -->
<circle cx="250" cy="250" r="38" fill="#1f6f8b" opacity="0.16"/>
<text x="250" y="246" text-anchor="middle" font-size="14" fill="#1f6f8b" font-weight="bold">脱氨酶</text>
<text x="250" y="264" text-anchor="middle" font-size="13" fill="#1f6f8b">(APOBEC1)</text>
<path d="M 250 212 L 225 182" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="236" font-size="13" fill="#333">把 C 脱氨 → U</text>
<path d="M 330 250 L 396 330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="340" font-size="13" fill="#333">复制时 U 读作 T</text>
<!-- result -->
<rect x="90" y="360" width="320" height="52" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="250" y="384" text-anchor="middle" font-size="15" fill="#333">C · G → T · A</text>
<text x="250" y="402" text-anchor="middle" font-size="13" fill="#333">单碱基转换，无 DSB</text>

<!-- Right panel: Prime editing -->
<text x="700" y="86" text-anchor="middle" font-size="17" fill="#c0392b" font-weight="bold">先导编辑（pegRNA + RT）</text>
<path d="M 540 130 L 870 130" stroke="#333" stroke-width="4"/>
<path d="M 540 156 L 870 156" stroke="#333" stroke-width="4"/>
<text x="820" y="120" font-size="13" fill="#c0392b">PAM 侧切口</text>
<path d="M 660 130 L 700 130" stroke="#c0392b" stroke-width="5" stroke-dasharray="2 3"/>
<text x="712" y="124" font-size="13" fill="#c0392b">切口</text>
<!-- pegRNA line -->
<path d="M 620 210 L 800 210" stroke="#1f6f8b" stroke-width="4"/>
<rect x="690" y="204" width="70" height="12" fill="#c0392b" opacity="0.7"/>
<text x="702" y="214" font-size="12" fill="#fff">PBS + RT模板</text>
<text x="700" y="240" text-anchor="middle" font-size="13" fill="#333">pegRNA 的 3' 尾巴</text>
<circle cx="700" cy="300" r="36" fill="#1f6f8b" opacity="0.16"/>
<text x="700" y="296" text-anchor="middle" font-size="13" fill="#1f6f8b" font-weight="bold">nCas9-RT</text>
<text x="700" y="312" text-anchor="middle" font-size="12" fill="#1f6f8b">切口酶+逆转录酶</text>
<path d="M 700 264 L 700 234" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 700 336 L 720 368" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="742" y="366" font-size="13" fill="#333">PBS 退火 → 按模板补写</text>
<path d="M 540 400 L 720 400" stroke="#1f6f8b" stroke-width="5"/>
<text x="745" y="404" font-size="13" fill="#333">新序列写入 → flap 平衡</text>
<rect x="540" y="420" width="320" height="34" fill="#fff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="700" y="442" text-anchor="middle" font-size="14" fill="#333">任意替换 / 插入 / 删除</text>

<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
</marker>
</defs>
</svg>
