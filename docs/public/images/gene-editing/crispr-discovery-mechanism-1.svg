<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="sans-serif">
<title>CRISPR 适应性免疫三阶段示意图</title>
<desc>细菌 CRISPR 免疫的三阶段：适应（Cas1/Cas2 捕获外源 DNA 片段存入间隔区）、表达（crRNA 加工成熟）、干扰（Cas9 识别 PAM 并切割目标 DNA）。</desc>
<rect width="960" height="470" fill="#faf9f5"/>
<text x="480" y="40" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">CRISPR 适应性免疫三阶段</text>

<!-- Panel 1: Adaptation -->
<text x="170" y="84" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">① 适应：给入侵者存档</text>
<line x1="40" y1="130" x2="300" y2="130" stroke="#c0392b" stroke-width="3"/>
<text x="170" y="120" text-anchor="middle" font-size="13" fill="#333">噬菌体 DNA</text>
<rect x="60" y="170" width="20" height="8" fill="#999"/>
<rect x="96" y="170" width="20" height="8" fill="#999"/>
<rect x="132" y="170" width="20" height="8" fill="#999"/>
<rect x="168" y="170" width="20" height="8" fill="#999"/>
<rect x="204" y="170" width="20" height="8" fill="#999"/>
<text x="240" y="178" font-size="13" fill="#1f6f8b">细菌 CRISPR 座位</text>
<circle cx="120" cy="238" r="26" fill="#1f6f8b" opacity="0.18"/>
<text x="120" y="242" text-anchor="middle" font-size="13" fill="#1f6f8b" font-weight="bold">Cas1/Cas2</text>
<line x1="120" y1="212" x2="196" y2="178" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="196" y1="178" x2="120" y2="212" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M 30 178 q -14 34 26 38" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="16" y="226" font-size="13" fill="#333">剪下外源片段</text>
<path d="M 120 268 L 152 300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="168" y="306" font-size="13" fill="#333">插入 leader 端</text>
<path d="M 60 270 L 210 300" stroke="#333" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="120" y="362" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">噬菌体片段写入间隔区</text>

<!-- Panel 2: Expression -->
<text x="490" y="84" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">② 表达：排版印发档案</text>
<rect x="360" y="120" width="20" height="8" fill="#999"/>
<rect x="396" y="120" width="20" height="8" fill="#999"/>
<rect x="432" y="120" width="20" height="8" fill="#999"/>
<rect x="468" y="120" width="20" height="8" fill="#999"/>
<rect x="504" y="120" width="20" height="8" fill="#999"/>
<text x="540" y="128" font-size="13" fill="#1f6f8b">CRISPR 座位</text>
<path d="M 430 132 L 430 168" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="172" font-size="13" fill="#333">转录 + 加工</text>
<path d="M 380 200 L 600 200" stroke="#1f6f8b" stroke-width="4"/>
<rect x="430" y="194" width="16" height="12" fill="#c0392b" opacity="0.85"/>
<rect x="472" y="194" width="16" height="12" fill="#c0392b" opacity="0.85"/>
<text x="520" y="218" font-size="13" fill="#333">crRNA（间隔区 = 通缉令）</text>
<path d="M 380 238 L 600 238" stroke="#1f6f8b" stroke-width="4"/>
<rect x="500" y="232" width="16" height="12" fill="#c0392b" opacity="0.85"/>
<text x="520" y="256" font-size="13" fill="#333">crRNA-tracrRNA 复合物</text>
<circle cx="490" cy="322" r="34" fill="#1f6f8b" opacity="0.18"/>
<text x="490" y="326" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">Cas9</text>
<path d="M 490 280 L 490 252" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="282" font-size="13" fill="#333">与引导 RNA 组装</text>

<!-- Panel 3: Interference -->
<text x="800" y="84" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">③ 干扰：定点清除</text>
<path d="M 670 130 L 810 130" stroke="#333" stroke-width="4"/>
<path d="M 670 156 L 810 156" stroke="#333" stroke-width="4"/>
<rect x="762" y="122" width="40" height="42" fill="#c0392b" opacity="0.16" stroke="#c0392b" stroke-width="1.5"/>
<text x="782" y="148" font-size="13" fill="#c0392b">PAM</text>
<circle cx="740" cy="200" r="40" fill="#1f6f8b" opacity="0.18"/>
<text x="740" y="204" text-anchor="middle" font-size="15" fill="#1f6f8b" font-weight="bold">Cas9+RNA</text>
<path d="M 740 166 L 760 148" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 700 300 L 790 300" stroke="#333" stroke-width="5" stroke-dasharray="6 4"/>
<text x="600" y="308" font-size="13" fill="#333">R-loop 配对</text>
<text x="745" y="286" text-anchor="middle" font-size="13" fill="#333">HNH 切一条链</text>
<text x="745" y="342" text-anchor="middle" font-size="13" fill="#333">RuvC 切另一条链</text>
<path d="M 730 248 L 730 330" stroke="#333" stroke-width="2" stroke-dasharray="2 3"/>
<text x="862" y="200" font-size="13" fill="#333">平末端 DSB</text>
<text x="862" y="218" font-size="13" fill="#333">位于 PAM 上游 3 bp</text>
<path d="M 800 410 L 800 384" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="800" y="428" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">外源 DNA 被破坏 → 免疫</text>

<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
</marker>
</defs>
</svg>
