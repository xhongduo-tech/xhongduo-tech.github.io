<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="sans-serif" font-size="14">
  <title>线粒体电子传递链与化学渗透</title>
  <desc>复合体 I-IV 嵌入线粒体内膜，NADH/FADH2 把电子经 CoQ 与细胞色素 c 传给氧，复合体 I、III、IV 泵出质子形成质子梯度，质子经 ATP 合酶回流驱动 ATP 合成。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="520" fill="#faf9f5"/>
  <rect x="60" y="300" width="640" height="70" fill="#e8f0f2" stroke="none"/>
  <text x="400" y="50" text-anchor="middle" fill="#333" font-size="15">膜间腔（H⁺ 富集，浓度升高）</text>
  <text x="400" y="490" text-anchor="middle" fill="#333" font-size="15">线粒体基质（H⁺ 消耗）</text>
  <g stroke="#333" stroke-width="1.6" fill="#fff">
    <rect x="80" y="230" width="90" height="100" rx="6"/>
    <rect x="210" y="280" width="90" height="60" rx="6"/>
    <rect x="380" y="230" width="90" height="100" rx="6"/>
    <rect x="560" y="230" width="90" height="100" rx="6"/>
    <rect x="680" y="240" width="60" height="100" rx="6"/>
  </g>
  <g fill="#333" font-size="15" text-anchor="middle">
    <text x="125" y="280">复合体 I</text>
    <text x="255" y="310">复合体 II</text>
    <text x="425" y="280">复合体 III</text>
    <text x="605" y="280">复合体 IV</text>
    <text x="710" y="270">ATP</text>
    <text x="710" y="288">合酶</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="20" y1="290" x2="78" y2="290"/>
    <line x1="180" y1="300" x2="295" y2="316"/>
    <line x1="300" y1="312" x2="322" y2="318"/>
    <line x1="345" y1="312" x2="380" y2="298"/>
    <line x1="470" y1="268" x2="500" y2="264"/>
    <line x1="548" y1="264" x2="560" y2="268"/>
  </g>
  <g stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="5,4" fill="none">
    <line x1="175" y1="310" x2="310" y2="322"/>
    <line x1="475" y1="280" x2="520" y2="268"/>
  </g>
  <g stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arrowR)">
    <line x1="125" y1="230" x2="125" y2="175"/>
    <line x1="425" y1="230" x2="425" y2="175"/>
    <line x1="605" y1="230" x2="605" y2="175"/>
    <line x1="710" y1="150" x2="710" y2="238"/>
  </g>
  <g fill="#c0392b" font-size="15" text-anchor="middle">
    <text x="125" y="165">H⁺</text>
    <text x="425" y="165">H⁺</text>
    <text x="605" y="165">H⁺</text>
    <text x="710" y="138">H⁺</text>
    <text x="150" y="290" text-anchor="start">NADH</text>
    <text x="30" y="262" text-anchor="middle">e⁻</text>
    <text x="275" y="296" text-anchor="middle">FADH₂</text>
  </g>
  <g fill="#333">
    <circle cx="330" cy="325" r="14" stroke="#333" stroke-width="1.4" fill="#fff"/>
    <text x="330" y="355" text-anchor="middle" font-size="13">CoQ</text>
    <circle cx="525" cy="270" r="14" stroke="#333" stroke-width="1.4" fill="#fff"/>
    <text x="525" y="305" text-anchor="middle" font-size="13">细胞色素 c</text>
    <text x="650" y="180" text-anchor="middle" font-size="13">½O₂ + 2H⁺ → H₂O</text>
    <text x="710" y="375" text-anchor="middle" font-size="14">ADP + Pi → ATP</text>
  </g>
</svg>
