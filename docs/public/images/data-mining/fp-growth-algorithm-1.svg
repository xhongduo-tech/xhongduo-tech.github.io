<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="sans-serif">
  <title>FP 树构建示意</title>
  <desc>以 Han 教材经典事务集为例，展示按支持度降序排序后构建的 FP 树，根节点与各频繁项路径及其计数。</desc>
  <rect width="820" height="470" fill="#faf9f5"/>
  <text x="40" y="30" font-size="16" fill="#333" font-weight="bold">FP 树：以 Han 教材经典事务集为例（min_sup = 2）</text>

  <!-- 项头表 -->
  <text x="660" y="30" font-size="15" fill="#333" font-weight="bold">项头表</text>
  <rect x="660" y="40" width="140" height="24" fill="#1f6f8b"/>
  <text x="666" y="57" font-size="13" fill="#fff">项</text>
  <text x="714" y="57" font-size="13" fill="#fff">计数</text>
  <text x="764" y="57" font-size="13" fill="#fff">链</text>
  <line x1="710" y1="40" x2="710" y2="184" stroke="#1f6f8b" stroke-width="1"/>
  <line x1="760" y1="40" x2="760" y2="184" stroke="#1f6f8b" stroke-width="1"/>
  <g font-size="13" fill="#333">
    <rect x="660" y="64" width="140" height="24" fill="#fff" stroke="#1f6f8b"/>
    <text x="666" y="81">I2</text><text x="714" y="81">7</text><text x="764" y="81">—</text>
    <rect x="660" y="88" width="140" height="24" fill="#fff" stroke="#1f6f8b"/>
    <text x="666" y="105">I1</text><text x="714" y="105">6</text><text x="764" y="105">—</text>
    <rect x="660" y="112" width="140" height="24" fill="#fff" stroke="#1f6f8b"/>
    <text x="666" y="129">I3</text><text x="714" y="129">6</text><text x="764" y="129">—</text>
    <rect x="660" y="136" width="140" height="24" fill="#fff" stroke="#1f6f8b"/>
    <text x="666" y="153">I4</text><text x="714" y="153">2</text><text x="764" y="153">—</text>
    <rect x="660" y="160" width="140" height="24" fill="#fff" stroke="#1f6f8b"/>
    <text x="666" y="177">I5</text><text x="714" y="177">2</text><text x="764" y="177">—</text>
  </g>

  <!-- 边 -->
  <g stroke="#999" stroke-width="2" fill="none">
    <line x1="96" y1="250" x2="152" y2="250"/>
    <line x1="208" y1="250" x2="282" y2="120"/>
    <line x1="338" y1="120" x2="422" y2="60"/>
    <line x1="478" y1="60" x2="552" y2="60"/>
    <line x1="338" y1="120" x2="422" y2="140"/>
    <line x1="338" y1="120" x2="422" y2="220"/>
    <line x1="208" y1="250" x2="282" y2="300"/>
    <line x1="208" y1="250" x2="282" y2="390"/>
    <line x1="96" y1="250" x2="152" y2="430"/>
    <line x1="208" y1="430" x2="282" y2="430"/>
  </g>
  <!-- 边计数 -->
  <g font-size="13" fill="#c0392b">
    <text x="120" y="242">7</text>
    <text x="238" y="180">4</text>
    <text x="374" y="88">2</text>
    <text x="508" y="52">1</text>
    <text x="374" y="128">1</text>
    <text x="374" y="168">1</text>
    <text x="238" y="272">1</text>
    <text x="238" y="318">2</text>
    <text x="120" y="338">2</text>
    <text x="238" y="420">2</text>
  </g>

  <!-- 节点 -->
  <g>
    <rect x="40" y="235" width="56" height="30" rx="6" fill="#c0392b"/>
    <text x="68" y="255" font-size="13" fill="#fff" text-anchor="middle">root</text>

    <rect x="152" y="235" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="180" y="255" font-size="13" fill="#fff" text-anchor="middle">I2:7</text>

    <rect x="282" y="105" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="310" y="125" font-size="13" fill="#fff" text-anchor="middle">I1:4</text>

    <rect x="422" y="45" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="450" y="65" font-size="13" fill="#fff" text-anchor="middle">I5:2</text>

    <rect x="552" y="45" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="580" y="65" font-size="13" fill="#fff" text-anchor="middle">I3:1</text>

    <rect x="422" y="125" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="450" y="145" font-size="13" fill="#fff" text-anchor="middle">I4:1</text>

    <rect x="422" y="205" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="450" y="225" font-size="13" fill="#fff" text-anchor="middle">I3:1</text>

    <rect x="282" y="285" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="310" y="305" font-size="13" fill="#fff" text-anchor="middle">I4:1</text>

    <rect x="282" y="375" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="310" y="395" font-size="13" fill="#fff" text-anchor="middle">I3:2</text>

    <rect x="152" y="415" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="180" y="435" font-size="13" fill="#fff" text-anchor="middle">I1:2</text>

    <rect x="282" y="415" width="56" height="30" rx="6" fill="#1f6f8b"/>
    <text x="310" y="435" font-size="13" fill="#fff" text-anchor="middle">I3:2</text>
  </g>
</svg>
