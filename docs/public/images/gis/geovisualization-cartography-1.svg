<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif">
  <title>Bertin 视觉变量的六种基本形式</title>
  <desc>六个格子分别展示位置、大小、明度、纹理、色相、方向六种视觉变量，它们是地图符号设计的基本语法。</desc>
  <rect x="0" y="0" width="720" height="360" fill="#faf9f5"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">Bertin 视觉变量：地图符号的基本语法</text>
  <g>
    <rect x="20" y="60" width="220" height="270" fill="#fff" stroke="#1f6f8b"/>
    <circle cx="80" cy="180" r="6" fill="#333"/>
    <circle cx="130" cy="120" r="6" fill="#333"/>
    <circle cx="180" cy="220" r="6" fill="#333"/>
    <circle cx="200" cy="140" r="6" fill="#333"/>
    <text x="130" y="320" text-anchor="middle" font-size="15" fill="#333">位置 Position</text>
    <g>
      <rect x="250" y="60" width="220" height="270" fill="#fff" stroke="#1f6f8b"/>
      <circle cx="320" cy="200" r="10" fill="#c0392b"/>
      <circle cx="360" cy="200" r="22" fill="#c0392b"/>
      <circle cx="410" cy="200" r="34" fill="#c0392b"/>
      <text x="360" y="320" text-anchor="middle" font-size="15" fill="#333">大小 Size</text>
    </g>
    <g>
      <rect x="480" y="60" width="220" height="270" fill="#fff" stroke="#1f6f8b"/>
      <circle cx="550" cy="160" r="28" fill="#b0b0b0"/>
      <circle cx="600" cy="160" r="28" fill="#666"/>
      <circle cx="650" cy="160" r="28" fill="#333"/>
      <text x="590" y="320" text-anchor="middle" font-size="15" fill="#333">明度 Value</text>
    </g>
  </g>
  <text x="360" y="356" font-size="14" fill="#666">变量类型决定可表达的符号语义：位置/大小/明度表达定量，色相/纹理/方向表达定性。</text>
</svg>
