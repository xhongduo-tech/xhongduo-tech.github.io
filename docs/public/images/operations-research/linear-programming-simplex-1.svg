<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title>二维线性规划的可行域与目标等值线</title>
  <desc>产品混合问题 max z=3x1+2x2 的可行域为凸多边形，顶点为 (0,0),(6,0),(4,2),(0,4)，最优解在顶点 (6,0) 处取得，目标值 z=18。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- axes -->
  <line x1="70" y1="320" x2="600" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="320" x2="70" y2="20" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="340" font-family="sans-serif" font-size="14" fill="#333">x1</text>
  <text x="40" y="30" font-family="sans-serif" font-size="14" fill="#333">x2</text>
  <text x="60" y="342" font-family="sans-serif" font-size="13" fill="#333">0</text>
  <text x="488" y="340" font-family="sans-serif" font-size="13" fill="#333">6</text>
  <text x="56" y="46" font-family="sans-serif" font-size="13" fill="#333">4</text>
  <!-- constraint lines (dashed, full) -->
  <line x1="70" y1="40" x2="630" y2="320" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="70" y1="-100" x2="490" y2="320" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- feasible polygon -->
  <polygon points="70,320 490,320 350,180 70,40" fill="#1f6f8b" fill-opacity="0.18" stroke="#1f6f8b" stroke-width="2"/>
  <!-- objective level lines -->
  <line x1="70" y1="110" x2="210" y2="320" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="70" y1="-100" x2="350" y2="320" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="70" y1="-380" x2="490" y2="320" stroke="#c0392b" stroke-width="2"/>
  <!-- labels on level lines -->
  <text x="150" y="212" font-family="sans-serif" font-size="13" fill="#c0392b">z=6</text>
  <text x="270" y="212" font-family="sans-serif" font-size="13" fill="#c0392b">z=12</text>
  <text x="436" y="212" font-family="sans-serif" font-size="13" fill="#c0392b" font-weight="bold">z=18（最优）</text>
  <!-- arrow indicating increasing z -->
  <line x1="300" y1="150" x2="380" y2="95" stroke="#c0392b" stroke-width="2" marker-end="url(#arw)"/>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker></defs>
  <text x="310" y="120" font-family="sans-serif" font-size="13" fill="#c0392b">z 增大</text>
  <!-- constraint captions -->
  <text x="470" y="235" font-family="sans-serif" font-size="13" fill="#1f6f8b">x1+x2=6</text>
  <text x="510" y="285" font-family="sans-serif" font-size="13" fill="#1f6f8b">x1+2x2=8</text>
  <!-- vertices -->
  <circle cx="70" cy="320" r="4" fill="#333"/>
  <circle cx="490" cy="320" r="7" fill="#c0392b" stroke="#fff" stroke-width="2"/>
  <circle cx="350" cy="180" r="4" fill="#333"/>
  <circle cx="70" cy="40" r="4" fill="#333"/>
  <text x="475" y="312" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">(6,0) 最优</text>
  <text x="130" y="185" font-family="sans-serif" font-size="13" fill="#333">可行域（凸多边形）</text>
  <text x="355" y="165" font-family="sans-serif" font-size="13" fill="#333">(4,2)</text>
  <text x="48" y="68" font-family="sans-serif" font-size="13" fill="#333">(0,4)</text>
</svg>
