<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title>分支定界树示意</title>
  <desc>根节点为松弛问题（分数解 UB=18.5）；分支为 x1<=1 与 x1>=2 两个子节点；其中一个子节点被剪枝，另一个继续分支出整数解节点。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- root -->
  <ellipse cx="320" cy="60" rx="130" ry="34" fill="#1f6f8b" fill-opacity="0.15" stroke="#1f6f8b" stroke-width="2"/>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">根：松弛问题</text>
  <text x="320" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">分数解，UB = 18.5</text>
  <!-- edges -->
  <line x1="280" y1="94" x2="170" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="94" x2="470" y2="170" stroke="#333" stroke-width="1.5"/>
  <!-- left child -->
  <rect x="70" y="170" width="200" height="60" rx="8" fill="#1f6f8b" fill-opacity="0.12" stroke="#1f6f8b" stroke-width="2"/>
  <text x="170" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">分支：x₁ ≤ 1</text>
  <text x="170" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">UB = 14.0（整数解）</text>
  <text x="86" y="176" font-family="sans-serif" font-size="13" fill="#c0392b">✓ 更新下界 LB=14</text>
  <!-- left subtree edges -->
  <line x1="170" y1="230" x2="120" y2="300" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="170" y1="230" x2="240" y2="300" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#999">继续分支（分数解）</text>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#999">继续分支</text>
  <!-- right child: pruned -->
  <rect x="380" y="170" width="190" height="60" rx="8" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="475" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">分支：x₁ ≥ 2</text>
  <text x="475" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c0392b">UB = 12.0 ≤ LB</text>
  <text x="430" y="160" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">✂ 剪枝（整棵放弃）</text>
  <!-- legend -->
  <line x1="60" y1="370" x2="110" y2="370" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="120" y="375" font-family="sans-serif" font-size="13" fill="#333">尚未探索的潜在分支</text>
</svg>
