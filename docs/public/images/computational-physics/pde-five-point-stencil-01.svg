<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>二维拉普拉斯算子的五点差分模板</title>
  <desc>均匀网格上，中心点的二阶导数值由上下左右四个邻居的值与中心值自身线性组合近似，模板模式为邻居之和减四倍中心。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- 网格背景点 -->
  <g fill="#b8b2a4">
    <circle cx="100" cy="80" r="4"/><circle cx="190" cy="80" r="4"/><circle cx="370" cy="80" r="4"/><circle cx="460" cy="80" r="4"/>
    <circle cx="100" cy="170" r="4"/><circle cx="460" cy="170" r="4"/>
    <circle cx="100" cy="260" r="4"/><circle cx="190" cy="260" r="4"/><circle cx="370" cy="260" r="4"/><circle cx="460" cy="260" r="4"/>
    <circle cx="100" cy="350" r="4"/><circle cx="190" cy="350" r="4"/><circle cx="280" cy="350" r="4"/><circle cx="370" cy="350" r="4"/><circle cx="460" cy="350" r="4"/>
  </g>
  <!-- 邻居到中心的箭头 -->
  <line x1="280" y1="90" x2="280" y2="140" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="280" y1="250" x2="280" y2="200" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="200" y1="170" x2="250" y2="170" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="360" y1="170" x2="310" y2="170" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <!-- 中心与四个邻居 -->
  <circle cx="280" cy="80" r="7" fill="#1f6f8b"/>
  <circle cx="280" cy="260" r="7" fill="#1f6f8b"/>
  <circle cx="190" cy="170" r="7" fill="#1f6f8b"/>
  <circle cx="370" cy="170" r="7" fill="#1f6f8b"/>
  <circle cx="280" cy="170" r="9" fill="#c0392b"/>
  <!-- 标签 -->
  <text x="280" y="66" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">u(i, j+1)</text>
  <text x="280" y="285" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">u(i, j−1)</text>
  <text x="168" y="175" font-family="sans-serif" font-size="14" text-anchor="end" fill="#333">u(i−1, j)</text>
  <text x="392" y="175" font-family="sans-serif" font-size="14" text-anchor="start" fill="#333">u(i+1, j)</text>
  <text x="280" y="195" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#c0392b">u(i, j)</text>
  <!-- 公式 -->
  <text x="320" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333">∇²u ≈ [ u(i+1,j) + u(i−1,j) + u(i,j+1) + u(i,j−1) − 4u(i,j) ] / h²</text>
  <text x="320" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1f6f8b">邻居之和 − 四倍中心，再除以网格面积 h²</text>
</svg>
