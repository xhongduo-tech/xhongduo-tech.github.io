<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>辛普森法则与梯形法则的几何对比</title>
  <desc>同一条曲线在区间 [1,3] 上，直线（梯形法则）与过三节点的抛物线（辛普森法则）对真实曲线的贴合程度对比，抛物线与直线之间的红色阴影区域是辛普森法则多捕捉到的面积。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- 坐标轴 -->
  <line x1="80" y1="340" x2="610" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="340" stroke="#333" stroke-width="1.5"/>
  <!-- 轴刻度与标签 -->
  <line x1="250" y1="340" x2="250" y2="345" stroke="#333" stroke-width="1"/>
  <line x1="420" y1="340" x2="420" y2="345" stroke="#333" stroke-width="1"/>
  <line x1="590" y1="340" x2="590" y2="345" stroke="#333" stroke-width="1"/>
  <text x="250" y="362" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">x₁</text>
  <text x="420" y="362" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">x₂</text>
  <text x="590" y="362" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">x₃</text>
  <text x="82" y="56" font-family="sans-serif" font-size="14" fill="#333">f(x)</text>
  <!-- 真实曲线 f(x)=1.2+0.6 sin(x)，青色实线 -->
  <polyline fill="none" stroke="#1f6f8b" stroke-width="2.5"
    points="80,200 165,149.7 250,111.6 335,95.3 420,104.5 505,137.2 590,185.2"/>
  <!-- 梯形法则：过 (x1,y1)、(x3,y3) 的直线，灰色虚线 -->
  <line x1="250" y1="111.6" x2="590" y2="185.2" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- 辛普森法则：过三个节点的抛物线，红色实线 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="250,111.6 292.5,101.6 335,97.1 377.5,98.1 420,104.5 462.5,116.5 505,133.9 547.5,156.8 590,185.2"/>
  <!-- 抛物线与直线之间的区域（辛普森多捕捉到的面积），淡红填充 -->
  <polygon fill="#c0392b" opacity="0.18"
    points="250,111.6 292.5,101.6 335,97.1 377.5,98.1 420,104.5 462.5,116.5 505,133.9 547.5,156.8 590,185.2 250,111.6"/>
  <!-- 三个采样节点 -->
  <circle cx="250" cy="111.6" r="5" fill="#c0392b"/>
  <circle cx="420" cy="104.5" r="5" fill="#c0392b"/>
  <circle cx="590" cy="185.2" r="5" fill="#c0392b"/>
  <text x="420" y="92" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">采样点</text>
  <!-- 图例 -->
  <line x1="120" y1="85" x2="180" y2="85" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="190" y="90" font-family="sans-serif" font-size="14" fill="#333">真实曲线 f(x)</text>
  <line x1="120" y1="112" x2="180" y2="112" stroke="#c0392b" stroke-width="2.5"/>
  <text x="190" y="117" font-family="sans-serif" font-size="14" fill="#333">抛物线（辛普森）</text>
  <line x1="120" y1="139" x2="180" y2="139" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="190" y="144" font-family="sans-serif" font-size="14" fill="#333">直线（梯形）</text>
  <rect x="118" y="73" width="290" height="86" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <!-- 说明文字 -->
  <text x="330" y="200" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#c0392b">红色阴影 = 辛普森多捕捉到的面积</text>
  <text x="330" y="222" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333">真实曲线居中隆起，直线下凹，抛物线贴着隆起走</text>
  <text x="330" y="242" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333">这正是辛普森法则误差 O(h⁴) 的几何来源</text>
</svg>
