<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>FFT 蝶形合并单元</title>
  <desc>两个半规模变换的结果 E_k 与 O_k 作为输入，O_k 先乘以扭转因子 ω^k，再分别以加号与减号合并，一次输出 X_k 与 X_{k+N/2}。</desc>
  <rect width="640" height="400" fill="#faf9f5"/>
  <!-- 输入节点 -->
  <circle cx="150" cy="140" r="8" fill="#1f6f8b"/>
  <circle cx="150" cy="300" r="8" fill="#1f6f8b"/>
  <text x="150" y="120" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">E_k（偶数项 DFT）</text>
  <text x="150" y="330" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">O_k（奇数项 DFT）</text>
  <!-- 扭转因子节点 -->
  <circle cx="300" cy="300" r="9" fill="#c0392b"/>
  <text x="300" y="338" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#c0392b">× ω^k</text>
  <!-- 连线 -->
  <line x1="158" y1="140" x2="518" y2="120" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="158" y1="140" x2="518" y2="320" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="158" y1="300" x2="291" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="309" y1="296" x2="518" y2="122" stroke="#c0392b" stroke-width="2"/>
  <line x1="309" y1="304" x2="518" y2="318" stroke="#c0392b" stroke-width="2"/>
  <!-- 加减号 -->
  <text x="508" y="112" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6f8b">+</text>
  <text x="508" y="312" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6f8b">+</text>
  <text x="500" y="322" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">−</text>
  <!-- 输出节点 -->
  <circle cx="530" cy="120" r="8" fill="#1f6f8b"/>
  <circle cx="530" cy="320" r="8" fill="#1f6f8b"/>
  <text x="600" y="124" font-family="sans-serif" font-size="15" text-anchor="start" fill="#333">X_k</text>
  <text x="600" y="324" font-family="sans-serif" font-size="15" text-anchor="start" fill="#333">X_{k+N/2}</text>
  <!-- 公式 -->
  <text x="320" y="80" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333">一个蝶形 = 两个半规模变换合并，输出一对相邻频率</text>
  <line x1="200" y1="92" x2="440" y2="92" stroke="#b8b2a4" stroke-width="1"/>
  <text x="320" y="230" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">X_k       = E_k + ω^k O_k</text>
  <text x="320" y="262" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333">X_{k+N/2} = E_k − ω^k O_k</text>
  <text x="320" y="390" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1f6f8b">利用 ω^{N/2} = −1，后半段不用重算：每层 N/2 个蝶形，共 log₂N 层</text>
</svg>
