<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <title>投入产出表的基本结构</title>
  <desc>一张三部门投入产出表：左上是部门间的中间交易矩阵，右上是最终需求，左下方是增加值，末行与末列是总投入与总产出。</desc>
  <rect width="640" height="430" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333">投入产出表的基本结构（三部门示例）</text>

  <g stroke="#999" fill="none">
    <rect x="120" y="60" width="480" height="340"/>
  </g>

  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="140" y="82">投入↓ 产出→</text>
    <text x="200" y="82">农业</text>
    <text x="280" y="82">工业</text>
    <text x="360" y="82">服务业</text>
    <text x="450" y="82">最终需求</text>
    <text x="550" y="82">总产出</text>
  </g>

  <g fill="#eaf3f7" stroke="#c8dce8">
    <rect x="160" y="100" width="240" height="180"/>
  </g>
  <g fill="none" stroke="#c8dce8">
    <line x1="240" y1="100" x2="240" y2="280"/>
    <line x1="320" y1="100" x2="320" y2="280"/>
    <line x1="160" y1="160" x2="400" y2="160"/>
    <line x1="160" y1="220" x2="400" y2="220"/>
  </g>

  <g fill="#fdf0ee" stroke="#e8d0cc">
    <rect x="400" y="100" width="200" height="180"/>
  </g>
  <g fill="none" stroke="#e8d0cc">
    <line x1="500" y1="100" x2="500" y2="280"/>
    <line x1="400" y1="160" x2="600" y2="160"/>
    <line x1="400" y1="220" x2="600" y2="220"/>
  </g>

  <g fill="#fdf0ee" stroke="#e8d0cc">
    <rect x="160" y="280" width="240" height="60"/>
  </g>
  <g fill="none" stroke="#e8d0cc">
    <line x1="240" y1="280" x2="240" y2="340"/>
    <line x1="320" y1="280" x2="320" y2="340"/>
  </g>

  <g fill="#eaf3f7" stroke="#c8dce8">
    <rect x="400" y="280" width="200" height="60"/>
  </g>
  <g fill="none" stroke="#c8dce8">
    <line x1="500" y1="280" x2="500" y2="340"/>
  </g>

  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="140" y="130">农业</text>
    <text x="140" y="190">工业</text>
    <text x="140" y="250">服务业</text>
    <text x="140" y="315">增加值</text>
    <text x="140" y="370">总投入</text>
  </g>

  <g font-size="13" fill="#1f6f8b" text-anchor="middle">
    <text x="200" y="130">x₁₁</text>
    <text x="280" y="130">x₁₂</text>
    <text x="360" y="130">x₁₃</text>
    <text x="200" y="190">x₂₁</text>
    <text x="280" y="190">x₂₂</text>
    <text x="360" y="190">x₂₃</text>
    <text x="200" y="250">x₃₁</text>
    <text x="280" y="250">x₃₂</text>
    <text x="360" y="250">x₃₃</text>
  </g>

  <g font-size="13" fill="#c0392b" text-anchor="middle">
    <text x="450" y="130">Y₁</text>
    <text x="450" y="190">Y₂</text>
    <text x="450" y="250">Y₃</text>
    <text x="550" y="130">X₁</text>
    <text x="550" y="190">X₂</text>
    <text x="550" y="250">X₃</text>
    <text x="200" y="315">v₁</text>
    <text x="280" y="315">v₂</text>
    <text x="360" y="315">v₃</text>
    <text x="550" y="315">Σ</text>
  </g>

  <g font-size="13" fill="#666">
    <text x="160" y="380">中间交易区：部门之间互相买卖</text>
    <text x="400" y="380" fill="#c0392b">最终需求与总产出</text>
    <text x="160" y="400">增加值：劳动报酬、资本折旧、利润</text>
    <text x="400" y="400" fill="#c0392b">行合计=列合计：总产出=总投入</text>
  </g>
</svg>
