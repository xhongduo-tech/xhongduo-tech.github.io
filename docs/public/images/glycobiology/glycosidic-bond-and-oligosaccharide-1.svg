<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif">
  <title>糖苷键的形成：两个葡萄糖脱水缩合</title>
  <desc>左侧为两个单糖，其 C1 与 C4 上的羟基以红色标出；中间箭头表示脱去一分子水；右侧为缩合生成的二糖，红色桥线为糖苷键 α(1→4)。</desc>
  <rect width="760" height="340" fill="#faf9f5" />

  <!-- 反应物标注 -->
  <text x="80" y="45" font-size="16" fill="#333" font-weight="bold">反应物：两个单糖</text>

  <!-- 供体糖（左） -->
  <g>
    <polygon points="120,120 163.3,145 163.3,195 120,220 76.7,195 76.7,145" fill="none" stroke="#333" stroke-width="2.5"/>
    <text x="95" y="178" font-size="15" fill="#333">Glc</text>
    <text x="113" y="112" font-size="14" fill="#1f6f8b">O</text>
    <text x="166" y="138" font-size="13" fill="#c0392b">C1–OH</text>
  </g>

  <!-- 受体糖（右） -->
  <g>
    <polygon points="250,120 293.3,145 293.3,195 250,220 206.7,195 206.7,145" fill="none" stroke="#333" stroke-width="2.5"/>
    <text x="225" y="178" font-size="15" fill="#333">Glc</text>
    <text x="243" y="112" font-size="14" fill="#1f6f8b">O</text>
    <text x="170" y="222" font-size="13" fill="#c0392b">C4–OH</text>
  </g>

  <!-- 箭头与脱水 -->
  <line x1="325" y1="170" x2="425" y2="170" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <text x="340" y="150" font-size="16" fill="#c0392b" font-weight="bold">− H2O</text>

  <!-- 产物标注 -->
  <text x="510" y="45" font-size="16" fill="#333" font-weight="bold">产物：二糖（糖苷键）</text>

  <!-- 产物供体糖 -->
  <polygon points="500,120 543.3,145 543.3,195 500,220 456.7,195 456.7,145" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="475" y="178" font-size="15" fill="#333">Glc</text>
  <text x="493" y="112" font-size="14" fill="#1f6f8b">O</text>

  <!-- 产物受体糖 -->
  <polygon points="590,120 633.3,145 633.3,195 590,220 546.7,195 546.7,145" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="565" y="178" font-size="15" fill="#333">Glc</text>
  <text x="583" y="112" font-size="14" fill="#1f6f8b">O</text>

  <!-- 糖苷键桥 -->
  <line x1="543.3" y1="145" x2="546.7" y2="195" stroke="#c0392b" stroke-width="4"/>
  <text x="556" y="150" font-size="15" fill="#c0392b" font-weight="bold">C1–O–C4</text>
  <text x="470" y="262" font-size="14" fill="#1f6f8b">α(1→4) 糖苷键：异头碳 C1 与受体 C4 相连</text>
  <text x="470" y="284" font-size="14" fill="#333">α/β 构型在成键瞬间被锁定，之后不再变旋</text>
</svg>
