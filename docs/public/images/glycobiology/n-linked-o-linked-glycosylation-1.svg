<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="sans-serif">
  <title>N-连接糖基化：多萜醇预装配与整体转移</title>
  <desc>内质网膜上嵌有多萜醇脂载体，其顶端预先装配了完整寡糖 Glc3Man9GlcNAc2；寡糖转移酶将该完整寡糖整体转移到新生肽链的天冬酰胺（sequon）上；随后葡萄糖苷酶切去葡萄糖，聚糖进入高尔基体被加工为复杂型。</desc>
  <rect width="760" height="370" fill="#faf9f5" />

  <text x="40" y="40" font-size="18" fill="#333" font-weight="bold">N-连接糖基化：预装配 → 整体转移 → 修剪加工</text>

  <!-- 新生肽链 -->
  <polyline points="20,95 120,105 220,100 330,112 440,100 560,108 740,96" fill="none" stroke="#333" stroke-width="3"/>
  <text x="350" y="70" font-size="15" fill="#333">新生肽链</text>

  <!-- sequon -->
  <rect x="208" y="88" width="72" height="24" fill="#c0392b" opacity="0.15"/>
  <text x="214" y="105" font-size="14" fill="#c0392b">Asn-X-S/T</text>

  <!-- ER 膜 -->
  <rect x="30" y="215" width="360" height="30" fill="#dce8ef" stroke="#1f6f8b" stroke-width="2"/>
  <text x="45" y="265" font-size="14" fill="#1f6f8b">内质网（ER）膜</text>

  <!-- 多萜醇 -->
  <polyline points="70,295 80,255 60,240 80,222 62,206" fill="none" stroke="#1f6f8b" stroke-width="3"/>
  <text x="88" y="285" font-size="14" fill="#1f6f8b">多萜醇</text>

  <!-- 前体寡糖 -->
  <circle cx="64" cy="192" r="26" fill="#fff3e0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="24" y="196" font-size="14" fill="#c0392b" font-weight="bold">Glc3Man9</text>
  <text x="30" y="214" font-size="14" fill="#c0392b" font-weight="bold">GlcNAc2</text>

  <!-- 转移箭头与 OST -->
  <circle cx="160" cy="160" r="34" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="138" y="156" font-size="13" fill="#333" text-anchor="middle">寡糖转</text>
  <text x="138" y="174" font-size="13" fill="#333" text-anchor="middle">移酶</text>
  <line x1="92" y1="178" x2="126" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="194" y1="148" x2="238" y2="100" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 修剪 -->
  <circle cx="330" cy="100" r="14" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <text x="330" y="104" font-size="13" fill="#1f6f8b" text-anchor="middle">Glc</text>
  <line x1="344" y1="100" x2="360" y2="100" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="150" font-size="14" fill="#1f6f8b">葡萄糖苷酶 I/II 逐一切除 Glc</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 高尔基体 -->
  <rect x="440" y="215" width="290" height="30" fill="#efe6d8" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="265" font-size="14" fill="#c0392b">高尔基体：继续加工</text>

  <!-- 复杂型 N-聚糖 -->
  <g>
    <line x1="590" y1="200" x2="590" y2="185" stroke="#333" stroke-width="3"/>
    <line x1="590" y1="185" x2="540" y2="160" stroke="#333" stroke-width="3"/>
    <line x1="590" y1="185" x2="640" y2="160" stroke="#333" stroke-width="3"/>
    <circle cx="540" cy="150" r="14" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="640" cy="150" r="14" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="518" y="118" font-size="13" fill="#1f6f8b">α1-3 臂</text>
    <text x="618" y="118" font-size="13" fill="#1f6f8b">α1-6 臂</text>
    <text x="538" y="222" font-size="14" fill="#333">复杂型 N-聚糖（示意）</text>
  </g>
</svg>
