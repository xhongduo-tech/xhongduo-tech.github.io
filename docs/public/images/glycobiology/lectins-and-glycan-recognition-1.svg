<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif">
  <title>凝集素的多价结合</title>
  <desc>左侧为单价结合：一个凝集素只用一个识别域结合一个糖，结合弱；右侧为多价结合：三聚凝集素同时结合三个糖，亲合力被放大数个数级。</desc>
  <rect width="760" height="330" fill="#faf9f5" />

  <text x="40" y="42" font-size="18" fill="#333" font-weight="bold">多价性：把弱结合变成强黏附</text>

  <!-- 左侧：单价 -->
  <text x="110" y="80" font-size="16" fill="#333">单价：一个识别域，弱结合</text>
  <line x1="50" y1="270" x2="360" y2="270" stroke="#1f6f8b" stroke-width="4"/>
  <text x="100" y="262" font-size="13" fill="#1f6f8b">细胞膜</text>
  <circle cx="190" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="150" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="230" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="139" y="274" font-size="13" fill="#c0392b">糖</text>
  <circle cx="190" cy="160" r="34" fill="#e8f0f5" stroke="#333" stroke-width="2.5"/>
  <text x="166" y="164" font-size="13" fill="#333">凝集素</text>
  <line x1="190" y1="194" x2="190" y2="258" stroke="#333" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="202" y="222" font-size="14" fill="#333">1 条键</text>
  <text x="150" y="305" font-size="14" fill="#c0392b" font-weight="bold">Kd ≈ 10⁻³ M（弱）</text>

  <!-- 右侧：多价 -->
  <text x="450" y="80" font-size="16" fill="#333">多价：三聚凝集素，强结合</text>
  <line x1="400" y1="270" x2="720" y2="270" stroke="#1f6f8b" stroke-width="4"/>
  <text x="450" y="262" font-size="13" fill="#1f6f8b">细胞膜</text>
  <circle cx="490" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="560" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="630" cy="270" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="439" y="274" font-size="13" fill="#c0392b">糖</text>

  <rect x="460" y="120" width="200" height="52" rx="10" fill="#e8f0f5" stroke="#333" stroke-width="2.5"/>
  <text x="495" y="142" font-size="14" fill="#333">凝集素三聚体</text>
  <text x="500" y="160" font-size="13" fill="#333">3 个识别域</text>
  <line x1="490" y1="172" x2="490" y2="258" stroke="#333" stroke-width="3"/>
  <line x1="560" y1="172" x2="560" y2="258" stroke="#333" stroke-width="3"/>
  <line x1="630" y1="172" x2="630" y2="258" stroke="#333" stroke-width="3"/>
  <text x="520" y="305" font-size="14" fill="#1f6f8b" font-weight="bold">亲合力 ≈ 10⁻⁹ M（强）</text>
  <text x="472" y="228" font-size="13" fill="#333">3 条键协同</text>
</svg>
