  <text x="470" y="270" text-anchor="middle" fill="#333" font-size="14">φ ≈ 45°</text>
  <text x="560" y="120" text-anchor="middle" fill="#1f6f8b" font-size="15" font-weight="bold">磁场线（帕克螺旋）</text>
  <text x="660" y="470" text-anchor="middle" fill="#333" font-size="14">快风（冕洞）</text>
  <text x="120" y="420" text-anchor="middle" fill="#333" font-size="14">慢风（流带）</text>
</svg>
