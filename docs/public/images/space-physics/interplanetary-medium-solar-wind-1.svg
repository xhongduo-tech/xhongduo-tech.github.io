<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -70 720 700" font-family="sans-serif">
  <title>帕克螺旋：太阳风把磁场拖成阿基米德螺旋</title>
  <desc>太阳自转与太阳风径向流动的共同作用，把冻结在等离子体里的磁场线拖成螺旋；1 AU 处磁场方向与径向夹角约 45 度。</desc>
  <rect x="60" y="-70" width="720" height="700" fill="#faf9f5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <circle cx="390" cy="260" r="42" fill="#c0392b" opacity="0.85"/>
  <text x="390" y="255" text-anchor="middle" fill="#faf9f5" font-size="16" font-weight="bold">太阳</text>
  <text x="390" y="275" text-anchor="middle" fill="#faf9f5" font-size="13">自转 Ω</text>
