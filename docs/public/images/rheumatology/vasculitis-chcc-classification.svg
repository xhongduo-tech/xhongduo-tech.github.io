<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="sans-serif">
  <title>血管炎按受累血管大小分类（2012 教堂山共识 CHCC）</title>
  <desc>展示大血管、中血管、小血管三类血管炎的代表疾病，以及受累血管大小与临床线索的关系</desc>
  <rect width="800" height="470" fill="#faf9f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">血管炎按受累血管大小分类（2012 教堂山共识）</text>

  <!-- 大血管列 -->
  <rect x="60" y="70" width="210" height="170" fill="#fff" stroke="#1f6f8b" stroke-width="2" rx="10"/>
  <text x="165" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">大血管</text>
  <rect x="80" y="112" width="170" height="38" fill="#1f6f8b" opacity="0.22" rx="9"/>
  <rect x="80" y="121" width="170" height="20" fill="#1f6f8b" opacity="0.6" rx="6"/>
  <text x="165" y="136" text-anchor="middle" font-size="13" fill="#333">主动脉及其主要分支</text>
  <text x="165" y="182" text-anchor="middle" font-size="14" fill="#333">巨细胞动脉炎（GCA）</text>
  <text x="165" y="206" text-anchor="middle" font-size="14" fill="#333">大动脉炎（TAK）</text>
  <text x="165" y="228" text-anchor="middle" font-size="13" fill="#666">主动脉瘤、无脉、肢体跛行</text>

  <!-- 中血管列 -->
  <rect x="295" y="70" width="210" height="170" fill="#fff" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="400" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">中血管</text>
  <rect x="330" y="112" width="140" height="32" fill="#c0392b" opacity="0.22" rx="8"/>
  <rect x="330" y="119" width="140" height="18" fill="#c0392b" opacity="0.6" rx="5"/>
  <text x="400" y="136" text-anchor="middle" font-size="13" fill="#333">内脏主要动脉及其分支</text>
  <text x="400" y="182" text-anchor="middle" font-size="14" fill="#333">结节性多动脉炎（PAN）</text>
  <text x="400" y="206" text-anchor="middle" font-size="14" fill="#333">川崎病（KD）</text>
  <text x="400" y="228" text-anchor="middle" font-size="13" fill="#666">微动脉瘤、多发性单神经炎</text>

  <!-- 小血管列 -->
  <rect x="530" y="70" width="210" height="280" fill="#fff" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="635" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">小血管</text>
  <path d="M 560 130 Q 572 116 592 124 Q 610 132 630 122 M 592 124 Q 602 140 620 134 M 620 134 Q 632 148 650 140 M 650 140 Q 668 150 680 138 M 590 124 Q 586 108 570 112" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="635" y="170" text-anchor="middle" font-size="13" fill="#333">微动脉 / 毛细血管 / 微静脉</text>
  <text x="635" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">ANCA 相关</text>
  <text x="635" y="222" text-anchor="middle" font-size="13" fill="#333">肉芽肿性多血管炎（GPA）</text>
  <text x="635" y="242" text-anchor="middle" font-size="13" fill="#333">镜下多血管炎（MPA）</text>
  <text x="635" y="262" text-anchor="middle" font-size="13" fill="#333">嗜酸性肉芽肿性多血管炎（EGPA）</text>
  <text x="635" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">免疫复合物性</text>
  <text x="635" y="316" text-anchor="middle" font-size="13" fill="#333">IgA 血管炎（过敏性紫癜）</text>
  <text x="635" y="336" text-anchor="middle" font-size="13" fill="#333">冷球蛋白血症性血管炎</text>

  <text x="400" y="386" text-anchor="middle" font-size="13" fill="#666">血管受累常同时跨多个级别；肾脏受累多提示小血管，主动脉瘤与肢体跛行提示大血管</text>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#666">ANCA 相关血管炎 ③ 类之间高度重叠，共享同一治疗方案</text>
</svg>
