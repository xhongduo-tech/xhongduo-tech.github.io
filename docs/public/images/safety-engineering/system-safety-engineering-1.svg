<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="sans-serif">
  <title>系统安全工程基本程序闭环</title>
  <desc>危险源辨识、风险评价、风险控制、监测与反馈四个环节构成顺时针闭环，贯穿系统全生命周期。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <rect width="600" height="420" fill="#faf9f5"/>
  <text x="300" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">贯穿系统全生命周期</text>
  <text x="300" y="228" text-anchor="middle" font-size="13" fill="#333">概念 → 设计 → 制造 → 运行 → 退役</text>
  <g fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="410" y1="80" x2="498" y2="175"/>
    <line x1="505" y1="240" x2="414" y2="333"/>
    <line x1="190" y1="340" x2="182" y2="214"/>
    <line x1="95" y1="180" x2="185" y2="86"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="190" y="50" width="220" height="60" rx="10" fill="#1f6f8b"/>
    <text x="300" y="86">① 危险源辨识</text>
    <rect x="420" y="180" width="170" height="60" rx="10" fill="#1f6f8b"/>
    <text x="505" y="216">② 风险评价</text>
    <rect x="190" y="310" width="220" height="60" rx="10" fill="#c0392b"/>
    <text x="300" y="346">③ 风险控制</text>
    <rect x="10" y="180" width="170" height="60" rx="10" fill="#c0392b"/>
    <text x="95" y="216">④ 监测与反馈</text>
  </g>
</svg>
