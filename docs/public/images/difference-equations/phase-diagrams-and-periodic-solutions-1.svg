<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
<title>二维线性差分系统的四类相图</title>
<desc>四象限分别展示稳定结点、鞍点、稳定焦点与中心四类平面线性系统的轨迹形态，圆心处为平衡点。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
  </marker>
</defs>

<rect x="20" y="20" width="250" height="130" fill="#faf9f5" stroke="#ccc"/>
<text x="145" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">稳定结点（实特征根 &lt; 1）</text>
<line x1="50" y1="48" x2="133" y2="80" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240" y1="48" x2="157" y2="80" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="50" y1="122" x2="133" y2="90" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240" y1="122" x2="157" y2="90" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="50" y1="85" x2="137" y2="85" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="145" y1="48" x2="145" y2="78" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="145" cy="85" r="3.5" fill="#333"/>

<rect x="290" y="20" width="250" height="130" fill="#faf9f5" stroke="#ccc"/>
<text x="415" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">鞍点（一正一负实特征根）</text>
<line x1="340" y1="85" x2="407" y2="85" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="85" x2="423" y2="85" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415" y1="48" x2="415" y2="78" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415" y1="122" x2="415" y2="92" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="415" cy="85" r="3.5" fill="#333"/>

<rect x="20" y="170" width="250" height="130" fill="#faf9f5" stroke="#ccc"/>
<text x="145" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">稳定焦点（共轭复根 &lt; 1）</text>
<polyline points="205,235 148,180 98,235 146,278 184,235 148,202 118,235 146,258 164,235 148,222 138,235 146,242" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="85,235 142,290 192,235 144,192 106,235 142,212 172,235 144,258 126,235 142,248 152,235 144,228" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="145" cy="235" r="3.5" fill="#333"/>

<rect x="290" y="170" width="250" height="130" fill="#faf9f5" stroke="#ccc"/>
<text x="415" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333" font-weight="bold">中心（纯虚特征根，模 = 1）</text>
<ellipse cx="415" cy="235" rx="52" ry="24" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<ellipse cx="415" cy="235" rx="26" ry="12" fill="none" stroke="#1f6f8b" stroke-width="1.5"/>
<path d="M 467 235 A 52 24 0 0 1 455 207" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="415" cy="235" r="3.5" fill="#333"/>
</svg>
