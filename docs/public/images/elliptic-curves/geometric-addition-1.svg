<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif">
  <title>椭圆曲线上的弦与切线加法</title>
  <desc>在椭圆曲线 y^2=x^3-x 上，过 P、Q 作弦，与曲线交于第三点 R，将 R 关于 x 轴反射得到 P+Q。</desc>

  <!-- 纸底 -->
  <rect x="0" y="0" width="640" height="440" fill="#faf9f5"/>

  <!-- 坐标轴 -->
  <line x1="30" y1="270" x2="630" y2="270" stroke="#999" stroke-width="1.5"/>
  <polygon points="630,270 618,265 618,275" fill="#999"/>
  <text x="622" y="290" font-size="15" fill="#999">x</text>
  <line x1="330" y1="30" x2="330" y2="420" stroke="#999" stroke-width="1.5"/>
  <polygon points="330,30 325,42 335,42" fill="#999"/>
  <text x="342" y="46" font-size="15" fill="#999">y</text>

  <!-- 卵形分支 -->
  <path d="M190,270 C 195,222 224,186 249,183 C 275,180 302,194 316,215 C 326,230 329,256 330,270 C 329,284 325,310 315,326 C 300,346 275,360 249,357 C 225,354 195,318 190,270 Z"
        fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- 右支（上下两臂） -->
  <path d="M470,270 C 476,262 480,236 482,210 C 485,180 525,150 605,138"
        fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M470,270 C 476,278 480,304 482,330 C 485,360 525,390 605,402"
        fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- 弦 PQ -->
  <line x1="180" y1="156" x2="610" y2="401" stroke="#1f6f8b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="150" y="150" font-size="14" fill="#1f6f8b">弦 PQ</text>

  <!-- 反射段 -->
  <line x1="482" y1="330" x2="482" y2="210" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="492" y="276" font-size="14" fill="#c0392b">反射</text>

  <!-- 点与标签 -->
  <circle cx="235" cy="187" r="6" fill="#c0392b"/>
  <text x="214" y="178" font-size="16" fill="#333" font-weight="bold">P</text>

  <circle cx="323" cy="240" r="6" fill="#c0392b"/>
  <text x="336" y="246" font-size="16" fill="#333" font-weight="bold">Q</text>

  <circle cx="482" cy="330" r="6" fill="#1f6f8b"/>
  <text x="496" y="338" font-size="15" fill="#333">R（第三交点）</text>

  <circle cx="482" cy="210" r="6" fill="#c0392b"/>
  <text x="498" y="205" font-size="16" fill="#333" font-weight="bold">P+Q = −R</text>

  <!-- 标题 -->
  <text x="320" y="24" font-size="18" fill="#333" text-anchor="middle">椭圆曲线 y² = x³ − x 上的弦与切线加法</text>
</svg>
