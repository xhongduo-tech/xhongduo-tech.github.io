<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>三大供能系统随运动时间的变化</title>
  <desc>横轴为运动时间（0 到 120 秒），纵轴为各供能系统输出所占比例；磷酸原系统急剧衰减，糖酵解先升后降，有氧氧化缓慢攀升并最终主导。</desc>
  <rect width="640" height="360" fill="#faf9f5"/>
  <g font-family="sans-serif" font-size="14" fill="#333">
    <text x="320" y="30" text-anchor="middle" font-weight="bold">三大供能系统随运动时间的变化</text>
    <text x="60" y="70" font-size="13">供能比例</text>
    <text x="320" y="335" text-anchor="middle" font-size="13">运动时间（秒）</text>
    <line x1="80" y1="300" x2="80" y2="70" stroke="#333" stroke-width="1.5"/>
    <line x1="80" y1="300" x2="600" y2="300" stroke="#333" stroke-width="1.5"/>
    <line x1="80" y1="80" x2="76" y2="80" stroke="#333" stroke-width="1"/>
    <text x="70" y="85" text-anchor="end" font-size="13">100%</text>
    <text x="70" y="305" text-anchor="end" font-size="13">0%</text>
    <g font-size="12" fill="#666">
      <text x="80" y="320" text-anchor="middle">0</text>
      <text x="180" y="320" text-anchor="middle">10</text>
      <text x="280" y="320" text-anchor="middle">30</text>
      <text x="380" y="320" text-anchor="middle">60</text>
      <text x="480" y="320" text-anchor="middle">90</text>
      <text x="590" y="320" text-anchor="middle">120</text>
    </g>
  </g>
  <g fill="none" stroke-width="3">
    <polyline points="80,90 110,95 130,105 150,118 180,140 220,168 280,205 340,232 420,258 500,276 590,288" stroke="#c0392b"/>
    <polyline points="80,150 100,135 120,122 150,108 180,100 220,102 280,118 340,142 420,176 500,214 590,248" stroke="#1f6f8b"/>
    <polyline points="80,280 120,270 160,258 200,244 240,228 280,212 340,190 420,160 500,132 560,112 590,100" stroke="#4a7c59"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#333">
    <line x1="300" y1="232" x2="300" y2="222" stroke="#c0392b" stroke-width="2"/>
    <text x="308" y="236">磷酸原系统（ATP-CP）</text>
    <line x1="300" y1="252" x2="300" y2="242" stroke="#1f6f8b" stroke-width="2"/>
    <text x="308" y="256">糖酵解系统</text>
    <line x1="300" y1="272" x2="300" y2="262" stroke="#4a7c59" stroke-width="2"/>
    <text x="308" y="276">有氧氧化系统</text>
  </g>
</svg>
