<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<title>男女青春期生殖系统结构示意图</title>
<desc>左侧为女性内生殖系统（卵巢、输卵管、子宫、宫颈、阴道），右侧为男性内生殖系统（睾丸、附睾、输精管、精囊、前列腺、阴茎）。用于青春期生理卫生教育。示意性质，不按精确比例。</desc>
<rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>

<!-- 分区标题 -->
<text x="215" y="40" font-size="20" fill="#1f6f8b" text-anchor="middle" font-weight="bold">女性内生殖系统</text>
<text x="585" y="40" font-size="20" fill="#1f6f8b" text-anchor="middle" font-weight="bold">男性内生殖系统</text>
<line x1="400" y1="55" x2="400" y2="430" stroke="#d8d2c4" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- ===== 女性：子宫（中空的梨形）===== -->
<path d="M215 150 Q215 115 250 112 L260 112 Q295 112 295 150 L295 200 Q295 240 255 242 L255 300 L215 300 L215 242 Q175 240 175 200 Z"
      fill="#e8b4b8" stroke="#333" stroke-width="2"/>
<path d="M175 200 Q215 210 255 200" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="235" y="185" font-size="15" fill="#333" text-anchor="middle">子宫</text>

<!-- 宫颈 -->
<path d="M215 300 L255 300 L258 322 L212 322 Z" fill="#d99a9f" stroke="#333" stroke-width="2"/>
<text x="235" y="340" font-size="14" fill="#333" text-anchor="middle">宫颈</text>

<!-- 阴道 -->
<path d="M222 322 L248 322 L252 400 L218 400 Z" fill="#f0c9cb" stroke="#333" stroke-width="2"/>
<text x="235" y="425" font-size="14" fill="#333" text-anchor="middle">阴道</text>

<!-- 输卵管（两条） -->
<path d="M175 130 Q135 100 118 78" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"/>
<path d="M295 130 Q335 100 352 78" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"/>
<text x="150" y="70" font-size="14" fill="#333" text-anchor="middle">输卵管</text>
<text x="320" y="70" font-size="14" fill="#333" text-anchor="middle">输卵管</text>

<!-- 卵巢（两个椭圆） -->
<ellipse cx="112" cy="72" rx="22" ry="16" fill="#f0a9ad" stroke="#333" stroke-width="2"/>
<text x="112" y="40" font-size="14" fill="#333" text-anchor="middle">卵巢</text>
<ellipse cx="358" cy="72" rx="22" ry="16" fill="#f0a9ad" stroke="#333" stroke-width="2"/>
<text x="358" y="40" font-size="14" fill="#333" text-anchor="middle">卵巢</text>

<!-- 月经路径箭头 -->
<path d="M235 242 L235 300 L235 380" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowR)"/>
<text x="262" y="360" font-size="13" fill="#c0392b">经血排出方向</text>

<!-- ===== 男性：膀胱上界示意 ===== -->
<text x="585" y="90" font-size="14" fill="#333" text-anchor="middle">输精管</text>
<path d="M520 120 Q585 110 650 120" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"/>
<path d="M520 180 Q585 170 650 180" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"/>

<!-- 精囊（两个小椭圆） -->
<ellipse cx="640" cy="140" rx="18" ry="12" fill="#d9c6a8" stroke="#333" stroke-width="2"/>
<text x="700" y="145" font-size="13" fill="#333">精囊</text>
<line x1="660" y1="142" x2="692" y2="144" stroke="#999" stroke-width="1"/>

<!-- 前列腺 -->
<ellipse cx="585" cy="200" rx="26" ry="20" fill="#d9b8a8" stroke="#333" stroke-width="2"/>
<text x="585" y="245" font-size="13" fill="#333" text-anchor="middle">前列腺</text>

<!-- 阴茎与尿道 -->
<path d="M572 220 L598 220 L598 340 L572 340 Z" fill="#e8c0a8" stroke="#333" stroke-width="2"/>
<line x1="585" y1="220" x2="585" y2="338" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="612" y="300" font-size="13" fill="#333">尿道</text>
<text x="585" y="365" font-size="14" fill="#333" text-anchor="middle">阴茎</text>

<!-- 阴囊与睾丸 -->
<path d="M560 345 Q585 420 610 345 Z" fill="#e8c0a8" stroke="#333" stroke-width="2"/>
<text x="585" y="438" font-size="14" fill="#333" text-anchor="middle">阴囊</text>
<ellipse cx="570" cy="372" rx="16" ry="20" fill="#f0a9ad" stroke="#333" stroke-width="2"/>
<ellipse cx="600" cy="372" rx="16" ry="20" fill="#f0a9ad" stroke="#333" stroke-width="2"/>
<text x="545" y="380" font-size="13" fill="#333" text-anchor="end">睾丸</text>

<!-- 附睾示意 -->
<path d="M586 352 Q600 348 602 360" fill="none" stroke="#1f6f8b" stroke-width="2.5"/>
<text x="648" y="380" font-size="13" fill="#333">附睾</text>

<!-- 箭头标记 -->
<defs>
  <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="#c0392b"/>
  </marker>
</defs>

<!-- 底部说明 -->
<text x="400" y="456" font-size="13" fill="#666" text-anchor="middle">示意图仅供理解结构，非医疗绘图；具体结构与个体差异请以权威教材与医生指导为准</text>
</svg>
