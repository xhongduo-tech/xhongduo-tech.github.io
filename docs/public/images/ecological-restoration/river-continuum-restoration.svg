<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <title>河流连续体与恢复干预示意（纵向剖面）</title>
  <desc>从源头到河口的河流宽度渐变、三个纵向分区，以及拆除大坝、恢复蜿蜒河道、河漫滩连通、滨河植被带等典型恢复干预的位置示意。</desc>
  <rect x="0" y="0" width="800" height="460" fill="#faf9f5"/>
  <g font-family="sans-serif">

    <!-- 河流主体（从源头到河口渐宽） -->
    <polygon points="55,75 300,150 520,270 730,415 730,445 500,300 280,180 50,100" fill="#1f6f8b" opacity="0.85"/>

    <!-- 分区虚线 -->
    <line x1="380" y1="30" x2="380" y2="330" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
    <line x1="590" y1="60" x2="590" y2="395" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>

    <!-- 分区标签 -->
    <text x="205" y="42" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">上游 · 源头区</text>
    <text x="205" y="62" text-anchor="middle" font-size="13" fill="#1f6f8b">窄浅 · 粗颗粒有机质输入</text>
    <text x="485" y="120" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">中游 · 输运区</text>
    <text x="485" y="140" text-anchor="middle" font-size="13" fill="#1f6f8b">破碎 · 分解 · 生物多样性峰值</text>
    <text x="695" y="250" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">下游 · 沉积区</text>
    <text x="695" y="270" text-anchor="middle" font-size="13" fill="#1f6f8b">宽缓 · 细颗粒 · 河漫滩</text>

    <!-- 恢复干预 1：拆除大坝 -->
    <circle cx="320" cy="210" r="10" fill="#c0392b"/>
    <line x1="320" y1="210" x2="460" y2="205" stroke="#c0392b" stroke-width="1.2"/>
    <text x="465" y="209" font-size="14" fill="#c0392b" font-weight="bold">拆除大坝 / 恢复自然泄流</text>

    <!-- 恢复干预 2：恢复蜿蜒河道 -->
    <circle cx="470" cy="330" r="10" fill="#c0392b"/>
    <line x1="470" y1="330" x2="150" y2="310" stroke="#c0392b" stroke-width="1.2"/>
    <text x="145" y="305" text-anchor="end" font-size="14" fill="#c0392b" font-weight="bold">恢复蜿蜒河道</text>

    <!-- 恢复干预 3：河漫滩连通 -->
    <circle cx="610" cy="380" r="10" fill="#c0392b"/>
    <line x1="610" y1="380" x2="610" y2="415" stroke="#c0392b" stroke-width="1.2"/>
    <text x="612" y="432" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">河漫滩连通</text>

    <!-- 恢复干预 4：滨河植被带 -->
    <circle cx="705" cy="355" r="10" fill="#c0392b"/>
    <line x1="705" y1="355" x2="705" y2="330" stroke="#c0392b" stroke-width="1.2"/>
    <text x="705" y="322" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">滨河植被带与缓冲</text>

    <!-- 流向箭头 -->
    <polygon points="150,88 150,150 175,118" fill="#333" opacity="0.7"/>
    <text x="120" y="140" font-size="13" fill="#333">流向</text>

    <!-- 图注 -->
    <text x="400" y="455" text-anchor="middle" font-size="13" fill="#666">纵向连通性：拆坝打通鱼类洄游；侧向连通性：河漫滩接纳洪水脉冲</text>
  </g>
</svg>
