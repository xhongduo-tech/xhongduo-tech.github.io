name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 站点已达 ~3.2 万页，渲染峰值内存超过 runner 物理内存；
      # 默认 4G swap 不够会导致 runner 被 OOM 杀死（日志表现为 "The operation was canceled"）。
      # 先清理预装 SDK 腾出 ~25G 磁盘，再扩容 swap 到 20G、堆上限 12G，用时间换内存。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          sudo docker image prune -af || true
          df -h /

      - name: Expand swap to 20G
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=60
          free -h

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run docs:build

      - name: Publish dist to main (GitHub Pages legacy source)
        run: |
          cd docs/.vitepress/dist
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/xhongduo-tech/xhongduo-tech.github.io.git"
          git push --force origin main
